进一步观照内外的究竟色法、内外的究竟名法、内外的究竟名色法以及分辨内外的究竟名色法没有人、我、众生，并且观照名色法的因，通过修行缘起法以透视因果关系：过去世的五种因造成现在世的五蕴，现在世的五种因造成未来世的五蕴等等。从《长部》的《大因缘经》中，我们可以得知阿难尊者精通于观照缘起法。观照缘起法之后，他观照名色法及其因为无常、苦、无我。在那个雨季安居中，阿难尊者就是如此精进地修行止禅与观禅。"],[25,468,749,1,"有一位著名比丘关于“缘起”的说法：“不要去观察过去未来三世，只要观察前一个刹那、中一个刹那和后一个刹那，这是准确的缘起，观察过去生和未来世是错误的缘起。”其实这是他自己的观点，因为他没有定力观察到过去、现在、未来。依《义注》的解释：观察缘起，必须观察过去世的五因对现在世的五果，即五蕴的生起，以及现在世的五因对未来世的五果。必须如此来观察才是正确的修缘起的方法。在《身至念经》中佛陀教导说，如果有系统地修行身至念处，禅修者可以证得五种世间神通及出世间的四道四果。要证得神通必须先以十四种方式来精通十种遍禅与八定，因此这些修行法也都包括在身至念业处中。"],[25,749,840,1,"2. 阿难尊者证悟入流果当阿难尊者证悟圣果的观智将要成熟时，他得以听闻富楼那尊者（Puṇṇ a Mantāniputta 满慈子）说一部简短的经，那即是《相应部•蕴品相应》中的《阿难经》。在那部经中，Puṇṇ a 尊者以镜子为譬喻来说法。譬如有人站在镜子前面，他可以清楚地在镜子里看见自己的影像。那个影像是谁呢？我们能否说那个影像就是他、他的或他的自我呢？不能。为什么呢？如果那个影像真的是他，那么当镜子移动时，他也会跟着移动。然而事实上，当镜子移动时，影像只会消失，不会跟着移动，因此那个影像不是他、他的等等。只是因为有身体与镜子的缘故，所以才有影像暂时出现。同样地，五蕴只是依靠因缘和合的缘故而暂时存在，它们不是他、他的或他的自我。"],[25,840,944,1,"再举个例子，假设现在我面对着一扇玻璃门，门上显现出我的影像。如果有人用枪射击我的影像，我是否会死呢？显然不会。如果那个影像真的是我，那么我应该会死。然而我并不会因为他射击那影像而死，由此可知那个影像不是我。同样的道理，五蕴只是因缘和合而生的法，它们一生即灭，不是我、我的或我的自我，也不是你、你的或你的自我。再者，如果五蕴真是你的，五蕴应当会听从你的指挥：你要它们变美丽，它们就会变美丽；要它们变长、长高，它们就会变长、长高；要它们缩短，它们就会缩短。五蕴能如此听从你指挥吗？显然不能。五蕴不会顺从你的意愿而改变，因为它们不是你的。接着，Puṇṇ a 尊者问阿难尊者几个问题。首先他问道：“阿难，色是常的还是无常的呢？”阿难尊者回答说：“无常的，尊者。”那时，阿难尊者清楚地了知色法的无常本质。他并非不知而假称为知，因为听完那部经之后，阿难尊者就会证悟须陀洹道果，如果他当时在说谎，就不可能在听经之后证悟圣果。因此，阿难尊者是在清楚地了知色法为无常的情况下才如此回答的。接着 Puṇṇ a 尊者问说：“既然色是无常的， 那么它是乐的还是苦的呢？”"],[25,944,988,0,"阿难尊者回答说：“苦的，尊者。”由此可知阿难尊者了知色法苦的本质。Puṇṇ a 尊者又问：“既然色是无常的、苦的，那么能否说色是我、我的或我的自我呢？”阿难尊者回答说：“不能，尊者。”由此可知阿难尊者了知色法的无我本质。这些回答显示阿难尊者彻底地了知色法的无常、苦、无我三相。以同样的方式，Puṇṇ a 尊者又问了受、想、行、识这四种名蕴，阿难尊者也一一给予了相同的答案。由此可知，阿难尊者彻底地了知五蕴及它们的无常、苦、无我三相。"],[25,988,1055,1,"问完这些问题后，Puṇṇ a 尊者教导阿难尊者再度修行观禅。他如何教导呢？他说：“贤友阿难，你必须照见十一种色蕴为无常、苦、无我。哪十一种呢？过去的、现在的、未来的、内在的、外在的、粗的、细的、低劣的、优胜的、远的、近的。这十一种色蕴都是无常、苦、无我的，不是我、我的或我的自我。”阿难尊者当下就依照教导而修行，他能够清楚地照见这十一种色蕴为无常、 苦、 无我。然后Puṇṇ a 尊者以同样的方式教导十一种受蕴、想蕴、行蕴及识蕴，阿难尊者当下一一依照教导而观照。如此，他能够清楚地照见这十一种五蕴为无常、苦、无我。当 Puṇṇ a 尊者说完这部经时，阿难尊者当下证得初果须陀洹，能以须陀洹道智及果智来了知涅槃。"],[25,1055,1125,1,"在读经典时，常看到佛陀说：“诸比库，色是常的吗？”“色是无常。”“色是苦的吗？”“色是苦的”。“色是无我的吗？”“色是无我的。”如果我们今天坐在这说：“各位贤友，我们的色是无常的吗？”“色是无常。”“色是苦的吗？”“色是苦的。”“色是无我的吗？”“色是无我的。”大家也会这么回答。我们的回答与阿难尊者的回答有什么区别？阿难尊者是如实照见十一种究竟色法的无常、苦、无我后才回答的，而不是透由听闻、逻辑推理或自己认为的方式来回答。因此， 在读经典时疑惑‘为什么很多人听完就能证悟呢？’是因为圣弟子们在听闻佛陀教导如何练习相应观禅时，他们的内心就在修观，才能达成证悟，这是《义注》的观点。"],[25,1125,1190,0,"3. 证得四无碍解智的五项条件还有一个要点： 阿难尊者证悟须陀洹果的同时也获得四无碍解智。四无碍解智在证悟初果时就可以同时生起， 当然也有一些圣者在阿拉汉道智时才生起四无碍解智。四无碍解智是在佛陀灭度后第一个千年内弟子可以证悟的，我们这个时代的弟子没有能力证悟四无碍解智。要证悟四无碍解智的人必须具备五项条件：⑴ 证悟：他必须在现在佛的教化期中证得某一种圣果（初果、二果、三果、四果都可以）。⑵ 精通教理：他必须曾在过去佛的教化期中学习过经、律、论三藏。"],[25,1190,1358,0,"⑶ 他必须曾在过去佛的教化期中研究注疏与讨论疑难之处，藉此清楚地了知三藏。在此特别地强调：他必须在过去佛时代，研究过经、律、论的注释与讨论疑难之处。这里我们特别要小心，比如现在有一些观点，甚至是一些有名望的学者说：“《义注》《复注》，都是后人对佛经的注解，带有自己的观点，不足以作为参考。”他们认为要自己去学习经藏，自己去理解。从证得四无碍解智的条件来看，必须要研究注释。为何这么说？因为证悟四无碍解智必须在佛陀灭度后一千年之内，随着佛陀教法时期越来越延长，可证悟的程度会越来越低；第二千年的人可以证悟六神通，不可能证悟四无碍解智；现在是第三千年，只能证得三明阿拉汉，连六神通都证不到。也就是说，离佛陀灭度越远的弟子，证悟的程度越低。这个时代的人对于佛陀教法的理解和证悟程度无法与佛陀时代以及接近佛陀时代的圣者、 论师们去比较。如果他们为佛陀的法所做的注疏不准确，而这个时代没有证悟的学者认为学习一下经藏、做一下比较就能更准确，这是很难让人信服的。因此，这个时代的人应真正地尊重《义注》和《复注》，才能真正地了解佛陀的教法。"],[25,1358,1478,0,"⑷ 闻法：他必须曾在过去佛的教化期中很恭敬地听闻佛法，未曾以放逸心听法，即在听法时不会有放逸心。帕奥西亚多说‘这是非常非常重要的’。如果想在未来弥勒佛座下证得四无碍解智，那么从现在开始就要非常恭敬地、以不放逸心听法。⑸ 过去的修行：他必须曾在过去佛的教化期中修行止观，达到行捨智的阶段。后四项条件就是巴拉密。阿难尊者曾经于十万大劫以前在胜莲华佛的座下修习所有这四种巴拉密。因此他并不是在最后一生（果德玛佛陀教化期）才修行，他已曾在过去佛的教化期中彻底地观照名色法及缘起法，并且观照名色法及其因为无常、苦、无我，提升观智达到行捨智的阶段。除了过去的那些巴拉密之外，在最后一世接受果德玛佛陀的教导，在三个月的雨安居期间精进地修习止观，这是他这一生累积的巴拉密。由于过去与现在的巴拉密结合的缘故，所以他在听闻Puṇṇ a 尊者说镜子的譬喻之后，就很轻易地证得须陀洹果。他在过去世积聚巴拉密、修行止观到达行捨智时也履行“往返任务”"],[25,1478,1530,0,"， 意即在他入村托钵和返回的路上都一直专注于修行止禅或观禅。这也是比库七组正知中的一部分。也就是说，阿难尊者并不只是以一种姿势修习止观——比如现在大家认为坐是最好的一种方式，而是以四种威仪来修习止观。帕奥西亚多也是要求禅修者在行住坐卧四种威仪里都能入禅，都能修观禅。阿难尊者不但曾经于过去佛的教化期中修习四威仪，在果德玛佛陀的教化期中也同样修习四威仪。他在三个月的雨安居期间精进修行，最后才证悟初果。"],[25,1530,1618,0,"证悟初果之后，他仍然一有机会就精进地修习止观，如此经历了四十四年。即从他证悟初果后一直到证悟阿拉汉间隔了四十四年。有一天，阿难尊者与佛陀住在一个森林里。白天时，阿难尊者修习缘起法，从顺缘起、逆缘起，来回地观照缘起法，他能够非常清楚地照见因果关系，并且能观照十二缘起支为无常、苦、无我。在傍晚出座时，他来见佛陀，并做禅修报告说：“佛陀啊，虽然您说的缘起法很深奥，但是对我而言，缘起法很容易。”佛陀对他说：“阿难，不要如此说。如果不能以三种遍知了知缘起，就无法解脱生死轮回。”三种遍知在前面课程讲过，不再重复。现在有人认为 “了知缘起，只要知道上一个刹那、这一个刹那、下一个刹那，能观照这三个刹那就是了知缘起。”这种观点不符合佛陀的教导， 是无法解脱生死轮回。他讲得再美妙，你听得耳朵流油都没有用。"],[25,1618,1691,0,"注释者解释《大因缘经》 （或翻译为 《因缘大经》 ） 里佛陀说 『‘如果不能以观智来了知缘起法，则无法解脱生死轮回。’这是非常重要的指导。』如果想要解脱生死轮回，就必须以观智来了知缘起。如何才能以观智了知缘起呢？首先必须培养定力，其次必须观照内外的名色法，最后才能观照缘起法。首先看到自己的色法、名法，然后再去追查名色的因，一直追到这一生来到你妈妈的怀里、结生的第一个名色，接着追查上一生的死亡心，死亡前的临死心路，看到是什么业在临终成熟，围绕这个业的无明、爱、取是什么。过去的无明、爱、取、行、业在临终时成熟，导致这一生的结生名色——识、名色、六入、触、受生起，要这样来观察。"],[25,1691,1769,1,"4. 证悟阿拉汉果尽管阿难尊者一有机会就努力修习观照十一种五蕴为无常、苦、无我，但是他未能在那四十四年中证得更高的果位。佛陀般涅槃之后，在第一次三藏圣典结集的前一天晚上，阿难尊者又勇猛精进地修习身至念处。当晚，阿难尊者精进地修行，尤其是行禅。阿难尊者的经行与我们的经行有什么差别呢？阿难尊者经行时当下观照： ⑴带动的色法 ⑵被带动的色法 ⑶造成身体动作的心。带动与被带动的色法是色蕴，造成身体动作的心包括四种名蕴，总共是五蕴。行走时他观照五蕴、五蕴的因，及观照五蕴及其因的无常、苦、无我。他整夜地、精进地如此观照。"],[25,1769,1857,0,"由于他一心想在隔天，就是第二天三藏结集开始之前证悟阿拉汉果，所以他非常精进地修行。由于精进根太强，他无法达到更高的成就。于是他放松身心，准备躺下来休息一下。在躺下时，他仍然观照着行法无常、苦、无我的本质。在四威仪当中体证阿拉汉果，阿难尊者是一个特别的例外。他不在四种威仪里， 是在站和躺卧的中间状态，他准备躺下时的那个刹那，证悟了阿拉汉果。这种姿势没有其他人用过。也就是他除了行住坐卧之外，在其余任何时刻也都在观察诸行法的无常、苦、无我，否则他不会以四威仪之外的姿势来证果。由于他将精进稍微放松，精进根与定根达到平衡，在躺下的动作中证悟了阿拉汉果。"],[25,1857,2017,1,"此时，我们要明白五根平衡，不只在修止禅时要五根平衡，在修观禅时也要五根平衡。尤其在证悟道果时，需要五根平衡、七觉支平衡，不然很难有更高的成就。即使像阿难尊者已经证悟初果后，四十四年跟随在佛陀身边，每天一有机会就修习身至念，观察自己五蕴的无常、苦、无我，已经非常熟练于佛陀教导的止观，但依然会不平衡，不平衡就不能实现新的成就。同样地，当我们在修止禅时，要观照自己是否五根平衡，是否太急于要获得什么。在修观禅时也是这样，因为观禅有很多的内容，有很多的课目。十一种究竟名色法， 讲起来很容易， 过去、现在、未来。过去是什么？一般要修（观照）过去五生。未来，如果你没有证阿拉汉，还要修未来五生。过去、未来、现在；内在、外在——观察自己内在的以及外在的；远、近——更远的是五生以外的、更近的就是当下；胜的——在天界的生命、劣的——在地狱及畜生界的生命。要不断去观照。生命界普遍有六门，六门有善和不善。善,有十七种善心（道心除外） ；不善,有十二不善心。善或不善又与不同的所缘有关，比如六门：眼、耳、鼻、舌、身、意，再去观它的无常、苦、无我，因此内容很多。"],[25,2017,2120,0,"如果你很着急，想尽快完成，其实这种观智只是走过场而已，没有什么质量。这是阿难尊者证悟阿拉汉果的故事。（二）摩诃提舍长老的故事此外，还有斯里兰卡摩诃提舍长老（Mahātissa Thera）的故事。有一天，长老在入村托钵的路上遇到一位女人。这位女人因为和丈夫吵架而离家出走， 她在路上遇到Mahātissa， 故意对着长老大声地笑，想勾引他，想：“我要让他还俗，我要嫁给他。”长老循声望去，正好看到女人的牙齿。看到牙齿之后，长老就作意“这是白骨，这是骨头，这是牙齿”，因而立即观照到女人全身的白骨。然后他转回来专注于自己的白骨为不净，很快证到初禅。从初禅出定后，他观照初禅名法为无常、苦、无我。他就在那个当下证悟了阿拉汉果。为什么他能如此快速地证果呢？因为他已曾修行白骨的业处很久时间，白骨是他的根本业处。他曾以白骨的初禅为基础定力来观照名色法及其因为无常、苦、无我已很多年，因此他的行捨智也非常成熟。所以他在路上遇到那女人时，观照任何一种行法的无常、苦、无我，都足以让他证果。"],[25,2120,2223,0,"这两位尊者在四威仪中修行的典范，我们应该学习。所有禅修者都要能够练习四威仪。如果我们还没有能力见到究竟名色法，要尽量地去觉知身体的动作。当抬脚时，以火界为主导，风界为辅助；当脚往前推时，以风界为主导，火界为辅助；当脚向下落时，以水界为主导，地界为辅助；当脚踩到地上时，以地界为主导，水界为辅助。如果我们在行走时，能有这样的观照，这就是有慧的想。虽然还没有观智，但是能这样觉知、认知，就是有慧的。这也是为未来培养成熟的观智打好基础。关于身至念——四威仪的修习方法，简单地学到这。接下来，学习身至念——正知的内容。"],[25,2223,2302,1,"二、正知在《大念处经》里，佛陀更多地教导比库们如何正知。正知共有七组内容：1.向前进与返回时的正知；2.向前看与向旁（两边）看时如何正知；3.屈伸肢体时如何正知；4.穿着袈裟等时如何正知；5.吃饭、喝水等时如何正知；6.净身时 （大小便利时） 如何正知；7.走路、站立、坐着、躺卧、入睡与醒来（即行住坐卧）、说话或沉默时如何正知。正知包含哪些内容？有四种正知：有益正知、适宜正知、行处正知与无痴正知。也有人称为“明觉”，有益明觉、适宜明觉、行处明觉与无痴明觉。"],[25,2302,2371,0,"佛陀说：“再者，诸比库，比库在前进、返回时保持正知。向前看、向旁看时保持正知。屈伸手足时保持正知。持 Saṅghāṭi（僧伽梨）、钵和衣时保持正知。饮食、饮用、咀嚼、品尝时保持正知。大小便利时保持正知。行走、站立、坐着、睡眠、醒觉、说话、沉默时保持正知。”这是七组正知的内容。（一）向前进与返回时的正知第一组是向前进与返回时的正知。在这一句里，向前进是行进，你去什么地方；返回是回转，你回家、回到寺院的意思。在所有四威仪中都有这两种情况。"],[25,2371,2541,1,"首先，在行走时，使身体向前移动称为前进；前进之后回转称为返回。站立时，将身体弯向前称为前进；将身体弯向后称为返回。坐着时， 移向座位的前面部分称为前进；移向座位的后面部分称为返回。躺卧时的解释法可以同理类推。只要移动，就有前有后，代表你的身体有动作，哪怕是你去了很远的地方。即使在座位上往前往后都应该保持正知。“比库以正知而行”意思是做任何事情时都保持正知，没有片刻与正知分离。有四种正知：1. 有益正知有益正知分成七组来看，往返的有益正知包含哪一些？“向前进是否有利益？”的意思是“我向前进是否有利益？”所有的动作只要是向前的都称为“向前进”，当生起“我向前进是否有利益？”这样的想法，思惟是否值得做之后，要了解其用处。简单而言，当“要向前”的念头一生起时，禅修者不应受到“我要这样”的念头影响而立即行动，要停下来，要观察，不要跟着习性走，不要对果报直接采取行动。而是要先思惟向前进是否有利益，然后再作决定。在这里，“利益”是指依循善法而获得提升。即我这样做，对我内心生起善法、培养善法、实践善法是否有帮助。"],[25,2541,2740,0,"《注疏》中说，可以籍着参访佛塔等来达到此目的。这次大家来大金塔参加咖提那，明天在法住禅林参加咖提那，1号去帕龙美，2 号去塔庄星，3 号到曼听佛塔寺，去参访、去随喜咖提那。或者礼敬菩提树、圣菩提树， 礼敬僧团，来寺院参加早晚功课，拜见业处老师，拜见戒律清净的尊者，乃至于可以去坟场观察死尸的不净。在这个时代不容易看到死尸，都火化了。虽然是火化，但坟场还是会给人带来一些悚惧。前段时间，一些尊者在昆明的一个废弃寺院里过雨安居，周边有几百个坟墓，在那儿修行也是很有感觉的。籍着参访、学习、随喜等，禅修者可以提升对佛法僧三宝的信心，生起喜悦。昨天咖提那大家“供养以佛陀为首的圣弟子僧团”很欢喜，这种欢喜使今天坐在禅堂时，觉得禅修状态特别好，甚至可能有人证果。籍着这些有益的寻访、参与，使内心获得提升，或依着老师的教导去修行，能令修行进步。因此参访这些地方是有利益的。我们很清楚去这样地方是有利益的。很明确，我们的行径依着善法而得到提升，这样才是有益。而不是比如‘我明天去某某地方，有人请我吃饭，心里痒痒的，口水就开始流了’，这是不是有益呢？"],[25,2740,2886,0,"可能对流口水是有益的，但对于生起善法就不一定有益。在家人要从这个角度思考：去某个地方是否有益？去酒吧是否有益？去集会是否有益？去一些情色场所是否有益？乃至参加一些洗脑课程是否有益？这些都需要思考。2. 适宜正知适宜正知，在思惟了是否有益之后，应了知是否适合。什么意思呢？比如去参加咖提那法会，由于疫情，今年的咖提不允许很多人参与。往年，尤其在泰国、缅甸、斯里兰卡，咖提那时人山人海。在这种盛会里，所有男人、女人、在家人都装扮得色彩很艳丽，经典说装扮得像偶像一样。如果在这样的人群里，可能年轻的比库会因为迷人的对象而生起贪欲，也可能遇到过去不喜欢的人而生起瞋恨，也可能看到别人的成就而生起嫉妒， 乃至于他人不经意的触碰或有意识的触碰而危害到自己清净的梵行。虽然参加咖提那是有益的，但对初修者来讲可能是不适宜的。因为它虽然有益，但是它可能会给你带来危害。这就是不适宜的。"],[25,2886,2956,0,"帕奥西亚多举例说：“虽然拜访僧团是有利益的，但是当村子里有整夜说法的集会，有很多人参加时，如果比库有可能像上述受到危害，那么他不适宜去那样的说法处。当不会有危害发生时，比库才可以去，因为那是适宜的。如果去拜会长老，长老被众多盛装装扮、涂抹香水的信徒围绕，可能也是不适合的。”因此从有益到适宜要进一步去观察。⑴ 一位年轻比库和一位沙马内拉修不净观的故事对于一位比库来讲，如果遇到了尸体，不用害怕，那将是很幸运的一件事情，可以修习不净。西亚多讲了一位年轻比库和一个沙马内拉的故事。"],[25,2956,3087,1,"一位年轻比库和一个沙马内拉出去寻找清洁牙齿用的洁齿木。沙马内拉离开道路，走到山里去寻找，结果在树丛里看到一具尸体。由于之前他已经修习不净观很长的时间，所以他就对那具尸体修观而达到初禅。然后他以初禅的定力为基础修行观禅，观照包括禅那名法在内的行法为无常、苦、无我，因而证悟前三个圣果成为阿那含。他检查了自己的证悟之后，继续禅修，以便证悟阿拉汉果。年轻比库由于看不到沙马内拉，就出声喊他。沙马内拉心里想：“自从出家以来，我就努力使自己不用让比库叫我第二声，因此我改天再来修证阿拉汉果吧。”他回答那位尊者说：“什么事，尊者？”比库说：“到这来。”沙马内拉回到比库身边，对比库说：“先这样走，然后站在我刚才站的地方，面向北方观看。”年轻比库照着沙马内拉的话去做，他也看到一具尸体，并对这具尸体修观，结果他也证得了三果阿那含。如此，一具尸体使两个人证得三果圣者。⑵ 异性的尸体不适合用来修行不净观那个时代容易修不净观，这个时代不容易见到人的尸体。在此，帕奥西亚多多次提醒：即使专注尸体修不净，只能对同性的尸体修，不能选择异性的尸体修。"],[25,3087,3167,1,"因为当你对尸体修观而定力提升时，异性的尸体并非很可厌的样子，甚至可能在内心转变成美丽的影像。这对于禅修者来讲是不恰当的。3. 行处正知在《大念处经》注疏里，行处正知主要是指专注三十八种业处。具备有益正知与适宜正知的比库在往返途中或者托钵途中，他专注三十八种业处。为什么说三十八种业处呢？这里特指止禅。在《清净道论》里止禅有四十种，然而，为什么在这里只说三十八种呢？因为注疏将光明遍与白遍合为一种，限定虚空遍与空无边处合为一种，所以是三十八种。"],[25,3164,3234,1,"注疏里在解释行处正知时只讲到止禅。若能修习观禅，也可以在往返、托钵来回的路上修习观禅。为什么注疏只以止禅来解释行处正知？因为第四种正知（无痴正知）仅针对观禅而言，所以在行处正知里只论及止禅。要明了行处正知，必须了解有四种人（有四种修习行处正知的出家人）：第一种、比库在前去托钵的路上保持专注于禅修的业处，但是在返回时没有专注于业处。第二种、 比库前去托钵时没有专注于业处， 返回时才专注于业处。第三种、比库前去与返回时都没有专注于业处。"],[25,3234,3505,1,"第四种、 比库前去与返回时都专注于业处。履行了 “往返义务”。现在对所有的禅修者是这样要求的，如果已经证得初禅，要求在行住坐卧时都能入禅。在家人要尽量这样修习，出家人更是要这样修习。对于行处正知有些人会有疑惑，因为在《大念处经》里，行处正知指的是止禅，在《清净道论》里提到“正行与行处具足”，可能有人会混淆：《清净道论》中‘行处’与《大念处经》注疏中‘行处’为什么会有差别？来看《清净道论》中的解释：所谓“正行与行处具足”，先说正行，既然有正行就有不正行。什么是不正行？由于身的违犯，语的违犯，身语的违犯，是名不正行。亦可说一切的恶戒为不正行。若比库为了生活的某种目的，以竹布施、以叶布施，或以花、果、盥洗的粉及齿木等布施，或说谄谀语，或说豆汤语， 或以抚爱（抚爱他人的孩子），或为走使传讯（为在家人走使传讯），或以种种为佛陀所唾弃的不正当的生活手段以营求其生活，都称为不正行（比库的不正行）。什么是正行？身不违犯（就是身体没有不恰当的行为，身正行），语不违犯，身语不违犯，是名正行。亦可说一切的戒律仪为正行。"],[25,3505,3593,0,"再说行处，有行处与非行处。什么是非行处？或有人行于淫女处（红灯区），或行于寡妇、成年处女、黄门、比库尼及酒肆之处，或与国王、大臣、外道及外道弟子等俗人作不恰当的交往而住，或与那些对比库、比库尼、优婆塞、优婆夷无信仰、无欢喜、不供养水、骂詈谗谤等地方为非行处，若前往，是不恰当的。什么是行处？离开这些地方，就是行处。对出家人、对三宝有信仰，能生起欢喜心，能够供养的地方是恰当的地方，可以去亲近，是为行处。能够具足、正具足、达、正达、成就、正成就、圆满这样的正行和行处，称为“正行与行处具足”。"],[25,3590,3702,1,"其次当知正行与行处具足也可这样说：即不正行有身、语二种。什么是身不正行？有些人在僧团中，不尊重长老比库，推开他们冲进去站、冲进去坐，在长老比库前面站，或在前面坐，或自己找高座坐，用袈裟敷着头，站立说话，挥手说话，诸长老比库没有穿履经行，他却穿履经行，长老在低经行处经行，他在高经行处经行，长老在普通的地上经行，他在大好的经行处经行，或者侵站长老的位置而坐，拒绝新学比库于座位之外，在向火的房中不征求长老比库的意见而自添薪火，关闭门户，在水浴场上冲开长老比库、自己先去沐浴，进村落时前冲、超越长老比库的位置，与家庭主妇和少女们谈天说笑，闯入隐秘的内室，喜欢触摸小孩子的头等，都是身不正行。"],[25,3702,3778,1,"什么是语不正行？有些人在僧团中，不尊敬长老，未征求长老的意见而自说法。很多人就坐在茶室，或者其他地方，没有经过长老的批准，就自己说法或解答问题，或诵巴帝摩卡（Pātimokkha），站立说话，挥手说话，进入村落人家对妇人或少女们这样说：某人某姓门下有些什么？有粥吗？有饭吗？有硬食吗？我们喝什么呢？吃什么呢？有什么东西送给我们吗？像这样的拉杂空谈，名为语不正行。其次，当知和上面相反的为正行。如有比库，尊敬师长，有惭有愧，整齐庄严地穿着（内衣和外衣），正当的前进、后退、前视、旁视及屈伸肢体、眼睛下视、威仪具足，掩护六根门头，饮食知节量，常事醒觉，具足正念正知等，是名正行。"],[25,3778,3852,1,"其次行处：近依行处、守护行处，近缚行处三种。什么是近依行处？具足十论事之德的善友为近依行处 （即与什么样的人在一起） 。因为依他可以闻所未闻，已闻的更明白， 解决疑惑、矫正意见，安息其心，或者跟他学习可以增信，亦得以增长戒、闻、舍、慧，故称近依行处。什么是守护行处？兹有比库，进入村庄，行于道上，收摄眼界仅见前面一寻之地，善加防护而行，不见象兵、马兵、车兵、步兵、妇女、男人，不看上，不看下，不看四方四维而行，这是守护行处。什么是近缚行处？约束其心于四念处中。世尊说：“诸比库，什么是比库行处，什么是你们的世袭传承？便是四念处。”这是近缚行处。即把心牢牢地绑在四念处上，是名近缚行处。"],[25,3848,3950,1,"“对于微细的罪过亦见其怖畏”。这是《清净道论》对“正行与行处具足”的解释，与《大念处经》的解释有所不同，不能混淆，因为是在不同的环境里做讲解。⑴ 第一种比库前面讲到比库行处正知有四种。第一种比库如此生活：白天时，他籍着坐禅、行禅使自己的心远离五盖；晚上时，在初夜与后夜同样籍着坐禅及行禅来使自己的心远离五盖。他只在中夜时睡眠。① 如何才能使心远离五盖注释讲到，比库如果有系统地修习安那般那，定力提升到相当程度时，禅相就会出现。如果能持续专注禅相（帕奥西亚多现在要求三个小时四个小时），五禅支的力量会变得很强，能持续维持定力更长时间。这样可以进入安止定，在近行定与安止定时五盖暂时不生起，使心远离五盖。"],[25,3950,4084,1,"如果心不能快速地镇服五盖，就要观察是什么更强有力的五盖障碍我们成就安止。如果能够成就安止，就能在整个白天、初夜与后夜将近二十个小时里都精进地修行， 籍着坐禅与行禅来使自己的心净化。现在就有禅修者，可以白天 10--12 个小时修习止禅。托钵时，能够入禅，入安那般那初禅、二禅、三禅、四禅。晚上可以入安那般那四禅来睡眠。甚至于一觉醒来，还可以在禅那中。这样的禅修者，他的心就能不受五盖的干扰。对于一位比库而言，清晨时，他履行对佛塔与菩提树的义务──打扫。给菩提树浇水，加满饮用的水与清洗的水，并且执行对戒师与教授师的义务之后，他照料自己身体的需要——洗脸、大小便利等，然后进入住处禅修，到了托钵时间就去托钵。一切时处都一心专注于业处。"],[25,4039,4135,1,"⑵ 第二种比库帕奥西亚多说：还有一种比库，他在清晨时也像上述的比库那样履行自己的义务。但当他的业生消化之火变得很强烈时，由于饥饿的缘故，他感到极度的不舒服。那时他全身出汗，而且无法专注于禅修业处。因此他很早就拿出自己的外衣和钵，快速地礼敬佛塔之后，在村里的牛群还未走出牛栏去吃草之前，他就入村托钵。得到粥以后，他到食堂坐下来喝粥。当他才喝到两、三口时，他体内的业生消化之火就放掉身体的色法，而改去抓取喝进身体的食物。"],[25,4135,4188,0,"当这位比库缓和了饥饿的苦恼，就像一个用一百壶清水沐浴过的人一样轻松。他继续喝剩下的粥时，就一直将禅修业处放在心中重要的地位。他洗钵和漱口之后，就一直在食堂里专注于业处，直到午餐之前。古时候，在斯里兰卡每个村子里都有很多食堂供比库用餐。在食堂旁边通常有一间小房子供比库禅坐修行， 然后他又可以到其他地方去托钵。在食用午餐时乃至返回的路上， 他都可以把心放在业处上。这位比库被称为在前去托钵时没有专注于业处，为什么呢？因为他太饿了，而在返回时专注于业处。"],[25,4188,4286,1,"在佛陀的教法中，像这位比库一样，喝粥以后专注于修行观禅，因而证得阿拉汉果的比库不计其数。仅斯里兰卡，在每个村子里，没有一个食堂里的座位不是比库坐下来喝粥之后证悟阿拉汉果的地方。我们应当学习这种榜样，在行、住、坐、卧等一切姿势中都专心地修行。吃饭时也以恭敬的心专注于禅修业处。如果能够修行观禅而且如此精进地修行，那么即使在吃饭时也可能证悟圣道、圣果。对于还没有观禅的人而言，在一切动作时，只要身体有力量要起来、要去推动时，先起作用的是火界；在进行的过程中起主要作用的是风界；要落下时，主要作用是水界；碰触时，主要作用是地界。若能如此观照，心也能非常地有念知，也能让心得到很好的训练。对于未来修习观禅时，即使坐着吃饭也能证悟阿拉汉道果，培养很好的基础。"],[25,4286,4367,1,"今天学习到这，希望大家在一切姿势中，都能精进地修行。祝福大家！Sādhu！Sādhu！Sādhu！"],[26,30,237,1,"179讲-摄集-摄菩提分-身念处-正知 2古源尊者礼敬尊敬的祜巴长老、各位尊者、各位尼师、各位贤友晚上吉祥！一、往返的行处正知上堂课学习了向前进与返回时的四种正知。在行处正知部分讲到有四种比库，哪四种比库呢？第一种比库在前去托钵的路上保持专注于业处，但是在返回时没有专注于业处。第二种比库前去托钵时没有专注于业处，返回时才专注于业处。第三种比库前去与返回时都没有专注于业处。第四种比库时前去与返回时都能保持专注于业处。"],[26,209,316,1,"（一）第一种比库《注疏》中说，第一种比库在前去时一直能保持专注。白天，他借着坐禅及行禅来使心远离五盖。晚间时，在初夜分与后夜分也同样借着坐禅及行禅来使心远离五盖。在佛陀时代，这种比库在整个白天和晚上总共二十小时里都精进修行。清晨时履行义务——清扫佛塔、菩提树等。到了托钵的时间，他去托钵且一直专注于业处，回来时可能由于某些原因而没有很好地专注于业处。（二）第二种比库第二种比库清晨时也像上述比库那样履行义务。但是肚子太饿了，所以他只能比较快速地处理完事物，赶去托钵，坐下来喝粥。才喝了两三口，体内地消化之火得到舒缓，马上就能够平静下来修观，最后乃至于能证得观智。"],[26,316,415,0,"（三）第三种比库第三种比库生活比较懒散、懈怠，总是被五盖束缚，在托钵之前和托钵之后或在托钵之中，都不能有效地专注于业处。他在入村托钵时完全不记得所谓禅修业处这一回事，左看右看。他总是和不恰当的人为伴行走与用餐，内心空洞地走出村子。这样的比库称为前去与返回时都没有专注业处的人。（四）第四种比库第四种比库在前去托钵与返回时从头到尾都能专注于业处。对于出身良善，希望获得内在提升而在佛陀教法中出家的人，当他们十人、二十人、五十人，甚至一百人群居于一起时，他们订立共同遵守的条规如下：“各位贤友，你们离俗出家并不是因为被债主逼迫、不是因为害怕国王惩罚、也不是因为饥荒时谋生困难等原因，而是因为想要得到解脱。因此，如果你们在行走时生起烦恼，就在行走的当下将烦恼降伏；如果在站立时生起烦恼，就在站立的当下将烦恼降伏；如果在坐着时生起烦恼，就在坐着的当下将烦恼降伏；如果在躺卧时生起烦恼，就在躺卧的当下将烦恼降伏。”"],[26,415,479,1,"订立此条规之后，当他们入村托钵时，如果其中有一人生起烦恼，他就在行走的当下将烦恼降伏。如何降伏呢？他一心专注于自己的禅修业处，籍此来降伏烦恼。万一办不到，他就会停下来，走在他后面的比库也会跟着停下来。前面这个人会想：“后面这位比库知道我心中生起的不善念头，这样的念头是我不应该有的。”于是他责备自己并且修习观禅，因此他达到了圣者的境界。万一仍然无法降伏烦恼，他就会坐下来。在他后面的比库也会跟着坐下来，这就是对治烦恼的方法。如果他无法达到圣者的境界，那么在止息烦恼之后，他会一心专注于业处而继续前进。他不会以不专注于业处的心举脚走路，万一那么做了，他就会退回前面开始妄失正念的地方，重新再走。"],[26,479,578,0,"如果你正在修习入出息念，在行、住、坐、卧的每一个姿势中，你应当只专注于呼吸。如果忘了专注于呼吸，那么你应当退回到开始忘失正念之处，重新再走。如此，你的正念就会增强，定力也会随着增强。定力够强时你就能证得禅那。若能以禅那为基础而精进地修习观禅，你就可能证得阿拉汉果，解脱生死轮回。这是帕奥西亚多在《正念之道》中的描述。镇伏烦恼无论是独自修行，还是有同伴行者，为了镇伏自己的不良习性，须给自己订立一些规则。经行时，如果发现心跑掉了，你就应该就地站立，这是《注疏》上的建议。帕奥西亚多还建议退回，我觉得不用退回就站在那，等到你的烦恼被镇伏。烦恼如何镇伏呢？如果是比库一起托钵时，这就很严厉，你一站住其他所有人都站住，大家知道你生起烦恼，你必须调服。当一个人时可能就没有这种警策，没有警策怎么办呢？"],[26,578,712,1,"当烦恼生起时，对于还没有力量能够迅速地摁住烦恼的人，建议先转移到善目标。有些人转不过来怎么办呢？让你的心先回到心脏这个位置，看着那股烦恼的力量在那翻腾，你要能看到它,大部分人都可以做到。如果这个都做不到那就要好好地练习身念处、练习觉知。心有足够的念知，就可以看到那股力量。陪伴它，或者顺着那股力量直接去找到其背后的生起标准或见解。如果是贪，一定有一个标准认为这个东西值得去黏著，你才会生起贪心；如果是瞋，一定是你觉得内心中某个标准被触犯到了，所以你生起瞋心。继续往下看，这个标准是怎么形成的呢？首先可以问这个标准是正确的吗？是真的吗？真的值得你如此坚守吗？如果是真的，它是怎么形成的？如果不是真的，它又是怎么形成的？一路找下去，你就会发现没有一个值得你贪或者瞋的外在东西。可以这样来制服烦恼。"],[26,712,810,0,"在修行的过程中，坚忍不拔的毅力是很重要的。对于《大念处经》中所提到的每一种念处，佛陀都教导说比库要以热诚、正知、正念来修行。热忱，就是四正勤，面对烦恼时以非常积极的心态去面对。佛陀说：热忱、正知、正念这三项是证悟涅槃的必要因素。因此，应当在一切姿势中都保持不断的四正勤、热诚、坚忍不拔、清明的正知与敏锐的正念，才能把控得了自己烦恼的状态以及如何去镇伏它。（五）应用业处与一切处业处关于行处，《大念处经》注疏对行处正知的描述与《清净道论》中对于行处这部分的描述稍有差别。现在学习的是《大念处经》中的行处正知，强调安住在业处。"],[26,810,970,0,"止禅业处可分为两类：1. 应用业处或翻译为根本业处：即禅修者经常修习的、 最相应的法门。比如有些人习惯于入出息念、有些人习惯于白遍、有些人习惯于白骨、有些人习惯于三十二身分，他总是以此业处为主，就是根本业处。2. 一切处业处：即所有禅修者都应当修习以便避免危难的法门，叫一切处业处。一切处业处属于护卫禅，包括：佛随念、死随念、不净随念和慈心禅。佛随念就是忆念佛陀的德行或特质，忆念佛陀的功德。修习佛随念可以提升信心、使心变得清净，同时可以避免危险。修习佛随念，非人不能干扰、天人会拥护。在缅甸和斯里兰卡，修习佛随念有很多传统方法，如建塔的方式： Iti’pi so……忆念佛陀的十种功德名号在身体建一座塔。如果修成功，可以快速地在身体建一座塔，每一种佛陀的功德名号，你都能感受到光明，整个身体也是光明的。在这种情况下，所有非人和天人看到你的身体就像佛塔一样光明，都会生起恭敬心，所以佛随念可以去除危险。如果对佛、法、僧三宝或对修行的信心疲沓了，修佛随念也很有效，心可以变得清净。"],[26,970,1129,0,"我曾请问过帕奥西亚多：有些人容易邪精进或他的五禅支不容易平衡，或者有些人一修入出息念就会贴死在目标上、或容易贴死在禅相上。帕奥西亚多教导说：“那个时候你修佛随念。”理论上我不太明白，觉得邪精进的人通常偏自信，偏自信实则没有正信，没有正信，就要修佛随念。没有正信的人没有中捨，容易偏，修佛随念容易生起八正道。死随念可以去除修行时生起的懒惰、懈怠，激发悚惧感、警惕心。我们随时都可能死亡，死神片刻不离，随时都可能拿取我们的生命，要有这种警惕心。懈怠的人，修死随念就能起到这样的作用。不净随念可以分两大类：1. 外在对尸体修不净（九种坟场观）2.内在三十二身分的不净 （观自己内在三十二身分的不净） ，这两种不净都能去除贪欲。对于能成功地修三十二身分的人，看到人时就看对方的三十二身分，或者与很多人聚会时，就看到到处都是一堆三十二身分在那边晃动。当然也可以用白骨，如果你觉得白骨更容易激发你的厌离心或悚惧心，可以看周边都是一堆一堆的白骨。目前能成功修习三十二身分的禅修者都能很轻松地做到，这样修习使他完全不会对外在的人生起贪婪心。"],[26,1129,1216,0,"慈心禅可以去除瞋恨。如果你比较容易生气，应把慈心当作主要业处，每天都修，不但可以去除瞋恨，还能免遭危难。这四种业处能保护禅修者免遭内外的危难，是每位禅修者都应该修行的，所以称为一切处业处或四护卫禅。如果一位禅修者的根本业处是佛随念 （属于一切处业处的一种） ，当他走到佛塔时不需要将业处暂时放下。如果他的根本业处不是佛随念以外的业处，那么当他走到佛塔下方、要走上台阶之前，应当将他的根本业处暂时放下，就像放下手上的物品一样。然后忆念佛陀的功德，因而内心充满喜悦地走上台阶。"],[26,1216,1329,0,"如果那是一座大的佛塔，在他以顺时针方向绕行佛塔三匝之后，应当在四个地方顶礼。如果那是一座小的佛塔，在向右绕三周以后，他应当在八个地方顶礼。礼拜佛塔之后，比库来到菩提树的地方。他以谦恭的态度礼敬菩提树，就像佛陀世尊正坐在菩提树下一样。如此礼敬佛塔和菩提树之后，他走下台阶，回到刚才暂时放下根本业处的地方再提起业处，覆盖双肩、穿着袈裟，入村托钵，同时一直将主要业处（根本业处）放在心中最重要的地位。比库去村里托钵，村民看见后说：“Bhante 们来了。”他们走上前去迎接尊者，接过钵，领着他们到食堂。然后请他们坐下，并且供养他们稀粥。接着为他们洗脚，在脚上涂油。在饭煮熟之前，他们坐在他的前面请教问题或听他开示佛法。即使施主没有要求比库开示佛法，但是为了他们的利益，比库仍然应当为他们讲解佛法，这是比库的责任。比库应当以这样的念头来开示佛法：“如果我不为他们讲解佛法，还有谁能为他们讲解佛法呢？”凡是佛法开示都离不开修行。因此，他将禅修的业处放在心中最重要的地位而开示佛法，然后开始用餐，并且一直将业处放在心中重要的地位。"],[26,1329,1462,0,"离去的时候，虽然他请村民止步，但是他们仍然送他到村口，比库离去时亦不应一直回头。这是古时候比库履行往返义务的一种特点。长老们在村庄托钵，跟村民非常友好地互动、开示佛法。年轻的比库和沙马内拉回来就会问：“尊者，那些村民是您的什么人？是您的父母或者亲人吗？”长老问说：“你是因为什么事而提出这样的问题呢？”他们回答说： “看到他们对您如此热爱和恭敬。”长老说： “诸位贤友，就连父母亲都难以为他们子女做的事情，这些村民都为我们做了。我们的袈裟和钵正是他们供养的。正因为他们，我们才能在困境中没有恐惧、在饥荒中饮食不缺，再也没有人像他们这般对我们有利益了。”他们就这样一边走着、一边习惯性地称赞这些村民。这位比库就是前去托钵时持续专注于禅修业处， 如果他返回时一直想着村民，就没有专注于自己的业处。"],[26,1462,1519,1,"如果是第四种往返，就是来去都能专注于自己的业处。（六）走廊住者马哈弗沙长老《注疏》中举了马哈弗沙长老（Mahāphussadeva Thera） 的故事,据说他履行往返义务十九年。当农夫、播种者、打谷者及其他人看见长老以那种方式行走时，他们说：“这位长老走了又停、停了又走，为什么他如此做呢？是否他记不得路？或者他忘了什么东西？”长老只是一心专注于禅修， 履行沙门的义务 （即修习戒、 定、 慧），不在意人们如何谈论。他在二十年内证悟阿拉汉果。"],[26,1519,1587,0,"在长老证悟阿拉汉果那天晚上，住在他经行道一端的天神站在那里，并且用手指放出光明，于是四大天王、帝释天王及娑婆世界主梵天王都来礼敬长老。森林里住着另外一位长老马哈提舍见到光明，隔天他来问马哈弗沙长老：“尊者，昨晚您这里有光明，那是什么？”为了转移话题， 马哈弗沙长老说：“光明是灯火、珠宝之类的光。”但是马哈提舍长老再三问他：“你保守着某一项秘密。”最后他只好承认，将自己的证悟告诉马哈提舍长老。我们应该向这位马哈弗沙长老看齐，不要向别人炫耀自己的修行成果。向别人炫耀是不好的，因为有些人会相信你，有些人不会，因此就会有许多问题发生。所以不应该将自己的修行成果告诉别人，你只能依照佛法而为别人讲解修行的道理。"],[26,1587,1707,0,"这是忠实地履行往返义务的比库例子。（七）迦兰巴落处僧寺的比库再举个例子， 在迦兰巴落处僧寺度过雨安居的五十位比库的故事。在即将开始雨安居时，他们订立这项约定： “如果还未证悟阿拉汉果，我们就不互相交谈。”这些比库入村托钵时，口中都含着一口水。当有人问到日期等事时，他们会将水吞下回答。否则的话，在离开村子时他们会将水吐在村口，然后离去。这个村子里的人看到地上有几口水的痕迹，就知道当天有几位比库入村托钵。他们心里想：“是什么缘故让这些比库不跟我们说话，彼此也不交谈？一定是他们之间发生争吵才会这样。”于是他们说：“来吧，我们去调解他们，让他们互相原谅吧！” 他们一起来到寺院。在寺院里，他们看不到有任何两位比库聚在一起。在那群村民中有一位很有智慧的人，他说：诸位善人，喜欢争吵的人住的地方不是这个样子。在这里，佛塔与菩提树的平台打扫得这么干净，所有的物品都很整齐，饮用水和清洁水都准备得很好，显然他们是合格的。”于是他们就回去。那个寺院所有的比库都在三个月雨安居内证得阿拉汉果，然后举行一次完全清净的自恣。"],[26,1707,1774,0,"《注疏》中说，应像第四种比库这样，心专注于禅修业处时才能举脚行走，然后有正念地走到村庄，到了村庄，他先观察是否有不恰当，如有醉汉、赌徒等不良者闹事，或没被驯服的象、马等出没街道。拖钵时，他不会匆匆忙忙地快速行走，因为并没有急速托钵这样的头陀支。相反的，他安详地行走，就像行驶在不平路上的水车一样。这是很好的比喻。这是行处正知的内容。二、往返的无痴正知（一）怎样才是修行无痴正知第四种正知是无痴正知。无痴正知是针对修行观禅的人而言。无痴正知是在向前进等动作时不迷惑。"],[26,1774,1871,0,"当一个慧眼受到蒙蔽的凡夫前进或返回时，他的头脑是稀里糊涂的： “自我在向前进，向前进的行为是由自我产生的。”或者“我在向前进，向前进的行为由我产生的。” 这是指有我见的这种情况。然而，在佛陀教法中，不迷惑的比库如此想： “当一个人想着 ‘我要向前进’时，那个心产生的风界会造成身体的动作。由于心生风界的扩散作用，身体才会向前行走。”在前面的课程已提到，如果在向前进时你心里想： “我在向前进”或者“向前进是我产生的”，那不是在修行观禅，只是肤浅的方法。比库应当如何知道呢？首先他必须观照自己的心， 尤其是观照想要使自己身体动作的意门心路过程。当比库心里想“我要向前进”时，就会有许多意门心路过程生起，它们会产生很多色聚。那些色聚中的风界特别强盛，它们能产生身体的动作，即身表。他必须照见那些色聚并且分析它们。每一粒色聚中至少有九种色法——地、水、火、风、色、香、味、食素和身表，它们是带动的色法，由于其中风界的扩散作用，身体才会向前进。"],[26,1871,1961,0,"除了带动的色法之外，还必须观照被带动的色法，即构成所生身的四类色法。也必须观照产生带动色法的意门心路过程。带动与被带动的色法是色蕴，意门心路过程包括四种名蕴，总共是五蕴。修行观禅的人必须在向前进与返回时照见这些五蕴， 如此才可说是依照佛陀的教导，在向前进行与返回时都以正知而行。（二）、行处正知与无痴正知相互关联行处正知与无痴正知有什么关联？对于行处正知， 如果是修止禅时你就修止禅，如果是修观禅时你就修观禅，可以根据自己的修行程度，或者想在一段时间里以修行止禅为主，你的行处正知就以止禅为主；如果想在一段时间里以修行观禅为主，你的行处正知就以观禅为主。对于大部分人来讲，在修止禅的阶段， 一般会建议他在修止禅时，前面学过的所有止禅都应于日常行住坐卧时，经常地进到这些禅那里，去觉知它。"],[26,1961,2069,1,"止禅有四十种，成就一个止禅就不要扔掉它。不扔掉它，并非指把全部都当作根本业处，你忙不过来。在修习四十种业处的学习过程中，对于前面学习的业处，你可以每天每种禅那在不同的姿势里入五分钟、十分钟或一分钟，因为你所有的禅那都修习过五自在。在一整天里，能把这些业处都复习一下，然后在经行或履行往返义务时，可以选择某一种或者某几种止禅业处来学习。对于能修观禅的人，在一段时间修观禅时，比如修名色分别，你应当看到名色，看到名色的生起和灭去。如果修思惟智，你应当观察它的无常、苦、无我。如果修生灭随观或坏灭随观，你应于相应的观禅业处来修习。如果你认为已经修完一遍，到行捨智了，一般老师会建议你选择某一种特别有觉受的业处，十一种五蕴，你选择某一类，或是禅那的名法、或是某一类的色法，专门去修习它，可能效果会比较好。"],[26,2068,2141,1,"（三）普通禅修者的日常修习既没有止禅又没有观禅的人该如何修习呢？对于正在练习止禅的人，若处于安全的地方，应以你现在正在练习的止禅业处为主。比如你现在以修入出息念为主，在安全的环境下（如走在比较平坦的路上） ，就应该专注呼吸。如果你在从事一些危险的工作或可能带来危险的工作时，应对你身体的动作要有念知，比如切菜、开车，不建议大家在开车时修入出息，特别有些已经接近近行定的人，他在开车时，开着开着，似相一出来心就被吸进去，会有危险。"],[26,2141,2313,1,"如果日常时保持念知，无论是在洗钵、洗衣服、清洗场所或者在家人打扫家庭卫生、做饭等，举手投足的每一个状态都觉知它、观察它，对于定力的培养是非常有帮助的，心不会散掉。如果想练习观察自己身心的状态， 可以观察部分的身体色法特征。你所有的动作在发动时，是以火界为主导力量、风界为辅助。在正常地开始运行过程中，如：脚抬起来是以火界为主风界为辅；平移时以风界为主火界为辅；下落时以水界为主、地界为辅；踩到地上时以地界为主、水界为辅。你可以这样去感知它，同时去感知火界的特相、作用，这种方式也是一种无痴正知。虽然不能看到究竟的名色法，但这种方式也是修习无痴正知的一种练习。对于还没有获得很好的止观的修行者，这种练习是很有帮助的。虽然看不到究竟色法的相，但是对于色法的特相可以部分地觉知到，这部分觉知可以让心变得清明，智慧可以被培养。"],[26,2307,2423,0,"（四）每步分为六个阶段《注疏》将身体行走时的每一步分为六个阶段：1.举起脚 2.伸出脚 3.脚向前移 4.脚向下落 5.脚踏在地面 6.脚向地面压下去。如果压下去的是左脚，此时身体的重心自然地移到左方，右脚跟会同时提上来，接着右脚才能跨出第二步。在举起脚时地界与水界弱而无力，而火界与风界强而有力。在伸出脚与脚向前移时也是同样的情况， 但是风界与火界已经完成了它们间的交换——提上来时，火界为主风界为辅；伸出去时是平滑的状态，风界为主（占上风）火界为辅（少一点）。在脚向下落、踏在地面上及向地面压下时，地界与水界强而有力，而火界与风界弱而无力。由于火界之后伴随着风界是举起脚的条件，所以在举起脚的动作中火界与风界偏强，这是由于它们能力的缘故。"],[26,2423,2600,1,"有同学问为什么是这样？因为我们所了解的一切世间事物， 但凡有运动或要发展，都依靠火界。冬天，植物会落叶、动物入冬眠；春天，万物复苏。天气好时，我们觉得比较有力量；天气冷时，都缩成一团。所以，火界是所有运动的主要动力来源。当我们老了，业生色法中火界的力量变弱，活力会变弱。小孩子每天奔跑，为什么？因为他火界的力量特别旺盛。火界本身特别地有助于我们生起动能。因此在举起脚的动作中风界不及火界，此时，地界与水界弱而无力。因为地界是重、硬，水界是黏结——让你提不上来，这是黏结，如果很沉重、 往下坠，这是地界水界。当要抬脚时，你会觉得要轻轻地提上来，这是心生色法起到的作用，心生色法本身带动的地界与火界也是弱的。由于风界之后伴随着火界是伸出脚与移动脚的条件，所以在这两项动作中风界与火界比较强，这是由于它们能力的缘故。风界的本质是推动，而且由于在伸脚与移脚的动作中，风界的作用特别强盛，所以此时火界的力量不如风界，且地界与水界弱而无力，因为它们无法伸展与移动，即地界与水界的特相不是伸展与移动。"],[26,2600,2713,0,"由于水界之后伴随着地界是将脚落下的条件，所以在这个动作中水界与地界偏强，这也是由于它们能力的缘故。水界的本质是最沉重的，所以在此动作中地界不如水界。有些人问说：“为什么水界的本质最沉重呢？土或石头的比重不是比水大么？”这是从色聚的地水火风究竟法的角度、它们的作用来讲。水的作用是黏结，如果一个物体没有黏在一起，或者飞散开来、高抛时，它的重量就无法凝聚。《注疏》中说水界的本质是能够形成重，所以在脚往下放时，起主要作用的是水界，地界为辅，风界与火界就比较弱、无力。因为火总是向上扬、风总是往上吹，比如说热空气上升、冷空气下降就是这样的一个特点。风界与火界的特相，无法使已上举之物往下落，往下落要靠水界与地界。"],[26,2713,2793,0,"由于地界之后伴随着水界是保持脚踏在地面上的条件，所以在这项动作中地界与水界偏强，这是由于它们能力的缘故。保持脚踏在地面上就像固定东西一样，由于地界在这方面的功能特别强盛，所以此时水界不如地界。将脚向地面压下的动作中，水界的作用也不如地界。地界以硬、粗、重为主要特点。（五）名法生灭的速度是色法的十七倍如此， 举起脚时的色法及造成那色法生起的名法不会持续到伸脚时，因为它们存在的时间非常短暂。存在于一个步骤中的名色法不会持续到下一个步骤，它们就在生起的步骤中坏灭，犹如丢进热锅里的芝麻立即破裂一样。由于快速的生灭变化，名色法当然无法从一个地方移到另一个地方。像这样，谁在向前走？向前走的是谁？从究竟的意义来看，发生的只是名色法的生灭而已。"],[26,2793,2872,1,"就像烤芝麻的时候，芝麻的破裂与破裂的声音几乎同时发生。同样地，行法的坏灭几乎与它的生起同时发生。偈诵：「一个心念生起，另一心念坏灭，名色次第生灭，进行犹如水流。」在向前进或返回时，应以如此的认知去观察。如果有观禅时，你将如实地观察到；如果没有观禅时，你可以部分地观察到名法的特相。当能够如此去练习时，可以说你是无痴的。当能部分地觉知向前、向后、前进、返回时身体的动作、指挥这个身体动作的所有名法以及这些名法背后的标准。"],[26,2872,3013,1,"当你练习经行，能熟练做到往返几次而没有妄念时，可以观察一下你的心，虽然看不到究竟的名法，但是可以观察到你的心为什么让你这样走？为什么你的步伐是这样的速度、你的每一步是这样的幅度？为什么设定经行道走到那个位置就要回转？回转时向右转还是向左转？可以观察为什么你会习惯于向左转？为什么习惯于向右转？经过训练的人会说：如果佛像或者法堂在经行道的右边，那么在转向时不能背向值得尊敬的佛塔、法堂、戒场、上座，应该向着它/他的方向转。这就是有一个标准，你被训练过就必须这样。如果没有被训练过，就会习惯于向左转或习惯于向右转。你可以观察向右转或向左转是怎么形成的？再往后看，又能看到你的惯性。不断地往下看就会发现：其实日常所做的决定、决策都来自于以前所形成的观念、看法。这些念头是不变的吗？是你吗？如果这个念头是你， 当被训练后你知道见到上座时要朝向他的方向转，这是可以改变的，为什么可以改变？因为无我。如果是一成不变，就不能被改变。这也是练习无痴正知的一种方式。"],[26,3013,3225,0,"如果有良好的观禅，你将会看到名色法极其快速地生灭。于每一个举手投足都不见有一个真实的实体在行走，只是刹那刹那地生灭。已经修习到观禅的人具备这个基础，可以达成这样观照。关于行走，很多人报告说：“真的就像一堆粉尘在快速移动，仅此而已，完全找不到有一个我或是谁在行走。”此时，很容易破除对“我”的执取。如果能够修到观禅，显然你对于自我的认知是截然不同的。但是如果还没有修到观禅，或者说止观行者与纯观行者的差别确实有一些不同。止观行者，前面的止禅是成熟的、稳定的，两个准备智（名色分别智与缘摄受智）你都非常纯熟地通过了，特别是在名色分别智，真的能很清晰地看到所有色法及其自性相与共相。然后再以定力观察你所有的行、住、坐、卧时，观照到你的身体完全是一堆色法在刹那生灭，像泡泡一样地刹那生灭。如果你没有那么强的定力，而是从基础定力慢慢地练习观察自己的地、水、火、风的人，乃至于有些能看到色聚生灭的人，往往很难整体地看到所有色法的生灭。这就是差别。当然每个人的巴拉蜜不同，有些人的巴拉蜜这样就可以达成道果的生起。但如果可以更加纯熟地来觉知你的名色，或更系统、更完整地看到你的名色的状态，显然是更加好的，不是没有必要的内容。"],[26,3225,3300,1,"帕奥西亚多《正念之道》中强调说“禅修者在一切动作中都应该慢慢地进行，犹如行驶在不平路上的水车，而不应像快速将鱼吞下去的鸟。”有一种专门抓鱼的鸟——鸬鹚，它的嘴巴和脖子很长，专门捉水里的鱼吃。每当抓到鱼时，它不像我们吃东西时需要咀嚼，而是直接快速地吞下去。渔民在它的脖子下面绑条绳子， 当它将鱼吞到脖子后，再把它抓起来让它把鱼吐出来。如果我们无论是在走路还是吃饭时，也像这抓鱼的鸟一样，没有充分咀嚼就快速地吞下去，此时很难生起觉知。"],[26,3300,3459,0,"在向前进与返回等一切动作中，都不应该像鸬鹚那样急躁地、快速地从事，而应该慢慢地行动，同时能观照到身心的状态。如果有观禅，要能够观照究竟名色法；如果没有观禅，至少要能观察到名色的一些基本特相。当生起贪心或瞋心，能及时地观察到，至少对贪的黏著和瞋的排斥是能够观察的。（六）如何培育无痴正知帕奥西亚多说：讲道理很简单，实际修行起来是不容易的。首先你必须培养定力，比如达到入出息念四禅。然后在向前进之前，先站在经行道的一边，闭上眼睛修习入出息念达到四禅。出定之后对自己的身体修四界差别。见到色聚之后再分析色聚，直到照见究竟色法。然后注意心脏的位置，同时慢慢地把脚抬起来，观察想要使身体向前进的意门心路过程。之后再观察由那些意门心路过程产生的心生色聚，就会看到这些色聚中的风界特别强盛。这些风界会产生身表，这里的身表指的是身体向前进的动作。观察这些带动的心生色法起来之后，应该观察四类被带动的其他色法，包括业生色、已经生起的心生色、时节生色和时生色。慢慢向前进的同时，观察带动与被带动这两种色法。如此，禅修者在一切动作中都应当慢慢地进行，犹如行驶在不平路上的水车，而不应像快速地将鱼吞下去的鸟。"],[26,3459,3551,0,"观察色法之后应当观察名法。前面说：观察心脏那个地方，首先看到你的有分心，然后观察想要使身体向前进的意门心路过程。意门心路过程包含四种名蕴，上述的带动与被带动的色法是色蕴，总共有五蕴。如此，在向前进与返回的时候观照色法、观照名法。有些人可以不断地观察为什么会产生这样的意门心路过程？意门心路过程从意门转向开始，意门转向里包含了什么样的内容让他如此行走？以上是向前进与返回时的四种正知，在日常练习中， 有益的正知、适宜的正知、行处的正知和无痴的正知，对于已经有定力的和没有定力的，有观禅的和没有观禅的，都可以这样去落实。对于还没有成就止观的人，特别需要在日常的时候练习四种正知。"],[26,3551,3625,0,"三、向前看与向旁看时的正知佛陀教导的第二组正知『向前看或向旁看时，他以正知而行。』第一组是向前进与返回时（出去与回来时），现在是正常地向前看、向后看也要保持四种正知，即有益正知、适宜正知、行处正知与无痴正知。「向前看」是指向前面看；「向旁看」是指看其他的地方。在这里没有提到其他看的方式，如向上看、向下看， 《注疏》中解释：佛陀籍着提到这两种，其他所有看的方式都包括在内。比如比库（出家人）扫地时，就要向下看；如果大扫除扫蜘蛛网时，就要向上看；听到后面有车来了，就要向后看，以躲避危险。所以佛陀说的向前看和向旁看，已经包含所有的看。"],[26,3625,3775,0,"（一）有益正知对于向前看，先明了看的利益然后才行动，而不是受到“我要向前看”的念头驱使就立即看过去。在此，帕奥西亚多引用 Nanda（难陀）尊者的例子：佛陀回家乡时，遇到难达与未婚妻国美王妃正准备举行婚礼。佛陀前去托钵，他为佛陀拿钵并一路跟着佛陀回到精舍，然后被剃度。因为他不能忘记国美王妃而不能安住于梵行，后来在佛陀的教导下他很努力。因为想念未婚妻而被其他比库耻笑，所以他感到很惭愧，激励自己：“我要收摄自己的身心。” 所以他养成一个习惯：当他必须向东方看的时候，他会全心全意地如此看：“当我向东方看时，愿我不被贪欲的、忧恼的、低劣的、不善的心所左右。”如此他变得很精进，并且非常谨慎地守护根门。透过履行沙门的所有任务，他在自制方面达到很高的成就。因此佛陀将他列为守护根门第一的大弟子。佛陀说： “诸比库，难陀是我所有弟子中守护根门第一的弟子。”所以我们应该以难陀尊者作为学习的榜样。在《善梵经》中佛陀说：“不修行七觉支及守护根门，就无法证悟涅槃、解脱生死轮回。”所以佛陀将守护根门与七觉支并列为同等重要， 即你不守护根门就无法证悟涅槃、解脱生死轮回。"],[26,3775,3926,1,"因此，想要证悟涅槃、解脱生死轮回，必须谨慎地守护自己的眼根、耳根、鼻根、舌根、身根、意根。对于我们而言，怎么守护自己的眼根呢？就是该看的看、不该看的不能看，要看之前先想一想能不能看。怎么守护自己的耳根呢？就是能听的听，不能听的不听，在打开手机之前先想一想会响起什么声音。怎么守护自己的舌根呢？每天托钵时看到那些食物，你觉得会引起贪欲的就暂时先不打了，或者你觉得吃了好，那你少打一勺吧！要知足，如果不懂得知足，我们的舌头就会常常不安份地活动起来，想吃这个、想吃那个，这是不好的。不知足就无法守住根门，也就无法解脱生死轮回。因此我们应先知道知足并以难陀尊者为榜样。（二）适宜正知向前看或向所有地方看之后，应当像前面所讲礼敬佛塔的方式来判断：这是适宜的、这是有益的、这是适合去看的。或者说去集会可能是有益的，但因为同时有许多人聚集在那里，可能就是不适宜的，这要了解。"],[26,3910,4043,1,"（三）行处正知同前所述，就是坚持专注于觉知入出息，如果修四界差别就觉知身体的动作。如果一个人已成就不净，比如在向前看、向左右看时，看到的都是白骨或三十二身分。曾经有禅修者说上晚课时看到的都是三十二身分。如此一心专注于自己的根本业处就是行处正知。（四）无痴正知无痴正知是指观禅而言。对于看的无痴正知，需要多花点时间来学习。因为对于人类来讲，看是很重要的一个内容。无痴，就是能够了知正在从事的所有行为，这是所谓基本的原则，也就是当我们向前看或前后左右看， 纯粹都只是各种现象的展现而已。因此无痴正知就是如实地了知事物的真相。当“我要向前看”这样的心生起时， 会产生心生风界而造成身体的动作。由于心生风界的扩散，下眼皮自然地会向下开，上眼皮会向上开。"],[26,4043,4255,1,"在这里我们必须照见究竟名色法。首先应当有系统地修习四界差别，见到色聚之后就分析色聚里的究竟色法。然后观照 “我要向前看”的心产生带动的色法，那些色法中的风界特别强盛，而且能产生身体的动作。接着应当观照你的眼睛及眼睛的周围，那里有业生、心生、时节生与食生这四类色法，它们是被带动的色法。由于上述带动色法之作用，就造成被带动色法的移动，于是下眼皮会向下开，上眼皮会向上开。你必须照见这些现象。向上看、向下看、向前看、向左右看，都必须照见这样的现象。然后应当观照产生带动色法的意门心路过程，如前所说：带动的心生色法与被带动的色法都要看到，也要看到让我们眼睛睁开看的名法。当睁开眼睛看时，颜色会同时撞击眼根和意门，即在有分波动的刹那，颜色撞击眼根的同时也撞击了有分心，包含眼识在内的眼门心路过程就会生起， 执行看的作用。这样的清楚理解称为无痴正知。《注疏》中说，对于向前看这种动作，应加上对于眼根的正确认知、对于因缘的正确认知以及对依于眼根生起的眼门心路过程 （依心的定则生起） 这种非常短暂的情况要有认知。"],[26,4255,4408,0,"同时思惟眼睛看的过程中所有蕴、所有的处、所有的界、所有的缘起，从这几个角度来观察，才能真正称为无痴正知。简单提一下， 对根如何正确地认识呢？我们知道看东西要靠眼根，而人的眼睛与猫或者狗的眼睛所能看到颜色的频谱不同。常有学佛的人说在诵经时，那只猫也蹲在边上一起诵经、狗也会跟着一起诵经。有时候狗开始叫，好像看到了什么东西。猫像是看到什么东西也开始叫，但是你没看到。这是什么原因？就是你的眼根与猫的眼根、狗的眼根不一样。我们知道，无色界天人没有眼根，蚯蚓没有眼根，总是躲在土里面， 粪坑里的蛆没有眼根， 只长了个大嘴巴。学佛人都知道，一切众生，此生成为蚯蚓、成为粪坑里的蛆、乃至于成为无色界天的天人、或者长着五官的人，是跟上一生临死前成熟的业有关，而这个业是跟他的无明、爱、取有关。如果你的无明、爱、取里，想要看到东西，就有机会长出眼根来，哪怕在地狱里也会有。如果你的无明、爱、取里只想把自己埋在土里面，不想与人交流，就容易变成蚯蚓，不善业成熟时就可能做蚯蚓。眼根长出来的最主要的因缘就是你想看东西，有色爱。"],[26,4408,4511,1,"为什么想看东西？认为看到东西可以带来快乐。眼睛看到东西，看到颜色、生起快乐的感受，你才会想长眼根，这是它的根本原因——根长出来的背后因素。眼根被颜色撞击后所生起的系列心路过程，是依着心的定则来运行的，应如实看到。心的定则运行：五门心路过程，颜色撞击根门后生起五门转向，然后生起眼识、领受、推度、确定，接着是七个速行心。眼识、领受、推度是果报心，确定心是唯作心，而对于凡夫来说，七个速行心要么是善、要么是不善。眼识、领受、推度是果报；速行心就是造业了；中间这个确定心，决定如理作意或不如理作意。所有的随眠都是在确定心里面起作用的。为什么会在里面起作用？与心的认知、过去的随眠以及惯性有关。这中间没有一个人、 我、 众生在里面决定要这么看，看完后要产生什么样的想法。"],[26,4511,4600,1,"学习阿毗达摩后就很清楚，如果有观智就能如实看到这样的现象发生；如果没有观智，通过学习可以这样思惟，也是一种无痴正知。今天先学习到这，愿大家都能够获得无痴的正知。Sādhu！Sādhu！Sādhu！"],[27,8,413,0,"180讲-摄集-摄菩提分-身念处-正知 3古源尊者上堂课学习到四念处——身念处<正知>中如何向前看、向左右看这部分内容。一、向前看与向左右看时的无痴正知佛陀说“向前看或向左右看时，应以正知而行”。在向前看、向左右看时的无痴正知内容中，提到了如何照见究竟名色法、如何观照带动色法的意门心路过程、以及这些意门心路里包含了哪些内容。名法有四种名蕴——受、想、行、识，所有的意门心路过程都包括这四种名蕴，再加上带动与被带动的色法，总共是五蕴。因此在向前看或向两边看时，必须能够清楚地照见五蕴。眼睛向前看或向两边看，所看到的颜色会同时撞击眼门和意门，包含眼识在内的眼门心路过程就生起，执行看的作用。若能如此观察就是无痴正知。在无痴正知的基础上需要从根源的角度来正确认识、从因缘的角度来正确认识、以及从心认知目标的过程非常短暂的角度来思惟，也要思惟蕴、思惟处、思惟界、思惟因缘与缘力，进一步地了解无痴正知。对于还没有观智的人，应先了解这样的一种事实和状态并去思惟，在向左右看和向前看时，能够带起此种状态。"],[27,413,587,0,"对于根的认知：我们为什么长这样的根？为什么长这样的眼睛、长这样的耳朵、长这样的鼻子、长这样的舌头、长这样的身体？与上一生临死前成熟的业以及造那业时的无明、爱、取——动机相关联。我们造作善业，并且对人的生命有执取——希望长成有眼睛的人，所以这一生才会长成有眼睛的人的样子。在善趣生命里，无想有情天的天人仅是一堆业生色，五百大劫生命里都没有心识、没有心理活动，只有一堆物质。这样的生命是如何产生的？因为他临死前有四禅的定力并厌恶心的活动，认为所有的苦都是心的运作造成的，所以他厌恶心、厌恶想，乃至想要彻底地灭除想与心识。带着这样的心入无想定四禅维持到临终，就会在无想有情天结生，这样的生命就没有根（眼根、耳根、鼻根、舌根、身根）。作为人能看到颜色，首先是因为过去有这样的执取、期待，所以才能长出根、才能看到颜色。从五蕴来讲，色法（身体物质的部分）不会执取目标，为什么呢？因为它不能认知目标。能够认知目标的是心，物质是被认知的目标。对于“看”这个动作，看的认知过程有十七个心识刹那，以目标是极大所缘为例，一条五门心路过程总共包括十七个心识刹那。"],[27,587,761,1,"如上图中的影像是极大所缘，这种情况下有多少心生起？一个过去有分加一个有分波动、一个有分断，再加十四个心路心，心路心包括五门转向、眼识、领受、推度、确定加七个速行心和两个彼所缘，总共十七个心识刹那。在这个过程中真正能够识知目标的是后面的十四个心路心。色法的生灭速度 （寿命） 是名法的十七倍，色法为什么更慢？《注疏》中说：地、水、火、风四界有迟钝性，不像心那么迅速地生灭。唯有已经依循诸佛古道而体证真理的佛陀，才具有如实了知各种现象的智慧。籍着这样的智慧，佛陀描述：“让心生起的前生缘是色法，支持色法持续存在的后生缘是名法。”也就是说，身体物质的存在，需要后生的心去支持。在看听嗅尝触每一个当下，为什么能看？因为有眼根（色法），又有目标（色法）出现，这个目标（色法）撞击眼根同时撞击意门，因此生起一个眼门心路过程，这个眼门心路过程每一个心的生起，后面生起的心都会支持色法继续存在。因此《注疏》的注释者阿难达长老说“应当以这里所描述的方式来了解身心运作的意义和状态。"],[27,761,875,0,"当一个心与在它之前第十七个心识刹那时生起的色法同时坏灭。名法的寿命是一个心识刹那，而色法的寿命是十七个心识刹那，因此同时生起的名色法不能同时坏灭。所以说：一个心念生起，另一个心念坏灭。心流就像河流一样，因为每一秒中有数万亿个心逐一地生灭过去。除非你进入灭尽定或投生到无想天，否则心流从来不曾中断。累积修行的善业，如果能在行走、观看时观照名色法，那么在每一秒或每一分中都有上万亿的善业生起灭去，就像水流一样。如果能持续地正念正知观照自己的名色一个小时，所累积的善业不计其数。譬如雨滴虽然很小，但是积聚起来就会形成大江大河。同样地，如果我们勤于累积修行的善业，它们也将在我们的心路过程中形成江河般强大的力量，这就是我们的巴拉密。这些巴拉密将在我们的生死轮回中结成很多善果报，资助我们证悟涅槃。因此在向前看、向旁边看时，必须如实观照五蕴。"],[27,875,1047,0,"眼睛向前或向两边看，所看到的颜色会同时撞击眼门与意门，包括眼识在内的眼门心路过程就会生起，应如此理解。这是无痴正知。首先，眼门心路过程会生起须从根源上来正确认知，如上图，在这个位置（过去有分），一个颜色出现，它同时撞击了有分和眼门。撞击后，经过一个有分波动、一个有分断，再经过一个五门转向，就会生起一个眼识，眼识之后生起一个领受、一个推度、一个确定心，接下来七个速行心、两个彼所缘，这是一个完整的五门心路过程之眼门心路过程，是完整的十七个心识刹那。有分心是维持一生中心流不断的主要原因。由于有分心的生起，所以一期生命中的心识没有间断。当有任何一种心路过程生起来时，有分心就会暂时停止生起；当没有心路过程生起时，有分心就会再度相续地生灭。有分心的生起是有时间性的，比如在熟睡无梦时，也就是没有任何心路过程生起时就会有很多有分心相续地生灭。如果你一个晚上五个小时都无梦，那么五个小时生起的都是有分心。如果有分心不再生起，除了心路之外，就预示着死亡，所以一生中最后的一个有分心称为死亡心，心流停止死亡就会发生。"],[27,1047,1165,0,"在经典中，两个波动的有分心相续地生灭称为有分心的转变。为什么呢？因为接下来转向心（五门转向心或意门转向心）会生起，执行转向或注意根门目标的作用。举眼门心路为例，转向心灭去后，眼识生起，执行看的作用；眼识灭后，领受心生起，执行领受的作用；领受心灭后，推度心生起，执行推度的作用；推度心灭后，确定心生起，执行确定的作用；确定心灭后，七个速行心逐一地生起与坏灭，即是对这个目标采取行动。五门心路从有分波动开始后顺序生起的其他心中，乃至到第七个速行心，都还没有因为“看”——向前看或向后看，而生起很强烈的贪、瞋、痴，也就是五门心路过程里不会生起很强烈的贪、瞋、痴。《注疏》中说，就像战场上的士兵一样，在激烈的战斗中，没有多余的精力去认识对方士兵长得啥样、有多高、多大块头，没有办法去细认，因为都是你死我活，看到就：“那个敌人，要打死他！”不断地生起这样的念头。五门心路过程就是“这样一个东西出现”，只是很快速的心去认知它。会认出什么呢？就像士兵在战场上认得：“这是敌人的士兵，这是我方的士兵”， 只可以这样。"],[27,1165,1229,1,"但是在战争结束以后，战死士兵的尸体堆积起来，就发现这场战争其实很惨烈。这是什么意思呢？就是你看到一个所缘，未必能很快地认知到，当持续地去认知它时，心就会跟着滚起来，那个时候再来看时：“噢！我刚才贪了，我刚才瞋了，我刚才痴了。”同样地，当这些心一个接着一个地坏灭之后，伴随着分别“这是个女人，这是个漂亮的女人；这是个男人，这是个很帅的男人，这是个很恶心油腻的男人”，随着这样念头的生起，就有强烈的贪、瞋、痴的心，带着强烈贪、瞋、痴的心在向前看、向后看。"],[27,1229,1445,1,"看前面、看两边时的无痴正知，从根源上来看，应有如此的正确认知。真要获得这样的认知，必须修习到名色分别智，真正能修名业处的人才能对心路生起的根源有正确的智。根据佛陀的教导，眼门心路过程之后（即彼所缘之后），有分心会生起很多次。在那些有分心之后，随彼起的意门心路过程会生起来。前几天讨论时，有位尊者说他的心运转得很快。其实心运转得很快并非指每个生起的心识刹那的时间比较短，一切生命每个心识刹那都是一样的，无色界天人的心识刹那与地狱众生的心识刹那是一样的。所谓一个人心的反应比较快或反应比较慢体现在哪里呢？就是心路中间的有分心。比如五门心路生起，接着要生起随彼起的意门心路过程，中间落入有分的个数越多反应越慢，个数越少反应越快。佛陀最厉害的神通是双神变，佛陀双神变时在他的意门心路过程里只生起五个速行，接着很快地又生起下一条心路，水火交互的心路，速度很快。一条五门心路过程，如前所说向前看是眼门心路过程，其结束后，接着随起的意门心路过程至少生起七条（当然也有一些书里讲四条，我们统一为七条），依次是接受五门心路过程的所缘、整体地识知该所缘、识知所缘的颜色、领会所缘的实体、识知所缘的实体、领会所缘的名称、识知所缘的名称等，总共是七条心路过程之后才能产生“这个女人是这样的女人，这个男人是这样的男人，这个东西是这样的东西”，完整的认知概念。"],[27,1445,1583,0,"而只有很明确地看清楚目标之后，才会生起强烈的贪、瞋、痴。在没有看清楚目标之前，虽然有贪瞋痴——如在战场上能分出敌我，但还不能很清楚：“这个家伙曾经打过我！”。当认出来“这曾经是我的仇人！”或“不是你死就是我活”时生起的瞋就很不同。强烈的贪、瞋、痴是在认知到这个人的完整概念之后才会生起。那么，在眼门心路过程里的速行有没有造业呢？也有造业，但只是很轻微的贪、瞋、痴的业。在七条随起的意门心路过程之后，如果对这个所缘有强烈的执取，无论是贪还是瞋，这种力量就会很强大。很多人会问：“五门心路过程（或许是贪的）之后，到了第八条之后会不会变成瞋呢？”在没有如理作意或转化对所缘的认知之前不会改变。五门心路开始时有贪，后面持续地越来越贪；前面有瞋，后面持续地越来越瞋。除非如理作意，或者再次非理作意，转变对所缘的态度和看法，才会转变，否则就会一路跟下来。眼门心路过程作为后面意门心路过程生起的基础，如果没有眼门心路过程，意门心路过程就不能取颜色为目标。比如眼睛闭着，心没有办法取到颜色。不能够清楚看到颜色的人就不会对那颜色产生强烈的贪、瞋、痴。"],[27,1583,1753,1,"因此注释说：在前五门心路过程里没有强烈的贪、瞋、痴生起，只在意门心路过程中才会有强烈的贪、瞋、痴生起。然而，前五门心路过程的速行心是接着生起的意门心路过程速行心中贪、瞋、痴生起的根源。或者从有分心开始都可以作为意门速行中贪、瞋、痴生起的根源。如何理解呢？五门心路过程在过（过去有分）、波（有分波动）、断（有分断）后为什么会转起？举例而言，大家在这里打坐，上面在装修，很吵。如果你不把声音当做吵（障碍），它就不会干扰你。但有些禅修者说：“实在是受不了，实在是太吵了！”“实在是太吵”那是从声音撞击你耳根和过去有分时，你的心就转起“太吵了！”如果禅修者练习：“这是装修的声音，我随喜他们，在一年以后将会看到一个非常美丽的塔。”然后心里生起：“响吧，我就是入出息。”能保持这样的心，当有分被撞击时，就不会猛烈地转起。所以，即使是有分心也可以作为意门速行心中贪、瞋、痴生起的根源。这是从根源的角度来看待：如何看以及看之后所有的心理活动是如何生起的。第二，从缘生的角度来看。当一个目标出现在眼门时，从有分心开始，经历了转向心、眼识、领受心、推度心、确定心，这些心生起后立即坏灭，然后速行心才会生起。"],[27,1748,1887,1,"《注疏》中说：速行心像客人一样，而眼门就像上述诸心的家一样，因为这些心是依眼门才能生起的。这些心在速行心生起来之前就先在眼门中生起。就像一个客人来到陌生的家庭乞讨，在主人沉默不语的情况下，客人开口下命令是不恰当的。譬如比库去拖钵，只能默默地站在人家家门口，等主人看到后主动地邀请并供养食物。不能站在门口问：“有吃的吗？”这是不恰当的，比库是不能这样托钵的。同样，在眼门这个家庭里，当转向心等本身没有强烈的贪、瞋、痴随眠时，作客的速行心有强烈的贪、瞋、痴是不恰当的。应当如此就因缘的情况来了解无痴正知。"],[27,1887,2039,0,"也就是说，当眼识里的想蕴（想心所）、领受的想蕴、推度的想蕴、确定的想蕴与贪相应或与瞋相应，后面的速行自然就会有贪、瞋、痴。虽然眼识、领受、推度是果报心，果报心不造业，在看到这个颜色时，只是如实看到并识知这个目标。但识知这个目标，要依靠曾经对这个目标所做的标记。如果过去的标记本身带着对所缘的贪著，比如“我喜欢看帅哥”，帅哥这个形象一出现，过去的标记就是“我很喜欢”，所以看到帅哥时，虽然是果报心，并没有生起贪，但是那个想蕴已经出来了，对所缘的贪或瞋已经隐藏在里面了。“这个中年油腻男，我很讨厌！”中年油腻男的出现是你的果报，看他时，果报心并没有造业，但是你的果报心里已经呈现出“这是一个中年油腻男”的想蕴标记，那么接下来的速行心，你就会讨厌这样的目标，指的是这个意思。如果你的“家”里都是贪、瞋、痴，来的客人就会跟着一起贪、瞋、痴。从因缘的角度应这样来看。"],[27,2039,2211,1,"以前的课程讲到：果报轮转、烦恼轮转和业轮转，速行是业，眼识、领受、推度是果报，所有的随眠是在确定心里产生作用的。过去的三颠倒（确定心里的想蕴）出现，如果对果报（前面出现的目标）的认知是三颠倒的，那么确定心里的胜解心所就会把目标颠倒地胜解，颠倒地胜解导致非理作意，七个不善的速行心紧接着生起。这是从烦恼轮转和三颠倒的因缘角度来看。第三，《注疏》说：要从短暂的情况来认知五门心路过程中的速行心。在眼门里，接近确定心的那些心及其相应心所生起之后在当处就坏灭（即生起当下就灭了），它们不会彼此相见——推度心生起来就灭了，确定心生起来就灭了，速行心生起来就灭了，速行心与确定心是见不着面的，这些心是很短暂的。《注疏》并且比喻：就像一户家庭都染上了瘟疫，其他人都死光了，只剩下一个垂死的人，他也快死了。那个时候，那垂死之人不会、也不适合去享受跳舞、唱歌等欲乐。同样地，在眼门里，当转向等心及其相应心所都死在它们生起的地方之后，剩下的不久也将要死的这些速行心就不适合以“我去贪！我去瞋！”这种方式取乐。什么意思呢？"],[27,2211,2331,1,"就是当你有观智时，看到这些心一个一个生起刹那就灭去，极其快速地生灭，你观察不到有个心是“这个目标我该贪”。心只是依照心的定则，以相应的能知一个一个心地去识知目标，生起来就灭掉、生起来就灭掉。不会像一个垂死之人还想去贪、还想去瞋一样。这需要有很强的观智能力，一般人无法体会。这是从短暂的角度来理解。最后，应当思惟蕴、处、界、缘，来了解无痴正知。在这里，眼根与可见的颜色属于色蕴；视觉属于识蕴；与视觉相应的感受属于受蕴；摄取印像（取这样的颜色目标形成印像，像拍照一样形成了印像）属于想蕴；触、思等心所属于行蕴。因此向前看或向两边看只是五蕴的结合。"],[27,2331,2473,0,"在此应思考：如果有观智，就可以这样来看五蕴的运作；如果还没有观智，人们总是把五蕴当成我——邪见或有身见（二十种萨迦耶见）。“五蕴为我”，当看到东西时，你觉得“有眼睛，眼睛是我的，我这个眼睛很好，我看到了颜色”。当你以眼睛为我时，就是以色为我；看到这个物品“我感觉很舒服”，我在感觉舒服——受是我，就是以受蕴为我；看到这个物品“这个东西我曾经看过”，这个我是能够记忆的，我是能够用记忆来认知新东西的——认为这是我，就是以想蕴为我；“我的视觉很好，我的眼睛看得很清晰，我有这样的能力，只有我才有这样的能力”——就是以识为我；“这样的颜色我是这样来看的，我认为如何如何”——这是行（包括刚才讲的触、思等，与贪、瞋、痴一起生起的其他所有心所）为我，就是以行蕴为我。虽然我们学佛了，知道五蕴非我，但是在还没有观智时，每时每刻仍是以五蕴为我。"],[27,2473,2590,1,"但至少应该训练，当看到了，首先应有益正知——“我这样看有益吗？”；“我这样看适宜吗？”——适宜正知；“我应该以什么样的心来看？”比如看到帅哥了“我要用三十二身分来看”——行处正知；无痴正知——“我生起这样的看，我的眼睛看这颜色有没有五蕴为我？如果以五蕴为我就是邪见”。若能把它拆了，至少从理论上来讲是有智慧的，有思慧，生起的是一个智相应的心，虽然不是观智的心，但也是智相应的心。平常应这样保持正知。如此观察之后，会想：“到底是谁在看呢？”如果有观智就能清楚地看到眼识生起时那个心识刹那中所有的五蕴。然而，如果没有转向心先生起，眼识就不能生起。再者，一旦眼识生起，领受心、推度心、确定心就必定会跟着生起。如果那颜色是一个很强的目标，那么在确定心之后一定有七个速行心相继地生起。如果那颜色是极强的目标，那么在速行心之后有两个彼所缘会生起。必须以观照眼识心识刹那的五蕴同样的方法来观照转向心、领受心、推度心、确定心、每一个速行心、每一个彼所缘这些心识刹那的五蕴。"],[27,2590,2659,1,"对于眼门心路过程之后的每一个意门心路过程，也应该以同样的方式观照其中每一个心识刹那的五蕴。我们要根据这样的指导来学习观照每一个心识刹那的五蕴。若能如此观照，就可以说在向前看与向两边看时是以正知而行。从究竟的意义来说，没有人在向前看或向两边看，只有五蕴相续地生灭而已。眼根是眼处；可见物是色处；视觉是识（眼识）处；感受等相应心所是法处，因此向前看与向两边看只是这四种处的结合而已。从处的角度来看，有谁在向前看或向两边看呢？同样，眼根是眼界；所看到的物品是色界；视觉是眼识界；受等相应心所是法界。向前看与向两边看只是这四种界的结合而已。在此，没有谁向前看或向两边看，这是从界的角度来看。"],[27,2659,2776,1,"眼根是眼识生起的依止缘；看到的物品是所缘，有所缘缘；相邻心识有无间缘、等无间缘、无间亲依止缘、无有缘、离去缘；同心识的心所有不离去缘；光线是亲依止缘；受等相应心所与心识一起生起，有俱生缘。所以任何一个心在向前看、向两边看时，有各种各样的因缘聚合才能生起。如此，又有谁在向前看、向两边看呢？所谓的向前看、向两边看，只有蕴、处、界、缘的聚合而已。应当如此思惟来了解无痴正知。然而，我们也必须观照其他每一个心识刹那中的五蕴、四处、四界及诸缘。对于一个还没有获得观智的人会觉得这是很困难的，事实上在止观体系里，如果有系统地实修时，其实不是那么困难。所谓“有系统地”意思是先培育足够强的、能达到安止的定力，然后彻底地观照究竟的色法。具备这两项条件之后再来修习名法，再来修习名色的变化，如此就能很轻易地了知佛陀的教导。"],[27,2776,2926,1,"对于没有观禅的人或在家人，应如何在向前看、向两边看时保持四种明觉或四种正知呢？在早期的课程里没有讲得这么细，为什么呢？因为那是前行的课。前行只是你看听嗅尝触，什么东西是有益的？对自他都有利益的才能看、才能做；对自他都是适宜的，不会生起不善法的。同样地，对于在家人或者还没有观智的人来讲，看这个问题——什么是有益呢？比如去曼听佛塔寺或法住禅林供养僧团、礼敬僧团、礼敬尊者，这是有益的，我们能看到法住僧团的清静，看到曼听寺院的美丽，这是有益的。但去之后，可能看的时候会有不适宜的情况，比如看到时“哎呦！这位小尊者长得很清秀啊！”“这位尊者长得很清秀啊！”“这位尊者长得…不那么清秀！”“这位尊者长得…怎么总觉得我不是很喜欢”，这个时候你的“看”就变得不适宜了。你是去了一个非常有益的地方，但是看得很不适宜。供养某某尊者，就生起分别心，想多看一眼或者回避，问题就来了，这就是不适宜。不能如理作意时，你的行处与念知就失去了。在实践有益的善法时，会看到引发贪欲的可喜所缘，也可能会看到引发瞋心的不可喜所缘，此时应知道：仅仅是觉知我们的业处（呼吸）就足够了。"],[27,2926,3015,0,"发现觉知呼吸还是想看，那是心都跑掉了。看到美好的事物时要修不净，作为女众看到很帅的小比库，要修三十二身分；作为男众看到清秀的西亚蕾要修三十二身分，要修不净。此时若想简单地修念知、正念正知、或专注呼吸是不容易的，除非你念知力非常强，不然不行。这个时候就要调整行处。对于无痴，同样地，可以从根（根源）、因缘、短暂的角度，以及思惟蕴、处、界、缘的角度去了解。对于向前看与向旁看应如此正知。二、屈伸肢体时的正知佛陀教导说：『屈伸肢体的时候，他以正知而行。』这里也有四种正知。"],[27,3015,3145,1,"（一）有益正知针对任何屈伸的动作，应先考虑是否有利益，然后采取有利益的动作，而不是随着念头生起就做出屈伸的动作。这称为有益正知。关于这点，一个以弯曲或伸直的手或脚长久站立的人会感到疼痛，使心无法专注。对于禅修者而言，无法获得禅那等卓越的成就。相反地，如果懂得正知地屈或伸手脚一段时间就会感到舒缓，能持续自己的禅修而获得成就。因此，应以如此的正知来了解是否有益。在修止禅时，如果感到身体任何部位有疼痛，有些老师会教：“你去注意那个疼痛，或者你默念：‘痛、痛、痛！’”对不对呢？这样做的时候，可以阻断心对痛感的排斥，减少疼痛，这是没有问题的，但是对定力的培养，就被暂停了。原来在觉知呼吸，现在转为了“痛、痛、痛”，所缘不再是呼吸而是“痛、痛、痛”。此时，专注是被中断的，无法得到持续的培养。正常来讲，修止禅的时候，一般老师都会建议：对于身体上任何部位的疼痛，都不应去管它、不要去理它。如果理它，就会越来越痛，无法忍受。如果你的心有时注意疼痛、有时注意呼吸，来回交替地转换目标，就没法培养定力，甚至会减退，妄念就会跟着跑出来。"],[27,3145,3267,0,"修止禅时，一般不建议注意疼痛，当疼痛强到难以忍耐时，应该改变坐姿。每当有人报告说：“我的腿很痛”，我就问他：“你是准备培养定力，还是准备练腿”，如果你准备练腿，就观察它“痛、痛、痛”；如果是想培养定力，在痛到无法接受时，就要转变姿势。比如有些人双盘，盘到一定程度，他说：“受不了，很痛，我只好起坐。”我说：“别起坐，双盘改为单盘。”他马上就轻松一会了，虽然原来双盘可以做一个半小时，改为单盘后，可能再过半个小时或有些人时间更短二十分钟，又开始痛起来。痛起来没关系，改为散盘，脚再放下来，发现又可以顶二十分钟；二十分钟后觉得又痛了，可以把脚前后移一下，又可以顶二十分钟；前后移完以后，又可以把脚拉上来再单盘，又可以顶二十分钟；那个时候实在是有点痛了，可以把脚拉起来放到后面去，又可以顶二十分钟；这边又痛了，拉回来换个脚再放到后面去，又可以顶二十分钟；顶到后面实在痛了，怎么办呢？把身体往后一仰，撑一会，又顶二十分钟。这样算下来，怎么算都超过两个半小时，大部分人都能坐到三个小时。“我坐三个小时实在是很困难。”"],[27,3265,3431,1,"那就是怠惰、不精进。换着各种方式，就是不起来，再不行就跪起来，不离开那个地方，用跪禅，跪禅再不行，立禅。如果把这一系列方式做下来，即使是初学者都能顶两小时，如果是老练的禅修者最少四个小时不用离开禅修的位置，轻轻松松。不要在意那个痛，这样做禅修才可以进步。所以，应这样来思考‘什么是有益的屈伸’。（二）适宜正知即使对于有利益的事情也必须考虑适合或不适合。以这个故事来说明：在斯里兰卡，在大舍利塔的平台上，当时在举办集会，大长老在最里面，随着瓦萨慢慢地往后排，后面是年轻的比库，比库后面是比库尼，比库尼后面是男居士再女居士，通常是这么排。比库尼们站在后面听，当时有位年轻的比库没有正知地伸手，结果就碰到了后面比库尼的身体，之后，他马上觉得受不了，内心充满对感官快乐的渴望，诵完经回去后就还俗了。另一位比库站着脚有点酸，他也是没有正知地随便伸脚，结果伸进火盆里，被火烧坏了脚，烧出泡来。另一位比库也是站不住了，也是没有正知地随便伸脚，结果伸到蚂蚁丘里，蚂蚁丘里有一条毒蛇，被毒蛇咬了。还有一位比库想动，觉得手没地方放，边上刚好有一个晾衣杆，他伸手一抓，结果盘在上面一条蛇咬了他的手。"],[27,3431,3576,1,"虽然是在一个很有益的地方诵经、礼敬佛塔，但是没有适宜地伸展肢体、没有正知地观照好身体的屈伸，就会照成不良的后果，这就是不适宜的屈伸。因此，屈伸也要有适宜正知。前面讲到：禅修时的疼痛，对于纯观行者来讲，是非常好的观察时机；对于修止禅，想通过观察疼痛来修止禅，只是可以延长姿势的时间，但不能提升定力，这是对疼痛的态度以及“要不要调整姿势”的适宜正知。（三）行处正知对于屈伸的行处正知，古代斯里兰卡有位大长老，他要对弟子们开示时，一般都会快速地弯起手臂，接着把手臂放回原处，然后再一次慢慢地弯起手臂，再慢慢地放回。弟子们问说：“Bhante，您为什么快速地弯起手臂，接着把手臂放回去，然后再慢慢地弯起手臂呢？”长老回答说：“各位 Āvuso，自从开始修习业处以来，到目前为止，我还不曾以不专注于禅修业处的心来弯曲手臂。因此我将手臂放回原位，然后再度将它弯起来。”他的弟子们说：“Sadhu!Sadhu!Sadhu!Bhante，我们应该像您这样学习、这样做！”在屈伸肢体时，观察完适宜，在动的时候就要回到业处上面来。"],[27,3576,3673,0,"对于修入出息的人，应该专注于呼吸，如果是在家人或只是在修习正念正知的人，要参考前面修习四界差别的方法来练习，在每一个屈、伸肢体时，都能观察身体四界的特相，如接触到物品时的四界特相，或屈伸时的四界特相，而不应在不专注于四界特相的情况下屈伸肢体，在其他动作中也都如此。对于屈伸的行处，比如爬山、打八步金刚功等，只要正念地做，有利于不同人的身体健康，对禅修是有帮助的，在《清净道论》中也列为行处。《清净道论》认为只要是对修行是有帮助的所有行为也算行处。这与前面讲到的内容就能对上了。"],[27,3673,3938,0,"（四）无痴正知在自己的名色相续流里并没有一个我在弯曲或伸直躯体动作，如此了知就是无痴正知。当我们要屈伸手臂时，应当对那只手臂修习四界差别，见到它的色聚。接着应当对全身修习四界差别，见到全身的色聚，应当分析这些色聚，照见究竟的色法，然后照见有分心，同时慢慢地屈或伸手臂，就可以观察到想要屈伸手臂的心。那个心能产生很多散播到手臂上去的色聚。我们必须分析那些色聚，它们是带动的色法，其中特别强盛的风界会产生身表，这里的身表是指屈伸手臂的动作。然后必须照见手臂的四类色法，即身体里的业生色、心生色、时节生色和食生色，它们是被带动的色法（是能带动的色法带动的色法）。照见带动与被带动的色法之后，必须观察想要屈伸手臂的意门心路过程，它包括四种名蕴——受蕴、想蕴、行蕴和识蕴，总共包括了五蕴。如果能在每个动作中都清楚地观察到五蕴，就可以说是以无痴正知而行。对没有观智的人，在屈伸时要能够观察到：当想要屈伸时，是以火界为主、风界为辅而发动起来的，当自然屈伸时，是以风界为主、火界为辅，当屈伸回复自然落下时是以水界为主，这样去观察身体的四界特相，或多或少能观察到一些，当这样去观察时，也是属于无痴的、有念的一种方式，对于没有观智的人可以这样来观照。"],[27,3938,4021,1,"今天的课学习到这，愿我们日常所有的行动当中有行处正知与无痴正知。回向功德！"],[28,0,164,0,"181 讲-摄集-摄菩提分-身念处-正知 4古源尊者礼敬尊敬的祜巴大长老！各位尊者，各位尼师大家晚上吉祥！上一堂课我们学习了身念处屈伸肢体时如何训练正知。今天学习穿著衣服时(对于出家人来讲就是穿著袈裟，对于在家人来讲就是穿著衣服)，如何保持四种正知。一、（一）出家人穿袈裟时候四种正知佛陀在经文里面讲：“持桑咖提、钵和衣的时候，保持正知”。在这里也有四种正知。1、穿衣时的有益正知第一是有益正知。这里的“益”是指我们穿衣、穿袈裟的作用。对出家人来讲每天省思四种资具，每天念诵省思文：“我如理省思所受用的衣物，只是为了防御寒冷，为了防御炎热，为了防御氓蚊风吹日晒、爬虫类的触扰，只是为了遮蔽羞处。”这样作意、理解穿衣就是有益的，如果穿衣是为了庄严、为了好看、为了炫耀，就是无益的。"],[28,164,254,0,"2、穿衣的适宜正知第二是适宜正知。薄的袈裟适合夏天穿，厚的袈裟适合冬天穿。体质较热不怕冷的人适合穿薄的袈裟，怕冷的人就要穿厚的袈裟。这些就是适宜的，相反就是不适宜的。有些人特别容易流汗，夏天身上味道很重，再穿上晴纶、的确凉的，味道就更重，穿了也会很不舒适，这就是穿衣的不适宜；《注疏》里面讲：“穿坏掉的袈裟，也是不适宜的。”因为穿坏掉的袈裟有损威仪，需要修补和缝制，如果缺乏修补和缝制的工具和材料，也是不适宜的。"],[28,254,334,0,"在古时候，丝绸，细麻等高级材料制成的袈裟，容易激发盗心，这样也会造成障碍，如果比库单独住在森林里面，这种好袈裟就可能会被偷走或者给比库带来生命的危险，这也是不适宜的；由邪命而得到袈裟（比如比库通过暗示，或者通过给在家人送东西，加强情感纽带，获得别人的供养），会使善法衰减，恶法增盛，无论如何都是不适宜的。此外，袈裟要如法割截——颜色要如法、不能太短、不能太长、要善披覆（穿著袈裟需要适宜，不能在膝盖以上、不能拖在地上） 。"],[28,334,433,1,"3、穿袈裟的行处正知第三是行处正知。行处正知就是坚持在一切时处不捨离禅修业处。你修什么业处，在穿袈裟的时候，就要坚持什么业处。如果你没有止禅业处，就要训练正知，比如对四界的了知，袈裟碰到身体的状态，身体屈伸的状态。如果没有其他业处，专注四界的特相是比较容易的，这样做也具备行处正知。4、穿袈裟的无痴正知第四是无痴正知。无痴正知就是在自己的名色相续流里面，没有一个我在穿袈裟，只是借着心生风界的扩散而有穿着袈裟的动作产生。袈裟和身体都没有思考的能力，袈裟不会知道正披在一位比库身上；身体也不会想：“我正被袈裟披着。”仅仅是一堆色法披在另外一堆五蕴上而已，就像塑像的模型，披着一块布一样，可以这样作意。"],[28,433,489,0,"穿着袈裟时也应当观照五蕴。首先观照全身的色法，接着观照有分心，以便照见想要穿袈裟的那个心流。这样的心包含四种名蕴，再加上全身的色法，总共是五蕴。然后应当对穿着袈裟修行四界分别观，见到色聚之后加以分析，以便照见其中的八种或九种色法，也就是地、水、火、风、色、香、味、食素，再加上穿着袈裟发出来的声音，有九种色法。如此照见自己的五蕴及穿着袈裟的色法之后，就会了解穿袈裟只是一堆法披在另一堆法上而已。无论是精致的还是粗劣的袈裟，都只是一堆究竟色法而已。因此，不需要因为得到精致的袈裟而欢喜，或者因为得到粗劣的袈裟而沮丧。"],[28,489,627,0,"《注疏》中讲到一个例子：有人用花环、香水、香、布等供养品礼拜有眼镜蛇居住的蚂蚁丘，还有大树。有人，则会虐待这些对像，把蚁丘挖开，砍树等等。然而，蚁丘和树木等不会因为受到礼拜而欢喜，也不会因为被虐待而沮丧。同样，比库不因为得到好的袈裟欢喜，或因为得到不好的袈裟沮丧。在这里，无痴正知应当透过如此思惟来理解。（二）在家人穿衣物的四种正知在家人穿著衣服，如何保持四种正知呢？跟刚才讲比库穿著袈裟四种正知（有益，适宜，行处或者无痴）是一样的。关键就是在家人如何能够不引发不善心。在无痴正知上，如果我们没有观智，怎么思惟业果？从比库的角度，至少可以从理念上思维袈裟是一堆色法，身体是一堆五蕴的聚合，并没有“我”在披袈裟，没有“我”觉得袈裟适合、很庄严、很有地位。在家人的角度更多，女众经常讲：“家里的柜子衣服都放不下了，有的衣服买回来三年也没有穿过一次，但是看到了还想买。”这就不是对衣物的有益省思或者适宜的省思。"],[28,627,742,0,"二、持钵时的四种正知（一）出家人持钵时的四种正知1、持钵时有益正知持钵时怎样保持四种正知？佛陀讲：“持钵要保持正知”。持钵的时候应当见到获得食物的利益，要透过不慌不忙的持钵所得到的利益、以及思惟以此托钵将得到食物，此即是生起有益正知。拿着钵是为托食物的，拿着钵的时候，要能够生起正念的善法，这是有益的。2、持钵时适宜正知佛陀时代，用钵是不容易的，身体瘦弱的人不适合用很重的钵，比如陶钵，石钵等太重的钵是不恰当的；如果钵破损严重（有四、五个地方破损需要补，难以妥善清洗）也是不适宜的；跟袈裟一样，如果钵非常靓丽，像珠宝一般，会激起贪心，也是不恰当的；没有如法熏制或者严重的褪色（比如比库拿着白钵或者并不是佛陀制定、不能作为钵的东西，或者黑钵已经退的跟白钵没啥差别） ，也是不适宜的；由邪命获得的钵以及会使善法衰减、恶法增盛，无论如何都是不适宜的。应当透过如此的解释来了解适宜正知。"],[28,742,847,0,"3、持钵时行处正知行处正知，就是持钵时坚持专注于禅修业处。如果正在修习入出息念，持钵时，应当专注呼吸，如果没有其他止禅业处，就要专注身体在持钵时四界的状态，这是行处正知。4、持钵的无痴正知持钵的无痴正知，在我们自己的名色相续流里面，并没有一个”我”在拿着钵,只是借着想拿钵的心生色法的风界扩散，才有拿钵的动作产生。在此钵不会想，手也不会想。钵不会知道被手拿着，手也不会知道正拿着钵，只是一堆法拿取另一堆法而已。正如用火钳夹取火红的器皿，应当透过如此思惟来了解拿钵时的无痴正知。在这里也必须观照五蕴， “我要拿钵”的心包含四种名蕴，能产生带动的色法，四类色法是被带动的色法。带动和被动的色法加上四种名蕴，总共是五蕴。必须对钵修四界分别，以便照见究竟色法，这些都是时节生色。如果能照见自己的五蕴及持钵的究竟色法，就能了知只是一堆法拿取另一堆法而已。"],[28,847,942,0,"正如这样的情况，在一个避护所里，有很多手足残缺的不幸受难者，他们裸露伤口，充满脓血和蛆，善心人士看到他们，送给他们绷带和罐装的药，有些受难者得到厚的绷带和像样的药罐，有些得到了薄的绷带或者畸形的药罐。他们之中没有人会由于所得到的绷带和药罐而感到欢喜或沮丧，因为他们只是要用绷带来包扎伤口，用药罐来存放药而已。现在通过无痴正知而将袈裟视为绷带，把钵视为药罐，把钵里的食物视为药，这样的比库可以是说具备了上等的正知的人。我们把袈裟视为绷带是因为身体充满了粪、虫、尿，和各种不净物；将钵视为药罐，将钵里的食物视为药，因为无论食物好吃、不好吃，它就是药而已，不应当抱怨。如果我们安乐无忧的在这里持钵、托钵、心存感恩的心、在佛陀的教法中精进修行，这样去做，无论如何，都可以做到上等的正知。"],[28,942,1005,1,"（二）在家人饮食四种正知在家人没有持钵、托钵的行仪，但是在家人有买菜、买食物、做饭等种种的事情，可以参考比库关于拿钵的行仪。我们去市场买菜是买药，而不是今天买回多少好吃的，多么有营养。买衣服就是买绷带，来把这一堆充满臭味，里面都是粪、尿、虫的东西包一下，不要让别人看了很难看。以这样的态度买东西，能遮羞就可以了，能防寒防冷就可以了。以上是在家人饮食穿衣如何保持正知。1、饮食的有益正知吃东西的时候怎样保持正知？"],[28,1005,1121,0,"佛陀讲，吃、喝、咀嚼、品尝的时候要保持正知。什么是食、饮，嚼，尝的有益正知呢？比库要思惟四种资具，关于吃食物的省思：“我如理省思所受用的食物，不为嬉戏、不为骄慢、不为装饰、不为庄严，只是为了此身住立存续，为了停止伤害，为了资助梵行。如此，我将消除旧受，并使新受不生，我将维持生命，无过且安住。”比库应当背诵这个文句，理论上来讲，每一口饭，应当都要这样省思，这样如理作意。对在家人来讲，在吃饭的时候也可以像比库一样省思，只是为了活命。2、饮食的适宜正知饮食的适宜正知。首先，无论食物品质和滋味如何，它是粗糙的还是精致，是苦还是甜等等不重要，重要的是，由于食物的时节生色会影响身体的四大平衡，吃下的食物本身的时节生色的四界会影响身体的四界。"],[28,1121,1187,0,"比如西双版纳比较热、比较湿，四界中水大特征比较强，如果再吃很多本身湿性和热性很大、会造成身体寒湿或者湿热的食物，可能就不适合，时间长了，导致身体不平衡，要懂得这些食物就是不适合的。会造成身体不舒服的食物，就是不适宜；会造成身体舒服的食物，才是适宜的。简单来讲，会让身体由于饮食而达至四大平衡、四大轻安的食物就是适合的。用邪命获得的食物，以及吃完以后，会让善法衰减、恶法增盛的食物，无论如何都是不适宜的。由正命得来的食物以及食用之后，不会使善法衰减、恶法增盛的食物才是适宜的，应该这样来省思。"],[28,1187,1347,0,"3、饮食的行处正知行处正知就是在饮食的时候，不能捨离业处。如果你在修安那般那，可以在吃饭、喝水的时候，尽量专注于入出息。如果没有业处，可以修四界差别。对于还没有稳定业处的人，如此正念吃饭：“专注身体的动作，手怎么取食物，怎么慢慢的到嘴里面，左边咬几下，右边咬几下，舌头怎么转动，分几口吞下去”，至少在这上面要能够觉知。在这个过程里，即使没有修四界差别的人，对于四界的观察也是比较容易的，一般人，修行不容易持续，如果吃饭都能把握住的人，修行持续就可以办到。4 、饮食的无痴正知饮食的无痴正知跟上面一样，在自己的名色相续流里面，并没有“我”作为取用食物者，只有借着想吃食物或者要吃食物的心生色法的风界扩散，才有以钵接受食物和伸手到钵里面的动作生成。只是借着心生风界的扩散，食物才会被捏成适当大小的食团，食团才被拿出钵外。嘴巴张开，并没有人用汤匙或机器把嘴巴打开，只是借着心生风界的扩散，食团才被放入口中。上排牙齿执行“杵”的作用，下排牙齿执行“臼”的作用，舌头的作用好比是手一样，将被磨碎的食物聚集在一起。"],[28,1347,1420,0,"如此口中的食团在舌尖与稀薄的唾液混合，在舌根与浓稠的唾液混合，在下排牙齿‘臼’里被舌头翻搅，被唾液湿润，被上排牙齿‘杵’细细的研磨。这样的食物并没有被任何人用勺子、或汤匙放进胃里，而是借着风界的作用在向前推进。在胃里没有人用草席把吞进来的食物接住，只是由于风界的作用，食物才进入胃中，没有人在胃里面用火炉生火煮食物，只是借着胃里火界的作用，食物才会被消化。没有人用棍子或者棒子将消化后的食物推出胃以外，推到肠子里面去，将消化后的食物排出胃的是风界作用。在这里几乎每一个阶段都是风界在起作用。动物或者人类，咀嚼、吞咽食物或者排泄粪便是一种自然习惯。"],[28,1420,1494,0,"我们必须了解风界存在于成群的带动色法中，必须照见被带动的色法。带动和被带动色法是色蕴，每个阶段中，意门心路过程，包含四种名蕴，总共是五蕴。如果在每个阶段里面，都能够照见五蕴，并且观照它们的无常、苦、无我，吃饭的无痴正知就到达顶峰。风界使食物前进，从一侧移到另一侧，并且执行翻转、粉碎、去除唾液、去除液体及排出食物的作用。地界执行承受、翻转、粉碎和去除液体的作用。水界执行湿润和保持湿度的作用。火界使吞进来的食物成熟或者消化吞进来的食物。空界作为食物进入的通道。识界了解这个正常进行的细节，应当根据这些思惟来了解无痴正知。"],[28,1494,1559,1,"应当通过以下十种方法思惟食物可厌，达成无痴正知。一． 观察获得食物很辛苦。不管是种植、制作，还是去托钵都是不容易的。二． 观察寻求食物的辛劳。三． 观察吃食物的过程。三．观察胆汁等各种分泌物的储藏所。四．观察胃。五．观察在胃里面未消化的食物，俢三十二身分的人会看到胆汁和胃中物。六．观察已消化的食物进入小肠和大肠。七．观察吃食物的后果、起的作用、产生的色法。八．观察食物以粪便的形式从肛门慢慢的排出去。"],[28,1559,1635,0,"十．观察由于食物而造成的污染。食物的可厌性观察可以参照《清净道论》。食物会造成污染，例如人要吃牛肉，牛排出来的二氧化碳（造成污染）占据最高比例。哪怕你是素食者，在植物的生长过程中，要大量使用农药和化肥，同样也是在污染环境。使用农药和化肥就会杀生，要杀死很多的虫。所以生命界是一种互害、共害的状态。有贤友不同意，说“我没有害人，我吃素。”除非你完全不吃食物，才不害，只要有吃，就有害。以上是饮食的四种正知。"],[28,1635,1785,1,"三、大小便利四种正知（一）大小便利时有益正知下面是大小便利时如何保持正知。大小便利时保持有益正知：大小便利是生理需要。该大小便利时，如果不大小便利，身体会难受。憋着，严重的，身体会出汗，眼睛会眩晕，心没有办法正定，乃至产生剧烈的疼痛。再憋肠子可能会裂开（例如肠瘘等等疾病） 。相反，如果在应当大小便时大小便，就没有这些不适的过患，痛苦疾病就不会产生。中医问诊：“排便怎么样？饮食怎么样？”排便是很重要的。（二）大小便时适宜正知大小便的适宜正知。不能够在不适当的地方大小便。对比库来讲，在不适当的地方大小便会触犯戒律。对普通人来讲，随地大小便，会破坏名声，甚至会危害生命。人和天神居住、出没的场所，包括寺院、大金塔，随地大小便是不恰当的。如果你不懂恰当的大小便，愤怒的人或者有瞋心的天神，甚至可能会伤害没有恰当大小便的人的生命。如果比库和比库尼在不适当的地方大小便，就会犯都喀达或者巴吉地亚。帕奥西亚多提到发生在缅甸的真实故事：有一所建造在森林里的禅林寺院，由于大施主很有钱，他做了很大的供养（用上等的柚木建的） ，所以寺院建得很漂亮，。"],[28,1785,1910,0,"然而，住在那里的比库不久就都死了，渐渐的就没有人敢去那个寺院住。有一天，施主又去请一位大长老到那个寺院。大长老到寺院以后，就到各个地方巡视。他发现，佛寺的附近有一颗大树，大树下建了厕所。古时代，缅甸的厕所和粪坑是不加盖的。因此那棵树下臭气冲天。西亚多就告诉施主： “你要把厕所移开，冲干净。”施主就把厕所移到适当的地方。那位大长老就搬到寺院里住，没有死，住得很安稳。有一天晚上，一位树神来跟长老讲： “槃爹！请你长期住在这里吧！我的宫殿就在这棵大树上面，以前有比库住在这里，他们在我的宫殿下面大小便，臭气冲天。其他天神来拜访我，他们皱眉头说：‘你的宫殿怎么这么臭？’让我感到非常的愤怒和羞愧，所以我就把那些比库都杀了。现在尊者您既然明白并让人们把厕所移走，我就会安心。请西亚多安心地住在这里，我一定不会杀害你，我还会保护你。”"],[28,1910,1986,1,"因此，在适当的地方大小便是很重要的。你不好意思在公共场合大小便，但上山的时候，外出、野外郊游，憋急的时候也不要在树下大小便（树神当时就可能收拾你） ；不要在植物上面大小便，草丛里面可能有蛇，也可能住着孤魂野鬼，孤魂野鬼没有办法收拾你，但是可能会跟着你。所以在缅甸的时候，我们上山，看到西亚多们很小心，如果有谁需要大小便，他们就会在山上清理出一小块地方（把草都清理掉） ，然后再做野外大小便。这是大小便的适宜正知。"],[28,1980,2047,0,"（三）大小便时行处正知行处正知，同样的不要捨离业处，或者我们俢习自己身体的四界。（四）大小便时无痴正知如果你已经俢到观禅，应当俢习无痴正知，以名色法来俢习无痴正知。在名色流里面，并没有一位大小便行为的造作者，只是借着心生风界的扩散而产生大小便的行为。就像成熟的脓疱破裂，它不需要任何意愿促使，脓自然会流出来。也像水壶装满水之后，不需要任何意愿促成，水自动会流出来。同样的，聚集在大肠和膀胱的粪和尿，被风界的力量压出体外。当然，如此排出来的粪和尿，不是那位比库的，也不是别人的。如果它们是比库的，比库应该保留着它，藏着。但事实上不是，它只是身体的排泄物而已。"],[28,2047,2180,1,"当把器皿或水瓢里的水丢弃，被丢弃的水不是器皿的，也不是别人的，只是清洁过程的一部分而已，应当借着如此的思惟来了解无痴正知，这对于普通的没有观智的人，也可以观察到。如果更细的去观察，需要在大小便利的时候，观照身体的究竟色法，身体的业生、心生、时节生、食生，这四类色法。在大小便利的时候，风界会特别强盛，要照见身体究竟色法，应当在大肠里面，特别是在直肠里面俢四界分别，你能看到只有成群的色聚而已。分析色聚能见到究竟的四种色法。其中，心生色法的风界很强盛，心生色法是带动的色法，然后对粪便修行四界差别观，你能见到粪便里面只有时节生色而已。分析色聚之后就能看到每个色聚含有八种色法，它们都是被带动的色法。大小便利的时候，也会产生六门心路过程，你能看到颜色，听到声音，甚至会闻到自己大便的臭味。这些心路过程包含四种名蕴，合起来是五蕴。如此观照五蕴，然后观察五蕴的无常、苦、无我，这是修行无痴正知。大小便利（包括心路过程产生的五蕴）都是无常、苦、无我的。《注疏》说，如此排出来的粪和尿不是你的，也不是别人的。大小便利应当如此修行。"],[28,2161,2241,0,"四、走路时正知（一）行走、站立、坐着、睡觉、醒觉、说话、沉默时保持正知经文里面讲：“行走、站立、坐着、睡觉、醒觉、说话、沉默的时候，保持正知。”前面我们学四威仪的时候谈到， “行走时比库了知我正在行走。”为什么佛陀前后两处讲行走呢？《注释》书里说：四威仪里面，“行走时，比库了知我正在行走。”的行走指长距离的行走，比如行走一个由旬、两个由旬，或者一里路、两里路。“在向前进、正返回的时候，比库以正知而行。"],[28,2241,2380,0,"”这里“向前、返回正知而行”指的是中距离的行走。中距离有哪些呢？比如说你在寺院里面行走，在经行道里面行禅。经文提到走路、站立、坐着、入睡、醒来、说话、沉默的时候以正知而行，是指很短距离的行走，或指仅仅移动一下而已。应当以这里叙述的三种方式来了解这三种行走：长距离的行走、中距离的行走、短距离的行走。《注疏》里面也提到另外一种解释方法。古时候，有位三藏大师叫马哈希瓦长老，他说一个人在经行道上行走很久之后，停下来站着内心思惟：在经行道上行禅时存在的名色法，已经在经行道那里坏灭。这是经行时候的正知。根据这个解释，我们必须以两种方式来观照名色法，也就是在行走当下和之后，都要观照。我们前面讲过说：行走时，比库了知我正在行走；向前进和返回时，比库也正知而行。都是只在行走的当下观照名色法。如此是观照当下的名色法。然而根据马哈希瓦长老的解释，“行走，站立，坐着，睡眠，醒觉，说话，沉默时保持正知”这段经文，是指走路之后，他也必须观照刚才走路时的名色法（过去的名色法） 。也就是说，当下的名色法和过去的名色法都必须被观照到。"],[28,2380,2486,0,"这与纯观修行，只是观照当下的名色法有差别。《注释》里面要求，当下的名色法和已经灭去的名色法都要被观察到。同样，一个人站着学习回答问题，或修禅很久以后坐下来，内心思惟：站立时存在的名色法，就在站立的时候坏灭了，这个人是在修行站立时候的正知。如果一个人是坐着学习或者做其他事情很久以后再躺下来，他内心思惟坐的时候存在的名色法，就在坐着的时候已经坏灭了，这也是这个人在俢习坐着时候的正知。（二）睡眠时的正知如果一个人躺着入睡，醒来之后内心思惟：睡眠的时候存在的名色法在睡眠的时候已经坏灭了，此人是在修行入睡和醒来时的正知。在这里，躺卧的行为只在心沉入有分时，才称为睡眠。躺卧跟睡眠是不同的，并非只是伸展肢体躺卧就称为睡眠。由于睡眠的时候有分心持续生起，那个时候你无法观照到名色法。因此马哈希瓦长老以这种方式解释：醒来之后你应当观照存在于睡眠时候的名色法。"],[28,2486,2548,0,"这里的行为是指身体的造作、作用等，也可以用身表、语表来表现。造成行为的法是指产生身表和语表的现象，或者说行为是转向心的双重作用。行为产生的法是由于转向心而开始的六门心路过程中的速行心——由于转向心的作用，当有分心停止的时候，心路过程就会生起。这个过程是持续发生变化的，以各种方式逐渐生起的状态。意门心路过程或者五门心路过程中的速行心是由行为产生的。因此在《阿毗达摩注释》里讲： “由于转向心生起的缘故，因而知道两种心路过程之一的速行心，或六门中每一门心路过程的速行心是产生行为的法或由行为产生的法。”"],[28,2548,2652,0,"入睡之后，产生行为的法及由行为产生的法都不会生起，那种状态称为睡眠。或者睡眠可以描述为离心路过程心进行的状态，就是有分心持续生起的状态就是睡眠，在六门心路过程生起之前以及之后，有分心发生的刹那都可以称为睡眠。这是《注疏》里面讲的，不是一般我们认为睡着了才叫睡眠。《注疏》说在两条心路中间间隔的那一串有分心，其实也是睡眠的状态。在学昏沉、睡眠心所的时候，我们可以体会到，当你做一个决定，总是犹豫，想来想去的时候，就是有行的心所。有行的心所就是昏沉、睡眠的心所；有行的状态就是昏沉、睡眠的心所来起的作用。虽然昏沉、睡眠的心所在起作用，但是它产生的作用就是让你两个心路中间有很多的有分心出现。思惟、判断的反应都比较缓慢、糊涂，也就是在心路间有分心生起的数量比较大，这也称为睡眠。因此必须注意的是，除了睡眠以外，其他时间发生的有分心，包括醒觉的情况，在《注疏》里也算是睡眠。"],[28,2652,2786,0,"（三）说话时的正知说话的时候，应该思惟声音依靠嘴唇、牙齿、舌头、上鄂以及协调声音的心的作用而生起，能在说话的时候这样去思惟，就是保持正念正知。无痴正知，首先必须观照身体的究竟色法，接着观照你想说话的名法，总共有五蕴。先观照有分心，然后发出一个声音，比如发“咔”，接着观察想要发出“咔”的心（包含四种名蕴） ，它会产生散播到声带的很多色聚。进一步分析到每一个色聚里面的八种色法，或者包括声音的九种色法，尤其要注意其中的地界。在喉咙里面有业生、心生、时节生和食生四种色法，由于风界作用，想发声的心所产生的心生色法的地界与喉咙里面声带的业生色的地界互相撞击，于是产生声音。在说话的时候，你必须清晰地照见这样的名色法。如果能如此观照，就是说话的无痴正知。有人以一段时间从事学习、讲解教理、诵念禅修业处的字词或澄清问题，然后平静下来，内心思惟说话时存在的名色法，在说话的时候就已经坏灭了，这是在俢习说话时候的正知。如此说话之时，我们观照名色法，说完话以后，你也必须观照刚才在说话时的名色法， 这是说话时候的正知。"],[28,2786,2871,0,"当有人沉默地思考教理或者自己的禅修业处一段时间后，思惟沉默时存在的名色法，就已经在沉默的时侯坏灭了。所造色的生起是说话， 所造色的不生起是沉默， 这也是在修行沉默时的正知。（四）一切处保持正知佛陀在教导《大念处经》的时候，告诉我们：“在一切的姿势、一切的行为、一切的身表语表的状态下来保持正知。”根据马哈希瓦长老无痴正知的观照方法， “正知”这个词是指在所有情况下都只限于要与正念相伴生起的正知。也就是说没有正念就没有正知。"],[28,2871,2980,0,"在《注疏》里面《分别正事论》曾经讲到：“前进时保持正念与正知，返回时保持正念与正知。”“只限于正念相伴起的正知”这句话是借着叙述正知的作用，强调正知和正念的重要性，他不只是指出正念与正知相伴而生的情况。因此圣典很明确地说：“没有正念就没有正知”，没有正念就不可能有正知。但正念并不代表一定有正知。只是正念，而没有正知，就相当于正念生起了善心，但是这个善心没有慧根，是二因的善心。事实上一个精进的禅修者如此观照存在于经行道东端的名色法在东端就坏掉了，它不会到西端来；存在于经行道西边的名色法在西边就坏灭了，不会到东边来；存在在经行道中央的名色法在中央就坏掉了，不会到两端来；行走时的名色法在行走时就坏掉了，不会在站立的时候出现；站立时的名色法在站立时就坏灭了，不会到坐着的时候来；坐着时的名色法在坐着时就坏灭了，不会在躺卧的时候来；躺卧的时候，可以如此思惟：心进入有分而入睡。醒来的时候，他立刻专注于禅修的业处。"],[28,2980,3046,0,"—— 前面的比库，就是在修行走路时候的正知。然而在入睡的时候，业处会变的不清楚，禅修者不应当让业处变得不清楚。因此，比库尽自己最大的努力在经行、站立、坐着、躺卧的时候如此观照：身体没有我，床也没有知觉，身体不会有一个“我”想：“ ‘我’躺在床上。”床也不会知道：“有一个身体躺在床上。”当他一再思惟无知觉的物质肉体躺在无知觉的床上，心就进入有分，醒来之后他立刻专注业处。—— 这样的比库是在修行睡眠时候的正知。"],[28,3046,3207,1,"躺卧的时候，很多人躺在床上翻来覆去如烙饼，因为他胡思乱想、想七想八。如果在平常还没有上床睡觉之前，能够正念正知，知道自己身体的动作，在躺下来的时候知道有一堆这样的身体。这样的身体他是没有知觉的，他躺在床上，床铺也是没有知觉的，决意进入有分。对睡眠来讲，让你的心决意进入有分是很有效的。我们一般建议或者鼓励修止禅的人，在禅那中睡觉。事实发现，大部分禅修者都可以做到，当然四禅会比较舒服，因为初禅不容易入睡。建议证得四禅以后，在四禅里面入睡。在四禅里面入睡，睡眠会很安稳、很舒适，醒过来精力很充沛。醒过来再查一下禅支，这样定力就会持续的、稳定的进展。更重要的是临终的时候就比较有希望，保持禅那去梵天界，所以鼓励大家禅修的时候，在一切时处都专注禅修业处，能够入禅睡觉。佛陀最后说：“如此，或于内身随观身而住，或于外身随观身而住，或于内外身随观身而住，或于身随观生起之法而住。或于身随观坏灭之法而住。或于身随观生起坏灭之法而住，他现起有身之念，只为了更高的智慧和正念。他无所依而住，亦不执取世间的一切。诸比库！"],[28,3206,3323,1,"比库乃如此于身观身随观身而住。我们通过这四节课，学习了佛陀教导的七组修习正知的方法。这七组俢习正知的方法，只是俢习的第一个阶段。刚才念的这段经文，是佛陀教导的第二个阶段和第三个阶段。（五）俢习正知的第二阶段修行正知的第二个阶段是什么呢？如此，安住于观照内在的身为身，安住于观照外在的身为身，安住于观照内在与外在的身为身。这里的身指的色身和名身，就是身体的二十八种色法，以及名身（所有的心、心所、心路） ，也就是色法的群体和名法的群体，换句话说就是五蕴。"],[28,3323,3381,0,"在这里，佛陀说：“你必须观照内在的五蕴和外在的五蕴，以及在一次禅修里面交替地观照内在与外在的五蕴。内在的五蕴就是我们身体的五蕴，就是自己五蕴；外在的五蕴就是坐在禅堂外面的其他人的五蕴；以及以你禅定力的智慧照见三十一界生命的五蕴。—— 你要能够如此观察。没有修四界差别、没有俢习到究竟名色法的人，就没有办法系统看到五蕴，没有看到五蕴，就不符合佛陀在《大念处经》里的教导。（六）俢习正知的第三阶段接下来佛陀开示俢习正知的第三阶段。"],[28,3381,3487,1,"“他安住于观照身的生起现象，安住于观照观身的坏灭现象，或安住于观照身的生起与坏灭现象。”在这个阶段，禅修者必须观照因缘的生灭和刹那的生灭。首先，禅修者应当照见无明、爱、取、行、业五种过去因，然后观照由于这五种因生起，所以果报五蕴生起（识、名色、六入、触、受） ，这是因缘生。所以在这里讲到“安住于观照身的生起现像……”如果没有对照《注疏》 ，就会以为只是看到身（色法）生起灭去。然而，在这里佛陀真正要你观的是 —— 色法怎么生起来的？生起的因缘是什么？你的业生色靠什么生起来的？你的心生色靠什么生起来的？你的时节生色靠什么生起来的？你的食生色靠什么生起来的？要看因缘。更重要的是果报名色的生起之因（缘起） ，每一个果报名色（识、名色、六入、触、受）的因一定是过去的无明、爱、取、行、业，这样的观察才是观察身。"],[28,3487,3559,0,"所以佛陀在这里告诉你要观照因缘的生灭，以及刹那的生灭。还没有证得阿拉汉果之前，无明、爱、取、行、业，这五种因是不会灭的。只要没有证得阿拉汉果，任何果报出现，接下来都会对果报采取行动，不管采取的是如理作意的行动，还是不如理作意的行动，都有无明随眠潜伏在里面，一定是无明、爱，取、行、业。只有当未来证悟阿罗拉果的时候，无明、爱、取、行、业这五种因中，无明、爱、取将会完全地灭尽，行会成为唯作，业将不会留下，这是阿拉汉的唯作心。"],[28,3559,3687,0,"“要安住于观照身的坏灭现像”，这个坏灭现像是指证得阿拉汉果时，无明、爱、取、行、业五因的完全灭尽。必须观照乃至于般涅槃时，由于五因的完全灭尽，所以身（果报五蕴）灭尽，这是十二缘起支的因缘灭。观照因缘生灭之后，应当观照五蕴和五种因的刹那生起和坏灭，即刹那生灭 —— 你必须观照这两种生灭。刹那生灭与五蕴的生灭（因缘生灭）怎么来看？可以看过去（上一生）临死前成熟的临死业（这一生的令生业）。此业有一组——无明、爱、取、行、业，这是过去五因，导致现在五果（识、名色、六入、触、受）生起来，这是从五因、五果的角度，即缘起第五法的角度来观察。刹那生灭就是每个心、每个心生起灭掉，每个刹那的心生起又灭掉，每一个心生起来有它的因缘。这个因缘粗的来讲，比如眼识生起，眼识是果报识，果报识就有远因（过去业），近因是必须有目标出现，还要有眼根存在，有光明存在，你才能看到东西，这些是现在的缘，要如此观察。"],[28,3687,3798,0,"如果从整个心路来看，还要观察二十四缘相关的缘力：眼识出现是因为有所缘出现，所缘有所缘缘的缘力；眼识出现因为有眼根的存在，它有根缘的缘力，诸如此类……。24 缘你要能观照，这是刹那的生灭，是佛陀教导的第三阶段，安住于观照身的生起与坏灭现像，不是指的心和色聚（色法的生起、灭掉） ，不是修生灭随观，而是修因缘随观。（七）俢习正知的第四阶段接下来是佛陀教导俢习正知的第四个阶段。佛陀说：“或者他建立起有身的正念，只为了更高的智慧和正念“。这里是指俢习坏灭随观智以上的高级观智。在这个阶段，修行者（禅修者）只见到究竟名色法及其因的坏灭而已。坏灭随观以上的就是更高的智慧和正念。也就是到了坏灭随观阶段之后，佛陀教了第四阶段。"],[28,3798,3937,1,"接下来，佛陀继续开示：“他独立地安住，不执著世间的任何事物”，这是指观智成熟。圣道智和圣果智以涅槃为目标而生起，而且是证得阿拉汉果之后，能够独立的安住，不执著于一切五蕴。所以这句话，是从坏灭随观开始，获得更高的观智，到达纯熟的行捨智之后，一直到证得初果、二果、三果、四果的教导。“他独立地安住，不著于世间的任何事物。”是指到达了阿拉汉的阶位。佛陀在讲完身念处到正知这部分的内容后，做了如何正知的结论：“诸比库！这就是比库安住于观身为身的方法。观身为身的方法就包含了从基础的对身心的觉知，到一直证悟阿拉汉果的全过程修行。这也是以正知来修行身念处的方法。这里，正念和五取蕴是苦谛；无明、爱、取、行、业这五种苦因是集谛；苦谛和集谛这两者完全灭尽是灭谛；了知苦谛和集谛完全灭尽的八圣道分是道谛。如此精进地修行四圣谛之后，就能够到达寂静。这是致力于修行四种正知的比库证悟阿拉汉果、到达解脱的唯一之道。"],[28,3937,4032,0,"这是正知的部分。以七组内容来修习四种正知的方法，到这里就学完了。在此做一个简单的总结。佛陀说的法是“善说的，自见的，无时的，来见的，导向涅槃的，是智者们可以各自证知的。”所以，佛陀所说所有的法，最后都是导向证悟涅槃。证悟涅槃是有很清晰的次第和方法的。在佛陀教导的过程中，因为指导对像的差别，有些他会详尽的说，有些他会简略的说。在讲《大念处经》的时候，这些比库是适合修习四念处直至证悟阿拉汉果的。这些人很适合听闻四念处的俢习教法。所以，佛陀在讲四念处的时候，这些人当下就能够生起对于四念处每个阶段的体验。"],[28,4032,4141,0,"但是现在俢习四念处，我们大部分的人是没有观智的。没有观智学习四念处、学习《大念处经》，可以学吗？当然可以学。但是必须要知道，我们学习《大念处经》中的无痴正知是不合格的，因为无痴正知需要观智。但并不是说没有观智就只能随便、痴呆地做事。对于没有观智的人，应该如何修习无痴正知呢？首先至少知道什么是有益的，什么是适宜的，能有自己的行处。但修行的第一步，面对所有目标的时候，能不能停一下？不要跟着惯性走。这是修行的第一步。为什么呢？因为无始以来，我们都是跟贪瞋痴相伴的。凡是好的我们就要抓，不好的就要排斥。目标出现都是果报，接触果报的时候，触就会产生感受，而感受是果报评价体系，是为了生存和物种繁衍。"],[28,4141,4271,0,"如实地去觉知，不管是身体还是心，如实地体验果报，知道果报是这样发生。如果我们再加上好和不好，加上我们对它的取捨、评价、情感纠葛，就扭曲了果报本身所带来的信息，而使我们产生不如理作意，有贪瞋痴的身语意的行为。而有贪瞋痴的身语意行为就造作各种不善业，在未来给我们带来不善的果报，让我们的生命总是处在各种各样的苦当中。这堂课学习了有益正知。什么是有益正知？看、听、嗅、尝、触，每个当下先观察一下，别着急，先观察一下，这个东西我如果这么做，按照我的习惯性反应去做是有益的吗？如果是有益的，我这样去做是适宜的吗？至少这两步先搞明白。这人人都会，不需要观智，佛陀没有讲这需要观智。你只要有这样的心，有这样的正念正知（没有正念就没有正知） ，前提是有正念，正念就能停下来，停下来再看是不是有益？是不是适宜？如果适宜你要去做。去做的时候，你要有你的行处，你的心被保护着。如果你做事的时候，心跟着那个事情飞走了，你的心就没有被保护，没有被保护的心就没有正念，没有正念的心就一定不会有正知，这是行处起到的作用。"],[28,4271,4341,0,"对比库来讲很简单，每天吃饭、睡觉、禅修，或者做一些事物，做些服务。对在家人来讲，事情多，要做的行动太多，如果没有正知，基本上就废了。你在打座的时候“槃爹！我这个妄念很多！”妄念不多才怪！在这个基础上，能够保持我们的行处，到最后我们再来谈无痴正知。无痴正知在佛陀教导的是观智的正知，我们不容易做到有观智，那么至少我们在每个当下，在有益、适宜、行处的基础上，对身心的动作有了知。后面再学心念处、受念处和法念处，对于在家人来讲更适合。也可以把心念处、受念处、法念处作为无痴正知的一部分，这是可以修习的。"],[28,4341,4416,1,"今天的课就学习到这里。祝愿大家早日证悟阿拉汉道果，能够无取著地安住。祝福大家！萨度！萨度！萨度！"],[29,8,204,0,"182 讲-摄集-摄菩提分-身念处-可厌作意古源尊者上堂课基本学完正知的内容。佛陀将正知分成五组，五组中各包含四种正知——有益正知，适宜正知，行处正知和无痴正知。无痴正知的部分更多是对于有观智的人来讲；对于有益正知和适宜正知，是所有的佛弟子都应学会思考的；在《大念处经》的注疏中，行处正知更多地指向于日常的业处——如果你日常的业处是安那般那，就修安那般那，如果是四界差别，就修四界差别。在《清净道论》中，行处正知的范围更广泛，如何在当下所做的事情中皆是善行，或如何导向善法，都与行处正知相关。这是在家人应思考及练习的部分。"],[29,204,439,1,"一、整理日常的人事物对境，在日常中落地对正知的运用有贤友问，在家人怎么来考虑正知的问题。在家人平常遇到的无外乎就是上图这些内容，其他没列出来的可作相应比照。在此我们要明白，凡夫的见解都是常、乐、我、净，无论你是佛教徒的凡夫还是非佛教徒的凡夫。学习《阿毗达摩》近两年时间，好多同学一直在做作业，即使到现在1我们依然是很坚固的常、乐、我、净的观念，只要带着常、乐、我、净的见解，在做任何事情或与任何人交流时，必然会有障碍。首先要明白自己经常处于看一切人事物都是常、乐、我、净的习惯认知中，同样，与你互动的对方也是带着常、乐、我、净的见解。所有人，身、语、意的造作，言行、思考背后都有他的看法和见解。无闻凡夫的见解就是常、乐、我、净，都是错误的认知，而错误的认知导致在与人互动时、面对结果要直接采取行动时，就会跟着常、乐、我、净见解所形成的惯性走。因此，如果想让自己在日常生活中能训练正念正知，建议你拿个本子，把你每一天所要面对的人事物，做个概括性的整理。所涉及的人事物内容不会太多，即使是做市场工作的人，所面对的客户也只是一个群体。"],[29,438,533,0,"生活中，无外乎就是你的家人，直系亲属、非直系亲属，以及你的朋友，然后是小区保安、居委会大妈，片警等，从生活的角度来讲基本就是这些内容。工作上，无外乎上面是领导，中间是同事，下面可能有下属，对外可能是群众、客户或关系方（即供货商或合作伙伴） 。生活有了，工作有了，剩下还有什么呢？对于一个佛教徒来讲就是学修了。学修就是你的善知识、同行善友。这是人的部分，其实并不多。具体的事，无外乎就是家务事、工作上的事、修学上的事，这些事情也不会太多。"],[29,533,626,0,"物，最大的财产可能就是你有一套房子；或者你比较富有，好几套房子，还有车子。当然你不能把先生、太太、孩子当物品，那是你的家人。然后就是你的钱财、衣服、家具，都是物品。对人，每天要打交道，应该如何有四种正知？对于事，先列出有哪些事，在这些事出现时、在思考时或于未来出现时，如何有四种正知？对于物品，物品比较固定，但如果每天要买菜、上网购物等，面对物要有什么样的态度？之前都讲过了，但要落实到自己日常生活的这些内容上。对于在禅林的比库、西亚蕾、净人，就更简单些。"],[29,626,713,0,"把这些日常生活中的人事物列出来，然后思考面对这些人事物，怎样做是有益的？怎样做是适宜的？在做的时候应是一个什么样的状态？以及如何训练我们的念知？如何能够生起无痴？这样排列后，放到日常的场景，来提醒我们正念正知。当然，主要是靠对法的理解以及运用能力。上图所列内容，是为了提醒大家，并非代表我都懂。和长辈交流，就中国人而言，长辈普遍的习惯就是觉得“我吃过的盐比你吃的饭还多”。他很容易觉得“我是一个过来人”，或者认为“你是我的儿子”"],[29,713,775,1,"、“你是我的下一辈”，“你必须尊重我，你必须听我的话”。这是他的认知——“你是我儿子”（永恒的） ，“你若听我的话，我就会有快乐”，这是他常、乐、我、净的观点。如果你跟他交流时，想到他有这样的观点应怎样跟他说话才会是有益、适宜呢？可能他会有很多让你匪夷所思、无法接受的观点，怎么办？那你就要思考，要怎样做到有益。“永远不要对结果采取行动”，很多人第一下忍住了，第二下忍不住了，第三下就崩溃。和伴侣交流，同样的见解——“你是我的太太”"],[29,775,868,1,"、“你是我的先生”。对于太太来讲，或许就认为“我有情绪是正常的，你要懂得哄我”。对于先生来讲，则可能会想“我在外面很辛苦，我回来就是想休息一下，我就看电视，我就玩手机，我就玩电脑，不要跟我嘚嘚嘚，碎碎念，烦死了。”常规是这样，男人就是有这样的心态，女人就是有那样的心态，我们要思考怎样能够相互看到对方的期待。和孩子交流，就会犯长辈的那种心态，总觉得孩子是你生的，是你的财产；孩子所有的东西都会形成你的感受，你对着感受会有一种执取。孩子心里面到底想什么，你很少去思考，总觉得“我的孩子应该这样教育，我的孩子应该这样成长，我的孩子应该如此懂事” 。如果你带着这种心态跟孩子互动时，孩子可能慢慢地就越来越不跟你沟通了，乃至于跟你形同路人；如果你的孩子还会跟你吵架，那你还是幸运的；如果你的孩子已变得跟你形同路人时，你就彻底失败了。"],[29,868,969,1,"和朋友交流，朋友只是朋友，大部分的朋友都不是知心朋友，或是酒肉朋友，或是点头一笑的朋友，或是兴趣相投可结伴郊游的朋友，两肋插刀的朋友很少。朋友之间就是互相尊重、互相理解，不应随便评价对方好坏，应多看别人的优点、多随喜赞叹。和直接上司交流，直接上司就是你的领导。领导他有面对工作，他的工作必须有人去完成。真正的对于领导来讲，首先是你能够把他想做的事完成了，其次你对他足够尊重，这是基本的要求。和非直接汇报上司交流，有时候你很容易会在中间做一些不恭敬或者离间的事情，这你要观察得到。如今不是你直接汇报的，或许哪天他变成你直接汇报的上司。"],[29,969,1114,1,"和平级同事交流，要懂得尊重别人、帮助别人。平级同事间没有太多交叉，但是可能有竞争关系，对方害怕你超越他。你在这样的同事面前，怎样能够有适宜、有益正知？和下属交流，对下属要懂得关怀。你想想你的领导，你的领导对你的信任，给你的支持；你把事情做成后他给你很好的鼓励，做不成时候他对你什么态度。你对下属应该怎样去做？和客户交流，就是客户第一。“你能不能把我当第一来看”客户的角度就是这样。和对手交流，怎么样从对手那里获得学习，怎么样尊重对手而不是去诋毁、去做各种各样的设计希望对手倒掉。在与竞争对手互动的过程中，尽量不要争。只要到了争的时候，就是不善法了。事实上你面对的是企业生存或利益的问题，那就要拿出你真正的实力和优势，让别人知难而退。以什么样的方式交流，有没有正知有很大差别。"],[29,1094,1175,1,"对师长的正知，师长就是师长，要区分清楚。一个藏传堪布说，很多女众把上师当作上师、当作爷爷、当作父亲、当作丈夫、当作情人、当作哥哥、当作弟弟、当作朋友，多重身份放在一起。师长就是传道解惑，你是要透由师长去学习到你想学习的东西。师长不是一个完美的人，对师长要很客观地去看待。对师长要尊重、要有信心，信心的信是对于他讲的内容能不能真的解决你的问题。如果你觉得不能解决问题就远离他，不要绕在情绪里面。对同道的正知，同道就是同行善友，怎样从同行善友那里获得激励、获得分享，让我们学习进步。"],[29,1175,1238,0,"对不正见者的正知，‘江山易改本性难移’ ，他形成的不正见你很难改变。我们只能表达自己正确的观点，别人听不听没办法要求。对外道的正知，他已经是外道，就要尊重，不去批评人家。对突发事件的正知，往往突发事件的出现很容易把我们的情绪带进去，这是最考验心的稳定性的时候。突发事件出来时临阵不慌，此时的正知是：突发事件出现了，一定要让自己的心平静下来，去看到如何能够有适宜的、有益的处理方法。对情绪的正知，知道现在是在什么情绪里面。"],[29,1238,1318,0,"对身体状态的正知，随时能够了解自己身心的状态。以上这些的前提是：永远不要对果报直接采取行动。就会停得下来，会停得下来是正念，能做出正确的抉择就是正知。永远不要以结果论是非成败。用结果论是非成败时，不会去看因缘，而不看因缘就停不下来，一定跟着那个情绪走。以上只是抛砖引玉，不一定正确。建议大家在学完“正知”课程后，能够按照每天要面对的人事物应做哪些正知，做个整理，然后思考，再做一个练习的计划，这样法才能入心。"],[29,1318,1444,0,"曾经看到一篇文章说，现在在网络上讲话很困难。比如，有人说苹果挺好吃的，马上有人跟贴说：“你为什么不说香蕉很好吃呢？香蕉不是也挺好吃的吗？！”本来人家是讲苹果挺好吃的，但是他转一个话题说：“你为什么不说香蕉啊？”其实人家没有说香蕉不好吃啊。如果你说：“哎呀，水果真好吃！”他说：“光吃水果不行啊，要吃蔬菜。”你说：“学数学很重要”，他说：“难道语文不重要吗？”你说：“男主角演的很好”，他说：“那你的意思是女主角演的不好吗？”很多人在思惟上没有得到正念正知的训练、四种正知的训练，成为网络上的杠精。有个人分享他跟妈妈的互动，他说跟妈妈吵架从来没有吵赢过，她只要说一句话就可以把他怼到背过去，怼到气都喘不过来。比如，你跟她讲说“孩子应该怎样，要这么带” ，她讲：“你懂什么？你又不是专家。”"],[29,1444,1549,1,"你跟她理论，她说：“你想翻天啊，你人都是我生的。”她在生气时说：“我辛辛苦苦把你养大容易吗？你这个白眼狼。”如果你从书上、从医生那找依据给她看，她就说“你读点书了不起啊？”或者“你不要以为你懂得很多，懂那么多有什么用呢？”不然就是“要么听我的，要么听你的。你小时候不都听我的吗？你现在都不听我的，那以后还得了啊！”其实在面对你的孩子时，这些也时不时会冒出来，因为有很多很常见的强词夺理的逻辑错误。比如说“你懂什么？你又不是专家”，这种错误在哪里呢？其背后是诉诸人身的谬误——你不是专家所以说得不对。如果你想跟她说两句，“你想翻天啊”，这是诉诸人身的一个谬误，意思是说你不听话就是想翻天，所以你说的不对。"],[29,1549,1702,1,"“你人都是我生的” ，所以你什么都要听我的。这些内容，可能在跟你妈妈互动的过程中会经常碰到，但是在跟你孩子互动时，你是不是经常会有这种问题？这就涉及到说话的四种正知。这里给大家提个醒。二、可厌作意开始进入今天的课程，可厌作意。（一）可厌作意主要指三十二身分佛陀在《大念处经》中依不净观（可厌作意）来解释身念处： 『诸比库，比库思惟这个身体，从脚掌以上，从头发以下，这个身体由皮肤所包裹，充满各种不净： ‘于此身中有头发、体毛、指甲、牙齿、皮肤、肌肉、筋腱、骨、骨髓、肾、心、肝、膜、脾、肺、肠、肠间膜、胃中物、粪便、脑、胆汁、痰、脓、血、汗、脂肪、泪、油膏（膏脂） 、唾液、鼻涕、关节滑液、尿。’』三十二身分大家都很熟悉了，在网络上很容易搜到左边的身分图，也有更清晰的图像。在观察时，可以通过图像入手。对于已证得入出息念四禅的止观行者，可以清晰地看到三十二身分。《清净道论》对三十二身分有很详尽的修习方法介绍。"],[29,1702,1853,1,"网络上有一段解剖尸体的视频，由斯里兰卡圣法大长老诵经（Girimānanda sutta），用于修习三十二身分。（二）修习三十二身分可获六种利益三十二身分的修习可以带来六种利益：一、可以生起悚惧；二、可以生起大瑜伽安稳（修习的安稳） ；三、可以有很强的正念正知；四、可以获得智见；五、可以在当下获得安乐的住处；六、可以现证智慧与解脱之果，证悟阿拉汉道果。很多人看了佛陀的这段教导，以为简单地来回观察三十二身分，就可以证得阿拉汉道果。依据《大念处经》注疏中的解释，并非如此。所有道果的体证只有三门可以进入 —— 无常、苦或无我。所以从三十二身分开始，最后都要观察到名色法的无常、苦、无我。"],[29,1853,2032,1,"这些利益我们可以期待，那怎么来学习呢？（三）七种善巧的学习方法《注疏》中说有七种善巧的学习方法，对初学者适用。一、反复地念诵三十二身分（的名称） 。在禅林于早课时用巴利念诵三十二身分“Ayaṃ kho me kāyo uddhaṃ pādatalā，adho……”，对于初学者，以母语念诵也可以：头发、体毛、指甲、牙齿、皮肤……顺着念，再逆着念，念得很熟悉，甚至能够背诵，顺着背诵，逆着背诵。二、反复地记忆三十二身分。反复地记忆三十二身分是什么意思呢？就是能够对三十二身分的形像有概念，能够记住它。这个阶段只是记住三十二身分，就像刚才看到的图片里的影像一样，先大致地记住这些影像。三、依照颜色来确定各个身分。最好能够看到一些真实的身分的颜色，可以看解剖视频来确定三十二身分每个身分大致的颜色。"],[29,2032,2135,1,"四、依照相应的形状来确定各身分。就是每个身分长什么样子。五、依照其位置在肚脐的上方或下方来确定各个身分。就是它大概在身体的哪一个位置上。六、依照所占有的部位来确定各身分。刚才是位置，现在是部位的大小。比如，肝脏是所有器官里最大的，它从左边一直横跨到右边。七、依照与其他部分划分的界限来确定各身分。按此次第学习，即使没有定力能看到每一个身分，但是心里面也能清楚地呈现出这些身分的颜色、形状、位置、所占的部位，以及它的前、后、上、下、左、右是哪些身分。最后当成就三十二身分时，佛陀说，就像打开一个口袋一样，能够清楚地看到里面装满了各种豆，“这是绿豆、这是黄豆、这是红豆……”"],[29,2116,2223,1,"。同样地，当成就三十二身分时，依着佛陀的教导，可以清楚地从脚掌以上，头发以下，就像扫描一样能够同时看到三十二个身分。以上学习方法可以起到如此作用。对于初学者，可以按照这七种善巧的学习方法。这是先学习、掌握方法，还不是真正的修行三十二身分。（四）十种善巧的修行方法修行三十二身分，有十种善巧的修行方法。一、次第地观照。次第观照就是按照佛陀教导的方式来观照，头发、体毛、指甲、牙齿、皮肤……当然也有一些禅修者习惯从某一个身分开始观察，不是按着顺序。是否可以？一般我会允许，但是熟练以后、习惯以后，必须按照佛陀所讲的次第来观照。"],[29,2222,2329,1,"二、不要观照得太快。三、不要观照得太慢。快、慢由心去把握。你可以知道“三十二身分一个一个这样地观察，我的心能够平稳、舒适，感觉定力能够被培养。”什么叫做定力被培养？就是心不会跑掉，对于止禅行者来讲会感觉到定力在提升。四、排除散乱。也就是说在观察时，不要有意识地在每一个身分上去展开联想，或者让其他念头跑进来。观察三十二身分就三十二身分，不要想“这个东西很恐怖啊”，心就跟着恐怖跑掉了；或者觉得这个身分在这个位置上如何如何，学中医的人想“它起什么作用？”心就跟着跑掉，散乱了。"],[29,2299,2452,1,"五、超越概念。当你如实地看到一个身分，比如看到真实的解剖视频，你的心会对某一个身分产生某一类的排斥或执取，会认为‘这个如何如何、那个如何如何’ ，心会绕在具体的器官上。超越概念就是知道“它就是这个身分”或者“我身体上就是有这个身分，这个身分是可厌的”，心才不会对某个器官建立投射。六、逐渐去除不清晰的身分。有些人理解为“那个身分我看不清楚，暂时我就不看了”。对于某一个身分还不清楚的人，在练习时可以有一段时间接受不清晰，并非是“它不清晰，我非得把它看得很清晰”。能力还没有到的时候没有办法看得那么清晰，当你非要把它看得多清晰时心就会不舒服或者打妄想。对于不清晰的身分，可以先跳过去，这是第一步。也就是说，现在观察得不清晰的身分不要硬逼着观察到很清晰，可以观察一下，不清晰就先跳过去。但是当定力慢慢起来时，不清晰的身分最后也要看清晰。"],[29,2452,2590,1,"七、观照能导致安止的身分。次第地观察下来，有些人发现，停在某些身分上面心更安稳，能够培养禅支、培养定力，那么你可以在那样的身分里多停一段时间，让定力得到培养。八、九、十、依照《增上心经》、《清凉经》与《觉支善巧经》的教导来修行。这些经文可以自己去学习，由于时间原因没办法一部部地讲解。《清凉经》中佛陀说：『诸比库，具备六法的比库不能证得无上的清凉，哪六个呢？诸比库，这里，比库每当心应该被抑制时，那时，他不抑制心；每当心应该被策励时，那时，他不策励心；每当应该使心欢喜时，那时，他不能使心欢喜；每当心应该中捨时，那时，他不能中捨；他是下劣的倾向者与有身的欢乐者（对有身的执著） 。诸比库，具备这六法的比库不能证得无上清凉。』『诸比库，具备六法的比库能证得无上的清凉，哪六个呢？诸比库，这里，比库每当心应该被抑制时，他抑制心；每当心应该被策励时，他策励心；每当应该使心欢喜时，他使心欢喜；每当心应该中捨时，他能中捨；他是胜妙的倾向者与涅槃的欢乐者，诸比库，具备这六法的比库能证得无上清凉。』《增上心经》教导要有增上的心，是中部的一部经。"],[29,2589,2730,1,"《觉支经》教导如何平衡七觉支。以上是十种善巧的修行方法。（五）佛陀教导禅修者要清楚地看到三十二身分对于初学者来讲，从背诵三十二身分的名称开始到逐渐培养定力，或者止禅行者从入出息念四禅再来观三十二身分，无论是哪一种，禅修者都应该清楚地看到身体的三十二个部份。佛陀以譬喻来开示：『诸比库，就像一个两端开口的袋子，里面装满了各种谷类，如粳米、米、绿豆、红豆、芝麻、精米。一个视力良好的人打开袋子，检查它们，说：‘这是粳米、这是米、这是绿豆、这是红豆、这是芝麻、这是精米。’同样地，诸比库，比库思惟这个身体，从脚掌以上，头发以下，这个身体由皮肤所包裹，充满不净：‘在这个身体当中有头发、身毛、指甲、牙齿、皮肤、肌肉、筋腱、骨骼、骨髓、肾脏、心脏、肝脏、肋膜、脾脏、肺脏、肠、肠间膜、胃中物、粪便、脑、胆汁、痰、脓、血、汗、脂肪、泪液、膏脂、唾液、鼻涕、关节滑液、尿。』这里要提醒一下，肋膜不是横膈膜。根据《清净道论》 ：【 “肋膜”是分为覆蔽（膜）与不覆蔽（膜）的两种盖覆 肉。两者的“色”都是白的，如陀拘罗的布片之色。"],[29,2729,2759,1,"“形”── 即它自己所占的处所之形。“方位”──覆蔽肋膜在上方，余者 生在二方。“处所”──覆盖肋膜盖覆心脏及肾脏，不覆蔽肋膜则于全身的皮肤之下盖覆于筋肉。“界限”──下以筋肉，上以皮肤，横以肋膜的部分为限。】要看三个内容，心包膜、肾包膜和皮下膜，皮下膜只在活体中可以被观察，尸体解剖看不到。膏脂是毛孔里面渗出来的油脂，跟脂肪不同。脂肪是皮下脂肪，膏脂，如果几天没洗澡就能搓出污垢，污垢就是膏脂，身体里死去的细胞透由毛孔排出，是身体的排泄物。"],[29,2757,2831,1,"佛陀如此说之意：能清楚地看到三十二身分。这个譬喻所象征的意义：两端开口的袋子比喻由地、水、火、风四界所构成的身体；装在袋子里面的各种谷类比喻头发等三十二个身分；视力良好的人比喻定力良好的禅修者；打开袋子以后清楚地看到各种谷类比喻禅修者能清楚地看到身体的三十二身分。一般我倡导必须清晰地看到三十二身分。如果那么大块的三十二身分你的定力都看不到，那怎么能清晰地看到究竟名色法呢？所以培养定力看到自己的三十二身分是应该的、必须的。"],[29,2831,2970,1,"（六）清楚地看到三十二身分后，以三种方法继续修习能清楚地看到身体的三十二身分之后，佛陀教导以三种方法来继续修行：一、色遍。可以通过三十二身分来修习色遍。什么意思呢？现在修遍禅的人修青、红、黄、白这四种遍禅，都是透由身体的三十二身分来实现。比如，黑遍用头发或者眼球瞳孔里的黑；红遍用血液；黄遍用脂肪；白遍用白骨。如此循序渐进地修习，如果遍禅能起来，可以修习到遍禅的一二三四禅，以第四禅为基础进而修习到四无色界定，就能成就八定。二、可厌作意，修不净的方法。可以观察三十二身分的整体或某一个身分的不净，而达到初禅。对于一个已经证得安那般那四禅的人，观察每一个身分的整体或任何一个身分的不净证得初禅都是很容易、很简单的。据说过去有一位大长老名叫无畏（Abhaya）长老，他能直接以这两种方式（观察三十二身分的整体或任一身分的不净）修行三十二身分证得初禅。也就是说，透由修习三十二身分可以证得初禅的定力。"],[29,2966,3082,1,"三、四界分别观。透由三十二身分来修习四界差别，对每一个身分修习它的四界。每一个身分都是由地、水、火、风组成，地水火风十二种特相在每一个身分里面都会被观察到。这样不断地观察、观察，最后就能够成就那个身分的四界差别，看到色聚。分析色聚之后就能见到四种究竟色法，破除密集。前面在讲四界差别的详尽法时，有简单介绍过四十二种身分。这个阶段也可以用四十二种身分。因为三十二身分主要是以地界和水界为主要特征的色法（身体的部分），另外还有风界（上行风、下行风、腹内大小肠以外移动的风、大小肠内移动之风、各肢体间循环移动之风、呼吸入息与出息）和火界（体温、成熟与变老之火、发烧之火、消化之火），可以用四十二种身分修习，即修习四界差别的详尽法。"],[29,3068,3244,1,"（七）观照三种身当成就三十二身分之后，佛陀说： 『如此，他安住于观照内在的身为身、安住于观照外在的身为身、或安住于观照内在与外在的身为身。』前面讲到，反复念诵三十二身分的名称和记忆三十二身分等方法，是对于没有成就止禅的初学者所用的方法；对于已经成就了安那般那第四禅或者通过修习四界差别达到近行定的人，可以在智慧之光的帮助下轻易很清楚地看到三十二身分。能够专注三十二身分为不净而达到初禅之后，佛陀说： 『安住于观照内在的身为身、安住于观照外在的身为身、或安住于观照内在与外在的身为身。』在这里，身（kāya）是有三种：1.三十二身分；2.色身，包括色聚都称为色身；3.名身，即名法。佛陀讲「安住于观照内在的身为身、安住于观照外在的身为身」 ，就是说必须在内在和外在都能观察到这三种身。怎样才能观照呢？如果你能清楚地照见三十二身分，那时就有很强的光明会生起，这种光明称为智慧之光。在此光的帮助下，你可以将此智慧之光投向坐在你前面的或者取后面的那位禅修者，去观察他的三十二身分。一般情况下是交替着来。你观察自己的头发，觉得证得初禅了，然后去观察另外一位禅修者的头发；"],[29,3244,3389,0,"然后回来观察自己的体毛，观察对方的体毛；观察自己的指甲，观察对方的指甲……来回交叉，内外交替地观照。不能太快，不能太慢，太快有些人就会“曝光”，光太亮，就看不见身分了。当观察完一个人以后，你再取另外的人，再交替的观照他的三十二身分，观察一个再换一个，可以不断扩展出去，如此一再地内外交替观照。在观照的时候，如果光变暗了或者消失了，就要回来培养定力，比如修习安那般那四禅。当智慧之光又很强时，又可以再练习观照内外的三十二身分。慢慢地训练，可以由近到远一直扩大到全世界，向上可以扩展到天界，向下可以扩展到动物、鬼界、地狱界的生命，去观照他们的三十二身分。当一位禅修者观照外在的三十二身分为不净时，只能证得近行定，不可能证得初禅。为什么呢？因为外在的三十二身分无法像内在的能观察得那么清楚。当禅修者观照外在的三十二身分为不净，一个接一个快速地观照时，也可以明显地检查到五禅支。但禅修者如果还不熟练时，一般不会知道其实那只是近行定的五禅支而已，因为他观照得很快速。如果他像观照内在三十二身分时一样慢慢地观照（慢一点才能感知出来） ，就会了解观照外在三十二身分的定力不如观照内在三十二身分的定力那么强。"],[29,3389,3454,0,"而且观照外在的三十二身分不能长久地维持定力，而观察自己的身分，五禅支是强有力的，能够使定力维持比较长的一段时间。能够成功达到三十二身分的初禅之后，可以在初禅的基础上，逐一地对我们身体的三十二身分修四界差别。比如观察自己的头发的四界，然后看到色聚。分析色聚之后就能看到头发里的四十四种色法。应以同样的方式观照身体所有身分的四界，照见究竟色法。成功之后，也应以同样的方式观照六门，即观照眼睛、耳朵、鼻子、舌头、身体以及心脏的究竟色法。六门与三十二身分中的色法称为色身。"],[29,3454,3577,0,"然后必须观照取究竟色法为目标而生起的究竟名法，包括已经证得初禅的禅那名法。最简单的就是查五禅支，与五禅支在一起的一般都是禅那心。初禅禅那心有三十四个名法，在这个名聚里面一个个去找三十四个名法，除了心识以外相应的三十三个心所。这些名法称为名身。禅修者必须如此观照内在与外在的三十二身分，还有色身（修习它的四界差别之后看到其究竟色法） ，以及名身（所有的名法） 。到了这个程度，就相当于完成了佛陀第一段讲的： 『安住于观照内在的身为身，安住于观照外在的身为身，或安住于观照内在与外在的身为身。』接着下来，『他安住于观照身的生起现象，安住于观照身的坏灭现象，或安住于观照身的生起与坏灭现象。』这是第二个阶段。在这个阶段必须观照两种生灭——因缘生灭和刹那生灭。因缘生灭，必须观照由于无明、爱、取、行、业这五种因生起，所以果报五蕴生起，这是因缘生；然后观照到最后由于证悟阿拉汉道时五种因完全灭尽，所以在般涅槃时果报五蕴完全灭尽，这是因缘灭；合起来就是因缘生灭。下一步必须观照五种因一生起就立即坏灭（刹那灭） ，所以它们是无常、苦、无我的。"],[29,3577,3676,1,"五蕴也是一生起就立即坏灭，所以它们也是无常、苦、无我的。这是剎那生灭。作为禅修者必须如实照见到这两种生灭。这是佛陀讲的第二阶段的内容。第三个阶段，佛陀说： 『或者他建立起「有身」的正念只为更高的智慧与正念。』这是指从坏灭随观智到行捨智这些上层观智的阶段。最后佛陀说： 『他独立地安住，不执著世间的任何事物。』若能如此依照观智的次第有系统地逐步修行，有一天你的观智会达到成熟。观智成熟时，圣道就会生起。由于四种圣道智会逐步地灭除所有的烦恼，所以能够独立地安住，不执著一切五蕴。"],[29,3619,3852,1,"佛陀为三十二身分的修行法作结论： 『诸比库，这就是比库安住于观身为身的方法。』在这里，五蕴与五取蕴为目标的正念是苦谛。无明、爱、取、行、业这五种苦的因是集谛。因与果完全灭尽是世间的灭谛；涅槃是出世间的灭谛。以名色法完全灭尽为目标的八圣道分是世间的道谛；以涅槃为目标的八圣道分是出世间的道谛。合起来就是四圣谛。如此逐步地修行四圣谛之后，能够到达寂静。这就是致力于修行三十二身分的比库达到解脱的方法。学到这里就明白， ‘修习三十二身分可以证得阿拉汉道果’不是简单地对着三十二身分来回地练习就会证得阿拉汉道果。如果仅仅是背诵三十二身分或者能够对三十二身分生起厌离、生起厌恶，乃至于证得初禅，修习三十二身证得初禅是以此方式修止禅的最高成就。这仅仅是以三十二身分的不净、可厌作意而成就的定力而已，离证得阿拉汉道果还非常遥远。佛陀讲修习三十二身分能“现证智慧与解脱之果”，即证得阿拉汉道果。显然，我们必须透由三十二身分而成就的定力，然后对三十二身分修四界差别，见到究竟色法、究竟名法——即现见世间的苦谛。接着下要观察这些名法、色法生起的因（无明、爱、取、行、业）的生起以及未来所有的五蕴全部灭尽，然后渐次地修习观智，才能够证悟初果、二果、三果、四果，到达涅槃寂静。"],[29,3852,3968,0,"可厌作意的正念能带来的利益中第五点“当下的安乐住处”指什么？是指你证得三十二身分每个身分的初禅，以初禅作为你的安乐住处，初禅有寻、伺、喜、乐、一境性，可以有寻、有伺，离生喜、乐而住于初禅，其身被喜和乐所浸润、遍满。《沙门果经》里讲到有这样的快乐。三十二身分为基础的可厌作意，学习到这，需要改变的观点也已解释。三十二身分的修习所带来的利益，除了作为可厌作意所带来的六项利益，在不净随念里也会把三十二身分当作不净随念，它的作用是去除对自他身体的执取。对于已经成就安那般那四禅的禅修者，修三十二身分时，要求三十二身分必须清晰，基本上能够像佛陀讲的那样，打开口袋能很清楚地看到里面的内容。"],[29,3968,4036,0,"修三十二身分的人，如果对异性或者对自己的身体有执著，修三十二身分是很有效的。一切时处，看到一切的众生、一切的有情，只是三十二身分而已，能够迅速有效地消除对自他身体的执著。即使没有这个定力，如果能够按照七种善巧的学习方法，对三十二身分非常熟练地去把握，虽然不能够像四禅的定力那样如实看到它，但是因为反复地学习、练习，内心里很清楚地建立起对自己三十二身分的整体概念的感觉，所以一切时处你也可以现起三十二身分，对自己的、对他人的，也能有效地对治我们对身体的执著。"],[29,4036,4104,1,"三十二身分（可厌作意）部分，就学习到这里。愿大家都能够很好地修学，能够次第地证悟道果，早日解脱一切苦！回向功德！"],[30,8,414,1,"183讲-摄集-摄菩提分-身念处-界作意&九坟场不净古源尊者礼敬尊敬的祜巴大长老，各位尊者、各位尼师、各位贤友，大家晚上好！上堂课学习了不净观（三十二身分的厌恶作意），对于没有修习过其他止禅业处的人应如何修三十二身分，以及对于修习过其他止禅到达四禅的人如何修三十二身分。一、接下来学习身至念——界作意部分（也称为界差别）。界作意（一）依十二特相观察身体的四界在《大念处经》中佛陀说：『再者，诸比库，无论身体如何被摆置或安放，比库都以各种界来观察这个身体：‘在这个身体里有地界、水界、火界、风界。’』我们的身体是由地、水、火、风四界所组成。四界有什么特相呢？硬、粗、重、软、滑、轻；水界是流动、黏结；火界是冷和热；风界是支持和推动。在身体里呈现这些特相 —— 地、水、火、风之差别。"],[30,414,502,0,"禅修者可以依这十二种特相观察身体的四界。怎么观察？西亚多教导：从容易观察的特相开始，比如可以先观察风界的推动。无论从哪种特相开始，都必须逐一地观察，直到能完整地观察到所有十二种特相。举例而言，如果先观察推动，可以从身体中推动现象最明显的地方开始，比如呼吸时鼻腔内或头部内的推动、胸腔内的推动、腹部的推动。观察清楚之后，再将注意力移到身体的其他部位。这与自己的巴拉密有关，如果以前练习过四界，就很容易在身体的很多部位观察到推动；如果不能这样做到，就从最明显的地方一点点扩大，直到能够观察到全身其他部位的推动。一种特相能够从头到脚都观察清楚之后，再换另一种，直到十二种特相都能观察清楚，这是一种方式。"],[30,502,624,0,"另外一种方式，如果你已经修成安那般那第四禅，那么在每一次禅坐时都应先入安那般那四禅。从该禅那出定之后再专注于身体四界的特相，你就能很清楚地、非常容易地在全身同时观察到各种特相，因为有先前定力帮助的缘故。佛陀在《蕴品相应•三摩地经》(Khandha Vagga Saṁyutta•Samādhi Sutta）中说： 『诸比库，你们应当培养定力。有定力的比库能够如实了知诸法。』因此从四禅的禅那出定之后，将很容易、很清楚地观察到推动、硬、粗、重、软、滑、轻这些特相。能够在全身观察到推动之后，应当观察硬（一般而言从硬开始）。比如你咬一下牙齿感受硬，然后从牙齿到口腔观察硬、从口腔到整个头部观察硬......慢慢地从头到脚都观察到硬之后，应当如此逐一地观察粗、重，再修风界的支持，接着是软、滑、轻，再接下来是水界的流动和黏结。有人会把观察水界特相放在最后，因为水界完全要靠意门觉知，这在学习色法时讲过。火界的冷和热容易体会。"],[30,624,739,1,"我们必须在四威仪（行、住、坐、卧）中都如此观察。比如在一段时间修风界的推动，无论行、住、坐、卧都主要观察推动。经行时，觉知脚提起首先是火界起作用，风界为辅助，可以观察到脚提起、平推时风界移动的状态。修硬的时候，脚提起来踩在地上，硬可以被观察，乃至于全身被带动，日常也要做。在一段时间里观察每组的特相，无论你是坐着、站着、躺着，还是在行走，都这样观察。如果只是在坐禅时才观照，坐禅以外的时间不观照，除非你已经证得安那般那四禅，否则你的正念会很弱，定力也就很难稳定与迅速地提升，这样是不容易完整地修习四界。当然，非坐上观察时，可能只是一些明显的特相可以被观察到，不容易观察到完整的十二种特相。"],[30,739,831,0,"当能够在全身观察到这十二种特相，并且一再地重复。熟练之后应当将十二种特相的次第重新排列，按佛陀教导的地、水、火、风顺序（硬、粗、重、软、滑、轻、流动、黏结、热、冷、支持和推动），并且依照此次第一而再、再而三地重复观察，帕奥西亚多说“千遍万遍”。有些禅修者在修习过程中会出现四界不平衡等问题，因此最好能在良师的指导下修习。四界如果不平衡可以这样来调整：可以籍着暂时不理会过强的特相，而着重于观察与它对立的特相来达到平衡。比如当你感觉身体中的硬太强烈时，觉得身体会僵硬，感知重的特相明显，觉得自己好像跟大地冻在一起，这时不要再注意硬，而只注意身体的柔软，很快就可以平衡。"],[30,831,976,0,"同样地，在必要时应以同样的方式来平衡其余的五对特相，如：粗与滑、重与轻、流动与黏结、热与冷、支持与推动。如果黏结太多，你会感觉身体被捆住、绑起来一样；如果太注意热，浑身会燥热，太注意冷，会冷到发抖；支持太强也会像黏结一样感觉紧绷，推动太多就会晃动。大部分禅修者的问题是硬、粗、重太强，强到身体完全不能动，无法忍受，那时可以暂时先不观照硬、粗、重，而只专注于软、滑、轻，就能调过来。在此需说明：硬与软其实是相同的特质（都是地大），只是程度不同而已。举例而言，比如看到一团棉花，当你用手去触摸它时，会觉得很柔软；但是如果你仔细地、用力地捏它，能感觉到一定程度的硬。如果把棉花搓成很细的一团，你会发现棉花其实很硬。硬的程度弱时称为软；硬的程度强时称为硬。同样地，粗的程度弱时称为滑；粗的程度强时称为粗。它们是一体的两面。同样的原则也适用于其余四对特相。所以，即使只观察软、滑、轻也已经足够，它们其实就是地界；或者只观察硬、粗、重，也是地界。后面会讲到观察色聚，在每一个色聚里，只能同时观察到软滑轻或硬粗重，不可能同时观察到硬粗重、软滑轻。"],[30,976,1099,1,"（二）修习四界达到平衡可以提升定力当如此修习之后，四界就会达到平衡（不会有某种特相太强），那时定力就会提升。当能够快速地从头到脚观察十二种特相（帕奥西亚多要求‘一分钟内大约二至三转’）之后，就可以改为整体地观照全身的十二种特相，就好像从头顶向下遍观全身（如扫描一样），或者从背后向前遍观全身一样。这时候不用去分别头、手、脚、身体，只是将注意力从上面移到下面，整体地观察，并且一心只专注于四界的特相，不去注意身体整体的概念。能够几乎同时看到十二种特相时，就可以将它们分成四组：观察到硬、粗、重、软、滑、轻时就了知它们为‘地’；观察到流动和黏结时就了知它们为‘水’；观察到冷和热时就了知它们为‘火’；观察到支持和推动时就了知它们为‘风’。如此一而再、再而三地重复观照“地、水、火、风，地、水、火、风……”。观察地时，六种特相呈现；观察水时，两种特相呈现；观察火时，两种特相呈现；观察风时，两种特相呈现。要都能在身体同时觉知到。"],[30,1099,1238,0,"如此专注四界而使定力提升时，你将观察到身体只是一团四界而已。继续专注这一堆物体的四界，定力会越来越强，这堆物体会变成白色体。继续观照白色体里面的四界，定力会更强，白色体会变成透明体，那时应当继续观照透明体里面的四界，观察透明体里面的地、水、火、风（硬粗重软滑轻、流动黏结、冷热、推动支持）。定力更强时，透明体会越来越亮，放出光明。此时的定力，已经接近于修四界差别可获之定力的顶级——近行定。佛陀以譬喻来解释：『诸比库，就像一个熟练的屠夫或屠夫的的学徒，屠宰了一头母牛之后，将它切成肉块，然后坐在十字路口。同样地，诸比库，无论身体如何被摆置或安放，比库都以各种界来观察这个身体：‘在这个身体里有地界、水界、火界、风界。’』这段经文所象征的意义：屠夫在喂牛时、将牛赶到屠宰场时、绑牛时、杀牛时乃至看着牛的尸体时，他的心里还有牛的概念。直到他将牛的尸体切成肉块之后，牛的概念才消失，而肉块的概念会生起。对屠夫而言，他不会想“我在卖牛，这些人带走牛……”，而会想“我在卖牛肉，这些人带走了牛肉……”。"],[30,1238,1314,1,"同样地，对比库而言，在尚未以各种界来观察身体之前，他的心里还有有情、人、男人、女人的概念存在。然而在他以各种界观察身体之后，尤其是当他最后见到色聚并且能观察色聚里的四界之后，他就破除了密集，那时有情的概念消失，而各种界的概念在他心中生起。因此佛陀说：『无论身体如何被摆置或安放，比库都以各种界来观察这个身体：‘在这个身体里有地界、水界、火界、风界。’』禅修者好比是屠夫；有情的概念好比是牛的概念；身体的四种姿势好比是十字路口；以各种界来观察身体好比是坐在十字路口摆置切好了的牛肉块。这是经文的象征之意。"],[30,1306,1440,0,"如果能依照前述的方法不断地修行四界差别（界作意），就会观察到全身变成很明亮的透明体。持续地专注于透明体中的四界，透明体就会放射光明。那时老师会建议你注意透明体里的空间（其实是色聚中间的空界）。大部分人见到空间的同时透明体会碎开，或者有人直接看到色聚，然后应该观察单一色聚里的四界（再取每一粒色聚，看到它里面的四界）。首先应当在单一色聚里逐一地观察地、水、火、风的特相。如果无法如此观察，应该继续交替地观察全身的特相与单一粒色聚里的特相。比如先观察全身的硬，再取某一粒色聚，观察这粒色聚里面的硬，如此交替地观察很多次。成功之后应当观察单一色聚里的硬和粗，即先观察全身的硬和粗，然后再观察单一色聚里的硬和粗，如此一再交替地观察。成功之后再以同样的方式逐一地增加所观察的特相。如果过去生四界差别修得不理想，就要这样来修。然而，在单一粒色聚里不能同时观察到相互对立的特相。比如当你在一粒色聚里观察到硬时，就观察不到软；观察到软时，就观察不到硬。同样的情况也出现于地界的另外两对特相，即粗和滑、重和轻。如此，在单一粒色聚里，你只能观察到地界六种特相当中的三种，不是硬、粗、重，就是软、滑、轻。"],[30,1440,1505,1,"比如观察头发或者骨头，相应的单一色聚特相一定是硬、粗、重；观察肌肉、血液、唾液相应的特相，就有软、滑、轻。就水界而言，为了容易了解的缘故我们说它具有流动与黏结这两种特相。事实上黏结是水界的现状，只有流动才是它的特相。因此你可以在单一粒色聚里同时观察到流动和黏结。就火界而言，它具有冷和热这两种特相。在一粒色聚里无法同时观察到这两者，只能观察到其中之一而已。如果观察到热就不能观察到冷；如果能观察到冷就不能观察到热。冷与热是相对的特相。（当然也与自己的定义相关。）"],[30,1505,1595,0,"关于风界，支持是它的特相；推动是它的作用，因此可以在单一粒色聚里同时观察到支持和推动。如此，在单一粒色聚里最多只能同时观察到八种特相。比如硬、粗、重（或软、滑、轻）、流动、黏结、热、支持和推动。禅修者必须不断地观察各个色聚里的八种特相，也就是观察各个色聚里的四界。色聚可以分成两大类，即透明的和不透明的（明净色聚和非明净色聚）。对于六门（眼睛、耳朵、鼻子、舌头、身体、心脏）里的两类色聚，必须像上述那样同时观察到里面的四界。当你能够在单一粒色聚里同时观察到四界时，就会生起强而有力的定。所以修四界差别，破除色聚密集的过程本身，也是在提升定力 —— 《义注》称这种定为近行定，而《复注》里称为刹那定。"],[30,1595,1672,0,"为什么《义注》和《复注》的说法不同呢？帕奥西亚多说《义注》的解释法是一种隐喻。当你能专注于单一粒色聚中的四界时，你的定力强度与近行定的定力强度很接近，所以《义注》方便地说那是近行定。事实上，真正的近行定非常接近于禅那，它只发生在禅那生起前的那个心路过程里。在近行定之后，禅那必定会生起。然而就四界差别业处（界作意）而言，无论你如何精进地修行，都不能到达禅那，所以我们不能说这个定（四界差别业处的定）是真正的近行定，所以《复注》解释为刹那定。比如看到“透明体”，专注于“透明体”，不能说它刹那刹那地灭去，它会有一段比较稳定的定。"],[30,1672,1752,0,"当你能专注于某一粒色聚里的四界时，既是以界作意来修行止禅的最后阶段，同时也是以界作意开始修观禅的开始阶段。所以界作意（四界差别）既是止禅的业处，也是观禅的业处。当熟练于观察单一粒色聚里的四界之后，进一步应当同时观察色聚里的所造色，即颜色、香、味、食素等。能够观察到四界（四大种色）和所造色时，就可以说你已经照见究竟色法，那时已破除三种色法的密集（1.相续密集、2.组合密集、3.作用密集或称为功用密集）。"],[30,1752,1850,0,"通常当初学者开始能整体地观察全身的四界之后，渐渐地，他会看不到自己的身体，而只见到四界的密集体，那时他还没有破除密集。只要他还没有见到色聚，就还有男人、女人、众生、父亲、母亲、我、你、他等概念的想。如果有系统地修学，他将见到内在和外在都只是色聚而已，那时有情想、众生想会暂时消灭。为什么？因为他破除了所谓‘众生、有情’这一团名色的相续密集，只是看到色聚微粒而已，不见任何众生存在。前面讲过，相续密集更深一步，看到每一粒色聚里的时节和食素在其他色聚的食素和时节的支持下，会产生很多代的新生色聚，由于这些相续的过程无法观察到，所以你会觉得这个众生从这一刻到那一刻是一样的，从昨天到今天是一样的。实际上，当你能如此看到时，你会发现相续是刹那刹那的发生。"],[30,1850,1950,0,"然而色聚并非究竟色法，必须进一步分析色聚，以便照见里面的地、水、火、风、色、香、味、食素等，至少八种色法。当能如此观察到每一粒色聚里最少的八种色法时就破除了组合密集。再进一步，可以破除功用密集。每一粒色聚里至少含有八种色法，每一种色法各有不同的作用，比如地界有承载的作用，与水界的黏结作用不同。要破除作用密集，必须观察每一种色法的特相、作用、现起、近因。依据《清净道论》的要求，若能破除这三种密集，就可说是彻底地照见究竟色法。这种智慧是纯观行者在修习观禅时必须先证得的。有些贤友问，纯观行者跟止观行者有什么差别？对于‘纯观行者’的理解，在现代有很多不同的角度，如果严格按照《清净道论》和《清净道论大疏钞》来讲，纯观行者必须如前所述，能够彻底地照见究竟色法和名法。"],[30,1950,2046,0,"（三）修习界作意可以培育观智针对这一点，佛陀教导界作意说：『诸比库，犹如熟练的屠牛者或屠牛者的学徒，杀了牛并切成肉片之后，坐在四衢大道。同样地，诸比库，比库如其住立，如其所处，以界观察此身：‘于此身中，有地界、水界、火界、风界。’』那时，他不见有人、我、众生、男人、女人等，而只见到究竟色法而已。能如此照见之后，进一步应当如何修行呢？佛陀在《大念处经》中说：『如此，或于内身随观身而住，或于外身随观身而住，或于内外身随观身而住。』内身、外身并非指我的身体、你的身体，这两种身（kāya）包括色身和名身，也就是说内在的名身、色身和外在的名身、色身都要观察到。因为只观照色法为无常、苦、无我不足以证悟涅槃，还必须观照名法为无常、苦、无我。观照内在的名色法之后，还必须观照外在的名色法。为什么呢？因为我们不只执著内在自己本身而已，也执著外在他人：我的先生、我的太太、我的孩子、我的母亲。"],[30,2046,2137,1,"如果只能观察自己的究竟名色法为无常、苦、无我，而不能观察众生（特别是亲人）为无常、苦、无我，就很难去除一切的渴爱、骄慢、邪见等烦恼。所以必须观照内外的名色法都是无常、苦、无我。根据观智的层次，以上说的内身观、外身观是指第一种观智，称为名色分别智。接着佛陀说：『或于身随观生起之法而住，或于身随观坏灭之法而住，或于身随观生起、坏灭之法而住。』这阶段包含三种观智：1. 缘摄受智：观照名色因果的智慧。2. 思惟智：观照诸十一种名色法无常、苦、无我三相的智慧。3. 生灭随观智：观照行法的生灭为无常、苦、无我的智慧。在此必须观照究竟名色法的因,主要是你过去世所造的无明、爱、取、行、业。然后观智过去五种因与今生五蕴之间的因果关系，这种智慧称为缘摄受智。接着应当观照因和果都是无常、苦、无我的，这种智慧称为思惟智。"],[30,2137,2236,0,"然后必须观照因缘生灭与刹那生灭以培育生灭随观智。由于五种因生起，所以五蕴生起；由于五种因完全灭尽，所以五蕴完全灭尽；这是观照因缘生灭。同时，五种因及五蕴都是一生起就立即坏灭，因此它们都是无常的，这是观照刹那生灭。有禅修者问：“为什么究竟名色法都是一生起就立刻坏灭呢？”佛陀在《相应部•外因无常经》中说：『诸比库，色是无常的，造成色的因与缘也是无常的。诸比库，由无常的因缘所造成的色怎么可能是常的呢？』色生起的因缘是无常的，所以色也是无常的。举例而言，在过去生中你造下无明、爱、取、行、业这五种因，其中的无明、爱、取这三项是缘，行和业这两项是因。如果能修行缘起法，你就会清楚地看到它们一生起之后就立即坏灭，因此它们是无常的。既然因和缘都是无常的，它们所造成的果怎么可能是常的呢？它们的果法也是无常的，因为这样的因和缘没有能力使果稳定。"],[30,2236,2362,0,"有些人说因无常所以果无常，这种说法不对，应该说只要是合和而生的法都是无常的，并非因为因无常而果无常，而是果本来是无常的。所有的果就是因缘和合产生的啊！说因无常、缘无常、所以果无常当然没有问题。有人说道智生起的缘不是无常的，所以因和缘不完全是无常的，道智本身是一个刹那的心识，一生起就灭去，它不仅仅取涅槃为所缘，还有其他很多缘，道智之前有无间缘、等无间缘……‘遍作、近行、随顺、种姓’种姓智生起初果道智才会生起，它有很多因缘、所缘缘（涅槃只是所缘缘）、无间缘、等无间缘、自然亲依止缘，各种缘，这些缘是无常的，我们说‘一千万乘以零还是等于零’，只要有一个因缘是无常的，其他一切都是无常的，这是逻辑问题不讨论。"],[30,2362,2753,1,"另外一个例子，除了结生心之外，每一个依靠心所依处而生起的心都能产生心生色法。有一些论师认为：包括死亡心也会生起心生色法。这些心一生起来就立刻坏灭，因此它们是无常的；那些心生色法也是一生起之后就立刻坏灭，因此它们也是无常的。为什么？因为心没有能力使心生色法稳定。既然因是无常的，它的果怎么可能是常的？所以因果都是无常的，这是它们的本质。当禅修者能够观照名色法时就能够很清楚地看到这一点。这不是建立在理论上的，而是要去如实知见。佛陀教导我们照见这种本质。为什么呢？因为如果见到无常的本质，这种恒常想以及‘这是我、这是我父亲、这是我母亲、这是我儿子、这是我女儿、这是我的仇人’这种错误的想、这种无明、这种认知就会消失。"],[30,2753,2837,0,"当生灭随观智成熟以后，应当修习下一个阶段，佛陀说： 『现起‘有身’之念，只是为了智与念的提升，为了更高的念与智。』清楚地照见行法的生灭之后，进一步应当只专注于行法的坏灭，不再去专注行法的生起。渐渐地，禅修者将只能看到名色法的坏灭。那时应当观照行法的坏灭为无常、苦、无我（生灭无常、苦、无我，坏灭亦无常、苦、无我）。这个阶段包含从坏灭随观智到行捨智的高级观智阶段，这个阶段都以行法的坏灭作为目标。当观智成熟时，就能以道智与果智来了知涅槃，因此佛陀开示说： 『他无所依而住，亦不执取于世间的一切。』‘不执取于世间的一切’已经是阿拉汉的道智，不执取于世间的一切才能超越生命。我们经常说‘快乐的四个阶段’，真正的快乐必须超越生命才能获得快乐。"],[30,2837,2999,0,"道智会逐步地灭除烦恼，乃至最后，他的心相续中一切烦恼全部被灭尽，所以他能独立地安住，不执取于世间的一切五蕴。然后佛陀为界作意业处作结论： 『诸比库，这就是比库安住于观身为身的方法。』如果禅修者系统地修行界作意，就能够达成佛陀教导的目标。我们应当尊重佛陀的教导，并且在良师的指导下修行界作意。二、九种坟场不净接下来学习身至念最后一部分——九种坟场不净。佛陀在《大念处经》中教导完界作意之后解释九种坟场不净，佛陀说： 『再者，诸比库，比库在坟场中见到死后经过一天、 两天或三天的被丢弃的尸体，那尸体肿胀、变色、腐烂。他拿自己的身体来和那具尸体作比较，内心思惟着： ‘确实，我的身体也具有同样的本质，它将会变成那样，如此的下场是无法避免的。’』（一）第一种坟场不净1. 概述经文中形容尸体为‘肿胀’，因为人死亡之后，尸体会逐渐地膨胀，就像鼓满风的风箱一样。‘变色’是指呈现出各种不同的色泽：肌肉隆起的部份带着红色；化脓的部份带着白色；至于以蓝色为主的部份则像覆盖着一层蓝色的面纱一样，发霉的那种状态。我们的身体得以生存是因为有命根、业生的火界，具体表现为：有命根或者说身体有温度（暖）。"],[30,2999,3094,0,"有命根、暖和心识存在时，身体才能够站立、行走或做其他事情。当这三项分离之后，所谓的身体就变成尸体。尸体有烂坏的本质，它会变得肿胀、变色及腐烂，这种下场是无法避免的。这是九种坟场不净当中的第一种。根据马哈希瓦长老（Mahāsiva）的见解，坟场不净是作为观察身体过患、苦厄、败坏的修习方法，只是把它作为过患来随观。什么是过患随观？过患随观是苦随观当中的一种。然而根据古代注疏，坟场不净（尸体的不净）也可以作为止禅业处，籍着专注尸体为不净，禅修者可以到达初禅。以专注尸体为不净来修习止禅的人必须专注同性的尸体，不能专注异性的尸体，因为可能生起贪爱而不能成就，甚至失败。"],[30,3094,3249,1,"佛陀说： 『再者，诸比库，如同比库见到被丢弃在墓地里的尸体，死后经一日、两日、三日，已经肿胀、青瘀、脓烂，他比较于此身，此身也有如是之法，如是之性，无法避免如此。』我们的身体也会这样，当然有人会说身体还未变成这样就火化了，这不是在坟场的状态。2. 如何修行坟场不净如何修习坟场不净？这里也有不同的修习方法。如果禅修者还未修成其他业处，比如没有成就安那般那第四禅，想直接通过修习坟场不净来成就定力或者成就过患作意，就必须到坟场观察尸体。对于已经修成其他业处，比如已经修成安那般那四禅的人、或者已经修成四界差别到达近行定的人，帕奥西亚多建议先转修三十二身分。成功以后再转修某一种色遍达到第四禅，然后再来修习坟场不净。因为第四禅（特别像白遍、光明遍）的光非常明亮，对于修习坟场不净非常有帮助。因此对于已经成就的人，一开始禅坐时，应当再度修习入出息念或色遍达到第四禅。当你的智慧之光很强盛明亮时，就在心中回忆（直接回忆，不用去看）过去曾经见过的尸体，选择越肿胀、越变色、越腐烂的尸体越好，然后专注那尸体为“可厌、可厌……”。"],[30,3249,3378,0,"应当依照以前所见到尸体的模样来专注，而不要去注意它随着时间而发生的变化。比如你在一年前见到那具尸体，你应当只专注于它当时的模样，不要去观察它后来的变化，因为到现在它可能已经是一具骸骨或粉碎成灰。当你有四禅定力时，可以作意一年前的那具尸体，慢慢地观察它，过一天这个尸体怎么样？过两天、过三天这个尸体会怎样？它是会变化的，如果你只是修尸体的不净就不要这样做。一心专注于当时所见尸体的影像，作意它为可厌或不净，定力提升时，你就能持续专注很长时间。为什么能这么快速地修成不净业处？因为前一个业处的禅那成为后面修习尸体不净业处的强力助缘（亲依止缘）。以如此的禅那定力为基础来修习尸体不净时，一般一座就能修成功。如果能在一座中深深地专注尸体为不净，就会生起强而有力的安止定。当你的安止定持续一小时之后，可以回头检查五禅支。首先观察有分，当尸体的影像出现在有分时，再逐一地检查禅支。能见到各个禅支之后，应当同时照见五个禅支。"],[30,3378,3497,0,"有很多同学不知道如何查有分。如果只是修遍禅或入出息念，查有分那个地方就是一团很明亮的光，就是似相，你分不出来到底是光、还是有分，还是像镜子一样。修尸体的不净时证得初禅，你的所缘是那具尸体，所以在有分里面呈现出来尸体的影像。什么是有分？能够把尸体的影像照出来、显现出来的就是有分，就像镜子一样。那时，再来看五禅支，心对似相（尸体），寻、伺、喜、乐、一境性很清楚地看到。如果修尸体的不净的目的只是想达到初禅，就无需拿外在的尸体和自己的身体作比较，只要一心专注外在的尸体为可厌就可以达到初禅。但是在《大念处经》中佛陀开示说： 『他拿自己的身体来和那具尸体作比较，内心思惟着：‘确实，我的身体也具有同样的本质，它将会变成那样，如此的下场是无法避免的。’』对于这段开示，马哈希瓦长老（Mahāsiva）解释说：“坟场不净只是作为过患随观。”对于这种观禅的不净修习要去修过患，由于坟场不净生起对自己身体不净的过患或者死亡的过患，而不仅仅为了证得初禅。"],[30,3497,3642,0,"3.两种观禅的不净佛陀教导弟子们观照内在与外在的尸体，如此能够提升观智，这种观修的方式称为无生命体的不净修习。无生命体就是已经死了，是一具尸体。前面讲三十二身分的厌恶作意是对有生命体的不净修习。也就是说厌恶作意有两种观修的方法。⑴ 无生命体的不净修习首先应当专注外在的尸体为可厌达到近行定或安止定，然后如此思惟自己的身体：“终有一天我也会死，死亡之后就像那具尸体一样。”直到能够见到自己的尸体。那具尸体已经变成你自己的尸体，应当观照自己的尸体为不净，之后再度观照外在那具尸体为不净……。先观外在以前看到的尸体，证得近行定和安止定，再把那具尸体替换换成自己的尸体，观察自己的尸体为不净，来回内外交替地观察。当这样练习熟悉以后，可以观照外在还活着的人，尤其是你所执著的人。比如你的儿子、女儿、丈夫、妻子、或者你看到的帅哥美女，经常会让你内心波动的人，内心如此思惟：“终有一天此人也会死，死亡之后就会像那具尸体一样。”那个时候你还会喜欢他吗？还想拥抱他吗？还想放到床上吗？还想跟他一起吃饭吗？"],[30,3642,3733,0,"直到在心中见到那个人的尸体，然后照见它为不净。可以如此向各个方向去观照外在活着的人死后的尸体为不净。满意之后，就进一步对那些尸体修四界差别。见到色聚之后分析色聚里的究竟色法。通常尸体中只有由火界产生的时节生色法，然而如果尸体中有各种活着的虫存在，那么就有可能见到其他种色法。虫是活体，它还有业生色、心生色、食生色。照见究竟色法之后就观照它们为无常，因为它们一生起立即坏灭；观照它们为苦，因为它们一直受到生灭的逼迫；观照它们为无我，因为在它们之中没有永恒的自我存在；观照它们为不净，因为它们一直与可厌恶的颜色、气味、肮脏的表现等混合存在。应当如此内外交替地一再观照，这是无生命体的不净修习。对无生命体的不净修习，其实是把自己（现在是有生命体的）想象成无生命体，这也是无生命体的不净修习。"],[30,3731,3853,1,"⑵ 有生命体的不净修习有生命体的不净修习分为两种：三十二身分与虫不净。① 三十二身分三十二身分前面讲过，先证得安那般那四禅，在出定以后，在智慧之光的帮助下，顺逆地观照身体的三十二身分，从头发一直观照到尿，再从尿一直观照到头发，作意它们为不净。能纯熟观照之后，就以同样的方法观照坐在自己前面的禅修者身体的三十二身分，如此内外交替观照。外在目标内在目标，不断地变换外在目标，尤其是要观照你所执著的人。可以向每一个方向观照，直到满意，然后对这些三十二身分修四界差别。见到色聚以后分析其中的究竟色法，然后观照究竟色法为无常、苦、无我、不净。这是有生命体的不净修习。② 虫不净在智慧之光的帮助下，照见存在自己身体里的虫。你可以看到自己的身体里有很多虫，特别在胃肠。有些人在胆囊、肝脏或者有病体的地方观照身体的虫。见到之后再观照身体为不净。为什么呢？因为这些虫在你的身体里面交配、排放大小便、生病、死亡，因此你的身体就是虫的家、虫的医院、虫的厕所、虫的坟场。也必须观照外在他人身体由于充满各种虫因此是不净的，如此交替观照内外身体的不净。"],[30,3853,3928,1,"满意以后再对这些虫修习四界差别，见到色聚以后分析色聚里的究竟色法，然后观照它们为无常、苦、无我、不净。修习止禅之后能够产生智慧之光，在智慧之光的帮助下就能修习无生命体与有生命体这两种不净的观察。因此禅那的光或智慧之光对止禅和观禅都很重要。有些人说可以入禅八个小时、十个小时、十二个小时，如果没有光很难转为观禅真正地修习名色法。4.观照内外的究竟名色法能够观照外在的尸体和自己的尸体之后，进一步应当如何修习呢？佛陀说： 『如此，他安住于观照内在的身为身、安住于观照外在的身为身，或安住于观照内在与外在的身为身。』在这里有三种身，1.不净身：即尸体；2.色身：即究竟色法；3.名身：究竟名法。"],[30,3928,3971,0,"在前面解释无生命体的不净修习时，已经说明如何观照不净身——尸体。当你的不净修习或坟场不净强而有力时，那样的观照就能去除贪欲，所以佛陀在《弥酰经》 （Meghiya Sutta）中说： 『诸比库，应当修习不净以去除贪欲。』 能够暂时去除贪欲之后，进一步应当转修观禅。首先应当修习四界差别，有系统地观照自己尸体以及外在尸体的四界，这样能够见到色聚，分析色聚之后就能够见到究竟色法。接着应以同样的方式观照外在的有情与无情的究竟色法，然后应当观照内在与外在的究竟名法。"],[30,3971,4094,0,"5.更高的观智阶段观照内外的究竟名色法之后，应当修习下一个阶段。佛陀说： 『他安住于观照身的生起现象、安住于观照身的坏灭现象、或安住于观照身的生起与坏灭现象。』关于这个阶段，前面已经讲过很多次，应当观照两种生灭，即因缘生灭和刹那生灭。这阶段包含三种观智：缘摄受智、思惟智和生灭随观智。然后佛陀开示说： 『或者他建立起‘有身’的正念只为了更高的智慧的正念。』这个阶段包括从坏灭随观智到行捨智这些高级的观智阶段。当这些观智成熟时，圣道智与圣果智会相续地生起，圣道智会灭除烦恼。所以佛陀开示说： 『他独立地安住，不执著世间的任何事物。诸比库，这就是比库安住于观身为身的方法。』（二）第二至九种坟场不净以上是九种坟场不净中的第一种，只是尸体肿胀的层面。接着佛陀在《大念处经》中开示剩下的八种方法。由于这八种方法间的差别只是尸体相状的不同，就不展开来讲，大致地学习这八种的方法。【二】『再者，诸比库，比库在坟场中见到被丢弃的尸体，被乌鸦、老鹰、秃鹫、苍鹭、狗、老虎、豹、豺狼及各种虫所噉食。【三】 比库在坟场中见到被丢弃的尸体， 已经变成只剩下 （一些）血肉附着的一具骸骨，依靠筋腱而连结在一起。"],[30,4094,4141,0,"【四】比库在坟场中见到被丢弃的尸体，已经变成一具没有肉而只有血迹漫涂的骸骨，依靠筋腱而连结在一起。【五】比库在坟场中见到被丢弃的尸体，已经变成一具没有血肉的骸骨，依靠筋腱而连结在一起。【六】比库在坟场中见到被丢弃的尸体，已经变成分散在各处的骨头：这里一块手骨、那里一块脚骨、这里一块脚踝骨，那里一块小腿骨、这里一块大腿骨、那里一块髋骨、这里一块肋骨、那里一块背骨、这里一块胸骨、那里一块颈椎骨、这里一块下颚骨、那里一块牙龈骨、这里是头盖骨。"],[30,4141,4192,0,"【七】 比库在坟场中见到被丢弃的尸体，已经变成贝壳色的白骨。【八】比库在坟场中见到被丢弃的尸体，已变成经过一年以上的一堆骨头。【九】再者，诸比库，比库在坟场中见到被丢弃的尸体，骨头已经腐朽成骨粉。他拿自己的身体来和那具尸体作比较，内心思惟着：‘确实，我的身体也具有同样的本质，它将会变成那样，如此的下场我也是无法避免的。’』古代印度人处理尸体的风俗是把它丢在坟场，并不加以掩埋，因此在坟场里可以见到各个阶段的尸体。现在这个时代很难找到尸体来观照，想修习坟场不净的人怎么办呢？"],[30,4192,4279,0,"如果你已经修成其他业处，就能够依照前面所说的方法来观照以前见过的那具尸体，专注它为可厌以达到初禅，然后慢慢地作意观察那具尸体后来的变化，你将看到尸体的变化过程。当你感受尸体肿胀、腐烂，被尸狗咬……这些影像出来后，你觉得那个影像是你想观察的，就把心安住在那个阶段，暂时不继续观察尸体的变化，专注那时的尸体为可厌可以达到初禅。你可以作意尸体腐败的阶段，再一个阶段一个阶段的看，这样就可以完整地修习九种坟场不净，前提是要证得四禅以后，这样就比较容易。每一个状态修习完，就可以按照前面的方法来观照内在外在的尸体，然后成就佛陀所说的 『观照内在的身为身、观照外在的身为身，安住于观照身的生起现象、安住于观照身的坏灭现象』这些阶段，最后『他建立起‘有身’的正念只为了更高的智慧和正念。他独立地安住，不执著世间的任何事物。』也就是从坏灭随观一直到圣道智生起的各个阶段。"],[30,4279,4375,0,"在九种坟场不净这一章节里，正念与正念的目标（五取蕴，如尸体）是苦谛；造成苦的五种因是集谛；苦谛与集谛都不生起是灭谛；了知灭谛的正道是道谛。如此精进地修习四圣谛之后就能够到达寂静。这是致力于修习九种坟场不净的比库证悟阿拉汉道果达到解脱的道路。佛陀说： 『再者，诸比库，如同比库见到被丢弃的坟场中的尸体，锁骨上有血、有肉、有筋腱连结，锁骨已无肉、有血所污、有筋腱连结，锁骨已无血肉、有筋腱连结着，已无连结的骨头散落各处，一处为锁骨、一处为脚骨、另一处……此身也有如是之法，如是之性，无法避免如此。』直到『无所依而住，亦不执取世间的一切，诸比库，比库乃如此于身随观身而住。』这是九种坟场不净的修习方法。"],[30,4375,4458,0,"三、身念处总结到这里为止，我们已经学习了身念处的十四种修行方法：第一种入出息念（ānāpānasati） ；第二种四威仪；第三种四种正知；第四种厌恶作意（三十二身分）；第五种界作意；剩下六到十四就是九种坟场不净。在这十四种方法当中，只有入出息念与对三十二身分的厌恶作意能够到达安止定。由于坟场不净作意在此作为过患随观，所以连九种坟场不净作意在内的其他十二种方法都只能达到近行定而已。《义注》里如此解释是根据 Mahāsiva 长老的见解来说的，但是若根据古代《义注》的解释，修习九种坟场不净可以达到初禅，事实上也可以这样做到。"],[30,4458,4634,1,"在这里必须记住一项重要的事实：修习身念处并不是只对身体或者色法修行而已。尽管身念处确实着重在观察色法，但只观照色法并不足以令你证悟涅槃，必须同时观照名法为无常、苦、无我。可以说身念处着重在观照色法，但是不能说身念处只观照色法而已。此外还须记住一点：在身念处当中，佛陀也教导止禅业处。身念处不仅仅是观修色法，止禅也包含在里面，比如 ānāpānasati 入出息念可以证得四禅，三十二身分、九种坟场不净可以证得初禅，因此在身念处中有止禅也有观禅。身念处十四种修行方法也称为身至念业处。到这里，我们已学习完《大念处经》里关于身念处的部分，希望大家有机会能够在好的老师指导下，精进地修习身念处，早日断除烦恼，证悟涅槃！祝福大家！"],[30,4542,4634,1,"回向功德！"],[31,8,398,1,"184 讲-摄集-摄菩提分-受念处 1古源尊者尊敬的祜巴大长老、各位尊者、各位尼师、各位贤友，晚上好！今天继续学习<三十七道品>四念处中受念处的部分。身、受、心、法共四念处。一、四念处与调伏者的根性开始学习四念处时曾讲过修行者分成这六种类型：钝根者、利根者、爱行者、见行者、止行者和观行者。爱行人贪爱的性格比较重，见行人见解比较多，各种分析、判断多一些。止行人可以先修止禅再修观禅，观行人在没有得安止或近行定之前可以直接修行观禅。这六种行人，在修习四念处时各有一些不同的相应业处。钝根的爱行人与钝根的止行人适合修身念处，利根的爱行人与利根的止行人适合修受念处。对于利根（根器比较利一点）者，无论是贪行人还是止行人都比较适合修受念处。在现阶段，对于自己是否利根，到底是爱行人、是止行人还是见行人，其实不容易分得很清楚。只有佛陀才能真正地给我们分清楚。总体来讲钝利之分主要是指对付烦恼的能力，当烦恼现行能够快速对治并止息的人称为利根。"],[31,377,552,1,"二、受念处（一）三种受关于受念处，佛陀教导了九种修习方法。佛陀说：『再者，诸比库，比库如何于受随观受而住呢？诸比库，于此，比库感到乐受时，了知：‘我感到乐受。’感到苦受时，了知：‘我感到苦受。’感到不苦不乐受时，了知：‘我感到不苦不乐受。’』在这里，当禅修者感到身体或心理有乐受时，他了知：“我感到乐受。”帕奥西亚多说，即使是刚出生的婴儿，在他吸奶或母亲喂奶时，及其他类似的情况，他也会感到有乐受。但是作为禅修者的了知乐受与婴儿的了知不同。之前在讲身念处的四威仪时，举例即使是狗、猫等畜生当它们行走时也知道在行走。同样地，婴儿或者牛、狗等（在吃到好吃的食物时）也知道自己有乐受。作为修行者或者比库的了知与之区别在哪里呢？婴儿或动物对于乐受及其他种受的了知不能够去除有众生存在的邪见（错误见解），不能根除我想和众生想，既不是禅修的法门，也不是培育念处的方法。并非仅仅‘知道有感受’就是修受念处。为什么呢？因为他不能了知究竟名色法、究竟名色法的因、究竟名色法及其因无常、苦、无我的本质。他还是会认为“这是父亲、这是母亲、这是我、这是他、这是男人、这是女人……”"],[31,552,619,1,"。然而，此禅修者的了知（受念处）能去除认为有众生存在的错误的见解，能根除有众生想，这才是禅修的法门，也是培育念处的方法。为什么呢？因为他能够透视究竟名色法以及它的因，并且能够观照它们的无常、苦、无我本质。而究竟名色法一生起后就立即坏灭，它们不是恒常的。没有真实存在的人、我、众生、父亲、母亲、儿子、女儿等，只有无常的名色法而已。因此，他的了知能够去除认为有众生存在的错误见解，能根除众生想，这既是修行的法门，也是培育念处的方法。"],[31,619,726,1,"这里所说的了知与身念处一样。很多人说‘觉知’、‘感知’，或者现在有很多人教导‘觉性，培养你的觉性’，依据佛陀的教导我们知道：培养觉性不是目的，要看到受是由刹那刹那的名法组成的，一团一团的概念能够被破除，以及受、受生起的因、受及其因是无常、苦、无我的，能如此看到才算是受念处。1. 谁在感受？感受是谁的？为什么有感受产生？同样地，对于受念处，《注疏》以三个问题来解释：（一）谁在感受？（二）感受是谁的？有人问‘谁在感受’与‘感受是谁的’有区别吗？‘谁在感受？’，没有众生或人在感受。‘感受是谁的？’，不是任何众生或任何人的感受。（三）为什么有感受产生？从究竟法的角度来讲，感受透过某些事物而产生，如透过色、身、香、味、触作为目标而生起。"],[31,725,896,1,"2. 只是受（受心所）在感受，没有一个我在感受。所以当比库了知在某一个可喜的、可厌的或中性的目标被具体化之后，单纯只是受在感受（受心所在感受），没有一个我在感受，因为除了单纯的法以外，没有作者或造者存在。“单纯”一词是指这个法并不是个人的。经典中说“我感受”只是以世俗的表达方式来说明那种非个人的感受。比库了知由于事物或目标的具体化，所以他体验到感受。佛陀说：『诸比库，感到乐受时，了知：‘我感到乐受。’』有些人说：“你看佛陀都说‘我’在感受，那你怎么说没有人在感受呢？”佛陀只是方便说，以世俗的表达方式来说明非个人的感受。‘只是受在感受’，在之前的课程曾讲到‘受的作用’，受是保护生命存在和物种繁衍的一种评价系统 —— 触发鼓励机制或保护机制的一种标准；如果我们体验乐受时会启动奖励机制，如果我们感到苦受时会启动保护机制；鼓励机制和保护机制的目的是为了保障众生生存和物种繁衍。对于不同的生命界在面对不同的所缘时的感受是不一样的。这与他成为这个生命、这个物种有关，而成为这个生命、这个物种又与他上一生临死前成熟的无明、爱、取、行、业有关。"],[31,896,982,1,"作为人来讲爱取作为人的生命形态（作为女人或作为男人）。然而要鼓励男人、女人物种生存和物种繁衍，就要有感受。不同的生命界，如畜生、鬼界的生命、地狱界的生命或天界的生命，对于同样的所缘其感受有很多不同。目的只有一个，就是怎样让他的生存能够有效地进行、他的物种繁衍能够有效地进行。这是之前讲过的内容。4.如何于身体的苦受修习受随观。《注疏》中讲到，以前在斯里兰卡庄严山寺，有一位长老生病了，他躺在床上翻来覆去，由于剧烈的疼痛而呻吟。这时候有一位年轻的
