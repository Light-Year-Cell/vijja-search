90,2043,0,"因为愚痴，就会贪，因为贪不到所以你有瞋，它的这个次第是这样的。比如说一个屠夫， 或者是一个捕鱼的人， 因为他不知道众生也一样也非常爱惜他的生命，他不知道无始以来我们也曾经做过这样的动物。他不知道伤害这个众生呢， 他会造下很重的杀业， 未来会对他产生不善的果报， 如果临终的时候成熟， 将会导致他去四恶趣。这个就是痴，就是无明。屠夫和捕鱼者或者打猎的人， 有那种杀戮有情的习性， 有喜欢害众生的害寻。一个有害心的人， 内心里面总是有痴， 总是有瞋、贪的这种因，它会存留在名色流里，形成欲寻、瞋寻、害寻。恼害，没有慈悲，没有悲心的人就残忍，有害心，看什么东西就想打一打，没有悲悯心。没有悲悯心的人， 哪怕他持五戒， 但是只要有一些比如说我们看到蟑螂、看到蚊子，或者作为农民看到有虫伤害他的庄稼，他依然会生气：“我知道我持五戒，不应该杀，但是我很生气，看到蟑螂难受，看到蚊子也很讨厌。"],[6,2043,2289,1,"那这个就是瞋。它虽然没有上升到那个害， 但是那个瞋始终是存在的。往往越是瞋的人，那些小动物总是要跟他相伴。那也就是说，贪、瞋、痴和无贪、无瞋、无痴呢，它是在我们日常生活中导致我们造作十不善业或者十善业的基础，它在我们心的相续流里起作用。日常生活中这个三善因， 除了这个十善业， 还有十种福德事——布施、持戒、禅修、恭敬、服务、回向功德、随喜功德、听闻佛法、弘扬佛法、正直己见。再加上自作、教他作、见作随喜，合起来它就有 40 种福德事。还有名和行——我们讲名行具足，十五种行加上名，这些都是善行，这些善行都是需要无贪、无瞋、无痴的善因来支撑。这些因， 都是与生俱来的。在我们的名色相续流里， 以随眠烦恼存在。无始以来由于无明和渴爱， 我们滋长和坚固这些善因和不善因，特别是这些不善因。善的行为呢， 我们是要训练的。不善的行为几乎不用训练，自己就会，自然而然就会，贪、瞋、痴。那这些缘力，就像我们过去这个随眠， 是透由什么东西传递下来的？是自然亲依止缘透由无间缘和等无间缘传递下来。六种心理余势里包括七随眠， 也是和这个六因相关联。"],[6,2289,2415,0,"跟过去的惯性以及今生遇到的家庭环境、 教育环境、 社会环境有关。比如说今天在座的各位， 你们就会来听闻佛法， 那么对全世界的人来讲， 在这个时间里面， 能够来听闻佛法的人非常地稀有。为什么你们会来？其他人不会来呢？是过去有熏习正法这样的业， 有这样的习惯，那么这样的力量就会让你“今天是受戒日，今天是月黑日，我们要去寺院听法。”就是冥冥之中觉得要去，这不是无缘无故的。它都是有因有缘的， 那这股力量就在你的自然亲依止缘里面， 过去熏习过善法，无贪、无瞋、无痴的因在根部里面起作用。慧心尊者说，今天去托钵， 小车拉一车回来， 满满的， 去傣族的村寨寺院就能有这样的收获。我们去一下汉族的寺院，看能不能收到这么多，这不可能，对吧。其实傣族的这个是因为他们有这样的无贪、无瞋、无痴的因，在这些民众的心里面都有这些因，他习惯看到出家人来，他就：“都比，等一下，我要供养”"],[6,2415,2509,0,"，他们以供养为乐，以供养为一个崇尚、高尚的行为。但在汉地，托钵会被看成是乞丐，乞丐是很不受待见的，很令人讨厌的。出家人乞讨，出家人不劳而获，大家会是这种心态，这是不一样的。但你为什么会生在傣族， 他为什么不能生在傣族， 这是有因的，它不是无缘无故的。我们在缅甸修学的时候，一到早上八九点钟， 满大街都是托钵的出家人，所有的在家人早早地就煮好饭、煮好菜，就在街边上等着，它是这样的氛围。因缘对我们生命很重要， 结生的时候， 你的结生名法对你这一生所有的心路过程和你心的素质有很大的影响， 因为结生心跟你一生当中所有的有分心是一种心， 对你这一生当中的基本的精神状态、 身体健康都会带来大的影响。"],[6,2509,2607,1,"结生心它又是怎么来的呢？重要的事情天天讲。是上一生临死前成熟的那个业。而所有的造业， 都是有动机的， 这个动机， 有高尚的，有平凡的，也有低劣的。都是善行，动机清净、高尚，动机不纯、或者动机含含糊糊——是被人带着的，“听说今天是伍波萨他日，我要去供养，你去吗？去吧？”“你没去过，去试试看吧，好吗？”这样的动机跟那个说“今天是伍波萨他日，是一个很殊胜的日子，我一定要去做供养，，动机就不同了。同样是做供养，但动机不同。动机不同， 会影响善心的素质， 无贪、 无瞋、 无痴三个善因力量的强弱程度。而这个三善因的力量强弱程度又会影响到你这一生结生心无贪、 无瞋、无痴的强弱程度。"],[6,2607,2720,1,"当你在造善业的时候， 如果从开始准备、 到实际去造作、 到最后回向功德这个过程， 都是带着这种很欢喜的心、 很恭敬的心、 很清净的善心在做， 那么你这一整组的业都是纯善的。而有些人去造这个善业，前面烦烦恼恼，做完也还烦烦恼恼，各种后悔，做的时候也烦烦恼恼：“你这人不配合，你这个人怎么这样啊，你怎么布施这么一点点，太丢人了”，诸如此类。同样造一个善业，但是这个善业的前后围绕着很多的不善业。这样两种布施的善业成熟的时候会有很大差别，前面那一个，前中后都是善的，当他“中善”的这个布施的善业成熟，前善和后善这些善业就以支助业支助他善业不断成熟， 所以生命中都是很顺利；如果他前面和后面都是很多不善业， 各种瞋啊， 各种追悔，各种后悔， 那么它成熟的时候， 那些不善业就会成为这个善业的阻碍业， 对于你这个果报的成熟产生各种阻碍。很多人说： “明明要赚钱，马上就到手了，忽然就没有了。"],[6,2720,2802,1,"”为什么？阻碍业挤掉了。所以做善业，一定要记住， 前善、 中善、 后善， 前面很欢喜、 很清净， 持了戒，把戒持好，然后检查自己的心，“我为什么要做这件事？这个善因带来什么样的利益？”，不管是导向涅槃的，还是正法久住，还是为了僧团的和合喜乐， 还是为了禅修的进步， 把这个理清楚， 然后用心地去做，做的时候也很欢喜。做完以后，认真地回向，很欢喜地回向。对业果有深信， 内心里很清楚我做这样的功德会有什么样的果报。不是让你去贪果报， 而是你知道有业果这样的规律， 这是智慧。贪果报的人， 其实是对业果并不清楚的人， 才会贪果报。真正对业果很清楚的人，不会生起这种贪心。他知道“我做了，果报自然会到，不问结果，只用耕耘就可以。"],[6,2802,2917,0,"这样去做， 它对你这一生的结生就会产生很大影响， 同样这样的业如果在这一生临终的时候成熟， 导致我们下一生结生的时候， 那下一生的生命就会受这个影响。二因结生就是因为他没有智慧， 没有慧根。没有慧根就是做善行的时候没有业果的智慧， 稀里糊涂地来、 稀里糊涂做完就走。大部分都是有行心，被人怂恿才做的。还有一种，是低劣的三因，也知道业果，有慧根，但是呢？就因为前面不善、后面不善， 把这组三因的业削弱得没有力量了， 变成了二因。如果本身是一个二因然后还浮浮泛泛的， 这个业如果成熟会变成无因结生， 无因善果报结生。无因善果报结生呢， 无因就像一棵树没有根， 会是什么结果呢？种在水里面的树， 它就长不大。所以无因的生命， 就是先天残疾， 五根不具， 先天的痴呆。要去知道这个因对我们生命的影响，要把握它。"],[6,2917,3016,0,"过去的， 我们已经没有办法改变了。这一生到底是殊胜的三因还是一般的三因， 无贪、 无瞋、 无痴的强弱程度， 过去的不可以改变的，有分心也不可以改变， 但是可以观察我们这一生无贪、 无瞋、 无痴心所的强弱程度。无贪强的人，对所有的物品、外在的物品不黏著、不执著、 不执取。我们观察自己对这些物品、 钱财有没有那种黏著感？举例说，只要到手的东西，随时就布施出去，任何人供养他，再小的东西都充满欢喜， 太好了！这样的人就有非常强的无贪心。我们自己看一看， 你家的那个东西你能不能布施出去？如果你觉得很容易把它布施出去，无贪心就已经很强了。"],[6,3016,3140,1,"无瞋心怎么检查呢？看看是不是经常心里各种忧受。在这里， 天天都想跟人家生气的人比较少见。天天就喜欢跟人家吵架的人就是瞋心太重， 就很缺这个无瞋的心。一些人不会天天生气， 但是他天天闷闷不乐， 内心里面各种各样的纠结， 这也是瞋。无瞋最高级的状态是慈心。我们去检查有没有经常生起利益众生的心， 就知道你这个无瞋心的强弱程度。无痴的心呢，不是在世间很聪明，数学学得很好。小学考奥数是聪明啊， 但是不是真的无痴呢？这是很难讲的。无痴， 有慧根的人， 他的特点是能透视究竟法， 像神箭手一样贯穿目标。听起来就很玄乎， 对不对？透视究竟法！现在人都看不清楚， 怎么看究竟法？！"],[6,3140,3267,1,"能清晰地、 完整地见到究竟名色法， 是要证得名色分别智， 要看清楚名色的因，则要证得缘摄受智，也就是经常讲的法住智。“先有法住智，再有涅槃智”。一定要能够看到究竟名色法和究竟名色法之间的因和缘， 你才有可能再往涅槃智去走。证得名色分别智和缘摄受智， 要有定力， 有专门的课程来训练。大部分佛教徒也没有几个人修到很好的观智。当我们还没有名色分别智和缘摄受智， 是不是就没有慧根？如果这样理解的话，就错了。慧根是有不同的程度，有高、有低，最高的慧根是佛陀的一切知智。我们每天早上上早课，佛陀有14 种智慧，其中有 6 种是与弟子不共的。这些都是跟慧根相关。最高的慧是佛陀的， 接下来是上首弟子的、 大弟子的、 四无碍解智的阿拉汉的、 三明阿拉汉的。现在这个时代， 能够证得三明阿拉汉就是最高的智慧。如果没有证得阿拉汉， 三果圣者是比较高的；三果圣者没有，二果圣者；二果圣者没有，初果圣者；初果圣者没有，成熟的行者智；行捨智没到，坏灭随观、生灭随观、思维智、缘摄受智、名色分别智。我们现在啥也没有， 连禅那也没有， 怎么办？"],[6,3267,3438,1,"是不是就没有智慧？不是。有基本的业果智慧， 也叫有慧根。做这件事情有什么后果，至少把这个搞明白，你就不是没有慧根，只是比较低而已。（三）业果与因缘除了在业果层面上有些了解外， 我们还可以深入一点， 观待因缘。认知共情——跟别人交流的时候， 去看到他背后的期待。虽然你没有完整地看到究竟法， 你可以部分地体会到这一堆色法和那一堆名法的基本特性。比如说， 当你生起贪心的时候， 知道贪心的特相是执取目标，作用就是黏著，看到一个所缘可喜，心就黏过去，就像肥肉粘在热锅里面，黏的这种感觉、这种特相，你是能够体会的。当你体会到的时候， 也就知道这是贪心。以贪心作为基本名法的这一团心， 这虽不是究竟名法， 它是很多名聚、 很多心路组合的， 但你能感觉到那个贪，以贪作为基本名法的，它的特相就是黏著，你看到这个，也算是有慧了， 只是它的慧只能够看到这个部分而已。同样瞋心起来的时候，比如愤怒时， 你满脸通红， 心如火烧， 心跳加速。瞋心的特点是粗野，作用是燃烧身心， 烧毁心所依处。你可以观察到这是以瞋心为基本名法的一团名聚、一串心路， 这也算是有慧根。"],[6,3438,3514,1,"所以我们训练正念正知的根本前提就是不跟着你的惯性跑。所谓惯性就是刚才我们讲的贪相应的想、邪见相应的想，都有标记，过去的错误认知把你带过去的。第一个， 你能马上停下来， 停下来以后看看自己起来的是什么心？是贪相应的？瞋相应的？痴相应的？看看你的对方，他生起来是什么心？他背后对这个目标的期待是什么？当你在这样观察的时候， 也是多少有智慧的。经常这么看， 就知道平常你总是什么样的习惯。最近在网上做二十八天的梳理课， 找这一生内心比较深层次的随眠、 惯性，就是要这样去观察。"],[6,3514,3607,0,"观察出来以后怎么去对治呢？从这六个因入手。有分心你是改变不了的，但这一生要在你的名色流里留下哪一些比较有力量的东西，你是可以做的。是多做无贪、无瞋、无痴善因力量的传递，还是加强贪、瞋、痴的力量传递，你是可以做选择的。贪和无贪是两个独立的心所， 瞋和无瞋也是独立的心所， 痴和无痴也是独立的心所。都是要分别地去训练的，分别训练的时候，也是不同的场景有不同的要求。有一些人在某一个方面特别贪， 而在另一个方面又特别慷慨。你不能讲这个人有慷慨的时候， 他就所有东西都无贪了， 不一定的；也不见得某个人在某一方面特别贪， 就说这个人一定很小气， 有时候他会表现得很慷慨，这都是要去观察的。"],[6,3607,3674,1,"无贪的心要去训练， 贪的心要去对治， 这是不同的。布施对治贪、培养无贪。有效对治嗔心的方法是修慈， 要去帮助人， 要生起慈悲的心。贪和无贪有时候会交集在一起，瞋和无瞋有时候会交集在一起。但无痴的心只要训练起来， 痴的心自然就没有， 跟上面两对不同， 痴和无痴水火不相容。如同光明和黑暗的差别。“千年暗室、一灯即明”，一个黑暗的房间， 只要把灯一点亮， 或把灯一拿进去， 黑暗自然都没有了。有一句话叫“光明驱散了黑暗”"],[6,3674,3727,0,"，这句话不准确。黑暗在光明面前不存在驱散， 你把光明点亮的那一刻， 黑暗自然就没有。不需要驱散，你点着灯，黑暗就没有了。当你的无痴心、你的智慧一生起来，愚痴就没有了。所以智慧的心是要去训练的， 训练的第一步就是停下来， 因为跟着惯性走， 基本上都是愚痴。能停下来是第一步；第二步，看自己，“我刚在干嘛了？我刚才起来的是什么惯性？是什么样的基本名法为主的这样一串心生起来？”, 虽然你看不到，但你能感觉到。"],[6,3727,3874,0,"同时也看到对方， 认知共情， 知道对方在面对共同所缘时， 他内心的态度是什么， 然后依照佛法、 依照缘起的法则， 怎么样让自他都有利益、做正确的事情。这个就是智慧，要一点一点地被训练起来。希望大家的生命之根都非常健壮， 要去除生命中的病根——有病的根，贪、瞋、痴是有病的根。贪、瞋、痴很严重，无法调教，怎么说都没用的，这是心的癌症，生命之根的癌症。祝愿大家贪、瞋、痴根不断被斩除，无贪、无瞋、无痴之根越来越茁壮！"],[7,0,132,1,"尊敬的祜巴大长老，各位尊者、各位尼师、各位贤友晚上好！今天我们继续来学习《摄阿毗达摩义论》第七章，摄集的部分。一、七禅支概述（一）七禅支与五禅支之区别我们今天应该讲到七禅支 ——“类别之概要” 里面七禅支的部分。修习止观的人都知道 ，上禅那要查禅支。入初禅是五禅支，而在《阿毗达摩》里是七禅支，这有什么区别呢？七禅支是在寻、伺、喜、 乐、一境性的基础上增加了忧和舍。所以此处禅支这个词的用法跟一般在经教法里讲安止定的用法是不同的， 而是广泛地指： 紧密地观察目标的这种禅支。"],[7,132,235,0,"（二）禅那缘里的禅支在二十四缘里有禅那缘，禅那缘指的不只是证得禅那的那个缘，这里的禅那缘包含却不单指证得禅那的缘， 它涉及到扣除了双五识之后的七十九种名聚（七十九种心），这里面既有善的、不善的，也有无记的；换言之，既包含了善法里的禅支（禅那心是属于善法），也包含了不善法里的禅支， 还包含了作为无记法的果报心 （扣除双五识之外）和唯作心里的禅支。在经教法里， 禅那心特指色界禅那心、 无色界禅那心以及出世间的禅那心；但在《阿毗达摩》里面，禅那心指的是任何与四或五种禅支相应的心识， 包括安止定和近行定， 也包括所有的善心、 不善心和无记心（扣除双五识）。因此，这里所谓的禅那心是指具有某种程度的专注力或者敏锐洞察力的心， 而不是特指达到色界、 无色界禅那的那种高度专注的广大心。"],[7,235,317,0,"所以，七禅支是禅那缘的内容。禅那缘指的是心强有力地专注、集中于所缘，是支持心完全投入一个目标的力量。古代的论师们说，在禅那缘的支助下， 犹如在高处瞭望的人， 因为爬到了山顶而有辽阔又清晰的视野。他爬得越高， 所见的景色就越开阔美丽；也好像是在用高倍的望远镜，即使是很远的东西也能看得清楚、细致。同样地，禅那善心直接、 完全地投入专注于一个所缘， 这种专注的心能够让清晰敏锐的见解 （如善心来讲就是有正见） 生起， 智相应的善心就有正见生起。因此佛陀说： “已经培育定的人，能够如实知见。，这种专注的禅那善心最终能引导我们证悟涅槃。"],[7,317,423,1,"但是， 这里的七禅支， 它包括了善心、 不善心和所有的无记心 （果报心、 唯作心） ， 那么这里哪些心会跟七禅支相关呢？我们先来学习一下禅那缘的部分内容。禅那缘属于俱生缘组， 禅那缘的缘法： 七个禅支， 即寻、 伺、 喜、乐、一境性、忧和舍。其实忧和舍是属于受心所，属于受心所所表现出来的体验，所以其实它还是五禅支的内容：寻、伺、喜、受、一境性，只是有的受是忧受、有的受是乐受、有的受是舍受。在经教法的禅那心里面只有乐受， 在论教法里， 在不善心里面， 如果是瞋心就有忧受。我们知道有悦俱贪相应的、 有悦俱智相应的， 也有舍俱贪相应的、有舍俱智相应的；那么对于瞋根，都是忧受、都是忧俱的；对于痴，则都是舍俱的。"],[7,423,558,0,"这些寻、伺、喜、乐、一境性、忧和舍，会成为禅支，又会缘助哪些心生起来呢？就是包括 89 种心扣除双五识 （双五识即： 眼、 耳、鼻、舌、身，善的果报识和不善的果报识，合起来就是双五识），扣除这 10 个心识剩下的 79 种心 （包括 71 有因心和除双五识外的 8 无因心） 都包含了禅支， 在论教法里面都可以被称为有禅那的心 （禅那心），这是跟经教法的差别。在七禅支里面， 忧是绝对不善的， 它只生起于两种瞋根心， 其余六个禅支则可以是善、 不善或无记， 这决定于它们生起于什么心。不论它们生起于什么心， 都会援助同一名聚中的其余名法一起紧密地观察目标。如果禅支所援助的名聚是包括禅那心的善心或者无记心， 则受可以是悦受或者舍受。如果所援助的是不善心， 则三种受都可能出现 —— 贪根心会生起悦受或舍受， 瞋根心只生起忧受， 痴根心只生起舍受。由于悦受、 忧受和舍受不能同时生起， 在每一个心里面只会生起一种受， 所以真正同时运作时最多只有五种禅支。另外， 悦受生起时喜也会生起；忧受与舍受生起时则没有喜， 这时只有除去喜以外的四种禅支。"],[7,558,645,0,"当一个名聚里含有这四个或五个名法时， 它就能够以禅支的缘力援助缘所生法紧密地观察目标；同时， 禅支的强弱程度又会影响到它对目标的专注程度。另外， 尽管在四种禅那中， 第二禅到第四禅都没有寻与伺， 但因为它们是在具足五禅支的初禅基础上生起的， 所以应理解为禅那心都受到了五种禅支的援助。例如，《清净道论大复注》将安止解释为：“犹如令诸相应法安止于所缘而转起的寻为安止。， 包括四禅也是这样解释的。《法集论复注· 初禅论注释》 说道： 在义注用语中，“安止” 被用来指寻对于初禅定中所获得之坚固性的突出作用， 对于第二、第三和第四禅定中所获得的坚固性亦然， 尽管它们并没有寻。所以在禅那心二、三、四禅虽然没有寻、伺，其实这个寻、伺的自然亲依止缘的缘力依然存在。"],[7,645,750,0,"二、证得禅那的修习过程修习止禅的实际过程是怎样的呢？以修习入出息念或者遍禅为例， 刚开始专注禅修所缘的时候， 我们的心往往很难固定于目标， 心像猴子一样窜来窜去。但是， 我们只要持之以恒地专注， 以强有力的决意和信心去专注所缘时，在老师的正确指导下，持续不断地练习，一旦发现目标跑掉了， 再拉回来。随着禅那巴拉密的增进， 目标就会越来越清晰、越来越清楚。在此首先要明白： 七禅支都是紧密地专注目标， 而紧密地专注目标的前提是要有目标。因此， 对于禅修者来讲， 第一步是先搞清楚什么是目标， 不管是任何一种业处， 他都必须清楚地了知什么是他的目标。当然很多人会认为说： “我知道，老师讲了就是呼吸啊，鼻孔前面的呼吸。"],[7,750,897,0,"，然而这么长时间以来，我们发现很多人还是没搞清楚目标， 这目标不是那么容易搞清楚的， 你搞不清楚目标最后就会修出很多问题来。禅支紧密专注目标的前提， 想让这个禅支有效地运作， 首先要搞清楚什么是目标？什么是入出息念的目标？先要判断你现在应该专注的目标， 这种判断力是属于慧， 属于择法觉支， 是属于我们的慧根。联想来讲就是说，平常我们确定要去做什么事、或者从事什么事情，我们对此会做一个抉择， 在世间来讲就是这个人有智慧、 有聪明。同样， 回到止禅、 观禅来讲， 我们要确定这个所缘是不是符合经典的教导？是不是符合传统的教导？还有很重要的是不是符合你现在的状态（你身体的状态和你性行的状态），就我们讲贪性行者、瞋性行者和痴性行者， 在初学的时候， 你选择你的所缘的方式是会略有差别的。通常在经典或注疏上的教导会很明确、 很固定的。这时候为什么需要老师？因为你自己看书会搞错掉， 书上讲的往往只是一种很精确的方法， 但是你的状态、 每个人的状态是很不同的， 这就需要一个有经验的老师来给你做指导。就像你去找帕奥西亚多申请业处， 帕奥西亚多一定说：“鼻孔里面，鼻中隔里面的位置上”"],[7,897,1019,0,"，好，没有错的。那现在你来禅修报告， 我们一般先观察你是贪性行者还是瞋性行者， 但一开始不知道你是贪性行者还是瞋性行者， 对吧？就全部按帕奥西亚多要求先这么引导一下， 有些人就不行， 有些人就可以。为什么会不行呢？不行的情况大部分就是紧张， 鼻头很难受。他为什么出现这种情况呢？基本上只有两种原因： 一种原因是他取到呼吸撞击皮肤的触觉为所缘， 那就修出四大来， 就修出地界的硬、 粗、 重、 软、 滑、 轻来 ；再一种就是他期待， 他希望这个呼吸应该是他想像的那个样子。本来呼吸是自自然然的， 但对于一个完美主义者来讲， 对于一个总是对什么事情都有要求的人来讲， 他一到禅修的时候就把本来自然的呼吸折腾成他所理解的那个样子， 他觉得这是要很神圣的、 很有仪式感地来呼吸。然后他就会控制呼吸、抓取呼吸，把自己整得很难受，然后他还觉得很聪明， 往往这种人的慧根都比较强， 就是世间来讲比较聪明的人， 才会这样干。像这种情况， 就需要有一定经验的老师来给你做引导。"],[7,1019,1102,0,"所以首先选择所缘， 你所缘清楚才有可能紧密地专注。如果所缘不清楚， 你紧密专注以后就很麻烦， 越紧密最后鼻头越紧， 所以很多人就修不下去， 或修一堆禅病出来。在帕奥系修安那般那， 这样的人大有人在，不是小数。这就是没有搞清楚所缘，而去使用这个禅支。那么这个禅支里面，它会出现什么问题呢？本来善心的禅支是寻、伺、喜、乐、一境性，你面对你的所缘必须要有快乐。我老讲说八字方针：“如实、自然、轻松、快乐”，它符合禅支的要求。但你会发现有一些人， 他面对入出息所缘的时候， 他是各种控制， 各种分析、 评价、 判断、 批判、 怀疑， 此时， 他的禅支体现的是什么情况呢？多半是忧俱的， 他的禅支有很多忧的禅支、 也有很多舍的禅支， 他有很多怀疑的时候就会是舍的禅支，很多批判： “噢，这个不对！怎么又跑掉了？妄念怎么这么多？”"],[7,1102,1165,0,"， 专注目标的禅支都是忧， 他就会修出问题来。再有一点要清楚， 从一开始我们觉知入出息， 你用择法觉支搞清楚了什么是清楚的呼吸， 就是在那个位置上， 不管是在鼻头外面还是鼻头里面，你选定一个位置，在那个位置上的呼吸（气息）。帕奥西亚多在《智慧之光》里面讲说：“那个触点上的气息。，很多人只看到了那个触点，而没有看到“那个触点上的气息”，以为触点就是所缘，那就出问题了。触点上的气息，你取到这个气息，在这个点上知道气息，不跟着它出去、不跟着它进去，只是知道这个气息。玛欣德尊者讲说：“取到了入出息的概念。"],[7,1165,1247,1,"。这里要给大家一个提醒， 任何一个止禅， 从开始你取到所缘，一直到你证得一、 二、 三、 四禅， 所缘是同一个的。从开始专注入出息，长短息的阶段你知道入息出息 （长息、 短息的阶段你知道入息出息） ；全息的时候你也知道入出息；微息的时候你也知道入出息；当你沉入禅相证得初禅的时候， 你的所缘还是入出息；二禅的时候还是入出息；三禅、四禅，到四禅呼吸完全停止，你的所缘还是入出息的概念。如果在修习的过程中，你觉得： “我一开始是入出息，然后到入禅的时候就变成光， 二禅的时候变成一个更好的光、 更明亮的光、 更清澈的光。"],[7,1247,1315,0,"，那么你的所缘就从入出息变成光。变成光会有什么问题呢？有很多人泡在光里打妄想是怎么造成的呢？他就是以光作为他的所缘， 那光很亮嘛，一大片， 他投进去以后光就散开， 会很舒服，全身都被光笼罩， 觉得很愉悦。他一边享受愉悦，一边会出现什么问题呢？因为他专注光，到处都是光。第一、光是会变化的；第二、光这个所缘是非常广阔的， 因为它扩散开来了。所以， 你本来从一个微息的状态、停止息的状态，变成一片光明，所缘已经改变了，你本来可专注的那个对象它已经变化了， 所以你心就散掉了， 心散掉后你就泡在光里面打妄想。"],[7,1312,1385,1,"帕奥西亚多说：“光是呼吸的颜色。。禅相是什么？禅相是Nimitta。Nimitta，它当然有一种相状，但是更重要的 Nimitta 是什么呢？是禅支的状态。禅支的状态是什么呢？就当你的寻、伺、喜、乐、一境性，平衡地发展到很强有力的时候，某种程度来讲，你的心被这五禅支紧紧地抓住、 紧紧地控制住了。干嘛呢？沉在所缘上、 紧密地专注所缘。你的心只有这个所缘， 根本出不来， 你完全沉到里面去了。然后你沉进去一个小时、两个小时、三个小时、四个小时，就是你进入禅那一个小时、两个小时、三个小时、四个小时。"],[7,1385,1446,0,"那你怎么达成这个目标呢？就是一境性， 单一的目标， 单一的所缘。从入出息开始，一直到证得禅那，都是那个入出息。所以为什么会讲说 “入出息的概念呢” ？就是当你呼吸没有掉了的时候， 你还是入出息。所以很多人跟我讲说： “Bhante，我现在没有呼吸了。没有呼吸还是气息， 那个地方充满了气息， 你的内心里面不能没有那个气息的概念。那样你心就很安稳，光怎么亮、我怎么投进去，没关系， 我专注的是气息， 四禅的时候还是气息， 你心就会很安稳。所以，我们讲禅支这个章节的时候给大家插进来这么一段话。因为大家都在禅修， 这个问题没有理清楚， 你禅修的过程就会有各种问题。怎样善用禅支， 前提是你知道什么是所缘， 而这个持续的过程中怎样去专注这样的所缘。"],[7,1446,1518,1,"所以，禅相 Nimitta，Nimitta 它更重要的是禅那的征兆。那个征兆，很多真正入过禅的人，入禅是被吸进去的，标准是这样。有人说： “挂挡了，杆儿挂上去，自动巡航。。如果你认为我现在光很亮了，我就投入，那基本上是草莓禅，十几二十分钟后你就散掉了，完以后就开始在光里面打妄想。不信你可以试， 而且你试完以后你再培养定力很困难，为什么？因为它夹生掉。“曾经沧海难为水”，因为只要专注光就很快乐， 比专注那个枯燥的呼吸要快乐很多。所以他只要光一出来一稳定，他就想进去，然后禅修报告他还经常骗你：“Bhante， 我专注呼吸， 但是妄念还是很多。"],[7,1518,1651,0,"“妄念怎么来的？”“不知道。，其实他要么去专注光要么去专注那个快乐，所缘变掉了。所以大家记住， 你要想让你的禅支强有力地培养起来， 选择目标是很重要的。目标跟禅支互相培养， 是互相互动起来的这样的一种感觉。然后请大家再仔细看一下帕奥西亚多的《智慧之光》和《证悟涅槃的唯一之道》，关于遍作相、取相和似相，帕奥西亚多是怎样描写的。一直以来， 在坊间里流传着这样一种说法， 就是光跟呼吸融合的时候，稳定了叫遍作相；然后你开始专注它，越来越亮了变成取相；然后非常光明透彻了变成似相。但你仔细看帕奥西亚多的《智慧之光》和《证悟涅槃的唯一之道》，你会发现，就是光跟呼吸融合，然后你的心自动地去专注那个似相了， 那个时候才叫遍作相。那自动是什么概念？就是你的心自己被吸到那个光里面去了，用通俗的话来讲， 但这个词也不是很准确， 因为每个人都不一样。帕奥西亚多自从2015 年回来以后，在眉缪教禅要求专注入出息、长短息、全息、微息四个小时以上没有妄念。刚开始很多人说这个根本不可能达到， 以前都没有人能达到。但从帕奥西亚多这么要求以后， 就每天都有人报告， 很多人就达到。"],[7,1651,1705,0,"刚开始一段时间确实不行， 但是后面就很多人开始达到。那么达到的人都有报告： “帕奥西亚多，不行啊，我两个小时的时候就要被吸进去了。，帕奥西亚多说：“不要让它吸进去，继续专注四个小时。，那这个呢，其实如果你没有像帕奥西亚多要求说你三个小时、四个小时专注微息，就体验不到被吸进去的感觉。为什么呢？因为光跟呼吸融合半个小时以后他就投入了， 他不是自动被吸进去，而是主动跳进去的。那时候有人说像跳水一样地跳进去，这也是醉了（笑）。所以老师是很重要的。"],[7,1705,1776,0,"帕奥西亚多 2015 年以后这样严格的要求，我觉得在我们帕奥系的止观修学里面， 是一个非常重要的里程碑。所以， 你只要抱着这样的想法： 我一定能做到持续坐三个小时、 四个小时专注微息没有妄念，然后你就能体验到那种被吸进去的感觉。吸进去后， 你妄想心根本不会起来， 寻和伺把你妥妥地按在所缘上， 这就是禅支平衡、 强有力地形成的时候的状态。被吸进去以后， 帕奥西亚多说这是 —— 遍作相，然后你感觉越来越清晰， 心越来越稳定 —— 取相， 然后长时间沉进去 —— 似相。"],[7,1776,1932,1,"以后你在大金塔想要禅修报告， 记住： 你要想入禅， 先专注微息四个小时没有妄念， 然后才可以被允许查禅支， 这是严格按照帕奥西亚多的要求。当然，帕奥西亚多对一些老弱病残、年纪比较大的、像我这样的，会放宽一点，年纪轻的基本没戏。三、禅支的作用（一）以五禅支对治五盖五禅支为什么能够让我们入禅？五禅支能够对治五盖。五盖是我们证得禅那、证得观智的障碍。严重的五盖，应在禅修之前、开始练习禅那的时候，就要发现它、削弱它，你才能够持续地、没有障碍地修下去。随着禅支的力量不断地提升、被培养，五盖也会被对治。寻禅支可以对治昏沉睡眠盖。我们知道， 寻这个禅支很活跃， 它就是不断地撞击所缘。昏沉、 睡眠是什么呢？昏沉、 睡眠就是识门闭塞，它并不是睡觉的意思，而是你的心门闭塞、心所非常地沉滞，就像一团泥一样地拎不上来的这种感觉， 简单来讲就是心不活跃。寻是很有力量地去寻找所缘、 去撞击目标。因此， 寻可以对治昏沉睡眠盖。伺可以对治掉举追悔盖。寻找到目标以后，伺（心所）禅支持续地去观察目标、揣摩目标，守在那个目标上面。"],[7,1932,2010,1,"掉举就是乱跑，追悔就是胡思乱想，“我刚才如果这样专注就好了。“我昨天那个专注状态很好。“我刚才多吃了一碗饭。，各种追悔。一境性可以对治欲贪盖。一境性为什么可以对治欲贪盖呢？我们大家知道贪的时候，它就是想要的东西很多嘛，“我想要这个、想要那个。，心停不下来，所以贪是另外一种动态，而一境性是：“我就这个所缘了， 入出息是最好的， 要贪贪入出息， 这个是最好的。所以一境性对治贪盖。乐对治嗔恚盖。轻安起来的时候，身心都非常轻松，紧张、嗔心就不会起来。当你有乐受的时候， 你根本就不会去想： 到底对不对呀？分析、 评价、 判断、 控制啊， 他就不搞了。所以很多人说： “我坐着、坐着，有轻安起来的时候，紧张就没有了。"],[7,2010,2072,0,"，为什么紧张没有了？因为你有乐受了， 有乐受起来自然嗔恚就会被对治掉。这个大家可以试。很多人禅修不容易修上来， 就要去观察你的禅支怎么样？哪一个禅支比较弱？需要去加强它。为什么给大家讲， 要对呼吸培养感情， 要跟它谈恋爱， 要把它作为终身的伴侣， 呼吸本来就是我们终身的伴侣， 因为它从你出生就一直伴你到死亡， 呼吸是我们生命的特征， 但是你从来都没有去关心过你的呼吸。呼吸是滋养我们生命很重要的一个因素， 没有氧气我们马上就会憋死，靠着呼吸我们才能生存。它不仅仅是维持我们的生命，它还可以帮助我们证悟涅槃。"],[7,2072,2255,0,"一切诸佛在成佛的那一天， 他一定从入出息念入禅，证得四禅，然后现起神通，最后再生起道智，一切诸佛都是这样，一切诸佛都赞叹入出息念。入出息念有很特别的功德， 跟其他所有的业处不同， 其他的业处随着你的定力提升， 它的业处所缘越来越明显、 越来越清晰乃至于广大。只有入出息随着你的定力提升， 它的呼吸越来越微弱、 越来越微细、 越来越微妙， 所以你的定力跟念力要同时提升， 只有这个业处是念力和定力双向提升的， 而且它清净不杂。其他的遍禅你要去做一个曼陀罗， 或者取某一个身体的颜色作为所缘。不净观更是有很多不干净的所缘、令人厌恶的所缘。只有呼吸它很清静，它本身没有形像，而且你自己就带着。这是讲到禅修的时候，如何来观察我们的禅支。在日常生活中， 我们怎么来善用禅支的力量呢？刚才我们是讲禅那的问题， 那么在日常生活中呢， 其实当我们对某个目标有兴趣或者期待获得某种目标的时候， 作为禅支的心所能以禅那缘的缘力， 援助相应的名法很紧密、 非常专注地观察这个目标。日常生活中比如很专注地做事，有些人问： “比如那钓鱼的人，他为什么能那么专注，也没有正念 （按照善法来讲他属于没有正念） ， 但是他能那么专注？”"],[7,2255,2375,0,"那是他禅支的力量 —— 七禅支。钓鱼的人， 他有时候是舍禅支， 有时候是忧禅支。打猎的人、拿着枪瞄准的人，他也很专注，他也是七禅支在起作用。如果平常我们没有训练正念， 比如很认真地追剧、 很认真地刷屏，那也是七禅支的作用。所以当我们非常紧密地追剧、 非常紧密地刷屏的时候， 这是很麻烦的。有人讲： “我不能拿手机，我只要拿起来到放下的时候已经两个多小时过去了。，这就是你的七禅支被这个所缘抓住了。那我们怎么克服这个问题呢？禅支是跟所缘有关的， 所缘 paccaya 用古老的巴利解释，是会让你着迷的意思，迷魅，会像鬼一样地、像精灵一样地诱惑你。"],[7,2375,2507,1,"为什么会被迷惑呢？你为什么长眼睛啊？蚯蚓就不长眼睛啊。就是我们的上一生、 过去生， 或者我们上一生临死前的那个速行、 那个业，它还是潜伏着那个色爱，心的无明、爱、取有对颜色的贪爱。你为什么长着嘴巴？还有味蕾？是你有对这个味道的贪爱，你的无明、爱、取里面有这个内容。所以你这一生就会有眼睛、有嘴巴，你要再体验那个爱。那么体验这个爱呢， 当你爱的那个所缘出现的时候， 它就有迷魅了，有效力。所以以后学触心所，就特别有意思，触心所和受心所。触（心所）是讲所缘、依处和心识三个一汇合叫做触。一般我们对所缘都有单一的功能，比如寻、伺，它是单个发生，触是靠三个合起来它才会出现， 出现之后就会产生热量， 产生热量就像火炭融化胶块一样，一块胶本来是硬的， 放到火上一烤软了， 那个软了的状态就是受， 触缘受。这个热量是哪里产生的呢？是所缘跟依处产生的。那个所缘和依处有像火炭一样的热量， 只要跟心在一起，一产生热量就把那个心烤化了， 就融化了， 融化了就表现为什么？就产生那个感受。为什么会这样呢？就是因为你上一生就是想要这个所缘， 你对这个所缘有渴爱， 渴爱就产生力量的根门。"],[7,2507,2575,0,"当你的根门跟这个所缘一碰到的时候 —— 噢，就是你爱的，所以它就软化、产生感受。如果刚好是你贪爱的所缘，它就产生乐受。所以并没有一个“你”会产生乐受，就是这个机制会设置你成这样了。日常生活中， 这个禅支的力量会把我们引到不善法， 浪费我们时间。刷屏、看手机、刷朋友圈、追剧的时候，我们首先要知道，什么东西可以看，什么东西不能看。所以佛陀教导修行，第一步是持戒，第二步就是守护根门。不守护根门， 这个禅支的力量就直接把你抓走了。拿起手机到放下就两个小时过去了， 就这么来的。所以平常的时候，第一我们守护根门。"],[7,2575,2625,0,"除此之外， 我们要培育善所缘。就在日常生活中， 你要有正确的所缘， 让你的禅支可以在里面去紧密专注。那什么是善所缘呢？禅修业处当然是最好的善所缘， 但你不可能一直禅修啊， 所以我们强调行住坐卧的时候一定要有正念正知。当然很多人讲说： “啊，不要那么麻烦，平常那个东西的观察没有用的，一定要生起道智‘咔嚓’干掉它。，没有错，但如果你平常的时候，心都是漫天飞舞、飘忽不定，一打坐所缘都跟雾霾一样，你怎么生起那个道智 “咔嚓”"],[7,2625,2726,0,"一下呢？这是佛陀讲的， 不是我搞出来的。基于四念处的正念正知必须成为我们日常生活中的所缘， 身、 受、心、法。如果你的慧根比较强，我就建议你修心念处和法念处；如果你的慧根比较弱、很弱的，比如你是痴性行者，你要修受念处，受念处比较粗，比较容易抓到；一般的人呢，从身念处开始。当然你一切时处能专注入出息是好的， 但是我们发现大部分人是不能够专注入出息的， 而且有很多时候是不能专注入出息的。比如你开车、 你在切菜的时候， 你拿着刀切菜， 你专注入出息， （手的） 肉就一起切进去了。你干什么的时候就要专注于那个当下， 大部分是以身念处为基础。然后， 当你发现你的心念在起来了， 你去观察你的心， 你烦恼为什么起来？烦恼的背后是什么样的动机？什么样的无明、 爱、 取促使你的烦恼生起来？烦恼生起来， 就是你要对现在这个所缘采取行动了嘛， 要么贪著、要么瞋恚，不满意了，背后它都有标准的。"],[7,2726,2809,0,"我们接着下来讲道支， 道支就是见， 不是正见就是邪见， 都是那个见解、 那个观念在支持着你为什么这么做。如果你没有念处， 你的心回不到当下， 你说我去观察我的烦恼， 然后我能够如理作意， 怎么可能呢？所以我们需要在日常生活中能够，第一个、守护根门，第二个、确立我们在日常生活中的所缘。对一个佛弟子来讲， 你一定要有自己固定的业处， 比如你是入出息念啊， 你是三十二身份啊， 你是佛随念啊，或者你是慈心啊，是固定的，固定之外呢，你行住坐卧要有你的念处， 大部分人就从身念处开始， 身念处是所有性行的人都要练习的。在这个基础上， 如果你慧根比较强， 就可以加上心念处和法念处；如果你痴根比较强，就要多练习受念处。"],[7,2809,2865,1,"（二）外甥僧护长老心如果没有调伏它就会漂浮不定。在 《法句义注》 里有一个僧护尊者的故事，僧护长老（Saṅgharakkhita）是沙瓦提城（Sāvatthī，舍卫城）的一位长老比库。长老的妹妹生下儿子，也取名为僧护，人们都称他“外甥僧护”。男孩长大以后，他妈妈就送他到舅舅座下出家， 达上成为比库之后， 在某一个村寺度过雨安居。雨安居之后就有人供养袈裟，他得到了两件衣，一件七肘长，一件八肘长，他想："],[7,2865,2937,0,"“我要将八肘长的供养长老，七肘长的留着自己用。雨安居结束后， 他去到长老的住所。僧护长老不在， 他便进入寺院，打扫长老的日间住处，为长老铺设座位，备好洗脚水，然后等长老回来。这是作为一个下座应该有的行仪。不久，长老回来了，他即迎上前，接过衣钵，请长老就座后，为他洗脚，并拿扇子给长老搧凉。接着，他就顶礼长老，将所获得的衣放在长老足前，然后报告说： “尊者，请接受此衣吧！”，然后继续给长老搧凉。长老跟他说：“我三衣齐全，你留着自己用吧。，外甥僧护他就讲说： “长老，在我得到此衣的那一刻，我就只想到要供养您，就请您收下吧！”"],[7,2937,3032,1,"，长老还是说：“僧护，我的衣已齐全，你还是留着自己用吧。，外甥僧护一再请求，长老仍不接受。这时外甥僧护一边搧着扇子，一边开始胡思乱想 ——“出家前，我是他的外甥，出家后，我是他的弟子、他的同住者。尽管如此，他作为我的戒师， 居然都不愿意分享我的衣物， 那我做比库还有什么意思呢？不如还俗好了。。接着，他继续在心中盘算：如果还俗，过在家生活很不容易，如果还俗的话呢， 我要怎样才能够维持我的生活呢？他想： “我先把这八肘长的衣卖了， 买只母羊。这只母羊一定会生很多小羊， 我把小羊卖了，这样我就能攒下很多钱。攒下钱以后就可以娶妻。娶了妻，她将会为我生个儿子， 我要以舅舅的名字来给他取名叫僧护。然后， 我就带上妻儿， 驾着牛车去拜访僧护舅舅。在途中， 我会对妻子说： ‘把儿子给我，让我来抱吧！’"],[7,3032,3091,1,"，她会回答： ‘你为啥要抱这孩子呢？驾车吧！’，说着，她就抱起孩子，心想：‘我自己抱他。’，但她力气又不够， 结果孩子掉到车下， 牛车的车轮直接从他身上辗过。于是我对她说： ‘你甚至不肯把我的孩子给我抱， 自己力气又不够。你看，你把孩子毁了， 也把我给毁了！’， 说着，我就用牛鞭往她背上抽。他一边给长老搧着扇子，一边想入非非， 想到此处， 便挥动扇子使劲打在了长老的头上。长老自忖：“僧护为什么打我的头呢？”长老是阿拉汉， 有他心通， 他即刻对外甥所想念念皆了然于心， 长老说道：“你没能打到那女人，这年老的上座有什么错，要挨你的打呢？！”"],[7,3091,3147,1,"外甥僧护听了心里一惊，想着：“坏了，全被他知道了。糟糕，这下完蛋了！看来我刚刚所想的全都被我的戒师知道了，既然这样，我当比库还有什么用呢？”， 他扔下扇子便向外狂奔， 边上的年轻比库们随后追着抓住了他，将他带到佛陀尊前。佛陀知道事情的原委后， 对外甥僧护说： “来， 比库， 不要担心。心能够攀缘非常遥远的事物。应该激发精进而解脱贪瞋痴的束缚。接着，佛陀诵出了偈颂，《法句·心品》37 偈：“远行且独行，无身居洞窟。制伏己心者，解脱魔束缚。"],[7,3147,3244,0,"偈颂诵完，外甥僧护听后即证得初果。这故事告诉我们， 如果放纵自己的心， 我们编故事、 演电影的水平是很高的，大家都有这个经验，坐在那傻呆着的时候，噢，神游天界。所以，我们要懂得怎样能够来守护我们的心，就是刚才讲的，日常生活中一定要有我们心的住处，要有心的念处才可以。马哈甘达勇西亚多曾经讲过一个记载于 《律藏义注》 的故事。佛陀灭度之后， 有一位年轻比库每天都去清扫佛陀的舍利塔。佛塔的四周铺满了细沙， 有一天， 当这位比库清扫完毕， 坐在离佛塔较远的地方休息时， 他遥望着佛塔， 看见因为阳光的照射， 细沙反射上来的白濛濛的亮光闪烁于细沙之上，佛塔巍巍伫立在闪烁的白色亮光之中，极为庄严。这位比库深受感动，他心中忆念起佛陀的功德。"],[7,3244,3301,1,"当他忆念佛陀的功德时， 刹那间， 他心中浮现出佛陀在世时活生生的样子， 由于他佛随念甚深的专注力， 他迅速地进入佛随念近行定中。此时，在附近的魔王见此情景，很担心他会证得圣果，于是变成一只老猴子，在塔上上窜下跳。结果，这位比库一看到这只老猴子，心就散了， 从近行定中退出来， 他心想， 今天的修行大概不会有进展了，被这老猴子给打扰了，算了，明天再努力吧。第二天，他又来打扫，打扫完毕，他再次遥望宁静庄严的佛塔，继续修习佛随念。当他进入佛随念近行定的时候， 魔王又来扰乱。这次， 他变作一只老公牛徘徊在佛塔四周， 结果这位比库的禅修又一次被打断。"],[7,3301,3348,0,"第三天， 当这位比库再次修佛随念的时候， 魔王又来扰乱， 他变成一个非常丑陋的跛脚人， 站在佛塔旁。这位比库心里纳闷： “奇怪！这附近以前从来没有出现过这样丑陋的人。这个人是不是魔王来干扰我？”于是他问道：“你是魔王吗？”魔王竟然毫不掩饰，说：“是啊，我就是魔王。这时，比库并没有起嗔心，反而温和地请求魔王说：“魔王啊，我听说你神通广大， 可否请你化成佛陀在世的模样給我看看呢？”魔王面有难色地回答： “要变得和佛陀一模一样，我可能办不到，但我可以变得很相像。"],[7,3348,3426,0,"”比库说： “没问题，请你赶快变成一个非常像佛陀的人给我看看！”话刚说完， 魔王立刻变现为盘坐在金刚座上的佛陀。这位年轻的比库喜悦万分， 赞叹道： “还未断除贪瞋痴的魔王用神通幻化出来的佛陀尚且如此庄严，断尽烦恼、证悟了一切知智的佛陀必远胜于此，那该是怎样地庄严！” 这时， 年轻比库完全地沉浸在佛陀的庄严相貌中，深切地忆念着佛陀的功德，瞬间就进入了甚深的佛随念近行定。这位比库在甚深的佛随念近行定中，五个禅支非常稳固地生起。然后，他直接观察五禅支中喜和乐的无常、苦、无我三相，当下即证得了阿拉汉果。这就是怎样善用善法的寻、伺、喜、乐、一境性，透由禅那缘缘力的援助、增长善法乃至证悟涅槃的例子。"],[7,3422,3522,1,"今天的课就学习到这里， 愿大家都能够善用禅支的力量， 在生活中多生起善法，在未来早日证悟涅槃。萨度！萨度！萨度！"],[8,0,188,1,"这堂课学习十二个道分。一、 十二道分大家熟悉的都是八正道，很少有人听说过十二个道。这是阿毗达摩与经藏（经教法）对于道支分类的不同。十二个道分是八正道加 上邪 见、 邪 思维 、 邪精 进和 邪 定， 这 个也 是道 。道， 巴 利语magga，字面上的意思是说通向某一处的道路、路径、以及方法。因此，这个道就有正道和邪道之分，也有善道和恶道之分。可以简单地把道分成正道和邪道两个部分。（一）、道因此，在论教法里面，道不仅仅是指导向圣道圣果的道，所有能够导向某一个目的地的道路或者方法都可以称为道。对一个生命而言，它可以被导向恶趣，也可以被导向善趣，也可以被导向涅槃，都是通过相关的道。"],[8,188,257,0,"在经教法里面，道 magga，是特指世间和出世间的八圣道。因此在经教法里面的道心是特指四种出世间道心之一 —— 初果道心、二果道心、三果道心和四果道心。然而，在论教法里面，也就是说在阿毗达摩里面，道可以指八圣道、也可以指导向善趣的善业道或者导向恶趣的不善业道。因此，阿毗达摩里的道心可以指通往涅槃的出世间圣道的一种或多种道支相应的心，或者与任何导向善趣投生的善道的八种善道支相应的心，或者与任何导向恶趣投生的四种不善道支相应的心。"],[8,257,350,0,"（二）、邪见、邪思惟、邪精进和邪定邪见、邪思惟、邪精进和邪定四个道支，其中邪思惟、邪精进和邪定不是单独的心所，只有邪见是独立的心所，因此，十二个道分从心所来讲，是九种心所，邪见是包含在道支里面的。简而言之，道缘是指当人们依着某一种见解来生活的时候，作为道支的心所就能够以道缘的缘力，把相应诸法和俱生色法导向相应的目标或者目的地。因此，道分为善的正道和不善的邪道。其中，正道又分为世间的和出世间的两种 —— 世间的正道和出世间的正道。关于十二个道分的缘法、缘所生法，属于二十四缘的范畴，不在此讨论。"],[8,350,435,0,"十二个道分，涉及的是九种心所，正见、正思维、正语、正业、正命、正精进、正念、正定，加上邪见，共九种心所。其中，八正道是导向善的。邪见、邪思维、邪精进、邪定是导向不善的。邪思维属于寻心所。正思维也好，邪思维也好，都属于寻心所；正精进、邪精进都属于精进心所；正定和邪定都属于一境性心所；正见是属于慧心所；邪见是属于邪见心所。正见跟邪见是分属两个心所的，其他的正思维、邪思维，正精进、邪精进，正定、邪定，分别属于同一个心所。"],[8,435,575,0,"正见跟邪见是相反的见解。但是我们讲寻心所、精进心所和一境性心所，它们是通一切心的心所（13 个通一切心心所），一境性心所是遍一切心的心所（7 个遍一切心心所）。寻心所：有欲寻、瞋寻、和害寻，有离欲寻、离嗔寻和离害寻。正精进跟邪精进：正精进也称为四正勤。邪精进是跟贪相应，或者跟瞋相应的，一般不跟痴相应，因为痴很难生起精进的心。（三）、道支也就是说，当心（也称为名聚）本身含有十二个道分的某一个心所时，那么这些心所（名法）就可以以道缘的缘力来援助缘所生法导向某一个目的地、或者导向某一个道。另外，在《阿毗达摩概要精解》里面有提到，大善果报心和唯作心里面也有道支，但没有导向善道或不善道。"],[8,575,678,0,"虽然果报心和唯作心的道支并没有导向任何目的地，但还是被列为道支，这是因为依着它们的本性，它们与能够导向各种目的地的法是相类似的。八十九种心里面有哪一些心跟道缘有关系呢？或者说，有哪一些心是属于道缘的缘所生法 —— 哪一些心是受到道缘支助而生起来的？八十九种心里面除了十八个无因心，有七十一种心里面都是含有道支的。也就是说无因心不具有道缘的缘力，无因的结生心得不到道缘的支助。俱生色法包括有因结生的业生色、以及与有因心俱生的心生色法。"],[8,678,757,0,"对于道缘，或者说对于十二种道分，我们在日常生活应该怎么去看待它呢？如果仔细地思考十二个道分，它是很有意思的，十二道分阐释了在世间，不管是行善还是作恶，要达成目标，都要有道支的支助。不管你做什么事，做好事还是做坏事，必须有道支的支助。道支越强大，达成目标就越快，达成目标的效果就越明显。这是指可以总括为九个心所的十二种道支，如果朝向善的八种正道强有力的话，导向善的力量就强、速度快、效果显著，所达成的效果最低可以导向善业成熟而带来善趣结生，最高可以导致道智生起 —— 初果道智、二果道智、三果道智、四果道智，乃至于佛陀的一切知智。"],[8,757,885,0,"同样的，如果朝向不善的四种邪道强而有力的话，则所造下的导向不善的恶业也会很强，不善业感果的速度也会很快，不善业产生的痛苦会很剧烈。当导向恶趣结生的不善业成熟的时候，有情将在所投生的不善趣遭受强大的痛苦，而且持续的时间很长。二、八正道的践行这是简单来看十二个道分。我们做为佛教徒，知道要践行八正道，但应该怎么践行呢？（一）、十善业与十不善业参照一下十善业道和十不善业道。你会发现，十善业道和十不善业道，它并不是有另外的一种道。十善业道就是不杀生、不偷盗、不邪淫、不妄语、不饮酒，身三语四意三。相反的，不善业道就是杀生、偷盗、邪淫、妄言、绮语、两舌、恶口、贪、瞋、痴，很强的贪、瞋、邪见。如果在十善业道和十不善业道里面，你只要不做那些不善行，自然就是善行。"],[8,885,1040,1,"为什么会这样呢？学过阿毗达摩的人都知道，一个心识刹那只有一个心生起，不可能有两个心同时生起。对于凡夫来讲，你不是生起善心，就是生起不善心。所以当你不生起不善心的时候，你就一定会生起善心。道也是一样，八支圣道除了邪见之外，你要达成无上的目标，都是这八个道。（二）、《大四十经》之正见前提是正见。在中部《大四十经》的开头，佛陀就讲述以正见为先导，把正见放在最重要的位置。在八正道里面，有正语、正业、正命，有三个离心所。在邪道支里面，有邪见、邪思惟、邪精进、邪定，但是没有邪语、邪业、邪命。正语、正业、正命作为正道之一，但并没有邪语、邪业、邪命作为道支。"],[8,1040,1137,1,"邪语、邪业、邪命，是怎么来的呢？“诸法意先导，意主亦造作；”——《法句经》第一品第一句偈。用世间法来讲，就是认知行为模式。你有什么样的认知，就有什么样的思维方式；有什么样的思维方式，就有什么样的行为方式。为什么正见为先导呢？见决定你的思维方式，你的思维方式决定你的行为方式。不管你做好事还是做坏事，都是依着八道支的次第来的。只要在世间想做成一件事，一定先要有个想法，为这个想法做很多的思考，思考决定了以后付诸行动。如果想做成功，就要很努力地做，不是正精进就是邪精进，不是正念就是邪念，不是正定就是邪定。这里的定是指从广义来说，就是非常专注地做。不管要做成哪件事，越是想要成功的，越是跟这个八道相关。大家可以思考看看，是不是这样？"],[8,1137,1210,0,"因此只要见解错了，后面一切都错。大家讲修行、修行，第一步是修正我们的见解，如果见解不能修正过来，修行就是两张皮，我经常说佛教徒的伪装，披上佛教徒的外衣。（三）、邪思维、戒禁取、邪见邪见是四种邪道之首，因为有邪见就会产生邪思维、邪精进、和邪定。那什么时候才能够断除邪见呢？初果道智生起来的时候，就断除有身见、戒禁取和怀疑，也就是断除了邪见。有身见就认为有一个“我”存在，我、自我、灵魂我、超我、大我、无我的小我、无我的大我，很多花招。有同学说：“我觉得我的大我完全无我了”"],[8,1210,1302,1,"“我的大我完全无我了”也是我，还是邪见，这样修下去不可能导向涅槃的。戒禁取，大家知道就是跟修行相关的邪见，执取某种行为仪式以为可以带来解脱、导向清净，也是属于邪见 。证得初果最直接的表现就是斩断了会导致投生到恶趣的邪见。邪见的主要表现是看待事物不从无常、苦、无我的角度看，最严重的邪见是虚无见、无因见、无作见。（四）、道智生起斩断颠倒从三颠倒的角度来讲，初果道智斩断了哪些颠倒呢？初果道智斩断了常、乐、我、净的见颠倒，以及常和我的想颠倒、心颠倒；对于净和乐，是后面的三果道智、四果道智才斩断的。有人问："],[8,1302,1391,0,"“为什么初果道智生起以后，初果圣者一定不会再堕入四恶趣呢？他们临终的时候，难道就不会有不善业成熟吗？”初果圣者还可能会造某些不善业，但他临终的时候为什么不会造不善业？如果在临终的时候生起不善心、有不善的业成熟，他有不善的念头，按照业果的法则，他一定堕恶趣，对不对？初果圣者临终前可能会有不善业成熟，但是他面对不善的时候一定不会有不善的念，不会有带邪见的念，因为他已经彻底断除了跟这些相关的念。另外，跟邪见相关而造作的业，在他临终时也不会成熟。"],[8,1391,1480,1,"初果圣者最多在人天来回投生七次，就一定会证得阿拉汉果。也就是说，初果道智生起以后，斩除邪见，就不会再回退了。也就是说初果道智的力量足以支持未来每一次再生的令生业都是善业，这是定法。彻底断除轮回的曙光已经现出，无余涅槃必定会到来，三、邪见的类别些佛陀在相应部《皮带束缚经》里面讲过二十种有身见，在长部《梵网经》里面讲到了六十二种邪见，在《一切漏经》里面讲过六种邪见。其实呢，这些都是基于对过去、未来、现在的我是怎样的一种状态的怀疑而导致的。"],[8,1480,1564,1,"（一）、20 种邪见二十种邪见是对于五蕴的看法，对色受想行识的看法。一种方式是认为色受想行识是我；一种方式是认为我拥有色受想行识；还有一种，认为色受想行识在我当中；最后一组，认为我在色受想行识当中。四组乘以色受想行识，二十种邪见。其中，认为色受想行识就是我，这一组是断灭见。为什么呢？认为色受想行识是我，那么当一个人命终的时候呢？他的色受想行识就离散了，在这一生，死心生起的那一刹那就没了，随着身体的死亡，那个我也就没了，那就是断灭见。"],[8,1564,1650,0,"其他的三组，不管是我拥有色受想行识、还是色受想行识在我中、还是我在色受想行识中，这十五种见都是属于常见。不管是常见还是断见（断灭见），在相应部《无明缘经》里面，佛陀这么讲：“诸比库，有灵魂我，即是身体之见，则没有梵行。‘灵魂我即是身体’就是刚才讲的断灭见，色受想行识是我就是断灭见。如果你持断灭见，不会有梵行。因为梵行生活是以灭绝、断绝持续轮回再生为目标的，而对持断灭见者而言，人死如灯灭，死后一了百了，就没有什么需要断绝的，死了就完了，不需要搞梵行了，所以没有梵行。"],[8,1650,1723,0,"佛陀接着对常见也批驳道：“诸比库，有灵魂我与身体相异之见则无梵行。，就是你的精神部分跟你的物质部分是不同的，这也是没有梵行，这就是一个人持有常见。同样的，因为梵行生活是以灭绝、断绝持续的轮回再生为目标，而常见则认为至少有一种行法是常驻、稳固、恒久的，这样一来，梵行就不能够灭绝轮转。就是说无论我们怎么修，那个东西都在，那梵行就没有意义。比照一下自己，作为一个佛教徒，我们有没有刨除断灭见和常见？日常生活中，这是不容易的。"],[8,1723,1818,1,"我们的邪见，有一种说法是：如油入面。其实不是如油入面，如同你的肉和血，是完全融合在一起的。一起来都是邪见。比如，有人问：“佛陀讲无我非我，那到底谁在成佛？谁在解脱？谁在证阿拉汉？”，很多人都有这样的怀疑，显然这是没有搞清楚佛陀关于无我的法义。没有无我就是有我，有无我的我还是有我，有我就是邪见。如果我们还有这样观念，就说明正见还没有树立起来。当我们持有上述邪见的时候，无我非我的正观就不能现起。如果无我非我的正观不能起，道智就不能现起；如果道智不能现起，轮回就无法斩断，解脱也就遥不可及。因此，去除邪见，树立正见，树立正确的无我知见非常的重要。"],[8,1818,1930,0,"（二）、邪见的三种层次雷迪西亚多在《觉悟资粮》里面讲到，众生的邪见跟烦恼一样有三种层次，违害性的层次、困恼性的层次、和潜伏性的层次。违害性的层次，是已经表现为身体和语言的恶行，三种身恶行和四种语恶行。困扰性层次的只是心被恶念所困扰，伴随着杂染或者烦恼的心念。我们经常提到的抑郁症、焦虑症、自闭症，这些就是典型的困扰性的烦恼，各种负面情绪的负循环。潜伏性层次的是指潜在的烦恼倾向，它是指并未通过身语意三业表现出来，但无始以来一直潜伏在我们生命相续流之中的这种恶。雷西亚多把这三个层次的邪见比喻为潜存在火柴里面的三种火。他说，火柴盒里面有三种火：第一种火是潜伏于整个火柴盒里面的火；第二种是火柴棒摩擦以后点燃的火；第三种是火柴棒的火接触到其他物品以后，点燃了那些物品的火，这种火可以烧毁整个房屋、寺院、乃至于整个村庄或者无量的生灵。最后这一种可以燃烧物品的大火，就好比是违犯性的邪见，它能够导致违害性的三种身恶行和四种语恶行。"],[8,1930,1998,0,"火柴棒刚点燃时候的火，好比是困扰性的邪见—— 每当我们的心接触到自己认为不可喜所缘的时候，就会不自觉地浮现、持续地生起不善心。潜伏性的邪见就相当于在火柴盒里的火，好比无始轮回中一直潜藏于众生生命相续流之中的潜伏性邪见。那么，这种潜伏在火柴盒里的火，只要火柴头没有去摩擦火柴盒边上的磷片，它就不会迸发出火焰，即使把它跟火药、汽油等高度易燃品放在一起，也不会产生破坏。同样的，潜伏性邪见潜伏在我们的名色相续流中，只要不接触到不善所缘或其他的恶缘，它就不会显现出来。"],[8,1998,2047,0,"然而，当不良的所缘或者其他恶缘撞击我们六门的时候，潜伏性邪见就会被扰动并呈现于意门，或者通过思的作用而出现在困恼性的层面。如果我们当时能够用善法来镇伏，它就能够从困扰性层面消失并回复到潜伏性的层面，仍然以潜在的形式存在在那里。如果它们不能被镇伏，就会因为不断增强的思，一种是自然亲依止缘的作用，一种是重复缘的作用，而持续地呈现。如果不能够回到如理作意的状态，任其在困扰性阶段不断受到扰动，最后就会表现为违害性的邪见。"],[8,2047,2113,0,"在一般社会道德和宗教里面，强调更多的是在这一生中能够在违害性或者困扰性邪见层面上克制自己，从而使自己的身语意能做到所谓的没有瑕疵，这样就可以被称为是一个良善的、虔诚的、有道德的人。但是凭借这样的知识，他并不能够觉察在生命无限相续当中还有潜伏性层面的邪见没有断除，如果一个人坚守这样的信念，一辈子保持这样的克制，那么来生他可以导向善趣，就是善的道缘导向善趣。然而，只要潜伏性的邪见没有断除，对违犯性邪见和困扰性邪见的克制就只能是暂时的。只要潜伏性邪见没有斩断，就不能够保证在投生到善趣的下一个生命期间，困恼性邪见和违害性邪见不会被再度引发出来。"],[8,2113,2176,0,"（三）、投生后的惯性一个人如果终身持守五戒、八戒，或者比库二百二十七条戒，且都能如理作意，也做了很多善行。保持自己的品德，道德品行清净无染，那么他下一生一定会投生到善趣。如果没有禅那，他可以投生到人界、欲界天，如果有禅那并维持到临终，可以投生到梵天界。如果再度投生为人，他是否还能够继续这样一种善的生活方式呢？这是很难讲的、很难确定的。如果投生到欲界天，他可以享受五欲的快乐；如果投生到梵天界，他拥有清净无忧的生命。然而，当福报享尽再度投生的时候，他同样需要面对很多不确定的因素。"],[8,2176,2236,0,"任何生命只要依着业投身到某一个生存界，那么作为其中的一员，这个物种所有的生物性习惯，自然就会主导他的性行。我们过去课里一再讲的，众生被两股力量彻底束缚，其中一条就是物种繁衍相续的力量。就像我们投生为人，人这个物种的所有行为习惯就会变成我们的主要习惯。如果我们在畜生界投生，比如你投生为鸡，就有鸡的外形和生活习惯，每天用爪子扒地，在土里面寻找昆虫为食。如果投生为猫，它就一天到晚不是抓鸡、抓老鼠，就是理毛、睡觉，这是猫的习惯。"],[8,2236,2310,1,"当我们被业裹挟到某一种生存状态的时候，是很难从这一种生物性的习性里面超脱出来的，而如果不能从这种生物性的行为中超脱出来，我们就很难确保自己下一世能够持续持守戒行，除非是圣者或者已经被授记的菩萨。乃至于已经被授记的菩萨，他也不能保证自己每一生都能够投生到善趣。当然，已经被授记的菩萨必定会在被授记的时间范畴内成佛，这是不同于一般有情的轮回状态。因此，为了避免错误行道，我们必须正见为先导。四、正见与邪见的对比道缘中的十二个道支（九个心所），八正道加四种邪道。然而，究竟会导向恶道？还是导向善道？还是导向涅槃？归根结底取决于我们的见解，是持正见还是持邪见。为了避免错误行道，我们需要正见。那哪些是正见呢？"],[8,2310,2390,0,"《大四十经》（一）、邪见佛陀在《大四十经》里面讲到：“诸比库，其中正见为先导。诸比库，如何正见为先导呢？了知邪见为邪见，了知正见为正见，这是他的正见。诸比库，什么是邪见呢？没有布施，没有供养，没有献供，没有善行恶行诸业之果的异熟，没有此世，没有他世，没有母亲，没有父亲，没有众生是化生者，世上没有沙门、婆罗门之正行者、正行道者，以自智证知此世及他世而宣说。诸比库，这是邪见。由这十种基本邪见，我们可以知道，邪见主要是指不相信有因缘果报。为什么呢？因为不相信有因缘果报，他就不会接受造善行会有善果、造恶行会有恶果的观念。因此，为了满足自己对五欲的贪求，他就可能无恶不做，随意地犯下杀盗淫三种身恶行，或者妄言、绮语、两舌、恶口四种语恶行。支持这样的邪见，会给自己带来长久的不利和痛苦。"],[8,2390,2457,0,"（二）、正见什么是正见呢？佛陀说正见有两种：有种正见是有漏、福德分、所依果报；有种正见是圣、无漏、出世间道支。哪种正见是有漏、福德分、所依果报呢？有布施、有供养、有献供，有善行恶行诸业之果的异熟，有此世、有他世，有母亲、有父亲，有众生是化生者，世间有沙门、婆罗门是正行者、正行道者，以智证知此世及他世而宣说。哪种正见是圣、无漏、出世间道支呢?那是圣心者、无漏心者、拥有圣道者，修习圣道者的慧、慧根、慧力、择法觉支、正见道支，“诸比库，这种正见是圣、无漏、出世间的道支。"],[8,2457,2513,1,"佛陀所说的正见包括了世间正见和出世间正见。根据《注疏》正见指五种智，这五种智慧有三种是世间的智慧，有两种是出世间的智慧。（三）、三种世间的智慧第一种是业自属智，就是经常大家讲的业果智。业自属智就是对于业运作的智慧，也称为基本正见，这是指我们能够了知有情的投生取决于有情过去的业，终其一生，有情过去和现在的不善业产生种种苦报，善业则带来种种乐报。你是不是带着因果的观念去看待事物？有没有生起慧根？佛陀在经文里所提到的有布施等十种基本正见，就是属于业自属智。"],[8,2513,2656,0,"第二种是禅那的智或者禅那慧，也叫禅那正见。这是指安止定，心安住于禅修所缘的智慧。在入出息念前行里讲过，建立起正确的止禅和观禅的所缘非常的重要，这也是一种智慧，属于择法觉支。五根、五力，即五根中的慧根、五力中的慧力，是在止观的过程中被培养的。而止禅培养的过程中，首先就是能够先确定你的止禅所缘是什么。第三种世间智慧称为观智，也称为观慧。是指能够观察究竟名色法无常、苦、无我三相的这种智慧，所以观禅的所缘是如实存在的名、色、五蕴、缘起这些究竟谛，观智即如实了知它们的无常、苦、无我三相。这三种世间智慧是指对世间有为界实相的了知。两种出世间的智慧一个是道智、一个是果智。道智指初果道智、二果道智、三果道智、四果道智；果智就是初果的果智、二果的果智、三果的果智、四果的果智。"],[8,2656,2745,0,"道心只生起一个刹那，它也是造业的速行心，并且道心所造的业立即感果，果报在下一个心识刹那就会生起。法的功德是“自见的、无时的、来见的、导向涅槃的”，那个“无时的”指的就是这里，道智生起的下一刹那，果智立即生起。所以我们称道智所造的业为道业，道业的主要果报就是果智，从属果报是断除相应的烦恼。初果道智断除有身见、戒禁取、怀疑，二果道智削弱剩余的所有烦恼，三果道智断除欲贪和嗔恚，四果道智断除余下的一切烦恼。只要初果道智还没有生起，十二个道分里的四种邪道，最多只能被镇伏，而以潜伏随眠的方式存在，当有合适的因缘时，它就会现起和引发不善心。"],[8,2745,2820,0,"（四）、大龙长老的故事是不是已经道智生起，不是那么容易了解的，需要不断地检查。帕奥西亚多老引大龙长老的故事给大家讲，大龙长老六十年都在正念当中，没有起过一个妄念。教出了两万个阿拉汉，不知道自己还是凡夫。他的一位阿拉汉弟子有一天观察到他的老师还是凡夫，而想办法去提醒他。教出了两万个阿拉汉的长老，他难道不知道怎么查道智有没有生起吗？他难道不知道怎么查他的烦恼（十四个不善心所）是不是不断除，他不会查吗？他肯定会查。这是很值得我们思考的一个问题。所以我们经常会听到，“某某人已是初果了，某某人是不会再来了。"],[8,2820,2895,1,"，我们祝愿他真的是这样达到了，但对个人来讲，还是要认真。正见很重要。五、欲思维，嗔思维，害思维很多人讲，道理我懂了，但我就是转不过来，思维已经成为惯性了，嗔寻、害寻、欲寻的力量很强。明明知道下午要打坐，饭不能吃太多，看到一桌好菜，想半天还是多舀了两勺，好了，下午昏沉了。道理都懂，也有正见，但那一勺下去的时候，就是控制不住，这就是欲寻。那个寻、内心的那股力量强有力。这是邪思惟的范畴。佛陀说：“诸比库，其中正见为先导。诸比库，如何正见为先导呢？了知邪思惟为邪思惟，了知正思惟为正思惟。"],[8,2895,2961,0,"，这是他的正见。（一）、思惟的解说什么是邪思惟呢？欲思惟、嗔思惟、害思惟。那什么是正思惟呢？正思惟有两种：一种是有漏、福德分、所依果报；一种是圣、无漏、出世间、道支。哪一种是世间的呢？出离思惟，无嗔思惟，无害思惟。“诸比库，这种正思惟是有漏、福德分、所依果报。哪种正思惟是圣、无漏、出世间、道支呢？“诸比库，那圣心者、无漏心者、拥有正道者，修习圣道者的思索、思考、思惟，安止、极安止、心固定与行，这种正思惟是圣、无漏、出世间的道支。他为舍断邪思惟，具足正思惟而精进，这是他的正精进，他专念舍断邪思惟、专念具足正思惟而住，这是他的正念。如是此三法围绕，跟随着正见、正精进和正思惟。"],[8,2961,3031,1,"佛陀讲到正思维的时候专门说了这一段，很多人没有认真地想，就是这个邪思维是非常不容易弄的。佛陀说：“他为舍断邪思惟具足正思惟而精进，这是他的正精进。”正精进是什么？正精进是四正勤嘛。已生善法令增长，未生善法令生起，已生不善令断除，未生不善令不生。当那一勺想舀的时候，有没有具足正念？接下来有没有想到用正精进来克服它？佛陀说，“他专念舍断邪思惟，专念具足正思惟而住，这是他的正念，如此三法围绕。，由正见、正念、正精进三法围绕，才能够收拾邪思维。"],[8,3031,3155,0,"如果没有正见为先导，即使有正念了，也在那里想半天，我知道我现在贪心生起来了，但我还是舀了一勺，就是正精进力不够，决意力不够，所以佛陀专门强调要三法围绕。正思惟里面的出离思惟、无嗔思惟、无害思惟和邪思惟里面的欲思惟、嗔思惟、害思惟是相对的。欲思惟和出离思惟欲思惟 ——有事欲和烦恼欲，事欲是指对自己已经拥有的、可以给自己五官带来愉悦感受或令内心获得满足感、拥有感的事物贪求不舍，这是事欲；烦恼欲是指你还没有，但是你很期待拥有的事物贪求执取。仅限于内心的，这是烦恼欲。包括我们对善法的贪求，对善法的贪求最大的麻烦就是造成你追求善法的过程中失衡、不平衡，没有办法 Upekkhā，没有办法精进捨。不平衡，就会紧张、会有压力，虽然你很努力地在善法上，但是它失衡。这其实也是一种烦恼欲。"],[8,3155,3324,0,"我们每天都在努力追逐的，无外乎是为了满足事欲和烦恼欲，不管是好的、还是不好的。（二）、欲思惟的过患就像佛陀在《皮带束缚经》中讲，“犹如狗被皮带束缚，拴在坚固的桩柱旁边”，它只能围着那个桩柱打转，那个桩柱对我们来讲，就是五蕴，我们被有身邪见的皮带所束缚，被渴爱的绳索牢牢地绑在五取蕴的桩柱上，每天只能围绕着五蕴转，非常的形像。欲思惟很常见的思惟模式就是贪小便宜，因此，上当受骗在这个社会上是比比皆是。大金塔请香处有个平安建设警察提示：只要谈到银行卡，一律挂掉；只要谈到你中奖了，一律挂掉；只要谈到电话转接公检法，一律挂掉；只要谈到点击链接，一律挂掉；微信不认识的人发来的链接，一律不点；只要看到安全账户，一律是诈骗。我拍了一张，上回有贤友被骗，就是因为没看这个东西。（三）、出离思惟的五种层次和欲思惟相对应的就是出离思惟，出离思惟有五种层次。第一种出离思惟就是出家。"],[8,3324,3395,1,"第二种是禅那。当真正证入禅那安止的时候，你的心在相当长的时间（比如四小时的禅那）里远离不善，潜伏性的烦恼不会显现；第三种就是观智，当我们很纯熟地观照诸行法是无常、苦、无我的时候，是不会生起烦恼的，是出离烦恼的，出离各种欲的；第四种是道智；第五种是果智。这是五种出离思惟。我们对照一下，五种出离思惟大家拥有哪一些？出家，有身出家、有心出家。有些人是身出家了，心没有出家；也有一些人，他身没有出家，心已经出家了，这样的人比较少。而我们很多的是身出家了，心没有出家，这个比较多。"],[8,3395,3494,1,"（四）、瞋思惟瞋思惟表现为内心的排斥，包括微细的排斥，愁悲苦忧、闷闷不乐等，有起床气，看天老下雨不舒服，都是属于瞋心。容易愤怒、怨恨、抱怨，都是属于瞋思惟。欲思惟、瞋思惟和害思惟，是指形成的非常强有力的习惯。如同贪性行者、瞋性行者、痴性行者，已经成为一种惯性，这些惯性其实才是我们修行中真正的五盖。禅修老修不上去，是什么原因啦？没有镇伏五盖。“我已经坐了很久了”，不是坐着就能够把五盖镇伏的，对于很粗猛的五盖呢，需要在坐下梳理，在前行就要处理掉。"],[8,3494,3572,1,"我们都听说过，修行要调身调心，对吧？调身，坐的多直，不一定是调身。调身，首先是身体好，不是你坐得多直叫调身，你身体不好，你坐直一分钟就趴下了，对不对？身体好有很多因素，你要有良好的作息，良好的饮食，正确的训练、锻炼，保持你的身体健健康康的，健健康康的特点是什么呢？很简单，怎么讲？能吃能睡，吃嘛嘛香。你去找个老中医，他就讲，“睡觉怎么样？胃口怎么样？大小便怎么样？舌头伸出来我看看。，经常都是这个路数，想自己是不是健康的呢？拿这个来对一下，如果都好，你调身就容易，不然你坐在那要么浑身疼，要直不起腰。所以，真正的调身是把身体调好！"],[8,3572,3662,0,"调心是什么呢？调心就是调五盖，有没有欲思惟、瞋思惟、害思惟？很强的那种惯性的思维。不管逮不逮着入出息，都是各种分析、评价、判断，着急！坐得越久越难受，为什么？折腾嘛，所以调心就是削弱去除五盖。而五盖最前面的就是欲贪盖、瞋恚盖，欲贪盖、瞋恚盖就是欲思惟、瞋思惟、害思惟，把这两个处理掉，后面的昏沉睡眠掉举，都是比较简单的。而且欲贪去除以后，怀疑不容易生起来。因为怀疑本本来就是瞋思惟的副产品 —— 为什么怀疑？就是害怕嘛。来禅修本身就是想禅修，可是为什么又怀疑呢？他怕不对，为什么害怕不对呢？因为瞋思惟的人，就是要计较，瞋性行者的果报就是比较痛苦，同样一种所缘到他面前，他感受比较苦。"],[8,3662,3716,0,"而贪性行者的感受就不会那么强烈。我们经常讲贪性行者的人没心没肺，你怎么说他，没关系。同样一句话，对贪性行者说没事，你说瞋性行者，他即使不现场表现出来，回去想三天，“他这个家伙说我，他为什么这样说我？”，还有更严重、极端的人。因为面对果报的时候，比较难受，逼着他需要做各种各样的分析、评价、判断，以免自己又难受了。他的果报评价中心做分析评价判断的时候，自然各种疑就出来。所以这个疑，其实跟欲思惟、瞋思惟是有关联的。"],[8,3716,3820,1,"（五）、害思惟害思惟就是心怀伤害、恼害众生。有些人从小暴力，爱打人。我小的时候喜欢虐待小动物，现在想起来觉得很惭愧。佛陀在《小业分别经》里面讲说，“年轻人，在此，有些男人或女人用手、用石块、用棍棒、或刀枪恼害诸有情。他如此完成，他如此受持该业，身坏命终后，投生到苦界、恶处、堕处、地狱。假如身坏命终后，并没有投生到苦界、恶处、堕处、地狱，而来到人界，则无论生在何处皆多病。。多病的人就要思考，是不是过去经常有害行？这就是害思惟进一步呈现在我们身门，它已表现出恶业和果报。六、三个举例（一）、yakkha 的例子帕奥西亚多在《业的运作》里面举过一些例子，有一个夜叉yakkha，看到 Sāriputta（沙利子尊者）在月光下露地禅修，沙利子尊者刚刚剃了头，月光下他的脑袋闪闪发光，这个 yakkha 呢，莫名其妙就就生起来“我要敲打他一下”这个心，“这个秃头沙门，头上闪闪发光，我有能力把他的脑袋一拳打碎”"],[8,3820,3919,0,"，他起来这种心。这个 yakkha 力量有多大呢？他的手掌如果拍在一个山顶上，可以把那座山打碎，有这样的力量。他要用这样的力量去打沙利子尊者的脑袋。yakkha 夜叉为什么会生为夜叉呢？瞋心重，力量也很大，他这个是惯性，没来由的就是想害他一下的这种习惯，莫名其妙就是想敲他一下，这是害思惟的惯性。当他狠狠的朝沙利子尊者的脑袋打下去，由于沙利子尊者在甚深的禅定中，有禅那的保护，只感觉到头被轻轻的碰触了一下。但yakkha 这种害思惟，强烈的恶意击打一位四果阿拉汉的头。恶报现前，当场他就呼叫“太热了，我要烧起来了！我要燃烧了！”随即大地裂开，掉入火焰地狱受苦去了。"],[8,3919,4114,0,"（二）、帝思长老的例子再一个就是佛陀时代的帝思长老，浑身腐烂的帝思长老，因为他浑身发烂，没人敢照顾他，太臭了。佛陀亲自去给他清洗，并要求比库有照顾其他生病比库的义务。那么帝思长老是什么样的因缘造成这样的情况呢？在咖沙巴佛的时代，人寿两万岁，那个时候帝思长老是一位捕鸟抓鸟的人，叫萨古尼格。他每次抓到鸟以后，因为怕鸟再飞掉，他就会把它的脚掰断，把它翅膀掰断，他几千年、上万年来抓鸟，伤害无数。然而他在那一生，供养了一位阿拉汉一满钵的美食，而且是以很清净的心供养。在供养的当时，他五体投地，发愿：愿自己能证得像这位阿拉汉一样的功德，也成为一位阿拉汉。对于一个捕鸟者来讲，抓鸟是出于贪，因为他以此为生。但他把鸟的翅膀和脚折断，乃至再把鸟杀死的当下，都是瞋心。由于造下无数伤害飞鸟的不善业，命终时长久以来折磨鸟、杀鸟的不善惯行业成为令生业，令他投生到地狱，在地狱里面饱受煎熬长达数百万年。在果德玛佛陀教法时期，他供养阿拉汉的善业成熟了，令他投生为人。因为他发愿要证得阿拉汉，所以他出家成为比库。但是他伤害杀死很多鸟的不善余业成为这一生的阻碍业，导致他的令生业无法维持作为比库时的健康和生命，得了重病，全身长满疥疮，疥疮越来越大，最后全身到处都溃烂，大家称他为身体腐烂的帝思长老。"],[8,4114,4238,0,"过了一段时间，他的骨头开始碎裂，以至于跟他同住的比库都没法照顾他了，太臭了，而且太难照顾了，所以留下他一个人。有一天佛陀，以大悲心观照，发现帝思长老证悟的因缘到了，便亲自去照顾他，亲手用温水帮帝思长老清洗身体，更换弄脏的袈裟，令帝思长老生起很愉悦的感受，他的心渐渐趋于平静，然后佛陀根据他的随眠，作了简短的开示。他在闻法的时候同时观照这个痛苦的身体，诸行法的无常、苦、无我，在佛陀开示结束的时候，他就证得了阿拉汉果。很幸运的是他有供养阿拉汉的善业，如果没有呢，他的结局就可想而知。他可能再投生为人，但是由于他过去所造的这些恶业，几千年上万年就是抓鸟掰断它的翅膀、掰断它的脚，这种害思惟会不断地成熟，作为他做人的阻碍业。即使他做人，还是这个习惯；投生为畜生，也是这习惯。这样很难真正从恶趣里面逃脱出来。所以改变我们的习惯很重要，发愿也很重要。"],[8,4238,4299,0,"（三）、无害的榜样巴古拉长老在佛法里面，无瞋无害的榜样是巴古拉长老。巴古拉长老活了一百六十岁，身体非常健康，从来不生病，而且很长寿，为什么呢？因为他在高见佛的教法时期，供养佛陀药物，治好了佛陀的病；在圣莲花佛陀时代，他又造下了供养佛陀僧团各种必需品的善业，并发愿成为无病第一的弟子；在韦巴西佛和咖沙巴佛的时代，他同样做了很多类似的善业，所以他每一世都享有长寿和完美的健康。最后这一生阿拉汉活到一百六十岁，他是自己坐在火葬堆的柴堆上般涅槃的，坐在柴堆上自己点着。"],[8,4299,4414,0,"还有佛陀称赞为无诤住第一的、应供第一的 Subhūti（汉译须菩提），都是我们效仿的榜样。今天我们先学习了怎样具足正见、怎样去除邪思惟。下一堂课再来讲八正道在生活中的应用。祝愿大家都能够拥有正道、早日证悟涅槃！"],[9,0,271,1,"邪思惟的去除是很不容易的。如何去除邪思惟， 佛陀讲要 “善法围绕”，所谓“善法围绕”，就是为了捨断邪思惟而要具足正思惟及正精进。要专念捨断邪思惟，专念具足正思惟而住，这是他的正念。也就是说， 去除邪思惟首先要有正见、 正精进和正念三法围绕， 才有可能去除邪思惟。（二）邪思惟在日常生活中的体现欲思惟、 瞋思惟和害思惟， 这三种思惟在日常生活我们怎么体现呢？欲思惟就是当我们特别想要、 或者想听、 想感受某一种所缘的时候，内心的那股力量，那股特别想的力量，就是那种寻、那种思惟力量的表现。这种力量我们日常生活中去体会， 它是特别不容易去除掉的，因为感觉它跟我们血肉相连。要去除邪思惟，是需要正念、正精进再加上正见。"],[9,271,420,0,"前提是要有正见， 在正见的基础上知道什么是邪见， 邪见会导致邪思惟。当邪思惟这股力量出来的时候，我们能够以正念觉知到它，觉知到以后呢？还要能够知道这个邪思惟背后的 “见”—— 是什么样的邪见导致这样的邪思惟？如果去除完邪见以后， 邪思惟这股力量还在，就要用正精进，“已生善法令增长”，对于邪思惟来讲应该“已生不善令断除，未生不善令不生”，需要正精进来围绕。以上是我们复习上一堂课的内容， 我们也举到了三个例子， 由于过去的邪思惟导致这一生的不善业， 以及出离思惟导致我们这一生良善的的果报， 提到了亚卡打沙利子尊者头的故事， 还有拔古喇长老活到一百六十岁， 他为什么这么长寿而且健康。善吉祥长老经常带大家回向， 愿大家健康、 快乐、 长寿， 修行体证一切的道果。健康、 快乐、长寿的因是什么？它的因就是离瞋思惟、离害思惟，就是与瞋思惟、害思惟相关。除了上一堂课讲到的亚卡难德和帝思尊者这种伤害他人、恼害他人的情况之外呢， 还有一种比较典型的思惟模式， 我们称为自我伤害，伤害自己。人类，其实不管哪个民族，似乎都有一种传统，叫记仇，鼓励记仇。"],[9,420,614,1,"我们平时经常听到“杀父之仇不能不报”、“国仇家恨要牢记”、“君子报仇十年不晚”，等等，而且是当做美德来传颂，然而从佛法的角度来看，这是瞋心，是瞋恨的心，瞋恨的心是不善法，想用不善法来对治不善法，“无有是处”。那是不可能真正地、 从根本上解决问题， 因为并不是报完仇以后这个事就了了， 你报完仇， 后面的人又来报你这个仇， 冤冤相报没完没了。不管是困扰性烦恼（比如你记恨在心），还是遇到仇人就爆发成违害性烦恼，出现在身业和语业上， 不善心生起的当下就是伤害自他， 是不健康的， 会留下不良的影响力， 会在未来因缘成熟时感得不善的果报。这是不善心的特点。相反善心的特点：善心生起时，它是健康的，不管是身体方面， 还是心理方面都是健康的， 它是给自他带来利益的， 是会留下好的影响力， 在未来因缘成熟时会产生乐的果报。这是善和不善的区别。那么对于瞋寻和害寻主导下的这种心呢？它必然是不善心。所以佛陀在 《增支部一集》 里面开示说： “诸比库， 无有此事， 绝不可能，若身恶行会产生可爱、可喜、可意的果报者，无有此事！"],[9,565,658,1,"诸比库，乃有此事，若身恶行会产生不可爱、不可喜、不可意的果报者，乃有此事。诸比库，无有此事，绝不可能，若语恶行会产生可爱、可喜、可意的果报者， 无有此事！诸比库， 乃有此事， 若语恶行会产生不可爱、不可喜、 不可意的果报者， 乃有此事。诸比库， 无有此事， 绝不可能，若意恶行会产生可爱、可喜、可意的果报者，无有此事！诸比库，乃有此事，若意恶行会产生不可爱、不可喜、不可意的果报者，乃有此事。。佛陀在这样教诫的时候，并不是强迫大家必须要这样做，他只是纯粹基于他甚深的智慧和广大的慈悲， 如实客观地来告诉我们这样一个事实。佛陀观察到这样的身恶行、 语恶行、 意恶行必定会给自己带来痛苦， 也给他人带来痛苦， 会有不好的结果， 他是为了众生的利益来作这样的教诫。"],[9,658,749,1,"佛陀在 《相应部》 <受相应>36 第 6 箭经里面有教导： “诸比库，无闻凡夫为苦受所触，忧愁、疲累、悲泣、捶胸号哭、陷入迷乱。他体验到两种受——身的受与心的受·····诸比库， 具闻圣弟子为苦受所触，不忧愁、不疲累、不悲泣、不捶胸号哭、不陷入迷乱。他体验到一种受， 只有一种受——身的受而没有心的受。。在我们的生命当中， 总是会有不善的果报成熟， 令我们倍感痛苦， 觉得深受伤害。然而作为一名佛弟子， 我们应该对自己的心善加观察、 善加训练，不要以受到伤害为理由， 而进一步地伤害自己，一再重复地伤害自己，令自己被第二支箭反复射中。我们需要依照佛陀的教导，深刻省思，反省自己是否形成了恼害他人或伤害自己的瞋思惟乃至害思惟的思惟定式。如果我们已经被第一支箭射中， 佛陀讲不要停留下来问： “到底是谁在射我？”"],[9,749,839,0,"，把他记恨在心，而是要马上把箭拔出来，尽快疗愈自己的身心。记仇、 报仇， 不是哪一个国家或者民族独有的文化传统， 瞋恨心是众生共有的烦恼， 只是程度上有深浅。那么其实我们去看， 瞋恨乃至伤害他人的身语意恶行， 它其实并不会一直都存在， 天天打人、 天天骂人，这样的人其实不存在。他敢这样做，马上就会产生果报。但我们往往会把别人曾经骂过你一次， 说过你一次， 乃至动过一次手 —— 记恨一辈子。然后不断地回忆起这件事情，不断地以此再伤害自己，这是根本的问题。所以，人类普遍的问题是在受到伤害以后，由于无法接受而不断地给自己造成进一步的痛苦。西方哲人费斯汀格讲到 ‘人类的痛苦只有百分之十是别人造成的， 百分之九十是自己造成的’"],[9,839,961,0,"，换言之，我们在生活中碰到的所谓苦难，纯粹由外在因素造成的只占百分之十， 剩下的百分之九十都是因为自己对这个苦难紧抓不放而衍生出来的痛苦， 源于这种不健康的思惟定式造成的苦远远多于苦本身。当然从佛教的角度来讲， 其实我们应该知道， 就是这个百分之十的苦， 也并不是无缘无故飞来的横祸， 它就是我们的业。从这个角度来讲， 百分之一百都是我们自己的事， 没有别人的事。那个百分之十受到的伤害是你过去不善业成熟所导致的， 剩下百分之九十是你自己折腾出来的。所以百分之一百都是你自己的事， 没有别人的事， 这是佛教徒的观点。当我们认定这个世界不公平，认定是别人伤害自己，认定自己本不该受到这样的伤害， 或者对此感到恐惧而无法释怀， 由此而衍生出更多的苦，这就如同中箭之后，不去想办法把箭拔出来，而是让那个箭继续扎在心中， 想起来就往里面再扎一次、 想起来就往里面再扎一次。那也如同我们看到一泡屎， 觉得臭， 反而把它捡起来放自己口袋里，时不时翻出来闻一下，说： “嗯，真臭。，然后再把它放回口袋珍藏起来，一辈子都不扔掉。"],[9,961,1002,1,"我们经常会说别人： “你这人自讨苦吃!”，什么是自讨苦吃？这个就是典型的自讨苦吃，这个就是佛法讲的无明与愚痴。（三）如何面对不可意所缘的恼害？—— 宽恕的能力那么如何去面对这些不可意的所缘， 面对这些恼害呢？古今中外的圣贤，不光是佛陀，都给出了贤明的教导。在中国，老子讲“以德报怨”，孔夫子讲“以直报怨”，但我们从来没有听说古今中外有哪一个老师讲要 “以怨报怨”， 没有听说过， 只要他是一个像样的老师，他就不会讲“以怨报怨”"],[9,1002,1104,1,"。即使到近代，我们也有很多伟大的人物，像印度的圣雄甘地、 宗教改革家马丁路德金、 南非的曼德拉， 都是以非暴力、理性、和平的方式达成自己理念的典范。曼德拉有一个非常著名的故事： 他曾经被监禁二十七年， 期间受尽各种折磨。当他走出监狱后， 却选择了用宽容与和解来征服这个世界。他非但不支持把白人赶进大海，反而呼吁黑人将武器扔到大海。出狱四年后， 曼德拉当选为南非总统， 他专门邀请了在狱中看守他的三位狱警来出席总统就职仪式。这三位狱警在曼德拉被监禁期间， 经常侮辱痛打他， 甚至在他的饭里泼脏水、 放脏东西， 然后强迫他吃下去。当这三位狱警接到邀请的时候， 内心惴惴不安， 他们不知道会发生什么事，然而在就职仪式上，曼德拉致辞时说： “能够接待这么多尊贵的客人我深感荣幸， 但最让我高兴的是， 当年陪我在罗本岛度过艰难岁月的三位狱警也能到场。"],[9,1104,1157,0,"， 然后他把三位狱警一一介绍给大家， 并分别和他们拥抱， 对他们三人说： “我年轻的时候， 性子很急、脾气很暴躁， 在狱中正是在这三位的帮助下， 我才学会了怎样控制自己的情绪。，这番话，让虐待他二十七年的三位狱警无地自容，仪式结束以后， 曼德拉再次走到这三位狱警身边， 平静地说出了那句全世界都在传颂的话，他说： “当我走出囚室，迈向通往自由的监狱大门， 我已经清楚， 如果自己不能把悲伤和怨恨留在身后， 那我其实还在监狱里面。"],[9,1157,1286,0,"，当时这三位狱警泪流满面。曼德拉当选总统以后，他并没有像外界所担心的那样，兴起一场对白人的大复仇、大清算，他超越了受害者的心态和非黑即白的对抗思惟， 他还原真相， 但同时宽恕罪恶， 正是他以这种宽阔的心胸推动了饱经种族压迫的南非超越仇恨走向和谐， 顺利实现了南非和平向民主过渡， 而曼德拉也以自己的实际行动说明——告别仇恨的最佳方式是宽恕，而非仇恨。美国的一个教禅的禅师， 叫杰克· 康菲尔德， 他分享过一个故事，他说有一次在火车遇到一位在监狱里做社工的年轻人， 这个年轻人给他转述的故事： 监狱里有一个十四岁的男孩， 在中国我们讲十四岁以下属于未成年，犯罪不用坐牢，但在美国满 14 岁就要服刑，这个十四岁男孩为什么要坐牢呢？他当时想加入一个黑帮会， 但根据这个黑帮会的帮规， 他必须杀死一个人才能加入那个帮会， 所以这个孩子就射杀了一个陌生的孩子。之后他就被逮捕了， 然后他接受审判被定罪，就在这个男孩被扣上手铐带走之前， 法庭上被枪杀男孩的母亲从座位上站了起来，看着这个男孩的眼睛，对他说：“我要杀了你！”"],[9,1286,1339,0,"，然后坐下。这个年轻男孩在监狱里呆了一年左右， 被枪杀男孩的母亲要求探视这个男孩。男孩对此很恐惧，被害者的母亲对他说： “我要跟你谈一谈。，这位母亲跟这个男孩聊天，问男孩： “你需要什么？比如说烟或者什么其它的物品？”， 然后她走之前给这个男孩留下一些钱。从那以后， 这位母亲每隔几个月就会来看他一次， 等到这个男孩入狱第三年、 第四年， 她开始更加有规律地来看他， 并且跟他交谈，当这个男孩到十八岁的时候， 他可以减刑出狱。这位母亲就问他： “你出狱以后打算做什么呢？”"],[9,1339,1393,1,"， 男孩说： “我不知道， 我没有任何家人，我一无所有。， 这位母亲就说： “我有一个朋友开了间小型的工厂，或许能帮你找到一份工作。。因此这位母亲就在监狱的假释官那边为这个男孩安排这件事，然后她又问这个男孩： “你出狱以后，准备住哪儿呢？”，男孩回答说：“我不知道我要去哪里。，母亲说：“我家有个空房间， 或许你可以跟我一起住。于是男孩出狱以后就住进了她家的空房间， 并接受了这位母亲给他找的工作。大概六个月以后， 这位母亲对这个男孩说： “我真的需要和你谈一谈， 到客厅来吧！”然后她看着男孩说：“你还记得我在法庭上，你接受审判的那一天，我告诉你说‘我要杀了你’吗？”"],[9,1393,1449,0,"，男孩说：“是的，夫人，我永远都不会忘记那一天。，随后这位母亲转过头来对他说： “嗯，其实我已经杀了那个你了。你看， 我不希望一个冷血杀人的男孩继续活在这个世界上， 所以当你在狱中的时候， 我开始探视你， 给你带去礼物，照顾你， 等你出狱以后， 我还邀请你到我家来， 给你找了一份工作和住的地方， 我现在也是一个亲人都没有了， 我的儿子， 我唯一的一个儿子， 可以和我一起生活的人， 他已经走了， 所以我一直在尝试改变你，现在呢，你也再不是原来的你了。我现在什么亲人都没有，我想知道你愿不愿意留下来， 我需要一个儿子， 我想知道， 是否能够收养你？”"],[9,1449,1536,1,"，听到这话，男孩答应了，这位母亲收养了他，成为了她的孩子。康菲尔德说： “什么是人类的宽恕能力？就是在任何生活状况下，保持人类的尊严。。如何具备这样的能力呢？就如故事所呈现的，宽恕不仅仅指对他人宽恕， 更是在美化自己的心灵， 是一种满足自己生活的能力。宽恕，尤其是一种释放的能力，它释放痛苦、悲伤，以及过去的伤痛和背叛所带来的负担， 去选择慈爱。宽恕能够让我们把渺小独立的自我意识转换成一种重新开始的能力，一种释怀的能力，一种爱的能力。有了宽恕， 我们就不想去攻击和伤害， 包括对我们自己。没有宽恕，生活将无法忍受。很难想象一个没有宽恕的世界，因为我们将被束缚在过去的痛苦中， 只能一次又一次地重复它， 不会有任何的释怀。"],[9,1536,1606,0,"然而宽恕并不容易， 印度一位叫梅赫尔· 巴巴的神秘主义者， 他说过一句话： “懦弱的人是不会有爱和宽恕的。，然而总要有人站出来说： “让悲伤在我这里停止吧！我不会把这种悲伤传递给我的孩子们。，所以不管是在爱尔兰还是在以色列，总有人说： “我会接受背叛和痛苦， 我会忍受， 但我不会报复， 我不会把这些传递给下一代，以及传给子孙后代。康菲尔德最后分享到， 有一次他去看望在国外被迫害并且被监禁的出家人，他问这些出家人： “你们曾经害怕过吗？”"],[9,1606,1682,1,"，这些出家人就告诉他： “是的，我们非常害怕，我们害怕的是，我们最终会憎恨我们的看守 —— 因为这样我们会失去悲悯心， 失去悲悯之心是我们最害怕的事情。。真正的出家人不害怕肉体上或者精神上被人折磨伤害， 害怕的是自己的内心失去了平静， 失去了悲悯。所以佛陀在 《法句经》里讲：“‘他打我骂我，败我劫掠我’，怀有此念者，怨恨不止息。‘他骂我打我，败我劫掠我’，不怀此念者，怨恨得止息。宽恕是一种自我救赎， 排斥、 伤害他人是瞋， 受到伤害后无法释怀而继续令自己痛苦也是瞋， 所以在修正瞋思惟、 害思惟的时候， 我们应该努力尝试放下这两者。"],[9,1682,1742,1,"（四）如何修正错误的思惟方式？所以如何修正错误的思惟方式呢？首先我们讲， 要具足正见才能去除邪见，才能去除邪思惟。所谓世间法的见，就是我们的观念，我们对生命、对世界的看法，宏观来讲就是世界观、人生观、价值观，它指引着我们一生的方向。然而，正如“见”有正见和邪见之分，世界观也有高尚与低俗、 正确与错误之分， 它导引我们的生命朝向提升或者堕落。思惟就是我们日常所说的思惟定式、 思惟习惯， 这些都是我们在世间行走， 走向正道还是邪道的关键因素。要调整改变我们的见，就要修正我们的人生观、世界观、价值观。"],[9,1742,1802,0,"一个人如果能够认真学习、 勤于思考， 还是容易做到的， 但是一个人的思惟定式要修正就很不容易， 就像上一堂课我们讲到亚卡难德一样， 由于过去生习惯性的瞋思惟、 害思惟， 所以这一生投生为亚卡， 又由于这样的思惟定式，他造下了严重伤害的恶业， 这导致他当生即投生到地狱， 承受剧烈的痛苦和折磨。同样在日常生活中，欲思惟、瞋思惟、害思惟也处处左右我们的人生， 要削弱乃至去除这些邪思惟， 需要在正见的指导下长时间地训练， 把旧的习性打磨掉， 建立并巩固新的习惯。要借着重复缘数数习性的力量去建立新的习惯， 否则旧的习性总是会通过自然亲依止缘的缘力，在有因缘的时候它就会冒出来。"],[9,1802,1940,0,"这个具体怎么来看呢？比如说， 我们经常以貌取人， 看到一个人长相比较猥琐， 或者哪一个人长得高大威猛， 内心会自然而然起来那种倾向， 就是排斥那些其貌不扬的人。而我们总觉得那个高大威猛的人，就心地善良，那个长相不够威猛的人，就觉得他有很多问题。内心就会给他做很多的定义和标签， 这就是思惟定式。所以上一堂课提到警察宣传如何防止被骗， 你为什么会被骗？往往是因为你有一种贪小便宜的思惟定式。你没有贪小便宜的思惟定式，你就不会被骗。这个思惟定式不仅仅是人类， 所有众生， 尤其越低劣的众生， 这种思惟习惯就越坚固。平常我们都可以看到， 比如房间里面进来一只蜜蜂，你会发现它不断地撞那个窗户，它一次一次地去撞那个窗户，直到把自己撞死为止， 它不会选择回头试一下。这个就是它的思惟定式，认为有亮光的地方就能出去，它看到亮光，撞到玻璃上了，它还是一次一次去撞， 这就是它的思维定式。但是如果是一只苍蝇， 它的反应就会不同， 你把苍蝇和蜜蜂装在同一个玻璃瓶里面， 然后把瓶底朝向亮光的地方， 你会发现， 蜜蜂会不断地撞击那个瓶底， 而苍蝇就就比较聪明， 它只撞一下， 撞了一下就开始转方向， 它会看看有没有别的出口。"],[9,1940,2010,0,"同样是人， 有些人撞死南墙不回头， 有些人撞了一次以后就会长智慧： “为什么被撞啊？有没有不撞的方法？”，这就是改变的开始，如果你连这都没有，那改变是非常困难的。三、生活中的八正道（一）对人、对事、对物、对食物的八正道在日常生活中， 怎么去观察或者怎么去改变自己的思惟定式呢？我老提生活中的八正道， 八正道不是在修观的时候才用上， 修观的时候才用上那是闭眼八正道， 那是证得道智的八正道。大部分人都还不会修观， 那是不是百分之九十以上的佛教徒就跟八正道没关系了？这显然是错误的， 不是这样的。佛陀的法是真理， 真理就是放之四海皆准，就是一切处都能够得到它的利益。"],[9,2010,2133,0,"对于生活中的八正道， 我的建议是， 首先你要能够识别两种机制。这两种机制以前讲过， 就是鼓励机制和保护机制。鼓励机制和保护机制来源于物种的习惯性反应， 习惯性反应就是任何生命为了它的存在、生命的延续存在、 以及物种的繁衍， 自然而然地形成的两种机制。凡是对你的生存和物种繁衍有帮助的那些所缘和目标， 你接触到它， 就会感到快乐，不管是眼睛看到、耳朵听到、鼻子闻到、舌头尝到、身体接触到的， 大概率是这样的。当然有小部分我们讲， 比如说你吃致幻剂、吸毒，那你要抬杠就没办法了，但是大部分情况是这样的。凡是能对你生命存在和物种繁衍有利的， 你就会感觉到快乐， 为什么要感觉到快乐呢？因为它要鼓励你去做， 鼓励你去做后， 你生命就能够存在，物种就能够繁衍。比如你吃饭，肚子越饿的时候，就越觉得饭菜好吃。但鼓励机制的特点是快乐的边际效应递减， 也就是说你第一口吃得很快乐， 第二口快乐就开始下降， 到你吃饱的时候就没有快乐， 再吃下去的时候， 你就会痛苦。为什么会痛苦呢？再吃下去，就会伤害你的胃， 对你的生存没有帮助。"],[9,2133,2199,0,"生命系统从鼓励机制慢慢过渡到了保护机制了。生命中无外乎就是这两种机制在左右着你， 凡是对你现在的生存和物种繁衍有帮助的， 你一定体会到快乐， 凡是对你当下的生存和物种繁衍可能带来伤害的，它就会让你产生痛苦。鼓励机制还有一个特点，对于会带来快乐目标，想蕴（Sañña）会留下标记,但会把这个快乐效应递减、乃至消逝的事实忽略不计。我们总是记得 “羊肉是好吃的， 榴莲是好吃的”， 但我们不会记住 “吃三斤羊肉是会吃撑的”"],[9,2199,2273,0,"， 你不会记住这个事实。对于会带来快乐的东西，我们未来对这个所缘会精准识别，比如说，喝老班章，要喝几年的老班章， 哪一颗树上的老班章， 精准识别。对会产生痛苦的所缘呢？我们会模糊识别。什么叫模糊识别？只要有一点像是会伤害到我， 我就一定要把它屏蔽在外， 因为我们经受不起伤害。伤害一次， 我可能就死了，这个死的事情是不能够被允许出现的，宁错 9999 次也不愿意可能有 1 次我被伤害到。对可能产生伤害的这个所缘， 我们的防范会无限扩大。为什么会形成瞋思惟、 害思惟呢？就是他曾经经历过一次痛苦， 然后就抓取这个痛苦， 把这个痛苦无限扩大，“一朝被蛇咬，十年怕井绳”"],[9,2273,2340,1,"，得牢牢记住，牢牢记住的目的是为了“下次不要再碰到”，就是这个目的。但是他忽视了其实这个事情早就过去了。应该学习的是： 再碰到这个情况， 要怎么正确地去观待它？而不是把它变成一种恐惧， 变成一种错误的认知行为模式， 想颠倒、 心颠倒和见颠倒。形成一个牢固观念： “这个人就是这个样子，这件事就是这个样子”。要先看透这两种机制， 在每个当下你是被哪一种机制捆绑算计。我们常常说： “我是佛教徒啊！佛教徒就是有信仰的嘛！有信仰的就是有正见啊！我们都知道是因果啊！一切都是因果。知道没有一个东西是常、乐、我、净的，都是无常、苦、无我的。"],[9,2340,2405,0,"，大家都知道，对吧？但是从日常生活来看看呢？比如对人、 对师长， 对师长我们一般普遍的看法是什么呢？就是师长他必须永远品德高尚， 师长永远就是我一问他， 他就能回答， 师长应该要诲人不倦， 他不可以疲倦， 不可以累， 师长怎么会累？师长要无所不能、无所不会，师长不可以犯错误，师长都犯错误，那还叫师长吗？那我们想一下， 这些是什么？是常见。你认为师长必须这样、永远这样 —— 常；“师长就是要给我解决问题的， 师长就是要给我带来快乐的”"],[9,2402,2467,1,"—— 乐；“师长一直这样不会变的，有一个不变的，像‘我’的存在“—— 我；“师长永远不会犯错”—— 净。你这样看待师长的态度就是常、乐、我、净的态度。你自己对一下，对师长的态度是不是这样？不要摇头啊， 不信哪一个师长出点问题的时候，你就会撞墙，“噢，我的信仰崩塌了！”，它是这么来的。对父母呢？“我提的任何要求你都应该满足我，不然你把我生下来干什么？你生下来就要对我负责”—— 常、乐、我、净。“父亲母亲永远爱你”就是常，“永远给你快乐” 就是乐，“父母亲永远不会变” 就是我，“父母亲永远都是这么美好， 不会老、不会死”"],[9,2466,2542,1,"就是净。对子女呢？“孩子永远是要听我的话， 永远是很乖的， 永远就是不会捣蛋，学习都是 150 分”，这就是常、乐、我、净。对亲人呢？“你是亲人嘛，我有任何需求、要求，你一直要帮我啊！”对朋友呢？“朋友你不能两面三刀啊！朋友就是要两肋插刀”对路人呢？“路人我跟你不相关， 你不要踩我的脚指头， 你踩我脚指头，我就跟你没完，你长眼嘛？”仇人呢？仇人永远就是仇人，一想起仇人，他永远就是坏的。但是我们往往分辨不出来， 什么是真正好人？什么是坏人？就像恶友。佛陀讲说你要远离恶友， 但真正让你要远离恶友， 你又没有办法识别是谁是恶友。比如今天心情不好，朋友说： “唉，没关系～我们去酒吧喝几杯酒，改天我们去哪里玩一玩。"],[9,2542,2638,1,"，你就觉得这个朋友实在是很够意思，其实他是恶友；如果有人说，“没关系，我们去大金塔找祜巴给我们开示一下。“还要去大金塔？！多麻烦！”这就是你对人的态度喽！这里面都是各种的见， 对吧？那有没有正见为先导呢？我们经常这样讲，“我有正见啊！”，马上对照一下，看你对平常老要面对那些人的态度，你觉得有没有正见？人事物嘛！上面是对人，接下来，对事。出家人、佛教徒就讲：“我要解脱，我要解脱。”很好，要解脱，今天说你一句，你就受不了了。解脱是要断除烦恼， 彻底断除烦恼才能证悟涅槃， 解脱是我们从烦恼的束缚里面走出来。但前提是， 你知道自己有烦恼、 自己有哪一些烦恼、应该用什么方式来去除这个烦恼。当别人给你一个境界，你的烦恼现形了，原则上你要看到： “哦，解脱的机会来了！我居然在这个境界里面， 会起烦恼， 说明我有这个烦恼， 那我怎么从这个烦恼里面解脱出来？”"],[9,2638,2702,1,"， 因为起烦恼就是你被烦恼捆住了嘛， 被捆住了要怎么解脱呢？你们有几个人想这件事？“报告祜巴， 那个人刚才对我如何如何， 你要给我主持公道啊！”， 他想解决的不是解脱的问题，而是你要帮我解决我的得失问题，让我的烦恼多增长一点。“你看，我跟祜巴关系很好吧”， 我让祜巴批评你！你说是解脱烦恼吗？是解脱吗？当我们来大金塔，来法住，来曼听做了一点善事，就想： “慧心 Bhante 是不是今天应该表扬我了？我有很大的功德 “。我们做善行是训练自己的心， 不是要得到别人的肯定和表扬。"],[9,2702,2776,0,"“慧心 Bhante好久没有回来了， 我做给他看一看”， 结果可能慧心 Bhante 好像没有什么反应， 难受好几天都反应不过来。这个是做善行的态度吗？有做善行的正见吗？有没有正见为先导？我们来看在家人做家务事， 女众确实是很辛苦， 要工作， 要养儿育女，还要做家务事、做饭，男的回来看手机，开电视，等着饭熟。女众经常说：“怎么那么倒霉，碰上这个家伙，做牛做马！”，有没有正见为先导呢？怎么样以正见为先导呢？反正不管你怎么生起，还是得做，对吧？除了做， 你还有其他什么办法吗？骂呢， 是不善行。最后这个家会是什么情况？不管孩子还是丈夫回家之前、 进门之前她都要做一下深呼吸，为什么？因为一进门，就会劈头盖脸： “嗷，你还知道回来呀？！”"],[9,2776,2838,1,"。家庭本来是爱的港湾，但回去就要承受机关枪、炮弹式的咒骂。那你既然选择这样的人，你也不想离开，每天还得做，你何不带着这样的见解： “我为众生服务啊！先生也是一个众生。，你把他当做善行的对象嘛，你只要转念： “唉，我是在做供养，为他做服务。，那就是善行啊！用善心、欢喜心在做，都是善行啊！干嘛一定要带着那么负面的情绪，反正都得做嘛！转一个念而已嘛！你看，正见多好啊！以正见为先导，一切事都变成善事，家事也变成善事。"],[9,2838,2903,0,"工作的事也是这样，“我就是为了赚几块钱嘛！不是来给你做奴隶的。你以为是老板，就了不起啊！”，当我们带着这种心态的时候， 会发现做工作怎么做怎么不顺， 怎么看领导都觉得他今天就想算计你、明天就想克扣你工资、后天就想剥削你，心里就很难受、不舒畅。只要是正命，工作也是为人民服务嘛！你在为社会做贡献。当你带着这样的心态工作，不但赚到钱，还能做善行，多好！以正见为先导，有没有这样做？应酬的事：朋友的应酬、工作的应酬。有正见为先导的时候，你会看： 有必要应酬吗？没有必要就别去喽， 对吧？都是一堆酒肉朋友，有什么好应酬的。有没有正见呢？总说： “我很忙，很多应酬，都在喝酒，每天喝到吐。"],[9,2903,2958,1,"，谁害你的？没有正见造成的。什么是善事？什么是恶事？佛陀讲，“远离诸恶事”，离恶事的前提要搞清楚什么事是恶事？不是正语的事就是恶事、 不是正业的事就是恶事、不是正命的事就是恶事。但什么是正语、正业、正命？能不能做到正语、正业、正命？有没有做到以正见为先导？对于事务， 在我们出家人来讲， 就是衣食住药四资具。在家人无外乎衣食住行， 我们总是需要的不多、 想要的太多。看到别人有的东西，“噢，他买了个豪车，我要比他更豪。"],[9,2958,3025,1,"“她买了一个这样的裙子，我要买三条。，处处攀比的心。是满足自己的虚荣，而不是需要。有没有正见为先导？对物的需求，往往我们讲——玩物丧志，你带着虚荣的、 玩的心态去看待所有物品， 而不是需要， 就是没有正见。对于食，食物的食，在佛教里面，食分成精神食粮和物质食粮，物质食粮就是抟食，就是普通的食物。触、思、识三种精神的食粮。人需要物资食粮更需要精神食粮， 物质食粮哪些是你需要的？精神食粮哪些是你需要的？思考过吗？有没有正见为先导？"],[9,3023,3112,0,"接下来是对自己， 对自己无外乎是身体和我们的心， 身心两个部分。对我们的身体， 你真的知道你的身体吗？了解你的身体吗？很多人到晚期癌症的时候才知道： “我快死了～我着急啊！怎么办啊？有没有特效药靶向治疗一下子啊？”， 其实最后呢， 癌症没有把你搞死，自己把自己吓死，很多人是这样的。佛陀教导对于自己的身心要用四念处。那身念处， 身念处包括了几个层面，终极的层面佛陀讲《大念处经》的身念处，他是讲到究竟的色法，看到我们身体的二十八种色法，无常、苦、无我的共相，这个是真正的身念处。粗一点的， 佛陀教导三十二身分， 三十二身分也是身念处；我们最熟悉的入出息念， 也是身念处；四界差别也是身念处；九种坟场观、不净观，这也是身念处。"],[9,3112,3211,0,"不同性行的念处——身、受、心、法念处对于心的部分呢？无外乎受、想、行、识，佛陀教导的观法就是受念处、心念处和法念处。修习四念处对我们的修行到底会带来什么样的利益？以及它是一种什么样的修行方式呢？佛陀教导四念处， 是针对不同性行的人。注释里讲， 性行分成爱行人(就是贪行比较强的人)、见行人（总是执着自己的知见）、止行人（修止禅的人）、观行人（修纯观的人）。每一种人都有钝根和利根的差别， 对于钝根的爱行人， 要修习身念处， 钝根的爱行人因为他执着自己的身体， 要修身念处的不净， 观察身的不净，去除渴爱。"],[9,3211,3279,1,"利根的爱行人呢？他要修更微细一点的受念处。我们讲 “有受皆，他要体验那个苦，通过苦来去除自己的渴爱、对这个身体的渴苦”爱。对于钝根的见行人呢？要修心念处， 见行人的慧根比较强， 就需要更深一步。心念处， 我们说观心无常， 因为心的生灭速度非常地快，修心念处是要断除我们的常见， 因为它刹那生灭， 可以断除我们的常见。利根的见行人，修法念处，法念处就是五蕴、十二处、十八界，各种界分别，把它分析成十八界，发现里面“无我”"],[9,3279,3343,1,"，所以他修“无我”，去除我见。对于钝根的止行人， 也适合修身念处。钝根的止行人容易取到禅相，修比较粗的、稳定的目标比较容易成就。利根的止行人修受念处、 钝根的观行人修心念处、 利根的观行人修法念处， 这些基本上是特指修观智时候的状态。但你日常的时候同样可以用得上的， 只是你不容易判断出来： “我到底是一个爱行人还是见行人呢？我是钝根还是利根呢？”。我们一般情况下， 不愿意把自己分在那个钝根上，对吧？“你说我笨，你才笨呢！”"],[9,3343,3477,0,"，其实你去修一下就知道了，如果你觉得你不钝，但是你觉得自己是个贪行人，那你修修受念处看， 身心的每一种受， 能不能清晰地觉知它？觉知完以后能不能生起“诸受都是苦，有受皆苦”的这种感觉，然后能看到它的过患，能生起厌离心，去除对这个目标的渴爱。如果觉得： “这个一用， 马上就能起到效果”， 那可能你就是利根了， 如果你搞不定，就不一定是利根，回过头来赶紧试一下身念处。身念处， 佛陀教三十二身分和修四界差别， 也是不容易修啊。其实比较容易的方式有两个，一个就是入出息念， 修入出息念， 先体会一下， 是不是很容易地取到入出息的所缘， 然后按照帕奥西亚多现在的要求，在鼻中隔里面，那个空间上、触点上找到它的气息，一开始位置找不太清楚，找到了以后，你能够安住在上面，你不会紧张，你能取到，基本上你是贪行者。然后你能够持续地、老实地，不分析评价判断， 那么这个贪行者通常来讲不是很利， 利一点的人就还会有点折腾，利根的人就喜欢折腾，初学普遍这样。再一个行住坐卧，按照《大念处经》讲的，在四威仪里面觉知自己身体的状态。"],[9,3477,3571,0,"这里我们特别需要搞明白一个问题， 很多人对于身念处和受念处是混淆的，帕奥西亚多在《正念之道》里面也特别强调了，身体就是身体，身体就是二十八种色法，简单来讲，是这个叫做身体的身，二十八种色法， 下来就是根本色， 就是地水火风， 其他你不容易觉察到，但地水火风你是容易觉察到一点。虽然你不是直接见到完整的究竟法，但是基本色法的特征你是可以体验到的， 比如说铁， 它是以硬为主要特征的色法堆积， 这种硬你是能体会到的， 它有地大硬的特相。在日常行住坐卧四威仪修习身念处呢， 是先透由对地水火风特相觉知。有人就说： “诶，你看这个地方是痒的，这个地方是麻的，这个地方是有酸酸的。"],[9,3571,3655,0,"，这个就不是身念处了，它是一种感受，所以要把什么是身念处，什么是受念处，要分清的。你修身念处就是身念处，受念处就是受念处， 要是把它们混在一起呢。目标混淆， 心就不会变得越来越清明。《注疏》 里面讲， 身和受是造成渴爱的主要原因， 要去除钝根爱行人对身的渴爱呢？观察身体的不净是合适的。如果你确定你是钝根，要观察自己身体不净， 因为身这个粗的目标， 是造成渴爱的主要要素。对于这一类人而言，身念处是到达清静之道的一个路径。"],[9,3655,3747,0,"为了去除利根的爱行人对感受的渴爱呢？观察感受的痛苦性是合适的， 所以如果你觉得你是一个利根的贪行人， 你要去观察所有的感受的痛苦， 因为感受这个微细的目标是造成他们渴爱的要素。你看到对感受的这个渴爱，那么修受念处容易达到清静之道。心和法是造成错误见解的主要原因， 对于钝根的见行人而言， 观心是合适的，心是造成常见的决定因素，因此应当观察心是无常的。根据注释书的分类， 就是如果你对贪欲的心、 欲贪的心， 对这些心进行观察，就可以去除认为“心是恒常的“这种颠倒错觉，所以对于这一类的人而言，心念处是达到清静的好路径。"],[9,3747,3821,0,"利根的见行人， 用观察法的现象是合适的， 因为法是造成我见的决定因素。我们觉得“五蕴是一个整体，十二处是我的，十八界是我的，五蕴是我的。，因此应该依照想、触、五盖、十二处、十八界去观察它们， 以便去除“法是我的”的错误颠倒， 这类人应修习法念处。心和法除了造成错误见解之外， 也会造成渴爱；身与受除了造成渴爱之外， 也会造成错误见解。但是身和受影响渴爱的作用偏强， 心和法影响错误见解的作用偏强，这是它们之间的差别。"],[9,3821,3895,0,"那么如何来观察呢？在观察之前， 我们首先要明白， 什么是错见以及错见的危害， 《注疏》里面有这样一句话： “他所看的事物没有正确地被见过，他没有正确地见过他所看的事物，由于不见实相故，他受到枷锁的束缚，这个受束缚的愚人无法得到解脱。，大家能不能理解呢？帕奥西亚多解释说： “ ‘他所看到的事物没有正确地被见过， 他没有正确地见过他所看的事物’ 是指什么呢？如果要照见实相，禅修者应该照见究竟名色法， 但是如果他见到的是男人、 女人、 儿子、女人、父亲、母亲等等，这种见就是属于叫做‘他所看到事物没有正确地被见过’”"],[9,3895,3960,1,"“他没有正确地见过他所看到的事物”， 他看到的是男人、 女人、父亲、 母亲。为什么呢？因为你不能够破除名色的密集， 将刹那生灭的密集组合作为你的目标，给它一个概念化的定义：男人、女人。为什么会被枷锁所束缚呢？因为导致了对纯粹是五蕴集合体之物产生邪见。因为有这种邪执的见会增加欲贪——我的男人、 我的女人。你认为他们是常、乐、我、净的实体，要抓取它，会增加欲贪、瞋恨各种烦恼。第三句，“由于不见实相故，受到枷锁的束缚”"],[9,3960,4000,0,"，既然没有正确地见到究竟名色法， 他就一直地受到枷锁所束缚， 这里受到枷锁束缚是指： 他无法脱离邪见， 如果他错误地认为有男人、 女人等真实的存在， 这种错知就是无明。由于无明就会对这些目标生起爱。越来越强的爱就称为取。由于无明、 爱、 取这些烦恼， 他就会造下善业和恶业，这些善恶业就称为行。由于这些善恶业的力量就会造成再度投生， 产生新的五蕴，如此一再轮回生死。所以第四句话说，“这个受束缚的愚人，无法得到解脱。"],[9,4000,4116,1,"，怎样才能够断除无明爱取呢？你必须透视究竟名色法以便知见实相。在这里依据借着分离而确定目标以及彻底地分解事物密集的表相这两句话， 应当了解到： 此人观照身只是身， 而不将身视为其他事物， 因为他能够见到色聚及透视其中的究竟色法。这意味着什么呢？在这个确定是无常、苦、无我、不净的身体当中，他见不到常、乐、我、净。身念处就是在观照无常、苦、无我与不净的这些特质所集合起来的这个物体，他观照究竟色法，一生即灭，因此是无常的；它们一直受到生灭的逼迫， 因此是苦的；它们之中没有恒长的 “我” 存在，因此是无我的；它们一直伴随着可厌恶的颜色、 气味等等， 因此是不净的。如此，他将究竟色法只观为无常、苦、无我、不净。事实上根本没有观照我或者观照属于我之物的身念处， 观照头发等集合处的究竟色法才算是真正的身念处，这是从观智的层面上来看这样的问题。以上这一段讲观智的部分是就究竟层面的实相来观察。那在日常生活中，你可以从概念的层面上来思惟。佛陀从八苦：生、老、病、死、爱别离、怨憎会、求不得、五蕴炽盛的这种体会上也能体会到无常、苦、无我、不净，这样不会从业果的角度上生起邪见，对我们刚才讲的人事物起不正确的见解。"],[9,4116,4234,0,"日常生活中的七随观最后佛陀教导七随观， 观照身无常是无常随观， 观照身苦是苦随观，观照身无我是无我随观，观察身体的无常、苦、无我三相而厌离身体是厌离随观， 观察身体的无常、 苦、 无我三相而远离对身体的贪欲是离欲随观， 以倾向于寂灭的心观照身为无常、 苦、 无我是寂灭随观，观照身为无常、苦、无我而捨弃它的心是捨遣随观。在日常的生活中， 我们同样可以从概念的角度上来看这个身体有没有无常。今天早上七点钟妙音贤友的母亲过世了， 大家去医院送别。我们直接就看到这个无常，没有恒常的。妙音贤友对她母亲很敬爱、很爱护，但再爱护，总有离别的一天，这就是无常，就能够从无常的角度来看；走的人已经很长时间瘫痪在床， 生命就是苦的， 病就是苦，能不能有苦随观？而这个过程你完全不可控制， 这是无我随观；这样躺在那的身体， 你会觉得它很可爱吗？这么热的天， 你一天不洗澡就臭得不行， 你会很喜欢这个身体吗？能不能生起厌离的心呢？如果这样的身体彻底地灭除， 涅槃呈现， 导向寂灭， 我们的心真的想去吗？我们能不能生起这个心？"],[9,4234,4314,0,"能生起，那才能讲说，我有解脱的心。今天我们就学习到这里。以此愿大家都能够照见自己的无常、 苦、无我，早日证悟涅槃！"],[10,0,235,0,"163 讲-摄集-二十二根 1古源尊者尊敬的祜巴大长老、尊敬的各位尊者、各位尼师、各位法师、各位贤友晚上好!今天我们继续学习《摄阿毗达摩义论》第七章“类别之概要”二十二根的部分。我们上堂课学习了十二道分，这堂课学二十二根。一、二十二根（一）根的定义二十二根，根在巴利语叫 Indriya，Indriya 是由 indra+iya 的组合词，indra 是神、王的意思，Indriya， 《巴汉词典》是操纵主要的，五官（根），官能的作用。在《阿毗达摩》Indriya 的意思是能够在它所管辖的范围内控制相应法，称为根。"],[10,235,345,0,"注疏讲， 国王要统领整个国家， 但是他一个人管不过来， 要委托其他大臣来分管这国家。就像中央政府， 总统下辖各部部长， 部长们各自管理相关领域里的事务， 比如教育部长只能专注于处理跟教育相关的事情， 不能去插手交通部或者能源部的事情， 他们之间互不干涉，但是当他需要别的部门配合的时候， 其他部门也会协调配合。根就类似于这样的作用。就像一个部门能够有效地运行， 主要取决于负责人的能力和他的运作系统， 以及相关的配套设施和配套设施的状态。学二十四缘会讲根缘， 根有它的缘力， 根缘要发挥作用依赖于根本身的能力以及与之相关的状态。"],[10,345,464,0,"以眼根为例， 眼根在 《阿毗达摩》 来讲是指依止它能够看见颜色的色法， 称为眼净色。眼净色的质量， 决定眼睛是否能很清晰地看清目标。近视的时候，就会看不到远的东西；年纪大就会老花，看不清近的东西。现在有的小孩很小就近视了， 并不是因为眼净色出现问题，他的眼净色还很强劲， 但是因为承载眼净色的眼球变形了—— 由于不正确的坐姿或不正确地使用眼睛造成眼球凸出的问题， 是眼球影响到眼净色的功能发挥。年纪大的人老花则是属于眼净色本身的效能出了问题， 令生业支持眼净色生起的能力减弱了， 眼净色衰老了， 就会造成问题。或者，你没有近视，且年富力强，但是肚子饿了，“饿得头昏眼花”"],[10,463,577,1,"，视力也会受到影响。所以眼净色也有赖于食生食素对它的支持。从佛法来讲，根与其周边状态的相关性是很重要的。（二）清净根和五受根在《相应部•大品》第四十八根相应品第一品“清净品”，佛陀教导的是关于清净根， 也就是五根： 信根、 精进根、 念根、 定根和慧根。佛陀把“五根”定义为可以导向清净的根。在第四品“乐根品”里，佛陀开示了乐根、苦根、悦根、忧根、舍根，这“五受根”是身心感受苦乐的能力， 和导向清净的五根是不同的。我们知道， 如果心没有被训练，“受”非常容易引起烦恼现行，一遇到好受的你就会贪，遇到不好受的你就会嗔、就会排斥。"],[10,577,668,1,"佛陀说五蕴之身，除了色蕴以外，还有受、想、行、识四蕴。52心所单独把受心所、 想心所列出来， 说明受蕴和想蕴在生命的认知过程中是非常重要的。为什么呢？我们学习过“食”，生命中要靠什么样的食粮呢？物质食粮、 精神食粮。物质的食粮就是每天吃的饭， 外在的空气、气候都是属于物质的食粮；精神的食粮，我们叫触食、思食和识食，也就是说精神食粮是靠触食来引发的，要接触。只要有触就会引发感受， 受和触都是遍一切心的心所， 所有的心都有触心所和受心所。今天有贤友问："],[10,668,758,1,"“某某尊者讲到身受，比如说身体有苦受和乐受，身受是属于色法，对不对啊？”，我说：“身受是受，受是名法，没有听说身受是属于色法的。。所以不学《阿毗达摩》经常就会糊里糊涂，还说得振振有词，这是问题呀！没有经过佛法训练的心， 它总是会跟随着烦恼的指引来行动。受是果报和情绪评价中心， 当我们的心缘取到会引发乐受、 悦受的目标会生起贪；对可能会带来苦受和忧受的目标产生排斥，所以“受”会引发我们的烦恼。十二缘起中，三世两重因果的第二重因果是“受缘爱”"],[10,740,810,1,"“受缘爱”就是由受引发渴爱，才会执取、造作，造作就留下业力，在未来又产生新的果报。所以无始以来我们就是去追逐能够带来快乐感受的目标，希望能不断地获得快乐。然而， 五欲所引发的快乐， 基本上是被烦恼所污染的， 它可能带来短暂的快乐， 但也伴随着很多过患。所以佛陀对于能导向清净的五根、 以及可能导向烦恼现行的五受根， 专门展开了讲。（三）眼耳鼻舌身意六根<根相应>里面第三品——六根品，六根品有两部分："],[10,810,925,0,"一部分是上图中的眼根、耳根、鼻根、舌根、身根、意根，这是六根；第二部分是女根、男根、命根共三根，再加上未知当知根、已知根和具知根，加在一起算六根。所以佛陀讲“六根品”合起来有十二根。眼耳鼻舌身意六根，指我们五蕴生命的感知能力。前面五根(眼耳鼻舌身)控制着五种感官生起的一系列识知活动，意根则控制着由意门生起的识知活动， 而意门生起的识知活动通常是对法所缘。眼耳鼻舌身分别对应色所缘、声所缘、香所缘、味所缘和触所缘，而意根通常是对法所缘。意根对法所缘以及由五根所认知的色所缘进行加工、推理、想象、判断、记忆、意志、执行，表现为所有心理活动的基本能力，这叫意根。八十九种心识，包括眼识界等十种、意界三种和意识界七十六种，都属于意根。"],[10,925,1027,0,"（四）命根、七色根命根， 包括色命根和名命根。业生色有命根， 所有名法都有名命根，这里只合计为一个命根。色命根，包含在七种色根内：眼根、耳根、鼻根、舌根、身根、女根、男根七种色根，因为这七种色根都是业生色聚， 业生色聚里面必然包括了色命根。二十二里面的命根虽然只列了一个，但我们要知道包括了名命根和色命根。命根维持色身和精神的生命力， 所有有情生命存在的基本表现和特征是有命根，一个生命名色相续流的存续是离不开命根的支撑、 维护和维持的。"],[10,1027,1154,0,"（五）男女性根男性根和女性根， 是控制着男性或者女性的相貌、 体格、 特征、行为、动作等等，最主要是表现在男女的性能力上。以人类为例，男女的性能力是维持人类物种延续的根本， 它实际上是控制了物种的延续。（六）未知当知根、已知根和具知根未知当知根、已知根和具知根，是出世间的慧根，属于圣者的范畴，代表着获得证悟的能力。所以如果讲慧根，加上五种清净根里面的慧根，总共有四种。二、影响五根质量好坏的因素(一)结生时相应心所的素质决定着五根质量五种色根：眼根、耳根、鼻根、舌根、身根，就牵涉到我们的身体了。五根质量的好坏受到哪些因素影响？我们知道五种净色都是业生色， 五种净色的质量跟你有什么关系呢？首先， 结生心的素质影响包括五净色在内的色身的所有素质。与结生心相关的无贪、 无瞋、 无痴，叫“三美因”或“三善因”"],[10,1154,1235,0,"，它会像树根一样支持着一棵树的成长，支持善的生命的“生命之树”，跟无贪、无瞋、无痴这三个因相关。如果是无因结生， 即便是善的， 也会导致此生命的五根不全、 先天残疾，而且智慧低劣、先天愚痴，都是因为缺乏强有力的无贪、无瞋、无痴三因的资助。所以，如果你想下一生再做人，或者能够去善趣，就要大力地培养无贪、无瞋、无痴的素质。在欲界善趣， 三因结生可以涉及包括“三美因”在内的三十二或三十三个心所，即十二或十三个通一切心的心所（有喜或无喜），再加上二十个美心所(19 通一切美心心所和慧根)。"],[10,1235,1307,0,"结生时，如果相应的心所素质强，你的色身就比较强；它弱，你的色身就比较弱， 就是结生时相应心所素质的强弱决定着我们的五根，包括男根、女根的质量。在结生的时候或者结生之后， 如果有不善业作为令生业的阻碍业出现而对我们的生命造成伤害，可能会摧毁或者阻碍某些根的发展，或者消弱它们的能力。比如： 先天眼睛就是瞎的， 那是过去的令生业造成的。但是如果出生以后，由于各种事故造成眼睛视力出问题了，比如妈妈吃错药导致孩子的眼睛出现问题， 这是属于他的令生业的阻碍业成熟，造成他的眼根能力被削弱。"],[10,1307,1415,1,"（二）“四食”对五根的影响孩子在母胎的时候， 母亲所摄入的食物、 药物， 母亲的心情及所处环境，让这位母亲产生的心生色法对胎儿诸根的成长会产生影响；胎儿出生以后，他所摄取的食物——抟食，还有他的精神食粮——触食、思食、识食，这“四种食物”也会持续影响他的根。眼根跟你的用眼有关系，用眼习惯好，眼根就会被保护;用眼习惯不好，眼睛就会出现问题。看书姿势不正确，长时间近距离看书，光线过强或者不够，也会损坏眼睛乃至近视，患上各种眼疾。肚子饿的时候会头昏眼花， 是因为身体得不到足够的食生食素八法聚的滋养， 眼净色得到的滋养不足， 所以眼净色的食素就不能够产生足够的跟眼净色、 眼球和眼睛功能良好运行相关的新一代的食生食素八法聚，眼净色的功能就得不到有效的发挥。"],[10,1415,1479,0,"由于过度或者不恰当地使用诸根， 会延伸影响到诸根的器官功能。另外各个器官之间也会相互关联、相互影响。中医有句话叫：“肝开窍于目”，肝火很旺的人，眼睛容易充血干涩，眼睛会涨，迎风流泪等等，这是由于身体其他的器官影响到眼净色功能的发挥。耳净色也是同样的，如果耳净色长时间受到高强度噪音的冲击，听力就会下降。经常有人说会耳鸣， 如果看病， 说你这是肾的系统有问题，为什么呢？因为“肾开窍于耳”，如果你肾虚，耳根就会受到影响。"],[10,1479,1542,1,"所以我们讲“四食”，不管是物质还是精神的食粮，跟诸根良好的运作都是会产生关系的。这是讲平常我们要怎么合理使用我们的“五根”。三、性根男根、女根，在《阿毗达摩概要精解》里说:“于诸根之中男根和女根两种性根并不是在根缘里面的缘法。， 根缘的缘法并没有男根、女根， 它们被排除在外是因为它们没有作为缘的作用。缘的作用有三种： 产生、 支助和维持缘所生法， 但性根并没有执行这三种作用的任何一种。然而它们还是被列为根这一类， 是因为它们控制着男性或女性的身体结构、 外表、 性格和倾向， 致使整个人的性格倾向于男性或女性，因此也把它定义为根。"],[10,1542,1630,0,"四、命根色（一）命根色的两大作用命根包括色命根和名命根。色命根有什么作用？色命根就是业生色聚里面的命根色， 它的作用是维持该业生色聚的生命。在结生的时候，命根色作为俱生的业生色生起。以人为例，在结生那一刹那，与结生心同时生起的有三十种色法： 第一种是心十法聚， 结生心要以心所依处色为基础， 才能生起来；第二种是身净色十法聚， 接下来身体的发育靠身净色十法聚；第三种是性根十法聚， 结生的时候就决定了是男性还是女性，没有中间可以转胎、转性别的说法。"],[10,1630,1758,0,"色命根有两大的作用： 第一个， 支持业生色聚， 以维持所有业生色聚的生命。注疏里面讲： 在色命根缘中， 色命根只是一种支助缘以维持同一色聚的俱生色法直到灭的时候， 它并不是产生的因， 业的果报以过去世的业为母亲。也即是说： 业生色是由过去的业生起来的， 由色命根维持。过去世已经消失， 当时造业的业行也不存在了， 但是业的潜力还存在。如同母亲与乳母的关系，母亲不在了，由乳母来抚养。业生色由业产生， 由色命根维持、 保护。色命根维持着同一个色聚的俱生色法直到灭时。菩萨出生的时候，他的母亲 Mahāmāya（摩诃摩耶夫人）在他出生后七天就去世了，他就依靠养母 Gotamī（乔答弥）来抚养、来维持和支助他。Mahāmāya 夫人就像过去的业，Gotamī夫人就好比现在的色命根，这是《注疏》的一个比喻，这是命根色的作用。"],[10,1758,1895,0,"第二个， 命根九法聚作为消化之火来维持生命体征的存在。体现一个人活着就是还有热度，如果这个人凉透了，那肯定是死了。在《阿毗达摩》 来看，一个人是不是死了， 不是以脑死亡或者心脏是否停止跳动来决定， 而是命根彻底断绝。这跟我们古代的习惯也相似， 古代说人死了， 不可以马上去埋葬， 要停尸若干天， 要摸他的胸口是不是已经凉透了， 如果没有凉透就不能下葬。胸口还有热度， 就是命根还没有断绝， 还有热度。身体的温热主要由命根九法聚的火界来支持。我们摄入的所有食物也要靠命根九法聚的火界——消化之火来消化， 你的胃火强不强决定着消化能力。由各种时节生的食素八法聚组成的食物， 被我们吃到体内以后， 在命根九法聚火界的支助下会产生食生食素八法聚， 这些食生食素八法聚会散布到全身的各个部位、 器官， 包括五根。比如眼根周围也会散播着很多命根九法聚， 业生的眼十法聚中的食素在散布到眼睛的食生食素八法聚的食素和命根九法聚火界的支助下， 会产生四到五代的食生食素八法聚。未来我们在修观、 修色法的时候， 食物滋养眼净色的运作机制， 大家可以自己去看， 我就大致说一下。"],[10,1895,1996,0,"从结生开始，色命根和名命根，持续地生起以维持生命的存续，直到死心生起。一期生命最早的心叫结生心、 最末的心叫死亡心。在死亡心灭去之前第十六个刹那， 加上死亡心识的最后一刹那， 是这一期生命最后的一批业生色， 之后就不会再生起新的业生色了。实际上宣示着， 在十七个心识刹那之后所有的命根就断绝， 包括色命根和名命根。所以我们的色命根是和死心一起灭去、 同时断绝的， 这是在死心灭去之前的十六个心识刹那已经确定的， 因为在那之后不再会有包括色命根的业生色生起。对于名法来讲， 由于色命根彻底断绝， 没有了依处， 没有了依处前生缘的支助， 所以名法也不可能再生起， 整个生命就会断绝。"],[10,1996,2092,0,"（二）命根和寿命的关系既然命根跟我们的生命相关， 寿命跟我们的命根也相关吗？不能讲命根就是寿命， 但是寿命确实是跟命根有关系。命根能够持续生起多长时间， 我们的生命就存续多长时间， 这个可以理解。寿命是不是固定的呢？我们经常讲命中注定， 某种程度可以讲是固定的， 也可以说是可变的。如果一个人只是普普通通、 浑浑噩噩过一生， 也没有什么善行， 每天就是贪瞋痴， 但也没有什么大德恶行， 这样的寿命基本上是由他上一生成熟的令生业以及根据业的同一性理、 围绕着这一组业的支助业和阻碍业决定。由于他在当生没有造下什么重大的善恶业，所以即使有当生成熟的现法受业， 也不会给他这一生带来什么重大影响。也就是说他这一生基本上是由过去所造的业决定的， 当他的令生业耗尽时， 他的寿命也就结束了， 在这种情况下可以说他的寿命在某一种程度上是有定数的。"],[10,2092,2175,0,"（三）造作善行可以改变命运然而， 如果我们对业的运作有深刻的了解， 对业果有充分的信心，命运是可以改变的， 未来是可以改变的， 也就是说寿命是可能改变的。马哈甘达勇西亚多举过一个斯里兰卡瓦萨巴国王的例子， 当时， 有很多命理师帮国王算命， 说他当国王只能当十二年就会死了。国王听完以后很害怕， 就去请教僧团的长老， 僧团的长老建议国王要多做善行，修造凉亭 （因为斯里兰卡比较热） 、 救助穷人、 修桥铺路、 恢复寺院、供养僧团，对整个国家多行善政、不行暴政，这样就可以改变命运。国王是一个虔诚的佛教徒， 所以他对长老们的建议很有信心， 回去以后就信受奉行， 结果国王持续执政了四十多年， 而不是短短的十二年，这是国外“了凡四训”的例子。"],[10,2175,2256,1,"《了凡四训》 记录了袁了凡给他儿子的四条训示， 其中讲到算命先生算他五十三岁会死， 命中无子， 对他考试的名次、 升迁都算得很准。后来他在南京栖霞寺遇到云谷禅师，禅师点化他：“命由己造，福自己求。。他回去以后开始做善行，先许下做三千件善行求子，三千件做完果真求到了儿子；然后又许下一万件善行求中进士；后面又求寿命。最后，本来算命先生说他五十三岁会死，结果他写《了凡四训》 的时候已经六十九岁了， 最后是活到了七十四岁。而且当时算他最高能当上知县， 结果最后被升拔到兵部职方司 （类似于今天的总参谋部）主管，这是我们中国改命运的典型事例。"],[10,2256,2369,0,"不管是古今中外，都有做善行改变命运的案例。以《阿毗达摩》的原理来讲，袁了凡的令生业原本力量比较弱，他的命根只能持续生起到五十三岁就会断绝。但由于他造作了很多善行， 他行善的七个速行心中的第一个速行心在当生因缘成熟， 成为他过去令生业的支助业， 使令生业得以加强和延长， 也可能成为这一生新的令生业， 不断地再产生新的名色， 这样他就可以延寿， 对五根自然产生影响。除了这些善业的影响， 还有亲依止缘的作用， 我们以后学习了二十四缘就会明白。眼睛看到的所缘也会对眼根产生影响；四种食物也会对我们产生影响；外界的时节，像气候、空气、环境等也会对我们的眼睛、心情产生影响。如果要保护我们的色命根、五色根，除了要懂得业果法则， 也需要对于自然科学 （包括生物科学） 以及生物医学等具备一些基本常识。"],[10,2369,2447,0,"我们经常讲哺乳孩子要母乳喂养。根据《阿毗达摩》，眼泪、汗液以及母乳是含有心生色法的， 屎尿不含有心生色法， 所以母乳除了饱含营养素以外， 还含有母亲大量的心生色法。如果母亲在哺乳孩子的时候充满慈爱， 她的心生色法就会特别殊胜。比如她四大平衡， 具有色轻快性、 柔软性、 适业性， 这样的乳汁对孩子的身心就会很有助益；如果母亲总是忧心忡忡， 生气， 现代医学都证明了那像给孩子喂毒药一样。所以，如何才能让我们五根健康，这是要通过思考、学习来了解的。"],[10,2447,2508,0,"名命根比较简单，每一个心识刹那生起来的心里面都有名命根，名命根是遍一切心心所（触、受、想、思、一境性、名命根、作意） 。名命根产生、 维持、 保持俱生名法在三个小刹那的寿命。怎么理解呢？名命根也是刹那、 刹那生灭的。当每一个心识在刹那生起时， 名命根也同时跟着生起， 心识灭去， 它也同时灭去， 在生起和灭去之间起维持名聚的作用。同时它也产生， 就是上一个心识刹那灭去之后， 下一个心识刹那名命根生起， 在生起时名命根也起到了产生支持整个名聚的作用。"],[10,2501,2640,1,"有人认为：“我们有一个生命， 好象从小到大这个生命不变呢？”其实这个所谓的生命就是在命根支助下刹那刹那生灭的名法和色法而已。五、十五种名根五色根、七色根、命根、意根讲完了, 是名俱生的根。名俱生的根就是二十二根里面扣除七个色命根， 剩下的十五个名俱生根。八十九种名聚（八十九种心），作为一个名聚存在的时候—— 它一定有心识， 也称为意根；它一定有名命根；它有受根；它有一境性 （定根） 。这四种。精进根出现于七十三种名聚(八十九心扣除双五识、三种意界、三种推度心)。信根、念根只限于美心。慧根只限于智相应美心，这里再复习了一下。二十二根， 包括七种色根和十五种非色根。七种色根是眼根、耳根、鼻根、舌根、身根、女根、男根。十五种名根就是剩下的，一个心识加上命根、 受根、 信根、 精进根、 念根、一境性、慧，一心七个心所。其中受展开为五种：乐根、苦根、悦根、忧根和舍根。慧展开为四种：世间的慧根和出世间慧根（即未知当知根、已知根和具知根），合起来是十五种名根。"],[10,2640,2722,0,"所以记二十二根很容易， 前面七色根， 后面十五种名根第一个就是乐、苦、悦、忧、舍五种受根，以及修行中非常重要的五种导向清净的根（信根、精进根、念根、定根和慧根）。五根、五力就是五种修行的资粮， 占了三十七道品里面的十个道品， 所以五根是很重要的导向清净的根。慧根里面有三个出世间的慧根。八十九种心里面的心识都合称为一个。最后一个是名命根。名根都是俱生的， 意思就是在八十九种名聚里面只要某一个名聚里有这些根， 它就能够发挥根缘的作用，它以俱生根缘的缘力控制缘所生法与它同时生起。"],[10,2722,2782,0,"（一）心识成为根的原因生命其实是由心识来决定、 产生的。对于意根来讲， 所有八十九种心都有心识。心识为什么会称为根呢？因为生命最根本就是由心产生的。有四个维度是没有物质的—— 空无边处、识无边处、无所有处、非想非非想处，这些天人没有色法，只有名法，受、想、行、识四名蕴， 他们从结生到死亡只有心的活动。还有一个维度叫无想有情天， 无想有情天的天人只有色法没有名法， 没有心理活动， 因为他没有心。有人会问："],[10,2782,2898,1,"“没有心理活动只有色法，你怎么能讲是心在维持生命活动呢？”。我们在学“食缘”的时候知道无想有情天的天人只有命根九法聚和时节生色，他就像一尊彩绘的雕塑一样，一动不动地存续五百劫，这样的生命毫无价值。但是即使这样没有心识的生命， 他也是靠识食而存在。他的识食是什么呢？他是依着上一生临死前第四禅 （经教法第四禅， 即论教法第五禅） 的定心成就而在色界第四禅的无想有情天结生。因为他执著于”心想”是过患，并决意要灭除“心想”—— 这也是他的无明、爱、取。他依止禅的业成熟使他结生于无想有情天—— 这是业有，所以说无想有情天人的识食，就是他上一生临死前成熟的第四禅无想定的业的速行心。也就是说， 即使是没有名法的无想有情天天人，也必须依靠心识才得以出生。当无想有情天天人命终、色命根断绝之后， 他必定会投生到欲界善趣， 因为该有情过去生的某一个不定的后后受业会成熟并带来欲界善趣的人天结生， 这时他又投生为具有名色的五蕴有的有情众生。"],[10,2898,2956,0,"对于五蕴界或者四蕴有的生命而言，一期生命从结生识开始， 从十二缘起支的角度来看，结生识生起的时候，识缘名色—— 由于识生起，名色生起。而从二十四缘的角度来看，作为意根的结生识，它以俱生根缘的缘力， 控制着与它俱生的其余名法和俱生的业生色法同时生起。整个生命期间， 从生命相续流的具体表现来看， 最清楚的就是这条心识之流（名法的流）。从一个心生起灭去，下一个心又紧接着生起灭去， 之前生起的心和之后生起的心以无间、 等无间的方式一路传递下来，直到死心生起，这一期生命结束。所以我们讲，生命当中最明显的是这条名法的相续流。"],[10,2956,3031,0,"除了双五识和四个无色界果报心之外，每一种心（除结生心），都会产生俱生的心生色法。心生色法是身体的主要组成部分， 它影响到身体的存续和状态， 包括它有病、 没有病， 皮肤是光洁的还是暗淡的，身体有力量还是没有力量，这些都受到心生色法的影响。没有心我们就无法识知目标， 所以心为什么能成为根呢？是因为所有的生命体都必须依靠心来识知目标，也需要依靠心来维持色身。二十四缘有一个缘叫后生缘， 后生缘就是下一个心识刹那要生起来的心， 以后生缘的缘力来缘助现在的四因生色身， 如果没有下一个要生起来的心，这个色身就不能存在。"],[10,3031,3191,1,"（二）训练心拥有良善的素质和强健的能力心这么重要， 影响心的素质和力量的因素又是什么？如何才能够让心在识知目标的过程中， 拥有良善的素质和强健的能力？这是我们学佛最重要的一项内容。什么是佛教？——“不造一切恶，具足于诸善，净化其自心”，净化其自心就是要训练意根，训练心的能力。二十四缘里面有因缘、所缘缘、增上缘。增上缘里面有一种增上叫“心增上”，心增上是针对二因或三因的五十二种速行心，是指心在善或不善的速行里面参与造业， 或者在唯作速行里面执行某一种作用， 或者在四种果心里面取涅槃为目标的时候， 支配相应的心所和它俱生的心生色法与它同时生起。如果心增上的时候， 它能够起到像转轮圣王一般统领的作用。除了这五十二种可以生起心增上的速行之外， 所有的八十九种心里面， 心的素质和强弱对心识知目标以及执行心的作用同样很重要。如果你经常生起贪心或者瞋心，心就是不断地被喂毒，你的心就不断被毒害；如果你经常生起善心， 你的心就会经常被滋养和净化，当然最好的心是道心、果心，取涅槃为目标。对于我们在坐的人，要多训练禅那的心，经常禅修的人，皮肤光洁、眼色不浑浊，这是他的心生色法的缘故。"],[10,3191,3293,1,"如何才能获得或提升心的力量呢？从十二缘起支来看，“无明缘行，行缘识”，由于无明生起，行生起，由于行生起，识生起，包括结生识以及生命期间生起来的果报识。是上一生临死前成熟的业带来今生的结生识， 因此， 业的力量强弱会直接影响到结生识的素质， 而当时造下的业行的力量强弱，跟造业时候的名法素质有关。你现在是人， 上一生临死前成熟的业一定是善业， 善业里面至少有无贪、无瞋。今天能够到这里来的，三因结生（无贪、无瞋、无痴三美因）的可能性大，而且如果当初那个善业里面无贪、无瞋、无痴的力量很强， 那么你今生结生心里面无贪、 无瞋、 无痴的力量就很强。换言之，一期生命的结生识和有分识的力量强弱跟造下该令生业时造业名法的素质和力量密切相关。如果你想下一生心的素质很好， 现在这一生造作善行就要很殷重、 很有力， 做布施时无贪心要很强， 无瞋心要生起，慧根要生起。"],[10,3293,3406,0,"另一方面， 由于一个名聚里面所有的名法之间， 它们存在着俱生缘、 相互缘、 依止缘等相互支撑的关系和作用， 所以心所的素质和强弱也会对同一名聚中的心识产生影响。举个例子，心识相当于国王，心所相当于底下的大臣和随从。如果大臣和随从每一个都老弱病残，这国王就什么事也做不了， 意思是一样的。所以你心识可能很强， 但你心所的素质都很烂，一样的心就没办法执行其相应的作用。如果心没能成为增上， 而是某一种心所成为增上的时候， 比如如果心没成为增上， 他可能精进成为增上， 或者智慧成为增上， 或者欲心所成为增上， 这时候增上的心所就会来统领。如果是慧根增上， 你的智慧就非常强劲；如果是欲增上， 而且是善法欲增上， 那么造作善行的力量就会很强劲；如果是精进增上， 你造作善行的持续性就会很强。同样的，无贪、无瞋、无痴，或者贪、瞋、痴，以及受、想、欲、精进、胜解、慧根，这些心所都会直接影响到心的力量。"],[10,3406,3494,1,"一个人瞋心起来，“恶向胆边生”，怒火中烧的时候敢跟人决斗，不怕死，心的力量就会很强，强大的瞋心所的力量影响到心的力量。当无瞋的力量很强， 这个人就会表现得非常有慈心， 慈是无瞋的高级阶段。慈能够强到什么程度呢？我们都读过或者了解过佛陀的故事，Devadatta （提婆达多） 释放醉象攻击佛陀的故事。当凶暴的醉象疯狂地冲向佛陀的时候， 佛陀以遍满无边轮围界无量众生的慈爱向它散播慈心，这头醉象感受到了佛陀的慈心，最后温顺地跪倒在佛陀面前，放下它的鼻子， 吸了地上的土撒在自己头上， 慢慢地退走， 这是佛陀慈心的力量，大家如果训练也是可能的。"],[10,3494,3608,0,"所以， 当某一个名法很强大的时候， 它最后会表现在意根上， 表现在心识的力量上。“食缘”里面三种名食：触食、思食和识食，最后一种食就是识。识的作用是识知， 也通过识， 名色生起而令有情存续。同时它取什么样的所缘，有什么样的触和感受，有什么样的意志力，也会影响到我们的心。举个例子， 当我们求于某一种目标， 将要达到的时候， 就会异常兴奋， 这个时候心变得非常活跃而有力量；当我们听到一个很不幸的消息， 或者被人家戳穿了自己刻意隐瞒的秘密的时候， 会觉得心一下子像被戳破了的气球一样焉掉了， 无力、 没劲的感觉， 这就是心会受到触食的影响， 所以起落不定。为什么佛陀教导我们要守护根门呢？因为根门既影响到我们烦恼的生起， 也影响我们的根。所以，意根的素质、力量、强弱、稳定度等等跟我们的生命息息相关，要引起我们足够的重视，要加强训练。"],[10,3608,3742,1,"（三）触缘受——受源于两种机制的影响我们讲五受根： 身识的苦受和乐受， 心的忧受和悦受， 以及身心两者的舍受。只要遇到目标产生接触，就会产生感受，触缘受。为什么会产生苦乐受呢？因为要对果报和行动进行评价。两种机制： 凡是你觉得对你的生命存在和物种延续有帮助的目标， 接触了就会产生快乐；凡是你觉得对你的存在或者物种延续可能会产生影响或者损害的目标， 就会感到痛苦。到底哪一些所缘对你的生命和物种繁衍是有帮助的呢？跟你的生存界有关。而生命的产生又跟业有关。我老举例，对于人来讲， 粪便很臭， 但对粪甲虫来讲那就是美味。粪甲虫碰到粪，它感受很好，生起乐受；对人来讲，他碰到粪便生起苦受。这是跟业相关。但是，与业相关到底对你的生命有没有帮助，要透由“受”来评价并对你产生影响。"],[10,3742,3815,1,"“这个东西比较好，那个东西比较不好。，其实是自我欺骗！骗你能够多活一天， 骗你能够繁衍后代。爱情就是骗你繁衍后代， 哪有什么爱情？我们所有的感受其实是来自于这两种机制的影响。“受缘爱”一个没有被训练的心，只要好受的，就可能起贪，只要不好受的，就会起瞋；只要起贪或者起瞋，就造作不善业；不善业如果临终的时候成熟， 就会把我们送到四恶趣；如果没有在临终时成熟， 在我们生命期间成熟， 就成为阻碍业乃至于毁坏业。这就是生命的状态。"],[10,3815,3966,1,"我们学习“根”就是要明白， 这些根对我们的生命会产生什么样的作用。这样的根如何让我们导向清净、 导向涅槃的快乐， 以及怎样更有效地运用根，这是我们学习的目的。愿大家所有的根都能导向清净，早日证悟涅槃！萨度！萨度！萨度！"],[11,4,138,1,"164 讲-摄集-二十二根 2古源尊者上堂课学习到二十二根受根的部分， 佛陀讲有五种清净根， 五种清净根是指信根、精进根、念根、定根和慧根。一、五受根（一）五受根易生起烦恼受根是指乐根、苦根、忧根、悦根和舍根。乐根、苦根指的是身体的乐受、苦受；忧根和悦根指的是内心的忧惧和欢喜；舍根，其实包括了身体和心， 也有论师讲 “对于身体是没有舍受的， 身体不是苦就是乐。，怎么理解呢？我们平时没有觉得太多的乐受，但也没有太多的苦受， 那就是乐受；身体只要不舒服了就是苦受， 只有苦受和乐受两种，没有舍受，这是一部分论师的观点，我也觉得是这样的，身体没有什么感觉时就是好身体的状态，好身体的状态就是乐受。佛陀讲有五种根（信根、精进根、念根、定根、慧根）是会导向清净的根，有五种根（乐根、苦根、忧根、悦根、舍根）是很容易引起烦恼的根。为什么会这样呢？"],[11,134,372,1,"（二）无明的两种含义以前听过课的人有看过上面这张图， 以冰山形式来说明： 生命表现于外在的行为 （言行举止） 之下有多少种层次的随眠和烦恼， 或者说言行举止受什么样的力量支配。我依着十二缘起支把它分成这么几个层次： 最底层是无明， 无明简单来讲有两种： 第一种是对生命真相的不了解， 第二种是不知有涅槃。对生命真相的不了解就是认为我们这个生命， 这个外在的五蕴是唯一可以依皈的对象，没有这个色身，你无法想象你还有什么意义，生命还有什么价值。但其实对于这个生命的真实状态， 如果你有观智，你可以观察到五蕴的真相是刹那刹那生灭的， 因此是无常的；因为受到无常的逼迫，所以是 Dukkha 苦的;因为是无常的、苦的，所以它是非我的、 是无我的， 并没有一个自始至终真实存在的生命体， 只是我们看不见。看不见是因为不能够破除名法和色法的密集， 没有定力能够看穿生命的真相。如果通过一定的训练， 是可以做到的。但对大部分的人来讲， 看到一个生命从出生到成长到老死， 它就是恒常不变的。简单来讲这就是无明，更深的有很多理论层面上的，我们不再展开。"],[11,188,403,1,"第二种是不知道有涅槃。当我们把烦恼完全灭尽之后， 有一种跟现有的生命状态不一样的、 不能称之为状态的一种状态， 叫涅槃。因为不知道有涅槃可去，所以是无明。由于有以上两种无明， 我们就会执取这个生命， 认为生命是唯一的。而执取这个生命，就需要给这个生命的存活提供食粮。（三）生命的四食 —— 抟食、触食、思食和识食佛陀讲有四种食粮 （四食） 。一种是物质层面上的食粮—— 抟食。抟食简单讲就是我们每天吃的饭，扩展开来包括气候、环境，也属于这个范畴。空气也是营养，气候环境影响四大调和。"],[11,402,469,1,"触食是精神层面上的。我们每天眼睛要看、 耳朵要听、 鼻子要闻、舌头要尝，每天要看 6 个小时的手机，你要透由 “触”来获得你内心的满足，需要触的食粮。思食，就是造业，需要通过造业来维持生命并制造未来的生命。你每天很多的决策、 有很多的意志和身语行为，“这个目标我喜欢还是不喜欢？这个人给我讲的法相应还是不相应？”， 都是思来组织完成的。这是思的食粮。识食，十二缘起支里讲“识缘名色”“识缘名色”就是说，名色本身就是由识来决定的。简单讲有几个层面："],[11,469,578,1,"一个层面就是结生，我们这一期生命第一个心叫结生识。结生识生起的时候， 它支助我们的结生色法跟它同时生起，所以“识缘名色”。在结生时的那个心识支持跟它同时生起的心所和结生色法一起生起 ——“识缘名色”如果没有识， 我们的生命就不会产生。为什么会有识呢？因为对生命有执取、有渴爱，所以你必然会有识的产生，“识缘名色”。生命阶段里也是靠识来维持生命的存在。学过二十四缘的人知道有个 “后生缘”“后生缘”就是后一个刹那生起来的心以后生缘的缘力支助现在刹那当下的四种色法，包括业生色、时节生色、心生色和食生色。如果没有后一个要生起的心识的后生缘的力量，这个身体就会坏掉，是识在支撑。识是生命界的根本，生命靠识。另外，我们靠识去识别一切的目标，即“能缘”"],[11,578,698,0,"，我们靠识（能缘）去缘各种各样的目标，这也是“识缘名色”（四）两种机制影响下生命体验不同的受有精神的食粮，有物质的食粮，由于不同的渴爱、不同的烦恼，产生三十一界的生命形式。三十一界的生命形式面对相同的所缘时它的感受是不一样的。上堂课讲到同样的物质，天人看到、人看到、畜生看到、鬼界的生命看到，他的体验是不同的、他的受是不同的，引发他内心的状态也是不同的。为什么会产生不同的受呢？根本点在于：受到两种机制的影响—— 鼓励机制和保护机制。鼓励机制、保护机制干什么呢？就是鼓励你生存和物种繁衍。不管你是哪一界的生命， 凡是所缘可以给你的生存和物种繁衍带来效果或者能带来帮助的， 这样的所缘你接触到就会有快乐；相反的，你就会有痛苦。痛苦感受是保护你用的，它不是没有用。感受是让你能够存在、 能够把物种繁衍下去， 它是这样的机制、 起这样的作用。这样的机制既在物种繁衍的层面存在， 也在我们名色相续流的层面存在， 两者是相互关联的。由于这样的受， 我们对受本身的作用不理解， 我们觉得 “好吃的、 好玩的、 好听的、 好看的，美女、帅哥，…。"],[11,698,786,0,"，觉得这些可以给我带来愉悦，其实它只是让你活着以及找个人传播后代的诱饵， 只是个诱饵， 没有其它的了。要把它看透了就简单，不把它看透就会抓取它、排斥它。（五）因受而引生善或不善法——受缘爱抓取、排斥产生三种爱：欲爱、有爱、无有爱。即使是无色界的生命也会对“无有”的生命产生渴爱。有爱，你就会产生各种执取，“受缘爱，爱缘取”，欲取、戒禁取、见取、我取这四种取。你执取习惯了就会变成一种惯性，这种惯性就是寻，有欲寻、瞋寻、害寻或离欲寻、离瞋寻和离害寻。寻是内心的一种惯性，习惯性的反应，在我们内心习惯性反应的支持下，有各种各样的行为表现，张口就来，脱口而出， 任何所缘只要一出现， 根本不需要思考， 你的反应就出来了，这就是几种寻的力量。"],[11,786,939,1,"因此， 当受根生起时， 它能够完全控制我们身心的状态。在无明和渴爱的支助下，由受引发我们造下善和不善的业。所以“触缘受，受缘爱，爱缘取，取缘有”（六）五欲之乐、善法之乐与涅槃之乐1. 执取五欲的过患五欲的快乐就是表现在感官上的快乐， 其实从根本角度来讲， 纯粹只是为了你的生存和物种繁衍。佛陀指出快乐本身不是问题， 五欲的快乐是让我们生存、 让我们存在、 让我们存在不会有危险， 它有它的作用。但如果你执取五欲， 就会很麻烦。佛陀讲过很多经典来告诉我们执取五欲的过患， 比如他说： 五欲就像没有肉的骨头， 让你天天就像那只追着没有肉的骨头的狗一样；像乌鸦嘴里的碎肉， 乌鸦嘴里含了一口碎肉， 所有的乌鸦都会来追赶它， 抢它口里的那口肉。就像你在世俗上做生意有点钱，很多人就会来跟你做朋友、跟你做生意，想办法怎样把你的钱赚回去；像握着迎风的火把， 你握着火把迎风走，火会烧到你自己；像麻风病人身上的疮， 麻风病人身上长的疮非常痒，你越扒越痒， 越痒越扒， 我们世俗上获取快乐的方式就像麻风病人扒身上的疮；"],[11,939,1049,0,"像飞蛾扑火一样， 明明看到前面有火坑， 你就是要奋不顾身地冲进去，然后说：“我没办法，那个火坑的力量太强大，不是我要去，是火坑的力量太强大。2. 善法之乐⑴ 善法的特点、价值和功德除了五欲的快乐还有善法的快乐、 禅那的快乐、 涅槃的快乐。善法的快乐就是平常只要有善心生起的那个刹那， 就有六对心和心所的轻快性、轻安性、柔软性、适业性、练达性、正直性，当下你就会觉得舒适，只要你有善心就有快乐。具体表现在我们可以布施、持戒、禅修、慈悲喜捨、爱语、恭敬、服务、回向功德、随喜功德、听闻佛法、 弘扬佛法、 见正直业， 等等， 十种福德事， 都是善行、 都是善法，善法的当下就是会给你带来快乐的， 它是健康的， 对自己的身心是有帮助的， 对别人也是有帮助的， 在未来是会有好的影响力的， 如果在临终的时候成熟会带我们去善趣， 这就是善法的特点以及善法的价值和功德。"],[11,1049,1126,0,"⑵ 禅修的快乐善法还有一种快乐就是禅修的快乐。禅修还没有证得禅那之前我们就已经觉得很快乐， 只要有一点轻安就很快乐， 它跟五官上的快乐很不一样。五官上的快乐会集中在触觉上， 在快乐的时候你心里还很担心别人拿走， 有点惴惴不安的感觉， 这种快乐边际效应递减， 过一会就没了， 这种快乐来自外在， 你要付出很多努力才有办法去维持它。但是禅那的快乐不用， 禅那的快乐你只要坐在那它就来， 你越安静它来得越快， 你越不想事它来得时间越长久， 你啥都不想就很快乐， 只要觉知呼吸就可以。如果你真的把所有的想法都放掉， 不再胡思乱想“明天吃什么？后天吃什么？”"],[11,1126,1207,0,"，这些事都不想了，心只有呼吸了，你就证入禅那。已经有些同学可以四个小时、 五个小时都在禅那里面，非常舒服，身心都得到疗愈，这是禅那的快乐。⑶ 观智的快乐善法里还包括观智的快乐，修无常、苦、无我也是很快乐的。虽然你看一切行法无常、苦、无我，你会生起厌离心，但是修观智也是很快乐。在修还没成熟的坏灭随观智之前，帕奥西亚多都会提醒说：“不要掉入十种观的污染”， 修观可能产生十种染污。其实我们不能讲是染污，因为只有贪欲心才有染污，比如说：他非常喜悦，非常快乐，智慧非常敏锐，精进非常强，欲非常强，这些本身不是问题，有问题的是他想贪著这种状态， 以为这种状态就是涅槃的时候， 就是进入了非道。"],[11,1207,1274,0,"“道非道智见清净”，其中这个“非道”主要就是指在修观阶段的那个大坑， 不要在修观里面贪图那个快乐。所以修观也很快乐。3. 涅槃之乐修观智完以后可以证悟涅槃。道智生起的时候， 在帕奥禅林偶尔会听到有人报告说：“Bhante， 我好像突然间进入一种状态， 完全没有负担的那种，一下子进入那种状态，感觉身心都完全不受控制了，非常的快乐， 非常的坚固。， 是不是真的不知道， 偶尔会有人报告，然后你请教他，他会很保守，不告诉你，让你自己去体会，我也不知道是不是真的，人家都很含蓄。凡是跟你说："],[11,1274,1349,0,"“我是阿拉汉。，那肯定就是假的。很含蓄的人说：“哦，不知道！老师说不能讲。这样的人比较可靠。所以快乐有很多层次的， 真正的快乐是道智生起后涅槃的快乐， 真正证得阿拉汉，一切的负担都释放了，一切的烦恼都断尽了，这是真正的快乐。从无明到业自属智、禅那智、观慧、道智的过程，其实就是对受的态度，是从对受的认知、到忍耐、到中捨的过程。学习受心所时讲到六支捨， 六支捨就是六种所缘出现的时候， 无论可喜不可喜都能够对它持中捨的态度，这就是六支捨。"],[11,1349,1439,1,"一般我们都会说好看、好听、好玩，但是佛陀告诉我们：六支捨才是最好的状态。也就是说，当训练到对所有的所缘都能够六支捨的时候， 你的烦恼就会比较薄了。未来想禅修也很容易进步，修观智很容易得力，一不小心就会证果。（七）未经训练，心随受转如果我们的心没有经过训练， 都是随着受转的， 受怎么来你就怎么去。例如喜欢或者讨厌某个人时， 这种感受就能完全控制他的身心状态。在学习 “所缘缘”、“所缘增上缘” 时， 有很多这方面的例子。"],[11,1417,1500,1,"马哈甘达勇西亚多讲过这样一个记载于《增支部·义注》的故事。这位尊者见到过去四生都被杀，最后生起悚惧，证得阿拉汉。过去在印度， 有一个大嫂和小叔子发生了暧昧关系。这种关系维持了一段时间， 嫂子觉得这样的状态没有安全感 （这是她的一种受） 。跟小叔子发生暧昧关系是因为她的贪受， 又觉得这样长期下去会有危险，她就有另外一种受 —— 恐惧。所以有一天她跟小叔子说：“我们这样的关系， 终有一天会被你哥哥发现， 被你哥哥发现之后这村子里的所有人都会发现，会传得很难听。不如这样吧，把你哥哥杀了，这样就一劳永逸了，我们就可以永远在一起。"],[11,1500,1556,0,"，小叔子心里面还是很敬爱他哥哥的，而且他也觉得很惭愧，所以他说：“不行，你不应该有这样的念头，怎么可以杀死我的亲哥哥呢？我已经很对不起他了。过了一段时间，嫂子又怂恿他，说她无法忍受跟他哥哥在一起，跟他哥哥在一起就想到他。就这样刺激他， 人的嫉妒心很麻烦， 小叔子经不起她一而再、 再而三的怂恿， 他的心也开始动摇。但是小叔子的内心还是善良的， 他下不了手 （这也是他的受） 。最后嫂子说：“你下不了手，我来办。"],[11,1556,1632,1,"有一天，这位嫂子非常温柔地对她丈夫说：“亲爱的，你劳作一直很辛苦，来，我帮你抓抓头上的虱子。，她随手给他抓了几下、按摩了几下，又说：“你头发很脏，到湖边去洗个头吧。。长时间以来因为嫂子偷情， 对哥哥没有好态度。突然妻子对他这么温柔， 哥哥觉得非常温暖， 于是很高兴地去湖边洗头。事先已和大嫂串通好的小叔子， 准备了长刀早已埋伏在河边， 等哥哥毫无戒心地在河边洗头时， 站在暗处的弟弟拿起长刀， 将哥哥一刀毙命。事情做得神不知鬼不觉，不留任何痕迹。大家想想，对偷情的感受的期待，可以令人杀掉自己非常敬爱的兄长。"],[11,1632,1772,0,"但哥哥在被杀之前， 由于妻子很温柔地帮他洗头， 妻子的温柔给他留下的感受成为他临死速行的临死业 —— 贪爱的临死业。因为贪爱他投生为一条小蛇， 终日徘徊在生前的家屋内外， 不管他前妻走到哪里，小蛇都尾随在附近，痴痴地看着她。小蛇不咬人，就痴痴地看着她。有一天， 这条小蛇正盘睡在妻子床上方的梁椽上， 看到妻子和弟弟正在寻欢， 小蛇就受不了了， 不知道他是因为震惊还是愤怒的缘故，一失神小蛇竟然掉下来， 就掉在两个人中间， 把两个人都吓坏了，也因此被受到惊吓的弟弟打死。这样这位可怜的哥哥就被杀害了两次。由于依然对他的前妻有非常执著的心， 又或许他的近死业是看到他的妻子，对前妻的贪爱让这条小蛇死后又转生为他家的一条小狗。小狗长大到能走动的时候， 就一直跟着她， 完全不分离， 女人走到哪里它就跟到哪里。这女人因此被村民、邻居调侃，她感到非常尴尬、困扰， 最后实在嫌这小狗很烦， 就把小狗杀了埋掉。这个当丈夫的第三世又被妻子杀掉了。"],[11,1772,1834,0,"然而， 他还是没有放下对这个女人的贪爱， 又投生为她家中的一头小牛， 这头小牛长大以后的行径跟当小狗那一世一样， 时时刻刻跟随着这个女人。这又引起了众人的戏谑、讪笑。这个女人忍无可忍，又把小牛也杀了。所以，这个男人四辈子（人→蛇→狗→牛），两次被弟弟所杀，两次被前妻所杀，总共被杀了四次。但是， 他依然没有放弃对这个女人的贪爱心， 最后一生他投胎为前妻的孩子， 也就是他弟弟和他前妻的儿子。他一出生就能回忆起过去生的事， 即业带来的宿命智， 清楚地看到他自己过去世被杀害的经历，他心里想："],[11,1834,1895,0,"“这个母亲真是一个可怕的恶魔！”，因此，他完全不让母亲碰他， 只要母亲一碰他， 他就惊吓得哭闹不止， 更别提接受母亲哺乳了。所以， 他母亲只好把他交给奶奶， 也就是他过去世的妈妈来抚养他。但一直到了能说话的时候，都不让母亲碰他一下。他过去世的母亲（现在的祖母）很纳闷，等到孩子能说话的时候，祖母问他：“你为什么那么害怕你的母亲呢？”，孩子以非常惊恐的语气回答奶奶说：“她不是我妈妈，她是恶魔！”，接着就把前四世被杀害的经历告诉了奶奶。奶奶听后也觉得很可怕， 说："],[11,1895,1999,1,"“这女人真可怕，我们祖孙俩赶紧逃离这个地方吧！”。祖孙两人逃到一个禅林，孙儿在男众禅林成为沙马内拉， 祖母则在女众禅林成为比库尼。他们俩都因为这些经历而深深地厌离这个世界， 两个人都很精进努力， 最后在那一生都证得阿拉汉果。从这个故事我们可以体会到受根有正面与负面两层的影响。一方面， 这个哥哥对妻子一次或者多次的温柔所形成的感受， 这种受根控制了他四生（四次的生命）。而这对偷情的男女，他们为情欲这种感受所控制，一次又一次地犯下了严重的恶行， 这是受根对身心的控制力和不良影响。经典里没有讲这两个人死后去哪里， 显然一定是地狱在等着他们， 不可能有更好的地方。另一方面， 逃到僧团的祖孙两人，他们从过去一再被杀害的经历， 看到了烦恼控制下人性的可怕而生起了对轮回的悚惧， 感受到强有力的厌离， 这种受根推动着他们精进修行，最后断除一切烦恼。"],[11,1999,2081,0,"（八）训练自心，不随受转心要训练， 受出现时我们应该不随受转。怎样才能不随受转呢？前面提到了面对六种所缘时能不能生起六支捨， 六支捨的前提是正见，就是我们持什么样的观念， 面对所缘我们是什么样的态度。标准的态度就是四圣谛的态度，一切的所缘都是果报， 果报都是苦的， 都是无常的， 都是无我的， 它只是在因缘聚合下而形成的一种状态。如果让你产生快乐的感受， 是由过去的善业导致。快乐的感受， 如果不能激发出离的精进，实际作用就是让你能够生存或者诱惑你去繁衍后代，除此之外，没有什么太多的价值。看透它之后，因此对它生起中捨，就不会跟它走。我们怎么训练呢？首先防止被惯性带走， 当所缘出现时， 知道了："],[11,2081,2143,0,"“先停一下， 等我两秒钟， 先看看， 你是怎么骗我的。再看一下目标是什么样的因缘出现在我面前？这样的果报我应该用什么样的态度来面对。如果是对我的生命存在有帮助， 则取适当的来维持我的生命；如果是要诱惑我去繁衍后代那就算了， 不要再制造轮回，制造轮回很麻烦。你再制造一个人口，你这一生就搭进去了，从十月怀胎到他博士毕业， 还要帮他找媳妇， 再帮他带孩子， 带完孩子你也差不多要呜呼哀哉了， 然后才来问说："],[11,2143,2208,1,"“Bhante， 我什么时候可以禅修？”“多大年纪了？”“70 了。” “70 了， 先锻炼身体吧。所以到那时候就来不及了， 现在还年轻， 就不要被繁衍后代的诱惑所蒙蔽掉，下决心六支捨。我们总是会受到很多诱惑， 最难的是停不下来， 如果是那些没有生命的目标，看到花很漂亮，“哦，花是无常的，明天就坏了。它不会第二次刺激你。但是你面对人的时候就发现不行了， 第一句刺激到你了，“诶，我停一下”，第二句，接着第三句，专门捡很令你很难受的话讲，你就受不了了。"],[11,2205,2293,1,"“这个怎么办啊？”，每个人有不同的方法，就是怎么让你停下来有很多方式。有些人说：“如果我是佛陀， 我会怎么面对这个所缘？”， 你可以试。也有人教我说：“诶，你就把自己设定是从火星来的， 我是火星来的地球人类研究专家， 现在我碰到地球人有这样的一种状态， 我来研究一下为什么会是这样。其实我们每一个人， 如上 “冰山图”， 表现在人面前的， 就是生、 老、病、死、愁、悲、苦、忧、恼，就是他的行为和技能，他的身语意，他表现在你面前的不管他说的话是难听还是好听，他都是这种表现，这种表现都受他后面的这一堆东西（冰山图中潜伏在水面下的内容）的支持， 直接的表现就是他的寻、 他的惯性， 所以它一出来你马上就去看，你别把他的话接过来刺到自己心里去，而是“欸，这个人是什么寻啊？我用火星人的智慧看看。"],[11,2293,2373,1,"。在寻的后面一定有他的取，有他的爱， 有他的无明， 他的无明爱取即是他的见解， 他对这件事情的认知反应。这堆后面的东西形成了这种寻的力量让他说出这样的话，让他做出这样的行为。你不要对他的行为采取行动， 我们永远不要对果报直接采取行动，退后一步看看，研究一下他的无明爱取是什么，当你看到他在无明爱取驱使下而有这样的行为时， 你会生起悲心， 也会生起慈心，因为这是很苦的。佛陀教导我们要去看受背后生起来的机制和因缘， 要看到它的过患，每个人都被念头驱使而不由自主地做出很多身语意的行为。对此，佛陀在《相应部·木柴喻经》中教导说："],[11,2373,2429,1,"“诸比库， 犹如两根木柴结合、 磨擦而生热着火， 若那木柴被分离、放置一边，则由那所生的热止灭、平息。同样地，诸比库，缘于被体验为乐之触而生起乐根，有乐时，他了知：‘我乐。’随着那被体验为乐之触的止灭， 他了知：‘由那所生的受——缘于被体验为乐之触所生起的乐根——止灭、平息。“诸比库， 缘于被体验为苦之触而生起苦根…… （中略） ……缘于被愉悦地体验之触而生起悦根…… （中略） ……缘于被忧恼地体验之触而生起忧根…… （中略） 诸比库， 缘于被平舍地体验之触而生起舍根， 有平舍时， 他了知："],[11,2429,2513,1,"‘我平舍。’随着那被平舍地体验之触的止灭， 他了知：‘由那所生的受——缘于被平舍地体验之触所生起的舍根——止灭、平息。当我们能如此看待所缘时，就能生起六支捨。以上是受根。二、信等五根接下来再复习五种净根：正念、信、慧、精进和定。根在巴利叫 Indriya （indra 王， 主神+iya） ， 是操纵之意。五根，因为信克服了不信， 精进克服了懈怠放逸， 定克服了散乱， 智慧克服了愚痴，故以称克服的增上之义为“根”"],[11,2488,2580,1,"。佛陀说这是对于修行至关重要的五种根， 也就是在三十七道品中的五根和五力。五根、 五力从心所角度是相同的， 五根、 五力占据了十个道品， 其中慧根包括一种世间的慧根与三种出世间的慧根。五根每个人都有， 只是强弱层度不同。根缘的缘力只是在它所能管控的范围内有控制力。信根能在信解的范围内行使其控制力， 精进根在策励的范围内行使它的控制力， 念根是在觉知的范围内， 定根在不散乱的范围内，慧根是在照见的范围内产生它的作用。"],[11,2580,2675,1,"关于五根的培育， 《阿毗达摩概要精解》中说：“在培育五根时必须平衡信与慧， 以避免轻易盲信与机智狡诈两端。。我们不是轻易盲信， 就是机智狡诈， 偏向智慧容易没有信根， 强调慧根容易狡诈，我们讲 “干慧”；如果没有智慧只是信根很强， 你会轻易地偏于迷信。“平衡精进与定， 以避免心散乱烦躁与软弱无力。然而， 在任何时候都必须具备极强的念根， 因为念能够看管其余诸根的提升， 以及确保它们平衡。。念不怕多，越强越好，所以信根与慧根平衡、精进根与定根平衡，是靠念去平衡、去实现的。信根过强而慧根太弱，就会变成迷信，慧根过强而信根太弱，又会变成狂慧、自以为是；精进根过强而定根太弱， 就会散乱、 或强力抓取目标， 定根过强而精进根太弱，又会昏沉。"],[11,2675,2797,0,"作为解脱的资粮，五根是解脱的重要保障和素质。在五根里面，念根是作为先导的。我们来看念的相等四法：特相、作用、现起、近因。特相：（1）令相应法对目标（主要指身、受、心、法四念处）念念分明而不流失，像石块沉入水中一般；（2）全身心投入于善行。念只在善心、 美心里才有的， 不善心没有这个念， 当他全心投入于善行念就会强。作用：去除会令目标消失的放逸；不令目标消失。只要有念，目标就一直被你专注到。现起： （1） 守护心， 或守护禅修目标；（2） 心面对目标的状态。当所缘多时，你守护心；当所缘单一时，你守护所缘。比如从大金塔走出去， 外面就是花花世界， 面对花花世界该怎么办？此时守住入出息是不容易的， 那么就要守护你的心， 守护根门不外放， 把心守住，所缘多时守心。所缘单一时，坐在这儿，所缘只有入出息，就守你的入出息。"],[11,2797,2864,0,"近因：强有力的想或者四念处。这很重要， 很多人在学习相等四法时会忽视掉近因， 觉得近因没有什么特别的意思， 但是近因是生起心所最直接的因素。如果你想要强有力地念， 你就要明白生起念的最直接的因是什么？我们总觉得念不够， 那它的近因是什么？正念生起的近因是强有力的想或者四念处，所以为什么说， 对治平常散乱， 要一切时处训练你的正念正知， 行住坐卧四威仪都要有正念正知， 平常的时候念知强， 禅修时你的念才能起来。"],[11,2864,2980,0,"念的另一个近因是强有力的想，想（saññā）是指想心所，想心所就是标记。要有强有力的想， 必须对所缘标记得很清晰有力， 才有强有力的想（saññā），即当身、受、心、法四念处的目标明确、清晰时，才能够形成强大的想；通过想所做的清晰有力的标记， 念才能持续地生起。要对身、受、心、法四念处的这些目标形成明确清晰、强大的标记需要有择法慧， 要清楚什么是入出息的概念？要修地水火风四种遍禅， 什么是地的概念？什么是水的概念？什么是火的概念？什么是风的概念？风无形无相， 要取风的概念作为修定的所缘怎么取？要有智慧， 但智慧又不能太强， 智慧太强你整天倒腾。相信我取到风吹过来就是风，我知道风的感觉，这个状态就是这样。"],[11,2980,3064,0,"“我取到了”——信，“确定它”—— 慧，择法的智慧是与慧根相关的。如果没有智慧， 很难取到准确的所缘。取到所缘后， 确定它是， 并在心里看透它。对于慧根强的人（瞋行者、觉行者）就是要钻研透每一个业处、每一个教理，不钻研透就倒腾，各种怀疑、判断很麻烦。所以慧根太强的人一定要钻研透，完后他就相信了：“哦，明白了，这个东西就是这样。，此时他的信才会真正地生起来。但对于信根强的人没有这个问题， 你告诉他什么就是什么， 信根强的人修止禅比较合算， 他不会那么倒腾。所以， 我们抉择目标后必须要对目标有信心。想要生起念，首先要有慧，对目标能确认，确认完后有信，有信心了："],[11,3064,3127,1,"“欸，这个东西就是这样”，有信心就愿意持续地精进，持续地精进不是抓取，是已生善法令生长，是“对了，我就守着你就行了。你是什么状态就是什么状态。。而要倒腾时：“我知道你要倒腾， 我不陪你倒腾。未生善法不生起， 已生善法令消除， 对于已经生起来的，“就是这样，挺好，继续吧。，已生善法令增长，他就会正确地精进。正确地精进会持续地让他的念越来越强， 定就会生起来， 所以五根的次第就是这样的方式。如果你不明白， 以为坐在那儿五根就会平衡， 这是不容易的。所以我说："],[11,3127,3193,0,"“你要多少知道一点自己的性行，根据性行知道怎么去调五根， 哪种根比较强时它有什么样的表现， 而你又该如何去处理。第二分别经——何谓信等五根关于这导向清净的五根， 佛陀在 《相应部·第二分别经》 中开示：“诸比库， 什么是信根？诸比库， 在此， 圣弟子具信， 信如来之觉悟——‘彼世尊亦即是： 阿拉汉、 正自觉者、 明行具足、 善至、 世间解、无上调御丈夫、天人导师、佛陀、世尊。’诸比库，这称为信根。"],[11,3193,3242,1,"佛陀的九种功德名号蕴含着佛陀所体悟的一切真理， 以及他教导我们的所有法， 所以这九种名号实际上就包含了对佛陀的信， 也可以说包含了八种应当信之事：第一、导师(Satthar)，我们的佛陀(Buddha)。第二、 法(Dhamma)， 佛陀教导的法。第三、 僧(Saṅgha)。佛、 法、 僧称为三宝。第四、 戒定慧三学。第五、 前际， 就是过去世。第六、后际，就是未来世。第七、前后际，就是相信过去、未来世。第八、缘起，即因果法则。"],[11,3242,3380,1,"有人问说：“为什么要相信有过去，要相信有未来，还要相信过去未来？”。要知道，印度古往今来都有修定大师，有很多大师是从无想有情天转生的，转生后禅修还是很好，一看过去生，没有、不存在， 因为无想有情天众生没有心， 找不到心， 所以他的观察就是没有，他这一生莫名其妙地来， 没有过去生。如果他修无想定， 下一生又去无想有情天， 未来也没有。古印度的外道并不是凭空的哲学思辨， 他有定力去看，但没有佛陀“一切知智”的教导，就看错掉。比如为什么有些人不相信有因果呢？我们曾经讲过这个故事， 有位禅修者报告他上一生临死前是一个强盗， 败露后被抓起来痛打一顿， 脸上还被砍了两刀， 然后捆绑起来， 绑上大石头沉到大海里淹死， 结果这一生居然是个比库， 而且禅修修到缘起， 他观察过去生： 上一生临死前就是这个状态。如果他以神通的方式去观察就发现上一生他是个恶人， 是个强盗， 这一生居然是个比库， 修心还很好。也就是说过去造的恶业对这一生没有什么影响，如果他抱持这种心态就会有“无因见”，就是过去造的恶业对这一生没有什么作用，善恶的果报只是偶然遇到，就是这么一种体验。"],[11,3380,3475,1,"只有能够像佛陀一样通达“十二缘起支”，每一支每一支是什么样的因缘关系都能观察清楚，过去五因结现在五果。就像这位禅修者，后来老师教导他：“找到你这一生的结生心，再往上找到你上一生的死亡心， 再找到你上一生死亡心边上的那个临死速行心， 你看那个临死速行心里是什么样的业成熟了。， 他一看， 说:“哦！是那一生更早时供养僧团的业。，有意思吧，他上一生更早时供养僧团的那个业居然在他临死那么恐惧的情况下成为了他这一生的令生业。这一生的令生业是怎么运行的呢？那个供养僧团的业成熟， 成为临死不善果报的毁坏业， 终止了他临死前的那个恶业， 并且带来自己的果报 —— 他这一生的结生，即终止恶报产生善的果报。所以不要小看供养一下僧团， 成为强盗被打死的时候还会被救， 不可思议。只有这样地去细致观察才能看到什么是因果， 仅仅有神通不见得有用，要明白这样的道理。"],[11,3475,3534,0,"佛陀继续开示说：“诸比库， 什么是精进根？诸比库， 在此， 圣弟子住于勤勉精进，为舍断诸不善法， 为具足诸善法， 坚毅、 坚固勇猛、 不放下于诸善法的责任。他为了未生之恶、不善法的不生起，生起意欲、努力、激发精进、策励心、精勤；为了已生之恶、不善法的舍断，生起意欲、努力、激发精进、策励心、精勤；为了未生之善法的生起，生起意欲、努力、激发精进、策励心、精勤；为了已生之善法之住立、不忘、增长、 广大、 修习、 圆满， 生起意欲、 努力、 激发精进、 策励心、 精勤。诸比库，这称为精进根。"],[11,3534,3599,0,"大家不要错误地理解“生起意欲、努力、激发精进、策励心、精勤”这句话，好像我们平时说的：“同学们，冲出去！”，以为世间的抓取方式才是精进，一定要牢牢记住精进的前提： 正精进即已生善法令增长，未生善法令生起，已生不善令断除，未生不善令不生。首先要明白什么是善、 什么是不善， 如果不能分清善与不善， 大部分情况下都是邪精进。什么是善呢？善心才叫善， 不善心就是不善。你坐在这儿禅修时观察什么是正精进， 如果你觉得说："],[11,3599,3732,0,"“我要把禅堂坐穿，我一定要五个小时坚决不起来，咬牙忍着！”，你看下你的那个心是什么心？当然不是说你不坐， 佛陀最后在菩提树下决意：“如果不证悟，绝不起此坐。，但佛陀不会咬牙切齿，佛陀一定知道什么是正精进。他当时想到在他四、五岁时，农忙节时，他在田边专注呼吸证悟四禅， 他觉得这是正确的法， 所以他是很轻松地觉知入出息， 接着生起初禅、二禅、三禅、四禅，紧接着生起观智，生起宿住随念智等三明，最后一切知智生起。他是正精进，他是策励心，他的心都在善法上。如果在禅修时，你紧张、你控制、你抓取、你排斥、你分析、你判断、你怀疑，又自我感觉很努力，对不起，那是邪精进，这样的禅修不会进步。即使进步，当你下坐后也会脖子疼、腰酸背痛，时间长了尾骨歪掉，斜着。在禅林出现很多这样的情况：整个人是歪的。这是邪精进的一种表现。他也可能获得一点定力，但这定力很麻烦。“诸比库， 什么是念根？诸比库， 在此， 圣弟子具念， 具足最高的念与审慎， 能忆念、 随念久前之所作与久前之所说。他于身随观身而住，热忱，正知，具念，调伏世间的贪、忧；"],[11,3732,3797,1,"要记住 “身随观身而住， 热忱， 正知， 具念， 调伏世间的贪、 忧”同样，“于受随观受而住……于心随观心而住……于法随观法而住， 热忱，正知，具念，调伏世间的贪、忧。贪就是贪心，忧就是瞋心，能调伏贪和瞋两者，“诸比库，这称为念根。“诸比库， 什么是定根？诸比库， 在此， 圣弟子舍遣所缘而得定，得心一境性。他已离诸欲，离诸不善法，有寻、有伺，离生喜、乐，成就初禅而住；寻伺寂止， 内洁净， 心专一性， 无寻、 无伺， 定生喜、乐，成就第二禅而住；离喜并住于舍，念与正知，以身受乐，正如圣者们所说的 ‘舍、 具念、 乐住’"],[11,3797,3865,1,"， 成就第三禅而住；舍断乐与舍断苦，先前的喜、忧已灭没，不苦不乐，舍念清净，成就第四禅而住。诸比库，这称为定根。定根成就初禅、二禅、三禅、四禅。要明白一点：“已离诸欲，离诸不善法，有寻、有伺，离而生喜、乐”。你有初禅了，很多人说入禅了， 入禅是什么状态？你的心离欲了， 离诸不善法了， 离诸不善法就是五盖完全没有了。有人说：“哦，我们某一个老师告诉我说光很亮跟呼吸融合了， 我们就沉进去了， 沉进去后就不要再觉知呼吸只关注光了，但还是会打妄想。"],[11,3865,3912,0,"，还是会打妄想那叫定吗？打妄想就是你的心还在缘很多的法所缘， 是七个速行心的心， 不是广大禅那速行心。什么是定你自己对一下；什么是初禅、二禅、三禅、四禅已经写的很清楚了，按这个标准来。“诸比库， 什么是慧根？诸比库， 在此， 圣弟子具慧， 具足导向生灭之慧， 圣的、 抉择的， 导向苦的完全灭尽[之慧]。他如实了知 ‘此是苦’，如实了知‘此是苦之集’，如实了知‘此是苦之灭’，如实了知‘此是趣向苦灭之道’"],[11,3912,4020,1,"。诸比库，这称为慧根。三、三种出世间慧根慧根有四种，一种是世间的慧根， 还有三种出世间的慧根。其中，未知当知根指的是与初果道心同时生起的慧根心所， 就是初果道智里的慧根心所被称为未知当知根；已知根， 也称为最终知根， 指的是初果果心、二果道心、二果果心、三果道心、三果果心、四果道心，与这六种心同时生起的慧根心所，称为已知根（也称最终知根），未知当知根是初果道心， 从初果果心之后直到阿拉汉道心称为已知根。与阿拉汉果心同时生起的慧根心所， 称为具知根 （也称为俱最终知根） 。这三种是无漏根，希望大家能早日生起三种出世间的根。"],[11,4020,4105,1,"四、诸根的次第到此，我们学完了二十二根。按《清净道论》，二十二根有先后次序，《清净道论》解释说：⑴六根：眼根、耳根、鼻根、舌根、身根、意根。⑵三根：男根、女根、命根。⑶五受根：乐根、苦根、悦根、忧根、舍根。⑷五种导向清净的根（五善根）：信根、精进根、念根、 定根、 慧根。⑸三无漏根、 出世间的根： 未知当知根、 已知根、具知根。为何如此排列？《清净道论》解释说：● 由于善知内法而证得圣地之故，所以先说属于自体的眼根等。● 其次，为了显示该自体因何称为女或男，故此后说女根、男根。● 接着，为了显明那男女的身体是与命根结合而生存，故此后说命根。"],[11,4057,4150,1,"● 为了显明只要命根在转起，这些感受就不可免除，并且一切感受都是苦的，故此后说乐根等五受根。● 为了指示“为灭彼等苦当修此等法”的行道，故此后说信等五种导向清净的根。● 为了指示行道不是徒然无益的，由于那（信等的）行道，此法先于自己现起， 故接着说“未知当知根”。因为这是那未知当知根所产生的果，并应于彼根之后即刻修习此根，故接着说此“已知根”。为了显明由于修习前面的根而后证得此根， 证得此根时， 更无所作， 所以最后说此最上安乐的“具知根”"],[11,4150,4238,1,"。这是诸根的次第。由此我们知道， 佛陀这样安立二十二根的组成与顺序是有着清晰脉络的，最后是要导向究竟解脱的涅槃的。五、依法抉择确定正道，平衡五根趣向涅槃我们学完二十二根， 要依法抉择确定行道， 平衡五根， 最终趣向涅槃。在此， 需要特别思考如何在二十二根的学习中能让心不断地导向清净，以智慧来抉择修道。佛陀在《增支部·导师教导经》中说：“伍巴离，如果你知道有些法：‘这些法能导向完全厌离、离贪、灭尽、 寂止、 证智、 正觉、 涅槃。"],[11,4238,4322,1,"’ 伍巴离， 你就可以肯定地忆持：‘这是法，这是律，这是导师的教导！’”在佛教圈里有很多法， 我们要明白如何去选择这些法。能不能完全地导向厌离、离贪、灭尽、寂止、证智、正觉、涅槃？只有这样的法才可说 “这是法， 这是律， 这是导师的教导！”。按照佛陀的教导，我们可以依法去抉择， 这位老师所教导的法是否导向烦恼的削弱与灭除，他是否教导怎样去除五盖、镇伏烦恼、修习四念处，他是否教导如何修习戒定慧、八支圣道，这些法如何在当下就改善我们的生命。完成这样的抉择后， 信心生起， 慧根与信根平衡， 在此基础上生起强大的正念，修习四念处，平衡精进根和定根，发展我们的五根、五力，最后证悟涅槃——成就所有的三十七道品。"],[11,4321,4424,1,"最后祝愿大家都能够早日成就，祝福大家!Sādhu！Sādhu!Sādhu !"],[12,0,195,1,"尊敬的各位尊者、各位尼师、各位贤友，晚上好！一、九力之概要上一堂课我们学习了二十二根， 今天学习阿毗达摩第七章类别之概要的九力。九力有信力、精进力、念力、定力、慧力（分别对应导向清净的五根：信根、精进根、念根、定根和慧根） 、惭力、愧力、无惭力、无愧力。二、五根和五力（一）五根和五力的区别五根与五力有什么区别呢？简单来说五力比五根的力量更强。举例来讲， 每位禅修者都有五根， 我们修入出息念的时候， 刚开始，一分钟都很难专注， 没几个呼吸心就跑了， 为什么呢？定根太弱。当定根渐渐变强， 培育到有定力的时候， 我们就能进入禅那， 这是定根与定力的区别。"],[12,195,297,0,"根是一种素质， 力更强调强度和稳定度， 力是以根为基础培养发展出来。所以《阿毗达摩概要精解》这样描述五根五力： “根与力拥有相同的五种心所， 尽管这两组的作用并不一样， 根是在其范围之内执行支配作用的心所。上堂课讲到： 每个根只是在它的范围内执行支配作用， 就像部门经理，或者国家部长，力使该心所不会受到对立之法的动摇。怎么理解呢？比如说五根，信是胜解，精进是策励，念是觉知，定是不散乱， 慧是照见， 它们在各自的范围内执行支配的作用。如此它们协助对治对立的法。"],[12,297,447,0,"哪些是对立的法呢？比如说信对立的法就是犹豫不决；精进对立的法就是懈怠；念力对立的法就是失念；定力对立法就是散乱、 掉举；慧对立之法就是愚痴。五力让五法不会受到对立之法的动摇，无法被击败。简单来说，五力就是导向解脱的强有力的好习惯！好习惯怎么养成呢？既然五根是导向解脱的素质，培养成五力就可以对治犹豫不决、懈怠、失念、散乱、愚痴这样的对立法，这样的力量在我们禅修的时候很容易能体会到。当我们散乱心起来、妄念很多的时候，如果没有定力，你是很难对付它的。你一次一次把心拉回到呼吸上， 心一会又跑掉了。但是当你有定力的时候， 你的心一朝向入出息的所缘， 就会好像被这个所缘吸进去一样， 稳稳地安住在这个所缘上， 你想生起掉举的心都生不起来，这是五力对治对立法在禅修中的举例。"],[12,447,569,0,"同样比如说“信”，我们总怀疑，“我修了入出息念这么长时间了，我总是没有进步， 我是不是修错了？我是不是应该要换个业处啊？或者这个老师教的跟我是不是不相应啊？”，他每天犹豫不决，坐在那就开始胡思乱想。我们前面课程讲到信力，信来自胜解，是信胜解，很多要来自有慧想， 是要有智慧的。智慧抉择完他就生信， 生信完以后他就不怀疑。不怀疑体现在哪里？有念，念要有强大的想，想来自于清晰的目标，清晰的目标来自于你对这个目标有信心。当我们确认目标 —— 入出息概念所缘的时候，怎么能有信呢？当专注这个目标时，你的心自然而然就被目标所吸引， 你不会紧张， 没有压力， 心也不会怀疑， 这个所缘在你内心很清晰， 你的信自然就会起来， 就是当你有信力的时候，你想要怀疑的心都不会生起来。这个就是力与根的区别，这是一种力量，用通俗的话来讲就是一种好的惯性。"],[12,569,638,0,"（二）培养五力的价值和意义这种力量怎么培养起来呢？最根本的是， 回过头来讲， 你首先要设立解脱的目标。如果你获得禅那， 会获得短暂的禅那阶段的心解脱， 完全沉在禅那的时候是没有烦恼的，你的心在那个阶段是从烦恼中解脱出来的，是心清净的阶段。所以你至少要有这样的目标 ——“我要获得”，也叫善法欲， 要有强烈的善法欲。如果没有强烈的善欲， 我们任何善的目标都无法达成。所以我们可以看到在禅林也好， 在禅修营也好， 有些人他就是浮浮泛泛。"],[12,636,715,1,"“你来禅林干嘛？”“禅修！”“是真的禅修吗？你天天禅修多少个小时？”“不好意思，才坐了 45 分钟。这样的禅修状态想让他训练到五根五力是没有可能的，是很难的。所以首先他要有强烈的善法欲， 单单有善法欲是不够的， 我们前面学习佛陀的《大四十经》 ，任何要去除不善的思惟，不善的邪语、邪业、邪命、邪精进、邪念，都要善法围绕。第一个是正见；第二个是以正见为基础去除邪思惟，作出努力，这是他的正精进；第三个是正念， 念念的关注在 “我有没有生起正念？生起正确的思惟？”"],[12,715,823,1,"。要三法围绕。在正见的指导下，在善欲的推动下， 念与精进不断地重复地现起， 最后会形成强有力的亲依止缘、 重复缘， 这样的力量才能慢慢地从五根培养起五力来。所以在这里， 正见和善欲是极其重要的， 做任何事情都是这样： 只要是善法， 就要有正见和善欲。培养心生起正见和善欲之前，要明白心运作的方式。心为什么会向外祈求？因为要寻求快乐嘛。我们一再在课堂上讲到，心非常的忠诚，总是不断地帮你寻找快乐。没有正见的时候，我们就是以感官的快乐为快乐。只要是这样的认知， 我们的心就会被鼓励机制和保护机制所束缚。这是人的动物性反应， 我们的心就围绕着这个动物性反应去追逐，这是自然而然的本能。"],[12,823,877,0,"所有人都认为我们在外面追求各种感官的快乐，认为追求身份、地位、钱财，会带来快乐。心越是这样祈求就越散乱，它停不下来。我们在前面也讲过， 所有这样的快乐是边际效应递减的， 这种快乐会坏掉， 不能真正带来持续的快乐。它只是诱惑你活着和诱惑你繁衍后代的诱饵， 仅此而已。只要快乐短暂， 你就不会在一个目标里长时间呆着， 不在一个目标里长时间呆着心就一直都在散乱。所以你只要向外驰求，心就一定散乱、焦虑，心无力感。"],[12,877,973,0,"如果你的心被训练， 特别是被佛法训练， 当我们心向内， 内守在一个所缘、一个目标上的时候， 慢慢地你可以突破我们的眼根、 耳根、鼻根、舌根、身根这五根的束缚，因为我们追逐五官带来的快乐。所以你只要心向内守，慢慢地就会突破这五根的束缚，然后成就禅那，五力被培养起来， 你就可以独享禅悦， 进入禅那获得很大的快乐。这个快乐不需要外在的东西， 你只要眼睛一闭、 往那一坐， 守着一个目标， 不管是入出息、 还是所有遍禅的目标， 都是随时就可以取来的概念， 不需要靠别人， 不要去追逐， 只要向心内一守， 快乐就可以起来。一开始的时候为什么总是困难呢？首先知见上没有转过来， 以为快乐来自外面，所以首先要在正见上转过来。"],[12,973,1075,0,"心的特点是当你能够内守一个目标的时候， 它能够获得很好的快乐， 这种快乐是完全超越感官上的快乐。感官上的快乐是边际效应递减的，最后会坏掉。而进入禅那后，只要禅支的力量在，就一直能够享受禅那的快乐。随着定力的提升，你可以观察到生命的状态—— 名法、色法、五蕴、 缘起， 五蕴的成因和它们的关系， 看到这个生命状态无始以来轮回的不堪、不圆满、受逼迫、坏灭，是无常的、苦的、无我的，这样的生命状态毫无意义， 完全内卷。当内心生起出离， 最后我们可以突破五蕴的束缚而得到涅槃的乐。当我们的心向内守， 第一阶段你可以获得禅那的乐， 当你获得禅那的乐， 再看自己的生命， 会生起厌离，然后可以突破五蕴的束缚， 最后证得涅槃的乐。这是培养五力的价值和意义啊！五根与五力我们学习到这里。接下来讲惭、愧和无惭、无愧。"],[12,1075,1173,1,"三、惭力、愧力、无惭力、无愧力（一）.惭愧在《阿毗达摩》和世俗中的区别1.惭愧在世俗中的意思首先需要说明， 《阿毗达摩》里的惭、愧和无惭、无愧指的是四个心所，它跟世俗讲的“哦，我很惭愧啊！” “你这个人一点惭愧心都没有啊！”是不一样的。世俗的惭愧有三种情况， 第一种， 他觉得自己有缺点， 或者有错误， 或者未能尽职尽责而感到不安， 或者羞愧；第二种就是我们见到人： “欸啊，惭愧啊、惭愧啊！”，一种感性之词，意思是“很难得啊”或者 “很侥幸啊” “很多谢啊” 这样的意思；第三种是客气话： “啊， 惭愧惭愧！”2.《阿毗达摩》中惭、愧的描述《阿毗达摩》的惭、愧是通过具体的特相、作用、现起、近因来描述的。比如惭的巴利语是 hiri。"],[12,1171,1245,0,"惭（hiri）的特相是对恶行感到厌恶。对恶行、不善行、邪恶的行为、邪恶的状态感到令人作呕、想吐的厌恶，这是惭（hiri）的特相。惭（hiri）的作用是羞耻造恶，对于造恶感到羞耻。惭（hiri）的现起是退避诸恶。我们看到恶行觉得去做会很羞耻。当发现自己对恶行有习惯反应的时候， 我们会从恶行里退缩出来。《注疏》 里面讲羽毛靠近火会卷曲起来， 立即缩回；也像我们的手去碰到火会马上缩回来一样。所以当惭（hiri）现起，我们的内心状态是退避诸恶。"],[12,1245,1302,0,"惭（hiri）的近因是自尊，对自己的尊重。惭（hiri）以羞恶作为基地，或者说惭（hiri）是羞恶的基因，因为惭（hiri）所以我们不好意思造恶。这些素质是写在你内心深处的东西， 跟贪、 瞋不一样， 它跟无明、渴爱这一类比较像， 潜藏在我们的心流里面。如果你的心流里惭 （hiri）的基因比较强， 你自然而然羞耻造恶。具体来讲是对已经做过的或者还没有做， 或者将来可能做的身语意的恶行感到羞耻， 这个就称为惭（hiri） 。"],[12,1302,1382,0,"一个懂得尊重自己的人，他以惭来舍恶行；一个懂得尊重他人的人，他以愧来舍去恶行。愧（ottappa）的特相是害怕造恶，对恶行感到害怕，它以害怕造恶作为基因。所谓造恶， 不仅仅指已经表现出来的很强的违害性烦恼（身口的不善行） ，也包括内心的种种不善。所以我们说惭愧并不是说你一定要像泼妇骂街， 随地大小便有惭愧， 而是内心面对不善心生起来有没有惭愧，这是相关联的。所以佛陀教导我们“不造一切恶，具足于诸善”"],[12,1382,1439,0,"“不造一切恶”是指十二个不善心都不应该生起来，也就是困扰性的烦恼都不应该现行，这是对惭愧的理解。愧（ottappa）的作用是因为对恶行感到害怕，所以他不会去造恶，也不会起不善心。愧（ottappa）的现起是由于这种害怕，心会从恶不善法中退缩回来， 跟惭一样都是退避诸恶。因为害怕造不善行而退缩是愧在我们内心里面呈现的相状， 知道造了恶法会有不良的后果， 他很害怕， 要从不善法里面尽快的避开退缩。如果我们心里面有这种感觉， 你就在内心里面观察到了愧心所的现起。"],[12,1439,1543,1,"愧（ottappa）的近因是尊重他人，因为害怕“已作未作”或者“将来要作”的恶行， 在现在或者将来会受到苦的果报。所以愧 （ottappa）是因为害怕而得名。惭（hiri）的生起主要靠几个内在的因素：第一、比如自身的社会地位、 家庭条件；第二、 年龄；第三、 勇气： 你这个人是不是懦弱？是不是有勇气？第四、智慧和学识。愧（ottappa）主要靠外在的因素生起来，愧把罪视为危险，所以称为害怕犯罪的人。他第一怕有罪， 自己会谴责自己， 过不了自己的良心；第二害怕被别人指责有罪，怕别人谴责，“会遭智者所呵斥” ；第三害怕受到国王、政府处罚，乃至于刑罚，害怕犯法；第四害怕堕入四恶趣，如果临命终时不善业成熟会堕入四恶趣。"],[12,1543,1644,1,"（二）佛陀讲惭和愧是世间白法的基石，佛陀称惭和愧为“世间白法的基石”。佛陀在《增支部·行为经》里说： “诸比库，有两种白法保护世间，哪两种呢？惭和愧。诸比库，若此两种白法不保护世间， 不知这是母亲， 不知这是母亲的姐妹、 叔伯的妻子，这是师母即师长的妻子，世间将走向混乱，犹如羊、鸡、猪、狗、豺狼。诸比库，正因为有此两种法保护世间，所以知道这是母亲，母亲的姐妹，叔伯的妻子。没有惭愧这两种道德素质守护世间， 人与人之间的伦常就不会被尊重， 甚至不存在。母亲和孩子， 阿姨和侄儿之间就可能就没有
