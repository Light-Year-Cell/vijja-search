了， 直接就下手了。所以说， 其实过去他已经决意过了， 就是这个意思。寻（惯性），落在阿毗达摩的具体点上，就是“想”起了很重要的作用。想，就是标记。标记，一次标记、两次标记、三次标记......，习惯了就会变成一种见解。以前蚊子咬你时只是觉得痒痒的， 你不会想 “你把我的血吸完以后还会传播病毒， 太恐怖了！”， 你若加上这样一堆标记，由这样的标记形成的见解就是 “害虫就必须把它打死， 我不把它打死， 它还传播病毒”"],[18,3762,3849,1,"。事实上也是这样， 比如热带猩红热就是靠蚊子传播的， 而且是一种特别的蚊子。这就是标记，当标记到一定程度就形成一种见解。我们所有行为的背后， 都是在见解的指导下来实施的。八正道， 首先是正见，然后是正思惟、正语、正业、正命、正精进、正念、正定。见就是观念或者认知。思就是思惟方法、 思惟习惯， 这是习惯， 习惯表现为寻，寻分为善寻和不善寻。知见会形成你的习惯， 习惯的思惟方式导致你的行为习惯，心理学术语就是认知行为模式。"],[18,3849,3935,1,"所有人活在世间， 面对一切事， 你都是按照既定的认知行为模式在做事、 在行动。自然而然地认为：“我就是这样。。如果想改变行为：“这个行为不能做啊！”—— 小孩子打游戏、不听话都是表现在行为上，你说：“不行，你再这样做我就揍你！”，直接在行为上下手，这样是不会有好结果的。因为习惯是由认知决定的， 所以你要让行为改变， 就要改变他的习惯；习惯要改变， 就要改变他的认知。如果你不从认知下手， 而直接从行为下手， 可能他现在年纪小打不过你，“那就忍着吧， 到我有力量的时候，等着瞧！”"],[18,3919,4023,1,"。问题就在于，他的习惯和认知没有改变，他只是憋着。对所有的人， 其实都是这样的， 面对所有的果报， 苦出现的时候心要能够停得下来， 停下来就是不要被寻带走、 不要被习惯带走。停下来干嘛呢？就是看 “诶， 我面对这个果报， 生起什么样的感受？我生起的是什么样的心、 是什么样的寻， 这个寻的后面是什么样的认知？”。根据对方的表现， 不能仅仅是看人家一个眼神， 你要看到对方的寻和对方的认知。看清楚自己的认知和习惯、 看清楚别人的认知和习惯， 然后你再看你的认知行为习惯是正确的吗？是能导向善的吗？如果不是， 如何通过一念之转把念头转过来？这是解决自己的问题。而别人呢？在当下你是不能改变他的，你只能接纳，全然接纳："],[18,4023,4124,1,"“这个人，他有这样的认知，有这样的习惯，所以他表现出这样的行为， 我们对此表示理解和接受。因为他的行为不是现在针对我的， 而是他只要碰到类似的事情，一定都是这样的。，他有他的认知行为模式， 只能接受， 除此之外，你没有任何办法。接受它、 接纳它， 然后再看有没有可以沟通和交流的途径和因缘， 下一步才能够把事情导向比较正确的、理想的方向了。这就是生活中八正道的应用。苦谛一出来， 你看原因， 为什么会导致我苦？为什么会导致事情这样发生？其实两个人只要有矛盾， 都是你的期待跟对方的期待不一致， 才会产生问题。看到这个原因， 我想灭掉它、 我希望这样的苦不再出现、 或者我们的矛盾不再出现， 怎么办？八正道！解决你的知见和对方的知见， 不把这两个知见解决掉， 不可能解决问题。除非你拳头比较硬，人家就是拿你没办法。"],[18,4124,4277,1,"所以一讲到四圣谛， 怎样落实到日常生活当中， 生起四谛法， 处理的方式能不能用八正道？如果你能把握这一点， 所有的事情就很容易智慧地去处理。今天的课就学到这里，祝福大家早日体证真正的四圣谛。萨度！萨度！萨度！"],[19,4,168,0,"172 讲-摄集-摄菩提分-身念处-入出息念 1古源尊者礼敬尊敬的祜巴大长老，礼敬各位尊者、各位尼师、各位贤友，晚上好！一、三十七菩提分之定义根据《清净道论》中三十七菩提分的定义：“这三十七法处于以觉悟之义而得名为菩提的圣道旁边，故名菩提分。处于旁边即处于资助的状态。”从这个角度来看，它是以资助的状态。二、菩提分之概要（一）简述菩提分什么是三十七菩提分呢？有四念处、有八正道……。佛陀说：“四念处是走向解脱的唯一之道。”它其实也是道。所以三十七菩提分既是资助也是道。"],[19,168,350,1,"三十七菩提分如何分呢？三个四、两个五、一个七、一个八。三个四：四念处、四正勤、四神足；两个五：五根、五力；七觉支、八圣道分。这就是三个四、两个五、一个七、一个八，合为三十七菩提分。在学习混合之概要时， 其中十二道支里也包括八正道：正见、正思惟、正语、正业、正命、正精进、正念、正定；在学习二十二根时，学到了五根；在学习九力时，学到了五力：信力、精进力、念力、定力、慧力；在学习四2增上时，学习了四如意足的主要内容。四增上与四如意足的区别是什么呢？四增上除了观增上之外，其他三种增上于善法、不善法、无记法中都可生起。但四如意足是菩提分，它完全是指在善法上的欲增上、精进增上、心增上和观增上。从三十七菩提分的角度，四如意足是完全从善法的层面来讲。学习三十七菩提分，对于八圣道分的细节就不再重复，五根五力也不再重复，四如意足也不再重复。我们着重学习四念处，同时结合四正勤和七觉支。只要讲到四念处，一定跟四圣谛八圣道也是不可分的，所以也会一起来讨论。在四念处的练习上，五根、五力也是离不开的。虽然是以四念处为主，但三十七菩提分都包含在里面。"],[19,350,494,0,"以上把将要讲解的三十七菩提分内容跟大家作个交代。（二）四念处三十七菩提分的第一个部分是四念处，四念处：身念处、受念处、心念处和法念处。先整体地了解一下三十七菩提分，后面会细讲。（三）四正勤四正勤即是正精进：令已生起之恶法断除，令未生起之恶法不生，令未生起之善法生起，令已生起之善法增长。（四）四神足四神足：欲神足、精进神足、心神足和观神足，亦是之前所讲的四种增上。（五）五根五根：信根、精进根、念根、定根和慧根。在讲二十二根时强调：念根应该于一切时处越强越好，信根与慧根平衡，定根与精进根平衡。（六）五力五力是在五根基础上的一种发展，被称为修习力。为什么经常会觉得软趴趴的没有力量、妄念纷飞、掉举、追悔等等，就是因为转不过来。转不过来的原因是因为没有五力，没有五力是因为没有修习力。修习力怎么来5呢？就是要好好地修，没有其他的方法。"],[19,494,585,1,"（七）七觉支七觉支：念觉支、择法觉支、精进觉支、喜觉支、轻安觉支、定觉支和捨觉支。（八）八支圣道八圣道：正见、正思惟、正语、正业、正命、正精进、正念和正定。在前面的十二道分里道缘部分讲过，十二个道分中的四邪道是：与正见相对的邪见、与正思惟相对的邪思惟、与正精进相对的邪精进、与正定相对的邪定……虽然有邪思惟、邪精进和邪定，但并没有单独列一个心所出来，所以十二道分，按心所来讲就是九种心所，包括邪见。（九）菩提分对应的心理素质上图为三十七菩提分整体图。"],[19,550,820,1,"三十七菩提分对应下来就是我们的心理素质，总共涉及到的心理素质（心所）：一境性、寻、精进、喜、欲、信、念、心所的轻安、中捨性、慧根、正语、正业、正命。可以看到出现最多的是精进，一共出现了九次，念出现了八次。所以修行什么东西最重要？正精进。正精进和念是在修行当中最重要的两种素质，且它们也是相互的。如果我们没有解脱的欲愿， 就不会想去修习、培养三十七菩提分，所以作为一个修行者，首先要看你的生命目标。无论在家、出家，你真的确定了以断除烦恼作为生命目标吗？以前让大家观察，所谓的学佛、修行在你生命当中所占的比重有多大？成分有多大？第一个从时间的角度上来看，第二个从重视度的角度上来看，你自己拿个本子记记，一天 24个小时，有几个小时是用在与法相关的事儿上？你排列这一天中最重要的事， 按重要性，修行排在第几位，就会很清楚。我们把学习佛法、改造生命放在什么样的位置上， 而这都是与欲相关的。“我很想解脱！但是我现在确实很忙， Bhante，我现在工作很多，家庭事情很多。”那你这个欲就不是真正有这个欲愿。真有这欲愿你根本不会管这些事，有什么意思啊，生命就是内卷。"],[19,820,919,0,"三十七菩提分是导向解脱的菩提资粮，其中最主要的支助，第一个就是精进，而精进的前提是欲。欲虽然只出现一次，但它是决定你是否精进与念的重要内容。有了欲愿，如果不精进，不把它排在正确位置，也没有用。你只是知道有精进，但不会正精进，没有心心念念地在业处，修行也很难上去。粗粗地回顾了三十七菩提分，接下来我们开始学习四念处。三、四念处(一）于《大念处经》中的记载关于四念处，在佛陀的经典中最著名的是《大念处经》。上座部修学体系很多出处来自于《大念处经》，此经记录于中部及长部。"],[19,919,1012,1,"佛陀于《中部·大念处经》中说：「如是我闻，一时世尊住在古卢国的一个市镇，名叫剑磨瑟昙。那时世尊称呼诸比库说：“诸比库。”诸比库回答说：“世尊。”世尊如此开示：“诸比库，这是使有情清净、超越忧愁与悲伤、灭除痛苦与忧恼、成就正道与现证涅槃的单一道路，那就是四念处。此一行道，能清净有情，9超越愁、悲，灭除苦、忧，得达清净如理，现证涅槃。”」（二）单一道路如何来理解？首先，佛陀说：“诸比库，四念处是单一的道路。” 《注疏》中对于单一的道路，有“唯一之道”等多种解释："],[19,1012,1147,0,"1、本质上这不是一条双向的道路，或者这是一条“单独的路”，因为这条路必须自己单独走，没人有办法完全地和你走在一起。有两种情况：第一种，捨离与人群来往之后，独处而没有伙伴。第二种，透过内心寂静而捨离爱欲。如果说前一种捨离，可以通过离群独处做到，但你内心是不是捨离爱欲而达到寂静，只有自己才知道。这是单一道的两个角度。2、由于这是上等人的路，因此称为“单一的道路”，不是庸俗的、顽劣的人能走得了的路。3、在一切有情之中，世尊是最上等之人，因此，这条路又称为“世尊之路，一切诸佛之路，一切诸佛之古道”。虽然也有其他人走在这条路上，但是由于这条路是佛陀所开创的，故称为世尊之路。有句话说： “婆罗门，世尊是未创之路的开创者。”这条路只在佛陀的法与律当中才有，是外道所没有的，因此佛陀说：“苏跋达（Subhadda)!八圣道分只存在于我的法与律当中。”"],[19,1147,1266,0,"4、“单一的道路”指的是它通向单一的目标，意即只通向涅槃。虽然在四念处的初步阶段，可通过二十一种不同方法来修行，但到了后来它只是朝向、趣向单一的目标，即涅槃。《注疏》解释说：由于涅槃是独一无二的，没有爱欲共相伴随，因此称为单一。上面是对单一的四种解释。为什么只有念处被称为 “道路” 呢？前面讲到的八正道，正念只是其中一个道分，其余七个道分——正见、正思惟、正语、正业、正命、正精进和正定。当你真正修习四念处时，三十七菩提分本身就包含在内，即所有的圣道分也都被涵盖在内，因为它们与正念同在。道路的含义还包含了通向涅槃之意，且是想要证悟涅槃者、解脱烦恼者必须经历的道路。（三）小龙三藏长老与小须摩三藏长老的讨论帕奥西亚多在讲到“单一之道”时，记录了从前长老们一段重要的讨论："],[19,1266,1342,1,"小龙三藏长老说：“念处之道是八圣道分中的前行道。”意即四念处是出世间圣道生起之前的世间修行道。小龙三藏长老的老师（小须摩三藏长老）认为：“不是，其实它（四念处）是出世间道与世间道的合行道。”他们争执不下，小龙三藏长老就说：“好”，然后保持沉默。后来，老师背诵《大念处经》，当他诵到 “或一日一夜，或七日七夜，或七年能够证道。”这段经文时，他思惟并得出结论：出世间道心生起之后，不可能存在那么长时间。因此，他接受弟子小龙三藏长老的观点：四念处是出世间圣道生起之前的世间修行道。"],[19,1342,1445,0,"也就是说，四念处是我们每一个人在当下要修习的。《无碍解道》中提到： “最上之道是八圣道分；最上之理是四圣谛；最上之法是离欲的涅槃；这是唯一的道路，没有其他道路能使见解清净。依循此道路而行，你能够降伏魔王，灭尽诸苦。”（四）修行四念处的七项利益修习此单一的道路能获得七项利益：能使有情清净、超越忧愁与悲伤、灭除痛苦与忧恼、成就正道与现证涅槃。什么是有情清净（或清净有情）呢？意指：使受到贪、瞋、痴等烦恼染污的有情得以净化；有情捨离诸漏之后，能达到最高的清净。要明白所谓身体的清净并不能达到佛法所教导的烦恼之净化。"],[19,1445,1507,0,"《相应部》中有段偈颂：伟大的知见者并不如此教导：众生由于身体的染污而染污，或由于洗净身体而得到净化。伟大的知见者如此宣示教导：众生由于内心的染污而染污，众生透过内心的净化而净化。这段话在种姓制度非常严苛的古印度时代，显得非常重要。婆罗门认为自己是高尚的种姓， 他们是清净的；而最低级的首陀罗， 他们是染污的，所以他们只能干脏活，永远不能得到净化。因此佛陀说：不是因为身体的染污而染污、不是洗净身体而净化，而是由于内心的染污而染污，透过内心的净化才能获得净化。"],[19,1507,1585,0,"我们这个时代也是这样，学佛修行与你的地位、身份、乃至聪明才智、财富、知识的掌握都是不相关的，是与内心相关的，是与你是否真正愿意对着自己的烦恼下手相关。四、四念处与调伏者的根性前面讲到《无碍解道》中“最上之道是八圣道分，最上之理是四圣谛，最上之法是涅槃。”在《注疏》中关于四念处的修习，有四种念处、二十一种修法。是不是每个人都要同时把这二十一种修法都修完呢？注疏里讲：不是的，四念处调伏不同根性的人。《注疏》里说修行者可分为几类："],[19,1583,1686,1,"第一类， 钝根者与利根者。钝根者是指学习能力或者领悟能力比较慢。一个法类讲完，是不是能很快地明白？然后可以去实践？利根者则相反，他的学习能力比较强，领悟能力很强。第二类，爱行者与见行者。爱行者对应到《清净道论》里讲的六种性行，类似于贪性行者；见行者有很多知见，有很多看法、观点，喜欢怀疑、批判、分析、判断，给自己制造障碍，这是见行者。第三类， 止行者与观行者。止行者是先修止禅， 达到禅那之后再修观；观行者是还未达到禅那就直接修行观禅。"],[19,1683,1792,1,"四念处对于调伏不同类型的人有不同的作用。根据《注疏》介绍：如果你是钝根的爱行人（钝根的贪行者），适合修习身念处。身念处有十四种，并不是把每一种都修完。至于哪一种最合适呢？就需要跟老师配合了。如果你是利根的爱行者，适合修习受念处；若是钝根的见行者，适合修习心念处；利根的见行者，适合修习法念处；若是钝根的止行人，适合修习身念处；利根的止行人，适合修习受念处；若是钝根的观行人，适合修习心念处；利根的观行人，适合修习法念处。"],[19,1792,1918,0,"佛陀教导四种念处，是为了适合摄受堪受调伏者的根性。《注疏》中讲到：对于钝根的爱行人（钝根的贪行人）而言，他不容易观察微细的法门，观察粗色身的念处，才容易达到清净之道。可以尝试十四种身念处的修法。对于利根的爱行人（利根的贪行人）而言，他就能够观察到比较微细的法门。但是因为他是贪行人，对好的感受比较贪著，所以很容易发现好的东西、好的感受，因此修习受念处，容易达到清净的目标。对于钝根的见行人而言，因他有很多见解，但又属于钝根的范畴， 故不能让他辨别太多的法类。修法念处就会比较困难；而修心念处，就比较容易获得清净。"],[19,1918,2046,0,"对于利根的见行人而言，他对十二处、十八界、五盖、四圣谛能有条理地分清楚，就适合修法念处。对于钝根的止行人而言，由于能很轻易地取得禅相，所以身念处是达到清净之道。钝根者比较老实，修止禅很容易获得所缘目标，因为他不矫情、不分析、不评价、不判断，这样的人就容易修身念处，入出息念也属于身念处。根据性行来划分，对于贪性行者而言，修入出息念的前阶段就比较容易。对于利根的止行人而言，由于他不容易持续地专注于粗的目标，在修观阶段，修受念处比较容易获得清净。"],[19,2046,2146,0,"对于钝根的观行人而言，钝根的纯观行者无法辨别很多的法门，所以从修心念处开始，观察他的心，比较容易到达清净的目标。对于利根的观行人而言，由于他很容易辨别各种法所缘，所以适合修习法念处，比较容易到达清净的目标。以上是按调伏者、 应摄受者的根性对应到适合修的不同念处来设定的，但这个设定亦非绝对，因为修行有不同的阶段。对于止行人来讲，有修止禅的阶段，有名色分别、缘摄受阶段，再往下开始修观。在不同的阶段里，目标有所不同，具体的运用得看老师如何观察这位学生的根性及当下的状态，而做不同的调整。"],[19,2146,2351,1,"总体来讲，“四念处与调伏者根性”这种划分，着重是放在修观的阶段，即在观智的阶段成就，以这四种角度划分和设定。这只是让大家有个初步的了解，那么自己到底是哪一种类型的人呢？你可以自己去观察，也可以跟老师讨论。五、修习四念处的二十一种方法四念处共有二十一种修习方法。身念处十四种：入出息念、四威仪、各种正知、不净随念（不净观，包括32身份）、界分别（四界差别）、九种坟场观。受念处与心念处各算一种。法念处分成五种：五盖、五取蕴、十二处、七觉支、四圣谛。六、入出息念与其他业处的差别以前有讲过《入出息念前行与修习次第》，因有新同学加入，所以在具体讲入出息念之前，先来学习入出息念的前行准备。"],[19,2351,2470,1,"入出息念与其他业处最大的差别在于：随着定力的提升，入出息的所缘会越来越微细；而对于修习其他的39 种止业处，随着定力的提升，所缘会越来越明显、越来越微细。为什么所缘越来越微细会令入出息念变得越来越殊胜呢？修止禅的人都知道，若找帕奥西亚多请求业处，目前他老人家一般只给两个业处：入出息念和四界差别。很多人说入出息念很难修，然后改修四界差别。从我开始接触帕奥禅法，09年至今有十三四年了，没有看到过一位禅修者直接修四界差别成就的，但是修入出息念成就的人就比较多，或许我有点孤陋寡闻。"],[19,2443,2528,1,"入出息念的所缘非常容易取到，因为人人都有入出息，而这个入出息还会有变化，它一进一出、一进一出……，它的自性就在那边进出、进出、进出……。其他的所有业处，比如四界差别，你从来没有见过四界：“哦，这是硬的、这是粗的、就是重的、这是软的、这是滑的、这是轻的，这是流动、粘结，冷和热。”你去感受它，全身一点一点地去体会它……。一旦自己的念力不够、定力不够、精进力不够，很快就会感到很疲惫、很烦躁，心就不愿意做。"],[19,2528,2635,1,"如果修遍禅， 对于没有定力的人来讲， 能取到一个遍禅的相都不容易，要让它在意门里面很好地呈现都不容易，更不用说长时间地去专注它。没有长时间的专注，就很难成就定力。因为那个相很单调，即使你取到相，它依然很单调，一旦没有定力，它马上消失。但入出息不同，入出息随时都在，而且还有动态——有进有出、有进有出，心就有事儿干。我们的心非常忠诚，它无时不刻地帮你寻找快乐，只要发现这个目标没有什么事，比较单调，它马上就跑掉（打妄想，回忆过去、描绘未来）。因为入出息有动态，所以佛陀教导说：你知道入息、出息；也可以知道长息、短息；还可以知道全息；还可以知道微息；还可以知道微息的全息、微息的长短息，心有很多工作可以去做。整个禅修过程都可以持续地在上面 （入出息上） 做很多的工作。入出息念虽然是最难成就的业处，但也是最容易成就的业处。如果入出息都很难成就，其他的业处就更难。这也是我的一个观点。"],[19,2635,2726,0,"随着所缘越来越微细，它还有一个优点：就是心的敏锐度也要越来越强，即你的念力也要越来越强，要不断地跟上去，不然心就跑掉了。入出息是定力与念力可以被同时训练的一种修行方法。入出息念 （ānāpānasati），sati 是念，它能够不断地培养你的念力，而其他业处很难达到。七、成就入出息念殊胜定力的两阶段标准什么是入出息念成就，有很多种说法及标准。在此再次强调，帕奥西亚多在2015年以后，对于成就入出息念殊胜定力的两阶段标准：第一、持续专注微息四个小时、五个小时无妄念。"],[19,2726,2873,1,"第二、当你能够持续专注微息四个小时、五个小时以后，在心能自然地滑入似相，一次、两次乃至多次，心完全地排斥专注微息，心总被似相带走。此时，帕奥西亚多会允许你开始专注似相，而后练习持续专注似相达到四个小时、五个小时无妄念。帕奥西亚多刚提出此标准时，几乎所有禅修者都是一片哀嚎！认为这是不可能的，怎么可能做到？但事实证明是可能的，很多人都达到了，有出家众达到的，也有在家众达到的。今天刚有一位在家贤友跟我报告： “四个多小时没有妄念！欢喜得想撞墙。”说明是可以做到的，在家禅修都能做到。做不到，是因为我们内心设定了错误的想蕴标记“那个太难！”，当设定为“真的太难”时，就肯定达不到了。心的力量是不可估量的，心的训练可以成佛！更何况四个小时、五个小时专注微息，这是基础的基础，我们肯定能做到！也有很多人说：“啊，我可能巴拉密不够啊。”“哇，我可能巴拉密不行啊！”帕奥西亚多怎么说？说：“所有的人巴拉密都够！一切众生的巴拉密都是足足够的。”为什么呢？因为你这个名色流已经历过无数劫，每一个劫末你都去了梵天界，而且，在梵天界里直到死为止(在光音天以上一直待到死为止)，那么漫长地修习止禅，怎么可能没有巴拉密呢？"],[19,2868,2943,1,"狗、猫、蚯蚓、蚂蚁都有巴拉密，你怎么可能没有巴拉密呢？所以不要担心自己没有巴拉密，每个人有足够的巴拉密，剩下的就是要对自己有信心，正精进地去修习，就一定能够做到，没有难度。从一五年至今，有很多出家人、在家人以实际行动证明了帕奥西亚多的这个标准是可以达到的。只要达到这个标准，未来在成就其他所有止禅以及观禅都会稳定很多，其利益是无可限量的。目前我是按照这个标准来指导禅修者，能达到的不止一、 两位。虽然不是很多，但也确实不止一位、两位能做到。"],[19,2943,3070,1,"八、修习入出息之功德很多人修入出息念没有欢喜。今天禅修报告时跟大家讲：要培养对入出息的欢喜。如何培养对入出息的欢喜，就要对入出息的功德有所理解。佛陀说：“诸比库，修习、多作此入出息念之定，不但寂静、殊胜、不杂、乐住，而且能令再再生起的恶、不善法由此消失、停止。诸比库，犹如在热季的最后一个月，非时大雨能立刻使飞扬的尘土由此消失、停止。”如果在平时 （没有危险的情况下） 能习惯于行住坐卧都专注于入出息，所有的恶、不善法就会由此消失、 停止， 更不用说你成就入出息念之定时。对于有些禅修者，现阶段的要求：一、二、三、四禅入出息念，在一切行住坐卧都要保持。有贤友就保持住了，随时在行住坐卧入一、二、三、四禅；一禅、二禅、三禅、四禅；四禅、三禅、二禅、一禅，晚上睡觉之前先入禅，能不能保持一天？有些人能保持到，有些人还不行。保持， 有不同的方法，因不同的人而有差别。当你一整天都能够保持禅那时，哪有不善法呢？可以立刻使飞扬的尘土由此消失、停止。"],[19,3070,3219,1,"（一）非常寂静故有大功德入出息念非常寂静，因寂静而有大功德。《清净道论》中引用佛陀的话：“诸比库，于此入出息念修习、多作是寂静、殊胜。”有很大的功德，可以迅速去除妄想。很多人有意见：“我修入出息念就是有很多的妄想。”那是因为你还没有把握到入出息的基本方法，当真的把握到入出息的基本方法时，心自然而然会贴在每一个入息和出息上，当心贴在入息和出息上时，怎么会有妄想呢？因为一个心识刹那只有一个心生起。（二）可迅速去除妄想故有大功德心是单一生起的，只要在入出息上，就不可能有妄想。入出息是如此的清晰，与其他的业处（遍禅）不同。比如遍禅或者随念，你修白遍，十方都是白的，那个遍相就是一圈、一片。如果你定力还没有足够强，还没有进入安止定时，对白遍一点办法都没有，除了老老实实地觉知那个遍，那个遍无法跟你互动，不能跟你的心互动，打妄想时一点招都没有，只能更多地提醒自己：“白白白……”。但是，入出息不一样，有妄念出来时，只要心一贴近入出息、跟上入出息、觉知每个入出息的细节，妄念就没有了。因为它寂静、殊胜、不杂。"],[19,3211,3294,1,"比如不净随念，有贤友报告说：“我不喜欢三十二身分。”你喜欢就错了，三十二身份是修不净的，要生起可厌，怎么可能会让你觉得很喜欢呢？但是，三十二身分既然成就了，就要继续修。因为有40种止业处，很多人修习四十种业处，就像狗熊掰棒子，掰完一个扔一个，掰完一个扔一个，掰完一个扔一个……修到后面时，碰到美女还是美女、碰到帅哥还是帅哥，心里还是起不了作用。为什么呢？三十二身分修完了，白骨修完了，平常23却不练习。所以我们要求：每天人多时，都要看到他的三十二身分，都要看到他的白骨，每天都要这样练习，你才不会丢掉。这个法学了就要用上，不是学完以后说：“报告西亚多，三十二身分修完了。”“满意吗？”“满意！”然后放下，这个法你就用不上了，法是要拿来用的。"],[19,3294,3368,0,"入出息念也是这样，但是入出息念与三十二身分不同， 你会喜欢、会乐住。我常跟有入禅经验的贤友讲：“要么你入三禅，世间最高的快乐，安住在那边（禅那里）身心调愈一下；要么你入四禅，寂静一下，让你的心得到宁静、清净。”（三）可得圣道圣果故有大功德佛陀说：“诸比库！修习而多作安般念（安那般那）则得完成四念处，修习而多作四念处则得完成七觉支，修习而多作七觉支则得完成明与解脱。”（四）命终时预知时至故有大功德很多人问命终时怎么办？修入出息念，好好地修。如佛陀对他儿子所说：“拉胡勒！如是修习多作入出息念之时，你必知最后的入息出息之灭，不是不知的。”就连最后一个息你都可以知道。"],[19,3368,3438,1,"（五）三世诸佛证悟殊胜成就的基础《注疏》以及玛欣德尊者《止观修行次第》都有讲到： “一切即将成佛的菩萨在他们的菩提树下，都是通过修习入出息念而先成就禅那，再转修25观智而证悟佛果的。”（六）佛陀乐住入出息念之定即使是佛陀本人也很喜欢进入入出息禅那，以入出息念为根本业处而安住于现法乐住。看到经典上有弟子问佛陀，白天的住处是什么？佛陀说：“入出息念”。因此入出息念也称为圣住、梵住或如来住(如来的住处)。想想就很欢喜，这是优胜之处（很优胜的业处）。"],[19,3438,3512,0,"所以对每一个入出息要生起欢喜，想想：“啊，佛陀修的。”就像佛陀在这个地方（眼前）修一样，内心如此去忆念。连同佛陀的功德、法的功德、入出息念的殊胜功德，都能在入出息念里体现出来，要这样去练习。有一次，佛陀对诸比库说：“我想在三个月中独坐，任何人不应该来访，除了送饭的人。”三个月结束之后，佛陀告诉比库们说：“诸比库，假如有外道游方僧这样来问，说：‘Āvuso，沙门果德玛（Gotama）依何住而多住于雨安居呢？’如果有人这样问的时候，诸比库，你们应该这样回答这些外道游方僧，说：‘Āvuso， Bhagavā 以入出息念之定而多住雨安居。’ ”26所以要好好练习。"],[19,3512,3613,1,"（七）佛陀经常教导修习入出息念四十种业处中， 入出息念（ānāpānasati） 佛陀讲得最多， 在 《长部》 ·《大念处经》；《中部》·《念处经》、《入出息念经》、《身至念经》；《相应部》·《入出息相应》多部经典中都有讲到。（八）什么是禅那、定与正定对于如何成就定力或者什么是禅那，必须要明确。什么是禅那？即获得了心一境性，心一境性（Samādhi），不是所有定都能称为Samādhi。佛陀在《大四十经》中讲到要成就的是圣正定， 「诸比库！有这七个定的资粮，哪七个呢？正见、正思惟、正语、正业、正命、正精进、正念，比库们！凡被这七支准备的心一境性，诸比库！这被称为『有近因』、『有资粮』的圣正定。」"],[19,3613,3689,0,"前几天有贤友问我说：“诶！我看有些人好像戒律（持戒）也不是很咋地，怎么就能够成就定力？”关键是他成就的是什么定？如果是一个破戒的人，他成就的定力一定不是被七支资助的圣正定，这样的定引导他在修习观禅时能不能有效成就呢？真正的上人法是能够导向解脱的正定和观智。有人讲：“外道都有定啊！共外道，很多外道根本没有戒，他怎么能成就定呢？”因为外道所修定不是圣正定，也不一定需要七支准备。至于外道所修是什么样的定，我们不作评价。"],[19,3689,3794,0,"佛陀讲的定 Samādhi，是圣正定，是由七支资助的，即是在正见、正思惟、正语、正业、正命、正精进、正念基础上的圣正定，这样的圣正定才能够成就十四种沙门果。（九）初禅之乐在《沙门果经》中佛陀有讲什么是初禅，“他已离诸欲，离诸不善法，有寻、有伺，离生喜、乐，成就并住于初禅。他此身乃被离生之喜、乐所浸润、流遍、充满、遍布，其身没有任何一处不被离生之喜、乐所遍满。”在《弥兰达王请问经》中，那先尊者对弥兰达王说：“大王！犹如熟练的洗浴师或洗浴师的学徒，在铜盆里撒了洗浴粉之后，不断地撒水揉捏，使此沐浴球内外皆被水所渗透、浸透、遍满、湿润且不滴下。同样的，大王！比库此身乃至被离生之喜、乐所浸润、流遍、充满、遍布，其身没有任何一处不被离生之喜、乐所遍满。”"],[19,3794,3886,1,"佛陀的法是自见的、无时的、来见的、导向涅槃的、智者们可以各自证知的。很多人可能认为：“我证得初禅了。”也常听到有人如此说。到底有没有证得初禅呢？对照这句话： “他已离欲，离诸不善法。”你离了吗？离贪爱了吗？欲就是欲贪，包括对禅那之乐的欲贪。离诸不善法离什么呢？离五盖：欲贪盖、嗔恚盖、昏沉睡眠盖、掉举追悔盖、疑盖。一定要先离掉才有可能生起有寻、有伺，因为离（离了五盖）而生起的喜、乐，才能成就并住于初禅。当离了五盖而生起的喜、乐，全身就会被这个喜、乐所浸润、流遍、充满、遍布，其身没有任何一处不被离生之喜、乐所遍满。你有没有这种体验？如果没有，显然不是佛陀所讲的初禅。"],[19,3886,3993,1,"今天的课先到这里，祝愿大家早日成就止观，解脱一切烦恼。萨度！萨度！萨度！"],[20,8,248,1,"173讲-摄集-摄菩提分-身念处-入出息念 2古源尊者一、圣正定上堂课学习了<三十七道品>——四念处之身念处（入出息念）的部分内容，课上强调：入出息念成就的定是由七支支助的圣正定。如何判断你所获得的定力呢？按照帕奥西亚多的要求： 能够沉入似相三个小时、四个小时没有妄念。依佛陀的教导：“你此身被离生之喜、乐所浸润、流遍、充满、遍布，其身没有任何一处不被离生之喜、乐所遍满。”你判断一下，自己入的定是不是佛陀所讲的那种定。如何成就定力呢？"],[20,248,371,0,"看看初禅心的组成。初禅心有三十四个名法：1 心识、13通一切心心所、19 遍一切美心心所（信、念、惭、愧、无贪、无瞋、中捨性、心和心所的轻安、轻快性、柔软性、适业性、练达性、正直性）、1 无痴心所（慧）。这是初禅要达到的心的状态。在练习入出息念时，我们显然也要生起类似的心。因此， 在修习入出息时， 是否正确地专注，应以初禅心的素质来对照。当你专注时，如果生起的心是与贪、瞋、邪见、我慢、嫉妒、悭吝、追悔、怀疑相关的，显然这样的心没有办法成就初禅心的状态。平常怎么会生起这种不善的心呢？其实我们很清楚， 当你有一点好的感受、又有期待时，贪心就会生起；当你感觉昨天状态比较好，今天状态不对时，开始焦虑、着急时，瞋心就会生起；接着又开始怀疑：“哦！我今天又出什么问题了？这样是对还是不对啊？到底是什么情况啊？”或 “啊，肯定是今天吃多了。”又开始追悔；然后听到别人说：“哦，听说某个人证得禅那了。"],[20,371,461,1,"”又很嫉妒；如果今天刚好状态好一点，听到别人禅修报告比较差，我慢就生起来……。在禅修的过程中，如果你的心都是绕在不善心所里打转，那禅修进步就跟你没关系，大家要明白这是根本。有人疑惑说：“诶，讲课的内容怎么跟禅修的实际技巧没有关系？”——心的素质才是根本，要以此去对照。Samādhi 是善的心一境性。正定是善的心一境性，非不善的心一境性，亦非邪定。如何达成善的心一境性呢？1、所缘明确。你的心始终在佛陀教导的四十种业处的某一种业处 （指定的所缘） 上。比如业处是入出息念， 所缘就是入出息的概念。心以入出息为所缘，长时间轻松、快乐、自然、如实地安住在这样的所缘上，这就是善的心一境性。"],[20,460,535,1,"2、所缘稳定。若你要达成善的一境性，帕奥西亚多讲须三个小时、四个小时没有妄念，即三个小时、四个小时自始至终你的心都要在呼吸上。呼吸是所缘，此时的特点是你的心很愿意、很乐意待在那儿。我们知道心总是寻找快乐的， 如果所缘不能给你的心带来快乐，想在那儿待三个小时、四个小时是绝不可能的，所以一定是那个所缘会给你带来快乐。什么样的所缘会给你带来快乐呢？前提是要有强大的吸引力，你会觉得它很吸引你。如果被吸引，所缘必然是明确的。如果你都不知道入出息是啥，肯定一直在那找、在那怀疑。如果它不稳定，很多人说：“一会在人中上，一会在鼻头处，一会又飘到上面去了。”——不稳定，那也很难。"],[20,534,616,1,"3、所缘清晰。如果所缘不清晰，你也不会愿意待那么长时间。首先，在取所缘（入出息）时，至少在你的内心里搞清楚：我的所缘是入出息。入出息每个人都有，只要还未断气或者还未证得稳定的四禅，你的入出息始终都是在的，即使再微细，它也存在。因为它是你生命的表征。为什么说入出息是一个很好修的一个法门呢？因为入出息本来就很明确、本来就很稳定。如果一个人经常有呼吸不正常的症状，那说明他的身体出问题了。入出息天生就是明确的、稳定的、清晰的，除非你严重感冒时会含混不清。"],[20,616,684,1,"4、所缘有强大的吸引力。禅修的过程——成就入出息念，就是让明确、清晰的入出息变得有强大的吸引力。为什么说入出息本来就是明确、稳定、清晰的呢？很多人禅修时找不到入出息或入出息的位置不清楚、不清晰，都是因为不自然造成的、不放松造成的、不如实造成的。长时间以来，但凡 12 岁以下的孩子，教他入出息念时，就没有哪个孩子报告说：“我找不到入出息，搞不清楚”。搞不清楚的往往都是大人。为什么会有这个问题呢？就是因为他想太多了。"],[20,684,745,1,"“哦，这是佛陀修的法门，非常殊胜啊，它应该很了不起啊。”一专注就想要有个特别的仪式感、特别的感受要出来。一旦有期待，呼吸就找不着。它你对呼吸有一个宗教式的期待，呼吸就有问题。如同未经训练的心本来就是一盆浑水，你还不断去搅动它。呼吸本来就是明确、清晰、稳定的，你只要如实、自然、轻松地觉知它，它就是明确、稳定、清晰的。剩下就是怎么让它有强大的吸引力，后面再细讲。定的特相不再细说。二、前行准备（一）五种适合禅修的条件青春、健康、衣食易得、国泰民安、僧团和合。很多人说：“我现在六、七十岁了，没有青春了。"],[20,744,839,1,"”帕奥西亚多讲：“你只要有呼吸就有青春”（二）检查心理状态在禅修之前要检查你的心理状态：1、有没有心理疾病；2、有没有性格缺陷；3、是不是曾经受过很大的创伤——身心的创伤；4、是不是经历过很多的生活磨难；5、必须清楚禅修的目的是什么？前几种不细讲——心理疾病你自己知道；性格缺陷就是很古怪，你可以自己观察；有没有经历创伤、生活有没有磨难，每个人都不同。如果有这些，都可能在禅修过程中给你带来困扰。如果有心理疾病要治疗；有性格缺陷你要搞清楚哪方面的性格缺陷；曾经的创伤和生活的苦难会给我们留下一些不良的想蕴标记，要通过梳理和如理作意把一些会影响禅修或可能给禅修带来障碍的认知行为模式调整过来。禅修的目的很重要。很多人禅修的目的是为了证禅那，说“我禅修的目的就是为了证禅那”"],[20,839,929,1,"。难道是其他的吗？对于一个佛教徒来讲，禅修的目的是为了断除烦恼，你要搞清楚。如果你禅修的目的是为了获得初禅、二禅、三禅、四禅， 获得观智，最后去抓一个什么果回来，你带着这种期待来禅修时， 和在世俗追求欲乐时抓取外在结果的行为模式是没有什么区别的。因此，当你这样来禅修时，如果今天禅修有进步就觉得很欢喜；禅修没进步就很沮丧。其实你都没有观察到，禅修很好时你很欢喜，贪心生起来、傲慢生起来，那都是烦恼；而禅修不好时，你很沮丧、很自责、很打击自己，都是瞋心，又都是烦恼。本来应该禅修消除烦恼，结果却搞出一堆新烦恼来。所以禅修的目的是要先看到自己的烦恼，去对治我们的烦恼，最后能彻底地断除烦恼，一定要把这个（目标）树立起来。有些人可能泛泛而听，认为：“我本来就是这样啊。"],[20,929,996,1,"”但是你的心是不是真的这样？体现在哪里呢？——就是你在禅修时，有没有得失感？如果有，你的禅修目的就要重新考量，不然在禅修过程中一定会有各种各样的问题，折腾个没完。（三）检查三种性行建议大家检查自己的性行。根据《清净道论》有六种性行：贪行者、瞋行者、痴行者；信行者、觉行者、寻行者。信行者、觉行者和寻行者先不讲， 贪行者、 瞋行者、痴行者， 自己对一对属于哪一类型？《清净道论》 中讲到： 在经典里佛陀并没有很明确地对性行做出开示。佛陀有根上下智、有情意乐随眠智、一切知智、……"],[20,996,1092,1,"。根上下智、有情意乐随眠智就是看你的性行、看你的根性、看你的巴拉密。根上下智、有情意乐随眠智和一切知智是佛陀不共的智慧，弟子们本身没有这个能力。列出这个性行表只是给大家做参考，我觉得是蛮有道理的。（四）性行者的区别性行表怎么看呢？前面的性行区别、性行之因先不看，先看行、立、卧、工作、饮食、见解的区别。1.观察行。比如贪性行者，走路时用自然、优美的走法，徐徐的放脚，平正的踏下，平正的举起。贪性行者走路很自然、很自在；瞋性行者的特点：足尖像掘地而行，他的足急促地踏下，急促地举起，而他的足迹是尾长的。尾长是什么意思呢？就是他的脚会往前歘。比如我，袜子永远是脚尖先破，就是典型的瞋性行者；痴性行者，以混乱的步伐走，他的足像惊愕者的踏下，亦像惊愕者的举起，而他的足迹是急速压下的，比较混乱。"],[20,1091,1165,1,"2.观察站立。站立，贪性行者是优美的姿态，令人喜悦；瞋性行者是顽固的姿态（站没站相、喜欢依靠）；痴性行者是混乱的姿态。后面的内容不一一再讲，大家可以去对着看。3.观察工作。比如工作，贪行者不急不缓，比如扫地不会打散地上的灰尘，搞得满地都是；瞋行者很紧张地取扫把，两边急促地溅起砂砾，以粗拙的声音不清洁不平坦地扫。如果让他去菜地里拔杂草，可能连菜一起拔了。瞋行者很着急，做工作很紧张，容易自己制造压力。"],[20,1161,1296,1,"4.观察饮食。从饮食上，贪行者喜欢肥甘、美食，吃的时候不急不慢；瞋行者喜欢粗酸的食物，吃饭的时候塞得满口作团食。他不细尝滋味而紧急地吃，若不得美食就会生气。5.观察见解。见解上，贪行者看到细小的喜悦事物，也会产生惊喜而久视不息，纵有小德亦生执著，但实有大过亦不计较。通常说某人“没心没肺”就是这种。贪行者很会随喜，他一看到人家有小小的好的事，他就“哎哟！这个真好！”然后久视不息，在平常都能观察到有这样表现的人。人家有很小的德行，他也觉得很好；人家有大的过失，他也不计较，这是贪行者。瞋行者，“细小不如意事亦如倦者而不久；纵见小过亦生瞋恼，而实有德亦不计较。”今天有人给我报告说：“还好做心念日记，其实这一个多礼拜以来还是有不少善心生起来的，但是记下来的都是不好的事儿。”——典型的瞋性行者。在离去时毫无顾恋，不会有什么牵挂，好像觉得他很自在一样。痴性行者没有主见、智力取捨能力比较差，总是随人：听别人呵责他人，他也跟着呵责；听别人赞叹，他也跟着赞叹。这是痴行者的特点。其他细节的内容大家自己去看。"],[20,1296,1442,0,"为什么我们在这里谈性行呢？因为性行会对于你的禅修产生很大的影响。总体来说， 以我的观察， 对于初学者，会直接用两种方法：一种方法，比如来参加禅修营，可以有10天、20天或更长时间在一起，新来的禅修者，就直接教帕奥西亚多的方法。帕奥西亚多指导的“在鼻中隔这个位置上的气息”。在鼻中隔这个位置上，能不能在那边觉知入出息。如果你能在那边觉知入出息，很自然、很如实，没有压力，很轻松就能取到，此人基本上大概率是偏贪性行者。如果有人在觉知放在这个位置上的入出息时，产生各种各样的痛苦：一会觉得鼻子很涨了，一会觉得眼睛很难受了，一会觉得呼吸找不到了，胸闷了、控制了，各种问题都会来，这样的人一般大概率是瞋性行者。也有人说：“Bhante，我找不到鼻孔在哪里，鼻中隔在哪里。”教了他还是找不到，呼吸他也找不到，要花很长时间跟他一点一点地掰，才能掰清楚的人，大概率就是痴性行者。这是我的观察，不一定对。但是在引导的过程中，发现还是蛮有效的。在明白了大概情况后，对于贪性行者就指导他 “好！继续， 在鼻中隔这边，持续地觉知呼吸，尽可能地知道呼吸的细节。”"],[20,1442,1569,0,"因为贪性行者得少亦乐，觉得有点舒服就“哇，很舒服！”，很容易放逸。这样的人得逼他：“你得专注！一个小时、两个小时、三个小时。”给严格要求，他很自然地就能够进步。如果是瞋性行者，要指导：“随便！你不一定要在鼻中隔里找呼吸。先放松，从头部开始，一直放松到脚趾头。从头发开始，感恩、祝福、忏悔、道歉、放松、散播慈爱，每一块每一块，放松到脚底，随着每一个呼吸，全身都放松。完全都放松了，将你的心回到心脏那个位置，跟心说：‘现在要去知道呼吸，你说在哪？’让心给出一个答案。心觉得在哪儿，你就在那个地方知道入出息。”这么长时间来，我发现有很多种，有些人可以在喉咙上，有些人可以在脑壳里，有些人愿意在眉间、在印堂那个地方，有些人愿意在肚脐，有些人愿意在脚底涌泉穴。我采取的方法就是：“可以！你可以这样做，你就在那个地方觉知入出息吧！”。如果你告诉他： “不行！你必须在某某地方、固定位置、如何地觉知入出息。”他就会去分析、评价、判断、不满意、控制、追求、折腾。但只要这一关过了，就能够真的如实、自然、轻松地取到入出息所缘。"],[20,1569,1716,1,"随着定力提升，最后他会会很自然地、如实地、没有障碍地在鼻中隔里取到入出息。这个阶段基本要到这位禅修者可以觉知全息的时候，他回到这里来就安全了，那时候他不会再折腾。即使折腾，也不再折腾入出息所缘而是折腾其他的。对自己性行的了解是重要的。贪性行者就必须对自己“狠”点：能坐两小时，就对自己讲要坐三小时；瞋性行者就对自己“好”点：能坐多久就坐多久，坐一个小时脚有点痛，50 分钟就起来；感觉有点舒服了，下座，去逛逛，没关系。有人会问:“到底是贪性行者比较好，还是瞋性行者比较好，还是痴性行者比较好？”没有哪个比较好，只有一开始时你能不能够把自己把握好。如果是贪性行者，你把握得好，前面修就会自然一点；如果是瞋性行者，开始会折腾一下，把握得好，也会自然，随便放一个地方觉知都可以了，放松就行。瞋性行者，偏好分析、评价、判断，他的慧根相对比较强，比较会折腾，但当他认清楚时，进步就很快；痴性行者也一样，搞明白入出息（包括位置）得花一些时间， 你要有足够的耐心陪伴他。当他过了这关以后，痴性行者可以笨鸟先飞。因为痴性行者找目标比较困难，没有其他目标，比较踏实，他不会想很多花招。"],[20,1714,1780,1,"不像贪性行者会放逸，也不像瞋性行者整天折腾。他搞明白了就老老实实地做，最后，可能痴性行者成功得比较快。不要因为你是痴性行者就觉得：“哎呀！我是痴性行者，没有用啊！”不会的，很有用，你会少折腾。以上简单说一下不同性行在禅修上的不同表现，各自去鉴别。当然，最终要和你的老师沟通，老师是什么样的风格就按老师的指导。（五）检查当下五盖的状态《清净道论》中说：“专注所缘故，或烧毁敌对法故为禅那。要证得禅那，须烧毁敌对法。"],[20,1780,1908,1,"佛陀说：“离诸不善法，离生喜乐。”离什么呢？离五盖。什么是不善法呢？五盖就是不善法。五盖指哪些呢？欲贪、瞋恚、昏沉睡眠、掉举追悔和怀疑。很多人以为 ，他坐在那儿觉知呼吸，觉知着觉知着五盖就突然没了。有没有这样的人呢？有，很少。那样的人，其实不是老师教出来的，天生就会。老师讲说“觉知入出息”，他就会觉知；随着时间的延长，他的定力慢慢就起来，五盖没有出来，最后就证得禅那。这不是老师教出来的，只要有这样的因缘，这一生遇到正法就能修。然而大部分人都是被五盖盖住的，凡是在禅修营一觉知入出息，没有那么顺畅，没有光芒灿烂，不是总被光照着，这样的人都是有五盖的。很多人不去检查五盖，而是把它归结为“我是不是不够巴拉密啊？我是不是二因结生啊？”这是不正确的想法。帕奥西亚多说每个人都有足够的巴拉密。因为无始轮回中，在每一次的劫末，大家都上升到梵天去做梵天人，都精进地禅修过。在梵天待了那么长时间修止禅，你怎么会没有巴拉密呢？你能够到禅林来，接触帕奥体系，系统地学习《阿毗达摩》，想二因都很难，否则都来不了、也搞不明白，还有必要想是不是二因结生么？"],[20,1908,1986,1,"然而，五盖一定是大部分人都有的。即使在修止禅时五盖没有呈现出来，也并非是你就没有五盖，在观禅时照样出来困扰你。谁没有欲贪、谁没有瞋恚？没有欲贪、不会生气是三果圣者。只要还有五盖，最终它会在止禅、观禅时给你找麻烦。所以要在当下就能观察。如何观察呢？你修止禅时有没有期待？有期待就是欲贪；有没有不满意、计较、分析、评价、判断、各种恼火的事、各种自责？有，即是瞋恚盖；昏沉睡眠大家都熟悉；掉举追悔，妄念就是掉举，各种追悔；怀疑。对于自己五盖的观察，不是观察“我是有点贪啊，我喜欢吃肥肉。"],[20,1986,2112,1,"”诸如此类的，这些不影响你禅修。欲贪、瞋恚、昏沉睡眠、掉举追悔、疑，之所以会成为盖，用佛法语言来讲，就是寻的力量，贪寻、瞋寻、害寻，是一股一股的力量。它不断地影响着心的专注，你总是被拉走、总是被困扰、总是被打扰，这就成为“盖”，盖住你修习善法、成就禅那的路。五盖，表现为一股一股习惯性的力量，你要去观察它。比如你总是不能专注，就问心：“为什么不能专注？”此时心的力量是可以被观察到的；散乱、掉举什么？掉举的目标是什么？妄念的目标是什么？是让你很讨厌的目标还是让你想抓取的目标？很讨厌的目标是瞋恚盖，想抓取的目标是欲贪盖。总是不能停下怀疑，怀疑什么？《清净道论》解释：疑是对“八事”的怀疑：怀疑导师（佛）、法、僧三宝，怀疑戒定慧三学，怀疑有没有过去世、有没有未来世、有没有过去未来世，怀疑缘起因果法则。有人会说： “没有啊，我都信啊！”是， 一般人对佛法僧不怀疑，但对戒定慧三学很容易怀疑，对缘起法也容易怀疑。"],[20,2112,2211,1,"对三学怀疑什么呢？怀疑禅修方法：“这个禅修方法是不是适合我？我现在是不是要换一下业处？我是不是同时四个业处来回修？”就折腾；怀疑业处老师，对于老师教导的方法，他内心评判：“对吗？符合经教吗？符合经律吗？”；最麻烦的是他怀疑自己：“我不行；我搞错了。。这三种怀疑在禅修者中是最容易出现的。如果有，你怎么解决这个问题？如果你怀疑禅修方法，禅修方法你应该听老师的，如果你怀疑老师，那就一点办法都没有，你应该赶紧换一位老师。为什么怀疑自己？因为不自信。不自信基本有两类：一类，对自己有很高的期待，在禅修领域里他没有立即得到满足，就开始各种怀疑，怀疑自己；另一类，他在禅修的过程中碰到了一些问题没有办法得到处理，就开始怀疑。"],[20,2210,2281,1,"如何解决呢？第一，对于教理要有一些了解；第二，不要对自己的情况都不了解，只是看到自己禅修没有进步就各种怀疑，稀里糊涂的；第三，要找真正“懂行”的人请教，把自己的问题如实地剖析出来，解决掉疑盖。五盖不处理掉，禅修进步是很难的。当你的寻被找到了，就要去梳理，这是我特别强调的。从儿时记忆开始，无论你儿时日子过得特别好，还是有很多原生家庭的不良记忆，都会影响到你的禅修。如果你已感觉到受影响，就要去梳理它。"],[20,2281,2376,1,"（六）省察影响每天禅修的五个因素。禅修时要对自己的禅修状态很有明觉。不要总是抓禅修的结果：“我今天很轻松”、“我今天很糟糕”。为什么很轻松，你找过原因吗？为什么很糟糕，你找过原因吗？影响禅修有五个因素：1、业（包括巴拉密），巴拉密是一种清净的业。2、色身的状态——四大是否平衡，即身体是否健康。3、情绪，你有没有不良情绪？4、饮食。5、环境。环境包括气候——是不是下雨、出太阳、刮大风、打雷？是不是很潮湿或是很干燥？是不是很吵闹等因素。建议写禅修日记，对于影响每天禅修状态的五个因素要观察， 就会知道如何随时调整自己的状态。"],[20,2376,2475,1,"（七）修习方法的选择1、符合佛陀的教导；2、依据完整的三藏教理及《清净道论》；3、有清晰的禅修次第；4、如实知见，即可以被真实地体证。比如对瞋性行者（初学者），我会允许他用各种方式来觉知入出息。但一旦他到了全息的阶段，一定让他回到鼻中隔。有人会质问：“你刚才不是讲在涌泉穴觉知呼吸吗？”三藏里没有这种方式，保证没有，纯粹是对于这类型人的一种前方便：他的瞋恚盖影响初学时的专注，要允许他在心完全没有压力、完全放松的状态下去觉知入出息，这样他才能真正走上来，这样做并不违背佛陀的教导。"],[20,2475,2570,1,"（八）师长的选择玛欣德尊者的《止观禅修次第》已说得很清楚，不再详细解释。（九）身心放松与学会用意门《大念处经》中说：“诸比库，在此，比库前往林野、前往树下，或前往空闲处，结跏趺坐，保持其身正直，置念于面前。”1、修学的环境、禅修的环境。要找一个没有干扰、没有噪音、很少障碍、不会被人干扰的地方。2、结跏趺坐，保持其身正直，置念于前。结跏趺坐，你可以双盘、单盘或散盘。能双盘的人先双盘，感觉痛了改单盘，再痛了改散盘，散盘也痛了就跪起来，跪起来再难受了就站起来。基本这样轮下来，初学者也能坐一个小时；稍微有点功夫的，两个小时三个小时没有问题。从双盘开始，双盘改单盘、单盘改散盘、散盘改跪禅、跪禅再改立禅，立禅不行再卧禅，总有办法对付它，但是，入出息不要丢了！你有正念地继续觉知入出息，就没有问题。"],[20,2570,2657,0,"建议大家坐禅时，根据自己的情况，臀部稍微垫一点。其身正直，一般我建议：你想像自己像一棵青松扎根于大地，臀部以下就像根系、身体就像树干、头就像树梢、双手就像树枝，它是自然生长的。也不一定要“虚领顶劲”，头顶上有根绳子一直把你拔上去 ，拔的时间长了就不舒服，很辛苦。一开始可以拔一下，拔完后放掉绳子，自然往下一松，不会塌下来就行。又像一块竖起来的老豆腐，自自然然地坐着就行，身体放松，不要绷直。不要有仪式感：“哦，身体正直，我就要含胸拔背、下颚微收。”不用，怎么舒服怎么来。但舒服不是让你趴着、躺着、窝着身体。"],[20,2657,2759,1,"身体要放松，从头到脚每一部分放松。不用对着它说：“你放松、你放松、你放松……”松不下来的。要感恩，一辈子用它这么长时间却从来没真正关怀过。先从头部开始感恩，道歉（一直用它却没好好照顾），忏悔，最后祝福：“愿你这个部位不会痛，舒服、轻松。”一点一点顺着放下，一直到脚趾头。随着每一个入出息都这样去感恩、道歉、忏悔、祝福，然后再放松。你的身体一定能得到放松。即使身体放得再松，但心不放松，很快又会紧崩起来。因为你会抓它，又习惯抻着。心的放松，可以对着心脏那里感恩，你总是无节制地使用心，各种各样的贪婪、瞋心、生气折腾着它，向它感恩、道歉、忏悔、祝福，给心散播慈爱、给自己散播慈爱。然后由己及他，向尊敬的人散播慈爱；中性的人散播慈爱；不喜欢的人散播慈爱；十方众生散播慈爱……"],[20,2759,2889,1,"，这样，心才会放松下来。要学会用意门！用心去觉知你的目标，什么是用意门呢？我说：“想像下你妈，你妈就在哪里呈现出来。你用那种方式去觉知入出息，就是用意门。”。于鼻孔处，因为入出息时，呼吸必然会碰到皮肤，一碰到就一定有触觉，有觉时身门心路即已生起，已经用身门了。但没关系，跟心说：“大部分情况用心知道呼吸即可。”用心知道呼吸就是意门。不会用心，就想一下你最心爱的人或者最心爱的东西，那就是意门 （心） 。你把那东西放在鼻孔那，就是在意门觉知那个位置；再把那个东西换成入出息，就是用心在位置上觉知入出息，很简单。但很多人说： “Bhante，我同时又有触觉怎么办？”有触觉就有触觉，呼吸碰触皮肤自然有触觉，没关系，触觉出现就让它出现，但你知道你的所缘是触觉上面的气息。一个心识刹那只有一个心生起，当你的心在入出息时，触觉就会被忽略，时间长了，触觉慢慢就没了。如果你以触觉为目标，就容易修出“四大”"],[20,2889,3041,1,"，那个地方就会紧张就会痛；也不要老用眼睛去看，人类习惯用眼睛去看、去观察目标，入出息也觉得应该用眼睛看。还有一些错误的说法：“眼观鼻、鼻观心”，眼睛闭上就是不让它起作用，还观什么？五根关闭（关闭作意不起作用） ，用心去知道、去觉知，即是学会用意门。（十）确定所缘所缘要明确、稳定、清晰、强有力。三岁小孩都懂，但大人（瞋性行者），对“到底什么是呼吸？”却有诸多问题。此时，应彻底地在究竟法层面上给他讲清楚，他就不再折腾、不再怀疑。这是针对瞋性行者的一种方法。但大部分人没这类问题，不用管的。呼吸是什么？呼吸是心生九法聚。声九法聚：纯八法聚加呼吸声（入出息） 。常看到书上说： “取概念法为所缘。”很多人就疑惑了，到底什么是概念？《阿毗达摩概要精解》里解释概念有两种：「意义概念」与「名字概念」。前者是通过概念所表达的意义；后者是表达该意义的名字或名称。例如：识知具有某种体形与性格、遍体生毛、具有四只脚的家畜是「狗」这个词的「意义概念」；「狗」这名称则是 「名字概念」。意义概念是「所知概念」；名字概念是「令知概念」 。"],[20,3041,3151,1,"显然呼吸是意义概念，被称为呼吸的“呼吸”两个字是名字概念。如何理解入出息是概念呢？由心生九法聚形成的气息，在你两个鼻孔附近的那个位置上进出，它有时粗、有时细，有时碰触皮肤比较明显、有时碰触皮肤不明显，有时比较长、有时比较短，这就是入出息。你能知道这些都是呼吸的状态，就是知道呼吸的概念，或者说那个地方的气息就是呼吸的概念。知道那边有气息就是知道了呼吸的概念，包括它会碰到皮肤都是呼吸的概念。但你不是取碰触皮肤的那个触觉，而是取触觉上的气息。它有时长、有时短、有时细、有时粗、有时明显、有时不明显，那个气息是怎样就怎样，即取到了入出息的概念。当佛陀教授入出息念时，佛陀讲了三个方面："],[20,3150,3285,1,"1、有利于练习入出息念的处所。如前所说： “比库于空闲处”，此“空闲处”即是有利于修习入出息的处所。2、当练习入出息念时身体的姿势。3、练习入出息念的四个方式：数息、长息、短息、全息、微息。此三方面中，处所指适合禅修的地方；身体的姿势是便于我们能够长时间地禅修；而练习入出息的四个方式，我们要明白其作用是什么。很多人以为入出息、长短息、全息、微息可以交替地使用、来回地使用。当然，来回地用也没问题，但实际上，它真正表达的是随着觉知入出息，你的定力将不断提升，为了对治妄念、昏沉、掉举，而用数息、长息、短息的标记，全息、微息的方式来解决。最初觉知入出息时，基本上两三个呼吸心就跑掉了，此时，并不能很完整地觉知入出息的状态，只是知道明显的部分。那时的入出息对你的心也还没有强大的吸引力， 只是因为你现在学了一个据说可以证禅那的新方法，内心描绘出可以获得快乐的方向，为此你开始觉知入出息。但是心不听话，它专注一会儿后觉得没有马上体现快乐，就想跑。这时候，你再给它安立一个事，说：“你现在数息”。数息是为了对治妄念。"],[20,3285,3409,1,"虽然数息这种方法较粗糙，但却可以通过重复的、可觉知的、正念的方式去平息那些更杂乱无章的妄念。当你数了一段时间心平静下来后，会觉得数息很粗糙，不想再数，这时候，你可以对呼吸的进出标记记为长或短，进的是长或者出的是短。其实本身无所谓它长短，只是去标记：“哦，这个长、这个短。”用长短的标记去替代一二三四五六七的数息。当你的定力再提升到一定程度，标记长短也令你觉得很烦、很粗糙了，这时候，一般情况是你的全息比较清晰了，就可以改为觉知全息。很多人刚开始学就觉知全息，往往搞得胸闷、难受。为什么呢？望文解义，《清净道论》说：呼吸的开头一直到呼吸的结尾，都要知道。他就去追：“哦，开始了开始了……；哦，结束了结束了……。自然而然就去控制呼吸了，控制没多久就胸闷了，那不是全息。全息是你的心自然而然地知道呼吸在那个位置上开始了，慢慢地结束了 ，你全然地知道呼吸整体的状态，那才是到全息了。如果全息时，你能觉知全息，但是妄念又出来了，怎么办呢？你可以跟心商量：“诶，现在全息状态还有妄念， 让我们更多地知道全息里的细节。"],[20,3409,3485,1,"”这时候，把你的精进力、择法觉支等都提上来，当你更全面、更多地知道呼吸的状态时， 喜也会生起来， 这是全息的状态。而全息到微息就很近了，所以帕奥西亚多要求：在微息的阶段，要知道微息的全息、微息的长短息。觉知微息的全息、微息的长短息有何用呢？因为在微息的状态下你依然会打妄想，但在那个情况下如果用数息，数一二三四，那几个数字都比微息长很多，你不可能去数它也不可能去标它长短，因为它很微细，没办法标长短。所以在微息的状态时，尽可能地知道微息的整体状态：这个偏长一点、这个偏短一点，知道更多气息的内容，更清晰地知道。真正的微息阶段，可以维持两个小时、三个小时没有妄念。以前碰到有位西亚蕾向帕奥西亚多报告说："],[20,3485,3535,1,"“报告西亚多，我现在微息了。”帕奥西亚多很高兴，她又说：“但是，我有问题。这个微息，我一会有微息、一会不是微息。”帕奥西亚多拿起纸盒准备扔她，她就很害怕不敢再问了，满脸通红赶紧走。第二天我去问帕奥西亚多，我说：“微息是不是定力提升到某个阶段的一种状态；其实真正到微息了，是长时间的在这个状态里。”帕奥西亚多频频点头。微息是定力到达平稳状态的呼吸表现，而不是感觉不太找得到呼吸了。那是你在打妄想、心粗糙得不行，还报告老师："],[20,3535,3604,0,"“老师，我现在是微息。”那不是微息，那是你的心太粗糙感觉不到呼吸，要懂得区分。这几个要点在帕奥西亚多的《正念之道》里，以及迦纳咖西亚多在讲解帕奥西亚多禅法入出息念部分时，专门讲到。1、固定正念的地方。“因为如果他的心与入息共入于内部，则（心于内部）将成为被息所击或如充满脂肪相似；如果他的心与出息共同出外，则心将散乱于外面的种种所缘。只于（息的）所触之处（即鼻孔）而置念修习者，而得（安般念业处的）修习成就。”《清净道论》第280 页。"],[20,3604,3702,1,"很多人总是去抓触点。《清净道论》 说得很清楚：“息所触之处”修习什么呢？修习这个“息”，不是去修习那个“触”。你要有固定的位置。这个位置怎么固定后面再讲。2、达到定和入定。这是三相的问题。“相、入息、出息不是一个心的所缘。不知这三个法处的，不能修至（定）。相、入息、出息不是一个心的所缘。知道这三个法处的，可以修至（定）。”依止于入出息而升起的相，称为即等同于入出息。什么是相呢？相就是在鼻中隔那个位置上 （那个触点上）的气息，在这触点上你知道了息以及息入出的动态。心里很自然地知道在这个点上有入出息经过，那个位置上的气息就是相。你于此位置上知道入息、知道出息、知道入出息，就是不同的心在知道不同的三个相、三个所缘。"],[20,3702,3840,0,"3、第一个要点“固定正念的地方”里，在觉知呼吸的同时你也知道接触部位（即在前面固定正念的地方）。当这个相（位置）很清楚了，你心里也很自然的知道，眼睛一闭就去鼻中隔那个地方，你知道那个位置就是你觉知入出息的业处。当你很自然、很熟练的能够把握这个相时，帕奥西亚多说：“你试着将心的注意范围缩小到只集中于呼吸本身，如此做能使你的心愈来愈专注。”也就是说：当你的位置能固定下来时，心里很自然很熟练地知道这个位置时，不要总是去抓那个位置，不要总是去抓那个触觉，“到底是鼻孔里面一点还是外面一点啊，上面一点还是下面一点啊，在人中还是眼前啊……？”不要去整这个事，心只集中于呼吸本身就可以了。但是要考虑到一个状态，如何调平衡。在这里就很明显，如果你是一个比较散乱的人，我建议一开始就把心相对地固定在一个位置上， 即是对相的觉知多一点，停在那个地方。甚至：“你可以知道静止息，你可以专注静止的气息。”你的心知道那边有一团气息，一确定，你的心马上就平静，至少有几分钟能平静下来。平静下来之后，在相的这个地方你知道入息、知道出息，呼吸就出来。"],[20,3840,3934,1,"散乱的人先知道相、先知道静止息。如果你本身定力就很好，就直接知道入出、知道呼吸本身。在禅修过程中，如果你发现你的心比较散乱，就多专注静止息。如果你的心比较沉静、感觉有轻安，就更多地去知道呼吸本身以及动态。当更多地觉知动态时，你的心就会被激励、被策励。如果你本身比较散乱，多注意相，心就能平静下来。在《清净道论》大义注里，关于“相、入息、出息，非一心所缘”有很详细的说明，具体的不再一一说明，巴利语逐词解析也不再说明。《清净道论》大义注、复注中："],[20,3934,4067,0,"“基于入息和出息生起的相，等同于入息和出息。”如何理解这两句话呢？在初学时，入息、出息和相三个都是明显的，但随着呼吸越来越微细时，你会发现入息、出息和相越来越合在一起，最后有禅相。入禅时， 甚至忽略了呼吸的动态，心完全沉在相里，这个相等同于入息和出息。那时候，你是“一心知三相”了。因为相来自于固定点经过的入息和出息，如果禅修者了知“相”，即意味着他了知入息和出息。如果证得禅那，你的所缘是什么呢？很多人讲：“是似相啊”似相是什么呢？根据《清净道论》大疏钞，似相就是入息和出息。所以从你开始觉知入出息到最后证得初禅、二禅、三禅、四禅，自始自终你的所缘都是入息和出息。至于光，帕奥西亚多说：“光是入出息的颜色。”这很重要，因为很多人在禅修过程中去追逐那个光，以为光是目标，以为光代表他成功的程度。所以 2015 年以后，只要有人跟帕奥西亚多报告“我很多光，如何……"],[20,4067,4125,0,"”，帕奥西亚多就不让他说了，再说就骂。原因是什么呢？因为他方向搞错了，目标搞错了。入出息成就的不是你的光有多亮，而是你对入出息的觉知能不能持续、没有妄念。到最后入出息完全与相整合了，你的心总是不自觉地被滑进去、被吸引进去而入禅。刚开始帕奥西亚多还不允许这样入禅，当你一而再、再而三进去，融入这个相，一心知三相，以相、入息、出息三个整合在一起的相为所缘沉进去，能不能三个小时、四个小时、五个小时没有妄念来决定要不要让你查有分和查五禅支。所以只有能够了知这三个所缘才能够进步。"],[20,4125,4250,0,"如果一位禅修者可以念住相，他便可以了知这三个所缘，禅修就进步了。大义注里解释：“只要念住于相，入息和出息则已经包括在内，只有如此，禅修者才能在入出息修习上得到进步。”这在经藏复注里也得到了印证。有一段巴利，以后讨论时再来看。这一段话的意思，虽然入息、出息和相，三者非一心所缘，但是入息和相是可以同时觉知的，出息和相也是可以同时觉知的，大家要记住。在鼻中隔这个位置上，你知道在这个地方发生了入息，在这个地方发生了出息。什么是“入息和相可以同时觉知”呢？当你的心放在相上，知道入息，其实你的心同时知道相和入息。“出息和相也可以同时”，当你的心放在相上，知道出息，你是可以同时知道相和出息的。根据注疏，虽然你不能三者同时知道，但可以同时知道两个：相和入息或相和出息。这样去把握时，你就不会觉得呼吸飘来飘去……"],[20,4250,4349,0,"，因为它总有一个相，像锚一样把你锚在那个地方，你的心总是在那个点上知道入息、知道出息。所以你的心想安稳便很安稳、想知道动态也能被策励上来。注疏里解释得很清楚。帕奥西亚多在《亲知实见》中提到：所谓的相和出息、相和入息能同时知道，是在遍作相之前。遍作相和似相之前，你可以这样来练习。关于遍作相、取相和似相，需重新明确一下。根据帕奥西亚多的《智慧之光》和《亲知实见》，遍作相是指你的心已完全沉入禅相，刚开始沉入时，那个时候叫遍作相。也有一些老师说：“遍作相就是当你的心能在那个位置上取到入出息的所缘，那个位置上入出息的相就叫遍作相。”这就把遍作相提前了。"],[20,4349,4496,0,"当然，这只是名称的问题，没关系，但是你不要搞混掉。很多人在入出息那个位置上觉知入出息，有一点光了，光有一点稳定了，或者光和入出息融合一、二十分钟了，就觉得这是遍作相，然后把心投进去。虽然也能投进去，只是定力很难提升。有这样经验的人都懂：泡在光里打妄想。这是一种不恰当的专注方式，对相不了解。对于入出息的所缘以及它的位置，它的相、入息、出息三相，如何去了解、去把握；根据自己的性行如何开始学习，是今天课程的主要内容。"],[21,1,231,1,"174 讲-摄集-摄菩提分-身念处-入出息念 3古源尊者上一堂课学习了入出息念前行及其核心——相、入息、出息。今天继续学习入出息念的要点及须注意点。一、心的位置（一）置念于面前“诸比库，在此，比库前往林野，前往树下，或前往空闲处，结跏趺坐，保持其身正直，置念于面前。”关于Parimukhaṃ （面前）,一直有很多争议,“置念于面前”——佛陀没有说清楚“面前”是指什么地方，因此，即使在义注、复注中也有不同的角度，现代的解说就更多了。有人认为只要是在前面，任何地方都可以的；有人认为是在口鼻处。哪个正确呢？我认为适合你的就是正确的，不适合你的就很难往下修。当然，总体来讲有一基本原则，查巴利字典——Parimukhaṃ，pari 与mukha 是分开的，mukha 是面前、前面；pari翻译为面向或圆等。总体认为 Parimukhaṃ 是置念于面前，而面前具体哪个位置，有不少争议。"],[21,220,440,1,"玛欣德尊者从《分别论》、《义注》和《清净道论》中整理出对Parimukhaṃ 的解释：“此念住立、善住立于鼻头或口相，因此称为‘置念于面前’。”《分别[论]》Vbh.537“当知‘口相’为嘴唇上面的中间区域。”《义注》“只有将念放置在[鼻头]接触点的地方修习者，才能成就[入出息念的]修习。”“另外，该具足了念与慧的比库，不应在自然触处之外去寻求其出入息。”自然触处，即是你呼吸能接触到、能感觉到的地方。在自然触处之外寻求呼吸，非具足了念与慧的比库应做之事。另一角度，当念与慧尚未具足时，对于自然触处是否可放宽呢？不同老师有不同的引导方式，在修习前期对于不同的学生可以有一些不同的引导。帕奥西亚多在关于入出息念简短开示的视频中有指示，对此，在眉缪禅林跟着学习的人有很多都得到很大的利益，但也有不少人感到困惑。为什么呢？据我观察，是因为性行不同、觉知习惯不同。如果是贪性行者，严格依据帕奥西亚多的要求做，将获得巨大的利益，能很快获得定力；如果是瞋性行者或见行者（喜欢分析、评价、判断、控制、抓取的人），若一开始就照这么做，成功率就比较低。"],[21,440,604,0,"关于这个位置，帕奥西亚多说在鼻中隔中间有一条线，对于瞋性行者（一个喜欢分析的人），他会使劲去找那条线，找不着时，他就会为了抓一条线出来而各种折腾，这对他来讲就是个悲剧。如果你是贪性行者，建议你严格按照帕奥西亚多的要求，在鼻中隔中间的这个位置上找到触点， 以触点为工具找到入出息，以那个（入出息）为所缘，觉知入出息的动作，将会很好地培养你的定力。如果你是瞋性行者，一般建议不必太在意那个位置，比如：在鼻孔的哪个位置、鼻中隔的哪一条线，或者一定要在很具体的点上。因为瞋性行者比较容易紧张，所以一般建议瞋性行者一定要先放松：从头到脚一一地放松，给身心散播慈爱；完以后让呼吸自然呈现于某处，或者你能大概地在某处觉知到呼吸，就在那里觉知呼吸。或者放松完以后甚至可以把身体放空掉，没有前面、后面、左边、右边、左鼻孔、右鼻孔的概念，感觉身体没有了，但是呼吸会出来，呼吸在哪个地方出来，你就在哪个地方去知道那个呼吸。慢慢的，当你很放松地觉知入出息、呼吸平静下来时，自然而然就会找到微息比较明显的地方，甚至于很多贤友就能很自然地回到鼻中隔的位置上。"],[21,604,750,1,"对于大部分的禅修者，我建议：当你可以很轻松自如地把握入出息所缘时，回到帕奥西亚多建议的位置上，将会对你有比较大的好处。什么时候可以这么做呢？对于瞋性行者来讲，当你可以非常如实、自然、轻松地驾驭入出息所缘时，让它自然回到这里（鼻中隔），不要对它提要求。（二） 用意门获取所缘常听说要“用意门取所缘”、要“取入出息的概念”，这让有些人很困扰的。我发现，凡是七、八岁，乃至十一、二岁以下的孩子，你告诉他说:“你觉知呼吸”，不管是贪性行者还是瞋性行者，都不会有问题。告诉他们在鼻中隔里，他们就很容易在里面取到，但是只要长大了就不行。对于怎样获取目标的理解，显然，世间盛行的获取目标的方式很有问题。小孩都可以，为什么长大了就不行？说明随着长大，我们不断地被染污。同样是瞋性行者，长大了就不行。也就是说，对于瞋性行者，在世间的做事方式——获得成功、成果的方式——是有问题的。这些问题其实就是烦恼。"],[21,750,872,1,"有位尊者说：“修入出息念，感觉就像完成一项功课、一项技能，似乎跟佛法没有什么关系。”。如果把入出息就当作一项技能来训练，它确实像在世间做一件事、培养一种能力、完成一项工作一样，跟佛法没有关系。修入出息念的目的是什么？成就止观的目的又是什么？成就止观的目的是要断除烦恼，不能如实、自然、轻松、快乐、持续、稳定地觉知入出息，就是因为我们有烦恼。这个烦恼是怎么形成的？为什么七、八岁的孩子不会有这个问题，长大了就会有这个问题呢？是因为成长把烦恼引发出来，而且不断地把它增长广大。这样的习惯就是我们在修行过程中必须要面对的、必须要清理的。如果不能正视这个问题，而只是说“我要成就禅那、我要成就止观！”，就真的与在世间完成某项事务没区别，与佛法没有关系了。"],[21,849,954,1,"本来入出息很简单、不复杂，但很多禅修者在看了很多经论、很多老师写的著作后，自己互相比较，做判断，判断得对不对就很难讲，有的老师有时间可能可以多请教，有的老师没时间，禅修者就自己想当然了。二、确定所缘（一）触木的锯齿关于置念于面前，《清净道论》中解释：“入出息的近结相（鼻头和上唇区域）如倒在平地的树木，入出息如锯齿，而比库将念置于鼻头或口相而坐着，不于来去的入息出息而作意，但不是不知来与去的入出息，也了知精勤及完成努力，成就殊胜。"],[21,954,1120,1,"即譬如置念于触木的锯齿，不于来去的锯齿而作意，但不是不知来去的锯齿，也了知精勤及完成努力，成就殊胜。”如何理解呢？上图中，锯子在木头上来回地锯，我们的注意力既不是放在木头上，也不是放在锯子上，是放在接触木头的锯齿上。譬如木头是我们的鼻孔，锯齿接触木头的地方就是入出息碰触皮肤的触点。我们作意的地方并不是木头（即非触点），而是接触木头的锯齿，意即不是取触点，而是取经过触点上的气息，这必须很清楚。老师总是说“触点”，很多人就错误地抓住了触点。在《清净道论》里“触点”是工具格，把触点当成一个工具，让你知道呼吸会在这里经过，是透由触点知道呼吸，但不以触点作为你的目标，而是触点上面的气息。"],[21,1096,1317,1,"（二）相、入息、出息关于相、入息、出息。入息、出息大家很容易理解，就是有入出息。“相”究竟是什么呢？当有取相乃至于似相时，就很容易了。但还没有取相、似相时，我怎么知道我的“相”呢？沙利子尊者说：相、入息、出息，非一心所缘，不知三法者，修习无所得；相、入息、出息，非一心所缘，知此三法者，修习有所得。修习入出息一开始就要分清相、入息、出息，修习才会“有所得”。“相”是什么呢？“入出息的概念”怎么理解呢？为什么小孩子不用讲这么复杂他就会？相、入息、出息。什么是相？气息就是相，有入息、出息的地方就有相。回看上图，锯子没有动时，触木的锯齿是静止的；锯子动起来时，锯齿是活动的，也就是说始终都有锯齿在触木，如同没有离开过（即触点上自始自终都有气息经过，如同气息未曾离开）。即使你觉得呼吸变得很微弱了，那只是你的心不能非常敏锐地觉知它、还不能到全息而已。有位尊者说：“当出息在这个点上没有时，它只是无限接近于零而已，并不是没有，只是变得微弱，其实一直都有。”当出息快没有时，入息又开始了。所以在这个位置上自始自终都有真实的息存在，你的心只要知道在这个地方息始终存在，而且时不时在发生着入息、出息。"],[21,1317,1400,0,"在发生入息、出息的这个位置上，就有气息的相。这个位置，对于贪性行者来讲，就是鼻中隔里面那条线外面的空间位置，气息经过的地方；对于瞋性行者来讲，就是你的心愿意轻松、如实、自然地觉知入出息发生的地方，不一定在一个固定的位置，只要是你心不紧张的位置就行，那个位置就有你气息的相。很多人又有疑惑：相是不是“触点”呢？不能讲是触点，而是触点上的气息。你的心要很清楚地知道：在这个点上，自始自终都有息存在。明显时，可以知道它入息，也可以知道它出息；不明显时，知道这边始终都充满了气息。当你的心对这个地方有这样一个标记时，心里就有一个“相”。"],[21,1394,1543,1,"“相”的价值在哪里呢？相最后会变成似相，当你入禅时会沉入似相，是相最后成就一境性的。入息和出息的价值在哪里呢？比如取白遍的遍相来修白遍禅那时，先取到一个相，然后专注这个相，努力培养定力，最后成就白遍。很多人，如果没有经过入出息的训练就直接修白遍，而过去生又没有修过、不是很熟练，那么修白遍是很难成功的。为什么呢？因为白遍取相是很枯燥、很单调的一团白东西，随着时间延长，它慢慢就暗掉了、散掉了，开始打妄想。这时唯一可以做的就是作意“白… 白… 白…”。有人会问“Bhante，它就是黑的啊。”，它是黑的怎么办呢？有的老师会说：“不管它，继续作意它是白… 白… 白…，只要它白起来就好。”，所以很难。但入出息不同，入出息有入有出，有那个位置。有入息可以觉知、有出息可以觉知，入出息还有很多的变化，你的心可以不断地去跟随它，心有很多事可以做。所以它不但成就定力，还成就念，还成就慧。所以入出息为什么殊胜呢？因为它有相、入息、出息。相最后成就一境性，而入息、出息成就念和慧，所以它殊胜。"],[21,1543,1613,0,"对于刚开始学习的人，不用太在意这个“相”应该怎么样，要长得怎么样。它没“样”，它是你心里对它的认知，这就是概念：这个地方在发生着呼吸，在发生着入息、出息，这个地方有息。有禅修者问：“Bhante，那不就是位置吗？”它跟位置不一样，这个位置上的息才是相。如果是位置，纯粹就是个位置，其他什么也没有，但是这个位置上有息，它就是相。（三）成就入出息念的关键帕奥西亚多讲：“开始时，心只是自然轻松地取到入出息的位置，在觉知呼吸的同时你也知道接触的部位。”"],[21,1612,1696,1,"这是第一个阶段。很多人听到“不能取触点为所缘，而要取触点上的气息为所缘。”时，他报告说：“Bhante，我还是有触啊，怎么办？我越不想取那个触，触就越明显。”，当然有触，本来就有触。不取它为目标不等于要排斥触。帕奥西亚多讲在觉知呼吸的同时你也知道接触的部位，或者说当你知道接触的部位时主要是觉知呼吸，当你知道那个位置上有触时，要更多地知道那个触点上的气息，这是翻译上的差异。第二个阶段，“当呼吸平静稳定，妄念减少后心平静了，应试着将心的注意范围缩小到只集中于呼吸本身，如此做能使你的心愈来愈专注。”也就是说，当你的心平静下来时，对这个位置的触点不必太在意，而只在意这个点上气息的进出。"],[21,1696,1774,0,"入出息其实就是一个事——相、入息、出息，把这三个搞清楚了就没有问题。当你妄念比较多时，可以让心多一点觉知这个位置上的相，作意这个地方充满气息，一境性就比较强；当你平静、沉静下来或者心要变得沉滞了，就多一点觉知入出息的动态，你的心就会活跃起来。相、入息、出息的把握与平衡是成就入出息念的关键。（四）两种取所缘的方法对于常遇到的这些问题，我建议两种取所缘的方法：1、开始于触点上的气息；2、开始于觉知静态的概念息。"],[21,1774,1869,0,"1、大部分人可以用开始于触点上的气息，有以下几个原则：⑴ 专注在触点上的呼吸而不是触点上的触觉。⑵ 只需要谈谈的自然的知道。你越自然，进步就越快；越想控制它、希望它变得更好，可能有那么几分钟会被你抓到一下，但是一旦形成控制、抓取的不良习惯，以后就要花很多倍的时间去处理这个不良习惯，只会越来越麻烦。⑶ 没有渴望、没有期待、没有执取。⑷ 上座和下座的准备。瞋性行者上座前应做的准备：从头到脚散播慈爱，下座时也建议散播一下慈爱。有些人突然起身，会觉得身心不适，所以对于还不熟悉的人可以有一些下座的准备。⑸ 不要为了禅修而制造痛苦。禅修本来是为了获得快乐，如果禅修过程中产生各种各样的焦虑、难受、压制——“我一定要坐多长时间！我一定要把心摁住！”"],[21,1869,1991,1,"——这是制造痛苦，不是带来快乐。总体来说，瞋性行者要对自己好一点，找到好感觉、趁其还未消失之前赶紧下座，留下美好记忆；贪性行者，就得给自己制定计划：今天两个小时，明天就两个小时十分钟，一点点往上加，不然就会放逸。这是不同的。⑹ 专注在自然的呼吸上而不要控制呼吸。⑺ 知道那个位置上的气息有进出的状态。⑻ 专注之道：从「想」（标记那个地方有入出息）到似相。近结相-概念-相-遍作相-取相-似相。大家记住：无论什么相，背后都是这个息，万变不离其宗。不管它怎么变，知道都是息，就不容易错。⑼ 不要在意呼吸位置漂移了。在禅修过程中，很多人感觉呼吸位置变掉了，不要在意呼吸位置的漂移。为什么呢？因为随着禅修定力慢慢提升，心越来越平稳时，禅修者对时空会产生错觉：觉得好像位置漂了，其实根本没有，是心产生错觉了。所以那个时候，一种方式就是不管它，任其漂移，只要呼吸在发生着就不会有问题；第二种方式是作意：“还是在鼻孔那个地方”，再一觉知，马上会发现就是在鼻孔那个地方。"],[21,1987,2063,1,"⑽ 关于妄念（粗、细）。要分清粗的和细的。粗的妄念就是会把你的心带走的念头，这样的妄念就需要清理。上座之前，那些会固定冒出来的妄念先决意放下、不要让它进来。如果它还是冒出来，就决意给它擦除、清零、打包扔掉，这是有用的。在决意擦除、清零、打包扔掉时，要回到心里面来，嘴上说说或者脑子里想想是没有用的。细的妄念就好像飘一下、 飘一下，或者像有些人说的 “坐在雾霾里面，后面一堆的像雾霾一样的妄念，一不小心就进来一个，但平时就觉得花花的。”，这就没有特别的方法，只有在日常生活中更多地培养正念正知，增强正念。"],[21,2063,2218,0,"⑾ 疼痛与酸麻，不要在意它。对于瞋性行者，如果已经痛得没办法了，觉得忍不住了，那么该换腿就换腿，该换姿势就换姿势。对于贪性行者，就忍一忍，贪性行者福报比较好，不会太痛，忍一下就过去了。⑿ 有两个词要分清楚：1、决意不是强迫。很多人用错决意，觉得一定要把自己摁住。决意是与自己的心商量，达成一个共识:这个事情我们要这么做。心有足够力量就撑得下去，如果心没有足够力量，说明这个决意无效;2、Kanti 不是强忍。Kanti 是忍耐，但不是咬牙切齿地忍。Kanti 是指知道现在的状态，接受这个状态，但是你的心导向善法。也就是：当你腿痛时，“我知道现在腿痛，我现在继续觉知入出息，我不用理睬你。”。对于贪性行者，如果坚持要练腿，在觉得痛已经很强时，可以观察痛，观察痛的四大或痛的感受。只要你的觉知够绵密，最后就会发现那个痛跟你无关，这是可以做到的，要持续练习。我建议每个人都要有一次这样的体验——觉得那个痛不是你的，那个痛在离你远去，甚至有些人能够做到那个痛好像脱落了，它从你身体的感觉里脱离了，好像只是在边上晃悠。"],[21,2218,2284,0,"只要练习够绵密很多人都能够做到。即使是对于止禅行者，我也建议至少要有一次这样的经历。因为这对你来讲具有非常大的意义：你不会再害怕痛，你发现痛真的是假的，它会离你远去，它可以脱落。⒀ 对于疼痛，刚开始一定不要理会它。你只要理它，那么永远都在那个点它痛给你看。如果你不接受，它会越来越痛，其实这是心的一种抓取。⒁ 如果疼痛干扰到自然的专注力，就改变坐姿。除非你要练习对痛的体验，要练腿子、不练专注时才这样观察。"],[21,2284,2348,0,"⒂ 在四威仪中皆保持觉知非常非常的重要。通常老师会说“你在四威仪中保持觉知入出息。”，我个人的建议是：身念处（身体的触觉、动作的觉知）与入出息可以结合起来。对初学者来讲，有些人觉知入出息的习惯还不够，可以先从比较明显的身体动作觉知，于行住坐卧处都让自己有念知。可以在你经常出现的地方写上标记，来提醒自己有念知。⒃ 平衡五根、七觉支，后面再讲。2、开始于觉知静态的概念息待息相稳定后，让呼吸自然地出现。"],[21,2348,2450,0,"有两种情况：一种情况是找不到自己的气息，有人说：“气息好像从鼻孔中间出去，根本就碰触不到皮肤。”，他始终都不能在鼻孔上觉知到入出息；另一种情况是只要一觉知入出息就慌，就不自觉地去控制，没有办法专注呼吸。这两种人适合于在口鼻那个位置或者在鼻孔里面，去作意那里充满了气息，或有一团静止的气息，甚至作意一团像棉花一样的，像雪花一样的，像雾状一样的，都可以。你取这样的一个相、一个概念息。气息事实上存在的，因为呼吸一直都在发生，只是你觉知不到或者不敢觉知，那么就在那个地方取一个静止的入出息，也能够培养定力。只是“相、入息、出息”三法中入息和出息二法没有被觉知到。因为没有知此三法，所以这样的练习最后成就的定力也不如真正的入出息念所成就的那么殊胜。"],[21,2450,2576,0,"我们应该怎么结合呢？我曾经和很多禅修者做过这个实验，也有不少人成功。就是先觉知静态的概念息，然后慢慢地专注、专注、专注，也能稳定下来，能感觉到那边有一团气息，甚至觉得有一团亮光在那个地方，这时心就平静下来了。对于在鼻孔找不到气息的人，因为心平静下来了，本来我们的心（意门）就可以知道一切，无需触点，当他觉知概念息培养的定力起来时，可以用心觉知，“诶！在那个地方，气息被我自然地觉知。”往往大部分人，此时的心就能够觉知到气息，相、入息、出息三法都有了，又可以这样练习。对于一开始就抓呼吸、很痛苦的人，往往是由于他的心很烦躁、不能平静。所以当他能够稳定地取到静态的概念息时，他的心也会平静下来。此时，气息会在这个静止的概念息（相）上，自然地表现出来，他就能自然地取到入出息。每个人都不同，以上只是一些个人的观察角度，至于怎么修，应该让你的老师指导你。"],[21,2576,2645,0,"三、获得入出息念殊胜功德的两阶段标准对于入出息念的两个阶段，帕奥西亚多的要求：一、持续专注微息四个小时五个小时无妄念。当你能做到这一步时，他允许你专注似相；二、持续专注似相四个小时五个小时无妄念。以事实来证明，这是可以达到的。只要你能做到一个小时没有妄念，达到四个小时就不难了。我们发现大多禅修者如果一个小时没有妄念，差不多一个月以后就可以做到三个小时、四个小时没有妄念。所以不要被这个标准吓着。四、练习入出息的五个阶段佛陀在《大念处经》中讲到，入出息练习的四个阶段：1、入出息阶段：「只念于入息、只念于出息」。"],[21,2640,2769,1,"2、长短息阶段：「入息长时，了知‘我入息长’；出息长时，了知‘我出息长’。入息短时，了知‘我入息短’；出息短时，了知‘我出息短’。」3、全息阶段：「他学‘我将觉知全身而入息’；他学‘我将觉知全身而出息’。」4、微息的阶段：「他学‘我将平静身行而入息’；他学‘我将平静身行而出息’。」5、我再加一个阶段——似相阶段：当呼吸与光融为一体时，应当继续专注呼吸，直至达到四个小时微息三个小时以上无妄念。然后你才能够专注似相，直至达到四个小时似相三个小时无妄念。五、入出息念修习次第在定力提升的不同阶段，对治妄念的四种方法与禅修者讨论后发现，佛陀教导的这四个方式实则是在定力提升的不同阶段，对治妄念的四种方法。四阶段亦是定力提升的不同阶段。很多人一开始就把入出息、长短息、全息、微息混着用，我不太建议如此。关于微息的概念，帕奥西亚多有定义：到微息阶段时，至少一小时两小时一直都在很微细的状态里，不是有些人说：“我一会呼吸变得很微细，一会呼吸又变得很粗。”的状态，那是心很混乱、呼吸很不平稳，远没有到微息的状态。"],[21,2756,2901,1,"（一）入出息阶段一般建议在入出息阶段尽量减少妄念，在《清净道论》里讲到：可以通过数息来完成。数息有快数和慢数。因为我们的心总是帮你寻找快乐，如果觉得呼吸枯燥时，它就想跑。我给一些禅修者建议：当你的心想跑时可以数息，原本‘入息出息数一，入息出息数二，入息出息数三’，可以扩展为六种：1、只数入息，每个入息数一，每个入息数二；2、只数出息，每个出息数一，每个出息数二；3、入息出息数一，入息出息数二；然后你还可以加上，4、入息时我快数，入息时我慢数；5、出息时我快数，出息时我慢数；6、入出息时我快数，入出息时我慢数。你会发现至少有六种方法，可以让你的心来回地换。此时，没有理由觉得心还会跑，因为有很多事可以让心去做。在这个阶段，无论用什么方式，就是不要让妄念进来。不管用哪种方式数，只要能数到20 分钟、30分钟没有妄念，大部分人的心就会进入一种新的状态，轻安、喜乐、平静就会被你体会到。如果一开始觉得自己的心妄念很多，就要这样做。当然，对瞋性行者来讲就不这么要求，放松觉知，在妄念中觉知。贪性行者就要求自己高一点。"],[21,2901,2996,0,"当你数息半小时没有妄念时，心就会平静下来，这时会觉得数息很粗糙、不想再数。此时，呼吸已变得比较绵长，可以进入长短息的阶段。不想数息时，就标记它为长短息。在此阶段，实则是用标记呼吸的长短来替代数息。当长短息阶段，通过标记，能做到20分钟30 分钟不打妄想时，两阶段（入出息与长短息）合起来近一个小时没有妄念，大部分人到这程度，全息就会出现。按书上的描述：“从开头……到结尾……全部知道”，所以很多人就去追，从开头时追到结尾，追到自己控制呼吸、憋气为止，那不是全息。"],[21,2996,3100,1,"我做了一个图，不是很形像。如海底看鱼，你能完整地看到一整条鱼，但是不准确。为什么呢？因为入出息是从开始到结束，不是一整条就在那个地方。我要表达的是：对于入出息，以前你只能觉知中间某一段（明显的那一段能被觉知到），后面一段就觉知不到（比如出息的后面一段或入息的后面一段）。在全息阶段时，根本不需要去追它，也不需要去控制它，你很清楚入出息从开始到结束，自自然然地在触点上发生着、发生着……，这才是全息阶段。如果还没到全息阶段，却想去做全息，大部分人就会去追那个气息，不是追到控制就是追到憋气，这是必须要了解及把握的地方。"],[21,3083,3248,0,"（二）长短息在长短息阶段，气息开始比平时更缓慢，气息经过接触点的时间也变长。这里的“长”是指时间的长，而不是长度的长。有时候呼吸稍微快一点，或者说时间稍微短一点，这时就了知入出息是短的。甚至于它没有特别地变长或变短，你只是标记它，就能够让你的心平静下来而没有妄念。（三）全息在全息阶段，我学‘我将觉知全身而入息’；我学‘我将觉知全身而出息’。全身（sabbakāya）即全息，也就是呼吸的整个过程。有些外道认为：全身指全身毛孔打开、八万四千毛孔打开，他错误地理解佛陀经典。sabbakāya 是指呼吸身，当心变得微细，你就可以觉知呼吸的整个过程，全然知道，从开始、中间、到结尾。（四）微息在微息阶段，‘我将平静身行而入息；我将平静身行而出息’。当呼吸变得很微细、若有若无时，此时应开始觉知微息。大部分人到这个阶段会自然而然地觉知微息，无需花很多功夫去调它。到微细的阶段，至少一两个小时能够清晰地觉知呼吸的状态，才能说是微息。虽然不能一概而论，但大部分情况是这样的。当微息阶段出现时，就要调整五根，把握好五根与七觉支的平衡，不然就不容易进步。"],[21,3248,3349,1,"帕奥西亚多说：在微息的阶段，你要知道微息的长短息与微息的全息。如果你一直在微息，呼吸也一直清晰自然地觉知，就不要去管它的长短息与全息，它本来就在那发生着，你没有打妄想、 没有昏沉就不必“头上安头”。何时需要知道微息的长短息与微息的全息？当你觉知微息，心越来越平静，感觉即将滑入昏沉时，通常我们会指导：“你要更多地知道那个气息的状态”，即是更多地知道全部的气息，或者标记一下息的长短，让心活跃一些。如果在微息时，因某些原因心有点躁动起来了，建议你在微息里，多注意一点静止息、多注意相，就可以调回来。"],[21,3324,3542,1,"（注：课件中为动图，这里剪切三个状态并列放置）我做了个图作参考，只是通过这个方式让大家了解一下概念，并非一定要生搬硬套，那会出问题。微息阶段，我们分两种：1、觉知的位置比较微细（如图中上面一种）；2、觉知的位置稍粗（如图中下面一种，如果你感觉鼻孔较大）。中间这个白白的东西，就是心自始自终放的一个位置，也就是相，图中白点就是相。入息、出息在这边发生着，如果呼吸绵长时会觉察到：有时呼吸好像没有了，感觉鼻管空掉了。此时，如果去追呼吸，就会觉得没有了。但如果心始终有一个相在这里——“在那个位置上有气息，那个位置上充满了真实的气息。”，你的心就不会觉得“诶？呼吸找不着了。”，“相”就在起作用。在觉知的过程中，如果觉得有点散乱，可以对静止息（相）的觉知多一点，通过调五根或调七觉支，加强一境性。如果心沉滞，觉得太平静了、将要昏沉，就更多地去觉知入出息的状态。（五）专注要求当心能够很好地把握相、入息、出息时，要懂得在相、入息、出息间做平衡、做调整，如此，你的业处才容易达到安止和近行。如果到后面你还不能把握，就不容易成就。"],[21,3542,3673,0,"（六）禅相很多人强调禅相，认为禅相就是光，就是那个很明亮的光。对不对呢？对大部分人来讲是对的。但在《法集论》义注里有提到“肮脏的禅相”（巴利翻译）。肮脏的禅相，是指它没有光，它的禅相不是明亮的，或者是暗暗的感觉。所以并不是所有人的禅相都是亮的，这是第一点。第二点，Nimitta，有标相、标志、标记、标识、前兆、征兆、预兆等意思。在未证得禅那的阶段，我们可将禅相理解为定力提升的标志，或者是证得禅那的前兆。我认为用“前兆”和“征兆”来形容Nimitta 是比较恰当的。而不是以光有多亮，来形容是不是可以入禅。入禅是五禅支平衡发展到相当的力量，心能够在五禅支的支助下，很自然地、长时间地、快乐地安住在似相里面，而不是有光就是似相，当然大部分禅相有光，这个要分清楚。禅相是你能够入禅的征兆，它是五禅支平衡发展到一定程度的一种状态。这样来理解是比较恰当的，就不会被光所带走。"],[21,3673,3800,1,"“相、入息、出息，非一心所缘，知此三法者，修习有所得。”——最后阶段就是相、入息、出息合成一个，变成似相。似相是什么呢？《摄阿毗达摩义论•摄业处分别》中说：“对于禅相，一切[业]处都能够通过适当的方法获得预作相和取相。但只有遍、不净、身分、入出息才能获得似相。在此，确实是通过专注似相而转起近行定和安止定。”如何理解专注似相呢？专注是自然发生的。在 2015 年或更早的时候，帕奥西亚多都是要求你的专注是自然发生的——你自然地被似相吸进去。而且在第一次、第二次、第三次报告时，帕奥西亚多都会要求：“吸进也在里面继续觉知入出息。”为什么？觉知入出息没有达到三个小时四个小时没有妄念，他不让你继续在里面，得出来继续觉知入出息才行。除非有禅修者报告：“西亚多，我实在是一专注就进去，一专注就进去。”那就进去，接着就练习专注在似相里三个小时四个小时没有妄念。专注似相是自然发生的，而不是如有些人所说：“投进去”、“像跳高台跳水一样跳进去”，这都不属于自然发生的。通常非自然发生的，定力就不能得到很好的培养， 这里提醒一下大家。"],[21,3798,3899,1,"关于什么是禅相、什么是似相，已解释。有个问题：似相与呼吸是什么关系？这很重要。帕奥西亚多说“禅相是呼吸的颜色”，在《帕奥禅师问答集》里有，大家可以自己去看。对于安那般那来讲，你的所缘自始至终都是气息的概念，都是呼吸的概念，都是呼吸。如果认为修入出息念，最终是专注光而成就的，你有可能成就，却没有正确地理解入出息念。当你的定力出现晃动、掉落时，因为对教理不理解，就会着慌：“光没有掉了！Bhante，我光没有掉了！”光掉了没有关系，呼吸还在就没有问题。心里要很笃定，“这里面是气息，身体好的时候它比较亮，身体不好的时候它比较暗，但不影响我入禅。”"],[21,3899,4047,0,"（七）七个诀窍接下来跟大家说一说一些窍门，对有些人有用，有些人不一定有用，大家可以做参考。1、入出息念（业处）的所缘始终都是息的概念。2、一个心识刹那只有一个心生起。这是我克服自己非常痛苦的黑暗时代一个非常重要的法宝，和很多人分享过，也有很多禅修者因为这句话解决了不少问题。当你的心在入出息时，就一定不会在外面的噪音上；当你用心在觉知入出息时，就不会感觉“我用眼睛在看入出息”。我们“用眼睛看入出息”时，其实心已经到眼睛那边去，要求眼睛去看。但其实因为眼睛闭着，即使眼睛睁着也根本看不到入出息，也看不到光、看不到禅相。如果眼睛可以看到禅相，那你有禅相我也应该可以看到。但显然，你的禅相我根本看不到，所以你的眼睛根本不可能看到你的光。你觉得眼睛看到光，只是因为你的心看到光，然后你的眼睛觉得“噢，那亮了。”，你以为眼睛可以看。当你用心在觉知光时，眼睛就没有发挥作用。所以不用担心说：“我眼睛在看光。”你可能在用眼睛，因为它亮起来了，习惯性就用眼睛去看，也不用排斥，看就看，用心继续觉知入出息，一点事没有。"],[21,4047,4135,0,"有些人说：“我有触觉啊，有触觉怎么办？”触觉不是你的所缘。“但是， Bhante，我还是觉得有很多触啊？”没关系，帕奥西亚多讲了，觉知触上面的气息，知道你的所缘是气息，慢慢这个触觉就没有了，就被你忽略掉了。这些都是因为一个心识刹那只有一个心生起。当你不去关注那个触觉时，它自然就没有了。当你生起善心时，不善 akusala 就不会生起。这句话可以治一切禅病，只要记住它就不会有恐惧。真正地了解这句话，你“悬崖上敢撒手”。为什么呢？因为你念佛号、忆念佛陀功德、觉知入出息等，都是善法，悬崖上撒手即使摔死了也至少投生人天，怕什么？你不会有恐惧。"],[21,4135,4257,0,"3、心总是寻找快乐。如果你的业处不能给它带来快乐，它一定打妄想。怎样帮它找到快乐？知道入出息的殊胜、体会喜，只要有正念，只要在善法上，学习《阿毗达摩》后知道，一定有心和心所的轻安、轻快性、柔软性、适业性、练达性、正直性。有轻安轻快自然就会有喜乐。只要有一念非常恭敬认真、正念地觉知入出息，喜乐就一定会生起来。要明白这个道理。只要让心感觉到快乐，它就会被鼓励，就会持续地专注，定力就会被培养，然后就会越来越快乐。如果总是不断地批评它“你怎么搞的？妄念那么多？你怎么老不会专注啊？怎么才坐一个小时啊？为什么不坐两个半小时啊？”你的心不断被打击，这样的心就不会进步。心需要不断被鼓励。为什么我们喜欢嗑瓜子？为什么喜欢打游戏？因为快乐可以快速地获得，可以忽略掉快乐边际效益递减的事实，因为嗑瓜子、打游戏的边际效益递减中间段特别短，马上又能获得快乐。入出息也一样， 每个正念觉知都会有快乐。4、了解自己的性行。尤其是瞋性行者一定要小心。"],[21,4257,4426,0,"5、通过梳理削弱五盖。入出息念是检验内心有没有粗重烦恼的试金石。只要入出息念修不上去，显然你有一堆的烦恼、 一堆的五盖，你要去找 “真正盖住我的东西是什么？”。然后去梳理它。不梳理却想靠着“我每天都坚持这样坐啊、坐啊、坐啊……”，能坐出来的人不多，而且很不容易。玛欣德尊者曾经提到过一位尊者，在他刚去帕奥时，那位老尊者已经在帕奥修了十年了，没有任何消息。又过了大概七年，他再次见到那位尊者，跟他禅修报告说已经看到光了。十七年了，能坚持十七年持续安那般那的有几个？这位老 Bhante 坚持十七年终于见到光了。如果你有这样的耐心和决心就没有问题，它是硬磨出来的。如果想轻松一点，我觉得通过入出息念找到你的问题所在，找到盖，到底是哪个盖比较强，都是有对治方法的。贪盖、瞋恚盖，就是我们养成的那些错误的认知行为习惯，改掉它就好。比较麻烦的是痴盖，没有办法，只能自始至终老老实实地把业处搞清楚，坚持每天坐。痴来自于不同的方面，大部分情况是上一生，可能在一个比较愚痴的生命状态里，留下来的心理余势就盖住他。比如，佛陀时代的小般他咖尊者（Cūḷapanthaka，周利盘陀迦），由于过去生做的某些坏事成熟，他就被这些不善业障碍了。"],[21,4426,4494,1,"佛陀给他一块净布，教他一边搓揉这块布，一边说：‘去除污垢！去除污垢！’。就是要重复。当然我们不是佛陀，没办法给别人非常适合的业处。但是有一点一定是可以尝试的，就是累积功德、多做服务。多做服务对于滋润智慧是真的是有帮助的。如果你觉得业处搞不清楚，禅修也很困难，总是没办法聚焦，浑浑噩噩、混混沌沌的。那与其混混沌沌的，还不如在世间、在僧团里，多做服务、多做恭敬、多做十福业、多做布施、持戒，然后不断地给自己回向。读诵 24 缘，好好学习《阿毗达摩》，一遍一遍地学，把法理搞清楚，智慧自然会开显。"],[21,4492,4606,1,"6、与心沟通。与心沟通是很有讲究的。很多人觉得“我跟心说一下，怎么就没有用啊？”。比如，你家孩子打游戏，当你说“你再打、你再打，你明天就变成乞丐!”，你会发现孩子根本不理你。“你不能再打，再打我把电给你关掉了”，孩子还是不理你。然后你凶他，过去把电拔了，他虽然没办法但是很不高兴，然后明天接着打。有教育组的同学说，那我就陪孩子打，打了一段时间后就可以和孩子沟通了。我们陪他昏天昏地的打，本来妈妈要做饭的，打到后面没人做饭。这时候和孩子一起，“我们要不要吃饭啊？”应该吃饭；“那吃饭还能打游戏吗？”我们总得停下来，如果我们打游戏上瘾，饭就没人做了；“我们要不要停下来做饭呢？”好，我们停下来做饭；“我们除了做饭，剩下就打游戏吗？妈妈以后就陪你打游戏，不上班了好不好？”"],[21,4604,4717,1,"——马上就会没钱打游戏；“如果你一直都打游戏不学习，以后就永远变成这样一个人。游戏能让我们变得聪明智慧有学识吗？不可能。”这时候和孩子就能沟通了。同样的，你的心也是这样。它在妄想时你说“怎么还打妄想？”；它在抓取时，你说“不能抓取，你要放松，放松！”。你越要求它放松，它越是不放松，你就很生气地要求它放松。两股力量就在那边交织、打架。跟心沟通的时候应该怎么办呢？把已经很紧张抓取的或者不良的惯性先放掉，真正地回到心里面。呼吸不专注了，回到心里面，其他的就停下来了——为什么呢？一个心识刹那只有一个心生起啊。你不能让它持续地循环，而是要回到你内心里面、 心脏的地方停下来，问它“你刚才为什么这么抓取啊？抓取有什么好处？给你带来什么？”我们先分析一下，看一下想抓取的背后那股力量，以及那股力量背后的标准，它在恐惧什么？心抓取无外乎因为两种情况，一种是它恐惧、害怕，它要抓、怕失去；还有一种是天生的想控制，是个控制狂：“我要抓住它！”。不同的人方法不一样：恐惧的人就化解他的恐惧，控制狂要让他看到控制的过患。"],[21,4717,4783,1,"与心沟通后，对它说：“你看，我们不应该这么做，我们重新起一条轻松、如实、自然的心路，继续觉知入出息。”这个时候心才能置换出来，你才能够有一段时间很平稳地觉知入出息。得这么沟通，而不能在脑子里不断给它下指令，那是没有用的。这样的道理可以遍一切处，不管是和孩子沟通、和同事沟通、和所有人沟通都得这样，你得回到心的原点上，让不良的惯性暂时停下来，然后看那个不良惯性背后的因，让心认知到背后的问题，然后重新来过，才可能坐下去。7、五根与七觉支的平衡。很多老师已讲过，由于时间的关系，这里就不再细讲，或是下堂课再细讲。"],[21,4783,4868,1,"今天就学习到这里。主要分享了一些个人的体会以及与一些禅修者在互动过程中感受到的内容和方式方法，给大家做参考。回向功德！"],[22,1,268,1,"175 讲-摄集-摄菩提分-身念处-入出息念 4古源尊者修习入出息念，有人很顺利，有人并不顺利，原因很多面，归结起来就几个。一、三法无碍解道：“相、入息、出息，非一心所缘，不知三法者，修习无所得”；“相、入息、出息，非一心所缘，知此三法者，修习有所得。”因此要明白，入出息念业处有三个要理解的目标——相、入息、出息。最关键的是“相”，相从一开始到最后实则为一个内涵——入出息的概念。先不谈“概念”，因为大家对“概念”有不同理解，容易造成混淆。相是什么？相是入出息发生地方的气息（对于初学者来说），或者说业处上的气息。对于“三相”的体会，建议内心先在那个位置上取到息，无论是有入出息或无入出息，心里都要很清楚、很笃定地知道“这里有息，这里一直都发生着呼吸。”无论你是否体会到入、出、或无，内心都很笃定。当你能笃定地作意这个位置有“息”时，即取到了相。在相上知道入息，即同时知道两个法：相与入息；在相上知道出息，即同时知道两个法：相与出息。此为“知此三法”，依此修行则“修习有所得”。因为相始终存在，即使呼吸不明显，你也知道这里充满了气息，而不至于失去目标。"],[22,268,335,0,"在修习过程中，因为有相存在，所以当定力培养上来时，你不会在意它的位置似乎变掉了。有些人报告说：“Bhante，我的位置一会在这、一会在那，怎么办？明显感觉呼吸不在那个位置了。”有相的地方就可以，不必在乎位置。沙利子尊者只是说：相、入息、出息，知此三法者修习有所得，从未说过知此位置才有所得。位置是为了方便取到相，不能死抠一个位置。把这些理清楚后就会很轻松、很简单，否则你就折腾“找位置、有没有入出息、呼吸长短”诸如此类。要清楚地知道入出息就是在相上发生的入息、出息。"],[22,335,504,1,"二、禅相关于禅相，有标相、标志、标记、标识、前兆、征兆、预兆等意思。着重理解：Nimitta 是证得禅那的前兆,是内心的一种感觉，表现为五禅支的力量，更广泛的是初禅心三十四个智相应名法的缘力。相，并非指长得像钻石、星星；是绿色、紫色或黄色；有多明亮才算是禅相，它没有标准。见行者没有标准就容易抓瞎，开始对自己产生各种怀疑。因此要清楚，真正证得禅那是内心的一种感觉。什么是入禅？曾听过不同的说法：“禅相很明亮，感觉呼吸与禅相融合在一起，大概稳定一两个小时后就投入。”这样的说法有问题吗？或许不能说有问题，但你会发现：这个“投入”，到底是怎么样才算投入，是没有标准的。当五禅支足够稳定时，自然地被禅相吸进去。当真正有定力时，就知道它是这样的一种形式，是被吸进去的。在初次被吸进去时，帕奥西亚多说：“不要让它吸进去，你继续觉知入出息达到三个小时、四个小时、五个小时没有妄念。”那时才允许你入禅。为什么要这样做？因为五禅支的力量要达到足以支撑你持续地在禅相里，或入禅安止三四个小时，至少要两个小时以上，你能进去且没有妄念，沉浸在里面。"],[22,504,592,0,"五禅支必须要有这样力量，只有训练到这个程度，才会让你入禅。为什么要训练到这个程度呢？有禅修经验的人都知道，过早地沉入似相、进入安止，若五禅支力量不够强，过半个小时或一小时就会掉出来。掉出来以后，又有一种说法“你只要开始专注光，就只能专注光”。那时光没有力量，没法令你专注，怎么办呢？只能在光里面打妄想。这就会带来各种各样的问题，根本原因是五禅支的力量还不够强；从整体来讲，初禅三十四个名法的力量还不能足以支撑你四五个小时安止的状态。当能证得禅那时，Nimitta 的形像、状态、光已经不重要了。并非以 Nimitta 长成什么样、有多么亮来评判是否可以入禅，这要明白。"],[22,592,759,1,"入出息念初禅心有三十四个名法。如果修悲心禅或修随喜，有三十五个名法。入出息念初禅心的三十四个名法，在入禅时，最明显的表现是：寻、伺、喜、乐受和一境性。它们是五个心所，只是相对于其他心所表现得更有力量、更明显、更容易被观察到。未来修名法的时候，你会发现此时意门与似相的触是强有力的；心对入出息念的概念、相的标记（想）是强有力的；组织所有心所一起专注似相、造作色界禅那善业的思心所，也是强有力的；你的胜解心所也非常地有力量，知道“这个就是”，在慧根的加持下，不会怀疑说：“到底是亮一点还是暗一点？到底是什么形像啊？”你不会在那儿摇摆不定，而是内心非常笃定“进去了，安止。”你知道什么是安止，不会有怀疑；你的精进非常地正确，当你有一丝不善法生起时，你知道“这个要把我拉出去了”。圣正定是由正精进支撑的，正念始终都能觉知“我现在是否生起不善法？是否善法在持续？”这就是正精进（四正勤）。你有强烈的欲，对似相感到非常的喜悦、欢喜，很喜爱——就要被吸进去了， 有股强烈的想再投入的欲在那里。此时，你的信心非常充分，不会有任何的怀疑；"],[22,759,920,1,"正念非常强有力；惭、愧、无贪、无瞋更是这样的表现。只要有一丝贪念：“哎呀，我能不能再来一下？”就没有无贪，心就跑了；有一丝的分析、评价、判断，就没有无瞋，心就跑了；持续稳定的中捨——精进捨；还有六对心和心所的轻安、轻快性、柔软性、适业性、练达性、正直性。这共同的三十四个名法，支撑着你的心持续地沉入似相、进入安止的状态三个小时四个小时，这是由每一个心所与心识共同的力量去完成的。广泛地说就是这些内容，具体地查只是查五禅支。真正影响禅修者能否稳定在所缘上，其实与信、慧、念、精进、一境性、中捨性、无贪、无瞋有莫大的关系。所有不能进入安稳禅那的原因都与五根不平衡有关系，不是期待就是排斥、分析，没有认真地面对这些心所，或是心里有各种心里余势来回折腾。学习《阿毗达摩》的禅修者，想要入禅，就得把这个（初禅心三十四个名法）搞清楚。增上定学是心的净化，你每一天坐在那儿，培养的是这三十四个名法的素质及缘力（自然亲依止缘和重复缘的缘力）。真正能支撑你三四个小时安止，是这系列心所及心识的重复缘和自然亲依止缘缘力在支撑着。"],[22,920,1046,1,"重复缘和自然亲依止缘怎么形成呢？就是持续，持续才有重复，没有持续就没有重复。如何让自己持续而不折腾？先提出这个问题，后面会细讲。相、入息、出息，到真正的似相（可以沉入时），三法合为一相——似相。也就是相、入息、出息三个合成一个，此时“一心知三相”。但不论合成什么样，依然是息的概念。虽然《清净道论》说“确实是通过专注似相而转起近行定和安止定。”但是这个似相依然是息的概念，这很重要。为什么很重要呢？当你初次练习沉入，不能达到三个小时四个小时没有妄念时，就会掉出来。掉出来时，就已经不是相、入息、出息三法合一的强有力的五禅支足以让你安止的相。只要依然还有息的概念，就不会想去专注光。而是想：“此时，不能失去所缘，所缘依然是息的概念。”如果呼吸有出来，就觉知入出息；入出息没有出来，就觉知息，心就不会只是抓住光，然后在光里打妄想。这是非常重要的，一定要记得。"],[22,1044,1159,1,"在此，提出一个问题：似相与呼吸是什么关系？有人说，当你的呼吸变成似相——在很多书里也提到“呼吸变成了似相”。是，看起来呼吸变成了似相，因为三法合一了。要知道这没有矛盾，似相依然是以呼吸作为主体。为什么呢？因为它是心生九法聚的火界所形成颜色的现状。帕奥西亚多说：“光是呼吸的颜色。”很多人不能理解，为什么说光是呼吸的颜色呢？因为禅相是呼吸形成的，禅相的内涵依然是呼吸，请大家牢牢地记住。能牢牢地记住它后，当你的禅相变暗了、乃至于失去时，你心中很笃定：“我依然是觉知呼吸。”当光变得暗淡，或者当心从似相滑出、从安止退出时，不应专注光，依然是专注呼吸的概念。有气息就知道那微弱的气息，没有气息就知道‘这里充满了气息’的呼吸概念。很快，你的似相又会变得很明亮，又可以再进去。否则，就会长时间在光里面打妄想。"],[22,1159,1260,0,"三、心总是蠢蠢欲动在达成这个目标的过程中，很多人会碰到各种各样的问题，尤其是大家经常说：“Bhante，我就是有妄念啊，怎么办？”有妄念很正常，心总是蠢蠢欲动。雷迪西亚多说“心总是蠢蠢欲”。上面是《汽车总动员》的图，用这幅图表达的意思是:在内心里，总有无数辆汽车都在发动，都踩着油门。有的已经开在路上，有的踩着油门随时都想冲出去。我们的心就是这样的状态。这时，有些人的表现是：妄念就像雾霾一样（后面的背景欻欻地来），没有很明显的妄念表征，但只要心一不专注，马上就被拉走。还有一种妄念很明显、强有力，一开始就表现出来，想把心拉走，这往往是心放不下的事情，或者白天碰到的一个强有力的所缘在内心里呈现。针对这两大类情况，应该如何对治？"],[22,1260,1385,1,"对于很明显的、有力量的、所缘清晰的这类妄念，在禅修之前就要作意将之擦除、清零。决议：在禅修时这个事儿不再起来。知道今天哪一些所缘很明显地撞击到根门，就要专门处理它。若在禅修的过程中它再出现，因为已经胜解决议过，跟心商量：“你看我们都决议过了，就不要再出现了”，再次清零、擦除，打包扔到太平洋。在这个过程中，很多人讲：“回到业处啊、你回到业处啊……”，但总是效果不明显。为什么呢？因为这个车已经开到马路上，你站在半空中跟它说“回去，回去，车开回去”，这车能开回去吗？不可能。那要怎么办？你得到车里面去，跟驾驶员讲“现在停车”，或者亲自把刹车踩下去，车才可以停下来。这只是个比喻，要怎么做呢？当妄念出来或心散出去时，要让心要回到内心里。一般会建议回到心脏这边，把所缘放掉，呼吸的所缘放掉、妄念的所缘也放掉，回到内心里，跟心做个沟通说：“这是妄念，清除掉，打包扔掉。”或者说：“我们不再想了，如理作意。”有些人想到某件事，生起很悲伤的心，情绪上来时如何处理？就是陪伴它，等它消失，作意它无常、无我。然后再起一个安稳的心路。"],[22,1385,1459,1,"在心的想蕴标记库里有很多心平静、安稳的标记，把它拿出来， 另起一条心路“让我们安静地、平衡地觉知入出息”，重新来过，才能在一段时间内有效。如果只是在脑子里不断地跟心讲“回来、回来、回来”，最后的结果只会让心越来越烦躁。不但心烦躁，而且还会头疼。有禅修经验的人都有这样的体会。怎么办呢？就是回到心里，让它停下来。当回到心时，其实妄念已经停下来了。为什么呢？因为所缘已经转变，一定要切换所缘，所缘有所缘缘的缘力，它会拉着你。你偶尔起个心路在脑子里喊着“你回来你回来你回来”，那个所缘还在里面打转，必须回来把那个所缘放掉。这是对治很明显妄念的一个方法。"],[22,1459,1532,1,"对于不明显的妄念怎么办？妄念不明显就说明心散乱惯了。如何处理？其实，没有更好的办法，只有在一切时处训练正念正知。对治妄念，没有诀窍，只有老老实实地在行住坐卧里提升自己的念知，增加经行，觉知身体的动作，慢慢地就能觉知入出息。当然，有些人也可以试试告诉心，放空觉知平静一段时间。四、文字的坑（一）位置与触觉文字是有“坑”的，望文解意很容易掉进坑里。例如“位置”和“触觉”，关于位置，老师讲是“触点上的气息”，虽说是触点上的气息，但往往有人忘记“气息”记住“触点”，把触感当业处了。位置不是触觉。"],[22,1532,1680,1,"（二）风大与动态风大的特相不代表是动态，动态不代表是风大的特相。这一点必须理解。风大的推动与觉知入出息的动态是两个概念。如果认为入出息的动态就是风大的推动时，就会去找推动的感觉，慢慢地鼻子就会硬起来。（三）成像与概念很多人问：“概念是不是一团东西或者一个东西？或者是它一定在哪个位置？或者是在哪个边缘？或者作为某一个点？”那是成像，是要硬想象一个相状出来。其实，概念就是“知道这里有气息”。我常举例说你看一个人或看一条狗，为什么会用狗举例呢？因为《阿毗达摩概要精解》里以狗为例解释‘意义概念’ ——那个长得毛茸茸的、有头的、会摇尾巴的、会伸舌头的狗。你若“定位”一个像，就会发现有麻烦。一条活着的狗，有时会奔跑、有时会躺着、有时会汪汪地叫、有时会摇尾巴、有时会伸舌头，它有各种形态。但是当你取到狗的概念时，无论它以什么样的形态出现，你都知道它是狗。如果你硬要对指定一个固定的相状才是狗时，就麻烦了。比如说“只有伸舌头的才是狗，不伸舌头的就不是狗”，意思是：在对待入出息上，你想要形成一个固定不变的相时就会出现这个问题。"],[22,1680,1788,1,"在讲狗的比喻时，你觉得很可笑，但面对入出息时，你经常如此做。这就是取一个相与取一个概念的不同。取一个相就是定死它，但入出息的概念随时会变化成各种各样的相。你若定死它，就会怀疑“诶！不是那个相，我希望取到这个相。”那时，心就会摇动，就会出现各种问题。（四）专注与了知很多人用“专注”这个词，我更建议大家用“了知”或者“觉知”。就是心在知道。一提“专注”，有些人就想盯过去、想抓取它、想控制它。其实呼吸本来就是一个自然而然的事，如实地知道就好。当然，还有很多文字坑，只是以这四对为例。意思是：不要玩文字游戏，不要死扣文字的内涵，而是要能够“洞穿”。洞穿什么？洞穿觉知入出息的目的， 就是培养三十四个名法的重复缘和自然亲依止缘的缘力，培养五禅支的缘力，直至心能自然沉入似相三个小时四个小时没有妄念，这是目的。"],[22,1788,1907,1,"五、习惯折腾者的心流习惯折腾者的心流如上图，只是方便比喻。在觉知的过程中，好不容易取到入出息，心是平稳的。接着他认为：“这么平稳真好啊！”想要贪，贪心生起就开始折腾。贪心生起，心即离开入出息，去贪那种感受，此时产生一个不善心（至少十七个心所的贪不善心）。等到发现呼吸没有了、或有些人原有的光消失了，才感觉：“不对啊，刚才起贪心了。”又开始折腾，想着怎么样把它找回来，折腾半天。好不容易找回来有一小会了，又开始怀疑：“诶？这个东西和刚才不一样啊？”又开始评判、排斥这个状态，生起一串瞋的心路，结果光没有了，身体也不舒服。好不容易“又发现了”，继续折腾，再把它找回来，又有一小段平衡一下。然后心累了开始掉举，更累时开始昏沉，又开始折腾。今天有位贤友报告：“我今天早上状态很好啊，两个半小时一眨眼就过去了，下午就不行了，一塌糊涂”。为什么？因为有期待，没有其他的原因。"],[22,1907,2085,0,"对于喜欢不折腾的人，要记住最后成就禅那时，心是一条平衡的、广大的禅那速行，持续地生起四个小时，中间没有任何欲界速行（如波浪般）在里面，没有转起。如果你总是希望通过折腾，折腾出平稳觉知的状态来，怎么可能？以直观的方式看透，安安稳稳地觉知入出息其实就这么简单。如果你想“我怎么样搞得更好一点”时，就是在折腾了。要老实点！只有老实才会有收获，不老实就会很麻烦。六、发现烦恼去除五盖当觉知进入平稳状态时，五盖变得很微细。在粗猛的五盖阶段，要梳理；在微细的五盖阶段，要能够发现更微细的惯性，那些惯性如果不处理，依然会成为拦路虎。在坐的有好几位，被拦了几个月甚至几年，虽然看上去状态挺好，但就是不进步，来回折腾。有位贤友，他喜欢跳跃，就来回倒腾，他的跳跃源于欲贪与瞋恚。如果只是观察欲贪和瞋恚时，不能被解决，因为他只是在那里来回跳。更微细的是，他有“寻”。他的寻就是心不安定，不安定从根本的角度来看就是生命目标不稳定。他没有真正地、非常笃定地说：“我这一生就是为了断除烦恼来的，我现在就是来修行的。”没有很强的“锚”，把他锚定在那个地方。"],[22,2085,2196,1,"没有被锚定的表现并非是“我今天找这件事，或是找那件事”，而只是由于方向没有锚定，他心不安。心不安的这种缘力造成他在面对入出息所缘时就折腾。这是很微细的，平常看都看不清楚。如果不深入到这个地方去解决问题，就会很长时间被自己折腾在里面。还有一种人是完美主义者，完美主义者的表现就是“我不能接受我不够好”，看似瞋恚盖。其实如果完美主义者的心持续起作用时，五盖的任何一种都会冒出来。禅修状态好一点时，他说：“这个不错，符合我完美主义的标准。”贪盖出来了。只要有贪，好的状态马上就消失，消失后又说：“怎么搞的？我是不是完蛋了？”瞋恚出来了。瞋恚一出来，接着就是各种怀疑：“我是不是错了？我是不是正确？还是……？”疑盖出来，就来回折腾。当问他：“你有疑吗？”他说：“没有。”对三宝的信心非常坚定。他也不贪、一点都不贪；平时表现很好，也没有瞋恚，但是因为有完美主义的习惯，导致他在五盖里来回折腾。"],[22,2196,2306,0,"还有一些贤友，就是着急着想要尽快进入禅修状态。可是越着急，心就越反抗。坐一二个小时，他的心就开始慌：“怎么还没有状态？再没有状态我就要抗议了。”但是他觉知不到，只是表现为心很烦躁，坐不住、想换腿，可腿又不痛。什么原因？分析后的结果就是不能接受禅修这么慢，“我在世间里干任何事情都是雷厉风行，跑来禅修，对于这么简单的入出息，这么长时间都搞不定”，心就烦躁了。这些微细的五盖，在禅修的过程中若不去观察它，而只是继续报告：“我昏沉啊，我掉举啊，Bhante，这个事情如何处理啊？”总拿结果来说事儿是没有办法解决问题的。只有透由在禅修过程中真正地看到的这些现状的因，查到你的心理余势、那些惯性，然后去调整它。真下手去调整了，接下来你的禅修就会一马平川。如果你不去处理它，只是在结果上不断地期待：“我怎样才能够专注更长时间？我怎样才能够没有妄念？我怎样才能够不掉举？我怎样才能够没有怀疑？”没用的，那只会继续折腾。"],[22,2306,2477,1,"在这过程中要用到四圣谛。所有的结果都是苦谛，要找原因，不要对着结果采取行动。要找到根本原因，依着八正道逐个地解决。先转变知见、思惟方式，然后行为要跟上，一点一点地调整。因为长久以来养成的惯性（有些人是多生多劫的），想在一两天里解决它，是不容易的。但是，心就是这么有意思，当你真的认知到它，并决定开始处理它时，以我的经验，不超过半个月，一定能解决。重复缘足以让你的习惯基本改过来。如果你只是在结果上 “我会昏沉、我会睡眠、我会掉举、我会怀疑”折腾，这样的人往往很难帮助到他。什么原因呢？因为他已经见过无数的西亚多，对所有人都不会有信心，对自己也没有信心，这就非常麻烦。因此在这里再次提醒大家，在微细五盖出现时，要看到自己的心理余势，看到自己的惯性，要从惯性上下手。七、走向精进捨处理完惯性，才能逐渐地走向精进捨。上图中驾四匹马的马车夫和驾两匹马的马车夫，都能很轻松自然地让马自己走，不会随意甩鞭子。佛陀讲Upekkhā（捨），不仅仅指捨心所，有十种捨。其中一个是精进捨，这里的精进就是“已生善法令增长，未生善法令生起，已生不善令断除，未生不善令不生”，在这个基础上，持续地对目标保持稳定的、不放弃前进的一种状态。"],[22,2477,2557,0,"精进捨是当三十四个名法的力量平衡增强后，自然前进的一种状态。它是捨心所，既没有不足，也没有偏。其实入出息很简单，只要在呼吸发生的地方取到相、取到入息出息，然后如实、自然、轻松、快乐地觉知它，无需拙力。“我想搞清楚一点、我想控制它一下”这种想法带来的都是折腾，只会让你在培养三十四个名法有效的善法缘力过程中夹杂许多不善法。这些不善法也形成缘力，在未来的禅修过程中不断地制造麻烦。送给大家禅修八字真言“如实、自然、轻松、快乐”，走向精进捨。"],[22,2557,2639,0,"八、近行定当能持续地面对所缘时，进步可以预期——达到近行定。近行定（Upacāra-samāpatti），就是接近于安止的状态。很多人有体验，能长时间在微息里，很安稳的状态，多数是近行定的状态。帕奥西亚多和玛欣德尊者都强调，在近行定时要防止落入有分。因为在接近于近行定时，心已经变得很平稳，就像精进捨的一种状态。当很平稳时，如果不能平衡，心就容易出现沉滞，一不小心就掉入有分，很沉稳地睡了一觉，但对于培养定力没有任何帮助。此时应学会平衡五根与平衡七觉支。"],[22,2639,2816,1,"（一）平衡五根平衡五根，有入门级与熟练级。入门级，就是先要让五根升起。如何升起？首先要有慧根，能清楚地取到入出息的所缘，这是择法的能力；对于什么是相、入息、出息很清楚，这是慧根。当对于相、入息、出息很清楚时，信心自然地被培养起来，信根就会成立。当对它（三法）有信心时，所缘目标就非常清楚，从而形成强有力的想，念根就会起来，念会越来越强。当这三根都升起时，只要持续地、精进地支持三法，定根是可以预期的。五根有这样的次第关系。在入门级阶段，我建议，不论是贪性行者还是痴性行者，都要花点时间学教理，把什么是相、入息、出息搞明白，这样就不会怀疑，就会有信；有信就会有念；有念就愿意精进；愿意精进就容易培养定力。到了熟练级，对于这些（相、入息、出息）已清楚，在练习的过程中如何去平衡五根呢？这与性行有关系。比如，瞋性行者比较折腾，“这个是吗？是这个吗？”分析、评价、判断，慧根太强。对于慧根强的人，要增强信根。信根增强的表现就是：“就是这个了，不会有什么大变化的。”所以要傻一点，不要太聪明。对于贪性行者，要增强精进根，要给自己定计划，心不要散掉。"],[22,2816,3014,0,"一旦心想懈怠、放逸，应及时观察到，并思惟八种悚惧事令心生起悚惧，从而提策精进根。对于寻比较强的人，要增强定根（一境性），多点时间放在相上。对于心容易沉滞的人，或者信根太强的人，要多点精力放在呼吸的动态（入息、出息）上，更多地知道气息的细节，以免心沉滞。对任何人来讲，念根都是越强越好。虽然念根越强越好，但并不是你想强就可以强的。增强念根最好的方法就是：一切时处都正念正知，必须要训练。这是作为禅修者或佛教徒的基本功。如果不训练这个基本功，你不可能如理作意。若不能如理作意，必定会被各种情绪带走，心就会蠢蠢欲动。即使你巴拉密很好，已培养出禅那，但还是一堆烦恼，对于解脱是没有用的。帕奥西亚多就讲，我们无数生都证过禅那，证禅那没什么了不起。我们无数次证禅那怎么都不解脱呢？只想证个禅那、 搞个止观，没什么了不起，有本事把你的烦恼干掉！有本事看到你现在的心理余势，真的对着它把它消除掉！这才是真修行者。在平衡五根的过程中要发现自己的问题。只有念真正强有力时，才能够去平衡五根。平衡五根是靠念完成的，没有念，你根本不知道哪一根是什么状态。"],[22,3014,3175,0,"在日常生活中也是完全靠念，正念才有正知。果报出现时，是否能停下来，不被情绪带走，再分析果报形成的原因，再确定下一步如何走向更好的方向，让善心生起，这是基本的能力。（二）平衡七觉支有些人适合用五根平衡的方式，有些人更适合用七觉支平衡的方式。平衡七觉支也有入门级与熟练级之分。入门级，大部分初学者对入出息尚觉无聊时，是体会不到轻安觉支和喜觉支的。从某种程度上来讲，如果觉得入出息很无聊时，其实择法觉支也没有真正地发挥作用。为何这样讲呢？因为只要正确地取到入出息的相、入息、出息，并具有正念地觉知它，每个正念觉知都是善法，生起的都是有三十四个名法的心。即使没有喜，也有心和心所的轻安、轻快、柔软、适业、练达、正直。只要正确地觉知，轻安轻快就会生起；轻安轻快一生起，喜就一定生起，很容易体会到喜。如果入出息的相还没清楚地取到，连入出息是什么都还没有理清楚，没有信心，那就不会有正念。心一直在那边入-出、入-出，生起的可能有善心，但大多没有慧根。这样的心不容易有七觉支可被体会，特别是轻安觉支、喜觉支，无法升起。"],[22,3175,3329,1,"对于入门级的人，还是建议先把入出息的所缘搞明白。入出息的所缘搞明白了，入出息就入门了，再往后修就容易了。如果不清楚入出息的所缘，就想去练习七觉支，就会几乎不可能。当入门后，慢慢地走向熟练，七觉支的平衡就变得很有意思。在平常练习时要时常去观察这些觉支，因为它们都是心所。学过《阿毗达摩》后，对念、慧、精进、喜、轻安、定、捨都已了解，更要理解它们的特相、作用、现起、近因。在禅修的过程中，虽然不能像见到究竟法一样清晰地看到它们无常、苦、无我的相，但对于心所表现出来的特相，可以觉知到一部分。让心去取以择法为主的特相，是可以取到的，虽然还只是概念上的认知，但能取到它的特相。接着去认知它，认知它以后，在修习的过程中就可以调它。念就是对目标念念不忘，心能够安稳地沉在那个地方；择法就是对入出息正确的善了知。如果你轻安比较强、心比较沉滞时，就要策励心。策励心时用择法觉支、精进觉支或喜觉支都可以，只要七觉支本身已被训练出来，提升任何一个，另外两个也会跟着上来。比如取精进觉支，在全息阶段，我一般会建议：“更清楚地知道入出息的细节。”"],[22,3329,3482,1,"这是精进；同时“更清楚地知道入出息的细节”，也有择法觉支；当你真的对入出息的细节有更多了知时，喜觉支一定起来。你就能体会到。当你的心有点活跃， 比如有位贤友来禅林禅修，很欢喜、很兴奋，坐得很舒服、很快乐，但时间不长，为什么呢？因为他太兴奋了。这时会建议说：“你看看，这三个（轻安觉支、定觉支、捨觉支）里面选哪一个。如果选定觉支，就是把心多一点放在相上，就是那个位置上的气息，忽略掉些觉知动态（入息出息的动态），只是更多地知道在那个位置上充满了气息，稳定地放在那个地方，一境性的相就可以被提起来，这就是提升定觉支的一个机会。如果喜很强，可以用捨，“这种欢喜不是我的所缘，可以把这个欢喜捨掉”。更重要的是，捨是一种平衡。如何平衡？每次调整，都要回到心脏那里，跟心讲：“有点太兴奋了，我们需要平衡它、中捨它，让 Upekkhā 的力量变强。”一时专注于中捨的相，心就自然平静下来。当提升一境性时，其实也是走向平衡，喜被抑制、轻安就会出来。轻安某种程度是一种乐受，一般有喜就会有轻安，但是当喜明显时，乐受就会被掩盖掉。"],[22,3482,3704,1,"七觉支平衡，首先要认识它，其次要懂得怎么去运用。在运用的过程中每个人的体验不一样，要根据自己心的习惯去调它，这样才能七觉支平衡。七觉支平衡对未来整体的修行是非常有帮助的。由于时间关系，后面再详细地讲。七觉支是觉悟的素质，觉是觉悟，支是素质。佛陀在《一切漏经》中说有七种捨断，最后一个“修习捨断”就是修习七觉支，捨断一切诸漏。九、安止定当能平衡五根、平衡七觉支时，五禅支的力量将会越来越强。五禅支所代表朝向初禅的三十四个名法的力量也会越来越强，那时将会进入安止。安止定来自五禅支的力量， 简单来讲是来自五禅支的力量，展开来讲是三十四个名法平衡的力量。而不是光有多亮、长成什么样。虽然它会有光，但那不是禅那的标准。禅那的标准是五禅支的力量足够强有力，而且是平衡的。入禅是以五禅支的力量足够强所形成的征兆、标志，称为 Nimitta。按照帕奥西亚多的要求：觉知微息、觉知微息的全息、觉知微息的长短息，达到四个小时五个小时没有妄念，此时五禅支的力量就相当强。当五禅支的力量相当强时，很多人报告说：“那个似相总是要把我的心吸进去，一次一次的要把我吸进去。”"],[22,3704,3808,0,"前面两三次报告时，帕奥西亚多说：“不要让它吸进去，你继续觉知入出息，即使吸进去你也要知道入出息。”一直到说：“西亚多，我被吸进去以后，完全不知道入出息是什么，我就进去了，二三个小时才出来。”他老人家就会点点头说：“哦，那你就让它进去吧。”这时，你就已经进入安止了。如果进去两个小时没有妄念，就两个小时安止，进去三个小时没有妄念就三个小时安止。是自然而然进去的，不需要你“投入”。凡是投入的，都不是最好的状态，一般情况下不可能达到三个小时四个小时没有妄念。根据我的经验，大部分主动投入的人可能会有半个小时安止，这是有可能的，但半个小时后会怎样？继续专注光，在光里打妄想，很多会是这样的结果。如果专注微息、微息的全息、微息的长短息，持续四个小时五个小时没有妄念，那种形成的强有力的五禅支把你吸入进去之后，一般情况下，最少能有两个小时一直在安止里。我所碰到的部分禅修者基本能达到这个程度，两个小时能进入安止。"],[22,3808,3908,0,"帕奥西亚多要求四个小时五个小时专注似相没有妄念，才两小时，怎么办呢？我的观点是：因为已很清楚地知道，似相只是个说法，专注的自始自终都是入出息的概念。所缘都是入出息，不论是初禅二禅三禅四禅，所缘都是入出息，相只是入出息的颜色。所以当你从两个小时安止出来后，不要专注光，继续觉知入出息的概念，这是正确的做法。但往往那时，入出息的概念还是光。专注光和专注有光的入出息概念是两种不同的内涵，这是很重要的。为什么继续专注光时，有些人又投进去了呢？因为它确实还有光，但这又是不同的。当你说：“我继续专注有光的入出息的概念”，很多人基本上三五秒钟很快就回去了；当专注光时，很多人在光里一段时间，如果没有马上进去就开始打妄想。"],[22,3908,4015,1,"当然，每个人状态不同，不能一概而论。因此我们不能做概括性的、人人都一样的建议。要观察每一个禅修者不同的状态去指导。总体来讲，有一点是不会错的，就是：你出来，继续专注有光的入出息概念。如果入出息出来，就觉知它；没有入出息出来，就觉知带有光的入出息概念，也就是相。经过一小段时间，五禅支的力量又被培养起来，你又会被吸进去，又进入安止。最后可以把这一段一段的安止连成一个整体。两个小时跟一个小时之间不再断掉、不再掉出来，完成的是这样一件事情。只要这样做，掉出来了继续觉知入出息的概念，至少这么做不会出问题，最后会连起来，连起来后你的定力不会掉，而且会越来越稳定。当然每位禅修者会有不同的情况，具体指导要听从自己的老师，我讲的只是自己的经验。"],[22,4015,4155,1,"当能如此做时，老师就会让查有分、查五禅支。五禅支查完后就很简单了。能达到这个程度，查有分和查五禅支就很简单了。有些人在查有分上会有点麻烦，因为经常看到书上写“心脏那个位置，会像一面镜子一样。”有些禅修者就报告：“Bhante，我找不到镜子。”他想像心那个地方有如同我们日常看到的镜子 （虽然有些禅修者的有分确实像明亮的镜子）。有分是意门，意门是所有心理活动的场所。因此，理论上所有的心理活动都是从有分转起。所以查有分（查一面镜子）是什么意思呢？就是说，在心脏那个地方，你能观察到所有心理活动，它就像一面镜子一样能够呈现你所有的心理活动。明白了吗？所以不要找镜子。对于从禅那刚出来，马上查五禅支、查有分的人，首先看到有分呈现和似相。如果五禅支足够强时，你会感觉到似相就像在有分的镜子里呈现出来一样。我经常对查有分的人说：“查有分，看到了？”“看到了”“诶，你打个妄想，打个妄想给我看，你看到什么？”为什么说打个妄想给我看？正常情况，当定力足够，就能够在有分里看到打妄想的场景和影像，那是镜子，不是去找一面水银造的镜子，搞错了。"],[22,4155,4304,1,"十、四色界定修习完五自在后，基本可以开始初禅、二禅、三禅、四禅，就没有问题了。再次提醒大家，四禅的似相是什么？四禅的似相依然是入出息的概念。请大家牢牢记住，当你有此定义时，无论入出息修到何种程度，内心都是笃定的。如果混淆这个概念就会到处抓。十一、成就入出息定力当成就入出息定力时，会有很殊胜的功德。殊胜的功德前面已讲过，不再重复。有几点再提醒一下，比如你真的获得五自在——入禅自在、出禅自在、住定自在、转向自在、省察自在。特别是入禅自在，我们对所指导的所有禅修者都要求能在一切时处入禅。禅修者只要能达到前面的要求，都能做到。睁着眼睛、闭着眼睛、站着走着行着坐着，都能入禅。晚上睡觉，入个四禅睡，有人能做到，有人做不到，这跟他心的习惯有关。有些人用入出息，有些人用遍禅。因为入出息的精进力相对于遍禅要强一点。如果能在禅那中入眠，你的修习状态与一般人差别很大，一切时处都能在止禅里。入出息定力培养起来后，后面的定力犹如探囊取物，很容易做到，它是成就后面一切止观的基础，后面一切止观的基础已然稳固。真的成就入出息念的定力，四个小时五个小时在似相里没有妄念，就是真正的成就。"],[22,4304,4459,1,"当然定力是没有止境的，至少已按照帕奥西亚多的要求达到定力。只要达到这个程度，后面再修习戒定慧、修习八正道、修习七清净十六观智，就没有困难。身念处入出息念的部分，花了四节课和大家一起分享。有很多内容是个人的理解与体验，真正在修习过程中还是听从自己老师的安排。如果有错误，也请大家提出。在此，祝福大家成就一切的止观，圆满修行，体证一切的道果，早日证悟无上清凉的涅槃！Sādhu！Sādhu！Sādhu！"],[23,8,217,1,"176-摄集-安止善巧 1古源尊者一、安止善巧今天我们学习《清净道论》和帕奥西亚多《正念之道》关于“如何善巧地安止？”或者“安止有哪一些善巧？”的内容。（一）什么是安止善巧？“安止善巧” ，顾名思义，就是如何从接近安止的状态进入安止的善巧。是已经入门，从还搞不清楚入出息、妄念纷飞、各种昏沉状态里走出来了。对于修习入出息念者来说，就是禅相已经比较明显，正处于让心趋向于近行定、乃至于趋向安止的阶段，这个过程里面有要特别注意的内容。"],[23,217,348,1,"（二）善巧于相善巧于相有三个部分：（一）善巧于透过安那般那念或其它业处令未产生的心一境之相〔禅相〕生起。这是专注业处的第一阶段，对于入出息来讲就是如何正确地通过相、入息、出息的觉知令禅相的生起。（二）善巧于培育已经生起的禅相。对已经生起来的禅相刚开始还不稳定，不能过早去投入专注，而应该继续觉知呼吸直至四个小时五个小时没有妄念。持续培养强有力五禅支支撑的禅相，直至禅相能一而再地将心吸进去了。（三）善巧善巧于保护已经获得培育的禅相。在此所指 的是后一项。这三个部分，在此侧重于如何善巧地将似相或者禅相（nimitta）有效地守护。"],[23,331,439,1,"二、概述安止善巧守护帕奥西亚多建议要有良好的心态，以谨慎恭敬的心守护禅相、守护nimitta。他提出来需要关注七个部分：第一住处，第二去处，第三言论，第四相处的人，第五食物，第六气候，第七姿势。《义注》举例：譬如王后怀了将来能成为转轮圣王的胎儿。如果怀的是转轮圣王，她可以时时用肉眼看见自己子宫里的胎儿。她因此会非常谨慎恭敬地保护胎儿，以免胎死腹中。同样的道理，禅修者必须以非常谨慎恭敬的心守护自己的nimitta。大家要妥善地理解“谨慎恭敬” 四个字，“谨慎恭敬”"],[23,436,542,1,"不是要牢牢地抓住的意思，谨慎：小心,审慎,不粗心、随意、放纵；恭敬：虽然是你怀的孩子，但知道他未来将成为转轮圣王，而起谦恭有礼的心，尊敬或尊重地对待。懒惰、迷糊或健忘的心不可能使人达到高度的修行成就，因此他必须保持热忱、念与正知，在行住坐卧中都专注于业处，专注于相、入息、出息。在经行的时候、在做任何事情的时候，最好都能够至始至终地专注业处。对于已经入禅、开始滑入似相，老师也允许专注似相的人，你在一切时处都要专注似相。比如经行的时候，要在经行处的起点先专注呼吸，当似相稳定，让心自动地专注于似相。心沉入似相的时候，起步慢慢地走，而在走的过程中，心自始至终都是在nimitta的状态里面。"],[23,542,635,1,"要在从刚开始滑入似相，只能稳定一个小时、两个小时直到完成稳定三个小时、四个小时乃至五个小时，就要在一切时处，所有的姿势里面都能够正念地专注于nimitta。有些人比较快，有些人比较慢，有些人要来回个把礼拜或者十几天，才能够稳定到三个小时、四个小时、乃至五个小时。三、安止善巧如何守护？这个时间阶段里面，“守护”分成七个部分。（一）住处第一住处。如果在某个地方住着，觉得禅相不容易生起来，或者已经生起来的nimitta不稳定乃至于消失，或者还没有建立起来的正念不能够建立起来，没有安定的心也不能安定，这种住处对你来讲就是不适合的。如果禅相能生起来、又稳定，正念得以建立，心也能够平定下来，这样的住处就是适合的。"],[23,635,741,1,"这里包括不同的寺院，或者同一个寺院里面不同的住处。如果条件允许，可以请求老师允许去试不同的地方，包括孤邸、禅堂的位置，或者在树下住的那些树头、位置等，都是可能的。你可以在不同的住处住上一段时间，坐上几座。帕奥西亚多说：“你可以住上三天，如果适合你，它就是适合，不适合就要调整。”这里要规避一个问题，特别是瞋性行者，瞋性行者选择住处是不容易的，他本身心就不容易如实，习惯各种计较分析，坐在那本身心就不安稳，因此需要有自然如实的心态，才可以去观察是不是适合他的住处。（二）去处第二去处。去处指经行的时候或者出家人要托钵的时候，在守护禅相阶段不适合去太远的地方托钵，因为可能会非常地疲惫，或者路途有各种各样让心不容易平静的所缘。"],[23,741,825,1,"所以要去找比较容易获得钵食的村庄、能够让心稳定地专注业处的路途，这是恰当的。《注疏》里也讲，要选择住所的南方或北方，为什么呢？为了避免往返的时候，脸朝着太阳。对于现在的人来讲，大部分都在内托钵，不存在要走太远的地方，所以就比较容易。但大家要知道，经行的时候不要朝着太阳走，会受干扰。（三）人第三人。要跟合适的人相处，要跟不讲无益言论、拥有戒行功德的人相处，跟这样的人相处比较好。跟他相处会感到心很安定，已经定的心会更舒适。"],[23,824,919,1,"经常在禅林里面会碰到各种“话唠子” （太关心自己的身体、每天总是忙着各种各样照顾自己的身体、讲无益的言论上瘾的人） ，跟“话痨子”相处是不适合。因为这样的人只会制造干扰：“槃爹，我觉得禅林管理如何如何。”就好像泥浆加进了清水，心就会变得浑浊，所以跟什么样的人相处是蛮重要的。（四）食物第四食物。没有哪一种食物适合所有人，不同的人需要自己去调整。出家人不可以挑选食物，但是他知道哪些食物适合自己，哪些食物不适合自己，不适合的就不能要太多。再一个，食物不能吃太多，有些人适合甜的食物但可能他并不是爱吃甜的食物；有些人并不适合甜的，但是他喜欢吃甜的食物。要在吃完食物后，观察自己禅修的状态，包括食物的量，这些都是很重要的。"],[23,919,1034,1,"（五）言论无益的言论会导致nimitta 消失。中文翻译称这类言论为畜牲语。巴利语tiracchāna 意思就是“横着走” ，在巴利语里面把“横着走”的称为动物。但《义注》里面也解释说， “横着走”也指这类无益的言论，这类言论不是导向解脱的“直着” （我们讲正直行道，比库是正直行道者） ，“横着走”就是跟解脱无关的，这类言论也被称为dilaqiana“横着走”。各种王论、贼论、大臣论、军队论，危难论、战争论、食物论、饮食论、衣服论、船论、花饰论、香水论、亲戚论、车乘论、村子论、城镇论、都市论、国家论、女人论、英雄论、街道论、井论、死人论、琐碎事论、世界的起源论、海的起源论、事情是否如此论、常论、灵魂断灭论、幸运论、损失论、欲乐论、自我折磨论，这些都被称为是“横着走”的言论，叫畜牲语。"],[23,1034,1115,1,"在经典里面提到有十种论是适合的，哪十种论？少欲论、知足论、离群隐居论、远离社群论、精进事论、持戒论、定论、慧论、解脱论、解脱智见论，这十种论是适合交流的。这十种论有助于消除贪欲，有助于解脱，能导致厌离、离欲、灭尽、寂静、胜智、正觉与涅槃。但也不是说每天需要讨论十种论，特别在修止禅的时候，讨论同样会导致心非常活跃，尤其需要深入思考的内容也是不适合谈论的，修止禅的时候适合圣默然 。（六）气候第六气候。其实气候包括环境，并不是某一种气候适合所有人，有些人适合凉爽的气候，有些人适合温暖的气候。"],[23,1115,1232,1,"所以去观察，吃什么样的食物，住什么样的地方，什么样的气候会让你感到舒适，让心变得安定，让已安定的心会更加安定。（七）姿势第七姿势。姿势就是四威仪，包括行住坐卧。经行的状态是快一点、慢一点、大步一点、小步一点？坐的时候是双盘、单盘、还是混合盘？中间是不是用立禅（站立）的方式？睡觉的时候怎么躺卧？怎样的躺卧让睡眠有效？每个人都不一样。姿势与住所和食物一样，需要自己去试，既不会让自己觉得疲倦，同时要觉得很合适、让心得定，让已得定的心得到增长，这样的姿势才合适。长久来讲，不是试一两天、两三天能观察出来的。姿势如果长时间不当，会让身体变形，导致在更长时间以后，出现各种状况，那个时候就不是得定不得定的问题，而是生病不生病的问题。"],[23,1216,1358,1,"三、十种安止善巧在《清净道论》里面也讲到十种安止善巧。（一）内、外处清净第一个是使处清净。处指内处和外处。这里内处主要讲身体：头发是不是很长、指甲是不是老不剪、鼻毛不修跟插钎一样。是不是经常浑身都是汗（很多人喜欢爬山，爬完山回来浑身的汗，下午打坐不但自己打坐不清净，周围所有的人都受你的汗味干扰） ，这称为内处不清净。内处不清净还包括吃东西，上座部允许吃蒜头，蒜头吃完以后，最好自己到一边打坐，不然老是打嗝，边上的人就会很难受，这是内处要注意的，其实自己也会有感觉。有些人以为少欲知足，穿很老旧、恶臭的袈裟，走到哪个地方，哪个地方都有一股味道。外处主要指住处，有些人的孤邸很脏乱，不知道从哪里下脚，这些属于外处不清净。"],[23,1326,1483,1,"处不清净的时候，心和心所相应生起来的智就不会清净。《义注》讲就好比依靠不净的灯碗、灯心和油产生的灯火就会黄黄的、不断地闪动。究竟名色法（诸行）以及它们的因就不会明显地呈现于以不净智来观它们的人，而当致力于修行禅修业处的时候，比如说安那般那，它就不会增长、提升和圆满。当内处和外处清净的时候，心和心所相应生起来的智也会清净，就好比依靠清净的灯碗、灯心和油而产生的灯火。究竟名色法（诸行）及它们的因，会明显地呈现于以清净智来观它们的人。当如此致力于禅修业处的时候，比如说安那般那，它就会增长、提升和圆满。所以要使自己的内处清净、外处清净。、（二）保持诸根平衡第二保持诸根平衡。诸根主要讲五根：信根、精进根、念根、定根、慧根。诸根平衡使心平衡，使心专注、固定于似相。该策励的时候策励，该安住的时候安住。"],[23,1483,1621,0,"对于已经朝向近行定的人，帕奥西亚多经常会提醒：“呼吸开始变得很微细，入出息的禅相也变得比较稳定，心的状态也很稳定，这时候要避免落入有分，同时要知道怎样持续地提升定力，这个时候就要记住对五根调整、平衡、策励，使心更加地专注、固定于似相。五根就是五种控制心的力量，它们使心不偏离于通向涅槃的止观正道。1．信根信的特相是对当信之事有信心，作用是澄清，现起是不迷蒙，近因是当信之事。“对当信之事有信心”是对佛陀教导的业处有信心，对现在专注的入出息所缘（相、入息、出息）有信心。如果没有信心，心是浑浊的（有怀疑，心摇摆不定） 。有信的时候，就能让心清澈，心清澈的时候，所面对的入出息的相也很清楚，哪怕有微细的呼吸也能觉知，而且能够稳稳地专注在这个相上。"],[23,1621,1770,0,"信就像转轮圣王的清水宝石，把净水宝丢在浑水里面，很快地，水会从浑浊变得清澈、透明、不受干扰。所以信心生起来的时候可以捨弃诸盖，使污染沉淀，使心不受干扰。由于心已经清净，所以禅修就会很稳定。特别对于瞋性行者或者见行者来讲，信显得非常重要。往往瞋性行者和见行者，因为有多种知见，在世俗上显得很有智慧，很能分析、评价、判断，能够很精准地判断事物，而回到入出息的时候，因为入出息不是透由世俗的努力去获得的，是如实、自然、轻松地觉知入出息而培育出来的相，是自然而然出来的，不是通过努力、通过手段、通过控制能产生的。所以这个时候，对于禅修者来讲，他对于法的信心、对于自己的信心就变得非常非常的重要。对于信不足的瞋性行者，首先从法上把原理搞清楚。搞清楚后要调整自己的习惯，改掉世俗上透由自己的能力去控制而获得成果的习惯，不改掉的话就一直想把呼吸搞成一个什么样的相，这个时候往往不是真正的相，只会在止观的路上更加坎坷和踌躇。所以“信”对于见行者和瞋行者来讲非常重要。"],[23,1770,1832,0,"2．精进根第二是精进。经典讲：就像一个老旧的屋子要加上几根新柱子（精进）才能防止它倒塌，或者作为后援的生力军可以让在前方做战的国王的军队击败对方。精进能够支持所有的心所、所有的相应名法，令它们不从被专注的似相目标中退缩回来，所以在正确的激起之下，应把精进看为是我们一切成就的根。就像老旧的屋子受到新柱子的强化而直立不倒，同样地，在受到精进的强化之下，禅修者不会倒退也不会道德腐败，所以应当如此理解、强化精进的作用。"],[23,1832,1971,0,"举个例子，如果一个人想要透过培育止禅，比如说安那般那，来镇伏烦恼，而且也知道如何培育它。这时候有关培育止禅的精进和毅力的缘就已经具足。如果一个的人的目标是如实地了知究竟法，这时候有关培育观禅的精进的缘也就存在了。这种精进和相应的心同时生起，这个时候心正念地了知禅相或者所缘。在这里面要知道，正精进是因它的因缘而生起的，如果没有设定好愿望、目标，精进的缘就不具足。很多人培育止禅，比如说要证得入出息念的禅那，这里面有一个要特别小心的地方，如果把禅那当成果，去树上摘一个苹果，特别想获得它，每天都精进努力地想要去获得它、想要去抓取它，这就不是真正的止禅的目标，也不是真正的精进的缘。"],[23,1971,2053,0,"止禅的目标是镇伏五盖。所以想要获得禅那，内心一定要很清楚——要获得禅那是34 个名法的缘力持续地被培育，有足够的五禅支力量镇伏烦恼，是要达到这样一个目标，而不是由结果导向：“我现在入定三个小时、四个小时，我一直想要这个东西，我一直要这个结果。”要结果所导向的精进往往都会是邪精进。因为想用控制、抓取的方式来获得结果，而不是如实、自然、轻松地培育34个名法的缘力而达成这样一种内心的状态，这个要特别提醒大家。正精进是“已生善法令增长，未生善法令生起，已生不善令断除，未生不善令不生。"],[23,2053,2178,1,"在禅修或者专注似相的过程中，随时地用“念”和“慧”觉知心的状态是持续在善法上吗？在善法上是持续地增长吗？有不善法起来吗？只要内心有任何对所缘的贪、瞋或者摇摆不动的疑惑，有念力马上就能觉知，觉知以后就要调整，这种正精进才能成为一切成就的根， 《清净道论》讲：“精进是一切成就的根”。3．念第三是念觉支。念觉支在五根里面是任何时候都要最强大，越强大越好，念 sati 这个词根本身的含义是忆念，另外一个特相也是指获得或者拿起，简单来讲就是获得了有用而且有利益的法。“念”生起来是能够仔细地检查现在拿起的、获得的是有益的还是无益的法，“这些是有益之法，那些是无益之法，这些法有用，那些法没有用”， 然后 “念” 会去觉知：“去除无益的法， 拿起有益的法”。"],[23,2178,2345,0,"前面讲到，如果对善法的价值没有信心，我们不会造任何善业。善心不单是需要“信”执行任务，同样也需要 “念”对善法醒觉和不忘失，包括布施、持戒，特别是现在讲的禅修。禅修时只想要结果， 忘了获得禅那是善法持续培育而产生的结果，所以往往在禅修过程中，在善和不善里面来回地折腾，浪费机会。始终要让“念”住立，对善法、不善法保持醒觉，不被不善法带走。当不善法一起来，发现说：“诶！又来了” ，心马上能调整过来，这是要有“念”的作用，所以念的特相是不摇摆，也就是说，对安那般那的目标（禅相、似相） ，念念分明不流失，心稳定于目标。论疏里讲：“像石块沉入水中，不会像葫芦一般地漂浮。”4．定第四是定根。定根也称为一境性，一境性拥有自己不散乱、保护其他相应名法或稳定其他相应名法也不分散的特相。《注疏》讲就像印度以前的洗澡粉，放到水里会粘成一团糊状一样的东西，会把其他所有俱生的相应法结合在一起，让它不散乱。定的现起是心的宁静。"],[23,2345,2533,1,"为什么要培养定力呢？培养定力就是培养一境性，有深度的一境性才能够如实知见真实法。五根里的定在入出息念中，表现为有禅相、有似相时候的那个相。“相、入息、出息，非一心所缘”——到最后，相、入息、出息变成同一个相，三合一了，那时一心知三相。这个时候一境性就被培育起来。希望呼吸变得很微细平稳的时候，要让一境性多一点，就多一点专注相，而对于入出息的动态可以忽略一点，定因此被培育起来、被调起来。如果想让精进根强一点，就多一点知道入出息的动态，尽可能地知道入出息的动态，精进根就被调上来了。5．慧第五是慧根。对于入出息念，慧根就是如实了知入出息的所缘。入出息的所缘包括相、入息、出息。对于相、入息、出息的理解是属于慧的范围。当觉得有点昏沉，或者认为有怀疑起来的时候——“我现在到底对还是不对？”就交给慧根来完成判断。慧根怎样完成？对于入出息来讲，就是相、入息、出息这三个事，其他的都与此无关。交给慧完成什么？——第一，抉择所缘。“有这个相吗？相在吗？什么是相呢？”如果已经有似相就很简单，如果没有，在呼吸发生的地方就有相，就一定有一团气息在里面。"],[23,2532,2600,1,"有入息、有出息吗？有这三个就够了，不要再想太多。第二，抉择正确的专注方法。保证觉知的全过程生起的都是善法，而不落在期待、贪求、排斥、昏沉掉举、追悔、分析、评价、判断、怀疑等不善法上。如果，“我现在相稳定清楚，入息、出息稳定清楚，我都能够正确如实了知”——那你还有什么不信的呢？还有什么好想的呢？不想了！信一起来，慧与信就平衡了。要平衡信和慧，要平衡精进和定。当对相的了知多一些的时候，定就被培养出来；当对呼吸的动态了知多一些，精进就被提策；当对什么是入出息三相的所缘和正确的觉知方法清楚明了，就是在择法，就是有慧。慧觉得“我搞清楚了” ，就交给信，“就是这样的，我不折腾了。"],[23,2600,2689,0,"”信与慧就平衡了。佛陀讲，修行就像调琴弦一样，不能太紧也不能太松。太紧太松都不会发出好的声音。过强的精进使心不能够平静、专注；如果过度地强调定、专注相，心容易变得沉滞。帕奥西亚多举过一个sona 长老的例子，sona 长老的名叫细毛sona，他的父亲叫做牧牛长者。在王舍城里，sona 听完佛陀的开示以后充满了信心，在父母的同意下出家成为比库。佛陀教他一个禅修业处，他就去住在一个叫清凉林的地方禅修。"],[23,2689,2797,0,"sona长老想：“我的身体很娇嫩，但是不可能透过快乐获得快乐，即使令到身体疲惫，我也应该实行沙门的禅修。”经过这个思惟，他决定只采用站和走的两个姿势，不睡觉也不坐下。他精进地修行，来回行走地修禅，以至他双脚皮都破了，流血，乃至整个经行道都充满了血，《义注》说就好像杀牛的屠宰场一样。由于太强的精进，他无法获得成就，因此感到很绝望：“我都这么精进了，怎么还没有成就？”当时佛陀在灵鹫山以他心通知道他的念头，就去到sona的住所，提醒他：以前自己做菩萨的时候，最后决定平衡行道是因为看到弹琴。琴弦如果调得太紧或者太松，琴音就不美好也没法弹；精进根太强的时候会导致扰动，太弱的时候导致怠惰。所以佛陀教他如何以定根来平衡精进根。sona 长老调整以后，继续努力禅修，最后证得了阿拉汉。"],[23,2797,3006,0,"这说明禅修不能只凭精进：“我要把禅堂坐穿，我要一天坐12个小时，我要像佛陀一样坐在树下，如果不证禅那，七天不起来。”我们没有佛陀那样的的巴拉密，先看清楚自己是不是具备这样的条件，然后考虑怎样平衡我们的五根，禅修才能够进步。信根跟慧根的平衡，精进根跟定根的平衡，而念根适合于所有的情况。因为念可以保护心。念怎么保护心呢？心里生起不善的时候要马上能观察到。不然你来报告：“槃爹，我今天禅修的时候，不知道什么原因，打妄想生气了，心总是不能稳定！”为什么不能稳定？要观察， “念”及时地观察，这些不善心生起来都是速行，回到意门转向，如果还看不到意门转向，可以观察那个心生起来的时候，背后是什么样的认知？如果是瞋心，就是什么被触犯到了；如果是贪心，就有某一种认知被鼓励了，被激励到了，被满足了。所以不管心晃动还是沉滞、还是排斥、还是烦躁，要学会去观察而不只是希望老师给解决方案。怎么样才能够观察呢？“念”要足够强。不善心只有三种根：贪根就是黏着、期待；瞋根就是排斥；痴根在这里，要么就是模糊不清，要么就是摇摆不定——掉举和怀疑，也是慧根不能够呈现的状态。"],[23,3006,3091,0,"“念”要马上观察到，观察到以后，知道生起的是什么样的不善心，相应的不善心以什么样的法去对治，对治的背后要先看到是什么样的因导致这样的不善法生起来，不然的话就还是糊里糊涂的。大家都在学习《阿毗达摩》，这是非常好、非常重要的，为什么呢？因为学完《阿毗达摩》 ，才能够观察到心到底是什么样的状态，才能够分析它，才能够真正的对治它。这是五根的情况。（三）培育及平衡所有七觉支七觉支和五根是有相关的地方，但也有更微细的地方。念根跟念觉支是相关的，念觉支是能够持续地觉知、辨识似相，念一直都在似相里面。"],[23,3091,3222,1,"念根与念觉支区别在哪里呢？五根，从心开始慢慢稳定下来，就要被观察、就要去调整了，而七觉支往往都是到近行定或者快到近行定的阶段，才能够比较清楚熟练地运用它。所以念觉支在这个时候是指心持续地安住于似相或者辩识似相，能够了解似相；择法觉支是透彻地理解似相；精进觉支是努力统合及平衡诸觉支于似相，要看到这时候的精进不是一股劲地往前走，而是努力地统合与平衡诸觉支于似相，以四正勤让所有的觉支被它带起来。精进是用柱子支撑着快倒了的屋子，是靠它支撑的；喜觉支是体验似相时内心的欢喜；轻安觉支是以似相为对象时，心与心所的宁静、舒适；定觉支是一心专注于似相；舍觉支是不使心太兴奋或者退出所专注的似相。"],[23,3196,3304,1,"1．令择法觉支生起的方法择法觉支就是对似相很了解。正确抉择似相和正确专注似相。什么是安那般那的似相？安那般那的似相就是光吗？如果认为安那般那的似相就是光，择法觉支就会有问题，有些人就会碰到困难。安那般那的似相是由专注相、入息、出息而形成的入出息概念，虽然它大部分呈现出光的颜色，帕奥西亚多说光是似相的颜色，内涵还是入息出息的概念，帕奥西亚多说就像一团密集的入出息的概念。从觉知入出息的相一直到四禅，似相都是入出息的概念，清楚地了知它，即使光暗掉了，那个位置上有那样的状态，那都算。这是择法觉支清楚地了知相。"],[23,3304,3419,1,"这里面帕奥西亚多引用《注疏》的内容，解释怎么让择法觉支生起来。第一要清洁身体和衣物。内处、外处都要清洁、整洁。第二亲近智者。智者已经彻知四圣谛和缘起。如果没有这样的智者，至少要和成功地修行止观禅的智者相处。如果你是一个初学者，最好跟比较有经验的过来人相处，而且这个比较有经验的过来人没有太多的自我认知，他的认知总是跟经典相符，这样就比较安全。再一个要思惟培育深奥智慧的境，思惟五蕴、十二处、十八界、四圣谛、缘起、以及揭示必须以深奥的智慧了知究竟法本质（无常、苦、无我）的经典，要这样去学习。这样培育容易激发择法觉支。"],[23,3419,3493,1,"但是修止禅的时候，并不是说一定要把深奥的五蕴、十二处、十八界、四圣谛、缘起全部经典都搞通一遍，那就没功夫俢止禅了。应该怎么做呢？当面对入出息所缘的时候，至少要知道什么是入出息的相？什么是入出息的入息和出息？什么是入出息的概念？什么是寻、伺、喜、乐、一境性五禅支？什么是五根？什么是七觉支？如何平衡五根？如何平衡七觉支？如何梳理削弱五盖？当心生起不善时，用什么方法去对治？修禅的过程中，定力迟迟不能得以培育，能不能找到原因？"],[23,3493,3666,1,"很多人讲可能巴拉密不够，帕奥西亚多说所有人都有足够的巴拉密。为什么？无始轮回以来你无数生地俢习止禅去梵天界，至少每一次劫末的时候，你都这么干过，怎么会没有巴拉密？如果你说你是二因结生，二因结生者要到这里来学《阿毗达摩》 ，到这里修止禅，难度太大了，一般都到不了这里，所以不要担心。2．令精进觉支生起的方法怎么能让精进觉支生起来呢？第一、思惟四恶道的苦有多么可怕。我们到现在还在轮回，根本原因就是无始以来修行的时候，不知道怎么去正精进，以致于我们可能多世地修行，但是一直都没有成功，然后在地狱、饿鬼、畜牲道里被折磨。在地狱里面五枪穿体、火烧、冰冻；在畜生道里面被罗网、中陷阱、宰杀、被关、被强迫、被棍棒击打、被其他畜生所食；投生在饿鬼界，长时间遭受饥饿、口渴的折磨；成为阿修罗，有巨大的身体，遭受各种痛苦。当信心不足的时候，像这些怖畏四恶道苦之思惟就不容易生起来。第二、明白修行是有利益的，要真正去思惟人活着总要获得点什么，要知道利益。懒惰的人不可能证悟九种出世间的果报，只有正确精进的人才能够获得。"],[23,3666,3811,0,"作为出家人，每天都受人供养，衣食住药都受别人的供养，比库每天都在思惟四种法，如果没有精进禅修，对得起施主吗？靠什么东西来回报施主呢？有一位年老的女信徒护持大友长老，把他当做亲儿子一样。有一天她准备去干活，就跟女儿讲：“我们这里仅剩有好一点的米、奶、酥油、糖，你用这个煮酥油奶饭，等你的哥哥大友尊者来的时候，你把这个饭连同奶、酥油、糖一起供养他。你也可以吃那个饭，我已经吃了稀饭和昨天剩下的冷饭了。”女儿说：“妈妈你中午吃什么呢？”她说：“你用碎米和野菜煮成酸粥，把酸粥留给我。大友长老住在一个山洞里面，这时候他刚穿好袈裟，拿着钵，准备出来托钵。他正念思惟： “我现在要怎么行走？”大友长老在那儿站立，他用天眼、天耳观察了一下一直照顾他的这对母女，听到了母女的谈话，当时他想：“这位年老的施主，自己吃稀饭和隔夜饭，并且中午只吃酸粥，却把所有好的饭、奶、酥油和糖留给了我。她并不期望从我这里获得田地、食物和衣服，她只是希望从她的布施里面获得善的果报，乃至出世间的果报成就。那我是否能让她获得这些成就呢？我不应该以贪瞋痴的心来吃她的食物。"],[23,3811,3888,0,"当时他就把钵放下，回到山洞里面，决意精进修行：“如果没有证悟阿拉汉，我就不出去。”由于长老过去已经精进地修行了很长的时间，他再度培育起观智，在这个时候，因为被这位施主的这种心激发，他的心很有力量，在用餐时间还没有到的时候，他就证得了阿拉汉果。这位漏尽者带着像盛开的莲花般的微笑走出山洞，住在山洞附近的护法树神、山神都向他礼敬：“至上圣生者，礼敬你，人中至上者，你的污染已经灭尽，你是应供者！”有树神跟他讲：“尊者，在供养食物给您之后，那位老妇女将会解脱一切苦。"],[23,3888,3966,1,"”所以当长老起来，入村托钵，就看到了准备好饭的少女已经坐在门口等着他。长老从她手上接过掺着酥油和糖的乳饭，少女就祝愿长老：“愿你快乐！”长老给这少女说：“祝福你快乐！”少女看到长老的脸色非常地不一样，有非常明亮的光泽，五根特别清净，脸就像脱了果柄的、成熟的棕榈果一样明亮。中午，妈妈从做事的地方回来，就问女儿：“你的哥哥长老来了吗？”女儿就把这一切经过告诉了母亲，母亲知道她儿子的出家生活已经在当天达到了顶峰，她说："],[23,3966,4066,0,"“宝贝女儿，你的哥哥乐于佛陀的教法，已经没有任何不满。这是思惟怎样才能给布施者带来利益而让精进觉支生起的例子。第三、思惟导师的伟大。佛陀确实非常地伟大，他从三十三天下来，八相成道，到最后捨弃命行大般涅槃了,一万个世界都为之震动。受伟大的导师所教化，在他的圣弟子僧团里面出家，或者在导师的正法还住世的5000 年时期里面，在家人持戒、禅修、布施，我们还有什么不满意的呢？这时候精进觉支就能够生起来。如果不努力，下一生还有没有机会遇到导师的法呢？这样思惟，精进觉支就能够生起来。"],[23,4066,4168,0,"第四、思惟佛陀遗产的殊胜。如果思惟佛陀留下来的信、戒、惭、愧、多闻、捨离和智慧，这七种宝藏（圣财、遗产） ，它们的确非常殊胜，对于不信的人或者怠惰的人，他们不可能完整地获得七种圣财。就像坏孩子，被父母断绝了关系——“这不是我的孩子，这是个坏孩子，不给你继承遗产！”同样地，没有精进的人不能获得七种宝藏的任何一种。再想：“我要获得这圣财，就需要精进。”当然还可以通过光明想、转换姿势、前往露天、或佛陀教导的其他去除昏沉睡眠的方法，思惟我们所行的道是诸佛、诸辟支佛、诸圣弟子所行走的趣向涅槃的道，懒惰的人是不可能走上这个道的。透过光明想、转换姿势、远离怠惰的人、与精进者相处、思惟四种正勤、决意培育精进觉支来获得精进，这是十一种精进事。"],[23,4168,4316,0,"在这里要特别提醒大家，正精进与执取不同，特别对于瞋性行者来讲。对贪性行者来讲思惟精进事是很适合的，而对于瞋性行者来讲，他往往是不待扬鞭自奋蹄，这时候经常是乱踢蹄，那是一个问题。瞋性行者和见行者的精进很容易跟邪精进、跟执取混为一谈。总是用在世间曾经成功有效地获得相应目标的方法来修习止观，在世间里面，一般人在获得成果的时候，往往跟贪瞋痴相应，就是抓取，逼迫自己使劲儿地干一段时间，或者把握控制，往往能成功。但是因为世间的目标所缘很多，可以不断地转换，我们讲：“努力干100 天或者努力干十天，我们就去好好地放松休息一下。”但是在俢习止观的时候，持续地专注一个所缘，是没有地方可以逃的，只有正确地面对这个所缘，才能够真正走向成功，这个过程是正精进。如实、自然、轻松、快乐地走在正精进的路上，才能够真正地去除五盖，获得证得禅那相应的内心素质。"],[23,4316,4440,1,"如果观察到在修止观的过程中碰到困难，但是从来都很努力，那就要好好地去省思，是不是总是把世间的努力方式带到了止观俢习上面来？如果有，就要调整，就要梳理，不把错误的知见和已经形成的不良习惯梳理出来、对治好，禅修是会碰到困难的。今天时间到了，后面的觉支有机会再讲。祝愿大家生起正精进，精进捨，早日证悟无上清凉的涅槃！萨度！萨度！萨度！"],[24,4,176,1,"177 讲-摄集-摄菩提分-身念处-四威仪 1古源尊者礼敬尊敬的祜巴长老！礼敬各位上座尊者、各位西亚蕾、各位贤友，晚上好！今天学习四念处二十一种方法中身念处的第二种方法——四威仪。在《大念处经》中，佛陀如此开示：「再者，诸比库，行走时比库了知：『我正在行走。』站立时他了知：『我正站立着。』坐着时他了知：『我正坐着。』躺着时他了知：『我正躺着。』无论身体处在哪一种姿势，他都如实地了知。」一、为何法不能入心？"],[24,164,320,0,"（一）提出念处的目标及修习方法的起因在学习四威仪之前，先了解一些与后面四念处课程相关的内含。今天与一位尊者讨论道：“我们的念处到底以什么为目标？我们应该怎样去修习念处？”起因是前两天，有一位贤友说他现在还有两座大山：一座是子女的大山、一座是他自己的大山。我问他：“你自己是什么大山呢？”他说：“我害怕老的时候没有人陪伴、孤独。我害怕死的时候没有人收尸。”我又问他：“你为什么会如此害怕？”他说：“我也不知道。Bhante，您觉得我为什么会这样呢？”我说：“当我们的心真有法时，不会感到恐惧。法入心时，会无所畏惧。你恐惧，说明法实践得不够，法没有入心。”他说：“Bhante，我持戒、布施、禅修、护持僧团，我在实践法。”他又说：“您让我实践法，我也实践了，为什么您说我法没有入心呢？”这真是一个很严肃的问题，对于我们修行者来讲，是一个非常严肃的问题。十种福德事总结为三部分内容——布施、持戒、禅修，很多经典中佛陀都讲要布施、持戒、禅修，这些包括了修行主要、核心的内容，我们都在实践，但为什么法不能入心？"],[24,320,513,1,"（二）作用现起与结果现起之前学习《阿毗达摩》课程心所部分的内容时，参照了帕奥西亚多《五大册》中对于心所部分的开示，西亚多依据许多经典注释以及《阿毗达摩》注释对其做了大量展开，建议大家学习。课程里特别强调：在分析每一个心所的相等四法（特相、作用、现起、近因）时，作用和现起的部分，很多心所都会涉及到执行作用和成果作用，作用现起和结果现起。比如有人说：“你要修慈，要有慈心！”慈的作用现起是什么？慈在当下现起的作用是不对他人起瞋恨，令内心不会产生对众生各种程度的瞋。慈生起时，即起到不起瞋恨的作用，也就是你的瞋心当下就被慈镇伏了。慈的结果现起有两个层面：1.它可以产生消除瞋恨的效果。如果你是瞋性行者，若经常修慈，可以产生消除瞋恨的效果；2.从更远的角度来讲，若能经常修慈心，则未来的果报现起是没有病难、没有危难等。修慈有 11 种功德：天人拥护、水火不侵……（1.安眠 2.安寤 3.不见恶梦 4.为人敬爱 5.为非人敬爱 6.诸天守护 7.不为火烧或中毒或刀伤 8.心得迅速等持 9.颜色光彩 10.临终不昏迷11.不通达上位亦得生梵天），这是它的果报现起。"],[24,513,597,0,"当我们持戒时，持戒的作用现起是三离心所的素质在内心的表现。为什么你不杀生、不偷盗、不邪淫呢？因为你的三离心所起作用了，它必须起作用！结果现起，从果报的角度来讲，如果你持不杀生戒，将会少生病、长寿，这是持戒的果报现起。同样地，布施的作用现起是去除悭吝；结果现起就是你未来会变得有钱、富裕、有财富。昨天迦提那袈裟供养法会，供养以佛陀为首的弟子僧团，产生的果报无量无边，像大海一样广阔，那个果报是它的果报现起。"],[24,597,711,0,"禅修的作用现起是要镇伏五盖。禅修的过程中要把五盖去除掉、镇伏掉，也就是前面讲‘入出息念’时一再强调的：禅修的过程是初禅三十四个名法不断地被培育，通过重复缘，不断地培育它的自然亲依止缘的过程；其结果现起是可以证得禅那、获得观智乃至未来成就道果。（三）实践八正道正念于心请大家省思一下，在持戒、布施、禅修时，有多少成分是把你的专注点放在作用现起上面？如果持戒是因为“我们是上座部的比库，我们是上座部的佛弟子，应该持戒。”或者因为持戒有五大功德：可以有大财富、有广大朋聚、有自信、临终不昏迷、往生人天，这是它的果报现起。但是很少有人说：“我持戒是为了培育我名色流里三离心所的缘力、它的力量。”有多少人能这么想呢？当我们在布施时，都在想：“未来会有很好的果报！”有多少人能想：“我现在是在对治悭吝”呢？"],[24,711,776,0,"当我们在禅修时，有多少人在想“我在培养成就初禅禅那名法的素质”？更多的人在想：“我什么时候证得禅那？Bhante，我怎么一直都证不到禅那呢？我什么时候成就道果？”所以我们持戒、布施、禅修时，都是期待未来的结果。我们付出、我们布施，是希望获得某一个果报，这本身有错吗？它似乎没有错，但如果你细想一下，会发现它同于世俗。我说：“跟放高利贷没有区别，对吧？”放高利贷时，你把钱放出去，期待着连本带利把钱收回来；而布施时想着“我通过布施未来会有很好的果报。有什么区别呢？你的布施只是为了获得果报。所以当你在布施时，”"],[24,776,981,1,"其实一点都没有对治你的悭吝，与炒股票、放贷没什么区别。如果带着这样的心持戒、布施、禅修时，法怎么能入心呢？法不能入心时，你还是会恐惧，法不能在心里面起作用。学习佛陀的法，都是要在当下能够透视五蕴以及五蕴生起与运作的因。五蕴就是苦谛，要看到它的苦，要看到苦生起的因。在修行的过程中，要根据苦以及生起的原因去正对治，正对治的方法就是八正道。能不能时时刻刻让八正道在我们心里面生起来呢？在应用每一个法类时，你能不能令它的作用现起真正地在当下起执行的作用？作用现起与结果现起对应到每一法的作用（相等四法里的作用），也有执行作用与成就作用的差别。执行作用是在当下解决问题；成就作用是在未来会带来什么样的效果，也是同样的。这是个非常严肃的问题。如果不去深刻地思考、去实践，对于法的应用就有如天与地的差别。在学习四威仪之前把这个问题提出来，希望引发大家去思考。其实，真正地理解它是不容易的、去实践它更不容易。我们总是带着世俗追求结果的习惯模式来修行实践，如果不能改变习惯模式，修行只是一种形式和隔靴搔痒，不能够真正地把法入到心里面、用法来武装自己、用法给自己带来信心和力量。"],[24,981,1125,1,"从五根到五力就是从本身具备的基本素质到能够形成修习力的一个过程。修习力的成长就是：当下，针对内心生起的每一个不善，能运用佛陀教导的对治方法去正对治。这是修行的根本。二、四威仪（一）如实了知现在来学习四威仪（身随观）。佛陀说“诸比库，行走时比库了知：『我正在行走。』”，对应到身念处的身随观就是威仪路的部分。无论身体所处行住坐卧任何一种姿势（行住坐卧只是总和，还有很多姿势，比如站着时有很多动作），都要如实地了知。如何了知呢？帕奥西亚多说“修习四威仪的开始阶段，‘行走时比库了知：『我正在行走。』’这句经文，即使是猪、狗、猫等畜生，当它们行走时，它们也可以了知自己正在行走。但是佛陀在此所教导的了知不是这种简单的了知，因为这种了知不能够去除认为有众生存在的邪见，也不能去除‘我’想。”"],[24,1125,1199,0,"有人说：“只要正念当下就可以了。”作为前提没有错，但仅仅如此是不够的，因为是“我在行走”，所以这不是佛陀教导的真正的念处法门，也不能真正地培育起念处。为什么呢？因为在他们行走时，无法以观智照见究竟名色法及其因，也无法观照它们的三相（无常、苦、无我）的本质。然而，此比库的了知能去除认为有众生存在的邪见，也能去除‘我’想，这是佛陀教导的念处法门，也是培育四念处的方法。因为当如此依着佛陀的教导行走时，他能以智慧观照名色、五蕴及其因，并且能看到无常、苦、无我的三相。"],[24,1199,1311,0,"《注疏》对此提出三个问题，分别是：“谁在行走？行走的是谁？行走为何发生？”。以下是《注疏》中对这些问题的说明：谁在行走？这是一堆五蕴在移动，没有众生或人在行走；行走的是谁？它还是五蕴，不是任何众生或任何人；行走为何发生？由于心理活动（五蕴中的四名蕴）生起风界（风大）的扩散作用，该扩散造成行走。所以比库了知：当“我要行走”这样的念头生起时，要了知：当“我要行走”这样的念头生起时，它会产生许多风界特盛的心生色聚。风界的扩散作用产生身表（身体的动作），而使身体向前移动，此状态称为行走。"],[24,1311,1374,0,"进一步解释：在行走的时候有两种色法 —— 一种是带动的色法，另一种是被带动的色法。“我要经行、我要从这里走到那里”这些心能产生许多心生色聚，一秒钟内有数万亿个心生起，每个心能产生许多色聚，每一个色聚中都有八种色法：地、水、火、风、色、香、味、食素。在这八种色法当中，因为“我要行走”这种心产生的心生色法风界特别强盛，风界产生身表（身体的动作），而依禅修者的意愿使身体动起来。由“我要行走”这个心所产生的色法，称之为带动的色法。"],[24,1374,1471,0,"被带动的色法指身体里已有的四类色法：业生色、时节生色、食生色以及由其他心产生的心生色法。如此，带动的色法与被带动的色法中都有心生色。只有意门心路过程心才能产生身表、语表，速行才能产生带动的色法；五门心路过程心与有分心不能产生带动的色法，只能产生被带动的色法。如五门转向、领受、推度不能产生带动的色法，只能产生被带动的色法，但它们能产生许多色法，包括有分心也是这样。例如在行走时，同时你也可以看见颜色、听到声音、闻到气味、尝到滋味（边吃边走）、感到触觉（感受到脚碰触地面的这种身的触觉）。眼、耳、鼻、舌、身这五门心路过程的心（除双五识本身不产生心生色法）也能产生许多心生色聚，有分心也能产生许多心生色聚，每一粒心生色聚都有八种色法，这些色法都是被带动的色法。"],[24,1471,1569,0,"对于一位尚未证得名色分别智、缘摄受智的禅修者来说，如果想修行威仪路，应该用什么样的态度呢？目标也要能生起这样的心“谁在行走？行走的是谁？行走为何？”。在以前的课程中讲过，一开始你可以不这么想，只是走，但是要知道身体的动作，要尽量地觉知。当你能够两、三个来回都能做到觉知没有妄念时，可以起一个念头“谁在走路？我为什么这样走路？我走路为什么这么大步？我为什么不能快一点走？为什么不能慢一点走？转弯时为什么我向左转？为什么向右转？”可以产生这样的疑问去问自己。帕奥西亚多在这里讲：你要更深一点，要知道虽然你还看不见，但要能够认知到：如此行走是由你的“想要走、想要经行”的心产生的心生色法里的火界来带动的。"],[24,1569,1673,0,"举个譬喻来说：这里有一条河流，如果你将树叶放到河水上，它就会向前流去；然而树叶不会自己向前流，只因为被水流带动而向前流去。我们身体的业生、心生、时节生与食生这四类色法就好比是河水上的树叶，“我要行走”这样的心产生的心生色法好比是水流，带动的心生色法持续地生起、移动时，被带动的四类色法也随着移动。然而，这只是依照世俗谛的语言所作的解释。依照究竟谛而言，每个色法一生起就立即坏灭，根本没有时间从一个地方移动到另外一个地方。但是由于带动的心生色法中风界所产生的身表，新生起的四类被带动色法不会在旧色法的地方生起，而会在新的地方生起。因为身表的推动，带动它的风界。因此人们产生色法在移动的错觉，其实色法生起就在当下灭去。"],[24,1673,1824,1,"如果想在行走时真正地以观智照见五蕴，我们必须系统地修行四界差别，也就是透由四界差别能见到究竟名色法。对于已证得禅那的止观行者来说就很容易。帕奥西亚多说：首先，在你开始经行之前，先站在经行道的起点。如果你的定力够强，那么你可以先站着入定，例如进入安那般那初禅乃至第四禅。出定以后，以那样的定力为基础，你应当有系统地修行四界分别观，见到色聚之后分析它们，并且有系统地辨别带动与被带动的色法。能辨别这两种色法之后开始起步，慢慢地行走，然后也要观照“我要行走”那样的意门心路过程。在那个心路过程里有一个意门转向心及七个速行心，意门转向心里有十二个名法，每一个速行心里有三十四、三十三或三十二个名法。这是在有观智的情况下能被观照到。这些名法是四种名蕴，带动与被带动的色法是色蕴，合起来是五蕴。行走的时候你必须有系统地观照这五蕴。能观照五蕴之后，还必须观照五蕴的因，即五蕴为何生起。然后必须观照五蕴及其因是无常、苦和无我。若能如此观照，那么你的观智就能暂时去除认为有众生存在的邪见，能够暂时去除我想。这就是在行走时修行念处的禅修方法（止观的禅修方法）。"],[24,1824,1947,0,"站立等其他姿势也以同样的方法来解释。禅修者了知：当“我要站立”这样的心生起时，它会产生许多风界特盛的色聚。风界会产生身表，而使身体由低下的姿势竖直站立起来（风界有支持的作用），这称为站立；当“我要坐下”这样的心生起时，它会产生许多风界特盛的色聚。风界会产生身表，使下半身弯曲而上半身竖直，这称为坐下；当“我要躺下”这样的心生起时，它会产生许多风界特盛的色聚。风界会产生身表，使身体水平地伸展或横卧，这称为躺下。在所有这些姿势中，你都必须观照五蕴及其因，然后观照它们为无常、苦、无我。如此，你就能去除认为有众生存在的邪见，并且能去除我想。这是在四威仪中修行念处的止观行者的修习方法。前面讲到“我要行走”的心会产生许多包含八不离色（地、水、火、风、色、香、味、食素）的色聚，其中的风界很强盛，若依照世俗谛角度而言，风界能造成身体向前移动；若依照究竟谛而言，风界使新生起的究竟色法在新的地方生起，而不是在旧色法的地方生起，如此总结而言。"],[24,1947,2030,0,"1. 谁在行走？在这里，“谁在行走？”是指尚未事先分辨促成原因与所产生的动作而提出行走动作之作者的问题。这是籍着（透由念处）否定“有一个我在行走”这样的邪见——我见，要认知到这纯粹只有移动的现象而已。换句话说，“谁在行走？”这个问题要透由念处而得到否定的答案，即否定掉我(没有一个我在行走)。因为根据《阿毗达摩》，没有作者或行走者，只有依靠因缘而生灭的名色法而已。这种名色相续生灭的现象称为行走，没有谁在行走。"],[24,2030,2129,1,"因此我们必须了解：在行走时，如果不能照见究竟名色法，而只是注意身体的移动，可以让我们的心不在外面乱漂，但那是不够的。为什么呢？因为它并不能解决那个问题——行走者到底是有我还是没我。它不能破除对我的执著，同时也不能观待行走形成的原因。关于站立、坐着、躺着时的修行方法也是同样的道理。2. 行走者是谁？“行走者是谁？”是倒装句，是“谁在行走？”的倒装，“谁在行走？”、“行走者是谁？”《注疏》以不同的方式来说明相同的道理，目的是要促成我们分辨所谓行走这个动作的成因。3. 行走为何发生？"],[24,2123,2196,1,"“行走为何发生？”这是寻找行走动作真正的、根本的原因。要寻找行走发生背后的原因，其实是最主要的问题。因为这个问题，从而否定有行走者存在的观念。这里显示出：行走是由于因缘和合而造成的单纯移动现象，除了那现象之外没有任何人或众生存在。行走并不被归因于如此的错误推理：“我与心接触，心与感觉器官接触，感觉器官与目标接触。”“由于心理活动而产生风界的扩散作用。”这些话是用来证明行走纯粹只是名色生灭的现象而已。若能如此观照，就可以做到经文中所说的：“行走时了知：‘我在行走’。”"],[24,2196,2409,1,"籍着提到心理活动，注释师排除风界的扩散作用与无生命的物质的关联。因为无生命的物质不能产生能够带动其他色法的心生色聚。籍着提到风界的扩散作用，排除了产生语言动作的心理活动。它只是籍着心理活动与风界作用来解释身体的动作。《注疏》中讲心会产生风界，是指心会产生风界特别强盛的那一类色聚。也就是说，当你有能力去观照时，要观照到：所谓的风界如何生起，又如何带动其他四种色法看似向前移动的整个过程。（二）心驱使，身体才能动作身体的动作由心驱使。当一位禅修者还未证得观智（名色分别智、缘摄受智）时，在日常经行如何去体验“谁在行走？”或“行走者是谁？”由于看不到完整的色聚以及每个色聚里的究竟色法，特别是不能立即清晰地看到无常、苦、无我三相，帕奥西亚多说“当我们只是了知身体的动作时，这是不够的。”为什么呢？因为它不能帮助破除我见——我在行走和我想。"],[24,2409,2603,0,"在还未能完整清晰照见时，如何破我见和我想呢？可以从这个角度去观待：先观察你在行走，虽然还看不到名色法，但你知道你在行走。在行走时，当能熟练地让你的心回到当下，这时可以起这样的念头：“我为什么这么行走？为什么我不能慢一点？为什么我不能快一点？为什么我总是向左转而不是向右转？”当你往后看时，会发现有一个习惯性的标准在让你这么做。如果是现代的纯观行者，有的西亚多要求经行时越慢越好。有一些西亚多说按正常速度就可以，也有一些老师建议要走得快一点，走得快一点妄念不容易生起来。如果你得到这些老师的教导，你自然会按照老师的方式去做，你是受这样的观念指导如此去做。如果你没有得到这位老师的教导时，不会有这些想法。如果你有我，那我是谁呢？我是那个观念？我是那个老师的教导？从这个层面可以看到：我们所有行住坐卧的行为，都是受你背后的心的驱使，受心的驱使身体才能动作。心的驱使有它的习惯，这个习惯的背后一定有它的认知，它认为这样来做是合适的、恰当的、应该的，认知决定行为模式。在道缘中：以正见导致正思惟，正思惟导致正语、正业、正命、正念、正精进、正定。"],[24,2603,2798,0,"若以邪见为主导，就是邪思惟，导致非正业、非正命、非正语，再导致邪精进、邪念、邪定。无论你是修行者还是普通的世间人，你所有的行为都依着道支，不会偏离。它受心的驱使，往后看都是一个个见解和一个个习惯（在见解指导下的习惯）。心里面哪一个习惯是你呢？它只是被某种认知指导下不断地重复而形成的一种心的惯性，只是自然亲依止缘的缘力而已。就像船受到风的推动而行驶，又像箭由于弓弦之力而发射，身体向前走或向后走也是基于同样的道理。从名色的角度上，完全由于风界的扩散所促成。正如木偶的背后有绑线操纵，同样道理身体木偶被心操纵，由心驱使才使身体行立动作。如果没有支撑的因素与条件，哪里能有籍着自己的内在力量，而能够行走站立的有情存在？在讲想心所时提到有慧想（有慧的想），帕奥西亚多当时是这么说，可能翻译得不是很精确、很完整，但基本的理路是明确的。帕奥西亚多说：“在六门与诸多身体的部位，当地大的自然力量很强时，在相关的色法里，如水大、风大、火大、色、香、味、食素，这些是随着地大一起现起的色法。巴利Sambhāra，翻译有很多角度，如材料、必要的成分、要素，也有尊者翻释为辅料、配料。"],[24,2798,2983,0,"但有一点很明确，这些色法以地大为首，与地大一起生起，或者说配合着地大一起生起的这些时节生色以地大为首，其他的色法遵循维持地大的特相，倾向于地大的特相。用世俗的语言来讲，我们看到的土地、泥土，就是一种以地大为主要特征的与其他色法汇聚的时节生色。这样的时节生色里地大的自然力量比较强，由于地大的自然力量在每一组物质里都很明显，所以土地、泥土显示出硬的特相。由于地大的力量很强大，在这种色法组合中，地大之外的其他的色法（水、火、风、色、香、味、食素），会遵循地大的性质，因此，由这样的时节生色组成的土地、泥土，也遵循地大硬的特性，所以说土地、泥土或者石头有硬的特性。虽然土地有以地大为主的特征，显示出坚硬的特相，但并非意味着其他的色法，水大、风大、火大的特相也变成坚硬，究竟法的特相不会改变，只是自然力有变化（如地大力量的增强或减弱）。土地的特点是地大坚硬特相的力量比较强，而水大、火大、风大的力量比较弱。"],[24,2983,3087,0,"同样地，火的物质主要是火大。当禅修者能辨别四界差别时，就能很容易地辨别出在火焰里也有四大。火本身只是一种声九法聚的聚合，火会发出声音，即是具有食素的八不离色的声音。当各种物质组合中，除了火大以外的其他三大具有比较弱的力量时，则跟随火大的特性。虽然火焰里的水大、风大、地大的力量比较弱，但并不代表火里面没有水大，这要理解。譬如空气，我们看到风筝在飞，知道空气也有八不离色，空气的特点就是风大的特相比较明显。你也可以辨别空气中的四大，看到色聚，在这种以风大为首的色法里，除了风大以外，其他三大也同样存在。在风里有地大、水大、火大，这些物质会追随力量强大的风大的特性。"],[24,3087,3230,0,"水也如此，在水里有地大、火大、风大，只是它会追随力量比较强的水大的特性。在行走、站立、躺卧、坐下乃至于看听嗅尝触时，面对所有果报时，在识知所缘，了知自己在行走、在躺卧或在坐时，我们如何生起基于慧的了知？如何生起与慧相关的了知？也就是说，当你在觉知身体与地接触时（脚接触到大地时），是身体里地大为主的色聚与泥土里地大为主的时节生八法聚的接触，是地大与地大的相互撞击，所以你的触觉就很明显。外在的土地的地大撞击到身体里身净色十法聚里的地界，身净色夹在中间，是明净色，明净色就像棉花、身体的地界就像砧板、外在的地界就像锤子，锤子敲打放在砧板上的棉花，棉花会受到强烈的撞击，即是身净色会受到强烈地撞击，可以这样去理解。"],[24,3230,3362,1,"对于看到的水，可以作意：“这是以水大的特相为首的时节生八法聚”；当看到火时，标记为：“这是以火大为主要特相的时节生九法聚”；当看到泥土、大地、石头时，知道“这是以地大为主要特相的时节生八法聚”；当吹拂着凉风时，体验“这是以风大的特相为首的时节生八法聚。能如此辨识时，就是有慧想——有慧的标记、有慧的想。同样地，在经行、走路时，脚提起来向前伸出，我们知道是身体里“要经行、要提起、要放下”的心产生的心生色聚里面的火界带动着身体的其他四种色聚在移动。能如此标记时，虽然还没有观智，但生起的是有智慧的想。为什么呢？因为你将破除“有一个我在行走”的固定的认知方式。再次提醒大家，帕奥西亚多说“仅仅正念是不够的。"],[24,3343,3479,1,"”（三）三种观智佛陀说：「如此，或于内身随观身而住，或于外身随观身而住，或于内外身随观身而住。或于身随观生起之法而住，或于身随观坏灭之法而住。」于此简单的一段经文中，佛陀教导了三种观智：1.缘摄受智；2.思惟智；3.生灭随观智。这段经文的意思是：在自己的行、住、坐、卧四威仪中观察究竟名色法及其近因为无常、苦、无我之后，还必须观照外在他人的四威仪中的究竟名色法，然后必须在一次修行时间里，内在、外在交替地观照。为什么呢？因为只观照内在的名色法不足以使你证悟涅槃；只观照外在的名色法也不足以使你证悟涅槃；若想证悟涅槃，内在与外在的名色法都必须观照。这是依着佛陀的教导以及注释书的解释来说明。"],[24,3479,3592,0,"佛陀继续说：「或于身随观生起之法而住，或于身随观坏灭之法而住，或于身随观生起、坏灭之法而住。」此时，你必须修习缘起法以观照远的因缘，即由于前世或过去的无明、爱、取、行、业生起，导致今生或现在的果报五蕴生起。这是观照因缘生。然后也必须观照由于无明、爱、取、行、业这五种因完全坏灭，所以般涅槃时五蕴完全坏灭，这是观照因缘灭。如此观照因缘生灭之后还必须观照刹那生灭，即五种因一生起后就立刻坏灭，果报五蕴也是一生起后就立刻坏灭，因此它们都是无常、苦、无我的。这是刹那生灭。在这个阶段，你必须观照这两种生灭。即要证得三种观智：1. 缘摄受智：观照因果关系的智慧；2.思惟智：观照行法无常、苦、无我本质的智慧；3. 生灭随观智：观照行法的因缘生灭与刹那生灭及其无常、苦、无我三相的智慧。依据帕奥西亚多引用的《注疏》的教导，如此来理解佛陀说的这段经文，当然还有其他的解释，在此不做说明。"],[24,3592,3681,1,"对于“或”字，有人理解为：“或”有不确定之意，可以这样也可以不这样；帕奥西亚多引用的“或”，是必须之意，即：你一时是这样，你一时是那样，并非是可选择的。你可以于一段时间观察内在、一段时间观察外在；一段时间观察缘起、一段时间观察生灭。不是说你只要观察生灭就可以证悟涅槃、或者你只要观察缘起就可以证悟涅槃、或者你只要观察色法就可以证悟涅槃、或者你只要观察名法就可以证悟涅槃，你必须名色法及其因都要观。对于“身”字，很多人望文解意以为“身”就是身体，看到自己的身体、看到别人的身体。《注疏》中说，“身”包括名身与色身，即包括了名色。kāya（身），既是名的kāya 也是色的 kāya。最后佛陀说：「他无所依而住，亦不执取世间的一切。」已经证阿拉汉，无所依而住了。"],[24,3681,3737,0,"「或于身随观生起、坏灭之法而住。他现起“有身”之念，只是为了智与忆念的程度。他无所依而住，亦不执取世间的一切。」当生灭随观智成熟时，就可以进一步修习坏灭随观智。佛陀说：「他现起“有身”之念，只是为了智与忆念的程度。」这段经文是指从坏灭随观智到行捨智的上层观智。当你的观智成熟时，四种道智与四种果智会逐步地生起，所以佛陀继续开示说：「他无所依而住，亦不执取世间的一切。诸比库，比库乃如此于身随观身而住。」"],[24,3737,3801,0,"为什么他能够独立地安住，不执著于世间的任何事物呢？因为他的道智灭除了所有的烦恼，所以他能够独立地安住，不执取一切的五蕴世间。在这里，修习四威仪的正念及正念的目标（五取蕴）是苦谛，正念的目标是五取蕴，五取蕴就是苦谛。昨天东达拉西亚开示中引用《金刚比库尼经》，经文中讲到“苦谛之外没有生灭，五取蕴之外没有生灭”。造成今生五取蕴的五种过去因（无明、爱、取、行、业）是集谛。苦谛与集谛这两者都不生起是灭谛。了知苦谛、捨弃集谛及取灭谛为目标的正道是道谛。"],[24,3801,3980,1,"如此精进地修行四圣谛之后，就能达到寂静。这是致力于修行四威仪的比库证悟阿拉汉果、到达解脱的方法。三、随顺于佛陀所教导的念知方法，生起有慧想对于一个还没有获得名色分别智的人来讲，日常中并非在修习真正佛陀所教导的四念处，那平时要不要练习四念处呢？我认为是必要的。如果你是位止观行者，修习十年都没有获得名色分别智，那你在行住坐卧时要不要念知呢？如果你觉得需要念知，该以什么样的方式来念知呢？这样的念知是不是随顺于佛陀所教导的念知方法呢？须思考。我认为至少必须练习随顺于佛陀所教导的这样的念知方法。什么是“随顺于这样的念知”呢？首先，生起对于念知、了知过程的认知是有慧的，要有智慧。帕奥西亚多引用《注疏》的角度：对于见到的所有色法如何生起有慧想？可以透由地、水、火、风四大的特相去观待，这样观待是有慧想。后面会讲到心念处、法念处，虽然还不能看到八十九种心、五十二心所、十二处、十八界等究竟名色法，但也可以这样观察名色法。在讲到心所时，比如生起贪心时，你能很清楚地感觉到“我生起贪心了”，贪心是什么样呢？就是想黏著那个目标，心想黏过去、扯不下来的这种状态，这是贪的特相。"],[24,3980,4156,1,"当你观察到这样一个心时，是观察到以贪心所为主要特征的一个名聚；观察瞋时，瞋的特点就是排斥目标，“不喜欢、我不要、我要逃开或者我要打击他”，打击他以致不要他、排斥他，当你观察到这样的心时，其实是观察到以瞋心所为主要特征的一个名聚。学过《阿毗达摩》的人知道瞋心有多少个心所，是瞋嫉（与嫉妒结合）、瞋悭吝还是瞋追悔，也可以观察到。当如此观察时，就是有慧的观察，只是这个慧没有观智那么强。慧根的特相是透视究竟法，对于不能透视究竟法的人，难道就没有慧根吗？显然不是。如果一个没有观智的人就没有智慧，那么在世间做的所有事情都是智不相应的，下一生就不可能三因结生了，显然这是没有道理的。只是在世俗上（没有观智时）生起的慧没有观智那么强，低阶的观智没有高阶的观智强，世间的智慧没有道智的慧强，但是不能说他没有慧。慧生起的标准是透视究竟法。尚未看到究竟法时，该怎么办呢？要看到以某一种特相为主要特征的色聚的组合和某一种心所为主要特征的名法的组合，这就是有慧想。依这样的观待去观察“我的心为什么生起来？为什么生起这样的心？”"],[24,4156,4311,1,"让大家去找，如果生起贪心，为什么贪？觉得喜欢。为什么喜欢？你有一个认为这个东西会给我带来好的感受的背后的标准。为什么排斥？为什么讨厌？因为目前的这个目标触犯了你背后的标准，你认为它不符合你的标准，它可能会对你造成伤害，或者给你带来不良的利益，所以你排斥它。首先，要看到贪心和瞋心后面的动机，看到动机其实就是后面的标准，标准其实就是我们的见解，顺着这个见解可以找到你的稻草人。你的见解显然是一个邪见、一个错误的见解，错误见解的后面都有更早以前的标记，要么你经历过、要么听人家说过，然后形成‘觉得这个很好、觉得那个有问题’的扭曲的、错误的想蕴标记，与贪相应的、与邪见相应的、与我慢相应的、或者与瞋相应的想，然后导致你有这样的行动。在这个过程里，也可以一定程度上看到：名色在当下生起的近因以及远一点的因。当然更远的是我们能力所不具备的，没有能力、没有观智就看不到过去生。通过这段时间的学习，很多做梳理的人已经可以从当下的一些惯性一直追溯到从小到大形成的那些习惯、原因，可以找出来了。这也是导致你现在行为最主要的因。"],[24,4311,4417,1,"当能看到这些时，就能够在相当程度上看到所有行为的惯性和背后的原因。如果你去拆解它，将会让很多的不良习惯得以改正，这也是在日常念处时特别需要了解的。今天先学习到这里，祝福大家都能够成就自己的念处，早日解脱一切苦。Sādhu！Sādhu！Sādhu！"],[25,1,189,0,"178讲-摄集-摄菩提分-身念处-四威仪 2&正知 1古源尊者一、四威仪上堂课学习了修习四念处的二十一种方法中四威仪的部分内容。佛陀说，修习四念处的行人可以一直证到阿拉汉果， 「他无所依而住，亦不执取世间的一切。」即可以透由勤修四圣谛达到寂静解脱。佛陀说， 『诸比库，于身随观生起、坏灭之法而住，他现起‘有身’之念，只是为了智与念的生起，他无所依而住，亦不执取世间的一切。』（一）阿难尊者的故事帕奥西亚多引用阿难尊者证果的例证。很多人可能对阿难尊者证果的方法有误解，在此特别加以解释。"],[25,189,418,1,"佛陀在成道后度过了第一个雨安居，回到故乡迦毘罗卫城（Kapilavatthu）。在那里住了一段时间后，他离开故乡，途中停留在一个芒果园里休息。有六位释迦族的王子在那个芒果园中跟随佛陀出家，包括阿难尊者在内。他们从佛陀那里学习禅修的法门之后，就前往王舍城的竹林精舍度过出家后的第一个雨安居。那时，阿难尊者精进地修习止观，并且在雨安居期间就证得初果须陀洹。他是如何证悟的呢？1. 阿难尊者修行身至念处阿难尊者精通八定，并且善于修行身至念处。什么是身至念处？在《中部·后五十经》里的《身至念经》中，佛陀教导身至念处，包括安那般那、四威仪、正知、三十二身分、四界分别观、九种坟场观、四种禅那、五种神通，依四圣谛而灭除烦恼。因此可知身至念处并不只是三十二身分，也包括其他的修行法门。"],[25,418,483,0,"阿难尊者专注于修行身至念业处。他以禅那为基础，
