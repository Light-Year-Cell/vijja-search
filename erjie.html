任何的礼节和伦常。人既不会尊重自己的母亲，也不会尊重母亲的姐妹，也不会尊重兄弟的妻子，也不会尊重主人的妻子，老师的妻子等等。这个世界将会没有人的妻子有尊严。因为惭和愧的缘故， 人与人之间的关系， 男女之间的关系才能得体， 这个世界才会有伦常的规则， 家庭才不会混乱，才有稳定的家庭关系、社会关系，不然母亲孩子，父亲女儿，阿姨侄儿，兄妹姐弟之间就会乱伦，没有约束，就像动物一样，像畜生一样。"],[12,1644,1704,0,"因为惭愧这两种法的缘故，一位有社会地位的人，一位出生尊贵的人，有教养的人，他会这样思惟： “像我这样的出生，这样的家庭，我怎么能做这样令人羞耻的事情呢？”，这是从家庭、出身的角度来看。上年纪的人会这样思惟： “像我这样令人尊重的老人、 长者、 老者，不能造作这种可耻的事情。，这是基于自己活这么大岁数的尊严，他为作恶而感到羞耻，认为自己要有自尊。一位有好教养的人， 或一位名门望族的后人， 他造作恶行， 会让自己的父母、 亲戚、 朋友、 老师蒙羞， 受到指责， 成为被嘲讽的对象。所以基于尊重家族的荣耀而不造恶、羞耻造恶。"],[12,1704,1770,0,"佛教徒会思惟： “像我们这样在学习佛法，修习佛法，训练阿毗达摩、 怎么应用在生活上的人， 我们不想作令人不耻的杀盗淫妄等犯戒的行为，很丢人啊，对不起佛教徒的称号，对不起佛陀弟子的身份啊！”，他有害怕，羞耻造恶。对于一个有智慧的人， 因为深信善恶因果、 缘起的法则， 会了知在造恶的当下伤害自他的身心、 损害自他的福利， 未来会感得不善果报；如果在临死的时候成熟， 将会导向四恶趣的结生， 沉溺在轮回当中远离解脱，从而退避、远离恶行。"],[12,1770,1818,1,"因为家庭、年龄、学识、智慧的原因，不能作跟这些不相符的不良的行为；年纪大了，不能老不正经，没有长者风范；老师不能够不为人师表。这些都是内心能够生起惭愧的理由。如果造恶的话， 我们的家长、族亲、亲戚会谴责我们，而且他们本身也会被谴责： “你怎么没有好好教养你的孩子，让你的家族、父母、亲戚蒙羞啊！”，因此生起害怕的心，这是愧恶。所以帕奥西亚多提到说“人们很容易对惭愧有错误的理解”。比如我们经常会听到说 “哎呀， 不好意思！”"],[12,1818,1875,0,"， 这个 “不好意思” 是不是惭愧呢？不一定。有些人是害怕或者不敢去造作善行，他也说“不好意思”。比如说你不敢或者不好意思在大众面前去做布施， 或者不好意思去找老师请教问题，或者不好意思在大众面前礼敬佛塔、供花、供香，乃至不好意思在众人面前持守戒律，人家说： “哦，今天去喝酒。”你不好意思说： “我持五戒。，怕人家笑话你，觉得持戒很刻板，是愚昧的佛教徒行为，那些不好意思、不敢啊、害怕啊，不是惭愧，很多情况下是因为自卑、 虚伪、 内心不正直， 甚至是虚诈、 狡诈、 狡猾， 打击自己，“我不行，我不敢”"],[12,1875,1950,0,"，这不是惭愧，这是瞋、自卑，是不善心，都是跟贪瞋痴相关的。害怕善行而产生的那种害怕属于瞋， 害怕造善行被别人看到、 害怕被别人说也不属于愧；相反的，如果一个人尊敬老师，敬畏老师，去礼敬老师的时候， 感到自己修学并没有达到老师的要求， 觉得很害羞， 或者在老师面前觉得老师在德行、 修学各个方面都很了不起， 在老师那种威德的映照下内心生起： “哦，弟子的修学真的很不够啊！”，这是惭愧。或者你去礼敬老师，穿的不整齐，袈裟吊吊的，夏天身上很多汗臭，脚也没洗，臭哄哄的去见老师，不恭敬，觉得丢人，赶紧去清洗一下， 整理一下袈裟， 这是惭愧。所以我们要分清楚惭愧是回避恶行，回避善行的害羞和害怕不是贪就是瞋。"],[12,1950,2029,0,"四、无惭&无愧（一）无惭的特相、作用、现起、近因无惭跟惭相反， 对于恶行或者不善心的生起不会觉得羞耻， 不会觉得不好意思， 也不会觉得这个行为、 这种心态是很恶心的， 他不厌恶不善，或者无耻为恶行，无耻于造恶，这个是无惭的特相。无惭的作用： 他不觉得无耻为恶是一件不恰当的事情， 从而无耻的从事恶行。无惭的现起：内心呈现的状态就是不退避造恶。无惭的近因：不尊重自己： “我就是这个样子了”无惭可以是无惭的人， 也可以是无惭的心， 或者是跟无惭的相近名法。无惭的人对于恶法不会感到厌恶，如同苍蝇之于粪便。在智者的角度， 贪瞋痴是导致这些不善心生起和维持的因。在佛陀、圣者、智者的眼中，贪瞋痴是很污秽的，令人厌恶的。"],[12,2029,2129,0,"如果一个人被贪瞋痴所蒙蔽，就会有贪瞋痴的行为，从事恶行。如同猪吃大便也躺在自己的粪便堆里面， 人们看到类似的恶行会觉得很恶心不耻， 但是猪本身会享受其中， 不觉得有什么不好意思。也就是说善心被愚痴黑暗所遮蔽的时候， 那个羞耻心， 那个惭不会生起来，也不会把这个行为视为危险， 因此他就不会尊重自己， 他的无惭行为还有被他人指责和处罚的危险， 被国王、 被雇主处罚的危险， 还有堕落恶趣的危险。（二）日常生活中无惭无愧的状态日常怎么来看无惭无愧呢？比如说很多家长都会骂孩子， 骂完以后又自责，跟孩子道歉，可是一再碰到孩子的问题，他又生气，他又再骂，骂完以后再自责，再道歉，如此重复就是不改。这个时候人家就会说“你看你对孩子的教育怎么这么失败啊！而且每次骂孩子的时候总是被孩子顶撞，乃至于行为上顶撞。"],[12,2124,2186,1,"，什么意思呢？我们骂孩子的时候是瞋心， 瞋心生起来呢， 因为所有的不善心生起来都有遍一切不善心的心所 —— 痴、无常、无愧、掉举，所有的不善心都是无惭无愧的。很多家长认为“这是我的孩子啊，我孩子就应该教育啊，我怎么就无惭无愧啊？我该打要打，该骂要骂。，对，这是世俗的观念。从阿毗达摩角度来讲，这种行为就是无惭无愧，就是你无耻于骂孩子、生瞋心，打孩子、无愧于打孩子，对这样的恶行你不会觉得羞耻，也不会觉得害怕，这是无惭无愧。"],[12,2186,2266,1,"比如说我们妄议政府、国王、领导、上司、雇主，你对他们随便批评，内心就是这种无惭无愧的状态。也就是说， 他在说的时候或者在做的时候， 他总是无视这个危险。他会认为 “我就是说说， 有什么了不起？”， 但是有惭愧的人他会知道 “这是很危险的， 领导是不能随便顶撞的， 工资是会被减掉的。政府是不能被随便挑战的，会被抓起来”。不信你回去跟你领导吵架，跟政府对着干试试看。有愧的人就会知道这些危险， 会退缩。无愧的人他不会看到这个危险。《注疏》里讲“像飞蛾扑火”"],[12,2266,2326,1,"，直接就会扑到火上去，不怕恶报，不退缩。即使受了很多苦，很多人也会赌一口气，“我宁愿苦我也不退缩”。我们经常讲说“记仇”，很多人喜欢记仇。我们在做梳理的时候，很多人都是五六十岁了， 小时候父母对他不好的脸色还记住， 记仇记了五六十年， 这个就是无惭无愧啊。哪怕身心都被仇恨纠结伤害得遍体鳞伤了，他还紧紧的抓住、记住，宁肯自己被不善心折磨死，也要牢牢记住它， 这个也是无惭无愧。无惭无愧不仅仅是杀人越货、 泼妇骂街、随地大小便的极端不耻行为。"],[12,2326,2399,1,"无闻凡夫在生活中的无惭无愧比比皆是， 当你对贪、 瞋觉得理所当然的时候就是无惭无愧。所以有些同学说“作为人存在追求好吃、好喝、好穿、好住，这是人之常情啊。，是，作为欲乐它是我们生活的基本保障，但当你贪的时候就会生起不善心， 不善心就会伤害自他的身心， 你敢于贪、 理直气壮地去贪、毫无羞耻地贪，这是无惭。瞋就更明显， 家里面先生跟太太吵架， 太太跟先生吵架， 打骂孩子，跟公婆吵架，跟客户吵架，跟领导吵架，每天咬牙切齿，然后记仇，三天、十天、两个月、一年、两年，没完没了。那种记仇的心，想害的那种欲寻、 瞋寻、 害寻的那股力量推着你像飞蛾扑火一样， 然后再给自己一个很好的名称，就是“维护我的权益”"],[12,2380,2458,1,"。权益要不要维护啊？当然要， 但是当你用贪瞋痴的心去维护你的权益的时候就是无惭无愧，你的内心里就有无惭无愧的心所。（三）无惭无愧的过患1.负面情绪带来的影响痴、无惭、无愧、掉举是遍一切不善心的心所。如果一个人他的负面情绪经常不断的循环重复， 心就会被无惭力、 无愧力所绑架， 这个时候他起来的就不是简单的无惭无愧， 无惭无愧就很有力量。他既不尊重自己也不尊重别人，说： “我自己付出努力赚钱自己花，享受一下，该吃吃该喝喝，什么叫无惭无愧啊？”"],[12,2458,2528,0,"，从世俗的角度上是这样。如果学习阿毗达摩的人就会知道， 贪心、 瞋心、 痴根心生起的当下， 是伤害自己的身心的， 是损害自他的福利的， 在造完这个业以后会留下不好的影响力， 在未来会产生不善的果报， 如果在临终的时候成熟， 就一定会把你带到恶趣里面去。所以从这个角度上来看， 我们要不要停止这个恶行？要不要羞耻这个恶行？要不要害怕这个恶行？2.无惭无愧的三种层次无惭无愧也有三种层次， 无惭无愧也跟痴一样， 像无明一样， 它们是遍一切不善心的心所， 它们总是相随相伴。无惭无愧也有随眠的层次、现起的层次、违害的层次。"],[12,2528,2650,0,"随眠的无惭无愧依附在无明和邪见当中， 无惭无愧跟无明和邪见在一块。无明隐藏得很深，邪见是无明纠集的，累积得非常的顽固，常乐我净的那种邪见非常的顽固。当随眠烦恼现行为在缠烦恼的时候， 无惭、 无愧会跟着一起现起。所以内心焦虑、抑郁，愁、悲、苦、忧、恼的时候，也就是无惭无愧现起的时候。你只要生闷气就是无惭无愧；发愁是无惭无愧；觉得很悲痛是无惭无愧；忧心忡忡是无惭无愧；贪婪瞋恨也是无惭无愧。无惭无愧令相应的名法跟它一起不退避不善行， 令到俱生的心识和其它心所都会忽视对自他的尊重， 从而一起不退避恶行。因为俱生的缘故，互相支持、互相依止，从随眠烦恼现行为困扰性的烦恼、再爆发成违害性的烦恼， 无惭无愧起到了当之无愧的作用。所以世俗社会对无惭无愧的认知经常是错误的。比如刚才讲到，佛弟子持五戒，大的动物不杀，蚊子也不杀，然后经常会遭来批评，说： “你们学佛学蠢了， 蚊子是害虫啊， 你知不知道？蚊子你不杀它， 它会传播传染病，你们佛教徒都是胆小鬼。"],[12,2650,2790,1,"，认为不杀蚊子是一种懦弱的表现。不杀生不是懦弱， 是持戒人的惭愧心和离心所在起作用。对杀盗淫妄的恶行会像羽毛遇到火一样的自动退缩， 不作、 不为， 乃至于不想， 乃至于完全不起这样的心念， 这是惭愧成为惭愧力的作用。有人因为工作要应酬， 因为持戒不喝酒， 有惭愧心不犯戒， 但是对于一个粗俗的人来讲他会说： “这有什么？喝一杯酒会死啊？”—— 这是无惭无愧。简而言之， 无惭无愧上升到力的时候， 就会经常被负面情绪困扰，严重的，如果不对外发作，则表现为抑郁症、焦虑症；如果是暴力的人， 就会对造恶无所畏惧， 乃至于无法无天， 这是很可怕的心理状态。（四）无惭力、无愧力与惭力、愧力的区别无惭力、无愧力，或者惭力、愧力，在我们的身心里面最后会表现为一种心理余势， 就是在我们心流里面形成惯性。这个惯性，一种是像基因一样从过去生一直留下来；一种是在家庭、 社会， 成长的过程中被塑造出来的， 被重复训练出来的。不管是从过去生带来的， 还是从小被训练的，他都是一个前提，就是在邪见引领下的恶性循环，所有的无惭力和无愧力都是在邪见引导下的恶性循环。"],[12,2790,2898,0,"如果我们培养惭力和愧力， 它同样也是一种心理余势。惭力和愧力是我们生命中很有力量的白法， 它可以成为基因让我们下一生心流里面继续拥有这样的惭力和愧力。因为有这样的心理素质， 在下一生的结生的时候往往能够有一个好的、 让你的惭力和愧力得以进一步深造增长的家庭氛围和教育环境。我们讲这个模因也会被加强。惭愧总是在正见的引领下得以循环， 所以惭力和愧力是在正见的引领下不断的重复， 重复到相当的强度， 它对对立之法的动摇就无法被击败。当我们有惭力和愧力的时候，无惭力和无愧力就没有力量，无惭无愧就生不起来。当我们不断的训练这样的能力， 信力、 精进力、念力、定力、慧力、惭力、愧力这七种力量，依着三十七道品不断地训练，最后我们会证得四道四果。"],[12,2898,2985,1,"（五）圣喜长老的开示：弱者、强者和智者圣喜长老曾经开示：在佛陀的教导下来看，有三种人。一种人是弱者。弱者不是指智慧低劣、 能力低下。弱者是什么呢？就是他总想着怎么对付别人，会算计、会计较、容易生气、暴怒、跟人家打架， 或者不跟人打架他会暗中使坏， 这个叫弱者， 用中国话讲就是小人。歇斯底里就是弱者， 有些不一定是小人， 但是他脾气暴躁，其实是因为内心不安全，这也是属于弱者。第二种人是强者， 强者的特点是什么？就是原谅。弱者的特点是报复，计较；强者的特点是原谅。"],[12,2985,3064,0,"我们经常可以看到一些人， 当他遇到不善所缘或者跟他的期待相违背的时候， 或者遇到跟他对抗的人的时候， 他首先会保持沉默， 而不是对着来。他保持沉默，而且他会原谅。我们经常说“看到他背后的期待”，别人暴怒或不合理、不理性是因为被自己的烦恼所左右，他背后的稻草人， 我们去看看， 我们认知移情， 看他背后的无明爱取，会觉得他很可怜，会生起悲心，这是强者，强者会原谅。如果你在当时可以给予帮助的话， 因为你是平静的， 你是理性的， 你可以帮助他，只要这样做， 那么这个人在未来， 情绪平静下来他会感激你， 这是强者。"],[12,3064,3131,0,"第三种是智者， 智者的特点是放弃。强者的特点会原谅， 智者的特点是放弃。无论外在或者内在发生任何事情， 他们都可以放弃。我们可以在经典上看到， 很多佛陀的弟子、 佛陀的追随者， 放弃了财产、放弃了地位， 乃至于国王， 乃至于妻儿， 放弃了一切， 寻求解脱之道，最后他放弃了烦恼、体征了涅槃。把烦恼放弃掉，这是智者。我们经常会面对不好的事， 我们能不能够不执着这些外在的果报而保持平静、放松的心？我们说“停下来，看看自己的心，看一下对方的心”"],[12,3131,3302,1,"。如果我们在这个时候生起智慧，能够帮助别人就帮助一下，有时候帮不了，我们就生起捨心，放弃。好的也可以放弃，不好的也可以放弃， 要练习这种放弃的能力， 最后我们要放弃这个世间， 我们要放弃这个五蕴， 这些东西都没有用。哪一天我们放弃五蕴， 放弃世间， 我们就完全的自由了。所以我们祝福大家能够在七力的保护下能够早日放下五蕴，放下世间，证得无上清凉的涅槃。祝福大家！sādhu！sādhu!sādhu!"],[13,0,238,1,"尊敬的祜巴大长老、 尊敬的各位尊者、 各位尼师、 各位贤友， 晚上好！今天我们学习 “类别概要” 的四种增上。四种增上在三十七道品里面叫四神足。四神足是指能够导向涅槃的素质， 但四种增上却不一定导向善或不善，它是中性的。四种增上就是：欲增上、精进增上、心增上和观增上，观增上也称为慧增上。只拥有其中一种素质的人，就会被称为：“对于他们来说，没有办不成的事，，更不用说四种都具足者。一、四种增上概述当四种增上是朝向涅槃、 朝向断除烦恼的时候， 我们称为四神足（iddhipāda） 。iddhipāda 翻译成“神足”，即成就的基础，或者叫神变的基础。意指拥有四神足就很容易在朝向涅槃的路上成就相应的上人法、 成就止观。注疏里讲， 这四种增上每一种增上都像转轮圣王。因为只能有一位转轮圣王， 所以这四种增上不会同时出现。我们学二十四缘的时候知道， 这四种增上也属于俱生增上， 属于名聚里面的心所。"],[13,238,325,0,"一个心里面的心所， 不可能同时出现多个增上， 当其中一种成为增上的时候，其他三种以及其他的相应名法，还有俱生的心生色法，都是它的追随者， 完全由它来支配。比如， 法住禅林刚刚完成七天的密集禅修， 你在这个密集的禅修营， 七天里面， 你有很强大的善法欲，在很强大的善法欲的统领下禅修。每天八小时、 十小时禅修， 吃完饭，稍事休息， 马上到禅堂来打坐， 全身心地朝向禅修， 不达目的不停息，这就是一种欲增上的状态。"],[13,325,417,0,"尽管这四种增上不可能同时出现， 但可能在某一个时间段里面交替地出现。密集禅修期间， 你有很强烈的想要禅修的欲望、 想要成就禅那的欲望，所以每天非常精进地禅修，想要每天去禅堂，有很强的欲，只要一没事就会上座， 这是欲增上；每天都很正确地觉知所缘， 不放下所缘、不放弃所缘，正确地让专注心生起，从不懈怠，这是精进增上；心心念念都在业处上、行住坐卧都在业处上，这是心增上；很正确地能够抉择到你的业处、 很清楚地了知业处， 它有观增上 （即慧增上） 的内涵。当你行住坐卧所缘都特别清晰的时候， 它就会让你对那个所缘特别地有兴趣，这个所缘会特别有力量。"],[13,417,488,0,"平常的时候， 我们行住坐卧都保持正念正知， 如果你行住坐卧时正念正知都非常绵密， 也就是我们讲功夫成片的时候， 这四种增上就可能会交替出现。在这种情况下， 你所有的名法和俱生的心生色法就完全地被这四种交替生起的增上缘统管起来。要明白这四种增上中， 除了观增上之外其他三种都是中性的。当我们导向善法的时候， 它能够迅速地让我们成就善法；当我们导向不善法的时候， 它也能够让我们迅速地造作不善法， 并且果报也能很快成熟。在造作不善法里面， 痴根心没有增上缘， 在痴根心里面不会有增上。"],[13,488,568,0,"（一） 、 四种增上之欲增上欲增上就是欲心所的增上。“欲”心所，它的特相是欲行动，想要目标；作用是寻找目标；现起是需要目标；近因是所希求的目标。在《五论根本附注》里提到：“欲望强盛者无事不办。，欲心所的特相就是想要目标、 想行动、 想要实行某一件事， 或者想获取某一些成就。（1、 ）欲与贪欲的区别“欲”心所的这种“想要”，跟属于不善的贪（贪欲）是不同的，这种“想要”本身是中性的，它跟美心所配合的时候，能够成为追求良善目标的善法欲， 只有与贪心所等不善心所配合的时候， 它才会成为欲贪。"],[13,568,744,1,"很多人觉得人的贪欲是不能够没有的， 如果人没有贪欲， 这个世界的科技就不会进步，社会就不会前进，这种想法是很错误的。世界文明，其实不是贪创造的，世界文明的创造者是欲，是“想要”。“想要” 跟贪结合在一起的时候才会成为贪欲， 它也是很强的一股力量。如果说世界文明是贪欲创造的， 那世界文明的毁灭者也是贪欲。如果世界文明其实也能够用善法欲来创造，而且力量会更大。看看我们佛教徒对于善法的追求， 对于善法的力量。法住禅林和曼听佛塔寺在雨安居期间都举办短期出家， 从全国各地来报名的人非常多。能舍去三个月的时间， 把家里所有的事情都放下， 到这里来精进禅修， 这不是一件容易的事， 这种力量就是善法欲， 这种力量比想在世间去赚点钱的力量更强。如果把心念转过来， 不是为了你个人的名誉、 地位， 而是为了全人类的福祉， 把这样的力量用在社会文明的推进和科技的创造， 同样可以创造科技文明、 精神文明， 而还没有贪，对世界无害。但只要有贪， 就是不善法， 它在生起的当下就伤害自他，在未来因缘成熟就一定带来不善的果报，是嫉妒和悭吝的始作俑者，而嫉妒和悭吝是世界不能够和平乃至于三十一界、 尤其欲界天以下不能和平的根本原因。"],[13,744,877,0,"所以，我们要正确理解什么是欲和贪欲。（2、 ）欲增上的表现欲增上怎么表现呢？当欲心所成为增上的时候， 想要获得目标或者达成目标的内在动力非常的强有力， 可以突破各种困难。我们经常“你这个人连坏事都干不了， 还能做什么？”， 就是一般人干坏事不用训练，一学就会， 如果连坏事都不会干， 说明这个人的生命欲望比较弱，没有想要获得目标的内在动力。当然，“不会干坏事”不是指我们持戒不干坏事那个概念，而是你叫他去做一点事，他做不了，这种人天生欲心所的力量就比较弱。如果一个人有很强烈的想要获得目标的动力， 他自己就会去努力， 去寻找各种资源， 尝试各种导向成功的方法。比如很多中国的修行者，都是遍地找、遍寻求，学汉传、学藏传、学南传，从汉地去藏地，从国内去缅甸、泰国、斯里兰卡，付出各种各样寻找正法的努力， 这是一种增上的方式。他的心完全被想达成目标的内在动力所驱使、 所支配、 所掌控， 这时候的欲就成为欲增上。雷迪西亚多说："],[13,877,981,1,"“这种欲望能激起这样的想法 ——‘若我今生不能获得此成就， 就不会满足而停步， 得不到还不如死了更好。’”。欲增上在华人圈里面很普遍， 华人非常勤劳， 除了精进以外欲增上也很强烈，精进是由于他想要获得的强烈愿望（欲）所推动的。很多年轻人都在为了自己的前途四处奔波，去北京叫北漂，去上海叫海望，去深圳叫深游， 农民工离乡背井到外地去打工， 都是因为有强烈的想改变自己生活现状的愿望、 想摆脱目前生活环境的愿望， 很多人在这样的努力过程中获得了成就。如果欲求解脱的愿望足够强大， 我们就会持续地为实现这个目标而倾尽全力。很多人做过统计： 这个世界上真正走向成就、 持续能成就的都不是那些非常聪明、 非常有背景、 或者家庭非常富有、 学识很高的人， 而往往是那些想要获得成就的欲望非常强烈、并且很精进的人。"],[13,981,1118,0,"前两天在缅甸帕奥沙玛内拉学院， 有一位华人小沙玛内拉在缅甸初级巴利考试获得第二名。当初他要去帕奥沙玛内拉学院前， 在国内初中毕业， 就是个学霸， 他爸爸说：“你要去学佛法， 我也非常欢喜。，当时他妈妈还在医院工作， 他爸爸就商量让他妈妈把工作辞了， 陪他儿子到缅甸去学习。这一家人对法的欲都是很增上的， 他们放下非常多世俗人认为不可思议的条件： 把工作辞了， 把孩子所谓 “大好前途”断了，让孩子去缅甸这样的地方（条件艰苦、世道混乱）学习佛法，这是一般人没办法想象的，但他们做到了。他经过三年时间的努力，成就非常显著。如果这一家人，爸爸没有欲增上、妈妈没有欲增上、孩子没有欲增上， 就没有现在这样一个缅甸国考 （巴利初考） 第二名是外国人的事例。所以，欲增上往往都是常人所不可以理喻的。我们在学欲增上的时候经常要看看自己有没有这种欲增上的特征。很多人说："],[13,1118,1255,0,"“修行不得力，没有什么进步，烦恼还是很重。，修行、 断除烦恼是要刀锋向内、 刮骨疗毒。你有没有想去除自己内心烦恼和断除欲寻、 瞋寻、 害寻的强烈愿望呢？有没有很容易验证： 你在上课、在分享的时候，可能讲得头头是道，但遇到逆缘、不可喜境界出来的时候， 特别是当别人否定你的学习、 否定你的能力时， 看看自己还能不能保有削弱自己烦恼的欲增上？如果有，你一定闻过则喜，至少你会如理作意， 很快回到自己身心上， 看到自己遇到这种不可喜所缘、 境界的时候， 内心的认知行为运作模式。找到生起来的这股不善力量， 找到它的无明、 爱、 取， 找到它的见颠倒、 心颠倒、 想颠倒，找到稻草人， 拆掉它。你有这样的心就是欲增上， 修行对你来讲就变得很容易。如果没有的话， 修行就不容易了。因为去除自己习惯上的这些烦恼是非常困难的。"],[13,1255,1352,0,"（3、 ）欲增上与后生缘欲增上除了有增上的缘， 也涉及到以后我们学二十四缘要讲的后生缘。为什么后生缘跟欲增上有关呢？后生缘是指后生的诸心、 心所法对前生的身体以后生缘为缘。如果你有欲增上， 欲增上欲什么呢？就是想要目标，用目标驱动。“结果导向、目标驱动。：用“我想断除烦恼、我想成佛”、“我要证得禅那，我要证得初果”这样的目标来激发我们现在的状态。你“想要获得…—— 这是未来的目标，这个目标能转化所有即将生起的心。将要生起来的心会以后生缘的缘力来支持我们当下的色身。当你有一个很强大的目标时， 就会发现自己浑身都充满了力量。这个力量从哪里来？一个是欲增上的力量，一个后生缘的力量，两者都有。"],[13,1352,1518,1,"（4、 ）欲增上在善法的表现欲增上表现在善法上， 最典型的就是我们的菩萨。菩萨不但有欲增上， 还有精进增上、 心增上、 观增上， 四增长都具足。我们的菩萨，为了成就佛果，具有强大的、牢不可破的、要成为佛陀的至上愿。菩萨的至上愿要强大到什么程度呢？“即使整个世界充满烧着火红的热碳及尖锐的矛，为了成佛，他会毫不退缩地踩踏、通过它们。，这是菩萨被授记之前需具备的条件之一，叫至上愿。这是菩萨的欲增上。欲增上要透由什么来引发呢？欲心所是通一切心的心所， 对于善法来讲，叫善法欲，它要透由信、慧，还有慈、悲、随喜这些心理素质来引发。就像菩萨， 他相信有佛陀这样的佛果存在， 而且这样的佛果具有超凡的智慧， 可以帮助到非常多的众生， 他信有这样的佛法存在， 可以帮助很多人。还有他想救度众生慈悲。看到很多众生由于无明而长夜轮回在苦海当中， 他要去救度他们。他以这样的心而生起要成佛的至上欲愿。"],[13,1518,1632,0,"（5、 ）欲增上在不善法的表现在世俗上，最常见的不善增上莫过于对名誉、地位的过度贪婪，所以， 欲增上对于不善法来讲， 总是很容易跟五欲的追求结合在一起，而成为对五欲的欲贪。除了五欲的欲贪之外， 瞋心很多情况下是因为贪而不得， 或者为了达成某一个目标而瞋精进， 其实也跟不善欲有关。举个例子，很多文化鼓励记仇：“君子报仇十年不晚。，牢牢记住别人一点点的不善， 有很强烈的复仇欲望， 这也是欲增上的状态。但是这种欲增上的“无明、爱、取”驱使的是瞋的心路、瞋的言行。有些从小饱受家庭虐待的孩子，内心会想："],[13,1632,1740,0,"“我长大了一定要离开这个家。，或者从小受很多苦的孩子说：“我长大了一定要离开这种苦。， 而为此付出非常大的努力， 这也是一种欲增上， 但往往都跟不善法结合在一起。佛陀时代， 毗琉璃王 vitatubha 屠杀释迦族也是这种不善的欲增上 的 典 型 事 例 。毗 琉 璃 王 的 母 亲 vasabhakhattiya, 是 释 迦 族mahanama 大名王的一个奴婢，当时的高萨喇（kosala)的国王巴谢那地王向释迦族求亲， 释迦族畏于他的权势就把 vasabhakhattiya 这个婢女当作公主嫁给了巴谢那地王，不久以后，她就生下了毗琉璃王。王子十六岁的时候， 回到释迦国去看望他的外祖父和亲戚。在离开释迦国的时候， 他的一个仆人因落下了物品折返去取， 回到皇宫， 仆人看到有一名婢女在用牛乳洗刷毗琉璃王子坐过的椅子， 这个仆人很好奇地问婢女："],[13,1740,1827,0,"“为什么你要这样擦呢？用牛奶来洗呢？”， 婢女告诉他“这是奴婢之子毗琉璃王子用过的。，不久这个插曲就成了众所周知的传闻。王子知道以后，羞愤无比，他发誓说：“现在他们用牛乳冲洗我的坐具，等我当上了国王，我将用他们的鲜血来洗刷它！”，就这样，“必将复仇”的强烈愿望成为了他的增上欲。这种由于自尊被深深地刺伤而造成的强大瞋心－－不善的增上欲， 导致他后来当上国王以后， 带兵残暴地屠杀了他的释迦亲族， 将他们几乎灭族。他以他们的血冲刷他的坐具，一如他过去的誓言。然而， 他也因此迅速得到果报， 在血洗释迦族返回高萨喇的途中， 夜晚扎营在河边， 当晚就被洪水吞没。毗琉璃王死后， 堕入地狱， 开始承受他无尽煎熬的生命旅程。"],[13,1827,1945,0,"一般不善的增上欲，会由贪、邪见、瞋、嫉妒所引发，它的特点就是由三颠倒而引发。二、 四种增上之精进增上精进增上是精进心所， 也是一个通一切心的心所， 是杂心所。它也是中性的， 在善心里是善的， 在不善心里是不善的， 在无记心里是无记的。它的品质取决于它所在的名聚是善、不善还是无记。精进心所的特相是努力或者忍受所面对的任何苦；作用是能够支持或者稳固相应的名法；现起是不放弃；近因是悚惧智或精进事。（一）精进的表现在前面学习了精进根， 精进根的作用是支持和稳固相应名法。精进在增上的时候，能够极大地支持和稳固相应名法，像一位勇敢者、非常强有力的勇敢者，或者像转轮圣王一样。"],[13,1945,2068,0,"精进在三十七道品里面属于四正勤 —— 已生不善令断除；未生不善令不生；未生善法令生起；已生善法令增长。四正勤对应的是当我们面对善法和不善法时应有的态度。所以， 精进根在五善根－－五种会导向涅槃的善法、 善根里， 也有调节五根平衡的作用。我们一般理解为五根平衡就是念心所来完成， 其实精进根也起这样的作用。面对你的禅修所缘的时候， 如果你打妄想了， 或者你抓取了， 这是不善，念一发现，你马上要调整 —— 已生不善令断除；持续地觉知目标，这是很好的， 内心有轻安， 轻安是因为正确地觉知目标得来的。所以这时候不是去专注轻安， 而是持续地正确地觉知目标 —— 已生善法令增长。精进就会去调整这个平衡。"],[13,2068,2196,0,"精进的另一个近因是精进事：一个人认为值得努力去做的、 不应该放弃的，就是精进事。在菩萨的本生故事里面这样的内容很多。（二、 ）精进的重要性精进在三十七道品里面出现了九次， 是所有心所里面出现次数最多的。精进有九次，念有八次，慧根有五次，一境性有四次，信有两次， 其他心所就只出现一次。为什么精进出现的次数这么多？我们可以从五根的信开始分析。信只出现了两次，在五根、五力，即信根和信力。信是什么？信心所的特相是对当信之事有信心， 它代表的是对目标有信， 对目标有信要付出行动来实现目标。换言之， 如果没有信心就不会有努力的目标。所以， 要达成目标通常需要先建立信心。信心从哪里来？信心从慧根来， 要有智慧去抉择， 要懂得择法， 要树立正见， 有正见我们才能对当信之事建立信心。信心建立了， 确定了生命目标以后，我们需要提升想要获得目标的力量，就是欲。然后，即使有欲增上这个转轮圣王， 它还需要精进的配合， 通过付出大量的努力才能够到达目标。也就是说，以慧来抉择，以信来确定目标，乃至于生起欲增上都还不够， 所有的点滴进步都要通过精进来获得， 所以精进必然最多。"],[13,2196,2278,0,"在日常生活中， 我们知道这个东西可以做， 做了也会成功， 但你如果不付出努力， 最后也是一事无成。同样， 如果确定了以涅槃为目标， 老师也指导了我们朝向涅槃的路径， 也有很好的老师来指导我们怎么去行走在这条路上， 但我们就是把修行当作调味品、 当作茶余饭后的甜点， 把禅修当甜点， 把学佛当作装点门面， 涅槃就跟我们没有关系。烦恼的灭除，是要透由“已生不善令断除，未生不善令不生，未生善法令生起，已生善法令增长，，持之以恒地、不放弃地精进，勇猛地面对自己的烦恼，一点一点地削弱烦恼、 提升善法， 才会从量变到质变，最后达成目标。"],[13,2278,2422,0,"（三）菩萨精进的故事我们要像菩萨一样让四正勤生起来。在本生义注中， 菩萨有一生（他的名字叫 mahajamaka）,他是一位王子，他的叔叔杀死他的父亲夺取了王位。当时， 王后已经怀上了菩萨， 她带上一些金银珠宝逃到了远离王城的一个地方，叫 kanacampa。菩萨长到十六岁那一年，他下决心要重返他的国家去夺回他的王位。他向母亲拿取了一半的财宝，备好货品，准备前往金地做生意。（以前从印尼，马来西亚一直到泰国、缅甸这一圈带都叫金地，盛产黄金） ，从印度到金地要渡过印度洋。他告诉母亲，他要去做生意挣钱，获得财富，然后回来，夺回王位。就在菩萨上船的那一天， 他的叔叔就开始生病。船在大海上航行了七天以后， 由于装载的货物太重， 遇到大风后船坏了， 海水灌进来。在茫茫大海中， 眼看着船就要沉了， 同船有些人开始悲伤哭泣， 有些人祈求神灵、 祷告， 我们的菩萨镇定自若， 他把随身携带的酥油和蜜糖混合在一起， 赶紧吃一顿， 再把两件干净衣服用油浸湿， 紧紧地裹在身上， 以增加浮力， 然后他爬到桅杆顶端， 静静地等待最后的时机。"],[13,2422,2487,0,"当船下沉以后， 船上的人就成为鲨鱼争夺的食物， 周围的海水变成了一片血红色。我们的菩萨站在桅杆顶上， 确定了国家的方向以后， 他从桅杆顶端一跃而起，跃过虎视眈眈的鲨鱼群，远远地落在离船 140肘尺的海中。就在那一天， 他的叔叔死了。菩萨在茫茫大海上奋力地游了七天， 这个期间， 为了避免伤害海里面的生物， 他只用海水漱口，而不食用任何东西。这个时候， 大海的守护女神突然想起来， 她有六天没有去留意海上的情况。当她看到菩萨的时候，她就想："],[13,2487,2533,1,"“如果mahajamaka 死在海上，可能我这个海神的天座都难保，因为菩萨有戒德，有很多善德。。所以，她就在离菩萨不远处现身空中，测试菩萨的力量。她以偈颂问他说：“远离陆地大海中，谁在奋勇向前游？有谁向你伸援手， 是你信赖的朋友？”。菩萨想：“这是我在海中的第七天，除了我之外，不呈现有任何其他人，是谁在跟我说话？”，他望向天空，以偈颂回答：“知道我自己，世间的责任，只要我还能，必定要努力。女神，在此大海中，陆地遥不及，我为男子汉，当尽最大力。"],[13,2533,2625,1,"。女神跟菩萨有好多的对话，最后，女神被菩萨所感动。菩萨“只要一丝力量存，我不屈服仍奋力。，女神非常赞叹他，她抱起菩萨乘空而去，把他送到米提喇这个国家。他的叔叔－－去世的国王膝下无子， 临终的时候交代大臣们， 为他的独生爱女所择的佳婿就是未来的国王。最后， 菩萨以超凡的智慧赢得了公主的青睐而登上了王位。菩萨过去生这个故事， 他的超能努力显然是他获得成功的先决条件。准确地说，就是他的这种精进努力，增上的精进心所，就像转轮圣王一样支配和统领所有的相应名法及俱生的心生色法一起朝向他所希求的目标。"],[13,2625,2710,0,"一般而言，一个人在海里泡上几个小时、 泡上半天， 身体就会浮肿， 人会虚脱。无法想象菩萨在海水里面泡七天七夜， 他还有力量来拼搏， 这都是依靠精进增上。精进增上除了激发它的相应名法－－同名聚心和心所之外， 还有俱生的心生色法， 也就是说， 他的欲增上和精进增上这种强有力的心所产生的心生色法也是非常殊胜， 这样的心生色法足以能够克服海水的冰凉和侵蚀、浸泡。（四）精进让当下充满力量在修行过程中， 大家有体会： 当把精进一提上来， 我们就会感觉心的力量和身体的力量同时都会升起来。所以， 心的力量会影响到我们身体。"],[13,2710,2777,1,"欲增上以俱生增上的缘力以及后生缘的缘力支持着我们， 而精进增上在那个当下就让我们的身心都充满力量。所以， 我们在修学的过程中要着力培养自己的精进心。当我们的心想懈怠、 放逸的时候， 我们应该观察到心的状态，思惟生、老、病、死，死神随时可能出现在我们面前， 以八种悚惧事来提策我们的精进。每天入睡之前， 我们省思：“我们今天是不是曾经放逸、懈怠？今天我是否为提升四正勤做出了努力？”。依十法经经常省思出家人十法，要经常这样提策我们自己。"],[13,2777,2849,1,"三、 四种增上之心增上心增上这个“心”指的是心识。心识的特相是识知目标；作用是作为心所的前导，因为它引领诸心所；现起是呈现在禅修者的体验，心是一个相续不断的过程；近因是名色， 因为心不能够不依靠心所和色法（无色界不需依靠色法）而单独存在。（一）心增上概述怎么理解心增上？我们常说， 这个人内心非常坚定；或者这个人的心很脆弱、 玻璃心；或者这个人的心很软弱， 你根本不能指望他能够强有力地帮你去推动或者完成一件事。这些都是指心的素质、 心的状态。"],[13,2849,2930,0,"心的特相是识知目标， 虽然心只是纯粹识知的过程， 但是因为它与相应心所俱生， 相互之间有俱生缘、 相互缘、 依止缘的影响。所以，作为先导的心识本身也具备了心所相应的素质， 成为相应的能知。虽然心只是一种究竟法， 但因为品质不同、 生起之地不同、 生起的位序不同和作用不同， 它会被再分为八十九种或者一百二十一种心。当我们讲心增上的时候， 其实是包含了心的整体素质。心增上对心相应诸法及由它而生起的诸色以增上缘为缘。增上缘缘法是增上的心识， 缘所生法是增上的俱生速行名色， 包括同一名聚里的其余名法以及俱生的心生色法。"],[13,2930,3072,1,"（二）心增上的作用心增上也是中性的。当它与不善心所相伴时， 这个心增上就是不善的，不善的心增上就是增上的贪心、瞋心，痴根心没有增上；对善心而言，有无贪、无瞋的增上。无痴的增上就是观增上。从戒的角度来看，有三个离心所：正语、正业、正命；在定方面就有一境性的增上；在慧方面，就属于观增上的内容。心增上，因为心是领导者，它包括了各种中性心所的增上 ——思增上、寻增上、胜解增上等等，这些都可以跟心一起配合，会被心引导。举例而言，以不善心做科学研究，研发杀人武器；小偷精心地钻研偷盗技术。这些是思增上、寻增上、胜解增上，再加上贪增上或者瞋增上。比如执着， 我们也可以分很多种： 有些人对自我的观念特别执着， 是我见增上；有些人特别喜欢漂亮的颜色， 有些人特别钟爱美妙的声音， 有些人特别喜爱馥郁的香水， 有些人尤其偏好某一种味觉，这些是五根的增上。上述表现我们都可以观察到。"],[13,3072,3149,1,"我们常说的十种巴拉密， 其实跟心所的增上有关系。明昆西亚多在《大佛史》中说：“巴拉蜜是那些以大悲心和方便善巧智为基础的圣洁素质，例如布施、持戒等，这些素质必须不受渴爱、我慢和邪见所污染。。从二十四缘角度而言， 这实际上具体表现为心所的素质和力量。这些不受渴爱、 我慢、 邪见所污染的圣洁素质最后是表现在 “心”上。菩萨的三十八种心所所具有的高尚圣洁的素质， 是通过一生又一生的培育、累积而形成并逐步圆满的，是以特别增上的方式去锻炼、训练、提升、累积、圆满，这些素质和力量经由无间缘、等无间缘、无间亲依止缘、自然亲依止缘的缘力不断地传递下来。"],[13,3149,3255,1,"心增上在某种程度上跟相应的心所有直接关联， 而且当一个心里面的某个心所特别强有力的时候， 它也会以俱生缘、 相互缘、 依止缘影响到其他的心所以及我们的心识。（三）心增上与修行的关系心增上跟修行什么关系呢？有道是：“心坚强者无事不办。，心增上的力量表现为只有当心足够坚强、 稳定的时候， 我们才能够面对和克服人生道路上的各种困难和诱惑。对一个要灭除贪、嗔、痴，取证涅槃的修行人而言， 更是如此。因为诱惑太多，一般人只是随顺着烦恼的自然取向或者动物性的选择， 任凭我们的生命在欲贪洪流的裹挟下于轮回中翻滚。然而， 要灭除烦恼的人是要逆流而上的： 对于世俗上认为该得的、该拿的、该赞同的、该反对的、该去做的、该回避的， 我们往往有着截然不同的表现， 这需要有着非常坚强、 稳固的心，犹如中流砥柱一般不为周遭的人、事、物所动摇。"],[13,3255,3394,1,"前两天一贤友来跟我说，他内心对于出家不出家的问题很摇摆。为什么会摇摆？—— 没有欲增上，也没有心增上。这需要训练。当我们的心能够心心念念在一个目标上的时候， 这个增上的心就会只选择某一类目标， 只朝向某一类目标前进， 其他目标就会被忽略。心是识知目标的过程， 你的心只识知这个目标。所以， 当你有心增上的时候，在你心里只有这个目标，没有其他目标。修入出息念的人，只有入出息，没有其他事。所以你有心增上的时候，成就就很容易。（四）心增上的练习方法作为一位佛弟子， 平时应该怎么练习心增上呢？《调御地经》 跟《算术师摩嘎蓝经》 ，佛陀教导了修行次第：１、一定要持戒，杜绝身、语恶行，让我们的心在身、语获得自由；２、守护根门，让我们的心在五根获得自由；３、 饮食知节量， 让我们的心在食物层面上获得自由；４、实行警寤，让我们的心在睡眠问题上获得自由；５、正念正知，让我们的心在克服散乱中获得自由；６、居住远离处，让我们的心在环境中能够远离不善、远离恶友；７、捨离五盖，心从五盖中获得自由；８、修习四念处，心从一切烦恼中获得自由。"],[13,3394,3511,0,"这些都是跟我们心的素质有关。４.1 心增上与人生佛陀教导我们八个步骤，为什么要这样做呢？在本生义注里有这样一个故事：有六位王子，他们住在王国的边远处。有一天，老国王召唤他们回到王城来，准备让他们继承王位。在途中，他们要经过食人妖居住的沙漠。据说，这些食人妖会变现为各种各样可意的目标来诱惑来者， 上当的路人就成为它的盘中餐。这六位王子进入沙漠以后，他们首先见到的是貌若天仙的美女，她们热情地挽留王子们，终于有一位王子抵挡不住诱惑留下了，成为了食人妖的美食。另外五位王子继续上路，这时候传来甜美悦耳的声音，有位王子动心了，他追寻那美妙的声音而离开了大家，也成为了食人妖的腹中之食。剩下的四位王子继续前行，这时飘来了馥郁的芳香，令人无法自持，有一位王子掉队了，他追随那迷人的香气，再度成为食人妖的饱腹之物。随后，美味可口的食物、妙不可言的触觉又分别俘获了两位王子。踏出沙漠的时候，就只剩下了一位王子。这些极为迷人的色、身、香、味、触对这些王子而言，这是所缘增上，导致他们的贪心生起，最后葬送了自己的前程和性命。"],[13,3511,3638,1,"最后那位王子，他何以能够面对色、身、香、味、触的美妙所缘而不为所动，走出食人妖的荒漠？因为他有心心念念要去成就、去当国王的心，有欲增上和心增上。这个故事比喻我们在渡越生死洪流的时候，一生又一生被五欲食人妖所俘获，心甘情愿地被俘获，这是修行者要特别注意的。剩下的那位王子，就是我们的菩萨，无论诱惑来自多么美妙的色、身、香、味、触，他都不为所动，最后成功地来到王城，并智慧地摆脱了食人妖的继续追杀，继承了王位。而菩萨成功靠的是什么呢？靠的是心增上。他的心极其地坚定、 稳固， 心无旁骛，完全不为外在的所缘、 外境所诱惑。所以， 就菩萨成功继承王位而言，这个缘法就是菩萨的增上心。这个心是贪还是善，具体取决于当时王子内心的态度：如果他是贪图王位，那就是八个贪根心之一；如果他是希望获得王位而利益广大的国民，那就是八大善心之一。缘所生法就是一路上伴随着这个增上心而生起来的其他名法和心生色法。具有增上心者只有一个目标，他不会为其他目标所动摇。"],[13,3638,3711,0,"类似的例子在世俗生活中也比比皆是。例如数学家陈景润，他心心念念在歌德巴赫猜想上，时不时把自己撞得头晕脑胀也不在意。有千种专利的发明家爱迪生，在他六十七岁时，他位于美国新泽西州的工厂失火了，价值两百万美元的设备以及他一生的事业 —— 大部分发明创造的记录， 都化为了灰烬。面对那场火灾， 爱迪生很乐观地说：“灾祸也有很大的好处，它把以往所犯的错误全部烧光了，我们可以从头再来。，这种超出常人的积极态度，也是心增上的一种写照。很多伟大的人物都有这样的特征。心只有一个目标、一个朝向，整个身心只是奔向这个目标而前进，这就是心增上。"],[13,3711,3783,1,"４.２心增上的练习对于佛教徒来讲，“八风吹不动”，哪八风呢？“利、衰、毁、誉、称、讥、苦、乐。，我们在世间无外乎就是面对这些内容。八风出现的时候，我们是不是能够真正地如如不动呢？朝向断除烦恼、灭尽烦恼、证悟涅槃的方向决不动摇呢？其实，如果我们有这个心，当“八风”出现的时候，正是我们观察、拆除自我构陷的生命围城的最佳时机，也就是找稻草人、看到我们无明、爱、取的最好时机。如果世间认定的这些得失，我们也认定这是得失；世间认为的那些毁、誉，我们也认为那是毁、誉；世间认定的称、讥，我们也认定是称、讥；世间认为的苦、乐，我们也认为是苦、乐 —— 如果这样，我们只会喂养、滋长无明与渴爱。"],[13,3783,3849,1,"其实，“八风”都是果报，永远不要对果报直接采取行动，要能停得下来，要能看到果报产生背后的因和缘；要能看到果报后面的无明、爱、取 —— 稻草人；也能看到你的对方，他做出这样的言行举止背后的期待，也就是他的无明、爱、取，稻草人。然后，你才能超越果报、 做出正确的行动， 把自己和他人的心带向善、 朝向善。所以，善的增上心应该有这样的素质，要这样去练习。《吉祥经》中如此开示：“接触世间法，心毫不动摇，无愁、无染、安稳，是为最吉祥。"],[13,3849,3928,1,"—— 这就是佛陀给我们的关于增上心的教导。希望大家能够透由精进的修学成就心增上，早日断除一切烦恼，证悟涅槃。祝福大家！Sādhu sādhu sādhu"],[14,1,124,1,"167 讲-摄集-生命的四食 1古源尊者尊敬的各位尊者、各位尼师、各位贤友，晚上好！上堂课学习了四增上之欲增上、 精进增上、 心增上， 今天继续学习观增上。一、观增上（慧增上）（一）慧增上的缘法、缘所生法观增上，也称为慧增上。在四增上中，前三种：欲增上、精进增上、心增上都是中性的，可能在善法上增上也可能在不善法上增上；而观增上，一定是在善法上增上， 不善法里没有观增上。观也称为智慧，所以观增上也称为慧增上。常言道："],[14,124,196,0,"“有智慧者无事不办。”这就是慧增上的内涵。在二十四缘里，慧增上的➢ 缘法：增上的慧根心所（慧心所）➢ 缘所生法：增上的俱生速行名色法，包括同一名聚里的其余名法与俱生的心生色法。作为缘所生法的俱生速行名色法， 包括三因的三十四速行心 （要有慧根就必须是三因的） 、 扣除了慧根心所的三十七种心所以及俱生的心生色法。“三因的三十四速行心”指的是八种智相应的大善心和唯作心、十种色界善心和唯作心、八种无色界善心和唯作心，以及八种出世间道心和果心。"],[14,196,372,1,"“三十七心所” 是指五十二心所扣除十四不善心所以及慧根心所后剩下的三十七种心所,亦即十三通一切心心所加二十四美心所（二十五美心所扣除慧根）。这是从慧增上能产生的缘力的角度来讲。那么， 观增上 （慧增上） ，在日常生活中或修学中是一种什么样的表现形式呢?（二）闻慧、思慧与修慧在经典中说，有三种慧，即：闻慧、思慧和修慧。1. 闻慧在佛法中的闻慧指的是藉由听闻正法而获得的智慧。能增长智慧的正法主要是指佛陀关于五蕴、 十二处、 十八界、 二十二根、 四圣谛、十二缘起支和二十四缘发趣法等的教导，即常说的蕴、处、界、根、谛、 缘。通过听闻正法而树立正确的知见， 通过听闻而提升择法能力。当我们能够深入学习蕴、处、界、根、谛、缘这些甚深的阿毗达摩法要时，内心深处就会生起一种非常清晰的择法慧，当拥有择法慧时，再不会被非法所迷惑， 在未来学佛的生命当中， 再不会堕入那些似是而非的仿佛说、非佛说或者外道、附佛外道的知见中。"],[14,372,527,1,"这种通过听闻获得的慧能帮助我们辨明学习佛法的正确方向： 每当我们学佛时， 这种慧就会现起， 以慧增上缘的缘力使我们能够生起学习佛法的智相应的速行名聚和俱生的心生色法。闻慧如果增上时，其他那些似是而非的知见就不会干扰我们正确地择法。闻慧， 除了佛法中的闻慧， 也有世间层面的闻慧。从世间法的角度来看，闻慧可以指各种科学研究，包括数学、物理、化学、生物制药、 脑神经科学等等。如果科学研究者是为了人类的利益而从事研究，他很有可能能够生起智相应的善心， 这属于正命的科技增上慧。然而如果研究者是为了个人的名利， 或者某些不可告人的目的， 比如为了杀人、 战争等， 那么他对此所生起的心就没有慧， 其研究过程或者成果只是通过寻、伺、胜解、想蕴的反复应用而达成。这么说是从整个行为是否以慧为基础来判定的， 即尽管他可能没有为人类谋福利的动机， 但是他在科学研究的过程中， 仍可能偶尔会生起一些伴随有慧根的善心。虽然他没有为人类服务， 但也没为自己牟利或伤害他人， 他只是很有正念地、 纯粹地做某项观察时， 可能偶尔也会生起一些伴随有慧根的善心。"],[14,526,679,1,"这是从闻慧层面上讲。2. 思慧第二种慧称为思慧。思慧也分为： 佛法思慧与世间思慧。在听闻的基础上， 通过思考、 推理所获得的思惟层面上的智慧， 称为佛法的思慧。佛陀在 《中部· 一切漏经》 中说：“诸比库， 有诸漏应由见捨断，有诸漏应由防护捨断，有诸漏应由受用捨断，有诸漏应由忍耐捨断，有诸漏应由回避捨断， 有诸漏应由去除捨断， 有诸漏应由修习捨断。防护捨断、 受用捨断、 忍耐捨断和回避捨断这四种基本上可以在闻慧阶段接触到并练习， 但是真正要上升到见捨断和去除捨断这个层面， 就要从认知行为上下手， 从习惯性反应上下手， 要改造整个认知思惟逻辑体系， 用现代语言来讲就是转变心智模式， 这个层面上的慧就属于思慧的范畴。这种思慧属于粗浅层面的见捨断与去除捨断。真正的见捨断是初果圣者， 完全的去除捨断要到阿拉汉。我们通过深入的思考而形成一种新的思惟模式， 这种模式在面对各种境遇时会让我们自然而然地转向如理作意，这是能够通过思慧而获得的。"],[14,679,766,0,"佛陀在《如是语·第一有学经》中说：“诸比库，对于尚未达到而希望住于无上解缚安稳处的有学比库， 我不见有其他一种内在的因素能如一种因素如此多的帮助。诸比库，此即是如理作意。诸比库，如理作意的比库能捨断不善，培育善。佛陀教导我们， 只要我们还没有证悟阿拉汉果， 如理作意就是我们捨断不善、 培育善的最有力武器。如何培育如理作意呢？需要通过闻法、 思惟法义以及实践法义来培育。在此基础上， 通过数数面对境界时的如理作意来改变我们形成不良惯性的认知行为模式、 转变我们的心智模式， 从而令我们获得一种正确的认知思惟习惯， 这种慧就称为思慧。因此如理作意是能够通过思慧获得的。"],[14,766,873,0,"实现这种转变之后， 当我们面对某种境界时， 我们会发现自己过往总是习惯性地被各种欲寻、 瞋寻、 害寻的反应带走， 当我们不断地训练， 就可以把过往贪嗔痴的习惯性反应改成如理作意的习惯性反应。而且这种能力是可以自始至终、 在大部分时候起作用的， 这种状态就是慧增上的状态。也就是说， 我们抉择后， 通过思惟训练所形成的这种强有力的如理作意能力， 就是慧增上， 包括我们很多的决意和向善的发愿。大家都听过沙利子尊者过去生的故事， 曾有一生， 他为国王的御用理发师。当时 Devadatta（提婆达多)的过去生想陷害国师（即菩萨的过去生） ， 让他打造一座非普通人能打造的花园， 我们的菩萨在沙咖天帝（Sakka，帝释天）的帮助下完成了，Devadatta 最后就跟国王说："],[14,873,948,1,"“花园有了， 让国师去找一位具有四种特质的花匠来打理此花园吧， 这即使是天人也造不出来。。这四种特质是什么呢？第一、没有任何欲贪；第二、从不饮酒；第三、对一切众生都充满慈爱；第四、 绝不会对任何人有嫉妒。拥有如此特质的人非沙咖天帝能造出来。国师（过去生的菩萨）看到国王如此刁难他，他想：若再留于此地， 必死无疑。所以准备躲到深山里去独自修行。此时沙咖天帝前来告诉他说：“那位国王的御用理发师，具有此四种特质。"],[14,948,1037,0,"”然后国师（佛陀的过去生） 请来理发师， 并带他去觐见国王， 国王问他说：“你为什么有此四种特质？”理发师 （沙利子尊者的过去生） 讲述了此四种特质是如何形成的。第一， 为什么无嫉妒？是因为他曾有一生做为巴拉纳西国王时， 拥有有一万六千位王妃， 但他只钟爱其中一位， 即便如此， 这位王妃也不满足， 在他外出平定战乱时， 每天派一信使回来向这位王妃请安， 但王妃都逼使这些信使跟她行淫， 即使有这六十三个信使， 王妃也未觉得满足。她又诱惑国师（菩萨），但菩萨不为所动。结果，国王回来后，王妃怕事情败露就恶人先告状说："],[14,1037,1115,1,"“国王去打仗时，国师想强暴我。，国王一生气就下令把国师杀了。国师在被杀之前告诉行刑者说：“你带我先去见国王，我把情况问清楚。”他对国王说：“往往人会受冤枉。” 其意是你要先查清楚再说。所以国王把那六十三个信使抓来询问， 他们供述了实际情况， 国王就决定把这六十三个信使和王妃都处死。国师说：“这六十三个信使是没有错的， 他们只是受了王妃的胁迫；王妃也没有错， 因为人总是被性欲所控制， 若不能够善加调服自己,是不会满足的。"],[14,1099,1251,1,"。最终国王饶过了这些人。理发师说，因为一个女人而把高尚的智者投入监牢，而这位高尚的智者却教导我行善，从那时起， 我就发誓不再嫉妒人。我当时因为听信这妃子的诬陷， 以为国师行非礼王妃， 先生起悭吝， 后生起嫉妒， 而决定要把智者杀了。当澄清事实后，决意从那时起不再生起嫉妒的心。从那以后，一直到他成为果德玛佛陀的上首大弟子， 这漫长的将近十万大劫的时间里，他再没有生起过嫉妒。这也是一种慧增上。这其中还有三个相关的故事， 例如： 1.为什么他不喝酒？是因为曾有一次喝醉了酒， 把亲生儿子的脖子扭断了， 让厨师去把儿子的肉做给他吃。清醒之后非常悲伤、 痛恨， 所以下决心不喝酒， 以土涂面，请大地作证： 从此以后直到证得阿罗汉果， 再也不喝酒。所以后来他再也不喝酒。2.为什么他总是对众生抱有慈心呢？因为他曾经修习慈心禅七年， 又投生到梵天界继续修习慈心七劫， 在轮回中总是向周围散播慈爱， 并以无限制的慈爱之心遍满十方而住。也就是说， 这种良善的习惯是可以被培养的。3.为什么他没有欲爱呢？下次分享。思慧是透由面对境界之后， 看到自己不良习性的过患而下决心改变它的能力。"],[14,1251,1408,0,"这种如理作意的慧增上非常强有力， 可以伴随十万大劫，一直到证悟阿拉汉。从世间法的角度来说， 思慧又是什么呢？如果说前面的闻慧 （世间的闻慧）纯粹是知识、研究层面上的，那么思慧就上升到了哲学、道德层面， 包括对于是非对错、 善恶好坏、 人生价值、 生命终极意义、良善治理社会等等层面上的思考和判断。这种基于哲学或者道德层面上的思惟、推理、确定，最后会推动良善社会制度的形成，包括建立宪法、法律、国民行为准则、文明社会的各种次序和特征等。这些思慧的抉择， 是人类在为了自身物种延续和生存的社会实践活动中所总结出来的更有利于社会安定、 保障人类福祉、 适合大家和平共处的一种群体生活方式， 也包括了一些特别规律的总结。本质上是逻辑推理，是通过对外在现象一些普遍性规律的观察， 总结提升到哲学层面、 形而上层面的智慧，这类世俗社会中的世间智慧也属于思慧的范畴。3. 修慧第三种慧是修慧， 修慧是佛法所特有， 与世间法不共的。这种智慧就如学慧根时所描述的， 可以像神射手般一箭贯穿目标， 如油灯一般地照亮目标， 透彻地如实知见究竟法的自性相和共相。"],[14,1408,1545,1,"自相是指究竟法以什么样的特征被我们识知，共相就是无常、苦、无我三相，能够彻知究竟法的自相和共相是修慧。为什么称之为修慧呢？这种慧不是在六根门接触所缘时自然生起的， 由于所有名色的自相和共相都被密集所覆蔽 （名色法的密集） ，心识在未经训练的情况下， 并没有能力当下即能破除这些密集、 透视究竟法而见到实相。这种慧是需要经过修习、 培育才能获得的， 所以称为修慧。修习过程中次第生起的十六种观智都属于修慧。能够破除名色密集的智慧称为名色限定智或名色分别智。当内心真实地生起这种智慧之后， 未来再面对这些名色时， 我们将再也不会认为， 色是恒常、快乐、有我、清净的；再也不会认为，刹那刹那生灭的名法中有一个常、乐、我、净的真我、灵魂、不变的清净种子这类永恒的东西存在。尽管我们在还未彻底地体证阿拉汉果之前， 在轮回的生命中可能还会退转，但是至少在这一生观智生起的当下是清楚了知实相的，这是修慧。"],[14,1545,1637,1,"如何理解修慧的缘法、 缘所生法与缘力呢？以观智、 道智、 果智为例。在观照名色的时候， 俱生增上缘的缘法是观智 （观智速行里的慧根心所） ， 它以增上缘的缘力支持作为缘所生法的四种智相应的大善心、 相应心所以及俱生的心生色法生起。随着观智的逐步成熟， 最后我们将证悟涅槃。当道智生起时， 缘法是道智 （道心里的慧根心所） ，缘所生法是伴随着道智生起的四种出世间道心、 心所法以及俱生的心生色法。同样地，对于紧接着生起的果智，缘法是果智（果心里增上的慧根心所） ， 缘所生法是伴随着果智生起的四种出世间果心、 心所法以及俱生的心生色法。"],[14,1628,1719,1,"四种增上大致学习到此， 希望大家能更顺利地投入到修慧的实践中，最后都能证得无上清凉的阿拉汉果。二、维持轮回的四食接下来学习四食。四食是四种与我们生命相关的食粮 —— 段食、触食、 思食和识食。段食， 亦称为抟食 （将食物以手捏成一团而食） ；触食，接触的触；思食，思惟的思；识食，识别的识。在二十四缘中有一种缘叫食缘。（一）食缘浅释食缘（āhāra-paccaya），经文：“抟食对这个身体以食缘为缘。"],[14,1719,1799,0,"”抟食就是我们的食物，对这个身体以食缘为缘。“非色食对相应诸法及由它而生起的诸色以食缘为缘。，“非色食” 就是名食 （名法的食物、精神的食粮），即触食、思食和识食。“非色食（名食）对相应诸法及由它而生起的诸色”——“相应诸法” 是指与名食俱生的（与它同时生起的）同名聚里的其余名法；“以及由它而生起的诸色”是指由此名食以食缘为缘而生起的心生色法。食的巴利语是āhāra，从巴利语动词āharati 而来。āharati 是拿起、自己承担、产生、支持、拿取之意。所以在佛陀的教义里，āhāra（食）具有很深广的含义，它泛指包括维持心理与生理一切生命所需的最基本营养。"],[14,1799,1855,1,"根据经文， 食缘有两种：一种是色食， 即抟食 （kabaḷīkāra āhāra） ，印度人一般将食物以手捏成团而食， 故名抟食；另一种是名食， 也称为非色食 （arūpino āhāra） ， a 意为非， rūpa 意为色，arūpino āhāra意为非色食。换言之，“食”包含了物质层面的抟食（色食）和精神层面的触食、思食和识食（名食） 。因为它们强有力地支撑、滋养、滋长、助长并维系着每个生命的延续，故称为“食”"],[14,1855,1973,1,"。佛陀以这四食教示了生命需求的现状。古论师说：“食缘强力支撑的缘力就好比强有力的柱子， 支撑着一栋陈旧的房子， 如果没有柱子的支撑， 旧房子在强风暴雨的吹袭下就可能倒塌。同样地， 众生受到色食与名食的支助， 缺少了这两种食他们就不能存活。” 所以，“食” 对我们的色身和名身 （我们的精神）起着支持和巩固的作用。通过食的缘力， 我们的身心得以存在、 巩固和成长。（二）色食缘色食泛指食物中的营养素， 所有食物里都有营养素， 在阿毗达摩中也称为食素，也就是每个色聚都有的地、水、火、风、颜色、香、味、 食素这八不离色中的食素。它对我们物质的身体有强大的支撑作用。学过帕奥西亚多的《智慧之光》或者修习过色业处的禅修者，就会很清楚。"],[14,1973,2063,0,"1.外在的食素与内在的食素食素大致可分成： 外在的食素与内在的食素两种。从身体的角度来看， 外在食素指的是纯属时节生八法聚的食物 （即我们每天吃的食物），不管是煮熟的还是没有煮熟的，都是纯粹的时节生八法聚。当然， 这个时代有不良的饮食方式——生吃活的、 生吞活剥， 如果这个食物是被生吞活剥的， 那么它可能还有业生色， 它不仅仅是食生的八法聚，还有业生色、心生色法。当你抓着一只活蹦乱跳的虾，蘸一下醋咬下去时， 它的心非常地恐惧， 所产生的心生色法也是与恐惧相应的心生色法；它还活着， 那么它的业生色还在其身体里。这是外在的食物。"],[14,2063,2244,0,"内在的食物， 是我们身体里四生色聚中本身所具有的食素。从外面进来的食物 （如我们每天吃饭） 如何转化成内在的食素， 又如何在我们体内产生作用呢？这包括两个阶段： 第一阶段， 由时节生八法聚组成的食物进入口中， 到达胃里， 在消化之火的支助下产生食生食素八法聚。这是第一阶段产生的内在食素。禅修者未来在修观智时， 或者修名色分别智时， 老师会要求从食物进入口中时就开始观察。其实， 嘴里的唾液就含有业生的命根九法聚， 这些命根九法聚里的火界——消化之火， 在食物进入口中时就开始支助这些作为时节生八法聚的食物， 让它产生食生食素八法聚。我们留意一下就会发现， 在非常饥饿的时候， 只要食物一到嘴里， 我们就感觉身体好像已经得到了滋养， 这是可以体会的。因为食物进入口中后就开始产生食生食素八法聚来营养全身的。当然， 从嘴巴、 食道一直到胃里， 食物主要是在胃里被消化， 在胃里面含有大量命根九法聚，从胃、小肠里产生大量的食生食素八法聚并散布到全身。第二个阶段是指， 当第一阶段 （从嘴里吃下去到胃里） 产生的食生食素八法聚得到其他色法的食素以及消化之火的支助， 或者它与消化之火一起去支助其它色法的食素时， 就能产生更多的新一代的食生食素八法聚， 此即第二阶段产生的内在食素。"],[14,2243,2352,1,"详细的内容以后学习二十四缘的食缘时再解释。当你们在修观时也能够很清楚地去观察， 例如： 业生色聚的食素， 在受到从胃里消化后到达业生色聚附近的食生食素的支助， 会产生多少代新的食生食素八法聚， 是可以被观察到的。我们的身体就是靠这些吃下去的食物在胃里消化后扩散到全身， 去滋养我们全身本来已经存在的四种色聚——业生色聚、 时节生色聚、 心生色聚和食生色聚， 去支助它们的食素以产生新一代的色聚。火界会支助四生色聚的火界， 火界也会产生新一代的时节生色聚， 所以身体的滋养过程是很复杂的。以后大家可以去学去看。"],[14,2352,2493,1,"2.食物对身体以食缘为缘如此观察后我们发现，食物对身体很重要，“以食缘为缘”。由于我们所摄入食物的食素以及火界的力量， 作为食物的时节生食素八法聚在胃里消化之火的支助下， 能产生时节生食素八法聚和食生食素八法聚。它们能遍布全身， 支助全身各处四因生的所有业生色聚、 心生色聚、 时节生色聚和食生色聚， 以使它们产生新一代的色聚。在这整个过程中， 影响最大的是食物里的食素和火界的力量。它们一方面影响到能产生多少代的新色聚， 另一方面也影响到这些新色聚的质量和特性。我们知道，地界的特相是硬、粗、重、软、滑、轻，水界的特相是流动和黏结， 火界的特相是冷和热， 风界的特相是推动和支持。作为食物的时节生食素八法聚中的四大所具有的特性以及强度， 会直接地影响到它去支助的那些四生色聚以及新产生的色聚的特性。例如有些人喜欢吃冰淇凌，冰淇凌色聚地界的特相：软滑；水界：只要含着就会化掉，流动性比较强；火界：冰冷。这样的冰淇凌吃下去，在胃里产生的食生食素八法聚也是冰冷的， 其火界也是低的， 输送到全身去营养四生色聚时， 其火界也是低的， 由那些火界而产生的新生色聚的火界也是低的。"],[14,2493,2568,0,"你吃完冰的食物， 全身都是冰的感觉， 就是这个意思。另外， 食物的消化依靠消化之火， 因此消化之火的状态也会影响到食物滋养作用的发挥。业生的消化之火会伴随着年龄的增长或者业力的减弱而衰退；同时， 消化能力也会受到其他因素的影响， 譬如所摄入食物的特性会直接影响消化能力的发挥。举例而言， 如果我们摄入大量生冷的食物， 或者边吃饭边喝冷水， 生冷的食物或冷水将需要消耗更多的热量 （业生消化之火） ， 当我们的消化之火不够强大的时候， 消化就不能够充分地完成。所以， 不适合的食物可能会影响消化之火的正常发挥， 令食物得不到充分的处理而导致无法产生许多代的新生色聚。"],[14,2568,2647,1,"所以我们常说：“吃什么就成什么”，或者“吃什么补什么”，乃至“病从口入”，为什么会“病从口入”？就是指食物对身体状态的重大影响。通常，一餐饭经消化吸收之后， 能以此方式产生食生食素色聚长达七天， 也就是说可以持续七天给身体提供养分。所以如果没有特别训练，普通人七天不进食就可能导致死亡。然而，天界殊胜的食物，据说其产生的新生色聚可长达两个月。论师说：“内外两种色食被称为‘食’， 因为它们强力支撑着由四因所生的内在色法， 并滋养着使它们可以坚固地存在， 历久地持续，以及没有被削减地达到它们寿命的界限。"],[14,2647,2799,1,"” 要知道： 想要长寿乱吃东西可不行。换言之， 我们籍由每天进食而得以维持生命至寿终， 或者说， 由令生业成熟而产生的新一期的生命还需要依靠抟食的食缘支持才能生存至业尽而死。3.药物对身体也以食缘为缘从上述理论来看， 药物对身体也是以食缘为缘， 药物对身体的作用也可以包含在色食缘内。无论是中药还是西药， 中药的原理是补偏。风界过盛时要疏风；中焦湿热阻滞，痰太多时，清阳之气不能上升，往往是水界过于黏滞造成的， 要化痰；中药能起作用， 就是以色食缘为缘。学习阿毗达摩食缘后就能明白药物为什么能起这样的作用。中医在治疗时， 依据地、 水、 火、 风、 食素、 命根这些特相去配制药物，以至于对我们的身体产生作用。不同的食物、药物，入口的、注射的乃至于外用涂抹、贴膏药、泡脚、艾灸，其实都是对身体机理产生影响，都属于食缘的范畴。我们的皮肤会吸收外在的色聚，所以涂抹、艾灸， 乃至于时节、 天气对我们身体的影响， 有一种是自然亲依止缘，还有一种就是食缘。这是食缘部分的简单描述。"],[14,2799,2970,1,"（三）名食缘1.触食、思食与识食接下来学习名食， 名食——触食、 思食和识食。从冰山理论来看，最底层是无明。无明，普通人可理解到的含义：一、认为这种轮回的生命存在是唯一可依靠的， 他无法想象不以生命的形式来存在， 这是无明。换言之， 他不知道有一种不能说是存在的存在、 不以生命的存在方式而存在——涅槃。不知道有涅槃的存在， 这是无明。认为生命是他唯一的皈依处。那生命的存在就需要有食粮， 要喂养它。为了这个生命的存续你得给它食物， 物质的食物和精神的食物， 所以四食放在第二层。由于不同的生命界对食物的感受不同， 所以第三层 （冰山图） 是三十一界的生命状态， 三十一界生命状态其物种存续和物种繁衍所需要的四种食物是不同的，不同之处如何体现呢？是受，感受。透由受来评价四食的优劣。感受靠什么来呢？靠接触， 接触完以后才有感受，感受完以后，好的追求抓取，不好的排斥规避，透由什么来完成呢？思心所、思食决定。"],[14,2970,3108,1,"“噢，那个好吃的我还要，那个人会骂我我要避开他。”这是思食。何以能令他的决意力、意志力生起呢？他要判断、要观察，识别目标是心识的能力，是心识的特相，这是识食的第一个能力。识食还有一个作用：滋养名色，“识缘名色”，识是我们生命存在的最根本原因。从图中可见，四食在生命的层次里，仅次于无明， 即它的深度、 隐藏的力量， 仅次于无明。所以人们常说：“食色性也”，因为它是最根本的东西。名食，即：触食、思食、识食。触，指触心所；思，指思心所；识，指眼识、耳识、鼻识、舌识、身识和意识。这些名食心所是与之俱生的名色法的食缘。"],[14,3108,3172,1,"为什么把每个名聚里的触心所、 思心所和心识列为食， 而不把其他列为食呢？触，是一种“食”，因为它能够强力地支撑着与它俱生的法，从可意和不可意所缘中摄取的精华来滋养其他的名法， 使它们能够坚固地立足并历久地持续。如果没有触食， 就无法帮助俱生名法去识知所缘。二十四缘中的第二个——所缘缘的力量跟“触”密切相关，即使有所缘，如果没发生触，以该所缘为目标的整条心路就不可能生起。你的心就无法去体会所缘的味道，也无法从所缘获得滋养。"],[14,3172,3347,1,"思，即心的意志，也是一种“食”。作为善心和不善心的名聚而言，思心所提供勇气以完成身业、语业、意业的造作，也就是思心所组织、 集合所有的相应名法去造业；当然， 对于唯作心和果报心而言，思心所则集合其他心所， 让它们执行唯作和享用果报的功能。如果没有思心所， 名聚就会像没有指挥一样发生紊乱， 各种名法就无法有序地完成各自的工作。识，也是一种“食”，其原因：1、识缘名色，无论结生时还是生命期间， 名色都是靠识来维持和支撑的。结生心生起时， 结生名法与结生色法是俱生的、 相互依止的， 如果没有结生识生起， 结生的名色也不会生起。在生命期间， 每个心的生起是靠识去识别目标的， 即使像有分心， 不识别当下的目标， 也是以上一生临死前的业、 业相或趣向为目标。在二十四缘中有后生缘， 后生缘就是： 后生的心以后生缘的缘力缘助当下身体的四种四生色聚， 也就是这个物质身体也是依靠后面生起的心来支撑的。例如：当一个人昏迷不醒或成为植物人，乃至于猝死的人， 全身冰凉只是胸口还有点温热， 就说明他死心还没有生起来，即使他心脏停止跳动、全身冰凉，这个身体也不会腐烂。"],[14,3347,3426,0,"一般医学说， 断气后， 脑细胞就完全损伤了， 但是有些人活过来后很正常， 这样的案例经常见诸报道。靠的是什么呢？只要他的心识还在，这个色身就不会坏掉；只要死心一生起， 身体就快速地败坏。以前做临终关怀时， 常碰到有些还没结束助念， 尸体的肚子就涨起来， 鼻血就流出来，里面就开始腐烂的现象。所以识食，识缘名色，无论是结生还是生命期间， 都是靠识来支撑和维持。2.它主导着对一切所缘的识知以及思惟。如果不能对所缘进行识知， 我们就无法对这个所缘生起后续的心路，对它采取行动。"],[14,3426,3526,0,"这三种非色食在滋养俱生名法的当下， 也同时影响着俱生的色法，这是由不同所缘引发与它相应的心产生的；同时， 这样的心产生的心生色法也会与之相应。举例而言， 有些人听到空灵的音乐， 心会产生相类似的空灵感， 俱生的心生色法就会让他感觉仿佛身体要飘起来一般。同样地，禅修者在禅修时，若无很好的禅修状态，会觉得身体很多地方是僵硬的、 脚也是痛的。而一旦有好的状态乃至于入禅， 这些身体的疼痛就不存在， 会觉得身心都非常地柔软， 这是殊胜的心生色法的作用。再譬如闻到殊妙的香气而感到心旷神怡， 身体也感觉很愉悦。所缘就是通过这三种非色食， 在影响心的同时也影响着俱生的色法。"],[14,3526,3650,1,"虽然食缘也有产生的力量， 包括抟食产生内在食素的作用， 触食引生整条心路的作用，但是就食缘本身而言，它更多地是起到支助的作用。能够令名法生起、 令心路生起这种产生的力量， 我们把它归结为所缘缘的缘力——缘法以所缘的缘力使缘所生法取它为目标而生起。而食缘所起的作用更多的是支助。名食是从触开始， 因为有接触才会有感受， 有感受就会取过去的想蕴标记由胜解心所作判断， 胜解心所做出结论， 思心所组织相应名法采取行动；由于触食的支助才有后面的过程。思食提供勇气以完成造业， 识食支助名色存在并主导对所缘的识别。"],[14,3631,3730,1,"名食对与它相应的名法、 和俱生色法， 能支助它们在相当长的一段时间里成长、 繁盛和兴旺。如何理解呢？譬如我们接触一个所缘之后， 若是殊妙的所缘， 你会长时间去回味这个所缘；如果是会造成痛苦的所缘， 你不单是几十年记住它， 甚至多生多世都会记住它。你的寻心所不经意地提取它， 就会有一串心路持续地生起。小时候的一个想颠倒影响一整生的习惯， 就是在过去所缘的支助下， 那个触、 那个思、 那个识这些名食缘吃下去后， 在名色流里产生的作用， 像小树一样慢慢长大到枝繁叶茂，好的如此不好的也如此。"],[14,3727,3803,1,"论师曾举例：“正如小鸟们，确定了住处之后，利用翅膀在空中飞翔， 从一棵树到另一棵树、 从一座森林到另一座森林， 以喙啄食水果，如此维持着它们整个生命。众生也是相似的，以六识确定所缘、以六思坚持抓取所缘、 以六触让所缘的精要显现——从而享受欲乐或承受痛苦。或者只是纯粹以六识认知所缘， 而促使名色的形成或生起。又或者只是纯粹以六触使所缘显现， 唤起感受而增长欲贪。又或者以思伴随着欲贪而造下种种的业行， 从一期生命再‘迁移’ 到另一期生命。应该如此去了解各种食能起到如此广泛的作用。"],[14,3803,3893,1,"”所以，色食和名食这两种食是有情众生能够持续存活的重要因素， 也就是 “一切众生依食而住”。如何来理解呢？又如何择食而食呢？下堂课再学习。愿大家健康快乐！我们回向功德。"],[15,0,136,0,"168 讲-摄集-生命的四食 2古源尊者礼敬尊敬的祜巴长老、礼敬各位尊者、各位尼师、各位贤友，晚上好!、关于四增上内容的补充前两堂课学习了四增上， 关于思慧的内容， 德升尊者提出， 思慧除了普通层面上佛法思慧与世间思慧， 也包括佛陀在证悟时思惟四圣谛， 乃至在证悟后思惟二十四缘， 这些也属于思慧的范畴， 在此作补充说明，也感谢德升尊者。上堂课学了四食，有几个错误，向大家道歉。1、猝死念成翠死，喙念成吻。"],[15,136,213,1,"理发师的四种特质，因为是临时插入的内容，有些错误。1 关于无嫉妒。无嫉妒是因为当时身为国王时，他有一万六千位妃子，其中一位妃子诬陷国师。故言，因为一个女人而把高尚的智者投入监牢，而这位高尚的智者却教导我行善，从那时起，我就发誓不再嫉妒人。他当时因为听信这妃子的诬陷，认为国师要强行非礼这妃子，他首先生起悭吝，然后生起嫉妒，最后决定要把这位智者杀了。当澄清事实后，他自觉这种行为很糟糕，所以决意从那时起不再生起嫉妒的心。"],[15,212,299,1,"2 关于不饮酒。过去生曾经因为醉酒，把自己亲生儿子杀了并吃他的肉，痛失爱子的感受令他饱受煎熬，从那以后，生生世世都戒酒了，再也没有碰过酒。3 关于无欲爱。因为当时的“恶童子”王子，他冒犯独觉佛时，当场渴死，所以发誓再也不对一切有生命和无生命的众生产生爱欲，这是无欲爱。上堂课时无嫉妒和无欲爱混在一起讲了。4 关于慈心。他的心中再也没有生起过愤怒和仇恨，是因为有一生曾安住慈心禅七年，后往生梵天界七劫。在轮回中总是向周围散播慈爱，并以无限制的慈爱之心遍满十方而住。从那以后，愤怒和仇恨在心中再也没有生起过。这是沙利子尊者的过去生，在前面的课程（有关的悭吝章节）里曾学习过这个故事。"],[15,299,424,1,"二、一切众生依食而住（一）民以食为天上堂课简单地学习了“四食”的一些初步内容。今天学习“一切众生依食而住”，佛陀说：“一切众生依食而住。如何理解 “一切众生依食而住” ？中国人有句谚语 “民以食为天”很能说明这个问题。当然“民以食为天”是指抟食的“食”。在《阿毗达摩》里的“食”是指抟食加三种名食，即名法和色法强有力地支撑我们的生命。从现实生活中，我们知道生命的存续需要食物。“民以食为天”—— 吃饭是天大的事情，是赖以生存的根本，这可以说是全人类的共识。然而却只有佛陀能把“食”分解得这么细，并对生命的成长和解脱作如此深奥的洞察。我们经常讲精神食粮， 但精神食粮到底指的是什么？不同的精神食粮对生命所产生的影响和发挥的作用有什么区别？它又以什么样的形式来产生影响和发挥作用？除了佛陀之外没有人能够对此有这么深刻的洞见。"],[15,424,507,0,"“民以食为天” 阐释了一个非常简单的事实 —— 我们需要食物。人们总是被饥饿这条无情的鞭子抽打， 只是没有体会过饥饿的人感受不到而已。其实稍微留心点就会发现， 才进食不久， 很快我们就感到饥饿， 并寻找新的食物。不仅这个身体仰赖食物而存在， 心灵也同样需要食粮， 那是因为内心也很饥渴——对所缘、 对目标的饥渴， 对于眼触、耳触、鼻触、舌触、身触、意触的饥渴。不管我们的色身还是内心，都无时无刻不在渴望着被喂养。"],[15,507,587,1,"佛陀在《增支部•第一大问经》中说：“一切众生依食而住。并开示了如何才能透过对依食而住的观察而获得解脱。佛陀说：“诸比库，比库于一法完全地厌离、完全地离染、完全地解脱、完全地见其界限、 完全地现观其义， 在当生而作苦之终结。哪一法呢？‘一切众生依食而住。’ 诸比库， 比库于此一法完全地厌离、 完全地离染、 完全地解脱、 完全地见其界限、 完全地现观其义， 在当生而作苦之终结。对于 “一切众生依食而住” 这一简单的事实， 如果能理解得足够深广的话， 我们就会发现佛陀这句话揭示了导致有情生死轮回的根本，以及如何断除轮回的真理。"],[15,587,735,1,"（二）渴爱是摄取四食的主因如上图， 因为无明， 我们以为生命的存在是唯一的， 执取生命存在就要喂养这个生命， 这是极其根本、 极其深奥的问题。你如何从对生命的喂养中解脱出来？四食缘于无明、 感受缘于四食、 渴爱缘于感受。向智长老指出，“渴爱与吸收同化是食的共同因素。” 他说：“从出生到死亡， 色身无止尽地追求物质的食物；心灵同样热切渴望它自己所需要的滋养， 渴望永远有新的感官印象以及不断扩张见解的领域。所以就食的广义而言，渴爱（taṇhā）是任何对食物‘摄取’或‘执取’的主要条件。这是物质或心理各种食物的首要共同因素。由于身体和心灵总是遭受饥渴的逼迫， 我们渴望着获得各种食物和滋养。饥肠辘辘的感觉大家一定都有体验， 甚至有时候并不感觉到饿， 只是见到美食就想吃， 或者到了吃饭时间就自然产生习惯性的条件反射。而对于心灵的饥渴，想必大家也不陌生。通常，人们都害怕空虚、寂寞、孤独，喜欢热闹、喜欢交友，吃完晚饭还要去泡吧。男人和女人对于相互的关爱和肢体的接触，更有着永不止息的渴望。从另一个角度来看， 我们的眼、 耳、 鼻、 舌、 身、 意对于色、 声、香、味、触、法总是有着无尽的渴望。"],[15,735,792,1,"我们渴望外出游历，饱览世间美景 —— 春天的生机、夏天的热烈、秋天的深沉、冬天的荒寂，都会勾起我们各种各样的想象和怀念；我们喜欢看海观日、 赏月望星、……，所有这一切都能让我们的内心生起我们称之为愉悦的感受。“还有远方和诗歌。”很容易令人遐想。远方和诗歌可以让我们放松。最近禅修有点累了，还有远方和诗歌。有人喜欢轻音乐，有人偏爱古典乐——中国古典、 西方古典， 有人喜好交响乐， 有人钟情于重金属音乐， 有人倾心于乡村音乐， 都只是因为这种音乐会触发我们内心的某一种感受，令我们感到愉悦。"],[15,792,876,0,"佛教徒喜欢请各种香， 名义上说是供养佛陀， 选择香味的时候却是按照自己的喜好来挑选。有些人喜欢大自然的香， 有些人喜欢勾兑出来的各种香， 各有偏好。女士们乃至于现在很多男士们也要在身上喷洒各种香水， 要么是自己闻着觉得神清气爽， 要么是想向他人显示自己的高雅品味。这也是为了满足内心某一种特殊的感受。一说到美食， 人们眼前就浮现出餐桌上那些美轮美奂、 令人垂涎的佳肴。但是谁又会想一想， 再好的美食一旦被我们放入口中后再吐出来，哪怕是你自己的，你也不愿意再吃进去了。而且，再美味、再滋补的燕窝、 鲍鱼之类， 在肚肠里走一遭之后， 出来的也全都是粪便。然而，为了一餐美食，我们可以花费很多时间、金钱，乃至于千里迢迢只为去品尝一顿米其林美食， 目的也只是一个， 希望获得那种与众不同的、自己觉得很特殊的味觉或者内心的体验。"],[15,876,924,0,"身体的感触更是如此。有些人希望被爱抚， 也有一些病态的人需要被鞭打、 虐待才会感到快乐。小孩子生下来， 如果得不到父母的爱抚，长大就会没有安全感。夫妻之间、男女恋人之间，如果彼此没有亲昵的举动，外人就会评价说：“这两个人的关系名存实亡。，他们自己内心也无法生起共同生活下去的欲望。日常生活中， 从一床松软的被子，一张舒适的沙发，到爱人的碰触、爱抚，种种身体的感受总是强烈地冲击着我们，给我们带来所谓的快乐和痛苦。"],[15,924,995,1,"试想一下， 如果生活中没有颜色， 没有身体的接触， 没有各种色、声、 香、 味、 触、 法， 我们将会成为什么样的人？一个过着世俗生活，没有经过佛法训练的人， 如果眼睛没有可看的、 耳朵没有可听的、 鼻子没有可闻的、 舌头没有可尝的、 身体没有可接触的， 他会变成一个什么样的人？他会觉得生命完全没有力量。很多人说：“我只要吃饱就行了。，即使他是再痛苦的人、贫苦的人，他吃饱以后还有家可以回，这是内心的一种期待，没有这种期待他的生命就不会有力量。由于贪欲、渴爱，我们需要“摄取”各种物质或心理的食物；没有食物， 我们就会觉得活得没有意思， 我们的生命就会丧失力量。普通人就是这样理解。"],[15,995,1048,0,"但是，如果你有经过佛法训练就不同。禅修的人他就会不一样，体会不一样。前两年在泰国， 被困在山洞里的那些足球队少年， 十几天时间在阴暗、潮湿的洞窟中，除了恐惧之外，看不到任何东西，他们坚持下来了。为什么？因为他们有个懂得教禅修的教练， 教大家专注呼吸。所以，并不一定要有各种美食，各种好看的、好听的、好玩的，各种身体的接触，你的生命才能有力量、才能生存，十几天时间就靠着专注呼吸活下来了。所以对于食物到底应该怎么去看， 这是个很深奥的问题。"],[15,1048,1102,1,"（三）身心对四食的吸收与同化我们的身心对于四食的吸收与同化是同步完成的，向智长老讲：“吸收的同时也是被同化的过程。。你吃什么就成为什么，不管是物质的食粮还是精神的食粮都如此。我们讲 “近朱者赤， 近墨者黑”就是这样，吃什么就变成什么。除了渴爱之外，“食”还有一个共同因素：“食物的吸收同化过程。在吃与消化的过程中， 外取的食物转化成内在的 —— 本来不相关的东西变成自体所有， 与自己的存在融为一体。有一句谚语说 ‘人吃什么就是什么’"],[15,1102,1173,1,"，这也同样适用于心灵食粮（精神食粮）。1. 中国人看抟食在抟食方面， 中国人对食的讲究可谓全世界最深入和独特的。中国人对食物的研究， 不像西方人那样去分析它的成分， 看它里面的各种营养素、维生素、矿物质含量、热量（卡路里），中国人讲以形补形， 吃什么补什么。例如五味入五脏、 五色入五脏 —— 红色的补心，黑色的补肾，绿色的补肝，黄色的补脾，白色的补肺。也有人说胃不好要多吃猪肚，肾虚要吃羊腰、猪腰，摔断了腿，多熬骨头汤喝能促进康复等等。这有没有道理呢？几千年来古人总结出来的经验肯定有其一定的道理， 这也符合佛陀关于抟食的定义， 也符合在学习色法时，地、水、火、风的特相，是相互关联的，不是没有道理的。"],[15,1173,1286,0,"与佛法所教导内容的相似性， 在中药上表现得尤为明显。我们很多中药， 例如： 藤状的东西常常被记录用在治疗经络的病， 祛除风湿、痹症有作用；挥发性的药物大多都偏热性， 开窍散寒；绿色的东西大多都偏凉性。所以我们说中医是比较接近究竟法的一门医学， 它强调的内容跟色聚里面相对应的地、水、火、风、色、香、味、食素这八不离色很相近。虽然每个色聚都有八不离色，但是一个色聚里面地大的硬、粗、重、软、滑、轻，跟另一个色聚里地大的硬、粗、重、软、滑、轻不一定是一样的；水大的流动、 黏结也不一定一样。修业处的人就能观察到， 比如说我们身体骨骼上色聚地大的硬跟皮肤上色聚地大的硬差别就很大 —— 皮肤上色聚的硬要远远地弱于骨骼上色聚的硬；唾液里色聚的水大跟肌肉里的水大也不一样， 唾液就是水性的， 肌肉里面的水大跟骨骼上的又更不同；冬天， 靠近脚趾头冰凉处色聚的火界跟靠近心脏的色聚的火界， 它们的冷热特相不一样；心脏里面色聚的风大跟骨头里的风大不一样。所以， 尽管它们都由地、 水、 火、 风、 色、香、味、食素组成，所呈现出来的素质却可以千差万别。"],[15,1286,1340,0,"佛法里面讲到四大调和，从中医角度上来讲就是五行相生相克、保持中正平和， 气血要充盈、 通畅， 而这些最后都表现在地、 水、 火、风上。如果出现四大不调， 中医治疗大多要求补偏， 哪个地方水大不调了， 例如中焦痰湿比较重， 就要多点陈皮来化痰， 广东人比较擅长；温病派认为这是有热， 要加点石膏清热；火神派认为是阳气不足， 要多吃附子， 都是要解决同样的问题， 只是通过不同的角度实现。有的从地大入手、有的从火大入手、有的从风大入手、有的从水大入手，它都能解决一部分的问题。"],[15,1340,1392,0,"再看颜色、香、味、食素，不同的物质有不同的颜色，所谓五色入五脏就是从颜色下手，中医说青入肝经。中医看药材，什么颜色、什么香、 什么味走什么经， 同一种中药因其产地不同而有药性的差异。为什么？因为不同产地提供给它的营养素以及外在环境不一样， 所产出药材的地、水、火、风、色、香、味、食素就不一样。又例如，东北大米养人，为什么呢?因为它的生产周期比较长。生产周期长产出来的大米香， 营养好， 它的食素比较强。而南方一年四季都可以种大米， 在缅甸可以种四季， 吃起来的味道就没法跟东北大米比， 因为它的营养素没那么强。而且， 东北大米是从黑土地长出来的，中国人讲“地气比较厚”"],[15,1392,1488,1,"。地气对应风大，地气厚补脾、增益脾脏。南方热带长的稻米， 显然没有这些基础， 就会差一些。我们看，东北人长得身材魁梧， 热带人长得相对瘦小， 这不是没有道理。所以说， 吃什么就成什么： 进食者在消耗食物的同时， 食物也在影响着进食者。2. 中国的吃文化—色食背后的名食中国人的吃文化， 色食背后的名食。为什么选择这样的色食， 其实背后是一堆的名食 —— 内心的期待。中国人有一些很残忍的吃文化，有句话说，某某地方的人，天上能飞的除了飞机，地上有腿的除了凳子,其他什么都能吃。但是，真的有必要这么吃吗？食物要解决的是饥饿、 色身存续的问题。但是这种文化背后所隐藏的却不仅仅是身体的饥饿问题， 还包括我们的触食、 思食和识食 —— 内在的期待，内心对这些食物的评判和看法。"],[15,1488,1572,1,"大家应该都记得，鲁迅的作品《药》，关于吃人血馒头的故事：华老栓夫妇为了给儿子治痨病， 向刽子手买蘸过人血的馒头。书中描述说：“那人一只大手，向他摊着；一只手却撮着一个鲜红的馒头，那红的还是一点一点的往下滴。，这就是新鲜的人血馒头。此时此地的馒头显然不是一种疗饥的食物， 据说人血可以治疗肺痨， 出自唐代陈藏器所编《本草拾遗》。可见，这种吃法既是一种治疗内容，也是一种文化。更可怕的是凌迟处死， 从犯人身上按一定的次序割下铜钱大小的肉脔，据说最高纪录是割了 3357 刀，凌迟三日，让受刑者痛不欲生却欲死不能。割下来的肉怎么办呢？史料中记载， 犯人被凌迟处死后，“受害之家，争取其肉以祭死者”"],[15,1572,1688,1,"；也有人说，某些部位刽子手会放在另备的盘中， 因为很多人认为这些人体部件能治病而重金求购，“以形补形”，这在中国文化中实在是司空见惯。而且，这样的酷刑往往是在大庭广众之下执行， 每割一刀， 刽子手的徒弟便高声向看客报数，人群中自然也不乏对刽子手的喝彩。由这种残忍血腥的触食所滋养的，怎么可能是一种健康良善的心态呢？在这样的历史背景下， 当今人们对种种鲜活肉食的追求就不足为奇了。生猛海鲜不过是平常之物，为了滋补，人们甚至活吃猴脑，吃刚死婴儿的肉，乃至刚刚流产、还没死的更好，很残忍的吃文化。这种抟食不是为了疗饥， 这是心理上的饥饿感——一种畸形、 病态的心理饥饿感。另一方面，当进食者消耗这些血腥的食物时，得到滋养、增长的必定是他内心的动物性，籍此提升身心是根本不可能的。3. 素食与荤食当我们提到素食和荤食， 吃素的人相对比较平和， 想生气生不起来。不同的食物对人的身体和精神状态会产生各种影响。另外， 心的状态也会影响我们对食物地选取。"],[15,1688,1767,0,"佛陀在《小部·经集》中说：“从前（还未宰杀动物前）有三种疾病：欲求、饥饿和衰老；宰杀动物后，就出现了九十八种疾病。这是说劫初时，人们只有三种疾病 —— 过饱（吃太饱了）、饥饿和衰老 （欲求在这里也可以理解为过饱） ；然而， 当人们开始宰杀动物，吃肉以后， 就逐渐出现九十八种疾病。这九十八种疾病可分为三大类：血液的疾病、 痰的疾病和风界的疾病， 印度这样分的。我们的身体可分为三十二身份， 依此每一类疾病又有三十二种， 就在三十二个身体的部位里产生血液的疾病、痰的疾病和风界的疾病，共有九十六种。另外两种是心的病和心所的病， 合共九十八种疾病。由此可见， 食物对我们的身心健康有着不容忽视的影响。"],[15,1767,1847,0,"4. 进食者在消耗食物，食物也吞噬了进食者进食者在消耗食物的同时， 食物也吞噬着进食者。“人吃什么就是什么”，同样，在精神方面，我们通过眼睛、耳朵、鼻子、舌头、身体，内心的思惟推理，把各种外在的知识内化为心里的各种思想、思考和判断， 通过各种感官的印象和多样化的体验， 我们累积自己对这个世界认知的内涵。我们对所有这些来源进行沉淀， 进行组合， 进行分析、判断、思考，从而形成我们对这个世界的认知，即所谓的价值观、人生观和世界观。然后，在此基础上，我们会对外在的所缘做出取舍 —— 需要的就拿来内化，成为滋养我们的食粮；不需要的、不想要的就排斥，就抛弃，乃至于怕看到它，想到它就会很痛苦（今天还有人哭）。对它们关闭六根门，不再思考、面对它，因为不想获得它的滋养。"],[15,1846,1954,1,"向智长老说：“因此，在心与身里，都有一个不断攫取与排斥、同化与异化、 与自己融合或疏离的过程。如果仔细观察物质与心理滋养的过程， 将可看到： 吸收的过程不仅是进食者在消耗食物， 食物也吞噬着进食者；它们之间有一个相互吸收同化的过程。有许多人随着他们所吸收或好或坏的观念而改变， 最后却是这些观念吸收并吞并了他们。。这句话很有意思，在食物与身体之间，如果我们摄入的食物有益于健康， 我们身体也就健康， 并能正常地运作；倘若我们本身对健康饮食没有正确的观念， 或是听从别人的不良建议， 那么食物也会损害我们的健康。例如当今极为常见的三高， 各种疾病， 或是落后地区因缺乏知识， 不懂得正确的营养。刚才提到的不健康的饮食习惯，乃至于很残忍的饮食习惯， 都会影响到整个人类、 整个民族的身心健康。"],[15,1954,2048,1,"食物不仅是普通的抟食， 也包括心灵的食物。如果我们所摄取的知识有助于正见的树立， 我们的心灵将能健康成长；倘若我们本身没有树立正见， 又身处邪见的密林， 我们就会被它俘获， 终其一生乃至于未来多生都会为此付出代价，而长时间地徘徊在生命的低谷。常有人讲：这个时代，大师多如牛毛。这个时代是傻子太多、骗子不够用， 到处各种似是而非的心灵课程。现在中国在清理课外辅导，这是很好的一个方式。什么是教育内卷化？教育内卷化就是你完全不知道怎样喂养给你孩子正确的食物。同样， 学佛的人， 学习佛法是为了解决心理的问题， 可是满地都是各种佛法、 各种心灵课程， 听起来都觉得很有道理， 喝起来都很甜， 心灵鸡汤。但真正解决问题了么？很难说。"],[15,2045,2104,1,"之前有位贤友， 他说他在上海参加了一个心灵课程， 他觉得非常殊胜。我问他：“怎么殊胜呢？”他说：“所有参加过的人都觉得他们说话、做事非常有力量。”“要钱吗？”他说：“要。先交两万，参加一个月的初级课程；如果要参加进阶课程， 再交两万， 又可以学习一段时间；此后变成旧生， 进入旧生阶段就终身学习。终身学习每个月交九百。，这样课程到处都是，如果没有点感觉也没人会去报名。我跟他说：“佛教从来都不要钱，你怎么不来呢？”他说："],[15,2104,2162,0,"“我佛教也接触啊，您跟我讲持戒，我也持了，我也禅修了。但是我现在处在生命的低谷啊，我走不出来。，生命的低谷你还拿钱去买这些东西？我们要知道： 你处在生命的低谷， 从业的运作法则来讲， 是你的恶业在冒头， 不善业在不断地成熟， 过去的不善业成为你这一生令生业的阻碍业，而且持续地出现。最好的方法是暂停所有生意、止损，因为你只要做一定亏。但他想找个能解决问题的,马上把钱赚回来，把窟窿补上，赌徒心态。他问我说："],[15,2162,2221,1,"“怎么办？”我说：“我们只能给你这么建议 —— 持戒， 再艰难的情况下也要持戒。先止恶， 再尽可能地行善。，你没有钱可以服务，可以来禅林，债主也不会追到禅林来，不好意思嘛。善行不需要太大的成本，要行善很简单，在家人打坐、正念经行，无需成本；然后每天诵《护卫经》、诵《二十四缘》，照顾好家人，不要乱跑；尽可能帮助家人，每天给亲人说句好话，每天回向；再不行到街头上帮人指路。有的是可以行善的地方。然后每天回向希望阻碍业早日消除、 支助业早日成熟。除此之外还有更好的方法吗？不可能。"],[15,2218,2291,1,"他跟我说想要交两万块参加课程， 这两万块钱是找别人借的。我问他：“我给你开的药方，你去做了吗？”，他说做了几天，但坚持不了。他就觉得， 这个不要钱的药方不一定有效， 交钱的可能比较有效。他又问：“Bhante， 到底怎么办？”我说：“你觉得钱多， 就继续咯。我说：“要不你把那个教主的照片发给我看看。”哎呀，相由心生，实在不好评价。我们能读出这位贤友内心的状态， 他真的很渴望有某一个人能通过某一种神通的力量， 让他获得某种所谓能量的加持， 令他的生命得到瞬间的改变。他说他很多朋友都在里面， 很多朋友都是像他这样想咸鱼翻身的人，钱不断地往里面交。"],[15,2291,2382,1,"基本上我们可以简单地判断， 这样一个以所谓心灵健康作为幌子来控制学员的课程就是传销机构， 这类骗子在国内外都特别多。他只要去参加， 他就用这种方式来喂养自己。刚开始可能是尝试， 由于没有正见， 他会随着所学而慢慢改变， 最后被这个传销机构所吞噬——成为他们中的一员， 然后回来再骗他的亲戚朋友， 就像他讲的很多朋友都在里面。他陷在里面，需要赚钱，只能再来骗自己的亲朋。所以“近朱者赤，近墨者黑”。善友或恶友是生命中很重要的同伴，同时也是一种食粮。善友、 恶友也是一种食物， 他会影响你的知见。知见、观念是我们生命中最重要的食粮， 八正道里第一个就是见， 以正见为先导。对于凡夫来讲没有中间的见， 不是正见就是邪见。见解从哪来？就是家庭、教育、社会、文化、宗教中来。"],[15,2381,2543,1,"（四）有智慧地面对四食我们如何有智慧地面对四食？佛陀关于四种 “食” 的教导有不同的层次。先不谈信仰，什么是智慧？常识就是智慧，基本的智慧。应该如何面对和选取色身以及精神所需要的食粮？要有基本的健康常识，不要被各种营养品的所谓永葆青春、包治百病、祖传秘方、纳米技术、 美国研制等等高大上的帽子所迷惑；也不要被某种吃什么补什么， 乃至吃人补人这种愚昧无知、 残酷血腥的观点所俘获。在内心的层面要树立因果的正见， 了解业的运作原则， 增长四圣谛的智慧。要知道什么样的精神食物可以摄取， 什么样的精神食物应该远离， 要懂得守护根门。这是我们面对四种食的第一步。要在生活中练习四念处，因为没有正念， 就会被已形成的邪念带走，一带走往往就回不来，而再地用各种各样错误的知见、错误的精神食粮来喂养你的身心。三、《子肉喻经》（一）佛陀开示《子肉喻经》的缘起关于四食，最著名的一部经典《相应部•子肉喻经》。在这部经中， 佛陀非常简洁但深刻地揭示了四种食对生命的折磨， 同时， 这也是佛陀对比库们非常严厉的教诫。根据觉音论师在 《相应部义注》 中的解释， 佛陀开示这部经的因缘是， 当时僧团得到很好的供养， 比库们收到极为丰富的食物和其他各种必需品的供养。"],[15,2543,2604,1,"如同现在， 比库们可以得到很好的食物和各种必需品。《义注》中说：那时，导师独处思惟：“……比库们能、亦或不能受用食物并具足把握食物真相的念与正知呢？他们是否能够中捨而无欲贪地享用这些食物呢？”佛陀看到有些刚出家的良家子没有省思而受用食物。见此，他如是思惟：“当我于四不可数和十万大劫圆满巴拉密时， 不是为了衣等资具之故而圆满， 而是为了至上果阿拉汉之故而圆满。这些比库在我面前出家， 也不是为了衣等之故而出家， 只是为了阿拉汉果之故而出家。如今，他们把非精髓当作精髓、无价值当作有价值。"],[15,2604,2663,1,"，他生起如 是法 的 悚惧 感 。他 接着 思 惟：“ 假 如可 能 制定 五 种巴 拉基 咖（pārājika，波罗夷），应制定未经省思而受用食物为第五种巴拉基咖。但是，不可能这么做，因为食物为众生所经常使用。因而，我将如是说， 使他们视之为犹如第五种巴拉基咖。我将为他们放置法镜作为防护和界限， 比库们应该能够如此一再观察， 在未来将省思后而受用四种资具。巴拉基咖是比库极重罪， 凡违犯者即失去比库身份。佛陀将未经省思而受用食物视如第五种巴拉基咖，可见这种行为的危害性极大，它能令为了解脱而出家的良家子无法达成他的目标。"],[15,2663,2768,0,"（二）抟食、触食、思食、识食四种食鉴于上述因缘，佛陀开示了《子肉喻经》。“诸比库，有四种食，存续已生的有情，支助寻求出生的有情。哪四种呢？或粗或细的抟食，触为第二，意之思为第三，识为第四。诸比库，有这四种食，存续已生的有情，支助寻求出生的有情。我们知道，所有佛陀的弟子都是为了达成“生已尽，梵行已立，应作已作， 再无后有” 这个共同的目标而修行的， 而不是为了再求出生。然而，由于无明与渴爱，有情执取生命。因为无明，不断地执取生命，就需要有这四食，所以在三十一界里轮回；为了轮回、生命存在又不断地寻求各种食物， 用受的方式去捡别， 而又对受产生三种爱；在三种爱的浸染中再发展成见解：欲取、戒禁取、见取、我取；然后形成各种心理习惯：正见寻、邪见寻；在生命的轮回中愁、悲、苦、忧、恼，生、老、病、死。由于无明与渴爱，有情执取生命，他们寻求生、不断地再生。"],[15,2768,2852,1,"1. 四食对色身与名身的重要性针对这四种食分别喂养及缘助什么， 以及四食的作用与怖畏， 《相应部义注》中作了如下的解释：食 （āhāra） 含有缘 （paccaya） 的意思， 因为诸缘支持 （āharanti）它们自己的果报。然而， 如果食的意思是缘， 众生也受制于其他诸缘， 为什么此处只提及四种呢？回答是：“因为对于内相续而言， 这四种食是最显著的。，即抟食、触食、思食和识食是最显著的。就摄入抟食维生的有情而言， 抟食对于色身是重要的缘；而对于名身，触对受、思对识，识对名色也是重要的缘。因此佛陀说：“诸比库， 犹如这个身体依食而住， 由于食而存续， 没有食则不存续；同样地，触缘受、行缘识、识缘名色。"],[15,2852,2954,1,"，此处的“行”等同于业行之思，即思食。2. 四食各喂养及缘助什么？那么，四食中的每一种各喂养（āharati，缘助）什么呢？抟食喂养及缘助食素为第八的色法，即包含四大，地、水、火、风、颜色、香、味与食素的纯八法聚。抟食被放入口中后，即刻会产生纯八法聚。所咀嚼、吞咽的每一口食物都会产生同样的纯八法聚。这个过程我们在学习“色食缘”食素等课程时曾讲述。以此方式，抟食喂养及缘助食素为第八的色法。触食喂养及缘助三种受，即乐受、苦受与不苦不乐受（舍受）。被体验为乐的触食， 触一生起即喂养和缘助乐受；被体验为苦的触食，喂养及缘助苦受；被体验为不苦不乐的触食， 喂养及缘助不苦不乐受。以此方式， 所有种类的触食 （眼触、 耳触、 鼻触、 舌触、 身触、 意触）均喂养及缘助三种受。没有触我们就不能生起相应的受。"],[15,2954,3037,1,"思食喂养及缘助三有，即欲有、色有、无色有，分别指欲界的生命、色界的生命与无色界的生命，以及三界有漏的善业、不善业。思食作为导致欲有之业时， 喂养及缘助欲有；作为导致色有或无色有之业时， 则喂养及缘助色有或无色有。所有情况下的思食都如此喂养及缘助三有。识食喂养及缘助结生名色，“识缘名色”。以人类的结生为例，识食在结生刹那喂养及缘助与它相应的其他三种名蕴——受蕴、 想蕴、行蕴， 并以俱生的方式喂养及缘助三十种色法以及三种相续生起， 即身十法聚、 性根十法聚与心十法聚。以此方式， 识食喂养及缘助结生名色。"],[15,3037,3125,1,"另一方面， 伴随着结生名色的生起， 新一期的生命开始， 识食继续喂养与缘助俱生的名色， 令生命延续。所以也可以说， 识食喂养及缘助结生和生命期间的名色。当说到“意之思喂养及缘助三有”时，只是针对有漏的善和不善之业思；而当说到“识喂养及缘助结生名色”时，只是指结生识。般情况下， 支持和喂养与它相应的诸名法及由它而生起的诸色法， 称为“食”（āhāra）。3. 四食的作用在这四种食当中，抟食以维持，维持色身存在，其作用是维持；触以碰触 （提供接触） ；思以累积 （业） ；识以识知来实现食的作用。具体怎么实现呢？"],[15,3125,3183,1,"抟食以增强身体来作维持，令有情存续。“食物”被称为“色法的产生者”。它的维持作用在于产生食素为第八的纯八法聚。基于抟食的维持才能存续十年、 百年、 乃至寿限。这好比什么呢？犹如孩童虽由母亲所生， 却由奶妈的乳汁滋养， 得到养育而长久存续；又如一栋以柱子支撑的破旧房子。正如《弥兰王问经》中，龙军尊者回答弥兰王说：“犹如一座即将倒塌的房子， 有其他强力的支撑则不会倒塌。大王，此身依食而住，由于食而存续，亦复如是。"],[15,3183,3259,1,"在实现维持作用时，抟食对两种色相续为缘：1）食生色；2）所执取色。对于食生色，抟食作为其生者（janaka）而成为缘；对于所执取色，即业生色，抟食则充当其随护者而成为缘。所缘是有情获得快乐等的基础， 触与所缘接触， 通过使乐受等生起而令有情存续。思累积善与不善业，通过产生有（生命的再生），以此为根基而令有情存续。识则识知，通过使名色生起而令有情存续。4. 四食的怖畏对于如此各自实现其维持有情存续等作用的这四种食， 佛陀说有四种怖畏，即："],[15,3259,3359,0,"对于抟食， 欲求是怖畏；对于触， 趋近所缘是怖畏；对于意之思，累积业与再生是怖畏；对于结生识，令新的名色生起是怖畏。有认真思考的人就能体会到， 我们对于美食有欲求， 对于所缘想接触， 接触了就会制造业。禅修时如果不守护根门就会有问题。造了善业、不善业，没有断除轮回之流，下一生就会再结生，这是怖畏。人们欲求抟食， 为了食物之故而从事各种工作， 经受寒冷等许多痛苦。有些人在此教法中出家， 却以从事各种非正命的方式而活， 比如占卜、医疗、 教导在家人以各种不恰当的方式寻求食物以生存， 这样的出家人在当生就会招致责难， 并在未来成为沙门鬼， 犹如<相相应>中所描述的“他的衣在着火、在燃烧；他的钵也在着火、在燃烧；他的浑身都在着火、在燃烧。"],[15,3359,3417,1,"。《复注》中说，摄入抟食时会生起强大的味爱（对味道的渴爱），它是许多伤害之因，故为怖畏。那些享乐于触者或许会在趋近触时， 侵犯到他人所守卫及保护的财物，乃至于妻子、儿女。那时，财物的所有者会将他们人赃俱获，把他们斩成一块块并抛弃于垃圾堆上， 或者交给国王， 国王会令他们承受种种刑罚。身坏之后，恶趣会等待着他们。如此，以享乐于触为根源而在当生与未来有一切的怖畏。“趋近”指的是对境、根与识的结合，或对境与识的结合。它是受生起之因，故为怖畏。"],[15,3417,3472,0,"一切发生于三有的怖畏皆根源于善与不善业的累积。《复注》 中说，它是有（存在）生起之因，即生命存在之因，故为怖畏。只要生命存在就有苦。所以，对于思食，业的累积是怖畏。无论结生识显现于哪一处，就会在那一处与结生名色一同生起。伴随该名色的生起，以它为根源的所有怖畏生起。《复注》说，它是所有那些引发新生命的有害之法的根本原因， 故为怖畏。我们讲，切有为法都是无常、苦、无我的。学过四十种对无常、苦、无我的思惟的人就知道，生命有多么怖畏。"],[15,3469,3522,1,"抟食—子肉之喻关于抟食，佛陀开示说：“诸比库，应该如何看待抟食呢？诸比库，犹如一对夫妇带着少量的食粮穿越荒漠， 他们有可爱、 可意的独子同行。诸比库， 那对夫妇在荒漠中， 他们少量的粮食会用完、 耗尽， 而还有那余下的荒漠未越过。诸比库， 那时， 那对夫妇会这么想：‘我们少量的粮食已用完、耗尽， 而还有这余下的荒漠未越过。让我们杀了这可爱、 可意的独子，制成撒上胡椒的干肉。吃着儿子的肉，这样就能穿越那余下的荒漠。莫让我们三人全都消亡！’"],[15,3522,3580,1,"“诸比库， 于是， 那对夫妇会杀了那可爱、 可意的独子， 制成撒上胡椒的干肉。吃着儿子的肉， 这样就能穿越那余下的荒漠。他们会吃着儿子的肉， 搥胸哭喊：们的可爱的孩子？’‘你在哪里， 我们的独子？你在哪里， 我“诸比库， 你们认为如何： 他们是否为了嬉戏而进食， 或为了骄慢而进食，或为了装饰而进食，或为了庄严而进食？”“当然不是，尊者！”“诸比库，他们进食是否只为了穿越荒漠？”“是的，尊者！”“同样地，诸比库，我说，应该如此看待抟食。诸比库，当抟食被遍知后， 对五种欲乐的贪染就被遍知；当对五种欲乐的贪染被遍知后，那系缚着圣弟子再来此世间的结缚就不存在。"],[15,3580,3669,1,"这是《子肉经》，对于食物，我们要像吃亲生儿子、独生子的肉一样如此思惟。对于《子肉经》的解释，下堂课再跟大家分享。愿大家都能以正确的态度来面对四食，早日解脱被四食的束缚。祝福大家！萨度！萨度！萨度！"],[16,1,144,1,"169 讲-摄集-生命的四食 3古源尊者尊敬的各位尊者、各位尼师、各位贤友，晚上好！今天晚上我们继续上一堂课——关于“生命的四食”一、抟食——子肉之喻1.1 义注释义一切众生依食而住。上堂课学到佛陀讲《子肉经》，《子肉经》在 《义注》 是怎么解释的呢？佛陀为什么用这个比喻？对这个比喻怎么理解？《义注》 里面这样说， 有一对夫妇和他们幼小的儿子， 带着少量的粮食，穿越一百由旬的荒漠，走了五十由旬，粮食就用完了。他们因为饥渴而感到很虚弱， 在一片稀疏的树荫下坐下来， 丈夫跟妻子说：“贤妻呀，此后的五十由旬往任何方向都没有村庄或城镇，因此现在我不能做耕作或养牛的男子应做的许多工作来满足你的需要。来吧！把我杀了，一半的肉吃掉，一半的肉作为粮食， 你跟孩子一起可以走出荒漠。"],[16,144,222,1,"。妻子说：“夫君呀，现在我也不能为你做纺纱、做饭等女人应做的许多工作。这样吧，把我杀了，一半的肉吃掉，一半的肉作为粮食，你和孩子一起走出荒漠吧。。父亲答道：“母亲死了，就意味着孩子也会死， 母子两人都会死。这么纤弱、 幼小的孩子没有母亲不可能活下去。但是如果我们活着，可以再要一个孩子。好了，现在我们把孩子杀了，拿取肉后就能走出荒漠。。于是，母亲就对孩子说：“亲爱的，去你父亲那吧。，孩子就走过去了。父亲却说：“为了抚养孩子，我承受了耕作、养牛等许多苦累，我不能杀掉孩子，你来杀吧。"],[16,222,288,1,"，说完，他就让孩子回到母亲那。母亲又说：“为了想要一个孩子，我行牛戒、狗戒，向天神祈愿等等，经受了很多的苦痛，更不必说怀胎之苦。我不能杀掉我的孩子。，她就告诉孩子：“去你父亲那吧，亲爱的。。在两人之间这样走来走去，最后虚弱的孩子自己死了。见到如此，父母亲非常悲泣，悲泣之后就吃了孩子肉，然后继续穿越荒漠。1.2 以九种可厌应用子肉之喻而进食佛陀以九种可厌应用子肉之欲来解释《子肉经》。对于食物的九种可厌，要从子肉（儿子的肉）的角度来看。"],[16,288,361,0,"以儿子的肉作为食物，依九种原因而可厌：他们不是为了嬉戏、不是为了骄慢、 不是为了装饰、 不是为了庄严而食用， 只是为了能够穿越荒漠。不是为了嬉戏、骄慢、装饰或庄严而进食，这同样的用语也出现在比库对钵食的行持中。《清净道论》解释，嬉戏是指像村童为了嬉戏或游玩而食；骄慢是像大力士为了勇力和强壮的骄态而食；装饰就像宫女、 妓女为了肢体的丰满、 美妙而食；庄严就像很多演员、舞女为了明净的肤色而食。也就是说，我们在进食的时候应当省思，我们不是为了嬉戏或游玩而食， 不是为了成为勇士或者强壮的体态而食， 不是为了肢体的丰满而食， 也不是为了明净的肤色而食。我们进食只是为了身体的存续，为了资益梵行，为了早日从生、老、病、死的荒漠中（苦中）解脱。"],[16,361,464,1,"以子肉作为食物， 依哪九种原因而可厌呢？同类之肉 （即人类） 、亲人之肉、亲子的肉、爱子的肉、嫩肉、生肉、没有味道、没有盐、未熏制的肉， 依此九种原因而可厌。所以在食用子肉时， 他们不会染着、不会贪求而食，而是住于中捨、无贪欲而食；他们不会把附着于骨的筋腱、皮肤等放在一边，而只吃上好的、大块的肉；他们只是食用到手边的肉， 而且是远离悭吝之垢以清净之心而食；他们不会昏昧而食，不会当成吃鹿肉或者孔雀肉，而是明了“这是他们亲儿子的肉”而食；他们不会带着希求而食：“啊，愿我们能够再次食用这样的子肉吧！”"],[16,464,600,1,"——他们不会如此希求而食；他们不做储藏，想着：“这些在荒漠吃，剩下的走出荒漠以后加上盐、香料等再做着吃”，走到荒漠尽头， 在人们看到之前， 他们会把剩下的埋在地里或者用火烧掉；他们不会骄慢自负而吃：“没有人像我们这样有机会吃这样的儿子的肉”—— 他们不会这样想，他们宁可怀着相反的心态（羞耻和谦卑）而食；他们不会轻蔑而食：“这个无盐、无味、未熏制的恶臭之物”，他们不会如此轻蔑而食，而只是为了存活；他们不会互相争吵：“那是你的份额，这是我的份额；他是你的儿子，他是我的儿子”，他们和合、和谐地吃。"],[16,600,694,1,"我们在进食的时候要依照佛陀的教导来省思： “我正在吃儿子的肉制成的肉干， 我进食的目的不是贪着它的美味 （儿子的肉怎么能尝出美味来呢？），我不会贪求而食，我不会挑肥拣瘦、不会狼吞虎咽。—— 这是《义注》的说明。《义注》继续说，看到对这样的食物无欲贪而受用这一个面向，佛陀希望令僧众也能够对此认可，所以佛陀问道：“诸比库，他们是否为了嬉戏而进食呢？”。同样地，意即与爱子之肉类似，应以其九种可厌之处来看待抟食。哪九种呢？以外出托钵、 以寻求钵食、 以进食、以食用时身体的分泌物、以储存食物之器、以在胃中消化、以未消化的食物、以涂与排泄，比库因如此省思食物的可厌而取用抟食。这九种在 《清净道论》 的食厌想里面有很详细的解释。因此比库应以这九种可厌应用子肉之喻而进食。"],[16,694,758,1,"1.3 在轮回中我们既是猎食者又是受猎者在轮回中我们既是猎食者又是受猎者。向智长老曾经说： “自从人类出现在地球上， 人类就如同佛陀比喻中的夫妇， 跋涉在生命的荒漠中。在哪里食物最令人关切呢？无始以来我们都像佛陀所作比喻的那对夫妇， 在每一期生命当中， 我们都与其他人为伴， 跋涉在生命的荒漠中。我们首先关注的是哪里有食物， 在哪里能够获得更多更丰富的食物。然而作为猎食者，我们一生复一生，我们在寻觅食物之时，经常做的事情却是毁灭自己平常最珍贵的东西， 也许是至亲的朋友或生命中的理想。"],[16,758,847,0,"翻开人类历史，在饥荒、战乱或各种灾难发生的时候，人们自相残杀，乃至易子而食。这样的惨况不管古今中外都经常能看到类似的记载。我记得小时候，老人们就常这样说，过去有些时代人死了，尸体不埋、也不烧，而是砍下来分掉， 砍下来的大腿肉分给死者最主要的亲人。即使在现代，每年世界各地由于灾难、饥荒、战乱，成千上万的人饿死，吃人肉乃至于杀人吃肉的事件都时有发生。就像我们上堂课讲到的，对于抟食，欲求应该怖畏。从寻觅食物开始，为了生存，我们还需要各种各样的物资。在我们四处觅食，试图掌控更多能够保障自己所谓存在感的资源时， 残酷的剥削、 摧毁乃至战争侵略、兄弟相残、同族相害就会发生。"],[16,847,960,0,"我们可以思考，在一生当中，所谓的生活、工作、努力不就是为了那一口饭吃， 为了那一张床吗？然而， 当食物的基本需求得到满足以后， 为了存在感， 我们需要争夺更多的权力和资源以及利益。在这个争斗的过程中，我们成为了加害者或者沦为牺牲品。所以无始劫以来，在生死轮回中，人曾经是狩猎者也是吞噬者，既是父母也是孩子。在深思抟食的滋养以及佛陀的比喻时， 这是我们应该要考虑的。作为一个佛教徒，我们不杀生乃至于吃素。的确，出于慈悲，不管是否佛教徒，我们都不应该杀生并尽量地吃素。然后，即使是对非常严谨的素食者而言， 在粮食蔬菜的种植过程中， 也同样有无数的众生为此献出了它们的生存权。当农夫的锄头或耕作的机器开垦翻动土壤的时候， 蚯蚓和昆虫的住所被破坏， 它们甚至因此而丧命。为了保护蔬菜和稻米， 杀虫剂也会令无数的虫子死亡。其实它们跟我们一样， 也都是需要食物的众生， 却最终在觅食的过程中被吞噬。即使作为动物保护者， 我们爱护流浪狗、 流浪猫， 我们保护动物，然而动物遵循的是弱肉强食的丛林法则， 它们也在杀戮， 大鱼吃小鱼，小鱼吃虾米。"],[16,960,1036,0,"我们保护了老虎，老虎会捕食羚羊、兔子；我们保护了猫，猫会抓老鼠；我们保护了小鸟，小鸟会吃虫子。就人界和畜生界而言， 我们的业所感得的生存界就是这样一个充满杀戮的世界。每个人都在其中扮演着杀戮者和被害者的角色， 间接或直接地杀戮和被杀。即使素食， 我们也逃离不了杀戮；即使素食， 我们也难以保证自己的身体健康。食物进入我们体内之后， 在消化之火的资助下， 产生新生代的时节生食素八法聚和食生食素八法聚， 它们散布全身， 滋养身体各处包括业生色、 心生色、 时节生色和食生色的其他色法， 然而我们的身体还是会出现四大不平衡， 会生病。食物令我们的生命得以存续，同时食物也会对身体造成伤害而成为生命的杀手。所谓“病从口入”，这是不争的事实。"],[16,1036,1094,1,"向智长老说：“身体总是留存着少量没有被消化或排出的食物，它们残留于体内并腐化变质。一些生理学者认为：‘如果没有其他原因造成死亡，这些残食的腐坏最后将造成器官的老死’。若此理论正确，那么食物不仅赐予人生命，同时也赐予死亡。看来，我们此生中可以在因饥饿而死与因腐坏而亡之间做一选择 ——‘食物吞噬进食者’希腊神话深刻地表达了滋养与死亡间的密切关系。根据神话， 狄米特是谷女神，就是稻谷的女神（也叫食神），同时她也是死神。古典神话的伟大研究者及诠释者巴霍芬简洁地指出了它的意义：‘她喂饱人们以作为她自己的猎物。"],[16,1094,1172,1,"’”当然也许有人会争辩： “我可以断食呀， 像道家一样长时间断食。佛陀以他自己六年的苦行告诉我们， 苦行、 断食并不能导向解脱， 这或许可以令我们在这一生中所摄入的食物减少， 但只要没有放弃对生命的渴爱， 在未来的生命期中， 我们依然会是猎食者同时又是被食物所吞噬者。唯一的解决方法就是遵循佛陀的教导， 为了渡越生命的荒漠到达彼岸，到达没有名色、无限安稳的涅槃，我们每天应该省思：”所吃的食物犹如亲子之肉”"],[16,1172,1228,0,"，以此去除贪欲并激发悚惧和精进，来战胜生命荒漠对我们的逼迫，勇敢地迈向彼岸。二、触食——剥皮的牛的譬喻2.1 经文与释义对于触食，佛陀用剥皮的牛来比喻。佛陀教导说：“诸比库，应该如何看待触食呢？诸比库，犹如一头被剥了皮的母牛， 如果依墙而立， 那些依于墙的生类会啃啮它；如果依树而立， 那些依于树的生类会啃啮它；如果依水而立， 那些依于水的生类会啃啮它；如果依露天而立， 那些依于露天的生类会啃啮它。诸比库， 不论那头被剥了皮的牛依于何处而立， 都有依于该处的生命会啃啮它。"],[16,1228,1302,1,"“同样地，诸比库，我说，应该如此看待触食。诸比库，当触食被遍知后，三种受就被遍知；当三种受被遍知后，我说，对圣弟子而言，没有任何还应该做的了。“触食经由眼、耳、鼻、舌、身、意六根门从四面八方蜂拥而来，人无能地暴露在这些持续的兴奋和刺激当中，犹如被剥了皮的牛一般。犹如无皮的牛，不管它站在何处，都会不断地遭受着周遭昆虫和动物的啃啮。同样地， 当没有防护地暴露在各种刺激当中时， 我们完全没有自我保护的能力。无论我们身处何处， 都无法逃离“触”的冲击、刺激、 扰乱， 哪怕只是在独坐空想或者夜间安寝， 都会有纷飞的妄想来打扰我们、 梦中的幻象来恼乱我们， 唯有在深睡无梦时才有片刻的歇息和平静。"],[16,1302,1354,1,"2.2 触喂养感受而引生苦触食是维持生命的基本条件。如前所述， 如果没有触， 我们所有的心路都无法生起。《义注》中说：“触与所缘接触，通过使乐受等生起而令有情存续。。作为维系生命的基本条件，触特别滋养和维护的是感受。受因为触而产生。佛陀教导了受的多种分类方式， 其中最为广泛的是三种受 —— 乐受、苦受和不苦不乐受（舍受）。没有防护的“触”会引生各种各样的受，当我们没有正见的时候，没有防护的“受”使我们的贪爱炽烈、瞋恚旺盛。"],[16,1354,1435,0,"作为人类， 当我们在母亲的子宫结生的时候， 就意味着这一期的生命是作为人，以人的形式存在。人是一种动物，被称为“高级”是因为他本身有情感，可以有道德构建，我们自己认为高级。然而，人作为动物，首先是具有动物性。人们通常谈论的是人类的进化， 但是从佛法的角度来看， 人是退化来的。劫初， 光音天的梵天人寿尽或福尽后投生为人。起初他们不需要父母，化生而来，身体光明，以“喜”为食。那时候，宇宙一片昏暗，没有日月星辰，不知昼夜，也不分男女。然而漫长的时间过后，人们开始逐渐陷入贪爱。当贪爱生起时， 他们身体的光明消失。后来，出现了太阳和月亮， 世界逐渐生成。随着人们贪欲的增长， 人的身体变得越来越粗糙。男人出现男根， 女人出现女根， 才有男女交媾之事。由此， 人类社会开始慢慢形成。人们的贪欲愈加炽盛， 环境又愈加恶劣， 道德败坏， 福报衰减， 人寿缩短。这就是佛法中人类的退化，或者说退堕。"],[16,1435,1472,0,"然而不管是进化说还是退化说， 任何一种物种的存续过程中， 根植于物种最深处的两个因素不会改变： 一个是生存、一个是繁衍后代（扩散基因） ， 这是根植在所有物种的存在基因里， 以基因编码的方式深深地刻在其生命特征当中。一个人如果没有经过佛法的训练， 他自然就具有人的这种动物性 —— 追求五种感官享乐的本性： 寻找快乐， 嫌厌痛苦；追逐可意的所缘， 排斥不可意的所缘 —— 这样一种自然而然的、动物性的反应。"],[16,1472,1524,0,"这就是我们前面讲过的， 为了生存和物种繁衍而产生的保护机制和鼓励机制。我们依着这些所缘而活，依着这些触和受而活。如果未经防护，我们的六个所谓心灵窗口是始终向外界敞开的，无时无刻不受到色、声、香、味、触、法的冲击，就像那一头剥了皮的牛，因皮肉绽开而为昆虫、 苍蝇、 蚂蚁、 鸟、 秃鹫各种动物群集争食的对象， 苦不堪言。我们以为跑到墙边可以躲避， 我们以为跑到树下可以躲避， 我们以为跑到水边可以躲避， 我们以为跑到露天可以躲避， 然而到最后我们发现无处可躲、无处可逃。"],[16,1524,1578,0,"所以，向智长老说： “佛陀指出，对尚未从执取中解脱的人而言，任何感受必然产生苦难和争战。苦受即是苦难的本身；乐受则因它的短暂 （边际效应递减） 无法令人满足的特性而带来苦受；世俗的不苦不乐受， 因其本具的单调和无聊而产生苦迫。触食不断喂养这些受觉，成为引发此三苦的因。正因为触食不断地喂养我们这些感受， 又因为对这些感受的执取和排斥让我们造业， 而这些业又会引来新的再生。如此， 我们在这轮回中生生不息，无法逃离。"],[16,1578,1654,0,"2.3 如何切断苦的缘起在《长老偈》中，一位长老发出感慨：“无量的色、声、香、味、触、法在燃烧，何时我才能够平静且有智慧地看到呢？”我们是否有尝试观察自己的生活呢？每天眼睛一睁开， 就匆忙地洗漱、穿衣，准备早餐，送孩子上学，再一头扎进那拥挤得像肉饼一样的地铁车厢中赶去上班。运气不好时迟到几分钟，心中惴惴不安，还要担心看上司的脸色。然后在同事们漠然的目光下， 开始一天重复性的枯燥工作。下班后，拖着疲惫不堪的身躯回到家里，安排晚饭、完成家务、 辅导孩子功课， 直到深夜才能睡觉。甚至躺在床上也睡不安稳，心里还盘算着：“假日要到了，腾出时间带老人孩子出去转转。可到处都是人山人海、吵吵闹闹，现在还新冠肺炎，去哪儿呢？”尽管大量外缘的冲击令我们应接不暇、 带来苦受， 然而我们还是心甘情愿地为了少许快乐而付出这样的代价。"],[16,1654,1725,0,"所以向智长老说： “事实上，我们似乎喜欢任何一种‘体验’胜过什么感受也没有， 除非所引发的苦几近容忍的极限。这种情况的心理根源是因为人永远渴求新的经验，如果这种渴求没有经常地得到满足，就会使他感到空虚、 饥饿和无助。触食喂养了享乐的世界， 也滋养了对存在的渴爱。要破除习惯性的渴爱， 唯有停止与触食之流密切结合，学着摆脱对触食主动积极的回应， 或者习惯性的回应， 并退一步来观察它们。（也就是我经常说的，面对果报要能停得下来，永远不要对果报直接采取行动。）于是，这样，触食所滋养的感受将会停止转变成渴爱，这时候苦的缘起就会短暂地被切断。"],[16,1725,1804,1,"也就是说， 当我们不再以各种触去喂养感受， 而是退出来站在旁边观察它，这个时候，触食所滋养的感受就不会再转成渴爱，“受缘爱”这一环就被暂时地切断。我们前面学习过 《算术师摩嘎蓝经》 、 《调御地经》 等多部经典。在这些经典里面，佛陀教导了持戒、守护根门、饮食知节量、实行警寤、正念正知、居住远离处、捨离五盖、修习四念处八个阶段。佛陀在《一切漏经》中也教导了七种捨断——见捨断、防护捨断、受用捨断、忍耐捨断、回避捨断、去除捨断、修习捨断。其中，八个阶段当中的“持戒、守护根门、饮食知节量、正念正知、居住远离处”以及七种捨断中的“防护捨断、受用捨断、忍耐捨断、回避捨断”，这些都是针对“触”下手的，通过防护、省思、正念正知、远离、回避、忍耐，从而不再喂养感受、增长感受，达到切断苦之缘起的目的。三、思食——炭火坑之喻3.1 经文、义注与释义对于“思食”"],[16,1804,1881,1,"，佛陀是用炭火坑来比喻。“意思食”，意指心意，思心所也是一种食（名食）。实际上是指思心所在造业。关于思食，佛陀教导说： “诸比库，应该怎样看待‘意思食’呢？诸比库， 犹如有深过人的炭火坑， 布满了无焰无烟、 烧得发红的火炭。那时， 有欲生而不欲死、 欲求乐而嫌厌苦的男子走来， 两名男士各抓住他一边的手臂，将他拉向炭火坑。诸比库，那时，远离是那个男子的意愿，远离是他的渴望，远离是他的愿求。为什么？诸比库，因为那男子这么想： ‘我将跌落这炭火坑，因此遭受死亡或死一般的痛苦。同样地，诸比库，我说，应该如此看待‘意思食’"],[16,1881,2019,1,"。诸比库，当‘意思食’被遍知后，三种爱就被遍知；当三种爱被遍知后，我说，对圣弟子而言，没有任何还应该做的了。对此,《义注》怎么解释呢？它说： 炭火坑如同三地的有轮，三地即欲地、色地、无色地。 欲生的男子如同依于有轮的愚痴凡夫。 两名力士如同善和不善的业。他们各抓住男子一边的手臂拉向炭火坑之时，如同凡夫累积业，业的累积牵引至结生。 以炭火坑为因造成的痛苦如同以业为因带来的轮转之苦。我们前面学习过， 表达心意志作用的是思食。思食能够强力地给予我们勇气而去造作身业、语业和意业。佛陀说：“思即是业”。不善业和仍为无明所障盖的善业， 它们就像两个强有力的男子， 左边一个、右边一个抓住我们，要把我们拖向轮回的无底深渊。轮回的炭火坑，看起来没有烟、 没有火焰， 很多人甚至并不知道那是一个火坑。实际上， 我们并不需要被人抓着， 只是被自己善、 恶业的力量所驱使而一次又一次地自动地投入到这个炭火坑当中。如果我们还没有树立以解脱作为生命的终极目标， 并培养起如理作意的能力， 过去的业习、 生存的意志以及各种规划、 计划、 抱负、 理想就会一直把我们牵引到充满着激烈、苦迫、火烬的轮回之中。"],[16,2018,2086,1,"3.2 思食 —— 有意志的行动以获取所渴求的四食。思食，它是有意志的行动以获取所渴求的四食。佛陀教导，轮回的两个主因是无明和渴爱。由于无明和渴爱，众生造业。造下的善、恶业在未来遇到合适的因缘时就会成熟而产生果报。在体验果报的时候，由于无明和渴爱，众生又造业，就是好的你会贪、不好的你会排斥。烦恼、业和果报不断地循环着、纠缠在一起，将众生牢牢地束缚在生死轮回之中。从业的角度来看， 思食是我们无始以来一直轮回三界的主要食物。所以《义注》中说：“思累积善与不善业，通过产生‘有’的根基而令有情存续。"],[16,2086,2132,0,"“思” 指的是有意志的行为。由于对生命的四种食物无休止的渴求，为了获得四食，我们就要付出行动。我们设定各种理想、规划，并为此做出种种的努力和奋斗， 我们建设和毁坏、 创造和发现、 改革和创新、 征服和被征服， 这些行为活动让我们的科技达到了前所未有的高度， 让我们在思想、 艺术领域的成就也达到了顶峰。人们可以深入海底一万米， 也可以畅游广阔的外太空， 从而成为非常有力量可能又非常邪恶的掠夺性动物。"],[16,2132,2207,0,"人渴望获得生命中各种形式、 粗细不同的四食， 这种渴求的躁动就是我们追求活力和创造性动力的根源。为了获得所渴求的四食， 思食作出决意并付诸行动。然而， 任何满足所带来的快乐都是边际效应递减的、排他的、具竞争性的、不可持续的且是短暂的，因此我们永远无法获得满足。由于满足总是短暂的， 不断地去追求新的满足成为了一项永无休止的任务，这就是“思食”的任务。这个世界充满着各种个人的所谓意志、 权力， 各种思的力量。在所谓的民主国家， 尽管他们倡导民主、 公平， 但大家仍然要抢夺资源、平衡势力范围， 思食的影响不可或缺；而在集权国家，一个威权的国家， 必然要想方设法地维护自己的意志得到贯彻执行。思的力量造就了世界的建设以及世界的毁灭。"],[16,2207,2305,1,"作为佛教徒， 我们每天也同样在为思食而奔波、 努力、 采取行动。我们以思造业，并留下了业力。然而，需要思考的是，这个业力在未来成熟的时候将把我们导向何处？是轮回的火坑还是超越三界的涅槃，我们到底赋予这个潜在力量什么方向？3.3 触食与识食 → 认知行为模式的建立 → 思食触食、 识食就是认知模式的一种建立， 在认知模式建立的基础下，思食起它的作用。也就是说，思食的寻求受到我们认知模式的影响。我们每天看各种新闻， 世界上各种各样的事件发生， 其背后都是相关认知在指导着人们的行为，然后去造业，这就是思食。"],[16,2305,2368,0,"曾经看过一些青少年犯罪的案例。在湖南衡阳，一个十二岁的男孩用一把水果刀杀死了他姑姑一家三口。这个十二岁小男孩在三岁的时候父母离异， 先跟着爷爷奶奶生活， 后被寄养在姑姑家读初中。他对姑姑的管教产生了抵触情绪。一天下午， 他放学回家， 在家里上网，被放学回来的表妹看到了，九岁的小表妹说：“你又上网了，我要告诉妈妈。，兄妹俩于是争吵起来，小男孩就用水果刀把表妹杀了。四岁的表弟吓得大喊， 他把表弟也杀了。然后他镇静地给姑姑打电话，问她什么时候回家。等他姑姑回来， 他又把他姑姑捅伤了， 当时门还没有关上，姑姑跑到电梯口大喊“救命”"],[16,2368,2419,0,"，被他拖回来杀了。整个过程小男孩极其镇定老练。他杀人之后， 换上一套黑色衣服， 把外面走廊的血迹擦拭干净， 以至于别人在家门外一点都看不出来。然后从他姑姑身上拿走手机、 两千元现金和钥匙， 还用他姑姑的手机给一个女同学打电话，约她出来玩。后来第二天，在附近的网吧被捕。还有一个案例是广西的： 一个十三岁的女孩读小学六年级， 她和一个同班女同学关系很好。但是她发现， 其他的同学更喜欢跟她的朋友玩，并且议论她长得胖，没有她朋友漂亮。因此她产生了嫉妒，并怀恨在心。"],[16,2419,2504,0,"一天晚上她约这个女同学来家里来玩， 趁同学低头玩手机的时候，她拿起木凳子砸她的头，把她砸晕，然后从家里拿出菜刀、啤酒瓶、割纸刀、剪刀等凶器，把女同学的头、手臂砍下来装入塑料袋，并镇定自若地清理案发现场。为什么我不举大人的例子而去看小孩的例子呢？他们都是未成年人， 却为什么能做出这么凶残的事情呢？我们前面学习 《阿毗达摩》 ，知道这些孩子有这样的认知行为模式，一定先有建立该认知行为模式的过程。在此过程中，他会有自己所缘取的对像和参照的对像 ——这是触食；他们一次又一次地这样标记， 直至最后认定这样做是自己可选择的 —— 这是思食和识食。这些孩子最后动手杀害其他生命—— 这是他的思食、他所造作的行为，这行为的背后就是他的认知行为模式。这种认知行为模式的建立又跟他的识食、 触食相关， 也就是跟他以前所看到的自己家人的表现、 电视情节游戏情节的展现， 这些他所接触到的所缘所形成的标记相关。"],[16,2504,2564,1,"另一方面， 我们也可以看到， 当一种认知行为模式已经形成为意志力的时候，再去调整自己的心是很困难的。所以回头来看，最重要的还是“以正见为先导”。前几天我们组织了一个大学生学习营，学生们问：“我们应该怎么规划生命目标？”，我说：“正见为先导”。如果你的认知行为模式有问题，你再有成就都是很恐怖的。只有在正见的基础上， 我们才知道什么是善、 什么是不善，什么事可以做、什么事不可以做。我们才会如理作意，并且通过如理作意而选择实施正确的行为。"],[16,2564,2613,1,"然而即使不造恶， 我们也无法摆脱轮回的火坑。只要我们还没有真正地看到轮回的真相 （轮回就像一个炽热火烬的深渊） ， 只要我们不以解脱为方向，那么不管我们以多少种形式（高尚的、卑微的、优雅的、 丑陋的） 无数次地投入到生命的轮回当中， 也永远填不满这个无底洞。四，识食——矛刺之喻4.1 经文与义注关于识食。识食，佛陀是用“矛刺”来比喻。佛陀说：“诸比库，应该如何看待识食呢？诸比库，犹如有人抓住了盗贼、罪犯去见国王：‘大王，这是盗贼、罪犯，随你所欲给予他处罚吧。"],[16,2613,2652,1,"’国王会这么说：‘去吧，朋友。上午以百矛刺这男子。’上午，他们以百矛刺他。中午，国王会这么说：‘喂！那男子怎样？’‘大王，还活着呢。’国王会这么说：‘去吧，朋友。中午再以百矛刺那男子。’ 中午，他们再以百矛刺他。晚上，国王会这么说：‘喂！那男子怎样？’‘大王，还活着。’国王会这么说：‘去吧，朋友。晚上再用那百矛刺那男子。’晚上，他们再以百矛刺他。‘诸比库，你们认为如何？那男子一日被刺三百矛，是否会因此而感受到痛苦和忧恼呢？’"],[16,2652,2711,0,"‘尊者，即使被刺一矛，也会因此感受到痛苦与忧恼，更不用说被刺三百矛了。同样地，诸比库，我说，应该如此看待识食。诸比库，当识食被遍知后，名色就被遍知；当名色被遍知后，我说，对于圣弟子而言，没有任何还应该做的。《义注》说，应该怎么理解矛刺这个比喻呢？国王就犹如那个业， 罪犯犹如依于轮转的愚痴凡夫， 三百矛犹如结生识。国王命令“以三百矛刺”罪犯之时，犹如业之王（我们是业的所有者，但是也为业所摆布）抓住依于业而轮转的凡夫抛入结生之时。"],[16,2711,2820,1,"在此， 尽管三百矛被比喻作结生识， 矛本身却没有痛苦， 矛刺的伤口才是苦的根源；同样， 结生本身没有痛苦， 但在所给予结生的生命期间有果报的苦，犹如矛刺的伤口所造成的苦。4.2 识则识知，使名色生起而令有情存续 。关于识食的作用， 《义注》中说：“识则识知，通过使名色生起而令有情存续。。识就是心识，识的特相是识知目标，作用是作为俱生心所的先导。从食缘的角度来说， 识食作为缘法， 支持俱生的其他名法和色法生起。六识主导着生命对一切所缘的识知和思惟， 六识通过觉察目标而让你感觉生命在延续。所以笛卡尔说：“我思故我在。对一般人而言， 人之所以存在是因为有识知、 有思惟。识在生命中的重要性，我们就很清楚。学习二十四缘，我们也会发现，没有一个缘跟识无关。生命当中每一个心里名法之间的关系、 过去心对现在心的关系、 现在心对未来心的关系、 心与俱生的业生色法及心生色法之间的关系， 乃至整个意识的相续流、 整个生命流， 处处都与心识有关。"],[16,2820,2888,0,"以我们这一期生命为例，它从哪里开始呢？从结生识开始。“无明缘行，行缘识，识缘名色，……，没有结生识生起，就没有结生名色法生起。人的生命从结生识开始，一直辗转到死亡心灭去而结束，在结生识和死亡心之间也是一条条基于六识而引发的心路。即使在没有心路生起的时候，有分识也在持续生起并维系着生命的存在。我们再来细看，一期生命的第一个心识是结生识。结生识滋养什么？巩固什么？根据十二缘起支，“识缘名色”，结生识资助俱生的结生名色生起， 缘所生法包括了与结生识同时生起的所有心所， 以及就人界而言的三种业生色聚。接着是“名色缘六处，六处缘触，触缘受，受缘爱，爱缘取，取缘有，有缘生，生缘老、死，愁、悲、苦、忧、恼生起。如此，整个苦蕴生起”"],[16,2888,2964,1,"。正是因为结生识的生起，才会引生十二支缘起的三轮转。自结生识开始， 前面灭去的心识， 以无间缘和等无间缘的力量支持下一个心识在它灭后立即生起。只要有识生起，无间缘与等无间缘的缘力就会支助后续的心识不断地生起， 中间不会有间断，不会有间隔。另一方面， 没有心的滋养就没有心生色法；没有心的滋养就没有后生缘， 生命就没有希望， 没有心的力量， 四因生色法就不能健康地存在。识的生起也仰赖于我们所面对的各种所缘。由于所缘撞击相应的根门， 面对各种所缘时触生起， 触又引生各种感受， 由于我们动物性的本能和过去的习性，我们会对所生起的”受”采取行动而造下业。这一生死亡时成熟的业， 会产生下一生的结生识， 结生识又缘助新的名色生起，生命就这样无休止地展开。"],[16,2964,3025,1,"从生命的状态而言， 能认知目标、 能思考被视为生命存在的标志。这个认知和思考的过程， 就是识食的作用。另一方面， 感受也是从识开始， 通过认知目标而产生各种感受， 然后对各种感受采取行动， 所有的感受都像利矛一样刺穿我们。向智长老又说：“从整个世界的角度来看， 识食是无量众生的喂养者和生殖者， 他们每天都承受着生命利矛刺穿的折磨。。很难想象，一个人如果不能识知目标将会是一种什么状态？就像无想有情天的天人一样， 他们只有命根九法聚和时节生色。《分别论~义注》说：“在他们投生的刹那，只有色蕴一种出生。站着出生就是站着；坐着出生就是坐着；躺着出生就是躺着。他们犹如彩绘的塑像一般存续五百劫。"],[16,3025,3083,1,"。没有心识的生命犹如一尊彩绘的塑像，甚至连“行尸走肉”都算不上。因为它根本不会行走。即使这样也是依着上一生临死前行作无想定的业而存在。然而， 对于有心识的生命，如果我们不能够醒觉，这个我们片刻都不能离的“识”，只会让我们承受生命利矛的折磨，日日夜夜都不得轻松。五，如何灭除对“四食”的贪爱5.1 有贪经 —— 灭除对四食的渴爱而止息诸苦如何灭除对“四食”的贪爱呢？佛陀讲了一部《有贪经》。佛陀教导我们， 当结生识不再生起的时候， 名色就不会再生起；当名色不会再生起的时候，就不会再承受一天三百矛刺穿的痛苦。"],[16,3083,3144,1,"佛陀在《相应部·有贪经》里说：“诸比库，对抟食、触食、意思食、识食有贪、有喜、有爱，识即在那里住立、成长；哪里有识的住立、成长，那里就有名色的下生；哪里有名色的下生，那里就有诸行的增长；哪里有诸行的增长， 那里就有未来再有的生起；哪里有未来再有的生起， 那里就有未来的生、 老、 死；哪里有未来的生、 老、 死，诸比库，我说，那就有愁、有悲、有恼。诸比库，犹如一位美术家或绘画师，以染料、紫胶、姜黄、靛蓝和深红在善磨的板、 壁或画布上完整地创作出一个女人或男人的形相，肢节俱全。同样地，诸比库，对抟食、触食、意思食、识食有贪、有喜、有爱，……"],[16,3144,3201,1,"。诸比库，我说，那有愁、有悲、有恼。诸比库， 对抟食、 触食、 意思食、 识食没有贪、 没有喜、 没有爱，识就不在那里住立、成长；哪里没有识的住立、成长，那里就没有名色的下生；哪里没有名色的下生， 那里就没有诸行的增长；哪里没有诸行的增长， 那里就没有未来再有的生起；哪里没有未来再有的生起，那里就没有未来的生、 老、 死；哪里没有未来的生、 老、 死， 诸比库，我说，那无愁、无悲、无恼。‘诸比库，犹如尖顶阁或尖顶会堂，在北边、南边、东边有窗户，当太阳升起时，光线经由一扇窗户进入，它将住立何处呢？’‘在西边的墙壁上，尊者。"],[16,3201,3243,1,"‘诸比库，如果西边没有墙壁，它将住立何处呢？’‘在地上，尊者。‘诸比库，如果没有地，它将在何处住立呢？’‘在水上，尊者。‘诸比库，如果没有水，它将住立何处呢？’‘不住立，尊者。同样地， 诸比库， 对抟食、 触食、 意思食、 识食没有贪、 没有喜、没有爱，识就不在那里住立、成长；哪里没有识的住立、成长，那里就没有名色的下生；哪里没有名色的下生，那里就没有诸行的增长；哪里没有诸行的增长， 那里就没有未来再有的生起；哪里没有未来再有的生起，那里就没有未来的生、老、死；哪里没有未来的生、老、死，诸比库，我说，那无愁、无悲、无恼。"],[16,3244,3283,1,"5.2 义注关于《有贪经》的解释《义注》对这个经文的解释：“对抟食、触食、意思食、识食有贪、有喜、有爱，识即在那里住立、成长；哪里有识的住立、成长，那里就有名色的下生。哪里有名色的下生， 那里就有诸行的增长；哪里有诸行的增长， 那里就有未来再有的生起；哪里有未来再有的生起， 那里就有未来的生、 老、 死；哪里有未来的生、老、死，诸比库，我说，那有愁、有悲、有恼。这一段里的“识”指造业的识；“在那里”是指识或者再生的轮转中；而“住立”是指实现或者能够显示其自性；“成长”是指获得成熟或成长，从而产生其果报。"],[16,3283,3377,1,"“住立、成长”指的是业住立、牵引有情至再生的能力成长，并由此加速“有”的过程（生命存在的过程）；“名色的下生”是指结生名色的生起；“那里有诸行的增长”是指现在果报轮转中导至未来轮转的诸业行被造下而增长；“未来再有的生起”指作为结生识的识食。这一段说的是，如果我们对四食有贪染、有欢喜、有渴爱，业识就能够不断地在轮回中实现其自性而住立并获得成长、 成熟而产生它的果报 —— 业果。业果是什么呢？就是名色的生起。名色生起， 在现在的果报轮转后紧接着又会造下导至未来轮转的业行，从而产生未来的再有 ——新的结生识生起。当结生识再度生起时，就会有新的生、老死，愁、悲、苦、忧、恼随之而来。关于这一连串的因果关系 —— 四食→识→名色→诸行→未来再有→生老死→愁悲苦忧恼，《义注》说：“在此， 将识食包含于食中， 食与名色之间有一个因果的连结；将名色包含于果报类中， 名色与业行之间有一个果和因的连结；最后， 业行与未来之间有一个因和果的连结。"],[16,3375,3455,1,"， 这是三轮转。佛陀说：“诸比库，犹如一位美术家、艺术家或绘画师，以染料、紫胶、姜黄、靛蓝或深红，在善磨的板、壁或画布上完整地创作出一个女人或男人的形相，肢节俱全。同样地，诸比库，对抟食、触食、意思食、识食有贪、有喜、有爱……诸比库，我说，那有愁、有悲、有恼。这一段比喻，美术师或绘画师犹如业和随附该业者。板、壁、画布犹如三地（欲地、色地、无色地）。美术师或绘画师在光洁的板上创作出各种形相， 犹如随附者的业在各生存地产生色。又犹如不善巧的绘画师创作出难看、结构不良、不可意的形相，同样地，有些人以智不相应心造业， 则该业所产生的形相不会给予眼睛等美丽， 而只是产生丑陋、 畸形甚至连父母亲都不喜爱的形相。然而， 犹如善巧的绘画师创作出美丽、 结构优美且可意的形相， 同样地， 有些人以智相应心造业， 则该业所产生的形相将会给予眼睛等美丽， 产生漂亮、 形体美好的形相，犹如杰作的完成。"],[16,3455,3515,0,"在此， 业及随附该业者， 指的是造业速行心中的思以及与思相应的其他名法，包括名法的素质、质量、强弱等等。如果从业的同一性理角度来看，也就是把一段时间内造作的某一件事视为同一种业行，那么造作善行过程中的前思、 后思以及中间夹杂的很多不善心， 或者造作不善行过程中前思、 后思以及其间穿插的善心都可以被视为随附该业者， 它们通常会在该善行或不善行成熟带来果报时， 也成熟为相应的支持业或阻碍业来增强或削弱该果报。"],[16,3515,3587,0,"佛陀以这个比喻来说明， 当对“四食”有贪爱的时候， 我们会造业；当因缘成熟的时候， 所造业将会在三界产生名色。由于所造业的善恶和胜劣， 所产生的名色也相应地各各不同。不管如何， 名色的生起必然带来诸业行的增长；由于不断地造业， 我们持续地再生，一次又一次地迎来生、老、病、死，新的愁、悲、苦、忧、恼。5.3 灭除对“四食”的渴爱，我们就能止息诸苦如此滚动向前， 是否就永无止尽呢？佛陀说： 不是的！佛陀教导苦， 也教导苦的止息。佛陀接着指出， 犹如日出时阳光从尖顶阁的窗户照入， 若西边既没有墙， 也没有地， 也没有水， 光线就无处住立 —— 它将不住立。同样地，如果对“四食”没有贪染、没有欢喜、没有渴爱，业识就不会生起，就不会再造下导致未来轮转的业。如此，就不会有未来再有的生起，也不会再有生、老死，愁、悲、恼。因此，灭除对“四食”的渴爱，我们就能止息诸苦。"],[16,3587,3679,0,"佛陀说要遍知才能够做到。怎样才能够遍知呢？遍知又从两方面来看。帕奥西亚多的《智慧之光》专门讲解了怎么去“三遍知”。这是在证得禅那，修习了名色业处，名色分别智、缘摄受智，对过去、现在、未来、内在、外在、远近、胜劣、粗细的 11 种究竟名色法修观的时候遍知。如果没有修观， 我们就不能够从概念上去遍知吗？从另外一个角度来看，遍知应该在日常生活中去观察。下面看《子肉喻经》和《注疏》的内容。5.4《子肉喻经》对抟食、触食、思食和识食的遍知简单了解三遍知以后， 我们应该学习如何遍知抟食、 触食、 思食和识食。"],[16,3679,3741,1,"5.4.1 对抟食的遍知“当抟食被遍知后，对五种欲乐的贪染就会被遍知；当对五种欲乐的贪染被遍知后，那系缚着圣弟子再来此世间的结缚就不存在。《义注》和《复注》说，这是指对抟食的知遍知、审察遍知和断遍知。那么，以这三种遍知而遍知。到底应该如何遍知呢？第一，在此，诸比库，比库了知：所谓“抟食”即是这食素为第八的色法，包括由其他要素（即四大、颜色、香、味七种色法）构成的基础。这一部分需要我们修习止禅， 以及证得名色分别智的时候， 才有能力去修习。"],[16,3741,3832,1,"今天时间到了，我们先学习到这里。愿大家都能够精进地禅修，证得定力，成就名色分别智，亲自遍知抟食。祝福大家！Sādhu sādhu sādhu"],[17,0,162,1,"170 讲-摄集-生命的四食 4古源尊者一 引言上一堂课，我们学习了遍知四食。回到《子肉喻经》 ，佛陀对如何遍知有很清楚的指导。对于遍知， 我想从两个角度、 两个方面来讨论：一、依着佛陀的教导，从观智的角度看如何遍知；二、从生活中彼分遍知。《子肉喻经》 关于如何遍知抟食、 触食、 思食、 和识食， 佛陀说：“诸比库！当抟食被遍知后，对五种娱乐的贪染就被遍知，当对五种欲乐的贪染被遍知后，那系缚着圣弟子再来此世间的系缚就不存在了。"],[17,163,273,1,"二 知遍知、审察遍知、断遍知抟食的三种遍知第一、知遍知：佛陀教导说，诸比库！应该了知，所谓抟食就是色素为第八的色法，包括其他的要素（四大、颜色、香、味这几种色法） 。其实，一种抟食是外在的食物，我们讲时节生色，通过口吃进去。时节生八法聚撞击我们的舌净色， 舌净色依什么？舌净色依于四大种。因此，进食的时候，食素为第八的色法、舌净色及作为其诸缘的四大种，这些法就是色蕴。对于摄取该色蕴而生起的触，经典上经常会出现“触为第五的诸名法”"],[17,254,380,1,"。触为第五是指触、受、想、思、识。触受想思识这五法，是四种非色蕴。当你吃东西的时候， 五蕴就在那里出现了。你接触食物的触，产生感受，对它的标记，对它的认知，所有这五蕴只是“名色”另一种观察的方法： 对欲界有情以及色界天人来讲， 心识依心色处而生起。你在看每一条心路除五识之外的每一个心时 —— 不管是果报心， 还是业轮转的心， 还是唯作心， 每一个心识都依依处而生起。“依色处而生起”的“色处”，是业生十法聚。业生十法聚的食素就是抟食；心里面的触心所就是触食；思心所就是思食；识就是识食。也有这样的观照方法。"],[17,371,578,1,"禅修者如是了知潜藏于进食行为背后的究竟实相， 即进食过程中相应生起的名法、色法以及它们的成因。依它们各自的作用与特相限定这些法后，他探求它们的缘，并在顺序与逆序缘起中看到： “在此定义为名色的五蕴， 其缘为识；[识]的缘是[业]行， 其缘为无明。”如此在抟食的面向中如实知见名色及其缘后，即对抟食以知遍知而遍知。俢观的时候，老师会建议你观察：吃饭的时候，抟食进入嘴巴，看到时节生色在业生命根九法聚的火界支助下， 变成食生食素八法聚的过程，以及观察你在接触食物时的触，你的感受，酸甜苦辣，好吃不好吃？有什么心理反应？产生什么样的思？以什么相应的识来识别？所有这些名法和色法的特相、 作用以及成因， 都要能观察到， 这是知遍知。"],[17,578,697,0,"第二审察遍知：对该名色及其缘培育无常、苦、无我三相，并以七种随观思惟。由此， 对抟食以包括通达三相与思惟智的审察遍知而遍知。第三断遍知： 藉由从对该名色的欲贪回撤的不来道而遍知， 回撤就是不再有欲贪。在修行证果的路上， 不再有欲贪是三果以上的圣者， 以不来道对抟食以断遍知而遍知。“当对五种欲乐的贪染被遍知后， 那系缚着圣弟子再来此世间的结缚就不存在。”这是指他藉由断遍知而断除欲贪结，成为不来者。不来道在断除欲贪的同时也断除了瞋恚。再加上证得初道时已经断除了有身见、 戒禁取见和怀疑， 所以说不来圣者已经断除了五下分结。由于不来圣者已断尽将有情系缚在欲界的欲贪、 瞋恚两结， 所以不会受到欲界烦恼力的牵引， 而再投生到欲界。所以佛陀讲： “那系缚着圣弟子再来此世间的结缚就不存在了。。不来圣者如果没有在当生证得阿拉汉而般涅槃， 则只会投生到梵天界， 成为梵天人，他们大多会投生到色界的第四禅净居天里面。"],[17,697,788,1,"仅仅对四食中抟食的遍知，就可以证得三果圣者——不来此世间，离开欲界的系缚。这是对抟食遍知的一种修观方式。为了解释经文中的同一段文句，即“当抟食被遍知后，对五种欲乐的贪染就被遍知”，注疏里也提到另外一种三遍知的方式：一遍知，全遍知和根遍知。第一：一遍知一遍知是什么意思呢？“若比库，完全了知舌门的味爱一种，由此对五种欲乐的所有贪染， 都能够被遍知。， 为什么呢？“因为当时该渴爱生起于五门： 生起于眼门的渴爱称为色贪；生起于耳门的渴爱称为声贪。这就犹如一名强盗在五条山道上行凶， 若在其中一条道上将他抓获并斩首，那么，五条山道都平安了。同样的，若于舌门，味爱被遍知，则于五种欲乐的贪染亦被遍知，这名为一遍知。"],[17,788,894,1,"所以，对于五所缘的遍知，如果你使用得当，只要对抟食、对舌门味爱这一种欲乐的贪染遍知它， 不用把所有五门都遍知， 而是仅透由抟食这个遍知，就能证果。这是一遍知的意思。第二、全遍知什么是全遍知呢？于放入比库钵中的一口食物， 可得所有五种欲乐的贪染。如何获得呢？看到食物洁净、光鲜的外表而有“色贪”。滚烫的酥油浇淋其上发出嗞嗞声， 或咀嚼硬食发出吧唧声， 享受它即 “声贪”。享受食物的气味即“香贪”。透过可口的味道而有“味贪”"],[17,894,1006,1,"。享受食物的软糯之触即“触贪”如果以念与正知来把握食物、 无欲贪地受用食物， 就是对它全部的遍知，称为全遍知。第三、根遍知什么是根遍知呢？对此五种欲乐的贪染， 抟食是根、 是基础。所以佛陀总是以抟食作为四食的根本，因为抟食是根或基础。注疏说：此有而彼生。因为有抟食， 其他所有食或者五门其他的贪染才能生起。据说， （在锡兰）婆罗门帝思之乱的饥荒时期，夫妻之间甚至都不会生起欲心，因为吃不饱饭，食物短缺，饿得眼发花，其他的欲望根本起不来。然而， 动乱平息以后， 整个锡兰岛就如同一个在庆祝孩童出生的圣典， 大家都很欢乐。若食被如此遍知为根， 则对五种欲乐的贪染亦被遍知， 这叫做根遍知。这是对于抟食的遍知， 有两类这样的观察方式。"],[17,1006,1064,0,"三、对触食、思食、识食的三遍知触食怎么被遍知呢？佛陀说，“诸比库！当触食被遍知后， 三种受就被遍知， 当三种受被遍知后， 我说对圣弟子而言， 没有任何还应该做的。” 《义注》说，“犹如被剥了皮的母牛，暴露在遭受依于各处的生类袭击的危险之下， 它不会希求对自己的恭敬和尊敬， 也不会希求得到以热水清洁后背和按摩身体。”皮都没有了， 不会期待还要清洁后背按摩身体。同样地，比库看到那些吞噬的生类——根源于触食之烦恼的怖畏，他不会欲求三地之触。在此也有三种遍知："],[17,1064,1153,1,"1）在这种情况下， 触食是行蕴；与它相应的受是受蕴；想是想蕴；心是识蕴；它们（相应的）依处及其所缘是色蕴。如此如实见名色及其缘即是“知遍知”。名色的缘是识， 识的缘是行， 行的缘是无明、爱、取。这样倒回去，你能看到，这是知遍知。2）对它培育三相，藉由七随观检查考量它为无常等，为“审察遍知”3）对该名色（组合）捨弃欲贪的阿拉汉道，为“断遍知”当如此以三种方式遍知触食后， 以它为根源、 与它相应的三种受也被遍知。以此方式，触食的教示导向于直至阿拉汉果。所以，经文中说“对圣弟子而言，没有任何还应做的”"],[17,1153,1273,0,"，即指阿拉汉“应作已作”对于思食的遍知： “诸比库！当思食被遍知后，三种爱被遍知，当三种爱被遍知后，我说对圣弟子而言，也没有任何还应做的。《义注》中对于思食遍知的解说与触食遍知的三种方式是相同的，“当意思食被遍知后，三种爱被遍知。”三种爱即欲爱、有爱和无有爱。因为业思根源于渴爱， 所有的行都是因为你有动机。只要你不是阿拉汉，你的动机都是无明、爱、取，所以业思的根源是渴爱，因未断，则果不会断， 无明渴爱没有断， 你一定会造业， 造业就一定会有结果。关于三种爱， 《长部义注·大念处经》的注释说，欲爱是对欲望的渴爱， 也就是对五种欲乐的贪爱；有爱是对生命的渴爱， 也就是由于对生命的希求而生起与常见俱行的对色界和无色界生命的贪， 以及对禅那的贪欲；无有爱是对无生命的渴爱， 就是与断灭俱行的贪 （断灭见还有贪，贪那个断灭） 。以此方式，思食的教示导向于直至证得阿罗汉果。"],[17,1273,1336,1,"对于识食的遍知，佛陀说，“诸比库！当识食被遍知后，名色就被遍知， 当名色被遍知后， 我说对于圣弟子而言， 就没有任何还应该做的了。《义注》 在此解释， 识食的遍知与思食、 触食的三种遍知方式是相同的。根据缘起，识缘名色，识被遍知，则由之俱生的名色亦被遍知；名色被遍知则识被遍知， 识被遍知则行被遍知， 行被遍知则无明、爱、 取被遍知。以此方式， 识食的教示也是导向证得阿拉汉果。所以，对无明的认知，看到无明的无常、苦、无我，捨弃对所有的贪爱，就能证得阿拉汉果。"],[17,1334,1436,1,"以上是经文以及《义注》中关于触食、思食、识食三种遍知方式的解释。我们要明白， 觅食是苦存在的根源， 这种饥饿和渴求与生俱来， 我们从结生开始就不曾中断对四食的追求， 因此我们会习以为常，自然而然地认为这是日常生活中最基本的动能， 而对生命的苦浑然不觉。作为佛教徒，我们需要反思，从而揭穿这种假象，真实看到无始以来掩藏在觅食背后的痛苦。四、四食的遍识触食从可意所缘和不可意所缘中摄取精华来滋养其他的名法。现代人的触食瞄准的还是那些物质化的东西， 包括各种食物、 商品、 利益得失， 这样的触食所滋养的识食， 几乎不可避免的只会增长贪瞋痴，推动人们争夺、掠夺、抢夺，抢掠资源和财富，乃至不择手段，施行暴力， A 国家制裁 B 国家， B 国家报复 A 国家， 世界各地战争、 动乱、饥荒、各个族群、各个国家之间为了争夺土地、抢占资源、世界市场而出现的各种争斗，乃至于出现战争，层出不穷。"],[17,1436,1547,1,"或者我们只需去菜市场看看，那种无数动物被屠杀的苦：世界的每一个角落都是苦， 都是苦迫。向智长老讲： “由此， 关于人类的未来，昔日老师所教诫的法依然是真理： 觅食是苦始终存在的根源。当人类从食物的观点思惟自己的本性， 思惟自身对食物无止尽的需求， 以及思惟置身于一个以食物为生命忠实伙伴的世界， 如此危机意识就能被唤起。正见经——爱灭则食灭，食灭则苦灭 藉由对苦与四食的省思，可以延伸出与四圣谛相对应的思考。在《中部·正见经》中，比库们向沙利子尊者 （Sāriputta， 捨利弗） 请教解脱之法， 沙利子尊者回答说：“贤友们，圣弟子了知食，了知食之集，了知食之灭，了知趋向食灭之道迹。贤友们！至此圣弟子有正见，有正知见，与法俱足不坏净，通达此正法。贤友们，什么是食？什么是食之集，什么是食之灭，什么是趋向食灭之道迹？贤友们， 有这四种食， 存续已生的有情， 支助寻求出生的有情。哪四种？或粗或细的抟食， 触为第二， 意之思为第三，识为第四。爱集则食集，爱灭则食灭，趋向食灭之道迹，就是这八支圣道，即正见、正思惟、正语、正业、正命、正精进、正念、正定。"],[17,1547,1595,0,"贤友们， 圣弟子如此了知食， 如此了知食之集， 如此了知食之灭，如此了知趋向食灭之道迹， 他捨断一切贪随眠， 去除瞋随眠， 根绝“我是”的见与慢随眠，捨断无明而生起明，在当生做苦的终结。贤友们！至此圣弟子有正见，有正知见，与法具足不坏净，通达此正法。由此可知， 四食即是苦圣谛。对四食的渴爱是苦集圣谛， 渴爱的灭尽 （对物质和心理四种食物执取的断除） 是苦灭圣谛。八支圣道是实现苦灭之道谛，是导向苦灭之道圣谛。"],[17,1595,1672,0,"我们也可以从另一种角度来理解如何灭除对四食的渴爱， 籍由世间和出世间的知遍知、 省察遍知和断遍知， 当道智次第生起时， 我们对于四种食的欲望和渴求就会不断地被剥弱，直至被彻底断除 。沙利子尊者讲到要了解对四食渴爱生起之集，在 12 缘起支里，它是属于逆缘起第二法，也称为缘起第四法。《清净道论》里面比喻第四位采滕人， 他先找到藤的中间， 然后割断中部， 再沿着藤从下往上拉，一直拉到根部，然后把它带走。"],[17,1672,1949,1,"这里佛陀教导说： “诸比库， 什么是这四食的因缘呢？什么是它们的集呢？什么是它们的生因呢？什么是它们的原因呢？这四食以渴爱为因缘，以渴爱为集，以渴爱为生因，以渴爱为原因，渴爱的因缘是什么呢？受、触、六处、名色、识、行的因缘。对于四食的缘起， 怎么观察呢？在 《清净道论》 和帕奥西亚多的《智慧之光》里，提出几种方法，我们简单做个介绍：第一种方法，帕奥西亚多提出始于果报轮转的四食辨别法，若你的结生是三因悦俱结生，那么在结生剎那即有三十四名法与三十 种业生色。在结生剎那的四食是： 1. 段食：三十种业生色里的业生食素；2. 触食：与结生识相应的触；3. 意思食：与结生识相应的思；4. 识食：结生识。以辨别这四食为始。如此辨别时，若分为三世： 1. 四食(即果报轮转四食)是属于今世；2. 有、取、爱、受、触、六处、名色及识是属于第一个过去世；3. 行与无明是属于第二个过去世。如此辨别至更远的过去与未来，连贯三世的因果关系。以相同的方 法，你也可以始于辨别其余的果报轮转四食。"],[17,1949,2056,0,"第二种方法， 帕奥西亚多教导始于业轮转、 四食的辨别方法。如果你要辨别属于业轮转的四食， 先要辨别为未来的轮回而造下的业轮转法。假如你为了来世能够成为证悟阿拉汉果的比库而造下了很多的善业，比如禅修、持戒、供养、服务，你选一个自己记得的业，俢观的时候，去看造这个业行当时的速行。如果下一生该速行导向结生，它是第七个速行。在造该业时生起的四食： 首先， 每一个在心脏里的或在身体里的四种等起食素 （四因生色身） 里面的食素全部看为抟食；因为造作的是导向阿拉汉的业， 所以是善速行， 这个善的第七速行名法组里面的触就是触食；思心所就是意思食；悦俱智相应善心的心识就是识食，也就是业识。以辨别这个四食为始，触、思、识称为业有的善行法，业有是业轮转的一部分。"],[17,2056,2165,0,"从我们这一生 12 缘起支来看，我们这一生造的业是有，会导致来生出生， 这是业有。业有， 即你认为未来会有一位比库可以证得阿拉汉果， 这是无明。基于无明而有爱取， 对能证得阿拉汉的比库生命有渴爱、执取。然后造作布施、持戒、禅修的业，导致业有的存在，这是他的这一生。业有是有缘取，有是因为取，取是因为爱，爱是因为受， 受是因为触， 触是因为六处， 六处是因为名色， 名色是因为识，这是当生的，属于现世之法。无明缘行就是上一生，生、老死是下一生，这是基于业轮转的识生起之缘的辨识方法。"],[17,2165,2277,0,"大家在修缘起的时候可以去观察四食的缘怎么生起。如何辨知、观察它的缘起属于知遍知的范畴。首先对刚才讲的每一组， 不管是从果报开始辨识，还是从业轮转开始辩识。这些名法和色法里面特相、作用、现起、近因，以及它们生起之因，这是知遍知。看到特相、作用、现起、近因，是当下。看到它生起的缘，即刚才我们讲的 12 缘起支里面，佛陀教导的缘起第四法（逆缘起第二法） ，可以这样来观察。对四食的所有名法和色法，它的共相，无常、苦、无我三相的观察，就是审察遍知，对四食的审察遍知，是从思惟智阶段开始。当你的观智次第成熟， 生起道智， 这是对四食的断遍知。从抟食开始修习，可以证得三果；对触食、 思食、 识食修习断遍知可以证得四果阿拉汉。这是我们修观时做的。"],[17,2277,2340,1,"在日常生活中， 许多人没有观智， 那么要不要去观察四食呢？也是要观察的。怎样去观察？就要通过佛陀教导的阿毗达摩， 从十二缘起支，通过思惟来观察，也能够知道、了解这四种食。五、结生识刚才讲了如何从抟食的角度， 思惟遍知色身的无常、 苦、 无我的真相。从一期生命来看，结生识是识食， 《义注》说： “识食，在此指结生识， 即在结生刹那喂养及缘助与之相应的其他三种名蕴， 且以俱生等缘的方式喂养缘助三十种色法以三种相续而生起。"],[17,2340,2509,1,"结生识从哪里来呢？结生识来自上一生临死前成熟的业， 上一生临死前成熟的业是因为过去曾经造下善行。投生为人肯定是善行， 在临死的时候，遇到合适的因缘善行成熟了。他当时为什么会造下善行呢？在造下善行的那一生或者那一刹那， 他必定认为某一件善行值得去做， 值得去做的背后是他的爱和取。对于凡夫来讲，乃至于对于有学圣者来讲，无明潜伏在“他认定去做”的观念中。举例而言，由于过去生供养僧团的善业，导致这一生投生为人。供养僧团善业是过去的行，这个行是意思食。我们看到、听到、思惟到的僧团是眼触、耳触、意触，是触食。《义注》上说，触食喂养及缘助三种受： 如果供养， 就会生起乐受， 我们想到供养僧团就很欢喜，促使我们有力量去供养僧团。供养僧团后， 善业这个行就留下了业的力量。在上一生临死时， 即死心之前的临死速行心路里， 业的力量成熟，如回忆起来供养僧团的善业，产生三种所缘之业相、趣相或业，成为临死速行的所缘，以这样的管道产生这一生的结生识。"],[17,2488,2629,1,"结生识就是识食。当与结生识俱生的业生色 （俱生的业生色有性根色、心所依处色、身净色三种业生十法聚）达到住时，受到从母亲身体传达到胎儿的食生食素八法聚支助，开始产生新一代食生色聚，开始支助滋养受精卵（胎儿）这个身体，就是抟食。所以从结生开始就接受抟食。从更细的层面讲， 三种业生十法聚里面的食素本身就是抟食。结生心灭去以后， 从第一个有分开始， 每一个心识 （除双五识和四个无色界果报心）刹那生起，都有俱生的心生色法。也即是从这时开始，识食就有力量产生出物质来滋养色身。在母胎中， 我们依靠母亲传递过来的食生食素八法聚为食， 当母亲把我们生下来， 我们就需要不断地摄入时节生食素八法聚做为食物。食物在命根九法聚火界的支助下， 产生食生食素八法聚， 并遍布全身， 滋养全身各处的四因生色聚。什么叫四因生呢？业生色聚， 食生色聚， 心生色聚和时节生色聚。抟食就是这样滋养我们的色身。在我们生命期间， 我们看到就会有眼触，听到就会有耳触，嗅到就会有鼻触，尝到就会有舌触，接触就会有身触，你每天在想、思惟就会有意触，这些都属于触食，我们依靠这六种触食生存。"],[17,2629,2710,1,"《义注》说： “触与所缘接触，通过使乐受等升起而令有情存续。触缘受，受缘爱，由于触而生起感受，当执取愉悦快乐的感受时，就会想要得到更多， 于是我们所有的行为会朝向这个方向， 为了更多地获得快乐的感受而去造下善或不善业，这是思食。也称业轮转。对目标的确认、 思考、 推理、 判断是心识能缘的功能， 这是识食。推理判断以后， 识又会导致我们追逐新的抟食和触食。在追逐及获取的过程中，我们需要不断地规划，不断地努力造做、付出行动，这又是思识。思识又缘助三有， 因为思就是业， 该业在临终时成熟又会产生下一生的结生识。"],[17,2710,2865,1,"通过思惟观察，可以发现生命的过程无外乎就是对四种食的摄取，对名色的滋养、吸收，乃至于名色被同化。这种了知，可以称为彼分的知遍知。它不是观智的知遍知， 它是思惟层面的知遍知。当我们能够看到四种食之间的关系， 我们就能够依着十二缘起支的方法来观察四食。同时， 通过学习， 我们可以知道四食是无常的、 苦迫的、 非我的。虽然我们不能够在究竟法的层面上知道，但是我们可以观察抟食本身： 不管是煮熟的还是生的食物， 只要没有及时享用它， 很快就会坏掉， 它呈现概念的无常相。所有接触都是刹那过去的， 所有乐受都是边际效应递减的、会消失的。你每天努力工作，今天想这个，明天想那个， 都是刹那刹那无常的， 都是你后面的一堆念头在指导， 在指挥。我们无时无刻不在找这种认知， 打个坐都妄想纷飞。我们可以从概念层面上看到它是无常的，遭遇及造作产生的种种苦，是苦迫的，所有的过程都无法管控，是无我的。这样来观察是彼分的审察遍知。当我们至少从理论思惟上透彻地理解轮回的实相、 生命的实相的时候， 至少能够短暂地镇伏对四种食的渴求和摄取。"],[17,2865,2935,1,"本来你很想， 今天听完课不想了， 不想的那一刻就是彼分的断遍知， 这属于没有观智下的思惟知， 日常的观察不是在观智下的遍知。但这是重要的， 因为思惟能产生效果， 我们讲闻思修， 听闻， 接下来是思惟， 思惟层面上的遍知也能产生相当的效果，它能够让我们培养起日常生活的正见，就是经常讲的睁眼八正道。在日常生活中怎样培养正见、正思惟、正语、正业、正命，正确的认知行为模式，可以通过对四食的观察、省察、省思来培养。对于四食的渴爱，可以彼分断除。"],[17,2935,3023,1,"当我们对世间的遍知能够很绵密、 很有效地培育生起， 那么不管是止禅还是观禅，乃至未来的道智、果智，就比较容易生起，有基础了。依靠这四种食物强力的支助滋养， 有情才能够存续。这四种食物是绝大多数人毕生的追求， 希望能够籍此给自己带来健康的身心， 完美快乐幸福的人生！但却很少人懂得分辨哪些是正确的、 对生命真正有帮助的食物，哪些是有毒的食物。作为佛教徒， 我们应该了解什么是正确的四食， 摄取怎样的四食才是真正有益于身心健康。佛法是快乐之道， 佛陀讲苦， 但是最后佛陀是希望众生离苦得乐。"],[17,3023,3107,0,"追求快乐是有情的天性。快乐至少可以分成四个层次： 第一个层次，感官的快乐、五欲的快乐；第二个层次是善法的快乐。当善心生起、正念正知、布施、持戒、修行，就有快乐；第三个层次是禅那的快乐，止观的快乐；第四个层次是解脱的快乐。佛陀在《沙门果经》里面，对于善法的快乐、禅那的快乐、解脱的快乐，描述的非常的细致。什么样的食喂养才能够缘助快乐产生呢？或者说要籍由什么食才能获得快乐呢？对四食的饥渴来自于对感官之乐的贪爱。触食就是带来欲乐的色声香味触法种种对境；思食就是对获得这些缘触生受， 进行各种思考、决意、规划、行动，以获得自己渴望的色食和名食；识食就是为了最大限度地满足欲望而不断地扩进， 生生不息， 轮回不已。这就是喂养感官之乐的四种食。"],[17,3107,3220,0,"然而， 贪爱之心执取来的感官之乐边际效应递减、 稍瞬即逝、 永无饱足， 且由此累积的无量无边的不善业， 会导向长久的痛苦， 乃至于恶趣的生命。这是喂养五欲之乐的名食产生的后果。喂养善法之乐的名食会导向更高的层次，我们说行善之乐、为善最乐。一般人都能做到的行善的快乐： 孝敬父母、 恭敬老师、 帮助穷人。以十善业为例， 当善法生起， 我们生起至少无贪、 无瞋二因善心时，不论是悦俱的还是舍俱的，它都必定伴随着心和心所的轻安性、轻快性、柔软性、适业性、练达性、正直性，这六对十二个美心所。也就是说， 我们在做善行的时候，一定是轻安舒适的， 这种心的心生色法一定是健康的、 适宜的， 对我们的身体是有帮助的， 这时我们体验到的快乐会导向善， 它不会带来恶果。对于行善之乐， 它的触食是导向于善法的所缘；思食是善业的累积，缘助导向欲界善趣的生命；识食是识知所缘， 并促使欲界善趣名色的生起。以上是行善时四食的导向。"],[17,3220,3278,1,"禅定的快乐。禅定的快乐是比行善的快乐更殊胜的、 更清净的善法之乐。禅修者通过捨离五盖、专注特定的所缘而证得禅那。《沙门果经》里面对初禅这样描述，“他已离诸欲，离诸不善法，有寻有伺， 离生喜乐， 成就初禅而住。他此生乃被离生之喜乐所浸润、流遍、充满、遍布，其身没有任何一处不被离生之喜乐所遍满。。如此，禅俢者远离、独处，可以日中一食，乃至于好几天断食，他的心只专注于所缘目标。对于禅定之乐， 他的触食是单一特定的所缘， 不需要到外面找。"],[17,3278,3395,1,"前面两种乐需要有外面的目标对像， 但是禅那， 只需要单一特定的所缘（如入出息）就可以达成，不需要靠别人；思食就是禅那业的累积， 导向于色有或者无色有；识食就是识知所缘， 看到似相 （禅相） 。它的业促使色有和无色有生起（识食） 。此时，这三种名食会比追逐外境更强大、 更有力量来支撑我们的身心状态， 其殊胜的心生色法会让禅修者诸根明净。很多人禅修好的时候，他的脸色很干净，很明净，眼睛很有神。曾经有一段时间在眉谬帕奥禅林， 有一段时间不知道什么原因， 大家兴起禅修时间最长的比赛。刚开始一位尊者坐了七个小时， 后面有位尊者说双盘禅修 12 个小时，很快记录被突破，有人说坐 15 个小时，又有人报告说坐 19 个小时。没有保持多久，又有人报告说可以坐 24小时，这是一位斯里兰卡的尊者，我们平常看到他非常的谦卑柔和，他向老师报告的时候， 显得很不好意思， 说坐了 24 个小时， 很快乐，非常非常愉悦。这是我们眼前能观察到的，实实在在发生的事情。当一个人的心专注于禅那所缘的时候，他可以长久地沉入所缘，入定数小时、一整天，乃至七天，他出定以后容颜清净光洁、身心愉悦。"],[17,3395,3438,0,"他不需要去外面看热闹、欣赏音乐、享受美味，不要呼朋唤友、谈天说地， 也不需要做很多的思辩， 他只是静静地坐在那儿， 身心就可以得到禅那善法的全然滋养，非常愉悦。更高级的名食是带来解脱之乐的喂养， 这是比善法之乐、 禅那之乐更殊胜、更快乐，是至上的解脱之乐。当一个人证得涅槃、 道智生起时， 他缘取涅槃为所缘， 他的触食是涅槃， 他的思食是道智或者后面生起来的果智， 他的识食是道果智的速行心识，这些是圣者的三种名食。"],[17,3438,3497,0,"当三果圣者与阿拉汉圣者进入灭尽定的时候， 他会先决意： 袈裟、钵等生活用品不会被火等任何灾难损毁。在灭尽定当中， 他自身也不可能受到任何伤害。再者， 当他从灭尽定出定的时候， 如果有任何的具德者以清净之心以及如法所得之物供养他， 这个布施善业， 当下就能获得殊胜的果报， 得到巨大的财富， 或者实现愿望， 或者实现布施者于未来成就更殊胜、 更广大的果报。可见这种名食对于自己、 对于他人都具有极其强大的力量。这四种快乐的获得跟四食的品质提升与超越有关。"],[17,3497,3604,0,"我们现在应该知道什么是正确的食了， 什么样的食才可以带给我们真正的快乐。在阿拉汉无余涅槃的时候，所有的食都被无余灭除，阿拉汉再无后有。在般涅槃之后， 不再需要任何食， 他彻底从四食的追逐中解脱出来，进入寂静永恒的涅槃之乐。祝愿大家早日从四食的追逐中彻底地解脱出来， 进入寂静永恒的涅槃之乐！"],[18,2,172,0,"今天继续学习《阿毗达摩》第七章的内容，上堂课学习了四食。按照课程，本应学习<三十七道品>，因考虑将<三十七道品>与第九章<止观>结合着学习，故先来学习<摄一切>。一、摄一切之概要（一）一切各别法之分类法摄一切之概要：这一篇是收集并分类《阿毗达摩论》里包含的一切各别法（五蕴、五取蕴、十二处、十八界、四圣谛）。列出这些分类法并不是为了发展抽象的本体学， 而是为了显示观智观照范围之内的诸法。五蕴、五取蕴、十二处、十八界、四圣谛都是究竟法。「若不实知一切、不遍知一切，人们绝对无法灭尽诸苦」。<摄一切>把《阿毗达摩论》前六章究竟法的部分整体地呈现出来。"],[18,172,224,1,"这张图表清楚地列出摄一切究竟法(请大家自己把上图中法处和法界里面心所与涅槃中间的竖线往右移到与第一行涅槃同样的位置)。摄一切第一类究竟法按四个类别来分，从名法和色法的角度，四种究竟法即是名色。28 种色法、89 种心、52 种心所、1 个涅槃（涅槃不属于名色），这是四种究竟法。《阿毗达摩》真正讲解的内容，就是心法，心所法，色法和涅槃。第二类是五蕴， 五蕴对应四究竟法： 28 色属于色蕴；52 心所属于受蕴、想蕴、行蕴；89 心属于识蕴。"],[18,223,340,1,"第三类,十二处对应到色蕴，与之相关的是眼处、耳处、鼻处、舌处、身处、色处、声处、香处、味处、触处、法处中的 16 微细色。法处并非全属于色法，除了 16 微细色外，心所是名法、涅槃是究竟法。意处对应到识蕴。第四类，十八界，是把意处分成五识界、意界和意识界。即是在十二处的基础上把意处扩展出来，其他的与十二处相同。关于这些名词须明白，色处纯粹是指颜色，其他的五处目标，如：色处、声处、香处、味处、触处的目标都是指色所缘，所以我们记这些名词时要理清楚，例如色存在五处的目标都是指“色所缘”"],[18,340,450,1,"，即色存在的地方；意根是指心，眼根、耳根、鼻根、舌根、身根是色法，意根是名法。这些容易混肴，要注意。再一个就是意处。意处完全是指 89 种心，它分成三个部分：第一部分是五识界（眼识界、耳识界、鼻识界、舌识界、身识界），即常说的双五识（眼识、耳识、鼻识、舌识、身识，善果报识和不善果报识，两个五合起来共十种识），这是五识界。第二部分是意界。意界仅指三个心：两个领受心（于五识之后）和五门转向心（于五识之前）。简单讲，什么是意界呢？就是五识（眼识、耳识、鼻识、舌识、身识，五门心路过程生起来的五识）前面的五门转向心和后面的领受心（领受又分为善果报的领受和不善果报的领受，所以是两个领受心），这三个心合起来称为意界。"],[18,449,527,1,"第三部分是意识界。意识界是八十九种心扣除双五识和三个意界心之后剩下的七十六种心。意界、意识界和意处大家容易混淆，要记清楚。另外，法处与法界，其内容是一样的，面对的都是 16 细色、52 心所、1 涅槃。这些是《阿毗达摩》里主要研究的内容，称之为“摄一切”（二）心取一切法上图在表解中被命名为“心取一切法”。从图中可见：心，除了取到《阿毗达摩》中描述的四种究竟法，还包括“概念”。心取一切法，还可以取“概念”"],[18,527,652,1,"又一容易混淆之处：“法处”“法界”和“法所缘”法所缘总共有六种：五净色（眼净色、耳净色、鼻净色、舌净色、身净色）；52 心所；16 微细色；涅槃；概念；所有心（意界、意识界、五识界），所有这些内容都属于法所缘。心取一切法，除了五境色或称五境色处或称五境色界（色、声、香、味、触）不属于法所缘，其他都属于法所缘的范畴，即意门可取的所缘。以上容易混淆的概念，帮大家复习一下，记住这张表,反复看，能较清楚地了解。"],[18,624,757,1,"（三）五蕴依据“心取一切法”展开来看，在<摄一切>的部分，首先了解五蕴。巴利文 Khandha（蕴），其义为一组一组、一堆一堆或聚合在一起。蕴，蕴积在一起，一堆东西、一组东西，聚集在一起的意思。佛陀把有情分析为这五蕴。在诸经里佛陀说道：“无论是哪一类色，过去的、未来的、现在的、内在的、 外在的、 粗的、细的、劣的、胜的、远的或近的 （十一种） ，这一切都称为色蕴。，对于其他四蕴（受、想、行、识）也是如此。即无论是过去、现在、未来、内在、外在、粗、细、劣、胜、远、近，所有的色、受、想、行、识，都可称为相关的蕴。"],[18,757,831,0,"五蕴中的色蕴，是指包括过去、现在、未来、内在、外在、粗、细、劣、胜、远、近这十一类的 28 种色法。28 种色法包括了四大种及四大所造色。色法里的核心是四大种（地大、水大、火大、风大），地水火风四大是色法的基本元素，另外的 24 种被称为四大所造色。受蕴，是指 89 种或 121 种心识中的受心所。感受可分为三种、五种、六种或者九种。简单地划分为三种：乐受、苦受和不苦不乐受；若再加上心的受，忧受和悦受，就有五种。每一种心里都有受。"],[18,831,926,1,"想蕴，是指 89 种或 121 种心中的想心所，它是非常重要的一个心所。我们经常认为有“我的”，就是把想心所的功能或特相当成是“我”。在《一切漏经》中常讲到：“我以无我感知我”“我以我感知无我”的那个“我”就是想心所。想心所，就是内心作记号（取相），它本身与思想活动无关，只是标记所缘。标记所缘，从整体来看有六所缘：颜色所缘、声的所缘、香的所缘、味道的所缘、触的所缘和法所缘。相应的想就有：色想、声想、香想、味想、触想和法想。"],[18,921,998,1,"行蕴， 是指 89 种或 121 种心中的 50 种心所 （扣除了受与想二种心所） ，归为行蕴。识蕴，是指 89 种或 121 种心中的心识（能缘），称为识蕴。（四）五取蕴五取蕴与五蕴之区别五取蕴，佛陀说： 「无论是哪一类与漏有关及会被执取的色、受、想、行、识，无论过去、未来、现在等十一种，这一切都被称为取蕴（色取蕴、受取蕴、想取蕴、行取蕴、识取蕴）」。五取蕴与五蕴的区别在于五取蕴可以成为执取的目标或者它们会组成被执取的目标。"],[18,997,1251,1,"执取，有哪一些“取”呢？即是四种取：欲取、见取、戒禁取、我语取（或称我论取）。一切能被四种取所执取的五蕴成分皆名为取蕴。这包括了所有的色蕴及属于世间的四名蕴。意为：即使佛陀或者阿拉汉的色蕴都是属于取蕴，但佛陀与阿拉汉的四名蕴不会是取蕴。出世间的四名蕴不属于取蕴，因为它们完全超越了执取的范畴，即它们不会成为贪或邪见的目标。“佛陀与阿拉汉的色蕴是取蕴”，并非指佛陀与阿拉汉会执取他自己的色蕴，而是指我们（凡夫）会执取，会成为我们执取的对象。五取蕴中色取蕴是 28 种色法，与色蕴相同。但受取蕴、想取蕴、行取蕴和识取蕴， 则分别对应扣除了 8 出世间心的余 81 心中的受心所、 想心所、扣除了受与想的余 50 种心所和扣除了 8 出世间心的余 81 心心识。（五）十二处十二处是另一个整体的分类法。此分类法从门与识的所缘分析一切各别法。五处（眼处、耳处、鼻处、舌处、身处）与五净色（眼净色、耳净色、鼻净色、舌净色、身净色）相同；颜色处、声处、香处、味处和触处与五所缘相同（与色、声、香、味、触所缘相同，也称为色所缘、声所缘、香所缘、味所缘、触所缘），即色所缘、声所缘、香所缘、……"],[18,1251,1328,0,"，与色处、声处、香处、……相同，没有区别；眼处、耳处、鼻处、舌处、身处，也代表着眼净色、耳净色、鼻净色、舌净色、身净色，是一样的。特别要分清的是第六项——意处,意处包括了整个识蕴,它甚至比意门还广泛，为什么这么说呢？意门生起的心是依于心所依处而生起，有分心作为意门，可以生起的心要扣除双五识；但意处却包括了双五识，它把所有的 89 种心都包括在内了。意门只是能够在心所依处里生起的心识， 这是不同的。"],[18,1328,1436,0,"前面提到法处不等于法所缘，一定要分清楚。法处只包括不属于其他十一处的各别法。即不包括五根所缘 （色、 声、 香、 味、 触） 和五净色 （眼、耳、鼻、舌、身五种净色），以及相等于意处里心识的部分。法处只包括52 心所、16 微细色及涅槃。法处也不包括概念，因为处(无论是哪一种处，眼处、耳处、鼻处、舌处、身处、意处和法处）辨识的都只是究竟法。只要提到处，它辨识都是究竟法。所谓究竟法即是拥有自性而存在之法，不包括概念，因为概念没有自性，不属于法处的范畴。"],[18,1436,1648,1,"十二处的「处」，也翻译为入（六入），巴利（āyatana）。入:生长门，为心、心所的生长门。十二缘起支中的「六处」有时翻译为六入，此「六处」的意处包含了 32 种世间果报心：（18 无因心扣除 1 阿拉汉生笑心及 2 转向心）+8 大果报心+5 色界果报心+4 无色界果报心。这是六处（六入）的部分。六内入处。「内」指有情自身，「处」或译为「入」，有：眼处、耳处、鼻处、舌处、身处、意处。要分清楚： 「眼处」 不是指眼睛， 而是特指眼睛内对颜色有反应的 「眼净色」。眼净色才称为眼处。我们所讲的眼处、耳处、鼻处、舌处、身处，不是指那一块肉团里所有的东西， 而仅仅是指对五所缘有反应的那些净色。眼净色、耳净色、鼻净色、舌净色、身净色也称为肉眼「不可见色」，不能为肉眼所见，但可作为修习「色业处」或观智的目标对像，可以被有定力情况下的观智所观察到。"],[18,1648,1744,1,"「意处」，不仅不能为肉眼所见，也不属于物质；不属于色业处，属于名业处， 可以被心觉知。意处包括： 眼识界、 耳识界、 鼻识界、 舌识界、身识界、意界、意识界。前五识界各有善、不善果报心。意界有三个：两个领受心及五门转向心。六外入处：色处（颜色）、声处（声）、香处（香）、味处（味）、触处（触）和法处(法)。「色处」是四大所造，属于「可见色」，北传翻译成「有对色」。声处、香处、味处，都是四大所造，属于「不可见」、「有对」（有对色）。「触处」，即触觉的作用：「身净色」能「触」及地、火、风三种所缘。"],[18,1744,1925,1,"「法处」,共 69 种：52 种心所法、16 种微细色、1 种涅槃。法处属于「不可见」，不能为肉眼所见。以上是对十二处简单地了解。（六）十八界十八界， 「界」 巴利语 （dhātu） ， 解释为 「持有」 或 「背負」 （dhārenti）自己的自性。十八界与十二处的差别：把十二处的意处分成七个识界，即得十八界。其他方面，处与界是相同的。十八界可分为三个部分：1、与五类感官相关的部分，是根的部分；2、五根所面对的对像，即五种感官对像，是所缘的部分；3、依这些根而生起的识。六根：眼界、耳界、鼻界、舌界、身界和意界，是属于根的部分；六境：色界、声界、香界、味界、触界五种加上法界，即所缘的对像是五种感官对像加上法界的部分；六识：五种能够识别的五识加上意识界的部分。以上为十八界的内容。"],[18,1925,2022,1,"（七）四究竟法与蕴、处及界之间的关系再来回顾一下第七章<摄一切之概要>中描述的四种究竟法与蕴、处及界之间的关系。四种究竟法：色法、心所法、涅槃和心，或称为色法、心法、心所法和涅槃。五蕴：色蕴、受蕴、想蕴、行蕴和识蕴。五取蕴：扣除了 8 出世间心以及相关的受、想、行，即扣除出世间的四名蕴，加上色取蕴,称为五取蕴。十二处:色法的部分包括内五处与外五处；法处包含 52 心所、16 微细色还有涅槃；意处就是 89 种心。十八界把意处分成五识界、意界和意识界，其他与十二处相同。"],[18,2022,2167,1,"记住这些图，对于四究竟法、五蕴、十二处、十八界的概念有所了解，不会混淆。（八）四圣谛四圣谛是佛陀的根本教法，在佛陀证悟之夜，由他无师自见，且在他四十五年漫长的弘化期间不断地重复开示。四圣谛称为「圣」（ariya）是因为它们是由圣者所洞见,因为它们是至上圣者佛陀所教导的圣谛,因为发现它们能够导向圣者之境,以及因为它们是真实、 不可变更、 绝不虚假之谛，故称为圣谛。苦圣谛可分为两大类： 1.生、 老、 死、 愁、 悲、 苦、 忧、 恼、 怨憎会、爱别离、 求不得；2.五取蕴之苦。简要来说就是除了渴爱之外， 三世间地的一切法都属于苦圣谛之内。三世间地： 欲界地、 色界地和无色界地。三个世间的一切法， 即除了出世间之外的一切法 （无论是色法还是名法） 都属于苦圣谛的范畴。"],[18,2167,2342,1,"苦集圣谛只有一法， 即相当于贪心所的渴爱。然而渴爱可细分为三个方面：欲爱、有爱、无有爱。欲爱是欲界感官的渴爱；有爱是对生存（存在）的渴爱，也有些称为色爱、无色爱。欲界天人也有‘有爱’，执取生命就是有爱；无有爱是断灭见持有者的渴爱， 持有断灭见者虽自认对生命没有执取，但他仍执取断灭见，故为无有爱。苦灭圣谛也只有一法，即通过去除渴爱而证悟的涅槃。趣向灭苦之道圣谛有八法，在四圣谛的教法里，特指在四出世间道心里生起的八道分心所。在此特指的四圣谛之道谛， 是指道心里生起的八道分：见是慧心所；正思惟是寻心所；正语、正业、正命是三离心所；以及精进心所、 念心所和一境性心所。我们通常说的八道分， 例如之后将学习三十七道品中的八道分可以是属于世间或出世间， 但在佛陀的四圣谛教法里， 它们则纯粹指出世间法， 也就是在四出世间道心里生起的八个道分，在道谛中是如此来定义的。"],[18,2342,2438,1,"除了四圣谛的教法， 三十七道品中的八道分则包含了世间和出世间的法。以前也讲过 ‘睁眼四圣谛’‘闭眼四圣谛’， 若从此角度来看，‘睁眼四圣谛’ 这个提法不够严谨， 因为 “道谛” 是特指四出世间道心。但是，世间一切事物的正确观察处理方法都可归纳到四谛法里来。若按前述的苦圣谛定义： 简要来说就是除了渴爱之外， 三世间地的一切法都属于苦圣谛。你所碰到的一切人、 事、 物都属于苦圣谛， 都属于苦， 都属于苦谛的范畴。也就是说当你面对一切人事物时， 正确的观察方法就是你一碰到所缘， 能不能生起："],[18,2438,2518,1,"“哦，这是苦谛，都是苦。,无论好坏都是苦，能不能生起这样的心？对于苦谛的态度，处理它时，苦谛分两个部分：1）生、老、死、愁、悲、苦、忧、恼，怨憎会、爱别离、所求不得；2）五取蕴苦。“生、老、死” 容易理解， 出生就一次， 死就一回， 老从出生开始一直贯穿着老去的过程。“愁、悲、苦、忧、恼”是一种心理感受，是忧惧扩大了。“愁、悲、苦、忧、恼”是由什么产生的呢？往往是由生、老、死、怨憎会、爱别离、所求不得和五取蕴这些苦而导致的。"],[18,2518,2611,1,"需特别说明“怨憎会、爱别离、所求不得”一般会直接认为：“怨憎会，就是那人与我有仇，我很讨厌他，但偏偏就要碰到。，简单理解是这样。但需要分清楚的是： 这个所谓的怨是真的吗？他真的害过你吗？不一定，对吧？！昨天有一位贤友报告说:“我觉得被冤枉了，委屈了，我应该怎么办？”， 我说：“你怎么知道人家冤枉你呢？他说你了吗？”他说：“没有， 是看他的眼神，我觉得他就是这么看我的，所以让我觉得我被冤枉了。，如果以这个冤枉而生起怨，那就是怨憎会， 下次再看到他时，“我觉得他还是这个眼神。"],[18,2611,2666,1,"，这就是怨憎会。所以这个怨是真的吗？真的是他伤害过你吗？不一定。我们很多的怨是自己制造出来的， 你的怨憎会、 爱别离， 都是自己制造出来的。不说爱别离， 单相思也是自己制造出来的， 人家没有爱你， 你非要爱人家爱得半死， 完以后你觉得：“啊，我就要离开她了，爱别离！”， 其实人家根本没有爱你，所以这个爱别离是你自己制造出来的。所求不得也是如此，昨天有位同学写心念日记，我觉得很好。他说他妈老指使他说："],[18,2666,2744,0,"“这个给我搞一搞， 那个给我搞一搞。一直弄， 他就觉得很烦躁，一口气就上来了， 想跟他妈顶过去。但是一想“不对呀，我在写心念日记呢！”，这一观察，就发现他对妈妈的厌烦，其实是因为对妈妈有一种不正确的所求， 认为妈妈不应该这么烦， 这点事情应该懂。他希望妈妈懂，“对于手机这点小事， 你应该懂， 结果你居然不懂！然后还一直要我做。，他其实对妈妈有一种“你不应该找我”的期待， 这就是所求不得！我现在的烦恼并不是妈妈给我制造的， 是因为我所求不得，我内心的问题造成我痛苦。这样理解就很好，对不对？所以，我们很多所求不得是真的吗？你每次说："],[18,2744,2810,1,"“哦， 这个东西我又得不到！”然后觉得痛苦！禅修也如此，“Bhante！我一想三十二身分，就很难受，就很紧张！”，但“我一不想的时候，诶！脚底很明显就呈现出来了！”这就是对三十二身分的所求不得。我一再跟他讲：“以你的定力， 你完全可以非常清晰地， 甚至不用入四禅就能很清楚地看到你的三十二身分， 而且事实上你也看到了。但是， 只要你有‘我想抓它’的想法时，就啥也抓不到。除了紧张之外，啥也没有。，所以你三十二身分修不动，被我说的时候，当场在那边“发火”"],[18,2810,2903,1,"，所求不得！这个发火真的是你“求不得”吗？以你的能力， 其实你是完全一点问题都没有， 你这个 “求不得” 是自己整出来的，“我想抓它”的时候，就完蛋了，它就没了。然后你接着下来就生气，“我求不得！”。所以我们面对一切人事物，你觉得苦恼，其实 90%是由自己制造出来的。苦集圣谛，就是由于渴爱所造成的。由于期待 —— 各种各样的期待、 不正确的期待、 无厘头的期待、 不切实际的期待，然而你又得不到。为什么呢？因为见解出问题了。"],[18,2899,2973,1,"所以趋向灭苦之道圣谛， 第一个道分是 “见”。前面讲到， 面对 “苦”面对世间一切人事物的正确观察处理方法， 首先要明白： 都可以归为四谛法， 即世间的一切人事物， 都是苦、 都归于苦谛的范畴；而造成苦谛的根本原因是因为有集谛；而集谛的造成， 会有集的根本原因， 是因为缺乏正见， 核心是因为缺乏正见， 基础是因为缺乏正见。因此我们面对一切事物的正确处理方法就是八正道。无论你是否学佛， 只要是想成就一件事， 你都得按照八正道来， 不按八正道， 事儿就做不成， 不信大家可以自己去试试看。"],[18,2973,3120,1,"日常生活中常碰到的“生、老、死”，是因为你产生了这样的生命。“愁、悲、苦、忧、恼，怨憎会、爱别离、所求不得”则是因为“见”出问题。归结起来，有哪些不好的“见”呢？有邪见等，其根都是无明。如何形容无明呢？就是把本来无常的、苦的、无我的、不净的视为常、乐、我、净。大家都很熟悉了，那你还会觉得常、乐、我、净吗？我们觉得佛教徒应该都很清楚“没有啊！都是无常的、苦的、无我的。，事实怎么样呢？我们觉得禅修就应该很顺利 （每个人都很希望） ， 这是常见。在家人一回家， 看到孩子下课在玩游戏， 会很生气。为什么要生气？孩子就应该在那边老老实实地做作业， 这是常见， 就是你认为孩子除了做作业不应该干其他的。然后， 小孩子做作业给你带来了什么？他学习成绩会好， 老师会表扬！学习成绩好、 老师表扬， 你心里什么感受？快乐， 他会给你带来快乐， 孩子给你带来快乐。所以你要怎么才能快乐呢？要孩子好好做作业、 听话、 老师表扬、 考试考得好。你的快乐并不是因为你爱孩子， 而是爱孩子的行为给你带来的内心感受。你讲："],[18,3120,3177,1,"“我很爱我的孩子啊！”，那你孩子玩游戏时你怎么不爱他呢？“孩子必须听我的话” 就是“我”，孩子是“我的”，其实孩子是他自己业的所有者。一看到孩子没有做作业，就觉得：“不行啊！我的孩子怎么这样子？别人的孩子怎么那样子？”—— 孩子是“我的”。当你把孩子当成“我的”时，所有问题都来了。其实我们在日常生活中面对一切事， 都是带着常、 乐、 我、 净的心态。有人总是认为：“老师就应该要怎么样。，到现在还没梳理完，对吧？"],[18,3177,3240,1,"“老师应该怎么样”就是常见。老师必须让我的修行一直进步、我所有的问题老师都能够解决。所以你对老师并不是真正的恭敬， 而是老师能给我什么， 然后产生对乐的感受的执取。在这个过程中， 你从来没有看到老师是无常的、你也是无常的；你是苦迫的、老师也是苦迫的；你是非我的、老师也是非我的， 然后就觉得：“我受伤了，我看他就是不对啊！他就是有问题，他就是应该如何如何。，这是“我”“离得远的，如果他有问题， 我可以无所谓， 但是在我身边，那就是不行。"],[18,3240,3308,1,"，这就是见解的问题，归结下来都是常、乐、我、净。把本来是“无常的、苦的、无我的、不净的”，看成是“常的、乐的、我的、净的”，这就是“我见”，出错的根本。不必批判：“讲本我有问题、 讲真我有问题， 佛教真正是无我的。你好像很高深， 其实不要那么复杂， 看你每个当下面对一切人事物时， 你表现出来的态度都是常、 乐、 我、净。只要你不是初果以上圣者，还没证得初果， 常规表现出来的都是这样。至于说：“佛陀真正的法是非我的。"],[18,3308,3403,1,"你不要穿马甲， 搞一个真我、 本我或超我， 那是终极目标的问题， 现在都跟咱没关系。跟我们有关系的是你面对一切人事物的时候， 你会不会生起来“你应该这样， 你不应该这样”的心？只要生起来 “我应该这样， 你不应该这样”的心，就是常乐我净，就会导致你愁、悲、苦、忧、恼、怨憎会、爱别离、所求不得，各种苦。这样，无量诸善法就不会生起来！这也是为什么说四圣谛的八正道法是从道心上生起来的， 但你不能认为： 四圣谛八正道，没有生起道智我就不能用了。"],[18,3379,3476,1,"二、四圣谛、八正道于生活中的运用所以四圣谛、 八正道， 佛陀说的快乐有力的武器是什么呢？就是如理作意。为什么能如理作意呢？如理作意就是从根源上作意， 而根源上的根本， 就是从知见上来作意， 从知见上来看。佛法非常深奥， 但佛法运用的时候并不复杂。碰到任何人事物， 这是苦谛， 苦在我面前已经出现了， 不管它在感官上给你带来痛苦还是快乐，即使带来快乐，但边际效应递减，后面还是苦。无论什么法，到你面前的都是苦。在“苦”起来的时候，一般情况下， 如果我们的心没有经过训练， 就会根据我们的习性 （动物性） ，跟着动物性去。"],[18,3476,3568,0,"虽然都是苦谛， 但是会给你带来感官快乐的， 你就会想抓取；会给你感官上或者你感觉可能会带来不快乐的， 你就会排斥。无始以来我们已经养成这样的习惯， 我们会直接地就去。这种惯性在佛法里称为寻。寻分为两种：不善寻、善寻。学佛了不能杀生，蚊子咬到手上，你的心（寻）自然地转向“啊，不能杀它，吹一下让它走。，这也是一种寻 —— 离害寻， 离开危害这个生命的离害寻就会生起来。对于一个世间人来讲：“蚊子是害虫啊！又会去伤害其他人，你们佛教徒的想法有问题啊！”。这就是害寻， 看到蚊子就会生起把它杀掉的心， 为什么？它会祸害人类、 传播病毒！生起的就是把它杀掉的害寻。"],[18,3568,3702,1,"这种惯性让你一面对所缘时， 你的心自然就去了。落于心路上， 六门心路里直接转过去， 五门心路里的确定心和意门心路里的意门转向心， 这两个心负责如理作意还是不如理作意。《注疏》中说：“如理或不如理，其实也不是确定心或五门转向心做的。， 如何理解这句话呢？很早以前就已经定下来了， 只是心到这个地方自动就转过去了。在此之前， 比如在确定心之前有五识，你眼睛看到了，接着领受它，然后推度它，在五识、领受、 推度心里都有想心所， 到了领受和推度里还有胜解心所。想心所的作用就是拿过去的标记来识别现在的目标；胜解心所就是做决断。所谓如理作意或不如理作意， 是你遇到所缘， 想心所拿出过去的标记交给胜解心所， 不应说是交， 心所是一起生起来的。胜解心所立刻根据这个过去的标记做出决断。如理作意或不如理作意在之前就已经做好了， 就是说你一看到蚊子， 蚊子就是必须得把它打死， 这是早就已经胜解过的， 早就已经决断过的。"],[18,3702,3762,0,"一看到，“叭”就过去了，哪需要如理作意或不如理作意再想一下呢？不用想
