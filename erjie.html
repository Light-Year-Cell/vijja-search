、取、行、业这五个因。假设使你在今世成为比库，是因为过去世供花给佛像之业，供花之后发愿未来成为比库。在如此发愿时，错误地认为有比库真实存在是无明；渴爱比库的生命是爱；由于重复而变强的渴爱是取。事实上，比库只是名色的组合体而已，如果你执取他的颜色，那就是色爱；如果你执取他的声音、气味等，那就是声爱、香爱等。基于想要见到颜色之欲，你造下善行，该行是无常的，一生起即刻就坏灭，但它在名色相续流中留下能令你获得比库生命的业力。"],[37,2769,2837,0,"你必须如此观照业力，然后再观今世的眼净色，往返地重复观这两者，以便照见它们之间的因果关系。观到这点时，你即了解被无明、爱、取围绕的行及业（过去五因）产生今生的眼净色十法聚，而眼净色十法聚中四界之透明性就是眼净色。此时你即观到眼净色的第二个特相：以色爱为因缘的业生四界之透明性。很多人说：“我在供花时并没有生起色爱，我只是想给佛陀供花。”色爱是潜藏在心流里面的。你看到佛像，你喜欢佛像，看到花你觉得这束花很漂亮，再供养给佛陀。如果没有眼睛就看不见，你不会闭着眼睛供佛，那底下潜藏着的就是色爱。"],[37,2837,3012,1,"一个人如果厌烦看到东西：“我不想看！”眼睛闭起来，小心变蚯蚓。蚯蚓就是埋在土里不想看任何东西，这样的无明、爱、取，不善业成熟时就可能变成蚯蚓。什么是色爱、香爱？有些人闻不到气味，就是过去对气味很厌恶，由于这样的业成熟，有可能导致他天生闻不到气味。色爱、声爱、香爱、味爱、触爱，都是潜藏在很底层的烦恼，在造作善行时，这五种爱自然而然陪伴着。如果你刻意地去除某样东西就要很小心，可能以后就没有。眼净色的作用是牵引或引领眼门心路过程到颜色所缘。在你想看或看到时，自然而然地生起一个眼门心路过程，眼净色就有这种牵引力，牵引眼门心路过程到色所缘。只有当颜色撞击眼净色时，眼门心路过程才能生起。如果没有眼净色，眼门心路过程不能生起。眼净色的现起是作为眼识的依处，也作为与眼识相应心所——触、受、想、思、名命根、作意、一境性的依处。在眼识刹那里，所缘取的目标是颜色，所依靠的依处是眼睛里的眼净色。在眼睛里有数不尽的透明色聚和不透明色聚，亦即有数不尽的眼净色，但每次眼识只依靠其中一个眼净色而生起。这就是为何佛陀在说到“比库了知眼”时用单数词来表达“眼根”。"],[37,3012,3086,0,"巴利语法分单数格和复数格，佛陀说到“了知眼”时，用单数而不是用复数。但佛陀在说到“他了知色”时则用复数词来表达“色尘”（颜色所缘），因为一个眼识可以同时缘取一群色聚的颜色（许多颜色）作为目标。眼净色的近因是以色爱作为因缘的业生四界。近因很明确，因为过去生对颜色有爱，这样的无明、爱、取的业而产生的四界。关于业生四界，在讨论眼净色的特相时已解释过。眼十法聚有很多，而每一粒眼十法聚都有业生四界和眼净色。眼净色的近因是同一粒色聚里的四界，而不是其他色聚里的四界。能如此观察到眼净色的特相、作用、现起、近因，你就已经“了知眼”。"],[37,3086,3244,1,"有人问：“既然眼净色是业生的，眼睛变得不好，近视眼是不是都是业？”不一定。大部分近视眼是由于错误地使用眼睛造成眼球变形，导致眼净色不能有效工作，所以不是过去业造成的。吃不适当的食物，会损害眼净色发挥作用，也是造成视力下降的因素。“他了知色”意思是：他依特相、作用、现起和近因了知业生、心生、时节生和食生色法的颜色。每一粒色聚里都有可作为眼识目标的颜色。颜色必须是某个东西的颜色，比如纸张的白色、袈裟的黄色或红褐色。同样道理，颜色是同一粒色聚里四界的颜色。当你能观察到色聚里的颜色时，应该观察它的特相、作用、现起、近因。颜色的特相就是撞击眼净色。若要观到这一点，应该先取一个眼净色，然后看一群色聚的颜色。这个很有意思，如果让哲学家看，应该很高兴。有个哲学问答：“在没有任何人的地方，有棵树倒下，声音有没有发生？”；“在完全没有人烟的高山上，一朵雪莲盛放，颜色存在不存在？”这里说颜色的特相是撞击眼净色，那么没有撞击眼净色的颜色算不算颜色？存在不存在？这是哲学命题。佛陀的定义很清晰，颜色的特相是撞击眼净色。"],[37,3226,3359,1,"若要观察这一点，先取到眼净色，然后看一群色聚的颜色。当那颜色撞击该眼净色时，你就看到颜色的特相。颜色的作用是作为眼识的目标。若要观察到这一点，你应该先观察一个眼净色，再观察心的意门，然后看到一团色聚的颜色。当那颜色同时撞击该眼净色及有分心（意门）时，眼门心路过程就会生起。眼门心路过程的第一个心是五门转向心，第二个心是依靠眼净色而生起的眼识，此眼识缘取撞击眼净色的颜色作为目标。颜色的现起是作为眼识的行处（即眼睛的对境）。眼睛看到这样的东西，这个对境被眼识识知。如果你看别人的眼仁，会发现眼仁里有你脑袋的形象，你被映在里面，就像照相机一样。颜色的现起，颜色出现了即出现在你的眼睛里面，这是眼识的行处。作为眼识的目标及作为眼识之行处两者有什么差别？眼识必须缘取颜色为目标才能够生起，而一个颜色必须重复地被许多眼识缘取，因此它是眼识的行处，即眼识经常去的地方。"],[37,3359,3453,1,"有时非常快地看一眼，不能把目标看清晰，要对着它看或者多看几眼，多看几眼时如同已拍照无数次，眼识刹那刹那地生灭，生起无数次眼识，也生起无数条心路过程，但是心一直都朝向那个色所缘，就称为行处或常去的地方。颜色的近因是同一粒色聚里的四界，是属于地、水、火、风四界的颜色。（二）也了知缘此二者而生起之结前面已解释“比库了知眼，了知色”接下来解释“了知缘此二者而生起之结”，它的意思是：他依着特相、作用、现起、近因了知依靠眼根和颜色而生起的十种结。"],[37,3426,3494,1,"十种结：1.欲贪结；2.色贪结；3.无色贪结；4.瞋恚结；5.我慢结；6.邪见结；7.戒禁取结；8.疑结；9.掉举结；10.无明结。或：1.欲欲结；2.瞋恚结；3. 我慢结；4. 邪见结；5. 疑结；6. 戒禁取结；7.有欲结；8.嫉结；9.悭结；10.无明结。这些结把有情牢牢地捆绑在生死轮回中，也是生起轮回的罪魁祸首，是不善心所。第一组十结在经藏和论藏里提过，第二组十结记载于论藏。在第一组中欲贪结、 色贪结、 无色贪结属于贪心所，邪见结、戒禁取结属于邪见心所，其他的是个别的心所。"],[37,3494,3830,1,"这十种结如何生起？对于取颜色为目标而生起的十种结，眼净色及颜色都是它们的因，但它们的近因是不如理作意（心路里的确定心和意门转向心），即视无常为常、视苦为乐、视无我为我、视不净为净。若人取乐于呈现在眼门的可喜颜色，就会生起欲欲结。若想在实修时观察到欲欲结，必须已修到能够观察究竟色法。你应该先观眼门和意门，然后看到一群色聚的颜色，无论内在或外在、有情或非有情的颜色都可以，最好是漂亮的颜色，例如你喜欢的人或黄金、珠宝的颜色。当那颜色同时撞击眼净色和意门时，眼门心路过程就生起。如果该心路过程中的五门转向心和确定心作意该颜色为漂亮，欲欲就会在确定心之后的速行心中生起。欲欲不能单独生起，因此必须与相应名法同时生起。根据情况的差异，欲欲速行心中的名法可以是十八至二十二。这在修名法时就能够观察到，老师一般建议在实修时去理解它们之间的差别。"],[37,3611,3830,1,"回向功德！"],[38,0,187,1,"191讲-摄集-摄菩提分-法念处-十二处 2&七觉支 1古源尊者一、十二处（一）也了知缘此二者而生起之结上堂课学习十二处，讲到了知眼、了知色，了知缘此二者而生起之结。结有十种，经藏和论藏的划分略有不同。相同点 不同点经藏 论藏 经藏 论藏欲贪 欲欲 色贪 有欲瞋恚 瞋恨 无色贪我慢 我慢 掉举邪见 邪见 悭疑 疑 嫉无明 无明戒禁取 戒禁取经藏十种结：1.欲欲结；2.色贪结；3.无色贪结；4.瞋恚结；5.我慢结；6.邪见结；7.戒禁取结；8.疑结；9.掉举结；10.无明结。论藏十种结：1.欲欲结；2.瞋恨结；3.我慢结；4.邪见结；5.疑结；6.戒禁取结；7.有欲结；8.嫉结；9.悭结；10.无明结。论藏的划分突出嫉妒和悭吝，在论教法里，证得初果时，除了断除我见、戒禁取见和怀疑之外，嫉妒和悭吝也被断除。严谨讲，不能说完全断除，只能说嫉妒和悭吝几乎不会再生起，因为嫉妒和悭吝属于瞋恚盖、瞋根心，瞋根心要在三果才能完全断除。初果圣者几乎不会生起嫉妒和悭吝，所以也可以通过观察嫉妒和悭吝来判断修行者是不是初果圣者。"],[38,187,365,0,"十种结（论藏）如何生起呢？对于取颜色为目标而生起的十种结，眼净色（眼识的所依色）及外境的颜色都是它们的因。生起十种结就是生起不善速行，因此十种结的近因是不如理作意，即视无常为常、视苦为乐、视无我为我、视不净为净。1.欲欲结如果一个人取乐于呈现在眼门的可喜颜色所缘（可喜色尘），就生起了欲欲结。取乐于就是黏著于，他喜欢这个颜色而生起欲欲。若要在实修时观察到欲欲结，你必须已修到能够观照究竟色法。应该先观照眼门和意门，然后看一群色聚的颜色，无论内在的或外在的、有情或非有情的颜色都可以。对于颜色而言，可喜所缘即普遍认为漂亮的颜色。比如看到你喜欢的人或者装饰品（在家人有黄金、饰品、名车等），当那颜色同时撞击眼净色和意门，眼门心路过程就生起。如果该心路过程中的五门转向心和确定心作意该颜色为漂亮，欲欲就会在确定心之后的速行心中生起。"],[38,365,497,1,"欲欲不能单独生起，必须和相应名法同时生起。根据情况的差异，欲欲速行心中的名法可以有十九至二十二，比如十九个名法是舍俱贪相应的速行心；二十个名法是悦俱贪相应的速行心；二十一个名法是舍俱贪相应有行的速行心；二十二个名法是悦俱贪相应有行的速行心。如果想充分了解，可以在实修名法时去观察它们之间的差别。其他结也都是生起于速行心中的名法。2.瞋恨结如果一个人由于看到不可喜颜色所缘（色尘）而感到讨厌，就会生起瞋恚结。若要观察到瞋恚结，应该选择你讨厌的颜色为目标。举例而言：穿着新袈裟托钵，一不小心一盆菜扣在袈裟上，你觉得“啊！弄脏了，都是油啊。”当不如理作意时，你讨厌新袈裟被油污所污染，瞋恚心就会生起。如果有观智，下午坐禅时观察刚才瞋恚的心路，就可以观察到。"],[38,497,631,1,"3.我慢结若人心想：“只有我才能如实地观照此色法”，就生起了我慢结。譬如说你已经熟练于观照究竟色法而洋洋得意地想：“法住禅林一百多个住众，有多少人能够像我这样观察到色法呢？大部分人修行好几年连禅那都没有。”这就生起我慢结。4.邪见结若人认为颜色是恒常的，就会生起邪见结。要想观到这一点，可以观察相对不会改变的颜色，比如孤邸里佛像的金色或者柚木地板的颜色（很明亮、清楚，可照人）。如果作意：“这个颜色很漂亮。”你觉得这样的颜色不会改变，就是对颜色有常见。常见就是邪见结。"],[38,613,741,1,"5.疑结如果禅修者看到颜色时想：“这个颜色是有情或是属于某位有情？”比如禅修者能看到身体中一团色聚的颜色，然后生起怀疑的心，怀疑它是否本身就是有情（有生命）呢？还是属于某位有情？是属于我的还是属于别人的？还是属于上帝所有的？”你内心里面不能确定而生起的结，就是疑结（怀疑的结）。6.戒禁取见结有些人学佛喜欢宗教仪式，他心想：“我实行这些仪式就能在未来获得什么样的回报”，这是生起戒禁取结。7.有欲结如果有人发愿投生善趣，心想：“我现在还是挺漂亮的，听说供花未来会很漂亮，我也要供花，未来还能这么漂亮。”就生起了基于色尘的有欲结。"],[38,740,924,1,"8.嫉结有贤友供养兰花，每人一支。如果有人心怀不满地想：“你看，这花这么漂亮，不要分给他们，全归我才好，我房间就可以堆满这样的花。”或“分给出家人就可以，不要分给在家人。”这是生起嫉妒的结。9.悭结如果不能忍受跟别人分享自己的色尘。前面是嫉妒别人的，现在是你所有的不愿与人分享。你手上拿着花，有人过来说：“你孤邸没有供佛，拿来给我供佛吧。”你：“凭什么给你?！”这是悭吝的结生起了。要知道，悭并不是贪，其背后是贪，但生起的是瞋，因为不能忍受别人拥有或使用你的东西。如果别人未经你同意拿走或用了你的东西，你就会生气，因此悭与瞋恚相应，而不与欲贪相应。10.无明结无明结与前面九个结一起生起，依俱生缘与不善心（欲欲等一切结）同时生起。无明是什么？无明认为有个东西常、乐、我、净。这些结、这些烦恼会生起，都是因为错误地认为色尘或其他六尘有常、乐、我、净的特征，或者内心有这样的期待，这是无明。跟着无明，九种结生起，所以无明与不善心是俱生的，有俱生缘。如果禅修者能依眼门心路过程观照这十种结以及与它们相应的名法，就已经“了知依靠此眼根及色尘而生起的结”。"],[38,924,1035,0,"如果没有观智，虽然不能看到究竟名色，但在日常生活中还是容易观察到结的生起。平时要正念正知、如理作意，当这些结生起时，了知“我因为这个东西而生起这个结”。生起这个结后，要追过去看：你对这个东西是什么认知？它是属于常还是属于乐？是属于我还是属于净？看到这个认知，然后去转为正见，这个结在名色流里会被彼分断除。再持续地把它训练成一种惯性，一种新的认知行为模式被培养起来，这种结在未来相对于这种色尘就不容易生起，这种断是彼分断。如果正念正知很强，也能够达到镇伏断。（二）了知未生起之结如何生起接下来佛陀所说的： 『他了知未生起之结如何生起』是指：他了知之前由于没有产生之因而未生起的十种结如何由于不如理作意而生起。"],[38,1035,1150,1,"如何理解呢，前面已经在经文“了知依靠此眼根及色尘而生起的结”中解释了令十种结生起是因为有生起十种结的因。这里‘他了知未生起之结如何生起’ ，你应该明白了面对色尘时十种结会生起，就会提醒自己：“我面对这样的色尘，如果还抱持这样的观念，这种未生起之结就会生起。”这是防护，若不去防护，这种结就会生起。从这个角度来讲，当我们了知色尘、声尘、香尘、味尘、触尘或法尘，这些尘会导致十种结生起，应知这十种结是不善法。如何让不善法不生起，后面再讲。前面是‘他了知如何生起结’，现在是‘了知未生起的结如何生起’，只要这样做就会生起，如此去‘了知’。这是更进一步理解，对了知过程的通达。"],[38,1150,1215,0,"（三）了知已生起之结如何捨断1. 寻找结之因佛陀说『他了知已生起之结如何捨断』是指：他了知之前由于产生或未被灭除而存在的十种结被灭除之因。就是要了知由于产生或未被灭除而存在的十种结是怎么被灭除的，要知道灭除之因。面对果报，产生了感受或情绪，起贪嗔痴烦恼结了，要找到生起结的原因。有禅修者问：“Bhante，我怎么妄念那么多？你有什么办法帮我把妄念灭掉一些？”他排斥结果，排斥妄念很多，而不去找出妄念的因。"],[38,1215,1350,1,"也有贤友问：“我在禅林里就看不得那个人，怎么能不碰到他？”怎么让那个结不生起呢？想碰到后不讨厌他，要找到为什么讨厌他的那个因并灭除才可以。2. 三种捨断结是烦恼，这些烦恼要怎么捨断？《注疏》提到三种捨断：暂时捨断（彼分断tadaṅga-pahāna、镇伏断vikkhambhana-pahāna及正断断samuccheda-pahāna。Kovida bhante 在《清净道论》开示中讲到两种慧：结生的慧（出生时悦俱三因结生与慧相关）、守护慧（日常生活中通过持戒、禅修、正念正知来守护，令不善法不生起）。由于在日常正念正知、持戒，或修习止禅，练习专注安那般那、四界差别、白遍或其他业处等止观的练习中如理作意，由于该如理作意，十种结暂时不会生起，故称为彼分断或暂时捨断。"],[38,1350,1444,1,"举个例子，禅修者持续地专注于气息一个小时，在这一小时里就只有善心生起，而没有不善心生起，因此十种结被暂时地灭除或彼分断。当你的定力提升，遍作相、取相、似相会逐一地出现。在禅那之前的阶段，专注于禅相的定力称为遍作定或近行定。若你持续培育这些定力两个小时、三个小时，在这段时间里不善心不能生起，这也是暂时灭除十种结，即暂再者，平常作意颜色（色尘）为无常、苦、无我、不净，这是如理作意；修观禅时也这样观察。由于这些如理作意，速行心中生起的都是善法。这些善法会暂时地灭除十种结。观禅的捨断也属于暂时捨断。"],[38,1428,1519,1,"当禅修者能专注似相而进入安止定两个小时、三个小时或者更长时间时，该安止定更长久地灭除这十种结，称为镇伏捨断。由于烦恼被禅定镇伏而没有明显地现起，有些禅修者或者修行者甚至会觉得“我是阿拉汉”或“我是三果圣者”。帕奥西亚多举例大龙长老（Mahānāga Mahāthera）的故事，帮助禅修者了解镇伏捨断。《注疏》这么描述，据说住在达郎迦拉（Talaṅgara）的法施长老（Dhammadinna Thera）是大龙大长老的弟子，他是一位拥有四无碍解智的阿拉汉，同时也是很多比库的导师。"],[38,1519,1589,0,"有一天，他在自己的住处，心想：“我的老师大龙长老是否已到达最究竟的沙门果呢？”于是就用他心通观察老师，发现大龙长老还是个凡夫，并且如果他不去提醒老师，那么大龙长老一直到死亡都还是凡夫。观察到这个因缘，他以神通力飞到老师的住所，顶礼老师并且履行弟子的义务，然后坐在一边。大龙长老就问他：“Dhammadinna，你为什么来这里呢？”法施阿拉汉回答说：“我想来请教尊者一些问题。”大龙长老就说：“你问吧，我会尽我所知的来回答你。”因此他问了一千个阿拉汉才能回答的问题。"],[38,1589,1644,0,"大长老毫无迟疑地回答了每个问题。法施长老就称赞老师说：“Bhante，您的智慧真是敏锐啊！您在何时达到这样的境界呢？”大龙长老答说：“六十年前吧。”法施长老又问：“Bhante，您修习过禅定吗？”老师回答说：“禅定不困难啊”。于是他说：“Bhante，您能不能变出一只大象？”大龙长老就变出一只大白象。法施长老说：“Bhante，您现在让那只大白象尾巴直竖，两耳向外伸张，长鼻子伸入口中，发出恐怖的怒吼声，向您直冲过来可以吗？”"],[38,1644,1721,1,"大龙长老就照着做了。看到大白象快速直冲过来的可怕景象时，大龙长老赶紧跳起来准备跑。这时，已断尽烦恼的Dhammadinna 阿拉汉伸手抓住老师的袈裟，说：“Bhante，断尽烦恼的人还会害怕吗？”这时他的老师恍然大悟：“噢，原来自己还是个凡夫”。因此老师就在Dhammadinna 阿拉汉脚边蹲距下来，说：“法施āvuso，请帮助我。”老师很谦虚。Dhammadinna 阿拉汉说：“Bhante，不必担忧，我正是为了要帮助您才来的。”因此他为大龙长老详细地解说一种观禅业处。大龙长老领受该业处后，就向经行道走去，走到第三步时就证悟了阿拉汉果。"],[38,1721,1819,0,"从这个故事可以看出，大龙长老具有强有力的观智，在止观镇伏之下，他的烦恼在长达六十年的时间里都没出现过，以至于自己认为已经是阿拉汉。只有当烦恼被圣道根除时，才称为正断捨断。证悟圣道后，禅修者就能如经文所说的： “他了知已经被灭除的结如何不会再于未来生起。”这是指：他了知之前已通过如理作意或安止定降伏的十种结不会再于未来生起。是什么原因令十种结灭尽而永远不会再生起呢？入流道是邪见、疑、戒禁取见、嫉妒与悭吝这五种结最终灭尽的原因；一来道是粗的欲界贪与瞋恚二结最终灭尽的原因；细的欲界贪与瞋恚二结最终被不来道灭尽；阿拉汉道则是导致我慢、有欲与无明三结永远灭尽的原因。"],[38,1819,1920,1,"证得圣道之后，禅修者应检查自己心中还有什么不善法能由缘取六尘而生起，以及为什么不善法已被圣道根除。这是审察智。如果能如此知见，你就是了知那些已经被灭除的结不会再于未来生起。（四）更高阶段的观智佛陀继续说： 『如此，或于内法随观法而住，或于外法随观法而住，或于内外法随观法而住。或于法随观生起之法而住，或于法随观坏灭之法而住，或于法随观生起、坏灭之法而住。他现起‘有法’之念，只是为了智与念的程度。他无所依而住，亦不执取于世间的一切。』这段话在前面的课程中已多次解释，再次提醒大家：‘只是为了智与念的程度’，在修学过程中一定记住：“你是为了成就你的智和念，而不是成就你的能力。”能力与智慧不同，你能获得观禅、你能看到名色与你有名色智、观智是不同的。"],[38,1920,2045,1,"佛陀最后说： 『诸比库，比库乃如此对六种内、外处而于法随观法而住。』这是十二处的部分。二、七觉支佛陀在解释完依十二处而修行法念处之后，继续解释依七觉支而修行法念处的方法。(一)念觉支佛陀说：『诸比库，比库对七觉支而于法随观法而住。诸比库，比库又如何对七觉支而于法随观法而住呢？诸比库，于此，比库内心存有念觉支，了知：‘我内心有念觉支’；内心不存在念觉支，了知：‘我内心没有念觉支’。他了知未生起的念觉支如何生起，也了知已生起的念觉支如何修习至圆满。』在此，念特指忆念四念处。之前讲念心所时专门提过，念心所的所缘是三十七道品的所缘，包括忆念五蕴、十二处等观禅的目标。究竟名色法及其因缘（即苦谛和集谛）是观禅的目标。时常对它们如理作意能够帮助未生起的念觉支生起以及培育、增长和圆满已生起的念觉支。"],[38,2019,2201,1,"正念本身即是念觉支的缘法。正念的近因是四念处，正念的近因其实是正念本身，你要有正念才会越来越有正念，要通过不断地练习正念，念心所才能够越来越强。佛陀教导，有四种方法能令念觉支生起：第一种具备正知的念；第二种远离内心迷惑的人；第三种与拥有正念的人相处；第四种倾向于培育正念。1.正知正念念，通俗来讲就是忆持目标，忆持目标是指忆念善所缘。正知是如实知见目标。所以正念、正知，分工不同，它们两个是不能分开的。例如忆念眼净色是正念，而如实知见眼净色的观智就是正知。简而言之，在修行观禅时，正念忆持所有行法及其无常、苦、无我、不净四相，正知则是如实地看到、如实地知见它。如果没有正念去忆持，就不会生起如实知见。念不能够单独起观照的作用，它必须与正知配合。"],[38,2186,2321,1,"在日常生活中，五门面对果报，心如果没有念就会被以前对待果报的习惯带走。但是如果有念，心就会缘在四念处上而不会跟着果报所引发的情绪离开。“念，要能停下来”是方便说，当下停下来就是看到自己“那个状态起来了”，无非就是身、受、心、法四念处，看到心的状态、看到自己的感受，能停下来，心不绕在无明认知和情绪上。学习身念处时，提到通过在“向前进”等七种动作里具备正知的念，念觉支就会生起。所以鼓励大家训练念觉支，就是透由“向前进”、“向两边看”等身念处的七种动作来训练基本的正念，这是最基础的念觉支训练方法；在这些动作里激起有益等正知的念是具备正知的念。也就是当有看、听、嗅、尝、触这些动作时提醒自己，“为什么这样做？这样做有益吗？适宜吗？是无痴的吗？”经常这样提醒时，念就是具备正知的念。"],[38,2321,2435,1,"由于具备正知的念会令人在任何地方都能够培育念，因此它是念觉支生起的必要因素。具备正知的念是念觉支生起的第一个主要因素。2.远离内心迷惑的人《注疏》中形容远离内心迷惑的人，犹如远离对弃食（腐烂的食物、腐烂的动物尸体）呱呱叫的乌鸦一般内心迷惑的人。为什么这么形容呢？对于修行者而言，面对感官欲乐的目标，要知道只是为了生存和物种繁衍，其他毫无用处。要如理省思对资具的需求，而不要像乌鸦一样呱呱乱叫： “这是我的、那是我的、不要拿走、我还要。”要远离内心被外在目标所引发的欲贪所迷惑的没有正念人。如此，念觉支才会生起。"],[38,2432,2530,0,"3.与拥有正念的人相处通过与拥有正念的人相处，念觉支就能生起。人总有见贤思齐的倾向，如果总是跟没有正念的人在一起，就很容易怠惰、散乱；跟正念的人在一起，自然就会收摄身心，能够把心放在念处。4.倾向于培育正念通过在一切姿势与动作里都让心倾向于培育正念，即持续不断地忆念四念处。有禅修业处的人可忆念禅修业处，也可在日常观照身、受、心、法，这样念觉支就容易生起。比库或禅修者了知，通过这四种方法培育而生起的念觉支，可以不断地得到增长，但要达到圆满就必须证得阿拉汉道。阿拉汉在一切时处具足正念。"],[38,2530,2622,1,"这是念觉支的观察方法。(二)择法觉支如何观察择法觉支呢？佛陀说： 『当内心存在择法觉支时，了知：‘我内心有择法觉支’。内心不存在择法觉支时，了知：‘我内心没有择法觉支’。他了知未生起的择法觉支如何生起，他也了知已生起的择法觉支如何修习至圆满。』在此，“择”指分析或者拣择。择法的“法”要特别提一下，《注疏》中提到有五对好与恶的法：1）善法与不善法；2）无可指责与当受指责之法；3）应修行与不应修行之法；4）高尚与卑劣之法；5）清净与邪恶之法。其根本是善与不善，作为佛弟子，最起码的能力就是能够抉择善法与不善法。"],[38,2622,2754,0,"什么是善法呢？善法生起的当下对自他是有福利的，是被智者所赞叹的，会留下好的影响力，在未来果报成熟时将会带来可喜果报，在临终时成熟将导致善趣 —— 这样的法称为善法；不善法，无论是贪、瞋或痴，在生起的当下对自他福利有损害，会留下不良影响力，是被智者所呵斥、指责的，未来会带来不可喜的果报，如果在临终时成熟将会堕入恶趣。故善法与不善法要抉择清楚。不善心只有十二个，其中八个与贪相关的心，两个与瞋相关的心，两个与愚痴相关。贪心与瞋心很容易辨认，当生起来的心有黏著、想黏著，不想放掉、想拥有时，这个心就是贪心；对目标排斥、不喜欢，就是瞋心；愚痴有两种，一种掉举，一种怀疑。掉举心就是稀里糊涂的、不知道在想什么；疑特指对佛、法、僧三宝，戒、定、慧三学，过去五蕴，未来五蕴，过去未来五蕴和缘起的怀疑。"],[38,2749,2845,1,"有人认为：“我对这些没有怀疑啊？”实则在日常生活中对造善法或不善法生起疑： “我做这个好事有什么意义呢？布施真的有什么果报吗？真的有轮回吗？真的有过去生吗？真的有涅槃存在吗？”这是典型的疑，很容易认识。而类似“现在几点了？尊者什么时候讲完课？”这不是疑，是一种寻，可能夹杂着贪，也可能夹杂着瞋。这五对好与恶的法中，前者是会带来善果报的善法，后者是会带来恶果报的不善法，必须对这些如理作意。如理作意就能帮助没有生起的择法觉支生起以及培育、增长，并且圆满已生起的择法觉支。"],[38,2828,3009,1,"如何如理作意呢？首先应当观照缘取六尘而生起的善速行心路过程与不善速行心路过程中每一个心识剎那里的名法，并且观照它们所依靠而生起的依处以及所缘取的目标。名法是四种名蕴，依处是色蕴，而目标则可能是名蕴或色蕴，如是你所观照的就是五蕴。接下来应该观照导致五蕴生起的因缘，然后观照五蕴及因缘法为无常、苦、无我和不净。如此如理作意观照时所产生的观智就是择法觉支。这是择法觉支在观智时的一种体现。日常生活中练习正念正知，在正知层面上，有适宜正知、有益正知、行处正知、无痴正知。而此处帕奥西亚多解释的择法觉支更多是在无痴的层面、观智的层面。日常生活中是在概念上理解面对六尘应以什么态度。择法是对于生起的心的态度，是对速行角度来讲而不是对果报来讲。“这个东西比较好，那个东西比较不好”不是择法， “我现在面对果报生起什么心？”这是择法。择法是对五对好与恶之法（善或不善、无可指责或当受指责、应修行或不应修行、高尚或卑劣、清净或邪恶）的抉择，是对于果报的态度和行动的抉择。"],[38,2993,3117,1,"《注疏》提到七种能令择法觉支生起的方法：1.提出有关五蕴等的问题；2.清净依处，即清洗身体、衣服，内外净洁；3.亲近智者；4.平衡五根；5.远离愚痴的人；6.思惟难以知见的诸蕴、处、界等之间的差别；7.倾向于培育择法觉支。提出有关五蕴等的问题是指：愿意去探寻诸蕴（五蕴）、十二处、十八界、根（二十二根）、力（五力）、七觉支、八圣道分、五禅支、止禅、观禅的涵义。也就是说，需要经常向法师或禅师请求解释五部《尼柯耶》和《注疏》中很难理解的部份。不懂得教理就很难正确地修行，因此我们应当向贤能的导师学习。这是提出有关五蕴等的问题能让择法觉支生起。"],[38,3117,3249,1,"前两天有位贤友提出《相应部•慈俱行经》（相应部46相应54经）中讲到‘修习慈、悲、喜、捨四梵住，通过修悲心最后能够成就空无边处’。他搞不明白，帕奥禅法说‘修悲心最多能证到三禅’，又怎么能证到空无边处？然后真求贤友查《注疏》，感慨地说：“如果没有看《注疏》，这种修法就算看完五部《尼柯耶》来回交叉验证，也验证不清楚到底怎么修。”这是指除学习《经藏》以外，还应了解《注疏》。佛陀对根器利的弟子讲法很简略，往往一句话就含括所有。比如“超越色相”。悲心怎么超越色相？悲心与超越色相是什么关系？悲是空无边处的亲依止缘，因为看到众生痛苦。而众生痛苦是因为有色身才苦，没有色身就不会苦，所以厌离、捨弃色对修空无边处就很有帮助，而不是说修悲心禅到达三禅后直接入空无边处，这要看《注疏》才看得懂。"],[38,3249,3353,0,"清净依处，就是清净自身依处（身体）以及外在的依处（衣服、住所），内外净洁。检查一下，如果你的孤邸跟狗窝一样，柱子上爬满各种蚂蚁，臭袜子丢了满地都是，那么择法觉支就不容易生起。《注疏》说，我们供酥油灯，如果灯芯、灯油及容器肮脏时，灯光就显得晦暗，灯芯经常会爆裂发出声响。当灯芯、灯油及容器清洁时，灯光就明亮，灯芯不会爆裂发出声响。智慧也是如此，于肮脏的内在和外在环境里，从心和心所产生的智慧多数是不清净的；然而在干净的环境里生起的智慧多数是清净的。如此，干净能够令属于智慧的择法觉支生起。有位贤友报告说：“今天的心显得特别地清明，以前没有这种感觉。”就是这种清净的感觉。"],[38,3353,3456,0,"当头发与指甲太长，体液过多及流很多汗时，自身的清净就会受到污染。在热季时，很多人的味道就特别重。别人说他身上味道重，他说：“我没感觉啊，我昨天才洗了澡。”或者说：“一个礼拜之前才洗了澡。”这样的人往往闻不出自己身上的味道，择法觉支也不容易生起。当袈裟破旧、肮脏与发臭以及住所肮脏、凌乱时，外物的清净就受到污染。因此必须适时理发、修剪指甲，经常服用能够令身体轻松的食物或药物，如果身臭、口臭严重，就要经常洗澡，保持自身清洁，也保持外在环境、孤邸、孤邸外面、禅堂、斋堂干净，及时修补、清洗、洗染自己的袈裟，孤邸里的所有用具要及时清理。"],[38,3456,3584,0,"有些禅修者把僧团的披毯拿来作地垫，放得乱七八糟，这就很不妥当。要整理好自己的孤邸，让它干净整洁，进入孤邸觉得舒服，目及所处都井井有条、清洁干净，你的内心就不会混乱，择法觉支就容易生起。如果外物都是稀里糊涂的、自己也是脏兮兮的，看什么都是：“无所谓，出家人计较那么多东西干什么，要觉知呼吸。”觉知呼吸都是糊里糊涂的，没什么用处。平衡五根，就是平衡信根、精进根、念根、定根和慧根。当慧根不清晰、精进根松懈时，信根的作用就可能太强而盖过其他根，这是因为信根对能够激起信心的当信之事的作用非常强大。信根太强时，其他根就无法适当地执行各自的作用：精进根不能执行精进有力的作用。简单举例，有人认为“信就行，搞那么复杂干什么？”、“根机不好念佛就行，参什么禅。”不能支助相应名法，也不能避免懈怠；念根不能执行面对目标以及持续地忆念的作用；定根不能执行不散乱和驱除散乱的作用；慧根不能像以眼见物般地如实知见目标，而对所缘做出正确地抉择。"],[38,3584,3703,1,"这四根不能执行各自的作用是由于受到过强信根干扰的缘故。只有通过平衡它们的作用，五根才能完成各自的任务。因此，应当通过思惟当信之事的真实本质及不注意令信心太强的事来减弱过强的信根。“思惟当信之事的真实本质”是指依着缘以及缘生等本质省察当信之事。例如，禅修者对佛陀的信心非常强，太强，看到佛像、佛塔，对佛陀乃至佛像神秘化，执迷于佛像的加持、未来会带来利益，非常执取。这样的人容易偏于信。应该怎么处理？这时可以取一尊特别喜欢、特别执取的佛像观察它：这是石头，这是木头，这是泥土做的，这是钢铁铸的，这是化工材料做的，这是纸张！如果能修四界差别，最好能分析佛像的四界，就会看到佛像由很多色聚组成，然后分析它们的究竟色法；也可以观照缘取这些色法的名法；然后观照这些色法和名法为无常、苦、无我。"],[38,3703,3804,1,"你会看到佛像里没有一个可以加持你的东西，没有一股神秘的力量存在于佛像里，它就是一堆色法。通过如此知见法的本质，可以缓和太强的信心。或者通过不作意佛陀的特质 —— 佛陀有伟大的功德，信心过强时不要修佛随念，不要一直不断地忆念佛陀的功德，也可以缓和过强的信心。佛陀时代，瓦卡利长老（Vakkali Thera）就是信根太强。这位通过坚强的信心实行其任务的尊者。当看到佛陀出现时，眼睛盯着不离开，一直看着佛陀。佛陀呵斥他： “你看这不净的身体有什么用？你要见到法，见到法才能真正见到我。”催促他禅修，但他却无法禅修。有一天佛陀赶他走，他感到非常伤心，觉得“佛陀不要我了，我还不如死了。”就走到悬崖边准备跳下去，这时佛陀显现神通，坐在他面前，向他说："],[38,3804,3876,0,"“充满喜悦与深信佛陀教法的比库，才能够达到诸行法灭尽的寂乐之境。”听了佛陀的话之后，他感到很喜悦，开始修观禅。但他还是觉得：“佛陀太了不起了，说一句话就让我这么欢喜！”信根又起来，他一直无法获得清楚的观禅。佛陀观察到这一点就指导他平衡五根，再教他一个禅修业处。瓦卡利长老依着佛陀的教法精进修行、次第修行，很快就证得阿拉汉。在此，智者特别赞叹平衡信根与慧根，同时平衡定根与精进根。信根太强而慧根太弱的人，容易相信没有道德且不值得相信的愚人。"],[38,3876,4002,1,"慧根太强信根太弱的人就会变得狡猾，经典里形容，如同服有副作用的药一般难治。这类人认为善业只要依靠想要行善的意愿就能生起，举个例子：“心好就好，搞什么布施？不要分别，一切都是空。”这属于狂慧，其实他完全不理解空的真正含义，动不动“心净何须持戒” ，人家心清净了，你心清净了吗？你心没有清净就老老实实持戒。由于超越常理的胡思乱想，很容易步入邪道，连布施、持戒都不愿意做，却天天说“重要的是智慧，持戒要三轮体空，布施也三轮体空……"],[38,3988,4109,1,"”把三轮体空误解为布施不布施无所谓、持戒不持戒无所谓，恶取空，这样的人死后很容易堕入恶趣。反之，通过平衡信和慧，人们应只相信应相信的对像，如佛陀。对世间人来讲，慧首先是常识。常识是什么？有人说：“我这药包治百病。”你信不信呢？有人给你打电话：“你中了一百万彩票，要先交一点定金我就给打过来。”不被骗就是常识。被电信诈骗的人很可怜，‘可怜之人必有可恨之处’，为什么被骗？因为贪，哪怕是小小的一点贪。学佛或禅修，先按常识来，什么五天开悟、包你成佛的人就要远离。"],[38,4109,4240,1,"慧太强的人修止禅，容易分析、评价、判断，折腾业处、折腾入出息，制造各种仪式感，“这入出息到底怎样？应该怎样专注？怎样才能控制它？”这是慧根太强。有时我会建议说：“你提一点择法或多觉知一点入出息。”什么意思呢？最主要的是观察当下觉知入出息时，你的这种觉知是不是跟善法相应？如何择法？就是你在面对入出息所缘时，要观察“我现在在观察这个所缘，生起的是善心还是不善心。”有人禅修到很舒服了，心容易变得沉滞，落入有分，这时他刚觉得舒服时就要提一下择法。什么意思呢？就是当觉着舒服时，要观察是在享受舒服还是在觉知入出息，享受舒服，忘失业处要么落入有分，要么被妄念拉走了。提策自己“让我更多地觉知入出息”就是善法，心在清晰相、入息、出息上。所以择法就是观察你是以善法来觉知入出息还是以不善法来觉知入出息。"],[38,4240,4338,1,"定有令人倾向于怠惰的本质，所以当定太强而精进太弱时，怠惰就会击败心；精进有令人倾向于掉举的本质，所以当精进太强而定太弱时，掉举就会击败心。当定受到精进良好配合时，心就不会掉入怠惰；当精进受到定的良好配合时，心就不会陷入掉举。入出息念， “更多、更清楚地觉知入出息” 按标准来讲是精进。有时说择法，也是用更清晰地觉知入出息来解释。“择法，是要觉知、要观察你当时生起的心是善心还是不善心。”有些人听不明白，不知道怎么用。“当你的心沉滞时，更清晰地觉知入出息。”沉滞时，心大多已经开始不时离开入出息了。所以更清晰地觉知入出息的目的，就是让心回来，既是择法也是精进的内涵。精进、择法和喜觉支同样都是策励的作用。"],[38,4338,4398,0,"必须让信和慧共同平稳地执行作用，对于定和精进也是如此。当这两对都达到平衡时，安止就容易产生。对于修行止禅业处的禅修者，坚定的信心是有益的，籍着稍微偏强的信心，他能够通过相信及专注于目标而达到安止。关于定和慧，对于修行止禅业处者，坚强的一境性是有益的，因为定是安止的主要因素。通过坚强的一境性，他达到安止；对于修行观禅者，慧根强是有益的，因为当慧根强时，他能够透视三相。当定慧平衡时，修行止禅者就容易达到世间的安止。由于修行止禅的定力很强，所以很强的慧也是好的。"],[38,4398,4471,1,"出世间安止只在定慧平衡时才能够生起。所以佛陀说： 『定慧两者必须并修』 ，也称为止观双运。念根适用于所有情况，因为念可以保护心，使心不会由于过强的信、精进或者慧而陷于掉举，也不会由于过强的定而陷于怠惰，落入有分。信、精进和慧有掉举的倾向，而定则有怠惰的倾向。因此，在所有的情况下都需要念，就像所有的调味汁都需要盐，也像国王的所有政务都需要宰相处理。由于念在任何情况下都适用，所以论师说：“世尊的确如此说： ‘念在任何情况下都是需要的。’”为什么？因为念能够帮助心，念的现起是保护，即念的现起是守护心和守护善所缘。"],[38,4471,4579,1,"经常有人跟我讲：“Bhante，现在外环境很混乱，怎么办？”我说：“所缘多的时候就守护你的心，让你的心不跟外缘跑。”这时候就是有念；当所缘少的时候就要守护善所缘；没有什么所缘的时候就观察四念处、三十七道品，守护所缘让自己培养念。缺少念就不能策励或抑制自己的心，没办法让心变得平衡。今天就学习到这。回向功德！"],[39,0,611,1,"192讲-摄集-摄菩提分-法念处-七觉支 2古源尊者一、择法觉支上堂课学习到如何令择法觉支生起以及令择法觉支生起的方法。《注疏》提到七种能令择法觉支生起的方法：清净依处：即清洗身体、衣服等。勤洗澡、剪指甲，保持衣服干净。亲近有智慧的人。智者是指通过观照五取蕴生灭的五十种相（在佛陀的教导里有五十种相），而拥有生灭随观智的人，这样的人被称为智者。五取蕴有生起和灭去特相——无常、苦、无我的生灭特相。五十相：导致五取蕴生起的因有五个，即无明、爱、业、抟食、成相。无明、爱、业、抟食是因缘生，「前四因生故五蕴生」是因缘生，成相是刹那生,这是《大念处经》注疏中特别的提法。简单来说，成相就是生命刹那存在的“生”，其实就是一种相状，称为成相。如此观察无明、爱、业、抟食、成相是观照五取蕴生起的五相。「前四因灭故五蕴灭」是因缘灭，坏相是刹那灭，这是观照五取蕴坏灭的五相。五蕴各有以上十相，生的五相及灭的五相，总共是五十相。"],[39,611,641,1,"当禅修者能够对五取蕴的五十相，观照它的生以及灭，有这样智慧的人就称为智者。平衡五根。信与慧要平衡，定与精进要平衡，念自始至终都要保持强大。为什么念根要保持强大呢？念根适用于所有情况，因为念可以保护心，同时也守护善所缘，它使心不会由于过强的信、精进或慧而陷于掉举，也不会由于过强的定而陷于怠惰。信、精进与慧有掉举的倾向，而定则有怠惰的倾向。因此，在所有的情况下都需要念，就像所有的调味汁都需要盐，也像国王的所有政务都需要宰相处理一般。由于念在任何情况皆适用，所以论师说：“世尊的确如此说：‘念在任何情况都是需要的。’”为什么呢？因为念能帮助心，念的现起是保护，缺少念就不能策励或抑制自己的心。"],[39,627,668,1,"五根平衡对于择法觉支的生起是有帮助的。如果五根不能平衡，择法觉支也不能够正常运作。远离愚人。远离愚人是远离没有了解诸蕴等智慧的愚人，并非指痴呆者。凡是对于蕴、处、界、根、谛、缘究竟法不能善加了知的人，都属于没有智慧的愚人。思惟深奥且难以知见的诸蕴、处、界等之间的差别。是指以智慧分析诸蕴等的运作。能够观照到是最好，对于还没有观智的人，通过学习阿毗达摩,知道蕴、处、界之间的差别、关系以及运作规律，了解我们身心生起的五蕴状态及其因。"],[39,668,752,0,"因此经常建议大家：“当情绪产生时，能不能顺着情绪往回找到你的见解、观念，以及惯性？”这是在非观智时简单地观察情绪生起的因。虽然这个因不是究竟法，但是依然可以让我们观察到一部分“究竟法”的表征。比如贪心有黏著的表征、瞋心有排斥的表征，是可以感知的。还可以观察到导致贪或者瞋生起背后的观念和知见，对自己或者他人的一种基于常、乐、我、净的错误见解，是可以被观察到的。如果这样的观察能转变错误观念，便能在一定的范围内，彼分地削弱烦恼。"],[39,752,826,0,"倾向于培育择法觉支，是指在行、住、坐、卧的一切姿势和动作中都令心倾向于培育择法觉支。禅修者明了如此培育的择法觉支只有在证得阿拉汉道时才能够获得圆满。阿拉汉在一切时处（除了睡眠时）都是有正念、有正知的。对于还没有证得阿拉汉道的人，应于行、住、坐、卧的一切姿势与动作中倾向于培育择法觉支。前面讲的内容，主要有五种。首先要知道这是善法还是不善法；这是应被指责的还是不被指责的；是应修习的还是不应修习的。几个方面能分得出来，就有一定的择法能力。"],[39,826,921,1,"当禅修者能如前所述，具备这些令择法生起的因素，就容易培养择法觉支。复习一下令择法觉支生起的方法：1.清净依处，即清洗身体、衣服等（如洗澡、刷牙、剪指甲、洗袈裟等）；2.亲近智者；3.平衡五根；4.远离愚痴的人；5.思惟难以知见的诸蕴、处、界等之间的差别；6.倾向于培育择法觉支；7.能提出与五蕴相关的问题。可以经常向师长请教或与同行善友一起讨论关于蕴、处、界、根、谛、缘的阿毗达摩知识。以上是择法觉支。"],[39,920,1051,0,"二、精进觉支佛陀说： 『内心存在精进觉支时，了知：‘我内心有精进觉支’。内心不存在精进觉支时，了知：‘我内心没有精进觉支’。他了知未生起的精进觉支如何生起，也了知已生起的精进觉支如何修习至圆满。』这是佛陀在《大念处经》里关于“法念处——精进觉支”这部分的内容，告诉我们要知道精进觉支有没有生起以及生起的因，并且如何做到让精进觉支修习至圆满。精进的作用有三个层次，在《大念处经》的解析中老师翻译成：致力界、精勤界和不断精进界，在《趣向涅槃道》五大册解释为：第一层次的精进 āraddhavīriya，有人把 āraddhavīriya 翻译成“发勤精进”。“发勤精进”的意思是：以努力做好这个或者那个工作，以及让其他相应心所一起发起努力，发心完成工作。第二层次的精进nikāmavīriya，有人把nikāmavīriya 翻译成“出离精进”，它比 āraddhavīriya 更强。nikāmavīriya 生起时称为“出离”，出离什么呢？使人能够逃离令人变得懒惰的习惯，能够振作起来，克服懈怠，让懈怠消失。"],[39,1051,1112,0,"懈怠生起的原因，从心的素质来讲就是昏沉、睡眠心所，能够突破昏沉、睡眠的束缚，脱离烦恼，这种精进称为nikāmavīriya，出离精进。第三层次的精进bhrakamavīriya，bhrakamavīriya翻译成“勇猛精进”，它比 nikāmavīriya 更强，是最高境界的精进，能够按步骤非常勇猛地去完成最高的成就。比如修习止禅、观智、道果和涅槃，要成就这些高阶级的上人法，只有靠强大的精进不间断地、持续地努力。"],[39,1112,1187,0,"这里有个问题大家很容易误解：以为这种强大的精进就是“咬紧牙关、死干、把禅堂坐穿，每天非常地紧张地做。”要知道四正勤的特点是“已生善法令增长，未生善法令生起，已生不善令断除，未生不善令不生。”在精进时，时时要观照是在善法上精勤，而不是在不善法上执取，这是需要提醒的地方。精进觉支的近因如何让精进觉支生起呢？《注疏》中提到导致精进觉支生起有十一种因素：1. 思惟恶道的危险。2. 明白精进的利益。3. 思惟所行的道。"],[39,1186,1310,1,"4. 恭敬钵食。5. 思惟遗产的殊胜。6. 思惟导师的伟大。7. 思惟传承的殊胜。8. 思惟梵行同修的伟大。9. 远离怠惰的人。10. 和精进者相处。11. 倾向于培育精进觉支。（一）思惟恶道的危险《中部•天使经》（中部 130 经 Devadūta Sutta）。佛陀在此经中开示：阎罗王问刚刚投生到恶趣的鬼道众生：“你有没有见过人世间的五种天使？”五种天使就是生（刚出生的小孩身上沾满屎尿）、老人、病人、死人、被国王或其他人处以刑罚的人。在你看到这五种天使时，有没有思惟自己有很多不善法，还是有很多善法？如此来观察。如果没有善法，就会被狱卒抓起来，用火红的枪插着他的左手掌、右手掌、左脚、右脚，各种折磨。"],[39,1310,1429,1,"如果我们在人世间不能思惟善法，造作很多不善法，在未来会遭受四恶趣的苦，这种苦不是“腿痛一下或被谁说一句心里难受”所能比拟的。可以自己去学习此经，去观察佛陀所看到的地狱苦以及恶道的危险（佛陀所说皆真实语）。学习之后可以令内心生起这样的想法：“现在是激起精进的时刻，在遭受极端的痛苦时是不可能精进的。”在地狱里，想精进也没有机会；在畜生道里，因为愚痴也没有机会；在鬼界，因为痛苦、饥饿，也没有机会。（二）明白精进的利益明白精进的利益是指能接受四道、四果和涅槃这九种出世间法只有通过精进才能证得，而不是通过怠惰。三十七道品中出现最多的心所是精进心所。"],[39,1416,1564,0,"（三）思惟所行之道作为禅修者应经常向自己说：“我必须走在诸佛、诸辟支佛、诸大弟子已经走过的行道上，然而该道并不是懒惰的人所能走的。”这是指思惟所行之道。（四）恭敬钵食禅修者应经常思惟：“那些以钵食等来支助你的人（供养衣食住药的布施者），既不是你的亲戚，也不是你的仆人，他们给你美味的食物时并不如此想：‘在未来我将依靠你而活。’然而他们布施时是期望能够从布施当中获得大果报。再者，佛陀也不允许你用必需品纯粹只是为了身体强壮和生活舒适（每天都念诵：不是为了嬉戏、不是为了骄慢、不是为了装饰、不是为了庄严），但允许你用它们来实行沙门的义务以及脱离生死轮回。怠惰者并不恭敬钵食（因为怠惰者拿到好的钵食起贪，拿到不好的钵食起瞋，总是掉在不善法里），只有精进者才恭敬它。”如此思惟佛陀所允许的钵食就能激起精进，就有如大友长老（Mahāmitta Thera）的例子：长老住在农夫洞，在他时常去托钵的村里有位年老的女信徒，把他视为亲儿子般地护持。"],[39,1564,1679,0,"有一天，她正准备去森林干活时跟女儿说：“家里还有好米、奶、酥油和糖。你用这米煮饭，当你的哥哥大友尊者来时，就把煮好的饭连同奶、酥油和糖一起供养他，而你也吃那饭，我已经吃了稀饭和昨天剩下的冷饭。”女儿问她说：“妈妈，那中午您吃什么呢？”她说：“你用碎米和野菜煮成酸粥，把它留给我。”这时大友长老在农夫山洞里刚穿好袈裟，拿好钵，准备出来托钵，他透过天耳通听到这对母女的谈话，他想：“这位大施主吃了隔夜的稀饭，而且中午还要吃酸粥，却把好的饭、奶、酥油和糖供养给你。她并不期望从你这里获得田地、食物或者衣服，只希望从她的布施获得人界、天界，乃至出世间界的成就。你是否能让她获得这些成就？的确，你不应该以含有贪、瞋、痴的心去吃她的食物。”当他这样思惟时，就把钵放下，然后松开袈裟的结，不去托钵而回到洞中。他把钵放到床下，把袈裟挂在衣竿上，坐下决意精进修行：“如果我没有证悟阿拉汉果，就不出山洞！”"],[39,1679,1751,0,"因为之前已经精进修行非常久的大友长老，在那时再度培育起精进的观智，在用餐时间还没到之前就证得阿拉汉果。这时，他作为漏尽者，就如同盛开的莲花般微笑着走出山洞。住在山洞附近的护法神向他致敬说：礼敬您──至上圣生者，礼敬您──人中至上者。您的污染已灭尽，您是应供者。说完随喜的话，该树神说：“尊者，在供养食物给您这般的圣者之后，那位老妇女未来将会解脱一切苦。”当大友长老起来开门看看太阳的位置（明相），发现时候还比较早，没有过午，所以就穿好袈裟、拿着钵入村托钵。"],[39,1751,1846,0,"那位已经准备好饭的少女坐在门口看到了，心想：“我的哥哥就要来了。”当长老到来时，她从长老手中接过钵，把掺有酥油和糖的乳饭放到钵里，然后交回长老手中。在说了“愿你快乐！”的随喜话之后，长老就离开。那位少女站在当地看着他离去，当时长老的脸上有非常明亮的光泽，五根非常清净，脸就像脱了果柄的成熟棕榈果一样地明亮。当少女的妈妈从森林回来时问她：“亲爱的，你的哥哥来过了吗？”少女就把这一切经过告诉她母亲。她母亲就知道她视为亲子的尊者，他的出家生活已经在当天到达顶峰，所以她说：“你的哥哥乐于佛陀的教法，已经没有任何不满意。”所以帕奥西亚多教导说：“应当以大友长老作为我们学习的典范，恭敬钵食。”（五）思惟遗产的殊胜。"],[39,1846,1960,0,"“遗产”是什么呢？是佛陀留下的“七种圣财”，此遗产的确非常殊胜。但是怠惰者分不到遗产，因为怠惰者不能够获得信、戒、多闻、捨离、智慧、惭和愧这七种圣财。怠惰者就像是已经被父母断绝关系的儿子，在父母死后不能继承他们的财产。对“七种圣财”也是这样，只有精进者才能获得它们。大家如果想能够拥有信、戒、惭、愧、多闻、捨、慧这七种圣财，就需要精进。（六）思惟导师的伟大通过经典、经论忆念佛陀一生中的种种事件：从他入母胎、为求证悟而出家、成佛、开示《转法轮经》、显现双神变、在三十三天开示《阿毗达摩藏》之后下来人间、于入般涅盘之前的三个月捨弃命行及入般涅盘这八个时候，由于他那无比清净的戒、定、慧，一万个轮围世界都发生大震动，犹如大地震一般。导师是如此地伟大，我们怎么能不精进地学习呢？"],[39,1960,2040,1,"（七）思惟传承的殊胜思惟在成为比库之后，他已成为佛陀的儿子，而这样的人是不应该懒惰的，因为他已获得佛陀法的传承、心的素质的传承。要想拥有这样的素质，就必须精进。（八）思惟梵行同修的伟大可以这样来训诫自己：“沙利子尊者、马哈摩嘎喇那尊者和诸大弟子都是在精进修行之后才证悟出世间法，而我是否跟随在他们身后，以他们的生活方式般来修行呢？”要这样思惟。（九）远离怠惰之人远离怠惰的人是指远离那些吃饱饭后躺着睡懒觉的大蟒蛇一般没有身心精进力的懒人。如果身边有这样的人，就要远离他，不然也会想睡觉。"],[39,2040,2112,1,"（十）与精进者相处与精进者相处是指与心朝向且致力于证悟涅槃的人相处。与这样的人在一起，内心总是充满正能量。（十一）倾向于培育精进觉支。倾向于培育精进觉支是指在行、住、坐、卧的一切姿势和动作里都令心倾向于培育精进觉支。如此培育的精进觉支只有在证得阿拉汉道时才能够圆满。平常训练精进觉支，首先要能够在行、住、坐、卧一切姿势中有正念正知。先有正念正知，知道什么是善、什么是不善；什么是应做之法、什么是不应做之法；什么是会被智者呵斥的、什么是不会被智者呵斥的，然后按照“四种正知”正知而行。这是倾向于培育精进觉支。"],[39,2112,2225,0,"帕奥西亚多开示精进心所时，提到精进的足处（近因）是悚惧智。悚惧智能够增加善巧和精进。所谓精进是指有善巧的精进，它是无畏惧地、勇敢者一般地精进。不畏惧、勇敢者的精进纯粹是指行善的精进，不是很紧张的、压力很大的、带着瞋心的精进。行善的精进能够像勇者一样勇猛精进，是在善法上不退缩、不抗拒，无论遇到各种艰难困苦，都能够坚持在善法中前行。悚惧智包括：再生的危险（不断地再出生）、年老的危险、疾病的危险、死亡的危险、跌入不幸的危险（很多人都会遭遇不幸）、过去生带来的苦、导致未来的苦、此生为追求食物或四食的苦（觅食之苦） 。简单而言，即生苦、老苦、病苦、死苦、堕恶趣之苦、基于过去轮回之苦、基于未来轮回之苦和觅食之苦。"],[39,2225,2316,0,"当省察这八事时，与愧相应的智就会生起。这种与愧相应生起的智称为“惧愧智”，也称为“悚惧智”。很多人错误地理解悚惧智，认为是“很害怕，如同看到鬼一样”，害怕是瞋心。由于具有悚惧智者多数会很热忱、精进地修习布施、持戒、禅修等十种福德事，因此悚惧智是精进的近因。如果对八种悚惧智能深刻地思惟，一定会生起对生命的恐怖，会觉得生命不可靠。当这种经验生起时是一种智慧，这种智慧与“惭愧”的“愧”相符，是对不善果报的悚惧。伴随着智的生起，转为造作不善的害怕（愧，害怕造恶），从而激发精进。第二种精进的方式是精进的发起事，即导致精进生起的事情，也有八项："],[39,2316,2371,0,"1.远行之前省思远行时没有时间修行，所以在远行之前要加倍倍精进。2.在远行之后省思远行时没能好好修行，所以在远行之后要加3.工作之前省思工作时没有时间修行，所以在工作之前要加倍4.工作之后省思工作时没能好好修行，所以在工作之后要加倍5.生病时省思病情可能恶化，所以要赶紧修行。6.病愈后省思生病时没能好好修行，所以在病愈后要加倍精进。7.得不到足够的食物时，省思吃得少可以身轻好修行。8.得到很多食物时，省思吃得饱才有力气修行。"],[39,2371,2516,0,"这是八种生起精进的发起事。在日常生活行、住、坐、卧时如何取舍呢？很多在家人说：“我既要工作，又要修行，怎么去做才能真正达到精进？”佛陀说的这八事可以跟我们关联起来，关联之后就能经常如理思惟，如此如理思惟及省思之后，行、住、坐、卧都能生起精进。这是让精进生起的八事。有些人问： “精进与想要、执取，应该怎么区分？”欲是中性的，有想要好的，也有想要不好的。精进也是中性的，有正精进和邪精进。正精进：未生恶令不生，已生恶令断除；未生善令生起，已生善令增长。在修行的角度上来讲，“未生恶令不生”主要指五盖，“已生恶令断除”也是指五盖，“未生善令生起”是指各种修行的功德，也可以说是七觉支，“已生善令增长”是指七觉支、八正道、三十七菩提分。以上是精进心所的内容，应如此培育以令精进觉支生起。"],[39,2516,2627,0,"三、喜觉支关于喜觉支应该如何观察和思惟，佛陀说：『内心存有喜觉支，了知：‘我内心有喜觉支’。内心不存在喜觉支，了知：‘我内心没有喜觉支’。他了知未生起的喜觉支如何生起，也了知已生起的喜觉支如何修习至圆满。』佛陀解释第四个觉支，即喜觉支。喜觉支有两种：一种是禅那的喜，一种是观禅的喜。当禅修者到达近行定或安止定时，心会产生很多遍满全身的心生色法，这是殊胜的心生色法，也称为“胜色”，因此禅修者感到很喜悦。事实上喜是依靠心所依处色生起的名法，但是由于与喜相应的心（悦俱的心），会产生遍满全身的很殊胜的色法，因此论师一般用隐喻的方式说“喜遍满全身”。其实并不是喜心所遍满全身，而是喜相应的心产生的殊胜的心生色法遍满全身。令喜觉支生起的缘法，时常对它们如理作意能帮助未生起的喜觉支生起以及培育、增长与圆满已生起的喜觉支。"],[39,2627,2790,1,"什么是令喜觉支生起的缘法呢？《注疏》说：“喜本身就是令喜觉支生起的缘法。”在学习心所时经常提到：四念处是念的近因，信八事是信的近因，喜本身就是喜觉支生起的近因。为什么呢？比如见到一个很喜欢、很相宜的朋友在向你微笑，你也会与他相视一笑，他的微笑成为你微笑的缘法。同样地，当你缘取初禅或者第二禅的喜为目标来修行观智时，你的观智会与极强的喜相应，这时禅那之喜成为观禅之喜的缘法。有些贤友说：“我现在专注入出息，很枯燥。”老师会说：“你要提一下喜。”他就问：“喜怎么提啊？”老师说：“你要培养对入出息的欢喜，要培养对入出息的感情，要像初恋情人一样地对待它。”有人是这么说，但是更多可以思惟入出息本身的功德，它对我们生命的意义、是一切诸佛都修习的法，是一切诸佛在证悟之前培育定力的业处，佛陀时常赞叹入出息念的殊胜。在这个世间有很多人用入出息来培育所谓的轻安、定力，但是只有佛陀教导的入出息念才可以培养圣正定，有七支相助的圣正定。我们现在居然也有机会这样修习，“真是欢喜啊！”喜就会升上来。"],[39,2789,2904,1,"当心有正念地觉知入出息时，生起的就是智相应的善心。所有的善心都有十九个遍一切美心的心所，这些心所里一定有心和心所的轻快、轻安、柔软、适业、练达、正直。当心有轻快、轻安、柔软、适业、练达、正直时，喜自然而然就很容易生起。所以当禅修者只是自然、如实、轻松地去觉知每一个气息时，一定有喜。你欢喜地觉知入出息，你的欢喜就能生起来。《注疏》里特别提到令喜觉支生起的十一种方法：一、佛随念；二、法随念；三、僧随念；四、戒随念；五、舍离随念；六、天随念；七、寂止随念；八、远离粗野的人；九、与斯文的人相处；十、省思能激发信心的经文；十一、倾向于培育喜觉支；佛随念，通过随念佛陀的功德或特质而达到近行定时，遍满全身的喜觉支就会生起。即使没有达到近行定，当思惟佛陀功德时，当心与佛陀的功德相应时，喜自然而然生起，虽然不会遍满，但是喜很容易生起。"],[39,2904,3046,0,"同样地，通过随念法和僧的特质，要真正地知道法的功德与僧的特质是什么，喜觉支也能够生起。对于完美无瑕地持守四种遍净戒已有相当一段时间的比库，当他省思自己的戒行时，觉得没有达到违犯甚至完全清净时，喜觉支就会自然而然地生起。在家居士可以省思自己所持守的五戒、八戒和十戒。在佛陀时代有一位比库叫五戒尊者（五戒持者），他在五岁时就证得阿拉汉。为什么五岁就能证得阿拉汉？他是在胜莲花佛时代是一个富翁的贫穷仆人，他没有能力供养佛陀和僧团，但是他有极强的善欲想要修行善法，以便为自己建立起生死轮回中的庇护所，因此他向一位大长老请求受持五戒，而且决意毫不违犯地终身持守。当时人寿十万岁，他就整整持守了将近十万年的五戒。临终时，他省思自己将近十万年来清净无暇的五戒，非常地欢喜，死后投生到天界。从那时起一直到果德玛佛陀时代成为阿拉汉的十万大劫期间里，他都不曾堕入恶道，只是在人间和天界流转，享受人天福报。而且每一世他都拥有三项特点，即英俊（英俊是形容男人，所以他每一生都是男人）、很富有而且智慧非常敏锐。英俊和富有是过去持戒清净的缘故，为什么他会拥有敏锐的智慧呢？"],[39,3046,3116,0,"是因为在胜莲花佛时代他不单只是持戒，而且还修行止观。观照究竟名色法、缘起及它们的无常、苦、无我三相的观智，所以他有很高的智慧，因此他那时禅修的业产生慧根敏锐的果报。在我们果德玛佛陀的时代，当他五岁时，在接近雨安居的某一天他看到父母向一位比库求受五戒。当时他即刻忆起在胜莲花佛时代所持守的五戒，而生起极强的喜悦，进而生起极强的定力。接着当那位比库为他们开示有关四圣谛法时，他也即刻回忆起在胜莲花佛时代所修的观禅，而且能很轻易地观察当时的五蕴及其因为无常、苦、无我。他次第地证悟四道以及四果而成为阿拉汉。这是通过戒随念而产生喜觉支直到证悟涅槃的例子。"],[39,3116,3187,0,"曾经跟大家分享过，查过去的缘起超过二十生的人会发现三分之二的时间都在恶趣里。这位持五戒尊者十万大劫都没有堕过恶趣，就是因为戒。当我们能够如此精进地持戒，也可以这样不堕恶趣。通过捨离随念，例如省思自己在饥荒时把美味的食物布施给同梵行者，喜觉支就会生起。省思自己拥有令众生成为天神的信、戒、博学、捨、智慧等美德时，喜觉支也会生起。今天有位尊者说在禅修时会欢喜，为什么呢？想到今天把自己很喜欢一部电脑供养给一位持戒清净的尊者，他说很喜欢！禅修时都笑出来，禅修状态就很好——布施可以产生喜。"],[39,3187,3311,0,"如果一个人省思自己曾经拥有心的清净（过去心的平静状态）、寂止，“通过高等成就而镇伏的烦恼在六十年、七十年里都不会生起”，就像大龙长老的故事，喜觉支也会生起。“远离粗野的人”是指远离如同骡子背着污泥般粗鲁的人。粗鲁的人指的是对佛、法、僧没有信心，不礼敬佛塔，也不礼敬长老，自以为是，觉得很了不起、很富有、很聪明，但其实是很粗野的人。“与斯文的人相处”是指对佛陀、对三宝、对八种事深具信心且内心柔和的人。这里特别要讲“内心柔和”，在禅林待久的人都有一种感受：其他素质都还好办，如果一个人内心无法柔和，你会发现跟他很难相处，他也无法受教，这样的人很麻烦。你跟他在一起时，你的心也会变得很坚硬。内心很坚硬的人不会柔和，不会欢喜，每天都是冷冰冰、硬邦邦的。"],[39,3311,3404,0,"“能激发信心的经文”是指能够显示三宝特质以及能够激发对三宝信心的经文。在经典里面有很多讲佛陀的功德、三宝的功德，这些经文可以经常去看。“倾向于培育喜”是指在行、住、坐、卧的一切姿势与动作里皆令心倾向于培养喜觉支。如何培养行、住、坐、卧的一切姿势倾向于喜觉支呢？简单而言，就是要有善法，行、住、坐、卧里面都有正念正知，这就有善法，再加上有戒、有布施、有禅修。布施并非指在家人或出家人每时每刻都在供养财物，但你每时每刻可能在做事，当你做事时能够发起“利益一切众生”的心，哪怕在家人在为他人工作时带着为人民服务的心，就是布施。你反正都要做，把心念转过来——为人民服务，就是布施。布施就会很欢喜，而不会觉得“我那么倒霉，要为别人干活”。"],[39,3404,3484,0,"如果有禅修就有更多的喜觉支生起，有持戒就不会追悔；有布施、有禅修就会有收获；没有追悔又有收获，喜觉支自然而然就能够被培育。当然，喜觉支只有在证得阿拉汉道时才能到达圆满。四、轻安觉支佛陀说： 『内心存在轻安觉支时，了知：‘我内心有轻安觉支。’内心不存在轻安觉支时，了知：‘我内心没有轻安觉支。’他了知未生起的轻安觉支如何生起，也了知已生起的轻安觉支如何修习至圆满。』这是佛陀解释的第五个觉支。轻安觉支有两种，即身轻安和心轻安。所谓身轻安是指心所的轻安，而心轻安是指识（意识心）的轻安。这两种轻安本身即是令轻安觉支生起的缘法，时常对它们如理作意能够帮助未生起的轻安觉支生起以及培育、增长和圆满已生起的轻安觉支。"],[39,3484,3546,1,"在每个善心里都有身轻安和心轻安这两个心所，但其强度则取决于与它们相应的定和慧有多强。在禅那心里，由于定力很强，因此轻安也会变得很强。在观禅里，由于智慧很强，因此轻安也会变得很强，因此修习止观禅法能够培育极强的轻安觉支。《注疏》提到七种能令轻安觉支生起的方法：一、食用良好的食物；二、舒适的气候；三、舒适的姿势；四、看法中道；（观念持中道、不偏）五、远离烦躁的人；六、与平静的人相处；七、倾向于培育轻安觉支。"],[39,3546,3694,0,"在此，“良好的食物”是指有营养、有益且适合自己的食物，并不是最美味的就是良好的食物，要跟自己的身体相适应才行。良好的食物，首先能够提供禅修者足够的体力，能够坐得久。如果吃得不够或者食物的品质太差，身体就会衰落，无法久坐，也无法保持定力。有些人身体本身就寒，但是喜欢吃水果，吃一大堆以后身体各种不适。水果很美味，但是对你来讲并不一定是良好的食物。要在长时间的托钵过程中去观察自己适合吃什么样的食物。“舒适的气候和姿势”是指适合自己的气候和姿势。通过运用这三项，适合的食物，身体保持健康，心也能健康，因而能获得两种轻安。当然，达到四种增上（四如意足）的人，可以忍受一切的气候和姿势，佛陀、佛陀时代的大弟子们在一切时处都能够很好地获得轻安，他们的心可以超越食物、气候、姿势的影响。“看法中道”是指能够省思自己的业才是自己的财产，而别人的业则是别人的财产，依着业果法则来看待所有的人事物，了知一切的苦乐都是由于自己所造的业产生的。这样会避免认为诸有情所体验的苦乐是无因而生的极端邪见，也会避免认为有个创世主在令有情遭受苦乐的另一极端邪见，也会远离“认为我们的苦都是别人造成的”这样的烦恼。"],[39,3694,3765,0,"“远离烦躁的人”是指远离那些拿着石块和棍棒四处骚扰人或时常说粗恶语的烦躁之人。烦躁的人心情很烦躁，停不下来，跟这样的人在一起，很难让轻安觉支生起。“平静的人”是指在身体方面能够自制而内心宁静之人。“倾向于培育轻安觉支”是指行、住、坐、卧一切姿势与动作里，都能够令心倾向于培育轻安觉支。特别对于瞋性行者来讲，在行、住、坐、卧的一切时处，都容易表现得很紧张、很紧绷。所以瞋性行者就要时时关注：走路时是不是太快，站立时是不是东倒西歪，坐下时很紧绷，平常没事时咬着牙齿，这些就要着重去对治。佛陀在《寻止息经》里讲，要刻意地去对治这些现象。"],[39,3765,3867,1,"如此培育的轻安觉支只有在证得阿拉汉道的时候才能够到达圆满。今天先学习到轻安觉支，祝愿大家都能够身心轻安！Sādhu！Sādhu！Sādhu！"],[40,0,126,1,"193讲-摄集-摄菩提分-法念处-七觉支 3&四圣谛 1古源尊者上堂课学习<法念处>七觉支中轻安觉支的部分内容。一、轻安觉支令轻安觉支生起的方法有七种：1.食用良好的食物；2.舒适的气候；3.舒适的姿势；4.看法中道；5.远离烦躁的人；6.与平静人相处；7.倾向于培育轻安觉支。《注疏》中解释，看法中道，是指省思自己的业是自己的财产，而别人的业是别人的财产，即是依业果法则来看待事物，了知一切苦乐皆由自己造的业产生。"],[40,126,248,0,"在日常生活中生起中道的看法并不容易。当我们受苦时，习惯于归因于外；感受到快乐时，希望快乐可以一再地拥有，这种习惯就是不以业果角度来看待问题。不以业果角度看待问题，看法就不中道。如果以业果角度来看待问题，就会避免认为“有情所体验的苦乐都是无因而生的”或者认为“某某就应该怎样”，这都是一些邪见隐藏在后面。如果有业果正见，可以避免认为“有一个救世主在惩罚众生、有情，或者给有情带来快乐”的邪见。很多人问：“Bhante，禅修时总是没有轻安。”为什么没有轻安呢？因为认为“我禅修就应该有轻安”或者认为“有什么原因阻碍我禅修”，皆是归因于外,不愿意自然、如实、轻松地觉知你的业处。这种情况，轻安就很难生起。"],[40,248,327,0,"二、定觉支（一）定觉支是指有平静而不混乱的相《大念处经》中，佛陀说：『内心存在定觉支，了知‘我内心有定觉知’；内心不存在定觉支，了知‘我内心没有定觉支’。他了知未生起的定觉支如何生起，也了知已生起的定觉支如何修习至圆满。』佛陀解释前五个觉支后，接着解释定觉支。定觉支指什么呢？定觉支是有平静而不混乱的相，时常对它们如理作意能帮助未生起的定觉支生起以及培育、增长和圆满已生起的定觉支。亦即：平时经常对平静与不混乱的相如理作意。"],[40,327,416,1,"很多人不习惯于平静，当内心平静时他觉得无聊，喜欢各种混乱，总是要去找点事情来干，看看手机、刷刷视频，不然就觉得生命没有价值。有些人不玩游戏到次日凌晨两三点，就觉得生命白过。这就是对“平静与不混乱之相”不能如理作意，非理作意。对于“平静与不混乱之相”非理作意的人，无法培养定觉支。禅修要有业处，业处有业处的相。禅修者要能够取相，取到相并且能把它谨记于心中（取到相并对相念念不忘），即已达到第一阶段的定。该安详的境界、安详的状态即是平静之相；不混乱之相即是不散乱，心不会散乱。"],[40,416,512,1,"（二）心会混乱之因心为什么会混乱？因为我们总是习惯于在很多目标里打转转，从一个目标飘到另一个目标，想这个想那个，每天有各种各样的想法，不是想抓取，就是各种担忧。目标非常繁杂、散乱、不专一。不稳定是散乱的特相；偏离目标是散乱的现起，心总是从这里飘到那里。（三）通过一境性解决心散乱的问题怎样解决散乱的问题？通过一境性能够灭除混乱。灭除混乱必须有前行。首先避免心无谓地转起。什么叫心无谓地转起呢？就是没事找事，心停不下来，总是要去想一下这个事、想一下那个事，各种担忧、焦虑、着急。建议大家写心念日记，记七天就行，每天想的事超过 15 分钟的，就把它写下来。写一个礼拜，基本上就够了（对大部分人来讲）。如果你本身比较宁静，要写21 天。"],[40,512,650,1,"连续写七天，回头总结一下每天想的超过 15 分钟的事，看看大量在想的事到底哪一些有价值，你会惊讶地发现80%都没有价值，但你每天就是这么想啊、想啊、想啊……让你的心不断地无谓地转起。如果能避免心不断地转起，接下来要避免极端思维。有些人的思惟方法走极端，什么事都非要搞个明白、论个是非对错。比如极端的完美主义思惟：不能容忍自己有一点点不完美，不允许自己有一点点错误；极端的消极思惟：做什么东西都觉得不行，然后落在那种不断打压自己的习惯里面……这些都属于极端思惟。避免心无谓转起，避免极端思惟后，才有办法训练正念正知。正念正知前提是专心，能一心一用。一心一用、不一心多用才能即入即出。即入即出首先是真实、正直、柔软，其次是想做什么就只做什么，进入状态后，对其它心无旁骛，这时才容易培养定。培养定觉支要有即入即出的基础，当有即入即出的基础，就可以开始修定。（四）培养止禅和观禅中定觉支的方法1. 第一个阶段学习取相定觉支可分为两种，即止禅与观禅的定觉支。培养这两种定觉支的方法各分为三个阶段：第一个阶段学习；"],[40,650,796,0,"第二个阶段实修；第三个阶段保持。举例而言，如果修习入出息念或修习遍禅，首先必须找一位通达的老师学习相应的修行方法。对于入出息念，禅修者要清楚什么是相、什么是入息、什么是出息；能取到相，能知道什么是入出息的概念。不然就很容易折腾。有贤友问：“尊者，您说入息时不要跟着入，出息时不要跟着出，那入息可以入多少呢？一厘米还是三毫米？不能够一点点都没有吧？”这种问法就表明他搞不清楚什么是相、入息、出息的概念。搞不清楚概念时，就会在觉知相、入息、出息时倒腾，分析、评价、判断。当分析、评价、判断时，心就不断转起，就没有定觉支。比如修遍禅，取地遍，如果不知道如何制造地遍，随便去选一块坑洼不平、颜色不一、 里面还有很多沙石、 可能还有若干落叶的大地，结果所取的地遍的相都是垃圾、树叶、小石子，坑洼不平，以至于取这个地遍时心很难平静。要知道怎么做地遍。地遍的颜色不能够与黄遍相混，取黄土容易与黄遍相混；取红土容易与红遍相混；取黑土容易与青遍相混，很讲究的。所以禅修者要知道怎么做，要在老师指导下去做，不要自己瞎整。"],[40,796,909,0,"2. 第二个阶段实修取到相，进入实修。实修的过程,就是如何持续地、稳定地让相变成禅相，从普通的取相最后能变成似相，心能够沉入。在修习过程中，内心的各种状态、性行、习惯，总是会花样百出地考验禅修者。如果禅修者没有好的老师引导，就很难一帆风顺地修习。3. 第三个阶段保持若修习到能入禅，对于什么时候入禅以及入禅后如何稳定禅那，帕奥西亚多要求：要沉入似相至少四五个小时没有妄念。“Bhante，我只会半个小时没有妄念，怎么办呢？”如何能够谨慎地保持定力、调整平衡，也有很多方法。在定觉支的学习过程中，很多人经常会提到：要用技巧。任何技巧都万变不离其宗，即无论用任何方法，总是要让心趋于五根平衡、七觉支平衡。"],[40,909,1027,1,"五根平衡、七觉支平衡的前提是禅修者对相的理解要到位。对于入出息而言，要理解什么是相，什么是入息，什么是出息。相、入息、出息回到七觉支里怎么调整。对于遍禅，比如白遍、地遍，更没有参照性。修半个小时、一个小时，妄念来时应该如何调整，这就与你的性行、习惯有很大关系，须请老师指导。如果想要修习观禅，首先要学习阿毗达摩，把教理学明白，否则不知道如何修观。学好教理还能防止止观修学的误区，比如修名色，能看到色法、看到名法，但如何生起名色分别智、缘摄受智呢？就必须先学习教理以便了解所有究竟法的特相、作用、现起、近因；名色以及名色生起的因、缘起诸法的三相——无常、苦、无我。然后能够实际地观照它们以及练习保持观禅定力的技巧。"],[40,1027,1095,1,"有些人初学观禅时，用力太猛，半个小时就累了，然后就会昏沉。“Bhante，修观禅怎么还会昏沉？”很多人修观禅都会昏沉。如何止观双运，就很有讲究。以上是观禅里的定觉支。（五）令定觉支生起的方法《注疏》中提到有十一种方法能令定觉支生起：1.清净依处（内依处、外依处）；2.平衡五根；3.善于取业处之相；4.在必要时策励心；5.在必要时抑制心；6.在必要时令心喜悦；7.在必要时不干涉地旁观心；8.远离心不专一的人；9.与心专一的人相处；10.思惟安止及解脱；11.倾向于培育定觉支。"],[40,1095,1173,0,"1. 清净依处之前已多次讲到清净依处，不再重复。无论是身体，内在、外在或孤邸等各方面都要干净整洁，井井有条。2. 平衡五根前两堂课讲五根要平衡，平衡五根的学习参考前两堂课内容。3. 善于取业处之相第一，要明白这是什么业处，是地遍、水遍、火遍、风遍、白遍、红遍还是青遍？地、水、火、风是四大属性的遍禅，青、黄、红、白颜色界的遍禅。要明白颜色的遍禅其概念是什么，地、水、火、风的概念是什么，否则很容易搞错。"],[40,1173,1273,1,"第二，要明白所缘和相。什么是业处的所缘，什么是遍禅的相。刚开始修的相与后面的禅相、似相有什么差别；还没有入禅的相与一、二、三、四禅的相有什么差别？你可以请教老师。老师如果说：“你现在还没学到，不要问那么多。”这是对的。总体来讲，任何一个业处，从他开始修到证得四禅（或能证得四禅），所缘都是一个，不会变。但所缘形成的相是会不断变化的，如果你期待某一个特定不变的相就会控制、抓取。而最后能够入禅的相包含入禅的征兆，这与禅支相关。初禅与五禅支相关；二禅与三禅支相关（喜、乐、一境性）；三禅是乐、一境性；四禅是捨、一境性。"],[40,1272,1337,1,"并非准备入禅前先设定一个感觉。比如有同学入二禅前设定喜的理解，结果进去以后，说：“Bhante，我觉得喜不对呀。”你从来没有入过二禅，怎么知道喜不对？然后入三禅，他又设定乐的感觉， “乐好像也没咋的。”这就是没事找事。按照经典指导：获得稳定的初禅后，按步骤：两个缺点一个优点，捨掉寻和伺，进入什么状态就什么状态，不要提前预设。相、禅支与感受是相关联的，要理解。前提是：第一，听老师的话；第二，不要头上安头，不然定力会受影响，甚至修错。"],[40,1337,1474,0,"4. 必要时策励心“策励心”是指通过激起择法、精进、喜觉支来策励心。当缺少精进、智慧，对禅修没有喜悦时，应采取此方法。之前的课程讲过，不再重复。5. 必要时抑制心“抑制心”是指抑制太过精进于运用智慧和太过喜悦的心。若要做到这一点，可相反地激起轻安、定和捨觉支。比如修入出息念时，如果觉得气息变得不清晰，很多人会这样做：“我加大呼吸，我控制它一下，把它弄清晰”，那就错了。不清晰有很多原因，可能是呼吸变微细了，觉知不到它；可能是心变得沉滞，有点糊掉，这两者不同。这个时候念和择法就要提起来，观察造成入出息不清晰的原因，作出相应的调整。如果沉滞，就要激励心，让喜、精进、择法提起来；如果心太活跃，就要多专注不动的相。如果禅相已经出现，经常有人跟我讲：“Bhante，那个颜色是紫色的，好像是四方的，好像是菱形的、椭圆的。”当你去在意这些时，心就不平静。无论白、红、长、短，都不要管，继续觉知入出息，只应专注于它相关的相（其实相都是入出息的一种状态，或所缘的形状、颜色）。如此就不会无谓地提起精进、喜与择法，而能够生起轻安、定与捨觉支。"],[40,1474,1579,1,"6. 必要时令心喜悦“令心喜悦”是指在心由于智慧力较弱，不能证得安静、宁静的乐，或不能暂时平息贪欲而感到不满时，心没有喜悦，觉得呼吸很枯燥，没意思，这时心就不会喜。“令心喜悦”就是让心再次对入出息的业处、对自己充满信心。佛陀教导通过思惟能够激起悚惧感的八个原因而达成，即思惟生、老、病、死、四恶道的苦、过去轮回的苦、未来轮回的苦、这一生为了生存和物种繁衍寻觅四食的苦。也可思惟“现在我还有机会修习入出息念，乃至于未来能够证得解脱。全世界70 多亿人，没几个人这么干，真的太幸运。”喜悦就生起。也可以通过各种随念，三宝随念（佛随念、法随念、僧随念）、戒随念、天随念、寂止随念等，让心生起喜悦。比如梵天随念：“我现在修禅那，如果能维持到临终，就可以去梵天。”因此生起欢喜。乃至于如此思惟可以解脱的寂止随念。"],[40,1579,1648,0,"7. 必要时不干涉地旁观心“不干涉地旁观心”是指对已经进入正确的行道并且进展顺利的心不给予策励、抑制，亦不令心生起欢喜，因为这种心无昏沉、无掉举且无不满。在学习中捨性心所时，佛陀开示：就像非常熟练地驾着两匹马的马车夫，他只是静静地坐着，旁观而不干涉，很平顺地驾驭着马稳定地奔驰。这就是不干涉的旁观心，不偏不倚。8. 远离心不专一的人“远离心不专一的人”，是指远离没有达到近行定和安止定而内心散乱的人。"],[40,1648,1735,1,"9. 与心专一的人相处“与心专一的人相处”，是指跟已经达到那些定境的人相处。这很重要。在禅林里经常会碰到哪一类人呢？一类是话痨，他就是喜欢说话。这一类人自己很散乱，怎么都没办法安静下来。另一类是喜欢说各种是非，总是把你的心挑逗起来，觉得也有很多是非。和这种人相处想要获得定觉支就很困难。10. 倾向于培育定觉支。“倾向于培育定觉支”，是指在行、住、坐、卧的一切姿势和动作里都让心倾向于培养定觉支。刚才讲了培养定觉支的前行：不要想那么多事，不要动不动让你的心转起，不要有极端思惟，不要一心三用五用八用，要训练即入即出，都是指这些内容。要想让定觉支圆满，只有止观行者在证得阿拉汉道时才能够完全到达。"],[40,1735,1893,0,"三、捨觉支佛陀说：『内心存在捨觉支，了知‘我内心有捨觉支’；内心不存在捨觉支，了知‘我内心没有捨觉支’。他了知未生起的捨觉支如何生起，也了知已生起的捨觉支如何修习到达圆满。』（一）令捨觉支生起的方法有五种方法可以令捨觉支生起：1.对众生不执著的态度；2.对东西（物品）不执著的态度；3.远离对众生与物品有自我感觉的人（自我抓取的人）；4.跟平等对待而不执取众生与物品的人相处；5.倾向于培育捨觉支。1. 对众生不执著的态度“对众生不执著的态度”，是通过思惟众生是他们自己业的拥有者，或思惟究竟法（从究竟的角度来看问题）而达到。“思惟众生是他们自己业的所有者”是指如此思惟：“你是由过去世自己所造之业而产生，而且将依照自己的业而离开此地投生到下一世，别人也是一样。如此你又是在执著谁呢？”你再喜欢家人、伴侣，或者亲人，他总是依着他自己的业在生存，依着业果法则在生命中转起。你执取他，就干预到他正常的业果法则运作。最好的方式是让他也明白业果法则，而不是透由你的执取传递给他各种压力和消极。“思惟究竟法”是指思惟：无论是孩子、先生、母亲、亲爱的人或忿恨的人等，在究竟上只有无常、苦、无我的名色法（即各种精神和物质的组合），它刹那地生灭，所以无常；"],[40,1893,2060,0,"它一直受无常的逼迫，所以苦；因为无常、逼迫，所以没有“我”。在究竟意义上并没有众生存在，没有亲爱的孩子、亲爱的先生、亲爱的太太、亲爱的妈妈存在，只是一堆刹那生灭的名色法，有什么好执著呢？2. 对物品不执著的态度“对物品不执著的态度”，是通过思惟“没有拥有者和拥有的短暂性”来达到。比如思惟：“这袈裟将会褪色、会老旧、会破掉，变成擦脚布，最后被人拿去扔了、烧了。如果袈裟有主人或者不变化，就不会落到这种下场。”这是思惟无拥有者。思惟该袈裟不能耐久长存而只能短暂地存在是思惟它的短暂性。这两种思惟也可以运用于钵或者其他物品，生活中的所有物品都是这样的。广告说“钻石恒久远，一颗永流传。”当你死时，也不知道它去哪了。当然，它也可能摔碎，很正常。认为钻石有价值，是你的内心赋予它的，应如此思惟。3. 远离对众生和物品有自我感觉的人要远离对众生有自我感觉的人，包括很爱惜自己儿女的在家人，也包括很爱惜自己的弟子、朋友、戒师、依止师等的出家人。这种出家人会为他所爱惜的人做很多事情，比如给他剃发、缝补袈裟、洗袈裟、染袈裟，烤钵等。"],[40,2060,2136,1,"如果有段时间没看到他所爱惜的人，经典中形容：会像迷乱的鹿一样四处寻找，问：“我的弟子在哪里？我的沙弥在哪里？我的西亚蕾去哪里？某某比库去哪里？他们是不是背叛我了”应该远离这种对众生自我倚恃、自我纠缠的人。要远离对物品有自我感觉的人，是指对于自己喜欢的东西非常爱惜，出家人就是各种袈裟、钵、容器，佛陀时代的比库们少欲知足，现在信众供养的东西很多，出家人就会有很多执著，甚至让别人碰一下都觉得不行，很悭吝。看别人东西好，就嫉妒。自己的东西要被人分享，就悭吝。当有人向他借东西时，他会说：“即使是我自己都舍不得用，怎么能借给你呢？”这样的人就应该远离。"],[40,2136,2234,0,"4. 跟平等对待而不执取众生和东西的人相处平等对待而不执取众生和物品的人，经常跟这样的人相处，培养不执取的习惯。“近朱者赤，近墨者黑”，可以“见贤思齐”。5. 倾向于培育捨觉支“倾向于培育捨觉支”，是指在行、住、坐、卧的一切姿势与动作里能够让心倾向于培育捨觉支。如此培育的捨觉支只有在证得阿罗汉道时才能够到达圆满。《注释》解释：捨觉支的因是无执取、无排斥的平等、中道的境界。如果无执取、无排斥即有捨；如果有执取、排斥就没有捨。此无执取、无排斥之境有两方面：一方面是对有情众生，一方面是对于无情的物品或者事物，包括见解。出家人，或学佛之后，可能对其他物品不执取，觉得“没关系”，但是对自己的见解往往非常坚固，容不得别人的观念看法，这也是对非有情物品的执取。"],[40,2234,2326,0,"通过培育捨觉支就能够灭除排斥性。捨觉支特别能够对治贪欲。论师说：“捨是满怀贪欲者的清净之道。”如果你是贪性行者，就要多训练捨觉支。四、更高阶段的观智佛陀最后对七觉支的法随观这样开示： 『如此，或于内法随观法而住，或于外法随观法而住，或于内外法随观法而住。或于法随观生起之法而住，或于法随观坏灭之法而住，或于法随观生起、坏灭之法而住。他现起‘有法’之念，只是为了智与念的程度。他无所依而住，亦不执取世间的一切。诸比库，比库乃如此对七觉支而于法随观法而住。』这是法随观部分。"],[40,2326,2428,1,"以上这段经文之前有学习过，不再重复。“外法随观法而住，内法随观法而住，法随观生起之法而住，或法随观坏灭之法而住，生起、坏灭之法而住。”须很细致地观察。之前课程中提到，基于概念法的随观与基于究竟法的随观。基于究竟法的随观，要见到名色、修到缘起后才能做到随观。基于概念法的随观，就要在见、听、嗅、尝、触的每一个当下，用法随观的方法去观。概念法层面上的法随观，简单而言，外观法，如外在的禅堂、塔、外面的树，或者喜欢的花，这是外法。直接看到外法同时要看到它的因缘，为什么会有这样的因缘存在。内法，要看到内心里面生起对这个法的执取，或有执取或无执取，而这有执取或无执取又是什么样的因缘？它的缘起运作方式是怎样？是基于什么样的生起，是基于什么样的坏灭？有没有七觉支生起？都是可以很仔细地去观察的。关于七觉支的随观，就学习到这里。"],[40,2428,2706,0,"五、四圣谛接下来学习<三十七道品>之法随观——四圣谛的部分。四圣谛，即苦、集、灭、道，应该如何随观呢？在解释依七觉支而修行法念处之后，佛陀继续解释依四圣谛而修习法念处的方法。佛陀说：『再者，诸比库，比库对四圣谛而于法随观法而住。诸比库，比库如何对四圣谛而于法随观法而住呢？诸比库，于此，比库如实了知‘此是苦’；如实了知‘此是苦之集’；如实了知‘此是苦之灭’；如实了知‘此是导至苦灭之道’。』这段经文的意思是：比库捨弃爱欲，如实地了知三界中的一切行法都是苦，如实地了知造成苦生起的过去因，如实地了知苦与苦因的灭尽是涅槃，以及如实地了知透视苦、捨弃苦因、证悟涅槃的圣道。（一）苦谛什么是苦？佛陀在《大念处经》中说：『诸比库，何谓苦圣谛？生是苦，老是苦，死是苦，愁、悲、苦、忧、恼是苦，怨憎会是苦，爱别离是苦，所求不得是苦。简而言之，五取蕴就是苦。』‘生老病死、怨憎会、爱别离、求不得’大家都懂，在日常生活中能碰到，这里大部分是指概念法（世俗谛）的苦。‘简而言之，五取蕴是苦’，五取蕴是完全讲究竟法的苦。在日常生活中看到概念上的苦，要知道其根本原因：在究竟上它就是苦。"],[40,2658,2867,1,"『诸比库，什么是生呢？无论任何的有情，即于其有情的部类中，诞生、出生、入胎、再生、诸蕴的显现、诸处的获得。诸比库，这称为生。』『诸比库，什么是老呢？无论任何的有情，即于其有情的部类中，年老、衰老、牙齿损坏、头发斑白、皮肤变皱、寿命减损、诸根成熟。诸比库，这称为老。』『诸比库，什么是死呢？无论任何的有情，即于其有情的部类中，死亡、灭殁、破坏、消失、逝世、命终、诸蕴的分离、身体的舍弃、命根的断绝。诸比库，这称为死。』对于“生”，很多人都已忘记出生，特别对于人类而言，大部分人记事的都是两三岁、五六岁、七八岁，所以对生苦没有感觉。很多同学在修缘起时，能够看到生苦。有些同学天生就能记住，一些禅修者，从小就能记住怎么来到母亲怀里结生。他说：“在母亲的子宫里非常难受，阴暗、腐臭，动荡不安，因为母亲总是经常走动。母亲如果生气，就感觉进入脐带的东西，像刀割一样，很难受。”我们现在都忘了生苦。如果你能修名色法，修到缘起，一直追溯到出生或在十月怀胎期间，就能够清晰地感觉到。"],[40,2867,2944,0,"第一种苦是生，生就是“诞生、产生、出现、现起”是依照世俗谛而作的解释。“诸蕴的显现、诸处的获得”是依照究竟谛而作的解释。对于老和死，“诸蕴的分离”是依究竟谛而作的解释，其余都是依世俗谛而作的解释。依世俗谛而言，一生中第一个刹那称为生，最后一个刹那称为死，在这两者之间都称为老。从一出生就不断地老，到奔向死亡的过程，就是不断老化的过程。依据究竟谛而言，在每一个色法刹那与每一个心识刹那中都有三个小刹那，其中生时小刹那称为生，住时称为老，灭时称为死。因此在观照生、老、死时，必须依照这两种方法来观察，即从世俗谛的角度来看，然后从究竟谛角度来看。"],[40,2944,3062,1,"接着佛陀解释愁、悲、苦、忧、恼。佛陀说：『诸比库，什么是愁呢？诸比库，若是由于具有任何一种的不幸、遭遇任何一种的苦法而愁虑、忧愁、哀愁、内心忧愁、内心悲哀。诸比库，这称为愁。』『诸比库，什么是悲呢？诸比库，若是由于具有任何一种的不幸、遭遇任何一种的苦法而哭泣、悲叹、悲泣、悲哀、哀号、悲痛。诸比库，这称为悲。』『诸比库，什么是苦呢？诸比库，身体的苦，身体的不适，由身触而产生的痛苦、不适的感受。诸比库，这称为苦。』苦是身体的苦受；愁、悲、忧、恼是心的苦受，包含在瞋恚心（瞋组）中。当观照不善名法时，必须依照心路过程来观照愁、悲、忧、恼以及它们各自的相应名法（与瞋根心相应的名法）。苦则是在身门心路过程中与身识相应的苦受，观照究竟名法时，也应该观照身体的苦受以及与它相应的名法。"],[40,3062,3143,0,"『诸比库，什么是忧呢？诸比库，心的苦，心的不愉快，由意触而产生的痛苦、不适感受。诸比库，这称为忧。诸比库，什么是恼呢？诸比库，若是由于具足任何一种不幸、遭遇任何一种苦法而郁恼、忧恼、憔悴、绝望。诸比库，这称为恼。』『诸比库，什么是怨憎会苦呢？于此，凡是那些不可喜的、不可爱的、不可意的色、声、香、味、触、法，或者那些意图不利者、意图无益者、意图不安乐者、意图不安稳者，若与他们一起交往、会合、共聚、结合。诸比库，这称为怨憎会苦。』怨憎会苦，从世俗谛的角度来讲就是会遇到不喜欢的对象、厌恶的对象、排斥的对象而生起的内心痛苦的感受。如果修观在观照瞋组不善名法时，就必须观照到它。"],[40,3143,3205,0,"接着佛陀说：『诸比库，什么是爱别离苦呢？于此，凡是那些可喜的、可爱的、可意的色、声、香、味、触、法，或者那些希望有利者、希望有益者、希望安乐者、希望安稳者，母亲、父亲、兄弟、姐妹、朋友、同事或血亲，若不能与他们一起交往、会合、共聚、结合。诸比库，这称为爱别离苦。』与所爱的对像分离时会生起心理的苦受，它与瞋同时存在，应如此观察。佛陀说：『诸比库，什么是所求不得苦呢？诸比库，有生法的诸有情生起如此的欲求：‘啊！愿我们将没有生法，希望生不要到来！’然而却不能达成这样的欲求，这是所求不得苦。"],[40,3205,3273,0,"诸比库，有老法的诸有情生起如此的欲求：‘啊！愿我们将没有老法，希望衰老不要到来！’然而却不能达成这样的欲求，这也是所诸比库，有病法的诸有情生起如此的欲求：‘啊！愿我们将没有病法，希望疾病不要到来！’然而却不能达成这样的欲求，这也是所诸比库，有死法的诸有情生起如此的欲求：‘啊！愿我们将没有死法，希望死亡不要到来！’然而却不能达成这样的欲求，这也是所诸比库，有愁、悲、苦、忧、恼诸法的诸有情生起如此的欲求：‘啊！愿我们将没有愁、悲、苦、忧、恼诸法，希望愁、悲、苦、忧、恼不要到来！’然而却不能达成这样的欲求，这也是所求不得苦。』这些无法籍着愿望而达成，但是可以籍着有系统地修习八正道而达成。"],[40,3273,3343,0,"佛陀说： 『诸比库，何谓‘简而言之：五取蕴即苦’呢？这就是：色取蕴、受取蕴、想取蕴、行取蕴、识取蕴。诸比库，这些称为‘简而言之：五取蕴即苦’。诸比库，这称为苦圣谛。』五取蕴是观智的目标，因此如果想修习观禅，首先必须观照它们。为什么称它们为“蕴”呢？因为它们个别是十一种法的集合。佛陀解释色蕴时说：过去、现在、未来，内在、外在，粗的、细的、低劣的、优胜的、远的和近的十一种色法是色蕴。对于受蕴、想蕴、行蕴、识蕴也应以同样的方式来了解。如果能观照这十一种五蕴，就算了知了苦谛。"],[40,3343,3420,1,"查过去要查多少生呢？帕奥西亚多以前是要求查五生，现在有时要求查一生两生。我一般建议至少查二十生以上；现在是现在的；未来一直到你成佛或者证阿拉汉。内在就是我们自己这个内在名色；外在是外在的名色。粗的，就是你过去生曾经做过阿修罗，身体跟大山那么大，或者你做过恐龙、鲸鱼、大象；细的，就是做过蚂蚁、蚊子、小虫等。低劣的，就是地狱的众生；优胜的，就是梵天界的众生。远的，就是很久远以前的生命；近的，就是现在的生命。这十一种究竟的色法。色法所组成的是色蕴，然后受蕴、想蕴、行蕴、识蕴都要能这样观察。"],[40,3408,3503,1,"（二）集谛接着佛陀解释集谛：『诸比库，何谓苦集圣谛？此爱导致再有，与喜、贪俱，于处处而有喜乐，这就是：欲爱、有爱、无有爱。』上述的这些苦，其实就是目及之处，你所能遇到的一切处，都是苦。简而言之，五取蕴就是苦。这个世界对于凡夫来讲就是五取蕴组成，你能遇到的一切都是苦。为什么会有苦存在呢？乃至于苦一再地发生呢？佛陀宣说苦集圣谛，苦集起的真理是什么呢？是因为渴爱而导致再生、再拥有生命。是跟喜和贪伴随着，于处处而去寻找喜乐，这就是欲爱、有爱、无有爱。轮回是由于无明和渴爱造成的，无明是一种观念、看法，表现在当下的状态都是渴爱。"],[40,3503,3629,0,"为什么佛陀开示说爱欲是苦的因呢？因为爱欲是苦生起的最显著助缘。譬如有一粒成熟的种子，只要里面还有湿度，种在适当的泥土中，就能长成一棵植物。同样的道理，业力就好比是种子，爱欲好比是种子里的湿度（未干透的、新鲜的种子，还有活力，还有湿度），它是使业力能产生五蕴的强力助缘。如果没有爱欲，业力就无法产生五蕴。这就是佛陀说爱欲是苦因的理由。说到爱欲时，也就包括无明和取：由于一再发生而变得很强烈的爱欲就是取，由于有无明所以爱和取才能够生起。无明、爱、取是业力的助缘，而业力是善行或者不善行留下的影响力。虽然行法一生起之后就立即坏灭，但是它的影响力（业力），依然存在于名色相续流当中，在因缘成熟时，就会产生果报五蕴。如是总共有五种因，即无明、爱、取、行、业。在这五种因当中，爱欲是最显著的因素，因此佛陀说：“造成投生的是爱欲，它伴随着喜和贪同时生起，四处都在追求快乐。”"],[40,3629,3691,0,"曾经反复讲过，一切众生的一切生命活动只有一个目的——寻找快乐。因为寻找快乐，在寻找快乐的过程中不断地造作跟寻找快乐相应的业。而这个快乐的寻求是基于这个生命的，所以造下的业就是对于这个生命的无明支撑下，在爱、取的推动下，造作相应的事件或者身语的动作，留下的影响力都是跟你的生命继续存在、爱取相关。因此当你死亡时，这样的业再生起就是有生命的再生。在这里佛陀开示三种爱，即欲爱、有爱、无有爱。什么是欲爱呢？就是对色的爱，对声的爱，对香的爱，对味道的爱，对接触的爱，对法的爱。"],[40,3691,3757,1,"什么是有爱呢？《注疏》里解释说有三种有爱：⑴ 与常见俱生的爱。常见就是相信有恒常不变的灵魂，会从一个生命轮回到另一个生命。包括用其他的名字：大我、真我、高我、梵我、神识，都跟这个相似。⑵ 对于色界、无色界生命的爱。就是对梵天、无色界梵天的爱。⑶ 对于禅那的爱。什么是无有爱呢？无有爱就是与断灭见相关的爱。持有断灭见的人不相信死后还有来生，总是觉得人死如灯灭。这样的一种理解，它也是一种爱，是对于没有再生的一种爱。"],[40,3757,3839,1,"佛陀说：『然而，诸比库，此爱于何处生起而生起，于何处止住而止住？凡世间有喜色、悦色者，其爱即于此处生起而生起，于此处止住而止住。』这是六内处。人们通常对自己的眼、耳、鼻、舌、身、意六根有很强的执著，这就是为什么他们会经常照镜子看自己的影像，用尽各种方法来保养自己的身体。人们依靠六内处而生起强烈的爱欲。前面讲到爱欲是苦的因，生起苦是因为有爱，有爱就会有取，有取就会不断地去造作与无明、爱、取相关的行，行就留下影响力。该影响力在因缘成熟时，产生新的果报五蕴。新的果报五蕴又再去追寻快乐，与悦俱的贪相应，生命就会不断地轮回。"],[40,3839,3915,1,"今天简单地讲到“爱欲是苦的因”，下堂课再来学习集谛的内容。祝福大家早日断除爱欲！早日解脱一切苦！回向功德！"],[41,0,138,1,"194讲-摄集-摄菩提分-法念处-四圣谛 2古源尊者礼敬尊敬的祜巴拉大长老、各位尊者、各位尼师、各位贤友晚上吉祥！上堂课学习了<法念处>四圣谛中苦圣谛及苦集圣谛的部分内容。一、苦集圣谛佛陀说：『诸比库，何谓苦集圣谛？此渴爱导致再有，与喜、贪俱生，于处处而有喜乐，这就是：欲爱、有爱、无有爱。』（一）爱欲是苦的因1. 何谓渴爱佛陀说爱欲是苦的因，爱欲为什么是苦的因呢？从究竟的角度上来讲，无明、爱、取、行、业导致再生。无明、爱、取、行、业中的爱是指三种爱 —— 欲爱、有爱、无有爱。"],[41,138,271,0,"欲爱有六种：色爱、声爱、香爱、味爱、触爱、法爱。有爱，《注疏》中解释说有三种有爱：1.与常见俱生的爱。常见就是相信有恒常不变的灵魂，会从一个生命体轮回到另一个生命体，这种常见的爱。2.对于色界、无色界生命的爱。3.对于禅那的爱。‘常见俱生的爱’很平常，是对自己的生命认为有一个不变的灵魂这种爱。无有爱，也翻译成‘非有爱’。非有爱是与断见俱生的爱，即不相信死后还有来生。有同学问：“无有怎么会爱呢？认为死后没有来生，怎么会爱呢？”这个人希望死后一了百了，他一生中干的那一堆坏事，以为死了就没事了。‘他希望死后就没事了’不就是一种爱么？这样就比较容易清楚地理解。持有断灭见的人容易干坏事，他认为这一生所干的坏事死了以后就没有了，他不相信有来生，他不怕有果报，他希望死了就好，所以他有无有爱。无有爱（非常坚固的断灭见）如果在临终时成熟，这样的生命会导致空间地狱再生。什么是空间地狱？就是当劫末，轮围界毁灭了，但他不在这个轮围界也不在那个轮围界，而是在这两个轮围界中间，轮围界毁灭时不会毁灭到他，他就无法从地狱里面再出生，所以他总是在空间地狱里来回地轮回。"],[41,271,353,1,"这样的一种生命再生是最苦的再生。2．何谓五取蕴是苦上堂课依着经文将苦谛快速地讲了一遍，在学习集谛之前先作复习。苦圣谛， 『生是苦，老是苦，死是苦，愁、悲、苦、忧、恼是苦，怨憎会是苦，爱别离是苦，所求不得是苦。简而言之：五取蕴是苦。』对于这个层面的苦，很多人认为：“那是一种苦，但是我们还是有快乐。”“生命当中苦乐参半，相对来讲快乐还是多于痛苦，不然就过得的没意思。”那么这个快乐到底是不是快乐呢？依着佛陀的教导就是没有快乐，因为五取蕴即苦。‘简而言之：五取蕴是苦。’亦即有生命的状态就是苦。"],[41,353,501,0,"你的快乐是怎么体现的？“我还蛮有快乐的”这个快乐是怎么体现的？快乐是倒腾出来的，快乐是苦渐渐消失时的那种感觉。当你久坐腿痛特难受时，一站起来就特有快乐，站久了你又觉得痛苦，然后再坐下又觉得有快乐；白天累了，晚上一躺床上就特有快乐，躺久了不舒服你又觉得痛苦。我们做任何事请都是这样；肚子特别饿是苦，吃第一口饭就快乐，吃多了撑着就痛苦。所以快乐是倒腾出来的，痛苦才是它的本质。3. 渴爱是苦的因为什么说爱是苦的因呢？从苦的这些层面来看，首先‘生是苦’，生是怎么来的？生，最根本的原因是有爱，就是对生命的不放弃，认为总是有一个生命在轮回，或者是对生命的无有爱，认为人死如灯灭，都表现为对一种生命状态的渴爱。这种渴爱，为了寻找快乐而对这个生命状态造下种种的业，这种业在临终时会成熟，成熟时就会导致再生。因此生是由过去的渴爱造下的业而导致的，即渴爱会导致再生，所以生是苦。生的苦是怎么来的呢？是因为渴爱而导致的再生。‘老是苦’，老为什么与渴爱相关呢？因为有生就有老、有生就有死，因为有渴爱就会有出生、就会有老死。"],[41,501,628,0,"你会发现，一生平平淡淡过日子的人，对五欲没有强烈执取、不折腾的人活得都比较久，看上去不容易老。越折腾的人越容易老，越折腾的人越容易死。为什么折腾？还是因为渴爱。渴爱什么？色爱、声爱、香爱、味爱、触爱（身体接触的爱）和心里想的各种法爱。睡不着就不停地想、失眠、焦虑，乃至于现在很多人觉得晚上睡觉是对生命的浪费，这么美好的生命，可以打游戏、可以有各种娱乐。折腾，很快就死了，所以死来得快也是因为渴爱。愁、悲、苦、忧、恼都如此，为什么愁？因为你有一个渴爱的期待总是得不到或者不满你意。有位同学说：“女儿不回来，碰到点问题，挺愁的。”对女儿能平安回来有渴爱，而女儿能不能回来与各种因缘有关。要去看各种因缘，在各种因缘上能不能做出智慧的努力，而不是生起这种渴爱、愁悲的苦。愁、悲、苦、忧、恼都是因为对某一种目标或某一类目标内心生起贪著、渴爱而得不到满足，或者不如你的意才会有愁悲苦忧恼。"],[41,628,703,0,"怨憎会也如此，不喜欢的人老碰到。求不得、爱别离，特别喜爱的人总是不能够长时间在一起。长时间在一起时又觉得不亲爱，因为边际效应是递减的，这些都是因为渴爱。‘简而言之：五取蕴是苦’，五取蕴又是因为渴爱而产生的，由于上一生临死前成熟的业导致你这一生的五取蕴出现，这也是渴爱造成的，所有苦产生的因都是因为渴爱。（二）以十组来解释爱欲1. 内六处、外六处渴爱分成多少种类呢？分三大类：欲爱、有爱、无有爱。爱如何生起，在何处生起呢？佛陀说："],[41,703,791,1,"『然而，诸比库，此爱于何处生起而生起，于何处建立而住立呢？凡世间有喜色、悦色者，其爱即于此处生起而生起，于此处建立而住立。』‘喜色、悦色’ ，不容易理解， 有同学把它翻译成：在这个世间，色尘是可爱的、可喜的。建立而住立应该翻译成建立和住立。在这个世间色尘是可爱的、可喜的，爱欲就在这里生起、建立、住立。在这个世间声尘是可爱的、可喜的，爱欲就在这里生起、 建立、住立。看到颜色，眼睛能看到的东西都属于色尘。在这个世间你认为色尘是可爱、可喜的，你的爱欲就会在这里生起然后在这里建立、持续并住立。同样地，声尘、香尘、味尘、触尘、法尘，如果你觉得它可爱、可喜，就会产生爱欲，爱欲就在这里生起、建立和住立。这些是外在的。"],[41,788,963,1,"上堂课先讲内六处，通常我们总是对自己的身体很执著，表现为对六根，眼、耳、鼻、舌、身、意有很强的执著，因为对六根有很强的执著，我们所有的爱就会在六根里面生起、建立、住立。我们依靠内在的会生起和建立起强烈的爱欲。外在的，即是色尘、声尘、香尘、味尘、触尘和法尘。自己体会一下，在这个世间里，我们眼睛能看到的色尘，怎么会觉得它是可爱、可喜的？从根本的角度来讲，那些你看到的、听到的、闻到的、尝到的、身体接触到的，心里面想到的，凡是对生存和物种繁衍能带来帮助的，你就应该产生快乐。产生了快乐，你就认为“这个快乐，对我的生存和物种繁衍有帮助，我应该去执取”。对你的生存和物种繁衍带来帮助的快乐是基于什么呢？是基于有情的物种。天人看到人类吃的食物，觉得像粪坑里的蛆在吃粪便一样，他们觉得不可思议“你们怎么吃这种东西？”同样地，我们看粪坑的蛆在吃粪、粪甲虫在吃粪，那是我们觉得很肮脏的东西，对于这些生命来讲就是它的可喜、可爱的味尘、香尘、触尘。而我们觉得可喜、可爱的味尘、香尘、触尘，对天人来讲是很可怕的不可喜、不可爱的味尘、香尘、触尘。"],[41,963,1043,0,"这与业相关，什么样的业导致什么样的生命结生。业是因为渴爱而造下，我们渴爱什么就会产生什么样的生命类，什么样的生命类就会对什么样的色、声、香、味、触在物种本生的角度上产生什么样的乐受。而这个乐受其实是果报评价机制。对于人类而言，什么是善果报、什么是不善果报，透过感受去评价。评价的目的就是对生存和物种繁衍有帮助。如果对生存和物种繁衍可能带来伤害的，就必须感到痛苦。感到痛苦之后，你就会把它标为不可喜、不可爱的色、声、香、味、触。因为有这样的果报评价体系，再加上无明和渴爱，因此，于色、声、香、味、触出现时，爱欲就会在这里生起、建立、住立。"],[41,1043,1163,1,"爱欲是内心的一种情结，世间而言，是一种情绪或一种感受。爱欲表现为一种贪，贪慢慢地会变成一种习惯，称为欲寻。我们习惯性地一看到某种食物就生起贪，比如有同学说：“一看到烤鸭，贪心就生起来。”贪心是什么？贪心就是欲爱。欲爱的生起是惯性。在未来的生命中，惯性的生起总是影响着我们的决策。欲爱变成一种力量是何时开始的呢？可以追溯到小时候，比如出生并不富裕，偶而吃上一顿烤鸭，觉得这是非常难得的美味，从那时候开始一点一点地建立。如果是含着金汤匙出生的人，就没有这么强烈的感受，“今天的烤鸭那么肥，挺油腻的。天天都吃烤鸭，能不能换个样子？”他心里生起的是这样一堆想法。他这个渴爱是怎么建立的呢？是从他含着金汤匙出生，天天被别人喂好吃的所形成。面对色、声、香、味、触，只要认为它是可喜、可爱的，我们的心就会对它做各种各样的情感建构，“这是好吃的、这是对我有帮助的、这是很有营养的”，构建一堆对这类色、声、香、味、触的认知。这就是‘爱欲就在这里生起、建立、住立’。"],[41,1163,1249,1,"生起和建立重复完以后，就变成很强有力的力量，这种力量在佛教里称为寻。你的心总是会朝向它、一碰到就去，就是欲寻。渴爱导向欲寻，就是住立。如果翻译成 『其爱即于此处生起而生起，于此处建立而住立。』就涉及对于爱欲的修行了，如同你看到渴爱在这里生起，然后你要在这里止住。我们尝试解释一下。有人问：“贪心生起来，我应该怎么办呢？”佛陀教导了很多方法。第一，心念处，如果你的心有足够强的力量时，当下马上看到“贪心生起来了”。贪心生起来，一眼看过去那是个贪心，它是不善心，会带来不善的结果。如果你心的力量足够强，看到它生起来很快就灭了。灭了就作意它是无常的、苦的、无我的，那种力量就会马上消失，就像大雨落下火被熄灭一样，马上就没了。"],[41,1249,1322,0,"如果你心的力量不够，看着它还在翻滚，“真的是很好吃，这个烤鸭多吃一点”，这就没有用了。还有几种方法，一种是马上去观察：“为什么我看到烤鸭会生起贪心？这种贪寻、欲寻，是从什么时候生起的呢？它真的是我喜欢的吗？如果喜欢的话，连续吃两只烤鸭、三只烤鸭，还会觉得好吃吗？”以一种思惟方式，找贪心生起来的因，然后看着这个因，它并不是恒常的，它是过去生起和建立过程中形成的一种惯性。再把见解去掉，“其实现在也不像小时候那么贫穷，想吃烤鸭随时都可以，没必要一看到烤鸭就流口水。”这是一种方法。"],[41,1322,1399,1,"还有一种更猛力一点，佛陀说，进食时应思惟：「不是为了嬉戏、不是为了骄慢、不是为了装饰、不是为了庄严，只是为了此身住立存像吃儿子的肉一样。“这烤鸭是我儿子的肉。”你可以这样思维。“烤鸭是烤鸭，我儿子是我儿子，这怎么会是我儿子的肉呢？”你这一生能吃它的肉，就说明你跟它有因缘。可能某一生，它就是你的儿子。去观察一下缘起，或许就是这样，不是你是它的儿子，就是它是你的儿子，你是在吃它的肉或在吃妈妈的肉，这是可能的。因为佛陀说，“我几乎看不到在这个世间里所有的众生没有互相做过父母、兄弟、姐妹。”佛陀以真实语告诉我们。所以这烤鸭可能就是你儿子，那你还有贪心吗？"],[41,1399,1448,0,"还可以食厌想，当你吃烤鸭时，想：“其实现在鸭子都是饲料喂续、为了停止伤害，为了资助梵行。」佛陀在《子肉经》中开示，就养的，里面有很多添加剂，对身体不大好。”然后吃到嘴里，牙齿嚼一嚼再吐出来，如果烤鸭很好吃，这咀嚼后吐出来的混合着自己口水的鸭肉，再吃进去试试？肯定不会再吃。你会觉得那很脏，怎么会脏呢？那都你的口水，你天天都含在嘴里怎么会脏呢？所以我们的身体是很肮脏的，食物吃下去到喉咙、肚子、胃肠，最后出来的都是粪便。如此思惟，贪心就会熄灭。"],[41,1448,1653,1,"所以贪心在当下生起就要看到它，在当下就要止住它而不要纵容它。起而生起，于此处建立而住立。这是尝试解释，实际的观修方法后面同样地，色、声、香、味、触、法，也应如此思惟。爱于此处生再讲。2. 识接着佛陀说： 『眼识于世间是可喜、可爱的；耳识于世间是可喜、可爱的；鼻识于世间是可喜、可爱的……。其爱即于此处生起而生起，于此处建立而住立。』眼识，当生起眼识时，果报心生起来，你能够看到爱在这里生起、建立、住立，这比较难，如果仅仅是眼识，你很难在概念的角度去体会它，因为眼识只是看。所以要能够系统地观照六门心路过程的究竟名法（眼识属于果报名法）。当你能够清楚地看到六门心路过程的究竟名法时，就能看到眼识里与贪相应的受（果报受）。3. 触有眼识就会有眼触（眼睛接触色尘），佛陀说：『眼触于世间是可喜、可爱的， 其爱即于此处生起而生起，于此处建立而住立。耳触、鼻触、舌触、身触、意触于世间是可喜、可爱的，其爱即于在此处生起而生起，于此处建立而住立。』无论是眼触、耳触、鼻触、舌触、身触、意触，只要所触是可喜、可爱的，渴爱就会在此处生起，在此处建立而住立。"],[41,1563,1809,1,"4. 受『眼触生受于世间是可喜、可爱的，耳触生受、鼻触生受、舌触生受、身触生受、意触生受于世间是可喜、可爱的，其爱即于此处生起而生起，于此处建立而住立。』如何理解眼触生受呢？当观察眼门心路过程时，会看到每一个心识刹那里都有受，眼门心路过程从五门转向心、眼识、领受心、推度心、确定心、每一个速行心，每一个彼所缘心当中都有受，这些受都被称为眼触生受，不仅仅是眼识里的受。因为是眼睛接触色所缘而导致后面这一系列的心生起。对于其他根门或意门中的触生受也应同理类推。强烈的爱欲都依靠这些受而生起，因为‘受缘爱’。如前所述感受是果报评价体系，凡是对生存和物种繁衍有帮助的，你就会有快乐，有快乐就会想再要、想抓取、想重复，而且不断地希望从中获取更多的快乐。为什么要获得更多的快乐呢？因为所有的快乐边际效益都递减。虽然边际效益递减的事实被你忽略，但是内心深处是知道的。所以心总是不断地想寻求更多或这种快乐里有没有更快乐的内涵。比如， “普洱茶是不是三十年的？”“这个米饭是不是有机的？”“苹果是不是生态的？”会不断去寻找各种“我们会觉得更快乐”的内涵，所以受是爱生起的基地或根本因素。"],[41,1809,1976,1,"5. 想从触到受到生起爱，心都会做标记，对产生快乐或产生贪爱的所缘做标记。标记是想心所完成的，是想蕴。所以佛陀说：『色想于世间是可喜、可爱的；声想、香想、味想、触想、法想于世界是可喜、可爱的，其爱即于此处生起而生起，于此处建立而住立。』在学习想心所时讲到想颠倒、心颠倒和见颠倒。如果在面对色、声、香、味、触时所产生的想与智慧不相应，这样的标记就是一个颠倒或扭曲的标记。由于扭曲的标记，于未来再面对类似目标时，你所调出的认知标准就是错的，就是想颠倒。‘于此处建立而住立’，当面对色、声、香、味、触所缘已对其做完标记时，是不是能检视一下自己：“这是跟智慧相应的吗？”“烤鸭是很好吃的，这是跟智慧相应的吗？”“我女儿不能顺利回来，我就应该很忧伤，这是跟智慧相应的吗？”这就是想。如果你认为“就是应该这么想啊！”回去就会哭，就会很难受、很焦虑，不知所措。如果觉得烤鸭好吃，你就会想“什么时候还有烤鸭？”想去抓取。然后每天受戒、禅修的功德都回向成烤鸭，功德都变成烤鸭了，涅槃资粮成烤鸭了。"],[41,1976,2044,0,"什么是与智慧不相应的呢？当色、声、香、味、触呈现于面前时，生起常、乐、我、净的认知，就可能是颠倒想。“烤鸭是会带来快乐的”，给你吃两只，你就会吐。烤鸭没有什么快乐，它就是你过去那个标记，对你的生存有一点帮助，仅此而已。它可能过去生是你的儿子，你想想挺悲哀的，活着真没意思，赶紧修行，解脱为要，不要再伤害自己、伤害别人，就可能是有慧想。6. 思建立了烤鸭的颠倒想后，一见到“烤鸭”，你就会对烤鸭采取贪的行动：“多夹几块儿，蘸点甜面酱，再来点葱，吃起来真的味道很好。"],[41,2044,2224,1,"”组织采取行动的心理素质，是思心所。思心所召集其他心所对目标采取行动。『色思于世间是可喜、可爱的，其爱即于此处生起而生起，于此处建立而住立。』觉得吃烤鸭是很快乐的，吃烤鸭这个行为、行动是很快乐的，就会建立起吃烤鸭的习惯，“吃烤鸭应该怎么吃，要加什么东西，要包起来吃等很多吃法”，这就是思的范畴。组织协调怎么吃烤鸭，并付诸行动。‘渴爱于此处生起而生起，于此处建立而住立’，在进食时应思惟：是为了此身住立存续、为了资助梵行，仅是起这个作用，而不是为其他，就会止住。思的作用是组织，本身是造作，令其他所有心所与它配合，也与识相伴而生。识、触、受、想、思，在经典中合称为“触五法”（触为第五的五种名法）。比如贪心所，看到烤鸭，生起贪心，是无行的（未受人怂恿），十九个名法，佛陀一般说“触为第五”，除了触、受、想、识以外，其他名法都归为思心所，就是行法。在经典里，佛陀讲心所就是这五大类，而阿毗达摩，则把思心所里所有内容再展开。如果我们能够完整地看到这些名法，就能知道触、受、想、思、识是怎么生起的，是基于什么因生起的，在当下刹那就灭掉。"],[41,2224,2391,1,"灭掉是不是就能止住呢？灭掉不一定能止住。如果生起渴爱，灭掉就不能止住，渴爱会以亲依止缘、无间缘、等无间缘的缘力不断地传流下来。7. 爱美好的。这种思与贪相应，贪是一种爱，如果贪是悦俱的，你会觉得贪是『色爱于世间是可喜、可爱的，声爱于世间是可喜、可爱的，香爱于世间是可喜、可爱的，味爱于世间是可喜、可爱的，触爱于世间是可喜、可爱的，法爱于世间是可喜、可爱的，其爱即于此处生起而生起，于此处建立而住立。』爱生起、建立，就会变成一种力量。这种欲爱的力量在未来的生命流里存留下来。当你得不到时（求不得），求而不得愁、悲、苦、忧、恼，苦就会产生。为什么欲爱是苦的因呢？因为欲爱是建立在本身无常、苦、无我、不净的这些目标上，但是你内心又希望是常、乐、我、净的，想法与目标的真实存在状态不一致，一定会苦，所以苦总是因为渴爱而生起。如果不懂得止住时，即‘诸苦再再生’。8. 寻接着佛陀说： 『色寻于世间是可喜、可爱的，声寻于世间是可喜、可爱的，香寻于世间是可喜、可爱的，味寻于世间是可喜、可爱的，触寻于世间是可喜、可爱的，法寻于世间是可喜、可爱的，其爱即于此处生起而生起，于此处建立而住立。』"],[41,2391,2565,0,"寻就是寻心所，如前所述触、受、想、思、贪爱，已经变成一种习惯，即是寻、欲寻。习惯性地对这样的目标产生渴爱，习惯性地对色、香、味、触、法生起渴爱，就是寻。寻总是朝向这样的目标，渴爱就在这里生起。佛陀有教导《寻止息经》，如果你想要断除寻，应学习《寻止息经》。9. 伺接下来是伺，对于一般世间人而言，寻与伺总是同时生起，寻是朝向目标、碰触目标、寻找目标；伺是持续地对这个目标重复地观察、揣摩、思惟（即找到目标后待在里面不出来）。如果对某一目标有寻，就会有伺。寻是接触它、喜欢它，伺是停靠在上面，不离开。因为停在上面不离开，就会造很强的业，未来就会产生果报。而且不仅产生果报，这种寻与伺的力量会在名色流里持续地存在，它以自然亲依止缘缘力的形式缘助你下一次碰到相应目标时，“歘”就去了，抓住它，牢牢地摁在那个地方。很多同学说：“情绪一上来，就钻进去，出不来。”这是寻、伺的力量绕在里面不出来。歇斯底里的人就是这样，不是欲寻而是瞋寻，歇斯底里到开始打骂人，是从瞋寻发展到害寻。被这种力量控制，然后不断地发展，就变成这种形式，背后其实都是渴爱。"],[41,2565,2673,1,"到此，我们明白了为什么说渴爱是苦的原因。佛陀说：『诸比库，这称为苦集圣谛。』如果我们面对色、声、香、味、触、法时，对它产生接触、识别、感受，进一步对它采取行动，产生渴爱的习惯，然后产生渴爱的寻的力量，苦就会不断地在未来产生。老、病、死、愁、悲、苦、忧、恼、求不得、怨憎会、爱别离，所有的苦都会在未来产生。（三）五种苦因佛陀说，爱欲是根本，导致苦产生的因有五大类。第一、爱欲；第二、十种烦恼；第三、一切不善法；第四、三善根；第五、一切能在轮回中产生果报的善法。"],[41,2673,2756,0,"善法也会造成苦，这是为什么呢？今生对五蕴的爱欲并不是造成这一生五蕴生起的因，这一生生起的因是过去的爱欲。《注疏》里说：“他如实地了知造成苦生起的过去因。”这一生的五蕴是过去的因生起的，过去因能造成今生的苦——即五蕴（五蕴就是苦）。如果想了解这一生五蕴生起的因，就必须追溯到上一生，观察到上一生临死前成熟的业，看到这个业的五种因造下的无明、爱、取、行、业，这五种过去因与这一生五蕴的因果关系能够一一对应。如果能够如此观照，就可以说你已部分地了知苦谛与集谛的关系。"],[41,2756,2873,0,"帕奥西亚多依据巴利圣典《谛分别》来解释集谛。《谛分别》中提到五种集谛（五种苦因），其中包括三善根以及一切能在轮回中产生果报的善法。为什么善法也是集谛呢？因为这些善法与不善法只在被无明、爱、取围绕和支助时才能在生死轮回中产生果报。这些善法之中也包括禅那善法以及与观智相应的善法。在一个人临死时，如果没有更强的业力生起，则与观智相应的善法也能造成下一生的投生。佛陀在《发趣论》（Paṭṭhāna）中说：行捨智也能产生结生心。为什么呢？因为禅修者在观照行法为无常、苦、无我而达到行捨智时死亡，由于那时没有更强的业力生起，所以行捨智就产生来世的结生心。这种行捨智也是集谛中的一种（集谛里的内容），当然还必须有无明、爱、取这三种烦恼以潜伏性或生起于当时心中的形式存在，作为其业力产生果报的助缘，才能产生结生。"],[41,2873,3038,0,"人类是善果报结生，我们上一生临死前成熟的业都是善业，是善法，善法也会导致五蕴，善法产生这一生的生命也是挺苦的。只要有五蕴存在就是苦，除非是阿拉汉道智产生的力量，才会把所有的烦恼都斩除。因此，在阿拉汉死亡时，由于没有烦恼的滋润，他所有过去的一切业都变成无效业（无效业不能导致再生），只有这样的业才不会导致生苦的生起，其他所有会导致再生的善法，也都是轮回的因。前面提到行捨智也会导致结生，那么结生以后会产生什么情况呢？佛陀在《增支部•四法集》的《闻随行经》中解释行捨智结生的有四类人。这部经的背景是因为有五百位很高贵的婆罗门种姓出身的年轻人出家作为比库，他们的智慧非常地锐利，听闻佛陀教法后，能非常容易地了解、通达佛陀的教法，因此他们对佛陀与法经常容易生起不恭敬的心，因此佛陀为他们开示《闻随行经》。经典中讲到：如果比库背诵佛陀的教法之后，能够如法修行止禅和观禅，然后在他到达行捨智的阶段死亡，来生他会投生到天界，并且有可能得到四种结果之一："],[41,3038,3106,0,"1.由于他今生临死速行心的目标是行法的无常、苦、无我本质，他来世投生天界的结生心与有分心也会缘取同样的目标。由于天界是化生的，以及他的有分心了知行法的本质，所以他生为天人时，可以继续立刻清楚地观照到行法的无常、苦、无我。如果他经常这样去思惟，可能快速地证悟涅槃。这是第一种人。2.也许他投生天界之后不能立即思惟行法的本质，但是当他听闻有神通到天界去弘法的比库讲四圣谛时，就能立即回忆起前一生所修的法，因而清楚地观照到行法的本质而迅速地证悟涅槃。这是第二种人。"],[41,3106,3160,0,"3.也许没有机会听闻比库说法，但是当他听闻说法天神（比如常童形梵天、娑婆世界主梵天）讲四圣谛法时，就能回忆起观照行法的本质，因而快速地证悟涅槃。这是第三种人。4.或许他没有机会听闻比库或说法天神说法，但是他很可能遇见过去生一起修行而比他先投生到天界的同伴。这些天神会提醒他说：“朋友，你要回忆起我们过去生在人间做比库时所修行的佛法。”那时他立刻就能够回忆起来，并且观照诸行法无常、苦、无我的本质，迅速地证悟涅槃。这是第四种人。"],[41,3160,3299,1,"从这部经中我们可以知道，行捨智也能造成来世的结生。如果修行观禅到达行捨智的阶段，就有可能得到未来世的这些善果。以上是集谛的部分。二、苦灭圣谛（一）依十二处解释爱欲的灭除接着佛陀开示灭谛。佛陀说：『诸比库，何谓苦灭圣谛？即是那种爱的无余离、灭、捨弃、捨离、解脱、无执著。然而，诸比库，此爱于何处捨断而捨断、于何处灭除而灭除呢？凡世间有可喜、可爱者，其爱即于此处捨断而捨断，于此处灭除而灭除。』前面提到的所有可喜、可爱的色、声、香、味、触、法，爱就应该在这个地方捨断，就应该在这个地方灭除。"],[41,3299,3378,1,"经文中谈到的六内处与六外处合称为十二处。简单地说，十二处就是五蕴或究竟名色法，爱欲生起时总是取这十二处为目标而生起的。但是在讲到究竟的四圣谛本身，当爱欲被灭除时，分两种情况来讲。日常的四圣谛应用和究竟法层次的四圣谛。《大念处经》中四圣谛的灭，着重讲能够彻底灭除爱欲的是阿拉汉的道智。阿拉汉道智取涅槃为目标，而不是取十二处、五蕴或者究竟名色法。然而由于爱欲生起时是依十二处而生起，因此在解释爱欲的灭除时，佛陀也是依着十二处来作解释。"],[41,3378,3530,0,"举个譬喻来说，稻田里长出一种葫芦状的蔓生植物, 农夫把那棵蔓生植物连根拔掉，因此蔓生植物与它的果实就会在那个地方干枯死亡。这时我们也可以说蔓生植物与它的果实在稻田里被灭除了。同样的道理，十二处好比是稻田；爱欲好比是蔓生植物，当爱欲生起时，它依靠十二处而生起；当爱欲被阿拉汉道智灭除时，我们也可以说在十二处里的爱欲已被完全灭除了。所以佛陀说：『眼于世间是可喜、可爱的，其爱即于此处捨断而捨断，于此处灭除而灭除。』在《注疏》里对于捨断而捨断、灭除而灭除，是指道智。（二）于日常生活中训练彼分断、镇伏断一个还没生起道智的人，对于内六处和外六处觉得是可喜、可爱时，是否要在这个地方捨断而捨断、灭除而灭除呢？我们知道，面对烦恼有三种断：彼分断、镇伏断和正断断。彼分断是通过戒、正念正知、如理作意，让烦恼在一段一段时间不生起；镇伏断是当有持续的定力或有很强的观智时，烦恼会被定力和观智所镇伏，不会生起；正断断是用道智来断除。《大念处经》是从四圣谛的终极角度上来讲，‘此处捨断而捨断，此处灭除而灭除’是指道智生起的状态，乃至于是阿拉汉道智生起的状态。"],[41,3530,3649,0,"对于修学《大念处经》，我们应于一切时处，即当面对眼根、耳根、鼻根、舌根、身根、意根觉得它是可爱、可喜，产生渴爱时，就要懂得在这个地方如何捨断而捨断，灭除而灭除。那怎么做呢？比如你持守八戒，原则上就不应该照镜子，如果守八戒了却照着镜子说：“我的眼睛长得挺漂亮的、鼻子长得很正直、牙齿长得很洁白。”这个八戒就持得不是很清静。为什么呢？因为你对你的眼根、耳根、鼻根、舌根产生了渴爱，用这种方式来滋长对自己内六根的渴爱。乃至于经常想：“我思惟佛法是如此地敏捷，我的慧根是如此地强”，经常这样想也容易出问题。所以要在此处捨断而捨断、灭除而灭除。通过持戒、正念正知、如理作意，面对自己的内六根以及外六尘（色、声、香、味、触、法）时能够彼分断，能够镇伏断，作为一个还没有生起道智的人在日常生活中应如此训练，否则就会导致当下生起苦，未来生起苦，在临死时导致不好的结生。"],[41,3649,3794,1,"（三）八支正道为了通达四圣谛而行道的禅修者，要明白以涅槃为所缘而能断绝无明之根的慧眼是正见。正见，正确的见解是它的特相。看到十八界能很清晰地知道，是正见的作用。能够破除无明黑暗，是正见的现起。具有上述正确见的禅修者，与正见相应而破除邪思惟的心，决定以涅槃为正思惟。在此，正确的（正心的）决定是它的特相；令心安止是它的作用；断除邪思惟是它的现状。如果拥有了上述的见和思惟就与正见、正思惟相应而断绝语的恶行，远离邪语。和合语是它的特相；离邪语是它的作用；捨断邪语是它的现起。"],[41,3794,3877,1,"如果有离邪语的禅修者，与正语相应就能正断邪业而离杀生等为正业。正业是离杀生的。离杀生等是它的特相；离邪业是它的作用；捨断邪业是它的现起。作为禅修者，由于他正语、正业的清净与他正语、正业相应而断除诡诈，离于邪命称为正命。正命，洁白是它的特相；维持正当的生活是它的作用；捨断邪命是它的现起。对于住立于被称为正语、正业、正命戒地的修行者来讲，随顺于正语、正业、正命，与正语、正业、正命相应而正断懈怠的勤精进被称为正精进。正精进，策励是它的特相；没有生起的不善而令不生起是它的作用；捨断邪精进是它的现起。"],[41,3877,4042,1,"如果这样的一位精进者，与正精进相应而除去邪念（因为正精进能除去邪念），心能不忘失就是正念。正念，注意是它的特相；不忘失是它的作用；捨断邪念是它的现起。以无上的念而守护他的心，就能与正念相应。除灭邪定的心一境性是正定。正定，不散乱是它的特相；等持是它的作用；捨断邪定是它的现起。也就是说，当一个人道智生起时，他当下的道智是与八支正道相应的。八支正道：正见、正思惟、正语、正业、正命、正精进、正念、正定，是有次第作用、是相关联的。当初果道智生起，基本上就能住立于基本正确的认知行为模式（以世间语来说）。佛法真正地改变我们什么？就是改变我们的认知行为模式。当我们的认知行为模式与阿拉汉道智相应时，那就是完全正确的、没有瑕疵的认知行为模式。对于一个无闻凡夫来讲，是与渴爱相应，与愁、悲、苦、忧、恼相应，这样的认知行为模式就是与邪见、邪思惟、邪语、邪业、邪命、邪精进、邪念、邪定相应的错误认知行为模式。为什么我们总是坚持错误的认知行为模式？是因为有根植于内心深处的无明和渴爱。经典里说：不伤深固根，虽伐树还生。"],[41,4042,4154,1,"树根没有砍掉，只是把长出地面的树干砍了，树还会长出来。爱随眠不断，苦生亦复尔。由于集之灭而灭苦，所以世尊说：苦灭而是以集灭。要想灭苦必须把无明、渴爱灭除。灭除渴爱，『什么是世间可喜、可爱呢？眼于世间是可喜、可爱的，其爱即于此处捨断而捨断，于此处灭除而灭除。』耳、鼻、舌、身、意也同样如此。这是内六处。外六处， 『色于世间是可喜、可爱的，其爱即于此处捨断而捨断，于在此处灭除而灭除。』声、香、味、触、法也同样如此。『眼识于世间、耳识于世间、鼻识于世间、舌识于世间、身识于世间、意识于世间是可喜、可爱的，其爱即于此处捨断而捨断，于此处灭除而灭除。』在看、听、嗅、尝、触每一个当下，对自己观察，是不是对自己的眼、耳、鼻、身、意产生渴爱了？有建立这个吗？有建立这个，我们应怎么思惟？怎么在当下能够彼分断除它？怎么通过修习止禅和观禅镇伏它？能够彼分捨断它，能够彼分镇伏它，这是我们日常要修行的。"],[41,4154,4273,0,"同样地，对于触也应如此观察，『眼触于世间、耳触于世间、鼻触于世间、舌触于世间、身触于世间、意触于世间是可喜、可爱的，其爱即于此处捨断而捨断，于此处灭除而灭除。』我们在日常生活中应该怎么做呢？对于眼触，要守护根门。若不守护根门，就会不断地寻求眼、耳、鼻、舌、身的触；若守护跟门，这些依这样的色、声、香、味、触而生起的爱就不会生起。对于眼触生受，你已经接触了，有接触就会产生感受。对于感受这个层面怎么去捨断而捨断、灭除而灭除呢？在学习捨心所时讲到六支捨，对于眼、耳、鼻、舌、身、意接触的色、声、香、味、触、法能够有一个中捨的态度，在睁眼四圣谛时就要去思考。对于想， 『色想于世间、声想于世间、香想于世间、味想于世间、触想于世间、法想于世间是可喜、可爱的，其爱即于此处捨断而捨断，于此处灭除而灭除。』在看到、听到、闻到、尝到、身体接触到、心里想到，这样的一个标记，你确定下来“这个事情是这样的”，你马上要去观察它“这样的一个定位是正确的吗？”比如说某某人他总是这个样子，“总是这个样子”就是常见，你给他贴了一个标记“这个人就是这个样子”，这是有慧想吗？"],[41,4271,4379,1,"不是有慧想。那么这个人在这种情况下会表现出这种状态，是因缘所生法，有因有缘的，不能给他贴标签。下次再接触时怎样能够不生起这个状态？可能有办法，也可能只能规避，但是你不会给他贴标签。贴标签就会生起渴爱或排斥。如果没有了这样错误的标记，后面再面对这样的人事物时，就不会导向错误的判断、错误的行持。阿拉汉道智彻底地灭除爱欲时，不只是在十二处的爱欲被灭除，在识、触、受、想、思、爱、寻、伺的爱欲也同样都被灭除。所以佛陀继续说：爱欲一旦生起之后，就会一再地生起。因此人们一旦开始爱自己的父母、儿女、伴侣，那么他对这些人的爱就会一再地生起。由于有前面的爱欲，所以后面的爱欲就会接二连三地生起，因此当爱欲被灭除时，佛陀说，依着目标要在相应的目标上去思惟，去考虑，去彼分地灭除、镇伏地灭除、正断地灭除。"],[41,4379,4478,1,"佛陀在此解释了色爱、声爱、香爱、味爱、触爱和法爱的灭除方法。对于后面的思、爱、寻、伺，如何去思惟、如何去捨断、如何去灭除呢，下堂课再学习。回向功德！"],[42,0,217,0,"195讲-摄集-摄菩提分-法念处-四圣谛 3古源尊者前两堂课学习<三十七道品>法念处中四圣谛的部分——苦圣谛、苦集圣谛、苦灭圣谛，我们需要不断地把‘苦集灭道’四个方面的内容串起来。一、苦集圣谛佛陀说： 『什么是苦？生是苦，老是苦，死是苦（老、病、死是苦） ，愁、悲、苦、忧、恼是苦，怨憎会、爱别离、求不得是苦，简而言之：五取蕴就是苦。』其实对于五蕴界的生命而言， 所有的存在状态及有情根门所及之处，都是苦谛的范畴。苦谛，这样的一种被称为苦的五蕴是如何生起的，就称为苦集圣谛。佛陀在教导苦集圣谛时，分别用十组来解释爱欲。苦之集，根本是无明和渴爱。"],[42,217,396,1,"导致渴爱生起的因，佛陀分为十组来解释：六根（眼、耳、鼻、舌、身、意），六尘（色、声、香、味、触、法） ，合称为十二处。六根面对六尘（色、声、香、味、触、法）而生起的六识、六触、六种受、六种想、六种思、六种爱、六种寻、六种伺，都分别会导致爱欲生起。在日常生活中，当我们体验到苦的时候，就要去观察这个苦是从什么地方生起的，可以依佛陀教导的这十组分别地去观察苦的因，亦即渴爱在什么地方生起而导致苦的生起。二、苦灭圣谛导至苦之灭，佛陀同样以这十组来解释，在什么地方生起的苦之因，你想要灭苦，就需要在这个因上把苦灭掉。佛陀说：爱欲的完全消逝无余、捨离和弃除，从爱欲解脱不执著，这被称为苦之灭。不执著就是要从爱欲里面解脱。如何捨去爱欲呢？同样有这十组：世间有可爱、可喜的眼根、耳根、鼻根、舌根、身根、意根，即内六处（眼、耳、鼻、舌、身、意）；外六处（色、声、香、味、触、法） ；以及六根面对六尘而生起的六识（眼识、耳识、鼻识、舌识、身识、意识） ；六种触、六种受、六种想、六种思、六种爱、六种寻、六种伺。要让苦灭掉，就要在这十组相应的地方灭除渴爱，才能够把苦灭除。"],[42,396,490,1,"当然，到了阿拉汉道智生起时，他完全地灭除一切的爱欲时，不必分十二处、十八界。佛陀展开解释这十组爱欲的灭除，是为了让我们能够了解，在日常观察中有哪些地方可以被我们看到：渴爱于何处发生， 在什么地方建立、建构对相应的五蕴执取， 导致苦一再地生起。要让苦灭掉，就要在相应的因上去下手。三、道圣谛（一）八圣道分是通向涅槃唯一之路灭除渴爱的方法是八支圣道。佛陀说：『诸比库，何谓导至苦灭之道圣谛？那就是八圣道分，即正见、正思惟、正语、正业、正命、正精进、正念、正定。"],[42,490,567,0,"诸比库，什么是正见呢？诸比库，正见就是了知苦的智慧、了知苦集的智慧，了知苦灭的智慧、了知导至苦灭之道的智慧。诸比库，这被称为正见。』所谓正见，是指四圣谛的正见。如果想要证悟涅槃，我们必须修习八圣道分，因为它是通向涅槃的唯一道路，没有第二条。1. 正见八圣道分的第一项是正见，在本经中佛陀解释四种正见，它们是想要证悟涅槃者必须具备的。第一种正见是“了知苦的智慧” 。什么是苦呢？佛陀开示说： 『简而言之，五取蕴就是苦。』即你有这个身体就是苦。所以佛法最伟大的地方就在于教导超越五蕴，超越我们的生命。不超越五蕴就不可能解脱苦，只要有生命存在就是苦。"],[42,567,716,1,"什么是五取蕴呢？即：色取蕴、受取蕴、想取蕴、行取蕴、识取蕴。五取蕴可以展开为十一种五蕴或十一种究竟名色法， 即： 过去的、现在的、未来的、内在的、外在的、粗的、细的、低劣的、优胜的、近的、远的。如果能以观智清楚地照见这十一种五取蕴，就具备了第一种正见——苦正见，了知苦的智慧。为什么说了知苦算是一种智慧呢？因为如果不能够看到这十一种究竟名色法时，我们就会认为有男人、有女人、有先生、有太太、有孩子、有情人、有车、有房、有金钱。在没有破除名色的密集之前，觉得它是真实的、会给我们带来快乐的，当这样执取时苦就会产生。如果能够看到这十一种五取蕴时，就会看到其实我们认为所谓的男人、女人、车子、房子等只是一堆名色的组成，都在刹那地生灭。都不要说见到究竟色法，很多修习三十二身分的同学都知道，能真正地见到三十二身分时已削弱了爱欲。有同学报告说：“看到三十二身分真的是很可厌。虽然它跟解剖的东西不一样，每一个身分都是丰满的、有命根的，是饱满的一种状态，但是它真的很可厌，就是那一堆东西组成。”如果三十二身分训练成熟，目及之处，眼睛看过去一切的地方全都是三十二身分。"],[42,716,821,0,"当如此观察时，他的爱欲就大幅度地削弱。曾经在法住禅林跟大家分享《止观修学的误区》 ，其中一个误区就是见到名色不等于证得名色分别智。很多人问：“这话到底是什么意思？”你见到名色，能对这色法所组合起来的密集有洞察，不会对这个由色法或名色所组合起来的密集再生起贪著。如果你上座时看到那一堆名色只是名色，下座时对它依然贪爱，那么你这个名色分别智就很有问题。名色分别智应于一切时处，当上座时能观察到自己的名色，下座时也是看一切时处都是名色， 这是名色分别智的基础条件。什么是观，什么是智呢？需特别强调一下，你能看到名色，同时要生起智慧， 知道这是苦，这些所有名色都是苦的， 都是刹那生灭的，不是恒常的，不是能够被我们控制的，它是苦迫的。内心要真实地生起这样一种觉受，那么他这种对五蕴的执取就会被削弱，这是必须去体验的。这是第一种正见——了知苦的智慧。"],[42,821,901,1,"第二种正见是“了知苦因的智慧”，亦即了知缘起的智慧。什么是苦因？简单地说，苦因即是无明、爱、取、行、业，因为它们会产生苦（五取蕴） 。从大的角度来看，我们这一生的生命（五取蕴）在母亲子宫里那个受精卵上产生的第一个结生名色（最初的五取蕴） ，是由于上一生临死前所成熟的业。那个业是由于更早的无明、爱、取所驱使而造下，业造作完以后，虽然事件已经结束，但它留下了业力、 留下了影响力，在临终时成熟，导致我们这一生的五蕴生起。所以苦的因就是无明、爱、取、行、业。"],[42,901,1015,0,"同样地，在生命期间产生的那些不好的果报，今天有位尊者说他的姐姐得了很严重的癌症，子宫癌加胃癌。如果她自己能观照，就能够很准确地观察到；如果别人的观智很娴熟，或许能看到一部分。她这种病痛是有因的，这个因如果是由于过去的不善业在她身上成熟，该不善业有它的无明、爱、取驱使。过去的一个伤害的业、瞋害的业，导致这一生癌细胞的产生。癌细胞一般都是不善的业生色法，这个业导致不良的业生色法生起，同时也可能导致她不良的情绪发生，这不良的情绪发生又会导致不良的心生色法产生，而这心生色法就会围绕着不良的业生色法包裹在一起，一团一团的，最后变成一个很大的肿瘤。如果她有足够的定力修缘起，就可能观察到这个业是由于过去一个什么样的业成熟，而过去的那个业是依什么样的无明、爱、取而去造这样的业就可以被观察到。"],[42,1015,1109,1,"佛陀在《谛相应》中说： 『如果不了知四圣谛，就不能证悟涅槃，不能解脱生死轮回。』如果想要证悟涅槃，就必须了知四圣谛中的苦谛和集谛。有些人说：“苦谛是可以观察的，集谛看不到，只能去推导。”这个观点很值得商榷。所以必须观照前一生的无明、爱、取、行、业如何造成今生的五取蕴，接着观照今生的无明、爱、取、行、业如何造成未来生的五取蕴，然后再往更早的过去生观照，观照过去第一生、第二生、第三生、第四生、第五生等等如何造成新的一生的五取蕴。同时可以观照在日常生活中所遇到的一切善与不善的果报，果报都是业成熟。如果你的定力够，可以追到过去的无明、爱、取、行、业，那个行是一个业，导致你当下善报的生起。应当如此逐一地观照，在你生死轮回的开始、结束以及生命期间的各种明显的因果关系。"],[42,1109,1180,0,"苦谛法与集谛法又称为行法，都是观禅的目标，因此在修行观禅之前我们必须先观照到它们，能看到它们。如此观照之后我们才能够观照这些行法不断生灭的本质为无常、 观照它们不断受到生灭逼迫为苦、观照它们没有永恒不变灭的实质为无我，如此观照行法的无常、苦、无我的本质称为观禅。名色分别智与缘摄受智，其实是观禅的预备阶段，还不能称为真正意义上的观禅。当修习观禅到观智成熟时才会证悟涅槃，真正地体证灭谛。这是第二种正见，苦集圣谛的正见。"],[42,1180,1347,1,"第三种正见是“了知苦灭的智慧”。苦灭有两种：一种是坏灭，另一种是究竟灭。坏灭包括因缘灭和刹那灭。什么是因缘灭？由于过去五种因完全灭尽，阿拉汉般涅槃之后五蕴完全灭尽不再生起，这是因缘灭。每一种行法都有生、住、灭三个小刹那，生、住、灭的灭称为刹那灭。当修行观禅时，能够照见因缘灭和刹那灭是很重要的。有人说： “我修观禅的时候还没有证悟阿拉汉，那么我怎么看到因缘灭呢？”也就是说在修缘起（缘摄受智）时，你必须照见你未来证得阿拉汉般涅槃之后，所有的名色不再生起，所有的因缘完全灭尽，这是可以被观察到的。不是体证，但是可以观察到。当你修行观智成熟时，道智和果智就会以涅槃为目标而生起。涅槃就是苦因和苦果的究竟灭，完全地证入涅槃就是苦因和苦果的究竟灭。这是苦灭圣谛。第四种正见是“了知导至苦灭之道的智慧” 。导至苦灭之道有两种：一种是世间圣道，另一种是出世间圣道。一般论师都认为世间圣道是指在修行观禅的时候。比如你修行观禅，有时必须照见观智本身也是无常、苦、无我，也称为后心看前心。如此观察时，你能看到观禅本身也是无常、苦、无我的。"],[42,1342,1417,1,"在一般的观智以及对观智进行反观的智慧称之为世间圣道。在观智的心识刹那中包含五种圣道分：1.正见；2.正思惟；3.正精进；4.正念；5.正定。为什么正语、正业、正命不包含在内？因为正语、正业、正命同时生起，只有在道智或果智才有，世间的观智只会生起正见、正思惟、正精进、正念和正定。⑴正见：了知苦谛法（五取蕴）和集谛法（五种因）无常、苦、无我三相的智慧。世间圣道分。⑵正思惟：将心投入苦谛法和集谛法的三相，即无常、苦、无我的三相。"],[42,1417,1562,1,"⑶正精进：为了要了知苦谛法和集谛法三相而作的努力。⑷正念：对苦谛法和集谛法的三相忆念不忘。⑸正定：专注于苦谛法和集谛法的三相。也就是说，当禅修者在修习观智时，必须在行、住、坐、卧的一切时处都能够让世间的圣道分生起，随时随地都能够观察到苦谛法和集谛法的无常、苦、无我，具备正见、正思惟、正精进、正念、正定这五项世间的圣道，且必须观照它们本身也是无常、苦、无我。了悟涅槃的智慧就是了知灭谛的正见， 即此智慧是以涅槃为所缘而生起的。正见与其他六项圣道分或七项圣道分同时生起。因此包括正见在内，总共是七项或八项圣道分。为什么有八圣道分与七圣道分的差别？如果有人在观照欲界法或初禅名法为无常、苦、无我时证悟涅槃，那时他的道智和果智里具足八圣道分。如果有人在观照第二禅或更高的禅那名法为无常、苦、无我时证悟涅槃，那时他就只有七圣道分，因为没有正思惟 （即寻心所） 这一项。由于他所观照的目标 （第二禅或更高禅那的名法）里没有正思惟（即寻心所） ，所以他的观智里就没有正思惟这一项。了知这些圣道分的观智就是了知道谛的正见。"],[42,1559,1692,1,"以上是四种正见。2. 正思惟什么是正思惟？在以上佛陀的教导中，我们知道单靠正见并不足以证悟涅槃，还必须具备其他的圣道分，因此佛陀开示说：『诸比库，什么是正思惟？出离思惟、无瞋思惟、无害思惟，诸比库，这被称为正思惟。』之前学习受念处时讲到五种出离，即：第一、出家；第二、初禅；第三、涅槃；第四、观智；第五、一切善法。一切善法里都有出离，为什么呢？因为一切善法里都有无瞋、无贪，与五种出离相应的寻心所被称为出离思惟。在这里特别需要提示的是：在修习止禅到达禅那时，把心投入禅相的正思惟，也被称为正定的出离思惟。在修习观禅时，无论是观照究竟名色法、五取蕴、五取蕴的因或行法的三相，把心投入这些目标的正思惟是观禅的出离思惟。这些都被称为世间的出离思惟。五种出离除了涅槃之外都是世间的出离思惟。当我们证悟涅槃时，把心投入涅槃的正思惟就是出世间的出离思惟。"],[42,1692,1818,0,"第二种正思惟是无瞋思惟。当我们于日常时修习慈，特别是修习慈心禅到达禅那时，无瞋思惟就与禅那同时存在，这是上等的无瞋思惟。当我们有观智时，观照慈心禅那名法的无常、苦、无我，心中也会生起无瞋思惟，那也是强而有力的无瞋思惟。同样地，如果持守慈心九戒，应于行、住、坐、卧时皆以慈心祝福一切众生类而住。如果你的心经常地生起对众生的慈心，这时也具备无瞋思惟。如果你在修观智时，观察到你在平时有慈心生起，这也是一种无瞋思惟。第三种正思惟是无害思惟。无害思惟就是我们日常有悲心，特别是修悲心禅到达禅那时，无害思惟就会生起。无害思惟与悲心禅那同时存在，悲心禅那的思惟是上等的无害思惟。当你观察悲心的善法和悲心禅那名法为无常、苦、无我时，心中就会生起无害思惟，这些都是强而有力的无害思惟。"],[42,1818,1896,0,"比如这段时间我们每天都在给乌克兰和俄罗斯的民众散播悲心：愿他们远离战争的痛苦，愿战争早日结束。我们生起悲心，这就是有悲心的一种善心，这种善心的思惟称为无害思惟。3. 正语正见有四种，正思惟有三种，接下来是正语。佛陀说：『诸比库，什么是正语呢？离虚妄语、离离间语、离粗恶语、离杂秽语，诸比库，这称为正语。』有两种正语：世间正语和出世间正语。当我们戒除妄言、两舌、恶口、绮语时，就会生起正语，这是世间正语。当我们证悟涅槃时，道智会彻底地灭除能造成邪语的不善法，因此正语自然就存在，这是出世间的正语。"],[42,1896,1967,0,"比如初果圣者一定不会说虚妄语，这就是道智的作用。4. 正业接着佛陀解释正业：『诸比库，什么是正业呢？离杀生、离不与取、离欲邪行，诸比库，这称为正业。』正业有两种：世间正业和出世间正业。当你戒除杀生、偷盗、邪淫时，正业就会生起。当遇到杀生、偷盗或邪淫的所缘，你心生起远离时，这样的善心就会有正业心所在里面一起生起，这是世间的正业。当你证悟涅槃时，道智会彻底地灭除能造成邪业的不善法，因此正业自然就存在，这是出世间的正业。"],[42,1967,2041,0,"初果圣者以上的圣者一定不会违犯五戒，哪怕他下一生再来也不会违犯五戒，这也是他的圣道的作用。圣道心的成就现起，他不会违犯五戒。5. 正命接着佛陀开示正命：『诸比库，什么是正命呢？在此，诸比库，圣弟子捨离邪命而以正当的方法谋生，诸比库，这称为正命。』正命有两种：世间正命和出世间正命。当你以正当方式谋生时，正命就会生起，这是世间正命。当你证悟涅槃时，道智会彻底地灭除能造成邪命的不善法，因此正命自然就存在，这是出世间的正命。初果以上圣者再来人世间一定以正命而活，这是他的道果智的作用现起，也是成就现起。"],[42,2041,2165,0,"6. 正精进接着佛陀开示正精进：『诸比库，什么是正精进呢？在此，诸比库，比库生起意愿、勤奋、激发精进、策励自心、努力避免尚未生起的邪恶不善法生起。他生起意愿、勤奋、激发精进、策励自心、努力降伏已经生起的邪恶不善法。他生起意愿、勤奋、激发精进、策励自心、努力促使尚未生起的善法生起。他生起意愿、勤奋、激发精进、策励自心、努力使已经生起的善法持续、不衰退、增长、广大、成就圆满。诸比库，这被称为正精进。』什么是‘尚未生起的邪恶不善法’呢？在你这一生中不可能没有尚未生起的邪恶不善法。举个例子，在这一生中你都没有杀过人，那么杀人对你而言就是尚未生起的邪恶不善法。在这一生中，你可能还没有享受过某些感官欲乐， 那么由于那些感官欲乐而生起的烦恼对你而言就是尚未生起的邪恶不善法。作为一个修行者，应当生起意愿、勤奋、激发精进、策励自心、努力避免尚未生起的邪恶不善法生起。换句话说，你应当修行八圣道分，亦即修行戒、定、慧三学。当我们明白正精进是已生善法令增长，未生善法令生起，未生不善令不生，已生不善令断除时，我们知道正精进心是面对善和不善而言的。"],[42,2165,2268,0,"并不是说一定要咬紧牙关坚持做某件事，才是正精进。很多禅修者在面对自己的禅修目标时，他以为抓住业处就是正精进，这是禅修者在修习止观时最容易犯的一个毛病 —— 错误地理解“精进”。有人问：“Bhante，您在讲精进心所时，不是说勇悍刚决、毫不畏惧吗？”是，勇悍刚决、毫不畏惧是面对不善法时的态度。当你看到烤鸭流口水时，你有没有勇悍刚决“我现在不吃就不吃”呢？这需要勇敢，要有一定的内心力量才能避除它。看到美女、看到帅哥时，能不能够看到三十二身分？还是说再看一眼，偷偷看也可以？这也是要有力量的，这是正精进，这是勇悍，这是刚决，这是不畏惧。如果我们认为正精进就是抓住不放，就会有很多麻烦。"],[42,2268,2416,1,"有一位小尊者昨天才跟我说： “Bhante，我入出息的时候还是非常紧。”上一次指导他时我说：“把心放在身体后面来观察你身体的白骨，白骨稳定的时候再用白骨来替代你入出息的相。”他体验后说：“怎么这么奇妙！我的紧张一下子就没有掉了。”我说：“这仅仅是你把所缘或者专注的方式替换掉了，但是你喜欢抓取业处的习惯还是没有改，你要把这个改掉。” 他说： “没关系， Bhante，我现在已经会了。”昨天又来说：“Bhante，我又紧了。”没有把习惯改掉时，那个习惯性还会回来。我们又讨论了一会儿，今天跟我说：“我真的好像会了。”认为精进地觉知所缘就是牢牢地抓捕它，不是这样的，要把这个习惯改掉。精进地觉知所缘，是在面对所缘时你生起的都是善法，如果不善法生起时，你要知道怎么灭除它。什么是不善法呢？分析、评价、判断、排斥、黏著、怀疑就是不善法。面对你的安那般那业处时，你有没有这样一堆东西起来？如果有这样一堆东西起来就远离了正精进， “抓住、控制”都是不善法。在此，特别提醒一下。当你能正确地专注入出息念的相、入息、出息，乃至最后三法合一，证得初禅、二禅、三禅、四禅时，透视安般似相的智慧就是正见。"],[42,2416,2538,0,"为了透视安般似相所作的“如实、自然、轻松地觉知”的努力就是正精进，该正精进与正见同时存在。那时，在之前生起的不善法就会被降伏，心就会变得清净。当你转修观禅，透视行法的无常、苦、无我三相时，了知三相的智慧是正见；把心投入三相的心理现象是正思惟；为了要觉知三相而作的努力是正精进。那时，在之前生起的不善法也会被降伏。如果能够如此修习止禅和观禅，就可以说你生起意愿、勤奋、激发精进、策励自心、努力降伏已经生起的邪恶不善法。如此持续地修行，终有一天会证悟涅槃，那时道智和果智会以涅槃为目标而生起。了知涅槃的智慧是正见；把心投入涅槃的是正思惟；为了透视涅槃而作的努力是正精进。对于一个禅修者而言，这些都是我们还没有生起的善法，我们要努力让这些善法生起。如果能够持续不断地修行一直到达证悟阿拉汉道果，我们就可以说你是生起意愿、勤奋、激发精进、策励自心、努力使已经生起的善法持续、不衰退、增长、广大、成就圆满。这是四种正精进。7. 正念接下来是正念，佛陀说："],[42,2538,2630,0,"『诸比库，什么是正念呢？在此，诸比库，比库以热诚、正知、正念安住于观身为身，去除对世间的欲贪及忧恼。他以热诚、正知、正念安住于观受为受，去除对世间的贪欲及忧恼。他以热诚、正知、正念安住于观心为心，去除对世间的贪欲及忧恼。他以热诚、正知、正念安住于观法为法，去除对世间的贪欲及忧恼。诸比库，这称为正念。』在此，再次提醒大家，为什么说能够观名色、能够修观禅与观智不同呢？当我们能够安住观身为身、 观受为受、 观心为心、 观法为法，能够观名色为名色，这代表是你能修观禅，你掌握了观禅的一个工具。但是你修观禅的目的是去除对世间的贪欲和忧恼。如果你在座上修观禅时，可能世间的贪欲和忧恼没有生起，而下座时，世间的贪欲和忧恼的习惯一点都没有减少，就不能说你这个人有真正的观智，只能说你在修观禅。"],[42,2630,2715,1,"身、受、心、法是观智的目标，正念会取这些目标。我们知道正念是让心能够沉入这些所缘，就像石块沉入水中，不漂浮。当正念取到这些目标，观智能如实地了知它们，因此在我们修习观智时，正念和观智一定是同时存在的。在这里，观智也被称为正知。佛陀说： 『比库以热诚、正知、正念安住于观身为身……。』 《大四十经》中也称为三法围绕，正见、正念和正精进或正念、正思惟和正精进。所有八支圣道的生起，第一以正见为先导，第二一定要以正精进为热忱，另外一个道支随起来，三法围绕。"],[42,2715,2819,1,"8. 正定佛陀说： 『诸比库，什么是正定呢？在此，诸比库，比库远离爱欲，远离不善法，进入并安住于具有寻、伺及由远离而生之喜、乐的初禅。平息了寻、伺之后，籍着获得内在的清净与一心，他进入并安住于没有寻、伺，但具有由定而生之喜、乐的第二禅。捨离喜之后，他保持舍心，具备正念与正知，如此他以身感受快乐，正如圣者所说：「此快乐是安住于舍心与正念者所感受的。」 他进入并安住于第三禅。由于捨离了苦和乐及先前灭除了喜和忧，他进入并安住于超越苦乐及由舍与正念进化的第四禅。诸比库，这称为正定。』正定有两种：世间正定和出世间正定。在《大念处经》中佛陀开示说初禅、第二禅、第三禅、第四禅都是正定。这里的第四禅也包括无色界定在内。哪四种无色界定？空无边处定、识无边处定、无所有处定、非想非非想处定。当你转修观禅时，观照身、受、心、法的无常、苦、无我三相时，专注于这三相的定也是正定。这些一般称为观禅的刹那定，这些是世间的正定。"],[42,2819,2905,0,"修习到观智成熟时，就能够证悟涅槃。如果你在观照世间法或初禅名法为无常、苦、无我时证悟涅槃，你的道智称为初禅的道智，因为此道智中包含五禅支。同样地， 你的果智， 未来你入初果的果定时，你的果定与初禅的状态是相似的。如果你在观照第二禅名法为无常、苦、无我时证悟涅槃，你的道智称为第二禅的道智，你的果定与第二禅的状态相同；如果你在观照第三禅名法为无常、苦、无我时证悟涅槃，你的道智称为第三禅的道智， 你的果定与第三禅的状态相同；如果你在观照第四禅名法为无常、苦、无我时证悟涅槃，你的道智称为第四禅的道智，第四禅的果定也与第四禅的状态相同。与这些道智同时存在的定称为出世间正定，与这些果智同时存在的定也称为出世间正定。"],[42,2905,3003,0,"（二）禅定有五种利益现在有些人对通过修习止禅而培育正定有误解，他们说禅修者修习止禅就是睡觉，昏沉；还有些人说修止禅可能会发疯或堕入邪道；还有些人说修止禅就是修光明。持这些观点的人都是没有证过禅那的人，因为没有证过禅那，对于止禅到底是怎样他不明白，往往就是人云亦云，这种见解其实是很可悲的。止禅的名法，佛陀在很多部经典里有描述，初禅、二禅、三禅、四禅是正定，不是邪定。如果说这样的定是邪定，藐视和排斥佛陀于《大念处经》及其他许多经典中对正定非常明确的阐述，就会诽谤佛陀。"],[42,3003,3055,1,"禅定的五项利益：第一项利益是现法乐住，即今生的安乐住处。已经证悟阿拉汉道果的人有时也会修习止禅而入定。他们的禅那并不能使他们达到更高的成就或造成任何未来的投生，因为他们已经断尽烦恼，所作皆办，达到生死轮回的终点。他们入定只是为了得到今生的安乐住处而已。在有些经典中描述，佛陀有时候下午禅坐时用安那般那四禅，弟子们问佛陀：“佛陀啊！您的住处是什么？”佛陀说： “我修安那般那。”所以佛陀不一定都是入果定或入灭尽定，他经常以世间定作为他的安乐住处。"],[42,3055,3174,0,"禅定的第二项利益是观禅的利益。如果禅修者证得了禅那，他就能以该禅那作为修习观禅的基础。禅那能够产生非常强盛（非常有力量）的智慧之光。在一切光明当中，智慧之光是最强盛、最有益的。依靠智慧之光，我们能够完整地照见究竟名色法和它们的因，并且能观照它们为无常、苦、无我，从而证悟圣道。因此八圣道分当中有正定这一项。如果我们同意八圣道分是通向涅槃的唯一道路， 那么为了证悟涅槃，我们就应该培育正定。当然有人会说有些阿拉汉是纯观行者，他们并没有达到禅那。然而要成就纯观阿拉汉，也必须有系统地修习四界差别到达近行定或刹那定，该定力也能产生明亮的智慧之光。在智慧之光的帮助下，他们能完整地照见究竟名色法及其因，以及照见这些行法为无常、苦、无我。如果他没有系统地修习四界差别，在日常时作为观照行、住、坐、卧的一些动作，他可能看到一部分的色法，比如地界的一些硬、粗、重；风界的一些推动、支持；水界的流动和黏结很难观察到；火界的冷、热比较容易观察到。色聚有地、水、火、风、色、香、味、食素，看到色聚的色、香、味、食素，特别是食素不容易观察。"],[42,3174,3283,1,"也观察不到业生色，比如眼净色、耳净色、鼻净色、舌净色、身净色、性根色、心所依处色、命根色，就不容易完整地观察到。身体有二十八种色法，往往他只能观察到一部分，不完整。名法更是如此，他更多地是可能看到：“我现在贪心生起；我现在瞋心生起；我现在有愚痴的心生起；我现在有我慢；我现在有悭吝；我现在有嫉妒。”但是他没办法依佛陀开示集谛时讲到的十组来观察，眼根、耳根、鼻根、舌根、身根、意根、心所依处色他就看不到。触、受、想、思、爱、寻和伺这些名法也没有办法观察到，所以名法也不能完全地被观察到。如果不培养四界差别的定力而修观禅的人，就会面临这样的问题。也就是说，培养四界差别的定力而见到究竟名色法的这种智慧，对于纯观行者而言也是必要的。如果想修习真正的观禅，必须具备这种智慧之光。所以佛陀教导止禅的主要目的就是为了修习观智。"],[42,3283,3348,0,"禅定的第三项利益是增上生利益，即得到投生于梵天界的果报。如果禅修者能将禅那维持到临终，那么他死后就能投生到梵天界。然而我们教导修习止禅并不是为了这个目的，这只是一个可能性。如果有学圣者凭借禅那而投生于梵天界，他们就不会再投生到欲界，而将在梵天界解脱生死轮回，因此禅定对未证得圣果者和已证圣果者都有很大的利益。禅定的第四项利益是神通的利益。如果能以十四种御心法来精通十种遍禅和八种定，具备充分巴拉密的人就有可能修成一种或多种神通。"],[42,3348,3429,0,"禅定的第五项利益是寂灭的利益，即成就灭尽定的利益。成就八定的阿那含（不来圣者）与阿拉汉能入灭尽定。如果要入灭尽定必须先入初禅，出定后观照初禅的名法为无常、苦、无我；然后入第二禅，出定后再观照第二禅的名法为无常、苦、无我；然后次第地一直到识无边处定、无所有处定的名法为无常、苦、无我，出定以后发四个愿，即入灭尽定的四个愿：僧团有事时能自动出定、佛陀召唤时能自动出定、当他在灭尽定中时身体及所有物品都不会毁坏、如果接近死亡会在命终之前自动出定。接着入非想非非想处定一、二个刹那之后即进入灭尽定。在灭尽定中，心和心生色法暂时都不会生起。如果他们入灭尽定七天，那么在那七天当中心和心生色法都不会生起，只有业生色、时节生色和食生色在生起。"],[42,3421,3536,1,"这些是禅定的五项利益。佛陀说： 『诸比库，这称为导至苦灭的道圣谛。』在《大念处经》中，佛陀继续开示说：『如此，他安住于观照内在的法为法、安住于观照外在的法为法或安住于观照内在与外在的法为法。』在这个阶段，应当只观照苦谛，换句话说就是只观照身、受、心、法。如何观照它们呢？前面已经解释过很多次，首先我们必须培养足够的定力， 其次必须有系统地修习四界差别， 直到能够见到究竟色法。这样的修习法都是身念处。然后在观照究竟名法时，如果从受开始，注重在观照受，则是受念处；如果从识开始，注重在观照识，则是心念处；如果从触开始，注重在观照触，则是法念处；如果是观照五蕴、十二处等，这也是法念处。然后应当观照内外的名色法。接着佛陀开示说： 『或于法随观生起之法而住，或于法随观坏灭之法而住，或于法随观生起、坏灭之法而住。』在这个阶段，我们必须观照因缘生灭和刹那生灭。接着佛陀开示说："],[42,3536,3601,0,"『他现起‘有法’之念，只是为了智与念的程度。』这个阶段包括从坏灭随观智到行捨智。接着佛陀开示说：『他无所依而住，亦不执取世间的一切。』这是到达了涅槃状态，道智了知涅槃，而道智心识刹那里的八圣道分就是道谛。所以佛陀最后说：『诸比库，比库乃如此对四圣谛而于法随观法而住。』对于四圣谛的观照是属于法随观的内容。四、修行四念处的成果修习四念处有如此的利益或成果，佛陀说：『诸比库，如此修习四念处七年的人，可望得到两种成果之一："],[42,3597,3670,1,"今生证得阿拉汉果；若还有烦恼没有断尽的话，则证得不来果。不用说七年，诸比库，如此修习四念处六年的人，可望得到两种成果之一：今生证得阿拉汉果；若还有烦恼没有断尽的话，则证得不来果。不用说六年...五年...四年...三年...两年...一年...不用说一年，诸比库，如果修习四念处七个月的人，可望得到两种成果之一：今生证得阿拉汉果；若还有烦恼没有断尽的话，则证得不来果。不用说七个月...不用说六个月...不用说五个月...不用说四个月...不用说三个月...不用说两个月...不用说一个月...不用说半个月，诸比库，如此修习四念处七天的人，可望证得两种成果之一：今生证得阿拉汉果；若还有烦恼没有断尽的话，则证得不来果。』七天就可以证得阿拉汉。这是佛陀时代的人，我们这个时代的人有没有呢？也是可能的。"],[42,3670,3732,0,"『这就是为什么说：‘诸比库，这是使有情清净、超越忧愁与悲伤、灭除痛苦与忧恼，成就正道与现证涅槃的单一道路，那就是四念处。’佛陀如此开示之后，诸比库对佛陀的话感到非常地欢喜。』佛陀在《大念处经》中所说的七天至七年时限乃是针对五根力量中等之人而言。如果是慧根敏锐的人，例如沙利子尊者那位金匠出身的弟子，他能在早上听闻佛陀的指导，而在傍晚时就证悟阿拉汉果。如果是慧根迟钝的人，例如马哈希瓦长老（Mahāsīva） ，就需要超过七年以上的时间才能证得阿拉汉果。"],[42,3732,3861,0,"经常会有人说：“我是利根者！”或者“我是钝根者！”总体来讲我们都是钝根者，没有利根者。当然相对来讲会有一些人偏利一些，明显地对法念处比较有兴趣，这样的人相对利根会强一点。按照《注疏》来讲，凡是不能在七年之内证悟阿拉汉果的人都不能算利根，即使能够像马哈希瓦三十年证得阿拉汉果的人，也只能算是钝根的人。《注疏》里说，佛陀开示完《大念处经》之后，有三万名比库证得阿拉汉果。我们基本把帕奥西亚多讲的《大念处经》学完了，有没有人证阿拉汉果？可能没有人证得阿拉汉果，但是佛陀说的法是真实语，这些能够在七年、七天证得阿拉汉果的人，都是在过去生做了很多努力的人，所以他们能够在这一生，最少在佛陀在世时能够证悟阿拉汉果。虽然我们没有在佛陀在世时修习四念处而在那时证悟涅槃，但是我们现在有幸还能学习佛陀的教法， 还能依着佛陀教导的四念处完整止观禅法学习。因此我们要激起坚定的信心，为在今生证悟涅槃而勇猛精进地修行。"],[42,3860,3976,1,"愿此正法能够久住！愿大家都能够早日证悟涅槃！就像《大念处经》中佛陀最后所说： 『诸比库，此一行道，能清净有情，超越愁、悲，灭除苦、忧，得达如理，现证涅槃，此即是四念处。』祝愿大家在这一生中都能够精勤地修习四念处，没有七天，在七年要证悟；没有七年，在七十岁之前要证悟；七十岁没有证悟，在今生结束之前至少证悟初果。Sādhu！Sādhu！Sādhu！"],[43,0,189,1,"196 讲-摄集-摄菩提分-法念处-四圣谛 4&总结古源尊者上堂课按照经文学习了<三十七道品>四念处部分。一、四念处（一）四念处是必行之道简要回顾一下之前所学四念处的内容。佛陀说：『诸比库，此一行道，能清净有情，超越愁、悲，灭除苦、忧，得达如理，现证涅槃，此即是四念处。』对于想修行体证道果的人，四念处是必行之道。佛陀说：『最上之道是八圣道分，最上之理是四圣谛，最上之法是涅槃。这是唯一的道路，没有其他道路能使见解清净。』注意这句话“这是唯一的道路，没有其他道路能使见解清净。”学习十六观智时，也有这样一段经文：四道、四果之后是解脱、解脱知见。所以见解清净非常重要。"],[43,189,280,0,"佛陀说：『依循此道路而行，你就能降伏魔王，灭尽众苦。』修习四念处（单一行道）能获得七项利益：使众生清净、超越忧愁与悲伤、灭除痛苦与忧恼、成就正道与现证涅槃。（二）四念处与调伏者的根性《注疏》提到有两种根性：钝根者、利根者。简单来讲，钝根者学习比较慢，利根者学习比较快。也有解释：利根是指削弱或伏断烦恼的能力比较强，钝根是削弱或伏断烦恼的能力比较弱。要明白：利根并非指学习知识学得快、背诵得快，这要区分清楚，可能因为翻译的原因而误解。"],[43,278,383,1,"又可分两类：爱行者与见行者。爱行者是渴爱的性格；见行者是见解的性格。有些人认为“这人见解很利，就是利根”。不是这样区分的，利根是利根，见行是见行。见解很多的人容易成为见行者。又可分为另有两类：止行人与观行人，先修止再修观的人被称为止行人，没有达到安止直接修观的人被称为观行人。此六类人应如何修习四念处？《注疏》建议：对于钝根的爱行人而言，通过观察粗色身（比较粗的色身）的念处法是达到清净之道（比较容易达到清净）。对于钝根的爱行人，观察烦恼或学习能力比较弱且是位贪行者，修习身念处比较容易有效果。"],[43,383,464,0,"对于利根的爱行人，削弱烦恼、学习的能力比较强，但是位贪行人，修习受念处比较恰当。对于钝根的见行人，虽然见解多，但是根器比较钝，这样的人修习心念处比较合适。对于利根的见行人，由于他很善于分辨各种法类，修习法念处比较适合。对于钝根的止行人，由于比较听话（一般钝根的止行人比较听话，教给他方法就能接受），修习身念处比较合适。对于利根的止行人，由于总是想法很多，利根的人往往跟见容易结合在一起，他很难持续地专注于比较粗的目标，他不喜欢较粗的目标，喜欢细的目标，修习受念处比较适合。"],[43,464,541,1,"对于钝根的观行人，适合修习心念处。对于利根的观行人，适合修习法念处。论师对于这几种分别，更多是在修观禅时从哪里入手的角度来讲。在日常生活中，你无法清晰地分辨自己是爱行人还是见行人、是利根还是钝根。当然你现在是在修止，但还未证得禅那、还未开始修观，就不能很清晰地说禅修已经很好。所以日常就需要去尝试观察。如何尝试？佛陀在开示苦之集与苦之灭时，提到十组内容，之后再复习。以上是四念处与调伏者根性之间的关系。"],[43,541,834,1,"（三）修习四念处的方法四念处总共有二十一种方法：身念处十四种——入出息、四威仪（行、住、坐、卧）、正知（七种正知）、不净观（三十二身分的不净和尸体的不净）、界分别观（四界差别）、九种坟场观；受念处与心念处各算一种；法念处五种：五盖、五取蕴、十二处、七觉支、四圣谛。二、四圣谛运用将之前所学的四圣谛部分串起来，在还没有完全体证四圣谛时，要尝试着将四圣谛运用于生活、修学和工作当中。（一）看问题的原则是四圣谛，解决问题的路径是八正道四圣谛是最上之理，在面对一切境界、处理一切事物时，四圣谛是最基本的原则。所以看问题的基本原则是四圣谛。八正道是最上之道，解决问题最好的路径是八正道。"],[43,793,972,1,"1.苦圣谛佛陀说：『诸比库，何谓苦圣谛？生是苦，老是苦，死是苦，愁、悲、苦、忧、恼是苦，怨憎会是苦，爱别离是苦，求不得是苦。简而言之，五取蕴是苦。』五取蕴就是（执取）自己与他人的色、受、想、行、识为我或他。我们生活中一切的一切都是苦谛所摄。只要在五蕴的生命界里存在或在蕴界的生命存在，都是苦的一种表现。无论遇到想要的、不想要的；喜爱的、不喜爱的，最后的结果都是苦的生起。举个例子“爱别离”，人们都说爱是有快乐的，父母、夫妻、伴侣、父子、母子的爱等等。佛陀说：『在这里，任何人有想要的、喜爱的、愉快的色尘、声尘、香尘、味尘、触尘或法尘，或者任何人遇到心怀善意者、心怀好意者、心怀安慰意者、心怀安稳意者、母亲、父亲、兄弟、姊妹、朋友、同事或血亲（这是我们爱的），然后丧失了与这些人的会合、交往、联络、结合。』这是必然的，因为所有人都会死，不说日常情况下，生命最后那一刻一定会死。平常关系再好，从未分离，但是死亡来临时总得分离，不是你死就是他死，爱别离苦就会出现。你再渴爱，最后都有离别的时候。这是对苦的一种理解。"],[43,971,1069,1,"2.苦集圣谛『诸比库，何谓苦集圣谛？造成投生的是爱欲，它伴随着喜与贪同时生起，四处追求爱乐，也就是：欲爱、有爱、无有爱。』上堂课讲到无有爱，很多人说：“我都不喜欢有再生，根本不相信生命有轮回，哪来的爱？”你认为生命到此应该了结、必须了结或自然会了结，这是你的爱。爱没有生命的再轮回，或者爱生命就是这样一生，也是一种爱。3.苦灭圣谛『诸比库，何谓苦灭圣谛？此爱欲的完全消逝无余、捨离与弃除，从爱欲解脱、不执著。然而，诸比库，如何捨弃爱欲、灭除爱欲呢？在世间有可爱、可喜之物的任何地方，就在那里捨弃爱欲、灭除爱欲。』世间有可爱、可喜之物的任何地方，你就要在那里捨弃爱欲、灭除爱欲。"],[43,1069,1398,1,"4.苦灭之道圣谛在任何有可爱、可喜之物的地方，在那里捨弃爱欲、灭除爱欲，就要依靠八正道。佛陀说：『诸比库，所谓导至苦灭的道圣谛，那就是八圣道分，即正见、正思惟、正语、正业、正命、正精进、正念、正定。』捨断烦恼有三种：彼分断、镇伏断和正断断。（二）集的生起、建立1.从缘起支角度分析佛陀在开示苦集圣谛和苦灭圣谛时，例举十组可以生起渴爱之处。佛陀说，爱欲在哪里生起建立，就要在哪里捨弃、灭除。可能有可喜、可爱之物的地方有哪些呢？内六处[眼根、耳根、鼻根、舌根、身根、意根(心识)]，即五蕴。认为五蕴是可爱的，渴爱就在那里生起、建立。生起并被稳固建立有一个过程。"],[43,1398,1493,1,"内六处（眼、耳、鼻、舌、身、意），总体是从色身角度来讲，认为身体是可爱的，苦的集就会在这里生起与建立。外六尘（色、声、香、味、触、法），你对于看到、听到、闻到、舌头尝到、身体接触到、心里想的觉得可喜、可爱，那么爱欲就会在那里生起与建立。建立的过程，其实是在寻和伺层面。当六根面对六境（尘）时，会产生六识。六识生起，在六识对六境时，就在那个地方生起可喜、可爱的基础。如果没有识，就无法对目标进行进一步地认知和鉴别。"],[43,1493,1606,0,"有识、有触，根门与外境接触，渴爱就在那里生起。如果不生起识，比如无色界的天人没有眼、耳、鼻、舌、身，他们是四蕴界的生命，没有色身就只能生起意识，他们看不到、听不到、闻不到、尝不到、没有身体触到，五识就不会生起，与五识相应的爱也不会生起。有接触就有感受。受是什么？受是果报评价体系，好吃不好吃、好玩不好玩、好看不好看。好看是果报，不好看也是果报，所以评价其实都是从善果报、不善果报的角度来讲。果报评价体系凭什么作出评价？凭过去的想蕴标记。受生起可爱、可喜时，想蕴被调出来而作出可爱、可喜的评价。想蕴被调出，思心所就会组织其他所有心所对目标采取行动，这也是思心所的可喜、可爱。"],[43,1606,1708,1,"因为是可喜 、可爱，所以只要采取行动，贪爱就会生起。贪爱生起时已经在造业了。如果第一次接触某个所缘，刚开始并不知道它是否可喜、可爱，想蕴标记调不出对它的判断，只能去尝试。先识别、接触而有感受，有感受就标记“这是可爱的”，然后对它采取行动：“我真的很渴爱，我想要它！”“想要它”只是集的生起。为了渴爱而不断地去抓取目标（寻），然后按前面的过程不断地寻找、接触、采取行动、情感构建，盘踞在上面就是伺。多次重复，渴爱就被牢牢地建构起来，变得很坚固。就像青年男女谈恋爱，开始没什么感觉，慢慢交往越来越觉得相应，然后山盟海誓、海枯石烂，爱得死去活来，这是集的生起与建立的过程。"],[43,1708,1814,1,"佛陀依这十组解释爱欲，其实也是从缘起支的角度来看。上图中标绿色部分，内六处、外六处、识、触、受是果报；想蕴标记是烦恼随眠潜伏。比如“这个人很可爱、那个人很讨厌”，都是标记。想本身不造业，但是标记完“可爱、可喜”时，烦恼就潜伏在里面。而思心所就开始组织相应心所对目标采取行动——贪著。寻和伺是不断地去抓取。思与爱是业轮转；想心所是烦恼轮转；内六处、外六处、识、触、受是果报轮转。寻与伺也是业轮转，因为它不断一而再、再而三地去抓取，使渴爱不断地生起并建立。只要渴爱不断地生起和建立，随时会产生苦，或者未来会等到这样的苦。"],[43,1814,1931,0,"2.日常观察爱欲的生起与建立日常可以如此观察自己，照镜子时眼睛一看，“白头发又长了好几根。”满头黑发变成了白发，再一看“满脸都是皱纹”；再一看，牙齿都掉了；再一看，越来越容易疲劳。就觉得很悲哀，生起苦，因为求不得，青春不在。渴爱就在这里生起、就在这里建立。外六尘，无论走到哪里，如大金塔外面的广场，到处都是穿着艳丽的人，如果不守护根门，一不小心贪心就会冒起来，很麻烦。老了还好一点，年轻人就很容易生起各种各样的非份想。渴爱就在这里生起，多看几眼就建立，看多了就想还俗，就这个结果。如果没有生起识，没有接触，渴爱就不会生起。只要有识别、接触，就会产生渴爱。接触完以后就有各种感受。"],[43,1928,2046,1,"感受是如何生起的，要理解。大家做梳理，要找到一个场景，在那个场景里你身体的感受和内心的感受，然后记录在那个感受下你有什么样的情绪？感受只是感受，而情绪与贪爱（渴爱）、寻、伺相关。感受其实是渐次的、一层一层的，你不断地去寻，不断地停在目标上，过去的想蕴一次一次地被调起来，就会想入非非。感受也是在不断地增长这样一个过程。学习受念处时，讲到应依靠的感受与不应依靠的感受，也有翻译为，贪婪相应的感受与不贪婪相应的感受，其实是两个角度。贪婪相应的感受，是跟贪爱结合在一起的感受；没有贪婪的感受，是不跟贪爱结合在一起的感受，都是对于目标的一种体验，与果报相关。"],[43,2046,2174,1,"还有一类是在不断地寻、伺，不断地生起贪爱之后被强化的感受，这是跟贪婪相关的感受，是心里的感受而不是果报的感受。所以感受分两个层面：1.果报的感受；2.速行的感受。速行上的感受是对所缘不断地采取行动，不断地“吸取”。《注疏》里说，吸取所缘里的精华，而产生了内心的感受。对于苦集的生起，应于日常生活的每个当下去观察：苦是什么？苦是怎么生起的？当我们碰到问题时，习惯性地希望它消失，“有问题不好，不好就应该消失”，这样的处理方法不是以四圣谛角度来处理。“问题”是苦谛，希望一步直接到灭谛，这不符合佛陀讲的四圣谛的方法。要分析问题生起的因，也就是问题的集是什么，必须找到它。这个问题在哪个地方生起、建立，按佛陀教导的十组来分，要分清楚。"],[43,2174,2284,1,"问题提出来，你必须很精准地写出在什么样的场景、什么样的感受，产生什么样的情绪，然后按这条线去梳理，把它完全对应起来。如果不完全对应，当时的知见（无明爱取）和现在的情绪（速行）没办法连起来，就没办法用八正道解决问题。怎么理解呢？面对任何一件事情，你所产生的想法，后面都有一个见解。昨天有位贤友说：“我说了一句话，觉得很难受。”为什么很难受呢？就得分析原因。如果你不能分析清楚，光说“就是很难受”不能解决问题。后来讨论他说：“可能是说的话不合适，可能说的话不恭敬，可能这话让人家觉得不恰当。”所以要分出来。你觉得冒犯了别人，冒犯是一种见解，有没有冒犯？有没有不礼貌？或者有没有很轻浮？是不同的。如果是因为冒犯而产生的难受，这是恐惧，“冒犯圣者，我以后取不得道果，连禅那都证不了。”如果是觉得不礼貌，“这样说话，人家会觉得我素质比较低，很不好意思，很惭愧。”产生的是这种不良感受。"],[43,2284,2406,1,"如果只是说“我很难受”，混成一堆就怎么谈都没有用。你必须分析那一堆难受是什么难受。要一一对过去，是什么样的认知产生这样的难受，必须一条一条地理清楚。佛陀说：渴爱在什么地方生起、在什么地方建立，就要在什么地方捨弃，然后灭除。要到那个地方去灭。若不能一一对应地找出来，一一对应地灭掉，一团的东西，你想解决问题，希望问题消失，就不符合佛陀的四圣谛教导。（三）灭的捨弃、断除如何捨弃和灭除？前面佛陀以十组，每组六项来解释导致渴爱在那里生起并在那里建立。讲到灭谛时，就要在那十个生起、建立的地方捨弃它、灭除它。捨弃、灭除的路径（道路）是什么？即八正道。八正道中，第一是正见。"],[43,2406,2509,0,"在内六处产生渴爱，看到自己有白头发，觉得很悲伤，内心的苦受生起；看到长了白头发，表示老了，老是苦。接下来心里生起愁、悲、苦、忧、恼的忧苦和愁苦，都是苦。佛陀说，这是集谛的建立、生起。接下来要灭掉两个苦：老苦，以及看到老而忧愁的苦。佛陀教导对治老苦的方法是“不生”，只要有生就一定会老，最后都会死。所以要彻底体证涅槃，断除一切烦恼。忧，当下就可以解决。忧是不善法，不善法生起就会造不善业，不善业首先是伤害自己。因为愁忧，总想着“我老了，很快要死了，现在没有什么功德，怎么办？！”如果就此担忧、害怕、无精打采，整天都是病恹恹的没劲儿，说不定很快就死了，这是可能的。如果天天都认为自己快死了，那就很快会死，所以要先灭掉忧。"],[43,2509,2613,0,"佛陀说，在这个地方生起忧，就要在这个地方捨弃，然后灭掉。灭掉的方法，第一个是见。认为长出白头发应该忧虑，这个见解是对的还是错的？如果想消除这个忧虑，就要把这个见解转掉。认为“我老了，我怎么办啊？”对于老而产生忧虑，就要去找这个见解背后的原因。有很多角度可以分析。有些角度认为：“老了，不再青春了，我想吃、想喝、想玩的东西没了，别人会不喜欢我了。”女人：“我老了，老公也不喜欢我了。”男人：“美女都不看我了。”他是从这个角度来思考。也有些人担心，“我老了，可能接下来就会生病。”一般就会形成这样一种见解，由这个见解导致忧。"],[43,2610,2706,1,"如何去掉忧？简单来看，这个见解是真的吗？真的会这样吗？一定是这样吗？不一定。你想被别人认同，难道不长白头发别人就真的会认同你吗？以前没长白头发时就有那么多人不认同你。别人认同你、尊重你，是因为你有德行，不是因为你白头发长得少，所以要不断地回头看你的见解能不能站得住脚。那些很有德行的老师、西亚多，有很多白头发，甚至头发都掉光了，为什么我们还那么爱戴他们？所以不是因为白头发多或者脸皮皱了就不可爱，而是因为没有德行才会令人厌弃。佛陀时代，没有证得四果阿拉汉，都会被说身上散发着尸臭。对圣者还说身上散发着尸臭，为什么？因为还没证到四道四果。只要内心的烦恼没有完全断除，就会被真正的智者嫌弃。我们应该以这样的角度来思惟。"],[43,2706,2841,0,"也可以思惟如何生起悚惧，不再睡懒觉，不再跟人家计较鸡毛蒜皮事儿，赶紧禅修，赶紧去做该做的善行，这个见解就转过来了，就不忧愁了，当下就把它灭掉。也就是说，看到苦、苦的原因，在见上捨弃集，然后灭除集。灭除集不仅仅是一个见的角度，仅仅如此还不够。这位尊者说：“道理懂了，我已经想明白，但是还是难受。”为什么会这样呢？因为他过去的某些知见已经多次重复。这位尊者小的时候曾经和父亲讲了一句玩笑话，结果被父亲呵斥了，令他当时觉得很恐惧和窘迫，对长辈讲话要很小心这个认知被一再地重复到寻和伺，不断叠加，重重叠叠，最后叠到凡是看到年纪比他大的像父亲那样，或者身份像父亲的人，都会投射成父亲的形像。只要这样的对像有一点表现和反应，他心里自然而然就会生起担忧。其实对方根本不是他父亲，但也会启动这个见解。"],[43,2837,2979,1,"这个阶段，其实已经到寻，在形成的邪见的引导下邪思惟。邪思惟又引发他的身、语以及行为都有担忧。总是一看到马上就担心，一看到马上就害怕。身、语、意已经从邪见、邪思惟，一直到邪语、邪业，接着引发邪精进：坚决不放、念念不忘。因为这些都是不善法，导致他无法培养定，还一直在里面绕。所以仅仅看到“见”是还不够的，看到“见”，要把它转过来，从邪见转为正见。接下来要看到思惟习惯，当思惟习惯在错误的方向绕时，要看到它生起的模式，不能纵容它，要能停下来。如果确认“见”已转完，但习惯还起来，怎么办呢？最简单的办法就是你坐在那观察它，看着它，不认同也不排斥。“我知道有这个习惯，它一定会灭去。”你越认同它，它转得越强；你越排斥它，它也转得越强。“怎么还起来呢？”你越排斥它，它越有力量，最后把你搞到精神分裂。如果你只是这样静静地看着它，就像坐在门口看着外面的客人来来往往，它总是要走出去的，等它走出去，你作意它无常、苦、无我。每被你看一次，它就削弱一次，看一次它就削弱一次。这是从思惟角度下手。"],[43,2972,3075,1,"有些人从身语意下手。哪些言语、哪些行为经常会触发这样的事，就不能做，不然又会引发同样的事。有时觉得见解转过来，思惟方式也转过来，但烦恼还起来。比如，刚才讲头发白了，已经思考过头发白没什么问题，但一看到还是觉得“哎呀，……”忧愁还会起来，那个思惟习惯又转起来了。这说明那个见转的不够透彻，要再转。当然你也可以：不要再看头发，因为看完头发看眼皮，看完眼皮再看牙齿，都是老的模样。不看它，跳出习惯，做该做的正确事情。心总是缘在善法上，心不断地朝向善法，让善法成为我们的正思惟，成为正确的习惯，然后“已生善法令增长，未生善法令生起，已生不善令断除，未生不善令不生”，念念都这样，回到身、受、心、法四念处上，不良的习惯就会被转过来。"],[43,3075,3180,0,"（四）用八正道灭除苦将四圣谛的方法运用于日常生活中的一切时处。每一个当下碰到的都是苦谛，苦谛都是有原因的，都有集谛；如果想灭除集谛，一定要用八正道。八正道，从见解下手，看自己的思惟习惯，然后从行为上不断地朝向正确的身、语、意。正确的身、语、意某种程度上就是戒，戒再扩展就包括日常的念知、如理作意，这些都属于戒的范畴；再扩展一点，就是善行，包括十福业，都属于正语、正业、正命的范畴。只要是在正语、正业、正命的方向上，然后正精进、正念、正定，慢慢地，在面对这十组可能生起渴爱（集谛）的地方，建立起一种新的且与八正道相应的认知行为模式。"],[43,3180,3277,0,"用世俗的观点来看，八正道是完全正确的认知行为模式。这个模式需要自己去建立，不是诵诵经、看看书，乃至打打坐就能建立起来。打坐能够建立起打坐的认知行为模式，但是日常生活的行、住、坐、卧，与人沟通，不是打坐能建立的，所以要着力地去训练。认知就是见与思惟，正确的认知就是正确的见解与正确的思惟方式。行为就是正语、正业、正命。无论是世间人还是学佛人，只要想成功，都要按照八道，见、思惟、语、业、命、精进、念、定。你想：“我一定要赚钱。”认为赚钱能获得快乐，这是你的邪见解；然后心就开始思考怎么赚钱，并付出行动，不断地邪精进，念念不忘，最后一心钻在这里面——邪定，这样才有可能成功。世出世间，只要想做成一件事，都要围着八道。"],[43,3277,3401,1,"对于佛教徒来讲，想灭除自己的烦恼，就要依着八正道。佛陀说，面对自己的色身（内六处）时，是什么态度？看待自己身体时，“集”有没有生起？如果有，如何捨弃和灭除？捨弃和灭除就是八正道。同样，当看到外在的眼、耳、鼻、舌、身、意接触所有所缘时，“集”有没有生起？渴爱有没有生起？简单来讲，就是有没有在这里生起苦？如果生起苦，就要灭除苦，方法就是八正道。以上是从<法念处>四圣谛运用的角度作下总结。三、拥有导向解脱的见佛陀在《谛分别》中教导五种集谛（苦因），其中之一：一切不善业及能造成投生的善业都属于集谛。"],[43,3401,3490,0,"如上图，一边是一颗子弹，一边是一支口红。无论是用口红来装扮自己，还是用子弹杀自己或杀别人，只要不是导向解脱，会造成投生的都是集谛。并不是内心生起善法就已远离集谛。每天于行、住、坐、卧生起善法时，首先生起的见是要导向解脱，每天回向：“愿我此功德，导向诸漏尽”。对于佛弟子，每做一件事之前，应先想一下，“我做这件事情的见是什么？”身、语、意或正语、正业、正命之前的见是什么？这个见是否与导向解脱相应？如果不是，就会变成导致轮回的福德善业，它是善业，但不导向解脱，而是导向轮回。"],[43,3490,3665,1,"如果你造作的当下没有这样作意，每天晚上睡觉之前，建议大家做滴水回向，给自己做回向。可以思惟：今天所造作的这些善业，是否都导向诸漏尽，成为涅槃缘？如果没有，就要作意地思惟，把它作个转向。这是日常中应做之事。当我们于一切时处都拥有正见，慢慢地就会形成正思惟，我们所有的行为也会依着正见去实践，这是必然的方向或路径，最终导向解脱。关于四念处，就学习到这里。四、总结<摄集>中<摄菩提分>是三十七道品，三十七道品包括：四念处、四正勤、四如意足、五根、五力、七觉支、八圣道。在之前的<摄集>课程中，除了四念处之外，四正勤在四增上里已提到；五根在二十二根里已讲到；五力在九力里已讲到；四正勤就是精进，已经多次提到，讲到七觉支时又提到，精进在三十七道品里出现九次；七觉支在法念处里讲到；八正道在四圣谛的道谛里讲到。因此讲完四念处，其实三十七道品的所有内容都讲完了。不用再学一次四正勤、四如意足、五根、五力、七觉支、八正道分。如果大家有意愿，可以结合前面所学的内容，整理为三十七道品学习资料。也可以学习《菩提资粮》，雷迪西亚多讲得比较简单。"],[43,3665,3780,0,"如果想更深入地学习，可以根据帕奥西亚多的教导，整理《义注》、《复注》这部分内容，自己把三十七道品串起来。三十七道品是觉悟的资粮，首先要成为内心的素质，要有这样的能力。有这样的能力即是你的心流里具备这样的素质。你要检查是否具备这样的素质，如果还没有具备，如何去训练让它拥有，并且达到圆满。对于出家人而言，要在禅林、在身边营造三十七道品的氛围，能在这氛围里成长，并且圆满。对于在家人而言，要把家变成道场，在家里也要营造三十七道品的氛围，在家里也实行四念处、四正勤、四如意足、五根、五力、七菩提分、八圣道分。如果在修学环境里能建立起三十七道品的氛围，就比较容易获得觉悟资粮，能够早日到达终极目标，体证涅槃，解脱一切苦。在此祝福大家！"],[43,3776,3845,1,"Sādhu！Sādhu！Sādhu！回向功德！"]]};
// 口语 → 课里常用说法，只扩展查询
const SYN = [["生气|发火|愤怒|脾气", "嗔"], ["贪心|贪欲|执着", "贪"], ["无明|愚痴", "痴"], ["傲慢|骄傲", "慢"], ["后悔", "恶作"], ["嫉妒", "嫉"], ["吝啬|小气", "悭"],
  ["犯困|昏沉|想睡", "昏沉 睡眠"], ["走神|散乱|念头多", "掉举"], ["怀疑", "疑"], ["开悟|证悟", "道心 果心"], ["禅定", "禅那 安止"]];
const expand = q => q + " " + SYN.filter(([p]) => new RegExp(p).test(q)).map(([, w]) => w).join(" ");
const VAR = s => s.replace(/瞋/g, "嗔").replace(/捨/g, "舍");
const han = s => [...VAR(s)].filter(c => c >= "一" && c <= "鿿");
const bigr = s => { const t = han(s), o = []; for (let i = 0; i + 1 < t.length; i++) o.push(t[i] + t[i + 1]); return o; };

const U = D.units.map(([l, s, e, ap, t], i) => ({i, l, s, e, ap, t}));
const L = D.lectures;  // [讲次, 讲题, mp3, 是否转写]
const fmt = t => { t = Math.round(t); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };

const FIELDS = [[u => L[u.l][1], 0.5], [u => u.t, 1.0]];
const N = U.length, K1 = 1.2, B = 0.75;
const IDX = FIELDS.map(([get, w]) => {
  const TF = [], LEN = [], DF = new Map();
  for (const u of U) {
    const g = bigr(get(u)), tf = new Map();
    for (const x of g) tf.set(x, (tf.get(x) || 0) + 1);
    TF.push(tf); LEN.push(g.length);
    for (const x of tf.keys()) DF.set(x, (DF.get(x) || 0) + 1);
  }
  return {TF, LEN, DF, w, avg: LEN.reduce((a, b) => a + b, 0) / N};
});
const has = (i, g) => IDX[1].TF[i].has(g) || IDX[0].TF[i].has(g);
const STOP = /[了的么吗呢吧啊怎该应为什如何我你他她这那就都也还是在和与把被]/;
const content = gs => gs.filter(g => !STOP.test(g) && (IDX[1].DF.has(g) || IDX[0].DF.has(g)) && (IDX[1].DF.get(g) || 0) < N * 0.08);
function score(q) {
  const qs = content([...new Set(bigr(expand(q)))]), sc = new Float32Array(N);
  for (const {TF, LEN, DF, w, avg} of IDX) for (const g of qs) {
    const df = DF.get(g); if (!df) continue;
    const idf = Math.log(1 + (N - df + 0.5) / (df + 0.5));
    for (let i = 0; i < N; i++) { const f = TF[i].get(g); if (f) sc[i] += w * idf * f * (K1 + 1) / (f + K1 * (1 - B + B * LEN[i] / avg)); }
  }
  const own = content([...new Set(bigr(q))]);
  if (own.length > 1) for (let i = 0; i < N; i++) if (sc[i]) {
    let hit = 0; for (const g of own) if (has(i, g)) hit++;
    sc[i] *= 0.4 + 0.6 * hit / own.length;
  }
  // 单字查询（如「嗔」「慢」）没有二字词组，退回子串
  if (qs.length === 0) { const c = VAR(q).trim(); if (c) U.forEach((u, i) => { const n = VAR(u.t).split(c).length - 1; if (n) sc[i] = n / (1 + u.t.length / 400); }); }
  return sc;
}

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
let results = [], shown = 0, terms = [];
function hl(s) {
  s = esc(s);
  if (!terms.length) return s;
  const alt = terms.flatMap(t => [t, t.replace(/嗔/g, "瞋").replace(/舍/g, "捨")]);
  const re = new RegExp("(" + [...new Set(alt)].map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "g");
  return s.replace(re, "<mark>$1</mark>");
}
function run() {
  const q = $("q").value.trim(), lec = $("lec").value;
  terms = q ? content([...new Set(bigr(expand(q)))]) : [];
  if (q && !terms.length) terms = [VAR(q)];
  let idx = U.map(u => u.i);
  if (lec !== "") idx = idx.filter(i => U[i].l === +lec);
  if (q) { const sc = score(q); idx = idx.filter(i => sc[i] > 0).sort((a, b) => sc[b] - sc[a]); }
  results = idx; shown = 0; $("list").innerHTML = "";
  $("status").textContent = (q || lec !== "")
    ? `找到 ${idx.length} 段` + (lec !== "" ? `（${L[+lec][1]}）` : "") + (q ? "，按相关度排序" : "，按讲解顺序")
    : `共 ${N} 段，输入要找的内容或选一讲开始`;
  if (q || lec !== "") page();
  $("more").style.display = shown < results.length ? "block" : "none";
}
function page() {
  const frag = document.createDocumentFragment();
  for (const i of results.slice(shown, shown + 20)) {
    const u = U[i], lec = L[u.l], c = document.createElement("div"), long = u.t.length > 160;
    c.className = "card";
    c.innerHTML = `<div class="q">${hl(lec[1])}</div>
      <div class="meta">${fmt(u.s)}–${fmt(u.e)}${u.ap ? "（约）" : ""}${lec[3] ? " · 自动转写" : ""}</div>
      <div class="txt${long ? " cut" : ""}">${hl(u.t)}</div>
      <div class="row"><button class="btn play">▶ 播放这段</button>${long ? '<button class="btn tog">展开全文</button>' : ""}</div>`;
    c.querySelector(".play").onclick = () => play(u);
    const tg = c.querySelector(".tog");
    if (tg) tg.onclick = () => { const x = c.querySelector(".txt"), on = x.classList.toggle("cut"); tg.textContent = on ? "展开全文" : "收起"; };
    frag.appendChild(c);
  }
  $("list").appendChild(frag);
  shown += 20;
  $("more").style.display = shown < results.length ? "block" : "none";
}
function play(u) {
  const a = $("audio"), url = L[u.l][2];
  $("player").style.display = "block";
  $("pt").textContent = `${L[u.l][1]} · ${fmt(u.s)} 起`;
  const seek = () => { a.currentTime = u.s; a.play(); };
  if (a.dataset.src !== url) { a.dataset.src = url; a.src = url + "#t=" + u.s; a.addEventListener("loadedmetadata", seek, {once: true}); a.load(); }
  else seek();
}

$("sub").textContent = `古源尊者 · 快乐念住平台 · ${L.length} 讲 · ${N} 段（听打稿全文，可按段播放原录音）`;
L.forEach((x, k) => { const o = document.createElement("option"); o.value = k; o.textContent = x[1]; $("lec").appendChild(o); });
for (const ex of ["嗔心所的特相", "速行", "名色分别智", "身见", "有分心", "业生色"]) {
  const a = document.createElement("a"); a.textContent = ex; a.onclick = () => { $("q").value = ex; run(); }; $("ex").appendChild(a);
}
$("go").onclick = run;
$("lec").onchange = run;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("more").onclick = page;
const h = decodeURIComponent(location.hash.replace(/^#q=/, ""));
if (h && location.hash.startsWith("#q=")) $("q").value = h;
run();
</script>
</body>
</html>
