比库对他说：“Bhante，您身体哪个部位疼痛啊？”长老回答说："],[31,982,1031,1,"“事实上，并没有一个特定的疼痛地方，由于执取色、声、香等特定事物为目标，才会生起疼痛的感受。”长老所回答的“事实上，并没有特定的地方疼痛”，这句话非常的重要。如果一位禅修者想修行受随观，然而却观察到疼痛的地方，比如:“我的背痛、头痛、肩膀痛……”，那么你所修习的还不是真正的、或者说还不是阶位比较高的受随观。这位长老为什么这么回答呢？因为他能照见究竟名色法及其因，并且能够照见它们无常、苦、无我的本质。"],[31,1031,1185,0,"举例而言，在禅修时，很多人说：“我脚很痛、我臀部很痛、我脖子很痛，剧烈的疼痛。”这时如果想修行受随观，应该怎么修呢？标准的是：首先，你应该对自己的身体，尤其是疼痛的地方修四界差别。一直到你见到这个地方的色聚，分析这个地方的色聚之后就会见到这个部位（比如你的腿部或脖子）里面有四十四种或称为五十三种色法。四十四种色法不包含命根九法聚的九种色法，如果包含则是五十三种色法。应当特别地观照那个部位身十法聚里的身净色，观察那里的身净色。取到身净色，你去看它附近的色聚和其他色法，就可以看到特别强盛的地界、火界和风界这些色法。比如地界的硬、火界的热和风界的推动。这三界是身体触受的目标（称为触尘），它们都存在色聚之中。当地、火、风一再地撞击那个位置的身净色时，疼痛的感受和相应的名法就会以心路过程的形态生起，那时你的心就会感觉到疼痛。然而，身净色、地火风的触以及疼痛的感受都是无常的，它们一生起后就立即坏灭。如此观照时你看不到有脖子、有臀部、有腿，只是看到究竟名色法而已。如果只是看到疼痛的地方，那你还没有破除密集，不是真正的受随观。"],[31,1185,1323,0,"照见究竟名色法以后，你会清楚地了解：由于我们的心取地火风的触为目标，所以疼痛的感受才会生起。那么，你就能了解这位庄严山寺长老回答的含义：“事实上，并没有一个特定的疼痛地方，由于执取色、声、香等特定事物为目标，才会生起疼痛的感受。”对于还看不到色聚以及究竟法的人怎么办呢？之前讲身念处时，四威仪是觉知身体的动作，也可以观察身体的疼痛。虽然你见不到色聚，但是依然可以在疼痛的位置上观察到痛的很多细节。我们经常讲是五彩缤纷的疼痛，‘五彩缤纷的疼痛’怎么理解呢？如果你的心聚焦在那个位置上，你会发现那个痛有非常多的内涵 —— 有的痛像针刺一样，你一观察，那种针刺感马上消失；你一觉得它消失了，取而代之，拉扯的痛又会生起来；你一观察拉扯的痛，可能撞击的痛又会生起来；你一观察撞击的痛，会发现热热的、麻麻的痛又会生起来。没有一个固定的状态是可以持续的，你只要观察它，它就灭掉，但是它不断地生起。你虽然看不到究竟色法，但是你可以知道：那个撞击感、针刺感是地界；那种‘扯一下、扯一下’是以风界为主地界为辅的状态；那种热就是火界。"],[31,1322,1499,1,"之前学习色法及受心所时曾讲到，为什么我们对于身体的触会有很明显的感觉呢？因为身净色是身十法聚里的明净色。作个譬喻，身净色就像放在打铁的砧板上的一团棉花，如果用棉花去拂拭棉花，那么砧板上的棉花没有感觉；如果用铁锤去打那个棉花，棉花就会被打碎掉。身十法聚里的身净色是依附于身十法聚中的地水火风而存在，尤其是地界来承载它。如果它受到色聚（同样是地界明显的色聚）的撞击时，就像铁锤在击打放在砧板上的棉花。他感受就会很明显，触觉就会很明显。当我们能这样去理解、去观察疼痛时，虽然不能够完全地觉知到究竟色法生起的因以及它的无常、苦、无我，但是可以部分地观察到这个地方疼痛，它的这种状态（地界撞击的状态、风界撞击的状态和火界撞击的状态）以及它生起来就灭掉的这种事实是可以观察的。只是这种观察不能称为真正意义上的受念处。但是我们可以如此练习以培养对受、对痛的理解。帕奥西亚多说，庄严山寺是斯里兰卡一座非常著名的寺院，前面提及的那位长老是一位大长老，他拥有能够证悟四无碍解智与阿拉汉的巴拉密，他已曾在过去佛陀的教化期中修行止观多次达到行捨智的阶段。"],[31,1499,1551,1,"在最后那一生，他已在庄严山寺修行止观二十年以上，能观照究竟名色法及其因为无常、苦、无我，因此他看不到疼痛的特定地方，只是见到究竟名色法。如果我们真正想要修行受念处，就应当以这位长老为榜样来学习。那位提问的年轻比库是负责照顾长老的人，在听了长老的回答以后，年轻比库说：“Bhante，既然知道这个道理，是否应该忍耐疼痛呢？”长老说：“Āvuso，我正在忍耐。”年轻比库说：“忍耐是很好的，Bhante。"],[31,1551,1710,1,"”长老就忍耐着。后来，长老的风界已经撞击伤害到他心脏，以至于他肚子里的肠子全部都从肛门里面被挤出来，在床上堆成一堆。长老对照顾他的年轻比库说：“Āvuso，您看，是否应当忍耐到这个程度呢？”年轻比库默然，不知道怎么回答。随后，长老激起精进，持续地培育定力，就在那个时刻，他证悟含四无碍解智的阿拉汉，然后在那时般涅槃。起初，当剧烈的疼痛持续生起时，长老必须以很强的精进力来忍耐疼痛。那时候他的精进根非常强，强到他本身身体的风界也很强。当他的肠子完全从肛门里被挤出来的时候，他的疼痛就减轻了，这时他的精进根和定根达到平衡。平衡之后，他无需花更多的精进力去忍耐疼痛，他就在短暂的时间里再度培育定力，然后观察所有的行法为无常、苦、无我。在那种情况下，观察任何一种行法都足以让他证悟涅槃。为什么呢？因为他已有足够的巴拉密。《注疏》中引用这个例子，意在教导我们做为禅修者在观察苦受时，应当像这位长老一样来学习，如实地观察。‘如实地观察’是要看到受以及相关名色法的因及其因的无常、苦、无我。（二）六种受前面讲到三种感受——乐受、苦受、不苦不乐受，接着佛陀开示另外的六种感受。"],[31,1709,1788,1,"佛陀说：『诸比库，感受到有物染的乐受时，了知‘我感受到有物染的乐受’；感受到无物染的乐受时，了知‘我感受到无物染的乐受’；感受到有物染的苦受时，了知‘我感受到有物染的苦受’。感受到无物染的苦受时，了知‘我感受到无物染的苦受’；感受到有物染的不苦不乐受时，了知‘我感受到有物染的不苦不乐受’；感受到无物染的不苦不乐受时，了知‘我感受到无物染的不苦不乐受’。』前面三种感受加这六种感受合起来就有九种感受。在《大念处经》中佛陀教导有九种感受。感受，最少三种：苦受、乐受、不苦不乐受；又有五种：苦受、乐受、不苦不乐受再加悦受和忧受。苦受和乐受是指身体的，悦受和忧受是指内心的，不苦不乐受是共同的。‘有物染’和‘无物染’再乘以三（苦受、乐受、不苦不乐受），合起来是六。"],[31,1788,1886,1,"1. 三种有爱染的感受‘有爱染的乐受’指的是什么？是指与六根门相关而且受到贪欲污染的六种快乐的感受。‘有爱染的苦受’是指与六根门相关而且受到贪欲染污的六种痛苦的感受。‘有爱染的不苦不乐受’是指与六根门相关而且受到贪欲污染的六种舍受。举例而言，如果对颜色有执著，有时会因为颜色而生起快乐的感受。比如你看到自己乖巧的儿子、漂亮的女儿、金银首饰，看到这样的色法时，一般的人就会生起‘有爱染的乐受’；有时你会因为颜色而生起痛苦的感受。比如金条丢掉了、首饰没了、孩子（女儿）跟你顶撞、生病了或者死亡了，你看到这样一种状态就会有苦受，这就是‘有爱染的苦受’"],[31,1869,1946,1,"；如果看到这种色所缘，内心生起不苦不乐的中性感受，那就是‘有爱染的不苦不乐受’。比如相处时间长的伴侣、朋友，平常没感觉，“你对他有爱恋吗？”回答说“没有”，明天给你拿走你就不行了。看到他的微信，在跟别的异性聊天你就受不了，而平常的时候你是不苦不乐受的。以上是第一类感受。2. 三种没有爱染的感受（出离依止受）第二类是没有爱染的感受，经典中也称为出离依止受。没有爱染的感受也分成三种：即乐受、苦受和不苦不乐受。"],[31,1946,2024,0,"对于没有爱染的感受，有哪一些可以与之相关呢？佛陀指出有五种出离：出家的生活、初禅（包括了所有的禅那）、涅槃、观智及一切善法。以这些为目标的缘故，有时候会生起乐受，有时候会生起苦受，有时候会生起不苦不乐受。这些受被称为没有爱染的受。‘没有爱染的乐受’是指与六根门相关但是没有贪欲的六种快乐感受；‘没有爱染的苦受’是指与六根门相关但是没有贪欲的六种痛苦的感受；‘没有爱染的不苦不乐受’是指与六根门相关但是没有贪欲的六种舍受。"],[31,2024,2138,0,"⑴ 出家出家即离开俗家而过着比库或比库尼的出家生活。由于他们从在家生活超脱出来，因此出家是一种出离。乐受、苦受和不苦不乐受都可能由于出家的生活而生起。比如当你反省自己的戒行时，发现自己的戒行清净，因此感到很愉快，这是没有爱染的乐受；有时候你会发现自己的戒行有瑕疵，因此感到不愉快，这是没有爱染的苦受；有时候你反省自己的戒行时，没有苦受也没有乐受生起，这是没有爱染的不苦不乐受。有时候你思惟自己的出家生活时，感到满意和愉快，这是没有爱染的乐受；但有时会发现很多问题而懊恼，“禅林有很多服务啊、老师刚才看我一眼是不是对我有意见？我是不是应该还俗？”这是苦受，是没有爱染的苦受；有时当你思惟自己的出家生活时，既没有乐受，也没有苦受，那是没有爱染的不苦不乐受。因此这三种感受都可能由于出家的生活而生起。"],[31,2138,2218,0,"⑵ 初禅初禅就达到心清净，它是一种出离。在禅那心生起来之前都有遍作、近行、随顺、种姓，种姓心就是从欲界心转为色界心，它使人脱离欲界、投生到梵天界的基础。修习任何一种禅那到达初禅，就具备了这种出离。三种感受都可能由于初禅而生起。当你安住在初禅当中时，愉快的感受会生起，那是没有爱染的乐受；有时由于遇到障碍而无法入初禅或者初禅不稳定，你会有挫折感，那是没有爱染的苦受；有时你经常进入初禅，太熟悉了，你也觉得没有乐受，也没苦受，反正就是入禅嘛，那是没有爱染的不苦不乐受。"],[31,2218,2326,0,"其实，包括其他的所有禅那（从二禅一直到非想非非想处定，四禅八定）也都是出离，它们也都包含在五种出离当中，或者说，包含在第五种出离（一切善法）当中。如果禅修者在临死时还能维持禅那，那么该禅那将使他们投生到相应的色界或者无色界的梵天。投生到梵天界时就超越了欲界，因此所有八定都称为出离。⑶ 涅槃涅槃是脱离生死轮回的基本因素，因此它也是一种出离。在这里，我们必须分辨证悟和证入的差别：证悟涅槃时是以涅槃为目标、了知涅槃。证入涅槃则是指断尽烦恼的人死亡以后般涅槃。初果圣者证悟涅槃时以涅槃为目标，但是初果圣者还不能马上证入涅槃，他还需要再成就二果、三果、一直到四果阿拉汉，乃至于他的生命结束以后才能够入般涅槃。"],[31,2326,2407,0,"证悟了初果的人断除了有身见。所谓的身见，就是认为有众生真实存在的邪见；二果圣者会削弱其他所有剩下的烦恼；三果圣者会断除欲贪和瞋恚；四果圣者会断除所有的烦恼和结。对于谁是初果圣者、二果圣者、三果圣者、四果圣者，我们是不容易分辨的。如果你不是佛陀，自己也没有证得圣道圣果，也没有他心通，是不容易观察到其他人是不是圣者，或者是不是阿拉汉。因此我们不要随便地去议论说“某某某可能是圣者，某某某可能不是圣者”，这很危险。"],[31,2407,2479,0,"⑷ 观智由于观智能暂时去除烦恼，因此观智也是一种出离。在这种出离情况下，同样地会生起没有爱染的三种受。⑸ 一切善法由于一切善法是从不善法或烦恼中超脱出来的基本因素，所以一切善法也是出离。一切善法包括：布施、持戒、禅修，十种福德事，十五种行，以及所有的观智，如果把禅那单列出来，那就是七种妙法——信、念、惭、愧、多闻、捨、慧，这些都属于善法。在造做善法的过程中，我们依然会生起没有爱染（物染）的乐受、苦受和不苦不乐受。"],[31,2479,2616,1,"（三）当培育的受前面讲到总共有这九种受，在修习观禅时必须观照它们。然而从修行者来讲，我们应该着力地培养没有爱染的三种受，而不应该培养有爱染的三种受。在修习止禅和观禅时，有时因为定力或观智提升，心里会生起乐受。我们应当一再地培育这种受，因为它是证悟涅槃的助缘。有些人在禅修时觉得很快乐，想起老师指导：“不要以快乐为目标，应该以入出息为目标，或者以你的禅修所缘为目标。”就觉得应该排斥乐受。有位贤友禅修报告说：“感受太舒服了，觉得有问题，要排斥它。”排斥是不对的，佛陀说，乐受是持续修行的助缘，很主要的动力，因为它会给你带来快乐的感受。乐受会增长相应法，会让我们的相应法都增长，会喜欢。在修行当中，有时会感到不苦不乐受，我们也应当培育这种受。不苦不乐受对于身体而言，你虽然感觉到不苦不乐，其实对身体而言就是一种乐受。没有不舒服就是快乐。对心来讲，不苦不乐受就是一种可以持续的状态，也是应该培养的，不要让自己的心大起大落。不苦不乐受时，有些人就觉得说："],[31,2616,2735,0,"“我没什么感受，我是不是要去折腾一点受出来。”结果一折腾，定力就掉了。不苦不乐受在禅修的过程中也是很常见；另一种应当培育的受是没有爱染的苦受。此苦受是从内心的角度来讲，对身体而言不存在培育没有爱染的苦受，对吧？你不会说：“要培育我身体没有爱染的苦受，让它痛一点吧。”当然，有一些人是为了练腿，痛也坚持，那算一种培育了，更恰当的是一种忍耐。《注疏》中说应当培育这种没有爱染的苦受，其实是讲忧受。我们知道所有的忧受都是不善法，为什么还要培育它呢？《注疏》中引用了一位长老的故事，马哈希瓦长老（Mahāsiva Thera）。之前课程中提到 Mahāsiva 是位论师，编著注疏的论师。而这位 Mahāsiva 也是一位很厉害的长老，但他不作注疏，他是十八个部派的导师，能够背诵三藏和注疏，并且教导教理和禅修。根据他的教导而证悟阿拉汉的弟子超过六万人。"],[31,2735,2809,0,"有一天，一位已经证悟阿拉汉果的弟子来劝这位长老修行。这位长老与大龙长老不一样，他知道自己还不是阿拉汉。虽然教出了六万个阿拉汉，他知道自己不是阿拉汉。他被弟子劝告以后就生起悚惧心，他就想：“那好吧，我就去修行一下。”他想：“像我这样的人一旦开始修行，我应该几天内就能够证悟阿拉汉果。”因此，他抱着要在雨安居结束之前证悟阿拉汉果的决心，跟僧团不告而别，独自进入森林修行。当雨季开始时，他没有证悟阿拉汉果，于是他下定决心要在雨安居结束之前证悟阿拉汉果。他在三个月的雨安居期间精进地修行，但是仍然不能证悟阿拉汉果。因此，在雨安居结束的月圆日他很伤心地哭了，这是苦受。"],[31,2809,2872,0,"接着他再下定决心要在隔年的雨安居结束之前证悟阿拉汉果。他精进地修行止观，但是到了第二年的雨安居结束时，他还是没有证悟阿拉汉果，因此他又再痛哭了一场，这也是苦受。他就这样精进地修行三十年，每年雨安居结束的月圆日都因为未能证悟阿拉汉果而痛哭，很苦。在第三十年雨安居结束的月圆日，他也像往常一样由于未能证悟阿拉汉果而痛哭。这时候，有一个住在离他经行道不远的一棵大树上的树神也在跟着哭起来。长老听到哭声问：“谁在那里哭？”树神回答说:“我是住在这里的树神。”长老问说：“那你为什么哭？”树神回答说：“因为哭可以使人证悟圣果，所以我就跟着你一起哭。”长老听完以后，生起警惕心，对自己说："],[31,2871,2932,1,"“Mahāsiva！你看连树神都来取笑你了，你应当精进修行不要再哭了。”于是当天晚上他精进地修行止观，并且在后夜时分证悟阿拉汉果。在这个故事里，当 Mahāsiva 长老痛哭时他感到苦受，那个苦受是由于他的止观修行没有达成目标而产生的，称为没有爱染的苦受。由于他的止观修行力量还不足以使他证悟阿拉汉果，所以他在三十年中每年雨安居结束时都伤心地哭泣。虽然那时生起的是不善的苦受，但是他应当培育那种受，为什么呢？因为那是修行止观的强力助缘。由于这样的苦受，所以他精进地修行。渐渐地，他的修行变得强而有力；当五根成熟而且平衡时，他逐一地证悟到四道四果，所以这种苦受也是应当培育的。"],[31,2932,3009,0,"在此提醒大家，可能有人会说：“你看注疏都讲了，Mahāsiva在不能证悟阿拉汉果的时候他就哭。那我不能证禅那，是不是每天都哭啊？我比 Mahāsiva 更努力一点，我一小时哭一次，要不行我半天哭一次，再不行我一天哭一次。”我们看到 Mahāsiva 长老一年才哭一次，对吧？其他时间都是不哭的，认真地修行。到雨安居结束要总结一下，发现这一年又没有证悟阿拉汉果，他觉得挺伤心就哭。那么“我一小时哭一次，我半年哭一次，一没有进步我就开始打击自己，就哭。”这种苦受、这种瞋心是不值得培育的。不然说“悟德玛尊者说要培养苦受，我就哭吧”，如果你能像 Mahāsiva 长老这样就可以。"],[31,3009,3086,0,"至于没有爱染的乐受，最明显的是，当修习入出息念成功地到达初禅乃至第三禅时，没有爱染的乐受就会很明显地生起。我们应当培育那种受，因为它是修行的强力助缘。当我们修习观禅，尤其是在生灭随观智的阶段，由于观智的缘故，会生起没有爱染的强烈乐受。乐受很明显，在生灭随观智还未成熟时会生起十种修观的污染，其中一种就是非常地快乐，这种快乐本身并没有染，但是如果你去执取这种乐受时，就会成为染。只要不去执取，这种没有爱染的强烈乐受应当培育。"],[31,3086,3151,0,"当禅修者到达四禅或者以遍禅为基础而到达四种无色界定时，他会生起没有爱染的不苦不乐受。四禅没有乐受，但是非常的寂静。这种不苦不乐受是禅受（四禅的受）。我们应当培育这种受，因为它是到达更高的禅修境界和修习观禅的强力助缘。当修行观禅到达行捨智时，也会生起没有爱染的不苦不乐受。我们也应当培育这种受，因为行捨智是证悟圣道圣果的近因。然而在修习受念处时，无论是有爱染的或没有爱染的受，都必须观照，观照它本身以及它生起的因，以及它的无常苦无我，因为它们都是观智的目标。"],[31,3151,3246,1,"（四）受念处修习方法1. 受念处的特点受念处有什么特点呢？先将之前所学的内容作归纳。色业处有两种修法：即四界分别观的简略法与详尽法。名业处有三种修法：1.先观照触；2.先观照受；3.先观照心识（识）。如果先观照受，不应只是观照受而已，而应该观照与受一起生起的其他相应名法，这称为受念处；如果先观照识，不应只是观照识而已，而应该观照与心识一起生起的相应名法，这称为心念处；如果先观照触，不应只观照触而已，而应该观照与触一起生起的相应名法，这称为法念处。这三种念处加上必须先修行的身念处，合起来就称为四念处。"],[31,3246,3331,0,"在这里，当佛陀开示观照名法的法门时，他谈到受。当他谈到触或识时，对某些禅修者而言，禅修的目标是不明显、暗淡的。为什么呢？因为受生起是很明显的，乐受和苦受的生起是相当清楚的。而触和识，如果你把受拿开，纯粹只是触心所和心识是不明显的。而受是很清楚的。当乐受生起而且遍布全身、洋溢全身时，它会使人发出内心的欢呼：“啊！这多么快乐。”《注疏》中说，就像吃了提炼过一百次的醍醐一样，也像涂了非常高贵的润肤油之后被很有技巧地按摩一样。"],[31,3331,3415,1,"当苦受生起并且遍布全身时，它会使人发出这样的哀嚎：“啊！太痛苦了。”就像火红的枪刺到自己身上一样，或像被熔化的铁水浇到自己身上，不必说熔化的铁水，就连被开水烫一下都很难受。所以乐受与苦受是很明显的，很多人在修习念处时愿意从受念处开始。在受念处中，尽管乐受与苦受的生起是明显的，但是不苦不乐受的生起是不清楚的。对于修习受念处的人，应如何修习不苦不乐受？应当运用正确的方法来掌握。《注疏》中说，你要这么思惟：“不苦不乐受存在于乐受和苦受消失时，籍着与乐受和苦受作比较，就能知道不苦不乐受的存在。"],[31,3398,3487,1,"”这方法可用什么来比喻呢？就像猎人追踪野鹿的蹄印，他追踪到半路时发现那只鹿跑过一块平坦的岩石，在岩石上看不到它的痕迹了，但是他可以在岩石两边的土地上看到鹿的蹄印。他籍此推理：“那只鹿从这里爬上岩石，从那里爬下去，从那里再跑出去了。”他可以分别出来。乐受的生起很明显，就好比爬上岩石之前土地上的蹄印一样；苦受的生起也很明显，就好比爬下岩石之后土地上的蹄印一样；运用推理的方法来观照不苦不乐受，就好比透过推理来了解鹿在岩石上跑过的路线一样。他心里想：“不苦不乐受存在于乐受与苦受消失的时候，籍着与乐受和苦受作比较，就能知道不苦不乐受的存在。”"],[31,3487,3548,0,"如此，佛陀先教导观察色法的禅修方法，然后从五取蕴中取出受蕴来教导观察名法的禅修法门。佛陀不仅仅在《大念处经》中如此教导，在《中部》的《爱尽小经》、《方广小经》、《方广大经》、《护国经》、《摩犍地耶经》、《界分别经》及《不动适应经》，在《长部》的《因缘大经》、《帝释请问经》，在《相应部》的《因缘小经》、《树譬喻经》、《审虑经》与全部的《受相应》以及其他很多经典中，佛陀都在教导必须在色法修完以后，从五取蕴中取出受蕴来教导名法的禅修法门。"],[31,3548,3609,1,"这是什么意思呢？就是佛陀在大部分的时间里都教导：要先观察色法，再来观察名法，因为受属于名法。有一些禅法直接从受开始教导（很容易碰到），这种方式是不是完全符合佛陀的教导呢？就要去观察。对于“我感到乐受”这句话，另一种理解的方式是：籍着在乐受生起时苦受的不存在，他了知：“我正感到乐受。”因为在乐受生起的当下苦受并不存在，以及在乐受生起之前的时刻没有乐受存在，所以乐受生起时他才会感到乐受。籍着如实了知的智慧来观照受是无常的、是短暂和变异的。当他如实了知受时，就是对乐受有正知。"],[31,3609,3665,1,"这句话怎么理解呢？正常来说，受念处必须观察到乐受这个名法，而在观察名法之前，要先学习观察色法，色法搞明白（看清楚）以后观察受，还要观察跟受一起生起的相应名法，以及这个名法生起来的因，以及观察到它的无常、苦、无我。大部分人还没有到达这个水平，因需要纯熟的观智。2．日常生活中对于受应持的态度日常生活中对于受要持什么态度？前面这句话就讲到‘乐受生起时苦受不存在’。其实对于乐也有一种说法“乐是苦的渐渐止息的一种状态”"],[31,3651,3759,1,"。感受是倒腾出来的，以前跟大家分享过：我在四川震灾的时候住在塑料帐篷里面，五六月份非常热，但是又不能出来，外面更热，帐篷里面的温度可以热到让蜡烛弯下来。刚开始躺在桌子上觉得太热，然后站起来，站起来就觉得头部很热脚比较凉。再一坐下来，就觉得比较凉快了，但凉快很快就消失了，又觉得热。然后躺下来，躺到地上的时候会觉得比较凉快，凉快的时候乐受就会生起来。这种感受有两种：一种是你的身体发送给你的信号，这个信号其实就是地界、火界、风界的撞击。热是火界对身净色的撞击，身体感受到热。当用心去执取它时，就会成为你的忧受和乐受。当你觉得非常难受时，心理的忧受就产生了。当我们面对这种苦受和乐受时，应该把我们的心从这种状态里面抽离出来。怎么抽离呢？应告诉自己："],[31,3759,3916,1,"“身体的苦受和乐受，是那个位置的身净色受到了身净色附近的地界、火界或者风界的撞击而产生的一种感受的状态。”这种状态为什么会产生呢？其实是动物性的保护机制，是为了你的生存和物种繁衍给你的心发送信号。你的心接收到此信号，为了生存和物种繁衍，就要做出对自我保护的一种行动。当你能如此认知时，保持自己的心不动，而只是去观察它传递过来的信息。在一定程度上，就可以把你的心与感受分离出来。如果能经常练习，就可以完全脱离出来 —— 感受只是感受，心只是心，你不会跟着它起反应。这是我们对于受的一种正知，也是对于观受的一种态度。3．名业处的修习方法而对于观禅来讲，当能够观察与受相关的名色时，首先了知没有众生只是一堆色法。根据《阿毗达摩》，眼识只依靠眼净色而生起，耳识只依靠耳净色而生起，鼻识只依靠鼻净色而生起，舌识只依靠舌净色生起，身识只依靠身净色而生起，意界与意识界只依靠心所依处色而生起。我们要观察色法、观察名法，就得分别这些生起眼识、耳识、鼻识、舌识、身识、意识及意识界这些名法的依处。观察依处就要看到里面的四大种色（地、水、火、风）以及所造色，比如眼十法聚，有地、水、火、风、色、香、味、食素加上眼净色。"],[31,3916,4000,0,"其他五门也是这样。能观察色法后，在这个色法上生起的心识就可以被观察。六门心路过程是名法，名法包括四种名蕴，六门里的色法是色蕴，在这个地方生起来的名色法，就只有名法和色法而已。当观察眼门心路时，看到颜色生起来的感受，要看到眼识以及在身识里生起的领受、推度、确定、后面的七个速行心、两个彼所缘，以及随起的七条意门心路过程对这个所缘进行分析、判断，得出概念所缘的感受。当我们能如此观察时，即知道这是依着眼门和意门而生起的一堆名法和色法。"],[31,4000,4096,0,"接着去观察这一堆五蕴生起的原因，是因为无明、爱、取、行、业而生起。所有的五门面对的所缘都是果报。当你定力足够时，就能看到你为什么会遇到这样的果报，这个果报是由过去的无明、爱取、行、业导致。由于无明、爱、取、行、业生起，所以五蕴生起。从此时起，可以安住于透彻的观慧，了知五蕴只是缘和缘生之法，没有众生或人存在，纯粹只是一堆行法而已。他观照缘生的名色法以及它的因为无常、苦、无我。在得到适当的气候、指导老师、食物与教法之后，期盼证悟而精进修行的比库，将会到达观智的顶峰，证悟阿拉汉果。这是解释先观照受、先观照触及先观照识这一类人证悟阿拉汉果的方法。今天先学习到这，愿大家能透由四念处，早日证悟阿拉汉果。祝福大家！"],[31,4091,4157,1,"Sādhu！Sādhu！Sādhu！"],[32,4,243,1,"185讲-摄集-摄菩提分-受念处 2古源尊者各位尊者、尼师、各位贤友，大家晚上吉祥！一、对于六种受的补充说明上堂课学习受念处时讲到：应当培育没有爱染的三种受，不应培育有爱染的三种受。有同学查阅《大念处经》义注和复注及参考其他经典后作出新的翻译建议，非常好，我让她把翻译过程录成了小视频与大家分享。以下为真求同学分享视频的文字部分：上节课弟子在受随观的学习中，有两个疑问： 第一个疑问是关于sāmisa的翻译（上节课翻译成“物染”，即有物染的受，没有物染的受）；第二个1疑问是关于sevitabba 的翻译（上节课翻译成“培育”，应该培育的受，不应该培育的受）。弟子翻查了义注、复注后，有一些心得向大家报告。在《大念处经•受随观》的义注中找到“Sāmisaṃ vā sukhan tiādīsu sāmisā sukhā nāma pañcakāmaguṇāmisasannissitā cha gehasitasomanassavedanā.”"],[32,188,290,1,"这 句 解 释 sāmisā sukhā 是 pañcakāmaguṇāmisasannissitā ， 还 有gehasitasomanassavedanā.那么，pañcakāmaguṇa 是什么意思呢？还有 āmisa是什么意思呢？它们的翻译非常重要。我们看复注中有更多的解释，Kilesehi āmasitabbato āmisaṃ nāma,因为能被烦恼把持，所以被叫做欲爱的结缚。在以上这一句中，āmisa 是什么意思呢？弟子又查了《小部•如是语•布施经》的义注。āmisa 的字面意思是“四资具”"],[32,290,416,1,"。经文中的语境是这样的，第九种应被施与的“布施dānaṃ ”：是以布施事所俱之思布施，也就是成就布施的清净。某些人被贪等（不善心）把持被叫做不清净āmisa。或者由于他们的布施思而（被称为）“不清净的布施āmisadānaṃ”。在《布施经》的语境下āmisa 翻译为“不清净”是合适的。但在《大念处经•受念处》这一部分的语境下āmisa 代表什么呢？在复注里有详细的解释，pañca kāmaguṇā五种感官的结缚，就是五种感官欲贪的结缚，所以弟子在这将 āmisa 翻译成‘欲爱的结缚’。又参看了帕奥西亚多在五大册《趣涅槃道》里面的讲解，取了这个含义：āmisa——欲爱的结缚。"],[32,398,503,1,"在 义 注 中 还 有 怎 么 样 的 解 释 ？sāmisā sukhā nāmapañcakāmaguṇāmisasannissitā， 解释sāmisā sukhā 的含义是这样解释的，我们看到了āmisa 这个词，就是刚才解释的，它所代表的原意是“四资具”，在这里它所代表的是“欲爱的结缚”，什么叫“欲爱的结缚”呢？就是pañcakāmaguṇā，“欲爱的结缚”是色、声、香、味、触、法，是六所缘，是感官的对象，在这里用“四资具”来进行借代，借代为我们感官的对象pañcakāmaguṇā。"],[32,503,637,1,"kāmaguṇā 是什么意思呢？在《戒蕴品义注》中解释：能使人想要之意为欲 kāma，以结缚之意为 guṇā。举例：“比丘们，我许可新布料的双层大衣。”这是披覆结缚的含义。“百种供养应被期待。”这是四资具结缚的含义。也就是说 āmisa“四资具”所指代的是我们感官的对象，把我们的感官通过欲爱结缚在了 āmisa，就是感官对象上面。所以它是欲爱结缚的意思。我们再看复注中还有怎么样的解释？sāmis ā sukh ā还是 chagehasitasomanassavedanā， 是[感官渴爱的]家的悦受。在这讲的是 sāmisāsukhā，就是依靠欲爱结缚的乐受。义注中解释的是六种 （cha） 依靠 （sita）家（geha）的乐受。"],[32,608,775,1,"“六”是什么意思呢？在《增支部•第一集•十八经》中有更详细的说明：cha（六）是chasu dvāresu uppannā，是生起于六门的gehasitasomanassavedanā。依据《增支部•第一集•十八经》的复注，我们可以理解这个“六”是指依靠生起于六门的意思。gehasita（依靠家）是什么意思呢？在这指的是依靠欲爱的对象、欲爱的所缘、欲爱的结缚，是感官渴爱的家。所以翻译成：依靠生起于六门感官渴爱的家的悦受，被称为sāmisā sukhā，翻译为依靠欲爱结缚的乐受。我们再看根本，《大念处经》的根本这句话翻译为“感到依靠欲爱结缚的乐受时，他了知‘我感到有依靠欲爱结缚的乐受’；感到没有依靠欲爱结缚的乐受时，他了知‘我感到没有依靠欲爱结缚的乐受’"],[32,775,991,0,"”这样我们就得出了根据上下文语境的翻译。第二个问题就是上节课讲的 ‘应被培育的悦受和不应被培育的悦受’，弟子也查了《帝释所问经》中的复注，复注中用的词是 sevitabbaṃ ，弟子也参考了帕奥西亚多《趣涅槃道》，他用的词是 “依靠”，所以我们之后取了这个是“应依靠的悦受”和“不应依靠的悦受”好，弟子就分享到这里，谢谢大家。以上是真求贤友和其他几位贤友在听完上堂课后对这段话的疑惑，当时我说： “感受到有物染的乐受时，了知‘我感受到有物染的乐受’。”也有翻译成：有爱染的乐受或者有爱染的苦受或者无爱染或者无物染……他们对“物染和爱染”提出疑问，然后透由 wikipāli 查对相关的义注、复注的解释，得出以上结论，也不能说这个结论就是终极准确。为什么分享上面的内容给大家呢？根据四大教示，我们学习的佛法,佛陀曾经是不是那样说？我们这些不能以巴利为母语，要靠多重翻译来接受佛陀教法的人，是挺可怜的。"],[32,991,1107,0,"我们要有这样的心：希望真正体会佛陀到底要告诉我们什么。也鼓励大家在多多发心、发愿学习教理！学习教理能指导我们保持更准确的修行路径。根据刚才分享的翻译，如果把“有物染、有爱染”或者“无物染、无爱染”的苦受或乐受等六种受，翻译成“应依靠”或者“不应依靠，”大家体会一下，把受称为“有物染或者有爱染”、“无物染或者无爱染”是不是更恰当？我们体会： “哦，这样的受可能被‘物染’或者被‘爱染’”然而受是遍一切心的心所：触、受、想、思、一境性、名命根、作意。受本身并没有善和不善，很多人不容易理解受是不是会被贪所爱染。"],[32,1107,1308,1,"“应依靠”和”不应依靠”从我个人角度来讲，比较容易接受和比较容易理解。根据刚才真求贤友提到义注和复注的观察和具体描述，讲到“感到有依靠欲爱结缚的乐受时，他了知：‘我感到有依靠欲爱结缚的乐受。’；感到没有依靠欲爱结缚的乐受时，他了知：‘我感到没有依靠欲爱结缚的乐受’”如果是原文，按照查阅义注、复注后，应该是这样的。1.依靠五欲的结缚，“依靠”是指：依靠生起于六门的[感官渴爱的]家的悦受被称为有依靠欲爱结缚的乐受。这是从义注角度来讲。2.生起于六门的依靠出离的悦受被称为没有依靠欲爱结缚的乐受。为什么我觉得这样更准确、更恰当呢？因为当感受生起来，我们可以观察“感受生起来了”是哪一门的感受？是依靠于某一种期待，还是没有依靠某一种期待？感官的乐受或者苦受生起来的时候，是不是被欲爱所结缚、所捆绑？是不是依靠这种烦恼捆绑而生起来的乐受。对于 “有感官(色、身、香、味、触)渴爱的家”就是欲爱感受的“家”。是这样一个角度来看的。"],[32,1308,1409,1,"因为能被烦恼把持，所以被称为感官欲乐的聚集地——五欲的结缚，同时在所缘的造作下，被烦恼把持，称为有依靠欲爱的结缚（sāmisa）。按照上述翻译,六种感受可以这样来解释:（一）依靠五欲结缚、依靠生起于六门的[感官渴爱的家]的悦受，被称为有依靠欲爱结缚的乐受。当这样的乐受生起时，了知有这样的乐受生起来。（二）依靠生起于六门的出离的悦受，被称为没有依靠欲爱结缚的乐受。当这样的乐受生起时，了知有这样的乐受生起来。"],[32,1357,1447,1,"（三）依靠生起于六门的[感官渴爱的]家的忧受，被称为有依靠欲爱结缚的苦受。当这样的苦受生起时，了知有这样的苦受生起来。（四）依靠生起于六门的出离的忧受，被称为没有依靠欲爱结缚的苦受。当这样的苦受生起时，了知有这样的苦受生起来。（五）依靠生起于六门的[感官渴爱的]家（五欲之境）的舍受，被称为有依靠欲爱结缚的不苦不乐受。当这样的不苦不乐受生起时，了知有这样的不苦不乐受生起来。（六）依靠生起于六门的出离的舍受，被称为没有欲爱结缚的不苦不乐受。当这样的不苦不乐受生起时，了知有这样的不苦不乐受生起来。这是佛陀对于受念处的教导，翻译成“依靠五欲的结缚”和“依靠生起于六门的[感官渴爱的]家”"],[32,1447,1497,1,"感受到和体会到。，对于没有观智的人而言，能更容易理解、应依靠的受和不应依靠的受（一）依靠[感官渴爱的]家的悦受是不应该被依靠的。（二） “应依靠的悦受”指：应依靠出离的悦受。以出离、观智、涅槃、初禅、一切善法等方式而生起的悦受被称为“应依靠”。了知色的无常性之后，变易、离贪、贪的灭尽。“由于智见过去、现在、并且一切诸色都是无常的，苦的，是变易法而生起的悦受。凡是这样的悦受被称为“依靠出离的悦受。”"],[32,1495,1582,1,"（三）“不应依靠的忧受”指：不应依靠[感官渴爱的]家的忧受。被眼识所识知的令人愉悦的、喜爱的、可爱的、漂亮的物质（色），属于世间味的获得或获得的感觉，回忆过去或曾获得又灭去的，已经变易的色法生起忧受。凡是这样的忧受，被称为依靠[感官渴爱的]家的忧受。大家简单了解这部分的内容，至于说是不是终极正确，我们不作这样的推断。但鼓励大家对法义能够深入思考，乃至于提出疑问，或者自己去10查对经典、义注和复注。"],[32,1582,1686,0,"由于前面提到应依靠和不应依靠的六种受，在这里对上一堂课补充如上内容，特别依靠五种出离，为什么要应依靠？“依靠”为什么有价值？如果学过二十四缘，在亲依止缘里面有“前前诸无记法对后后诸善法以亲依止缘为缘”，也有“前前诸不善法对后后诸善法以亲依止缘为缘”“前前诸无记法”包括身体的乐受、苦受、时节、气候、食物、住所、坐卧处作为亲依止缘，支助什么呢？比如我们对三宝、八事生起信心，从而持戒、听闻佛法、布施或者做十种福德事，提升智慧，修止禅和观禅。作为所有善行的亲依止缘，以亲依止缘的缘力支助他培养善法，这就属于可依止的受。"],[32,1686,1781,0,"可依止的受：身乐、身苦，乃至于时节、气候、食物、住所、坐卧处，使我们产生身体和心的感受，是可以依止于出离，而对我们未来的修行提供亲依止缘的缘力来支助的。“前前诸不善法对后后诸善法以亲依止缘为缘”，之前讲到： 你出家、持戒、禅修，包括Mahāsiva 长老三十年没有证阿拉汉果，每一年雨安居结束发现又没有证果他就忧伤地哭泣，这都是不善法。不善法是依止于出离的，是可以依靠的。这样的不善法会以亲依止缘的缘力缘助我们做布施、持戒、修习止观，履行布萨，培育定力，使观智生起乃至于道智生起，有些是培育神通、等至。"],[32,1781,1921,0,"为什么会有这样一种缘力呢？前面提到的 Mahāsiva 长老，虽然生起忧受，他是基于“我每一年这样的努力都还没有达到”而生起来的忧受，这样的忧受会促使他“我还要努力，明年还要继续做。”比如说有些人造了不善业以后，他想弥补不善业，或者持戒的时候不够清净，出现追悔，希望未来的戒能持的更清净。或者该布施、该恭敬的没有做到，觉得应该去做。因此为了中断不善行而有善思生起于心，而去造作、改变自己习惯的一些努力，包括布施、持戒、禅修、十种福德事、十五种行、修习观智，都是属于“前前诸不善法对后后诸善法以亲依止缘为缘”以上是从二十四缘的角度来佐证在受念处中提到的‘可依靠的受’二、受念处修行方法（一）受念处修习次第上堂课提到关于受念处到底应该如何实际修行，由于时间原因讲得有些匆忙，今天再重复细讲一下。"],[32,1921,2003,1,"帕奥西亚多在《正念之道》中提到，佛陀在《大念处经》中教导的次第不是随便安排的。在《大念处经》中的次第前部分已学习，佛陀首先教导身念处，着重于观照色法，然后才开始教导观照名法。为什么如此呢？因为如果不先观照色法而直接观照名法是很难做到的。止观行者都有这样的体会，如果你的色业处（观察你自身的色聚以及色聚破除密集以后的二十八种色法），如果色法不能够清晰地看到，去观察名法是很困难的。如果禅修者观察名法时出现困难，一般老师会教导要先回来修习色法，如果色法不清楚，再回来培养定力，修习四界差别，把色法看得很清楚，然后在心所依处观察名法，这时候才能够清晰地观察名法。"],[32,2003,2095,1,"如果止禅行者本身的禅那定力足够，是很好的。对他来讲不观照色法，直接观照禅那名法不困难。如果不是观照禅那名法而观照六门欲界的名法，比如眼门心路过程、耳门心路过程，这时如果不先观照色法，同样也是看不清楚欲界的六门心路过程的。因此帕奥西亚多强调，如果要修习受念处的人，首先应当修习身念处，先观照究竟色法，然后再开始观察受 （名法） 。为什么在此特别强调呢？因为现在佛教界里面，很多人直接从受开始观，在此并非评价他人对错，根据《大念处经》或《清净道论》，修习次第是先修色法再修名法。但对于在概念法上观察以便实践如理作意的人来讲，也是可以观察生起的受是六种的哪一种，是有依靠欲爱结缚的还是没有，生起的因是什么？应如何断除。"],[32,2094,2185,0,"（二）色业处之修行方法色法有三种修行的方法，佛陀教导色业处时，有教导四界差别的简略法和详尽法，上堂课已提到，不再细说哪几部经涉及相关内容。《清净道论》中有非常详细的解说，禅修者可以选择任何一种（简略法和详尽法）来修习四界差别。（三）名业处之修行方法佛陀在教导名业处时，有三种修习方法：第一、先观照触；在观照名法时，如果你的观智能很清楚地观照触，就先观照触，然后再去观照受、想、思等相应名法。第二、先观照受；如果你的观智能很清楚地观照受，可以先观照受，然后再去观照和受相应的其他名法。"],[32,2182,2286,1,"第三、 先观照心识；如果你的观智能够很清楚地观照心识，可以先观照识，然后再去观照与识相应的其他名法。修习名业处时，首先必须观照门。什么是“门”？有六门：眼门、耳门、鼻门、舌门、身门、意门。如果尚未观照“门”，即对眼净色、耳净色、鼻净色、舌净色、身净色和心所依处色（意门生起之处）无法观察清楚，就观察六门的名法，最多可能会有些体会，将无法观察清楚。比如说：“感受我知道，身体的感受，脚痛，头痛，身体的感受我觉得可以体会。”或者说“我生气了，生气到心痛”“我很忧虑”等感受你觉得可以体会，但是你观察六门，眼睛看到颜色时，你体会不到眼识、领受、推度、确定心里的受。如果不能在六门里观察色法，那么观察名法是很难的。"],[32,2286,2387,0,"如何才能照见六门呢？首先必须以简略法或详尽法修习四界差别直到能看到六门的色聚，分析色聚里的究竟法时就能照见六门。举例而言，如果想观照安那般那初禅的名法，应当先入安那般那初禅，出定后观察意门（有分心），当安那般那的似相出现在有分心里时，可以先观察五禅支。由于以前修习止禅时，已曾检查过五禅支，所以这时你可以很轻易地观照它们。但是这时你必须照见五禅支刹那刹那相续地生起很多次。这与查五禅支时不一样，查看五禅支时看到五禅支好像是不变， “寻”有力地让你的心转向似相， “伺”让你的心停在似相上，你是不去看它的刹那生灭的。但是在修受念处、修名法时要观察五禅支的刹那生灭，看完以后，应当由前面讲到的三种观察名法的方法，来观察触开始或受开始或心识开始的其他相应名法。"],[32,2387,2494,0,"初禅总共有三十四种名法，应当观照三十四种名法的每一个名法的特相、作用、现起、近因，然后再观每一个名法的无常、苦、无我。初禅观察完以后，用这样的能力再来观照六门的心路过程所有的名法。六门心路过程以观察眼门心路过程举例：要先对眼睛修四界差别见到眼净色，接着取旁边一个色聚的颜色作为所缘，生起一个眼门心路过程，再观察眼门心路过程的每一个心的所有名法。有些人会提到：“注释书中只谈到‘触等五项’名法，不需要管那么多。”‘触等五项’名法即触、受、想、思和识。《复注》则非常详细地对‘触等五项’作出说明：受是受蕴，想是想蕴，触与思是行蕴，识是识蕴，总共是四种名蕴。观照名法之前先观照究竟色法是色蕴，因此总共合起来是五蕴。"],[32,2494,2570,0,"在五蕴当中，行蕴里有五十种名法（扣除了受和想），而其中以触和思最明显（在五十种名法里）。说到最显著的名法时，其余的名法其实也都包括在内。为什么呢？在《阿毗达摩•分别论》中提到：即使佛陀在叙述行蕴时，他也只强调思心所（思就是行），以此来说明行蕴，因此在《义注》里也只以‘触等五项’来涵盖所有的名法。观照触等五项名法之后， 应当如此思惟： “这五项名法靠什么生起呢？”因此可以了知：“它们依靠依处而生起。”因为对五蕴界的生命来讲，心识的生起都要有依处，六门都要有依处。"],[32,2570,2648,1,"什么是依处？依处就是所生身。在《沙门果经》中有说明：“心识靠依处而生起，系属于依处。”依照经典教导的方法，四大种色和所造色合称为依处，也称为所生身。经教法与论教法略有不同，经教法是实际修行时观照的法，而论教法则是在解释精确的含义。根据《阿毗达摩》，眼识只依靠眼净色而生起，耳识只依靠耳净色而生起，鼻识只依靠鼻净色而生起，舌识只依靠舌净色而生起，身识只依靠身净色而生起，意界和意识界只依靠心所依处色而生起。因此只有这些各别的色法才能称为依处，四大种色和其他所造色不能说是依处。"],[32,2648,2772,0,"然而在实际修行时如果要观察眼净色，必须也观照与眼净色俱生的色法，也就是眼净色十法聚里面的：地、水、火、风、色、香、味、食素、命根色和眼净色。因为眼净色不能单独生起，它也是四大所造色，它必须和其他俱生色法同时生起，成为一粒色聚。因此必须分析眼十法聚里所有的16四大和四大所造色，这时才能够更清楚地照见眼净色（眼门）。眼净色是如何依附于四大而存在，就能够清楚地被观察到。其他五门的净色也是同样的道理。在眼睛里并非只有眼十法聚这种色聚而已，在眼球里面还有身十法聚、性根十法聚、心生八法聚、时节生八法聚和食生八法聚。这六种色聚当中合起来有五十四种色法，在《智慧之光》中称有六十三种色法，为什么呢？命根九法聚作为单独的色聚存在，是可以被观察的，所以有六十三种色法。你应当观照所有这些色法，其他五门的情况以此类推。六门心路过程是名法，包含四种名蕴，六门里的色法是色蕴，因此只有名色法存在而已。在这里，禅修者观察名法和色法，心里会生起这样的作意： “色是色蕴，名是四种名蕴。"],[32,2771,2857,1,"”这里具足五蕴。离开名色就没有五蕴；离开五蕴就没有名色。然后禅修者观照五蕴的起因 （缘起），他见到由于无明、爱、 取、行、业生起，所以五蕴生起。从那个时候起，他安住于透彻的智慧，了知五蕴只是缘及缘生之法，没有众生、男人、女人的存在，纯粹只是一堆行法而已。他观照缘生的名色法及其因为无常、苦、无我。禅修者遇到良师，有好的教法，有适当的气候、食物，通过精进努力和坚定决意，精进地修行，可以到达观智的顶峰，证得阿拉汉。这是根据《义注》和《复注》讲到的观察名业处：先观察受或观察触或观察识，有三种不同根性的人证悟阿拉汉果的方法。"],[32,2857,2932,1,"上述提到四种适当的因素：良师、好的教法、适当的气候、食物。适当的气候和食物对修行而言很重要，在太热或太冷的气候里都不容易维持良好的定力。良师非常重要，如果老师教导的方法错误，学生修行的方法也错误；如果老师教导的方法正确，学生修行的方法也正确；如果老师教导的方法深入、细致、因材施教，能根据学生的特点来教导，学生将会获得很大的利益。适当的教法指，不能够仅仅只埋头苦修，也必须听闻佛陀有关四圣谛、缘起、八正道等教法，这也很重要。"],[32,2932,3030,0,"如果具备这四种适当的因素，而且精进地观照诸行法为无常、苦、无我，观智成熟时能证悟圣道与圣果。（四）受念处的特点将前面这段内容归纳， 修行有两个业处：色业处和名业处。色业处有两种修法：四界分别观的详尽法和简略法。名业处有三种修法： 1.先观照触2.先观照受3.先观照识（心识）。我们必须知道，如果先观照受并不代表其他不需要观照，观照受不应当只是观照受而已，也应该观照其他相应名法，这称为受念处；如果先观照识，不应当只是观照识而已，也应该观照受、触等其他相应名法，这称为心念处；如果先观照触，不应该只是观照触而已，而应该同时观照识、受等其他相应名法，这称为法念处。这三种念处加起来，再加上必须先修行的色法（身念处），合起来是四念处。"],[32,3030,3170,1,"在此， 当世尊开示观照名法的法门时，他谈到受。当他谈到触或识时，对于某些禅修者来讲，可能禅修目标是不明显、暗淡的。为什么呢？因为受的生起很明显，乐受和苦受的生起是很清楚的。当乐受生起而且遍布、洋溢全身时，比如证得禅那，佛陀说：离生喜乐，其身被喜所遍满、浸润，遍布全身，你会由衷地感觉：“啊！真的是很快乐。”当苦受生起时，我们这两天带一帮孩子们禅修，发现孩子真的比大人强很多。今天第三天，其实是两天半，前天下午才开始。前天下午所有人都喊痛，一坐是半小时，昨天下午有一半的人说：“可以克服痛。”每一坐加到一小时。今天，一坐加到一个半小时。没有一个孩子站起来，坚持着坐下来，九个孩子只有一个孩子说无法忍受，而且这无法忍受还是最后十分钟，其他的孩子说：“我可以面对它，可以观察它；一观察它，它就灭掉；一观察它，它就灭掉。”"],[32,3170,3284,1,"苦受遍布全身， 所有人会觉得痛，但是这种痛在禅修时可以依靠。苦受是明显的，我问孩子们：“你当时很痛的时候，在忍受的时候能够觉知呼吸吗？”孩子们回答说：“很难，我一觉知呼吸就被它拉走了，一觉知呼吸就被它拉走了。”为什么呢？因为苦受非常明显，乐受明显，苦受更明显。上堂课讲到，不明显的受是不苦不乐受的生起，不苦不乐受的生起是不清楚的。在日常生活中， 如果是身体的不苦不乐受， 佛陀说“这是乐受。”但是你在修观的时候，不苦不乐受不容易被体会到， 可以透由这样来观察：不苦不乐受存在于乐受和苦受消失的时候，籍着与乐受和苦受作比较，就能够知道不苦不乐受的存在。"],[32,3264,3379,1,"（五）沙利子尊者如何证悟阿拉汉最后引用沙利子尊者证悟阿拉汉的方法，再来回顾受念处。在佛陀对沙利子尊者的外甥（长爪梵志）讲《长爪经》时，沙利子尊者证得阿拉汉果，而长爪梵志证得了初果（《中部》第七十四经）。长爪梵志20的指甲留得很长，是修婆罗门教的。但是他的族姓叫火吠舍（Aggivessana） 。在这部经里，佛陀首先开示四界分别观的简略法，再开示名业处，教导从受开始观照名法。所以这部经也翻译成《受摄受经》。"],[32,3379,3480,1,"佛陀在成佛之后第一个雨安居中教导很多比库禅修。在那次雨安居当中，有五十多位比库证悟阿拉汉果。雨安居结束后佛陀前往他成道证悟之前六年苦行时所住的伍卢韦喇林（Uruvelā）。在那个林中，佛陀度化伍卢韦喇咖沙巴（Uruvelā-kassapa）、伽耶咖沙巴（Gayā-kassapa）、那提咖沙巴（Nadī-kassapa）三兄弟及他们的一千名弟子。在佛陀的教导下，他们全部都证悟阿拉汉。佛陀在一千多位阿拉汉的陪同下前往王舍城，因为佛陀在修行之前曾经遇到王舍城的国王宾比萨拉王，当时宾比萨拉王邀请佛陀一起做国王，佛陀没有接受，于是宾比萨拉王说：“如果你修成了，请先来度我。”佛陀应约去王舍城拜会宾比萨拉王。那时候沙利子尊者和马哈摩嘎喇那尊者还是外道，在修外道法。"],[32,3480,3543,0,"佛陀到达王舍城大约两周左右，有一天沙利子尊者遇到佛陀最初在鹿野苑初转法轮时度化的五比库当中的阿沙基尊者（Assaji，以前翻译为阿说示）， 他听Assaji 尊者讲说一首关于四圣谛的偈颂： 对于一切因缘所生法，如来讲说彼法之因缘，以及彼法如何地灭尽，这是大沙门所说之教。以前翻译成“诸法因缘生，诸法因缘灭，我佛大沙门，常作如是说。”不是非常准确，准确的翻译是： 对于一切因缘所生法，如来讲说这个法生起的因缘，以及这个法及其因如何地灭尽，就是苦集灭道四圣谛。"],[32,3543,3600,0,"听到这首偈颂的前两句时，沙利子尊者证得初果。回去之后他将此偈颂告诉 Mahāmoggallāna(目犍连）尊者，目犍连尊者听完后也证得初果。因此他们回到外道老师那里商量，建议老师也学佛陀的法，老师拒绝了。于是他们两人带领二百五十名弟子一起来到竹林精舍拜见佛陀，佛陀为他们及二百五十名弟子开示四圣谛的法，闻法之后二百五十名弟子全部证得阿拉汉，但是沙利子尊者和目犍连尊者没有证得阿拉汉，还是初果。他们跟随佛陀出家，成为善来比库。"],[32,3600,3683,1,"Mahāmoggallāna 尊者在出家一周后证得阿拉汉果，沙利子尊者出家半个月后证得阿拉汉果。沙利子尊者是如何修行的呢？他修行观禅的方式是分别法观禅或称为逐一法观禅。他在观照究竟名色法时，逐一逐一地观察每个法为无常、苦、无我。比如他先入初禅，出定后逐一地观照初禅里的名法。通常初禅里有三十四个名法， 例外的情况是悲心禅和喜心禅的初禅各有三十五个名法 （即加上悲悯心所或随喜心所）。沙利子尊者先观照心识为无常，再开始观察触、受、想、思、一境性、名命根、作意……一一地观察为无常。如此观照时，他能够非常清楚地观到名法的生、住、灭，三个小刹那都能看到，他的智慧能到达这个层度。为什么他能够如此清楚地观照名法？《义注》里解释说："],[32,3684,3771,0,"“因为他在观照名法时也观照依处与所缘。”例如当他想观照安那般那初禅的名法时，从初禅出定后先观照有分心（意门），然后观照安那般那似相（所缘）。当安那般那似相出现在有分心时， 他才开始逐一地观照初禅名法为无常、苦、无我。这是非常宝贵的方法，大家以后修观时可以向沙利子尊者学习，按照这样的方式来观。沙利子尊者以此方法从初禅开始，一直观照到无所有处定，但是当他观照非想非非想处定时，无法逐一地观照非想非非想处定的名法，只能整体地观照非想非非想处定名法为无常、苦、无我，因为它们非常微细。如此，他在半个月当中精进地修习止禅和观禅。渐渐地，他的五根达到成熟。为什么呢？因为他具有充分的巴拉密，在一个阿僧祇劫加十万大劫之前，他得到了最上见佛（Anomadassī Buddha）的授记，将会成为释迦牟尼佛的上首弟子。"],[32,3771,3847,0,"在最上见佛出现于世间之前，他已经在更早的过去佛的教化期中修习止禅和观禅，以期望能够被授记将来成为上首弟子。得到最上见佛授记之后，在一个阿僧祇劫加十万大劫的时间里，他也尽可能修习止观达到行捨智阶段。我们为什么会知道这种情况？因为他将会证得阿拉汉果和四无碍解智，并且成为Gotama 佛陀的上首弟子。对于想在证悟圣果时也得到四无碍解智的人，必须曾在过去佛的教化期中培植四种因，其中一种就是先前的修行，意即曾经在过去佛的教化期中修习止观到达行捨智。因此沙利子尊者不止在最后这一世修行，而是在过去佛的教法中就已曾修行达到行捨智。这些就是巴拉密。最后这一世他也是修习止观达到行捨智，之前他的五根尚未成熟，一直到他出家半个月后五根才到达成熟。"],[32,3847,3966,0,"那一天，佛陀用过午餐后与沙利子尊者前往灵鹫山的猪掘洞，当他们坐下时，长爪梵志就来了。过去长爪梵志与舅舅（沙利子尊者）一起随外道老师学习， 但是当沙利子尊者到竹林精舍出家时，长爪梵志并没有跟着去。他等沙利子的消息等了半个月，但是不见沙利子尊者回来，所以就到竹林精舍找舅舅。因为他深知舅舅的智慧非常高超。沙利子尊者在出家之前就一直在寻找什么是不死，只要听说哪位导师教导到达不死的方法，就一定会去找那位导师。但是几天以后他就会回来，因为那位导师的教法不能令他满意。然而这一次沙利子尊者去竹林精舍已经过了半个月还没回来，长爪梵志就很想知道到底是什么原因，所有他前来找佛陀和沙利子尊者。当时佛陀坐在洞中，沙利子尊者站在佛陀背后， 用扇子为佛陀扇风，长爪梵志就来了。当时长爪梵志持有断灭见，所以他问佛陀关于断灭见的问题。佛陀使他放弃断灭见之后，开示这部《长爪经》（《受摄受经》）。首先佛陀以简略法开示色业处（修习色法），然后开示受念处。《义注》中引用这段受念处的经文。经文内容如下："],[32,3966,4020,0,"佛陀说：『火吠舍，当一个人感到乐受时，他不会感到苦受或不苦不乐受，只会感到乐受；火吠舍，当一个人感到苦受时，他不会感到乐受或不苦不乐受，只会感到苦受；当一个人感到不苦不乐受时，他不会感到乐受或苦受，只会感到不苦不乐受。』佛陀为什么这么说呢？因为在一个心识刹中不会有两个心同时生起。同样地，在一个心识刹那中不可能有两个触、两个受、两个想、两个思等同时生起，而只能有一个心、触、受、想、思等生起。因此在乐受生起的心识刹那里，苦受和不苦不乐受不能够生起；在苦受生起的心识刹那里，乐受和不苦不乐受不能够生起；在不苦不乐受生起的心识刹那里，苦受和乐受不能够生起。"],[32,4020,4085,0,"当佛陀如此开示时，沙利子尊者和长爪梵志都能够很清楚地了知。为什么呢？因为在开示受念处之前，佛陀先教导他们观照色法，佛陀讲到色法，他们的定力足够能看到究竟色法，那时候他们能够清楚地照见。佛陀开示受念处时，他们也能够清楚地观照到受和受相应的名法。由于沙利子尊者那一生已经证悟初果，了悟四圣谛，并且修行止观半个月之久。前面说到，沙利子尊者是逐一地观察每一个名聚里面相应的名法，因此他了解受不能单独生起，只能与相应名法同时生起。而长爪梵志具备充足的巴拉密，为什么呢？他是广演知者，听完佛陀开示一部大经就能够证悟涅槃，因此他也能清楚地了解佛陀的开示。"],[32,4085,4148,0,"佛陀继续说：『火吠舍，乐受是无常的、有为的、缘生的、败坏法，坏灭法、衰离法、灭尽法。』在这里，佛陀说：「乐受是无常的。」这就包括观照乐受为无常、苦、无我。然后佛陀说：「乐受是有为的、缘生的。」这就是要修行缘起法以观照乐受的因，亦即观照苦的因。那时沙利子尊者和长爪梵志都能观照受及与受同时生起的相应名法，同时观照到受生起来的过去的缘起法，同时观照这些名色法和缘起后面的因为无常、苦、无我。佛陀继续开示说：『火吠舍，苦受是无常的、有为的、缘生的、败坏法，坏灭法、衰离法、灭尽法。火吠舍，不苦不乐受是无常的、有为的、缘生的、败坏法，坏灭法、衰离法、灭尽法。"],[32,4148,4196,0,"火吠舍，善学的圣弟子如此知见之后厌离乐受、苦受与不苦不乐受；由于厌离，所以他远离欲染；由于远离欲染，所以他得到解脱；得到解脱之后，他如此了知：‘生已灭尽，梵行已立，应做皆办，更无后有。’』佛陀开示完整部经之后，长爪梵志证得初果，沙利子尊者证得阿拉汉。《义注》中说：沙利子尊者犹如饱餐一顿为他人准备的食物一样。为什么呢？因为佛陀讲这部经的对像是长爪梵志，然而由于沙利子尊者在背后为佛陀扇风，顺便听闻而证得阿拉汉果。"],[32,4196,4262,0,"大家也听完了，显然我们没有证果，证果不是那么容易。沙利子尊者已经以一个阿僧祇劫加十万大劫的时间累积巴拉密，这是他最后一生，他还精进地修行止禅和观禅半个月，直到观智和五根逐步成熟。三、更高的观智阶段当我们修习受念处时，首先应当观照究竟色法，然后应当观照受和所有的相应名法，六门心路过程都必须观照。六门心路过程里的速行心可能是善的或不善的，我们必须都观照。观照究竟名色法之后，进一步应该如何修习呢？佛陀如此开示：『如此，他安住于观照内在的受为受、安住于观照外在的受为受、或安住于观照内在与外在的受为受。』在这里必须观照内在与外在的究竟名色法，而且特别注重观照内在、外在的受。接着佛陀开示下一个阶段："],[32,4262,4327,1,"『他安住于观照受的生起现象、安住于观照受的坏灭现象、或安住于观照受的生起与坏灭现象。』在这个阶段必须观照两种生灭：因缘生灭和刹那生灭。在观照因缘生的时候，无明、爱、取、行、业这五种是过去因，除此之外还应当观照现在的因（之前其他的业处里都讲过了）。在色蕴当中，过去世的五种因只是针对业生色法而已，业生色法由过去世的业力所产生；然而对于心生色法而言，心是它们的因；对于时节生色法而言，先前色聚里的火界是它们的因；对于食生色法而言，先前色聚里的食素是它们的因。"],[32,4325,4376,0,"对于名蕴而言， 可分成两类：果报名蕴和非果报名蕴。非果报名蕴包括善法、不善法和唯作法。对于果报名蕴而言，必须先观照它们的过去五种因（无明、爱、取、行、业）和现在因（近因）。举例而言，如果没有依处，名蕴就不可能生起（心不可能生起），因此依处是名蕴的一种因；如果没有所缘、没有目标，名蕴也不能生起，因此所缘也是一种因；如果没有触，名蕴也不能生起，因此触也是一种因；如果没有作意，名蕴也不能生起，因此作意也是一种因；除此之外，依照不同的情况还有不同的因。对于非果报名蕴而言，不需要观照过去的因，只需要观照现在的因。"],[32,4376,4460,1,"在这个阶段，你必须观照：由于因生起，所以五蕴生起；由于因完全灭尽，所以五蕴完全灭尽，这是因缘生灭；然后还必须观照五蕴及其因都是一生起之后就立即坏灭，这是刹那生灭。必须观照这两种生灭。对于非果报名蕴，不用观照过去因，但是要观照非果报名蕴，就是面对善和不善果报，你如理作意还是不如理作意，这个因要观察。下一个阶段是：『或者他建立起‘有受’的正念只为了更高的智慧与正念。』这个阶段包括从坏灭随观智到行捨智这些上层观智。佛陀接着开示说：『他独立地安住，不执著世间的任何事物。诸比库，这就是比库安住于观受为受的方法。』如果有系统地观照五蕴而且注重在观照受，观智成熟时你就会证悟圣道圣果。逐级地依圣道圣果断除烦恼，证悟阿拉汉果之后就能独立地安住，不执著于一切五蕴。这是受念处。"],[32,4460,4536,0,"现在大部分的人没有观智，没有观智者可不可以观察受呢？显然，在日常正念正知的时候，可以观察受。受是什么呢？以前讲过，受其实是果报评价体系：可喜所缘出现，大部分人接触就会有好的感受，不可喜所缘出现就会有不好的感受。什么是可喜所缘和不可喜所缘呢？是你的果报产生的，所以受是面对果报作出评价的基础。果报评价中心或果报评价体系包括两个部分的评价，一部分是果报产生以后身体的体验，比如说表现为身体的苦受和乐受，这是表现为身体的体验；另一部分是心的体验，心的体验是对果报的态度。"],[32,4536,4673,0,"所以受的果报评价是两个方面，一个是身体的体验的评价，一个是心的体验的评价。心的体验是对果报的态度。具体表现为，回到以前一再讲的内容，就是两种机制：鼓励机制和奖励机制。鼓励机制和奖励机制与物种相续流和名色相续流这两者所形成的力量相关。同样地，当一个没有观智的人感受身体的受或者感到心的受，能不能正确地有正知（当我们身体有苦受或乐受的时候，我们能不能知道这是果报），苦受是不善果报，是由过去的不善业造成的。乐受时不用太得意，这是过去的善果报成熟，成熟以后就会灭去。因为业就是就样，所有感受也是这样，好的感受不要执取，不好的感受不要排斥，如实地观察它。由于没有开始练习六支舍，导致对果报采取行动，不是贪就是瞋，这时候就表现为心的受：悦受或者忧受。如果前面依止于可依靠的六种受时，生起善法相应的速行，也是一种心的体验，这时候能不能观察心的悦受或者忧受或者不苦不忧受？我们对果报釆取了什么样的行动？是如理作意还是不如理作意？"],[32,4673,4769,0,"如理作意，善法生起来了，因为有信或者念；不如理作意，不如理作意已经产生速行（速行就是不善业形成了），不善业已经是造业了，如果按照心路的（即刹那的）十二缘起支，属于业轮转，心造业。造业一定跟烦恼相关，烦恼无外乎无明、爱、取，因为无明、爱、取、行、业，这个时候能不能看到无明、爱、取呢？也就是看到三颠倒，看到稻草人。日常可以从这个角度来观察。同样地，日常，睁眼四圣谛、睁眼八正道或者睁眼的受念处，同样都要从身念处练习开始，如果对于每一个身心的当下不能觉知，比如走路时不知道在走路，吃饭时不知道在吃饭，洗碗时不知道在洗碗……，而能清晰明确地观察到身体的受且对受有了知，同时能观察心的受且对受有了知，且能够提升正念正知，是很难的。"],[32,4769,4849,1,"睁眼四圣谛、睁眼受念处，在概念法上的受念处也是要从对身体的观察开始。今天的课就到这。回向功德！"],[33,0,153,0,"186讲-摄集-摄菩提分-心念处古源尊者礼敬尊敬的祜巴大长老，各位尊者、各位尼师、各位贤友，晚上吉祥!前面几堂课学习了身念处和受念处，今天学习心念处。『诸比库，比库又如何于心随观心而处呢？诸比库，于此，比库有贪心了知有贪心，离贪心了知离贪心；有瞋心了知有瞋心，离瞋心了知离瞋心；有痴心了知有痴心，离痴心了知离痴心；昏昧心了知昏昧心，散乱心了知散乱心；广大心了知广大心，不广大心了知不广大心；有善心了知有善心，无善心了知无善心；得定心了知得定心，无定心了知无定心；解脱心了知解脱心，未解脱心了知未解脱心。』这段经文讲到的十六种心都是世间心，不涉及出世间的心。因为对于心念处，我们要观察所缘的无常、苦、无我，而出世间心不涉及无常、苦、无我的本质。所以心念处的练习只适合于针对世间法，不适合于出世间法。"],[33,153,288,0,"一、十六种心的分类（一）有贪心、无贪心1. 心的两种理解方式十六种世间心，第一种是“有贪欲的心”，有贪欲的心是指和贪欲同时生起的八种欲界贪不善心。贪是一种心所，它存在于与贪相应的心，它跟同名聚的心识和相应的心所同生、同灭、同所缘、同依处。如此与贪欲紧密结合的心称为有贪欲的心。对此，有两种理解方式，一种理解方式：这是一个名聚——心以及包含了贪在内的心所组成的名聚；还有一种理解方式：它是一个心识——这个心识是被欲贪所染污的。比如八十九种心中的悦俱贪邪见相应一心，这个心指的就是心识，它并不包含与其相应的遍一切心心所、杂心所、贪、邪见、痴、无惭、无愧、掉举、…，它只是指心识。但是这个心识是跟这些心所一起生起来的，因此它具有贪的特性，这个心识的能知是跟贪邪见相应的，要这样来理解。"],[33,288,447,1,"2. 何为邪见对于修习观智的人而言，他只观察这个心识；对于没有观智的人而言，只能感知那一团、那一堆与贪相应的心的感觉。根据《阿毗达摩藏》，有八种心以贪为根而生起，称为贪根心。贪根心的特点是，凡是对所缘起黏著的心都是贪心。八个贪根心中有四种与邪见相应，另外四种与邪见不相应。比如大家在听法时，相信真的有一位古源尊者在讲法，就是邪见。根据究竟法而言，并没有一位真实的古源尊者，只有究竟名色法存在而已。这些名色法一生起就立即坏灭，一秒钟内有几十万亿次生灭，因此并没有一个稳定恒常的古源尊者存在。如果误认为名色法组成的这一团东西就是古源尊者，那就是一种邪见。如果看到上文的图片想：“啊！这一箱是金条！这一箱金条是真是存在的！”就是一种邪见。如果对金子修四界差别，将会看到只是色聚而已。分析那些色聚之后，会看到每一粒色聚中含有八种究竟色法，它们是由先前色聚中的火界产生的，因此称它们为时节生色法。这些色法都是一生即灭，因此它们是无常的，并没有恒常的金条存在。认为有真实的金条存在是一种邪见，当你存在这种邪见而执著金条的时候，就会生起与邪见相应的贪根心。"],[33,447,564,0,"当能修行观禅时，观察这个金条的究竟色法时，对金条就不会有邪见。如果系统地对金条修四界差别，就能够看到它的究竟色法，了知它们为无常、苦、无我。如果不能够对金条修行观禅，那见到这么多金条时，就还是会执著它。如果知道金子只是色法，也没有这是我的金条、那是他的金条的分别，但还是执著、觉得喜欢，就是邪见不相应的贪心。如果认为这一箱金条都是自己的，觉得自己很富有，然后生起一种很满足的快乐的感受，这时候生起的就是悦俱贪邪见相应的心。但如果你家金条太多了，满金库都是，看到金条也就没什么感觉，这时候生起的就是不苦不乐受的舍俱的贪相应心。另外还可以根据贪是主动生起还是被动生起来进行分类，也就是有行和无行，加上前述的有邪见和无邪见、悦俱和舍俱，总共可以将贪根心分成八种。"],[33,564,650,0,"“没有贪欲的心”可分为三种：世间善心、世间果报心和世间唯作心。“没有贪欲的心”一词是用来表达与“有贪欲的心”相对比的意思，而不是相反的意思。贪心所和无贪心所是两个独立的心所，它们并不是一一对应的。在了解心念处之后，就会清楚地知道这一点。修习心念处或者四念处，必须观照三界中的一切法以培育无常、苦、无我的观智。就世间心而言，并没有灭除潜伏性的贪欲，因此“没有贪欲的心”只是指贪欲暂时不生起的一种心理状态而已，而不是指已经证悟三果以上的圣者。"],[33,650,787,1,"（二）有瞋心、离瞋心有瞋心是指以瞋为根而与忧受相伴生起的主动或被动的心。瞋根心和贪根心有很大的差别，瞋根心的特点，是排斥所缘。所以贪根心和瞋根心很容易区别——贪根心就是黏著，瞋根心就是排斥。“愁悲苦忧恼”都是瞋根心。比如你对一个人生气了，再次看到他的时候，就会立即生起排斥的心——“不喜欢他！很讨厌他！”这是主动的瞋根心。还有一种情况，平时你们是淡淡的朋友关系，甚或是好朋友，但是有人来挑拨：“这个家伙，昨天晚上说你如何如何……”，听完以后，“啊？真的啊？！”怒从心头起，恶向胆边生，生气了！这个生气是受人怂恿，是有行的（被动的）瞋根心。或者你本来对一个人没有贪、瞋，无所谓，但当你去关注他说话的语气，观察他的言行举止，然后想：“他这样说话是不是恰当？这样的言行举止是不是恰当？”来回对照，找各种标准，最后得出来这是不恰当、是与“标准”相违的结论，生起排斥的心。这一类也是属于被动的瞋心。"],[33,787,871,0,"离瞋心分为三种，世间善心、世间果报心、世间唯作心。什么是世间善心？当我们恭敬三宝，心中生起的是欲界善心；当我们布施、持戒、修行止禅到达安止定之前的阶段时，如专注入出息心中没有打不善妄想的时候，生起来的都是欲界善心。当我们修行止禅到达禅那时，心中生起的是色界和无色界的善心，也即是广大心。什么是世间果报心？结生心、有分心、死亡心，五门心路过程里的五识、领受、推度、彼所缘心都是世间果报心。什么是世间唯作心？在五门心路过程里的五门转向心和确定心都是世间唯作心。世间唯作心有区别于阿拉汉的唯作速行心，是指五门转向心、确定心（包括意门转向心）。"],[33,871,980,1,"（三）有痴心、离痴心有痴心是指以痴为根的心识，分为两种，一种与疑相应、一种与掉举相应。没有痴根的心，同样是分为世间善心、世间果报心和世间唯作心。两种瞋根心与两种痴根心不牵涉在有贪欲或没贪欲的心的分类法中，它们是另外归类的。八种贪根心、两种痴根心，也不牵涉在有瞋根或没有瞋根的心的分类法中。然而由于所有的不善心中都有愚痴，所以有痴心也包括八种贪根心及两种瞋根心在内。因此所有十二种不善心都包括在有痴或没有痴的这种分类法中。当修行有痴心时，这十二种不善心都必须观照（观察有痴心）。观察离痴心时，心中生起的所有世间善心、世间果报心和世间唯作心也都必须观照。"],[33,980,1066,0,"（四）昏昧心、散乱心昏昧心是指落入昏沉和睡眠的心，由于对目标缺乏兴趣以及或多或少的不乐意（有排斥），所以心变得松懈、退缩，因此也翻译成“收缩的心”。这是指欲界五种被动（有行）的不善心。比如上街看到一件衣服，本来没有什么兴趣，但是导购小姐一再地推荐说：“哎呀，这件衣服就是给你定做了，太好啦。”对方反复怂恿后，你买下来了，这就是被动的心。尽管如此，你对这件衣服执著心并不是很强，这被称为有行的贪根心。有时候我们的瞋心并不是主动生起，就像前文提到是由于别人怂恿、挑拨才生起，这种称为被动的瞋根心。被动的不善心共有五种（四贪一瞋），它们被称为“昏昧心”。"],[33,1066,1237,0,"散乱心是指和掉举同时生起的心，因为它透过胡思乱想而在本来应当注意的目标之外四处游荡，所以被称为散乱心。比如在修习入出息念时，心总是不能安住在呼吸上而到处攀缘其他目标，这就是散乱心。所有的不善心都与掉举相伴而生。（五）广大心与不广大心广大心是指色界心和无色界心。经过系统地修行入出息念，可能证得初禅、二禅、三禅、四禅，这四种禅那心就称为色界心。如果以入出息念为基础而转修三十二身分，再以三十二身分为基础而转修青、黄、红、白这四种色遍而达到初禅、二禅、三禅、四禅，这些初禅到四禅的禅那心也都是色界心。如果以色遍的第四禅为基础，再捨弃色法，通过照见这个遍相里面的空间，次第地修行空无边处定、识无边处定、无所有处定、非想非非想处定。这四种无色界定心就被称为无色界心。色界心和无色界心都被称为广大心。称它们为广大心的原因之一，是因为它们能够降服烦恼，产生大的果报，以及具有广大的认知范围。证过禅那的人都有感觉，当证得禅那时会觉得心很广大，与专注一个目标或者心里在想一个事很不一样。当我们有定力的时候可以开发神通，当你有天眼通的时候，将能够观察到三十一界的生命形态，我们的认知范围就会从人间扩大到三十一界；"],[33,1237,1358,0,"原因之二，由于你有崇高的投生意愿，要投生到无色界的梵天界，所以称它们为广大心。由于在世间中，没有比色界心和无色界心更高级的心，所以注释的论师就以世间里上等的这两种心来解释广大心。如果安住于任何一种禅那中一个小时，则在这一小时里能够降服烦恼，不使烦恼在心中生起。如果在临死时还能够维持禅那不退失，那么该禅那就能使你投生到相应的色界天或无色界天。所以说，广大心能够降服烦恼以及产生大的果报，因此禅那心被称为广大心。不广大心是指欲界心。在照见究竟名法时，我们必须观照六门心路过程，其中的前五门心路过程生起的全都是欲界心。而意门心路过程中，禅那意门心路过程则含有色界心和无色界心（广大心），除此之外的其他的意门心路过程都属于欲界心（不广大心）。（六）有上心与无上心有上心是指欲界心，意思是还没有达到世间最高层境界的心，或者还可以再提升的心。"],[33,1358,1455,0,"无上心是指色界和无色界的心，它们已经达到世间最高或最圣妙境界的心。与广大心和不广大心有点像。（七）得定心与不得定心得定心和不得定心，也有翻译成专一的心和不专一的心。得定心是指具有近行定或者安止定的心。不得定心是指没有近行定或安止定的心。（八）解脱心与未解脱心这里的解脱心和未解脱心所说的“解脱”，不是指已经解脱了烦恼，而是指透过如理作意而从烦恼中暂时解脱，或在安止定中透过降伏困扰性的烦恼而暂时解脱。如果禅修者能够安住于禅那中一个小时、两个小时，在这期间心暂时解脱了烦恼。而在入定以外的时间里，有时会遇到能促使烦恼生起的情况，那个时候如果一直保持如理作意和念与正知，就不会生起烦恼，那也是使心暂时从烦恼中解脱。"],[33,1455,1588,0,"未解脱心是指没有上述这两种情况的心，即贪嗔痴相应的心。这些都是属于世间的心，在世间道中，并没有透过正断断、止息断与出离断而达到出世间的解脱。二、依心路过程观照心和心所如上所述共有十六种世间心。如果禅修者是止行者（修习止禅），在修习心念处时这十六种心都必须被观照到。观照它们的时候必须依照心路过程来观照，应当在每个心识刹那里都能够照见心和心所。为什么呢？你可以注重在观照心，但是心识不会单独生起，它必须与相应的心所同时生起，因此在观照心时也必须同时观照在同一个心识刹那中生起的其他心所。心有两大类，一类是心路过程心（路心），还有一类是离心路过程心（离路心）。在这个阶段我们只需要观照心路过程心，因为只有修行到缘起的时候才需要观照离心路过程心。心路过程心会依照心的定则而以一定的顺序生起。心路过程分为六门，它们取各自的目标而生起，即颜色、声音、气味、滋味（味道）、可触物和法所缘。我们必须观照这六门心路过程中每一个心识刹那的心和心所。"],[33,1588,1662,1,"但必须记住，在修习心念处之前必须先观照究竟色法，并依照如下四个步骤来完成。第一步，观照到究竟色法。第二步，观照到究竟名法，依着心路过程去观照心和心所。第三步，同时观照名法和色法。第四步，能够分辨名色法里并没有我、你、人、众生等，这样的真实存在。三、更高阶段的观智接下来，佛陀说：『如此，或于内心随观心而住，或于外心随观心而住，或于内外心随观心而住。』到这个阶段就需要依照下面四个步骤来修行：第一个，观照内在与外在的色法。"],[33,1662,1745,0,"第二个，观照内在与外在的名法。第三个，要观照内在与外在的名色法。第四个，要分辨内在与外在的名色法并没有人、我、众生。具体的观照方法，在之前学习身念处与受念处时已解释，不再重复。下一阶段，佛陀教导：『或于心随观生起之法而住，或于心随观坏灭之法而住，或于心随观生起坏灭之法而住。』这个阶段禅修者必须观照因缘生灭和刹那生灭。在这里，佛陀注重于观照心，心是识蕴。对于果报心识，其远因是无明、爱、取、行、业这五种过去因；其近因和现在因则是名色。这里所说的‘名’是指与心相应的心所，‘色’是指依处和所缘，也就是心所依处和目标。"],[33,1730,1917,1,"身、受、心、法四念处，需要串起来观察。比如十六种世间心中有欲贪的心生起时，我们知道它是在五门心路或意门心路过程的速行心里。速行心生起时，它已经是在现在造业。显然欲贪心生起是因为不如理作意，而不如理作意的发生是意门转向心或五门心路的确定心整个心导致的。对于这整个心，如果去分析具体的每一个心所，承担如理作意和不如理作意的，是这两种心的胜解心所，而胜解心所是依想蕴标记来胜解。即使我们有很强的寻，比如欲贪心生起来有很强的欲寻，背后也同样是有想颠倒、心颠倒或见颠倒。这种寻和这些颠倒合起来就是无明、爱、取。因此，当我们在一条心路上观察到一个贪心时，它已经在造业了，是属于行。造业是因为贪之前有贪的动机，而这个动机就是无明、爱、取。无论这样的无明、爱、取是在更早的心路上出现过，还是依着欲寻在这一条心路上形成，都是在意门转向心或者确定心中的胜解心所来实现如理作意或不如理作意。因此，对于修观的人就必须很清楚地看到欲贪心是因为什么样的因而生起。"],[33,1917,2014,0,"在修受念处的时候，观察为什么生起这个感受。感受有果报的感受，也有“行”（行为）的感受：生起瞋心是忧受；生起悦俱贪相应的心是悦受。如果是身体的乐受或者苦受，是属于果报受；而忧受或悦受是属于造业的同时产生的内心的感受。那对于受，也要去找到与它生起相关的因，然后才能够完整地看到相关的认知行为模式，造业的模式就可以被清楚地观察到。针对性地对惯性的认知行为模式去修观，将是有的放矢的一种修观方法。举眼门心路过程生起的眼识为例，眼识的依处是眼净色，所缘是颜色。在观照依处时，根据实际修行的方法，不能只是观照眼净色，必须也观照和眼净色同在一粒色聚里的其他色法，或者在眼球里的所有五十四种或六十三种色法。"],[33,2014,2143,0,"眼识的所缘是颜色，眼识会取一群色聚的颜色作为所缘。修观时必须分析色所缘（那些色聚），观照和颜色同在一粒色聚里的其他究竟色法。眼净色及其俱生色法是依处缘，颜色及其俱生色法是所缘缘。另外还有一种缘，即就眼识而言，有七种心所与它同时生起，这些心所称为‘名’，依处和所缘称为‘色’。这里的‘名色’是眼识生起的近因。其他耳、鼻、舌、身识的因缘可依此类推来理解。观照因缘生灭和刹那生灭之后，就进入下一个阶段：『他现起‘有心’之念只是为了致于念的提升。』这个阶段就是从坏灭随观智到行捨智，到了观智的后阶段，道智就会生起。道智能够逐步地灭除烦恼，因此佛陀说：『他无所依而住，亦不执取世间的一切。诸比库，比库应如此于心随观心而住。』四、直接修行心念处的特例心念处我们就粗略地学到这里。有人曾提问，“是不是可以不观照究竟色法就直接修心念处呢？”帕奥西亚多说：“通常是不可以的，但是偶尔有特例。”这种特例都是因为过去生中有很强的巴拉密的缘故。"],[33,2143,2296,0,"在佛陀时代，有一位比库名叫Citta，我们知道Citta 就是心，因为会修心念处所以他的名字叫 Citta。在他出家达上之后，很多僧团的戒师、长老就教导说：你要先学习戒。我们知道，出家五年学戒，十年不离依止。比库的戒律非常多，据说有九百亿项。他看完、听完以后，觉得自己没有办法遵守那么多的规则和戒律，因此就向佛陀辞行说他想还俗。佛陀观察他的因缘发现他不久就能够证得阿拉汉果，并有四无碍解智。因为他曾经很多次在过去佛的教化期中修行止观到达行捨智的阶段。因此佛陀就问他：“你能不能够只遵守一项法则呢？”Citta 比库说：“如果是一项法则，我应该没有问题。”佛陀就教导他观照自己的心。于是他依照佛陀的教导而在一切的威仪中都观照自己的心，不分昼夜。如此持续地修行以后，他能够彻底地明了离心路过程心和六门心路过程心每一个刹那里的心和心所，而且也了知这些心凭借依处相关的缘而生起。他为什么能够这样来观照呢？因为有佛陀这位最善巧的导师指导，而且有过去世巴拉密的支持，使他能够有系统地观照究竟名色法及其因，然后再观照它们的无常、苦、无我。"],[33,2296,2434,0,"这样修行不久，他就证得阿拉汉果。如果现代的禅修者想这样修行也可以尝试，但是必须记住，首先要能够彻底地观照六门心路过程心和离心路过程心的究竟名色法，接着必须观照名色法的因，观照名色法及其因的无常、苦、无我。如果不能达成这样的观照，最好不要模仿 Citta 尊者。五、无观智时日常生活中的“心念处”对于没有观智的人，可不可以修心随观？可以观察心，但不是《大念处经》中佛陀所教导的真正的“心随观”。与前文我们提到过身念处、受念处一样，只是基于这些心，比如八种贪根心、两种瞋根心、两种痴根心这些心里面很明显的名法（例如贪、瞋、痴）的特相去观察一串一串或一团一团心的特征，而感受到‘我正在生起有贪的心’，‘我正在生起有瞋的心’，‘我正在生起无瞋的心’，这些是可以观察的，其中的善心和不善心是容易观察的，但意门转向心、五门转向心这样的唯作心就没有能力看到了，因为它们不容易被观察到。"],[33,2434,2586,0,"善心和不善心很容易被观察到。尤其是贪心、瞋心、怀疑、掉举心等不善心我们很容易观察到，因为它跟烦恼紧密结合的特相很明显。善心和不善心在十二缘起支的三轮转里属于业轮转，是一个造业的系统。日常心随观的意义就在于，当我们观察到自己的心生起了贪相应的心或瞋相应的心或疑相应的心，可以顺着这股心的力量去寻找后面是什么样的一个标准、动机在支撑我们生起这样的心。为什么会生起这个贪心、瞋心或者怀疑，要去看背后的那个认知标准，也就是佛陀讲的心生起的因。果报心过去生的因我们暂时看不到，但如果是当下生起的贪心、瞋心或怀疑的心，其如理作意或不如理作意的因大多都可以被观察到，至少能够看到它后面的无明、爱、取。首先能观察到执取的心“我觉得就是要这样贪、我觉得就是要这样瞋”的那股劲儿就是寻，在八正道里面就是邪思惟。顺着这股劲儿再往前找，就能找到邪见或者三颠倒，也就是无明相关的一些错误认知。"],[33,2586,2666,0,"当能这样观察到时，有两种方式可以来解决这个烦恼，一种方式：看到这个三颠倒时，知道是颠倒就把它转过来——颠倒想转成有慧想，邪见转成正见。简单来说，正见就是“一切的有为法都是无常、苦、无我的。”这是容易去转的。实在不能转时，可以尝试从世间角度上来看，比如《一念之转》中的方法，反问自己：“你抱持这样的观念，它是真的吗？对你是有意义的吗？你这样做对自己对他人有利益吗？”多反问自己几次，那种邪见就会崩塌，那种颠倒也会崩塌，这是一种方式。当见解调整过来了，后面贪心自然就不会生起，心就会如理作意了。"],[33,2666,2826,0,"还有一种方式：当你没有办法观察到这些寻和颠倒想，找不到它们时，依然可以看着心里面那一团贪或那一团瞋或疑。把注意力停在心脏位置上，你只是看着它，陪伴但不喂养它——不认同它、也不排斥它，只是如实地看着心的那团黏著或者排斥的状态或感受。一直这样看它，虽然你看不到它的无常相，但是能持续感受到心里面的变化，至少是‘感受’的变化。我经常比喻：“它就像一层一层的东西在往下脱落。”慢慢它会消失，于此同时，如果你真的正面去观察它，在心脏那个地方会感觉到清凉，到最后它会消失。当你如实看到它真的消失了，再作意它是无常的、生起是苦迫的，过程是非我、无我的。当它消失的时候，再这样作意。因为，你如实看到它真的消失了，它是无常的，它生起来的时候是苦迫的，它是无我的。这也是一种概念层面的观察，能够有效地削弱我们不善的习惯。"],[33,2826,2929,0,"修观的时候要先观察到色法，最后才能观察名法。同样在日常的时候，如果想观察心也要从身念处开始，在身念处被熟悉地训练、当念知力越来越强，慢慢地我们才可以从概念上去观察到心的状态、它的生起灭去、以及追查这个心生起背后的动机，或称为认知行为模式。接着去化解、去解除这种不善的认知行为习惯，让我们从错误的认知行为习惯的束缚里面解脱出来。这种解脱也属于解脱的心，短时间的镇伏了烦恼，不被烦恼所捆绑、俘虏的这种状态也是解脱的心。当我们一点一点地在日常生活中观察它，都能够从这里面解脱出来，就是“彼分解脱”。会让我们的五盖不断地被削弱，心越来越不受到这些烦恼影响，心能够平静，容易获得安止，最后能够如实知见，能够真实地看到究竟名色法的无常、苦、无我，到观智成熟时，我们将斩断烦恼，生起道智和果智。"],[33,2929,3007,1,"好，祝福大家能够通过精进、善巧地修行，早日获得真正的解脱。回向功德！"],[34,1,166,0,"187 讲-摄集-摄菩提分-法念处-五盖 1古源尊者各位尊者、各位尼师、各位贤友晚上吉祥！上堂课已学完心念处——十六种观察心的方法，今天开始学习法念处。法念处的第一部分是五盖。一、欲贪盖佛陀如何教导法念处呢？佛陀说，『诸比库，比库如何于法随观法而住？诸比库，于此，比库对五盖而于法随观法而住。诸比库，比库又如何对五盖而于法随观法而住呢？诸比库，于此，1）比库内心存在欲贪，了知：‘我内心有欲贪。’2）内心不存在欲贪，了知：‘我内心没有欲贪。’"],[34,166,357,0,"3）他了知未生起的欲贪如何生起，4）他了知已生起的欲贪如何捨断，5）他也了知已捨断的欲贪于未来如何不再生起。』在这段经文中，佛陀说『比库内心存在欲贪，了知：‘我内心有欲贪’；内心不存在欲贪，了知：‘我内心没有欲贪’。』这两点很重要。为什么呢？因为如果一位禅修者不能觉察自己内心的欲贪（欲贪简单而言是对五欲所产生乐受的欲求）生起，又怎么能观照它呢？在经文中，「了知：‘我内心有欲贪’」的“有”是指由于生起、熏习或一再发生而存在。所谓‘五盖’的欲贪盖，并非偶尔生起的贪，它已成为一种很明显的障碍，障碍我们修行、行持善法，像锅盖一样把我们的慧盖住。盖的形成是由于多次生起、多次熏习、且一再发生而存在，才能成为盖。之前学习‘心念处’时讲到欲贪，即使是偶尔生起的贪心也要观察；而五盖的欲贪盖的“有”是指它总是一再地发生，多次被熏习的这种欲贪 。“没有”是指由于不生起，或者透过观照，或者透由禅修的近行定或安止定来镇伏而使它不存在。所以没有欲贪是特指透过观照或者禅定来镇伏，或者如理作意而使它不生起。“没有”，并非平常痴痴呆呆的样子就叫没有欲贪；"],[34,357,497,0,"而是有念知、有正知、会如理作意或者透由觉察观照，或者透由禅那来镇伏，或者透由观智来降伏了它，没有了“盖”。才能称为“没有”。（一）不如理作意首先我们必须知道欲贪为什么会生起。前面强调看到它生起必须了知：所谓欲贪，是由于对过去确定的可喜、可爱、可乐的感官目标不如理作意而生起来。这样的可爱目标可以是欲乐本身或者能产生欲乐的事物。可爱目标本身是可喜的，能产生欲乐的事物包含了这个可喜的目标，也包含你对某一些目标透由你的再加工、或者想象而形成的‘我碰到它会有快乐’的扭曲认知，对这些快乐产生执取、产生不如理作意而生起欲贪，而且重复地、持续地熏习，重复地在内心中生起，成为欲盖。有些受虐狂或者吸食麻醉品、致幻剂的人，事物本身并非真实的可喜目标，但是透由造作或者扭曲的认知而形成，这也包括在能产生欲乐的事物范畴里面。"],[34,497,667,0,"不如理作意是指不善巧的、错误的作意。从大的角度来讲，不如理作意可以解释为：视无常为常、视苦为乐、视无我为我、视不净为净的作意。1. 视无常为常第一种不如理作意是视无常为常。什么是无常呢？一般我们将anicca 这一巴利词翻译为无常，但在此它是指无常法。什么是无常法？五蕴就是无常法，色受想行识就是无常法。如果能视它们为无常，就是如理作意；如果视它们为常，就是不如理作意。如果能够破除名色的密集见到五蕴，能观察它，我们就会知道它们确实是无常的，因为它们一生起就坏灭。如果还没有能力观察到五蕴，一般很容易会认为有恒常的尊者、西亚蕾，有恒常的父亲、母亲、先生、太太、孩子、你、我、他等，那就是不如理作意。所以不如理作意在日常生活中遍一切处。从究竟谛的角度来看，没有男人、女人、父亲、母亲、你、我、他人、比库、西亚蕾等。如果视无常为常而作意确实有父亲、母亲、儿子、女儿、朋友、伴侣等，那就是不如理作意。基于这种不如理作意，互相执著的欲贪就会生起。"],[34,667,845,1,"应当观察有没有常见，你是不是觉得你的五蕴是恒常的？你可能认为你的身体会老、不是恒常的，但是当你执取某一种观念、某一种认知时，它就是常；当你对某一类的感受一再地有期待时，其实内心就是常；当我们排斥生病、变老时，就是常；当我们做事或者思考，我们对自己的能力特别地认同时，它就是常；认为先生应该在圣诞节、春节、我的生日有所表示，这就是常；认为孩子的学习必须是优秀的，这就是常。所以“常”在日常生活中遍地都是，我们能不能观察到？什么是互相执著？当你认为常的时候，执著就会生起来。怎么生起呢？“元旦了，先生没有给我买礼物，我觉得……”或者“先生有给我买礼物，我觉得……”，“假期到了，我们全家就是要在一起……” 这就是互相执著。这两天景洪发现疫情，寺院周围是危险区域，因为确诊的人曾经在这附近的酒店住过，因此我们要连续三天做核酸检测。有些人就觉得“怎么这么麻烦？！”而起烦恼，这就是常。只要认为‘人或事必须是这样，应该如何或者不应该如何’，这后面都是常见，而且往往是很坚固的。如果不能看到常见，就非常容易不如理作意。"],[34,845,1042,1,"当常见一生起时，要能觉察到。2. 视苦为乐第二种不如理作意是视苦为乐。五蕴是苦的（dukkha），因为它们不断地受到生灭的逼迫。‘苦的二十五种思惟法’，在修观的时候要观察思维，但在训练如理作意时也可以学习： 五蕴就是疮、就是脓、就是箭、是苦的发生器、是恶的基地等，所以它是苦。如果你不如此思惟，而认为五蕴是会带来快乐的 —— 比如“每天吃饭挺快乐的；太太挺漂亮，我挺快乐的；孩子挺听话，我挺快乐的；见到好朋友时说很高兴又见到你……”这些都是视苦为乐。所有你喜欢的五欲都是以苦为乐。当然有人会问：“我是不是每天都要觉得很苦啊！苦哈哈的?”学习受念处时讲到：五欲带来乐的感受时，应当观察那个感受，观察受生起的因是什么。受是目标价值评价体系，当好的感受生起时，你观察‘这是一种果报的评价或者我造作出来的认知评价’，你就能够对所谓“带来的乐”有正念、有觉知、有正知。这样的正念正知有什么好处呢？你就不会觉得‘这个乐我可以去执取’。乐只是乐，它只是一种果报评价体系或者我造作出来的知见评价体系，仅此而已。当你能这样做时，对于所谓的乐，所谓带来的各种乐受、苦受、不苦不乐受,就不会视它们为乐，因为都是因缘生灭的。"],[34,1042,1152,0,"3. 视无我为我第三种不如理作意是视无我为我。五蕴是是无我的（anatta），如果视它为我（atta），那就是不如理作意。一般人们误以为存在的“我”可以分成两大类：一类是身见,一类是我想。“我想”就是经常说的‘世间通称我’这个邪见。根据世俗谛，我们有父亲、母亲、你我他、比库、西亚蕾等。然而，如果相信他们真的存在，那就是“我想”。五蕴迅速地生灭，没有恒常不变的实质。如果视无我为我而作意：“这是我的父亲、这是我的母亲、这是尊者、这是西亚蕾、这是我、这是他,等等”，就是不如理作意。基于这种不如理作意，互相执著的贪欲就会生起。什么是互相执著呢？就是我的、他的、我要、我不要、我想、我不想;另一类身见就是对身体的执著。"],[34,1152,1293,0,"4. 视不净为净第四种不如理作意是视不净为净。身体本来充满各种不净，比如头发、体毛、指甲、牙齿、皮肤等三十二身分。如果把这些身分拆出来放在桌子上（就像之前发过的解剖视频），你会喜欢哪一部分？我们能说它是美丽的吗？有些同学说他从小就觉得对尸体没有害怕恐惧，如果把尸体放在你的床上陪你一起睡，你会如何？由此可知事实上身体是不净的。有时你可能会想：“这个男人好帅、很英俊；那个女人很美丽、很温柔。”那就是不如理作意。基于不如理作意，欲贪就会生起。也就是说，在日常生活中我们时不时会生起“好美啊！好漂亮啊！好帅啊！好好听啊！好好闻啊！好好吃啊！好温柔啊！这人好听话啊！这某某人好可爱啊！”这些都是以不净为净想。当我们以不净为净想的时候，不如理作意就会生起，欲贪就会生起。以上是四种不如理作意在日常生活中生起的情况。"],[34,1293,1465,1,"（二）了知内心生起欲贪经中提到『比库内心存在欲贪，了知：‘我内心有欲贪。’』是说当你由于不如理作意而生起欲贪时，必须了知自己内心生起了欲贪。如何了知呢？学过《阿毗达摩》了解有八种贪根心，在你还没有观智时，至少能分辨出与贪欲心所相应的八种贪根心中的哪一种，贪与邪见相应或不相应？有行或无行？悦俱或舍俱？在邪见不相应里面有没有傲慢，或仅仅是贪，也要能观察。如果有观智时，要能看到这些生起的贪根心是依靠六种目标和相应的依处生起 —— 眼睛看到的，眼识生起的依处是眼净色，相应贪心生起的依处是心所依处色。还要能够看到相关的六门心路过程，比如我们通过看到颜色而生起欲贪，就要观眼门心路过程。如果要观眼门心路过程的贪根心，首先要观眼门和意门，即眼净色和有分、以及有分生起依靠的心所依处色，然后再看对你而言可喜的颜色，当该颜色同时撞击眼门和意门时，那时作意它为美丽颜色的眼门心路过程是这样生起的，而其中的速行心是贪根心。在此，眼门、心所依处和颜色是色蕴，取颜色为目标的眼门心路过程是四种名蕴，合起来是五蕴。在此，佛陀教我们观照名蕴及色蕴两者。"],[34,1465,1619,0,"更需要去观取日常容易生起贪欲的各种过去五所缘和法所缘，去追查那些心路过程。特别提醒修观的人。一般依着《智慧之光》的教导：‘如何观察贪心呢？对眼睛修四界差别见到眼净色，取到与眼净色十法聚相邻的色聚，观察它的颜色，作意那个颜色很美丽，而生起各种贪根心。然后观察它的无常、苦、无我。’一般有人会认为：“这个我已经会观了。”其实，这样观察对于你解决烦恼了无关系。因为这些心路都是造作出来的。而自己日常生活中经常引发欲贪生起的色所缘，你是知道的，“我特喜欢看什么东西！”看一下你的心就知道，这些是在过去经常发生，现在还是想发生的，那才是盖。对于禅修者而言，你要观欲贪盖，就要找到你平时经常生起的六门心路里与欲贪相关的内容，取到一条这样的心路去追查过去那些五所缘和法所缘，去追查那些心路，顺着这些心路的生起去看每一个心识刹那的五蕴，特别要观察这些心路生起当时如理作意或不如理作意的意门转向心和确定心，乃至于前面的五门转向心。看到路心作意和速行作意，这两种作意背后的无明、爱、取，是什么样的标准让这样的心生起来？这标准是什么样的见颠倒，与常、乐、我、净哪一个能对上？"],[34,1619,1865,0,"然后观它的无常、苦、无我，把错误的知见转过来，这样才能够真正地解决烦恼问题。想蕴梳理法、一念之转，从日常梳理到开始修名色、修缘起、修观智，都是一以贯之的。（三）如理作意如果我们如理作意，就会有佛陀说的 『内心没有欲贪时，他了知：‘我内心没有欲贪’』 。这段经文是指对不可爱、不可喜目标生起如理作意或通过专注该目标而培育禅那而暂时灭除了欲贪。世尊说： 『对不可爱或不可喜的目标数数如理作意是防止未生的欲贪生起之因，也是令已生起的欲贪止息之因。』比如你看到一个帅哥，他是可喜所缘，但是帅哥其实只是皮肤包裹下的三十二身分，肚子里一样是许多粪便，数数作意这人身上充满了各种不可爱、不可喜所缘，是防止未生的欲贪生起之因，也是令已生起的欲贪止息之因。所以，如理作意是善巧的、正确的作意，是如实地知见五蕴以及它们是无常的、苦的、无我的、不净的作意。（四）不如理作意会导致欲贪生起经文中说： 『他了知尚未生起的欲贪如何在他内心生起。』就是一再地对可爱的目标生起不如理作意会导致欲贪生起。举例而言，你有一对儿女，因为从小到大都在一起，即使你很爱他们，也不会每天都有很强烈的感觉。"],[34,1865,1992,0,"如果你坐下来思考：“我的儿子很懂事，学习成绩真的不错；我的女儿真的很漂亮。”然后没事刷朋友圈，看着朋友圈的朋友们在晒娃，你也晒，互相晒，越晒就越觉得自己儿女可爱，本来对儿女没那么执著，但是通过晒娃对儿女的渴爱不断地作意，对他们的执著就会不断地增长，这就是『他了知尚未生起的欲贪如何在他内心生起。』心透由各种作意（无论是对欲贪或其他），总是有重复缘的力量，重复完后会形成亲依止缘的缘力，就会导致欲贪或者善法的力量越来越强。因此佛陀说： 『对可爱、可喜的目标数数不如理作意是使未生的欲贪生起之因，也是使已生起的欲贪增长及增强之因。』对于可爱可喜的目标不能够数数地认为它是常的、是乐的、是我的、是净的。当你对可喜可爱的目标总是作意它常乐我净，欲贪就会增强，强大到成为你的盖。"],[34,1992,2172,1,"（五）灭除欲贪的六种方法经文中说： 『他了知已经在他内心生起的欲贪如何被灭除。』经文中仅是一句话，对于如何灭除，佛陀没有开示。《注疏》根据巴利圣典解释有助于灭除欲贪的六种方法：1. 取得不净的目标取得不净的目标，即如前所述：当你面对可喜可爱的目标时，知道这是你作意出来的，是不如理作意，常乐我净形成的。其实，从究竟谛来讲，它百分之一百都是不净的，所以你一定能取到它的不净相，无论是帅哥美女或者是可爱漂亮的孩子，乃至于金银财宝、汽车房子，都能取到它的不净。怎么取？大家可以思考：对于人，有三十二身分；对于房子车子，其实就是代步用的，把车打开里面的发动机充满了油污；对于金子，你认为很美好，把它吞下去就会死‘吞金而死’，金银财宝都是作意出来它有价值你才会执取，从本身角度来讲，比如纸币（美金、加币、人民币）里面充满了细菌，当然有人说：“我现在不用碰到实体的金钱，可以转账”，转账所引发的欲贪，或者钱财这个符号本身没有什么可以值得常乐我净的，只是你觉得这个东西可以换取能够让你带来常乐我净的相应享受或者物品，最后都是享受的还是那些不净身分。"],[34,2172,2294,1,"所以要取它的不净目标。对于三十二身分，你要能够获得取相。2. 致力于修行厌恶作意厌恶作意有两大类：一类是有生命的厌恶作意，一类是无生命的厌恶作意。有生命的厌恶作意就是修习三十二身分或四十二身分的厌恶作意。四十二身分是四界差别的详尽法，修四十二种身分，看到那些色聚，其色、香、味、食素也是不净的。无生命的厌恶作意就是九种坟场作意（对尸体），在学习身念处时讲过。一直到你能够成就近行定或者禅那（安止定） 。"],[34,2238,2399,1,"前面所说‘取得不净的目标’是指十种不净 —— 三十二身分加上九种坟场观共十种，对可厌目标当中任何一种练习厌恶作意。经常记取这样不净目标的人能够灭除贪欲。你平常专门练某一种，一看到所缘马上把它转换成不净相。‘无生命厌恶作意’的十种目标：肿胀的尸体、变色的尸体、腐烂的尸体、裂开的尸体、血肉模糊的尸体、分解的尸体、被切断分割的尸体、血迹漫涂的尸体、生满蛆虫的尸体、变成骸骨的尸体。如果要修行无生命体的厌恶作意，就必须见到上述十种厌恶相之一，也可以取过去见过的尸体为目标，在学习身念处时已经讲过，不再重复。有生命体就是三十二身分，也不再重复说明。"],[34,2398,2505,1,"3. 守护根门守护根门：不看、不听、不闻、不尝、不接触，对于没有意义的、没有用的，就不去做。如何守护呢？佛陀在《龟喻经》中提到一个方法：有一只乌龟在恒河边觅食，有一只狐狸也在河边觅食。乌龟在远处就看到那只狐狸，狐狸也在远处就看到那只乌龟。狐狸想要把乌龟吃了，当它跑向乌龟时，乌龟把头、四肢及尾巴都缩到龟壳里。狐狸就在乌龟壳边上等着咬它，但是乌龟知道狐狸在等着，它就是不把头、四肢及尾巴伸出去，最后狐狸耗不起，失望地离开。这个比喻的提示是佛陀教导：诸比库应该令心专注于好比是龟壳的禅修业处，若能如此，好比狐狸的烦恼便吃不到乌龟、伤害不到乌龟，如此守护根门就能灭除欲贪。"],[34,2505,2582,0,"守护根门的前提是有正念，心能够专注于业处，也就是我们现在在学习的四念处。对大部分人来讲从身念处开始练习，总是能觉知当下身心的状态。如果你现在练习入出息念已经比较纯熟了，就应该将心专注于入出息；如果你修身体的四界，就应该专注于身体的四界；如果你现在已经能够入禅，只要没有危险的情况下你就应该入禅；如果你在修习观禅，就应该让心专注于观智的目标，比如身体内在外在究竟的名色法、这些名色法生起的因以及名色法和这个因的无常、苦、无我三相。"],[34,2582,2753,0,"在此，再次强调：佛陀对于观禅，总是说应观照名色法、名色法生起之因以及名色法及其因的无常、苦、无我。如果在所谓的‘正念当下’，只是觉察到名色法的生起灭去是不够的。为什么不够呢？因为名色法生起的因没有被观察到。我们知道名色法生起的因往往跟我们的认知相关，如果不能把我们的认知撼动，邪见就很难被尽除。因为没有触及到烦恼，而想在未来生起初果道智斩断烦恼、斩断邪见就不容易。4. 饮食适量关于饮食知节量，沙利子尊者在《长老偈》中说：“吃钵食（吃饭） ，吃到再吃四、五团饭就会饱足时，就应当停止，而以喝点汤水代替那四、五团饭，这就足以使精进修行的比库快乐地安住。”对于《长老偈》这个偈颂，有一种解释是：如果你一般吃四十口饭——四十团饭（一团一团的团食）才会饱，那就应该只吃三十五团饭；如果你吃六十团饭会饱，那就应该只吃到五十五团饭，剩下的五团饭不吃，以喝水来代替，这样就能令你快乐地安住。另外一种解释具有争议，帕奥西亚多也认为这是不可靠的，这种观点认为：你每次只吃五团饭，然后就只是喝水。这个观念有点牵强，每天只吃四到五口，对大部分人来讲是不足以支撑的。"],[34,2753,2906,0,"对于懂得摄取适量饮食的人，对饮食的欲贪就会被灭除，因为他没有昏沉和睡眠的困扰，能对食物修行可厌的观想以及安住于这类观想，比如观想食物会变为粪便，或者如我们在学习四食时，佛陀专门开示《子肉喻经》，就像吃自己亲儿子的肉一样去思惟，或者思惟你在咀嚼食物，虽然觉得美味，但是把它吐出来再吃进去，你愿意吗？你还觉得它美味吗？如此作意后，对食物的欲贪就不会生起。5. 亲近善知识第五种能帮助灭除欲贪的方法是亲近善知识,很多长老都曾引用Tissa Thera 的故事，他亲近乐于修习厌恶作意的善知识，能够灭除欲贪。Mahātissa 长老是斯里兰卡的一位长老，他在托钵的路上看见一个狂笑女人的牙齿，对牙齿生起白骨想，如理作意，修白骨而证得禅那，透由禅那观察当下的禅那名法和白骨的色法，然后通过对名色法、名色法生起之因，观察它们的无常、苦、无我三相而证得阿拉汉，灭除贪欲。"],[34,2906,3002,0,"6. 适当的言谈第六种能帮助灭除贪欲的方法是适当的言谈。比如你去请教老师、请教善于修习厌恶作意的同梵行者，一起讨论如何修习或者修习时如何体会这十种厌恶作意，体会以后如何能灭除贪欲，如何相互提策、勉励，一起致力于灭除贪欲，去学习或者交流，适当的言谈是可以的。这样适当的言谈也是有助于灭除贪欲。佛陀接着说： 『也了知已舍断的欲贪于未来如何不再生起。』被上述六种方法灭除的欲贪在禅修者证悟阿拉汉道以后就永远不会再生起。"],[34,3002,3076,0,"对于想要证悟阿拉汉果的人，能够了解四种如理作意和四种不如理作意是很重要的。再重复一次：四种不如理作意是指视无常为常、视苦为乐、视无我为我、视不净为净；四种如理作意是视无常为无常、视苦为苦、视无我为无我、视不净为不净。当你心中有欲贪时，应当了知自己心中有欲贪；当你心中没有欲贪时，应当了知自己的心中没有欲贪。在什么时候你的心中会没有欲贪呢？除了前面已经解释过，在你运用六种能够灭除欲贪的方法时，心中就会没有欲贪。例如我们修习厌恶作意达到近行定或者安止定，透由定力能够暂时灭除欲贪，这是止禅的方法。"],[34,3076,3167,1,"如果不如理作意地注意目标，比如你作意所见到的颜色为美丽，欲贪就会生起。欲贪生起于眼门心路过程及随其生起的随彼起意门心路过程中的速行心。因此对于有欲贪的心，你不应只观照欲贪而已，而应该也观照在每一个速行心识刹那当中与欲贪同时生灭的名法。当能够如此观照而拥有观智时，欲贪就不会生起。为什么呢？因为善法和不善法不能像用两条牛来拉车那样同时存在。因此以如理作意来观照欲贪时，当下就不会有欲贪存在。对于其他四种盖，也应如此观照。在还没有观智时，我们也相信同样是这样：当你对目标如理作意时，不如理作意就不存在；当你心有善法时，不善法自然就不存在。很多人说：“我知道这是贪，但我就是绕不开。”之前讲过《寻止息经》，这个时候就要切换你的相。"],[34,3167,3266,0,"应该观照颜色等目标为无常、苦、无我、不净，如此心中就会生起观智而灭除欲贪。观智有真正的观智或者说日常的观照，在此，除了六种灭除贪欲的方法之外，其实最后会发现最根本的还是你的看法——常、乐、我、净或者无常、苦、无我、不净，最根本的是后面支撑的见解。对于一位禅修者，如果已经具有能够观察究竟法的观智，除了对六门心路过程所有名色的观察之外，还要观察你去观察的这个观智本身也是无常、苦、无我的，即后面一个心观察前面一个心。观智生起于意门心路过程中，在一个意门心路过程中，第一个心是意门转向心，随后逐一生起七个速行心，每个速行名聚当中有三十四或三十三名法，应该观照每一个心识刹那中的所有名法。"],[34,3266,3403,0,"如此观照善法或不善法时，就观照了五蕴，怎么说呢？善法和不善法所依靠的依处和所缘取的目标是色蕴（如果是色法目标）；善法与不善法本身则是四名蕴，所以共有五蕴。观照善法和不善法之后，应该观照它们的因，过去的因和这条速行生起来的因，如果这个因可以不断地被追溯，乃至于追溯到过去生、再过去生，一直追到它最早的原目标——最基础的一次认知，这是最有效的。然后观察所有这些善法、不善法以及它们的因为无常、苦、无我。如此观察到观智成熟时，心就会取涅槃为目标而生起四种道智和四种果智。当你证得阿拉汉道时，欲欲就会被根除。欲欲也包括色贪、无色贪，如果纯粹只是五欲的欲贪，证得三果时就会被根除，而且永远不会再生起。这时你会彻底地了知佛陀所说的：『也了知已捨断的欲贪于未来如何不再生起。』根据《阿毗达摩》的教导，对于世间（三十一界的器世间）一切事物的执著都是欲欲，只要强烈执著就会成为盖——欲欲盖。因此论师说：“透过证悟阿拉汉道来完全断除欲欲。”"],[34,3403,3510,0,"之后学习法念处时会再学习观照各种分类法， 比如， 五盖、 五蕴、十二处、十八界等应被了知之法及观照七觉支、四圣谛等应该被培育之法。在这里也是同样的道理，修行的目的是为了获得纯熟的观智。论师说：“念处之教化以观禅为主，充满观禅。”这句话如何理解呢？四念处——身、受、心、法，佛陀说这是导向清净的唯一之道，是佛陀核心的教化。以观禅为主，观察五蕴、十二处、十八界等生命界的真实相。当下的真实相以及导致当下五蕴、十二处、十八界生起之因的无常、苦、无我，这是观禅。还没有成熟的观智的，在日常生活中也要尝试这样观。"],[34,3510,3688,1,"有些人说想蕴梳理法很困难，有些人在梳理的过程中总是套步骤、套名相，浮于表面、隔靴搔痒、无法深入，其根本原因还是不知道想蕴梳理或一念之转要解决的是自己错误的认知行为模式惯性。行为就是我们的身语意业行。惯性就是已经成为欲贪盖、瞋恚盖等五盖的不善。在此你要观察到：已生的，知道它已生；未生的，知道它未生；已断的，知道它已断。要能观察到当下的善和不善以及生起之因。速行的生起之因就是你的认知模式。由现在的、过去的认知串在一起的见解包，一堆重重叠叠地纠结在一起的认知。但无论是日常梳理、修缘起、修观智，都不能抱着一团见解包去梳理或者观察。为什么呢？因为每一个生起的速行只有一个目标，而不会是一团目标。每个行为习惯只对应一种认知模式，需要把这条线找出来，顺着这条线把稻草人拆除。有位尊者说：“我有这惯性，但是找不到具体场景，怎么办？”没关系，你可以顺着这个习惯追回去，就是什么样的认知导致你有这个习惯。比如这位尊者说：“我一看到不修行的人，就觉得无法忍受，不修行出家干什么？还不如回去！我看到这样的人就恼火。看到有些人不遵守规则，我就受不了。"],[34,3688,3851,0,"看到有些人不遵守戒律或者对戒律怠慢，我就很难受！”—— 一个嫉恶如仇的人。看起来好像很正直，其实内心很苦。他动不动就把别人给惹毛了，大家不知道怎么跟他打交道，但是他说这个习惯没有具体的经历场景。正常来讲，一个有这么多标准、这么多要求的人，一定是在小时候或者成长过程中被人这么要求过，不然不会产生这样的习惯，即使是过去生带来的心理余势，也会在这一生重演。通过习惯往回找，后来他说：“我小时候家教特别严，筷子拿不清楚在饭桌上就会被敲打 —— 吃有吃相，站有站相，坐有坐相。总是被人家教训。”‘家教严，坐有坐相，站有站相，吃有吃相’，这是好的品德习惯，但是当你去执取并把这个标准拿出去要求别人时，就出问题了。把从小家教严的标准、这种认知拉去套到生活中对待一切人、一切事，这就是常见、就是想颠倒，必须要把它转过来。转过来之后，你才能良好地与别人相处。这就是在日常生活中的观照，欲贪也是这样。所以论师说：“念处之教法以观禅为主，充满观禅。”一切时处都要导归到四念处上来，然后修观的时候观察相应的名色、名色生起之因以及它们的无常、苦、无我，把整条线理出来，然后把它斩断。"],[34,3851,3937,1,"今天的课就到这。回向功德！"],[35,8,376,1,"188讲-摄集-摄菩提分-法念处-五盖 2古源尊者尊敬的各位尊者、法师，各位贤友，晚上吉祥！上堂课学习了法念处中五盖之欲贪盖，今天学习瞋恚盖。一、瞋恚盖的观照和成因（一）如何观照瞋恚盖佛陀如此教导： 『内心存在瞋恚，他了知：‘我内心有瞋恚’；内心不存在瞋恚，他了知：‘我内心没有瞋恚’。他了知未生起的瞋恚如何生起，了知已生起的瞋恚如何舍断，也了知已舍断的瞋恚于未来如何不再生起。』如何理解呢？当你心中有贪欲时，必须了知心中有贪欲;同样地，当你心中有瞋恚时，也必须了知心中有瞋恚。为什么？如果不能先观察自己内心的瞋恚，又怎能观照它乃至于捨断它呢？因此你应该了解为什么自己心中会生起瞋恚。当有瞋恚时，首先懂得停下来，而不是跟着瞋恚心继续造作瞋的不善业。停下来以后，要了知，为什么自己心中会有瞋恚。"],[35,376,498,1,"（二）瞋恚盖的成因佛陀说，对可恨相(不可喜所缘)起不如理作意会产生瞋恚。在此，瞋恚本身及造成瞋恚的目标称为可恨相。如何理解呢？气（情绪）生起时经常控制不住，有时会越想越气，所以，瞋恚本身也是可恨相。无论在何处，不如理作意都有同样的特征：视无常为常、视苦为乐、视无我为我、视不净为净。例如，女孩子看到比她漂亮的人，觉得“她很美丽”,或者男士看到比他帅的人，觉得“他很英俊” ,而感到嫉妒与生气;如果觉得“她/他很令人讨厌”，也会因此而生气。当一个人对可恨相重复地不如理作意时，瞋恚就会生起。"],[35,498,640,1,"因此世尊说： 『对可恨相的数数不如理作意是使未生的瞋恚生起之因，也是使已生起的瞋恚增长与增强之因。』对可恨相数数不如理作意，其背后必定有一个认知在支撑着，应当观察当情绪生起时，是什么样的标记使这种情绪产生。后面会讲到很多种对治法，但是如果没有认识到那个‘认知’，对治也只是暂时的，因为根没有去除。（三）易生起瞋恚盖之事瞋心生起的近因是（九或十种）瞋怒事（āghātavatthu），能激怒我们的瞋怒事有三种针对自己，三种针对亲人，三种针对敌人。当想到“过去他曾做了对我不好的事”时感到生气；当想到“现在他正在做对我不好的事”时感到生气；当想到“未来他将会对我做不好的事”时也感到生气。"],[35,640,854,1,"当想到“过去他曾对我亲爱的人做不利的事”时；当想到“现在他正在对我亲爱的人做不利的事”时；或者当想到“未来他将会对我亲爱的人做不利的事”时感到生气。当他想到“过去他曾帮助过我的敌人”时感到生气；当他想到“现在他正在利益我的敌人”时感到生气；当他想到“未来他可能会利益我的敌人”时感到生气。另一种是对不应生气之事感到生气，即无理之怒。对于毫无理由的生气，《殊胜义注》列出九种：比如，有人想到“怎么雨下这么多”他感到生气；“没有下雨”他感到生气；“天气太热”他感到生气；“天气不热”他也生气；“刮风了”他也生气；“没刮风”他也生气；由于不想扫地，对掉到地上的落叶感到生气；由于风太大使自己不能整齐地穿衣服感到生气；走在路上不小心踢到树桩或者踢到小石头感到生气。这类生气比较容易理解。"],[35,854,953,0,"但比如‘起床气’，虽然没有刮风下雨，但是起床了就很生气，中医角度解释为肝气不疏，肝淤症状。瞋性行者容易有这样的习惯。这类无来由的生气，很难找到其背后的标准，就是莫名其妙。建议这些人去看病，最好看中医，基本都是肝气郁结导致。当然有人说是过去带来的，即使是过去带来的，他的身体也是这样表现，喜欢生气的人一般肝胆系统都容易有问题。《根本复注》中提到另外九种无理之怒：当想到“过去他不曾利益我”时感到生气，即没有帮助过我而生气；当想到“现在他没有帮助我、利益我”时感到生气；当想到“未来他可能不会利益我”时感到生气。"],[35,953,1018,1,"当想到“过去他没有帮助我的亲人”时感到生气；当想到“现在他没有帮助我的亲人”时感到生气；当想到“未来他不会帮助我的亲人”时感到生气；当想到“过去他没有导致我的敌人遭受损失”时感到生气；当想到“现在他没有令我的敌人遭受损失”时感到生气；当想到“未来他不会令我的敌人遭受损失”时感到生气,这种生气也是没来由的生气。（四）引发瞋心之不如理作意会引发瞋怒、瞋心的根本原因是不如理作意。不如理作意就是常、乐、我、净引发的三颠倒。"],[35,1018,1125,0,"比如：你回家，看到先生坐在沙发上看电视，也不先淘米、做饭，就很生气。你认为，先生回家比较早就应该去做饭，你生气是认知他应该去做饭导致。如果认为先生回来就应该看看电视，就不会生气，先生今天一天工作很辛苦，回家就先看看电视，觉得先生这种情绪得到释放很好，你就不生气了,所以还是错误的认知：认为先生就应该……这是常见；认为先生必须按我的要求，这是我见；先生如果去做饭我就快乐，这是乐见。我们面对所有人、事、物，不良情绪的生起都与常、乐、我、净有关。我们喜欢一样东西“这个东西我很喜欢!”认为它会一直存在才喜欢，这是常见，哪天它消失了就很生气，这是常见。认为它会一直存在，所以当它消失了就受不了，这也是常见。"],[35,1125,1198,0,"由于常、乐、我、净引发三种颠倒：想颠倒、心颠倒和见颠倒。认为‘某某事情是不应该的’，不应该一般都是由常见引发，所谓不应该，就是它应该（一定）是怎样的，这是常见；面对人、事、物的时候觉得很难受，是乐想引发的，认为什么样的事情必须带来快乐。为什么会有难受？因为有乐想而引发；如果觉得‘我受到伤害了’，就是我想，有一个‘我’，才会觉得我被伤害了，这是我想引发的；如果觉得对方很可恶，这是净想引发，觉得别人一定要很好才对，这是净想引发的。"],[35,1198,1300,0,"瞋性行者容易带有前面提及的几种无理由的瞋怒（莫名其妙的瞋心） ，包括《殊胜义注》和《根本复注》中提及的无理之怒，其实都是瞋寻（很强的一种习惯于瞋性的寻）导致。瞋寻的背后，如佛陀所说，是数数地对可恨相不如理作意而形成的惯性。这些人梳理的时候，往往都能够在他小时候、成长的过程中找到源头，或者找到喜欢生气的依据。由于小时候一直都重复生气，影响到身心，就会肝胆不好，肝胆不好的人就更容易生气，生气之后又伤害肝胆，肝胆受伤后越容易生气，是一种负循环。"],[35,1300,1420,0,"（五）瞋心的表现、过患怎么办呢？当下要去观察，然后去转。对于瞋怒，《义注》中有个比喻：瞋怒就像混合毒药的腐尿药。腐尿药（牛尿泡橄榄果，可以治九十九种病）是佛陀时代，比库（出家人）常用的一种药，是出家人随身带的药。瞋怒就像随身带着被放进毒药的腐尿药，腐尿药本来是药物，但是由于掺有毒素或者不恰当的成分，使用后会受伤甚至会被毒死。同样地，当瞋心生起时，会导致自己和他人不好、不快乐的结果，应该捨掉。就像原本作为药物的“腐尿药”，由于加入毒药，就必须倒掉不能用。我们的身心本来可以用来修行，但是里面有毒素，如果不把毒素去除，修行就会困难。"],[35,1420,1519,1,"瞋恚盖的表现，在生活与禅修中很常见。在生活中的表现如上述提到的各种生气；在禅修中的表现即对禅修目标和所缘各种不满意，各种计较、批判、自我责备。有人说：“我这一坐一定要坐两小时……”——听起来好像觉得这个人特别有意志力，其实很可能是瞋心——“坚决不起来！”是逼自己呀！这样很容易导致紧张和强迫。贪、瞋、痴就是不善心，不善心造不善业，不善业就一定是恶果。禅那是上人法，是除道心之外至上的善，一定不可能由不善法、不善心产生，绝不可能。所以，禅修时要观察，只要对禅修所缘有排斥、不满意，应立即跳出来。"],[35,1519,1580,0,"跳出来，简单而言就是接受当下的状态，‘现在的呼吸是怎样就怎样，现在我的身心状态是怎么就怎样’，能专注多少就知道多少，慢慢心就会平静下来，身体就会放松，放松之后好状态自然会呈现。如果你有各种要求就有各种失望，有各种失望就有各种瞋心，都成了瞋恚盖，把进步盖住。所以，禅修首先要发现自己的五盖。平常可能没感觉，禅修时那些盖就哗啦啦地冒出来。瞋心有很多种相貌，比如：残忍、恐惧、绝望、抱怨、讨厌、辱骂、攻击、暴力、打斗、互相伤害、……"],[35,1579,1665,1,"，都是瞋心的不同面相。瞋包含两个层面：一个层面是强烈或残忍的。发火了，恶向胆边生，脸肿得跟猪肝色一样，这是很猛烈的瞋，乃至会做出伤害他人的事情。还有一个层面是轻微的，比如愁、悲、苦、忧、恼，它表现为淡淡的排斥，闷闷不乐。很多人在日常生活中一整天都是闷闷不乐，如果以后修观智，观察自己的心路，会发现我们一整天生起来的大部分都是瞋心，不满意。淡淡的、闷闷的不满意。无聊的状态也是瞋，很多无聊后面就是不满意。"],[35,1665,1818,1,"瞋是由自我保护（保护机制）发展出来。比如说害怕自己的身心、名利、地位受到影响，害怕民族、国家受到影响， 忧国忧民也是瞋心，忧就是瞋，忧俱瞋相应。因为设定了身心、名利、地位、民族、国家，或其他各种概念如：敌人、亲人、气候、动物保护、环境保护等，设定这些概念后，内心对这些概念做很多情感建构、纠缠。比如觉得“环保很重要”，每天查看空气污染指数，只要有一点点超标，“空气质量这么糟糕，怎么回事呀？”心就在里面绕。有人收留流浪猫，看到猫流浪就很痛苦。还有人每天都放生，走进菜市场就受不了，说：“我要放生， 你借我点钱”（没钱了借钱放生）。当你的心缠绕在那些‘你认为应该怎样’的概念上，就很容易生出很多瞋恚心。其实这些都只是你的观念、你的认知习惯。这些认知习惯都是真的吗？很难讲。很多我们认为应该恐惧或应该生气的事情，都是假设出来的。"],[35,1809,1971,1,"此外，我们总感觉瞋心重的人，乃至于很残暴的人好像很有力量。如果与他深入交流，会发现这样的人往往内心都很脆弱。内心强大不用会生气。“我不害怕任何的失去，我生什么气呢？”“我不跟任何人计较，有什么好生气呢？”生气的人往往都是内心脆弱、不足、有缺失的。“不要碰我！我要跟你生气了。”这是一种自我防范的表达，其实是内心缺乏安全感、很脆弱的一种表现。对于内心的某个假设被触犯，他觉得不能忍受。内心不丰满的人，容易有恐惧感。世界上，各种国家、党派、团体，乃至于企业、机构之间的竞争，无论是政治上、经济上、领土或意识形态等各种争斗，都由瞋心引发。而这瞋心的背后都是有“我” 在认为什么应该常、乐、我、净， 当 “我”觉得现实不常、乐、我、净时，瞋心就生起。"],[35,1971,2045,0,"用心观察，可以很具体地看到，生气的当下就伤害了自己、伤害了对方、伤害了家庭、伤害了机构，乃至于伤害了民族、国家。瞋心的唯一用处就是破坏、毁坏。破坏自己、破坏别人。要认识到瞋恚的过患。二、灭除瞋恚的六种方法佛陀教导了六种灭除瞋恚的方法：1.学习散播慈爱 2.培育慈心禅 3.思惟自己所造之业是自己的财产 4.数数如理思惟（经常如理作意） 5.亲近善知识 6.与善知识交流有助于培育慈心与灭除瞋恚的适当言论。"],[35,2045,2217,1,"（一）第一种、学习散播慈爱；第二种、培育慈心禅籍着对慈心解脱的如理作意，可以灭除内心的瞋恚。这里的‘慈爱’是指近行定或安止定而言。‘慈心解脱’则单指安止定（即慈心禅，慈心初禅、二禅、三禅)。无论在何处，如理作意都具有同样的特征，即视无常为无常、视苦为苦、视无我为无我、视不净为不净。当如理作意透过散播慈爱而变得强有力时，就能够灭除内心的瞋恚。因此佛陀说： 『诸比库，透过慈爱能达到心的解脱。对慈爱数数如理作意是使未生的瞋恚不生起之因，也是灭除已生起的瞋恚之因。』《注疏》中说：籍着对个别的人散播慈爱可以灭除瞋恨；籍着整体地散播慈爱，不局限特定的人或方向，也可以灭除瞋恨。经典中教导，通过对七类或二十八类有限定的对象、五类或二十类无限定的对象、以及十方众生培育遍满慈爱都能够灭除瞋恚。关于有限定与无限定对像的遍满慈爱，后面再解释。"],[35,2200,2382,1,"在《论事》里面，慈爱特指慈心禅，对于初学者而言，慈心禅从平常的慈心练习开始，慢慢达成。数数练习让自己生起慈悲心；（二）第三种、思惟自己所造之业是自己的财产；第四种、数数如理思惟对于数数如理思惟，帕奥西亚多建议：生气时应该思考“你生气对他有什么作用？”如前所述，‘当想到他过去未曾帮助过我时感到生气’，生气之后能让他帮助你吗？显然不可能，对不对？越生气对方越不帮你。所以你应如此思惟：“生气会伤到自己的身体，别人看到我经常生气会不理我。除此之外，没有人会想： ‘你生气了，我帮你一下。’没有这个可能性！”“你生气，能抹煞别人的德行吗？”比如你看到一些人很有德行，你嫉妒、生气，生气能让他德行减少吗？再简单点说，你看到一个人很漂亮，你嫉妒，她会变难看吗？不会，你嫉妒是你的事。你难道不是由于过去所造之业才投生到这里？未来你还不是要继续随业流转生死？也就是说，你当下碰到的所有事情都是你业的残余。这个身体称为业的果报体。业的果报体就是上一生临死时成熟的业的残余，还有一点能量，让你活着。你过去也造作了很多不善业，那些不善业会交合在一起， 于此时成熟，让你遇到不可喜所缘和目标，所以你生气。"],[35,2382,2503,1,"可以如此思惟：你是自己业的主人。生气并不能令不善业不成熟，反而可能引发更多的不善果报。现在再生气，生气的业会带到未来，在你未来流转生死的过程中，还要接受由于生气产生的果报。“对他人生气，就像赤手握着灼热的木炭、火红的铁条、粪便等损害之物而想打击他人一样。”当你赤手空拳握着灼热的火炭或火红的铁条想打击别人时，别人未必会被打伤，但肯定会先烧伤自己。同样地，当你用手捡起粪便想丢别人时，别人未必会被丢中，但你肯定会先弄脏自己、浑身沾满粪便的臭味。如此思惟能灭除瞋恚。也可以对所生气的人如此思惟：“生你气的人又能对你怎样呢？”别人对你生气时，他也像是拿着粪便要甩你，你不接过来，粪便还在他身上。他生他的气，你不能理他，理他就像接过粪便。所以，生你气的人，对你起不了任何作用，随他生气去。"],[35,2503,2572,1,"他生气能抹煞你的德行吗？他会伤害到你的慈悲和智慧吗？不能。他也是由于过去所造之业才投生，未来还要随业流转。他也是业的残余、业的果报体，他就是这样的人，有这样的烦恼，碰到这样的事就生气。对他做认知共情，他如此生气是因为有常乐我净的认知。由于他有这样的认知，碰到这样的事情才有这样的反应。“他的愤怒就像不被接受的礼物退回给他自己一样，也像逆风投掷灰尘，灰尘只会飞回他自己的头上一样。”时常如此思惟自己所造之业是自己的财产，他人所造之业是他人的财产，如此思惟也能灭除瞋恚。"],[35,2572,2676,1,"经常提醒要训练“睁眼四圣谛”，四圣谛不是闭着眼睛实现的，睁着眼睛时就要能应用四圣谛。看到不可喜所缘（可恨相），瞋心生起感觉到苦，面对苦能停下来，接受果报，然后再观察苦生起的因是什么，看到苦之集——瞋生起来的动机。“你为什么要生气呢？这个事情值得这样生气吗？”要反问自己，看到生起瞋后面的无明、爱、取。无明、爱、取无外乎就是三颠倒。看到以后要转变观念，观念不转，即使用慈心按住一阵时间，当放下慈心后瞋还起来。为什么？观念还在。“因为看不惯他，现在给他散播慈爱……”，似乎好一点，明天看他还是那么讨厌。你没把“这个人很讨厌”的观念转过来，随时看他都讨厌。所以要转变观念为正见。"],[35,2676,2742,0,"这段时间不少同学问我：“我这人就喜欢观过，怎么办呢？”我说：“没问题，拿个本子，把这个人的过失（你不是喜欢观过吗？）全写下来，看能写多少条。写完以后，每一条，用一念之转（学过一念之转的人都知道）反问自己：他这个缺点是真的吗？你确定是真的吗？如果你一直抱持这个观念‘觉得他很讨厌，他有这个缺点’，你心里什么感受？如果你放下这样的成见，你心里什么感受？然后再反转，把他换成你，把你换成他，每一个点都过一下，过完后，你再写这个人的优点，写二十条。”"],[35,2742,2862,0,"这几天，几位贤友写下来效果很好，对相关人的看法完全不一样了。为什么这样写会有用呢？因为他的思维卡在 “我觉得这个人就是很讨厌”，一个点看错了，死都不变。拿个本子认真写一下，它就转过来，而且从根源上转掉。这是八正道的内容。当看到瞋恨的动机——无明、爱、取，然后转变观念为正见，转过来的当下，你对这个人的讨厌就灭掉，这是灭谛，彼分灭。以八正道数数串习，当还有惯性：一看到这个人经常表现的某一点不足，还是会引发你对他的讨厌。写一个人的缺点，很少有超过 10 个的，一般就是5、6 个。对一个人找出10 个缺点很难。但是，写20 个优点，基本都能写出来。其实一个人的缺点没那么多，只是被你不断放大而已。你把它转过来，下次再碰到，心里自然就会想起：这个习惯我已经转过了。从观念到思惟方式到行为方式都转过来。"],[35,2862,2955,0,"不断串习八正道，慢慢就会对他持中捨的态度，你不一定会喜欢他的缺点，但是你可以接受。你可以持中捨的态度， “我接受他有这样的习惯”或“他是有缺点，但也没有伤害到我什么”。就是你看不惯而已，这“看不惯而已”的后面都是我慢。就是“我觉得比他强”才有这些事，不然哪来这些事。应该克服习惯性地瞋恨、控制、评价、批判这些不良的习惯。平常如果一直都有评价、批判、计较的习惯，你对禅修业处也是批判、计较，各种不满意，就修不下去。修不下去又来质问：“老师，您教我的东西不行呀！”你不把这个毛病改掉，谁教你都不行。所以禅修不是仅对着禅修业处就能修上去，不解决心理问题，在哪都修不上去，无论哪位老师教都没用。"],[35,2954,3019,1,"（三）第五种亲近善知识；第六种与善知识交流有助于培育慈心与灭除瞋恚的适当言论亲近乐于修行散播慈爱及谈论在四威仪中修行散播慈爱的善知识，经常与特有慈悲心的人交流。为什么呢？特有慈悲心的善知识心胸很开阔、很柔软，你卡住、过不去的事情，跟他一聊，他给你说几句话，“对呀，我怎么这样想呢？”“这太无聊了”，显得特别小气。我们对很多很小事情的计较，在这些内心充满慈爱的人的心胸中，显得特别卑微，“不好意思呀”，你就能转。所以要亲近内心慈悲的人，跟他们交谈，把觉得过不去的问题跟善知识交流，说：“我卡住了，您有什么办法，请跟我讲讲。”这些言谈是适当的。"],[35,3017,3116,1,"以上是六种可以灭除瞋恚的方法。三、慈心禅那的修习接下来学习慈心禅那的修习。（一）什么是慈心慈心是一种梵住，四梵住（慈、悲、喜、捨），排第一位的是慈梵住（Brahmavihāra）。修习慈心是为了去除瞋恚盖。贪的特点是黏著、执取。黏著、执取给你带来什么感觉呢？感觉被绑住了，对吧？比如你爱太太，离不开太太；太太爱先生，觉得先生是我的，太太天天想着先生有微信、先生有没有跟其他女性说话……要每天晚上回去检查一下，很不自由，对吧？只要有任何贪爱就不自由。所以，离贪可以获得自由。"],[35,3108,3201,1,"瞋恚是粗野、残暴，经常生起害人的心，或者害人害己的心。离瞋带来慈悲，心会很柔软。瞋心重的人身体都很僵硬，浑身都是疙瘩，各种包，硬邦邦的，按哪都痛。而有慈心的人，浑身都很柔软。什么叫痴呢？就是盲目，愚痴的人像瞎眼的人，该做正确的事情他不会做。所以，离痴获得光明，让内心透亮，看问题不被堵住，一点就看到根源上，这是智慧。（二）修习慈心的注意事项要去除瞋恚盖，修习慈心就变成很重要的法门。对于解脱瞋恚的境界，《清净道论》中有很详细的慈心修习方法。"],[35,3201,3266,0,"首先必须明白，慈爱与世俗的贪爱不同（学习无瞋心所讲到慈时，特别强调过）。慈爱是基于愿一切众生得到安乐的善愿，而不是想要拥有所爱的目标，它不是想要独自占有的心。修习慈爱的目的是要达到平等无差别地将一切众生包含在自己的善愿当中。“慈心解脱”只是指安止定而言，如果还没有达到安止定，不能说他已经解脱了瞋恚，但是，修习慈爱能够有效地镇伏瞋恚。第二，修习慈心时，不可以用死人作为对象，因为对死人修习慈心，不可能获得成功。"],[35,3266,3386,1,"第三，对单独一人散播慈爱时，不可以采用异性作为对象，因为可能会引发对异性的贪爱。初学慈心修习者开始时不应对三类人修习慈心：第一类，讨厌的人。因为慈心还没有培养到一定程度，对着讨厌的人修慈心，可能会越修越愤怒。第二类，平淡的人（你对他没有好感也没有恶感的人）。对这样的人修慈心，会很累，“他跟我没什么关系”，初修习慈心者给这类对象散播慈心，心会没有力量。第三类，非常亲爱的人。因为很难对这样的人生起没有执著的慈爱，会自然地生起对亲爱的人的贪爱。经常对亲爱的人修慈心，生起贪爱后，只要这个人稍微（你觉得他可能）碰到困难，就会很担心，像父母对子女，孩子在外面读书，听说下雪了，着急，“多穿衣服!不穿衣服会着凉！”一天打好几个电话,这是世俗的贪爱。（三）修习慈心的次第“学习慈爱修习”是指激起以善愿涵摄一切众生的慈爱。“个别地散播慈爱”是指按照以下次第散播慈爱:"],[35,3386,3453,0,"第一对自己修慈心。不爱自己的人不会爱别人。如果你对自己没有慈心，对别人散播慈心是假的。对自己散播慈爱要做到：觉得自己真的快乐。祝福自己快乐，祝福自己没有痛苦，真的内心觉得很柔软，自己觉得有点快乐的感觉，才可以往下一步。第二对自己尊敬的人，实在没有尊敬的人就对自己亲爱的人修慈心，但都必须同性，不能够对单个异性修慈心。第三对一般的人，没有好恶感的人修慈心。第四对你不喜欢的人、讨厌的人修慈心。要对以上四种人都修慈心，个别地散播慈爱。"],[35,3453,3564,0,"“整体地散播慈爱”是指籍着破除人、我之间的界限和分别而散播慈爱给一切众生。不分别这几人、那几人，而是对所有众生散播慈爱。（四）如何修习慈心如果你是止观行者（先获得止禅四禅再修观禅的人），一般会先成就四禅八定，有些人用白遍、有些人用光明遍，进入第四禅，再来转修慈心，就非常容易成功。为什么用白遍和光明遍容易成功呢？因为白遍和光明遍的遍相清净无染，很容易在内心清楚地取到要散播慈爱对像的相。早晚课念《应作慈爱经》，《应作慈爱经》中显示了这种修法：有一次，佛陀教导五百位比库修行十遍的四禅八定和观禅，这些比库获得四禅八定后去到森林里禅修，他们以四禅八定的定力来修习观禅，到达生灭随观智。"],[35,3564,3694,0,"佛陀时代的出家人，修行观禅的力量非常强，所以住在该森林中大树上的树神受不了 —— 比库们修观禅时，光明非常明亮，而且他们表现出高尚的素质，树神不敢住在树上，纷纷跑下来。这些比库很精进，没日没夜地修习观禅，树神不敢回到树上去住，所以树神想把他们赶走，不让他们在这里修习，用各种方法来吓他们，这些比库被吓到，回去见佛陀，佛陀为他们开示《应作慈爱经》，吩咐他们背诵这部经，并且按照这部经修习慈心，我们称为慈爱修习。这些尊者回到森林以后，因为他们有很强的定力，很快他们就培育起强有力的慈心禅那，并且向十方散播无量的慈爱。为什么他们能向十方散播无量慈爱呢？因为之前他们已经修过十种遍禅的八种定。所以，如果你已经修成十种遍禅八种定，也应该在每次禅修时先进入第四禅，比如白遍第四禅，当定力很强时，定力之光非常明亮。出定之后先以四种方式向自己散播慈爱，即：愿我没有仇敌，愿我没有内心的痛苦，愿我没有身体的痛苦，愿我拥有自己的快乐（Averāhomi， Abyāpajjhā homi， Anāghā homi， Sukhā attānaū pariharanmi） 。"],[35,3694,3767,0,"这样给自己散播慈爱几遍。对自己散播慈爱不能证得禅那，但是可以感受到对自己散播慈爱带来的愉悦。这样做，是为了能推己及人。愿自己没有怨敌，没有内心的痛苦，没有身体的痛苦，拥有自己的快乐，自己如此希望，并能感受到，就要推己及人。我们希望自己快乐，别人同样希望他们自己快乐。当我们向自己散播慈爱时，心会充满喜悦。这时我们运用禅那的明亮的定力之光，照向你敬爱或亲爱的同性，最好能够看到他全身，尤其要看到他充满笑容的脸。"],[35,3767,3906,1,"如果定力不够，比如普通人还没有定力，你就取他的影像，影像不完整没关系，但一定要取到他的笑容，然后用四种方式向他散播慈爱，Averā hontu，Abyāpajjhā hontu，Anāghā hontu，Sukhā attānaūpariharatu。愿这位善者没有怨敌，愿这位善者没有内心的痛苦，愿这位善者没有身体的痛苦，愿这位善者拥有自己的快乐。如此散播几遍慈爱给这位尊敬或亲爱的人以后，应当从四种方式中选择一种，比如愿这位善者没有内心的痛苦，只用这一句Abyāpajjhā hontu，然后不断地以内心这种状态向他散播慈爱。“愿他没有内心的痛苦”，有人说不知道如何体会他人没有内心的痛苦。你可以体会自己内心没有痛苦时的柔软、清凉、愉悦的感觉，你希望他人也拥有柔软、清凉、愉悦，就带着这样的心去祝福他人。如果你有遍禅第四禅的定力，以此为基础散播慈爱（基本上两三声或三五声），就能迅速地证到慈心初禅。你可以练习长时间安住在初禅禅那，如两小时、三小时或更久。满意之后，你可以省察禅支，如何省察呢？与安那般那禅那（省察禅支方法）一样。"],[35,3905,3976,0,"比如，祝福敬爱的人没有内心的痛苦，进入初禅一小时，出定之后即刻观察心脏部位的有分心（意门），然后回头再看你散播慈爱的对像。当该对像出现在有分心时，五禅支就会很明显地呈现在那个地方，此时你可以逐一地省察五禅支。熟悉于省察禅支之后，你应该修习初禅的五自在，成功后可以进入慈心第二禅和慈心第三禅。慈心禅只能到第三禅，不能到第四禅，因为第四禅是舍为基础的禅那。至此，你已经能用“愿此善者没有内心的痛苦”这种方式散播慈爱证得慈心的一、二、三禅。接下来，应该逐一地运用其他三种方式来散播慈爱，直到以每一种方式都能证得第三禅。"],[35,3976,4061,1,"然后再选另一位敬爱且同性的人作为对像，同样以这四种方式逐一地对他散播慈爱，直到以每一种方式都能证得第三禅。成功后再选另一位敬爱且同性的人，以同样的方法对他散播慈爱。一般建议找五个、十个，多多益善。然后可以用同样的方法向其他两种人（一般的人或者讨厌的人）散播慈爱。取讨厌的人作为对像散播慈爱时，如果一开始无法对他生起慈爱，应该重复地对自己、对自己亲爱的人和没有好恶感的人修习慈爱，直到慈心变得非常强有力，再向讨厌的人散播慈爱，然后证得初、二、三禅。如果你生命当中没有讨厌的人，就不用对这种人修习慈爱。"],[35,4061,4182,0,"也有些人，无论如何修习，都没有办法对讨厌的人修慈心，就要先解决你对讨厌的人的看法，回到刚才讲的四圣谛、八正道。为什么这个人如此讨厌，是真的吗？你要用一念之转，把讨厌这个人的观念转成正见，然后再向他修习慈心，一般就会成功。修行成功之后，可以更进一步破除人我之间的界限。应该轮流地向四种人散播慈爱，即你自己、你喜爱的人、没有好恶的人、讨厌的人。由于这时你对敬爱的人及非常亲爱的人的慈爱已经变得同等，所以将他们归纳为喜爱的人，因此就剩下四种人。应该以刚才所说的四种方式向自己散播慈爱两三遍，然后逐一地向其他三种人散播慈爱，直到各以四种方式都能证到初、二、三禅。应该不断地轮流向四种人散播慈爱，除了自己之外，对于其他三种人，每次换不同的人，修行到你对四种人的慈爱完全平等，那时就破除了人际之间的界限。四、进修遍满慈破除了人际之间界限之后，进修慈心遍满。慈心遍满分两种：一种是不限定对像的慈心遍满，一种是有限定对像的慈心遍满。不限定对像的慈心遍满可以分为五种或二十种，而有限定对像的慈心遍满可以分为七种或二十八种。"],[35,4182,4226,0,"什么是五种或二十种不限定对象的慈心遍满？有五种不限定的对象，即Sabbe sattā，sabbe pāṇā，sabbe bhūtā，sabbe puggalā，sabbe attabhāvapariyāpannā，一切有情、一切众生、一切生类、一切个体、一切拥有自体者。为什么称他们为不限定的对象呢？因为他们每一种都涵盖一切众生。一切有情就是一切众生，一切有息者就是一切众生，一切生类就是一切众生，一切个体也是一切众生，一切有生命者也是一切众生。"],[35,4226,4308,0,"开始修行不限定对像的慈心遍满时，应该先选定一个范围，比如一个寺院的范围，或者在家人选家的那栋楼附近范围，以慈心禅的光明照见该范围内的各种众生。如果修完四禅八定，理论上，包括天神、人类、动物及其他恶趣的众生都能看到。然后以四种方式向他们散播慈爱：“愿一切有情没有仇敌，没有内心的痛苦，没有身体的痛苦，拥有自己的快乐。”修到以每种方式都能够证得初、二、三禅，然后再用相同的四种方式向该范围内的一切有情、一切众生、一切个体、一切拥有自体者散播慈爱，直到以每种方式都能证得初、二、三禅。由于对每种对像都有四种方式，所以总共有二十种方式。接着可以修行有限定对像的遍满慈心。众生可以分成七种：一切女性、一切男性、一切圣者、一切非圣者、一切诸天、一切人类、一切堕苦处者。"],[35,4308,4421,1,"在此有一点要说明：向单一人散播慈爱时，不可取异性为对象，但向异性整体地散播慈爱是可以的。比如男众对一群女众或女众对一群男众散播慈爱是可以的。需要先用禅那的光照见这座寺院范围内或者这栋楼范围内的一切女性或者一切男性，然后逐一地以四种方式向他们散播慈爱：“愿一切女性没有怨敌、没有内心的痛苦、没有身体的痛苦、拥有自己的快乐。”以每一种方式都能证得初、二、三禅。一切女性、一切男性、或所谓的一切圣者、一切非圣者，只是出自于个人的主观想像而已，所见的未必真是圣者，只是以这种方式向他散播慈爱，包括一切的非圣者、一切诸天、一切人类、一切堕苦处者，对每一种对像都有四种方式，总共有二十八种方式，加上二十种不限定对像的慈心遍满，总共有四十八种遍满慈。"],[35,4414,4554,0,"成功之后，可以将范围扩大到小区，或者寺院外边，再以四十八种方式来散播慈爱。成功后，再渐次地扩大范围到一个村庄、两个村庄、一个城镇、一个省市、一个国家、几个国家、东半球、西半球、整个太阳系、整个银河系、三十一界的生命类。根据上座部教法，一组三十一界是一个世界（轮围界）。如此的世界是无量无边的，即有无量组的三十一界。因此，成功地以四十八种方式散播慈爱到每一个世界之后，应该把范围逐步地扩大到无边世界。能够将慈爱扩散到无边世界以后，应该将慈爱扩散到十方，即依方向的遍满慈，这是指逐一地对十方无边世界的众生散播慈爱。先把光照向东方，照见东方无边世界里的众生（很多人能够看到梵天人、天人、人类或其他众生），然后以之前提到的四十八种方式向他们散播慈爱。然后再以同样的方式将慈爱散播到西方、北方、南方、东南方、西北方、东北方、西南方、下方、上方的无边世界。如此总共有四百八十个依方向的遍满慈，再加上前面提到的四十八个不依方向散播慈爱到无边世界的遍满慈，所以一共有五百二十八个散播遍满慈的方法。对于能重复地修习这五百二十八种遍满慈的禅修者，就能够很有效地镇伏瞋恚，而且能够获得慈心禅那的十一种利益。"],[35,4554,4636,0,"关于慈心禅那的十一种利益，以及在佛陀时代拥有慈心禅那的人的能力、典故，下堂课再学习。祝愿大家都能够去除瞋恚，拥有慈悲！回向功德！"],[36,0,349,1,"189 摄集-摄菩提分-法念处-五盖 3古源尊者一、 灭除瞋恚的六种方法上节课学习了灭除瞋恚的六种方法：1.学习散播慈爱；2.培育慈心禅那；3.思惟自己所造的业是自己的财产；4.数数如理思惟；5.亲近善知识；6.有助于培育慈心和灭除瞋恚的适当言论。二、 如何修习慈心遍满我们也学习了如何修习慈心遍满，共有五百二十八种遍满慈的修习方式。经常有人说：“这人很慈悲”、“我们应该慈悲”、“这个人的慈悲心很强。”但往往会发现有很多人对一类人慈悲，对另一类人无法慈悲；对一类众生慈悲，对另一类众生无法慈悲。比如动物保护者提倡保护老虎，但老虎需要掠食，他们一看到老虎没有吃的就很心痛，而对于被老虎吃的那个动物，却没有想过是否应该被吃，这是慈悲还是不慈悲呢？真正的遍满慈是对一切众生的慈悲。"],[36,349,419,0,"对众生慈悲的修习应从对自己开始，首先能够对自己散播慈爱，然后对自己尊敬的亲人散播慈爱，对普通的朋友、无感的人散播慈爱，对自己不喜欢的、讨厌的乃至于仇敌也能够散播慈爱，再扩展出来到五百二十八个方向的众生，都能够对他们散播慈爱，这才算是慈心修习的圆满。佛教界中，常听人说：“你有没有修慈悲心啊？”真正的慈悲心应如此修才算圆满，即使很多修课程修到遍满慈程度的人也会发现：在修慈时感觉比较好，但下坐以后该对谁生气还照样生气，这就是慈心不能持续。"],[36,419,503,1,"如何让慈心遍满，且在一切时处都能够生起慈心呢？应于一切时处练习。作为修慈心的人要受持慈心九戒，以慈具之心遍满一切众生类而住，即一整天的行住坐卧都在慈心里面，慈心才能够持续地被生起。三、 慈心禅那的十一种利益如果能够获得慈心禅那，就会有十一种利益。在《增支部•慈爱经》里，佛陀说：『诸比库，当慈心解脱被培育、开展、勤习、驾御、作为基础、建立、稳固与正确地修行时，可望得到十一种利益。』对于“培育、开展、勤习、驾御、作为基础、建立、稳固”这样的翻译，在之前wikipāli 课程中讲过，它本来是有次第的，在此不再细讲，就讲这十一种利益。"],[36,503,576,1,"哪十一种呢？一、睡眠安稳；（如果睡觉不好的人就要修习慈心）二、不做恶梦；（会做恶梦的人多修慈心）三、醒觉安稳；（很多人有起床气，醒来就不舒服、头痛、头晕、醒觉不安稳，就要修慈心。）四、为人所爱；（经常对人有慈心，别人就会喜欢你）五、为非人所爱；（鬼界、阿修罗、夜叉也喜欢你，不会害你、不会给你捣乱。）六、天神守护；（天神会守护你）七、不被火、毒药与武器所伤害；八、心易得定；九、相貌安祥；（人家说这个人慈眉善目，看着很舒服）十、临终不迷惑；（临终的时候不会昏迷，修慈心的人一定不会得老年痴呆症。）"],[36,576,691,0,"十一、若未能证得更高的成就，他将投生到梵天界。（如果他没有证得更高的禅那或更高的道果或证得阿拉汉，他会投生到梵天界。以慈心初禅、二禅、三禅维持到临终，将会投生到梵天界。）对于已经精通慈心禅那的人，他能很安稳地睡眠，就好像入定一般。他不会做恶梦，如果做梦，也只有好梦而已。他醒来时会觉得很安稳。除了人会喜欢他之外，天神也会喜欢他，就像维沙卡长老（Visākha Thera）的例子。Visākha 长老精通慈心禅，他以慈心禅为基础修行观禅而证得阿拉汉果。由于他的慈爱非常强，所以众天神都很喜欢他。有一天，他走在前往庄严山寺（Cittalapabbata Vihāra）的路上，走到一个分叉路口时，不知道哪一条路通向庄严山寺。那时有一个天神为他指路，所以他顺利地到了庄严山寺。他有个习惯，就是在每一个地方都只住四个月，因此于该寺住了四个月之后，最后一夜他收拾好衣钵然后就寑，打算隔天就离开。当他正在睡时，摩尼树的树神便坐在梯级上哭泣，长老问：“是谁在哭？”"],[36,691,747,1,"“尊者，我是摩尼树神。”“为什么哭？”“尊者，因为您就要离去了。”“我住在这里对你有什么好处？”“尊者，您住在这里令此地诸神互相慈爱；您走后，他们就会再互相争吵，甚至说粗言恶语。”长老说：“如果我住在这里能帮助你们安乐地生活，那么我就再多住四个月。”四个月后，当他再要离去时，那树神又再悲泣，如此长老无法离开那寺院，在那寺院住到最后入般涅槃。如是，对于慈心很强的人，不只是人会喜欢他，天神也会喜欢他。"],[36,747,925,0,"慈心禅的第六项利益是“受到天神守护”。这就有如之前提到被众树神惊吓的五百位比库之例，他们向佛陀请教，佛陀教导他们《应作慈爱经》，他们回到同一座森林背诵该经以及依照该经修习慈心禅，因而培育起极强的慈心。由于慈心的力量，原本惊吓他们的众树神变得喜欢他们，帮他们打扫住处、准备饮水等，而且保护他们，散播很好的香味，使他们能专心修禅。这显示天神会保护已证得慈心禅的人。关于慈心禅的第七项利益“不被火、毒药与武器所伤害”。举几个佛陀时代的例子来说明。佛陀时代有两位杰出的在家女弟子，其中一位是优陀罗（Uttarā），也名为难陀母（Nandamātā）。她修习慈心禅直到证得禅那，然后再以它作为基础来修习观禅，因而证得了初果。有一天，当她正在厨房里煮食物以便供养佛陀与僧团时，为了有时间供养佛陀，她雇来一位服侍丈夫的高级妓女利摩（Sirimā）（当时中印度非常著名的妓女），Sirimā 长期在家陪着Uttarā 丈夫，就觉得自己是女主人了。有一天当Uttarā 在厨房准备食物供养佛陀时，丈夫带着 Sirimā 出来，他觉得太太有些不可思议：“自己忙得半死，雇一位妓女来照顾自己的丈夫”，就笑她，Uttarā 看到丈夫笑，也和他相视一笑，Sirimā 看到两夫妇眉来眼去，感到妒恨与愤怒。"],[36,908,996,1,"她冲进厨房里，舀了一勺滚烫的油往 Uttarā头脸泼过去，当时Uttarā 即刻进入慈心禅，因而那油就像荷叶上的清水一般从她身上流过，对她没有一点伤害。这就是能够避免火、毒等的伤害。另一个是莎玛瓦蒂王后（Sāmāvatī）的故事，她有一位侍女叫姑如达拉（Khujjuttarā），是佛陀另一位突出的在家女弟子。此侍女经常去寺院听佛陀说法，回到宫里就将所听闻的法说给莎玛瓦蒂王后和五百位侍女听。她们都修习慈心禅直到证得禅那，然后以它为基础来修行观禅，全部证得初果。"],[36,996,1074,1,"有一天，乌提那王（Udena）听信另外一位王妃的陷害、离间语，以为王后要放毒蛇咬他，所以感到很愤怒，他命令莎玛瓦蒂王后及其五百位侍女排成一行，然后拿起弓与毒箭，想要用箭把她们全部射死。当时莎玛瓦蒂王后吩咐她的侍女们不应瞋恨国王，而应向他散播慈爱。由于她们极强的慈爱力量，使国王的毒箭发射不出去，因此也就伤害不了她们。当时国王的箭一直射不出来，莎玛瓦蒂王后就问国王：“你累不累？”，国王回答：“很累”，莎玛瓦蒂王又问：“那你为什么不放下来呢？”，然后他就放下来，毒箭就射到地上。"],[36,1071,1148,0,"还有僧吉帝沙弥（Saṇkicca）的故事，他七岁时就证得阿拉汉果。有一天，一群强盗捉住他，想要杀他来祭神，就在强盗首领用刀砍他的头时，他进入慈心禅。由于慈心禅的力量，那把刀被砍弯了也伤不了他分毫。因此对于拥有慈心禅的人，武器也伤不了他。拥有慈心禅的人也能像须菩提（Subhūti）尊者一般容易获得定力。佛陀八十大弟子中须菩提是慈心禅第一的比库，他以慈心禅作为基础来修行观禅，最后证得阿拉汉道果。他有个习惯，就是在托钵时，站在每家门前进入慈心禅，等到主人拿食物出来了，再出定接受饮食供养，他能够迅速地进入禅那。"],[36,1148,1226,0,"慈心禅的另一项利益是相貌安祥。为什么呢？当禅修者进入慈心禅时，慈心禅那心持续不断地生起，每一个禅那心都产生许多具有八种色法的心生色聚，这些色法非常殊胜而且遍布全身。由于这些殊胜色法的缘故，他的相貌变得非常安祥、明亮。再者，当他内心充满慈爱时，其心毫无瞋恚，所以他的脸时常保持微笑，显得很安祥。慈心禅的另一种利益是临终不迷惑。能在临终时保持善心是非常重要的，为什么呢？因为若人的临死速行心是不善心，他肯定会投生到恶趣；反之，若人的临死速行心是善心，则肯定会投生到善趣。由此可知临终不迷惑是多么重要。精通慈心禅的人在临终时可以再度进入该禅那，而能不迷惑地投生到梵天界。"],[36,1226,1343,1,"慈心禅的第十一项利益是如果未能证得更高的成就，他将投生到梵天界。以上是慈心禅的十一项利益。然而慈心禅只能暂时灭除瞋恚；若要根除瞋恚，必须精进地修行直到证得不来道（三果圣者），因为该圣道才能根除瞋恚。（三果圣者不管碰到任何事情都不会生气。）所以要知道慈心禅那的价值和意义。如果真的想去除五盖里面的瞋恚盖，就要修习慈心禅。四、 昏沉睡眠盖接下来学习五盖中的昏沉睡眠盖。对于法念处中五盖的昏沉睡眠盖，佛陀如此教导：『内心存在昏沉、睡眠，了知‘我内心有昏沉、睡眠’；内心不存在昏沉、睡眠，了知‘我内心没有昏沉、睡眠’。他了知未生起的昏沉、睡眠如何生起；了知已生起的昏沉、睡眠如何捨断；也了知已捨断的昏沉、睡眠于未来如何不再生起。』这是法念处中佛陀教导如何对付昏沉、睡眠盖的言教。具体应如何理解呢？"],[36,1334,1403,1,"（一）昏沉与睡眠之因1.用餐后的昏睡；2.心的软弱；3.产生新的昏沉；4.与睡眠有关；5.导致现有的昏沉、睡眠增长和增强的因。不如理作意“无聊”等法，昏沉、睡眠即会生起。这些是昏沉、睡眠最根本的因。什么是“无聊”呢？无聊就是不满意，“这个没什么意思”，打个哈欠，这时昏沉、睡眠就来了。散漫是身体的怠惰，散散漫漫，坐没坐相，找个地方就是想靠靠，回家就窝在沙发里面，就是散漫、身体的怠惰。身体的软弱无力是在起身等各种动作里迟缓地弯身，有气无力的样子。"],[36,1403,1472,0,"用餐后的昏睡是在食用饮食之后昏沉，就是吃多了，身体的火界（气血）都要用于消化，容易昏沉，也称为用餐后的不适。心的软弱是心的昏沉。时常不如理作意这些法会容易产生昏沉与睡眠，因此世尊说：『时常不如理地作意、无聊、倦怠、身体的软弱无力、用餐后的昏睡及心的软弱是产生新的昏沉与睡眠之因，也是导致现有的昏沉与睡眠增长与增强之因。』（二）灭除昏沉与睡眠的方法要去除昏沉与睡眠，就要通过如理作意来解决。如理作意什么呢？主要是如理作意“界”等法，即十二处、十八界，就能灭除昏沉与睡眠。"],[36,1472,1573,0,"致力界（ārambhadhātu）是初步的努力;精勤界（nikkhamadhātu）是比致力界更强的精进，因为它将懈怠抛在后头;不断精进界（parakkamadhātu 勇猛界）比精勤界更强，因为它不断地进一步灭除破坏性的因缘，通过数数如意作意这三个层次的精进，就能灭除昏沉与睡眠。因此世尊说：『时常如理作意致力界、精勤界及不断精进界这三层次精进是防止新的昏沉与睡眠生起之因，也是灭除现有的昏沉与睡眠之因。』“时常如理作意致力界、精勤界及不断精进界”，这是对在佛陀时代的比库而言。佛陀时代的比库少欲知足，内心很专注，对佛陀的法有极强的信心，其他的四盖：欲贪盖、瞋恚盖、疑盖、追悔盖比较少，所以当昏沉睡眠出现时，基本上就是不如理作意的原因造成。"],[36,1573,1636,0,"对于现代人，特别是现代的在家人而言，如果于昏沉睡眠时致力于致力界、精勤界、不断精进界，可能会带来其他问题。为什么呢？当内心还未宁静时，若你一定要很有力地‘致力于界、致力于精勤界和不断精进界’，就会造成邪精进。很多人不知道什么是正精进，就会出很多状况。禅林里经常会办禅修营，有些人说：“这次来，坚决坐着就不起来，我要把禅堂坐穿！”这样的人基本上没有能够真正坚持到把禅堂坐穿，往往坐几天就坐不住了。所以精进并非是你想精进就能精进，精进是要有基础条件的。"],[36,1636,1691,0,"不如理作意是昏沉与睡眠生起的近因，而如理作意则是灭除昏沉与睡眠的近因，因此应该舍弃不如理作意而培育如理作意。如何培育呢？如果你在修行止禅，例如安般念、地遍或三十二身分，那就应该只专注于该止禅业处。别小看那单调的呼吸，因为通过一心专注它就能培育极强的如理作意；如果在修行观禅，那就应该一心观照诸行法为无常、苦、无我、不净。止禅与观禅的如理作意能灭除昏沉与睡眠，无论修行其中的哪一种，都应该运用致力界、精勤界及不断精进界这三层次的精进，如此就能克服昏沉与睡眠，成就禅修。"],[36,1691,1797,1,"今天有一些禅修者来参加禅修营，有很多人是初次来禅修，会经历一个阶段，开始禅修的前几天会很容易昏沉与睡眠，以致力于界、致力于精勤界与不断精进界对治这个昏沉与睡眠有用吗？有用！但是效果可能不会很好。刚开始为什么会容易昏沉呢？大家在世间工作太忙，生活很艰难，不容易，我们总是不断地、无止尽、没有节制地去使用我们的心，我们的心很疲倦，所以来到禅林把其他事情都放下了，然后坐下来了，你的心就会认为：“终于可以休息一下了！”就会很想睡觉。这种情况下一般我建议大家睡一会儿，没关系，你让它睡一会儿，正念地让它睡一会儿。它一般打个盹，“嗯！”马上就精神起来，精神起来就继续觉知。要这样来致力界，这样会比较好。当两三天过后，那个昏沉消失了，接着下来就会打妄想，各种事都会冒出来，到了这个阶段如果再出现昏沉就要开始致力于精进界、不断精进界，因为心已经休息过了，接下来是打妄想的问题，这个时候如果再昏沉，就应该："],[36,1795,1872,1,"1.完全转换身体姿势。比如坐得很舒服，你就跪起来，跪起来还困就站起来，站起来不行就经行……后面还有佛陀教的很多方法。2.作光明想。坐那儿昏沉了，你就作意：“哦，现在在阳光的照耀下。”有些人也能解决，但大部分的人不容易。3.住在露天下。现在没有下雨，大家如果愿意，有很多树下坐的，可以坐在树下，凉风习习，就不容易昏沉睡觉。4.知道饮食过量能导致昏沉与睡眠生起。禅修者不要吃太多，基本上我建议不是吃八分饱，六到七分饱就可以了。特别是早上，早上就喝点粥、吃点馒头就可以了。下午因为允许大家午休，晚上没有晚饭，有些同学会饿，所以中午可以多吃一点，回去好好休息，下午起来还是有力量。"],[36,1872,1952,0,"5.结交善知识。就是亲近善知识教导怎样克服昏沉与睡眠。6.有助于灭除昏沉与睡眠的适当言论。在此提出佛陀教导目犍连尊者（Mahāmoggallāna）克服昏沉与睡眠的八个方法，或许对大家有帮助。这八个方法是：（1）不应注意昏沉的念头。如何理解‘昏沉的念头’？有不同的解释，觉得“现在挺困的，今天挺疲惫的。”这就是作意昏沉，“挺累的，是不是昨天没睡好？应该休息一下。”那么很快就睡着了。另一个‘注意昏沉的念头’，这个比较微细 —— 当心比较平静，觉知呼吸妄念没有了，心也很平静，平静下来有点轻安的感觉起来，不会把握的人就会去享受那种轻安的感觉，一享受轻安的感觉，心一平静下来，人就睡着了。"],[36,1952,2020,1,"（2）思惟佛法，例如《转法轮经》及各种保护经；（3）背诵佛法，早晚功课；（4）拉扯自己的耳朵，按摩四肢。揪一揪耳朵，捏一捏脚；（5）从座位起身，以水洗脸后，遥望天空的星辰；（6）作光明想；（7）在清楚前方及后方之情况下来回行走及经行，令诸根向内收摄，不让心向外飘荡；（8）当前面七种方法都无效时，应当小睡片刻。保持正念正知及谨记应当起身的时刻而躺下睡觉。醒来之后应当立刻起身，心想：“我不应放纵自己而乐于躺卧、乐于睡眠。”"],[36,2020,2167,1,"这是佛陀教导神通第一的目犍连 Mahāmoggallāna 尊者的方法，对现代人而言可能有些人有效，有些人无效。总体来讲，我碰到的同学们普遍的习惯就是到他开始昏沉时，用什么方法都没用，就是要睡着。基本上唯一的方法就是跪起来、站起来、出去经行、冷水洗脸，这是比较有效的，做光明想、揪耳朵就是片刻有用，马上又昏沉了。我觉得还有一个昏沉睡眠的原因，更多是错误的认知习惯。主要表现在对于禅修没有一个正确的态度。很多人对禅修的认知，要么就是：“我一定要证禅那！我一定要证禅那！”使劲地抓取；要么就是觉得：“禅修就是让自己舒服一些、快乐一点。”跟以前做瑜伽、冥想时比较：有没有更快乐一些？如果没有就没什么意思，无聊的心就会出来。佛陀说，只要作意无聊，就昏沉睡眠。其实对于一个佛教徒来禅修，首先要有信心，信心就是对八事的信心，对佛、法、僧三宝，对戒定慧三学，对过去五蕴、未来五蕴、过去未来五蕴，对缘起的信心，对于生命状态的信心。这对于初学者而言可能不容易，但有一点我觉得是共通的，无论是佛教徒还是非佛教徒都要明白——禅修是作为镇服自己烦恼的一个工具。"],[36,2167,2230,1,"戒定慧三学对治不同的烦恼：戒是镇伏违害性的烦恼；定是镇伏困扰性的烦恼；慧是断除潜伏性的烦恼。禅修修定就是要镇伏困扰性的烦恼。困扰性的烦恼，首先要通过禅修知道有哪些困扰性的烦恼比较强。即使你不是佛教徒，只是“我想来禅修、想减轻我的压力。”压力不就是烦恼吗？压力怎么来的？压力就是各种紧张（瞋心），禅修是要解决烦恼问题，而不是获得什么东西。当你带着‘禅修要去获得什么东西’的观念，你在禅修过程中就会碰到各种各样的问题。"],[36,2230,2324,0,"对于禅修已经上道的人，昏沉与睡眠往往出现在五根不平衡时，不懂得调整五根、不懂得平衡七觉支造成。觉得很舒服，去享受那个舒服，大部分人就会很快落入有分、沉进去睡着了。对于初学者，还不懂得平衡七觉支时，建议大家：当你禅修时觉得很舒服、很轻安，那时就不要再鼓励自己继续享受了，应鼓励自己提起精进力，更多地去觉知呼吸的细节，或者把自己的欢喜心提策一下，把心策励起来。策励心有三个要素：择法觉支、精进觉支和喜觉支。策励三个中任一都可以，策励择法觉支：检查有没有不善心可能生起；策励精进觉支：更细地、更清晰地、更努力地去觉知呼吸的细节；策励喜觉支：对每一个呼吸都非常地欢喜，真正地让“喜”—— 雀跃的心生起来，就不会昏沉睡眠。这是在禅修过程中应该明白的。"],[36,2324,2394,0,"五、 掉举追悔盖佛陀继续开示说：『内心存在掉举、追悔，了知‘我内心有掉举、追悔’；内心不存在掉举、追悔，了知‘我内心没有掉举、追悔。’他了知未生起的掉举、追悔如何地生起，了知已生起的掉举、追悔如何捨断，也了知已捨断的掉举、追悔未来如何不再生起。』如何灭除掉举、追悔呢？世尊说：『通过如理作意心的轻安或定，就能灭除掉举与追悔。时常如理作意心的轻安或定是防止新的掉举与追悔生起之因，也是灭除现有的掉举与追悔之因。』注疏解释有六种方法能帮助灭除掉举与追悔："],[36,2394,2488,1,"（1）对佛法有深入的知识。深入经藏，学习、认知、体证佛法；（2）发问。勤于发问；（3）了解戒律；（4）与年长且对持行戒律等更有经验者相处；（5）结交善知识；（6）有助于灭除掉举与追悔的适当言论。在解释这六种方法时，注释说：“对于学习一、二、三、四或五部尼柯耶（经藏）的意义及语法的人，掉举与追悔就会消失，这是通过对‘佛法知识’的深入了解而克服掉举与追悔的方法。”为什么可以这样做到呢？很多掉举与追悔其实与信心不足有关——“我这样的方法是不是对啊？这样的方法是不是错？这位老师讲得是不是和经典相符？我是不是能够修下去？我是不是二因结生？”这一系列就会造成掉举，或者“我过去碰到了什么？修法修错了！当时就不应该这样。”去追悔。"],[36,2488,2614,0,"如果深入学习就会发现，与其掉举和追悔，还不如现在每一念都守在呼吸上。掉举、追悔是最没有用的不善法，有一些不善法，比如遇到一些要欺负你的人，一生气人家还会怕你一下，‘生气’还起到作用。追悔是“我的过去、未来……”就只有伤害自己，没有其他任何用处。当修习佛法明白这个道理的时候，就不要老去这个想想、那个想想，这个怀疑、那个怀疑，然后追悔。最近跟大家讨论原生家庭的问题，很多人一梳理就解决了，很多人就老是缠绕在所谓原生家庭里面，“我妈、我爸、我当时……”始终走不出来,这就是不能对佛法真实地理解。简单来讲，佛法的核心是教导我们如何以持续正确的认知行为模式生活，根本点在这里。当我们活在对过去的怨恨、追悔、抱怨时，就是一直在错误的认知行为模式里面捣腾、不出来,原因就一点，没有其他的。剩下的是那些惯性，如何看待惯性？如《寻止息经》中佛陀教导来对治。最简单的是：观察它，等它消失，作意它无常、苦、无我，就走出来了。没有必要纠结：“惯性总是出来！”总是出来就总是观察它，等它消失，作意它无常，就结束了。"],[36,2614,2701,1,"“发问”是指多问在戒律上什么适当和不适当。对于如此做的人，掉举、追悔也会消失。对于通过实际运用及掌握戒律本质而精通戒律者，这两种恶法（掉举与追悔）即会消失，这即是“了解戒律”。“了解戒律”对于出家人，或在家人守五戒、八戒，群里经常有人问：“这个算不算犯戒？”以前讲过，有一位尊者，09年、10年在曼听禅修的时候禅相就很亮了，到现在都不敢讲禅相了，每天记犯戒的记录，天天找人忏悔，整个禅林所有他认识的人都多次陪他忏悔过，很苦。你说他真不懂？他挺懂了，他已把所有戒律都翻遍了；你说他懂，他又真不懂，真懂就不会天天这样折腾自己。"],[36,2701,2766,1,"这种情况就适合“与更有经验者相处”。“与更有经验者等相处”是指去拜见及咨询僧团中具有道德（持戒精严或精通戒律）的长老。通过这些拜访，掉举与追悔即会消失。“结交善知识”是指与如精通戒律第一的优婆离（Upāli）尊者一般的善知识交往。在那种群体当中，掉举与追悔即会消失。在此，‘适当的言论’特别是指讨论在戒律上什么是适当及不适当的，通过这么做，掉举与追悔即会消失。以上特别指在僧团里的生活，对于在家人来讲，其实更多地也是跟戒有关，“我做的事情恰当不恰当？是善还是不善？好不好？”就这个方面的更多的追悔与掉举。"],[36,2766,2848,0,"这六种方法有助于镇伏掉举与追悔，但要彻底地断除掉举，必须于证得阿拉汉道时掉举才会被根除而不再生起，追悔必须证得阿那含道才会被根除而不再生起。追悔属于瞋，掉举属于痴，掉举是痴根心，阿拉汉道智才可以断除痴根心。追悔是瞋根心，追悔是“我不应该啊！当时怎么这样啊？”对自己过去已做的不善和未做的善的排斥，对自己状态的排斥，所以是瞋心。瞋心在证得三果时可以连根拔除。《注疏》解释：个别地看待时，掉举和追悔是两个不同的法，但由于对已造恶业及未造善业的追悔与以心散乱、不宁静为特相的掉举相似，所以称“内心的扰动”为掉举与追悔。"],[36,2848,2970,0,"对于已透彻地了解圣典的涵义及明白佛法重要性的博学者，心的扰乱不会生起。因此，不仅需要了解戒律，也需要了解佛陀的经、如是语、本生等九分教，以及通过发问等方法，才能避免掉举与追悔生起。通过与有自制、年长且成熟的长老相处，也能获得自制、成熟、庄严及平静的性格，而能够灭除掉举与追悔。“结交善知识”是指与精通戒律及能灭除他人怀疑何为适当及不适当等忧虑之人相处。对于希望去除禅修时的掉举，须特别强调，前面所说是僧团里的情况，而且是佛陀时代僧团的情况。对于现在的禅修者来讲，如果要去除禅修时候的掉举，首先要守护根门，要懂得“非礼勿视，非礼勿听。”没事的时候就把心放在自己的身体上，称为正念“身念处”，平常的时候要训练正念正知、守护根门，一切时处都能够在“身、受、心、法”四念处上。对于普遍禅修者、初学者而言，首先要能够觉知身体的状态和动作，大部分人要从这个基础开始。如果在日常时候的正念正知都不能培养，想在禅修时心非常平静，这是不可能的，这是很难的一件事情。"],[36,2970,3097,1,"我们不要跟佛陀时代的僧团尊者相比，对于初学者，需要念与正知，有正念、有正知地生活和工作才能够解决掉举的问题，然后努力地把法活出来！六、 疑盖最后一个是疑盖，佛陀说：『内心存在疑，了知‘我内心有疑’；内心不存在疑，了知‘我内心没有疑’。他了知未生起之疑如何生起，了知已生起之疑如何捨断，也了知已捨断之疑于未来如何不再生起。』不如理作意基于怀疑之事会导致怀疑生起：“基于怀疑之事”是立足于怀疑或朝向怀疑进行的事，是导致怀疑生起的原因。依共同的原因，前面之怀疑成为后来生起之怀疑的原因，所以佛陀说：『不如理地作意基于怀疑之事是导致新的怀疑生起之因，也是导致现有的怀疑增长与增强之因。』比如，在觉知入出息时，就说：“入出息是这样觉知的吗？”如果对“是这样觉知的吗？”这件事情不能够生起信心，不断地怀疑就会生起，对“是不是入出息？”的怀疑会导致后面的觉知及整个的过程都会充满怀疑。"],[36,3097,3238,1,"如理思惟善行则能灭除怀疑，佛陀说：『在勤于如理思惟善法与不善法、当受指责与无可指责之法、应修行与不应修行之法、卑劣与高尚之法、邪恶与公正之法、好与恶之法，就能防止新的怀疑生起，也能灭除现有的怀疑。』有六种方法能帮助灭除怀疑：1.精通佛法；2.问有关佛、法、僧的问题；3.透彻地了解戒律；4.对佛、法、僧的真实性有信心；5.结交善知识；6.有助于灭除怀疑的适当言论。第一项之前已经解释过，即明白圣典的意义及语法的知识；第二项是肯定通过拥有佛法的知识及发问就能灭除一切的怀疑；第三项是指精通且能实际修习戒律；第四项是对佛、法、僧有极强的信心；如何理解呢？为什么透由精通佛法、问有关佛法僧的问题、了解戒律、对佛法僧三宝真实性有信心……就能去除怀疑呢？我们知道“疑”正对的是“信”，为什么怀疑呢？就是没有信心，没有信心其实就是在修学的过程中，对于‘什么是该修学的法、什么是不该修学的法；什么是正确的法、什么是错误的法’不了解。经常会有人问：“什么是善恶？”“打孩子算不算善？”没有学习佛法的人就不知道。为什么很多中国人总是喜欢用大人的意志去要求孩子呢？"],[36,3238,3313,0,"而且认为是应该的——“子不教，父之过。我不教他，谁教他？让他变鬼、变坏吗？”但是要知道当你用瞋心去面对孩子时，就是不善法。这只有佛陀才会教导，其他所有地方宗教都没有教。一般只是说“这样不应该，会引起什么……”唯有佛陀说“这是不善法，是瞋心，瞋心生起的当下自己受到伤害，别人会受到伤害，未来会产生不良的后果。”孩子会顶撞、会叛逆，更严重他会跳楼。在这个层面，佛法就说得很清楚:“什么是善？”当下生起的心是善就是善；“什么是不善？”当下生起的心是不善就是不善。与道德、习俗、文化，是父子还是母子并没有直接的关系，而是看你的心。对于这样认知的理解，只有向佛、法、僧三宝请教才能问得到。"],[36,3312,3383,1,"第五项是请教如瓦卡利长老（Vakkali Thera）一般深具信心的善知识;第六项是讨论三宝的特质。在学习信心所时，讲到什么是对八事的信？什么是真正的佛？印度人说：“我们历史上有很多佛。”你就会明白,“佛”这个符号并不是专指的，而且对佛陀的理解，不同的观点也很多。我经常跟一些人讨论：“你信的佛跟我信的佛不一样，你信你的佛，我信我的佛。”什么是正确的“佛”？什么是正确的“法”？什么才是真正“应受供养、应受供奉、应受布施、应受合掌礼敬”的圣弟子、圣贤僧呢？这就有很大的差别。"],[36,3383,3432,1,"什么是戒？什么是定？什么是慧？什么是戒定慧三学？戒到底应该怎么持？佛陀制戒的意义是什么？什么是修定？定有四十种业处，哪四十种业处？应该怎么修？定的作用是什么？什么是慧？什么是十六观智？十六观智解决什么问题？止观是工具，工具要干什么？这些只有在你对佛陀的法真实生起信心的时候才能够明白。比如说“到底有没有灵魂？”“到底有没有一个神识？”这个要靠什么？要靠观智去观察，要靠缘摄受智去观察，这样观察完以后才能从这里面走出来，疑惑才会消失。"],[36,3432,3554,0,"但不管怎么说，用任何方法现在都只能暂时地摁住、镇伏怀疑，只有在证得初果时，疑才能够彻底地被断除。应于日常生活中善于运用这六个方法。为了根除它，除了运用上述六个方法之外，应培养闻慧、思慧、修慧。除了听闻佛法、思惟佛法，改变错误的认知习惯，成就正确的认知习惯，同时应修习止禅，培育足够强的定力，然后以该定力为基础修习观禅，应该观照究竟名色法及它们的因（缘起），当你透彻地照见过去因导致现在果及现在因导致未来果时，就会清楚地明白业力如何产生果报。这种了解缘起的观智称为缘摄受智，它能暂时灭除对业果法则、缘起与生死轮回的怀疑，这是非常重要的。如果你不曾照见自己的过去世，也不了解缘起，就不可能证悟涅槃，为什么？因为从证悟入流道的那一刻开始，禅修者自然地对佛、法、僧生起不可动摇的信心。业果法则、缘起与生起轮回是佛陀教法的重要部分，如果你还不曾以观智直接照见它们，又怎么能肯定且毫不怀疑它们的存在呢？即使是已经直接照见它们的人也还只是“小须陀洹”（证得缘摄受智的人叫小初果），暂时地去除自己的疑，至少这一生能去除他的疑。"],[36,3554,3626,0,"那么是否可能还未照见它们就成为入流呢？即使你说自己对它们有十足的信心，但那只像婆罗门众对他们不曾亲眼见过的大梵天有十足的信心而已，因为你对法的十足信心只是依靠理论知识而建立起来的，并不是建立于亲身体验的观智。请记得，名字与头衔并不重要，重要的是真正地证悟涅槃。因此如果你自认为是入流者（初果圣者），为了你自己切身的利益，你应该细心思考帕奥西亚多这一番话。很多人修观智认为不要修缘起，认为只要刹那缘起就可以了，过去的已经过了，未来的还未出现。甚至有些人认为缘起对于三岁以下的小孩是不存在的，这种讲法也在上座部都出现过，所以要很小心!"],[36,3626,3691,0,"观照缘起之后应该观照内外诸行法为无常、苦、无我、不净。观照内外的行法为无常、苦、无我是很重要的，为什么呢？因为如果你只是内观，只是观照自己，怎么能肯定外在的没有“常”或“我”的行法呢？有些人就认为大梵天是“常”和“我”的，怎么证明那是错的呢？怎样才能去除自己对它的疑惑？这是为何佛陀教导我们必须也观照外在行法为无常、苦、无我。当你的观智成熟时，取涅槃为目标的入流道智会生起，此圣道根除怀疑，令它永远不会再生起。那时你就已彻底地了知涅槃是真实存在的、佛陀的证悟是真实的、已经证悟涅槃的圣弟子僧团是存在的、八圣道分的确是导向涅槃的道路，而你对佛、法、僧三宝的怀疑就因此完全灭尽。"],[36,3691,3788,1,"七、 更高阶段的观智佛陀说：『如此，或于内法随观法而住，或于外法随观法而住，或于内外法随观法而住。或于法随观生起之法而住，或于法随观坏灭之法而住，或于法随观生起、坏灭之法而住。他现起‘有法’之念，只是为了智与念的程度。他无所依而住，亦不执取世间的一切。诸比库，比库乃如此对五盖而于法随观法而住。』如此，比库安住于观照自己心中的五盖、观照别人心中的五盖，或一时观照自己心中的五盖、一时观照别人心中的五盖。在这一节，佛陀着重于解释五盖。生起的现像是指通过不如理地作意美丽的目标等而导致五盖及其相应名法生起；坏灭的现像则是通过如理作意不净的目标等而导致五盖及其相应名法灭尽。对其他经文的解释则与前面章节里的相同。"],[36,3763,3902,1,"“他现起‘有心’之念，只是为了智与念的程度。”这个阶段包括从坏灭随观智到行捨智。到观智的最后阶段，道智会生起。道智能逐步地断除烦恼，这时佛陀开示说：“他无所依而住，亦不执取世间的一切。诸比库，比库乃如此于法随观法而住。”他现起“有法”之念：“只有相应的法，没有众生、没有人、没有女人、没有男人、没有真我、没有属于我的、没有我、没有我的、没有任何人、没有任何人的。”这是现起“有法”之念。比如五盖：贪盖、瞋恚盖、昏沉睡眠盖、掉举追悔盖、疑盖。你观察并没有一个“我”在怀疑，没有一个“我”在贪，没有一个“我”在瞋恚，没有一个“我”在昏沉睡眠、掉举追悔，而只是你的心因为某个原因、某个知见而生起了对某一个方法的怀疑、对某一个所缘的瞋恚或对某一个所缘的贪爱。我们在观察身受心法时，知道当五盖生起时或其他的感受生起时，特别是五盖，五盖是行法，它在心路里属于速行的范畴，已经造业了，贪、瞋、痴、怀疑已经是造业的范畴。"],[36,3902,3989,0,"造业就是行为，身行、语行或意行，这样的行为背后一定有它的动机，这个动机在佛教里称为无明、爱、取。用心理学来讲就是认知，什么样的认知导致什么样的行为 —— 什么样的认知导致什么样的思惟习惯，什么样的思惟习惯导致什么样的行为习惯。所以在日常观察五盖时，当贪，瞋、昏沉睡眠、掉举追悔、疑五盖生起时，不要着急怎样去解决它，首先要学会在那个当下回头看一下，“我为什么会起这样的怀疑？这样的怀疑来自于我什么样的认知？”把它写下来，“我为什么会对这个起瞋恨心？这个瞋恨心来自于我什么样的认知？”回过头来再看这个认知，这样的认知是正确的吗？是你应该坚守的吗？当抱持这样的认知你是愉悦、快乐的吗？不抱持这样的认知又是一个什么样的状态？"],[36,3989,4116,1,"日常想改变你的行为习惯，一定都要去追到是什么样的认知导致你的行为习惯，然后从转变这个认知开始。八支圣道最前面就是正见，正见、正思惟、正语、正业、正命、正精进、正念、正定，八支圣道讲的就是认知行为习惯。只要生起了五盖，只要生起了让你痛苦的不善法，只要生起来，一定就是错误的认知，百分之百是错误的知见。这个错误的知见如何去转呢？还没有观智的人要去学习的一个基本的路径：第一步要能做到于日常碰到各种所缘时，要知道“这是果报”，果报出现了，一般你有一些习惯性的态度，这些习惯性的态度来自于你固有的看法和观念。只要你生起的是与贪、瞋、痴相应的心，你的观念一定是错的。怎样去调整这个观念，就要去观察。当然有些人说：“这个人老是欺负我，如果不给他一点好颜色，他会一直欺负下去。”这就是你错误的认知，你认为一直欺负你的人是恒常的，你没有想过“我还能用什么办法？”除了跟他生气、跟他顶以外，其实有更多的方法，用生起善法的方式让他不欺负你。你没有去想，你有去想就能够解决。这样称为“修行人”。"],[36,4116,4204,0,"三十七道品——法念处之五盖部分已学完。日常生活中经常会生起五盖，当五盖出现时，除了学习运用佛陀教导的这些方法之外，更建议大家去看五盖生起的因是什么，然后从因上下手去解决。回向功德！"],[37,1,203,1,"190 讲-摄集-摄菩提分-法念处-五取蕴&十二处 1古源尊者各位尊者、各位尼师、各位贤友，晚上好！今天继续学习三十七道品，法随观——五取蕴和十二处。一、五取蕴佛陀对于法随观之五取蕴部分如此开示：『再者，诸比库，比库对五取蕴而于法随观法而住。诸比库，比库又如何对五取蕴而于法随观法而住呢？诸比库，于此，比库了知：「如是色，如是色之集，如是色之灭；如是受，如是受之集，如是受之灭；如是想，如是想之集，如是想之灭；如是行，如是诸行之集，如是诸行之灭；如是识，如是识之集，如是识之灭。」』（一）何谓五取蕴五取蕴是能被执取的五蕴，对于凡夫和三果以下的圣者而言，五蕴都是被执取的，只有阿拉汉对五蕴没有执取。"],[37,203,276,1,"五取蕴是作为执取之因的一组现象。关于“蕴”，在《相应部•蕴相应》里，佛陀说：『过去、现在、未来、内在、外在、粗、细、胜、劣、远、近十一种色是色取蕴；……十一种受是受取蕴；……十一种想是想取蕴；……十一种行是行取蕴；……十一种识是识取蕴。』什么执取诸蕴？执取诸蕴主要是无明、邪见及渴爱。由于这些烦恼执取色、受等诸蕴，因此后者被称为色取蕴、受取蕴等等。它们如何成为被执取的目标呢？事实上，人的身体只是由二十八种色法所组成，但如果你作意自己的身体为“我的身体” ，并且相信那是你的，那就是邪见，而贪欲也会因而生起。你可能会执着自己的身体及别人的身体，例如你父亲、母亲、儿子、女儿的身体。如果你相信他们是真实存在，那就是邪见。如果你执着他们，那就是贪欲。如是，邪见、贪欲等烦恼能执取色蕴等而生起。下午和谷老师做梳理，他反应禅修时胸口时常莫名的痛，通过与心沟通询问，一个小学时期被学校老师打了两耳光的场景被回忆起来，感受到当时的委屈、痛苦和愤怒。在此挨打小孩和老师的色身都是他的色取蕴，小孩当时的感受是受取蕴，对那个场景的标记是想取蕴，委屈、愤怒的情绪是行取蕴，心识知挨打的过程是识取蕴。"],[37,275,413,1,"这些取蕴对他现在而言是过去的五取蕴，现在回想起来依然历历在目、感同身受，是现在的五取蕴，未来有因缘再浮现出来，是未来的五取蕴。“老师不应这样”的行为，“觉得当时被不公平对待，内心……”所形成的想颠倒，重复加强建立后会构成对权威对象的错误投射，形成心颠倒和见颠倒。这些就是执取所产生的效果。作意自己刹那变化的色身为“我的身体”——“那时我小学五年级，那时我还不大”，有一个真实的“我的身体”莫名奇妙挨了两巴掌，是邪见。贪爱身体，认为不应该被打，当所贪爱和执取的身体挨打时，就会启动保护机制，生起瞋心。"],[37,413,484,0,"我们也执取别人的身体，比如父亲、母亲、孩子的身体。相信他们真实存在，执著他们，就是贪欲，就是邪见。如此，邪见、贪欲等烦恼能执取色蕴等而生起。比如执取你母亲、父亲、女儿、儿子的身体，如果他们头痛脑热、感冒发烧，你就着急、焦虑。（二）第一个阶段——观名色法的特相经文中「如是色，如是色之集，如是色之灭；如是受，如是受之集，如是受之灭等等」 是对名色法的观察方法，包括三种：“这是色”，“这是色之集”，“这是色之灭”。"],[37,484,648,1,"“这是色”是指只有色法而无其他，能如实地这样看，邪见才不会生起。根据《阿毗达摩》，色法有二十八种：即四界及二十四种四界所造色。应依照色法的四个层面观察它们，即所有的名色都有特相、作用、现起、近因。这是指在观察四界（修四界差别）直到见到色聚，对于每一个色聚还应进一步分析色聚里的色法。如何分析呢？举地界为例，它的特相是硬，根据《法集论》，除了硬之外，地界还有其他特相，即粗、重、软、滑、轻；它的作用是作为同一粒色聚其他色法的立足处。在一个很微小的刹那生灭的色聚里，可以观察它的硬或者软，观察到硬就是硬的特相，不会同时观察到软的特相。色聚里的地界已经是一种属性，并非以粒子的形式存在，如何观察属性？首先地界的作用是作为同一粒色聚里其他色法的立足处，比如：水、火、风的立足处；色、香、味、触、食素的立足处；命根、净色等的立足处。当禅修者能够观察到色聚里的这些色法时，观察地界时，会感觉“地”好像背负着其他色法一样，水、火、风依附于地界而存在。若能如此观察到，即观察到地界的现起（表现）。地界的近因是同一粒色聚里的其他三界，即水、火、风。"],[37,648,867,1,"地、水、火、风同生同灭，相互支持，以俱生缘的缘力相互支持存在。当禅修者能够如此分析地界时，就是在修行“此是色”这个阶段。对于其他色法和名法也应该如此观察。这里不是在讲名色分别智，不作详细解释。如果要知道每一种色法和名法的特相、作用、现起、近因之详细解释，可以学习《清净道论•说蕴品》。（三）第二个阶段——因缘生及刹那生佛陀说：『这是色的生起，这是受的生起，这是想的生起，这是行的生起，这是识的生起。』，这是第二个阶段。你应先认得什么是色、受、想、行、识；然后观察是如何生起的。“生起”分为两类：一类因缘生，一类刹那生。根据《无碍解道》，导致色法生起的因有五个，即无明、爱、业、段食及成相。成相（nibbattilakkhaṇa），就是刹那生。无明、爱、业及段食是色法因缘生之因。提到无明及爱时，取也包含在内，这三者是烦恼轮转；提到业时，行就自动地被包含在内，这两者是业轮转。无明、爱、取、行、业这五个是导致果报生起的过去因，它们可能是你在前一生、前两生或更远的过去生所造下的，因此你应该往过去生去观照自己的名色法，直到在前一世临终时，查到当时临死速行心缘取的目标，即业、业相、趣相三者之一。"],[37,867,965,0,"若想知道这一生的业生色法怎么来，要查过去生临死的状态。由于这一生是人，所以在你前一世临终时成熟的必定是善业，假设那是供花、供水、供食物给佛像的业，临死速行心里的目标（所缘）可能是佛像，也可能是花（业相）。当取到佛像或花，就必须对供花或供水给佛像的人修四界差别，修到明亮闪烁，观空界、粉碎，然后见到色聚。见到色聚后，应着重于分析他心脏里的心所依处色（如果很熟练就不用全身去分析），心脏里有五十四种色法，其中有心所依处色，如此就能看到他的意门。只要是五蕴生命，在心所依处色上就是意门，也称为有分心生起的地方。"],[37,965,1081,0,"当你来回地在有分心的前后观照名法时，就会看到他供花时的心路过程。如果他在供花时生起欢喜心，而且知道供花是善业，会带来善果报，该心路过程中的速行心生起就有三十四个名法：触、受、想、思、一境性、名命根、作意、寻、伺、胜解、精进、喜、欲、信、念、惭、愧、无贪、无瞋、中捨性，心和心所的轻安、轻快、柔软、适业、正直、练达，加上慧根。这些名法就是行，即无明、爱、取、行、业的行。虽然它们是无常的，一生起就立即灭掉，但在名色相续流中会留下影响力（业力）。在未来因缘成熟时，该业力就会产生果报。它会产生怎样的果报呢？那有视于他在造该善业之前或之后发了什么愿。所以建议大家要发愿、滴水回向、心要有倾向性。因此你也必须观察到他发愿时的名法。假设在供花时发愿来世成为女人，那时，错误地认为有女人存在是无明，渴爱女人的生命是爱，由于重复而变强的渴爱是取。至此，你已观到这一生的过去因。"],[37,1081,1151,0,"在观察时，往往不一定有很明显的愿，禅修者一般都会报告，没有很明显想做女人、想做男人。其实很多只是内心的倾向。在供花供水时，觉得“我是女人、我在供花、我这样供花很美好……”基本上内心潜伏的倾向是作女人。刚好那时有位比库在边上打扫，你把花交给他说：“Bhante,帮我供一下。”觉得“当比库真好，可以亲近佛陀……”这个业成熟时，可能这一生成为比库、成为男众，这是内心的一种倾向。当禅修者查到过去的临死速行一直追到当时造业的现场、 他的行、以及造这个行之前的无明、爱、取，接下来应该观察这一生结生时的色法。"],[37,1151,1623,1,"这一生，在妈妈子宫里的受精卵上，产生这期生命的第一个心（结生心）。与结生心一起生起的有三种色聚：心色十法聚（对人来讲，心色十法聚是心生起的物质基础）、身十法聚、性根十法聚。它们各有十种色法。心十法聚是产生结生心的依靠；身十法聚使身体不断分裂、集聚、成长；性根十法聚在那一刹那决定性别 —— 女性或男性，不可能转性。它们各有十种色法，其中九种是彼此相同的，即地、水、火、风、颜色、香、味、食素（营养）及命根，唯一不同的色法是心色十法聚里的心所依处色、身十法聚里的身净色、性根十法聚里的性根色，因此在结生时一共有三十种业生色。观照到这些色法之后应该再次观那五个过去因，如此往返地观照这两者，以便确定它们之间是否有因果关系。如果有，你就应该个别地如此观照：“由于无明生起，所以业生色生起。无明是因，业生色是果；由于爱生起，所以业生色生起。爱是因，业生色是果；由于取生起，所以业生色生起。取是因，业生色是果；由于行生起，所以业生色生起。行是因，业生色是果；由于业生起，所以业生色生起。业是因，业生色是果。”然后观照业生色的生时，那就是“成相”，亦即剎那生。"],[37,1208,1623,1,"对于色法的现在因，佛陀提到段食。提到段食时，心及时节也都包括在内，因为它们也是产生色法的现在因，所以造成色法生起的现在因一共有三个。除了结生心之外，一切依靠心所依处生起的心都产生心生色，因此你应该观照到由于心生起，所以心生色生起。心是因，心生色是果，然后再观照心生色的剎那生。每一粒色聚里都有称为时节的火界，它能产生含有地、水、火、风、颜色、香、味、食素八种色法的时节生色聚，因此你应该观照到由于时节生起，所以时节生色生起。时节是因，时节生色是果，然后再观照时节生色的剎那生。"],[37,1208,1623,1,"还未被消化的食物是由时节生色聚组成。在肠胃里有一种称为命根九法聚的业生色聚，它含有地、水、火、风、颜色、香、味、食素及命根这九种色法，其中的火称为消化之火。食物中时节生色聚里的食素受到消化之火支助时，就会产生含有八种色法的食生色聚，其中的食素称为食生食素。当食生食素支助业生、心生、时节生食素及在之前生起的食生食素时，后者就会产生新的食生色聚，因此你应该观照到由于食素生起，所以食生色生起。食素是因，食生色是果，然后再观照食生色的剎那生。"],[37,1208,1725,1,"前面讲的是色生起的因，受、想、行、识是四种心理因素（心理活动）。结生心的受、想、行、识四名蕴属于果报名法。果报心里的四种名蕴同样有过去五因：无明、爱、取、行、业。受、想、行三种名蕴有相同的现在因，即触（对所缘的触）、依处（五蕴界生命依靠依处生起心）、目标（所缘）及相应名法。触的作用是把名法和目标连接起来。如果没有触，受、想、行就不能缘取目标，也就不能生起。对于人，每一个名法都必须依靠依处色才能生起,例如结生刹那的结生心名法需要依靠当时与它一起生起的心所依处色才能生起,没有依处就没有名法产生。"],[37,1725,1791,0,"每一个名法也必须缘取目标才能生起，因此目标也是导致名法生起的现在因。再者每一个名法都不能单独地生起，必须与相应名法同时生起。由于四名蕴必须互相依靠地生起，因此它们互相作为因果，也就是说：如果取受蕴为因，其他三名蕴则是果；如果取想、行、识三名蕴为因，受蕴则是果。其他情形也应当如此理解，一个一个去观察。应该如此观照受、想、行三蕴的因缘生，然后再观它们的刹那生。速行心不是果报心，是造业的心。这些造业的心里也有受、想、行、识四名蕴，但它们没有过去因。"],[37,1791,1865,1,"举个例子，大家修观时能观察到，第二个速行心的受蕴有哪些现在因？第一个是依处。心脏里的依处色是因，受蕴是果。第二个是目标。比如观察眼净色，目标就是眼净色。因为修观时眼睛闭着，没办法观察外面的颜色，但是可以看眼净色边上其他色聚的颜色，所以也有目标，目标是因，受蕴是果。第三个速行的现在因：1.有分意触是因，受蕴是果。有分意触是什么？这条心路生起之前都是有分心，有分心波动造成心路生起，所以有分波动的触、有分断的触是因，受蕴是果。"],[37,1861,1955,1,"2.第一速行的意触是因，受蕴是果。因为前面一个速行的存在，由触才会产生受，所以第一速行的意触是因，第二速行的受蕴是果。3.第二速行的意触是因，受蕴是果。即同一速行心里的触是因，受蕴是果。我们要观察如理作意是因，受蕴是果。如理作意和不如理作意是五门心路的确定心或意门心路的意门转向心，整个转向心是因，受蕴是果，深入分析，即是里面的胜解心所起主要作用。对于所有识蕴的现在因，佛陀只是教导“名色”作为它的现在因。在此，名是指与识相应的受、想、行三蕴；色是指依处色及目标（所缘），如果目标是色法，就是色蕴。应该如此观照识蕴的因缘生，然后再观照它的刹那生。"],[37,1955,2022,1,"如此观照过去因及现在因导致五蕴生起时，就是在修行“这是色之集；这是受之集等等”的阶段。依照《清净道论》、《义注》、《复注》的标准，关于五蕴生起及五蕴生起之因，必须如此观察。也有观点认为，根据过去的推论就可以。我们这个体系认为推论是不恰当的，不能讲苦、集、灭、道的集谛是可以推理出来的，没有亲见苦、集、灭、道的集谛，四圣谛就变成三圣谛，是不恰当的。（四）第三个阶段——因缘灭及刹那灭接下来佛陀教导第三个阶段，因缘灭和刹那灭，即“这是色的坏灭，这是受的坏灭等等”"],[37,2004,2169,1,"。这时要观察两种灭，因缘灭和刹那灭。当你未来证得阿拉汉果时，一切烦恼皆灭尽。而当你入无余般涅槃时，所有的五蕴都灭尽。烦恼灭尽是因，五蕴灭尽是果，这是因缘灭。五蕴的瞬间坏灭是刹那灭。对于还没有证到阿拉汉果没有般涅槃的人，怎么看五蕴坏灭？要按照苦、集、灭、道去找。如果不能看到因缘灭，只是刹那灭，就不能对佛陀的八正道生起真实的信心。修缘起时，老师一般要求禅修者查过去生、未来世。查未来世是通过一种发愿的假设状态去观察，例如给佛陀供杯水、供束花、供柱香，发愿：我要尽快证悟阿拉汉！发愿后，坐下培养定力到初、二、三、四禅，有些人还修行十四御心法，停在四禅，出来后修自己心所依处色的四界，再看到自己心所依处的有分。在有分心前后检查刚才发愿时的心路，检查发愿时心路的无明、爱、取，认为有一个能够证得阿拉汉的人真实存在是无明、喜欢证得阿拉汉是爱、执取证得阿拉汉是取，供养佛陀是行，留下的业是业力。顺着这条名色相续流不断地往后追溯，能够追溯到在不远的未来生将会证得阿拉汉道果。在证得阿拉汉道果那一生的五蕴，死亡心生起时，下一生的结生心将不再生起。"],[37,2169,2247,1,"下一生不会再生起，那一生的死亡心再往后就是涅槃。这就是“现见涅槃”，你能感受涅槃真实存在。那时就可以按这一步来做 —— 一切烦恼灭尽，证般涅槃时，除时节生色之外五蕴皆灭尽，即烦恼灭尽是因，五蕴灭尽是果。因缘灭是可以看到的。虽然有推导的成分，但这不是逻辑推导，而是真的去看到未来名色流的发展方向。能够观到五蕴的因缘生灭和刹那生灭时，你就能明白佛陀在这段经文里所说的“这是色，这是色的生起，这是色的坏灭；这是受，这是受的生起，这是受的坏灭；等等……"],[37,2240,2380,1,"”（五）更高阶段的观智佛陀在《大念处经》中教导下一阶段更高级的观智：『如此，他安住于观照内在的法为法、 安住于观照外在的法为法,或安住于观照内在与外在的法为法。他安住于观照法的生起现像、安住于观照法的坏灭现像、或安住于观照法的生起与坏灭现象。或者他建立起‘有法’的正念，只为了更高的智与念。他独立地安住，不执著于世间的任何事物。诸比库，这就是比库依五取蕴而安住于观法为法的方法。』这与之前所解释的“身念处、受念处、心念处”的方法一样，这是按照观智从坏灭随观到行捨智的阶段。有一点要指出：“这是色，这是色的生起，这是色的坏灭……”与“他安住于观照法的生起现像……法的坏灭现像……法的生起与坏灭现像”的观察方法差不多，只是后者更进一步观察五蕴为无常、苦、无我而已。前面只看到这是因、这是果；这是生起、这是灭去。在后面成熟的生灭随观和坏灭随观则要更进一步清晰地观察到所有五蕴的无常、苦、无我。这是对五取蕴随观的简要说明。如果想更清楚地了解，可以研读《清净道论•说蕴品》。修到观智时，要在贤明老师的指导下修习。"],[37,2380,2492,1,"二、十二处接下来法随观之十二处部分。在解释依五取蕴而修行法念处之后，佛陀继续解释依十二处而修习法念处的方法。佛陀说：『再者，诸比库，比库对六种内、外处而于法随观法而住。诸比库，比库又如何对六种内、外处而于法随观法而住呢？诸比库，于此，比库欲了知眼，了知色，也了知缘此二者而生起之结；『他了知耳，了知声，也了知缘此二者生起之结；『他了知鼻，了知香，也了知缘此二者而生起之结；鼻嗅香、耳听声、眼观色。结是什么？结是烦恼，有十种结，后面再细讲。“他了知未生起之结如何生起，了知已生起之结如何捨断”为什么生起烦恼？烦恼应该如何斩断？“也了知已捨断之结于未来如何不再生起”，就是证阿罗汉。"],[37,2492,2571,0,"『他了知舌，了知味，也了知缘此二者而生起之结；『他了知身，了知触（身体的接触），也了知缘此二者而生起之结；他了知未生起之结如何生起，了知已生起之结如何捨断，也了知『他了知意（内心的状态），了知法，也了知缘此二者而生起之结；他了知未生起之结如何生起，了知已生起之结如何捨断，也了知（一）了知眼、了知色如何理解“了知眼，了知色，也了知缘此二者而生起之结”？“了知眼”意思是：他依眼根的特相、作用、现起、近因而了知它。在眼球里有眼净色十法聚，要在实修时找到它、了知它。"],[37,2571,2647,1,"首先对眼睛修四界差别，见到眼球里六十三种色法，其中明净的对颜色敏感的称为眼净色十法聚，观察到里面的地、水、火、风、色、香、味、食素、命根色和眼净色，此即是眼根，亦称为眼门。如何才能观到眼净色？在眼睛里有两种透明的净色：眼净色和身净色。如何确定所观到的是眼净色还是身净色呢？应该观察那净色，然后看离该净色邻近距离的另外一群色聚的颜色，如果那颜色能撞击该净色，就说明该净色就是眼净色，否则就是身净色。观到眼净色之后，应观察它的特相、作用、现起、近因。"],[37,2647,2769,0,"眼净色的特相是准备让颜色撞击， 是准备让色尘撞击的四界之净（四界之透明性）。当你如前所述地见到颜色撞击眼净色时，就看到了眼净色的特相。什么是透明？它必须是某个东西的透明。比如玻璃是透明的、水是透明的，那是因为有玻璃和水才能如此说。同样地，必须知道眼净色即同一粒色聚里四界的透明性。所以眼净色十法聚整个四界都是透明的。《注疏》举出眼净色的另一个特相，即以色爱为因缘的业生四界之透明性。色爱是什么？即想见颜色之欲。对于这个特相，必须修到缘起才能明白。在过去生，你基于想要见到颜色之欲而造下行与业，该欲即包含无明、爱、取，因此在过去生你已经造下无明、爱
