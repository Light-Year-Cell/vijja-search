二十四缘做准备的；也就是说，在〈摄集〉里面把《摄阿毗达摩义论》前面的六品所说的，按照《摄阿毗达摩义论》讲的是说八十二个究竟法。八十二个究竟法是怎么分的呢？第一个是心。我们讲八十九心在这八十二个究竟法里面只用一个心来代表，一个究竟法来代表；然后加上五十二个心所、二十八种色法，然后涅槃，总共八十二个。"],[0,149,258,0,"这八十二个里面有七十二种是有自性相的。有自相，有自己的特相。它们有共相：无常、苦、无我，这样的共相，只有涅槃是没有无常、苦、无我的相。那么，扣除色法中有十种不完成色，因为不完成色不是观禅的所缘，因此，就是七十二种有自相的究竟法。那么，在这第七章的〈摄集〉里面，主要就是把这七十二种有自相的基础的法类，用《阿毗达摩》的方式对它进行分类，分门别类。这个善吉祥尊者肯定跟大家讲过（在两个雨安居期间） ，大家都很熟悉。有不善、有杂、有菩提分，还有一切的法，分成四大类。这四大类列举了所有的诸法跟相对应的心所它们之间的关系，这样的一种关系对于第八章的这个〈发趣法〉——就是十二缘起支和二十四缘之间的关系，就非常重要，特别是二十四缘。"],[0,258,353,1,"二十四缘当中，缘法和缘所生法，有哪一些缘法，在什么样的缘力的支持或者支助下而产生缘所生法呢？这个缘法和缘所生法都是在第七章的介绍里面需要熟悉的、要了解的。（二）四漏放在摄不善的第一位在“摄不善”里面大家都很熟悉，第一个是四种漏。哪四种漏？欲漏、有漏、邪见漏和无明漏。那论师为什么把这个四漏放在“摄不善”的第一位呢？大家有没有考虑过，为什么把四漏放在第一位？二、四漏之无明漏（一）什么是无明？那我们说，轮回的根是什么？无明和渴爱。然后呢，沙利子尊者在《中部》第九经《正见经》里面讲到一句话是什么？“无明生起，渴爱就生起”"],[0,352,545,1,"，对吧？“渴爱生起，无明就生起”。所以，无明跟渴爱经常也是一起提出，有时侯它们甚至就是同义词一样的。那么，四漏里面“欲漏、有漏、见漏和无明漏”，欲漏、有漏对应的是什么心所？贪心所；见呢？贪邪见；然后后面的这个无明呢？是痴心所。也就是前面的这个欲漏、有漏、邪见漏都是跟贪相应的，它们都是渴爱，对吧！只是它们是不同的形式而已。最后是无明漏。那么，所有四漏合起来就是无明和渴爱，是吧？！那无明和渴爱为什么被放在第一位呢？刚才长老讲了，就是说，我们修行干什么？涅槃是什么？有没有人能说得更清楚、大声一点？涅槃是什么？它是烦恼的熄灭。修行的目的是熄灭烦恼。那为什么要熄灭烦恼呢？为什么熄灭烦恼？烦恼是依什么东西而生起？烦恼依无明而生起。我们说烦恼跟无明是相关联的。那什么是无明呢？无明是不能彻见究竟法。能清楚吗？你觉得什么叫做“不能彻见究竟法”？用一个世俗的、大家听得懂的语言比一下，可以吗？说这个男人、女人。明明你是男人，她是女人，怎么办呢？我们举个例子：月黑日，就是每个月的农历三十日看得到月亮吗？看不到月亮。"],[0,545,658,0,"然后从来没有见到过月亮的人会怎样？他会问：“月亮真的存在吗？”那是什么问题？这个认为月亮不存在的人是什么问题？月亮被什么东西遮蔽了？被地球遮蔽了。我们应该这么来讲，就是说，月亮它本来就存在，不能因为说被地球遮蔽了，我们就说月亮不存在。然而呢，如果从来没有见过月亮的人，他无法想象，在这个黑暗的夜里会有月亮。从初一、初二、初三，到十五的时候，月亮会非常圆满地在天空中出现，柔和的月光会洒满大地，他无法想象。这个不是非常准确的比喻，但是帕奥西亚多在《趣涅槃道》里面对痴心所曾经用过这样的一个比喻： “什么是无明呢？就是明明有的东西，然后我们因为不知道，我们就认为没有。”如果我们只是说我们看不到究竟法的真实相，这是对的、很准确的，那很多人就会很沮丧，因为我可能一辈子都不可能见到究竟法，那我是不是就不应考虑无明的问题了？"],[0,658,759,1,"所以，这无明我们要怎么来看呢？首先，无明是对于所缘的一个态度。为什么会出现这样一种态度呢？从什么时候开始呢？在无始的轮回当中我们是不可知的，什么时候开始不知道，但我们可以用雷迪西亚多在《观禅灯释》里面有过的一个论述：关于“三颠倒”的论述。（二）什么是“三颠倒”？大家知道什么是“三颠倒”吗？哪“三颠倒”？想颠倒、心颠倒、见颠倒。那什么是“想颠倒”？错误的认知？那“心颠倒”呢？还是错误的认知？“见颠倒”呢？还是错误的认知？那它们有什么区别？雷迪西亚多在那里面有几个比喻，大家去看。"],[0,759,914,1,"第一个，“想颠倒”。雷迪西亚多用的是什么的比喻呢？用的是“稻草人”来比喻。稻草人，大家有印象吗？帕奥西亚多在书里面用这个“盲人摸象”的比喻。那稻草人是什么概念？大家看过稻草人吗？看过啊！干什么用的？吓谁呀？吓动物。一般在农村里面都很容易看到，在水稻开始扬花，要长稻穗的时候，农民就会在田里面插上稻草人。以前雷迪西亚多是讲防止鹿，但现在鹿都被人家杀光了，只有麻雀。这主要是防麻雀，现在麻雀也很少了。以前我们小的时候，麻雀会遮天蔽日，一来就会把一片的稻谷给吃掉，现在已经很少看到了。那稻草人干嘛呢？就是插在田中间，麻雀就不敢来。麻雀为什么不敢来呢？首先是那一批麻雀里面，肯定有一部分的麻雀来吃稻穗的时候被农民赶过，甚至可能被弓箭、枪、气枪打过，有些麻雀同伴受伤了，乃至于死亡了，肯定遭遇过这样的一件事情。然后呢，在这些麻雀的心里面形成一个什么？留下了一个想蕴标记。这个想蕴标记是正确的吗？准确的吗？准确还是不准确？它们被打肯定是准确的嘛！它们来到这里被农民打，然后跑了，这个肯定是准确的，它不会不准确，对吧？！"],[0,914,1008,1,"然后，它们第二次再来看到稻草人，看到稻草人了会怎么样？它们的心是怎么运作的？一看到这个所缘——稻草人，然后呢？它们要调出过去的想蕴标记，对不对？就是在我们心路里面，所缘出现了。一般我们的想心所是这样的特质，对吧？！想心所是作标记。它的作用是用过去的标记来认知现在的所缘；然后，它的第二个特征就是不取所缘太久，它就是很简单地看一眼；那么它的现起呢？现起是什么？呈现在内心里的状态是什么？过去的标记呀！它要拿过去的标记来对这个东西呀！它一定是过去的标记要呈现在这里面，这个所缘、这个标记，两个相互去比对它，是吧？！这是想心所的特相、作用、现起、近因。好，那原来的标记是正确的，这次来再看到稻草人，把过去的标记拿出来对一下，出现什么问题？判断错误，对不对？过去的标记是正确的，这次再来的时候判断错误。所以，前面的认知是没有错的，但是第二次认知就错了，这个叫“想颠倒”"],[0,1008,1085,1,"。稻草人就叫“想颠倒”，就是标记正确，但判断错误啊！那“心颠倒”呢？心颠倒，雷迪西亚多在书里面是这么来比喻的，说有一群人去看魔术，然后，魔术师就用那个土块点石成金。在魔术师的这个幻术里面呢，这些土块都变成金光闪闪的东西。那如果对金子的判断力不强，从来没有判断过什么是金子的人呢？他会怎么样？他会觉得这个就是金子，对吧！所以这种情况下，对于这个看魔术的人看到金光闪闪的，他认为这个拿出来的就是金子，就是魔术师变一个金子出来，“噢！太厉害了，会变金子。"],[0,1085,1170,1,"” 那么他的判断这个是什么？对于这个观众来讲，他认为这个就是金子。那么他的判断是什么？他是错误的，一开始就是错误的认知，就是第一次想蕴标记就是错的。所以，它的标记是错的，认知一开始就是错的。那说明什么呢？说明我们认识所缘、看待世界的那种取角、那种视野，或者那种认知方式就是错的，这是“心颠倒”。那跟“想颠倒”有差别吗？有差别。（三）日常生活中观察“三颠倒”——梳理稻草人那么在我们日常生活中，它会有什么样的表现呢？大家觉得会有什么样的表现？我们就再举那个麻雀的例子。第一批来到稻田里面吃稻穗，然后被打、被赶，吓得半死，这一波麻雀标记正确；然后回去以后，它们带着亲戚朋友来了，带着孩子、带着太太、妻子、老婆一起来了。"],[0,1170,1242,1,"一来一看到那稻草人，然后那一波被打过的麻雀判断错误，然后它们会怎么样？“赶紧跑啊！有人啊！”是不是这样？那么，那些没有被打过的呢？会怎么样？它们就认为这个就是人，稻草人就是人，对不对？所以，就是后面那一波麻雀，或者它们的麻雀娃娃，它们就心颠倒了。那么，“心颠倒”跟“想颠倒”，再到“见颠倒”，它是什么样的一个过程呢？就是说，这批麻雀它们来回地来看这个稻草人，如果它们还在心颠倒的阶段，这时人家讲说： “哎呀，不应怕！那是稻草人！”“哦，真的吗？我们下去看看。"],[0,1242,1309,1,"” 它们在边上观察，看这个稻草人会不会动。观察半天，“噢，稻草人，不理它，继续吃。”对吧？它们这里改得过来，是吧？如果它们这个“想颠倒”跟这个“心颠倒”来回地交叉，总是每一次都加深了这个“稻草人就是人”的时候，就是到它们非常坚定的只要一看到这个影子就说： “你不要再跟我讲，我上一次就听你这么说，我去了一次就被打了。”只要有一、二次重复，它这个就会越来越坚固，到最后，谁讲也没有用，就是“稻草人就是人，他绝对是人，你不要再来骗我，我不会相信的了！”非常坚固地这样认为。它形成一个非常坚固的见解，这时候就变成“见颠倒”，这样来理解。"],[0,1309,1459,1,"好，那么在我们日常生活中，怎么样来观察自己有想颠倒、心颠倒，或者见颠倒呢？大家知道怎么观察吗？这个我以前曾经给大家讲过“梳理稻草人”。有讲过吗？有讲过噢。有人有听过，有人没有听过。就是梳理稻草人，建议大家拿一个本子，然后闭上眼睛想一想，从小到大，最先从你心里冒出来的那个影像，那个影像是大概什么时候发生的？发生的时候有什么样的人？当时你是什么角色？这件事情发生的时候，你内心有什么样的感受？把它写下来。那就从这件事来看，就是你能够想到的那个场景，那个场景有画面。有画面，那就是你曾经发生过，然后你给它做一个标记，一个想蕴的标记，然后你可以忆持它。也就是说，你做过这样的标记。那做过这样的标记，一般情况下会发生什么样的事情呢？大家如果有做过的话，就会有了解。我这边举一个例子：我们有一位贤友，当时在做作业的时候，说他眼睛闭上，出来一个很清晰的画面，就是他在十二、三岁的时候。他家在农村，他跟他妈妈在厨房里面炒菜、做饭，然后外面是狂风暴雨。他当时没什么感觉，但做饭做一半的时候，突然间，他们厨房的一堵土墙就这样倒掉了。"],[0,1459,1592,1,"轰！倒掉了。然后，狂风暴雨就直接吹到他们厨房里面来。他当时感到非常害怕，感觉那堵墙就要砸在他身上一样。所以，他当时这个回忆呢，就是这个场景––––这个狂风暴雨，然后土墙倒掉了，他非常地恐惧。那么，这样的一件事情，对他的生命产生什么影响呢？他自己说，现在只要再遇到刮大风，他就会莫名地恐惧，就会很害怕。那在刮大风的时侯，他莫名的恐惧，是莫名的，对不对？在他的心里面并没有呈现出来，小的时候那次狂风暴雨把他吓到了的那个事情，它并没有在他内心里面呈现出来，是不是？那么，也就是说，他过去有这样一个标记，想蕴标记是准确的，曾经发生过的真实的一件事情。但是，他到现在长这么大，四十几岁了，遇到刮大风还能恐惧，男的，那能怎么办？这是什么问题？这个到了什么阶段？什么阶段？想颠倒？心颠倒？还是见颠倒？应该说，这个处于心颠倒的阶段。如果他还在想颠倒的阶段，那个影像应该会再冒出来，但那个影像没有冒出来了，只是这样莫名地就会害怕。他认知已经形成，就是“我看这个就是那个了，稻草人就是人，那大风就是会害我”"],[0,1592,1719,1,"“大风就是会害我”，他已经形成这个东西了。那现在呢？他经过好几回梳理，他说现在见大风已经不害怕了。也就是说在想颠倒的阶段、心颠倒的阶段，你梳理它还是有可能转过来的。那如果是到见颠倒就不容易，我们后面再来说。就是想颠倒到心颠倒，再到见颠倒，它对我们的生命产生怎样的影响。每个人都可以去回忆一下，你曾经有过什么样的标记，然后从那个标记回来看自己现在的生活习惯，自己的这个日常生活习惯、惯性，有没有跟这个相关联，相关的这个类型？如果有的话，你就要去调整这个颠倒了。我举这个例子想引出来什么意思呢？回到我们那个四漏：欲漏、有漏、邪见漏、无明漏。那无明到底是怎么形成的？邪见到底是怎么形成的？从无始来看，我们找不到头。但是，在我们每一生当中是能够找到痕迹的。那找到这个痕迹，回过头来，我们来看什么是无明？想颠倒、心颠倒、见颠倒，都是无明啊，只是程度深浅的这种差别。"],[0,1719,1797,0,"那么，到了见颠倒的时候呢，它单独成为一个心所，从这个简单的痴心所里面、这个比较低层次的痴心所里被拿出来，成为一个邪见心所，就是说它非常地顽固。也就是说，这个无明，它其实是从想颠倒开始的，最早是想颠倒，就是看到本来是真实的东西做的标记，最后它总是判断错误。所以刚才讲说，错误地认为这个世间有男人、女人，这就想颠倒来讲是判断错误。但是判断错误，从一出生我们就可以观察到这个错误怎么形成的。听说过狼孩吗？就是一生出来没多久就被狼叼走的这种，叫“狼孩”"],[0,1797,1890,1,"。如果在七岁之前抢救回来，这个孩子还有可能恢复一点人的习惯；如果超过七岁呢，那这个人就再也没有办法恢复人的这种能力和特性，他总是跟那个狼一样，就是下午四点钟就嚎叫，然后吃东西就是用牙齿撕咬。他总是用撕咬的方式，然后总是用四肢爬，在印度有过这样的报道，其他很多国家也有过这样的报道。那这说明一个什么问题呢？就是你的想蕴标记对自己的生命成长是完全关联着的。一次一次的“想颠倒”慢慢就变成越来越深入的“心颠倒” ；越来越强的“心颠倒”，最后变成“见颠倒”"],[0,1890,1990,1,"（四）虽见到究竟法，但不见四圣谛，仍然是无明好，那我们回头来看无明。真正从我们佛法的角度上来看，它是什么呢？我们看不到究竟法。究竟法就是我们前面学过的各种心、心所、色法、涅槃。其实，最重要的是没有看到什么？没有看到“四圣谛”“四圣谛”是什么？苦、集、灭、道。最重要是没有看到什么？我们这么来讲，我们说，很多人在帕奥禅林修止观，也有不少禅修者修完，所谓“修完课程”。那么，他们是不是都证阿拉汉了？他们是不是都解决无明了？他们是否有见到究竟法？如果他们见到究竟法，为什么还有无明？那有很多种类。"],[0,1990,2136,0,"这个，一种呢，就是他已经走在正确的道上，他看到了究竟法，看到了究竟法的无常、苦、无我三相，见到它们的过患，生起了悚惧，产生了厌离，然后决定要解脱，走在这条路上；有些人甚至已经在法上有立足的地方，有初果、二果、三果。也会有人是一种什么样的状态呢？只是看这个究竟法而已。为什么说只看究竟法，它没有解决问题呢？这个我们有两个层面的角度可以去思考，不一定准确。（五）无明让我们不知有涅槃，认为这种生命的存在方式是唯一的就对于我们人来讲，我们说苦啊，我们经常讲说，“哎，很苦啊！”但是谁不知道苦啊，但又能怎么办呢，是不是？我也知道苦啊，生、老、病、死苦啊，爱别离、怨憎会、求不得啊，还有五蕴炽盛，人都会死，都很苦。那能怎么办呢？大家都是这样嘛！这里问题出在哪儿？他认为这种生命的存在方式就是唯一的，他没有办法，没有办法可以逃脱啊！他不知道当烦恼灭尽的时候，涅槃会呈现。涅槃是烦恼熄灭，它不是一个状态，或者比喻成北京天安门。涅槃不是北京天安门，“噢，我要去北京天安门，我要去涅槃。"],[0,2136,2209,0,"” “我们要去涅槃！”很多人说： “有一个像北京天安门一样的，在等待着我们去证得。” 但如果他的心是这样的心，要去导向涅槃的时候会怎样？他每次在看究竟法的时候，“天安门出来了”，这个开玩笑的。就是对大部分的人来讲，仅仅是知道苦，而不知道苦熄灭的那种体验、那种感受，他是很难生起来说——“我要从这种苦的状态里面出来”所以，无明呢，如果我们用世俗上的角度来讲，就是说，他认为这样一种生命存在的方式，它是唯一的，没有其他可选择，他不知道有涅槃存在。涅槃本身不能叫存在，但是对他来讲，他不知道有涅槃，那么，这是最大的问题。"],[0,2209,2279,0,"那苦、集、灭、道，四圣谛里面呢，我们讲苦圣谛、集圣谛，然后会把灭圣谛放在前面。那么在帕奥止观的禅法里面，修完止禅，然后你要见究竟的名色法；究竟名色法完了以后呢，要修缘起。缘起，看什么？看过去、看未来啊。过去找不到头，未来要找到头，所有的老师都要让你找到头。即使你是发愿成佛的人，他也要让你找到你成佛的那一生。老师教课的时侯是这样来教的，就是你必须看到头，看到真的有涅槃啊！涅槃是真实存在的。只是呢，我们讲这个叫“现见涅槃”，不是叫“现证涅槃”"],[0,2279,2380,1,"。我们经常比喻说： “噢，我听说有大海哦，你朝东边走，一直走，就能见到大海啊！”然后你相信，一路走、走、走，走到有一天在大海边的高山上，你终于看到了，“噢！前面真的有大海！大海是如此的广博！波澜壮阔、深邃！”看到了大海真实存在，但是你还没有投入到大海里面去，你不知道大海的味道。但是你见到大海了以后，你会发现大海跟高山是不一样的，大海跟河流是不一样的，大海跟湖泊是不一样的。如果你想体验大海的广博，你就会下定决心继续往前走，因为大海真实存在。如果没有人跟你讲过有大海，你每天围著稻田，围著那个小湖泊，你会怎么想呢？这就是大海了，我们就只能这么过了，是吧？那么，也就是说，如果没有佛陀，我们所有人都不知道有涅槃；那所有的人都不知道有涅槃，我们就只能守着这个东西，守着这个生命，就认为生命是唯一的，那这个就是无明。"],[0,2380,2517,1,"那么无明会带来什么样的问题呢？就是“我就是这个生命”，它会带来什么问题？就是生命要存在，是不是？那这生命要存在，你们要干嘛？要给它住啊、要给它喝啊、要给它吃啊、要给它穿啊，打扮啊、洗啊。那么，在佛陀的教导里面我们需要什么？“四食”。你要给它吃。吃什么？精神食粮和物质食粮。因为无明认为这个生命是唯一的，“噢，一定要让它活下去，而且要活好”，你就要给它吃。吃什么？抟食、触食、思食、识食，就四种食粮 ——一种物质的食粮，三种精神的食粮。那么，食粮容易不？为什么不容易？因为食粮稀缺。食粮是稀缺的，好食粮更是稀缺。那有稀缺要怎么办？哎，就要努力啊，我们讲说要好好去赚钱，要赚很多钱呢！为什么要赚很多钱啊？要保证自己能生活啊！但你会讲说，其实生活很简单啊，需要的不多，为什么要整那么多？那这里出来的问题就是，因为无明，我们要让这个生命存在；为了让这个生命存在，我们要有食粮；要需要这个食粮，就是维持这个生命的存在。那什么样的食粮对维持这个生命的存在是好的？什么样的食粮对这个生命的存在是不好的？要不要判断？"],[0,2517,2600,0,"那判断就会出现什么问题？稻草人啊！对不对？有好有坏。有好的稻草人，也有不好的稻草人。（六）快乐的奖励机制和痛苦的防护机制对于我们这个生命存在有帮助的这个食粮，你拿到手或者享用以后，会产生什么样的感觉？对，会有快乐，是吧！凡是对于我们这个生命的存在有帮助的、正面的、好的，那个食粮就会给你带来乐受，这个触就会有乐受。有乐受，你会怎么样？想要再来，对吧？想要再来。那么，如果对你的生命存在会产生不良影响的，乃至于会伤害你的生命的，会怎么样？会有苦受。身体会有苦受，是吧？那么，苦受你会怎样？就要排斥。那么，你用什么方式来排斥它？"],[0,2600,2692,0,"那个麻雀是怎么来解决这个问题的？我们如果去想一想，它基本上会有这样的几个特点：就是凡是快乐的东西，它有什么样的特点啊？边际效用递减，就是所有快乐的东西，你一开始享受它的时候最快乐，然后慢慢地它的快乐就越来越少，到最后它就会没有快乐，再往下它就会产生痛苦。大家有没有想过？你吃饭、睡觉，你干任何事情都有这样的特点：它会带来快乐，但是它的边际效用递减。那对于你的标记会是怎么样呢？你标记这个快乐，然后你下一次再去面对这个所缘的时候，你会不会认错掉？有可能？尝一下就知道了！"],[0,2692,2780,1,"对于会带来快乐的东西，我们是敢试的，是不是？大家想一想是不是？凡是会给我们带来快乐的东西，我们不会防备的。“吃嘛，这是西红柿，大家吃吃看！”对于快乐的东西，我们敢试错。那么，如果对于痛苦的东西呢？敢不敢试错？为什么不敢试错？“一朝被蛇咬，十年怕井绳。”为什么会这样？它这是一个风险的保护机制，另外一个是快乐的奖励机制。快乐奖励机制我们不用试错，我们会精准地去判别它。风险保护机制呢？就是对生命有害的，我遇到要产生痛苦啊！然后标记它为什么？危险！啊，不好！然后，他要做什么？要做防护啊。那么，做防护的时候他会以什么样的手段？他以无限扩大化，“宁可错杀一万，不能漏掉一个。"],[0,2780,2871,0,"” 不能出现一个。为什么呢？只要有一个，我就死了，是不是这样？只要有一次，我就受伤害了，这是不可以接受的一件事实。那么，他的识别是怎么样？刚才那快乐是精准识别，那这个呢？模糊识别。大致一看，“噢，人呢！”其实都是稻草人，但他不会再深入去看的，赶紧跑。大家想一想，这种快乐的奖励机制和痛苦的防护机制，在我们的生命当中你自己体会一下，是不是我们每天都被这两股力量折腾着？我们后面会讲到，什么叫“瀑流”？四瀑流。什么叫“四系缚”？这个就是说你完全被这种力量捆绑，被这种习惯捆绑。这个也是我们不能够去突破无明，甚至是我们不愿意去突破无明的很重要的原因。如果我们讲到盖的话，就是一种盖，把你盖住，让你不能导向善法，让你不能导向烦恼的削弱，乃至导向涅槃。"],[0,2871,2934,0,"（七）日常生活中发现烦恼、削弱无明所以，我们要去看无明或者是烦恼，我们不能够只是去记一些这样的名相，而是回过头来到自己的内心来看，我的无明在日常生活中是怎么表现的？这些无明都是怎么养成的？我们讲，无明要不断地去削弱。无明不是证到阿拉汉道的时侯突然间把它削弱掉的，而是你在修行的开始，就要不断地对它下手。所以，那一天我们跟长老在讨论，说： “修行的目的是断烦恼。但是，断烦恼的前提是要先会发现自己的烦恼。"],[0,2934,3025,1,"”发现烦恼，然后依着佛陀的教导，一点一点地去削弱烦恼。削弱，削弱到一定程度完之后，它越来越稀薄，你的道智才会有力量起来把它干掉。佛陀在讲捨断、断除烦恼的时候，也是分阶段的：彼分断、镇伏断、正断断。彼分断干嘛？它是怎么工作的？它就是在我们每一个日常的生活当中，发现烦恼，然后如理作意。在如理作意的当下，本来要生起来的烦恼，就被你断掉了。这彼分断是在当下刹那刹那去断它的。因为你一次一次地去削弱它，所以你无始以来形成的那个惯性、那些习惯就不断被削弱。不断地削弱，你的盖就越来越稀薄，你的止观才能够修上去。而止观反过来是干什么呢？止观是工具，不是目标。请大家一定记住！我们这么多年来很多人搞错掉，包括我自己。刚开始的时候就是冲着止观，“我要证禅那！咬牙切齿地证禅那”"],[0,3025,3100,0,"为什么很多人禅修的时候会有很多的紧张、很多的压力、很多的障碍？他都是拿我们世俗去获得成就的那种惯性来禅修，以为禅修就是来摘果子。他一个果子、一个果子地来摘，初禅、二禅、三禅、四禅。观智啊，这个名色分别智、缘摄受智，各种智，十六观智，全部摘回来，每天都很努力地去抓果子。很少会回到自己内心，落到自己每一个当下，去观察我们每一个当下的烦恼是怎么生起来的？怎么观察？其实很简单。你在走路的时候，走回孤邸，你觉知你的身体。你看一看你这样走路的习惯，你的摆走的习惯，你走路大步、小步的习惯，是谁在指挥你？你看到某某人，心里面“蹭”地起来一个标记，“这个家伙哈，有点娘娘腔”"],[0,3100,3184,1,"。这个东西它是什么？哈，稻草人，无明，这就是无明。这个就是！这个人，你看他就对他作一个“娘娘腔”的标记，这个就是“无明” ；然后接著下来呢，就不喜欢跟他在一起，这是“爱” ；然后拒绝，“我就是不想跟他，慧心尊者不要安排我跟他在一起，我受不了他”， 那就是“有”。从无明、爱、取到有，到这个身语意都出来了。无明、爱、取、行、业，它是这样来形成。那你平常的时候，你就去观察，你的那些五盖都在哪里？五盖就在这里。看到一个人，各种分析、评价、判断，娘娘腔、男人婆。然后，拿到那个入出息的作业时，也是“长啦、短啦、过来点、过去点、上来点、下去点”"],[0,3184,3237,1,"，好忙啊，每天都是这么折腾。然后呢，“槃爹，我的呼吸又怎么样了、怎么样了”，然后一堆的问题，不知怎么跟你说。就你日常生活有什么样的习惯，你一定就带到这里来，而且成倍地放大。你日常习惯的时候你没有想。因为什么？因为日常习惯你这么排斥人，不会觉得难受，但是，集中到这里（呼吸）来的时候，脑袋就大起来了，“槃爹，我鼻子很痛啊，我整个嘴巴都是硬的。” 哈！自己搞自己就是这样搞的。我以前是这样搞的，很多人是这样搞得。我自己后面怎么走出来的？发现自己的问题 —— 抓取的习惯。"],[0,3237,3379,0,"好，今天已经很长时间了，就是跟大家分享一点：四漏的无明漏在我们日常的生活中，我们可以从什么角度去观察？如果我们要在日常生活中发现自己的烦恼，发现我们的五盖，希望我们在修行上能有进步，有哪一些角度可以去观察，也是作为一个角度可以对我们修行有帮助。这个简单跟大家作一分享，如果有不对的地方，请长老批评指正。"],[1,0,128,1,"三十七道品-苦之集 02-四漏之无明古源尊者尊敬的善吉祥长老、各位尊者、各位尼师、贤友们：晚上好！遵照善吉祥长老的指示，继续跟各位尊者、贤友们来分享《摄阿毗达摩义论》第七章的内容。上一堂课我们投影没有放出来，今天我们重新来把投影投一下。一、总说摄集，回顾前六品（一）应知、应断、应证、应修第七章是〈摄集〉的部分。摄集的部分有四个部分：摄不善、摄杂、摄菩提分、摄一切。它就是已经把我们前面六章所有的内容都在第七章再做一个回顾。"],[1,128,266,0,"我们看到摄不善主要是十四个不善心所；摄杂，就是我们讲一个心来代表、二十六个心所和九种色法；摄菩提分也是一心，和十三个心所；摄一切是八十九心、五十二个心所、二十八种色和涅槃。具体的我们后面再来细地讲。那么，在这么多的摄集里面，我们应该怎么来去学习和把握呢？在所有的这个内容里面，我们有应知的部分。应知的部分是不善，还有杂、菩提分和一切法，就是所有的这些法都是我们应知的法；应断的法是不善，就是四漏、十四不善心所等这类型的。然后在摄杂的部分里面六因的贪、瞋、痴的部分，七禅支里面的忧、忧受，十二道支里面的邪见、邪思惟、邪精进和邪定。这里面我们就看到一个跟我们往常经常会不一样的地方，比如说我们上禅的时候，长老都会叫你查五禅支，可是这里是七禅支，这个禅支从二十四缘的角度来讲就是禅那缘。在《阿毗达摩》里面，禅那跟禅定是分开的。禅那缘就是你的心能够持续专注目标的能力，就是让禅支能够起来的；那么禅支呢，从禅那缘的角度上讲是有七个。我们入禅定就是五个禅支；同样的，我们讲八正道是八道，但是道缘有十二个道支。十二个道支是增加了什么呢？"],[1,266,334,0,"就是邪见、邪思惟、邪精进和邪定，这是属于应断的法。二十二根里面的忧根，九力里面的无惭力和无愧力，也是属于应断的法。还有一切法中的五取蕴，就是执取五蕴的执著，也是应该要断除的法。应证的法是涅槃，应修的法是菩提分，第七章里面就把我们应知的、应断的、应证的和应修的法都列出来。所以第七章本来看起来是一些名相的罗列，然而却是我们应知、应断、应证和应修的法。虽然在前面我们都有各别地学过，但是到第七章我们要把它串起来。串起来的目的是到第八章我们讲十二缘起支和二十四缘的时候，我们才不会不知道从哪里下手。"],[1,333,514,1,"（二）如何理解八十九种心只是一个究竟法？这里面特别需要跟大家讨论的一个问题，我们上堂课讲到说八十九种心，从究竟法的角度上来讲就只有一个心。为什么八十九种心可以称为一个心呢？八十九种心，到底是八十九种名聚呢？还是八十九种心识呢？一般我们大家不去思考这个问题。我们学八十九种心的时候，例如讲悦俱智相应无行一心，它明明是悦俱智相应有行/无行一心，悦俱智相应有三十四个名法，悦俱智相应无行一心三十四个名法，其中一个心识加上三十三个心所，我们是这么讲的。那这么看起来它是个名聚，对不对？它有心、有心所。那我们八十九种心是不是有不同的这样的名聚呢？那么，它这用在什么地方来看？为什么我们说“心”就是一种心呢，它明明有八十九种？我们这么来看，悦俱智相应无行这样的心可能出现在哪些地方？它可能出现在善心，它可能出现在果报心，它也可能出现在唯作心。果报心、唯作心和善心，它们在八十九种心里是分开的。那么，它在什么样的界？什么样的种性？在什么样的心的位置上，就是我们心的定则在哪个位置上？它起什么样的作用？这些我们要分清楚的。"],[1,514,662,0,"我们讲的八十九种心就是八十九种心识；而八十九种心的心识，其实就是一种心识。我们上堂课讲了七十二种究竟法。八十九种心合起来叫作一个究竟法，那为什么会把八十九种心说成是一个究竟法呢？八十九种心，从心识的角度来讲，它不是名聚，它是究竟法。那么这个究竟法的心识它有什么样的特点呢？这个心识，在这样的种性、在这样的位序、在这样的心路过程里面，它产生这样的作用。我们说心识就像国王一样，心所就像大臣一样，国王出现的时候，这个大臣就会陪伴。那么这个国王做什么事呢？国王所有的事情都得靠大臣们去完成，到最后，我们说这个国王做成了什么事，其实都是大臣们干的，是国王要求他们干的。有时候大臣习惯性地执行他的这种职能，在某种程度上来讲，就是这个心识，它就在这个地方出现，国王就在这个位置上出现。比如国王到边疆去平叛，他执行的就是三军总司令这样的职责；国王带著大臣们去度假村度假，它就起休闲的这种作用。也就是说，这个心识是让下面所有的心所在这个位置上，让它产生这样的一种状态，心识只是识知目标。识知目标刚才长老也讲了，就是说，你用什么方式识知呀？"],[1,662,721,0,"你用想颠倒的方式是识知；你用见颠倒的方式也是识知；你用有慧的方式也是识知；你用愚痴的方式也是识知，它们都是识知，但是识知的过程有很多的大臣陪伴著它。在这样的地方识知，他还是国王，他执行这样的作用。这个有点绕，对吧？八十九种心其实就是一个心，就是一个国王，但是他在八十九个地方去做他的事情，表现出八十九个国王的样子，但其实就是一个国王，没有变。所以，我们在统计心识的时候，它就像是一个国王，但是它在不同的地方出现的时候，它就执行国王的不同的作用，呈现出来的就是国王在这里干这样的事情。所以我们理清楚一下，根据上面这个说明——“识”"],[1,721,782,0,"，它的特相就是识知目标、识知所缘；“心”通常用于代表基于其相应心所，而得以分门别类的诸识。在论教里面，五蕴的中间三蕴：受、想、行被列为心所之内，心所与识同生、俱生，执行种种不同的作用。例如：善的悦俱智相应无行一心，是指在欲界善速行里与三十三个心所一起生起的那个环境下的心识。虽然心都是纯粹的识知过程，但因为与相应心所俱生，受俱生缘、相互缘、依止缘等等的影响，而作为先导的心识本身，也就具备了相应的素质，成为相应的能知。它是以这样的方式能知，它戴上这样的眼镜了。"],[1,782,849,0,"所以，虽然心只是一种究竟法，但因为品质的不同，生起之地的不同、生起位序的不同、作用的不同，而再分为八十九种或一百二十一种。心生起为前导者，由于心在世间法里面是主、是根本，所以心是前导者。然而，在出世间里面，慧是主，慧是根本，所以，慧是前导者。这是一个区别。在这里要跟大家把这个说清楚一下，一般很少去讨论这样的问题，但是这个其实很重要，不然就混乱了，一到学习二十四缘的时候就会混乱。什么是一个心识？为什么是一个心识？为什么一个心识又分成八十九种心？八十九种心的“悦俱智相应无行”，它不是叫作名聚，它是心。怎么去理解这个问题？把这个说清楚，大家记住一下。"],[1,849,961,1,"（三）不善之概要我们谈到了摄集的部分，其中第一块就是不善，摄不善。摄不善有十种分类：四漏、四瀑流、四轭、四系缚、四执取、六盖、七随眠、经教法的十结、论教法的十结、还有十种烦恼，有人叫十种杂染。这些我们都要干嘛？要应知应断。最终我们是要断它。那要断它，大家知道怎么断它吗？长老刚才说用望远镜，望远镜对错方向的时候也没有用。二、四漏 —— 欲漏、有漏、邪见漏和无明漏上一堂课我们谈到了，从四漏开始讲——欲漏、有漏、邪见漏、无明漏，那这个我们都很熟悉了！作为一个佛教徒，特别是上座部的佛教徒，太熟悉了，我们《阿毗达摩》学这么多遍的人。（一）要对照到内心里面去观察四漏，在日常生活中就要观察但是，对照到我们自己内心里面，我们怎么去观察这个欲漏、有漏、邪见漏和无明漏呢？我们讲说：到时候我们证得止观的时候我们就能看到了。概念法你都看不到，究竟法你就能看到吗？概念法你都不能认知它，究竟法就那么容易认知吗？"],[1,961,1042,0,"好，我们说修观，最开始的就是三十二身分。三十二身分是止禅，但是对于修纯观的人，三十二身分就是观禅。很多人说三十二身分拿图片过过就可以了，但是你的定力如果连三十二身分都不能够亲见，不能看到你的心脏是怎样，然后说你的定力就能够透视究竟法，这可能性是比较小的。其实，“四漏”我们在日常生活中就要能观察它。如果在日常生活中能锁定它，那么只要你真的培养起定力，拿起望远镜或者显微镜的时候，你才能够聚焦它，最后把它断除掉，这是很重要的。不然，我们只是日常生活觉照，好像无所谓，反正我们就是来禅修，最后我们有定力了，我们就看名色生灭、生灭、生灭......。我们到底要断什么？首先要搞明白。"],[1,1041,1131,1,"（二）什么是痴与无明？其实，我们说来说去，最难的一个是什么东西呢？欲漏。我们还知道我们就有贪嘛，我们有各种渴爱，我们很容易理解。但是这个无明就比较难理解，包括苦，我们上一堂课讲到了苦。无明，从这个解释上来讲，你不能够见到透视究竟法，透视究竟法就是在止观的时候才能够透视。也就是说，其实在我们日常生活当中，我们要想看到无明根本是不可能的。一般我们就是这么认为的，对吧？或者大家认为日常生活中能看到无明？怎么看，有想过吗？那我们先来看这个痴心所，就是无明嘛！其实呢，痴心所是比无明更深一点的内涵，有西亚多这样介绍过。当然，也有很多西亚多讲无明就是痴；痴就是无明，从大的角度上来讲是这样的。但是，痴比无明更深细。"],[1,1131,1220,0,"根据帕奥西亚多对“痴”的这个定义，首先，痴跟我们世俗讲的愚蠢不是一个类型。我们经常讲痴跟智慧相反，但是这个智慧跟我们世间的聪明又不一样。也就是痴跟世间所谓的聪明也不是相反的，不能说我们世间非常聪明，然后你就不会愚痴。那这个“痴”指的是什么呢？如果你能够以智慧辨析三十一界中的有情、无情，然后辨识它直到究竟法，且知见到只有究竟色法的集合、究竟名法的集合、究竟色法和究竟名法的集合，这是正确的知见，也叫“名色分别智”因的集合和果的集合，这也是正确的知见，叫“缘摄受智”。那么这些色蕴、名蕴、因蕴和果蕴，都被称为“行法”"],[1,1220,1347,1,"，它们都是无常的。因为它们生起来以后就坏灭，所以是称为 dukkha 的，是苦的、受逼迫的，不断地受到生灭的逼迫，是 dukkha 的。因为它们是生灭的、受逼迫的，所以它们是 anatta 的，是无我的，并没有不可摧毁的这种实质。另外，它们都是不净的，令人厌恶的。如果我们知见诸行法为无常、苦、无我、不净，那就是观智。当你辨识三十一界的有情和无情，发现这些只是究竟色法的集合、究竟名法的集合、五蕴的集合、十二处的集合、十八界的集合的时候，发现只有无常法、苦法、无我法的集合的时候，这样的知见是正见，是明智。如果没有这些知见，视有情为男人、女人、人、有情、人类、天神、梵天，视非有情为金、银、财宝、树、山河大地、森林高山，视它们为常、乐、我、净，这些是痴，是无明。如果坚固地执持这样的见解就叫作邪见。这是标准的关于什么是痴、什么是正见的描述。那么简单来讲，一个世间的人，我们刚才讲，就是痴。但无明呢，就是奔向于在究竟意义上并不存在的女人、男人，而不是奔向在究竟意义上存在的诸蕴，所以，这个称为“无明”"],[1,1328,1521,1,"。所以，“痴”就是说一个人不能够识别到究竟法的集合、它的因，以及它的无常、苦、无我、不净的这种特相。我们上堂课就讲到，要有名色分别智、要有缘摄受智，你才能看得见，所以我们痴、我们无明是有情可原的。那么，我这一辈子如果修不到名色分别智和缘摄受智，那我无明、我痴，你就别怪我了，是不是这样的意思？大家会不会这么觉得？会的，我以前是这样认为的。那么这样的话，我们所有的烦恼的根是痴。遍一切不善心的心所是什么？痴、无惭、无愧、掉举。痴，我又看不到，我又不能克服，那我生起不善心，没有办法。我们上一堂课讲到说：你看不到月亮，不等于月亮不存在。帕奥西亚多在他的《趣涅槃道》里面提到痴有两个特点：第一个就是，它错知五蕴集合的这样一堆名色为男人、女人；另一个是错知外面的一堆由时节生色集合的山、树、石头、乃至金、银，为金银财宝，为山河大地，这个是“错知”错知类似于你没法看，用我们一句土话讲就是瞎眼了，“你真是瞎了眼了！这个都不认得！”痴的再一个形象的表现是什么呢？就是刚才长老讲的，说魔术师搞的那个土块，明明是土块，他非得说这个是金子，明明它金光闪闪，怎么不是金子呢？"],[1,1521,1671,1,"这种人是什么呢？睁眼瞎，对吧？眼睛睁得很大，但是他硬是把土块认成是金子。“痴”有两个简单的描述：第一个就是瞎眼，第二个就是睁眼瞎。对于瞎眼的人，他会认为这个月亮看不到是因为地球的原因–––被挡住了，我没法看。其实，你看到的很多也未必是真的，如果你不去透彻地去看它、有慧地去看它的时候，你还是跟睁眼瞎一样。我看到你这个人，明明是个男人，是个女人，是个帅哥，是个美女，我怎么去往下看呢？这个也就是我们要学习的地方，就是所见未必是真实的。我们都不用说用佛法，用现代的医学就看到一个人最后是很多细胞，然后是很多染色体，很多的基因，现代医学就能看到。那么从医学角度上去看，哪有一个俊男、美女这样一个真实存在？俊男、美女是你构建出来的。我们说在唐朝的时候以胖为美，在哪一个朝代以瘦为美？那也就是说，美和丑是我们给它定义的，我们想蕴给它构建的。佛陀他之所以伟大，就是他不单单看到我们现在科学能看到的这样的一个状态，他一直透到究竟法。从究竟的角度上来看，世俗上的男人、女人，就是这种蕴的色法的集合、名法的集合。那么这些色法、名法，它是有因法、有果法；"],[1,1671,1772,0,"因法和果法之间，它是有缘的关系，佛陀把这个全部给理出来。借助佛陀给我们揭示的这个生命的真相、世界的真相，那么回到我们日常生活上，我们怎么去用它呢？我们不能等到说，要到名色分别智的时候我们才能够看到烦恼，才能看到无明，那我们这辈子不能证得，基本上就不用去管我们的烦恼了？那就很麻烦了。（三）从十二缘起支无明引发不善我们这里借用一个“冰山理论”，心理学搞萨提亚的都很熟，没有接触过的人可能不了解，大致跟大家讲一下。这个“冰山理论”的创造者说：我们表现出来的，我们讲四威仪，你的言行举止，人家能看得到的，它只是冰山浮在海面上的一角，就是浮在海面上那一部分人家能看到的；但是，你内心的东西，沉在海底里面你看不见的，往往比你表现出来的要多得多。"],[1,1772,1894,0,"第二个，你呈现出来的这些所有的言行举止都是受你内心深处的认知所影响的，他们把它列为安全感、情感的需求，各种各样列出来。我没有去用他那个内容，因为实在不究竟呀！我们就用十二缘起支的一部分内容来表述一下。大家这段时间都在学《大四十经》。玛欣德尊者在《大四十经》里说：“你的知见决定你的思惟模式；你的思惟模式决定你的行为模式。” 行为模式就是我们讲的言行举止，用《阿毗达摩》来讲就是身表和语表。身表和语表就是行为，行为就是浮在海面上的，大家能看得到的，浮在海面上能看得到的基本上就是身表和语表。身表、语表都已经是行了，就是已经造业，看得见，就是身、语、意三种业。如果你愿意给人家看的时候，人家是能看得见的，这是行为。那么，在十二缘起支里面就是属于这种生、老、病、死、愁、悲、苦、忧、恼这个层面的行为，属于身表和语表。那么它的最底层就是我们说对生命真相的痴。"],[1,1894,2017,1,"我们刚才讲说我们痴，好像是很无辜啊！因为我们就没有缘摄受智，我们也没有名色分别智，我们天生就是痴，天生就是一个瞎眼的人。因为天生瞎眼，我们瞎折腾，最后就像是一个神经病的人，这个我们后面再讲。第一个，我们是天生的对生命真相的痴，这个痴就是无明。因为这个无明，我们上堂课已经讲到，我们就会认为：这种生命的存在是我们最宝贵的东西。那为了这个生命的存在，我们就要让它存活，存活就要用四种食物，就是生命的四食：抟食、触食、思食和识食。抟食就是我们普通的食物；触食就是我们要产生感受。我们如果没有感受是活不下去的，我们一定要去找点感受来的。那“受”从哪里来？受从“触”来，触是让我们产生受的最主要的来源。那么“思”呢？我们讲思是造业，从大的角度上来讲，思是给我们提供三世轮回的主要力量，三世轮回主要的这个能量或者这个资粮是思干的。落到我们日常的生活上来看，就是我们每天要做各种各样的事情。什么是生活？就是生下来要干活，所以就要做各种各样的事，就是那个思在主导；就是我一定要做这个，我要做那个，这是思食。识食从最根本来讲，它是识别。"],[1,2015,2080,1,"其实，“识”，我们知道，如果后面学二十四缘会讲一个“后生缘”，后生缘是什么呢？就是后面下一个即将生起来的那个心识，会以后生缘的缘力来支助当下这个刹那的四种四生色法。那也就是我们经常讲：这个人死了。在《阿毗达摩》里，死以什么为标准？死心生起。死心一生起，你所有的命根就断绝了。所以，食是维持我们的寿命、维持我们的命根，同时也维持我们色法的存在，也维持命根九法聚的火界的存在。我们经常讲说：“这个人是不是真死了？胸口摸一下就知道。"],[1,2080,2233,0,"” 虽然你看不到他死心生起来，但只要他胸口凉透了，基本上就没戏了；但是如果胸口还温的，就别做太多过分的事情，就别下葬了，别把他放到冰柜里去，这个太痛苦了。也就是这个食，它支持我们生命的寿命，再一个是支持命根的火界，这是从大的角度上来讲。也就是说，生命的存在一定要有这“四食”四食，生命的存在，它在十二缘起支里以怎样的方式存在呢？我们讲识、名色、六入、触和受，这是我们当下的这种果报的存在。因为你去喂养四食，你有这样的识、名色、六入、触、受这样的存在；因为无明，我们就会对这种生命存在有执取；有执取就会产生欲爱、有爱和无有爱；因为有欲爱、有爱、无有爱，我们去造作。爱从受来，受从触来，触从我们六处跟所缘的接触而来。那为了让我们这个生命得以更好的持续，我们上堂课讲过，就是你要做标记，好的我们把它列为要不断地去获取的，要去争取的；不好的我们要不断地去防范。所以，这种爱，在面对所有的四食的追逐过程中，就要有各种各样的判断和识别，这个判断和识别就属于想心所和胜解心所做的事情。那么，不断地这样判断、识别就会形成我们这个习惯性的认知模式。"],[1,2233,2308,0,"这个认知模式包括我们的见解和我们的思惟模式。思惟模式就是寻，我们讲六种寻，要么贪寻、瞋寻、害寻，要么是无贪寻、无瞋寻、无害寻，这就是思惟的模式。知见的模式呢，要么就是你有智慧的见解，我们刚才讲的——帕奥西亚多讲的正见。如果没有正见，你的认知基本上就是欲取、戒禁取、邪见取和我与取，就是很执著这样的一种看法。那么在很执著这样的看法和这样的行为模式的支持下，才会有我们现在上面的这种行为模式、这种四威仪。其实从我们日常的身表、语表里面，我们讲的部分去理解、去观察这个海底下的这一部分的内容。"],[1,2308,2381,1,"（四）认知移情，观自他双方的无明、爱、取当我们跟一个人交流，你说著说著，你就发现那个人脸色不对了。有时候会不会有这种感觉？那脸色不对是什么？就是身表。身表是究竟法，还是概念法？那么，五门心路过程生起来的时候，色、声、香、味、触，五种所缘是究竟法，还是概念法？五门心路过程取的都是究竟法的，随彼起的意门心路过程才把它概念化。所以佛陀讲说：“见只是见，听只是听，觉只是觉。”这是看究竟法，即是你的五门看到的、接触到的、听闻到的、尝到的，在那个五门的当下，它就是究竟法。"],[1,2381,2505,1,"还有一个很重要的内容，就是你看到这个人脸色不对了，其实我们是可以用现在的语言叫“认知移情”。大家听过这个词吗？“认知移情”听过吗？“同情心”听过吧？“同情心、同理心”听过吧？同情心是比较容易的，当你没有病、没有痛，看到人家病痛了，同情了，高高在上地同情一下，比较容易；同理呢，就会难一点。同理就是我们要有一点感同身受他人内心的状态。认知移情就更难。认知移情是什么呢？就是说，他人是怎样的认知呢？这是冰山下面的东西。你怎么去理解他人怎么样的认知，如何用心去感受他人是什么样的认知，这个大部分的人是不做的。当你跟人家说话，你看人家脸色不对了。脸色不对了是冰山下面的，还是冰山上面的呈现？冰山上面的。那么，冰山上面的呈现受什么影响？他的认知、他的看法、他内心的那个无明、爱、取。大家在学修缘摄受智的时候，长老都会教导说：“观察一下上一生临死前成熟的那个业，那个业后面的无明、爱、取。"],[1,2505,2561,1,"”所以，缘起第五法，过去五因产生现在五果。过去五因：无明、爱、取、行、业。行，是那个速行；业是那个速行留下的业力。无明、爱、取，如果是不善心的话，可能在同一条心路上；如果是善心，一般都在另外的心路上。无明、爱、取，一般都是贪的心路，那么，贪的心路就是造作这个“行”的动机。当你看到这个人脸色不对的时候，这是“行”，这是他的“行”表现出来了，那么这个“行”后面一定有无明、爱、取。你尝试去理解这个人脸色不对后面的无明、爱、取，就是认知移情。"],[1,2561,2639,1,"我们经常讲说，很多有孩子的人家里，现在孩子最大的问题是什么？玩游戏，对不对？一回家，看到他在玩手机、玩游戏，你就气不打一处来：你再玩游戏，明天就怎么样怎么样！会有效果吗?为什么没有效果？没有认知移情啊！我们的课就叫“快乐之道”。以前我们给大家讨论过，一切生命的一切生命活动只有一个目的。什么目的？寻找快乐。你家孩子打游戏干嘛？寻找乐子。他找乐子，你去剥夺他的快乐的权力，会有好结果吗？你很快乐的时候，突然一个人冲过来把快乐剥夺了，你会怎么样？你肯定就是不开心：“你可能比我大，我比不过你，但我会顶著，明天有机会我就收拾你。”"],[1,2639,2733,1,"所以佛陀讲说：“以不善法对治不善法，无有是处啊！”你不可能用不善法去对治不善法的。“每天玩游戏，以后怎么办？”对不对？“那考试不及格，考不上大学，以后做乞丐？”一堆烦恼就来了，就开始批斗了。那我们说，这个时候，怎么观察自己的无明？怎么观察那个孩子的无明？你的不善心生起来了，瞋心，对不对？瞋心是一个什么心？痴、无惭、无愧、掉举、瞋，这是后面的。前面这个触、受、想、思、一境性、命根、作意、寻、伺、胜解、精进、欲，没有喜，然后痴、无惭、无愧、掉举、瞋。那它的“痴”是什么？“有一个真实的在打游戏的儿子存在”这么理解，你会发现根本解决不了问题，是吧？“这就是我儿子，他真的就在打游戏，他打游戏就是会影响学习，我以后就是没有办法面对这个问题。"],[1,2732,2861,1,"”没问题。其实在究竟意义上并没有你的儿子。有用吗?很难的。当你修完“缘摄受智”可能有用啦！修他的四界差别，见到他就想把他灭掉，看到他的无常、苦、无我，看完以后，出来还生气。（五）果报如此，速行可变那这个时候应该怎么办？真正的这个果报跟速行是什么关系？果报如此，速行可变。“果报如此”就是他已经在打游戏，你看到是你的果报。“果报如此”，你是不能够直接对它采取行动的，你直接对果报采取行动基本上是没有效果的。为什么呢？你直接对果报采取行动，善的果报呈现出来的可喜所缘，你就粘上去；不善果报出现不可喜所缘出来，你就排斥，瞋就要起来，直接采取行动就是这样。所以儿子打游戏了，要怎么办？退后一步，平静一下自己的心。平静一下，你的玻璃心不要摔碎了，然后记住了——认知移情，看到他后面的无明、爱、取。他的无明、爱、取就是玩游戏他有快乐，但是他为什么玩游戏有快乐，而读书没有快乐呢？这是根本，对不对？我们讲佛陀教导我们“苦、集、灭、道”"],[1,2861,2970,1,"“苦、集、灭、道”不是说遇到问题你闭著眼睛说：“要苦、集、灭、道。”就能解决的。日常生活上你看到“苦”就要看到它的因；你看到它的因，你就要在“速行”上解决它、处理它。速行可变嘛，对不对？速行可变，你调整它的时候，你就会灭掉它，就会彼分断它。孩子如果打游戏，他平常挺乖的，一天就打一个小时的游戏，在这个时代，一个孩子一天打个把小时的游戏，很好啦！你得让他打，对不对？不然他回到班上去，人家讲某某游戏的时候，他跟瞎子一样的，太没面子了，对不对？没法生存啦！一天打一个小时的游戏，可以缓解学习的压力，也有很多种其他的原因，当然也有上瘾的，比如一天有打十二个小时的，那你就要去分析原因嘛，对不对？我们刚才讲到了色法的集合、名法的集合、色法集合名法集合的因，以及这个因法到果法之间的缘，你要把它分析完，这是苦和集，苦谛和集谛。只有把这个分析清楚完以后，你采取正确的行动，用善法对治善法，用善法去引生善法。"],[1,2970,3074,1,"“已生不善令消除，未生善法令生起。”你这样去做的时候，你的儿子可能就可以跟你交流了。你说：“打游戏啊？今天学习挺辛苦的，再打半个小时。半个小时以后呢，我有个事跟你讨论一下。”你儿子一定不会跟你吵架，对不对？他首先会觉得打游戏被看到了，心里面有点纠结，但是妈妈说再玩半个小时，“啊，还可以玩半个小时，马上就吃饭了，就轻松了。”半个小时过后再跟他聊天的时候，他就不会有抵触，是不是？这个孩子教育是另外一个话题，不是我们这个主题。那我的意思是什么呢？就是你在你的日常生活中看你的无明，如果你瞋心起来的时候，你的无明怎么看？痴、无惭、无愧、掉举。痴就是你根本看不到孩子为什么打游戏的背后的一切的因，你只会生气，这是痴。那么无惭、无愧是什么意思呢？就是：“这是我儿子，他打游戏就是不对，我就是想生气，我就是要揍他，我真想把电脑砸了。”你不会觉得做这样的事情，满脸涨的跟猪肝一样的，这样伤害自他的行为是应该回避的，你是不羞耻造恶，不回避造恶，你就是要干，无惭、无愧，对吧？"],[1,3074,3146,1,"掉举呢，很多人掉举就搞不明白，说：“我明明对著我儿子，我怎么就掉举了？我就是受不了他打游戏，我怎么掉举啊？”大家想想你怎么掉举了？你内心其实早就从他玩游戏的那个当下的实实在在的状态里面，冒到他打游戏完以后学习成绩会一塌糊涂，以后会成为一个二流子，走到那样子的思惟去了，对不对？就是你心的所缘其实是在那一堆想法上，根本没有在儿子玩游戏上，没有在当下，你掉举了。你已经在好几个所缘里面啪啪啪啪啪啪：“我怎么收拾他？我等下要把电脑线断了，还是把它砸了？还是我等他爸爸回来的时候拿那个鞭子抽他？”哎，一堆的东西——痴、无惭、无愧、掉举，能明白吗？能去观察吗？接下来是瞋，瞋是不善。不善的特点是什么？不善的特点第一个是什么？伤害自他。"],[1,3144,3206,1,"（六）不善法伤害自他贪、瞋、痴任何一个都是这样，伤害自他。怎么伤害的？从名法的角度上来讲，痴、无惭、无愧、掉举，是善心所还是不善心所？不善心所是健康的还是不健康的？不健康的心产生的心生色法怎么样？是有害的。我们讲生气的人会产生毒素，这个毒素我们可能分别不出来，但是你在修观的时候，可以看到不善心、瞋心生起来的这个色法沉重、僵硬、不适业，火界很旺。我们讲瞋心烧毁心所依处，就是很多心脏有心脏病的、心脏有纤维化的人，不用问，百分之一百二都是脾气不好。"],[1,3206,3287,0,"“没有办法，我心脏不好。”先看看你的脾气喽！不要讲你心脏不好，好像很可怜样。心脏不好有什么可怜？心脏不好就是爱生气嘛！你把脾气改掉以后，心脏就好了百分之八十，所以瞋心是伤害自他的。儿子被你骂一顿以后，他也火烧了心所依处，然后跟你们之间的关系连接就不能得到有效地沟通。它是伤害自他的，它是不健康的，它会留下不良的、不善的影响力，不好的影响力。如果这个事在你临终的时候成熟会怎么样？对，瞋心基本上就是地狱吧！我们有很多禅修者，他们在观察去地狱的时候，第一个生起来的那个不善都是不大的瞋心，小小的瞋心。然后这个小小的瞋心会引发一个过去更强有力的瞋不善业，直接把他送到大地狱里面去，待很久都不回来。"],[1,3287,3414,0,"（七）四种想——慧相应的想、识相应的想、定相应的想、出世间的想所以，我们讲这个无明和不善法，是可以在日常生活中来部分观察到的。那么，帕奥西亚多在讲想心所的时候呢，专门讲过这方面的内容，是什么叫“有慧想”？想呢，有很多种想，多种类型的想。我们今天先简单地看一眼，这个“想”有哪几种类行？帕奥西亚多说：“有慧相应的想、有识相应的想、有定相应的想、有出世间的想。”那慧相应的想是什么呢？如同于四大跟随特相明显的基本色，心所－想，也会跟随心理特相、力量明显的名法。帕奥西亚多在这个部分里面专门讲说：“什么是在日常生活中就能够生起有慧想呢？”虽然没有观智，当你看到这一块木头，你知道这是以地大的硬做为基本色的一个色法的集合，没错吧？当我们知道所有的都是名色组成的，那这是一块以地大的硬为基本色。但是呢，这个硬还是比较轻的，相对于石头或者是铁来讲。那个铁呢，它不单重，还有硬；那么木头呢，它是比较轻，但是它也硬，它有基本色。你用这样的一个观点来看这块木头，就是“有慧想”"],[1,3414,3517,0,"同样，当我们看到水的时候，我们知道它是以水的流动性作为基本色，这样的一个色的集合；当我们看到火焰的时候，我们知道它是以火大的热作为基本色，这样的色法的集合。虽然其他的也有，火也有地大、也有风大、也有水大，火里面也有水大，但是它从属于那个火大，而且这个火大是以热为主导的。同样，当我们观察自己的心，比如我们生起来是一个贪心，那么这个贪心是以这个“贪”作为主要基本心所的一个名聚。你看到的是名聚，但是你知道这是以“贪”为主的，这种情况下，我们也不能说你完全看到究竟法，但是我们也不能说你对究竟法一点感觉都没有。你明明已经体验到那个粘著，就像五花肉粘在热锅里面，拉出来就会撕掉一块肉一样的，那种捨不得，那种粘著，你是能感知到的，就是那个贪的特相。贪的特相、作用、现起、近因你是能部分感觉到的，所以不能说你完全不能够去感知这个究竟法。那么在日常生活中，不管是无情还是有情，你都带著这样的心去感知就是“有慧想”"],[1,3517,3613,0,"，你不会落到那个痴、无惭、无愧、掉举里面去，这是有慧的想。识相应的想是指智不相应的善心。智不相应的善心，我们举个例子讲，比如说：很多外道——其他外教、兄弟教，他们做很多慈善，我们不能说他们做慈善就没有善心，因为遍一切善心的心所里面有信。然后我们说那个信，一般来讲，从《阿毗达摩》来讲，你要信八事，信佛法僧三宝，信戒定慧三学，信过去五蕴、未来五蕴、现在五蕴、过去未来五蕴，信缘起。外道，显然你感觉他没有，但是，你不能讲他没有善心。会不会纠结？那说有没有慧？同样地，你在做善行的时候如果没有基本的因果正见，我们说它没有慧，但是这样的善行一定是善的。由于时间原因我们后面再讲。即使是外道做善行，他也是可以生起智相应的心的。那么，他的信是另外一个角度，我们后面再说。"],[1,3613,3764,0,"这里面讲的识相应的想是指智不相应的那个善心，那个想是属于识相应的想。那定相应的想呢，就是我们修禅那，四十种业处，大家很熟悉了。当你入禅了，长老就会让你去修一下“五自在”——五自在，眼睛一闭你就去了。为什么眼睛一闭就能去呢？因为对于那个业处的所缘你已经非常熟悉了，乃至于你根本不会去专注二、三个呼吸。眼睛一闭，在这个地方，你就能入定了，就能够五自在的入禅，这个就是定相应的想。这只要一形成，它就会一直跟随你。不管是慧相应的的想、识相应的想，还是定相应的想，只要形成，它就跟随你，你不改变它，它不会变的。同样的，如果是贪、瞋、痴相应的想，这种傲慢，这种悭吝、嫉妒，这种相应的想，它也会一直跟随你，你到哪儿去都是这个样子，而且你对你的业处，它也是这个样子。出世间的想是以涅槃为主导的。这个想、这个标记对于我们行为的发生，它是起什么样的一种作用？首先是你有这样的想，你这样的想就会有不同的判断；因为你有这样的标记，然后你下次再看到就会做这样的判断。判断在我们心所里面属于胜解的工作。五门心路过程那个确定心，六门心路过程的意门转向心里面的胜解心所，负责对这个所缘做一个判断。"],[1,3764,3877,0,"这个判断跟这个想也是对应的，它也有基于慧的判断、基于识的判断，然后基于定的判断，它也有基于各种寻的判断，就是我们说判断经常会比来比去、比来比去、比来比去，那这个比来比去涉及到为什么我们会比？我们下一堂课有机会再讲这九种根爱法，也就是无明怎么从最初一点一点地长养成我们现在这个样子。佛陀在《分别论》里面专门讲到了九种根爱法，下一堂有机会我们再来分享。今天我们的课就到这里啊，我们一起来回向啊！"],[2,0,137,1,"尊敬的法悦尊者、各位尊者、各位尼师、各位贤友，晚上好！我们今天继续来学习《摄阿毗达摩义论》第七章〈摄集〉部分的内容。（一）回顾上堂课的内容前两堂课我们学习了关于“摄不善”的部分，用了比较多的时间讨论“四漏”，对“四漏”的理解，怎么来理解“四漏”？什么是“欲漏、有漏、见漏、无明漏”？它是怎么运作的？上一堂课我们也讲到了“冰山理论”，借用“冰山理论”来看从基本无明到行为造作这样的一个次第。（二）九根爱法（贪源法）的定义今天我们来学习这个“九根缘法”"],[2,137,210,0,"佛陀在《分别论》里面提到的这个九根爱法－“贪源法”是什么意思呢？我们讲欲漏，“欲”到底是怎么形成的？怎么开始有这个欲的？佛陀说： “此处，如何为九根爱法耶？是缘渴爱而有遍寻求，缘遍寻求而有获得，缘获得而有分别，缘分别而有欲贪，缘欲贪而有取著，缘取著而有把持，缘把持而有悭，依悭而有护，以护为原因而有执杖、执刀、争论、论难、争斗、相违、离间语、虚妄语等无量之恶不善法生起。此言为九根爱法。”这个是《阿毗达摩》—〈分别论〉第十七卷里面的内容。"],[2,210,359,0,"二、两种无明（一）贪的根源是由于根本的无明在这里面佛陀描述出来的就是：我们这个贪的根源是怎么起来的？我们在前面的课程里讲到了由于根本的无明，认为我们这种生命的存在是唯一的，不知道有涅槃，不知道有烦恼灭尽之后的不能称为存在的存在。（二）临死速行业的无明爱取还有一种无明。如果在帕奥系统里面修课程，我们在观察上一生跟这一生的关系的时候，在修缘起第五法的时候，老师都会让你查上一生临死前成熟的那个业。成熟的那个业找到之后，你还要再找导致这个业出现无明、爱、取的那条心路。那怎么找呢？比如说，举一个出家人的例子：一个人年轻就出家，显然他在他的上一生临死前造作的业跟他出家有关。很多人会查到他曾经去做一个布施或者听法，或者禅修。在禅修之前呢，他可能去到某一个禅林看到一群比库，他觉得： “欸！这个比库生活挺好！”他很喜欢，然后带著这样的心持戒、禅修，在临终的时候这样的业在他的意门呈现、成熟。那么，他的过去五因怎么查呢？就是看到他这个禅修的业，可能不是证得禅那，而只是在专注入出息的这样一个欲界的善业成熟。他造作这个业，是在前面他认为有一个比库的生命存在，一个比库的生命他很喜欢。"],[2,359,428,0,"认为有一个比库的生命存在，这是无明；喜欢比库的生活，是爱；执取比库的生活，是取。那么，他造作这个专注入出息的善业留下业的力量，在临终的时候成熟，无明、爱、取、行、业，导致这一生结生成为人。我们说认为有一个比库的生命真实存在是无明，这个跟我们认为“这个生命的存在形式是唯一的”，其实是一个内涵，就是认为这样的一种五蕴的生命结合，或者是四蕴有的生命结合，是可以执取的，这个就是无明。（三）生命的食粮短缺所形成的生存与繁衍机制1.生命食粮概念因为有这个无明，你执取这样的生命，这个生命就要存在，就要繁衍。由于繁衍和存在，你就要给他生命的四种食粮（抟食、触食、思食、识食） ：精神的食粮和物质的食粮。"],[2,428,560,1,"那么，因为食粮总是稀缺的，好的食粮总是稀缺的，而且根据佛陀的教导，你越是贪婪，它就越稀缺。2.渴爱生命形成生存与繁衍机制我们怎么来讲这个“根源法”呢？就是从这里来看咯！因为这样的无明，我们渴爱。渴爱什么？渴爱这样的生命存在。渴爱这样的生命存在我们就要去喂养它，要让它存在。存在有两个层面：一个是你自己的个体存在，一个是物种的繁衍。基本上，我们就是为这两件事活著：为了生命的存在活著；为了物种的延续活著。不管是哪一种存在，哪一种活法，你都要去寻求你的物质的食粮和精神的食粮，也就是四食 —— 抟食、触食、思食和识食。因为好的食粮总是稀缺的，所以就要遍寻求。你去遍寻求，就会获得。由于人道是精进果报道，只要你愿意付出努力，多多少少都会有获得，因为获得就会有分别，因为分别就会有你、我、他这种取著、执著在里面，因为取著就有把持。我们说都出家了，什么都放下了，但是孤邸里面还是满满的东西，天天都在魔宝里面搜出各种各样的东西，要各种把持，你把它扔了都捨不得，就有悭吝。而你们在家人的柜子不怕多，女众的柜子不怕多就是这个原因。"],[2,560,681,1,"因悭吝而有守护，因为守护，要保护嘛，要装防盗网、要请保安，从家庭来讲是这样的。那么，从国家的角度来讲，就有军队，就有保护，大家拿枪、拿刀，所以就有各种争论、论难、争斗、相违、离间语、虚妄语，种种恶不善法会这样生起。我们讲轮回是无始的，无明是什么时候开始的呢？不知道！我们从生命的开始，就是我们这一生的开始，我们看到是因为上一生你认为有一种生命存在，它就变成这样。3.禅修者过去世为鸡的启示有一个禅修者，他检查到他某一生是一只公鸡，他就去查为什么会变成一只公鸡呢？他发现那只公鸡出生前的上一生，在临死前的速行有一个妒嫉的速行。什么样的妒嫉呢？那一生他是一个小财主，比上不足，比下有余的那种。但是他就跟一个大财主去比，比房子大小，他觉得那个大财主的房子比他家的大，他很妒嫉。这样一个妒嫉的业居然会配对什么呢？配对他年轻的时候他家养的一只大公鸡。他很喜欢那只大公鸡，就是喜欢而已，他觉得那只大公鸡长得太雄伟了，只是这样的一种反应，然后他这样的一种无明、爱、取，会跟他临死前妒嫉人家的房子比他大这样的业配对在一起，让他的下一生成为一只公鸡。"],[2,681,727,0,"一般来讲，我们都说： “啊，我怎么可能呢？我不可能无明到想当一只公鸡啊！” 但是你一不小心就会成为一只公鸡，就是只要认为有一个什么东西很好，你就去了！4.(1)雷瓦达尊者举例投生为狗的生存繁衍机制雷瓦达 Bhante 有一个开示讲到说： “有一对夫妇穿行沙漠，又饥又渴。走出沙漠以后，终于找到一户人家，人家就给他们食物，其中丈夫就狂命地吃，狂命地吃。那家主人在给他食物的同时也喂狗，拿同样的食物去喂狗，那位丈夫看了很难受，心想： ‘这样的食物也拿去喂狗，我还不如一条狗。"],[2,727,849,0,"’他心里面就想： ‘我还不如一条狗。’就是这样的一种想法，结果因为他吃撑了，把自己吃死了，暴食吃死掉了，结果他的下一生就成为了一条狗。” 他就是因为想著： “啊！我这么苦，我出来以后跟狗一样，还不如一条狗。” 就因为这样的一个念头让他成为一条狗。就是说，我们可以看到我们这一生成为一个生命的无明从哪里来，我们可以这样检查的。但是更久远，我们生命无始。无始的生命的无明从哪里开始呢？我们是看不见的，但是佛陀讲过，我们这一劫或是我们这一期的生命，人类的生命期怎么来。佛陀讲过《起世经》 ，说我们这一期人类的祖先是来自于光音天的梵天人死后，由于他们的业只能到人间来结生，他们无法在色界天或者欲界天里面结生，只能在人间结生。而那个时候处于世界之初，刚好成、住、坏、空在成劫，可以居住，所以光音天的天人死亡以后就在人间结生。而那时候结生的人，我们的祖先，身体有光明，能够飞行，不用吃东西，开始的时候也没有男女之别。你看，我们人类早期的时候根本不需要吃食物，也不需要穿衣服，不需要电脑，也不要发微信，都用他心通，什么都可以。"],[2,849,924,0,"就是我们现在用各种黑科技来武装我们的所有的这些东西，我们人类的祖先根本都不需要用，他们直接就用他们的心的功能就可以完成。从我们的祖先到我们现在来看，就是不断堕落的过程，是不是？但我们的科学家说我们是进化的过程，其实我们是在不断堕落的过程。4.(2)人类祖先由于贪，成为现代人类的过程这个堕落的过程是怎么发生的呢？按佛陀的说法，说当时地上有一层地肥非常殊胜美妙，就像酥油一样。那我们的祖先需要吃吗？不需要。但是他们为什么吃呢？他们就是好玩，就像大家坐在家里看电视，没事干，嗑瓜子一样的。嗑瓜子，你的身体是完全不需要的，对吧？你根本不需要嗑瓜子，可是看电视没事干，弄点瓜子嗑一嗑，然后一边看电视就不会无聊。所以，我们的祖先吃地肥的原因是因为无聊。"],[2,922,990,1,"飞啊！飞啊！飞啊！只要是人就有舌净色，所以他就试一下，发现味道很好！就从那个时候开始吃起来。所以一传十，十传百，大家都在吃地肥。没事干，吃地肥，很无聊的吃地肥。结果开始吃地肥后，身体就开始粗糙，然后贪欲就开始生起。本来的形体是光明的，每个人看过去的形色都是很殊胜的，没有那么沉重，看不出哪个人的脸说： “哦，这个人长的五官比较端正！”大家都一样。但是慢慢地吃地肥以后，那个形象就会现出来。现出来以后，就会有一些人显得好看一点，有些人显得难看一点。显得好看一点的就会觉得别人难看，那种攀比心就会起来；显得难看一点的人对那个长得好看的人的嫉妒心就会起来。"],[2,990,1091,1,"因为这种贪欲或者这种瞋心生起来，然后怎样？地肥就消失了，然后长出地膜，又长出地蔓。地蔓吃完后，大家的贪欲继续旺盛，连地蔓也没有了，最后长出没有壳、也不用煮的稻谷，就是这样。长出稻谷以后，吃了五谷，人的身体就彻底地长出人形来了，而且这个稻谷不像地肥那么精微，人吃了之后就要排泄了。我们的祖先本来是没有大、小便道的，是后面自己長出大、小便道来了，因为必须拉，所以漫长的时间里就长出大、小便道来。打自大、小便道出来，就开始出现男女之别；有男女之别后，也是因为好玩才开始有男女之和。经典是这么讲咯！越是这样，贪欲就越来越盛，美好的东西越来越少。美好的东西越来越少，大家才要建立家庭，然后要保护啊，要抢夺啊，要守护啊。这就是我们这一世的人类，是怎样透由这种贪缘，这种贪的根缘，然后不断地退化成我们现在这样的生命状态。"],[2,1091,1151,0,"4.(3)现在的人类生存环境带来食粮的变化这样的生命状态看起来好像物质极其丰富，跟三十年、四十年以前比起来，我们的物质已经丰富很多了，但是我们的内心真的更快乐吗？我们丰富的那些物质吃起来的味道怎么样？我们现在吃馒头都没有那个面的味道，是吧？那就是好东西不断地在埋没。以前我们随便在上山采个蘑菇都觉得很甜，现在就是山上长的野生蘑菇都不甜，都没有那种甜味了，更不用说我们种植的东西，对吧？所以我们不用看生命多少劫，或者说几千万年来的变化，就看我们这三、四十年的变化我们就能看到。每个人都是这样努力的为了我们生命的存在，为了物种的繁衍付出无数的努力。"],[2,1151,1211,1,"4.(4)抑郁症的增多的根本原因是无明但是，似乎我们的内心并没有更快乐，我们的身体也没有更健康，反而现在号称中国抑郁症患者达到临床的这个比例已经超过五千万了。是三千万，还是五千万，我忘了，但是有抑郁症这个症状的人，听说已经达到人口的 5%，还是 10%？有一种说法是 10%，10%就有一亿多人，就是一亿多的人有抑郁症的症状。在我们小的时候，三、四十年前，抑郁症这个词都没有听说过。抑什么郁！干活去！农业学大赛，对吧？干活哪有空抑郁，抑什么郁？虽然生活苦一点，但是内心都很欢乐，就是这样的。"],[2,1211,1296,1,"我们现在已经说不清楚我们有多少苦恼了，那这是什么？这就是无明。由于无明，我们欲贪，然后我们有各种颠倒。昨天我们讲到各种错误的标记。有人发现，全世界的人都这样奔波努力，所以前两年有一个很时髦的词叫“内卷”，指“无谓的付出”。我们说最大的内卷是生命的轮回。我们无始以来一次次的轮回，然后在那边卷，这才是真正的内卷，最大的内卷。我们因为这样的贪爱，我们来看这四漏，它为什么会形成欲漏、有漏、邪见漏、无明漏？它到底是一个什么样的关系？首先是因为无明，因无明而有渴爱，这是欲。对生命的执取，有爱有两种说法：一种说法是对生命的执取，对有、对 bhava（生存、存在）的执取；还有一种是对色界天、无色界天这样的生命的执取。不管怎么说，都是对生命的执取，这个是有爱。三、生命中的漏接著下来是“见漏”"],[2,1296,1374,1,"。因为无明不断地重复，你就形成一个非常坚固的邪见，执取这样生命的存在，这是“见取”。见取有多种，我们不讨论了，以前在学《阿毗达摩》的时候都学过了，我们只是把它总合一下，它是这样的一种次第。我们的生命只要被这样的漏所把控，后面就会有四轭、四暴流。所谓的“四轭”，你就会被像牛的轭一样，被紧紧地捆在那个地方。因为这样的漏、这样的轭、这样的暴流，你无法渡越，你就在无始的轮回里面轮回。不管你怎么样编造有更美好的所谓的“我”，现在很多人讲说要有大我、本我、自我、超我、高我、真我，你再怎么真、怎么微妙，都是“我”"],[2,1374,1439,0,"，只要是“我”，只要你有那个“我”，你就一定会轮回，就渡越不了那个暴流。像佛陀讲： “你只要停留，你就会沉没；你只要挣扎，你就会被漂走。”这就是在暴流里面的状态。因为受到渴爱的原因，由于渴爱而遍寻求，遍寻求而有获得，获得而有分别。四、奖励机制与保护机制我们在前面的课程讲到，在这个过程里面，我们怎么去寻求和获得呢？在寻求和获得的过程中，我们是以怎样的一种机制去获得和寻求呢？一种是奖励的机制，另一个是保护的机制。"],[2,1439,1495,1,"（一）奖励机制奖励机制的特点是能够获得快乐，但是快乐一定是短暂的。如果快乐一直是长期的话，你就不会想再获得，以至于生命就会死。对于会获得快乐的东西，你是不会设防的。对于会带来快乐的东西，我们在识别它的时候会精准识别，我们可以很清楚的分出来是老曼峨的茶，还是布朗山的茶？是三十年生茶，还是二十年生茶？我们可以把它分辨出来，因为我们会精准的识别。在这个过程里面我们会不断地获得，最后就会上瘾。只要是能给我们带来快乐的，我们会上瘾。"],[2,1495,1613,0,"禅修也一样会上瘾。只要会带来快乐就会上瘾、会重复，这就是快乐机制。但其实呢，快乐，也就是欲乐的东西的特点，是边际效应递减。大家认真看一下都知道，其实所谓的快乐是一个工具，是物种自我保护和延续的诱饵。大家想一想看是不是，生活就像奔跑在求乐跑步机上，你一直在跑，但从来没有到达目的地，就是这样的一个特点。就像你天天都在跑，在奔跑。生活、生活，活著就是要干活，生下来就是要干活，就叫生活。我们人类不断的探索和追求更多的拥有，但从来没有真正的饱足过。你觉得满足吗？没有人会说满足。如同背负著苦和压力奔跑在求乐跑步机上，不断的努力追求快乐，但并没有真正的接近它。这是我们人在追求快乐的写照。（二）保护机制再一个机制就是风险的机制。为了去获取生命的四种食物，只要对我们生命的存在和繁衍有帮助的，它会给你快乐，但是快乐是短暂的，它促使你不断的去获取，这个获取过程中你会精准识别的，但你永远不会满足，你会上瘾，上瘾就是会一直要、一直要。"],[2,1613,1676,0,"对于可能对我们的生命或者繁衍带来危险的，我们会启动风险机制，就是痛苦的一种自我保护反应。危险或者求不得，你会感受到痛苦——身体的痛苦和内心的痛苦。然后你的想蕴会把它标记为“这是危险的！” 在未来你会无限的扩大你的防范范围。我们讲“宁可错杀一万，也不可漏了一个”就是这个意思。“一朝被蛇咬，十年怕井绳”，只要看到类似的，我们就要防范它。所以，我们这个状态不管是快乐造成的，还是痛苦造成的，当我们标记完以后，你会发现它都会颠倒。"],[2,1676,1779,1,"五、关于想蕴梳理（一）想蕴梳理的原理为什么要让大家梳理呢？梳理什么？它本来是这样的一件事情，它没有那么恐怖，但是你就会把它无限扩大到你生活的一切处，这样的情况就会形成所谓的“稻草人”。原来是发生过，但是你后面一次次错误判断，就是佛陀讲的： “你不断给自己中第二支箭，伤害自己。所以它无限的扩大防范欲，然后是模糊识别，大致一看，噢！赶紧跑！或者马上心顶起来，只要一看你的眼神，什么意思？！就顶起来。所以痛苦的保护反应，是物种自我保护和延续的另外一个诱饵。大家想一想，在我们的生活当中，是不是就这两种机制基本上就把我们完全的限制在里面。什么是轭？什么是暴流？你就这样去想一下，就会发现轭和暴流是那么真实，就在我们身上每天都在发生。这样的一种机制，它在我们的生命中，在我们的身心里面，是透由什么东西来运作呢？"],[2,1779,1907,0,"我们每一堂课都会经常讲这个想心所。对想心所的了解以及后面其他胜解心所的了解是非常的重要。想心所是做标记，胜解心所是做判断。想心所的特相：在心里做标记和印记；作用：通过以前所做的标记认得相同的所缘，知道这个记号，并期望以后会认得；现起：心所注意的记号，根据该记号去注意目标。心现起就是现在呈现在你的心里的状态，是心所注意的记号，就是你过去的记号。（二）想蕴梳理的举例分析比如你小的时候曾经有过某一种遭遇，你给它做一个标记。如果是一个不可喜的所缘、不可喜的果报，如一个不善的果报成熟，你被打了、被骂了、被欺负了、受委屈了，你觉得是这样的一种状态，根据你的保护机制，你会无限的扩大，你会扩大你的防范欲。以后你只要碰到跟这个相类似的场景，甚至它根本就跟你关联不上，你就会把它判断为这个事情可能会给你造成同样的伤害，然后你就会选择各种方式去抵抗，或者不由自主地紧张，这是想蕴的情况。我们也讲过想蕴有不同的类型。有慧相应的想、有识相应的想、有定相应的想、有出世间相应的想，当然更多的是错误的想，跟贪、瞋、痴、慢、疑、悭吝、妒嫉相应的想。"],[2,1907,1972,1,"这些想在标记完以后，在我们未来的生命里面碰到相应的事情，你的标记判断，比如贪、瞋、痴、慢、疑.......等相应的想，就会一直跟随著你。总归起来，就是三种颠倒。（三）想蕴形成过程中出现的三颠倒三种颠倒：第一种颠倒我们叫“想颠倒”“想颠倒”雷迪西亚多说是稻草人，他用稻草人来比喻。接下来是“心颠倒”“心颠倒”就犹如魔术师把土块的颜色让你看得像金色一样，所以你就认为它是金子。“想颠倒”的特点是当我们看东西的时候，如果认真看，是可以看清楚这是稻草人的，但是因为保护机制的形成，所以你只是轻取目标，一看到稻草人就认为是人，这是判断错误。"],[2,1972,2033,1,"“心颠倒”是指它的认知能力不行，如果用稻草人来讲，他会说稻草人就是人，就是他已经没有能力去判断什么是稻草人、什么是人，他就认为稻草人就是人，这就是“心颠倒”“邪见”呢？“见颠倒”就是“想颠倒”和“心颠倒”交合，你经常同样不断地判断，然后形成一个非常坚固的看法和认知。如果你还在“心颠倒”的阶段，有人可能来跟你讲“想颠倒”的阶段： “真的，它是稻草人。不信我们走进看，看它会不会打我们。” “真的吗？”鼓起勇气走去看看，结果发现真的是稻草人，你还是有可能被说服。如果到了“见颠倒”，你就很难说服一个人。你说： “我们再去看一下。"],[2,2033,2136,1,"” 对方可能就会说：“你找死啊！它肯定是人，它会害我们的！” “见颠倒”的运行状态就是这样。因为这种三颠倒，所以我们就不断的在生活当中，去追求只会给我们带来短暂快乐的五欲之乐。这个五欲之乐的特点是排他的、竞争的，不会让你满足的。它其实是不稳定的，你去抓取它的时候是不健康的、是不善心的，会被智者呵斥的。（四）瞋行、贪行的体现这个不健康，要特别提醒大家，你自己体会一下。当你的贪心或瞋心起来的时候，你是可以观察到的。瞋心不用讲，贪心起来的时候，当下那种想抓住，那种黏著的心，同时又有一种淡淡的害怕失去，就像好吃的东西害怕人家多吃一口的感觉，好东西怕被人家拿走的感觉，它是伴随著的。这样的心，从名法来看痴、无惭、无愧、掉举、昏沉、睡眠、贪、瞋、痴、慢、疑、邪见、嫉、悭，十四个不善心所，是伴随著不善心生起来的。所以你的心是不健康的，你的心生色法也是不健康的。"],[2,2136,2212,0,"一个贪心重的人，他的心生色法一样黏著，黏著的人就容易得三高，特别是血脂过高。所以贪的人容易胖，瞋的人就比较容易瘦。瞋的人火气大，所以他的心生色法就是沉重、僵硬、不适业，而且火界比较强，它会烧毁自己的心所依处。瞋心的一个特点就是破坏，破坏自己的身心，破坏自他的利益，就是这样的特点，但是我们却会在里面去执取它。六、 《燃烧经》所描述的无常、苦就像佛陀讲的《燃烧经》 ： “诸比库，一切都在燃烧。如何为一切在燃烧呢？眼在燃烧，颜色在燃烧，眼识在燃烧，眼触在燃烧，缘于此眼触而生之受，无论是乐，或苦，或不苦不乐，其也在燃烧。以何燃烧呢？我说以贪之火、以瞋之火、以痴之火燃烧，以生、老、死燃烧，以愁、悲、苦、忧、恼燃烧。"],[2,2212,2329,0,"这种燃烧我们大家好像很难体会，其实你去看我们在贪起来、瞋起来的时候，我们想要某种东西的时候，那种心的那种想要的那种交杂的那种感觉，那种炽热的感觉就是在燃烧。眼在燃烧、颜色在燃烧是什么意思呢？我们为什么会有眼睛？是因为我们在过去无明里面有色爱，有色爱才会有眼根。七、由于不同的贪著导致不同的结生比如无色界的天人就是不喜欢有色，在他定力够的时候，以无色界的定力就能在无色界的梵天界结生。他没有眼根、没有耳根，也没有鼻根、舌根、身根。色界天的天人有眼根、耳根，没有鼻根和舌根，也没有身根。为什么？大家如果有入禅的体验都有这种感觉，身体空掉了。身体沉重的时候是很难入禅的，如果入了禅，还能体验身体的沉重，入定是无法时间太长的。所以对于能够入禅的人来说，沉重的身体实在是一种负担。能入禅的人，实在是没办法才要去吃饭。其实最好是不要吃饭，吃饭也是一个负担。"],[2,2329,2426,0,"这样的一种体验，当你以禅那为食，色界的禅那维持到临终的时候，你在梵天结生，你就不会有身净色，你不会有鼻净色，你不会有舌净色。随著你什么样的无名、爱、取，你会有什么样的生命状态。如果你很贪吃，什么东西一到你眼前，你眼睛不看闷头就吃，这样的贪业成熟，好一点的就是猪，差一点的就是蛆。粪坑里的蛆，一生下来就吃，张著大嘴巴，从来都不停，一直吃到死为止，它的无明、爱、取得到充分的满足。为什么说眼在燃烧？就是你的眼根是无名、渴爱才有的。眼睛看到好的颜色，“哦，好颜色！”看到美女，眼睛都在燃烧，内部也在燃烧。因为你有无明、爱、取，所以你的所缘才会呈现，你的根门才会呈现。所以为什么《阿毗达摩》告诉我们说： “眼、耳、鼻、舌、身，面对看、听、嗅、尝、触，色、声、香、味、触，都是果报。很多人不能理解，说： “我到处走，我到处看到东西，怎么到处都是我的果报呢？”现在理解了，对吧？"],[2,2426,2564,1,"如果你没有想要看，就不会长眼睛，就像蚯蚓，它不会长眼睛，湿生的很多动物都没有眼睛。如果没有想听，就不会有耳根，所以我们能长出耳根，是因为我们的无明、爱、取；你能长出眼根，你所对境的这些净色就是你的果报，就是跟你要相应的。所以眼根在燃烧，色在燃烧，眼识在燃烧，因为眼根跟颜色和眼识接触，就会产生识，然后产生受，所以受在燃烧，受是你渴爱的东西。如果你渴爱的跟你相应，你就会贪，贪在燃烧；你觉得会对你产生危险的，你就瞋，你也是在燃烧。所以生命的真相是什么呢？就是你的生命因为无明、渴爱造作一个业，然后产生这样的一个生命，继续绕在里面，内卷，无始的轮回，这个就是我们必须看透的。所以什么是痴，什么是邪见，什么是无明、三颠倒，我们不去细讲它。无明对一般人来讲，我们听起来好像很遥远，为什么？因为大家都说阿拉汉才断除。所以日常生活中我们都会有无明。如果你认为无明跟我没关系的时候，你就不会想去发现它；但如果你在日常生活不去发现它，因为无明它是根，我们就很难发现我们的烦恼，也很难发现我们烦恼的运作。不能发现烦恼，不能发现烦恼的运作的时候，我们就没有办法削弱它，也没有办法能够彼分断除它。"],[2,2564,2645,0,"八、断除烦恼的方法与建议所以我们建议大家第一个就是转过来。生命的一切目的对于佛教徒来讲，是断除烦恼。来到禅林，禅修是为了断除烦恼，服务是为了断除烦恼，管理是为了断除烦恼。如何在禅修、服务、管理等各个岗位上或者各个事项上都能够发现烦恼呢？（一）接受果报很好的一个方法，第一个，你所接触的看、听、嗅、尝、触，所有东西都是果报。你想的东西，法所缘的东西不一定，但只要是看、听、嗅、尝、触，全部都是果报。面对果报的时候，第一个念头：果报不可改变。我们知道果报不可改变，对不可改变的东西你不能对它马上采取行动，所以你要停下来。果报的东西，我们知道只要是五蕴、只要是果报，它就是苦，它只有苦，没有其他的。好东西是苦，不好的东西也是苦。"],[2,2645,2735,0,"（二）分析原因对于果报，接下来就要看它的原因。这个果报产生是什么原因？得到一个供养很欢喜，贪心生起来了，不要这样。供养来了，一看，这是什么果报？什么因、什么缘，你拥有这样的果报？不可喜所缘出现的时候，停下来看看什么因、什么缘？昨天我们讲到了对自己的远因和近缘，对方的远因和近缘。远因看不见，近缘都能看见，近缘最容易看到的，就是周围是一件什么事情造成的。更重要的是，我们要看到别人背后的无明、爱、取和你自己的无明、爱、取。当你接受一个供养的时候，对方的无明、爱、取是什么？人家的无明就是认为我供养比库、供养西亚雷有功德；我们认为你有精进的持戒、有精进的禅修，所以你有功德；你是僧宝的形象，我供养你我有功德。认为有一个有功德的比库存在，是他的无明，他认为这样的比库值得供养，“我要供养”是他的爱和取。"],[2,2735,2810,1,"（三）努力做福行接下来他做供养是他的行，这个行是福行，无明、爱、取，导致他做的福行留下善业的力量。一看到这样，人家是基于对你德行的尊重而供养，你对照一下，我有这个德行吗？好意思吗？你那个贪就不好意思生起来了。如果是说，我们今天在禅林里面做服务，安排我做采购，太烦了，事情太多了！不是说有多累，而是一般我们都知道，禅林虽然住众不多，但是出去一趟不容易，开一趟车不容易。除了各种菜、各种禅林所需，还有很多尊者、尼师、贤友交代的一堆纸条，基本上去一趟县城就跟无头苍蝇一样，把所有的商店转一遍，很辛苦的，所以大家谅解一下。"],[2,2810,2911,1,"但是呢，在做事的人要怎么想？反正已经在做了，与其烦恼的做，还不如有功德的做，这是最起码的。更重要的是，当你接到若干任务的时候，看看自己心，烦恼有没有生起？什么类型的烦恼生起？哪一个尊者交代你做事，你会很欢喜的做？哪一个尊者叫你做事，你就会很烦恼？你为什么会分别？你为什么会难受？这是你的烦恼。（四）面对烦恼的态度与处理方式我们一般来讲很正常啊，这个人很无理啊！很无理我就应该烦恼。但是他就是无理，而你烦恼是你在损失还是别人在损失？所以当我们发现烦恼的时候应该欢喜啊！为什么呢？我们的生命就是为了断除烦恼而来的，现在烦恼出现了，我要怎么找到它？我怎么处理它？然后你通过持续的观察会观察到什么？就是说你的烦恼是有规律的，它是有类型的。这样的类型它是有原因的，就是你形成这样的烦恼背后都是三颠倒： “想颠倒、心颠倒、见颠倒”，不然不会有烦恼，那你就找是哪一种见。"],[2,2911,3003,1,"如果是“见颠倒”，是哪一种见？如果是大比库，善吉祥长老安排的，我就要好好地去做；你这个萨马内拉对我指手画脚，就很难受。这是为什么？那你检查，检查按八正道来。第一个就是你的见。你对长老的见是什么见？你对萨马内拉的见是什么见？你对普通住众的见是什么见？什么样的见，就会影响你什么样的思惟方式；什么样的思惟方式，就会影响你什么样的行为方式。这样的见后面，一定有“想颠倒”和“心颠倒”。你再追下去看，你的“想颠倒”和“心颠倒”能不能找到？一般就会找到那个稻草人。如果你很急、很著急，你可以看到这个急的习惯是怎么形成的。如果你总是有很多的慢心，我只服务哪些人，不服务哪些人，这就有高慢、有等慢、有卑慢。"],[2,3003,3103,1,"卑慢跟自卑不同。自卑是自我打击。卑慢是“我是不如你，我是刚来的住众，你是老大！你有什么了不起啊！” 就是脖子一梗，你有什么了不起啊！这叫卑慢；而自卑呢，它没有这样来一下，就是打击自己。自卑是瞋心，卑慢是慢心，它们是不同的。（五）稻草人的举例你看到这样的一种惯性，背后都能找到稻草人。找到稻草人就要梳理，用八步梳理法把它梳掉，把“想颠倒”换成慧相应的想，慧相应的想，慢慢就会变成正见，你把它转过来变成正见。我们举一个例子，就是有一位贤友，她五岁左右在外婆家里，姑妈出门之前交代她把韭菜洗干净，准备中午吃饺子，并且奖励她一个大苹果。结果她先把大苹果吃了，她觉得大苹果吃完再干活。结果大苹果吃完就坐在沙发上晒太阳，脚烤在暖气上，很舒服地睡著了。结果中午的时候，吃饺子的人都回来了，人家讲道： “苹果倒吃完了，韭菜一根都没有洗。"],[2,3103,3183,0,"” 她就记住这一句话，这一句话的标记是什么呢？就是安逸是不会有好结果的，是会被谴责的，她的标记就是这样。后面我们不讲，这位是个西亚蕾，大家很熟悉，现在她在帕奥，老贤友都认识她。这个人特别严谨，对自己的要求近乎苛刻的那种人，同样她对别人也是非常苛刻，我们讲她眼睛里容不下一粒沙子，看人都是非常毒，非常精准的看过去。这样的人，你要派她做事情，如果跟她能够相应，就是说大家做事情都很严谨、很有条理，你会发现跟这个人做事情太好了，她是一个非常井井有条，速度很快，而且对自我要求非常严格这样的一个人。但是你要想偷懒，你想搞点小动作，要跟她相处就会很困难。"],[2,3183,3254,0,"同样的，我们在禅林里面，我们一起做事、我们一起服务，你观察自己的心，是从什么地方来的，这些都要去除。“我就是这样的性格”，你这样的性格 OK，但留著就成为你的五盖，你就是止禅的时候没有成为你的五盖，观智的时候也成为你的五盖；观智的时候没有成为你的五盖，你在道智生起之前会成为你的五盖，因为你没办法平衡。我们知道道智初起它的前提是五根平衡，道智之前是行捨，对诸行法完全没有取著，心完全平捨的状态，道智才可能初起。你没有这样条件，道智不会初起。你即使现在禅那修上去，那个盖还在；你能修观智，那个盖还在，最后观智不能够达到顶尖的位置，你无法把道智生起来，这是很要命的。"],[2,3254,3338,0,"所以出来混都是要还的。你有那些烂习惯，你不要指望修著修著，观著观著就没了，不会的。你哪一天早点把它处理掉，你后面就轻松了，就速通达，要乐行道速通达。现在苦行道什么原因？苦行道就是因为盖，你把盖都处理掉，它就乐行道。盖怎么处理呢？打坐的时候看自己的习惯。有些人巴拉密特别好，他一坐在那儿就是去，他的盖就发现不了。（六）如何渡过暴流所以真正盖要发现，是在人与人之间打交道磨合的时候才容易发现，不是鼓励大家要做事。你自己知道，自己专注业处的时候不想跟人打交道都很清净，只要慧足尊者一给你安排事就没法打坐，难受到不行。什么原因？就是你的盖都出来了，你所有的烦恼都卷出来了。卷出来对于修行人来讲就是找到机会了，要处理它，处理它是有方法的。"],[2,3338,3446,0,"第一步我们就把他的“想颠倒、见颠倒”找出来，然后一个个把它处理掉，这样处理下来，我们讲说你才能够从这种暴流里面渡越过去。渡越这个暴流， 《相应部•天人相应》里，有天人来问佛陀： “大德，怎样渡过暴流？”佛陀看他很傲慢，说： “我不停留，我不挣扎，我渡过暴流。”天人马上就谦虚了说： “什么叫做不停留？什么叫做不挣扎？”佛陀回答： “当我停留的时候我就下沉。朋友，当我挣扎的时候我就被卷走。所以朋友，我不停留、不挣扎，渡越了暴流。”怎么理解呢？停留就是没有任何动作，随顺著自己的习惯。我们讲随缘，随缘不是随便。这个是随便，反正我没有任何需求，人人就是这样，我就这样过呗，我就这样生存呗。人家是这样争取，我就这样争取；人家这样努力，我就这样努力，这个就是停留。停留你就沉沦，沉沦是什么？就是继续轮回，你不知道轮回到哪里去。"],[2,3446,3508,0,"第二个就是当我挣扎的时候我被卷走，这个挣扎就是你发现说：“我要做善行，我要做个好人，我要为人民服务，我要度无边的众生。”你很努力在做善行，但你会被卷走。做善行、做福行和不动行你也会被卷走，原因是什么呢？你以为做善行就可以解决问题。当你有这样的知见的时候，你一样会轮回，会被卷走。所以佛陀既不停留也不挣扎。不停留不挣扎是什么呢？就是发现烦恼、断除烦恼。烦恼出来了我怎么断除你，最后我能看到无常、苦、无我，彻底的无常、苦、无我，然后道智初起，烦恼斩断，不停留、不挣扎，渡越了暴流。"],[2,3508,3576,1,"今天我们就学习到这里，祝愿大家早日能够渡越暴流！萨度！萨度！萨度！"],[3,0,521,1,"尊敬的善吉祥长老、各位尊者、各位尼师、各位贤友，晚上好！今天我们继续来学习关于《阿毗达摩》第七章〈摄集〉之不善的部分。我们在上一堂课学习了九种根爱法，佛陀说我们这个渴爱是从哪里来的？一直到我们现在这样的社会，非常多的恶不善法无间地生起，它的根源是在哪里？我们也回顾了佛陀讲到我们这一劫，人是怎么来的。一、人是怎么来的？我们提到：从科学的角度来说，人是进化来的；从佛法的角度来说，人是退化来的。所以我们人需要吃饭、需要穿衣服、需要房子、需要车子，都是因为无聊搞出来的。本来不需要吃饭，吃地肥吃著玩，就吃成现在这个样子，这是很悲催的一件事情。"],[3,521,698,0,"一般我们社会学家或人类学家说：人类发展到现在是一种自然的选择。这个自然选择如果用根爱法的角度来看就非常地对应。人从可以飞行，没有男女之别，身上有无量的光明，以禅悦为食，人与人之间可以他心通，不需要发微信，想去见谁直接飞著去就可以，慢慢地发展到我们人类最惨的时候，就是这种状态——没有衣服穿就穿兽皮，没有东西吃就开始狩猎。佛陀在一部经里面讲到，原来人不需要吃食物的时候是可以飞的，身体是内外莹澈的、光明的；到开始吃东西了，身体就开始粗糙，然后贪欲开始生起，这个世间美好的事物不断地在隐没，一直到食物需要去种植，乃至于开始狩猎，开始去杀动物来吃。佛陀说，人原来只是吃植物的时候只有两种病。哪两种病？吃饱了和饿了两种病。然后自从开始吃动物以后，有多少种病？九十六种病。那生病要吃什么？喝牛尿。开始喝牛尿治九十六种病，九十六种病就是这么来的。所有这些过程我们一路学习下来，根本的原因就在于我们的颠倒，颠倒是因为我们的愚痴和无明。愚痴和无明在过往的学习里面，我们总觉得离我们很远，是属于阿拉汉才断除的嘛！所以一般来讲，我们是看不见无明的。"],[3,698,774,1,"这其实是一个很大的问题啊！如果我们在日常生活中不能够观察到自己的无明的现起，我们就没有办法不生起“颠倒见”；只要生起“颠倒见”，那么我们所有的烦恼就会现形，诸不善法就会无量地生起；诸不善法生起，就会造作无边的恶业，让我们的生命在低层次的世界里面轮回，永远都出不来。二、从想颠倒到趣颠倒所以我们花这么多的课时，从“四漏”一直讲到现在，还在讲烦恼和颠倒的问题。从颠倒到我们现在的这种生命的状态，我们再引用一下雷迪西亚多在他的《观禅手册》里面讲到的这样的一个次第：首先，是因为颠倒，三种颠倒——“想颠倒、心颠倒和见颠倒”"],[3,774,872,1,"“想颠倒”如果归纳出来有哪些类型呢？讲心所或者讲无明的时候，都会看到书上是这么告诉我们的——错误地认知男人、女人或者金银财宝为常、乐、我、净。常、乐、我、净也被称为四颠倒，四颠倒再乘上三颠倒，就有十二种颠倒。那怎么来讲呢？比如说我们这个“想颠倒”“想颠倒”有四种：一种就是“于无常认为有常”这样的颠倒，错误地把无常当成常的；对于苦当作乐来享，就是以苦为乐倒；以不净为净倒；以无我为我倒，就是这四种。同样的，对于“心颠倒”也是这样，“见颠倒”也是面对这四种。"],[3,872,929,0,"“想颠倒、心颠倒、见颠倒”我们在前面的课程讲过，它们是层层的递进。（一）三颠倒：想颠倒、心颠倒、见颠倒“想颠倒”是最基本的。“想颠倒”它的表现就是判断错误，它看事物就是看错掉；到了“心颠倒”的时候就只会那么看。如果说“想颠倒”的那种认知还可以纠正的话，那么“心颠倒”整个的认知水平就在那个状态里面。到“见颠倒”的时候，就会顽固地认为“这种错误的认知就是正确的”，已经很难去调整它。这是层层递进，表现为越来越坚固，对我们生命的影响似乎又越来越表层。"],[3,929,1068,0,"在日常生活中，我们应该怎么来看呢？比如我们总讲：看事物常、乐、我、净。我们会遇到很多同学说：“不会啊！我看我爸爸或者看我太太、看我先生，我不会觉得他有常啊！”我问：“怎么讲？”他说：“你看！他会生、老、病、死啊！我们是佛教徒，我们知道他会生、老、病、死，所以我没有看他是常啊！”真的是这样吗？在日常生活中，这个常、乐、我、净，我们应该怎么来看？如果你家先生今天跟你一起上街看到一个美女，多看了好几眼的时候，你会有什么感受？那个时候你会认为他是无常的吗？你会认为他是常的，你家先生永远应该是你的，他不能够对别人多看几眼，那个时候你的常见就会出来。那我们来看面对自己的孩子，面对自己的孩子你也会说：“我知道啊！孩子不是我的，他是业的所有者、业的继承者，以业为起缘、以业为亲属、以业为皈依处，我都懂啊！”好，结果你今天回家看孩子作业没做在玩游戏，然后你就生气了。生气完以后，你就说你的孩子，那你的孩子一般会怎么样？会很开心吗？如果你的孩子顶你一句，你会怎么样？一般我们会对孩子的看法，就是孩子他应该是认真学习的、乖巧的、孝顺的，对吧？"],[3,1068,1170,1,"那么这个是什么？这个就是你的常见。当孩子没有表现出那个孝顺、那个听话、那个良好的学习，那你就会生气。你为什么生气呢？因为你认为他应该这样，结果他没这样，就是你对他有常见。能体会吗？那你这样看，再看我们周边所有人是不是都是常、乐、我、净？你认为这个孩子会带来快乐，为什么？乖巧啊、学习成绩很好啊，经常在朋友圈我可以晒一晒娃：“噢！我娃又考 100 分！我娃这次竞赛又获得第一名！”然后人家说：“真棒啊！”你就沾沾自喜，快乐啊！没想到第三天孩子就考个 50 分，又不好意思晒了, 回家心里面就难受。为什么会难受？因为常见嘛。因为你认为孩子就是一直要表现很好，他应该一直给你带来快乐，但居然没给你带来快乐，你就痛苦了。你认为这个孩子你是可以管理他的，你是可以控制他的，他不应该玩游戏，他学习成绩就是应该很好，你就是带著“我”的这个想法，但事实就不是这样，不是这样你就会生气。如果你是带著无常想、苦想、非我想、不净想的时候，你就不会这样暴跳如雷，不管是你对你家的孩子，还是对你家的先生或是对你家的太太，对不对？"],[3,1170,1225,0,"乃至于我们在禅林里面，我们跟所有的贤友或者跟同梵行者之间的关系，我们都会用常、乐、我、净的想法去看待对方。当你带著常、乐、我、净的想法去看待对方，如果对方不符合你常、乐、我、净的想法的时候，你的苦受就会生起来，烦恼就会现形，这个就是从常、乐、我、净的观点来看咯！这种常、乐、我、净有三种层次：第一种层次“想颠倒”“想颠倒”就是看错了，以前标记过这个人是这样的，后面也就一直是这样看。所以我为什么经常跟大家讲说：“不要随便给自己、给别人贴标签。"],[3,1225,1298,0,"”说：“某某人啊，我知道他就是这个样子的。” 说完以后，你早已给他贴完标签。那个是什么？那个就是“想颠倒”啊！对不对？给他标上标记就是想蕴啊！而他其实本来不是这样，你给他贴个标签就是稻草人。本来好好的一个人，你把他变成稻草人，以后在认知这个人的时候，你就一直用这种方式来认知，其实他一直在变化，你却看不见。当然，我们讲人有一些本性，但是本性是会变化的，而且它每天都会变化，特别是在禅林这样的地方，对不对？那么你做了这样的一个标记，标记完以后，刚开始时不时你还会这样想起，然后你们交流了一段时间以后，基本上你就会对这个人这样看。一想起他，“我知道！”就是你不用再去想他曾经有过的那一些跟你的交往场景，那些场景不会起来，你的心里面就直接这样体认他，那就到了“心颠倒”"],[3,1298,1363,1,"，那种“心颠倒”对他的常、乐、我、净的要求是这样子的一种状态，然后再不断地发展下去就是非常顽固啦！长老每次都讲说：“你看人不要这样子看啦！”“这个人就是这样！我知道！我已经跟他在一起三年啦！”这就是到了邪见了，用邪见的方式来看这个人的常、乐、我、净，就是日常生活中能这样看到。所以前两天，上一个 Uposatha 我们讲到了梳理，这个八步梳理法的第八步——“想蕴的重建”，很多人觉得这个东西很难做。有些人提出来说：“我爸爸不在、我妈妈不在，或者说他们已经过世了，或者我根本不在他们身边，我怎么跟他们重新建立？”想蕴重建的过程，我们是从“想颠倒、心颠倒、见颠倒”"],[3,1363,1512,1,"，要把这个转过来，从这个错误的想，转化成有慧想。那这个有慧想或者有慧的这个认知是属于什么范畴？所以上堂课我跟大家说，要从八正道来做想蕴的重建。那八正道的第一支道支是什么？就是正见。正见如果这一次梳理下来，你的对象是你的爸爸，你怎么去做你的想蕴重建？从第一步一直梳到第七步结束，你觉得梳完了，最后你要重建，才拿你的本子写下梳完以后你对你爸爸的看法。举个例子来说，你写它十条：我认为我爸爸是这样、这样、这样……写十条，这是现在你对你爸爸的看法咯。能明白吗？那么这样的看法就是你对你爸爸的见解，拿过来对一下佛陀讲的正见的要求，这十条里面有哪几条是属于正见的范畴？里面有没有常、乐、我、净？还是说他是无常的、是苦的、是非我的、是不净的？他有他的业，他有他的烦恼，如果你这十条理下来，里面你对你爸爸有各种各样的看法，那你就去对一下咯。如果有不正确的看法和观念，就说明你前面七步没有梳下来，你没有梳清楚，你的见解没有转过来。为什么对于有些人，我要强调说不能去套名相？他会写十条 —— 我认为我爸爸是无常的，我认为我爸爸是苦的，我认为我爸爸是 dukkha 的；"],[3,1512,1620,1,"他是业的所有者，他是业的继承者，.........。你会编啊，会编十条下来，看起来都是正见。ok，没问题。接著下来“正思惟”。每一条你去想一下你爸爸，用心想：我爸爸是无常的。你想想看，你接受吗？你骗不了自己的心的。你可以骗我，但你骗不了自己的心。你的心是要触碰的，你触碰一下看有没有感觉？好，你说你心里也想过去了，ok！心里也过了，说：“我确实是这样思惟的、转过来的，已经正见、正思惟了。”好，接下来正语、正业、正命。什么是正语、正业、正命呢？如果你爸爸、妈妈还在，你就给他们打电话，或者你到他们面前，干嘛？道歉。能不能道得出来？你的爸爸曾经在你小的时候批评过你一次，然后你这几十年来在心里面无数次地抱怨他。就是你爸爸当时真的有错，但也只有那一次，然而你几十年来无数次地在心里面抱怨你的爸爸，这是有心生色法的咯，也就是你在你的心里面诅咒你爸爸几十年。这是真的，学《阿毗达摩》的人都知道，对不对？你自己想想多么恐怖！你不但伤害你自己，也伤害你爸爸，你爸爸身体不好都跟你有关系，不是吓唬你的，要补偿啊！你补不过来，那你真的想起来，你能不能跟你爸爸道歉？"],[3,1620,1680,1,"能不能由衷地从心里面说出来？如果你爸爸不在了，你能不能去他的坟前去说？如果你还是不能去的话，因为你在禅林，ok！写上你爸爸的一百条好——我想起我爸爸一百种恩德。能不能写出来？由衷地写出来，试试看！正语、正业、正命。我们作为一个佛教徒最可怕的一件事情是什么？我懂呀！我知道业果，我知道要正见呀！一切以正见为先导，我在法住禅林学过《大四十经》，慧足尊者还考试考我了，我考了九十六分。那考一下你的正见，怎么考呢？你面对你所有的人，看你有没有正见咯！从长老开始写下来，我对长老的看法，一、二、三、四……"],[3,1680,1772,1,"..，身边所有的人都写下来，每一个人写十条，你看你对他是什么见？问你自己的心，你这样的见，是真的还是假的？是编出来的，还是自己内心的？你就很清楚你对他是不是有正见，你对他的心的想法有没有正思惟。所以八正道，八支正道不是拿来想的，不是拿来考试的，是拿来面对你生活的每一个人的身上。你身边所有的所缘，你能不能用正见去对对看？那真有这个，那就是这个正见是你的；如果没有，正见不是你的，是佛陀的，跟你没关系，你只是鹦鹉学舌而已。所以我们上堂课讲到梳理就是讲到颠倒，“颠倒”我们现在大家说能不能在日常上生活应用？无明怎么来看？正见怎么来看？是不是可以看到？雷迪西亚多说：“由于这三种颠倒，我们会发展出三种虚妄思。"],[3,1772,1948,0,"” “虚妄思”我们中国的古大德把它翻译成叫做“思量”，这个“思量”不是非常地准确，所以有尊者把它翻译成“虚妄”，也有一些人把他翻译成“戏论”，也是这种类型。（二）三虚妄思：渴爱虚妄思、骄慢虚妄思、见虚妄思那三种颠倒如果成为一种随眠，那么必然会有这三种戏论或者三种虚妄思是会伴随它的。一第个是 taṇhā，taṇhāmaññanā，就是渴爱的虚妄思，它是继感官欲望所起来的一种期待；第二个就是骄慢的虚妄思，mānamaññanā；第三种呢，就是 diṭṭhimaññanā，邪见的虚妄思。这三种虚妄思会一直在我们的名色相续流里面，跟无明和颠倒一起伴随的，这个 maññanā如果从巴利的意涵来讲，就是有点类似于幻想或者自我估计。就是想像，不断地让这种想像在里面绕，不断地增长的这种感觉；或者就是在自己的面前伪装成这种非其所是，就是要表现出一种特殊的这种样子出来。那么，“渴爱虚妄思”的具体表现就是会想像出来——这是我的，这是我的自我，你去执取在实际上是非我、非我所、非我我这样子的事情。也就是说在胜义谛上来讲并没有我，那既然没有我，当然也就没有我所和我我。"],[3,1948,2039,1,"然而确实有这样的情形，就是把内外所有的所缘，妄增想像，把它分别为此乃我所、余非我所、此乃我我、余非我我。怎么来理解呢？就是我刚才讲的，比如说你面对你的孩子、面对你的家人，或者面对同梵行者，他本来就是独立的生命体，无始以来他的名色相续流是独立的。他的名色相续流跟你的名色相续流是两个，不会混淆的，只是因为某一种因缘你们会在一起，各自都是业的所有者、业的继承者，以业为起缘、以业为亲属、以业为皈依处。但是当我们在一起的时候，我们就会对这个所缘去做情感的纠缠。我们首先会对他做情感的投射、情感的投放，我们对这个所缘有期待。为什么期待？我们以前说过，从根本来讲，就是我们要寻找生命的四食，我们要吃精神食粮和物质食粮。所以只要所缘出来，我们就要，“有吃的吗？”“能给我吃的吗？”就是这个态度。很土来讲，就是你碰到一个所缘，“能给我吃的吗？没有物质的也要给我点精神的。"],[3,2039,2095,1,"”大概就是这个意思。因为有这样的期待，你就会对这个所缘投入情感、投放情感。投放情感是为什么？是希望有回报。只要你投放情感，对方给你一个反馈，你就要给他做个判断。对于判断，我们只有两种机制：鼓励机制和保护机制。只要是鼓励机制，我们就会精准的判断，不断地往里面钻、往里面钻，钻到上瘾为止；如果你觉得不能够由你所求的话，你就会排斥他，然后你会模糊判断。对方其实对你没有任何的想法，某天一个眼神，你就会觉得这个人是否想对你有什么样的动作，一定心里面在骂你，各种各样虚妄的东西就会冒出来，就是这个意思。"],[3,2095,2194,0,"所以我们讲说，在日常生活中怎么来观察“我”和“我所”，而“没有我”？我们在观智下是看名色法的刹那生灭、无常、苦迫、非我、无我，那是真正在究竟法上看无我，在日常生活中看不到。虽然看不到，但是你要能够看到那个“我”，是怎么被你构建出来的；而构建出来的那个“我”和“我所”，是怎么来去妄执增义，然后给自己造成痛苦、给别人造成痛苦？那么一个很好的方法就是说，你看到对方，然后你们一互动，往回看去看自己，你一看到对方心里就会想起一个东西，我们讲说你的想蕴标记就会出来，对不对？那个想蕴标记一出来，基本上都是颠倒的，对于凡夫来讲都是颠倒的。这个颠倒再发展下去就是无明、爱、取。回头看自己，我一看到这个人就马上回头看我自己，我的无明、爱、取是什么？我的稻草人，我对这个人的判断是什么？你马上就能看到。然后你一有这个无明、爱、取，你就会马上警觉——我不要对他做情感投入，不要做那个非正常的情感投入，不要在这里面做情感的纠缠，心不要在上面盘踞不放。这个能理解吗？那么对方如果给你一个反馈，你看对方的无明、爱、取，对方的一个眼神、一句话，你是能够感受到对方内心的一种状态的。"],[3,2194,2270,1,"当对方的状态一起来，马上觉察：“哦！他也是非我的，他也是后面一堆的东西，不是‘想颠倒、心颠倒，就是见颠倒’，没什么好玩，不要再往里面做情感投射，他不会给你好吃的，要给你弄一点毒药。”有可能咯！当然我们在禅林里面是有法的，是有清凉的药的，自己要会观察。这个就是在日常生活中，我们怎么来看渴爱虚妄思怎样运作，怎样让这个渴爱虚妄思不生起啊？渴爱虚妄思具体都很容易表现为：一个是内在的，我们这个五蕴，我们这个色身，我们这个器官这样子，经常照镜子，诸如此类；对外缘呢，基本上最主要就是眷属和你的财产，他们是很容易生起这个“渴爱虚妄思”“骄慢虚妄思”就是妄增想像所谓的“我”"],[3,2269,2414,1,"“我是”。当它被所谓的内在属性和身外之物所支持或鼓动的时候，它变成盛气凌人的傲慢和狂妄自大。在此，内在的属性指眼、耳、手、脚，他的戒德、他的禅那、他的观智、他的知识、他的权利、身份这样等等，还包括你的形象、你的容貌、你的声音；对于身外之物就包括你的家庭、财产、环境，包括你的亲朋、眷属这个层面。只要这个层面有强的，你就会生起胜慢；差不多的，你就会有等慢；你觉得不如人家呢，你就会生起卑慢。帕奥西亚多在讲到慢的时候，特别强调那个慢，它直接在你的现起内心的表现就是你就像吹气球一样的，一下子就膨胀起来，即使是卑慢也是这样子。卑慢它的表现是什么呢？就是“我是不如你啊！你今天背诵《巴帝摩卡》一个小时多一点，那也没什么了不起啊！你也没什么了不起啊！我过两个月也会这样。”虽然他不如你，本来他不如你，他应该自卑，然而他觉得：“你有什么了不起！”虽然他很差，但是他也会吹起来。那么胜慢更是会这样，等慢也是这样，就是：“我们差不多嘛！差不多嘛我们，你没有什么了不起，我们差不多！”等慢有个特点，就是它会吹气，会自我吹气。"],[3,2414,2469,1,"自我吹气大家想起来会有什么表现？就是当你吸口气时会怎么样？你的身体会很紧绷、硬邦邦的。傲慢心重的人，他的身体是僵硬的、紧绷的，他不会柔软。我们说谦逊、柔软、柔和，那傲慢的人不会谦逊、柔和，他的身体会怎样？会紧绷起来。即使卑慢也是这样的——“我也有吃有喝！”帕奥西亚多以前说：“你没什么了不起，反正我也有吃有喝！”就是这个样子的。那“见虚妄思”是指将个体增益为“我的架构、我的理体、我的精髓、我的材质、我的灵魂、我的典型。"],[3,2469,2547,1,"”雷迪西亚多举例，比如说：陶土制的壶和陶土做的缽，顾名思义，陶土是它的材质。如是形状、如是制造的陶土，这个制造出来的被称为陶土壶或者陶土缽；包括像铁壶、铁钵，顾名思义，铁是它的材质，以这样的形状用铁制造出来，被称为铁壶和铁钵。陶土和铁是制造器具的材质，同理呢，臆想萨迦耶相应“地大”为“我”，同时如下的妄计生起“地大是活的生命；地大是‘我’”。如“地大”如是，应知“四大”悉皆如是。那么，这句话怎么理解呢？就是我们身体的地、水、火、风嘛！就是这样的色法，地、水、火、风四大种所组合的，它本来就是这样的，然后你妄计它为“我”"],[3,2547,2693,0,"，这个四大——“地、水、火、风”的组合为我，这样的增益就形成了一种非常固执的见解和执持。那么，这种错误作用会倾向于渐渐地不断地增长，乃至于超过一切的界限，而且永无停止的这种界限。所以，这三种虚妄思又被称为“三种增广”。那么，它的作用：第一个，它会导致错误的行为；第二个，这三种虚妄思它会不断地倍增，在你的生活中会不断地放大、不断地倍增。（三）两种殊胜居：渴爱殊胜居、见殊胜居这个我们理解：如果由于颠倒的原因，就会造成三种妄思的形成。这三种妄思就会导致两种殊胜居，翻译成殊胜居，abhinivesa，abhi 我们讲是殊胜，nivesa 是居住、住处。其实在巴利的系统里面，这个 abhi，这个殊胜只是讲一个特别，其实它有很多内涵，只是比较特别、特殊的概念。但是到了后期我们翻译的时候，大德们的中文翻译“殊胜”就变成“非常崇高、非常殊胜”这样一个角度。其实，作为殊胜，在巴利 abhi 的角度上来讲，它只讲“特别”的这样一个点。所以说，两种殊胜居：一种是渴爱殊胜居，taṇhābhinivesa；还一种是见殊胜居，diṭṭhibhinivesa。"],[3,2693,2772,0,"那这是什么意思呢？就是由于这三种虚妄思以后，你形成的这两种很坚固的信念：一种是由“渴爱”所生起来的坚固信念；一种是由“见”所生起来的坚固信念，就是你有住处了，你的心已经有住处了。从虚妄到最后，你已经有殊胜的住处了，有很特别的住处了。所以，“渴爱殊胜居”是指无始以来毫不动摇地坚信非我所知，躯、头、手、脚、眼、鼻等是我所知。“见殊胜居”是指无始以来毫不动摇地坚信，在一个人或动物之内有灵魂，或命我、或积聚我、或离蕴我等存在。这样的信念认为是灵魂、或命我、或离五蕴的我，是支配这个肉身的一种永恒至上的这样的我。这两种信念就被称为“殊胜居”"],[3,2772,2858,1,"，也有把它翻译成“依止”，nissaya。Taṇhānissaya 和 Diṭṭhinissaya 意思是一样。不管它是“依止”还是“殊胜居”，总是你的心就是完全盘踞在上面，非常坚固地盘踞在上面。（四）两种趣：凡夫趣、圣者趣那么，因为盘踞在上面，所以我们就会导致两种趣：一种是凡夫趣，一种是圣者趣。所以如果这两种地是指活动场所，是指我们所有众生的立足处、孕育和生长的地方，当知这个地有两种：一种是凡夫地，一种是圣者地。凡夫地是指凡夫的活动场所。所谓的凡夫是指普通的、世俗的；然以胜义谛而言，凡夫不过是“见颠倒”而已。此世间的一切凡夫众生，以“见颠倒”为他们的休息地、主要依止处、主要的立足地而活，在“我”或“我的”身体里有某种永恒的善的本质的事物，这个就是“见虚妄思”"],[3,2854,2929,1,"“见固执”“见增广”“见殊胜居”所形成的，所有凡夫俗子的著陆场、支撑物、依止处和立足地。因此，只要他们坚持立足于上述的这种错误的见地，就永远无法脱离凡夫的状态。圣者地，是指圣人的状态。这种高尚的圣人已经根除了颠倒，以究竟义言之，所谓圣者，不过是正见、正思惟、正智而已。那表现为在“我”或“我的”身体里，没有永恒的、善的、本质的事物，圣者以正见为主要的立足处而活。因此，正见可被称为圣者地。一旦获得正见，这个人可说是已经超越了凡夫地，并已立足了圣者地。在无始的轮回中，有无数行于凡夫地的凡人，如果其中有人为了根植正见于心，而想要根除“见颠倒”"],[3,2929,3034,1,"，那么，在他成功的那天，我们可以说，就在那一天，他已立足圣者地，已成为一位圣者。虽然，某些圣者可能残余有“心颠倒”和“想颠倒”，但是，他们不可能去造作会产生恶趣异熟果的恶业。因此，他们已经根除了最重要的“见颠倒”两种残余的颠倒——“心颠倒”和“想颠倒”的作用，只是让他们能够享受正当的世俗之乐。我们知道两种地，刚才雷迪西亚多讲到：只要你有正见，你就已经是在圣者的“地”。当然我们真正的圣者地是讲初果圣者。然而，当我们面对我们身边的所有人、事、物，当我们真的对这个人、事、物建立正见的时候，你对于这个人、事、物来讲，就像圣者一样。你在这个事件就是一个圣者一样，你的心就是神圣地来看待这样的一个问题。所以，真正的圣者地是要在初果圣者才能够达成。但是，如果我们在日常的生活中不能够这样去训练，不能够这样去认知，我们相信真正的圣者地不会从天上掉下来的。"],[3,3034,3125,0,"由于这两种“地”会导向两种“趣”“趣”就指去处，“趣”是指生命的变迁，雷迪西亚多说的生命的变迁。同样的，“趣”有两种：凡夫趣和圣者趣。凡夫趣是指被堕落的凡夫的往生。也就是说，凡夫无法投生到他所想要去的地方，而是堕在三十一界中任何一界，根据他往昔所造的业，来把他扔到那一界，就这样扔过去。他说：“就像一棵椰子或者一棵棕榈果从树上掉下来，我们事先无法确知它将滚落何处。凡夫死后的再生亦复如是，我们无法事先知道他将往生何处。每一个生命在出生的时候就不可避免地等待死亡，在死亡后，他必定因‘被堕落’而掉进世间。如是，死亡和‘被堕落’这两大灾难形影不离地紧紧的跟随著每一个生命，在这两种之中，死后生命的‘被堕落’比死亡本身更可怕。因为，四恶道乃至大无间地狱仿佛毫无障碍的虚空般，对离开人间的凡夫敞开著大门。"],[3,3125,3213,0,"一旦寿命耗尽，人就可能堕入任何的地狱，无论远近，没有时间的间隔。他也可能转世为畜生、饿鬼，或转世为阿修罗，在一瞬间、一刹那成为萨迦天帝的敌人。如果某一个欲界天神在六欲天中寿尽亦复如是。”“但是色界和无色界的众生的寿命耗尽之后，不会直接堕入到四恶趣，而将暂生为天人或人；之后，他还是有可能会堕入四恶趣。为何我们说众生皆害怕死亡？因为死亡之后紧跟著可能堕入四恶趣。如果死后不存在‘被堕落’，而众生可以选择再生的地方，那么，自主的死亡就不会如此可怕。所以有时候，也许有人活了相当长的岁数之后，渴望往生他趣，因而渴望死亡。"],[3,3213,3278,0,"”为了说明生在人趣是多么地难得，佛陀讲了《指甲经》和《盲龟经》，这个大家都听过了，我们就不再去重复了。那么，根据《盲龟经》和《指甲经》，就是那些生在恶趣的众生，离人间是如此的遥远。这个遥远的原因是因为它们从不往上看，而总是往下看。所谓“往下看”是什么意思呢？“它们的无明在轮回中一生又一生地增长、强化，就如河水总是往下流向较平、较低的平原，众生总是倾向于沉沦。因为它们通向善趣的路已经封闭，而通向恶趣的路却敞开著。"],[3,3278,3372,0,"”这是所谓“往下看”的意思。这里面我想跟大家讲，什么叫往下看，雷迪西亚多已经讲了，就是你的心，你的心是不是在往下看。我们今天回去就看一看，我们每一天，从早到晚，你的心是在往下看还是往上看。我们的心是很狡猾的。我们来禅林为的是解脱，为的是涅槃，然后我们要禅修，这些都是往上看。但是真正让你在面对人、事、物的时候，你发现，你噌噌噌起来的东西都是往下看，很多时候都是往下看。当你打坐的时候可能好一点，有状态的人好一点，没状态的人也是往下看，对著那个入出息的所缘不断往下看，批评、评判、判断，然后妄念纷飞、摇头晃脑。所以，这个要去检验，我们是一颗心往下看的心，还是向上看的心？这是习惯来著，也就是贪寻、瞋寻、害寻，这是心的不断的习惯，我们是可以去检查的。因此，从《盲龟经》的故事，有智慧的人当知：凡夫趣的不幸是多么的深重、可怕和危险。"],[3,3372,3478,0,"那么，所有有关凡夫趣，大家都知道这种特点。那么圣者趣呢？圣者趣就是死后从凡夫趣解脱，或指凡夫趣之灭。凡夫趣的每一个“地”注定和死相连，而圣者趣只往生更高的界地或如愿自在往生的潜能。那么，圣者趣呢，它不是像椰子从树上堕落，而是好比鸟儿飞向它们希望栖息的地方或者树上。那些已经到达圣者状态的人、天人和梵天寿尽之后，能够往生任何较好的地方，以及可以再生为人、天人、梵天。圣者在寿尽以后，可能有投生之愿，不过，即使是意外的死亡而无投生特定界地之愿，圣者也必定生在更高的界地，而不会生于更低的界地。此外，如果他们再生为人，则绝不会生在较低的阶级中，也不会是傻子或者外道，再生为天人和梵天亦复如是，他们完全从凡夫世的往生解脱。以上所说的是圣者趣。现在来比较一下这两种趣。当一个人从树上掉下来，他就像椰子般堕落，因为他没有可以在空中飞翔的翅膀。同样的，还是凡夫的人、天人和梵天，他们有“见颠倒”"],[3,3478,3538,0,"，而没有八正道的翅膀，不能以天上为他们的依止处，当他们的肉体毁坏的时候，他们就转世为新的生命体，他们跌入不幸的冤宿中，在此世间，当爬上高树的凡人所抓、所依止的树枝断裂的时候，他将堕落地面，他将摔得很痛，甚而被摔得粉身碎骨。因为，他即失去了可依止的树枝，也没有能够在空中飞翔的翅膀。有“见颠倒”的人、天、梵天亦复如是，当“我见”的依止处毁坏，他们就堕入各种凡夫趣。因为他们的依止处只是他们的身体，他们既不能以涅槃来作为他的依止处，又不能以八正道作为强大的羽翼来支持他们。"],[3,3538,3620,0,"虽然鸟儿所依止的树枝也可能折断，但它们绝不会摔下来，而会轻易地飞向空中，飞到另一棵树上。因为树枝并非它们永久的依止处，而只是暂时的依止处，它们完全依赖翅膀和空气。同样的，成为圣者的人、天人和梵天，已从“见颠倒”解脱，既不视他们的身体为自我，也不依赖他们的身体。圣者拥有永久的依止处，即是所有堕落、混乱完全止息的涅槃。圣者也拥有强有力的八正道之技，能带他们到更好的生处。这个是凡夫趣与圣者趣的不同。我们从四漏：欲漏、有漏、邪见漏、无明漏来看，从怎么形成，从这个三颠倒怎么来造就我们这样的生命？那么首先，我们现在走上了导向圣者地、圣者趣这样的一个路。"],[3,3620,3733,1,"（五）两种谛：世俗谛、胜义谛根据雷迪西亚多的教导，我们要长出八正道的翅膀。大家长出来了没有？想怎么长？想好了怎么长了吗？八正道的翅膀就是正见、正思惟、正语、正业、正命、正精进、正念、正定。而八正道的翅膀它是要落在我们的每一个当下的，它不是说你坐在那，坐著、坐著、坐著它突然间就长出来了。有一些人过去巴拉密特别强，他可能坐一下就长出来了，大部分人是长不出来的。长不出来的时候，我们依然在这里觉得说：“我在学佛呀！”但是呢，你真正地都不致力于去让自己八正道的翅膀长出来。什么叫做“致力于八正道翅膀长出来”？就是我们刚才讲的，面对所有的人、事、物，能不能很针对性地面对每一个人、每一件事，能不能让你的正见对上来？让你的思惟转成正思惟？让你对他的言行举止变成正语、正业、正命。而这个过程中始终记住：已生善法令增长，未生善法令生起；已生不善令断除，未生不善令不生的正精进，致力于这种精进。而这个过程中我们会发现，如果没有正念、正知，这些所有的都是没有可能的。所以，正念正知是从一个凡夫到阿拉汉的基本功，我们讲童子功。"],[3,3733,3813,1,"没有正念、正知，一切都是免谈。所有在我们禅修的学习的过程中，首先是安立，能不能训练你的正念、正知？训练正念、正知就像我们的老西亚雷，每天打扫地，正念地打扫；吃饭，正念地吃饭；走路，正念地走路；禅修的时候更不用说了。日常的生活中能不能落得下来？能落得下来，真正能落得下来，我们的妄念自然就会少。妄念是什么原因呢？妄念就是“渴爱虚妄思”，就是心在外面漂著的，回不来。回不来是什么意思？就是回不到当下。回不到当下最好的对治方法就是身念处、受念处、心念处、法念处。身、受、心、法四念处，但是最基本的从身念处开始。如果我们的心在平常的时候回不到当下，你打坐的时候一定是妄念纷飞的，不用讲的。所以对治妄念，就是在日常生活当中训练正念、正知，这是必须的。"],[3,3813,3960,1,"那么，有正念才会有圣正定，以正见为先导的有七觉支支助的这样的圣正定才会被培养起来，而这样的圣正定到最后才会如实知见。那么在胜义谛的角度看到一切是一种究竟法，无常、苦、无我而生起道智，最后斩断一切烦恼，证入涅槃。在这里，祝福大家早日能够断除烦恼，证入涅槃。Sādhu!Sādhu!Sādhu!"],[4,0,223,1,"三十七道品-苦之集 5 讲六种盖、七随眠礼敬善吉祥长老，尊敬的法悦尊者，各位尊者、各位尼师、各位贤友，大家晚上吉祥!、复习不善的类别（一）三种颠倒的断除我们上一堂课学习了从“想颠倒”到“趣颠倒”，特别讲到了我们经常会有的三种虚妄思，然后两种殊胜居，两种趣：凡夫趣和圣者趣，根源都是颠倒。三颠倒呢，我们前面的课程讲过了，就是“想颠倒、心颠倒和见颠倒”。这三种颠倒，其实都是把本来不是常、乐、我、净的因缘和合的有为法视为常、乐、我、净，只是程度的不同。那么这三种颠倒怎样才能断除呢？依据《阿毗达摩》的观点，初道（初果道智）可以断除对事物常、乐、我、净的见颠倒、对事物的“常”和“我”的想颠倒和心颠倒。二果的道智可以减弱剩下的其它颠倒的力量。三果道智可以断除 “净”的想颠倒和心颠倒。对于“乐”的想颠倒和心颠倒要到四果道智，要到阿拉汉道智的时候才能够完全断除。（二）不善的类别上一堂课讲到众生不是以涅槃为依止，而是以五蕴合和之身，这个刹那生灭的非“常”的、无“我”的这样的五蕴为依止，这是最大的颠倒。由于这样的颠倒无明，而有渴爱。"],[4,223,321,1,"这几堂课下来一直讲的不善的类别：四漏、四暴流、四种轭、四种系、四种取、六种盖、七种随眠、十种结、十种烦恼。这些都是我们在修行过程中需要逐一把它断除的。这些我们很熟悉，但感觉又离得很远的名相，必须在日常生活中能够发现它，能够对它正对治，从而削弱它，乃至最后我们生起道智，斩除它。那认知它就显得很重要，如果我们不能够认知它，那谈何去削弱它和断除它呢？对吧！所以我们今天就用很快的时间，把这个“摄不善”的概要再复习一下。"],[4,300,406,1,"1、四漏——欲漏、有漏、邪见漏、无明漏。漏āsava，ā是向的意思， sava 是流动、流向的意思。这个āsava 漏呢，就暗喻著它是往外流的意思，心中的污秽流到外面来这样的一个意思。“漏”，在印度传统上是佛教跟耆那教都共有的。在四漏当中，欲漏和有漏都是属于贪心所。欲漏是对五蕴的流漏；有漏是从色、无色这个业产生的两种“有”的流漏。也有一些解释为有漏就是对生命的渴爱的一种漏，也就是我们刚才讲的，众生以五蕴为依止的也可以列为是流漏。见漏就是邪见的漏；无明漏就是无明的漏。"],[4,406,524,0,"2、四暴流跟四漏其实是一样的，只是佛陀为了更进一步地强调这种四漏就像暴流一样，它能够把诸有情冲到生存的海洋，也因为它们非常难以渡越，所以被称为四暴流，它其实也是四种漏的一种作用。3、四轭，就是欲轭、有轭、邪见轭、无明轭，内容跟四漏是一样的。被称为轭是因为它把诸有情套在痛苦里面，不让它们逃脱。4、四系四系有一点点差别，就是贪身系、瞋身系、戒禁取身系、此实执取身系。系有系属、绑住之意，四种系中，戒禁取身系是执着仪式能导致解脱，(如牛 戒、狗戒)，此实执持身系是执取「只有这个才是真实的」信仰，而别的见解都是错的。其实就是我们刚才讲的，众生以这个五蕴之身为依止。以这个五蕴之身为依止就要让它存活，就要寻找四食 —— 四种食物。那么对于四种食物，对生存有帮助的你就会贪，对生存没帮助的你就会瞋。围绕著这样的四食遍寻求的过程，而有各种各样的方式、方法，形成各种系缚。"],[4,524,633,1,"5、四种取是：欲取、邪见取、戒禁取、我论取，除了欲取是贪，其他都属于邪见的层面。认为“色蕴是我”，或“我拥有色蕴”，或“色蕴在我里面”或“我在色蕴里面”，这是属于我论取的范畴。长老们在讲邪见这个部分已经有很详细的说明了。6、六种盖。就是五盖再加上无明盖。盖就是会阻碍通向天界、涅槃之道而得名，它会阻止我们未生的善法不生起，使已生的善法不能持久，这样的心所称为盖。7、七个随眠。欲贪随眠、有贪随眠、瞋恨随眠、我慢随眠、邪见随眠、疑随眠、无明随眠。随眠 anusaya，就是潜伏的意思，在他们所属的名法之流里的烦恼，每当诸缘具足的时候就会浮现出来，成为困扰我们的困扰性的烦恼，这是“七随眠”"],[4,602,688,1,"。8、经教法的十种结：欲贪结、色贪结、无色贪结、瞋恚结、我慢结、邪见结、戒禁取结、疑结、掉举结、无明结。结(saṁyojana)有绑住、系缚生死之意，比喻这样的不善心所将诸有情被绑在生死轮回上。9、论教法的十种结是：欲贪结、色贪结、瞋恚结、我慢结、邪见结、戒禁取结、疑结、嫉结、悭吝结、无明结。10、十烦恼或十污染：贪烦恼、瞋烦恼、痴烦恼、慢烦恼、邪见烦恼、疑烦恼、昏沉烦恼、掉举烦恼、无惭、无愧。被称为烦恼是因为它们折磨我们的心，或因为它们把有情拖下内心污秽与堕落之境而污染了心，被称为烦恼。污染( kilesa, )：众生为自我的欲望，常招受恼害，致使身心发生烦、恼、乱、迷、惑、污染等问题。般以贪、瞋、痴三惑为一切烦恼之根源，有时称作漏、暴流、轭、系、取、盖、随眠、 结、缠（pariyuṭṭhāna 现行烦恼）、缚（bandhana）、执着(anugiddha)、垢(mala 尘垢)、颠倒(vipariyāsa)、戏论(papañca)、心秽(cittassa upakkileso)、客尘(āgantuka)等名称。"],[4,688,879,1,"这些烦恼其实对应起来，就是十四个不善心所之一。很多人问《阿毗达摩》要不要学？《阿毗达摩》如果不学，我们就不知道什么是烦恼、烦恼是怎样的分类、如何去认识它。如果都不认识它，谈何断除呢？二、人类被两股力量彻底地束缚（一）名色相续流和物种相续流我们前面讲过了，人类被两股力量彻底地束缚：一股力量是从名色相续流里面传递下来的，包括业力、各种缘力和习性；一种是从物种相续流传下来的，我们讲人类的基因或者特征。这两股力量把人类彻底地捆住了。它是怎么个捆法呢？从四漏一直到十种烦恼，那它要么潜伏在名色流里面，以潜伏的形式存在。对境的时候，它们有的多会转起为困扰性的烦恼，有些古大德把它翻译成“缠”，纠缠的缠。再一类，往下就会扩展为违害性的烦恼，呈现为贪和瞋的行为，成为我们十不善业里面身三、语四的不善业、不善的行为。那这两股力量，它是怎样的表现，怎么在我们身体上起作用呢？再来看物种相续流。很多人说我们人类是高级的社会动物，这是自我夸奖。其实就是一个动物嘛，哪有什么高级、低级之分？就是动物。人就是一种动物，那么动物性的基本特点，从佛教的角度来讲，就是以五蕴为依止，就是皈依这个身体的，以这个为皈依处，不是以三宝为皈依处，以五蕴为皈依处的。"],[4,879,1017,0,"然后是以生存和物种繁衍的这种内在需求为主要驱动的行为。（二）科学家对人类的自我评价我们所有的行为特征其实是围绕著生存和物种繁衍展开的，至于你会说：“没有啊，我也想岁月静好啊！”那是编出来的，也是四食的一部分。只是你喜欢这种眼触，喜欢这样的身触，仅此而已。人类学来讲，对这个“人”做了一些定义，说人能够制造精致的工具，并且能够熟练地使用工具进行劳动，有丰富的思惟能力，有判断跟实际情况有没有冲突的能力，有初步维护地球生态圈的能力，有创造能力和控制修复能力。人与人之间应该和睦相处。信任和沟通是人与人之间最基本的生存方式。与其他动物相比，人类具有高度发达的大脑，复杂的抽象思惟、语言、自我意识以及解决问题的能力。人类直立的身体构造，使得人类的前肢可以自由活动，这让富有智慧的人类得以掌握远超出其他任何物种的工具使用能力，并最终发展出强大的劳动能力和创造性。这是科学家对我们人类的自我评价。科学家如果看过天人，看过欲界天的天人、看过色界天的天人的时候，就不会这么简单地评价、自我标榜了。其实这么一长段的话，是对人类充满仗义的描述。"],[4,1017,1109,0,"回到动物性的角度来讲，还是为了生存和物种的繁衍。生存就是吃、住、行，每天要吃饭，每天要睡觉，冷了要穿衣，热了要穿薄的，就是这样的一些事。只是每一件事你都会用各种各样的方式，乃至于做到戒禁取为止——饮食要多么地精致，吃素吃到连锅都不能跟家人共用。你说他能够有很强的思惟，很复杂的抽象思惟。抽象思惟都干嘛了？都干这些。把各种吃的东西研究到多么精致，普洱茶要做成什么样的，要怎么样来发酵，其实就是喝茶嘛！对于物种的繁衍，本来就是赤裸裸的交配行为，却标榜为爱情 —— 高尚的爱情!生命都可以抛弃，爱情价更高。对于一个佛教徒呢，不看清楚这个问题，就会掉在这个圈里面。"],[4,1109,1186,1,"简而言之，人类所有的生命活动就两个目的：活著和物种繁衍。只要想活著，你就以这个生命为依止，而这个生命从真相上来讲是刹那生灭的、是无常的、是 dukkha 的、是无我的。那你以它这个不真、不能恒常的东西、苦的东西、无我的东西为依止，这个生命不会是快乐的，一定永远充满著苦难，我们讲“认贼作父”。我们为了维持这样的一个很不堪的生命，dukkha 的生命，不圆满的、下劣的、受逼迫的、坏灭的这样一种生命存在，漠视它的无常性、苦性、无我性，对它各种粉饰。"],[4,1186,1272,0,"我们在前面课讲到的，五欲快乐边际效用递减的效应，我们会忽略它。所有快乐都不会持久，但我们不会记住这个事实，而是每时每刻都思考如何追求这个快乐。无始以来，有情都是这样的一个生存方式，自己骗自己。生命的轮回是最大的内卷。那是什么东西让我们被捆在这里面呢？就是刚才我们学下来四漏、四暴流、四轭、四系缚了，那是怎么样来系缚我们？让我们被捆绑住，无法渡越呢？这就是在另外一股力量了。（三）六种心理余势无始以来名色相续流里面的那一股力量，归结下来就是六种心理余势。"],[4,1272,1378,0,"第一个是我们很熟悉的 kamma，就是业，由我们每一次身、语、意所造作的，思心所所造作留下来业的力量；第二个就是我们刚才讲的七种随眠 anusaya，不善心所和贪、瞋等所遗留下来的心理余势，这些不善心所驱动我们过去生中所作的杀、盗、淫、妄的这种不善行；第三种是巴拉密 pāramī，导向解脱的善心所遗留下来的心理余势。这些善心所关系著我们过去生中所做的布施、持戒、禅修等种种善行，有十种巴拉密；第四种是我们的喜好，也翻译成叫意向，就是你的喜好和厌恶，由过去生所经验过的喜好和厌恶，这一生还会重复 ajjhāsaya ；第五种是习气 vāsanā ，就是各种倾向，就是我们的习惯，比如走路是快还是慢，这些习惯；第六种是行 carita，就是我们的心性或者我们的性行。在《清净道论》里面讲的贪性行者、瞋性行者、痴性行者、有信行者、觉行者和寻行者，这六种性行就是属于行的范畴。"],[4,1378,1534,1,"这六种心理余势透由什么东西传流下来呢？我们刚才诵二十四缘，其中无间缘是现在这个心识刹那灭去的同时，下一个心识刹那无间的生起。而等无间缘指下一个心依著心的法则、依著心的顺位无间地生起。经常有人会问说：“你们佛教徒说有业啊，那业放在哪里啊？业藏在哪里啊？”不需要藏，它就在你当下这个刹那的五蕴身里，无始以来的所有信息都在这一团名色里。为什么？从无间缘、等无间缘一直等流下来，都在这儿，每一个刹那、每一个刹那往下流。大家以后修十四御心法，修出神通来，就可以明白，你看起来好像要去追溯过去，其实都在你这儿，你直接就能看到。三、 影响名色相续流的两股力量我们这一生的行为习惯受哪些影响呢？第一部分影响就是这六种心里余势，通过无间缘、等无间缘不间断地传递到当下的五蕴身上。第二部分影响比较大的就是上一生临死前成熟的那组业，令今生结生的过去五因。从十二缘起来讲，就是上一生临死前成熟的那个业，以及造这个业的动机——无明、爱、取。"],[4,1534,1662,1,"“无明、爱、取、行、业”——过去五因，导致今生“识、名色、六入、触、受”——现在五果。上一生临死前成熟的那个业，是一个行为，不管是身行、语行、还是意行，是一个业行留下业的力量。我们从《阿毗达摩》知道，如果这个业就是你上一生造的业，那原则上，应该是第七个速行心来感的果报；如果是过去生呢，那么应该是从第二到第六速行心。那这个速行心是一个名聚。对于人来讲，我们是善趣结生。善趣结生的话，至少都是二因。我们在座的不可能有无因的。无因就是盲聋瘖哑，缺胳膊少腿。那今天能够坐在这儿，能够来学习，三因都是有份的，二因不容易来，实在话是这么讲。对一个三因结生的人，最少三十三个名法。三十三个名法中，通一切心的心所，要么有喜十三个，要么无喜十二个；十九个遍一切美心所，可能有慧，可能无慧，对三因结生来讲都是有慧；当然，也有可能由于你当时在修悲心，有有悲，也可能有随喜这样的心所存在。"],[4,1662,1771,0,"那么我们要知道，上一生临死前的那个业行、那个心里面的所有心所的素质，对于我们这一生的结生心这个心所的素质，是有很大关系的。如果你上一生成熟的那个业，就是到僧团去布施、做供养，很欢喜地做供养。显然，你的无贪心所会比较强。然后你欢喜地供养，你的喜心所一定在，所以你这一生一定就悦俱，你的无贪就比较强。你一看到寺院就会想去布施，自然亲依止缘的缘力就会起作用。想去供养，那你的结生心里面，这个善欲，你这个欲心所它有这样的潜力；你的胜解心所面对寺院的这种布施，会很容易做决断，以后再碰到寺院，你会毫不犹豫。你的信容易生起对三宝的信心；会容易有正念，在布施时容易有正念；会有惭、有愧、无贪、无瞋、中捨性、轻安、轻快、柔软、适业、正直、练达这些心所，这一生结生心心所的素质，跟上一生临死前成熟的那个业，当时造业的那个速行心的心所素质是关联的。"],[4,1771,1847,0,"这一生的结生心跟我们这一生的有分心是同一种心，心所的素质是一样的。一生当中，生起最频繁的、数量最多的是有分心，而有分心的素质跟我们上一生临死前的那个业行的心的素质是相关联的；也就是说，上一生我们做一件什么样的事，在做那件事情的时候安的什么心，以什么样的心理状态去做，那时候心的素质是怎么样，都直接影响你这一生的有分心。有分心是最平常出现在我们的心流里面的。有分心的素质对要转起的心路，这个自然亲依止缘的缘力会援助相关的心所的素质生起来。这个也是对我们这一生影响很重要的一个部分，一个是过去传流下来的，一个是上一生临死前成熟的业。"],[4,1847,1961,0,"所以我们讲什么叫先天呢？就是先天的六种心理余势，加上上一生临死前成熟那个业的业行素质，都是先天的。那到我们这一生来，会遇到什么样的父母也是有一定的概率。就是你有什么样的心理余势，上一生临死前成熟的那个业的无明、爱、取，会对你这一生出生在什么样的家庭，是有关系的。那这一生，到了这一生家庭出生以后，父母亲是我们最早的老师，这个家庭的环境，父母亲可以给我们提供的所有软件的氛围、硬件的氛围，就像一个模子一样。如果说过去的六种余势和临死前成熟的那个业行是今生名法流的基因的话，那你出生在怎样的家庭，你的父母、你的环境就是现在的模因，就像是入一个模一样。父母亲的教育对于你的成长还是很重要的，但是你过去的基因跟你父母亲提供什么样的模因也是有关联的，是很复杂的交互的这样一种方式。跟大家讲梳理、八步梳理法，是从一些事件上来看，从那些事件来看到我们烦恼运行的状态和规律。"],[4,1961,2116,0,"其实我们也可以用另外一种方式来看，就是你去检查你自己的六种心理余势，也可以粗粗地去检查你的有分心到底会有什么样的素质，挨个挨个来看看。在你禅修比较平静的时候你去观察，观察你自己的心。哪一些心所的素质是一个什么样的情况？多多少少能观察出一点来。那这样的心理余势加上你这样的心理素质，会在什么地方结生，你碰到哪些事，会有什么样的心理反应。比如说小的时候，有的人被爸爸、妈妈天天痛打，都没什么感觉，很欢喜“你打吧！”但有些人就一次，我爸就说过我一句话，我就记了二十多年，那就是我的心理余势。那很多人他就不会啊，比如说，当时我们家邻居，有个男孩，比我大几岁，他爸妈天天揍他，但是他怎么挨揍都对他爸爸妈妈特别亲。所以说，“我怎么遭遇这样，我的原生家庭如何啊！”你怪谁啊！都是你自己的业和携带著六个余势的问题。你会落在这个家庭，哭就挨揍，你是什么反应，那是你的事。你的反应就是你的六种余势留下来的一种习惯性的反应模式，不要怪别人，找自己。所以八步梳理法一步解决 —— 都是我的错，原谅一切人，然后都导向善法，啥事都没有，对吧！"],[4,2116,2299,1,"（二）六种心里余势、业有两种业：一种是异刹那的业，一种是俱生的业。异刹那业大家都知道，就是过去的思潜存著直到因缘具足时产生果报。善业和不善业依业缘之力成为果报五蕴的缘，这是一种业，异刹那的。最快的异刹那就是道果，道心生起灭去后，果心无间生起，是最快的异刹那果报。其他的异刹那时间都比较长。而俱生业是很多人忽视的一个问题，同一心识刹那的思依业缘之力成为其相应心所以及心生色的缘。造业未来产生会果报。当下也有果报。比如你生起一个善心，善心生起的时候，在思心所引导下的善心，就有轻安、轻快、柔软、适业、正直、练达六对，当下就很舒服、很轻安，内心很通透、很丰满，觉得很充盈，内心很踏实，没有恐惧，没有纠结。你生起一个瞋心，瞋心的特相是粗野；作用是烧毁身心；现起就像狂暴的眼镜蛇，心所依处被烧、毁坏。瞋心生起的当下，你的心脏就很难受，满脸通红。是不是受到伤害？是不是果报？俱生业的果报，当下就报了。贪呢，即使是很好吃的东西或者很好玩的东西，你在享受它的同时，第一，它只是集中在根门上。大家体会一下，比如好吃的集中在味蕾上，好听的集中在耳根上，然后慢慢会荡漾到身体上，但是它还是会集中在那些根门上。"],[4,2299,2467,1,"当你在贪的时候，会担心失去，心里面会有惴惴不安、淡淡的不安在里面，吃好东西赶快吃。贪就是黏著，失去目标会让你下来像心肉被扯掉一块这样的感受。你的心被染污、被破坏，然后产生黏糊糊的心生色法。瞋心会产生沉重、僵硬、不适业的心生色法，堵在心血管上，导致心脏病。心血管科的医生讲，心血管疾病的病人百分之一百脾气不好。心血管病很多是自己气出来的、瞋心俱生业瞋出来的。弥兰王问纳先尊者：“尊者啊，业在何处呢？”纳先尊者说：“大王，心并不是储藏在心里的某处，心是短暂的，也不是在身体或其他的部位。但业依心法和色法而住，在适当的时刻呈现，这就如同我们不会说芒果藏在芒果树的什么地方一样，但依于芒果树季节到时，它们就会冒出来。"],[4,2418,2562,1,"”二、七种不善的潜存力第二种心理余势，就是七种不善潜存的余势叫随眠：贪著的随眠、有随眠、瞋随眠、慢随眠、邪见随眠、疑随眠和无明随眠。这个欲贪的潜存力，当我们享受感官的快乐的时候，我们的享受和后续的动作刹那、刹那地生起灭去，但它们将其性质或潜存的力量传递给后继者，这就是欲贪的潜存力。会导致贪的目标都是你觉得会带来快乐的，也就是会对你的生存和物种繁衍有利的；因为快乐，你就会想继续拥有下去，贪著它。每次的经验，想心所都会作标记。是欲贪的想，还是无贪的想？是一种记忆的形式存在，它也通过无间缘、等无间缘的形式传流下来。世俗来讲就是记忆啊！“美好的记忆啊”"],[4,2562,2647,1,"，“美好的童年啊”，“美好的初恋啊”，都是想蕴标记。当时受生存和物种繁衍这两种动力驱使下的一种错误的认知，把它标记为美好，然后每天去追求，在快乐的跑步机上不断地奔跑。对生命的执著呢，即有爱、有随眠，就是五蕴生命为依止，以五蕴为皈依处，这样的随眠会让我们对这个身心、对这个五蕴之身产生执取、执著、珍爱，每天给它做各种各样的劳动服务，终其一生服务。然后我们会给它编造很多美好的字眼，“形象端庄，言行得体”"],[4,2647,2836,1,"，在里面做各种建构和情感的投射，建构一个“我”的形象出来，在里面纠缠，其实就是对五蕴的执著。瞋恨和傲慢也会以余势的方式潜伏在心流里。比如有些人比较容易生气，有些人天生就比较自负，即使没有什么知识，他也会卑慢，这跟过去有关，过去生存留下来的东西。邪见、无明也是这样。当时佛陀证悟以后，省思完《阿毗达摩》，他发现佛法太深奥了，就准备入灭了。为什么？因为众生的无明太厚了，没法度。每个人在这七种随眠上差别都很大，都是累世存留下来的。我在缅甸的时候，曾经跟一些修缘起的禅修者交流，基本上无一例外地告诉我，很多世以前就有现在的一些习气，很多生以前就是这个样子，有的过去二十生以前都是这个样子。其实看自己就知道，现在大家都在修行，有多少人愿意对著自己的烦恼下手？真干，刀锋向内，刮骨疗毒，有几个？今天光明智贤友找我怎么样解决这个问题。我们讨论的结果，就是说看、听、嗅、尝、触的每一个当下，能不能够先停下来？不要随著这六种心理余势直接就去了，能不能先把这个练习了？不要想著我哪一天生起道智。如果这一步都停不下来，还能生起道智？"],[4,2836,2987,0,"这是美梦啊！正念、正知，每一个当下正念、正知能不能练起来？碰到问题的时候，能不能够不要跟著习惯就冲出去，而是能够停下？你第一步能够停下来，再说你用什么样的方法对治。光明智贤友问：“多长时间？”“二十八天。”干它二十八天看看，记一记，看、听、嗅、尝、触，你正念了多少回？那就是真干。三、十种巴拉密的潜存力我们无始以来留下来的也有好的，不会都是不好的，都是不好的我们就来不了这里，对吧！我们有很多良善的素质，最典型的就是十种巴拉密。那十种巴拉密明昆西亚多在《大佛史》里面就有讲，《大佛史》这本书，我们的敬法尊者翻译成《南传菩萨道》。《南传菩萨道》讲的十种巴拉密就非常系统、非常清晰地表述了什么是十种巴拉密。什么是巴拉密的素质？巴拉密是没有被渴爱所染污的、能够导向涅槃的、导向成佛的高尚的心理素质。它是一种缘力，也是一种业力。那具体表现为布施、持戒、出离、智慧、精进、忍辱、真实、决意力、慈为、捨十种。对照一下自己，这十种巴拉密，我们哪一种比较强有力？哪一种比较薄弱？哪一种巴拉密它还不能真的称为巴拉密，虽然有那股力量，但总是要被渴爱染污，你是可以观察到。"],[4,2987,3065,1,"举个例子讲，你布施的时候，你总是“有行”，要别人怂恿你才会去。而有些人呢，比如说，经常在眉缪的时候，有些人就特别懂布施，他能随时观察到，“哎哟，禅林现在需要这个，尊者们需要这个”，他就能找到很多布施的机会，很欢喜地去布施，很主动地去布施，这样的人。然后他发起布施了，有些人说：“啊，我随喜一下啦”，或是说：“你们去做吧，我随喜”。随喜当然有随喜的功德，但是他就没有布施。对于随喜，以前有个错误的理解，就是随喜就拥有他的功德。怎么可能！人家布施，你没有布施，你怎么会拥有布施的功德？你有随喜的功德，你没有布施的功德，要搞明白。人家布施，你随喜，你有随喜的功德，布施的功德是别人的，跟你没关系。"],[4,3065,3155,0,"那持戒呢，同样持戒，有些人持戒就很清净，而且很欢喜、清净地持戒。帕奥总部有一个大西亚多，他持“不倒单”，常坐不卧，在他的孤邸，床上没有东西的，周边也没有任何杂物，就一个钵。我们认识他时，他已经快 70 岁了，你看他很欢喜、充满笑容，他不会纠结，也不会去跟人家炫耀“我常坐不卧几十年了”。人家请求说：“哎，西亚多，能不能教我？”他一听就很欢喜：“你要学，我教你！但是要慢慢来。”悟贡西亚多，长时间持三衣，走到哪里都很自在的这种持戒。但我们持戒常想怎么钻空子啊，“这个算不算？这个不算吗？不算我就可以自在一点。"],[4,3155,3284,0,"”所以每个人持戒的巴拉密就不同咯，对不对？我们对戒的态度会是怎样，这些都会直接影响到我们的心行，心的素质和烦恼，直接影响到我们未来解脱和道智的出起，都是关联的。四、好恶、习气与心性后面有三种：一个就是我们讲的喜好、好恶；还有一个习性；还有一个心行；这些都是我们过去生留下来，你看很多人，包括兄弟姐妹，他们都会有很多不同，这个原因是由于过去生。有些男人有女性化的性格，长得像女人、声音像女人、举止像女人、感觉又是像女人，这些人他过去生很有可能是女人或者倾向女人，这一生令生业中对男人无明、爱、取不够强，虽然是男人还是时常现女人习惯。过去女性化的性格，包括他们的好恶、习性和心性，都依著无间缘和等无间缘的力量，从前心传递到后心，从过去生到现在世。女人而具有男人性格的性情也是这样。这些独特的功能是由心籍着无间缘之力来执行的，而不是我们的大脑。在死亡那一刻，大脑将会彻底停止作用。根据这些事实，我们显然可能用一种比较健全的方式来管理心和心所的行为，重新塑造并改建我们的生命。正因为如此，佛陀这样说：“比库们，我不见有任何生物比有情更神奇，他们因为有心而神奇，是故心比那些有情更神奇。"],[4,3284,3392,1,"你们应当恒常思量，长久以来，此心为 lobha（贪、渴爱、执著等心）、dosa（愤怒、憎恶、嫉妒），还有 moha（无知、痴、迷惘等）所染污，心染污则众生染污，心清净则众生清净。我们今天讲到了这六种余势，还有我们上一生临死前成熟的那个业、过去五因对我们这一生的名色相续流传留下来的影响，这是一股非常强有力的力量。那我们作为人类，人类这个物种本身他的这种行为、他的这种基因，也是对我们产生非常大的影响。你到青春期的时候，大家都知道，都经过青春期，青春期的时候有很多的问题，物种繁衍的问题就会非常困扰著你们，你不能突破它，不能看透它，它就是想让你做物种繁衍的那点事，哪有什么爱情！但是它是如此地有力量，如果不认识它，你就在里面编造，编造各种常、乐、我、净。"],[4,3377,3457,0,"佛陀用四漏、四暴流、四轭、四系、六盖、七随眠、十种结、十烦恼，来说明人都被捆死在里面。我们现在就是这样被捆死住，那怎么办？善法生起，不善法自然就不在了，很简单。每一个看、听、嗅、尝、触的当下，不要跟它走，要转向善。一个心识刹那只有一个心生起，当你善心生起来的时候，不善心就不在。如果你不被捆住的时候，修行就很简单。你只要每一刻让善心生起，只要你有正念的时候就有善心，只要你的心回到你的身、心的时候（四念处）就是善心。不需要说我天天都要供养，我天天一定要如何才有善心。正念就是善心，觉知呼吸就是善心。长老们都讲：“专注呼吸。"],[4,3457,3544,1,"”只要是善心就是导向善，就能够突破所有的束缚。佛陀讲：“如何渡过暴流？我不停留，我不挣扎，渡过暴流！”祝愿大家早日渡越暴流！萨度！萨度！萨度！"],[5,0,535,1,"三十七道品-苦之集 6 讲观察三股势力各位尊者，各位尼师，晚上好！我们上一堂课学习了， 生命受到两股力量的彻底束缚。哪两股力量呢？一个是物种相续流——人的动物性，一个是名色相续流——无始以来所流下来的心理余势。这个心理余势又两个部分： 一个是无始来的六种心理余势；一个是上一生临死前成熟的业， 也是这一生结生名色的过去五因——无明、爱、取、行、业。一、在日常生活中观察三股势力认得烦恼力。今天我们来学习一下， 如何在我们日常的生活中去观察这三股势一股就是六种余势；再是令生业；第三是人的动物性。"],[5,535,642,0,"〈摄集〉 的部分开始就是十四种不善， 那这些不善是怎样在我们的生命中起作用？也就是这些烦恼在日常生活中它是怎么表现的？生命的目标是为了断除烦恼， 那断除烦恼首先要认得烦恼。不认得烦恼， 那谈何断除烦恼？那我们能认得烦恼， 要看到这个烦恼从哪里生起来？它是什么样的原因生起来？它来自什么地方？虽然我们没有观智， 没有佛陀一样的意乐随眠智、 根上下智， 但是你是可以多多少少观察的， 当我们有这样观察的时候， 对我们身心状态就会有比较多的了解， 那对我们的身心状态有了解， 对修行状态中出现的各种各样问题， 心里面就会有数， 知道应该怎么样去面对。而不会什么事都要在禅修报告的时候找长老： “长老，肚子痛怎么办？”“长老，我腰痛怎么办？”"],[5,642,699,1,"“长老， 我妄念太多怎么办？”， （长老问： ） ”什么妄念啊？”（回答： ） “啊，糊里糊涂的妄念”。妄念是有很多类型的，当你能够认识到烦恼的时候， 你就能够看到妄念它是怎么运作的， 当你这样去报告的时候， 长老才能够很有针对性地给你回答说： “你这样的妄念应该怎么样对治。”因此需要在日常生活中就要能够善观察， 而不是稀里糊涂地天天喊着： “我要禅修， 我要禅修”。这样即使真的修上去了， 烦恼现前时，你拿着刀都不知道怎么砍。"],[5,699,798,1,"六种余势，有一些贤友提出来说： “意向性、习气和行不是非常容易把握”。事实上， 确实是有这样的一个问题， 就是意向性跟习气跟行是混在一起的，那么意向性，我们讲 ajjhāsaya，ajjhāsaya 它这个意向，在词典里面讲说包括各种好恶、 喜乐的习惯， 这个是跟过去生的经验有相关的， 比如我们天生就喜欢或者不喜欢某一些人事物， 那么这些喜恶往往都是很多生养成的。在 《本生义注》 里面， 有过这样的故事，很多人都听过。就是有一位金匠，他出家以后跟着沙利子尊者修行，沙利子尊者就教他修不净观， 他修了四个月，一点感觉都没有。沙利子尊者就觉得说:"],[5,798,880,0,"“可能只有佛陀才可以度化他”， 所以就把他带去见佛陀。佛陀有弟子不共的有情意乐随眠智， 这个意乐就是意向、 方向的意思， 佛陀能够了知一切众生的意乐随眠， 知道这位比库过去连续五百世都是金匠， 做金子的， 长久以来， 用殊妙的纯金做了很多很漂亮的金的装饰或者饰品， 不净业处不符合他的意向， 没有感觉， 就是不符合他的意乐和偏好。因此佛陀就变现出一座莲花池， 里面莲花簇簇，其中有一朵硕大的莲花异常地美丽， 然后他就让这位金匠比库坐在池畔，告诉他说： “你凝神注视这朵莲花”"],[5,880,1005,0,"，当这位比库注视莲花的时候，佛陀就以神通力令其渐次凋零， 直至只剩下空空的花萼， 看着眼前这一幕，比库自忖到： “刚刚仍然美丽迷人的莲花，如今已经香消玉殒，衰败就这样降临到它的头上， 衰败也将如此降临在我头上，一切有为法真是无常啊！”无常想就起来，他当下就生起了透视无常、苦、无我三相的观智。佛陀了知比库的进展， 于是以神通现身于前， 告诉他说：“拔除自爱恋，如手摘秋莲，培育寂静道，善至说涅槃。”听闻这个偈颂以后， 这个比库当场就证阿拉汉果， 这么容易！这位比库对美丽事物的偏好就属于意乐，就是 ajjhāsaya。当沙利子尊者教导他不净业处的时候， 由于他长久以来面对的都是美妙的纯金饰品， 不净不能引发他的兴趣， 所以禅修毫无进步， 佛陀了知什么样的业处才能吸引他并开启他的智慧，就以莲花的方式来引导他，这就属于意向。那么习性 vāsanā呢，是跟过去生的习惯相关、倾向性相关，那我们现在大家都很了解的一个例子： 像同性恋， 为什么一个人身为男人， 不喜欢女人但喜欢男人， 这个习性跟他过去生有关。"],[5,997,1108,1,"这个是不善果报。佛陀时代，有一位尊者，他叫 PilindaVaccha，PilindaVaccha 尊者是一个拥有大神通的阿拉汉， 即使他在成为阿拉汉之后呢， 他仍旧把所有人都成为“贱民 Vasala”， 他看到谁都喊： “你这个贱民， 你这个Vasala”，他跟某一位比库交流的时候也是:“啊，Vasala，你今天过的怎么样啊？”比库们就到佛陀那边去投诉他， 佛陀就说大家要谅解他，因为 PilindaVaccha 尊者曾经五百世都是高贵的婆罗门，他过去就是这样称呼所有人，这是他的习性,这一生还是这样，即使证得阿拉汉，他依旧保持这个习惯， 叫谁都叫贱种、 贱民。当然他这样的行为并没有任何的不善心念，但是他就是这个习惯，这就是习性。"],[5,1108,1211,1,"本生里面有一个故事是讲 Tissa 长老的，就是那个很会打仗，帮着巴谢那帝王把未生怨王抓起来的人。佛陀后面讲到， 他很多生做野猪的时候，就带着野猪打仗，把老虎抓了。这个故事大家听过，我们就不细讲。那这些都是属于习性， 现在比如说有些人特别能做事， 有些人笨手笨脚、 没有办法。有些女众插花插得特别漂亮， 有些人插花插得很痛苦，插成一堆垃圾，也会的。男的也是这样，以前有些尊者，看到树就想把皮剥了，换一颗新树，这是他的习性，这个就是习性。那这个习性有些是好的习性， 有些是不好的习性， 那我们就可以观察这个习性是对我们的禅修是有正向的帮助，还是对我们的禅修会有障碍，就可以看到它。"],[5,1195,1257,0,"“行”就是《清净道论》中讲的六种性行——信行者、觉行者、寻行者，对应的还有贪行者、瞋行者和痴行者，这六种性行。《清净道论》 写了很多典型性行表现出来的事例， 那这个就是性行。那我们去看这个意乐也好， 习性也好， 还是行也好， 它们其实是交互地出现的，有时候这样表现， 有时候那样表现， 有时候跟我们过去那些七种随眠是一样的。但是我们去认识它的时候， 是可以从六个角度的去看它的。我们需要明确的一个是什么呢？我们经常讲“你这个人业习、业习、业习”"],[5,1257,1389,0,"，我们经常会把这个业跟习性混在一起，其实业是业，习性是习性，从阿毗达摩来讲会把它们分得比较清楚。那么习性虽然跟业一样， 都是在一生当中或者在不同的生命期间会通过无间缘和等无间缘传递下来， 但表现的缘力是不同的。帕奥西亚多在《辨识发趣诸缘》中有提到： “业是受到强大“思”的驱动“，而业的潜力是基由业缘来传递。业有俱生的业缘， 有异刹那的业缘， 而传递下来的是异刹那的业缘。那么业成熟的时候是可以产生新的果报色法和果报名法。那它为什么会产生这样一种色法和名法呢？跟相应的无明、 爱、 取有关。这个我们前面讲过， 你有什么样的无明、 爱、 取，就会影响你的业成熟的时候产生的名法和色法， 细的后面会还再展开，我们不去细讲。"],[5,1387,1471,1,"这个习性是什么？它并不是有强大的思来形成这种业缘力， 它纯粹只是很多很多次的重复行为所累计下来的这种动力造成的， 它是一种惯性并不是业产生的， 而且这种来自于多生乃至于无始以来， 多次重复所累积下来动能的潜力基本上是通过自然亲依止缘的缘力， 来支助当下的这种状态。所以业是通过业缘力来支助当下的名法、 色法的果报成熟， 而这个行为习惯是透由自然亲依止缘来支助当下的状态和习惯。比如说刚才的那位阿拉汉尊者，一看到人就说“你这个贱种”"],[5,1471,1543,0,"那么它是一种惯性，这种惯性显然不是业成熟，是一种缘力。那么性行呢， 性行是过去生所培育的一种思维方式以及产生的行为模式。我们五蕴里面有色、受、想、行、识。除了受蕴和想蕴以外的其他心所， 都包含在行蕴里面， 所以我们也称为心行， 那这个就是性行的所指， 实际上是指我们所有心所的综合素质， 也就是各种心所具备的各自的特性、 素质所形成的强弱程度的不同， 这些通过无间缘、等无间缘力量传递下来，在你日常生活中可以去观察它。"],[5,1543,1700,0,"刚才我们讲到意向性、 习性和这个行， 那这一生里面， 它会怎么样表现呢？往往会跟我们上一生临死前成熟的业， 过去五因——无明、爱、取、行、业交织在一起。如果我们不能够去观察它的时候，是很难把它分出来的。一般我们建议怎么观察呢？首先对上一生临死前成熟的业， 当时造这个业的心所状态先有个了解， 这个了解一般出现在哪里呢？出现在你小的时候，刚出生的时候，0-3 岁那一段时间，六种余势跟过去的无明、爱、取、行、业的影响会在那个时候就一起带来。那怎样把这上一生临死前成熟的无明、爱、取、行、业把它摘出来呢？就是看你的有分心， 有分心的素质， 跟结生心是一样的， 而结生心是跟上一生临死前成熟的那个业， 当时造业的那个业行的所有心所素质是相关的。有禅修的人比较容易体会， 当你内心很平静的时候去观察你的心， 如果有修到观智的人就更好， 你可以看自己心的心所的素质。从禅那出来， 出定， 观察你在近行定的时候你所有心所的素质， 观察你的有分， 观察有分的每一个心所的素质情况， 有观智的人就很容易能看到， 这个看完以后， 剩下的其他习惯就是过去的六种势力。"],[5,1700,1790,0,"对于没有观智的人， 显然我们没有办法看得那么准确， 但是当你心平静下来的时候，是多多少少能观察它的。当然对于我们现在日常生活中把这两种分得非常清楚也不是非常重要， 凡是跟这个好恶有关的一般都是过去生留下来的， 跟这个性行有关的就可能跟上一生的业会混起来。因为性行是行蕴， 而上一生临死前成熟的那个业行， 也是行蕴， 这两者是容易混起来的。但是你的意乐和习性（习惯）是容易被你看出来的。“业”呢，一段时间，是善业围绕还是总是恶业在冒头，这个可以观察的。"],[5,1790,1908,0,"一段时间感觉身体状态很好，禅修状态很好，吃嘛嘛香，睡觉也很好， 显然支助业在持续成熟， 支助你的令生业也持续成熟。过一段时间你就会发现， 各种事情会不断出来， 禅修也没在状态， 身体也不在状态。如果在禅林里面， 其他事就不多， 如果在家人事就很多，做什么事都不顺， 那就是不善业冒头的时候。善业成熟的时候要善用善业来支助， 让我们的禅修得以有效地进步；不善业冒头的时候就要守成，学习，休养生息。不要冒进，在家人就不要去投资，去干很激进的事情， 或者有危险的事情就不要去碰， 以免不善业又再引发。对于在禅林的禅修者，这个时候就要多做服务，多修佛随念，多诵《护卫经》 ，多做功德回向，而不是在这个时候就开始抱怨，抱怨天气太热、抱怨各种服务、抱怨太吵。那个时候你本来就看什么都不顺，如果你不知道， 顺着自己的习性去发作就会造很多不善业、 恶缘和违缘，这个时候就老实一点， 少说话、 多禅修、 多止语， 默默地做一些服务，功德回向，回向不善业尽快地过去。"],[5,1908,2019,1,"随眠的观察跟习气的观察， 包括性行的状态的观察也是可以同时来的， 那怎么去观察呢？其实以前很多长老都讲——我们要有正念正知。先“停下来”正念正知的基础就是你在行、住、坐、卧的每一个当下，身心都能够在一起——“身体在做什么， 心能知道”， 坐下来禅修的时候——“业处在哪里，心就在所缘上”。心飘出去了，怎么能管住它？在日常我们面对各种人事物的时候，怎么去正念呢？就是当所有的所缘出现的时候，能不能先停下来。色、身、香、味、触这种五所缘出现， 我们知道这是果报， 这是业产生的果报。我们每一个当下都在各种业成熟状态里面， 看、 听、 嗅、 尝、 触的每一个当下都是果报，那果报出现的时候， 我们的习性就会自然地拉着你去对这个果报采取行动——“可喜所缘怎么样；不可喜所缘怎么样”"],[5,2019,2159,0,"，我们受保护机制和鼓励机制所影响， 自然而然就去。这时就能够看到我们的习性。那当果报出现的时候能不能停下来、 能不能先停一下， 就是能不能管住自己习性的第一步。不管是好是不好，出现在你眼前看、听、嗅、尝、触的当下，停一下，你都能停下来就是有正念，你如果跟着去了，就没有正念， 所以有很多同学跟我们讲说： “我知道走路到时候我知道走路，吃饭的时候我知道在吃饭，但是事来的时候就跟着去了”，那就是你的正念没有用在真正要去保护你的作用上， 而仅仅是做一些念知。但是对于真正要保护我们的心， 你要能够面对所缘的时候、 面对所有果报的时候，当下能够停得下来，停得下来接下来干什么呢？观察因缘接下来要看这个果报产生的近缘和远因， 什么缘促成它现在这个状态？过去的因是什么？虽然你不能够看到很远， 但是当下的缘你是能观察到的。远因不一定能观察到， 但近缘是可以观察到的。是尝试着从缘起的角度来看当下的这个状态。当我们第一个能停得下来， 第二个能看到它的因，你就不会被习性带走，就容易如理作意。那为什么要这样看呢？因为我们受心里余势的捆绑、 绑架， 果报出现的时候，直接就采取行动。"],[5,2159,2242,0,"而修行的第一步就是先不被它绑走，能停下来。那能停下来以后， 我要观察一下因缘。这张图是 24 缘里面的图，就是眼门心路过程诸心生起需要依靠的缘。我们简单先看一下， 以后大家学 24 缘的时候能够详细学。从五门转向、眼识、领受，推度、确定、贪速行（这是一个贪的心路） 、七个速行心、两个彼所缘，包括支持这个心生起来的心所依触色，那么在它们生起的时候所需要的的缘力。那么这些心生起就是有远因、 有近缘， 举个例子， 眼识的生起需要异刹那的业缘还有一个自然亲依止缘。"],[5,2242,2311,0,"还要有眼净色， 眼净色还有六种缘， 这个是从眼识来看。一个眼识生起，它需要具足 28 种缘，28 种缘从五门转向（无间缘五种） 、过去有分（眼净色） 、过去造业的思（异刹那业的两种缘） 、同一个名聚里的名法（名聚生组的缘） 、其他有效的缘法（自然亲依止缘） 、色所缘（所缘组） ，才能够产生眼识。虽然我们可能没有学过 24 缘，不能那么完整地看到眼识生起所需要的这些缘， 但是我们至少可以体会到， 就是我们眼睛一看到， 我们知道： “哦，是这个所缘出现”"],[5,2311,2449,1,"——这个没问题。这个所缘是可喜所缘或不可喜所缘我们可以分得出来， 如果是可喜所缘我们知道： “这是一个善果报”，如果是不可喜所缘，“这是一个不善果报”。对于可喜所缘和不可喜所缘是从自然、 自性的角度看。你能分辨得出来这是自然可喜所缘还是自然不可喜所缘， 还是造作的可喜或造作的不可喜， 这个至少能够看清楚。知道由于色爱而看到颜色所缘出现了， 那么你能够从业的角度来分析， 出现这样的一个色所缘是善业还是不善业？我们为什么会有眼净色？我们为什么会看到颜色？是因为过去有色爱， 我们对颜色还有贪爱， 不然你就去无色界了， 或者无想有情天了， 或者四恶趣里面不长眼的动物， 比如我们之前讲过的蚯蚓， 这种没有眼净色的动物。但是你有眼净色是因为你还有色爱， 这个可以理解， 这个方面我们至少能够看到。如果能这样观察， 接着下来你就能观察到这个心要起来， 对这个颜色所缘想采取什么样的行动的这种感受，去看你的心就能看到了。"],[5,2449,2585,0,"这个图大家都很熟了， 这个是耳门， 把这个耳识换成眼识就可以。剖析五门心路过程五门心路过程五门转向到眼识，然后领受、推度、确定。到我们心里面已经觉得这个颜色是好还是不好的时候，随彼起的意门心路过程都过去七、八条了， 就是对这个颜色已经做了概念化的判断， 你才会对这个颜色说——“我觉得喜欢还是不喜欢”，但是它跟你对最开始第一条的眼门心路过程的确定， 是有很大的关系的。我们看到这个确定心是确定什么呢？所缘出现， 五门转向到眼识， 眼识只是像拍照一样， 全息照相机拍一下，然后就交给你的心：意门，领受一下，领受的时候它对这个所缘并不是很清楚地识别， 它只是模糊地感觉有一个这样的所缘出现， 接下来推度的时候就会省察这个所缘， 省察以后才会对这个所缘确定。那对应地来看，眼识、领受、推度这三个都是果报心，果报心都是过去的异刹那业在支持它生起。"],[5,2585,2682,0,"那接着下来就是三个自然亲依止缘， 自然亲依止缘在这个心识里面怎么起作用呢？这个自然亲依止缘就对眼识或者领受或者推度里面相关的心所， 特别重要的是想心所起作用， 对里面的胜解心所起作用， 就是说： “我怎么去领受这个目标、 怎么去标记它、 怎么去认识它、怎么去感受它”，所以我们要明白佛陀为什么设五蕴？为什么不设六蕴？而五蕴为什么把受、想、行、识拿出来呢？而不把寻、伺、一境性拿出来呢？有情都是活在感受里的， 生活过程中总要去寻找快乐的感受， 所以受呢， 对我们身心的影响是最大的。然后我们对这个受的判断往往是靠我们的记忆、经验来完成，我们认为“有一个思想”“有一个认知”"],[5,2682,2769,0,"“有一个固定的看法”，都是这个想心所所带来的这种能力。所以受这个心所被佛陀单列出来， 想这个心所被佛陀单列出来。识是识知目标， 我们能识知目标的能力是最重要的， 你若不能识知就不存在这个问题， 那其他所有心所都归为这个行， 归为行蕴。所以也就是说受和想和识是在你的心运作的过程中很重要的三个名法， 其他的都归为一个行， 以思心所为代表。那这里哪一个重要， 自然亲依止缘就会强有力地支持它生起， 自然亲依止缘在这里面会起的作用。那这些缘力从领受到推度， 推度开始省察这个目标， 就能对这个所缘做出一些判断。那到确定就是对已经完成的理解做一个决断——这个就是这个样子。"],[5,2769,2908,1,"“如理作意”和“不如理作意”的产生过程那我们知道， 做这个决断是在确定心或者意门转向心里面的胜解心所完成的。那胜解心所对治目标的犹豫， 就是确定或者决定。在帕奥西亚多的《智慧之光》里面，明确地告诉我们说，“如理作意和不如理作意是确定心和意门转向心里面的胜解心所完成的”。整体来讲，如理作意和不如理作意是确定心和意门转向心整个心一起完成的， 而这两个心里面执行决断的作用是胜解心所。那胜解心所是怎么样来执行的呢？我们知道胜解心所是杂心所，那确定心里面有 7 个遍一切心的心所，触、受、想、思、一境性、名命根、 作意是遍一切心心所， 所有心都有。那这个杂心所在确定心里面增加了寻、伺、胜解和精进，那么在推度心的时候，它的想、它的标记就被取出来， 推度心就会对现在从眼识到领受转过来的那个现有的标记作出一个省察， 取过去的标记对现在的从眼识领受过来的所缘做一个对比、 做个省察。省察基本上在推度的时候就省察完了， 省察完就交给确定心， 确定心去干嘛呢， 由胜解心所做决定——这个可喜所缘、这个不可喜所缘，确定心就完成这个。"],[5,2908,2966,1,"那么当它对所缘做出这样一个确定之后呢， 我们知道， 接着速行心就会对目标、 所缘采取行动。速行是什么呢？就是全然地去体会这个所缘， 全然地去感受这个所缘。这个时候全然体会和感受都带着什么？——带着我们的随眠、带着我们的六种心理余势。在推度心的时候，你的那个想，我们讲想心所的时候讲过，“想”有“有慧想”、 有“贪相应的想”、 有“瞋相应的想”、 有“慧相应的想”、 有“识相应的想”，如果你推度的时候，省察后调出来的是“有慧的想”"],[5,2966,3047,0,"，那这个胜解心所做确定就是“有慧的胜解”“有慧的决定”，我们决断的时候就是有智慧， 有智慧的决断接着下来的速行就是善的速行， 也就是如理作意。“如理作意”和“不如理作意”的受到标记习惯影响那虽然我们讲五门心路过程完成以后还会要至少经过 7 条随彼起的意门心路， 才能对所缘作出概念法的判断。但是一开始的五门心路过程的确定心对后面的这个判断实际会产生关联的， 为什么呢？它确定完以后就会把这个确定结果往后交， 它会不断地往后交， 对这个所缘是什么态度就会不断地往后交，所以对后面会产生影响。帕奥西亚多也讲， 如理作意和不如理作意看起来是在确定心或意门转向心里面完成， 但实际上是早就已经完成了。这句话怎么理解？就像那位金匠尊者，看谁都是“你这个贱种”"],[5,3047,3142,1,"。当然成为阿拉汉以后，他说“你这个贱种”，就已经没有任何不善的意念在里面，但是他的标记里面就是这样——“这些只要不是高贵的婆罗门，都是贱种”。他的标记就是这样。那也就是说他并不是这个时候看你觉得特别低贱而叫你贱种， 而是它五百世做高贵婆罗门的时候已经养成习惯说一切人都是贱种， 而这种标记习惯存留下来的这种力量， 就是在推度心和确定心的时候以自然亲依止缘的缘力影响“想”和“胜解”。大致是可以这样简单来理解，虽然我们的心是同生、同灭、同所缘、同依处，心的运作没有办法用我现在这样来给大家描述， 那我现在给大家这样描述是希望大家可以去理解心的整体运作方式是这样的。那也就是说在确定心里面这个触， 接触目标， 产生感受， 这个感受其实是跟想蕴标记是放在一起的。"],[5,3142,3217,0,"“想”标记的时候是连那个“感受”一起标记的，但是当下的那个感受也是有的。当下的感受如果不是身体明显的苦乐受， 眼睛看到、 耳朵听到、 鼻子闻到、 舌头尝到， 特别是眼睛看到， 耳朵听到，这一类它没有很强的感受的时候呢，这个“受”是直接受你的标记影响的。那么这个标记完以后呢，思心所就会召集大家，来对这个所缘造业。这个造业是在胜解心所已经作出确定和决定之后， 思心所才会来去造作，但是它们是同生、同所缘、同依处，是一起的。看起来好像它们有先后，其实当下同时就开始了。"],[5,3217,3356,0,"果报如此速行可变的真正含义前面一再讲的这六种余势也好， 过去的业行也好， 还是我们的动物性也好，在我们每一个看、听、嗅、尝、触的当下，它们怎么起作用？那为什么跟大家讲你要先停下来。在看到、听到、闻到、尝到、接触到、心里想到的当下，能不能先停下来。其实当你看到、感受到停下来的时候，最少已经七、八条心路过去了，你已经感受到了。这个时候停下来， 能不能够阻止过去的不善随眠来主导接着下来要采取的更猛烈的身语意的行动？过去这些势力在看、听、嗅、尝、触的每一个当下， 在你的心里面生起来的状态， 你是多多少少能感受到。你停下来看到它的状态， 不跟它走， 当下你就能够转向善， 能够如理作意， 你就转过去， 如果实在转不过去你就停在那个地方， 看着那个不良的或不善的感受等着它消失， 能够直接转我们就转， 不能够直接转也要看着它，要停下来，不能采取行动。这个就是果报如此，速行可变的真正含义。果报就是这样， 速行是会受你一直以来的习惯所影响。但如果你不想跟你的习惯走呢， 你就要练习当下能够停下来， 不然你就会跟它们去。"],[5,3356,3456,0,"二、胜解的四种决断基础观察自己的习惯那我们来讲就是如理作意会有几种决断的方式， 也就是胜解会有几种类型。在你停下来以后， 或者我们不需要停下来， 在看到我们这个习惯生起来，我们就能够发现，“唉，这个习惯生起来！我一看到这个目标，习惯就起来“，习惯起来的时候你心里能够看到是贪还是瞋，是善还是不善， 你能观察到。那这种观察就是知道它无外乎是受六种心理余势的影响， 六种心理余势无外是善和不善， 善就是十种巴拉蜜相关的内容，包括性行也是，信行者、觉行者或者善相关的内容。如果你起来是善的， 你知道接下来的判断就是会跟“慧相应的”或者“识相应的“一种胜解， 如果我们不能够起来“慧的胜解”或者“识相应的胜解”那么你就会被贪、 邪见这些带走。当那些贪、 邪见的不善心起来的时候， 你要知道： “这些是我的习惯”"],[5,3456,3524,0,"， 这样的习惯是从什么东西开始的？那过去无始我们看不见。梳理的意义那为什么前面说我们要做梳理呢？梳理就是： 如果它只是一个见，这个见你能不能够当下转掉它， 如果你的心力足够强的话， 你不用八步法，一念之转，当下转掉。你说： “唉，这个是错误的见解，马上转掉”，就能马上转过来。如果你觉得一团乱麻，知道是错误的，但是那个力量就是很强。就是解决不了它， 那你是可以去观察， 你这样的习惯是什么时候养成的？有没有过去的一些场景和印象？如果有的话就去梳理它， 用八步梳理法去梳理它。"],[5,3524,3611,1,"你不舒服起来的时候已经是“不善的胜解”完成了，但对它采取行动只是在心里面， 没有表现在身口上， 已经是困扰性的烦恼， 那么困扰性的烦恼一定来自于过去错误的认知， 错误的认知都是从错误的标记开始的， 由于错误的标记有错误的胜解， 有错误的胜解以后你才会有错误的行动。四种决断的判别那么错误的胜解一种是“贪胜解”。这个在经典上有 108 种贪，我们就不去细讲它。还有就是邪见，62 种邪见。这两种在我们面对所缘的时候是最常见的一种习惯的判断方式。贪呢， 就来自我们 7 种随眠里面的第一种贪随眠， 第二个就是邪见胜解， 知见在决定着你如理作意和不如理作意。知见在决定你当下采取什么样的行动，就“我认为”"],[5,3611,3727,1,"“我觉得”——这都是“见”。这种见是哪一类的见？这个见是什么时候形成的？你可以观察， 它是见颠倒， 见就是见颠倒， 它一定有因缘会出现， 从什么时候开始养成这样的见颠倒。见颠倒是最坚固， 但是它是浮在最前面， 它的下层就是心颠倒和想颠倒， 如果从这个见颠倒一直追到想颠倒，把想颠倒转过来，这个见颠倒很快就会坍塌。这两种胜解的表现是，你本来就对所缘特别容易贪——“唰”就去了；你的见解特别强——“唰”就去了。但我们很多情况下是寻胜解，来回倒腾，来回想，来回纠结，各种各样的摇摆、犹豫、想不通，没有办法作出决策和判断， 那这种很多。这种来回的寻胜解呢， 如果我们没有正法、 正见的支持， 大部分情况下它又回到这个贪。就是这个寻呢， 为什么要来回地比较呢？这就是符合、 不符合我的好处， 是不是对我能带来好处。它最后还是在这个贪里面来回倒腾， 在 108 种贪里面其中的几种来回找。然后这里面的判断， 怎么没有瞋的判断？瞋的判断就在寻的判断里面，就是对你喜欢的，你寻到，“唉，这个对！"],[5,3727,3788,1,"这样子，但是，噢！好像不应该这样”，其实那个瞋就在里面，当我觉得我不应该这样判断的时候，其实就是对这个东西作出一个排斥。你的任何决定一定是对你有好处的你才会去决定， 你总是作出对我有好处的决定。哪怕就是你很生气地把人家骂一顿， 你为什么把人家骂一顿呢？因为你觉得我要贪的东西我没有办法得到。我通过这种很强有力的发作是不是可以保护住我这样的一个想贪的所缘或者目标。这个瞋的决断背后还是因为“贪不得”，是“贪相应的想”"],[5,3787,3839,0,"，只是“贪相应的想”不能被实现。“识相应的想”我们前面讲过，就是没有业果智，没有思维缘起，但是它就去做这件善行， 它去决定做一件善行， 我们昨天在回来的路上，一位贤友看到路边猫着一直猫， 很害怕地躲在路中间， 贤友马上把车停下来，把猫救上来，当时有没有业果智呢，很难讲，不一定，但是他觉得那个猫有危险， 就把它带上来。这个是他当时自己的判断，当时至少是“识相应的想”， 就是“善心相应的想”， 好一点的呢， 就是“我要去帮助这个生命”"],[5,3839,3917,1,"， 他就有“慧相应的想”。那我们刚才讲的， 贪也好，见也好，寻也好，都是以自然亲依止缘的缘力，在你的每一个心，特别是在确定心和意门转向心， 这个胜解要起作用的时候， 自然亲依止缘来支助它们来作出这样的判断。那你不能作出判断？也是有不同的缘力来让它折腾， 有很多各种各样的缘力来支持它，我们讲就是你的寻，“来回地找”就是征询内心决策委员会，内心决策委员会里有很多的想、标记，这些想、标记都不够强有力， 如果有一个足够强有力的， 你就会很快作出判断， 没有很足够强有力的，你就会来回的想： “到底是哪一个？到底是哪一个”只要你没有正见， 只要我们心没有良好的如理作意的训练， 不管你怎么寻， 你都是被那个随眠带着走， 被无始以来所形成的不良习性带着走。"],[5,3917,3998,1,"观察心的运作的实际意义所以我们学佛的时候经常讲，“这个烦恼、随眠，那么多四漏、四轭这些名相， 我们总觉得很难跟我们有关系， 等阿拉汉的时候把它断掉就行了”。学阿毗达摩就是要让我们在每一个当下都能够看到它的运作方式， 我们心的运作方式。当我们能把握这个运作方式的时候我们才谈得上后面我们怎么修行， 比如三十七道品。我们这堂课后面延续下来的就是三十七道品的学习，那三十七道品一开始就是四念住。为什么花这么多时间前面铺这些东西？就是说四念住， 你念住什么？如果你对这些烦恼以及烦恼的现状，它的特相、作用、现起、近因，以及它是如何在生命当中在影响我们？在每一个当下它是怎么去表现的？你不能观察它，你的念住就很难真正起到作用。"],[5,3998,4062,0,"佛法的念住跟我们一般世俗上讲的， 现在全世界风靡的， 所谓的正念疗法，最大的不同就是在这里。一般的正念疗法就是：你觉知，你知道，你知道你身心的状态，然后你开放的心，你觉知它，你接受它， 有没有用？——很有用， 它的用处用在哪里？就是你至少不会马上被带走， 这是第一个。第二就是你停下来了， 当有正念的时候你就能停下来。这是前面一步， 但是我们不是仅仅停下来， 我们要发现它的来源， 最后我们要断掉它。那要断掉它之前我们不断地削弱它， 在我们禅修的过程中不断地减少它对我们的困扰。"],[5,4062,4177,0,"前两天有一位美国的贤友， 他在跟我讨论要不要转换业处， 他原来修白遍，修得很辛苦，他的白遍其实遍相蛮好的、蛮亮的，但是他就是眼睛和脸部很紧张、 很痛苦， 前段时间有位尊者在教佛随念， 他说： “我准备把白遍放下，我去修佛随念。”我说： “好啊！”我不能讲不好啊，然后他修，修一段时间跟我讲说： “哎呀，我还是会去看，当这个白遍出来的时候， 白遍和佛随念到底是什么样的关系呀？我眼睛一闭，这个遍相还在， 就是会出来， 但是这个佛随念的功德， 我要怎么放呢？”其实三年前我就跟他讲： “眼睛和脸部很紧， 就是因为你想去控制那个所缘， 想去控制那个所缘的原因就是有几种情况： 一种情况就是你对那个所缘有期待、有要求。你希望他应该是这样”"],[5,4177,4232,0,"，那希望它应该这样的人有不同的类型，一种类型就是特没自信的那种， 还有一种类型就是特有自信的那种， 两种都容易造成这个情况。他是属于那种特有自信的那种， 做任何事情都非常地严谨， 做任何事情都几乎完美， 他是一个在世俗上非常棒的人。但是他带用这样的一个习惯来面对所缘的时候， 他就苦不堪言。但他精通阿毗达摩， 精通阿毗达摩如果我们不把它用在日常生活上， 不一点点去看我们的心， 你精通名相是没有用的。"],[5,4232,4349,1,"修行就是要看到自己的惯性并解决它那我们讲修行， 修行就是要看到自己的惯性， 真的看到它为什么会这样？来自于哪里？根源在什么地方？要干掉它。刀锋向内， 要刮骨疗毒，是很不舒服的。但你不去处理它，你就不可能解决它，它就成为你禅修的障碍。而且它不仅仅在现在障碍你， 在你以后的每个阶段都可能出现， 因为每一个阶段要真正突破都要五根平衡， 七觉支平衡。七觉支平衡就是你的心全然放松， 那个精进根完全处在精进舍的状态，心的力量处于最好的、最强有力的状态，但是一点都不紧张。所有的根都完全起作用， 但是没有任何不平衡， 因为有精进舍， 精进舍就是不偏。佛陀比喻驾马车， 那两匹马自己都非常娴熟地同时奔跑，马车夫只要轻轻地拿着马鞭， 很轻松地、 自然地， 不需要任何多余的动作， 两匹马自然地就能这样跑起来， 他的心和两匹马的状态是在一起的、是重叠的、是同频的，禅修你也要找到这个状态，不管是修止禅或者观禅都要有这个状态。那你只要有任何有期待，有任何紧张，就会破坏这个平衡， 你只要破坏这个平衡就会不断地往下偏、 不断地往下偏。"],[5,4349,4471,0,"烦恼是非常狡猾的， 有时候它是很微细不易觉察的， 会把你骗得团团转。特别当你觉得感觉好的时候，问题就在那个地方。今天我们从认识烦恼到我们日常生活中来看随眠怎么生起， 怎么来观察这个随眠， 随眠有哪一些已经开始影响到我们生活、 影响我们的禅修，那这个你就要去处理它，不然它就会不断地影响你的禅修，所以这个就是前行。那么我们今天就学习到这里， 希望大家能够完全彻底清理禅修中碰到的这些障碍，早日体证道果，证悟涅槃！"],[6,4,214,1,"尊敬的祜巴大长老，各位尊者、各位尼师、各位贤友晚上好！上一讲我们把苦之集的类别之概要跟大家过了一遍。我们特别讲到了当我们的心面对所缘的时候，六门（眼、耳、鼻、舌、身、意）面对六境（色、声、香、味、触、法），会生起六门心路过程。一、六门心路过程（一）果报如此、速行可变六门心路过程有少许的差别： 五门心路过程的双五识是依于五根生起的，这个心路很多人都很熟悉，果报如此，速行可变。速行可变是在哪里变呢？我们学过如理作意的人都知道， 是在五门心路过程里面的确定心和意门心路过程里面的意门转向心， 由这两个心来完成如理作意或不如理作意。"],[6,214,329,0,"（二）胜解与想那么如理作意和不如理作意在两个心里面是由哪些心所来完成呢？主要由这个心里面的胜解心所来完成，胜解就是确定目标。确定心或意门转向心总共有这些名法： 7 个遍一切心心所——触、受、想、思、一境性、名命根、作意，加上杂心所 4 个——寻、伺、胜解和精进，再加上一个心识，一共是 12 个名法。其中胜解心所起决定性的作用， 但是它的确定、 胜解心所凭什么胜解呢？当目标出现的时候，比如，你看到一个人，觉得似曾相识，那似曾相识是怎么得来的？所谓似曾相识就是他过去曾经有见过面或者有过印象才会似曾相识， 这个有过印象或者见过面留下来的这个印像， 在我们心里面是由想心所来完成的。"],[6,329,407,1,"想，在巴利语里面叫（Saññā）。它的特相就是做标记，见到一个目标做个标记。这是蓝色，这是红色，这是男人，这是女人，它是由这个（Saññā）做标记。它的作用就是通过以前所做的标记来认得现在相同的所缘， 同时再做一次标记， 以便下一次再认得， 这是它的作用。现起，就是呈现在你当下心的状态，它的特点就是：心所注意的记号， 根据该记号获取下一个目标。大家能体会， 当我们去看一个问题的时候，你觉得是在看它，其实你心里面是在想，“哎，我曾经在哪里见过， 我是怎么回事， 或者是这个人以前对我有恩， 这个人以前曾经白过我一眼，都会在后面打转转。"],[6,387,545,1,"。也就是说，当我们面对一个所缘的时候， 心并不是放在真正的目标上， 而是调出一堆过去的记号或者记忆， 对它进行分析判断： 它会给我带来快乐吗？它会给我带来威胁吗？更多的是从这个角度出发。所以我们说人都是主观的，会客观的人都是被训练出来的， 没有被训练的心不会客观， 只会主观。因为你的心就是这样长的， Saññā就是这样运作的。五门心路过程从接触目标、产生五识——眼识、耳识、鼻识、舌识、身识，到领受、推度，这个想 Saññā呢，一次一次地不断地对所缘进行确认。五识是整体地像全息照相机一样拍照，拍完就交给领受心，把它领受过来；领受本身不起判断作用，只是领受过来而已；推度就开始揣摩一下、审察一下；审察以后，确定这个就是它，到确定心这边就可以确定。是谁确定呢？就是胜解心所， 胜解来确定目标， 确定或者决定： “这个人可能对我不利， 我要怎么防范他；这个人对我有恩， 我要怎么对他表示感激。"],[6,545,616,0,"，接下来的心就是这样运作的。所以确定心里面的胜解是很重要的， 但是这个胜解它凭什么胜解呢？是跟你过去做下来的标记有关。（三）胜解的四种决断基础然而我们的标记就一定正确吗？这很难讲。胜解有四种， 就是判断事物有四种判断：第一种是以贪来判断；第二种是以邪见来判断；第三种是以寻来判断， 寻是什么？就是来回的比。我们到西双版纳买个房子，看十几天，看七十几个地方，来回地找，这就是寻；第四种是以智来判断， 有智慧生起来， 以慧根来判断。那这些判断靠什么呢？靠想， 贪的判断靠贪相应的想， 就是过去你曾经对这个目标有过黏著，有过“贪”的这种标记，“这个东西对我好”"],[6,616,691,1,"，你做完标记下次再来判断的时候，就以贪的方式去判断。就这样贪相应的、邪见相应的、识相应的、 智相应的想， 导致这四种判断的方式。所有的问题就在这里产生， 因为我们过去做的标记不准确， 乃至于是错误的， 这样一个错误的标记到现在要去依据它来判断，这样的判断一定是错误的。以前我们上课一再讲， 面对所缘出现的时候， 第一个， 你的心要能停得下来。停下来是什么意思呢？就是不会跟着你的惯性走。惯性是什么呢？惯性是你的标记 —— 一看到就去了， 其实并不是在这个心路发生的时候才判断， 而是在过去早就判断好了，“哎呀！我知道这种方式！”"],[6,691,780,1,"，不需要再去想，不需要再去评价。也就是说，过去的标记非常重要。但标记已经标记完了， 到底哪一些是正确的？哪一些是错误的呢？就要去检查、 去梳理。一生从小到大， 有哪一些重大的判断是错误的。这些重大的错误判断， 会让你走到哪里都是以这样的错误判断来看问题，这是很要命的。（四）认同与群众心理那都有哪一些呢？比如说， 这个图以前讲过， 碰到有人来跟你聊天、跟你说话，我们要知道，所有人来找你说话，都是想获得你的认同， 不然他不会无缘无语来找你说话， 对吧？哪怕没什么目的来找你倾述，也是想得到你的认同——“你真的很可怜，你这事真的做得很棒”"],[6,780,835,1,"，他就是想获得你的认同。如果你不能够知道他想让你认同什么， 而你用你自己对他的判断去跟他交流的时候， 你就会发现话不投机半句多。他本来想好好跟你说话， 结果闹得半天不愉快。哪怕就是夫妻之间、 母子之间， 都经常发生这样的事情。怎么办呢？你要去看到他背后到底是什么样的期待。所以我们要带着审视： 他可以说半天，他想达成什么目标？他背后的认知是什么？以佛教的专业术语来讲，就是他的无明、爱、取是什么，你要知道。"],[6,835,901,0,"再一个， 要随时保持自己的清醒。怎样能够保持自己的清醒呢？就是你不要卷入乌合之众里面，就是群体效应，不要卷入。《乌合之众》作者勒庞写到：“人在群体里面一般很容易头脑发热，个人一旦进入群体， 个性就会泯没， 群体的思想占据统治的地位， 而群体的行为表现为没有意义、情绪化、所有人都低智商。，大家可以体会。所以在群体里面怎么保持你的清醒， 这个很重要。就是能不能发现错觉？生活中到处都是错觉，但我们总是相信自己是正确的。"],[6,901,982,0,"（五）标记与判断比如下面这个图里， 这是什么动物？有人说是驴， 有人说是海马，有人说这是鱼， 怎么看都行。那怎么看都行就有一个问题—— 模棱两可。你在生活当中观察问题， 怎么能去除这个模棱两可？因为你要给他做标记， 做完标记以后要做判断， 就影响你最后对这个目标采取的行动。下面这个图里面， 到底是三根木头还是四根木头？这些都是很普遍的，那这要怎么办呢？面对生活中不同的观点， 我们怎么尝试从不同的角度来看问题？这是要练习的。为什么？因为它影响你的想蕴标记， 最后影响你的判断，让你活在错误的认知里。"],[6,982,1072,1,"上面这个图，就是从孩子的角度看世界，跟大人的角度看世界，它有很多不同。有个很著名的话：“孩子的世界就是大人的屁股”。为什么呢？因为小孩子个矮， 触目所及之处都是大人的屁股， 而大人看孩子都是他的头发。大人和孩子的角度不同， 而且小孩子在不同的年龄段， 内心需求和期待也不同。现在最热门是亲子系列课程。为什么亲子系列课程会那么热门？就是妈妈不知道怎么带孩子。其实妈妈带孩子最根本就是要能知道孩子现在在想什么？然后你怎么把他带出来，怎么去培养他。这是最核心的。这个核心的能力就是认知共情。什么是认知共情？就是你能站在孩子的角度来看问题。这都是想蕴和胜解的作用。"],[6,1072,1144,0,"做事的时候一定要懂得排除干扰。因为只要做事， 就一定有人说你， 如果任何一个人说的话你都要在意， 就没法做事。所有做事的人都有很深的感触： 怎么排除干扰， 做正确的、 该做的事情？这涉及到什么呢？就是果报如此， 速行可变。怎么变？讲简单的， 上面这些图片中碰到的问题你都不能够从里面跳出来，你说“果报如此，速行可变” 就没有可能， 你只能跟着惯性走， 你不可能改变。所以修行修什么？修行不只是诵经， 修行不只是磕头， 修行就是在这一点点里面看到我们内心的惯性，怎么去修正它，这才是核心。"],[6,1144,1277,1,"以上是我们上一堂课讲过的关于从佛法的角度、怎样做你生命中的决策。也就是果报如此、 速行可变的时候， 怎样做到速行都是善速行、正确的速行，这是很重要的内容。二、类别概要之六因我们现在进入下一个课程， 类别概要里面的六因。六因， 也是二十四缘里面的第一个缘 Hetupaccayo—— 因缘，从缘法的角度有六个：贪、瞋、痴和无贪、无瞋、无痴。佛陀把因缘放在二十四缘首位，是有深意和道理的。修行修什么？勤修戒定慧、熄灭贪瞋痴。贪瞋痴是导致我们轮回最根本的原因。要对治贪、瞋、痴，就要训练无贪、无瞋、无痴。你不训练无贪、无瞋、无痴，贪、瞋、痴不会自己消失。佛陀不会以水洗罪，不会以手拔众生苦，佛陀只是指示离苦、灭除贪瞋痴的道路，而努力是要靠我们自己。"],[6,1276,1424,1,"贪、瞋、痴和无贪、无瞋、无痴被称为“因”。这涉及到阿毗达摩的一些基本的知识。我们经常会听到有人说，二因结生，三因结生。禅修修不上去就怀疑自己是不是二因结生？二因结生是什么意思？二因就是只有无贪、无瞋两个因，没有无痴这个因，简称二因，其实是二善因的意思。三因结生就是再加上无痴。（一）七十一心与六因八十九种心里面，哪一些心是属于有因？哪一些是属于无因的呢？十八个无因心，七十一个有因心。十八无因心中双五识：眼识、耳识、鼻识、舌识、身识，善果报的和不善果报的合起来十个；再加善果报和不善果报的舍俱领受心和舍俱推度心， 加起来 4 个， 再加上推度心有一个善果报悦俱的推度心， 共 5 个；还有一个阿拉汉生笑心；再加上两个唯作心 （五门转向心和意门转向心。意门转向心跟确定心是一样的）。合起来是十八个无因心。七十一个有因心：十二种不善心——贪根的有八种，瞋根有两种、痴根有两种；善心有二十一种—— 八大善心、五种色界禅那善心、四种无色界禅那善心、还有四种出世间的道心， 合起来是二十一种善心。还有二十一种有因的果报心。"],[6,1424,1521,1,"还有十七种有因的唯作心， 阿拉汉才有的。这个合起来就是七十一种心（12+21+21+17=71），它都具有要么是无贪、无瞋、无痴三美因或无贪、无瞋二美因，不善心则有贪、瞋、痴三不善因中的一种或者两种因。这些美因或者不善因会成为因缘里的缘法。二十四缘里， 对于因缘的缘法是怎么形容的呢？——缘法以因的缘力援助俱生的缘所生法像树根一样稳固。这话怎么理解？就是当你的心拥有这些像深根一样的因的时候， 你的心就会变得稳固、 有力量。我们日常可以观察到， 当我们善心生起来的时候， 比如来寺院， 听法、服务、礼敬、恭敬、禅修，做善行，内心很稳固，这是有善因的——无贪、无瞋、无痴 。不善心生起来的时候，心也是很稳定的。有句话叫：“烦恼粗重”"],[6,1521,1679,1,"，他生气起来的时候，感觉整个世界都对不起他，贪心起来的时候恨不得所有人都不存在，可以一人独享。“你这个人怎么这么犟啊！十头牛都拉不回来。，十头牛都拉不动，你说他的心有多么稳固！所以贪、 瞋、 痴不善法起来的时候， 心也是很稳固的。这是日常生活中我们能体会的。（二）三因、二因与无因结生三因结生的人，结生名法有无贪、无瞋、无痴这三个因。对于人道来讲， 他是善趣， 三因结生最少是三十三个名法， 有喜和无喜的区别。结生心如果是三因结生， 那么这一生如果愿意付出足够的精进和努力，就有机会证得上人法，包括禅那、观智和道果。如果是二因结生呢，那么这一生不管他怎么努力，都不可能证得禅那和取证道果，但他还是可能成就观智。至于他的观智能有多强， 很难讲。结生的名法和结生的色法是俱生的， 结生过去叫投胎， 投胎这个词不准确， 没有一个东西从过去到这里来投胎， 它就是你上一生临死前成熟的那个业，是它导致这一次新生命的生起，新生命的生起就是名法和色法，精神和物质的部分同时生起。"],[6,1679,1890,0,"也就是说，如果我们的结生心里面有无贪、无瞋、无痴，而且是强有力的、 是殊胜的， 这样的因会影响你的结生色法， 你这个生命体（你的身体）也会健康、有力。女性很漂亮，男性很英俊，是跟它的三因力量有关的。对你的生命来讲，从一开始结生那一刹那的名法，你的无贪、无瞋、无痴的强弱程度，就直接影响到你这一生，你的心的力量和素质与你身体的健康素质是直接相关的。像一棵树， 树根健康与否影响到这棵树是不是能够茁壮成长， 是同样的道理。八大善心或者二十一个善心， 跟我们一生当中的善业相关。我们每天受戒， 离杀生、离不予取、离欲邪行、离虚妄语、离粗恶语、离离间语、离杂秽语、离贪婪、离瞋怒和顽固的邪见，十种善业。你这样去造作，不管是身、语、意的业，一定是跟这三个善因相关。那如果我们造十不善业，杀生、不予取、邪淫、虚妄语、离间语、粗恶语、杂碎语、恼怒瞋害、贪婪、邪见。那这些心呢，就跟这个贪、瞋、痴三个不善因是结合在一起的。所有的不善心都有痴。痴、无惭、无愧、掉举是遍一切不善心的心所为什么会不善呢？就是因为愚痴才会造作不善。"],[6,18
