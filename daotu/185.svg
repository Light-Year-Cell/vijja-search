<rect x="30" y="721.0" width="267.9" height="92.2" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="758.0" font-size="26" font-weight="700" fill="#fff">185讲-摄集33-摄菩</text>
<text x="48.0" y="793.1" font-size="26" font-weight="700" fill="#fff">提分-受念处2</text>
<rect x="343.9" y="337.8" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="367.8" font-size="19" font-weight="700" fill="#2b2a27">一、对于六种受的补充说明</text>
<line x1="653.9" y1="79.2" x2="919.8" y2="79.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">1.依靠五欲的结缚，“依靠”是指：依</text>
<text x="656.9" y="70.6" font-size="16" font-weight="500" fill="#2b2a27">靠生起于六门的[感官渴爱的]</text>
<line x1="653.9" y1="140.4" x2="917.8" y2="140.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">2.生起于六门的依靠出离的悦受被称</text>
<text x="656.9" y="131.8" font-size="16" font-weight="500" fill="#2b2a27">为没有依靠欲爱结缚的乐受</text>
<line x1="653.9" y1="201.6" x2="931.9" y2="201.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="171.4" font-size="16" font-weight="500" fill="#2b2a27">（一）依靠五欲结缚、依靠生起于六门</text>
<text x="656.9" y="193.0" font-size="16" font-weight="500" fill="#2b2a27">的[感官渴爱的家]的悦受，被</text>
<line x1="653.9" y1="262.8" x2="931.9" y2="262.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="232.6" font-size="16" font-weight="500" fill="#2b2a27">（二）依靠生起于六门的出离的悦受，</text>
<text x="656.9" y="254.2" font-size="16" font-weight="500" fill="#2b2a27">被称为没有依靠欲爱结缚的乐</text>
<line x1="653.9" y1="324.0" x2="924.9" y2="324.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="293.8" font-size="16" font-weight="500" fill="#2b2a27">（三）依靠生起于六门的[感官渴爱的</text>
<text x="656.9" y="315.4" font-size="16" font-weight="500" fill="#2b2a27">]家的忧受，被称为有依靠欲爱</text>
<line x1="653.9" y1="385.2" x2="931.9" y2="385.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="355.0" font-size="16" font-weight="500" fill="#2b2a27">（四）依靠生起于六门的出离的忧受，</text>
<text x="656.9" y="376.6" font-size="16" font-weight="500" fill="#2b2a27">被称为没有依靠欲爱结缚的苦</text>
<line x1="653.9" y1="446.4" x2="924.9" y2="446.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="416.2" font-size="16" font-weight="500" fill="#2b2a27">（五）依靠生起于六门的[感官渴爱的</text>
<text x="656.9" y="437.8" font-size="16" font-weight="500" fill="#2b2a27">]家（五欲之境）的舍受，被称为</text>
<line x1="653.9" y1="507.6" x2="931.9" y2="507.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="477.4" font-size="16" font-weight="500" fill="#2b2a27">（六）依靠生起于六门的出离的舍受，</text>
<text x="656.9" y="499.0" font-size="16" font-weight="500" fill="#2b2a27">被称为没有欲爱结缚的不苦不</text>
<line x1="653.9" y1="568.8" x2="917.8" y2="568.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="538.6" font-size="16" font-weight="500" fill="#2b2a27">（一）依靠[感官渴爱的]家的悦受是</text>
<text x="656.9" y="560.2" font-size="16" font-weight="500" fill="#2b2a27">不应该被依靠的</text>
<line x1="653.9" y1="630.0" x2="926.8" y2="630.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="599.8" font-size="16" font-weight="500" fill="#2b2a27">（二） “应依靠的悦受”指：应依靠出</text>
<text x="656.9" y="621.4" font-size="16" font-weight="500" fill="#2b2a27">离的悦受。 以出离、观智、涅槃、</text>
<line x1="653.9" y1="691.2" x2="917.8" y2="691.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="661.0" font-size="16" font-weight="500" fill="#2b2a27">（三）“不应依靠的忧受”指：不应依</text>
<text x="656.9" y="682.6" font-size="16" font-weight="500" fill="#2b2a27">靠[感官渴爱的]家的忧受。被</text>
<rect x="343.9" y="733.8" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="763.8" font-size="19" font-weight="700" fill="#2b2a27">二、受念处修行方法</text>
<line x1="596.9" y1="730.8" x2="762.9" y2="730.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="722.2" font-size="16" font-weight="500" fill="#2b2a27">（一）受念处修习次第</text>
<line x1="596.9" y1="770.4" x2="778.9" y2="770.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="761.8" font-size="16" font-weight="500" fill="#2b2a27">（二）色业处之修行方法</text>
<line x1="596.9" y1="810.0" x2="778.9" y2="810.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="801.4" font-size="16" font-weight="500" fill="#2b2a27">（三）名业处之修行方法</text>
<rect x="343.9" y="822.0" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="852.0" font-size="19" font-weight="700" fill="#2b2a27">第一、先观照触；在观照名法时</text>
<text x="361.9" y="877.7" font-size="19" font-weight="700" fill="#2b2a27">，如果你的观智能很清楚地观照</text>
<text x="361.9" y="903.3" font-size="19" font-weight="700" fill="#2b2a27">触，就</text>
<rect x="343.9" y="931.0" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="961.0" font-size="19" font-weight="700" fill="#2b2a27">第二、先观照受；如果你的观智</text>
<text x="361.9" y="986.6" font-size="19" font-weight="700" fill="#2b2a27">能很清楚地观照受，可以先观照</text>
<text x="361.9" y="1012.3" font-size="19" font-weight="700" fill="#2b2a27">受，然</text>
<rect x="343.9" y="1039.9" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="1069.9" font-size="19" font-weight="700" fill="#2b2a27">第三、 先观照心识；如果你的</text>
<text x="361.9" y="1095.6" font-size="19" font-weight="700" fill="#2b2a27">观智能够很清楚地观照心识，可</text>
<text x="361.9" y="1121.2" font-size="19" font-weight="700" fill="#2b2a27">以先观照</text>
<line x1="691.9" y1="1067.5" x2="841.9" y2="1067.5" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="1058.9" font-size="16" font-weight="500" fill="#2b2a27">（四）受念处的特点</text>
<line x1="691.9" y1="1107.1" x2="937.9" y2="1107.1" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="1098.5" font-size="16" font-weight="500" fill="#2b2a27">（五）沙利子尊者如何证悟阿拉汉</text>
<rect x="343.9" y="1148.9" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="1178.9" font-size="19" font-weight="700" fill="#2b2a27">三、更高的观智阶段</text>
</svg>