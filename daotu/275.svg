<rect x="30" y="287.3" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="324.3" font-size="26" font-weight="700" fill="#fff">第79讲-摄缘-十二</text>
<text x="48.0" y="359.4" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘79-</text>
<text x="48.0" y="394.5" font-size="26" font-weight="700" fill="#fff">离路心的缘-取缘有</text>
<rect x="337.7" y="30.0" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、以义</text>
<rect x="337.7" y="87.7" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="117.7" font-size="19" font-weight="700" fill="#2b2a27">二、以法</text>
<rect x="337.7" y="238.9" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="268.9" font-size="19" font-weight="700" fill="#2b2a27">三、以有益</text>
<line x1="514.7" y1="194.5" x2="787.6" y2="194.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="164.3" font-size="16" font-weight="500" fill="#2b2a27">1、三世因果位置不同。这里“有”的解</text>
<text x="517.7" y="185.9" font-size="16" font-weight="500" fill="#2b2a27">释和前面的“行”的解</text>
<line x1="514.7" y1="255.7" x2="785.6" y2="255.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="225.5" font-size="16" font-weight="500" fill="#2b2a27">2、内容详略不同。前面的解释只说思</text>
<text x="517.7" y="247.1" font-size="16" font-weight="500" fill="#2b2a27">为行，如说</text>
<line x1="514.7" y1="316.9" x2="780.5" y2="316.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="286.7" font-size="16" font-weight="500" fill="#2b2a27">3、缘所生法不同。前面“行缘识”的‘</text>
<text x="517.7" y="308.3" font-size="16" font-weight="500" fill="#2b2a27">行’只是识之缘的业思</text>
<line x1="514.7" y1="378.1" x2="787.6" y2="378.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="347.9" font-size="16" font-weight="500" fill="#2b2a27">4、本质义的差别。在“无明缘行”一句</text>
<text x="517.7" y="369.5" font-size="16" font-weight="500" fill="#2b2a27">中曾说福行等的善与不</text>
<rect x="337.7" y="390.1" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="420.1" font-size="19" font-weight="700" fill="#2b2a27">四、以区别并以概括</text>
<rect x="337.7" y="447.8" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="477.8" font-size="19" font-weight="700" fill="#2b2a27">五、以概括</text>
<rect x="337.7" y="536.0" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="355.7" y="566.0" font-size="19" font-weight="700" fill="#2b2a27">六、谁对谁为缘</text>
<line x1="552.7" y1="533.0" x2="679.6" y2="533.0" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="524.4" font-size="16" font-weight="500" fill="#2b2a27">（一）欲取-业有</text>
<line x1="552.7" y1="572.6" x2="711.6" y2="572.6" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="564.0" font-size="16" font-weight="500" fill="#2b2a27">（二）另三种取-业有</text>
<line x1="552.7" y1="612.2" x2="695.6" y2="612.2" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="603.6" font-size="16" font-weight="500" fill="#2b2a27">（三）四种取-生有</text>
<rect x="337.7" y="624.2" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="355.7" y="654.2" font-size="19" font-weight="700" fill="#2b2a27">七、如何去除恐惧</text>
</svg>