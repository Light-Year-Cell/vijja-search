<rect x="30" y="868.2" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="905.2" font-size="26" font-weight="700" fill="#fff">第23讲-摄缘-十二</text>
<text x="48.0" y="940.3" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘23-</text>
<text x="48.0" y="975.4" font-size="26" font-weight="700" fill="#fff">释二十四缘-依止缘</text>
<text x="48.0" y="1010.5" font-size="26" font-weight="700" fill="#fff">1</text>
<rect x="337.7" y="136.9" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="166.9" font-size="19" font-weight="700" fill="#2b2a27">一、依止缘经文与释义</text>
<line x1="609.7" y1="173.5" x2="743.7" y2="173.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="164.9" font-size="16" font-weight="500" fill="#2b2a27">（一）经文与释义</text>
<line x1="789.7" y1="54.9" x2="853.4" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="792.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1.缘广释</text>
<line x1="789.7" y1="91.8" x2="881.4" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="792.7" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2.依止缘譬喻</text>
<line x1="789.7" y1="163.6" x2="889.2" y2="163.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="792.7" y="155.7" font-size="14" font-weight="400" fill="#2b2a27">3. 三种依止缘</text>
<line x1="935.2" y1="127.4" x2="1026.5" y2="127.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="938.2" y="119.8" font-size="13" font-weight="400" fill="#2b2a27">（1）俱生依止</text>
<line x1="935.2" y1="162.9" x2="1026.5" y2="162.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="938.2" y="155.4" font-size="13" font-weight="400" fill="#2b2a27">（2）前生依止</text>
<line x1="935.2" y1="198.5" x2="1078.5" y2="198.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="938.2" y="190.9" font-size="13" font-weight="400" fill="#2b2a27">（3）依处所缘前生依止</text>
<line x1="789.7" y1="235.4" x2="1001.2" y2="235.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="792.7" y="227.5" font-size="14" font-weight="400" fill="#2b2a27">4. 俱生、相互、依止三缘之对比</text>
<line x1="789.7" y1="289.4" x2="889.2" y2="289.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="792.7" y="281.5" font-size="14" font-weight="400" fill="#2b2a27">5. 依止缘释义</text>
<line x1="935.2" y1="270.9" x2="1028.0" y2="270.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="938.2" y="263.4" font-size="13" font-weight="400" fill="#2b2a27">(1)俱生依止缘</text>
<line x1="935.2" y1="306.5" x2="1028.0" y2="306.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="938.2" y="298.9" font-size="13" font-weight="400" fill="#2b2a27">(2)前生依止缘</text>
<rect x="337.7" y="866.3" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="896.3" font-size="19" font-weight="700" fill="#2b2a27">二、经文详释</text>
<line x1="533.7" y1="436.9" x2="667.7" y2="436.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="428.3" font-size="16" font-weight="500" fill="#2b2a27">（一）俱生依止缘</text>
<line x1="713.7" y1="343.4" x2="813.2" y2="343.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="716.7" y="335.5" font-size="14" font-weight="400" fill="#2b2a27">1. 四种非色蕴</text>
<line x1="713.7" y1="380.2" x2="785.2" y2="380.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="716.7" y="372.4" font-size="14" font-weight="400" fill="#2b2a27">2. 四大种</text>
<line x1="713.7" y1="417.1" x2="841.2" y2="417.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="716.7" y="409.2" font-size="14" font-weight="400" fill="#2b2a27">3. 入生刹那的名色</text>
<line x1="713.7" y1="454.0" x2="897.2" y2="454.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="716.7" y="446.1" font-size="14" font-weight="400" fill="#2b2a27">4. 诸心、心所法对俱生诸色</text>
<line x1="713.7" y1="490.9" x2="841.2" y2="490.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="716.7" y="483.0" font-size="14" font-weight="400" fill="#2b2a27">5. 大种对诸所造色</text>
<line x1="713.7" y1="527.8" x2="855.2" y2="527.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="716.7" y="519.9" font-size="14" font-weight="400" fill="#2b2a27">6. 俱生名色相互依存</text>
<line x1="533.7" y1="567.4" x2="667.7" y2="567.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="558.8" font-size="16" font-weight="500" fill="#2b2a27">（二）前生依止缘</text>
<line x1="713.7" y1="564.7" x2="841.2" y2="564.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="716.7" y="556.8" font-size="14" font-weight="400" fill="#2b2a27">1. 依处前生依止缘</text>
<line x1="887.2" y1="563.4" x2="1052.3" y2="563.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="890.2" y="555.8" font-size="13" font-weight="400" fill="#2b2a27">(1) 五识依止于五内处生起</text>
<line x1="533.7" y1="628.6" x2="811.7" y2="628.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="598.4" font-size="16" font-weight="500" fill="#2b2a27">（一）能发挥作用，于眼及色等的根门</text>
<text x="536.7" y="620.0" font-size="16" font-weight="500" fill="#2b2a27">、所缘、而心、心所法各</text>
<line x1="533.7" y1="689.9" x2="804.6" y2="689.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="659.6" font-size="16" font-weight="500" fill="#2b2a27">（二） 前来根门处的心和心所的扩展</text>
<text x="536.7" y="681.2" font-size="16" font-weight="500" fill="#2b2a27"> （扩展义） ， 把来到[六门及</text>
<line x1="533.7" y1="751.1" x2="797.6" y2="751.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="720.9" font-size="16" font-weight="500" fill="#2b2a27">（三） 长期牵引： 只要在无始轮回</text>
<text x="536.7" y="742.5" font-size="16" font-weight="500" fill="#2b2a27">中转起的极为漫长的轮回之苦</text>
<line x1="533.7" y1="812.3" x2="797.6" y2="812.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="782.1" font-size="16" font-weight="500" fill="#2b2a27">（一） 令倾向故， 由于世间的诸界</text>
<text x="536.7" y="803.7" font-size="16" font-weight="500" fill="#2b2a27">决定的原因， 令向于种种的轮</text>
<line x1="533.7" y1="873.5" x2="806.6" y2="873.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="843.3" font-size="16" font-weight="500" fill="#2b2a27">（二） 负运故， 由有情负于界， 如</text>
<text x="536.7" y="864.9" font-size="16" font-weight="500" fill="#2b2a27">运夫的负重 （有情被“界”牵</text>
<line x1="533.7" y1="934.7" x2="811.7" y2="934.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="904.5" font-size="16" font-weight="500" fill="#2b2a27">（三）配给故，世间的诸界只配给苦，</text>
<text x="536.7" y="926.1" font-size="16" font-weight="500" fill="#2b2a27">不如人意之故</text>
<line x1="533.7" y1="995.9" x2="811.7" y2="995.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="965.7" font-size="16" font-weight="500" fill="#2b2a27">（四）因此令向故，由于此等（诸界）</text>
<text x="536.7" y="987.3" font-size="16" font-weight="500" fill="#2b2a27">为因，而有情倾向于轮回</text>
<line x1="533.7" y1="1379.7" x2="797.6" y2="1379.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="1349.5" font-size="16" font-weight="500" fill="#2b2a27">（五） 此中保持， 是说把苦保持于</text>
<text x="536.7" y="1371.1" font-size="16" font-weight="500" fill="#2b2a27">此等 （诸界） 之中的意思 （界</text>
<line x1="843.6" y1="1051.7" x2="1111.1" y2="1051.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="846.6" y="1024.9" font-size="14" font-weight="400" fill="#2b2a27">(1)前生缘指已达到住时的前生色法令后生</text>
<text x="846.6" y="1043.8" font-size="14" font-weight="400" fill="#2b2a27">名聚生起，分为所缘</text>
<line x1="843.6" y1="1107.5" x2="1111.1" y2="1107.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="846.6" y="1080.7" font-size="14" font-weight="400" fill="#2b2a27">(2)根缘分为俱生根缘与依处前生根缘，在</text>
<text x="846.6" y="1099.6" font-size="14" font-weight="400" fill="#2b2a27">此指后者。即眼根、</text>
<line x1="843.6" y1="1163.3" x2="1111.1" y2="1163.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="846.6" y="1136.5" font-size="14" font-weight="400" fill="#2b2a27">(3)不相应缘，因为作为缘法的依处是色法</text>
<text x="846.6" y="1155.4" font-size="14" font-weight="400" fill="#2b2a27">，作为缘所生法的五</text>
<line x1="843.6" y1="1219.1" x2="1112.8" y2="1219.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="846.6" y="1192.3" font-size="14" font-weight="400" fill="#2b2a27">(4)有缘， 在欲界与色界， 名法一定要有</text>
<text x="846.6" y="1211.2" font-size="14" font-weight="400" fill="#2b2a27">依处才能生起； 换言之</text>
<line x1="843.6" y1="1274.9" x2="1111.1" y2="1274.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="846.6" y="1248.1" font-size="14" font-weight="400" fill="#2b2a27">(5)不离去缘，依处以它的不离去支持名法</text>
<text x="846.6" y="1267.0" font-size="14" font-weight="400" fill="#2b2a27">生起及存续</text>
<line x1="843.6" y1="1311.8" x2="1063.0" y2="1311.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="846.6" y="1303.9" font-size="14" font-weight="400" fill="#2b2a27">(2) 意界和意识界依止于心处生起</text>
<line x1="843.6" y1="1367.6" x2="1111.1" y2="1367.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="846.6" y="1340.8" font-size="14" font-weight="400" fill="#2b2a27">(1)生命期间所有七十五种名聚生起的前一</text>
<text x="846.6" y="1359.7" font-size="14" font-weight="400" fill="#2b2a27">个心识刹那(包括结</text>
<line x1="843.6" y1="1423.4" x2="1111.1" y2="1423.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="846.6" y="1396.6" font-size="14" font-weight="400" fill="#2b2a27">(2)当一位三果圣者或者包括佛陀、独觉佛</text>
<text x="846.6" y="1415.5" font-size="14" font-weight="400" fill="#2b2a27">在内的阿拉汉圣者从</text>
