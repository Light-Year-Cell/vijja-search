<text x="846.6" y="1527.1" font-size="14" font-weight="400" fill="#2b2a27">开始的三种意界和七</text>
<line x1="843.6" y1="1590.8" x2="1111.1" y2="1590.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="846.6" y="1564.0" font-size="14" font-weight="400" fill="#2b2a27">(2)三果圣者或阿拉汉圣者从灭尽定出定之</text>
<text x="846.6" y="1582.9" font-size="14" font-weight="400" fill="#2b2a27">后所生起的三果果心</text>
<line x1="843.6" y1="1646.5" x2="1111.1" y2="1646.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="846.6" y="1619.8" font-size="14" font-weight="400" fill="#2b2a27">(3)五蕴地的生命在临死过程包含有十五种</text>
<text x="846.6" y="1638.7" font-size="14" font-weight="400" fill="#2b2a27">有分心(不包括四种</text>
<line x1="843.6" y1="1702.3" x2="1109.4" y2="1702.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="846.6" y="1675.5" font-size="14" font-weight="400" fill="#2b2a27">（3）依处前生依止缘的缘法、缘所生法与</text>
