<text x="846.6" y="1452.4" font-size="14" font-weight="400" fill="#2b2a27">(3)临死时，在死亡心灭去之前的第十七个</text>
<text x="846.6" y="1471.3" font-size="14" font-weight="400" fill="#2b2a27">心识刹那生时所生起</text>
