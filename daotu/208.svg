<rect x="30" y="298.9" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="335.9" font-size="26" font-weight="700" fill="#fff">第12讲-摄缘-十二</text>
<text x="48.0" y="371.0" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘12-</text>
<text x="48.0" y="406.1" font-size="26" font-weight="700" fill="#fff">释二十四缘-所缘缘</text>
<text x="48.0" y="441.2" font-size="26" font-weight="700" fill="#fff">1</text>
<rect x="337.7" y="40.8" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="70.8" font-size="19" font-weight="700" fill="#2b2a27">一、所缘</text>
<line x1="495.7" y1="57.6" x2="661.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）所缘的字面含义</text>
<line x1="495.7" y1="97.2" x2="622.6" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">(二）所缘的譬喻</text>
<rect x="337.7" y="346.3" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="376.3" font-size="19" font-weight="700" fill="#2b2a27">二、所缘缘浅释</text>
<line x1="552.7" y1="136.8" x2="718.7" y2="136.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（一）缘法与缘所生法</text>
<line x1="552.7" y1="176.4" x2="702.7" y2="176.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">（二）所缘缘的譬喻</text>
<line x1="552.7" y1="216.0" x2="654.7" y2="216.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="207.4" font-size="16" font-weight="500" fill="#2b2a27">（三）缘广释</text>
<line x1="552.7" y1="351.7" x2="750.7" y2="351.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="343.1" font-size="16" font-weight="500" fill="#2b2a27">（四）从五门心路看所缘缘</text>
<line x1="796.7" y1="271.8" x2="1064.2" y2="271.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="799.7" y="245.0" font-size="14" font-weight="400" fill="#2b2a27">1. 色处对眼识界及其相应诸法以所缘缘为</text>
<text x="799.7" y="263.9" font-size="14" font-weight="400" fill="#2b2a27">缘</text>
<line x1="796.7" y1="308.7" x2="1064.2" y2="308.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="799.7" y="300.8" font-size="14" font-weight="400" fill="#2b2a27">2. 色处对意界及其相应诸法以所缘缘为缘</text>
<line x1="796.7" y1="364.5" x2="1064.2" y2="364.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="799.7" y="337.7" font-size="14" font-weight="400" fill="#2b2a27">3. 色处对意识界及其相应诸法以所缘缘为</text>
<text x="799.7" y="356.6" font-size="14" font-weight="400" fill="#2b2a27">缘</text>
<line x1="796.7" y1="401.4" x2="980.2" y2="401.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="799.7" y="393.5" font-size="14" font-weight="400" fill="#2b2a27">4. 所缘缘对整条心路起作用</text>
<line x1="796.7" y1="438.3" x2="854.2" y2="438.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="799.7" y="430.4" font-size="14" font-weight="400" fill="#2b2a27">5. 总结</text>
<line x1="552.7" y1="513.9" x2="734.7" y2="513.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="505.3" font-size="16" font-weight="500" fill="#2b2a27">（五）所缘缘的缘所生法</text>
<line x1="780.7" y1="494.1" x2="1048.2" y2="494.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="783.7" y="467.3" font-size="14" font-weight="400" fill="#2b2a27">(1)五识界：指眼、耳、鼻、舌、身五识，</text>
<text x="783.7" y="486.2" font-size="14" font-weight="400" fill="#2b2a27">它们都是成对的，每</text>
<line x1="780.7" y1="549.9" x2="1048.2" y2="549.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="783.7" y="523.1" font-size="14" font-weight="400" fill="#2b2a27">(3)意识界：包括除双五识和三种意界心之</text>
<text x="783.7" y="542.0" font-size="14" font-weight="400" fill="#2b2a27">外的七十六种心。包</text>
<line x1="552.7" y1="589.5" x2="686.7" y2="589.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="580.9" font-size="16" font-weight="500" fill="#2b2a27">（六）所缘的缘力</text>
<line x1="552.7" y1="629.1" x2="750.7" y2="629.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="620.5" font-size="16" font-weight="500" fill="#2b2a27">（七）所缘缘与因缘之区别</text>
<rect x="337.7" y="671.7" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="701.7" font-size="19" font-weight="700" fill="#2b2a27">三、五门心路看所缘缘</text>
<line x1="609.7" y1="668.7" x2="775.7" y2="668.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="660.1" font-size="16" font-weight="500" fill="#2b2a27">（一）心乐于抓取所缘</text>
<line x1="609.7" y1="708.3" x2="823.7" y2="708.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="699.7" font-size="16" font-weight="500" fill="#2b2a27">（二）所缘好比造业的原材料</text>
<line x1="609.7" y1="747.9" x2="807.7" y2="747.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="739.3" font-size="16" font-weight="500" fill="#2b2a27">（三）最吸引心的五门所缘</text>
</svg>