<text x="48.0" y="295.6" font-size="26" font-weight="700" fill="#fff">的四食1</text>
<rect x="343.9" y="49.3" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="79.3" font-size="19" font-weight="700" fill="#2b2a27">一、观增上（慧增上）</text>
