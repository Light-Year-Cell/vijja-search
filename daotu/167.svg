<text x="846.9" y="123.5" font-size="14" font-weight="400" fill="#2b2a27">2. 思慧</text>
<rect x="343.9" y="143.4" width="293.6" height="99.0" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="173.4" font-size="19" font-weight="700" fill="#2b2a27">四、 绝不会对任何人有嫉妒。</text>
<text x="361.9" y="199.1" font-size="19" font-weight="700" fill="#2b2a27"> 拥有如此特质的人非沙咖天帝</text>
<text x="361.9" y="224.7" font-size="19" font-weight="700" fill="#2b2a27">能造出来</text>
<line x1="683.6" y1="171.0" x2="748.4" y2="171.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="686.6" y="162.4" font-size="16" font-weight="500" fill="#2b2a27">3. 修慧</text>
<rect x="343.9" y="318.5" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="348.5" font-size="19" font-weight="700" fill="#2b2a27">二、维持轮回的四食</text>
