<text x="599.9" y="346.5" font-size="16" font-weight="500" fill="#2b2a27">（二）色食缘</text>
<line x1="744.9" y1="316.9" x2="920.6" y2="316.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="747.9" y="309.0" font-size="14" font-weight="400" fill="#2b2a27">1.外在的食素与内在的食素</text>
<line x1="744.9" y1="353.8" x2="906.6" y2="353.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="747.9" y="345.9" font-size="14" font-weight="400" fill="#2b2a27">2.食物对身体以食缘为缘</text>
