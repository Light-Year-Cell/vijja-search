<rect x="30" y="628.6" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="665.6" font-size="26" font-weight="700" fill="#fff">第27讲-摄缘-十二</text>
<text x="48.0" y="700.7" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘27-</text>
<text x="48.0" y="735.8" font-size="26" font-weight="700" fill="#fff">释二十四缘-亲依止</text>
<text x="48.0" y="770.9" font-size="26" font-weight="700" fill="#fff">缘3</text>
<rect x="337.7" y="442.4" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="472.4" font-size="19" font-weight="700" fill="#2b2a27">一、前前诸善法对后后诸不善法</text>
<line x1="685.7" y1="57.6" x2="841.4" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">(1)指 “不是立刻的”</text>
<line x1="685.7" y1="97.2" x2="857.4" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">(2)指 “在某些情况下”</text>
<line x1="685.7" y1="276.8" x2="835.7" y2="276.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="268.2" font-size="16" font-weight="500" fill="#2b2a27">（一）所缘亲依止缘</text>
<line x1="881.7" y1="169.0" x2="1079.2" y2="169.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="161.1" font-size="14" font-weight="400" fill="#2b2a27">1. 缘法、缘所生法及所摄诸缘</text>
<line x1="1125.2" y1="132.8" x2="1255.5" y2="132.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1128.2" y="125.2" font-size="13" font-weight="400" fill="#2b2a27">（1）缘法、缘所生法</text>
<line x1="1125.2" y1="168.3" x2="1372.5" y2="168.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1128.2" y="160.8" font-size="13" font-weight="400" fill="#2b2a27">（2）极重视的所缘才能成为所缘亲依止缘</text>
<line x1="1125.2" y1="203.9" x2="1216.5" y2="203.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1128.2" y="196.3" font-size="13" font-weight="400" fill="#2b2a27">（3）所摄诸缘</text>
<line x1="881.7" y1="391.3" x2="1143.0" y2="391.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="364.5" font-size="14" font-weight="400" fill="#2b2a27">2.《发趣论·问分》之“善法对不善法的所</text>
<text x="884.7" y="383.4" font-size="14" font-weight="400" fill="#2b2a27">缘亲依止缘”</text>
<line x1="1189.0" y1="239.4" x2="1397.3" y2="239.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="231.9" font-size="13" font-weight="400" fill="#2b2a27">（1）对布施等敬重而生起贪、邪见</text>
<line x1="1189.0" y1="292.5" x2="1436.3" y2="292.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="267.4" font-size="13" font-weight="400" fill="#2b2a27">（1）这与戒、定、慧相应（持戒、修定、</text>
<text x="1192.0" y="285.0" font-size="13" font-weight="400" fill="#2b2a27">修慧十万年） </text>
<line x1="1189.0" y1="345.6" x2="1436.3" y2="345.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="320.5" font-size="13" font-weight="400" fill="#2b2a27">（2）受施者是佛陀与有十万比库众的僧团</text>
<text x="1192.0" y="338.1" font-size="13" font-weight="400" fill="#2b2a27">，这是世间无上的福</text>
<line x1="1189.0" y1="381.2" x2="1332.3" y2="381.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="373.6" font-size="13" font-weight="400" fill="#2b2a27">（3）布施物是如法所得</text>
<line x1="1189.0" y1="434.3" x2="1437.9" y2="434.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="409.2" font-size="13" font-weight="400" fill="#2b2a27">（4） 西瓦离尊者的心在布施前、 布施时</text>
<text x="1192.0" y="426.7" font-size="13" font-weight="400" fill="#2b2a27">与布施后都欢喜、 明净、</text>
<line x1="1189.0" y1="487.4" x2="1436.3" y2="487.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="462.3" font-size="13" font-weight="400" fill="#2b2a27">（5）由于西瓦离尊者已修习观禅，他了知</text>
<text x="1192.0" y="479.8" font-size="13" font-weight="400" fill="#2b2a27">缘起，亦即，他深信</text>
<line x1="1189.0" y1="522.9" x2="1384.3" y2="522.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="515.4" font-size="13" font-weight="400" fill="#2b2a27">（2）对禅那敬重而生起贪、邪见</text>
<line x1="685.7" y1="685.7" x2="835.7" y2="685.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="677.1" font-size="16" font-weight="500" fill="#2b2a27">（二）自然亲依止缘</text>
<line x1="881.7" y1="559.8" x2="1001.4" y2="559.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="551.9" font-size="14" font-weight="400" fill="#2b2a27">1.缘法与缘所生法</text>
<line x1="881.7" y1="672.0" x2="1143.0" y2="672.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="645.2" font-size="14" font-weight="400" fill="#2b2a27">2.《发趣论·问分》之“善法对不善法的自</text>
<text x="884.7" y="664.1" font-size="14" font-weight="400" fill="#2b2a27">然亲依止缘”</text>
<line x1="1189.0" y1="595.4" x2="1319.3" y2="595.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="587.8" font-size="13" font-weight="400" fill="#2b2a27">（1）分享欲、表达欲</text>
<line x1="1189.0" y1="630.9" x2="1410.3" y2="630.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="623.4" font-size="13" font-weight="400" fill="#2b2a27">（2）对众生的悲悯失坏，恨铁不成钢</text>
<line x1="1189.0" y1="684.0" x2="1436.3" y2="684.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="658.9" font-size="13" font-weight="400" fill="#2b2a27">（3）低劣的善思，布施、持戒只是为了发</text>
<text x="1192.0" y="676.4" font-size="13" font-weight="400" fill="#2b2a27">财、名闻利养</text>
<line x1="1189.0" y1="737.1" x2="1436.3" y2="737.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="712.0" font-size="13" font-weight="400" fill="#2b2a27">（4）以正法自居，自赞毁他，批评别人。</text>
<text x="1192.0" y="729.5" font-size="13" font-weight="400" fill="#2b2a27">有些人学习佛法后自</text>
<line x1="881.7" y1="808.9" x2="1127.4" y2="808.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="801.0" font-size="14" font-weight="400" fill="#2b2a27">3.善法对不善法的自然亲依止缘的表现</text>
<line x1="1173.4" y1="772.6" x2="1264.6" y2="772.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1176.4" y="765.1" font-size="13" font-weight="400" fill="#2b2a27">（1）迭瓦达德</text>
<line x1="1173.4" y1="808.2" x2="1368.6" y2="808.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1176.4" y="800.6" font-size="13" font-weight="400" fill="#2b2a27">（2）禅修的善法导致不善法生起</text>
<line x1="1173.4" y1="843.7" x2="1381.6" y2="843.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1176.4" y="836.2" font-size="13" font-weight="400" fill="#2b2a27">（3）善法成为不善法亲依止的过患</text>
<line x1="685.7" y1="900.5" x2="803.7" y2="900.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="891.9" font-size="16" font-weight="500" fill="#2b2a27">（三）规避不善</text>
<line x1="849.7" y1="880.6" x2="1033.2" y2="880.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="852.7" y="872.7" font-size="14" font-weight="400" fill="#2b2a27">1. 善法导致不善法生起的因</text>
<line x1="849.7" y1="917.5" x2="977.2" y2="917.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="852.7" y="909.6" font-size="14" font-weight="400" fill="#2b2a27">2. 规避不善法生起</text>
<rect x="337.7" y="929.5" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="959.5" font-size="19" font-weight="700" fill="#2b2a27">二、结语</text>
</svg>