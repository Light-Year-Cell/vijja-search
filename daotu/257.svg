<rect x="30" y="118.3" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="155.3" font-size="26" font-weight="700" fill="#fff">第61讲-摄缘-十二</text>
<text x="48.0" y="190.4" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘61-</text>
<text x="48.0" y="225.5" font-size="26" font-weight="700" fill="#fff">福行养慧</text>
<rect x="337.7" y="30.0" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、戒德是根柢</text>
<rect x="337.7" y="87.7" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="117.7" font-size="19" font-weight="700" fill="#2b2a27">二、从自己内心不易变更的惯性</text>
<text x="355.7" y="143.3" font-size="19" font-weight="700" fill="#2b2a27">出发，塑造起新的状态</text>
<rect x="337.7" y="171.0" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="201.0" font-size="19" font-weight="700" fill="#2b2a27">三、佛教是一套完整的生活方式</text>
<rect x="337.7" y="228.6" width="285.3" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="258.6" font-size="19" font-weight="700" fill="#2b2a27">四、福德——洗涤与净化心流者</text>
<rect x="337.7" y="286.2" width="283.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="316.2" font-size="19" font-weight="700" fill="#2b2a27">五、福德净化心相续流的依据</text>
