<rect x="30" y="650.0" width="267.9" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="687.0" font-size="26" font-weight="700" fill="#fff">172讲-摄集20-摄菩</text>
<text x="48.0" y="722.1" font-size="26" font-weight="700" fill="#fff">提分-身念处-入出</text>
<text x="48.0" y="757.2" font-size="26" font-weight="700" fill="#fff">息念1</text>
<rect x="343.9" y="30.0" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、三十七菩提分之定义</text>
<rect x="343.9" y="237.0" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="267.0" font-size="19" font-weight="700" fill="#2b2a27">二、菩提分之概要</text>
<line x1="577.9" y1="115.2" x2="711.9" y2="115.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="106.7" font-size="16" font-weight="500" fill="#2b2a27">（一）简述菩提分</text>
<line x1="577.9" y1="154.8" x2="679.9" y2="154.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="146.2" font-size="16" font-weight="500" fill="#2b2a27">（二）四念处</text>
<line x1="577.9" y1="194.4" x2="679.9" y2="194.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="185.8" font-size="16" font-weight="500" fill="#2b2a27">（三）四正勤</text>
<line x1="577.9" y1="234.0" x2="679.9" y2="234.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="225.4" font-size="16" font-weight="500" fill="#2b2a27">（四）四神足</text>
<line x1="577.9" y1="273.6" x2="663.9" y2="273.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="265.0" font-size="16" font-weight="500" fill="#2b2a27">（五）五根</text>
<line x1="577.9" y1="313.2" x2="663.9" y2="313.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="304.6" font-size="16" font-weight="500" fill="#2b2a27">（六）五力</text>
<line x1="577.9" y1="352.9" x2="679.9" y2="352.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="344.2" font-size="16" font-weight="500" fill="#2b2a27">（七）七觉支</text>
<line x1="577.9" y1="392.5" x2="695.9" y2="392.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="383.9" font-size="16" font-weight="500" fill="#2b2a27">（八）八支圣道</text>
<line x1="577.9" y1="432.1" x2="791.9" y2="432.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="423.5" font-size="16" font-weight="500" fill="#2b2a27">（九）菩提分对应的心理素质</text>
<rect x="343.9" y="569.1" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="599.1" font-size="19" font-weight="700" fill="#2b2a27">三、四念处</text>
<line x1="520.9" y1="471.7" x2="743.9" y2="471.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="463.1" font-size="16" font-weight="500" fill="#2b2a27">(一）于《大念处经》中的记载</text>
<line x1="520.9" y1="575.2" x2="638.9" y2="575.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="566.6" font-size="16" font-weight="500" fill="#2b2a27">（二）单一道路</text>
<line x1="684.9" y1="527.5" x2="950.8" y2="527.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="687.9" y="500.7" font-size="14" font-weight="400" fill="#2b2a27">1、本质上这不是一条双向的道路，或者这</text>
<text x="687.9" y="519.6" font-size="14" font-weight="400" fill="#2b2a27">是一条“单独的路”，因为</text>
<line x1="684.9" y1="583.2" x2="944.6" y2="583.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="687.9" y="556.5" font-size="14" font-weight="400" fill="#2b2a27">2、由于这是上等人的路，因此称为“单一</text>
<text x="687.9" y="575.4" font-size="14" font-weight="400" fill="#2b2a27">的道路”，不是庸俗的、顽</text>
<line x1="684.9" y1="639.0" x2="950.8" y2="639.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="687.9" y="612.2" font-size="14" font-weight="400" fill="#2b2a27">3、在一切有情之中，世尊是最上等之人，</text>
<text x="687.9" y="631.1" font-size="14" font-weight="400" fill="#2b2a27">因此，这条路又称为“世尊</text>
<line x1="520.9" y1="700.2" x2="798.9" y2="700.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="670.0" font-size="16" font-weight="500" fill="#2b2a27">（三）小龙三藏长老与小须摩三藏长老</text>
<text x="523.9" y="691.6" font-size="16" font-weight="500" fill="#2b2a27">的讨论</text>
<line x1="520.9" y1="739.9" x2="734.9" y2="739.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="731.2" font-size="16" font-weight="500" fill="#2b2a27">（四）修行四念处的七项利益</text>
<rect x="343.9" y="751.9" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="781.9" font-size="19" font-weight="700" fill="#2b2a27">四、四念处与调伏者的根性</text>
<rect x="343.9" y="809.5" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="839.5" font-size="19" font-weight="700" fill="#2b2a27">五、修习四念处的二十一种方法</text>
<rect x="343.9" y="867.1" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="897.1" font-size="19" font-weight="700" fill="#2b2a27">六、入出息念与其他业处的差别</text>
<rect x="343.9" y="924.8" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="361.9" y="954.8" font-size="19" font-weight="700" fill="#2b2a27">七、成就入出息念殊胜定力的两</text>
<text x="361.9" y="980.4" font-size="19" font-weight="700" fill="#2b2a27">阶段标准</text>
<rect x="343.9" y="1008.1" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#8a6d3b" stroke-width="2.2"/>
<text x="361.9" y="1038.1" font-size="19" font-weight="700" fill="#2b2a27">第一、持续专注微息四个小时、</text>
<text x="361.9" y="1063.8" font-size="19" font-weight="700" fill="#2b2a27">五个小时无妄念</text>
<rect x="343.9" y="1091.4" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="1121.4" font-size="19" font-weight="700" fill="#2b2a27">第二、当你能够持续专注微息四</text>
<text x="361.9" y="1147.0" font-size="19" font-weight="700" fill="#2b2a27">个小时、五个小时以后，在心能</text>
<text x="361.9" y="1172.7" font-size="19" font-weight="700" fill="#2b2a27">自然</text>
<rect x="343.9" y="1349.7" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="1379.7" font-size="19" font-weight="700" fill="#2b2a27">八、修习入出息之功德</text>
<line x1="615.9" y1="1227.9" x2="813.9" y2="1227.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1219.3" font-size="16" font-weight="500" fill="#2b2a27">（一）非常寂静故有大功德</text>
<line x1="615.9" y1="1267.5" x2="861.9" y2="1267.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1258.9" font-size="16" font-weight="500" fill="#2b2a27">（二）可迅速去除妄想故有大功德</text>
<line x1="615.9" y1="1307.1" x2="845.9" y2="1307.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1298.5" font-size="16" font-weight="500" fill="#2b2a27">（三）可得圣道圣果故有大功德</text>
<line x1="615.9" y1="1346.7" x2="861.9" y2="1346.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1338.1" font-size="16" font-weight="500" fill="#2b2a27">（四）命终时预知时至故有大功德</text>
<line x1="615.9" y1="1386.3" x2="877.9" y2="1386.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1377.7" font-size="16" font-weight="500" fill="#2b2a27">（五）三世诸佛证悟殊胜成就的基础</text>
<line x1="615.9" y1="1425.9" x2="829.9" y2="1425.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1417.3" font-size="16" font-weight="500" fill="#2b2a27">（六）佛陀乐住入出息念之定</text>
<line x1="615.9" y1="1465.5" x2="861.9" y2="1465.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1456.9" font-size="16" font-weight="500" fill="#2b2a27">（七）佛陀经常教导修习入出息念</text>
<line x1="615.9" y1="1505.1" x2="829.9" y2="1505.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1496.5" font-size="16" font-weight="500" fill="#2b2a27">（八）什么是禅那、定与正定</text>
<line x1="615.9" y1="1544.7" x2="733.9" y2="1544.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1536.1" font-size="16" font-weight="500" fill="#2b2a27">（九）初禅之乐</text>
</svg>