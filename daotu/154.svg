<rect x="30" y="169.7" width="253.4" height="92.2" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="206.7" font-size="26" font-weight="700" fill="#fff">154讲-摄集2-四漏</text>
<text x="48.0" y="241.8" font-size="26" font-weight="700" fill="#fff">之无明2</text>
<rect x="329.4" y="71.4" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="347.4" y="101.4" font-size="19" font-weight="700" fill="#2b2a27">一、总说摄集，回顾前六品</text>
<line x1="639.4" y1="57.6" x2="869.4" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="642.4" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）应知、应断、应证、应修</text>
<line x1="639.4" y1="118.8" x2="917.4" y2="118.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="642.4" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）如何理解八十九种心只是一个究</text>
<text x="642.4" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">竟法？</text>
<line x1="639.4" y1="158.4" x2="773.4" y2="158.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="642.4" y="149.8" font-size="16" font-weight="500" fill="#2b2a27">（三）不善之概要</text>
<rect x="329.4" y="299.8" width="287.6" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="347.4" y="329.8" font-size="19" font-weight="700" fill="#2b2a27">二、四漏 —— 欲漏、有漏、邪</text>
<text x="347.4" y="355.4" font-size="19" font-weight="700" fill="#2b2a27">见漏和无明漏</text>
<line x1="662.9" y1="219.6" x2="940.9" y2="219.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="665.9" y="189.4" font-size="16" font-weight="500" fill="#2b2a27">（一）要对照到内心里面去观察四漏，</text>
<text x="665.9" y="211.0" font-size="16" font-weight="500" fill="#2b2a27">在日常生活中就要观察</text>
<line x1="662.9" y1="259.2" x2="844.9" y2="259.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="665.9" y="250.6" font-size="16" font-weight="500" fill="#2b2a27">（二）什么是痴与无明？</text>
<line x1="662.9" y1="298.8" x2="908.9" y2="298.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="665.9" y="290.2" font-size="16" font-weight="500" fill="#2b2a27">（三）从十二缘起支无明引发不善</text>
<line x1="662.9" y1="360.0" x2="940.9" y2="360.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="665.9" y="329.8" font-size="16" font-weight="500" fill="#2b2a27">（四）认知移情，观自他双方的无明、</text>
<text x="665.9" y="351.4" font-size="16" font-weight="500" fill="#2b2a27">爱、取</text>
<line x1="662.9" y1="399.6" x2="860.9" y2="399.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="665.9" y="391.0" font-size="16" font-weight="500" fill="#2b2a27">（五）果报如此，速行可变</text>
<line x1="662.9" y1="439.2" x2="828.9" y2="439.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="665.9" y="430.6" font-size="16" font-weight="500" fill="#2b2a27">（六）不善法伤害自他</text>
<line x1="662.9" y1="500.4" x2="926.8" y2="500.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="665.9" y="470.2" font-size="16" font-weight="500" fill="#2b2a27">（七）四种想——慧相应的想、识相应</text>
<text x="665.9" y="491.8" font-size="16" font-weight="500" fill="#2b2a27">的想、定相应的想、出世</text>
</svg>