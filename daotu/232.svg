<rect x="30" y="591.4" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="628.4" font-size="26" font-weight="700" fill="#fff">第36讲-摄缘-十二</text>
<text x="48.0" y="663.5" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘36-</text>
<text x="48.0" y="698.6" font-size="26" font-weight="700" fill="#fff">释二十四缘-前生缘</text>
<rect x="337.7" y="157.3" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="187.3" font-size="19" font-weight="700" fill="#2b2a27">一、经文、释义与譬喻</text>
<line x1="609.7" y1="57.6" x2="727.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）经典原文</text>
<line x1="609.7" y1="142.2" x2="775.7" y2="142.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="133.6" font-size="16" font-weight="500" fill="#2b2a27">（二）前生缘巴利释义</text>
<line x1="821.7" y1="94.5" x2="1019.2" y2="94.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="824.7" y="86.6" font-size="14" font-weight="400" fill="#2b2a27">1. 缘法比缘所生法更靠前生起</text>
<line x1="821.7" y1="150.3" x2="1089.2" y2="150.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="824.7" y="123.5" font-size="14" font-weight="400" fill="#2b2a27">2. 缘所生法在缘法生起的生时刹那之后，</text>
<text x="824.7" y="142.4" font-size="14" font-weight="400" fill="#2b2a27">达到住时刹那的期间</text>
<line x1="821.7" y1="187.2" x2="1075.2" y2="187.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="824.7" y="179.3" font-size="14" font-weight="400" fill="#2b2a27">3. 没有前生的缘法就没有后面的缘生法</text>
<line x1="609.7" y1="226.8" x2="759.7" y2="226.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="218.2" font-size="16" font-weight="500" fill="#2b2a27">（三）前生缘的譬喻</text>
<line x1="609.7" y1="341.1" x2="887.7" y2="341.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="310.9" font-size="16" font-weight="500" fill="#2b2a27">（四）依止缘、所缘缘、前生缘三缘比</text>
<text x="612.7" y="332.5" font-size="16" font-weight="500" fill="#2b2a27">较</text>
<line x1="933.7" y1="282.6" x2="1201.2" y2="282.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="936.7" y="255.8" font-size="14" font-weight="400" fill="#2b2a27">(1)前生缘的第一段跟依止缘内容完全相同</text>
<text x="936.7" y="274.7" font-size="14" font-weight="400" fill="#2b2a27">，只是缘力不同。缘</text>
<line x1="933.7" y1="338.4" x2="1201.2" y2="338.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="936.7" y="311.6" font-size="14" font-weight="400" fill="#2b2a27">(2)前生缘的第二段跟所缘缘内容基本相同</text>
<text x="936.7" y="330.5" font-size="14" font-weight="400" fill="#2b2a27">，但所缘缘还多一句</text>
<line x1="933.7" y1="394.2" x2="1201.2" y2="394.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="936.7" y="367.4" font-size="14" font-weight="400" fill="#2b2a27">(3)前生缘的第三段和依止缘的内容基本相</text>
<text x="936.7" y="386.3" font-size="14" font-weight="400" fill="#2b2a27">同</text>
<rect x="337.7" y="550.6" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="580.6" font-size="19" font-weight="700" fill="#2b2a27">二、经文详释</text>
<line x1="533.7" y1="450.9" x2="653.6" y2="450.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="442.3" font-size="16" font-weight="500" fill="#2b2a27">(一)所缘前生缘</text>
<line x1="699.6" y1="431.1" x2="889.3" y2="431.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="702.6" y="423.2" font-size="14" font-weight="400" fill="#2b2a27">1.色处等对五识界及相应诸法</text>
<line x1="699.6" y1="468.0" x2="875.3" y2="468.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="702.6" y="460.1" font-size="14" font-weight="400" fill="#2b2a27">2.色处等对意界及相应诸法</text>
<line x1="533.7" y1="507.6" x2="685.6" y2="507.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="499.0" font-size="16" font-weight="500" fill="#2b2a27">(二)五门依处前生缘</text>
<line x1="533.7" y1="723.6" x2="685.6" y2="723.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="715.0" font-size="16" font-weight="500" fill="#2b2a27">(三)意门依处前生缘</text>
<line x1="731.6" y1="544.5" x2="809.3" y2="544.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="734.6" y="536.6" font-size="14" font-weight="400" fill="#2b2a27">1.经典原文</text>
<line x1="731.6" y1="722.2" x2="809.3" y2="722.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="734.6" y="714.4" font-size="14" font-weight="400" fill="#2b2a27">2.逐句详释</text>
<line x1="855.3" y1="597.6" x2="1102.6" y2="597.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="858.3" y="572.5" font-size="13" font-weight="400" fill="#2b2a27">（1）从结生心开始，任何与之前的心识同</text>
<text x="858.3" y="590.0" font-size="13" font-weight="400" fill="#2b2a27">时生起的心色</text>
<line x1="855.3" y1="650.7" x2="1102.6" y2="650.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="858.3" y="625.6" font-size="13" font-weight="400" fill="#2b2a27">（2）已获得四禅八定的阿那含和阿拉汉从</text>
<text x="858.3" y="643.1" font-size="13" font-weight="400" fill="#2b2a27">灭尽定出来时，在大</text>
<line x1="855.3" y1="703.8" x2="1104.1" y2="703.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="858.3" y="678.7" font-size="13" font-weight="400" fill="#2b2a27">（3） 在临死的过程中， 从死心往前倒数</text>
<text x="858.3" y="696.2" font-size="13" font-weight="400" fill="#2b2a27">第 17 个心识剎那的 “生</text>
<line x1="855.3" y1="756.9" x2="1098.4" y2="756.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="858.3" y="731.8" font-size="13" font-weight="400" fill="#2b2a27">（1）在五蕴地里，生命期间的 3 种意界</text>
<text x="858.3" y="749.4" font-size="13" font-weight="400" fill="#2b2a27">、72 种意识界(不包括</text>
<line x1="855.3" y1="810.0" x2="1102.6" y2="810.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="858.3" y="784.9" font-size="13" font-weight="400" fill="#2b2a27">（2）从灭尽定出来之后的不来果心与阿拉</text>
<text x="858.3" y="802.5" font-size="13" font-weight="400" fill="#2b2a27">汉果心</text>
<line x1="855.3" y1="863.1" x2="1098.4" y2="863.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="858.3" y="838.0" font-size="13" font-weight="400" fill="#2b2a27">（3）在五蕴地里的临死过程中，15 种有</text>
<text x="858.3" y="855.6" font-size="13" font-weight="400" fill="#2b2a27">分心(不包括四种无色</text>
<line x1="731.6" y1="900.0" x2="879.3" y2="900.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="734.6" y="892.1" font-size="14" font-weight="400" fill="#2b2a27">3.意门依处所缘前生缘</text>
<rect x="337.7" y="922.8" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="952.8" font-size="19" font-weight="700" fill="#2b2a27">三、从心路看前生缘</text>
<line x1="590.7" y1="939.6" x2="804.7" y2="939.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="931.0" font-size="16" font-weight="500" fill="#2b2a27">（一）琴弦、琴槌与琴声之喻</text>
<line x1="590.7" y1="979.2" x2="788.7" y2="979.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="970.6" font-size="16" font-weight="500" fill="#2b2a27">（二）以眼门心路过程为例</text>
<rect x="337.7" y="991.2" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="1021.2" font-size="19" font-weight="700" fill="#2b2a27">四、前生缘与所缘缘、依止缘的</text>
<text x="355.7" y="1046.9" font-size="19" font-weight="700" fill="#2b2a27">关系</text>
<rect x="337.7" y="1092.2" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="1122.2" font-size="19" font-weight="700" fill="#2b2a27">五、从前生缘中得到的启发和借</text>
<text x="355.7" y="1147.9" font-size="19" font-weight="700" fill="#2b2a27">鉴</text>
<line x1="685.7" y1="1102.1" x2="851.7" y2="1102.1" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="1093.5" font-size="16" font-weight="500" fill="#2b2a27">（一）接受父母的一切</text>
<line x1="685.7" y1="1141.7" x2="819.7" y2="1141.7" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="1133.1" font-size="16" font-weight="500" fill="#2b2a27">（二）吴卓林案例</text>
<line x1="685.7" y1="1181.3" x2="819.7" y2="1181.3" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="1172.7" font-size="16" font-weight="500" fill="#2b2a27">（三）启发与借鉴</text>
