<rect x="30" y="489.5" width="267.9" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="526.5" font-size="26" font-weight="700" fill="#fff">194讲-摄集42-摄菩</text>
<text x="48.0" y="561.6" font-size="26" font-weight="700" fill="#fff">提分-法念处-四圣</text>
<text x="48.0" y="596.7" font-size="26" font-weight="700" fill="#fff">谛2</text>
<rect x="343.9" y="260.1" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="290.1" font-size="19" font-weight="700" fill="#2b2a27">一、苦集圣谛</text>
<line x1="539.9" y1="93.2" x2="689.9" y2="93.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="84.5" font-size="16" font-weight="500" fill="#2b2a27">（一）爱欲是苦的因</text>
<line x1="735.9" y1="54.9" x2="821.4" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="738.9" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1. 何谓渴爱</text>
<line x1="735.9" y1="91.8" x2="861.8" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="738.9" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2．何谓五取蕴是苦</text>
<line x1="735.9" y1="128.7" x2="849.4" y2="128.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="738.9" y="120.8" font-size="14" font-weight="400" fill="#2b2a27">3. 渴爱是苦的因</text>
<line x1="539.9" y1="314.6" x2="721.9" y2="314.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="305.9" font-size="16" font-weight="500" fill="#2b2a27">（二）以十组来解释爱欲</text>
<line x1="767.9" y1="165.6" x2="895.4" y2="165.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.9" y="157.7" font-size="14" font-weight="400" fill="#2b2a27">1. 内六处、外六处</text>
<line x1="767.9" y1="202.5" x2="811.4" y2="202.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.9" y="194.6" font-size="14" font-weight="400" fill="#2b2a27">2. 识</text>
<line x1="767.9" y1="239.4" x2="811.4" y2="239.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.9" y="231.5" font-size="14" font-weight="400" fill="#2b2a27">3. 触</text>
<line x1="767.9" y1="276.3" x2="811.4" y2="276.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.9" y="268.4" font-size="14" font-weight="400" fill="#2b2a27">4. 受</text>
<line x1="767.9" y1="313.2" x2="811.4" y2="313.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.9" y="305.3" font-size="14" font-weight="400" fill="#2b2a27">5. 想</text>
<line x1="767.9" y1="350.1" x2="811.4" y2="350.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.9" y="342.2" font-size="14" font-weight="400" fill="#2b2a27">6. 思</text>
<line x1="767.9" y1="387.0" x2="811.4" y2="387.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.9" y="379.1" font-size="14" font-weight="400" fill="#2b2a27">7. 爱</text>
<line x1="767.9" y1="423.9" x2="811.4" y2="423.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.9" y="416.0" font-size="14" font-weight="400" fill="#2b2a27">8. 寻</text>
<line x1="767.9" y1="460.8" x2="811.4" y2="460.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.9" y="452.9" font-size="14" font-weight="400" fill="#2b2a27">9. 伺</text>
<line x1="539.9" y1="500.4" x2="657.9" y2="500.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="491.8" font-size="16" font-weight="500" fill="#2b2a27">（三）五种苦因</text>
<rect x="343.9" y="580.3" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="610.3" font-size="19" font-weight="700" fill="#2b2a27">第二、十种烦恼；第三、一切不</text>
<text x="361.9" y="636.0" font-size="19" font-weight="700" fill="#2b2a27">善法；第四、三善根；第五、一</text>
<text x="361.9" y="661.6" font-size="19" font-weight="700" fill="#2b2a27">切能</text>
<line x1="691.9" y1="561.6" x2="955.8" y2="561.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="531.4" font-size="16" font-weight="500" fill="#2b2a27">1.由于他今生临死速行心的目标是行</text>
<text x="694.9" y="553.0" font-size="16" font-weight="500" fill="#2b2a27">法的无常、苦、无我本质</text>
<line x1="691.9" y1="622.8" x2="955.8" y2="622.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="592.6" font-size="16" font-weight="500" fill="#2b2a27">2.也许他投生天界之后不能立即思惟</text>
<text x="694.9" y="614.2" font-size="16" font-weight="500" fill="#2b2a27">行法的本质，但是当他听闻</text>
<line x1="691.9" y1="684.0" x2="955.8" y2="684.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="653.8" font-size="16" font-weight="500" fill="#2b2a27">3.也许没有机会听闻比库说法，但是</text>
<text x="694.9" y="675.4" font-size="16" font-weight="500" fill="#2b2a27">当他听闻说法天神（比如常</text>
<line x1="691.9" y1="745.2" x2="955.8" y2="745.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="715.0" font-size="16" font-weight="500" fill="#2b2a27">4.或许他没有机会听闻比库或说法天</text>
<text x="694.9" y="736.6" font-size="16" font-weight="500" fill="#2b2a27">神说法，但是他很可能遇见</text>
<rect x="343.9" y="798.6" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="828.6" font-size="19" font-weight="700" fill="#2b2a27">二、苦灭圣谛</text>
<line x1="539.9" y1="784.8" x2="769.9" y2="784.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="776.2" font-size="16" font-weight="500" fill="#2b2a27">（一）依十二处解释爱欲的灭除</text>
<line x1="539.9" y1="846.0" x2="817.9" y2="846.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="815.8" font-size="16" font-weight="500" fill="#2b2a27">（二）于日常生活中训练彼分断、镇伏</text>
<text x="542.9" y="837.4" font-size="16" font-weight="500" fill="#2b2a27">断</text>
<line x1="539.9" y1="885.6" x2="657.9" y2="885.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="877.0" font-size="16" font-weight="500" fill="#2b2a27">（三）八支正道</text>
