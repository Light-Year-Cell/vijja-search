<text x="48.0" y="203.3" font-size="26" font-weight="700" fill="#fff">第51讲-摄缘-十二</text>
<text x="48.0" y="238.4" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘51-</text>
<text x="48.0" y="273.5" font-size="26" font-weight="700" fill="#fff">释二十四缘-根缘2</text>
<rect x="337.7" y="121.0" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="151.0" font-size="19" font-weight="700" fill="#2b2a27">二、经文详释</text>
<line x1="533.7" y1="157.6" x2="685.6" y2="157.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="149.0" font-size="16" font-weight="500" fill="#2b2a27">（三）(名)俱生根缘</text>
<line x1="731.6" y1="156.3" x2="823.3" y2="156.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="734.6" y="148.4" font-size="14" font-weight="400" fill="#2b2a27">2.十五种名根</text>
<line x1="869.3" y1="53.5" x2="947.6" y2="53.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="872.3" y="46.0" font-size="13" font-weight="400" fill="#2b2a27">（2）名命根</text>
<line x1="869.3" y1="89.1" x2="947.6" y2="89.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="872.3" y="81.5" font-size="13" font-weight="400" fill="#2b2a27">（3）五受根</text>
<line x1="869.3" y1="124.6" x2="960.6" y2="124.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="872.3" y="117.1" font-size="13" font-weight="400" fill="#2b2a27">（4）信等五根</text>
<line x1="869.3" y1="160.2" x2="999.6" y2="160.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="872.3" y="152.6" font-size="13" font-weight="400" fill="#2b2a27">（5）三种出世间慧根</text>
<line x1="869.3" y1="213.3" x2="1114.0" y2="213.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="872.3" y="188.2" font-size="13" font-weight="400" fill="#2b2a27">(1)从“意义”来阐释：①在入流道刹那的初</text>
<text x="872.3" y="205.8" font-size="13" font-weight="400" fill="#2b2a27">始</text>
<line x1="869.3" y1="266.4" x2="1109.8" y2="266.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="872.3" y="241.3" font-size="13" font-weight="400" fill="#2b2a27">(2)从 “特相等” 来阐释： 慧根(及三无</text>
<text x="872.3" y="258.8" font-size="13" font-weight="400" fill="#2b2a27">漏根)等四种是无痴之义</text>
<rect x="337.7" y="278.4" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="308.4" font-size="19" font-weight="700" fill="#2b2a27">三、依法抉择确定正道，平衡五</text>
<text x="355.7" y="334.0" font-size="19" font-weight="700" fill="#2b2a27">根趣向涅槃</text>
