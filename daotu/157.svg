<rect x="30" y="539.4" width="253.4" height="92.2" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="576.4" font-size="26" font-weight="700" fill="#fff">157讲-摄集5-六种</text>
<text x="48.0" y="611.5" font-size="26" font-weight="700" fill="#fff">心理余势的传递</text>
<rect x="329.4" y="158.6" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="347.4" y="188.6" font-size="19" font-weight="700" fill="#2b2a27">一、复习不善的类别</text>
<line x1="582.4" y1="57.6" x2="748.4" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="585.4" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）三种颠倒的断除</text>
<line x1="582.4" y1="332.8" x2="716.4" y2="332.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="585.4" y="324.2" font-size="16" font-weight="500" fill="#2b2a27">（二）不善的类别</text>
<line x1="762.4" y1="94.5" x2="1015.9" y2="94.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="765.4" y="86.6" font-size="14" font-weight="400" fill="#2b2a27">1、四漏——欲漏、有漏、邪见漏、无明漏</text>
<line x1="762.4" y1="150.3" x2="1028.2" y2="150.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="765.4" y="123.5" font-size="14" font-weight="400" fill="#2b2a27">2、四暴流跟四漏其实是一样的，只是佛陀</text>
<text x="765.4" y="142.4" font-size="14" font-weight="400" fill="#2b2a27">为了更进一步地强调</text>
<line x1="762.4" y1="206.1" x2="1028.2" y2="206.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="765.4" y="179.3" font-size="14" font-weight="400" fill="#2b2a27">3、四轭，就是欲轭、有轭、邪见轭、无明</text>
<text x="765.4" y="198.2" font-size="14" font-weight="400" fill="#2b2a27">轭，内容跟四漏是一</text>
<line x1="762.4" y1="243.0" x2="818.2" y2="243.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="765.4" y="235.1" font-size="14" font-weight="400" fill="#2b2a27">4、四系</text>
<line x1="762.4" y1="298.8" x2="1028.2" y2="298.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="765.4" y="272.0" font-size="14" font-weight="400" fill="#2b2a27">5、四种取是：欲取、邪见取、戒禁取、我</text>
<text x="765.4" y="290.9" font-size="14" font-weight="400" fill="#2b2a27">论取，除了欲取是贪</text>
<line x1="762.4" y1="354.6" x2="1028.2" y2="354.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="765.4" y="327.8" font-size="14" font-weight="400" fill="#2b2a27">6、六种盖。就是五盖再加上无明盖。盖就</text>
<text x="765.4" y="346.7" font-size="14" font-weight="400" fill="#2b2a27">是会阻碍通向天界、</text>
<line x1="762.4" y1="410.4" x2="1028.2" y2="410.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="765.4" y="383.6" font-size="14" font-weight="400" fill="#2b2a27">7、七个随眠。欲贪随眠、有贪随眠、瞋恨</text>
<text x="765.4" y="402.5" font-size="14" font-weight="400" fill="#2b2a27">随眠、我慢随眠、邪</text>
<line x1="762.4" y1="466.2" x2="1028.2" y2="466.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="765.4" y="439.4" font-size="14" font-weight="400" fill="#2b2a27">8、经教法的十种结：欲贪结、色贪结、无</text>
<text x="765.4" y="458.3" font-size="14" font-weight="400" fill="#2b2a27">色贪结、瞋恚结、我</text>
<line x1="762.4" y1="522.0" x2="1028.2" y2="522.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="765.4" y="495.2" font-size="14" font-weight="400" fill="#2b2a27">9、论教法的十种结是：欲贪结、色贪结、</text>
<text x="765.4" y="514.1" font-size="14" font-weight="400" fill="#2b2a27">瞋恚结、我慢结、邪</text>
<line x1="762.4" y1="577.8" x2="1022.0" y2="577.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="765.4" y="551.0" font-size="14" font-weight="400" fill="#2b2a27">10、十烦恼或十污染：贪烦恼、瞋烦恼、</text>
<text x="765.4" y="569.9" font-size="14" font-weight="400" fill="#2b2a27">痴烦恼、慢烦恼、邪</text>
<rect x="329.4" y="620.4" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="347.4" y="650.4" font-size="19" font-weight="700" fill="#2b2a27">二、人类被两股力量彻底地束缚</text>
<line x1="677.4" y1="617.4" x2="907.4" y2="617.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="680.4" y="608.8" font-size="16" font-weight="500" fill="#2b2a27">（一）名色相续流和物种相续流</text>
<line x1="677.4" y1="657.0" x2="907.4" y2="657.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="680.4" y="648.4" font-size="16" font-weight="500" fill="#2b2a27">（二）科学家对人类的自我评价</text>
<line x1="677.4" y1="696.6" x2="827.4" y2="696.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="680.4" y="688.0" font-size="16" font-weight="500" fill="#2b2a27">（三）六种心理余势</text>
<rect x="329.4" y="708.6" width="293.6" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="347.4" y="738.6" font-size="19" font-weight="700" fill="#2b2a27">三、 影响名色相续流的两股力</text>
<text x="347.4" y="764.2" font-size="19" font-weight="700" fill="#2b2a27">量</text>
<line x1="669.0" y1="736.2" x2="819.0" y2="736.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="672.0" y="727.6" font-size="16" font-weight="500" fill="#2b2a27">（二）六种心里余势</text>
<rect x="329.4" y="791.9" width="93.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="347.4" y="821.9" font-size="19" font-weight="700" fill="#2b2a27">一、业</text>
<rect x="329.4" y="849.6" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="347.4" y="879.6" font-size="19" font-weight="700" fill="#2b2a27">二、七种不善的潜存力</text>
<rect x="329.4" y="907.2" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="347.4" y="937.2" font-size="19" font-weight="700" fill="#2b2a27">三、十种巴拉密的潜存力</text>
<rect x="329.4" y="964.9" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="347.4" y="994.9" font-size="19" font-weight="700" fill="#2b2a27">四、好恶、习气与心性</text>
</svg>