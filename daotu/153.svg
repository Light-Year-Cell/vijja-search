<rect x="30" y="142.7" width="253.4" height="92.2" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="179.7" font-size="26" font-weight="700" fill="#fff">153讲-摄集1-四漏</text>
<text x="48.0" y="214.8" font-size="26" font-weight="700" fill="#fff">之无明1</text>
<rect x="329.4" y="57.0" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="347.4" y="87.0" font-size="19" font-weight="700" fill="#2b2a27">一、摄集之概括</text>
<line x1="544.4" y1="79.2" x2="822.4" y2="79.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="547.4" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）摄集分为摄不善、摄杂、摄菩提</text>
<text x="547.4" y="70.6" font-size="16" font-weight="500" fill="#2b2a27">分、摄一切</text>
<line x1="544.4" y1="118.8" x2="774.4" y2="118.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="547.4" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">（二）四漏放在摄不善的第一位</text>
<rect x="329.4" y="273.0" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="347.4" y="303.0" font-size="19" font-weight="700" fill="#2b2a27">二、四漏之无明漏</text>
<line x1="563.4" y1="158.4" x2="713.4" y2="158.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="566.4" y="149.8" font-size="16" font-weight="500" fill="#2b2a27">（一）什么是无明？</text>
<line x1="563.4" y1="198.0" x2="747.3" y2="198.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="566.4" y="189.4" font-size="16" font-weight="500" fill="#2b2a27">（二）什么是“三颠倒”？</text>
<line x1="563.4" y1="237.6" x2="795.3" y2="237.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="566.4" y="229.0" font-size="16" font-weight="500" fill="#2b2a27">（三）日常生活中观察“三颠倒”</text>
<line x1="563.4" y1="298.8" x2="841.4" y2="298.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="566.4" y="268.6" font-size="16" font-weight="500" fill="#2b2a27">（四）虽见到究竟法，但不见四圣谛，</text>
<text x="566.4" y="290.2" font-size="16" font-weight="500" fill="#2b2a27">仍然是无明</text>
<line x1="563.4" y1="360.0" x2="841.4" y2="360.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="566.4" y="329.8" font-size="16" font-weight="500" fill="#2b2a27">（五）无明让我们不知有涅槃，认为这</text>
<text x="566.4" y="351.4" font-size="16" font-weight="500" fill="#2b2a27">种生命的存在方式是唯一</text>
<line x1="563.4" y1="421.2" x2="841.4" y2="421.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="566.4" y="391.0" font-size="16" font-weight="500" fill="#2b2a27">（六）快乐的奖励机制和痛苦的防护机</text>
<text x="566.4" y="412.6" font-size="16" font-weight="500" fill="#2b2a27">制</text>
<line x1="563.4" y1="460.8" x2="841.4" y2="460.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="566.4" y="452.2" font-size="16" font-weight="500" fill="#2b2a27">（七）日常生活中发现烦恼、削弱无明</text>
</svg>