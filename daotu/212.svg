<rect x="30" y="513.5" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="550.5" font-size="26" font-weight="700" fill="#fff">第16讲-摄缘-十二</text>
<text x="48.0" y="585.6" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘16-</text>
<text x="48.0" y="620.7" font-size="26" font-weight="700" fill="#fff">释二十四缘-增上缘</text>
<text x="48.0" y="655.8" font-size="26" font-weight="700" fill="#fff">3</text>
<rect x="337.7" y="295.5" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="325.5" font-size="19" font-weight="700" fill="#2b2a27">一、心主导</text>
<line x1="514.7" y1="57.6" x2="680.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）心识的相等四法</text>
<line x1="514.7" y1="118.8" x2="792.7" y2="118.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）心主导（增上）的缘法、缘所生</text>
<text x="517.7" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">法及所摄诸缘</text>
<line x1="514.7" y1="158.4" x2="696.7" y2="158.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="149.8" font-size="16" font-weight="500" fill="#2b2a27">（三）心主导的表现案例</text>
<line x1="514.7" y1="382.5" x2="664.7" y2="382.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="373.9" font-size="16" font-weight="500" fill="#2b2a27">（四）心主导的应用</text>
<line x1="710.7" y1="195.3" x2="964.2" y2="195.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="713.7" y="187.4" font-size="14" font-weight="400" fill="#2b2a27">(1)持戒：远离不善法，杜绝犯戒的行为</text>
<line x1="710.7" y1="251.1" x2="978.2" y2="251.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="713.7" y="224.3" font-size="14" font-weight="400" fill="#2b2a27">(2)守护根门：心只向能够导向善法增长、</text>
<text x="713.7" y="243.2" font-size="14" font-weight="400" fill="#2b2a27">有助于如理作意的所</text>
<line x1="710.7" y1="306.9" x2="978.2" y2="306.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="713.7" y="280.1" font-size="14" font-weight="400" fill="#2b2a27">(3)饮食知节量：食用只够维持色身、支助</text>
<text x="713.7" y="299.0" font-size="14" font-weight="400" fill="#2b2a27">梵行之量的食物，节</text>
<line x1="710.7" y1="362.7" x2="978.2" y2="362.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="713.7" y="335.9" font-size="14" font-weight="400" fill="#2b2a27">(4)实行警寤：只作必要的休息、睡眠，在</text>
<text x="713.7" y="354.8" font-size="14" font-weight="400" fill="#2b2a27">醒觉时应时刻努力修</text>
<line x1="710.7" y1="418.5" x2="978.2" y2="418.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="713.7" y="391.7" font-size="14" font-weight="400" fill="#2b2a27">(5)具足念与正知：心识知目标的时候，正</text>
<text x="713.7" y="410.6" font-size="14" font-weight="400" fill="#2b2a27">念要现前，并且要透</text>
<line x1="710.7" y1="474.3" x2="978.2" y2="474.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="713.7" y="447.5" font-size="14" font-weight="400" fill="#2b2a27">(6)居住偏远坐卧处：这不仅指住处要远离</text>
<text x="713.7" y="466.4" font-size="14" font-weight="400" fill="#2b2a27">不善，更重要的是心</text>
<line x1="710.7" y1="530.1" x2="978.2" y2="530.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="713.7" y="503.3" font-size="14" font-weight="400" fill="#2b2a27">(7)舍离五盖：去除修行过程中提升善法、</text>
<text x="713.7" y="522.2" font-size="14" font-weight="400" fill="#2b2a27">成就止观的障碍</text>
<line x1="710.7" y1="567.0" x2="880.2" y2="567.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="713.7" y="559.1" font-size="14" font-weight="400" fill="#2b2a27">(8)修习四念处：成就止观</text>
<line x1="514.7" y1="606.6" x2="664.7" y2="606.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="598.0" font-size="16" font-weight="500" fill="#2b2a27">（五）心主导与人生</text>
<rect x="337.7" y="689.9" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="719.9" font-size="19" font-weight="700" fill="#2b2a27">二、慧主导</text>
<line x1="514.7" y1="654.3" x2="696.7" y2="654.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="645.7" font-size="16" font-weight="500" fill="#2b2a27">（一）慧心所的相等四法</text>
<line x1="742.7" y1="662.4" x2="1010.2" y2="662.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="745.7" y="635.6" font-size="14" font-weight="400" fill="#2b2a27">(2)无误彻知究竟法。如同善巧箭手，射无</text>
<text x="745.7" y="654.5" font-size="14" font-weight="400" fill="#2b2a27">过失</text>
<line x1="514.7" y1="723.6" x2="792.7" y2="723.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="693.4" font-size="16" font-weight="500" fill="#2b2a27">（二）慧主导的缘法、缘所生法及所摄</text>
<text x="517.7" y="715.0" font-size="16" font-weight="500" fill="#2b2a27">诸缘</text>
<line x1="514.7" y1="798.8" x2="696.7" y2="798.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="790.2" font-size="16" font-weight="500" fill="#2b2a27">（三）闻慧、思慧与修慧</text>
<line x1="742.7" y1="760.5" x2="800.2" y2="760.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="745.7" y="752.6" font-size="14" font-weight="400" fill="#2b2a27">1. 闻慧</text>
<line x1="742.7" y1="797.4" x2="800.2" y2="797.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="745.7" y="789.5" font-size="14" font-weight="400" fill="#2b2a27">2. 思慧</text>
<line x1="742.7" y1="834.3" x2="800.2" y2="834.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="745.7" y="826.4" font-size="14" font-weight="400" fill="#2b2a27">3. 修慧</text>
<rect x="337.7" y="846.3" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="876.3" font-size="19" font-weight="700" fill="#2b2a27">三、四主导（增上）之总结</text>
</svg>