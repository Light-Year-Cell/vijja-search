<line x1="719.7" y1="1733.4" x2="981.0" y2="1733.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="1706.6" font-size="14" font-weight="400" fill="#2b2a27">4、缘法：名/4 个贪邪见相应的邪见心所</text>
<text x="722.7" y="1725.5" font-size="14" font-weight="400" fill="#2b2a27">（见取、戒禁取、我语</text>
<line x1="719.7" y1="1789.2" x2="979.4" y2="1789.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="1762.4" font-size="14" font-weight="400" fill="#2b2a27">1、缘法：名，生/结生果报四名蕴，以自</text>
<text x="722.7" y="1781.3" font-size="14" font-weight="400" fill="#2b2a27">然亲依止缘的缘力缘助</text>
<line x1="719.7" y1="1845.0" x2="987.2" y2="1845.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="1818.2" font-size="14" font-weight="400" fill="#2b2a27">1.缘所生法：名，愁悲忧恼/生命期间速行</text>
<text x="722.7" y="1837.1" font-size="14" font-weight="400" fill="#2b2a27"> 2 个忧俱嗔相应心生起</text>
<line x1="719.7" y1="1900.8" x2="979.4" y2="1900.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="1874.0" font-size="14" font-weight="400" fill="#2b2a27">3、缘法：名，生/不善身识果报心，以俱</text>
<text x="722.7" y="1892.9" font-size="14" font-weight="400" fill="#2b2a27">生组的缘力缘助缘所生</text>
<line x1="571.7" y1="1940.4" x2="673.7" y2="1940.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="1931.8" font-size="16" font-weight="500" fill="#2b2a27">（三）以遮止</text>
<line x1="571.7" y1="1980.0" x2="673.7" y2="1980.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="1971.4" font-size="16" font-weight="500" fill="#2b2a27">（四）以譬喻</text>
