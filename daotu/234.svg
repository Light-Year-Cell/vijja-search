<rect x="30" y="259.9" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="296.9" font-size="26" font-weight="700" fill="#fff">第38讲-摄缘-十二</text>
<text x="48.0" y="332.0" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘38-</text>
<text x="48.0" y="367.1" font-size="26" font-weight="700" fill="#fff">释二十四缘-重复缘</text>
<rect x="337.7" y="60.6" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="90.6" font-size="19" font-weight="700" fill="#2b2a27">一、经文、释义与譬喻</text>
<line x1="609.7" y1="57.6" x2="695.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）经文</text>
<line x1="609.7" y1="97.2" x2="695.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）释义</text>
<line x1="609.7" y1="136.8" x2="695.7" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三）譬喻</text>
<rect x="337.7" y="229.8" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="259.8" font-size="19" font-weight="700" fill="#2b2a27">二、重复缘经文详释</text>
<line x1="590.7" y1="176.4" x2="820.7" y2="176.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">（一）前前诸善法对后后诸善法</text>
<line x1="590.7" y1="216.0" x2="838.6" y2="216.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="207.4" font-size="16" font-weight="500" fill="#2b2a27">(二)前前诸不善法对后后诸不善法</text>
<line x1="590.7" y1="255.6" x2="838.6" y2="255.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="247.0" font-size="16" font-weight="500" fill="#2b2a27">(三)前前诸唯作法对后后诸唯作法</text>
<line x1="590.7" y1="316.8" x2="868.7" y2="316.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="286.6" font-size="16" font-weight="500" fill="#2b2a27">（四）重复缘的缘法、缘所生法、缘力</text>
<text x="593.7" y="308.2" font-size="16" font-weight="500" fill="#2b2a27">与所摄诸缘</text>
<line x1="590.7" y1="356.4" x2="852.7" y2="356.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="347.8" font-size="16" font-weight="500" fill="#2b2a27">（五）为什么没有提及果报无记心？</text>
<rect x="337.7" y="538.9" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="568.9" font-size="19" font-weight="700" fill="#2b2a27">三、善用重复缘</text>
<line x1="552.7" y1="396.0" x2="718.7" y2="396.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="387.4" font-size="16" font-weight="500" fill="#2b2a27">（一）心路中的重复缘</text>
<line x1="552.7" y1="435.6" x2="718.7" y2="435.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="427.0" font-size="16" font-weight="500" fill="#2b2a27">（二）修行中的重复缘</text>
<line x1="552.7" y1="475.2" x2="718.7" y2="475.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="466.6" font-size="16" font-weight="500" fill="#2b2a27">（三）生命中的重复缘</text>
<line x1="552.7" y1="755.1" x2="718.7" y2="755.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="746.5" font-size="16" font-weight="500" fill="#2b2a27">（四）培养善的重复缘</text>
<line x1="764.7" y1="531.0" x2="1032.2" y2="531.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="504.2" font-size="14" font-weight="400" fill="#2b2a27">(1)布施：每天以家庭、工作单位为善行基</text>
<text x="767.7" y="523.1" font-size="14" font-weight="400" fill="#2b2a27">地，从善语(语布施</text>
<line x1="764.7" y1="567.9" x2="1032.2" y2="567.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="560.0" font-size="14" font-weight="400" fill="#2b2a27">(2)持戒：在家人至少要持好最基本的五戒</text>
<line x1="764.7" y1="623.7" x2="1032.2" y2="623.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="596.9" font-size="14" font-weight="400" fill="#2b2a27">(3)禅修：每天至少两座，每座不少于五分</text>
<text x="767.7" y="615.8" font-size="14" font-weight="400" fill="#2b2a27">钟；正念正知是每天</text>
<line x1="764.7" y1="679.5" x2="1032.2" y2="679.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="652.7" font-size="14" font-weight="400" fill="#2b2a27">(4)恭敬：在单位里对领导、对同事恭敬；</text>
<text x="767.7" y="671.6" font-size="14" font-weight="400" fill="#2b2a27">在家里对老人恭敬</text>
<line x1="764.7" y1="735.3" x2="1032.2" y2="735.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="708.5" font-size="14" font-weight="400" fill="#2b2a27">(5)服务：对任何人有服务的心都是服务，</text>
<text x="767.7" y="727.4" font-size="14" font-weight="400" fill="#2b2a27">不仅仅是对僧团。当</text>
<line x1="764.7" y1="791.1" x2="1032.2" y2="791.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="764.3" font-size="14" font-weight="400" fill="#2b2a27">(6)随喜功德：这是指我们能看到别人的成</text>
<text x="767.7" y="783.2" font-size="14" font-weight="400" fill="#2b2a27">就，不管他现在的行</text>
<line x1="764.7" y1="846.9" x2="1032.2" y2="846.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="820.1" font-size="14" font-weight="400" fill="#2b2a27">(7)回向功德：每天晚上睡觉之前滴水回向</text>
<text x="767.7" y="839.0" font-size="14" font-weight="400" fill="#2b2a27">。将所做的布施、持</text>
<line x1="764.7" y1="883.8" x2="948.2" y2="883.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="875.9" font-size="14" font-weight="400" fill="#2b2a27">(8)听闻佛法：每天坚持闻法</text>
<line x1="764.7" y1="939.6" x2="1032.2" y2="939.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="912.8" font-size="14" font-weight="400" fill="#2b2a27">(9)开示佛法：对于在家人，可以理解为传</text>
<text x="767.7" y="931.7" font-size="14" font-weight="400" fill="#2b2a27">播佛法。每天都可以</text>
<line x1="764.7" y1="995.4" x2="1033.9" y2="995.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="968.6" font-size="14" font-weight="400" fill="#2b2a27">(10)正直己见： 不断地纠正自己错误的观</text>
<text x="767.7" y="987.5" font-size="14" font-weight="400" fill="#2b2a27">点， 树立对业果的正见</text>
</svg>