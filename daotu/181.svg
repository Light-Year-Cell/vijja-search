<rect x="30" y="796.8" width="267.9" height="92.2" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="833.8" font-size="26" font-weight="700" fill="#fff">181讲-摄集29-摄菩</text>
<text x="48.0" y="868.9" font-size="26" font-weight="700" fill="#fff">提分-身念处-正知4</text>
<rect x="343.9" y="87.3" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="117.3" font-size="19" font-weight="700" fill="#2b2a27">一、（一）出家人穿袈裟时候四</text>
<text x="361.9" y="143.0" font-size="19" font-weight="700" fill="#2b2a27">种正知</text>
<line x1="691.9" y1="57.6" x2="850.9" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">1、穿衣时的有益正知</text>
<line x1="691.9" y1="97.2" x2="834.9" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">2、穿衣的适宜正知</text>
<line x1="691.9" y1="136.8" x2="850.9" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">3、穿袈裟的行处正知</text>
<line x1="691.9" y1="176.4" x2="850.9" y2="176.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">4、穿袈裟的无痴正知</text>
<line x1="691.9" y1="216.0" x2="921.9" y2="216.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="207.4" font-size="16" font-weight="500" fill="#2b2a27">（二）在家人穿衣物的四种正知</text>
<rect x="343.9" y="346.8" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="376.8" font-size="19" font-weight="700" fill="#2b2a27">二、持钵时的四种正知</text>
<line x1="615.9" y1="309.6" x2="845.9" y2="309.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="301.0" font-size="16" font-weight="500" fill="#2b2a27">（一）出家人持钵时的四种正知</text>
<line x1="891.9" y1="252.9" x2="1017.8" y2="252.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="894.9" y="245.0" font-size="14" font-weight="400" fill="#2b2a27">1、持钵时有益正知</text>
<line x1="891.9" y1="289.8" x2="1017.8" y2="289.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="894.9" y="281.9" font-size="14" font-weight="400" fill="#2b2a27">2、持钵时适宜正知</text>
<line x1="891.9" y1="326.7" x2="1017.8" y2="326.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="894.9" y="318.8" font-size="14" font-weight="400" fill="#2b2a27">3、持钵时行处正知</text>
<line x1="891.9" y1="363.6" x2="1017.8" y2="363.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="894.9" y="355.7" font-size="14" font-weight="400" fill="#2b2a27">4、持钵的无痴正知</text>
<line x1="615.9" y1="457.2" x2="813.9" y2="457.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="448.6" font-size="16" font-weight="500" fill="#2b2a27">（二）在家人饮食四种正知</text>
<line x1="859.9" y1="400.5" x2="985.8" y2="400.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="862.9" y="392.6" font-size="14" font-weight="400" fill="#2b2a27">1、饮食的有益正知</text>
<line x1="859.9" y1="437.4" x2="985.8" y2="437.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="862.9" y="429.5" font-size="14" font-weight="400" fill="#2b2a27">2、饮食的适宜正知</text>
<line x1="859.9" y1="474.3" x2="985.8" y2="474.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="862.9" y="466.4" font-size="14" font-weight="400" fill="#2b2a27">3、饮食的行处正知</text>
<line x1="859.9" y1="511.2" x2="993.6" y2="511.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="862.9" y="503.3" font-size="14" font-weight="400" fill="#2b2a27">4 、饮食的无痴正知</text>
<rect x="343.9" y="523.2" width="293.6" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="553.2" font-size="19" font-weight="700" fill="#2b2a27">一． 观察获得食物很辛苦。不</text>
<text x="361.9" y="578.8" font-size="19" font-weight="700" fill="#2b2a27">管是种植、制作，还是去托钵</text>
<rect x="343.9" y="606.5" width="255.6" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="636.5" font-size="19" font-weight="700" fill="#2b2a27">二． 观察寻求食物的辛劳</text>
<rect x="343.9" y="664.1" width="236.6" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="694.1" font-size="19" font-weight="700" fill="#2b2a27">三． 观察吃食物的过程</text>
<rect x="343.9" y="721.8" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="751.8" font-size="19" font-weight="700" fill="#2b2a27">三．观察胆汁等各种分泌物的储</text>
<text x="361.9" y="777.4" font-size="19" font-weight="700" fill="#2b2a27">藏所</text>
<rect x="343.9" y="805.1" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="361.9" y="835.1" font-size="19" font-weight="700" fill="#2b2a27">四．观察胃</text>
<rect x="343.9" y="862.7" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#8a6d3b" stroke-width="2.2"/>
<text x="361.9" y="892.7" font-size="19" font-weight="700" fill="#2b2a27">五．观察在胃里面未消化的食物</text>
<text x="361.9" y="918.4" font-size="19" font-weight="700" fill="#2b2a27">，俢三十二身分的人会看到</text>
<rect x="343.9" y="946.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="976.0" font-size="19" font-weight="700" fill="#2b2a27">六．观察已消化的食物进入小肠</text>
<text x="361.9" y="1001.7" font-size="19" font-weight="700" fill="#2b2a27">和大肠</text>
<rect x="343.9" y="1029.3" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="1059.3" font-size="19" font-weight="700" fill="#2b2a27">七．观察吃食物的后果、起的作</text>
<text x="361.9" y="1085.0" font-size="19" font-weight="700" fill="#2b2a27">用、产生的色法</text>
<rect x="343.9" y="1112.6" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="1142.6" font-size="19" font-weight="700" fill="#2b2a27">八．观察食物以粪便的形式从肛</text>
<text x="361.9" y="1168.3" font-size="19" font-weight="700" fill="#2b2a27">门慢慢的排出去</text>
<rect x="343.9" y="1195.9" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="1225.9" font-size="19" font-weight="700" fill="#2b2a27">十．观察由于食物而造成的污染</text>
<rect x="343.9" y="1304.0" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="1334.0" font-size="19" font-weight="700" fill="#2b2a27">三、大小便利四种正知</text>
<line x1="615.9" y1="1281.2" x2="813.9" y2="1281.2" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1272.6" font-size="16" font-weight="500" fill="#2b2a27">（一）大小便利时有益正知</text>
<line x1="615.9" y1="1320.8" x2="797.9" y2="1320.8" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1312.2" font-size="16" font-weight="500" fill="#2b2a27">（二）大小便时适宜正知</text>
<line x1="615.9" y1="1360.4" x2="797.9" y2="1360.4" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1351.8" font-size="16" font-weight="500" fill="#2b2a27">（三）大小便时行处正知</text>
<line x1="615.9" y1="1400.0" x2="797.9" y2="1400.0" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1391.4" font-size="16" font-weight="500" fill="#2b2a27">（四）大小便时无痴正知</text>
<rect x="343.9" y="1538.0" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="1568.0" font-size="19" font-weight="700" fill="#2b2a27">四、走路时正知</text>
<line x1="558.9" y1="1461.2" x2="836.9" y2="1461.2" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="561.9" y="1431.0" font-size="16" font-weight="500" fill="#2b2a27">（一）行走、站立、坐着、睡觉、醒觉</text>
<text x="561.9" y="1452.6" font-size="16" font-weight="500" fill="#2b2a27">、说话、沉默时保持</text>
<line x1="558.9" y1="1500.8" x2="708.9" y2="1500.8" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="561.9" y="1492.2" font-size="16" font-weight="500" fill="#2b2a27">（二）睡眠时的正知</text>
<line x1="558.9" y1="1540.4" x2="708.9" y2="1540.4" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="561.9" y="1531.8" font-size="16" font-weight="500" fill="#2b2a27">（三）说话时的正知</text>
<line x1="558.9" y1="1580.0" x2="724.9" y2="1580.0" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="561.9" y="1571.4" font-size="16" font-weight="500" fill="#2b2a27">（四）一切处保持正知</text>
<line x1="558.9" y1="1619.6" x2="756.9" y2="1619.6" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="561.9" y="1611.0" font-size="16" font-weight="500" fill="#2b2a27">（五）俢习正知的第二阶段</text>
<line x1="558.9" y1="1659.2" x2="756.9" y2="1659.2" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="561.9" y="1650.6" font-size="16" font-weight="500" fill="#2b2a27">（六）俢习正知的第三阶段</text>
<line x1="558.9" y1="1698.8" x2="756.9" y2="1698.8" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="561.9" y="1690.2" font-size="16" font-weight="500" fill="#2b2a27">（七）俢习正知的第四阶段</text>
</svg>