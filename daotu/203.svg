<rect x="30" y="425.2" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="462.2" font-size="26" font-weight="700" fill="#fff">第7讲-摄缘-十二缘</text>
<text x="48.0" y="497.3" font-size="26" font-weight="700" fill="#fff">起与二十四缘7-缘</text>
<text x="48.0" y="532.4" font-size="26" font-weight="700" fill="#fff">起支2</text>
<rect x="337.7" y="227.5" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="257.5" font-size="19" font-weight="700" fill="#2b2a27">二、解释各缘起支</text>
<line x1="571.7" y1="57.6" x2="785.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）解释缘起支的五种方式</text>
<line x1="571.7" y1="156.1" x2="673.7" y2="156.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="147.5" font-size="16" font-weight="500" fill="#2b2a27">（二）方式一</text>
<line x1="719.7" y1="94.5" x2="889.2" y2="94.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="86.6" font-size="14" font-weight="400" fill="#2b2a27">1. 四种顺序说缘起及原因</text>
<line x1="719.7" y1="215.0" x2="937.4" y2="215.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="207.1" font-size="14" font-weight="400" fill="#2b2a27">2.为什么于顺缘起中最先说无明？</text>
<line x1="983.4" y1="130.1" x2="1113.6" y2="130.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="986.4" y="122.5" font-size="13" font-weight="400" fill="#2b2a27">（1）无明是否无因？</text>
<line x1="983.4" y1="183.2" x2="1230.6" y2="183.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="986.4" y="158.1" font-size="13" font-weight="400" fill="#2b2a27">（2）以无明为根本的原因的说法（二法为</text>
<text x="986.4" y="175.6" font-size="13" font-weight="400" fill="#2b2a27">首：无明&amp;有爱）</text>
<line x1="983.4" y1="218.7" x2="1113.6" y2="218.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="986.4" y="211.2" font-size="13" font-weight="400" fill="#2b2a27">（3）二法为首的原因</text>
<line x1="983.4" y1="254.2" x2="1126.6" y2="254.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="986.4" y="246.7" font-size="13" font-weight="400" fill="#2b2a27">（4）无明和有爱的关系</text>
<line x1="983.4" y1="307.4" x2="1226.5" y2="307.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="986.4" y="282.2" font-size="13" font-weight="400" fill="#2b2a27">（5）佛陀说法兼以“一法为根本”和“两者</text>
<text x="986.4" y="299.8" font-size="13" font-weight="400" fill="#2b2a27">为根本”</text>
<line x1="571.7" y1="470.7" x2="673.7" y2="470.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="462.1" font-size="16" font-weight="500" fill="#2b2a27">（三）方式二</text>
<line x1="719.7" y1="344.2" x2="797.4" y2="344.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="336.4" font-size="14" font-weight="400" fill="#2b2a27">1.无明与明</text>
<line x1="719.7" y1="469.3" x2="839.4" y2="469.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="461.4" font-size="14" font-weight="400" fill="#2b2a27">2.无明的七种含义</text>
<line x1="885.4" y1="379.8" x2="1094.2" y2="379.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="888.4" y="372.2" font-size="13" font-weight="400" fill="#2b2a27">（1）有那不该有（avindiyaṃ）的</text>
<line x1="885.4" y1="415.4" x2="1101.4" y2="415.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="888.4" y="407.8" font-size="13" font-weight="400" fill="#2b2a27">（2）没有（na vindati）那该有的</text>
<line x1="885.4" y1="450.9" x2="1107.2" y2="450.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="888.4" y="443.4" font-size="13" font-weight="400" fill="#2b2a27">（3）不知(avidita)蕴、处、界等义</text>
<line x1="885.4" y1="486.5" x2="1073.9" y2="486.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="888.4" y="478.9" font-size="13" font-weight="400" fill="#2b2a27">（4）不知（aviditaṃ）四谛义</text>
<line x1="885.4" y1="522.0" x2="1062.4" y2="522.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="888.4" y="514.5" font-size="13" font-weight="400" fill="#2b2a27">（6）不存在（avijjamāna）</text>
<line x1="885.4" y1="557.5" x2="950.6" y2="557.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="888.4" y="550.0" font-size="13" font-weight="400" fill="#2b2a27">（7）遮蔽</text>
<line x1="719.7" y1="594.4" x2="811.4" y2="594.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="586.5" font-size="14" font-weight="400" fill="#2b2a27">3.无明和邪见</text>
<rect x="337.7" y="606.4" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="636.4" font-size="19" font-weight="700" fill="#2b2a27">第二、对众生的影响不同：无明</text>
<text x="355.7" y="662.1" font-size="19" font-weight="700" fill="#2b2a27">是轮回之因；邪见是堕入恶</text>
<rect x="337.7" y="689.8" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="719.8" font-size="19" font-weight="700" fill="#2b2a27">第三、断除的不同：入流道智断</text>
<text x="355.7" y="745.4" font-size="19" font-weight="700" fill="#2b2a27">邪见；阿拉汉道智断无明</text>
</svg>