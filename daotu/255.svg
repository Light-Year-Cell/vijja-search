<rect x="30" y="656.7" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="693.7" font-size="26" font-weight="700" fill="#fff">第59讲-摄缘-十二</text>
<text x="48.0" y="728.8" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘59-</text>
<text x="48.0" y="763.9" font-size="26" font-weight="700" fill="#fff">路心的缘-名色与缘</text>
<rect x="337.7" y="30.0" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、心相续流</text>
<rect x="337.7" y="523.2" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="553.2" font-size="19" font-weight="700" fill="#2b2a27">二、路心与离路心</text>
<line x1="571.7" y1="136.9" x2="835.6" y2="136.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="106.7" font-size="16" font-weight="500" fill="#2b2a27">1.最完整的五门心路过程（以色法为</text>
<text x="574.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">所缘）</text>
<line x1="571.7" y1="176.5" x2="739.6" y2="176.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="167.9" font-size="16" font-weight="500" fill="#2b2a27">2.意门心路过程有两种</text>
<line x1="785.6" y1="173.8" x2="995.4" y2="173.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="788.6" y="165.9" font-size="14" font-weight="400" fill="#2b2a27">（1）最完整的欲界意门心路过程</text>
<line x1="571.7" y1="216.1" x2="832.4" y2="216.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="207.5" font-size="16" font-weight="500" fill="#2b2a27">1.清晰︰…→意门转向→速行→彼所缘…</text>
<line x1="571.7" y1="277.2" x2="848.4" y2="277.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="247.1" font-size="16" font-weight="500" fill="#2b2a27">2.不清晰(不含彼所缘)︰…→意门转向→</text>
<text x="574.7" y="268.7" font-size="16" font-weight="500" fill="#2b2a27">速行</text>
<line x1="894.4" y1="271.9" x2="1160.2" y2="271.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="897.4" y="245.1" font-size="14" font-weight="400" fill="#2b2a27">（2）安止速行意门心路过程：没有清晰与</text>
<text x="897.4" y="263.9" font-size="14" font-weight="400" fill="#2b2a27">不清晰之分别，亦不</text>
<line x1="571.7" y1="547.7" x2="721.7" y2="547.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="539.1" font-size="16" font-weight="500" fill="#2b2a27">（一）心生起的顺位</text>
<line x1="767.7" y1="333.1" x2="1027.4" y2="333.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="306.2" font-size="14" font-weight="400" fill="#2b2a27">1.「结生处」：于上一生的死心与这一生</text>
<text x="770.7" y="325.1" font-size="14" font-weight="400" fill="#2b2a27">第一个有分心的中间</text>
<line x1="767.7" y1="388.9" x2="1036.9" y2="388.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="362.1" font-size="14" font-weight="400" fill="#2b2a27">2.「有分处」：于 1）.结生处与转向（从</text>
<text x="770.7" y="380.9" font-size="14" font-weight="400" fill="#2b2a27">结生开始，持续生起</text>
<line x1="767.7" y1="444.7" x2="1036.9" y2="444.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="417.9" font-size="14" font-weight="400" fill="#2b2a27">3.「转向处」：于 1）.有分心与五识的中</text>
<text x="770.7" y="436.8" font-size="14" font-weight="400" fill="#2b2a27">间（过去有分、有分</text>
<line x1="767.7" y1="481.6" x2="1027.4" y2="481.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="473.7" font-size="14" font-weight="400" fill="#2b2a27">4.「五识处」：于五门转向与领受的中间</text>
<line x1="767.7" y1="518.5" x2="999.4" y2="518.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="510.6" font-size="14" font-weight="400" fill="#2b2a27">5.「领受处」：于五识与推度的中间</text>
<line x1="767.7" y1="555.4" x2="999.4" y2="555.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="547.5" font-size="14" font-weight="400" fill="#2b2a27">6.「推度处」：于领受与确定的中间</text>
<line x1="767.7" y1="611.1" x2="1038.6" y2="611.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="584.4" font-size="14" font-weight="400" fill="#2b2a27">7.「确定处」：于 1）.推度与速行；2）.</text>
<text x="770.7" y="603.2" font-size="14" font-weight="400" fill="#2b2a27">推度与有分等的中间</text>
<line x1="767.7" y1="666.9" x2="1030.7" y2="666.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="640.1" font-size="14" font-weight="400" fill="#2b2a27">8.「速行处」：于 1）.确定与彼所缘；2</text>
<text x="770.7" y="659.0" font-size="14" font-weight="400" fill="#2b2a27">）.确定与有分；3）.</text>
<line x1="767.7" y1="722.7" x2="1030.7" y2="722.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="695.9" font-size="14" font-weight="400" fill="#2b2a27">9.「彼所缘处」：于 1）.速行与有分；2</text>
<text x="770.7" y="714.8" font-size="14" font-weight="400" fill="#2b2a27">）.速行与死心等的中</text>
<line x1="767.7" y1="778.5" x2="1038.6" y2="778.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="751.7" font-size="14" font-weight="400" fill="#2b2a27">10.「死处」：于 1）.速行与结生(临死心</text>
<text x="770.7" y="770.6" font-size="14" font-weight="400" fill="#2b2a27">路,五个速行后死心生</text>
<line x1="571.7" y1="993.6" x2="689.7" y2="993.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="985.0" font-size="16" font-weight="500" fill="#2b2a27">（二）心之作用</text>
<line x1="735.7" y1="834.3" x2="1003.2" y2="834.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="807.5" font-size="14" font-weight="400" fill="#2b2a27">3.「从已生的状态，进入不存在，为‘死心</text>
<text x="738.7" y="826.4" font-size="14" font-weight="400" fill="#2b2a27">作用’</text>
<line x1="735.7" y1="890.1" x2="1004.9" y2="890.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="863.3" font-size="14" font-weight="400" fill="#2b2a27">5. 能执行看的作用的心（名为眼识）有 2</text>
<text x="738.7" y="882.2" font-size="14" font-weight="400" fill="#2b2a27"> 种：善果报与不善果</text>
<line x1="735.7" y1="945.9" x2="1003.2" y2="945.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="919.1" font-size="14" font-weight="400" fill="#2b2a27">6. 能执行领受作用的心（名为领受心）有</text>
<text x="738.7" y="938.0" font-size="14" font-weight="400" fill="#2b2a27"> 2 种：善果报与不善</text>
<line x1="735.7" y1="1001.7" x2="1003.2" y2="1001.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="974.9" font-size="14" font-weight="400" fill="#2b2a27">7. 能执行推度作用的心（名为推度心）有</text>
<text x="738.7" y="993.8" font-size="14" font-weight="400" fill="#2b2a27"> 3 种：善果报与不善</text>
<line x1="735.7" y1="1057.5" x2="998.7" y2="1057.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="1030.7" font-size="14" font-weight="400" fill="#2b2a27">8. 能执行确定作用的心有 1 种：意门转</text>
<text x="738.7" y="1049.6" font-size="14" font-weight="400" fill="#2b2a27">向心。（如理作意或不</text>
<line x1="735.7" y1="1113.3" x2="997.0" y2="1113.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="1086.5" font-size="14" font-weight="400" fill="#2b2a27">9. 「在所缘具有这个那个影响作用， 许</text>
<text x="738.7" y="1105.4" font-size="14" font-weight="400" fill="#2b2a27">多次或一次， 如跑一样的</text>
<line x1="735.7" y1="1169.1" x2="1003.2" y2="1169.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="1142.3" font-size="14" font-weight="400" fill="#2b2a27">10.「以抓取这个那个速行的所缘为所缘，</text>
<text x="738.7" y="1161.2" font-size="14" font-weight="400" fill="#2b2a27">为‘彼所缘作用’</text>
<rect x="337.7" y="1181.1" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="1211.1" font-size="19" font-weight="700" fill="#2b2a27">三、组别的分类方法</text>
<line x1="590.7" y1="1208.7" x2="694.6" y2="1208.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="1200.1" font-size="16" font-weight="500" fill="#2b2a27">6.异刹那业组</text>
<rect x="337.7" y="1363.0" width="283.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="1393.0" font-size="19" font-weight="700" fill="#2b2a27">四、不同论师的分类组合方法</text>
<line x1="666.7" y1="1288.0" x2="939.6" y2="1288.0" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="1257.8" font-size="16" font-weight="500" fill="#2b2a27">9.亲依止缘（可分为:无间亲依止缘、</text>
<text x="669.7" y="1279.4" font-size="16" font-weight="500" fill="#2b2a27">所缘亲依止缘、自然亲依</text>
<line x1="666.7" y1="1349.2" x2="939.6" y2="1349.2" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="1319.0" font-size="16" font-weight="500" fill="#2b2a27">20.不相应缘（名法与色法之间的关系</text>
<text x="669.7" y="1340.6" font-size="16" font-weight="500" fill="#2b2a27">，可分为:俱生不相应缘、</text>
<line x1="666.7" y1="1410.4" x2="939.6" y2="1410.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="1380.2" font-size="16" font-weight="500" fill="#2b2a27">1.俱生组， 明法尊者将单一色聚生起</text>
<text x="669.7" y="1401.8" font-size="16" font-weight="500" fill="#2b2a27">或存续的因缘条件单列出一</text>
<line x1="666.7" y1="1471.6" x2="930.6" y2="1471.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="1441.4" font-size="16" font-weight="500" fill="#2b2a27">2.依处组、所缘组，雷迪西亚多将此</text>
<text x="669.7" y="1463.0" font-size="16" font-weight="500" fill="#2b2a27">二组合并为前生组 17 缘</text>
<line x1="666.7" y1="1532.8" x2="930.6" y2="1532.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="1502.6" font-size="16" font-weight="500" fill="#2b2a27">4.异刹那业组，帕奥西亚多将异刹那</text>
<text x="669.7" y="1524.2" font-size="16" font-weight="500" fill="#2b2a27">业组列为 6 缘(无间组部分</text>
</svg>