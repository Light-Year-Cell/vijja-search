<rect x="30" y="319.6" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="356.6" font-size="26" font-weight="700" fill="#fff">第41讲-摄缘-十二</text>
<text x="48.0" y="391.7" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘41-</text>
<text x="48.0" y="426.8" font-size="26" font-weight="700" fill="#fff">释二十四缘-业缘3</text>
<rect x="337.7" y="165.5" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="195.5" font-size="19" font-weight="700" fill="#2b2a27">四、小业分别经</text>
<line x1="552.7" y1="202.2" x2="686.7" y2="202.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="193.6" font-size="16" font-weight="500" fill="#2b2a27">（二）十四种方式</text>
<line x1="732.7" y1="89.8" x2="838.4" y2="89.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="735.7" y="81.9" font-size="14" font-weight="400" fill="#2b2a27">5.不布施与布施</text>
<line x1="884.4" y1="53.5" x2="1040.6" y2="53.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="46.0" font-size="13" font-weight="400" fill="#2b2a27">（1）吝啬的多迭亚婆罗门</text>
<line x1="884.4" y1="89.1" x2="1085.9" y2="89.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="81.5" font-size="13" font-weight="400" fill="#2b2a27">（2）阿难德(Ānanda)富翁的故事</text>
<line x1="884.4" y1="124.6" x2="988.6" y2="124.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="117.1" font-size="13" font-weight="400" fill="#2b2a27">（3）西瓦里尊者</text>
<line x1="732.7" y1="178.7" x2="838.4" y2="178.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="735.7" y="170.8" font-size="14" font-weight="400" fill="#2b2a27">6.傲慢与不傲慢</text>
<line x1="884.4" y1="160.2" x2="988.6" y2="160.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="152.6" font-size="13" font-weight="400" fill="#2b2a27">（1）苏尼德尊者</text>
<line x1="884.4" y1="195.8" x2="988.6" y2="195.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="188.2" font-size="13" font-weight="400" fill="#2b2a27">（2）伍巴离尊者</text>
<line x1="732.7" y1="311.9" x2="838.4" y2="311.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="735.7" y="304.0" font-size="14" font-weight="400" fill="#2b2a27">7.不好问与好问</text>
<line x1="884.4" y1="231.3" x2="1014.6" y2="231.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="223.8" font-size="13" font-weight="400" fill="#2b2a27">（1）不好问导致愚蠢</text>
<line x1="884.4" y1="266.9" x2="1001.6" y2="266.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="259.3" font-size="13" font-weight="400" fill="#2b2a27">（2）好问导致聪慧</text>
<line x1="884.4" y1="302.4" x2="975.6" y2="302.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="294.9" font-size="13" font-weight="400" fill="#2b2a27">（3）如何会问</text>
<line x1="884.4" y1="355.5" x2="1133.2" y2="355.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="330.4" font-size="13" font-weight="400" fill="#2b2a27">（1）与老师互动的态度：1.是消极互动还</text>
<text x="887.4" y="348.0" font-size="13" font-weight="400" fill="#2b2a27">是积极互动；2.积极</text>
<line x1="884.4" y1="391.1" x2="975.6" y2="391.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="383.5" font-size="13" font-weight="400" fill="#2b2a27">（2）禅修报告</text>
<rect x="337.7" y="553.2" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="583.2" font-size="19" font-weight="700" fill="#2b2a27">五、业的分类</text>
<line x1="533.7" y1="430.7" x2="728.5" y2="430.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="422.1" font-size="16" font-weight="500" fill="#2b2a27">(1) 一种业指思。 佛陀说</text>
<line x1="533.7" y1="470.3" x2="735.5" y2="470.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="461.7" font-size="16" font-weight="500" fill="#2b2a27">(2) 两种业指善业和不善业</text>
<line x1="533.7" y1="531.5" x2="799.5" y2="531.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="501.3" font-size="16" font-weight="500" fill="#2b2a27">(3) 三种业指身业、语业、意业，即</text>
<text x="536.7" y="522.9" font-size="16" font-weight="500" fill="#2b2a27">通过身、语、意三门所造之</text>
<line x1="533.7" y1="592.7" x2="799.5" y2="592.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="562.5" font-size="16" font-weight="500" fill="#2b2a27">(4) 按不同的分类法可以把业分为若</text>
<text x="536.7" y="584.1" font-size="16" font-weight="500" fill="#2b2a27">干组四种业， 有些老师说是</text>
<line x1="533.7" y1="749.0" x2="683.7" y2="749.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="740.4" font-size="16" font-weight="500" fill="#2b2a27">（一）依产生的作用</text>
<line x1="729.7" y1="629.6" x2="918.8" y2="629.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="621.7" font-size="14" font-weight="400" fill="#2b2a27">(1) 令生业(janaka kamma)</text>
<line x1="729.7" y1="666.5" x2="973.7" y2="666.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="658.6" font-size="14" font-weight="400" fill="#2b2a27">(2) 支持业(upatthambhaka kamma)</text>
<line x1="729.7" y1="703.4" x2="942.3" y2="703.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="695.5" font-size="14" font-weight="400" fill="#2b2a27">(3) 阻碍业(upapīḷaka kamma)</text>
<line x1="729.7" y1="740.3" x2="950.2" y2="740.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="732.4" font-size="14" font-weight="400" fill="#2b2a27">(4) 毁坏业(upaghātaka kamma)</text>
<line x1="729.7" y1="798.6" x2="793.4" y2="798.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="790.7" font-size="14" font-weight="400" fill="#2b2a27">1.令生业</text>
<line x1="839.4" y1="775.8" x2="1083.5" y2="775.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="768.3" font-size="13" font-weight="400" fill="#2b2a27">(1) 结生心(paṭisandhi-citta)：识蕴</text>
<line x1="839.4" y1="828.9" x2="1082.5" y2="828.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="803.8" font-size="13" font-weight="400" fill="#2b2a27">(3) 有情的色身：这是色蕴，在此指六处</text>
<text x="842.4" y="821.4" font-size="13" font-weight="400" fill="#2b2a27">等业生的色相续</text>
<line x1="729.7" y1="865.8" x2="793.4" y2="865.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="857.9" font-size="14" font-weight="400" fill="#2b2a27">2.支持业</text>
</svg>