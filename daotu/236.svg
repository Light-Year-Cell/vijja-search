<rect x="30" y="79.0" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="116.0" font-size="26" font-weight="700" fill="#fff">第40讲-摄缘-十二</text>
<text x="48.0" y="151.1" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘40-</text>
<text x="48.0" y="186.2" font-size="26" font-weight="700" fill="#fff">释二十四缘-业缘2</text>
<rect x="337.7" y="30.0" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">三、业与果</text>
<rect x="337.7" y="207.6" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="237.6" font-size="19" font-weight="700" fill="#2b2a27">四、小业分别经</text>
<line x1="552.7" y1="115.2" x2="686.7" y2="115.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="106.7" font-size="16" font-weight="500" fill="#2b2a27">（一）开示的缘起</text>
<line x1="552.7" y1="373.2" x2="686.7" y2="373.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="364.6" font-size="16" font-weight="500" fill="#2b2a27">（二）十四种方式</text>
<line x1="732.7" y1="280.5" x2="998.0" y2="280.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="735.7" y="253.7" font-size="14" font-weight="400" fill="#2b2a27">2.加害（viheṭhaka）与不加害（aviheṭ</text>
<text x="735.7" y="272.6" font-size="14" font-weight="400" fill="#2b2a27">haka）</text>
<line x1="1044.0" y1="150.8" x2="1174.2" y2="150.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1047.0" y="143.2" font-size="13" font-weight="400" fill="#2b2a27">（1）什么是四梵住？</text>
<line x1="1044.0" y1="186.4" x2="1148.2" y2="186.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1047.0" y="178.8" font-size="13" font-weight="400" fill="#2b2a27">（2）拔库喇尊者</text>
<line x1="1044.0" y1="239.5" x2="1292.8" y2="239.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1047.0" y="214.4" font-size="13" font-weight="400" fill="#2b2a27">(1)作为布施者的拔库喇，是具戒之人。他</text>
<text x="1047.0" y="231.9" font-size="13" font-weight="400" fill="#2b2a27">有八定、五神通，已</text>
<line x1="1044.0" y1="292.6" x2="1292.8" y2="292.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1047.0" y="267.5" font-size="13" font-weight="400" fill="#2b2a27">(2)作为受施者的佛陀，是一切世间中德行</text>
<text x="1047.0" y="285.0" font-size="13" font-weight="400" fill="#2b2a27">最高的人</text>
<line x1="1044.0" y1="345.7" x2="1292.8" y2="345.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1047.0" y="320.6" font-size="13" font-weight="400" fill="#2b2a27">(3)作为布施物的药，是拔库喇在森林中如</text>
<text x="1047.0" y="338.1" font-size="13" font-weight="400" fill="#2b2a27">法获得的</text>
<line x1="1044.0" y1="398.8" x2="1292.8" y2="398.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1047.0" y="373.7" font-size="13" font-weight="400" fill="#2b2a27">(4)作为布施者的拔库喇，在布施前、布施</text>
<text x="1047.0" y="391.2" font-size="13" font-weight="400" fill="#2b2a27">时和布施后，其心都</text>
<line x1="732.7" y1="435.7" x2="838.4" y2="435.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="735.7" y="427.8" font-size="14" font-weight="400" fill="#2b2a27">3.易怒与不易怒</text>
<line x1="884.4" y1="434.3" x2="975.6" y2="434.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="426.8" font-size="13" font-weight="400" fill="#2b2a27">（1）库瑟本生</text>
<line x1="732.7" y1="472.6" x2="838.4" y2="472.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="735.7" y="464.7" font-size="14" font-weight="400" fill="#2b2a27">4.嫉妒与不嫉妒</text>
<line x1="884.4" y1="471.2" x2="1014.6" y2="471.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="887.4" y="463.7" font-size="13" font-weight="400" fill="#2b2a27">（1）娄萨卡提瑟尊者</text>
