<rect x="30" y="641.6" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="678.6" font-size="26" font-weight="700" fill="#fff">第15讲-摄缘-十二</text>
<text x="48.0" y="713.7" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘15-</text>
<text x="48.0" y="748.8" font-size="26" font-weight="700" fill="#fff">释二十四缘-增上缘</text>
<text x="48.0" y="783.9" font-size="26" font-weight="700" fill="#fff">2</text>
<rect x="337.7" y="40.8" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="70.8" font-size="19" font-weight="700" fill="#2b2a27">一、俱生主导（增上）</text>
<line x1="609.7" y1="57.6" x2="839.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）俱生主导（增上）的经文</text>
<line x1="609.7" y1="97.2" x2="855.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）俱生主导（增上）缘的譬喻</text>
<rect x="337.7" y="232.5" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="262.5" font-size="19" font-weight="700" fill="#2b2a27">二、欲主导</text>
<line x1="514.7" y1="136.8" x2="680.7" y2="136.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（一）欲心所相等四法</text>
<line x1="514.7" y1="176.4" x2="728.7" y2="176.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">（二）欲主导（增上）的表现</text>
<line x1="514.7" y1="299.7" x2="792.7" y2="299.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="269.5" font-size="16" font-weight="500" fill="#2b2a27">（三）欲主导（增上）的缘法、缘所生</text>
<text x="517.7" y="291.1" font-size="16" font-weight="500" fill="#2b2a27">法及所摄诸缘</text>
<line x1="838.7" y1="213.3" x2="1106.2" y2="213.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="841.7" y="205.4" font-size="14" font-weight="400" fill="#2b2a27">1. 善的欲主导（增上）的缘法及缘所生法</text>
<line x1="838.7" y1="269.1" x2="1106.2" y2="269.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="841.7" y="242.3" font-size="14" font-weight="400" fill="#2b2a27">2. 不善的欲主导（增上）的缘法及缘所生</text>
<text x="841.7" y="261.2" font-size="14" font-weight="400" fill="#2b2a27">法</text>
<line x1="838.7" y1="324.9" x2="1106.2" y2="324.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="841.7" y="298.1" font-size="14" font-weight="400" fill="#2b2a27">3. 对于欲主导（增上）的缘法与缘所生法</text>
<text x="841.7" y="317.0" font-size="14" font-weight="400" fill="#2b2a27">的总结</text>
<line x1="838.7" y1="361.8" x2="1022.2" y2="361.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="841.7" y="353.9" font-size="14" font-weight="400" fill="#2b2a27">4. 欲主导（增上）所摄诸缘</text>
<line x1="514.7" y1="401.4" x2="744.7" y2="401.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="392.8" font-size="16" font-weight="500" fill="#2b2a27">（四）善用善的欲主导（增上）</text>
<rect x="337.7" y="494.4" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="524.4" font-size="19" font-weight="700" fill="#2b2a27">三、精进主导</text>
<line x1="533.7" y1="441.0" x2="708.6" y2="441.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="432.4" font-size="16" font-weight="500" fill="#2b2a27">(一）精进心所相等四法</text>
<line x1="533.7" y1="502.2" x2="811.7" y2="502.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="472.0" font-size="16" font-weight="500" fill="#2b2a27">（二）精进主导（增上）的缘法、缘所</text>
<text x="536.7" y="493.6" font-size="16" font-weight="500" fill="#2b2a27">生法及所涉诸缘</text>
<line x1="533.7" y1="541.8" x2="683.7" y2="541.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="533.2" font-size="16" font-weight="500" fill="#2b2a27">（三）精进的重要性</text>
<line x1="533.7" y1="581.4" x2="651.7" y2="581.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="572.8" font-size="16" font-weight="500" fill="#2b2a27">（四）八悚惧事</text>
<line x1="533.7" y1="621.0" x2="651.7" y2="621.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="612.4" font-size="16" font-weight="500" fill="#2b2a27">（五）八精进事</text>
<rect x="337.7" y="633.0" width="293.6" height="99.0" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="663.0" font-size="19" font-weight="700" fill="#2b2a27">一、 远行之前省思远行时没有</text>
<text x="355.7" y="688.7" font-size="19" font-weight="700" fill="#2b2a27">时间修行， 所以在远行之前加</text>
<text x="355.7" y="714.3" font-size="19" font-weight="700" fill="#2b2a27">倍精</text>
<rect x="337.7" y="742.0" width="293.6" height="99.0" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="772.0" font-size="19" font-weight="700" fill="#2b2a27">二、 远行之后省思远行时没能</text>
<text x="355.7" y="797.6" font-size="19" font-weight="700" fill="#2b2a27">好好修行， 所以在远行之后加</text>
<text x="355.7" y="823.3" font-size="19" font-weight="700" fill="#2b2a27">倍精</text>
<rect x="337.7" y="850.9" width="293.6" height="99.0" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="355.7" y="880.9" font-size="19" font-weight="700" fill="#2b2a27">三、 工作之前省思工作时没有</text>
<text x="355.7" y="906.6" font-size="19" font-weight="700" fill="#2b2a27">时间修行， 所以在工作之前加</text>
<text x="355.7" y="932.2" font-size="19" font-weight="700" fill="#2b2a27">倍精</text>
<rect x="337.7" y="959.9" width="293.6" height="99.0" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="355.7" y="989.9" font-size="19" font-weight="700" fill="#2b2a27">四、 工作之后省思工作时没能</text>
<text x="355.7" y="1015.5" font-size="19" font-weight="700" fill="#2b2a27">好好修行， 所以在工作之后加</text>
<text x="355.7" y="1041.2" font-size="19" font-weight="700" fill="#2b2a27">倍精</text>
<rect x="337.7" y="1068.8" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#8a6d3b" stroke-width="2.2"/>
<text x="355.7" y="1098.8" font-size="19" font-weight="700" fill="#2b2a27">五、生病时省思病情可能会恶化</text>
<text x="355.7" y="1124.5" font-size="19" font-weight="700" fill="#2b2a27">，所以趁早修行</text>
<rect x="337.7" y="1152.1" width="293.6" height="99.0" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="1182.1" font-size="19" font-weight="700" fill="#2b2a27">六、 病愈后省思生病时没能好</text>
<text x="355.7" y="1207.8" font-size="19" font-weight="700" fill="#2b2a27">好修行， 所以在病愈之后加倍</text>
<text x="355.7" y="1233.4" font-size="19" font-weight="700" fill="#2b2a27">精进</text>
<rect x="337.7" y="1261.1" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="1291.1" font-size="19" font-weight="700" fill="#2b2a27">七、得不到足够的食物时，省思</text>
<text x="355.7" y="1316.7" font-size="19" font-weight="700" fill="#2b2a27">吃得少即身轻好修行</text>
<rect x="337.7" y="1344.4" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="1374.4" font-size="19" font-weight="700" fill="#2b2a27">八、得到许多食物时，省思吃得</text>
<text x="355.7" y="1400.0" font-size="19" font-weight="700" fill="#2b2a27">饱有力气修行。(《阿毗达摩概</text>
</svg>