<rect x="30" y="361.4" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="398.4" font-size="26" font-weight="700" fill="#fff">第81讲-摄缘-十二</text>
<text x="48.0" y="433.5" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘81-</text>
<text x="48.0" y="468.6" font-size="26" font-weight="700" fill="#fff">十二缘起的杂论1</text>
<rect x="337.7" y="72.3" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="102.3" font-size="19" font-weight="700" fill="#2b2a27">一、十二缘起的特质</text>
<line x1="590.7" y1="108.9" x2="756.7" y2="108.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="100.3" font-size="16" font-weight="500" fill="#2b2a27">（一）无明因愁等成就</text>
<line x1="802.7" y1="107.5" x2="970.5" y2="107.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="805.7" y="99.6" font-size="14" font-weight="400" fill="#2b2a27">1、漏集起故而有这愁等法</text>
<line x1="1016.5" y1="53.5" x2="1081.8" y2="53.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1019.5" y="46.0" font-size="13" font-weight="400" fill="#2b2a27">（1）欲漏</text>
<line x1="1016.5" y1="89.1" x2="1081.8" y2="89.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1019.5" y="81.5" font-size="13" font-weight="400" fill="#2b2a27">（2）见漏</text>
<line x1="1016.5" y1="124.6" x2="1081.8" y2="124.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1019.5" y="117.1" font-size="13" font-weight="400" fill="#2b2a27">（3）有漏</text>
<line x1="1016.5" y1="160.2" x2="1094.8" y2="160.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1019.5" y="152.6" font-size="13" font-weight="400" fill="#2b2a27">（4）无明漏</text>
<rect x="337.7" y="172.2" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="202.2" font-size="19" font-weight="700" fill="#2b2a27">一、不善果报身识苦受</text>
<rect x="337.7" y="229.8" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="259.9" font-size="19" font-weight="700" fill="#2b2a27">二、忧俱嗔相应有行心</text>
<rect x="337.7" y="456.2" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="486.2" font-size="19" font-weight="700" fill="#2b2a27">三、忧俱嗔相应无行心</text>
<line x1="609.7" y1="315.1" x2="768.6" y2="315.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="306.5" font-size="16" font-weight="500" fill="#2b2a27">2、无明由愁等而成就</text>
<line x1="609.7" y1="376.3" x2="880.6" y2="376.3" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="346.1" font-size="16" font-weight="500" fill="#2b2a27">1、俱生缘，愁悲苦忧恼的心中一定有</text>
<text x="612.7" y="367.7" font-size="16" font-weight="500" fill="#2b2a27">痴心所，是俱生的</text>
<line x1="609.7" y1="437.5" x2="882.6" y2="437.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="407.3" font-size="16" font-weight="500" fill="#2b2a27">2、 自然亲依止缘， 愁悲忧恼的心生</text>
<text x="612.7" y="428.9" font-size="16" font-weight="500" fill="#2b2a27">起的同时缘助未来无明生起</text>
<line x1="609.7" y1="498.7" x2="880.6" y2="498.7" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="468.5" font-size="16" font-weight="500" fill="#2b2a27">3、无间缘，前一嗔速行心中的愁悲苦</text>
<text x="612.7" y="490.1" font-size="16" font-weight="500" fill="#2b2a27">忧恼对后一速行心的生起</text>
<line x1="609.7" y1="538.3" x2="775.7" y2="538.3" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="529.7" font-size="16" font-weight="500" fill="#2b2a27">（二）此有轮不知始等</text>
<line x1="609.7" y1="609.2" x2="775.7" y2="609.2" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="600.6" font-size="16" font-weight="500" fill="#2b2a27">（三）无有作者与受者</text>
<line x1="821.7" y1="594.1" x2="1089.2" y2="594.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="824.7" y="567.3" font-size="14" font-weight="400" fill="#2b2a27">（1）如此构想出的创造轮回的梵天等——即</text>
<text x="824.7" y="586.2" font-size="14" font-weight="400" fill="#2b2a27">那[无明等因]以外</text>
<line x1="821.7" y1="631.0" x2="1031.5" y2="631.0" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="824.7" y="623.1" font-size="14" font-weight="400" fill="#2b2a27">（2）如此构想出的感受苦乐之我</text>
<line x1="609.7" y1="670.6" x2="775.7" y2="670.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="662.0" font-size="16" font-weight="500" fill="#2b2a27">（四）以十二空而空无</text>
<rect x="337.7" y="730.3" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="760.3" font-size="19" font-weight="700" fill="#2b2a27">二、三世两重因果</text>
<line x1="571.7" y1="710.2" x2="737.7" y2="710.2" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="701.6" font-size="16" font-weight="500" fill="#2b2a27">（一）两种有轮的三时</text>
<line x1="571.7" y1="766.9" x2="737.7" y2="766.9" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="758.3" font-size="16" font-weight="500" fill="#2b2a27">（二）三连结及四摄类</text>
<line x1="783.7" y1="747.1" x2="853.5" y2="747.1" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="786.7" y="739.2" font-size="14" font-weight="400" fill="#2b2a27">1、三连结</text>
<line x1="783.7" y1="784.0" x2="853.5" y2="784.0" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="786.7" y="776.1" font-size="14" font-weight="400" fill="#2b2a27">2、四摄类</text>
<line x1="571.7" y1="823.6" x2="721.7" y2="823.6" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="815.0" font-size="16" font-weight="500" fill="#2b2a27">（三）二十行相的辐</text>
</svg>