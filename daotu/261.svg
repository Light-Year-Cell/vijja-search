<rect x="30" y="372.4" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="409.4" font-size="26" font-weight="700" fill="#fff">第65讲-摄缘-十二</text>
<text x="48.0" y="444.5" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘65-</text>
<text x="48.0" y="479.6" font-size="26" font-weight="700" fill="#fff">路心的缘-诸缘协力</text>
<text x="48.0" y="514.7" font-size="26" font-weight="700" fill="#fff">之法与无明缘行4</text>
<rect x="337.7" y="155.5" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="185.5" font-size="19" font-weight="700" fill="#2b2a27">一、诸缘协力之法</text>
<line x1="571.7" y1="57.6" x2="785.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）一切心生起共通之诸缘</text>
<line x1="571.7" y1="97.2" x2="769.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）于五识之诸缘协力法</text>
<line x1="571.7" y1="136.8" x2="849.7" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三）其他无因心生起时之诸缘协力法</text>
<line x1="571.7" y1="176.4" x2="817.7" y2="176.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">（四）不善心生起时之诸缘协力法</text>
<line x1="571.7" y1="251.5" x2="801.7" y2="251.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="242.9" font-size="16" font-weight="500" fill="#2b2a27">（五）美心生起时之诸缘协力法</text>
<line x1="847.7" y1="213.3" x2="1093.4" y2="213.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="850.7" y="205.4" font-size="14" font-weight="400" fill="#2b2a27">1.七遍一切心心所作为诸缘协力的缘力</text>
<line x1="847.7" y1="250.2" x2="1051.4" y2="250.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="850.7" y="242.3" font-size="14" font-weight="400" fill="#2b2a27">2.六杂心所作为诸缘协力的缘力</text>
<line x1="847.7" y1="287.1" x2="1079.4" y2="287.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="850.7" y="279.2" font-size="14" font-weight="400" fill="#2b2a27">3.二十五美心所作为诸缘协力的缘力</text>
<line x1="571.7" y1="326.7" x2="769.7" y2="326.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="318.1" font-size="16" font-weight="500" fill="#2b2a27">（六）于色聚之诸缘协力法</text>
<rect x="337.7" y="435.9" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="465.9" font-size="19" font-weight="700" fill="#2b2a27">二、回顾无明缘行</text>
<line x1="571.7" y1="387.9" x2="837.5" y2="387.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="357.7" font-size="16" font-weight="500" fill="#2b2a27">1.路心作意。 对于路心的转起， 为</text>
<text x="574.7" y="379.3" font-size="16" font-weight="500" fill="#2b2a27">什么你会去看、 去听？为什么</text>
<line x1="571.7" y1="449.1" x2="844.6" y2="449.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="418.9" font-size="16" font-weight="500" fill="#2b2a27">2.速行作意。 所缘引发善或不善速行</text>
<text x="574.7" y="440.5" font-size="16" font-weight="500" fill="#2b2a27">， 也是自然亲依止缘在起作</text>
<line x1="571.7" y1="488.7" x2="762.6" y2="488.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="480.1" font-size="16" font-weight="500" fill="#2b2a27">1、亲依止缘引发路心生起</text>
<line x1="571.7" y1="528.3" x2="794.6" y2="528.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="519.7" font-size="16" font-weight="500" fill="#2b2a27">2、亲依止缘引发速行善与不善</text>
<line x1="571.7" y1="567.9" x2="796.6" y2="567.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="559.3" font-size="16" font-weight="500" fill="#2b2a27">1.信、戒、闻/学、施舍、智慧</text>
<rect x="337.7" y="704.1" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="734.1" font-size="19" font-weight="700" fill="#2b2a27">三、行的缘只有无明吗？</text>
<line x1="628.7" y1="629.1" x2="899.6" y2="629.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="598.9" font-size="16" font-weight="500" fill="#2b2a27">（1）先说对于死迷妄者，他们常常不</text>
<text x="631.7" y="620.5" font-size="16" font-weight="500" fill="#2b2a27">以为死即是诸蕴破坏的意</text>
<line x1="628.7" y1="690.3" x2="901.6" y2="690.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="660.1" font-size="16" font-weight="500" fill="#2b2a27">（2） 对于生迷妄者， 他不以为生即</text>
<text x="631.7" y="681.7" font-size="16" font-weight="500" fill="#2b2a27">是诸蕴现前的意思 （结生时</text>
<line x1="628.7" y1="751.5" x2="899.6" y2="751.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="721.3" font-size="16" font-weight="500" fill="#2b2a27">（3）对于轮回而迷妄者，他不以为轮</text>
<text x="631.7" y="742.9" font-size="16" font-weight="500" fill="#2b2a27">回的意义是诸蕴和界、处</text>
<line x1="628.7" y1="812.7" x2="899.6" y2="812.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="782.5" font-size="16" font-weight="500" fill="#2b2a27">（4）对于诸行的相而迷妄者，他不以</text>
<text x="631.7" y="804.1" font-size="16" font-weight="500" fill="#2b2a27">为五蕴诸行的自性相，就</text>
<line x1="628.7" y1="873.9" x2="899.6" y2="873.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="843.7" font-size="16" font-weight="500" fill="#2b2a27">（5）对诸缘起之法而迷妄（混淆、糊</text>
<text x="631.7" y="865.3" font-size="16" font-weight="500" fill="#2b2a27">涂、愚痴）者，不以为由</text>
</svg>