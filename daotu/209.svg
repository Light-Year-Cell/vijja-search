<rect x="30" y="370.2" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="407.2" font-size="26" font-weight="700" fill="#fff">第13讲-摄缘-十二</text>
<text x="48.0" y="442.3" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘13-</text>
<text x="48.0" y="477.4" font-size="26" font-weight="700" fill="#fff">释二十四缘-所缘缘</text>
<text x="48.0" y="512.5" font-size="26" font-weight="700" fill="#fff">2</text>
<rect x="337.7" y="56.5" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="86.5" font-size="19" font-weight="700" fill="#2b2a27">一、从意门心路看所缘缘</text>
<line x1="628.7" y1="93.2" x2="730.7" y2="93.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="84.5" font-size="16" font-weight="500" fill="#2b2a27">（一）法所缘</text>
<line x1="776.7" y1="54.9" x2="890.2" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="779.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1. 欲界意门心路</text>
<line x1="776.7" y1="91.8" x2="890.2" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="779.7" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2. 禅那速行心路</text>
<line x1="776.7" y1="128.7" x2="890.2" y2="128.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="779.7" y="120.8" font-size="14" font-weight="400" fill="#2b2a27">3. 道果速行心路</text>
<rect x="337.7" y="219.3" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="249.3" font-size="19" font-weight="700" fill="#2b2a27">二、如何面对所缘</text>
<line x1="571.7" y1="168.3" x2="737.7" y2="168.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="159.7" font-size="16" font-weight="500" fill="#2b2a27">（一）六门所缘如盗贼</text>
<line x1="571.7" y1="207.9" x2="833.7" y2="207.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="199.3" font-size="16" font-weight="500" fill="#2b2a27">（二）有训练的心以六支舍面对所缘</text>
<line x1="571.7" y1="343.6" x2="753.7" y2="343.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="335.0" font-size="16" font-weight="500" fill="#2b2a27">（三）修行的两个入手处</text>
<line x1="799.7" y1="297.4" x2="871.2" y2="297.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.7" y="289.6" font-size="14" font-weight="400" fill="#2b2a27">1. 触和受</text>
<line x1="917.2" y1="243.5" x2="997.0" y2="243.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="920.2" y="235.9" font-size="13" font-weight="400" fill="#2b2a27">(1)防护舍断</text>
<line x1="917.2" y1="279.0" x2="997.0" y2="279.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="920.2" y="271.4" font-size="13" font-weight="400" fill="#2b2a27">(2)受用舍断</text>
<line x1="917.2" y1="314.6" x2="997.0" y2="314.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="920.2" y="307.0" font-size="13" font-weight="400" fill="#2b2a27">(3)忍耐舍断</text>
<line x1="917.2" y1="350.1" x2="997.0" y2="350.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="920.2" y="342.6" font-size="13" font-weight="400" fill="#2b2a27">(4)回避舍断</text>
<line x1="799.7" y1="387.0" x2="857.2" y2="387.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.7" y="379.1" font-size="14" font-weight="400" fill="#2b2a27">2. 想蕴</text>
<rect x="337.7" y="399.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="429.0" font-size="19" font-weight="700" fill="#2b2a27">第二、看背后的缘起（要有缘起</text>
<text x="355.7" y="454.6" font-size="19" font-weight="700" fill="#2b2a27">性思惟、此缘性思惟）。遇到所</text>
<rect x="337.7" y="798.6" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="828.6" font-size="19" font-weight="700" fill="#2b2a27">三、所缘缘思维模式的培养</text>
<line x1="647.7" y1="647.6" x2="845.7" y2="647.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="650.7" y="639.0" font-size="16" font-weight="500" fill="#2b2a27">（一）善用所缘缘积累法财</text>
<line x1="891.7" y1="526.1" x2="1159.8" y2="526.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="894.7" y="499.3" font-size="14" font-weight="400" fill="#2b2a27">(1) 信(saddhā)：对佛、法、僧三宝坚定</text>
<text x="894.7" y="518.2" font-size="14" font-weight="400" fill="#2b2a27">的信心</text>
<line x1="891.7" y1="581.9" x2="1158.1" y2="581.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="894.7" y="555.1" font-size="14" font-weight="400" fill="#2b2a27">(2) 戒(sīla)：就在家人而言，这是指持</text>
<text x="894.7" y="574.0" font-size="14" font-weight="400" fill="#2b2a27">守清净的五戒，就算生</text>
<line x1="891.7" y1="618.8" x2="1116.1" y2="618.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="894.7" y="610.9" font-size="14" font-weight="400" fill="#2b2a27">(3) 惭(hiri)：厌恶（羞耻）作恶</text>
<line x1="891.7" y1="655.7" x2="1083.6" y2="655.7" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="894.7" y="647.8" font-size="14" font-weight="400" fill="#2b2a27">(4) 愧(ottappa)：害怕作恶</text>
<line x1="891.7" y1="692.6" x2="1074.1" y2="692.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="894.7" y="684.7" font-size="14" font-weight="400" fill="#2b2a27">(5) 闻(suta)：对佛法多闻</text>
<line x1="891.7" y1="729.5" x2="1074.1" y2="729.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="894.7" y="721.6" font-size="14" font-weight="400" fill="#2b2a27">(6) 舍(cāga)：慷慨地布施</text>
<line x1="891.7" y1="785.3" x2="1151.9" y2="785.3" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="894.7" y="758.5" font-size="14" font-weight="400" fill="#2b2a27">(7) 慧(paññā)：对戒、定、慧三学的闻</text>
<text x="894.7" y="777.4" font-size="14" font-weight="400" fill="#2b2a27">、思、修之慧</text>
<line x1="647.7" y1="824.9" x2="847.6" y2="824.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="650.7" y="816.3" font-size="16" font-weight="500" fill="#2b2a27">（二）“信”的培育与所缘缘</text>
<line x1="647.7" y1="864.5" x2="847.6" y2="864.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="650.7" y="855.9" font-size="16" font-weight="500" fill="#2b2a27">（三）“舍”的培育与所缘缘</text>
<line x1="647.7" y1="904.1" x2="847.6" y2="904.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="650.7" y="895.5" font-size="16" font-weight="500" fill="#2b2a27">（四）“戒”的培育与所缘缘</text>
<line x1="647.7" y1="943.7" x2="863.6" y2="943.7" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="650.7" y="935.1" font-size="16" font-weight="500" fill="#2b2a27">（五）“禅那”的培育与所缘缘</text>
<line x1="647.7" y1="983.3" x2="863.6" y2="983.3" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="650.7" y="974.7" font-size="16" font-weight="500" fill="#2b2a27">（六）“观禅”的培育与所缘缘</text>
<line x1="647.7" y1="1022.9" x2="879.6" y2="1022.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="650.7" y="1014.3" font-size="16" font-weight="500" fill="#2b2a27">（七）“道果智”生起时的所缘缘</text>
</svg>