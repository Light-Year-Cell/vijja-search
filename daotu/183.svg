<text x="792.9" y="422.3" font-size="14" font-weight="400" fill="#2b2a27">5.更高的观智阶段</text>
<line x1="577.9" y1="469.8" x2="775.9" y2="469.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="461.2" font-size="16" font-weight="500" fill="#2b2a27">（二）第二至九种坟场不净</text>
