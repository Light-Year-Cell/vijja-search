<text x="48.0" y="280.8" font-size="26" font-weight="700" fill="#fff">183讲-摄集31-摄菩</text>
<text x="48.0" y="315.9" font-size="26" font-weight="700" fill="#fff">提分-身念处-界作</text>
<text x="48.0" y="351.0" font-size="26" font-weight="700" fill="#fff">意&amp;九坟场不净</text>
<rect x="343.9" y="72.6" width="285.3" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="102.6" font-size="19" font-weight="700" fill="#2b2a27">一、接下来学习身至念——界作</text>
<text x="361.9" y="128.3" font-size="19" font-weight="700" fill="#2b2a27">意部分（也称为界差别）。界</text>
<line x1="675.2" y1="57.6" x2="921.2" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="678.2" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）依十二特相观察身体的四界</text>
<line x1="675.2" y1="97.2" x2="953.2" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="678.2" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）修习四界达到平衡可以提升定力</text>
<line x1="675.2" y1="186.5" x2="905.2" y2="186.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="678.2" y="177.9" font-size="16" font-weight="500" fill="#2b2a27">（三）修习界作意可以培育观智</text>
<line x1="951.2" y1="134.1" x2="1176.7" y2="134.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="954.2" y="126.2" font-size="14" font-weight="400" fill="#2b2a27">1. 缘摄受智：观照名色因果的智慧</text>
<line x1="951.2" y1="189.9" x2="1218.7" y2="189.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="954.2" y="163.1" font-size="14" font-weight="400" fill="#2b2a27">2. 思惟智：观照诸十一种名色法无常、苦</text>
<text x="954.2" y="182.0" font-size="14" font-weight="400" fill="#2b2a27">、无我三相的智慧</text>
<line x1="951.2" y1="245.7" x2="1218.7" y2="245.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="954.2" y="218.9" font-size="14" font-weight="400" fill="#2b2a27">3. 生灭随观智：观照行法的生灭为无常、</text>
<text x="954.2" y="237.8" font-size="14" font-weight="400" fill="#2b2a27">苦、无我的智慧</text>
