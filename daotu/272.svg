<text x="612.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（5） （非现在的色等五处及法处对</text>
<text x="612.7" y="70.6" font-size="16" font-weight="500" fill="#2b2a27">于意触）只由所缘缘为缘</text>
