<text x="593.7" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">1.调整自己的底层认知， 为什么会有</text>
<text x="593.7" y="131.8" font-size="16" font-weight="500" fill="#2b2a27">这样的触。 正确的底层认知</text>
