<text x="572.6" y="1876.2" font-size="16" font-weight="500" fill="#2b2a27">（2）发问。勤于发问</text>
<line x1="569.6" y1="1924.4" x2="680.5" y2="1924.4" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="572.6" y="1915.8" font-size="16" font-weight="500" fill="#2b2a27">（3）了解戒律</text>
<line x1="569.6" y1="1985.6" x2="840.5" y2="1985.6" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="572.6" y="1955.4" font-size="16" font-weight="500" fill="#2b2a27">（4）与年长且对持行戒律等更有经验</text>
<text x="572.6" y="1977.0" font-size="16" font-weight="500" fill="#2b2a27">者相处</text>
<line x1="569.6" y1="2025.2" x2="696.5" y2="2025.2" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="572.6" y="2016.6" font-size="16" font-weight="500" fill="#2b2a27">（5）结交善知识</text>
<line x1="569.6" y1="2086.4" x2="840.5" y2="2086.4" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="572.6" y="2056.2" font-size="16" font-weight="500" fill="#2b2a27">（6）有助于灭除掉举与追悔的适当言</text>
<text x="572.6" y="2077.8" font-size="16" font-weight="500" fill="#2b2a27">论</text>
