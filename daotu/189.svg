<text x="572.6" y="1815.0" font-size="16" font-weight="500" fill="#2b2a27">（1）对佛法有深入的知识。深入经藏</text>
<text x="572.6" y="1836.6" font-size="16" font-weight="500" fill="#2b2a27">，学习、认知、体证佛</text>
