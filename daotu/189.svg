<rect x="30" y="1161.6" width="267.9" height="92.2" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="1198.6" font-size="26" font-weight="700" fill="#fff">189讲-摄集37-摄菩</text>
<text x="48.0" y="1233.7" font-size="26" font-weight="700" fill="#fff">提分-法念处-五盖3</text>
<rect x="343.9" y="31.8" width="255.6" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="61.8" font-size="19" font-weight="700" fill="#2b2a27">一、 灭除瞋恚的六种方法</text>
<line x1="645.6" y1="79.2" x2="920.4" y2="79.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="648.6" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">1.学习散播慈爱；2.培育慈心禅那；3</text>
<text x="648.6" y="70.6" font-size="16" font-weight="500" fill="#2b2a27">.思惟自己所造的业是自</text>
<rect x="343.9" y="91.2" width="236.6" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="121.2" font-size="19" font-weight="700" fill="#2b2a27">二、 如何修习慈心遍满</text>
<rect x="343.9" y="148.9" width="274.6" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="178.9" font-size="19" font-weight="700" fill="#2b2a27">三、 慈心禅那的十一种利益</text>
<rect x="343.9" y="206.5" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="236.5" font-size="19" font-weight="700" fill="#2b2a27">一、睡眠安稳；（如果睡觉不好</text>
<text x="361.9" y="262.2" font-size="19" font-weight="700" fill="#2b2a27">的人就要修习慈心）</text>
<rect x="343.9" y="289.8" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="319.8" font-size="19" font-weight="700" fill="#2b2a27">二、不做恶梦；（会做恶梦的人</text>
<text x="361.9" y="345.5" font-size="19" font-weight="700" fill="#2b2a27">多修慈心）</text>
<rect x="343.9" y="373.1" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="403.1" font-size="19" font-weight="700" fill="#2b2a27">三、醒觉安稳；（很多人有起床</text>
<text x="361.9" y="428.8" font-size="19" font-weight="700" fill="#2b2a27">气，醒来就不舒服、头痛、头</text>
<rect x="343.9" y="456.4" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="361.9" y="486.4" font-size="19" font-weight="700" fill="#2b2a27">四、为人所爱；（经常对人有慈</text>
<text x="361.9" y="512.1" font-size="19" font-weight="700" fill="#2b2a27">心，别人就会喜欢你）</text>
<rect x="343.9" y="539.7" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#8a6d3b" stroke-width="2.2"/>
<text x="361.9" y="569.7" font-size="19" font-weight="700" fill="#2b2a27">五、为非人所爱；（鬼界、阿修</text>
<text x="361.9" y="595.4" font-size="19" font-weight="700" fill="#2b2a27">罗、夜叉也喜欢你，不会害</text>
<rect x="343.9" y="623.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="653.0" font-size="19" font-weight="700" fill="#2b2a27">六、天神守护；（天神会守护你</text>
<text x="361.9" y="678.6" font-size="19" font-weight="700" fill="#2b2a27">）</text>
<rect x="343.9" y="706.3" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="736.3" font-size="19" font-weight="700" fill="#2b2a27">七、不被火、毒药与武器所伤害</text>
<rect x="343.9" y="763.9" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="793.9" font-size="19" font-weight="700" fill="#2b2a27">八、心易得定</text>
<rect x="343.9" y="821.6" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="851.6" font-size="19" font-weight="700" fill="#2b2a27">九、相貌安祥；（人家说这个人</text>
<text x="361.9" y="877.2" font-size="19" font-weight="700" fill="#2b2a27">慈眉善目，看着很舒服）</text>
<rect x="343.9" y="904.9" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="934.9" font-size="19" font-weight="700" fill="#2b2a27">十、临终不迷惑；（临终的时候</text>
<text x="361.9" y="960.5" font-size="19" font-weight="700" fill="#2b2a27">不会昏迷，修慈心的人一定不</text>
<rect x="343.9" y="988.2" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="1018.2" font-size="19" font-weight="700" fill="#2b2a27">十一、若未能证得更高的成就，</text>
<text x="361.9" y="1043.8" font-size="19" font-weight="700" fill="#2b2a27">他将投生到梵天界。（如果他</text>
<rect x="343.9" y="1210.0" width="179.6" height="47.7" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="361.9" y="1240.0" font-size="19" font-weight="700" fill="#2b2a27">四、 昏沉睡眠盖</text>
<line x1="569.6" y1="1107.2" x2="735.6" y2="1107.2" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="572.6" y="1098.6" font-size="16" font-weight="500" fill="#2b2a27">（一）昏沉与睡眠之因</text>
<line x1="781.6" y1="1115.3" x2="1044.6" y2="1115.3" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="784.6" y="1088.5" font-size="14" font-weight="400" fill="#2b2a27">1.用餐后的昏睡；2.心的软弱；3.产生新</text>
<text x="784.6" y="1107.4" font-size="14" font-weight="400" fill="#2b2a27">的昏沉；4.与睡眠有</text>
<line x1="569.6" y1="1386.0" x2="783.6" y2="1386.0" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="572.6" y="1377.4" font-size="16" font-weight="500" fill="#2b2a27">（二）灭除昏沉与睡眠的方法</text>
<line x1="829.6" y1="1171.1" x2="1089.2" y2="1171.1" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="832.6" y="1144.3" font-size="14" font-weight="400" fill="#2b2a27">1.完全转换身体姿势。比如坐得很舒服，</text>
<text x="832.6" y="1163.2" font-size="14" font-weight="400" fill="#2b2a27">你就跪起来，跪起来</text>
<line x1="829.6" y1="1226.9" x2="1097.1" y2="1226.9" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="832.6" y="1200.1" font-size="14" font-weight="400" fill="#2b2a27">2.作光明想。坐那儿昏沉了，你就作意：“</text>
<text x="832.6" y="1219.0" font-size="14" font-weight="400" fill="#2b2a27">哦，现在在阳光的</text>
<line x1="829.6" y1="1282.7" x2="1089.2" y2="1282.7" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="832.6" y="1255.9" font-size="14" font-weight="400" fill="#2b2a27">3.住在露天下。现在没有下雨，大家如果</text>
<text x="832.6" y="1274.8" font-size="14" font-weight="400" fill="#2b2a27">愿意，有很多树下坐</text>
<line x1="829.6" y1="1338.5" x2="1089.2" y2="1338.5" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="832.6" y="1311.7" font-size="14" font-weight="400" fill="#2b2a27">4.知道饮食过量能导致昏沉与睡眠生起。</text>
<text x="832.6" y="1330.6" font-size="14" font-weight="400" fill="#2b2a27">禅修者不要吃太多</text>
<line x1="829.6" y1="1394.3" x2="1089.2" y2="1394.3" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="832.6" y="1367.5" font-size="14" font-weight="400" fill="#2b2a27">5.结交善知识。就是亲近善知识教导怎样</text>
<text x="832.6" y="1386.4" font-size="14" font-weight="400" fill="#2b2a27">克服昏沉与睡眠</text>
<line x1="829.6" y1="1607.6" x2="1061.2" y2="1607.6" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="832.6" y="1599.7" font-size="14" font-weight="400" fill="#2b2a27">6.有助于灭除昏沉与睡眠的适当言论</text>
<line x1="1107.2" y1="1447.4" x2="1348.8" y2="1447.4" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="1110.2" y="1422.3" font-size="13" font-weight="400" fill="#2b2a27">（1）不应注意昏沉的念头。如何理解‘昏</text>
<text x="1110.2" y="1439.8" font-size="13" font-weight="400" fill="#2b2a27">沉的念头’？有不同</text>
<line x1="1107.2" y1="1500.5" x2="1354.5" y2="1500.5" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="1110.2" y="1475.4" font-size="13" font-weight="400" fill="#2b2a27">（2）思惟佛法，例如《转法轮经》及各种</text>
<text x="1110.2" y="1492.9" font-size="13" font-weight="400" fill="#2b2a27">保护经</text>
<line x1="1107.2" y1="1536.0" x2="1263.5" y2="1536.0" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="1110.2" y="1528.5" font-size="13" font-weight="400" fill="#2b2a27">（3）背诵佛法，早晚功课</text>
<line x1="1107.2" y1="1589.1" x2="1354.5" y2="1589.1" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="1110.2" y="1564.0" font-size="13" font-weight="400" fill="#2b2a27">（4）拉扯自己的耳朵，按摩四肢。揪一揪</text>
<text x="1110.2" y="1581.6" font-size="13" font-weight="400" fill="#2b2a27">耳朵，捏一捏脚</text>
<line x1="1107.2" y1="1642.2" x2="1354.5" y2="1642.2" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="1110.2" y="1617.1" font-size="13" font-weight="400" fill="#2b2a27">（5）从座位起身，以水洗脸后，遥望天空</text>
<text x="1110.2" y="1634.7" font-size="13" font-weight="400" fill="#2b2a27">的星辰</text>
<line x1="1107.2" y1="1677.8" x2="1198.5" y2="1677.8" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="1110.2" y="1670.2" font-size="13" font-weight="400" fill="#2b2a27">（6）作光明想</text>
<line x1="1107.2" y1="1730.9" x2="1354.5" y2="1730.9" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="1110.2" y="1705.8" font-size="13" font-weight="400" fill="#2b2a27">（7）在清楚前方及后方之情况下来回行走</text>
<text x="1110.2" y="1723.3" font-size="13" font-weight="400" fill="#2b2a27">及经行，令诸根向内</text>
<line x1="1107.2" y1="1784.0" x2="1354.5" y2="1784.0" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="1110.2" y="1758.9" font-size="13" font-weight="400" fill="#2b2a27">（8）当前面七种方法都无效时，应当小睡</text>
<text x="1110.2" y="1776.4" font-size="13" font-weight="400" fill="#2b2a27">片刻。保持正念正知</text>
