<rect x="30" y="474.0" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="511.0" font-size="26" font-weight="700" fill="#fff">第58讲-摄缘-十二</text>
<text x="48.0" y="546.1" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘58-</text>
<text x="48.0" y="581.2" font-size="26" font-weight="700" fill="#fff">释二十四缘-无有缘</text>
<text x="48.0" y="616.3" font-size="26" font-weight="700" fill="#fff">与离去缘</text>
<rect x="337.7" y="38.1" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="68.1" font-size="19" font-weight="700" fill="#2b2a27">一、有缘与不离去缘</text>
<line x1="590.7" y1="74.7" x2="708.7" y2="74.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="66.1" font-size="16" font-weight="500" fill="#2b2a27">（二）经文详释</text>
<line x1="754.7" y1="54.9" x2="930.4" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="757.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">4.色食有缘与色食不离去缘</text>
<line x1="754.7" y1="91.8" x2="958.4" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="757.7" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">5.色命根有缘与色命根不离去缘</text>
<rect x="337.7" y="133.3" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="163.3" font-size="19" font-weight="700" fill="#2b2a27">二、善用所缘前生有缘与不离去</text>
<text x="355.7" y="188.9" font-size="19" font-weight="700" fill="#2b2a27">缘</text>
<line x1="685.7" y1="182.7" x2="947.7" y2="182.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="174.1" font-size="16" font-weight="500" fill="#2b2a27">（一）止息诸恶、不善寻的五种方法</text>
<line x1="993.7" y1="181.4" x2="1071.4" y2="181.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="996.7" y="173.5" font-size="14" font-weight="400" fill="#2b2a27">1.作意善相</text>
<line x1="1117.4" y1="127.4" x2="1247.6" y2="127.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1120.4" y="119.8" font-size="13" font-weight="400" fill="#2b2a27">（1）去除对有情执著</text>
<line x1="1117.4" y1="162.9" x2="1273.6" y2="162.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1120.4" y="155.4" font-size="13" font-weight="400" fill="#2b2a27">（2）去除对身外物的执著</text>
<line x1="1117.4" y1="198.5" x2="1208.6" y2="198.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1120.4" y="190.9" font-size="13" font-weight="400" fill="#2b2a27">（3）去除瞋心</text>
<line x1="1117.4" y1="234.0" x2="1208.6" y2="234.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1120.4" y="226.5" font-size="13" font-weight="400" fill="#2b2a27">（4）去除痴心</text>
<rect x="337.7" y="246.0" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="276.0" font-size="19" font-weight="700" fill="#2b2a27">一、依照导师的指导而生活起居</text>
<rect x="337.7" y="303.7" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="333.7" font-size="19" font-weight="700" fill="#2b2a27">二、学习佛法</text>
<rect x="337.7" y="361.3" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="391.3" font-size="19" font-weight="700" fill="#2b2a27">三、研究佛法的义理</text>
<rect x="337.7" y="419.0" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="355.7" y="449.0" font-size="19" font-weight="700" fill="#2b2a27">四、在适当的时候听闻佛法</text>
<rect x="337.7" y="487.4" width="283.0" height="47.7" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="355.7" y="517.4" font-size="19" font-weight="700" fill="#2b2a27">五、探讨什么是因，什么是缘</text>
<line x1="666.7" y1="504.2" x2="834.6" y2="504.2" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="495.6" font-size="16" font-weight="500" fill="#2b2a27">2.思惟恶念带来的危险</text>
<line x1="666.7" y1="543.8" x2="866.6" y2="543.8" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="535.2" font-size="16" font-weight="500" fill="#2b2a27">3.不作意、忘掉，转移目标</text>
<rect x="337.7" y="566.6" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#8a6d3b" stroke-width="2.2"/>
<text x="355.7" y="596.6" font-size="19" font-weight="700" fill="#2b2a27">一、从头开始</text>
<line x1="533.7" y1="583.4" x2="765.6" y2="583.4" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="574.8" font-size="16" font-weight="500" fill="#2b2a27">4.正确作意，去除不善寻的来源</text>
<line x1="533.7" y1="623.0" x2="749.6" y2="623.0" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="614.4" font-size="16" font-weight="500" fill="#2b2a27">5.以心来镇压、控制、替代心</text>
<rect x="337.7" y="784.5" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="814.5" font-size="19" font-weight="700" fill="#2b2a27">三、无有缘与离去缘</text>
<line x1="590.7" y1="721.3" x2="724.7" y2="721.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="712.7" font-size="16" font-weight="500" fill="#2b2a27">（一）经文与释义</text>
<line x1="770.7" y1="659.9" x2="834.4" y2="659.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="652.0" font-size="14" font-weight="400" fill="#2b2a27">1.缘广释</text>
<line x1="770.7" y1="696.8" x2="941.3" y2="696.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="688.9" font-size="14" font-weight="400" fill="#2b2a27">22. Natthipaccayoti –</text>
<line x1="770.7" y1="733.7" x2="941.3" y2="733.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="725.8" font-size="14" font-weight="400" fill="#2b2a27">23. Vigatapaccayoti –</text>
<line x1="770.7" y1="789.5" x2="1030.4" y2="789.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="762.7" font-size="14" font-weight="400" fill="#2b2a27">2.无有缘与离去缘的缘法、缘所生法及所</text>
<text x="773.7" y="781.6" font-size="14" font-weight="400" fill="#2b2a27">摄诸缘</text>
<line x1="590.7" y1="931.7" x2="868.7" y2="931.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="901.5" font-size="16" font-weight="500" fill="#2b2a27">（二）无有缘、离去缘与无间缘、等无</text>
<text x="593.7" y="923.1" font-size="16" font-weight="500" fill="#2b2a27">间缘</text>
<line x1="914.7" y1="845.3" x2="1183.9" y2="845.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="917.7" y="818.5" font-size="14" font-weight="400" fill="#2b2a27">(1)无间缘——刚灭尽的眼识以不间断的缘力</text>
<text x="917.7" y="837.4" font-size="14" font-weight="400" fill="#2b2a27">缘助随后的领受心</text>
<line x1="914.7" y1="901.1" x2="1183.9" y2="901.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="917.7" y="874.3" font-size="14" font-weight="400" fill="#2b2a27">(2)等无间缘——紧跟眼识生起的必须是领受</text>
<text x="917.7" y="893.2" font-size="14" font-weight="400" fill="#2b2a27">心，中间不能有间</text>
<line x1="914.7" y1="956.9" x2="1183.9" y2="956.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="917.7" y="930.1" font-size="14" font-weight="400" fill="#2b2a27">(3)离去缘——眼识快要灭尽的时候，有让领</text>
<text x="917.7" y="949.0" font-size="14" font-weight="400" fill="#2b2a27">受心立即生起的力</text>
<line x1="914.7" y1="1012.7" x2="1183.9" y2="1012.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="917.7" y="985.9" font-size="14" font-weight="400" fill="#2b2a27">(4)无有缘——在眼识完全灭去时，它给随后</text>
<text x="917.7" y="1004.8" font-size="14" font-weight="400" fill="#2b2a27">的领受心提供了生</text>
<rect x="337.7" y="1024.7" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="1054.7" font-size="19" font-weight="700" fill="#2b2a27">四、四缘做总结</text>
</svg>