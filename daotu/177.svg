<rect x="30" y="185.1" width="267.9" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="222.1" font-size="26" font-weight="700" fill="#fff">177讲-摄集25-摄菩</text>
<text x="48.0" y="257.2" font-size="26" font-weight="700" fill="#fff">提分-身念处-四威</text>
<text x="48.0" y="292.3" font-size="26" font-weight="700" fill="#fff">仪1</text>
<rect x="343.9" y="76.8" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="106.8" font-size="19" font-weight="700" fill="#2b2a27">一、为何法不能入心？</text>
<line x1="615.9" y1="79.2" x2="893.9" y2="79.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）提出念处的目标及修习方法的起</text>
<text x="618.9" y="70.6" font-size="16" font-weight="500" fill="#2b2a27">因</text>
<line x1="615.9" y1="118.8" x2="813.9" y2="118.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">（二）作用现起与结果现起</text>
<line x1="615.9" y1="158.4" x2="813.9" y2="158.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="149.8" font-size="16" font-weight="500" fill="#2b2a27">（三）实践八正道正念于心</text>
<rect x="343.9" y="254.3" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="284.3" font-size="19" font-weight="700" fill="#2b2a27">二、四威仪</text>
<line x1="520.9" y1="233.5" x2="638.9" y2="233.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="224.9" font-size="16" font-weight="500" fill="#2b2a27">（一）如实了知</text>
<line x1="684.9" y1="195.3" x2="784.4" y2="195.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="687.9" y="187.4" font-size="14" font-weight="400" fill="#2b2a27">1. 谁在行走？</text>
<line x1="684.9" y1="232.2" x2="798.4" y2="232.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="687.9" y="224.3" font-size="14" font-weight="400" fill="#2b2a27">2. 行走者是谁？</text>
<line x1="684.9" y1="269.1" x2="812.4" y2="269.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="687.9" y="261.2" font-size="14" font-weight="400" fill="#2b2a27">3. 行走为何发生？</text>
<line x1="520.9" y1="308.7" x2="734.9" y2="308.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="300.1" font-size="16" font-weight="500" fill="#2b2a27">（二）心驱使，身体才能动作</text>
<line x1="520.9" y1="348.3" x2="638.9" y2="348.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="339.7" font-size="16" font-weight="500" fill="#2b2a27">（三）三种观智</text>
<rect x="343.9" y="360.3" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="390.3" font-size="19" font-weight="700" fill="#2b2a27">三、随顺于佛陀所教导的念知方</text>
<text x="361.9" y="416.0" font-size="19" font-weight="700" fill="#2b2a27">法，生起有慧想</text>
