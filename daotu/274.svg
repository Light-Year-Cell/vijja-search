<rect x="30" y="311.0" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="348.0" font-size="26" font-weight="700" fill="#fff">第78讲-摄缘-十二</text>
<text x="48.0" y="383.1" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘78-</text>
<text x="48.0" y="418.2" font-size="26" font-weight="700" fill="#fff">离路心的缘-爱缘取</text>
<text x="48.0" y="453.3" font-size="26" font-weight="700" fill="#fff">2</text>
<rect x="337.7" y="368.4" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="398.4" font-size="19" font-weight="700" fill="#2b2a27">（三）依次而显明</text>
<line x1="571.7" y1="79.2" x2="842.6" y2="79.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">1、欲爱对如此而说的这四种取中的为</text>
<text x="574.7" y="70.6" font-size="16" font-weight="500" fill="#2b2a27">首者(欲取)，以亲依止一</text>
<line x1="571.7" y1="140.4" x2="846.5" y2="140.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">2、[欲爱]对其余三[取]（见取、戒禁</text>
<text x="574.7" y="131.8" font-size="16" font-weight="500" fill="#2b2a27">取、我语取）以俱生、相</text>
<line x1="571.7" y1="201.6" x2="842.6" y2="201.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="171.4" font-size="16" font-weight="500" fill="#2b2a27">1、世间常住论，即是常见论，四种。</text>
<text x="574.7" y="193.0" font-size="16" font-weight="500" fill="#2b2a27">这一部分见解，执持世间</text>
<line x1="571.7" y1="262.8" x2="842.6" y2="262.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="232.6" font-size="16" font-weight="500" fill="#2b2a27">2、世间半常半无常论，四种。这一部</text>
<text x="574.7" y="254.2" font-size="16" font-weight="500" fill="#2b2a27">分见解认为世间是有主宰</text>
<line x1="571.7" y1="324.0" x2="842.6" y2="324.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="293.8" font-size="16" font-weight="500" fill="#2b2a27">3、世间有边无边论，四种。认为这个</text>
<text x="574.7" y="315.4" font-size="16" font-weight="500" fill="#2b2a27">世间有边或无边，其实本</text>
<line x1="571.7" y1="385.2" x2="842.6" y2="385.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="355.0" font-size="16" font-weight="500" fill="#2b2a27">4、异问异答论，即是诡辩派、捕鳗论</text>
<text x="574.7" y="376.6" font-size="16" font-weight="500" fill="#2b2a27">、不死矫乱论，四种。也</text>
<line x1="571.7" y1="446.4" x2="842.6" y2="446.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="416.2" font-size="16" font-weight="500" fill="#2b2a27">5、无因而有论即是无因论，二种。无</text>
<text x="574.7" y="437.8" font-size="16" font-weight="500" fill="#2b2a27">因论否定因果，否定人行</text>
<line x1="571.7" y1="507.6" x2="842.6" y2="507.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="477.4" font-size="16" font-weight="500" fill="#2b2a27">6、世间有想论，十六种。认为这个世</text>
<text x="574.7" y="499.0" font-size="16" font-weight="500" fill="#2b2a27">间由想来主导，唯心，此</text>
<line x1="571.7" y1="568.8" x2="842.6" y2="568.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="538.6" font-size="16" font-weight="500" fill="#2b2a27">7、世间无想论，八种。此一邪见与世</text>
<text x="574.7" y="560.2" font-size="16" font-weight="500" fill="#2b2a27">间有想论相反相成，唯物</text>
<line x1="571.7" y1="630.0" x2="842.6" y2="630.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="599.8" font-size="16" font-weight="500" fill="#2b2a27">8、世间非有想非无想论，八种。认为</text>
<text x="574.7" y="621.4" font-size="16" font-weight="500" fill="#2b2a27">人保持有想的状态或者无</text>
<line x1="571.7" y1="691.2" x2="842.6" y2="691.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="661.0" font-size="16" font-weight="500" fill="#2b2a27">9、众生断灭无余论，即是断见论，七</text>
<text x="574.7" y="682.6" font-size="16" font-weight="500" fill="#2b2a27">种。这种人认为人死了什</text>
<line x1="571.7" y1="752.4" x2="837.5" y2="752.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="722.2" font-size="16" font-weight="500" fill="#2b2a27">10、 现法涅槃论， 即是无论在何种</text>
<text x="574.7" y="743.8" font-size="16" font-weight="500" fill="#2b2a27">状态， 处于现世的即为最高的</text>
</svg>