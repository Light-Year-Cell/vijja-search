<rect x="30" y="762.4" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="799.4" font-size="26" font-weight="700" fill="#fff">第77讲-摄缘-十二</text>
<text x="48.0" y="834.5" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘77-</text>
<text x="48.0" y="869.6" font-size="26" font-weight="700" fill="#fff">离路心的缘-受缘爱</text>
<text x="48.0" y="904.7" font-size="26" font-weight="700" fill="#fff">&amp;爱缘取1</text>
<rect x="337.7" y="480.0" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="510.0" font-size="19" font-weight="700" fill="#2b2a27">一、辨识受缘爱的缘</text>
<line x1="590.7" y1="79.2" x2="854.6" y2="79.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">1.依于门，有六种受：眼触生受、耳</text>
<text x="593.7" y="70.6" font-size="16" font-weight="500" fill="#2b2a27">触生受、鼻触生受、舌触生</text>
<line x1="590.7" y1="118.8" x2="862.3" y2="118.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">2.依于区别，有 89 种受及 32 种受</text>
<line x1="590.7" y1="180.0" x2="863.6" y2="180.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="149.8" font-size="16" font-weight="500" fill="#2b2a27">1.同一个五门心路过程中， 果报悦俱</text>
<text x="593.7" y="171.4" font-size="16" font-weight="500" fill="#2b2a27">推度心的五触生受 （悦受） </text>
<line x1="590.7" y1="241.2" x2="863.6" y2="241.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="211.0" font-size="16" font-weight="500" fill="#2b2a27">2.随后的任一意门心路过程中， 前五</text>
<text x="593.7" y="232.6" font-size="16" font-weight="500" fill="#2b2a27">门心路过程悦俱推度心的悦</text>
<line x1="590.7" y1="302.4" x2="854.6" y2="302.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="272.2" font-size="16" font-weight="500" fill="#2b2a27">3.扩展开，五识、领受、推度和彼所</text>
<text x="593.7" y="293.8" font-size="16" font-weight="500" fill="#2b2a27">缘等 32 种果报受，以自然</text>
<line x1="590.7" y1="363.6" x2="854.6" y2="363.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="333.4" font-size="16" font-weight="500" fill="#2b2a27">4.实际修缘起时，转向心、确定心相</text>
<text x="593.7" y="355.0" font-size="16" font-weight="500" fill="#2b2a27">应的受对后面生起的速行</text>
<line x1="590.7" y1="424.8" x2="863.6" y2="424.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="394.6" font-size="16" font-weight="500" fill="#2b2a27">1. 由于眼触生受生起，色爱生起；眼</text>
<text x="593.7" y="416.2" font-size="16" font-weight="500" fill="#2b2a27">触生受是因，色爱是果</text>
<line x1="590.7" y1="486.0" x2="863.6" y2="486.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="455.8" font-size="16" font-weight="500" fill="#2b2a27">2. 由于耳触生受生起，声爱生起；耳</text>
<text x="593.7" y="477.4" font-size="16" font-weight="500" fill="#2b2a27">触生受是因，声爱是果</text>
<line x1="590.7" y1="547.2" x2="863.6" y2="547.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="517.0" font-size="16" font-weight="500" fill="#2b2a27">3. 由于鼻触生受生起，香爱生起；鼻</text>
<text x="593.7" y="538.6" font-size="16" font-weight="500" fill="#2b2a27">触生受是因，香爱是果</text>
<line x1="590.7" y1="608.4" x2="863.6" y2="608.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="578.2" font-size="16" font-weight="500" fill="#2b2a27">4. 由于舌触生受生起，味爱生起；舌</text>
<text x="593.7" y="599.8" font-size="16" font-weight="500" fill="#2b2a27">触生受是因，味爱是果</text>
<line x1="590.7" y1="669.6" x2="863.6" y2="669.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="639.4" font-size="16" font-weight="500" fill="#2b2a27">5. 由于身触生受生起，触爱生起；身</text>
<text x="593.7" y="661.0" font-size="16" font-weight="500" fill="#2b2a27">触生受是因，触爱是果</text>
<line x1="590.7" y1="730.8" x2="863.6" y2="730.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="700.6" font-size="16" font-weight="500" fill="#2b2a27">6. 由于意触生受生起，法爱生起；意</text>
<text x="593.7" y="722.2" font-size="16" font-weight="500" fill="#2b2a27">触生受是因，法爱是果</text>
<line x1="590.7" y1="792.0" x2="861.6" y2="792.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="761.8" font-size="16" font-weight="500" fill="#2b2a27">1、感官之乐（五欲之乐），透过感官</text>
<text x="593.7" y="783.4" font-size="16" font-weight="500" fill="#2b2a27">感受到的快乐，是为了生</text>
<line x1="590.7" y1="853.2" x2="861.6" y2="853.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="823.0" font-size="16" font-weight="500" fill="#2b2a27">2、善法之乐（行善之乐），基于世间</text>
<text x="593.7" y="844.6" font-size="16" font-weight="500" fill="#2b2a27">善法、十种善法的快乐</text>
<line x1="590.7" y1="914.4" x2="861.6" y2="914.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="884.2" font-size="16" font-weight="500" fill="#2b2a27">3、正念、禅定之乐，有念知的、能净</text>
<text x="593.7" y="905.8" font-size="16" font-weight="500" fill="#2b2a27">化心的乐，比如正念正知、</text>
<line x1="590.7" y1="975.6" x2="861.6" y2="975.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="945.4" font-size="16" font-weight="500" fill="#2b2a27">4、涅槃之乐，超越生命的快乐。佛教</text>
<text x="593.7" y="967.0" font-size="16" font-weight="500" fill="#2b2a27">徒的终极目标是追求超越</text>
<rect x="337.7" y="1159.5" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="1189.5" font-size="19" font-weight="700" fill="#2b2a27">二、辨识爱缘取的缘</text>
<line x1="590.7" y1="1097.6" x2="724.7" y2="1097.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="1089.0" font-size="16" font-weight="500" fill="#2b2a27">（一）以含义分别</text>
<line x1="770.7" y1="1031.4" x2="1030.4" y2="1031.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="1004.6" font-size="14" font-weight="400" fill="#2b2a27">1、执取称为物（感官对象）的欲，故为“</text>
<text x="773.7" y="1023.5" font-size="14" font-weight="400" fill="#2b2a27">欲取”</text>
<line x1="770.7" y1="1087.2" x2="1039.9" y2="1087.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="1060.4" font-size="14" font-weight="400" fill="#2b2a27">2、其[本质]既是[邪]见，又是执取，故称</text>
<text x="773.7" y="1079.3" font-size="14" font-weight="400" fill="#2b2a27">为“见取”</text>
<line x1="770.7" y1="1124.1" x2="1039.9" y2="1124.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="1116.2" font-size="14" font-weight="400" fill="#2b2a27">3、能执取[牛等的]戒禁，故称为“戒禁取”</text>
<line x1="770.7" y1="1179.9" x2="1038.2" y2="1179.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="1153.1" font-size="14" font-weight="400" fill="#2b2a27">4、[诸有情]能以此而说，故为语。能以此</text>
<text x="773.7" y="1172.0" font-size="14" font-weight="400" fill="#2b2a27">执取，故为取。说什</text>
<line x1="590.7" y1="1219.5" x2="724.7" y2="1219.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="1210.9" font-size="16" font-weight="500" fill="#2b2a27">（二）及以法详略</text>
<line x1="590.7" y1="1294.7" x2="724.7" y2="1294.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="1286.1" font-size="16" font-weight="500" fill="#2b2a27">（三）依次而显明</text>
<line x1="770.7" y1="1256.4" x2="854.5" y2="1256.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="1248.5" font-size="14" font-weight="400" fill="#2b2a27">1、生起次序</text>
<line x1="770.7" y1="1293.3" x2="854.5" y2="1293.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="1285.4" font-size="14" font-weight="400" fill="#2b2a27">2、舍断次序</text>
<line x1="770.7" y1="1330.2" x2="854.5" y2="1330.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="1322.3" font-size="14" font-weight="400" fill="#2b2a27">3、阐明次序</text>
</svg>