<rect x="30" y="541.7" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="578.7" font-size="26" font-weight="700" fill="#fff">第26讲-摄缘-十二</text>
<text x="48.0" y="613.8" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘26-</text>
<text x="48.0" y="648.9" font-size="26" font-weight="700" fill="#fff">释二十四缘-亲依止</text>
<text x="48.0" y="684.0" font-size="26" font-weight="700" fill="#fff">缘2</text>
<rect x="337.7" y="306.0" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="336.0" font-size="19" font-weight="700" fill="#2b2a27">一、善法对善法的自然亲依止缘</text>
<line x1="685.7" y1="88.9" x2="883.7" y2="88.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="80.3" font-size="16" font-weight="500" fill="#2b2a27">（一）自然亲依止巴利释义</text>
<line x1="929.7" y1="73.8" x2="1197.2" y2="73.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="932.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1. 或是在自己的相续流中所促成的信和德</text>
<text x="932.7" y="65.9" font-size="14" font-weight="400" fill="#2b2a27">行等</text>
<line x1="929.7" y1="110.7" x2="1127.2" y2="110.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="932.7" y="102.8" font-size="14" font-weight="400" fill="#2b2a27">2. 或是所依靠的时节和食物等</text>
<line x1="685.7" y1="172.1" x2="851.7" y2="172.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="163.5" font-size="16" font-weight="500" fill="#2b2a27">（二）缘法与缘所生法</text>
<line x1="897.7" y1="147.6" x2="1025.2" y2="147.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="900.7" y="139.7" font-size="14" font-weight="400" fill="#2b2a27">1. 缘法、缘所生法</text>
<line x1="897.7" y1="203.4" x2="1157.4" y2="203.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="900.7" y="176.6" font-size="14" font-weight="400" fill="#2b2a27">2.善对善的自然亲依止和所缘亲依止的区</text>
<text x="900.7" y="195.5" font-size="14" font-weight="400" fill="#2b2a27">别</text>
<line x1="685.7" y1="260.1" x2="883.7" y2="260.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="251.5" font-size="16" font-weight="500" fill="#2b2a27">（三）自然亲依止缘与心所</text>
<line x1="929.7" y1="240.3" x2="1071.2" y2="240.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="932.7" y="232.4" font-size="14" font-weight="400" fill="#2b2a27">1. 自然亲依止缘与信</text>
<line x1="929.7" y1="277.2" x2="1105.4" y2="277.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="932.7" y="269.3" font-size="14" font-weight="400" fill="#2b2a27">2.自然亲依止缘与其他心所</text>
<line x1="685.7" y1="607.2" x2="949.6" y2="607.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="577.0" font-size="16" font-weight="500" fill="#2b2a27">（四）《发趣论·问分》之“善法对善</text>
<text x="688.7" y="598.6" font-size="16" font-weight="500" fill="#2b2a27">法的自然亲依止缘”</text>
<line x1="995.6" y1="371.1" x2="1227.3" y2="371.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="363.2" font-size="14" font-weight="400" fill="#2b2a27">1.信、戒、闻、舍、慧对八种善法等</text>
<line x1="1273.3" y1="312.8" x2="1377.6" y2="312.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1276.3" y="305.2" font-size="13" font-weight="400" fill="#2b2a27">（1）禅那与等至</text>
<line x1="1273.3" y1="348.3" x2="1509.1" y2="348.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1276.3" y="340.8" font-size="13" font-weight="400" fill="#2b2a27">（2）“信”等前前善法如何支助后后善法</text>
<line x1="1273.3" y1="383.9" x2="1522.1" y2="383.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1276.3" y="376.3" font-size="13" font-weight="400" fill="#2b2a27">（3）接通“信”等过去善法的自然亲依止缘</text>
<line x1="1273.3" y1="437.0" x2="1520.6" y2="437.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1276.3" y="411.9" font-size="13" font-weight="400" fill="#2b2a27">（4）如何善用信、戒、闻、舍、回的亲依</text>
<text x="1276.3" y="429.4" font-size="13" font-weight="400" fill="#2b2a27">止缘</text>
<line x1="995.6" y1="557.4" x2="1045.3" y2="557.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="549.5" font-size="14" font-weight="400" fill="#2b2a27">2.禅定</text>
<line x1="1091.3" y1="490.1" x2="1340.1" y2="490.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1094.3" y="465.0" font-size="13" font-weight="400" fill="#2b2a27">(2)已成就五自在的低阶位禅那以亲依止的</text>
<text x="1094.3" y="482.5" font-size="13" font-weight="400" fill="#2b2a27">力量支助更高阶位的禅那</text>
<line x1="1091.3" y1="525.6" x2="1247.6" y2="525.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1094.3" y="518.1" font-size="13" font-weight="400" fill="#2b2a27">（1）八种遍作对八种禅定</text>
<line x1="1091.3" y1="561.2" x2="1260.6" y2="561.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1094.3" y="553.6" font-size="13" font-weight="400" fill="#2b2a27">（2）低阶禅那对更高阶禅那</text>
<line x1="1091.3" y1="596.7" x2="1247.6" y2="596.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1094.3" y="589.2" font-size="13" font-weight="400" fill="#2b2a27">（3）四梵住对其他止业处</text>
<line x1="1091.3" y1="632.2" x2="1260.6" y2="632.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1094.3" y="624.7" font-size="13" font-weight="400" fill="#2b2a27">（4）接通过去的禅定巴拉密</text>
<line x1="995.6" y1="699.4" x2="1087.3" y2="699.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="691.5" font-size="14" font-weight="400" fill="#2b2a27">3.神通、神变</text>
<line x1="1133.3" y1="685.4" x2="1380.6" y2="685.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1136.3" y="660.2" font-size="13" font-weight="400" fill="#2b2a27">（1）神通、神变的遍作心以亲依止缘的缘</text>
<text x="1136.3" y="677.8" font-size="13" font-weight="400" fill="#2b2a27">力支助相应的神通、</text>
<line x1="1133.3" y1="720.9" x2="1380.6" y2="720.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1136.3" y="713.4" font-size="13" font-weight="400" fill="#2b2a27">（2）不同神通与神通之间的自然亲依止缘</text>
<line x1="995.6" y1="819.0" x2="1059.3" y2="819.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="811.1" font-size="14" font-weight="400" fill="#2b2a27">4.出世间</text>
<line x1="1105.3" y1="774.0" x2="1352.6" y2="774.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1108.3" y="748.9" font-size="13" font-weight="400" fill="#2b2a27">（1）圣道的遍作心以自然亲依止缘的缘力</text>
<text x="1108.3" y="766.4" font-size="13" font-weight="400" fill="#2b2a27">支助相应的圣道生起</text>
<line x1="1105.3" y1="827.1" x2="1352.6" y2="827.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1108.3" y="802.0" font-size="13" font-weight="400" fill="#2b2a27">（2）较低的圣道以自然亲依止缘的缘力支</text>
<text x="1108.3" y="819.5" font-size="13" font-weight="400" fill="#2b2a27">助较高的圣道生起</text>
<line x1="1105.3" y1="880.2" x2="1352.6" y2="880.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1108.3" y="855.1" font-size="13" font-weight="400" fill="#2b2a27">（3）诸有学在圣道的亲依止缘力的支助下</text>
<text x="1108.3" y="872.6" font-size="13" font-weight="400" fill="#2b2a27">生起等至、证得四无</text>
<rect x="337.7" y="892.2" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="922.2" font-size="19" font-weight="700" fill="#2b2a27">二、结语</text>
</svg>