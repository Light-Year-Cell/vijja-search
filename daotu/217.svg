<rect x="30" y="682.1" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="719.1" font-size="26" font-weight="700" fill="#fff">第21讲-摄缘-十二</text>
<text x="48.0" y="754.2" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘21-</text>
<text x="48.0" y="789.3" font-size="26" font-weight="700" fill="#fff">释二十四缘-俱生缘</text>
<text x="48.0" y="824.4" font-size="26" font-weight="700" fill="#fff">2</text>
<rect x="337.7" y="30.0" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、四大种色</text>
<line x1="533.7" y1="65.7" x2="708.6" y2="65.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="57.1" font-size="16" font-weight="500" fill="#2b2a27">（一） 四大平衡的因素</text>
<line x1="754.6" y1="73.8" x2="1022.2" y2="73.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="757.6" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">6.诸色法对诸非色法， 此六种皆以俱生缘</text>
<text x="757.6" y="65.9" font-size="14" font-weight="400" fill="#2b2a27">为缘。 最后总结俱生组十五</text>
<rect x="337.7" y="134.4" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="164.4" font-size="19" font-weight="700" fill="#2b2a27">二、结生刹那的名色</text>
<line x1="590.7" y1="136.9" x2="868.7" y2="136.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="106.7" font-size="16" font-weight="500" fill="#2b2a27">（一）结生刹那的名色互相以俱生缘为</text>
<text x="593.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">缘</text>
<line x1="590.7" y1="176.5" x2="756.7" y2="176.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="167.9" font-size="16" font-weight="500" fill="#2b2a27">（二）缘法与缘所生法</text>
<line x1="590.7" y1="216.1" x2="708.7" y2="216.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="207.5" font-size="16" font-weight="500" fill="#2b2a27">（三）所摄诸缘</text>
<rect x="337.7" y="332.4" width="283.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="362.4" font-size="19" font-weight="700" fill="#2b2a27">三、诸心、心所法对俱生诸色</text>
<line x1="666.7" y1="291.7" x2="896.7" y2="291.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="283.1" font-size="16" font-weight="500" fill="#2b2a27">（一）诸心、心所法对俱生诸色</text>
<line x1="942.7" y1="271.9" x2="1204.0" y2="271.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="945.7" y="245.1" font-size="14" font-weight="400" fill="#2b2a27">(1)结生名聚对与它同时生起的业生色(扣</text>
<text x="945.7" y="263.9" font-size="14" font-weight="400" fill="#2b2a27">除了俱生心处色， 亦即</text>
<line x1="942.7" y1="327.7" x2="1210.2" y2="327.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="945.7" y="300.9" font-size="14" font-weight="400" fill="#2b2a27">(2)生命期间，名聚对与它同时生起的心生</text>
<text x="945.7" y="319.8" font-size="14" font-weight="400" fill="#2b2a27">色，这对应经文中的</text>
<line x1="666.7" y1="367.3" x2="912.7" y2="367.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="358.7" font-size="16" font-weight="500" fill="#2b2a27">（二）缘法、缘所生法及所摄诸缘</text>
<line x1="666.7" y1="406.9" x2="912.7" y2="406.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="398.3" font-size="16" font-weight="500" fill="#2b2a27">（三）结生名法对结生色法的影响</text>
<line x1="666.7" y1="446.5" x2="880.7" y2="446.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="437.9" font-size="16" font-weight="500" fill="#2b2a27">（四）心生色法对身体的影响</text>
<rect x="337.7" y="469.2" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="499.2" font-size="19" font-weight="700" fill="#2b2a27">四、大种对诸所造色</text>
<line x1="590.7" y1="486.1" x2="836.7" y2="486.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="477.5" font-size="16" font-weight="500" fill="#2b2a27">（一）缘法、缘所生法及所摄诸缘</text>
<line x1="590.7" y1="525.7" x2="788.7" y2="525.7" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="517.1" font-size="16" font-weight="500" fill="#2b2a27">（二）四大对业生色的影响</text>
<rect x="337.7" y="537.7" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="567.7" font-size="19" font-weight="700" fill="#2b2a27">五、诸色法对诸非色法</text>
<line x1="609.7" y1="565.3" x2="791.7" y2="565.3" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="556.7" font-size="16" font-weight="500" fill="#2b2a27">（一）诸色法对诸非色法</text>
<rect x="337.7" y="595.3" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="355.7" y="625.3" font-size="19" font-weight="700" fill="#2b2a27">六、俱生缘所摄诸缘</text>
<rect x="337.7" y="653.0" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="355.7" y="683.0" font-size="19" font-weight="700" fill="#2b2a27">七、总结</text>
<rect x="337.7" y="1449.0" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#8a6d3b" stroke-width="2.2"/>
<text x="355.7" y="1479.0" font-size="19" font-weight="700" fill="#2b2a27">八、俱生组十五缘</text>
<line x1="571.7" y1="1230.5" x2="842.6" y2="1230.5" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="1200.3" font-size="16" font-weight="500" fill="#2b2a27">（一）单一俱生名聚生起的因缘条件(</text>
<text x="574.7" y="1221.9" font-size="16" font-weight="500" fill="#2b2a27">俱生组)</text>
<line x1="888.6" y1="735.5" x2="974.2" y2="735.5" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="727.6" font-size="14" font-weight="400" fill="#2b2a27">(1)俱生缘力</text>
<line x1="888.6" y1="791.3" x2="1156.2" y2="791.3" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="764.5" font-size="14" font-weight="400" fill="#2b2a27">(2)俱生依止缘力：依止缘是指缘法以依止</text>
<text x="891.6" y="783.4" font-size="14" font-weight="400" fill="#2b2a27">的缘力作为缘所生法</text>
<line x1="888.6" y1="847.1" x2="1156.2" y2="847.1" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="820.3" font-size="14" font-weight="400" fill="#2b2a27">(3)相互缘力：相互缘是指缘法与缘所生法</text>
<text x="891.6" y="839.2" font-size="14" font-weight="400" fill="#2b2a27">彼此互相以相互的缘</text>
<line x1="888.6" y1="902.9" x2="1156.2" y2="902.9" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="876.1" font-size="14" font-weight="400" fill="#2b2a27">(4)相应缘力：相应缘是指缘法与缘所生法</text>
<text x="891.6" y="895.0" font-size="14" font-weight="400" fill="#2b2a27">彼此互以相应的缘力</text>
<line x1="888.6" y1="958.7" x2="1150.0" y2="958.7" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="931.9" font-size="14" font-weight="400" fill="#2b2a27">(5)俱生有缘力： 有缘是指缘法以存在的</text>
<text x="891.6" y="950.8" font-size="14" font-weight="400" fill="#2b2a27">力量缘助缘所生法生起</text>
<line x1="888.6" y1="1014.5" x2="1156.2" y2="1014.5" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="987.7" font-size="14" font-weight="400" fill="#2b2a27">(6)俱生不离去缘力：不离去缘是指缘法只</text>
<text x="891.6" y="1006.6" font-size="14" font-weight="400" fill="#2b2a27">要尚未灭去，就能够</text>
<line x1="888.6" y1="1070.3" x2="1156.2" y2="1070.3" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1043.5" font-size="14" font-weight="400" fill="#2b2a27">(7)俱生业缘力：业缘分为俱生业缘和异刹</text>
<text x="891.6" y="1062.4" font-size="14" font-weight="400" fill="#2b2a27">那业缘。俱生业缘是</text>
<line x1="888.6" y1="1126.1" x2="1150.0" y2="1126.1" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1099.3" font-size="14" font-weight="400" fill="#2b2a27">(8)俱生食缘力： 这里的食缘是指名食缘</text>
<text x="891.6" y="1118.2" font-size="14" font-weight="400" fill="#2b2a27">， 同一名聚里的名食(触</text>
<line x1="888.6" y1="1181.9" x2="1156.2" y2="1181.9" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1155.1" font-size="14" font-weight="400" fill="#2b2a27">(9)俱生根缘力：俱生根缘是指名根以俱生</text>
<text x="891.6" y="1174.0" font-size="14" font-weight="400" fill="#2b2a27">根的缘力控制俱生名</text>
<line x1="888.6" y1="1237.7" x2="1151.7" y2="1237.7" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1210.9" font-size="14" font-weight="400" fill="#2b2a27">(10)因缘力： 因缘我们已经学过， 它是</text>
<text x="891.6" y="1229.8" font-size="14" font-weight="400" fill="#2b2a27">指三美因与三不善因以因</text>
<line x1="888.6" y1="1293.5" x2="1150.0" y2="1293.5" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1266.7" font-size="14" font-weight="400" fill="#2b2a27">(11)俱生增上缘力：俱生主导（增上）缘</text>
<text x="891.6" y="1285.6" font-size="14" font-weight="400" fill="#2b2a27">前面已学习过。包括四</text>
<line x1="888.6" y1="1349.3" x2="1157.8" y2="1349.3" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1322.5" font-size="14" font-weight="400" fill="#2b2a27">(12)果报缘力： 果报缘是指同一果报名聚</text>
<text x="891.6" y="1341.4" font-size="14" font-weight="400" fill="#2b2a27">里的名法与其余名法彼</text>
<line x1="888.6" y1="1405.1" x2="1157.8" y2="1405.1" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1378.3" font-size="14" font-weight="400" fill="#2b2a27">(13)禅那缘力： 禅那缘是指诸禅支以禅支</text>
<text x="891.6" y="1397.2" font-size="14" font-weight="400" fill="#2b2a27">的缘力缘助俱生名法紧</text>
<line x1="888.6" y1="1460.9" x2="1157.8" y2="1460.9" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1434.1" font-size="14" font-weight="400" fill="#2b2a27">(14)道缘力： 道缘是指诸道支以正道或邪</text>
<text x="891.6" y="1453.0" font-size="14" font-weight="400" fill="#2b2a27">道的缘力缘助俱生名色</text>
<line x1="888.6" y1="1497.8" x2="974.2" y2="1497.8" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1489.9" font-size="14" font-weight="400" fill="#2b2a27">(1)俱生缘力</text>
<line x1="888.6" y1="1534.7" x2="1002.2" y2="1534.7" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1526.8" font-size="14" font-weight="400" fill="#2b2a27">(2)俱生依止缘力</text>
<line x1="888.6" y1="1571.6" x2="974.2" y2="1571.6" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1563.7" font-size="14" font-weight="400" fill="#2b2a27">(3)相互缘力</text>
<line x1="888.6" y1="1627.4" x2="1156.2" y2="1627.4" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1600.6" font-size="14" font-weight="400" fill="#2b2a27">(4)俱生不相应缘力：在不相应缘中，缘法</text>
<text x="891.6" y="1619.5" font-size="14" font-weight="400" fill="#2b2a27">与缘所生法两者种类</text>
<line x1="888.6" y1="1664.3" x2="988.2" y2="1664.3" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1656.4" font-size="14" font-weight="400" fill="#2b2a27">(5)俱生有缘力</text>
<line x1="888.6" y1="1701.2" x2="1016.2" y2="1701.2" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="891.6" y="1693.3" font-size="14" font-weight="400" fill="#2b2a27">(6)俱生不离去缘力</text>
<line x1="571.7" y1="1762.4" x2="849.7" y2="1762.4" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="1732.2" font-size="16" font-weight="500" fill="#2b2a27">（二）单一俱生色聚生起或继续存在的</text>
<text x="574.7" y="1753.8" font-size="16" font-weight="500" fill="#2b2a27">因缘条件(俱生组)</text>
