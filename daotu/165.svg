<text x="561.9" y="146.2" font-size="16" font-weight="500" fill="#2b2a27">（二）培养五力的价值和意义</text>
<rect x="343.9" y="190.4" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="220.4" font-size="19" font-weight="700" fill="#2b2a27">三、惭力、愧力、无惭力、无愧</text>
<text x="361.9" y="246.1" font-size="19" font-weight="700" fill="#2b2a27">力</text>
<line x1="691.9" y1="222.3" x2="962.9" y2="222.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="192.1" font-size="16" font-weight="500" fill="#2b2a27">（一）.惭愧在《阿毗达摩》和世俗中</text>
<text x="694.9" y="213.7" font-size="16" font-weight="500" fill="#2b2a27">的区别</text>
<line x1="1008.9" y1="191.8" x2="1156.6" y2="191.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1011.9" y="183.8" font-size="14" font-weight="400" fill="#2b2a27">1.惭愧在世俗中的意思</text>
<line x1="1008.9" y1="228.7" x2="1212.6" y2="228.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1011.9" y="220.8" font-size="14" font-weight="400" fill="#2b2a27">2.《阿毗达摩》中惭、愧的描述</text>
<line x1="691.9" y1="268.2" x2="969.9" y2="268.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="259.6" font-size="16" font-weight="500" fill="#2b2a27">（二）佛陀讲惭和愧是世间白法的基石</text>
<rect x="343.9" y="383.7" width="160.6" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="413.7" font-size="19" font-weight="700" fill="#2b2a27">四、无惭&amp;无愧</text>
