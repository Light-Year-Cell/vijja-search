<text x="553.6" y="299.2" font-size="16" font-weight="500" fill="#2b2a27">（一）无惭的特相、作用、现起、近因</text>
<line x1="550.6" y1="347.5" x2="796.6" y2="347.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="553.6" y="338.9" font-size="16" font-weight="500" fill="#2b2a27">（二）日常生活中无惭无愧的状态</text>
<line x1="550.6" y1="404.2" x2="716.6" y2="404.2" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="553.6" y="395.6" font-size="16" font-weight="500" fill="#2b2a27">（三）无惭无愧的过患</text>
<line x1="762.6" y1="384.4" x2="910.2" y2="384.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="765.6" y="376.5" font-size="14" font-weight="400" fill="#2b2a27">1.负面情绪带来的影响</text>
<line x1="762.6" y1="421.2" x2="910.2" y2="421.2" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="765.6" y="413.4" font-size="14" font-weight="400" fill="#2b2a27">2.无惭无愧的三种层次</text>
<line x1="550.6" y1="482.4" x2="828.6" y2="482.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="553.6" y="452.2" font-size="16" font-weight="500" fill="#2b2a27">（四）无惭力、无愧力与惭力、愧力的</text>
<text x="553.6" y="473.9" font-size="16" font-weight="500" fill="#2b2a27">区别</text>
<line x1="550.6" y1="543.6" x2="828.6" y2="543.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="553.6" y="513.5" font-size="16" font-weight="500" fill="#2b2a27">（五）圣喜长老的开示：弱者、强者和</text>
<text x="553.6" y="535.1" font-size="16" font-weight="500" fill="#2b2a27">智者</text>
