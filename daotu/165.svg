<text x="361.9" y="128.4" font-size="19" font-weight="700" fill="#2b2a27">二、五根和五力</text>
<line x1="558.9" y1="115.2" x2="740.9" y2="115.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="561.9" y="106.7" font-size="16" font-weight="500" fill="#2b2a27">（一）五根和五力的区别</text>
