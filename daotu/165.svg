<text x="48.0" y="239.1" font-size="26" font-weight="700" fill="#fff">165讲-摄集13-九力</text>
<rect x="343.9" y="30.0" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、九力之概要</text>
