<text x="48.0" y="436.2" font-size="26" font-weight="700" fill="#fff">179讲-摄集27-摄菩</text>
<text x="48.0" y="471.3" font-size="26" font-weight="700" fill="#fff">提分-身念处-正知2</text>
<rect x="343.9" y="175.8" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="205.8" font-size="19" font-weight="700" fill="#2b2a27">一、往返的行处正知</text>
<line x1="596.9" y1="57.6" x2="730.9" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）第一种比库</text>
<line x1="596.9" y1="97.2" x2="730.9" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）第二种比库</text>
<line x1="596.9" y1="136.8" x2="730.9" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三）第三种比库</text>
<line x1="596.9" y1="176.4" x2="730.9" y2="176.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">（四）第四种比库</text>
<line x1="596.9" y1="252.0" x2="810.9" y2="252.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="243.4" font-size="16" font-weight="500" fill="#2b2a27">（五）应用业处与一切处业处</text>
<line x1="856.9" y1="232.2" x2="1124.4" y2="232.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="859.9" y="205.4" font-size="14" font-weight="400" fill="#2b2a27">1. 应用业处或翻译为根本业处：即禅修者</text>
<text x="859.9" y="224.3" font-size="14" font-weight="400" fill="#2b2a27">经常修习的、 最相应的</text>
<line x1="856.9" y1="288.0" x2="1124.4" y2="288.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="859.9" y="261.2" font-size="14" font-weight="400" fill="#2b2a27">2. 一切处业处：即所有禅修者都应当修习</text>
<text x="859.9" y="280.1" font-size="14" font-weight="400" fill="#2b2a27">以便避免危难的法门</text>
<line x1="596.9" y1="327.6" x2="810.9" y2="327.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="319.0" font-size="16" font-weight="500" fill="#2b2a27">（六）走廊住者马哈弗沙长老</text>
<line x1="596.9" y1="367.2" x2="810.9" y2="367.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="358.6" font-size="16" font-weight="500" fill="#2b2a27">（七）迦兰巴落处僧寺的比库</text>
<rect x="343.9" y="469.2" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="499.2" font-size="19" font-weight="700" fill="#2b2a27">二、往返的无痴正知</text>
<line x1="596.9" y1="406.8" x2="810.9" y2="406.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="398.2" font-size="16" font-weight="500" fill="#2b2a27">（一）怎样才是修行无痴正知</text>
<line x1="596.9" y1="446.4" x2="874.9" y2="446.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="437.8" font-size="16" font-weight="500" fill="#2b2a27">（二）、行处正知与无痴正知相互关联</text>
<line x1="596.9" y1="486.0" x2="810.9" y2="486.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="477.4" font-size="16" font-weight="500" fill="#2b2a27">（三）普通禅修者的日常修习</text>
<line x1="596.9" y1="525.6" x2="778.9" y2="525.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="517.0" font-size="16" font-weight="500" fill="#2b2a27">（四）每步分为六个阶段</text>
<line x1="596.9" y1="565.2" x2="874.9" y2="565.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="556.6" font-size="16" font-weight="500" fill="#2b2a27">（五）名法生灭的速度是色法的十七倍</text>
<line x1="596.9" y1="604.8" x2="778.9" y2="604.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="596.2" font-size="16" font-weight="500" fill="#2b2a27">（六）如何培育无痴正知</text>
<rect x="343.9" y="667.2" width="283.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="697.2" font-size="19" font-weight="700" fill="#2b2a27">三、向前看与向旁看时的正知</text>
<line x1="672.9" y1="644.4" x2="790.9" y2="644.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="675.9" y="635.8" font-size="16" font-weight="500" fill="#2b2a27">（一）有益正知</text>
<line x1="672.9" y1="684.0" x2="790.9" y2="684.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="675.9" y="675.4" font-size="16" font-weight="500" fill="#2b2a27">（二）适宜正知</text>
<line x1="672.9" y1="723.6" x2="790.9" y2="723.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="675.9" y="715.0" font-size="16" font-weight="500" fill="#2b2a27">（三）行处正知</text>
<line x1="672.9" y1="763.2" x2="790.9" y2="763.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="675.9" y="754.6" font-size="16" font-weight="500" fill="#2b2a27">（四）无痴正知</text>
