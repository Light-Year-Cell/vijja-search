<rect x="30" y="219.8" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="256.8" font-size="26" font-weight="700" fill="#fff">第31讲-摄缘-十二</text>
<text x="48.0" y="291.9" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘31-</text>
<text x="48.0" y="327.0" font-size="26" font-weight="700" fill="#fff">释二十四缘-亲依止</text>
<text x="48.0" y="362.1" font-size="26" font-weight="700" fill="#fff">缘7</text>
<rect x="337.7" y="171.9" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="201.9" font-size="19" font-weight="700" fill="#2b2a27">一、自然亲依止缘</text>
<line x1="571.7" y1="57.6" x2="737.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）缘法和缘所生法</text>
<line x1="571.7" y1="249.2" x2="839.4" y2="249.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="219.0" font-size="16" font-weight="500" fill="#2b2a27">（二） 《发趣论· 问分》 之 “不善</text>
<text x="574.7" y="240.6" font-size="16" font-weight="500" fill="#2b2a27">法对善法以亲依止缘为缘”</text>
<line x1="885.4" y1="164.9" x2="1047.1" y2="164.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="888.4" y="157.0" font-size="14" font-weight="400" fill="#2b2a27">1.贪嗔痴等引生八种善行</text>
<line x1="1093.1" y1="93.1" x2="1236.4" y2="93.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1096.1" y="85.6" font-size="13" font-weight="400" fill="#2b2a27">（1）贪欲引生八种善行</text>
<line x1="1093.1" y1="128.7" x2="1236.4" y2="128.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1096.1" y="121.1" font-size="13" font-weight="400" fill="#2b2a27">（2）嗔恚引生八种善行</text>
<line x1="1093.1" y1="164.2" x2="1236.4" y2="164.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1096.1" y="156.7" font-size="13" font-weight="400" fill="#2b2a27">（3）愚痴引生八种善行</text>
<line x1="1093.1" y1="199.8" x2="1288.4" y2="199.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1096.1" y="192.2" font-size="13" font-weight="400" fill="#2b2a27">（4）不善法和心理疾病及其治疗</text>
<line x1="1093.1" y1="235.4" x2="1314.4" y2="235.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1096.1" y="227.8" font-size="13" font-weight="400" fill="#2b2a27">（5）禅修中不善法对善法的亲依止缘</text>
<line x1="885.4" y1="272.2" x2="1061.1" y2="272.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="888.4" y="264.4" font-size="14" font-weight="400" fill="#2b2a27">2.贪嗔痴等引生信戒闻舍慧</text>
<line x1="885.4" y1="309.1" x2="1047.1" y2="309.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="888.4" y="301.2" font-size="14" font-weight="400" fill="#2b2a27">3.十八种不善行引生善行</text>
<line x1="571.7" y1="370.3" x2="849.7" y2="370.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="340.1" font-size="16" font-weight="500" fill="#2b2a27">（三）善用不善对善的亲依止，引导自</text>
<text x="574.7" y="361.8" font-size="16" font-weight="500" fill="#2b2a27">他弃恶从善</text>
<rect x="337.7" y="382.3" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="412.3" font-size="19" font-weight="700" fill="#2b2a27">二、结语</text>
