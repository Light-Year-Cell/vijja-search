<rect x="30" y="353.1" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="390.1" font-size="26" font-weight="700" fill="#fff">第29讲-摄缘-十二</text>
<text x="48.0" y="425.2" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘29-</text>
<text x="48.0" y="460.3" font-size="26" font-weight="700" fill="#fff">释二十四缘-亲依止</text>
<text x="48.0" y="495.4" font-size="26" font-weight="700" fill="#fff">缘5</text>
<rect x="337.7" y="216.3" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="246.3" font-size="19" font-weight="700" fill="#2b2a27">一、前前诸不善法对后后诸不善</text>
<text x="355.7" y="271.9" font-size="19" font-weight="700" fill="#2b2a27">法</text>
<line x1="685.7" y1="79.4" x2="835.7" y2="79.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="70.8" font-size="16" font-weight="500" fill="#2b2a27">（一）所缘亲依止缘</text>
<line x1="881.7" y1="54.9" x2="1071.4" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1.缘法、缘所生法与所涉诸缘</text>
<line x1="881.7" y1="110.7" x2="1143.0" y2="110.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2.《发趣论·问分》之“不善法对不善法的</text>
<text x="884.7" y="102.8" font-size="14" font-weight="400" fill="#2b2a27">所缘亲依止缘”</text>
<line x1="685.7" y1="198.0" x2="835.7" y2="198.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="189.4" font-size="16" font-weight="500" fill="#2b2a27">（二）无间亲依止缘</text>
<line x1="881.7" y1="147.6" x2="1071.4" y2="147.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="139.7" font-size="14" font-weight="400" fill="#2b2a27">1.缘法、缘所生法与所涉诸缘</text>
<line x1="881.7" y1="255.2" x2="1143.0" y2="255.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="228.4" font-size="14" font-weight="400" fill="#2b2a27">2.《发趣论·问分》之“不善法对不善法的</text>
<text x="884.7" y="247.3" font-size="14" font-weight="400" fill="#2b2a27">无间亲依止缘”</text>
<line x1="1189.0" y1="200.7" x2="1436.3" y2="200.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="175.6" font-size="13" font-weight="400" fill="#2b2a27">（1）结生心路，所有的生命在结生心生起</text>
<text x="1192.0" y="193.2" font-size="13" font-weight="400" fill="#2b2a27">到十六个有分心后必</text>
<line x1="1189.0" y1="253.8" x2="1436.3" y2="253.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="228.7" font-size="13" font-weight="400" fill="#2b2a27">（2）五门心路，在日常看听嗅尝触五门心</text>
<text x="1192.0" y="246.3" font-size="13" font-weight="400" fill="#2b2a27">路中，若生起的速行</text>
<line x1="1189.0" y1="306.9" x2="1437.9" y2="306.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="281.8" font-size="13" font-weight="400" fill="#2b2a27">（3）意门心路、 （4）临死心路，这两种</text>
<text x="1192.0" y="299.4" font-size="13" font-weight="400" fill="#2b2a27">心路的速行皆有此类情</text>
<line x1="685.7" y1="452.0" x2="835.7" y2="452.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="443.4" font-size="16" font-weight="500" fill="#2b2a27">（三）自然亲依止缘</text>
<line x1="881.7" y1="343.8" x2="1071.4" y2="343.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="335.9" font-size="14" font-weight="400" fill="#2b2a27">1.缘法、缘所生法与所涉诸缘</text>
<line x1="881.7" y1="399.6" x2="1143.0" y2="399.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="372.8" font-size="14" font-weight="400" fill="#2b2a27">2.《发趣论·问分》之“不善法对不善法的</text>
<text x="884.7" y="391.7" font-size="14" font-weight="400" fill="#2b2a27">自然亲依止缘”</text>
<line x1="1189.0" y1="396.9" x2="1436.3" y2="396.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="371.8" font-size="13" font-weight="400" fill="#2b2a27">（1）以贪嗔痴等为亲依止而造作十八种不</text>
<text x="1192.0" y="389.4" font-size="13" font-weight="400" fill="#2b2a27">善行</text>
<line x1="881.7" y1="455.4" x2="1149.2" y2="455.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="428.6" font-size="14" font-weight="400" fill="#2b2a27">1.当他达到目标时， 应该得到一些快乐，</text>
<text x="884.7" y="447.5" font-size="14" font-weight="400" fill="#2b2a27"> 以强化行为， 促使他更</text>
<line x1="881.7" y1="511.2" x2="1149.2" y2="511.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="484.4" font-size="14" font-weight="400" fill="#2b2a27">2.快乐不能持续太久。 如同你吃一餐饭就</text>
<text x="884.7" y="503.3" font-size="14" font-weight="400" fill="#2b2a27">能一直幸福， 没有饥饿</text>
<line x1="881.7" y1="567.0" x2="1149.2" y2="567.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="540.2" font-size="14" font-weight="400" fill="#2b2a27">3.应该更多地专注于达到目标的快乐， 以</text>
<text x="884.7" y="559.1" font-size="14" font-weight="400" fill="#2b2a27">忽略快乐的短暂和消失</text>
<rect x="337.7" y="579.0" width="293.6" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="609.0" font-size="19" font-weight="700" fill="#2b2a27">二、 对前前诸不善法对后后诸</text>
<text x="355.7" y="634.6" font-size="19" font-weight="700" fill="#2b2a27">不善法以亲依止缘为缘的</text>
</svg>