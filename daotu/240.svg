<rect x="30" y="170.8" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="207.8" font-size="26" font-weight="700" fill="#fff">第44讲-摄缘-十二</text>
<text x="48.0" y="242.9" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘44-</text>
<text x="48.0" y="278.0" font-size="26" font-weight="700" fill="#fff">释二十四缘-业缘6</text>
<rect x="337.7" y="80.2" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="110.2" font-size="19" font-weight="700" fill="#2b2a27">六、成就与失坏</text>
<line x1="552.7" y1="116.8" x2="766.7" y2="116.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="108.2" font-size="16" font-weight="500" fill="#2b2a27">（二）成就与失坏的互相转化</text>
<line x1="812.7" y1="73.8" x2="1072.4" y2="73.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1.成就令不善业无法成熟，失坏令不善业</text>
<text x="815.7" y="65.9" font-size="14" font-weight="400" fill="#2b2a27">得以成熟</text>
<line x1="812.7" y1="129.6" x2="1072.4" y2="129.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="102.8" font-size="14" font-weight="400" fill="#2b2a27">2.失坏令善业无法成熟，成就令善业得以</text>
<text x="815.7" y="121.7" font-size="14" font-weight="400" fill="#2b2a27">成熟</text>
<line x1="812.7" y1="166.5" x2="988.4" y2="166.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="158.6" font-size="14" font-weight="400" fill="#2b2a27">3.如何避免成就转变为失坏</text>
<rect x="337.7" y="341.1" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="371.1" font-size="19" font-weight="700" fill="#2b2a27">七、生活中的业缘</text>
<line x1="571.7" y1="318.1" x2="737.7" y2="318.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="309.5" font-size="16" font-weight="500" fill="#2b2a27">（一）人生的三个阶段</text>
<line x1="783.7" y1="251.4" x2="931.4" y2="251.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="786.7" y="243.5" font-size="14" font-weight="400" fill="#2b2a27">1.成长求学，被动受报</text>
<line x1="977.4" y1="202.1" x2="1200.2" y2="202.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="980.4" y="194.5" font-size="13" font-weight="400" fill="#2b2a27">(1)这一生结生令生业同一组业的果报</text>
<line x1="977.4" y1="255.2" x2="1227.8" y2="255.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="980.4" y="230.1" font-size="13" font-weight="400" fill="#2b2a27">(2)上一生造业的第七个速行心(次生受业)</text>
<text x="980.4" y="247.6" font-size="13" font-weight="400" fill="#2b2a27">所带来的果报</text>
<line x1="977.4" y1="308.3" x2="1226.2" y2="308.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="980.4" y="283.2" font-size="13" font-weight="400" fill="#2b2a27">(3)过去无数生中造业的第二至第六个速行</text>
<text x="980.4" y="300.7" font-size="13" font-weight="400" fill="#2b2a27">心(后后受业)所带来</text>
<line x1="783.7" y1="345.2" x2="931.4" y2="345.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="786.7" y="337.3" font-size="14" font-weight="400" fill="#2b2a27">2.参加工作，自主造业</text>
<line x1="783.7" y1="382.1" x2="847.4" y2="382.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="786.7" y="374.2" font-size="14" font-weight="400" fill="#2b2a27">3.调适期</text>
<line x1="571.7" y1="437.4" x2="689.7" y2="437.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="428.8" font-size="16" font-weight="500" fill="#2b2a27">（二）止恶扬善</text>
<line x1="735.7" y1="436.1" x2="785.4" y2="436.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="428.2" font-size="14" font-weight="400" fill="#2b2a27">1.持戒</text>
<line x1="831.4" y1="417.6" x2="1013.6" y2="417.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="410.1" font-size="13" font-weight="400" fill="#2b2a27">（1）自然离、受戒离与正断离</text>
<line x1="831.4" y1="453.2" x2="987.6" y2="453.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="445.6" font-size="13" font-weight="400" fill="#2b2a27">（2）三皈五戒与活命具足</text>
