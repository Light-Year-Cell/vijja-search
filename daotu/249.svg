<rect x="30" y="258.4" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="295.4" font-size="26" font-weight="700" fill="#fff">第53讲-摄缘-十二</text>
<text x="48.0" y="330.5" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘53-</text>
<text x="48.0" y="365.6" font-size="26" font-weight="700" fill="#fff">释二十四缘-道缘1</text>
<rect x="337.7" y="60.6" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="90.6" font-size="19" font-weight="700" fill="#2b2a27">一、经文与释义</text>
<line x1="552.7" y1="57.6" x2="654.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）缘广释</text>
<line x1="700.7" y1="54.9" x2="875.8" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="703.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">18.道缘(magga-paccaya)</text>
<line x1="552.7" y1="97.2" x2="638.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）譬喻</text>
<line x1="552.7" y1="136.8" x2="638.7" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三）释义</text>
<rect x="337.7" y="165.0" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="195.0" font-size="19" font-weight="700" fill="#2b2a27">二、经文详释</text>
<line x1="533.7" y1="176.4" x2="779.7" y2="176.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">（一）缘法、缘所生法及所摄诸缘</text>
<line x1="533.7" y1="237.6" x2="806.6" y2="237.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="207.4" font-size="16" font-weight="500" fill="#2b2a27">（二） “道心”于经教和论教中的不同</text>
<text x="536.7" y="229.0" font-size="16" font-weight="500" fill="#2b2a27">含义</text>
<rect x="337.7" y="535.9" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="565.9" font-size="19" font-weight="700" fill="#2b2a27">三、道缘的应用</text>
<line x1="552.7" y1="572.5" x2="784.6" y2="572.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="563.9" font-size="16" font-weight="500" fill="#2b2a27">(一)断邪见立正见，直至正解脱</text>
<line x1="830.6" y1="375.6" x2="936.3" y2="375.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="833.6" y="367.7" font-size="14" font-weight="400" fill="#2b2a27">1.邪见及其危害</text>
<line x1="982.3" y1="273.1" x2="1073.6" y2="273.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="985.3" y="265.6" font-size="13" font-weight="400" fill="#2b2a27">（1）多种邪见</text>
<line x1="982.3" y1="326.2" x2="1232.7" y2="326.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="985.3" y="301.1" font-size="13" font-weight="400" fill="#2b2a27">(1)色即是我：即认为所谓的“我”就是物质</text>
<text x="985.3" y="318.7" font-size="13" font-weight="400" fill="#2b2a27">的身体</text>
<line x1="982.3" y1="379.4" x2="1231.1" y2="379.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="985.3" y="354.2" font-size="13" font-weight="400" fill="#2b2a27">(2)我拥有色：即认为有一个不同于这个身</text>
<text x="985.3" y="371.8" font-size="13" font-weight="400" fill="#2b2a27">体、另外的“我”存</text>
<line x1="982.3" y1="432.5" x2="1231.1" y2="432.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="985.3" y="407.4" font-size="13" font-weight="400" fill="#2b2a27">(3)色在我中：即物质的身体包含在自我当</text>
<text x="985.3" y="424.9" font-size="13" font-weight="400" fill="#2b2a27">中，这个自我是超越</text>
<line x1="982.3" y1="485.6" x2="1231.1" y2="485.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="985.3" y="460.5" font-size="13" font-weight="400" fill="#2b2a27">(4)我在色中：认为自我包含在这个色身当</text>
<text x="985.3" y="478.0" font-size="13" font-weight="400" fill="#2b2a27">中，即这个自我不同</text>
<line x1="830.6" y1="583.6" x2="950.3" y2="583.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="833.6" y="575.8" font-size="14" font-weight="400" fill="#2b2a27">2.邪见的三个层次</text>
<line x1="996.3" y1="538.7" x2="1245.1" y2="538.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="999.3" y="513.6" font-size="13" font-weight="400" fill="#2b2a27">(1)违犯性层次是指表现于身体或语言的恶</text>
<text x="999.3" y="531.1" font-size="13" font-weight="400" fill="#2b2a27">行，即造作三种身恶</text>
<line x1="996.3" y1="591.8" x2="1239.4" y2="591.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="999.3" y="566.7" font-size="13" font-weight="400" fill="#2b2a27">(2)困扰性层次是指心被恶念所困扰， 伴</text>
<text x="999.3" y="584.2" font-size="13" font-weight="400" fill="#2b2a27">随着杂染或烦恼的心念</text>
<line x1="996.3" y1="644.9" x2="1245.1" y2="644.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="999.3" y="619.8" font-size="13" font-weight="400" fill="#2b2a27">(3)潜伏性层次是指潜在的烦恼倾向。它是</text>
<text x="999.3" y="637.3" font-size="13" font-weight="400" fill="#2b2a27">指并未通过身语意三</text>
<line x1="830.6" y1="681.8" x2="978.3" y2="681.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="833.6" y="673.9" font-size="14" font-weight="400" fill="#2b2a27">3.邪见预设的思惟模式</text>
<line x1="1024.3" y1="680.4" x2="1180.6" y2="680.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1027.3" y="672.9" font-size="13" font-weight="400" fill="#2b2a27">（1）为什么修行不能上道</text>
<line x1="830.6" y1="766.7" x2="1034.3" y2="766.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="833.6" y="758.8" font-size="14" font-weight="400" fill="#2b2a27">4.为免错误行道，须以正见先导</text>
<line x1="1080.3" y1="717.3" x2="1249.6" y2="717.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1083.3" y="709.8" font-size="13" font-weight="400" fill="#2b2a27">（1）世间正见与出世间正见</text>
<line x1="1080.3" y1="770.4" x2="1324.4" y2="770.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1083.3" y="745.3" font-size="13" font-weight="400" fill="#2b2a27">(4)道智/慧(magga-ñāṇa/paññā)，包括</text>
<text x="1083.3" y="762.9" font-size="13" font-weight="400" fill="#2b2a27">四种道智</text>
<line x1="1080.3" y1="823.5" x2="1324.4" y2="823.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1083.3" y="798.4" font-size="13" font-weight="400" fill="#2b2a27">(5)果智/慧(phala-ñāṇa/paññā)，包括</text>
<text x="1083.3" y="816.0" font-size="13" font-weight="400" fill="#2b2a27">四种果智</text>
</svg>