<rect x="30" y="204.3" width="267.9" height="92.2" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="241.3" font-size="26" font-weight="700" fill="#fff">187讲-摄集35-摄菩</text>
<text x="48.0" y="276.4" font-size="26" font-weight="700" fill="#fff">提分-法念处-五盖1</text>
<rect x="343.9" y="226.6" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="256.6" font-size="19" font-weight="700" fill="#2b2a27">一、欲贪盖</text>
<line x1="520.9" y1="111.6" x2="654.9" y2="111.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="103.0" font-size="16" font-weight="500" fill="#2b2a27">（一）不如理作意</text>
<line x1="700.9" y1="54.9" x2="800.4" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="703.9" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1. 视无常为常</text>
<line x1="700.9" y1="91.8" x2="786.4" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="703.9" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2. 视苦为乐</text>
<line x1="700.9" y1="128.7" x2="800.4" y2="128.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="703.9" y="120.8" font-size="14" font-weight="400" fill="#2b2a27">3. 视无我为我</text>
<line x1="700.9" y1="165.6" x2="800.4" y2="165.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="703.9" y="157.7" font-size="14" font-weight="400" fill="#2b2a27">4. 视不净为净</text>
<line x1="520.9" y1="205.2" x2="702.9" y2="205.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="196.6" font-size="16" font-weight="500" fill="#2b2a27">（二）了知内心生起欲贪</text>
<line x1="520.9" y1="244.8" x2="638.9" y2="244.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="236.2" font-size="16" font-weight="500" fill="#2b2a27">（三）如理作意</text>
<line x1="520.9" y1="284.4" x2="766.9" y2="284.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="275.8" font-size="16" font-weight="500" fill="#2b2a27">（四）不如理作意会导致欲贪生起</text>
<line x1="520.9" y1="414.9" x2="718.9" y2="414.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="406.3" font-size="16" font-weight="500" fill="#2b2a27">（五）灭除欲贪的六种方法</text>
<line x1="764.9" y1="321.3" x2="892.4" y2="321.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="313.4" font-size="14" font-weight="400" fill="#2b2a27">1. 取得不净的目标</text>
<line x1="764.9" y1="358.2" x2="920.4" y2="358.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="350.3" font-size="14" font-weight="400" fill="#2b2a27">2. 致力于修行厌恶作意</text>
<line x1="764.9" y1="395.1" x2="850.4" y2="395.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="387.2" font-size="14" font-weight="400" fill="#2b2a27">3. 守护根门</text>
<line x1="764.9" y1="432.0" x2="850.4" y2="432.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="424.1" font-size="14" font-weight="400" fill="#2b2a27">4. 饮食适量</text>
<line x1="764.9" y1="468.9" x2="864.4" y2="468.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="461.0" font-size="14" font-weight="400" fill="#2b2a27">5. 亲近善知识</text>
<line x1="764.9" y1="505.8" x2="864.4" y2="505.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="497.9" font-size="14" font-weight="400" fill="#2b2a27">6. 适当的言谈</text>
</svg>