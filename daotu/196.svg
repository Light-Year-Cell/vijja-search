<text x="885.9" y="202.7" font-size="14" font-weight="400" fill="#2b2a27">2.苦集圣谛</text>
<line x1="882.9" y1="247.5" x2="960.6" y2="247.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="885.9" y="239.6" font-size="14" font-weight="400" fill="#2b2a27">3.苦灭圣谛</text>
<line x1="882.9" y1="284.4" x2="988.6" y2="284.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="885.9" y="276.5" font-size="14" font-weight="400" fill="#2b2a27">4.苦灭之道圣谛</text>
<line x1="558.9" y1="341.1" x2="724.9" y2="341.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="561.9" y="332.5" font-size="16" font-weight="500" fill="#2b2a27">（二）集的生起、建立</text>
<line x1="770.9" y1="321.3" x2="904.6" y2="321.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="773.9" y="313.4" font-size="14" font-weight="400" fill="#2b2a27">1.从缘起支角度分析</text>
<line x1="770.9" y1="358.2" x2="960.6" y2="358.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="773.9" y="350.3" font-size="14" font-weight="400" fill="#2b2a27">2.日常观察爱欲的生起与建立</text>
<line x1="558.9" y1="397.8" x2="724.9" y2="397.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
