<text x="361.9" y="327.3" font-size="19" font-weight="700" fill="#2b2a27">二、四圣谛运用</text>
<line x1="558.9" y1="241.2" x2="836.9" y2="241.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="561.9" y="211.0" font-size="16" font-weight="500" fill="#2b2a27">（一）看问题的原则是四圣谛，解决问</text>
<text x="561.9" y="232.6" font-size="16" font-weight="500" fill="#2b2a27">题的路径是八正道</text>
<line x1="882.9" y1="173.7" x2="946.6" y2="173.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="885.9" y="165.8" font-size="14" font-weight="400" fill="#2b2a27">1.苦圣谛</text>
