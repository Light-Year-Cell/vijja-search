<text x="48.0" y="193.3" font-size="26" font-weight="700" fill="#fff">提分-受念处1</text>
<rect x="343.9" y="30.0" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、四念处与调伏者的根性</text>
<rect x="343.9" y="256.9" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="286.9" font-size="19" font-weight="700" fill="#2b2a27">二、受念处</text>
<line x1="520.9" y1="174.4" x2="622.9" y2="174.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="165.8" font-size="16" font-weight="500" fill="#2b2a27">（一）三种受</text>
<line x1="668.9" y1="131.5" x2="936.4" y2="131.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="671.9" y="104.7" font-size="14" font-weight="400" fill="#2b2a27">1. 谁在感受？感受是谁的？为什么有感受</text>
<text x="671.9" y="123.6" font-size="14" font-weight="400" fill="#2b2a27">产生？</text>
<line x1="668.9" y1="187.3" x2="936.4" y2="187.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="671.9" y="160.5" font-size="14" font-weight="400" fill="#2b2a27">2. 只是受（受心所）在感受，没有一个我</text>
<text x="671.9" y="179.4" font-size="14" font-weight="400" fill="#2b2a27">在感受</text>
<line x1="668.9" y1="224.2" x2="872.6" y2="224.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="671.9" y="216.3" font-size="14" font-weight="400" fill="#2b2a27">4.如何于身体的苦受修习受随观</text>
<line x1="520.9" y1="280.9" x2="622.9" y2="280.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="272.3" font-size="16" font-weight="500" fill="#2b2a27">（二）六种受</text>
<line x1="668.9" y1="261.1" x2="810.4" y2="261.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="671.9" y="253.2" font-size="14" font-weight="400" fill="#2b2a27">1. 三种有爱染的感受</text>
<line x1="668.9" y1="298.0" x2="922.4" y2="298.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="671.9" y="290.1" font-size="14" font-weight="400" fill="#2b2a27">2. 三种没有爱染的感受（出离依止受）</text>
<line x1="520.9" y1="337.6" x2="654.9" y2="337.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="329.0" font-size="16" font-weight="500" fill="#2b2a27">（三）当培育的受</text>
<line x1="520.9" y1="412.7" x2="686.9" y2="412.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="404.1" font-size="16" font-weight="500" fill="#2b2a27">（四）受念处修习方法</text>
<line x1="732.9" y1="374.5" x2="846.4" y2="374.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="735.9" y="366.6" font-size="14" font-weight="400" fill="#2b2a27">1. 受念处的特点</text>
<line x1="732.9" y1="411.4" x2="942.8" y2="411.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="735.9" y="403.5" font-size="14" font-weight="400" fill="#2b2a27">2．日常生活中对于受应持的态度</text>
<line x1="732.9" y1="448.2" x2="872.8" y2="448.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="735.9" y="440.4" font-size="14" font-weight="400" fill="#2b2a27">3．名业处的修习方法</text>
