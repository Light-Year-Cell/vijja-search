<rect x="30" y="783.7" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="820.7" font-size="26" font-weight="700" fill="#fff">第71讲-摄缘-十二</text>
<text x="48.0" y="855.8" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘71-</text>
<text x="48.0" y="890.9" font-size="26" font-weight="700" fill="#fff">离路心的缘-行缘识</text>
<text x="48.0" y="926.0" font-size="26" font-weight="700" fill="#fff">6</text>
<rect x="337.7" y="841.1" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="871.1" font-size="19" font-weight="700" fill="#2b2a27">一、辨识欲界有因结生名色的缘</text>
<line x1="685.7" y1="877.7" x2="949.6" y2="877.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="869.1" font-size="16" font-weight="500" fill="#2b2a27">（一）有因结生（8 欲界大果报心）</text>
<line x1="995.6" y1="54.9" x2="1126.5" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1. 名俱生组 13 缘</text>
<line x1="995.6" y1="110.7" x2="1258.6" y2="110.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2. 依处俱生组 6 缘，结生心的生起需要</text>
<text x="998.6" y="102.8" font-size="14" font-weight="400" fill="#2b2a27">俱生的结生色法——心</text>
<line x1="995.6" y1="166.5" x2="1258.6" y2="166.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="139.7" font-size="14" font-weight="400" fill="#2b2a27">3. 所缘缘 2 缘，结生心的所缘是上一生</text>
<text x="998.6" y="158.6" font-size="14" font-weight="400" fill="#2b2a27">临死前成熟的业、业相、</text>
<line x1="995.6" y1="203.4" x2="1095.1" y2="203.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="195.5" font-size="14" font-weight="400" fill="#2b2a27">4. 异刹那业缘</text>
<line x1="995.6" y1="259.2" x2="1266.5" y2="259.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="232.4" font-size="14" font-weight="400" fill="#2b2a27">5. 无间组 5 缘， 上一生死亡心和这一生</text>
<text x="998.6" y="251.3" font-size="14" font-weight="400" fill="#2b2a27">的结生心之间是无间的</text>
<line x1="995.6" y1="315.0" x2="1263.1" y2="315.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="288.2" font-size="14" font-weight="400" fill="#2b2a27">6. 自然亲依止缘，其它任何有效缘力的自</text>
<text x="998.6" y="307.1" font-size="14" font-weight="400" fill="#2b2a27">然亲依止缘，包括父</text>
<line x1="995.6" y1="370.8" x2="1258.6" y2="370.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="344.0" font-size="14" font-weight="400" fill="#2b2a27">2.俱生依止缘（34 结生名法之间） ，互</text>
<text x="998.6" y="362.9" font-size="14" font-weight="400" fill="#2b2a27">相依止</text>
<line x1="995.6" y1="426.6" x2="1258.6" y2="426.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="399.8" font-size="14" font-weight="400" fill="#2b2a27">3.俱生有缘（34 结生名法之间） ，同时</text>
<text x="998.6" y="418.7" font-size="14" font-weight="400" fill="#2b2a27">存在，同生同灭</text>
<line x1="995.6" y1="463.5" x2="1244.6" y2="463.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="455.6" font-size="14" font-weight="400" fill="#2b2a27">4.俱生不离去缘（34 结生名法之间） </text>
<line x1="995.6" y1="500.4" x2="1202.6" y2="500.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="492.5" font-size="14" font-weight="400" fill="#2b2a27">5.相互缘（34 结生名法之间） </text>
<line x1="995.6" y1="556.2" x2="1266.5" y2="556.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="529.4" font-size="14" font-weight="400" fill="#2b2a27">8.俱生名食缘（触、思、识→余 31 名法）</text>
<text x="998.6" y="548.3" font-size="14" font-weight="400" fill="#2b2a27"> ：触食、思食和识食是</text>
<line x1="995.6" y1="612.0" x2="1255.3" y2="612.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="585.2" font-size="14" font-weight="400" fill="#2b2a27">9.俱生名根缘（意根、受、信、精进、念</text>
<text x="998.6" y="604.1" font-size="14" font-weight="400" fill="#2b2a27">、</text>
<line x1="995.6" y1="648.9" x2="1193.1" y2="648.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="641.0" font-size="14" font-weight="400" fill="#2b2a27">12.禅那缘（寻、伺、喜、受、</text>
<line x1="995.6" y1="704.7" x2="1262.0" y2="704.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="677.9" font-size="14" font-weight="400" fill="#2b2a27">3.俱生有缘（结生心色 1 色→结生心 34 </text>
<text x="998.6" y="696.8" font-size="14" font-weight="400" fill="#2b2a27">名法） </text>
<line x1="995.6" y1="760.5" x2="1266.5" y2="760.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="733.7" font-size="14" font-weight="400" fill="#2b2a27">4.俱生不离去缘（结生心色 1 色→结生心 </text>
<text x="998.6" y="752.6" font-size="14" font-weight="400" fill="#2b2a27">34 名法） </text>
<line x1="995.6" y1="816.3" x2="1254.2" y2="816.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="789.5" font-size="14" font-weight="400" fill="#2b2a27">5.相互缘（结生心色 1 色与结生心 34 </text>
<text x="998.6" y="808.4" font-size="14" font-weight="400" fill="#2b2a27">名法相互之间） </text>
<line x1="995.6" y1="872.1" x2="1262.0" y2="872.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="845.3" font-size="14" font-weight="400" fill="#2b2a27">6.不相应缘（结生心色 1 色→结生心 34 </text>
<text x="998.6" y="864.2" font-size="14" font-weight="400" fill="#2b2a27">名法） </text>
<line x1="995.6" y1="927.9" x2="1262.0" y2="927.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="901.1" font-size="14" font-weight="400" fill="#2b2a27">1.俱生缘（业生 29 色对结生心 34 名法</text>
<text x="998.6" y="920.0" font-size="14" font-weight="400" fill="#2b2a27">） </text>
<line x1="995.6" y1="983.7" x2="1255.8" y2="983.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="956.9" font-size="14" font-weight="400" fill="#2b2a27">2.俱生依止缘（业生 29 色→结生心 34 </text>
<text x="998.6" y="975.8" font-size="14" font-weight="400" fill="#2b2a27">名法） </text>
<line x1="995.6" y1="1039.5" x2="1255.8" y2="1039.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1012.7" font-size="14" font-weight="400" fill="#2b2a27">3.俱生有缘（业生 29 色→结生心 34 名</text>
<text x="998.6" y="1031.6" font-size="14" font-weight="400" fill="#2b2a27">法） </text>
<line x1="995.6" y1="1095.3" x2="1262.0" y2="1095.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1068.5" font-size="14" font-weight="400" fill="#2b2a27">4.俱生不离去缘（业生 29 色→结生心 34</text>
<text x="998.6" y="1087.4" font-size="14" font-weight="400" fill="#2b2a27"> 名法） </text>
<line x1="995.6" y1="1151.1" x2="1255.8" y2="1151.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1124.3" font-size="14" font-weight="400" fill="#2b2a27">5.不相应缘（业生 29 色→结生心 34 名</text>
<text x="998.6" y="1143.2" font-size="14" font-weight="400" fill="#2b2a27">法） </text>
<line x1="995.6" y1="1188.0" x2="1224.5" y2="1188.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1180.1" font-size="14" font-weight="400" fill="#2b2a27">1.无间缘（死心→结生心 34 名法）</text>
<line x1="995.6" y1="1224.9" x2="1238.5" y2="1224.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1217.0" font-size="14" font-weight="400" fill="#2b2a27">2.等无间缘（死心→结生心 34 名法）</text>
<line x1="995.6" y1="1261.8" x2="1266.5" y2="1261.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1253.9" font-size="14" font-weight="400" fill="#2b2a27">3.无间亲依止缘（死心→结生心 34 名法）</text>
<line x1="995.6" y1="1298.7" x2="1224.5" y2="1298.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1290.8" font-size="14" font-weight="400" fill="#2b2a27">4.无有缘（死心→结生心 34 名法）</text>
<line x1="995.6" y1="1335.6" x2="1224.5" y2="1335.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1327.7" font-size="14" font-weight="400" fill="#2b2a27">5.离去缘（死心→结生心 34 名法）</text>
<line x1="995.6" y1="1391.4" x2="1260.3" y2="1391.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1364.6" font-size="14" font-weight="400" fill="#2b2a27">1.Kamma（业） ：思所遗留下来的心理余</text>
<text x="998.6" y="1383.5" font-size="14" font-weight="400" fill="#2b2a27">势，业的潜力</text>
<line x1="995.6" y1="1447.2" x2="1262.0" y2="1447.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1420.4" font-size="14" font-weight="400" fill="#2b2a27">2.Anusaya（随眠） ：不善心所如贪、瞋</text>
<text x="998.6" y="1439.3" font-size="14" font-weight="400" fill="#2b2a27">等所遗留下来的心理余</text>
<line x1="995.6" y1="1503.0" x2="1254.2" y2="1503.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1476.2" font-size="14" font-weight="400" fill="#2b2a27">3.Pāramī（波罗密） ：善的心所遗留下</text>
<text x="998.6" y="1495.1" font-size="14" font-weight="400" fill="#2b2a27">来的心理余势。指崇高人</text>
<line x1="995.6" y1="1558.8" x2="1255.8" y2="1558.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1532.0" font-size="14" font-weight="400" fill="#2b2a27">4.Ajhāsaya（意向性） ：关系着我们过</text>
<text x="998.6" y="1550.9" font-size="14" font-weight="400" fill="#2b2a27">去生经验的喜好或厌恶</text>
<line x1="995.6" y1="1595.7" x2="1128.2" y2="1595.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1587.8" font-size="14" font-weight="400" fill="#2b2a27">5.Vāsanā（习气） </text>
<line x1="995.6" y1="1651.5" x2="1258.6" y2="1651.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1624.7" font-size="14" font-weight="400" fill="#2b2a27">1.异刹那业缘（过去令生业思→34 结生名</text>
<text x="998.6" y="1643.6" font-size="14" font-weight="400" fill="#2b2a27">聚） ：异刹那业缘是过</text>
<line x1="995.6" y1="1707.3" x2="1255.3" y2="1707.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="998.6" y="1680.5" font-size="14" font-weight="400" fill="#2b2a27">2.自然亲依止业缘：无明爱取行业是一整</text>
<text x="998.6" y="1699.4" font-size="14" font-weight="400" fill="#2b2a27">组的因，无明、爱、取</text>
</svg>