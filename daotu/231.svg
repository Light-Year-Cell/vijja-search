<text x="48.0" y="585.0" font-size="26" font-weight="700" fill="#fff">第35讲-摄缘-十二</text>
<text x="48.0" y="620.1" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘35-</text>
<text x="48.0" y="655.2" font-size="26" font-weight="700" fill="#fff">释二十四缘-亲依止</text>
<text x="48.0" y="690.3" font-size="26" font-weight="700" fill="#fff">缘11</text>
<rect x="337.7" y="30.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、雷迪西亚多《发趣总说手册</text>
<text x="355.7" y="85.7" font-size="19" font-weight="700" fill="#2b2a27">》亲依止缘总结</text>
<rect x="337.7" y="139.8" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="169.8" font-size="19" font-weight="700" fill="#2b2a27">二、善用亲依止缘的缘力</text>
