<text x="955.7" y="167.2" font-size="14" font-weight="400" fill="#2b2a27">2.不善法对善法以亲依止缘为缘</text>
<line x1="952.7" y1="212.0" x2="1156.4" y2="212.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="955.7" y="204.1" font-size="14" font-weight="400" fill="#2b2a27">3.无记法对善法以亲依止缘为缘</text>
<rect x="337.7" y="224.0" width="293.6" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="254.0" font-size="19" font-weight="700" fill="#2b2a27">一、生之苦， ；二、老之苦；</text>
<text x="355.7" y="279.7" font-size="19" font-weight="700" fill="#2b2a27">三、病痛之</text>
<rect x="337.7" y="329.1" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="359.1" font-size="19" font-weight="700" fill="#2b2a27">一、远行之前，省思远行时没有</text>
<text x="355.7" y="384.8" font-size="19" font-weight="700" fill="#2b2a27">时间修行，所以</text>
<line x1="685.7" y1="389.4" x2="956.6" y2="389.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="359.2" font-size="16" font-weight="500" fill="#2b2a27">(二）善用亲依止缘的缘力，规避不善</text>
<text x="688.7" y="380.8" font-size="16" font-weight="500" fill="#2b2a27">法</text>
