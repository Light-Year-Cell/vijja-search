<text x="1255.3" y="360.2" font-size="13" font-weight="400" fill="#2b2a27">(4)缺乏正念正知； （5）缺乏戒律保护意</text>
<text x="1255.3" y="377.8" font-size="13" font-weight="400" fill="#2b2a27">识</text>
