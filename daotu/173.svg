<rect x="30" y="355.7" width="267.9" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="392.7" font-size="26" font-weight="700" fill="#fff">173讲-摄集21-摄菩</text>
<text x="48.0" y="427.8" font-size="26" font-weight="700" fill="#fff">提分-身念处-入出</text>
<text x="48.0" y="462.9" font-size="26" font-weight="700" fill="#fff">息念2</text>
<rect x="343.9" y="123.6" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="153.6" font-size="19" font-weight="700" fill="#2b2a27">一、圣正定</text>
<line x1="520.9" y1="79.2" x2="791.9" y2="79.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">1、所缘明确。你的心始终在佛陀教导</text>
<text x="523.9" y="70.6" font-size="16" font-weight="500" fill="#2b2a27">的四十种业处的某一种业</text>
<line x1="520.9" y1="140.4" x2="791.9" y2="140.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">2、所缘稳定。若你要达成善的一境性</text>
<text x="523.9" y="131.8" font-size="16" font-weight="500" fill="#2b2a27">，帕奥西亚多讲须三个小</text>
<line x1="520.9" y1="201.6" x2="791.9" y2="201.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="171.4" font-size="16" font-weight="500" fill="#2b2a27">3、所缘清晰。如果所缘不清晰，你也</text>
<text x="523.9" y="193.0" font-size="16" font-weight="500" fill="#2b2a27">不会愿意待那么长时间</text>
<line x1="520.9" y1="262.8" x2="791.9" y2="262.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="232.6" font-size="16" font-weight="500" fill="#2b2a27">4、所缘有强大的吸引力。禅修的过程</text>
<text x="523.9" y="254.2" font-size="16" font-weight="500" fill="#2b2a27">——成就入出息念，就是</text>
<rect x="343.9" y="667.4" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="697.4" font-size="19" font-weight="700" fill="#2b2a27">二、前行准备</text>
<line x1="539.9" y1="302.4" x2="737.9" y2="302.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="293.8" font-size="16" font-weight="500" fill="#2b2a27">（一）五种适合禅修的条件</text>
<line x1="539.9" y1="342.0" x2="689.9" y2="342.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="333.4" font-size="16" font-weight="500" fill="#2b2a27">（二）检查心理状态</text>
<line x1="539.9" y1="381.6" x2="689.9" y2="381.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="373.0" font-size="16" font-weight="500" fill="#2b2a27">（三）检查三种性行</text>
<line x1="539.9" y1="540.9" x2="689.9" y2="540.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="532.3" font-size="16" font-weight="500" fill="#2b2a27">（四）性行者的区别</text>
<line x1="735.9" y1="437.4" x2="995.6" y2="437.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.9" y="410.6" font-size="14" font-weight="400" fill="#2b2a27">1.观察行。比如贪性行者，走路时用自然</text>
<text x="738.9" y="429.5" font-size="14" font-weight="400" fill="#2b2a27">、优美的走法，徐徐的</text>
<line x1="735.9" y1="493.2" x2="995.6" y2="493.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.9" y="466.4" font-size="14" font-weight="400" fill="#2b2a27">2.观察站立。站立，贪性行者是优美的姿</text>
<text x="738.9" y="485.3" font-size="14" font-weight="400" fill="#2b2a27">态，令人喜悦；瞋性行</text>
<line x1="735.9" y1="549.0" x2="995.6" y2="549.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.9" y="522.2" font-size="14" font-weight="400" fill="#2b2a27">3.观察工作。比如工作，贪行者不急不缓</text>
<text x="738.9" y="541.1" font-size="14" font-weight="400" fill="#2b2a27">，比如扫地不会打散地</text>
<line x1="735.9" y1="604.8" x2="995.6" y2="604.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.9" y="578.0" font-size="14" font-weight="400" fill="#2b2a27">4.观察饮食。从饮食上，贪行者喜欢肥甘</text>
<text x="738.9" y="596.9" font-size="14" font-weight="400" fill="#2b2a27">、美食，吃的时候不急</text>
<line x1="735.9" y1="660.6" x2="995.6" y2="660.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="738.9" y="633.8" font-size="14" font-weight="400" fill="#2b2a27">5.观察见解。见解上，贪行者看到细小的</text>
<text x="738.9" y="652.7" font-size="14" font-weight="400" fill="#2b2a27">喜悦事物，也会产生惊</text>
<line x1="539.9" y1="700.2" x2="737.9" y2="700.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="691.6" font-size="16" font-weight="500" fill="#2b2a27">（五）检查当下五盖的状态</text>
<line x1="539.9" y1="739.8" x2="801.9" y2="739.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="731.2" font-size="16" font-weight="500" fill="#2b2a27">（六）省察影响每天禅修的五个因素</text>
<line x1="539.9" y1="787.5" x2="705.9" y2="787.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="778.9" font-size="16" font-weight="500" fill="#2b2a27">（七）修习方法的选择</text>
<line x1="751.9" y1="795.6" x2="1011.6" y2="795.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="754.9" y="768.8" font-size="14" font-weight="400" fill="#2b2a27">1、符合佛陀的教导；2、依据完整的三藏</text>
<text x="754.9" y="787.7" font-size="14" font-weight="400" fill="#2b2a27">教理及《清净道</text>
<line x1="539.9" y1="835.2" x2="673.9" y2="835.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="826.6" font-size="16" font-weight="500" fill="#2b2a27">（八）师长的选择</text>
<line x1="539.9" y1="906.1" x2="753.9" y2="906.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="897.5" font-size="16" font-weight="500" fill="#2b2a27">（九）身心放松与学会用意门</text>
<line x1="799.9" y1="891.0" x2="1065.8" y2="891.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.9" y="864.2" font-size="14" font-weight="400" fill="#2b2a27">1、修学的环境、禅修的环境。要找一个没</text>
<text x="802.9" y="883.1" font-size="14" font-weight="400" fill="#2b2a27">有干扰、没有噪音、很</text>
<line x1="799.9" y1="927.9" x2="1051.8" y2="927.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.9" y="920.0" font-size="14" font-weight="400" fill="#2b2a27">2、结跏趺坐，保持其身正直，置念于前</text>
<line x1="539.9" y1="1105.6" x2="657.9" y2="1105.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="1097.0" font-size="16" font-weight="500" fill="#2b2a27">（十）确定所缘</text>
<line x1="703.9" y1="983.7" x2="969.8" y2="983.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="706.9" y="956.9" font-size="14" font-weight="400" fill="#2b2a27">1、有利于练习入出息念的处所。如前所说</text>
<text x="706.9" y="975.8" font-size="14" font-weight="400" fill="#2b2a27">： “比库于空闲处”</text>
<line x1="703.9" y1="1020.6" x2="913.8" y2="1020.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="706.9" y="1012.7" font-size="14" font-weight="400" fill="#2b2a27">2、当练习入出息念时身体的姿势</text>
<line x1="703.9" y1="1076.4" x2="969.8" y2="1076.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="706.9" y="1049.6" font-size="14" font-weight="400" fill="#2b2a27">3、练习入出息念的四个方式：数息、长息</text>
<text x="706.9" y="1068.5" font-size="14" font-weight="400" fill="#2b2a27">、短息、全息、微息</text>
<line x1="703.9" y1="1132.2" x2="963.6" y2="1132.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="706.9" y="1105.4" font-size="14" font-weight="400" fill="#2b2a27">1、固定正念的地方。“因为如果他的心与</text>
<text x="706.9" y="1124.3" font-size="14" font-weight="400" fill="#2b2a27">入息共入于内部，则</text>
<line x1="703.9" y1="1188.0" x2="963.6" y2="1188.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="706.9" y="1161.2" font-size="14" font-weight="400" fill="#2b2a27">2、达到定和入定。这是三相的问题。“相</text>
<text x="706.9" y="1180.1" font-size="14" font-weight="400" fill="#2b2a27">、入息、出息不是一</text>
<line x1="703.9" y1="1243.8" x2="971.4" y2="1243.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="706.9" y="1217.0" font-size="14" font-weight="400" fill="#2b2a27">3、第一个要点“固定正念的地方”里，在觉</text>
<text x="706.9" y="1235.9" font-size="14" font-weight="400" fill="#2b2a27">知呼吸的同时你也</text>
</svg>