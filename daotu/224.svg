<rect x="30" y="617.8" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="654.8" font-size="26" font-weight="700" fill="#fff">第28讲-摄缘-十二</text>
<text x="48.0" y="689.9" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘28-</text>
<text x="48.0" y="725.0" font-size="26" font-weight="700" fill="#fff">释二十四缘-亲依止</text>
<text x="48.0" y="760.1" font-size="26" font-weight="700" fill="#fff">缘4</text>
<rect x="337.7" y="211.5" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="241.5" font-size="19" font-weight="700" fill="#2b2a27">一、前前诸善法对后后诸无记法</text>
<line x1="685.7" y1="79.4" x2="835.7" y2="79.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="70.8" font-size="16" font-weight="500" fill="#2b2a27">（一）所缘亲依止缘</text>
<line x1="881.7" y1="54.9" x2="1079.2" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1. 缘法、缘所生法及所摄诸缘</text>
<line x1="881.7" y1="110.7" x2="1143.0" y2="110.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2.《发趣论•问分》之“善法对无记法的所</text>
<text x="884.7" y="102.8" font-size="14" font-weight="400" fill="#2b2a27">缘亲依止缘”</text>
<line x1="685.7" y1="202.5" x2="835.7" y2="202.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="193.9" font-size="16" font-weight="500" fill="#2b2a27">（二）无间亲依止缘</text>
<line x1="881.7" y1="147.6" x2="1079.2" y2="147.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="139.7" font-size="14" font-weight="400" fill="#2b2a27">1. 缘法、缘所生法及所摄诸缘</text>
<line x1="881.7" y1="264.2" x2="1143.0" y2="264.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="237.4" font-size="14" font-weight="400" fill="#2b2a27">2.《发趣论•问分》之“善法对无记法的无</text>
<text x="884.7" y="256.2" font-size="14" font-weight="400" fill="#2b2a27">间亲依止缘”</text>
<line x1="1189.0" y1="200.7" x2="1437.9" y2="200.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="175.6" font-size="13" font-weight="400" fill="#2b2a27">(1)于灭尽定，身边的资具不会受损，例如</text>
<text x="1192.0" y="193.2" font-size="13" font-weight="400" fill="#2b2a27">袈裟、钵以及其他随</text>
<line x1="1189.0" y1="236.3" x2="1359.9" y2="236.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="228.7" font-size="13" font-weight="400" fill="#2b2a27">(2)若僧团有事，即自动出定</text>
<line x1="1189.0" y1="271.8" x2="1359.9" y2="271.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="264.2" font-size="13" font-weight="400" fill="#2b2a27">(3)若佛陀召唤，即自动出定</text>
<line x1="1189.0" y1="324.9" x2="1437.9" y2="324.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="299.8" font-size="13" font-weight="400" fill="#2b2a27">(4)若寿命将尽，即于寿终前出定。因此入</text>
<text x="1192.0" y="317.4" font-size="13" font-weight="400" fill="#2b2a27">灭尽定者不可能在定</text>
<line x1="685.7" y1="416.8" x2="835.7" y2="416.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="408.2" font-size="16" font-weight="500" fill="#2b2a27">（三）自然亲依止缘</text>
<line x1="881.7" y1="361.8" x2="1079.2" y2="361.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="353.9" font-size="14" font-weight="400" fill="#2b2a27">1. 缘法、缘所生法及所摄诸缘</text>
<line x1="881.7" y1="478.6" x2="1143.0" y2="478.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="884.7" y="451.8" font-size="14" font-weight="400" fill="#2b2a27">2.《发趣论•问分》之“善法对无记法的自</text>
<text x="884.7" y="470.7" font-size="14" font-weight="400" fill="#2b2a27">然亲依止缘”</text>
<line x1="1189.0" y1="397.4" x2="1306.3" y2="397.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="389.8" font-size="13" font-weight="400" fill="#2b2a27">（1）因信而承受苦</text>
<line x1="1189.0" y1="432.9" x2="1306.3" y2="432.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="425.4" font-size="13" font-weight="400" fill="#2b2a27">（2）因戒而承受苦</text>
<line x1="1189.0" y1="468.5" x2="1306.3" y2="468.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="460.9" font-size="13" font-weight="400" fill="#2b2a27">（3）因闻而承受苦</text>
<line x1="1189.0" y1="504.0" x2="1306.3" y2="504.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="496.5" font-size="13" font-weight="400" fill="#2b2a27">（4）因舍而承受苦</text>
<line x1="1189.0" y1="539.6" x2="1306.3" y2="539.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1192.0" y="532.0" font-size="13" font-weight="400" fill="#2b2a27">（5）因慧而承受苦</text>
<rect x="337.7" y="598.3" width="293.6" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="628.3" font-size="19" font-weight="700" fill="#2b2a27">一、问了再问（询问） ；二、</text>
<line x1="677.3" y1="600.8" x2="948.3" y2="600.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="570.6" font-size="16" font-weight="500" fill="#2b2a27">（6）信戒闻舍慧对身乐、身苦、果等</text>
<text x="680.3" y="592.2" font-size="16" font-weight="500" fill="#2b2a27">至</text>
<line x1="677.3" y1="640.4" x2="797.2" y2="640.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="631.8" font-size="16" font-weight="500" fill="#2b2a27">（7)善业对果报</text>
<line x1="677.3" y1="680.0" x2="884.3" y2="680.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="671.4" font-size="16" font-weight="500" fill="#2b2a27">（8）阿拉汉道对唯作等至等</text>
<rect x="337.7" y="692.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="722.0" font-size="19" font-weight="700" fill="#2b2a27">一、是指具备五自在的八定中的</text>
<text x="355.7" y="747.6" font-size="19" font-weight="700" fill="#2b2a27">任何一种</text>
<rect x="337.7" y="902.6" width="293.6" height="99.0" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="932.6" font-size="19" font-weight="700" fill="#2b2a27">二、 灭尽定。 阿拉汉道生起</text>
<text x="355.7" y="958.2" font-size="19" font-weight="700" fill="#2b2a27">时斩断了所有烦恼， 自此之后</text>
<text x="355.7" y="983.9" font-size="19" font-weight="700" fill="#2b2a27">阿拉汉生起</text>
<line x1="677.3" y1="802.9" x2="884.3" y2="802.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="794.3" font-size="16" font-weight="500" fill="#2b2a27">（9）阿拉汉道对四辨析智等</text>
<line x1="677.3" y1="864.1" x2="943.8" y2="864.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="833.9" font-size="16" font-weight="500" fill="#2b2a27">(1)证得(adhigama)，即证悟阿拉汉</text>
<text x="680.3" y="855.5" font-size="16" font-weight="500" fill="#2b2a27">道果或任何其他道果</text>
<line x1="677.3" y1="925.3" x2="952.8" y2="925.3" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="895.1" font-size="16" font-weight="500" fill="#2b2a27">(2)教理(pariyatti)，即学习（通达</text>
<text x="680.3" y="916.7" font-size="16" font-weight="500" fill="#2b2a27">）经典教理</text>
<line x1="677.3" y1="986.5" x2="941.9" y2="986.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="956.3" font-size="16" font-weight="500" fill="#2b2a27">(3)听闻(savana)，专注、恭敬地聆</text>
<text x="680.3" y="977.9" font-size="16" font-weight="500" fill="#2b2a27">听法义</text>
<line x1="677.3" y1="1047.7" x2="952.8" y2="1047.7" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="1017.5" font-size="16" font-weight="500" fill="#2b2a27">(5)宿行(pubbayoga)，曾在过去佛的</text>
<text x="680.3" y="1039.1" font-size="16" font-weight="500" fill="#2b2a27">教法时期修习止观达到行</text>
<line x1="677.3" y1="1087.3" x2="813.2" y2="1087.3" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="1078.7" font-size="16" font-weight="500" fill="#2b2a27">（10）道对果等至</text>
<line x1="677.3" y1="1126.9" x2="795.3" y2="1126.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="1118.3" font-size="16" font-weight="500" fill="#2b2a27">（四）规避不善</text>
<rect x="337.7" y="1138.9" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="1168.9" font-size="19" font-weight="700" fill="#2b2a27">二、结语</text>
</svg>