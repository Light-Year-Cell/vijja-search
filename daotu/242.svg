<rect x="30" y="489.0" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="526.0" font-size="26" font-weight="700" fill="#fff">第46讲-摄缘-十二</text>
<text x="48.0" y="561.1" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘46-</text>
<text x="48.0" y="596.2" font-size="26" font-weight="700" fill="#fff">释二十四缘-异熟缘</text>
<rect x="337.7" y="40.8" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="70.8" font-size="19" font-weight="700" fill="#2b2a27">一、经文与释义</text>
<line x1="552.7" y1="57.6" x2="654.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）缘广释</text>
<line x1="700.7" y1="54.9" x2="897.6" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="703.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">14.异熟缘(vipāka-paccaya)</text>
<line x1="552.7" y1="97.2" x2="702.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）异熟缘的譬喻</text>
<rect x="337.7" y="220.3" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="250.3" font-size="19" font-weight="700" fill="#2b2a27">二、经文详释</text>
<line x1="533.7" y1="136.8" x2="749.6" y2="136.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">(一)果报名法互以异熟缘为缘</text>
<line x1="533.7" y1="198.0" x2="797.6" y2="198.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">(二)结生名聚对俱生心处以异熟缘为</text>
<text x="536.7" y="189.4" font-size="16" font-weight="500" fill="#2b2a27">缘</text>
<line x1="533.7" y1="259.2" x2="797.6" y2="259.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="229.0" font-size="16" font-weight="500" fill="#2b2a27">(三)果报名聚对俱生色法以异熟缘为</text>
<text x="536.7" y="250.6" font-size="16" font-weight="500" fill="#2b2a27">缘</text>
<line x1="533.7" y1="320.4" x2="811.7" y2="320.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="290.2" font-size="16" font-weight="500" fill="#2b2a27">（四）异熟缘的缘法、缘所生法及所摄</text>
<text x="536.7" y="311.8" font-size="16" font-weight="500" fill="#2b2a27">诸缘</text>
<line x1="533.7" y1="377.1" x2="683.7" y2="377.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="368.5" font-size="16" font-weight="500" fill="#2b2a27">（五）业缘与异熟缘</text>
<line x1="729.7" y1="357.3" x2="835.4" y2="357.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="349.4" font-size="14" font-weight="400" fill="#2b2a27">1.业有四种时段</text>
<line x1="729.7" y1="394.2" x2="975.4" y2="394.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="386.3" font-size="14" font-weight="400" fill="#2b2a27">2.异刹那业缘与异熟缘缘所生法的区别</text>
<rect x="337.7" y="417.0" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="447.0" font-size="19" font-weight="700" fill="#2b2a27">三、异熟缘的作用</text>
<line x1="571.7" y1="433.8" x2="753.7" y2="433.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="425.2" font-size="16" font-weight="500" fill="#2b2a27">（一）平静安稳的果报法</text>
<line x1="571.7" y1="473.4" x2="769.7" y2="473.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="464.8" font-size="16" font-weight="500" fill="#2b2a27">（二）承受身苦，不生心苦</text>
<rect x="337.7" y="644.4" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="674.4" font-size="19" font-weight="700" fill="#2b2a27">四、果报名法的分类</text>
<line x1="590.7" y1="513.0" x2="694.6" y2="513.0" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="504.4" font-size="16" font-weight="500" fill="#2b2a27">(一)按种类分</text>
<line x1="590.7" y1="625.1" x2="694.6" y2="625.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="616.5" font-size="16" font-weight="500" fill="#2b2a27">(二)按作用分</text>
<line x1="740.6" y1="549.9" x2="790.3" y2="549.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="743.6" y="542.0" font-size="14" font-weight="400" fill="#2b2a27">1.结生</text>
<line x1="740.6" y1="586.8" x2="790.3" y2="586.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="743.6" y="578.9" font-size="14" font-weight="400" fill="#2b2a27">2.有分</text>
<line x1="740.6" y1="623.7" x2="790.3" y2="623.7" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="743.6" y="615.8" font-size="14" font-weight="400" fill="#2b2a27">3.死亡</text>
<line x1="740.6" y1="660.6" x2="804.3" y2="660.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="743.6" y="652.7" font-size="14" font-weight="400" fill="#2b2a27">4.彼所缘</text>
<line x1="740.6" y1="697.5" x2="798.1" y2="697.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="743.6" y="689.6" font-size="14" font-weight="400" fill="#2b2a27">12.速行</text>
<line x1="590.7" y1="737.1" x2="742.6" y2="737.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="728.5" font-size="16" font-weight="500" fill="#2b2a27">(三)按名法的数量分</text>
<line x1="590.7" y1="849.1" x2="694.6" y2="849.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="840.5" font-size="16" font-weight="500" fill="#2b2a27">(四)按劣胜分</text>
<line x1="740.6" y1="774.0" x2="832.3" y2="774.0" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="743.6" y="766.1" font-size="14" font-weight="400" fill="#2b2a27">1.不善果报心</text>
<line x1="740.6" y1="810.9" x2="846.3" y2="810.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="743.6" y="803.0" font-size="14" font-weight="400" fill="#2b2a27">2.善果报无因心</text>
<line x1="740.6" y1="847.8" x2="874.3" y2="847.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="743.6" y="839.9" font-size="14" font-weight="400" fill="#2b2a27">3.八种欲界大果报心</text>
<line x1="740.6" y1="884.7" x2="860.3" y2="884.7" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="743.6" y="876.8" font-size="14" font-weight="400" fill="#2b2a27">4.九种广大果报心</text>
<line x1="740.6" y1="921.6" x2="874.3" y2="921.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="743.6" y="913.7" font-size="14" font-weight="400" fill="#2b2a27">5.四种出世间果报心</text>
<rect x="337.7" y="933.6" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="963.6" font-size="19" font-weight="700" fill="#2b2a27">五、造业如描画来生，画作是异</text>
<text x="355.7" y="989.2" font-size="19" font-weight="700" fill="#2b2a27">时果报</text>
<rect x="337.7" y="1016.9" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="355.7" y="1046.9" font-size="19" font-weight="700" fill="#2b2a27">六、业的无效与不再受报</text>
