<text x="536.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（一）缘法、缘所生法及所摄诸缘</text>
<line x1="533.7" y1="211.9" x2="811.7" y2="211.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="203.3" font-size="16" font-weight="500" fill="#2b2a27">（二）一因、二因、三因及四因生色身</text>
<line x1="857.7" y1="173.7" x2="949.4" y2="173.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="860.7" y="165.8" font-size="14" font-weight="400" fill="#2b2a27">2.二因生色身</text>
<line x1="857.7" y1="210.6" x2="949.4" y2="210.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="860.7" y="202.7" font-size="14" font-weight="400" fill="#2b2a27">3.三因生色身</text>
<line x1="857.7" y1="247.5" x2="949.4" y2="247.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="860.7" y="239.6" font-size="14" font-weight="400" fill="#2b2a27">4.四因生色身</text>
<line x1="533.7" y1="351.0" x2="811.7" y2="351.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="342.4" font-size="16" font-weight="500" fill="#2b2a27">（三）一因、二因、三因及四因生色法</text>
<line x1="857.7" y1="303.3" x2="1117.4" y2="303.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="860.7" y="276.5" font-size="14" font-weight="400" fill="#2b2a27">2.二因生色法：包含声音的色聚是由心或</text>
<text x="860.7" y="295.4" font-size="14" font-weight="400" fill="#2b2a27">时节所引发的(说话的</text>
<line x1="857.7" y1="359.1" x2="1117.4" y2="359.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="860.7" y="332.3" font-size="14" font-weight="400" fill="#2b2a27">3.三因生色法：身体的轻快性、柔软性、</text>
<text x="860.7" y="351.2" font-size="14" font-weight="400" fill="#2b2a27">适业性是由好的时节、</text>
<line x1="857.7" y1="414.9" x2="1119.0" y2="414.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="860.7" y="388.1" font-size="14" font-weight="400" fill="#2b2a27">4.四因生色法：八不离色 （地、水、 火</text>
<text x="860.7" y="407.0" font-size="14" font-weight="400" fill="#2b2a27">、 风、 色、香、味、食素）</text>
