<text x="929.7" y="520.4" font-size="14" font-weight="400" fill="#2b2a27">2. 临死时</text>
<rect x="337.7" y="540.3" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="570.3" font-size="19" font-weight="700" fill="#2b2a27">四、生活中后生缘的譬喻</text>
<rect x="337.7" y="598.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="628.0" font-size="19" font-weight="700" fill="#2b2a27">五、从后生缘中得到的启发和借</text>
<text x="355.7" y="653.6" font-size="19" font-weight="700" fill="#2b2a27">鉴</text>
