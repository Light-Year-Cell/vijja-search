<text x="838.3" y="362.8" font-size="13" font-weight="400" fill="#2b2a27">(2)命根九法聚作为消化之火维持生命体征</text>
<text x="838.3" y="380.4" font-size="13" font-weight="400" fill="#2b2a27">的存在。活着的身体</text>
