<rect x="30" y="866.7" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="903.7" font-size="26" font-weight="700" fill="#fff">第55讲-摄缘-十二</text>
<text x="48.0" y="938.8" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘55-</text>
<text x="48.0" y="973.9" font-size="26" font-weight="700" fill="#fff">释二十四缘-道缘3</text>
<rect x="337.7" y="701.1" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="731.1" font-size="19" font-weight="700" fill="#2b2a27">三、道缘的应用</text>
<line x1="552.7" y1="455.2" x2="718.7" y2="455.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="446.6" font-size="16" font-weight="500" fill="#2b2a27">（三）走在十善业道上</text>
<line x1="764.7" y1="72.0" x2="856.4" y2="72.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="64.1" font-size="14" font-weight="400" fill="#2b2a27">1.十不善业道</text>
<line x1="902.4" y1="53.5" x2="1019.6" y2="53.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="905.4" y="46.0" font-size="13" font-weight="400" fill="#2b2a27">（1）三种身不善业</text>
<line x1="902.4" y1="89.1" x2="1032.6" y2="89.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="905.4" y="81.5" font-size="13" font-weight="400" fill="#2b2a27">（2）四种语不善业道</text>
<line x1="764.7" y1="126.0" x2="842.4" y2="126.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="118.1" font-size="14" font-weight="400" fill="#2b2a27">1.二人团结</text>
<line x1="764.7" y1="162.9" x2="884.4" y2="162.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="155.0" font-size="14" font-weight="400" fill="#2b2a27">2.意图离间这两人</text>
<line x1="764.7" y1="199.8" x2="814.4" y2="199.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="191.9" font-size="14" font-weight="400" fill="#2b2a27">3.行动</text>
<line x1="764.7" y1="236.7" x2="842.4" y2="236.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="228.8" font-size="14" font-weight="400" fill="#2b2a27">4.听者明白</text>
<line x1="764.7" y1="273.6" x2="870.4" y2="273.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="265.7" font-size="14" font-weight="400" fill="#2b2a27">5.两人关系破裂</text>
<line x1="764.7" y1="310.5" x2="898.4" y2="310.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="302.6" font-size="14" font-weight="400" fill="#2b2a27">1.被辱骂的对象是人</text>
<line x1="764.7" y1="347.4" x2="898.4" y2="347.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="339.5" font-size="14" font-weight="400" fill="#2b2a27">2.骂人者有生气的心</text>
<line x1="764.7" y1="463.5" x2="884.4" y2="463.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="455.6" font-size="14" font-weight="400" fill="#2b2a27">3.有粗恶语的行动</text>
<line x1="930.4" y1="382.9" x2="1060.6" y2="382.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="933.4" y="375.4" font-size="13" font-weight="400" fill="#2b2a27">（3）三种意不善业道</text>
<line x1="930.4" y1="418.5" x2="1034.6" y2="418.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="933.4" y="410.9" font-size="13" font-weight="400" fill="#2b2a27">（4）足道不善业</text>
<line x1="930.4" y1="471.6" x2="1178.7" y2="471.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="933.4" y="446.5" font-size="13" font-weight="400" fill="#2b2a27">(2)无因见(ahetuka-diṭṭhi)：否定果报</text>
<text x="933.4" y="464.1" font-size="13" font-weight="400" fill="#2b2a27">有因</text>
<line x1="930.4" y1="507.2" x2="1047.6" y2="507.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="933.4" y="499.6" font-size="13" font-weight="400" fill="#2b2a27">（5）不善业的果报</text>
<line x1="930.4" y1="542.7" x2="1021.6" y2="542.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="933.4" y="535.1" font-size="13" font-weight="400" fill="#2b2a27">（6）五种邪命</text>
<line x1="764.7" y1="579.6" x2="912.4" y2="579.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="571.7" font-size="14" font-weight="400" fill="#2b2a27">1.买卖兵器等军火行业</text>
<line x1="764.7" y1="616.5" x2="962.2" y2="616.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="608.6" font-size="14" font-weight="400" fill="#2b2a27">2.买卖有情（特指贩卖人口） </text>
<line x1="764.7" y1="672.3" x2="1032.2" y2="672.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="645.5" font-size="14" font-weight="400" fill="#2b2a27">3.买卖肉 （涉及直接屠杀或联系了屠宰场</text>
<text x="767.7" y="664.4" font-size="14" font-weight="400" fill="#2b2a27">， 其他不算） 例如开餐</text>
<line x1="764.7" y1="709.2" x2="934.2" y2="709.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="701.3" font-size="14" font-weight="400" fill="#2b2a27">4.买卖酒（包含麻醉品） </text>
<line x1="764.7" y1="746.1" x2="948.2" y2="746.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="738.2" font-size="14" font-weight="400" fill="#2b2a27">5.买卖毒药（包括杀虫剂） </text>
<line x1="764.7" y1="835.6" x2="842.4" y2="835.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="767.7" y="827.7" font-size="14" font-weight="400" fill="#2b2a27">2.十善业道</text>
<line x1="888.4" y1="781.6" x2="1005.6" y2="781.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="891.4" y="774.1" font-size="13" font-weight="400" fill="#2b2a27">（1）三种身善业道</text>
<line x1="888.4" y1="817.2" x2="1005.6" y2="817.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="891.4" y="809.6" font-size="13" font-weight="400" fill="#2b2a27">（2）四种语善业道</text>
<line x1="888.4" y1="852.7" x2="1005.6" y2="852.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="891.4" y="845.2" font-size="13" font-weight="400" fill="#2b2a27">（3）三种意善业道</text>
<line x1="888.4" y1="888.3" x2="992.6" y2="888.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="891.4" y="880.7" font-size="13" font-weight="400" fill="#2b2a27">（4）善业的果报</text>
<line x1="552.7" y1="949.5" x2="825.6" y2="949.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="919.3" font-size="16" font-weight="500" fill="#2b2a27">(四) 去除邪精进、邪定，建立正精进</text>
<text x="555.7" y="940.9" font-size="16" font-weight="500" fill="#2b2a27">、正定</text>
<line x1="552.7" y1="1020.4" x2="750.7" y2="1020.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="1011.8" font-size="16" font-weight="500" fill="#2b2a27">（五）去除邪念，建立正念</text>
<line x1="796.7" y1="1005.3" x2="1056.4" y2="1005.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="799.7" y="978.5" font-size="14" font-weight="400" fill="#2b2a27">2.念的住立、确立、建立、安住、依止、</text>
<text x="799.7" y="997.4" font-size="14" font-weight="400" fill="#2b2a27">支持之处为念处。如</text>
<line x1="796.7" y1="1042.2" x2="972.4" y2="1042.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="799.7" y="1034.3" font-size="14" font-weight="400" fill="#2b2a27">3.念的现起处为念处。如说</text>
<rect x="337.7" y="1054.2" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="1084.2" font-size="19" font-weight="700" fill="#2b2a27">二、受念处</text>
<rect x="337.7" y="1111.8" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="1141.8" font-size="19" font-weight="700" fill="#2b2a27">三、心念处</text>
<line x1="514.7" y1="1139.4" x2="744.7" y2="1139.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="1130.8" font-size="16" font-weight="500" fill="#2b2a27">（六）正见为先导，直至正解脱</text>
</svg>