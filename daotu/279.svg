<text x="48.0" y="414.4" font-size="26" font-weight="700" fill="#fff">第83讲-摄缘-十二</text>
<text x="48.0" y="449.5" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘83-</text>
<text x="48.0" y="484.6" font-size="26" font-weight="700" fill="#fff">十二缘起的杂论3</text>
<rect x="337.7" y="417.2" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="447.2" font-size="19" font-weight="700" fill="#2b2a27">三、缘起的决定说</text>
<line x1="571.7" y1="213.3" x2="721.7" y2="213.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="204.7" font-size="16" font-weight="500" fill="#2b2a27">（五）以甚深的差别</text>
<line x1="767.7" y1="54.9" x2="837.5" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1、义甚深</text>
<line x1="767.7" y1="91.8" x2="837.5" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2、法甚深</text>
<line x1="767.7" y1="128.7" x2="851.5" y2="128.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="120.8" font-size="14" font-weight="400" fill="#2b2a27">3、说法甚深</text>
<line x1="767.7" y1="165.6" x2="851.5" y2="165.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="157.7" font-size="14" font-weight="400" fill="#2b2a27">4、通达甚深</text>
<line x1="767.7" y1="202.5" x2="837.5" y2="202.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="194.6" font-size="14" font-weight="400" fill="#2b2a27">1、义甚深</text>
<line x1="767.7" y1="239.4" x2="837.5" y2="239.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="231.5" font-size="14" font-weight="400" fill="#2b2a27">2、法甚深</text>
<line x1="767.7" y1="276.3" x2="851.5" y2="276.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="268.4" font-size="14" font-weight="400" fill="#2b2a27">3、说法甚深</text>
<line x1="767.7" y1="332.1" x2="1027.4" y2="332.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="305.3" font-size="14" font-weight="400" fill="#2b2a27">2.受缘爱，现在果「受」与现在因「爱」</text>
<text x="770.7" y="324.2" font-size="14" font-weight="400" fill="#2b2a27">的果因连结；3.有（业有）</text>
<line x1="767.7" y1="369.0" x2="851.5" y2="369.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="361.1" font-size="14" font-weight="400" fill="#2b2a27">4、通达甚深</text>
<line x1="571.7" y1="694.4" x2="721.7" y2="694.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="685.8" font-size="16" font-weight="500" fill="#2b2a27">（六）以理法的差别</text>
<line x1="767.7" y1="405.9" x2="851.5" y2="405.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="398.0" font-size="14" font-weight="400" fill="#2b2a27">1、同一性理</text>
<line x1="767.7" y1="442.8" x2="851.5" y2="442.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="434.9" font-size="14" font-weight="400" fill="#2b2a27">2、不同性理</text>
<line x1="767.7" y1="479.7" x2="851.5" y2="479.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="471.8" font-size="14" font-weight="400" fill="#2b2a27">3、不造作理</text>
<line x1="767.7" y1="516.6" x2="865.5" y2="516.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="508.7" font-size="14" font-weight="400" fill="#2b2a27">4、如是法性理</text>
<line x1="767.7" y1="553.5" x2="851.5" y2="553.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="545.6" font-size="14" font-weight="400" fill="#2b2a27">1、同一性理</text>
<line x1="767.7" y1="590.4" x2="937.2" y2="590.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="582.5" font-size="14" font-weight="400" fill="#2b2a27">1. 累积过去因的过去名色</text>
<line x1="767.7" y1="646.2" x2="1035.2" y2="646.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="619.4" font-size="14" font-weight="400" fill="#2b2a27">2. 从今世结生时开始，至现今正在修观禅</text>
<text x="770.7" y="638.3" font-size="14" font-weight="400" fill="#2b2a27">或缘起时，期间所生</text>
<line x1="767.7" y1="702.0" x2="1035.2" y2="702.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="675.2" font-size="14" font-weight="400" fill="#2b2a27">3. 若还不能在今世证悟阿罗汉果，就会有</text>
<text x="770.7" y="694.1" font-size="14" font-weight="400" fill="#2b2a27">未来世，就会有将从</text>
<line x1="767.7" y1="738.9" x2="921.5" y2="738.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="731.0" font-size="14" font-weight="400" fill="#2b2a27">2、不同性理（异性理）</text>
<line x1="767.7" y1="794.7" x2="1027.4" y2="794.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="767.9" font-size="14" font-weight="400" fill="#2b2a27">1.若能区别地知见它们为个别的心识剎那</text>
<text x="770.7" y="786.8" font-size="14" font-weight="400" fill="#2b2a27">与个别的色聚</text>
<line x1="767.7" y1="850.5" x2="1027.4" y2="850.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="823.7" font-size="14" font-weight="400" fill="#2b2a27">2.在以智破除在一个心识剎那里生起的色</text>
<text x="770.7" y="842.6" font-size="14" font-weight="400" fill="#2b2a27">聚与名聚的密集之后</text>
<line x1="767.7" y1="906.3" x2="1035.2" y2="906.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="879.5" font-size="14" font-weight="400" fill="#2b2a27">3.(如前所述，诸缘起支是不能够单独生起</text>
<text x="770.7" y="898.4" font-size="14" font-weight="400" fill="#2b2a27">的，它们自然地只生</text>
<line x1="767.7" y1="943.2" x2="851.5" y2="943.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="935.3" font-size="14" font-weight="400" fill="#2b2a27">3、不造作理</text>
<line x1="767.7" y1="980.1" x2="865.5" y2="980.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="972.2" font-size="14" font-weight="400" fill="#2b2a27">4、如是法性理</text>
