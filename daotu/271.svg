<rect x="30" y="292.5" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="329.5" font-size="26" font-weight="700" fill="#fff">第75讲-摄缘-十二</text>
<text x="48.0" y="364.6" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘75-</text>
<text x="48.0" y="399.7" font-size="26" font-weight="700" fill="#fff">离路心的缘-名色缘</text>
<text x="48.0" y="434.8" font-size="26" font-weight="700" fill="#fff">六处</text>
<rect x="337.7" y="30.0" width="287.6" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">4.由于色生起，意处生起；5.</text>
<text x="355.7" y="85.7" font-size="19" font-weight="700" fill="#2b2a27">由于名色生起，意处生起</text>
<rect x="337.7" y="225.8" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="255.8" font-size="19" font-weight="700" fill="#2b2a27">一、名缘</text>
<line x1="495.7" y1="140.9" x2="693.7" y2="140.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="132.3" font-size="16" font-weight="500" fill="#2b2a27">（一）无色有的结生和转起</text>
<line x1="495.7" y1="383.9" x2="693.7" y2="383.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="375.3" font-size="16" font-weight="500" fill="#2b2a27">（二）五蕴有的结生和转起</text>
<line x1="739.7" y1="196.7" x2="1001.0" y2="196.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="169.9" font-size="14" font-weight="400" fill="#2b2a27">1.由于有分波动名法生起， 眼处生起； </text>
<text x="742.7" y="188.8" font-size="14" font-weight="400" fill="#2b2a27">有分波动名法是因； 眼处</text>
<line x1="739.7" y1="252.5" x2="999.4" y2="252.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="225.7" font-size="14" font-weight="400" fill="#2b2a27">3.由于五门转向名法生起，眼处生起；五</text>
<text x="742.7" y="244.6" font-size="14" font-weight="400" fill="#2b2a27">门转向名法是因，眼</text>
<line x1="739.7" y1="308.3" x2="999.4" y2="308.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="281.5" font-size="14" font-weight="400" fill="#2b2a27">4.由于眼识名法生起，眼处生起；眼识名</text>
<text x="742.7" y="300.4" font-size="14" font-weight="400" fill="#2b2a27">法是因，眼处是果</text>
<line x1="739.7" y1="364.1" x2="999.4" y2="364.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="337.3" font-size="14" font-weight="400" fill="#2b2a27">5.由于领受名法生起，眼处生起；领受名</text>
<text x="742.7" y="356.2" font-size="14" font-weight="400" fill="#2b2a27">法是因，眼处是果</text>
<line x1="739.7" y1="419.9" x2="999.4" y2="419.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="393.1" font-size="14" font-weight="400" fill="#2b2a27">6.由于推度名法生起，眼处生起；推度名</text>
<text x="742.7" y="412.0" font-size="14" font-weight="400" fill="#2b2a27">法是因，眼处是果</text>
<line x1="739.7" y1="475.7" x2="999.4" y2="475.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="448.9" font-size="14" font-weight="400" fill="#2b2a27">7.由于确定名法生起，眼处生起；确定名</text>
<text x="742.7" y="467.8" font-size="14" font-weight="400" fill="#2b2a27">法是因，眼处是果</text>
<line x1="739.7" y1="531.5" x2="1001.0" y2="531.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="504.7" font-size="14" font-weight="400" fill="#2b2a27">8.由于第一速行名法生起， 眼处生起； </text>
<text x="742.7" y="523.6" font-size="14" font-weight="400" fill="#2b2a27">第一速行名法是因， 眼处</text>
<line x1="739.7" y1="587.3" x2="1001.0" y2="587.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="560.5" font-size="14" font-weight="400" fill="#2b2a27">9.由于第二速行名法生起， 眼处生起； </text>
<text x="742.7" y="579.4" font-size="14" font-weight="400" fill="#2b2a27">第二速行名法是因， 眼处</text>
<rect x="337.7" y="599.3" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="629.3" font-size="19" font-weight="700" fill="#2b2a27">二、色缘</text>
<rect x="337.7" y="656.9" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="686.9" font-size="19" font-weight="700" fill="#2b2a27">三、名色缘</text>
