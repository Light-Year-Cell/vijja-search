<rect x="30" y="353.7" width="267.9" height="92.2" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="390.7" font-size="26" font-weight="700" fill="#fff">186讲-摄集34-摄菩</text>
<text x="48.0" y="425.8" font-size="26" font-weight="700" fill="#fff">提分-心念处</text>
<rect x="343.9" y="185.2" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="215.2" font-size="19" font-weight="700" fill="#2b2a27">一、十六种心的分类</text>
<line x1="596.9" y1="74.7" x2="762.9" y2="74.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="66.1" font-size="16" font-weight="500" fill="#2b2a27">（一）有贪心、无贪心</text>
<line x1="808.9" y1="54.9" x2="950.4" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="811.9" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1. 心的两种理解方式</text>
<line x1="808.9" y1="91.8" x2="894.4" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="811.9" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2. 何为邪见</text>
<line x1="596.9" y1="131.4" x2="762.9" y2="131.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="122.8" font-size="16" font-weight="500" fill="#2b2a27">（二）有瞋心、离瞋心</text>
<line x1="596.9" y1="171.0" x2="762.9" y2="171.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="162.4" font-size="16" font-weight="500" fill="#2b2a27">（三）有痴心、离痴心</text>
<line x1="596.9" y1="210.6" x2="762.9" y2="210.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="202.0" font-size="16" font-weight="500" fill="#2b2a27">（四）昏昧心、散乱心</text>
<line x1="596.9" y1="250.2" x2="778.9" y2="250.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="241.6" font-size="16" font-weight="500" fill="#2b2a27">（五）广大心与不广大心</text>
<line x1="596.9" y1="289.8" x2="762.9" y2="289.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="281.2" font-size="16" font-weight="500" fill="#2b2a27">（六）有上心与无上心</text>
<line x1="596.9" y1="329.4" x2="778.9" y2="329.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="320.8" font-size="16" font-weight="500" fill="#2b2a27">（七）得定心与不得定心</text>
<line x1="596.9" y1="369.0" x2="778.9" y2="369.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="360.4" font-size="16" font-weight="500" fill="#2b2a27">（八）解脱心与未解脱心</text>
<rect x="343.9" y="381.0" width="283.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="411.0" font-size="19" font-weight="700" fill="#2b2a27">二、依心路过程观照心和心所</text>
<rect x="343.9" y="438.7" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="468.7" font-size="19" font-weight="700" fill="#2b2a27">三、更高阶段的观智</text>
<rect x="343.9" y="496.3" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="526.3" font-size="19" font-weight="700" fill="#2b2a27">四、直接修行心念处的特例</text>
<rect x="343.9" y="554.0" width="293.6" height="73.3" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="584.0" font-size="19" font-weight="700" fill="#2b2a27">五、无观智时日常生活中的“心</text>
<text x="361.9" y="609.6" font-size="19" font-weight="700" fill="#2b2a27">念处”</text>
</svg>