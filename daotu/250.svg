<rect x="30" y="88.5" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="125.5" font-size="26" font-weight="700" fill="#fff">第54讲-摄缘-十二</text>
<text x="48.0" y="160.6" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘54-</text>
<text x="48.0" y="195.7" font-size="26" font-weight="700" fill="#fff">释二十四缘-道缘2</text>
<rect x="337.7" y="128.3" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="158.3" font-size="19" font-weight="700" fill="#2b2a27">三、道缘的应用</text>
<line x1="552.7" y1="95.4" x2="793.6" y2="95.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="86.8" font-size="16" font-weight="500" fill="#2b2a27">(一) 断邪见立正见，直至正解脱</text>
<line x1="839.6" y1="63.0" x2="1043.2" y2="63.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.6" y="55.1" font-size="14" font-weight="400" fill="#2b2a27">4.为免错误行道，须以正见先导</text>
<line x1="1089.2" y1="71.1" x2="1338.1" y2="71.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1092.2" y="46.0" font-size="13" font-weight="400" fill="#2b2a27">（2）去除邪见的第一步——学习教理，树立</text>
<text x="1092.2" y="63.5" font-size="13" font-weight="400" fill="#2b2a27">正见</text>
<line x1="839.6" y1="125.1" x2="987.2" y2="125.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.6" y="117.2" font-size="14" font-weight="400" fill="#2b2a27">5.舍断邪见，具足正见</text>
<line x1="1033.2" y1="106.6" x2="1228.5" y2="106.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1036.2" y="99.1" font-size="13" font-weight="400" fill="#2b2a27">（1）勤修三学，镇伏、断除邪见</text>
<line x1="1033.2" y1="142.2" x2="1137.5" y2="142.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1036.2" y="134.6" font-size="13" font-weight="400" fill="#2b2a27">（2）雷迪西亚多</text>
<line x1="552.7" y1="234.4" x2="782.7" y2="234.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="225.8" font-size="16" font-weight="500" fill="#2b2a27">（二）去除邪思惟，建立正思惟</text>
<line x1="828.7" y1="179.1" x2="962.4" y2="179.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="831.7" y="171.2" font-size="14" font-weight="400" fill="#2b2a27">1.欲思惟与出离思惟</text>
<line x1="1008.4" y1="177.8" x2="1244.7" y2="177.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1011.4" y="170.2" font-size="13" font-weight="400" fill="#2b2a27">(2)禅那；(3)观智；(4)道智；(5)果智</text>
<line x1="828.7" y1="233.1" x2="1088.4" y2="233.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="831.7" y="225.2" font-size="14" font-weight="400" fill="#2b2a27">2.嗔思惟、害思惟与无嗔思惟、无害思惟</text>
<line x1="1134.4" y1="214.7" x2="1303.6" y2="214.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1137.4" y="207.1" font-size="13" font-weight="400" fill="#2b2a27">（1）恼害他人与无嗔、无害</text>
<line x1="1134.4" y1="250.2" x2="1238.6" y2="250.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1137.4" y="242.6" font-size="13" font-weight="400" fill="#2b2a27">（2）仇恨与宽恕</text>
<line x1="828.7" y1="287.1" x2="976.4" y2="287.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="831.7" y="279.2" font-size="14" font-weight="400" fill="#2b2a27">3.修正错误的思维定势</text>
</svg>