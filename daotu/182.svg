<path d="M297.9,1030.0 C320.9,1030.0 320.9,1993.3 343.9,1993.3" fill="none" stroke="#2f86c4" stroke-width="3" opacity=".8"/>
<path d="M493.9,167.7 C516.9,167.7 516.9,140.9 539.9,140.9" fill="none" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<path d="M493.9,167.7 C516.9,167.7 516.9,180.5 539.9,180.5" fill="none" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
