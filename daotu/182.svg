<path d="M645.9,1659.7 C668.9,1659.7 668.9,1713.9 691.9,1713.9" fill="none" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<path d="M645.9,1993.3 C668.9,1993.3 668.9,1971.4 691.9,1971.4" fill="none" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<rect x="30" y="966.3" width="267.9" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="1003.3" font-size="26" font-weight="700" fill="#fff">182讲-摄集30-摄菩</text>
<text x="48.0" y="1038.4" font-size="26" font-weight="700" fill="#fff">提分-身念处-可厌</text>
<text x="48.0" y="1073.5" font-size="26" font-weight="700" fill="#fff">作意</text>
<rect x="343.9" y="30.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、整理日常的人事物对境，在</text>
<text x="361.9" y="85.7" font-size="19" font-weight="700" fill="#2b2a27">日常中落地对正知的运用</text>
<rect x="343.9" y="143.9" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="173.9" font-size="19" font-weight="700" fill="#2b2a27">二、可厌作意</text>
<line x1="539.9" y1="140.9" x2="785.9" y2="140.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="132.3" font-size="16" font-weight="500" fill="#2b2a27">（一）可厌作意主要指三十二身分</text>
<line x1="539.9" y1="180.5" x2="801.9" y2="180.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="171.9" font-size="16" font-weight="500" fill="#2b2a27">（二）修习三十二身分可获六种利益</text>
<line x1="539.9" y1="220.1" x2="737.9" y2="220.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="211.5" font-size="16" font-weight="500" fill="#2b2a27">（三）七种善巧的学习方法</text>
<rect x="343.9" y="232.1" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="262.1" font-size="19" font-weight="700" fill="#2b2a27">一、反复地念诵三十二身分（的</text>
<text x="361.9" y="287.8" font-size="19" font-weight="700" fill="#2b2a27">名称） 。在禅林于早课时用巴</text>
<text x="361.9" y="313.4" font-size="19" font-weight="700" fill="#2b2a27">利念诵</text>
<rect x="343.9" y="341.1" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="371.1" font-size="19" font-weight="700" fill="#2b2a27">二、反复地记忆三十二身分。反</text>
<text x="361.9" y="396.7" font-size="19" font-weight="700" fill="#2b2a27">复地记忆三十二身分是什么意思</text>
<text x="361.9" y="422.4" font-size="19" font-weight="700" fill="#2b2a27">呢？</text>
<rect x="343.9" y="450.0" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="480.0" font-size="19" font-weight="700" fill="#2b2a27">三、依照颜色来确定各个身分。</text>
<text x="361.9" y="505.6" font-size="19" font-weight="700" fill="#2b2a27">最好能够看到一些真实的身分的</text>
<text x="361.9" y="531.3" font-size="19" font-weight="700" fill="#2b2a27">颜色</text>
<rect x="343.9" y="559.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="589.0" font-size="19" font-weight="700" fill="#2b2a27">四、依照相应的形状来确定各身</text>
<text x="361.9" y="614.6" font-size="19" font-weight="700" fill="#2b2a27">分。就是每个身分长什么样子</text>
<rect x="343.9" y="642.2" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="361.9" y="672.2" font-size="19" font-weight="700" fill="#2b2a27">五、依照其位置在肚脐的上方或</text>
<text x="361.9" y="697.9" font-size="19" font-weight="700" fill="#2b2a27">下方来确定各个身分。就是它大</text>
<text x="361.9" y="723.5" font-size="19" font-weight="700" fill="#2b2a27">概在</text>
<rect x="343.9" y="751.2" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#8a6d3b" stroke-width="2.2"/>
<text x="361.9" y="781.2" font-size="19" font-weight="700" fill="#2b2a27">六、依照所占有的部位来确定各</text>
<text x="361.9" y="806.9" font-size="19" font-weight="700" fill="#2b2a27">身分。刚才是位置，现在是部位</text>
<text x="361.9" y="832.5" font-size="19" font-weight="700" fill="#2b2a27">的大</text>
<rect x="343.9" y="860.2" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="890.2" font-size="19" font-weight="700" fill="#2b2a27">七、依照与其他部分划分的界限</text>
<text x="361.9" y="915.8" font-size="19" font-weight="700" fill="#2b2a27">来确定各身分</text>
<line x1="691.9" y1="887.8" x2="889.9" y2="887.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="879.2" font-size="16" font-weight="500" fill="#2b2a27">（四）十种善巧的修行方法</text>
<rect x="343.9" y="943.5" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="973.5" font-size="19" font-weight="700" fill="#2b2a27">一、次第地观照。次第观照就是</text>
<text x="361.9" y="999.1" font-size="19" font-weight="700" fill="#2b2a27">按照佛陀教导的方式来观照，头</text>
<text x="361.9" y="1024.8" font-size="19" font-weight="700" fill="#2b2a27">发、</text>
<rect x="343.9" y="1052.4" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="1082.4" font-size="19" font-weight="700" fill="#2b2a27">二、不要观照得太快</text>
<rect x="343.9" y="1110.1" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="1140.1" font-size="19" font-weight="700" fill="#2b2a27">三、不要观照得太慢</text>
<rect x="343.9" y="1167.7" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="1197.7" font-size="19" font-weight="700" fill="#2b2a27">四、排除散乱。也就是说在观察</text>
<text x="361.9" y="1223.4" font-size="19" font-weight="700" fill="#2b2a27">时，不要有意识地在每一个身分</text>
<text x="361.9" y="1249.0" font-size="19" font-weight="700" fill="#2b2a27">上去</text>
<rect x="343.9" y="1276.7" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="1306.7" font-size="19" font-weight="700" fill="#2b2a27">五、超越概念。当你如实地看到</text>
<text x="361.9" y="1332.3" font-size="19" font-weight="700" fill="#2b2a27">一个身分，比如看到真实的解剖</text>
<text x="361.9" y="1358.0" font-size="19" font-weight="700" fill="#2b2a27">视频</text>
<rect x="343.9" y="1385.6" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="361.9" y="1415.6" font-size="19" font-weight="700" fill="#2b2a27">六、逐渐去除不清晰的身分。有</text>
<text x="361.9" y="1441.3" font-size="19" font-weight="700" fill="#2b2a27">些人理解为“那个身分我看不清</text>
<text x="361.9" y="1466.9" font-size="19" font-weight="700" fill="#2b2a27">楚</text>
<rect x="343.9" y="1494.6" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#8a6d3b" stroke-width="2.2"/>
<text x="361.9" y="1524.6" font-size="19" font-weight="700" fill="#2b2a27">七、观照能导致安止的身分。次</text>
<text x="361.9" y="1550.2" font-size="19" font-weight="700" fill="#2b2a27">第地观察下来，有些人发现，停</text>
<text x="361.9" y="1575.9" font-size="19" font-weight="700" fill="#2b2a27">在某</text>
<rect x="343.9" y="1610.2" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="1640.2" font-size="19" font-weight="700" fill="#2b2a27">八、九、十、依照《增上心经》</text>
<text x="361.9" y="1665.9" font-size="19" font-weight="700" fill="#2b2a27">、《清凉经》与《觉支善巧经》</text>
<text x="361.9" y="1691.5" font-size="19" font-weight="700" fill="#2b2a27">的教导</text>
<line x1="691.9" y1="1652.7" x2="969.9" y2="1652.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="1622.5" font-size="16" font-weight="500" fill="#2b2a27">（五）佛陀教导禅修者要清楚地看到三</text>
<text x="694.9" y="1644.1" font-size="16" font-weight="500" fill="#2b2a27">十二身分</text>
<line x1="691.9" y1="1713.9" x2="969.9" y2="1713.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="1683.7" font-size="16" font-weight="500" fill="#2b2a27">（六）清楚地看到三十二身分后，以三</text>
<text x="694.9" y="1705.3" font-size="16" font-weight="500" fill="#2b2a27">种方法继续修习</text>
<rect x="343.9" y="1725.9" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="1755.9" font-size="19" font-weight="700" fill="#2b2a27">一、色遍。可以通过三十二身分</text>
<text x="361.9" y="1781.6" font-size="19" font-weight="700" fill="#2b2a27">来修习色遍。什么意思呢？现在</text>
<text x="361.9" y="1807.2" font-size="19" font-weight="700" fill="#2b2a27">修遍</text>
<rect x="343.9" y="1834.9" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="1864.9" font-size="19" font-weight="700" fill="#2b2a27">二、可厌作意，修不净的方法。</text>
<text x="361.9" y="1890.5" font-size="19" font-weight="700" fill="#2b2a27">可以观察三十二身分的整体或某</text>
<text x="361.9" y="1916.2" font-size="19" font-weight="700" fill="#2b2a27">一个</text>
<rect x="343.9" y="1943.8" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="1973.8" font-size="19" font-weight="700" fill="#2b2a27">三、四界分别观。透由三十二身</text>
<text x="361.9" y="1999.5" font-size="19" font-weight="700" fill="#2b2a27">分来修习四界差别，对每一个身</text>
<text x="361.9" y="2025.1" font-size="19" font-weight="700" fill="#2b2a27">分修习它</text>
<line x1="691.9" y1="1971.4" x2="825.9" y2="1971.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="1962.8" font-size="16" font-weight="500" fill="#2b2a27">（七）观照三种身</text>
</svg>