<rect x="30" y="731.8" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="768.8" font-size="26" font-weight="700" fill="#fff">第56讲-摄缘-十二</text>
<text x="48.0" y="803.9" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘56-</text>
<text x="48.0" y="839.0" font-size="26" font-weight="700" fill="#fff">释二十四缘-相应缘</text>
<text x="48.0" y="874.1" font-size="26" font-weight="700" fill="#fff">与不相应缘</text>
<rect x="337.7" y="405.8" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="435.8" font-size="19" font-weight="700" fill="#2b2a27">一、相应缘</text>
<line x1="514.7" y1="148.5" x2="600.7" y2="148.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="139.9" font-size="16" font-weight="500" fill="#2b2a27">（一）经文</text>
<line x1="646.7" y1="54.9" x2="710.4" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="649.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1.缘广释</text>
<line x1="646.7" y1="91.8" x2="840.8" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="649.7" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">19.Sampayuttapaccayoti —</text>
<line x1="646.7" y1="128.7" x2="724.4" y2="128.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="649.7" y="120.8" font-size="14" font-weight="400" fill="#2b2a27">2.巴利释义</text>
<line x1="646.7" y1="165.6" x2="780.4" y2="165.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="649.7" y="157.7" font-size="14" font-weight="400" fill="#2b2a27">1.平等，不会不平等</text>
<line x1="646.7" y1="202.5" x2="696.4" y2="202.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="649.7" y="194.6" font-size="14" font-weight="400" fill="#2b2a27">2.正确</text>
<line x1="646.7" y1="239.4" x2="696.4" y2="239.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="649.7" y="231.5" font-size="14" font-weight="400" fill="#2b2a27">3.譬喻</text>
<line x1="514.7" y1="345.3" x2="632.7" y2="345.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="336.7" font-size="16" font-weight="500" fill="#2b2a27">（二）经文详释</text>
<line x1="678.7" y1="276.3" x2="798.4" y2="276.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="681.7" y="268.4" font-size="14" font-weight="400" fill="#2b2a27">1.缘法和缘所生法</text>
<line x1="678.7" y1="313.2" x2="798.4" y2="313.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="681.7" y="305.3" font-size="14" font-weight="400" fill="#2b2a27">2.相应缘所摄诸缘</text>
<line x1="678.7" y1="411.5" x2="784.4" y2="411.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="681.7" y="403.6" font-size="14" font-weight="400" fill="#2b2a27">3.相应缘的特点</text>
<line x1="830.4" y1="348.8" x2="910.2" y2="348.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="833.4" y="341.2" font-size="13" font-weight="400" fill="#2b2a27">(1)同时生起</text>
<line x1="830.4" y1="384.3" x2="910.2" y2="384.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="833.4" y="376.8" font-size="13" font-weight="400" fill="#2b2a27">(2)同时灭去</text>
<line x1="830.4" y1="437.4" x2="1079.2" y2="437.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="833.4" y="412.3" font-size="13" font-weight="400" fill="#2b2a27">(3)依于同一个依处而生起，要么是依于五</text>
<text x="833.4" y="429.9" font-size="13" font-weight="400" fill="#2b2a27">根而生起的五识及相</text>
<line x1="830.4" y1="473.0" x2="936.2" y2="473.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="833.4" y="465.4" font-size="13" font-weight="400" fill="#2b2a27">(4)取同一个所缘</text>
<line x1="514.7" y1="736.3" x2="728.7" y2="736.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="727.7" font-size="16" font-weight="500" fill="#2b2a27">（三）修习力养成组织的建立</text>
<line x1="774.7" y1="624.2" x2="992.4" y2="624.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="777.7" y="616.3" font-size="14" font-weight="400" fill="#2b2a27">1.修习力养成组织的五种基础要素</text>
<line x1="1038.4" y1="526.1" x2="1288.8" y2="526.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1041.4" y="501.0" font-size="13" font-weight="400" fill="#2b2a27">(1)修习力养成组织的价值——发现、纠错、</text>
<text x="1041.4" y="518.5" font-size="13" font-weight="400" fill="#2b2a27">成长（发现烦恼、</text>
<line x1="1038.4" y1="579.2" x2="1288.8" y2="579.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1041.4" y="554.1" font-size="13" font-weight="400" fill="#2b2a27">(2)修习力养成组织的核心体现——组织与成</text>
<text x="1041.4" y="571.6" font-size="13" font-weight="400" fill="#2b2a27">员修习力是否持续</text>
<line x1="1038.4" y1="632.3" x2="1288.8" y2="632.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1041.4" y="607.2" font-size="13" font-weight="400" fill="#2b2a27">(3)修习力养成组织精神——缘起性思维、向</text>
<text x="1041.4" y="624.7" font-size="13" font-weight="400" fill="#2b2a27">内、向善和互信、</text>
<line x1="1038.4" y1="685.4" x2="1288.8" y2="685.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1041.4" y="660.3" font-size="13" font-weight="400" fill="#2b2a27">(4)修习力养成组织的修习准则——以《清净</text>
<text x="1041.4" y="677.8" font-size="13" font-weight="400" fill="#2b2a27">道论》为蓝本修习</text>
<line x1="1038.4" y1="738.5" x2="1288.8" y2="738.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1041.4" y="713.4" font-size="13" font-weight="400" fill="#2b2a27">(5)修习力养成组织的基础——七觉支团队互</text>
<text x="1041.4" y="730.9" font-size="13" font-weight="400" fill="#2b2a27">赖（培养解脱的根</text>
<line x1="774.7" y1="845.8" x2="950.4" y2="845.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="777.7" y="837.9" font-size="14" font-weight="400" fill="#2b2a27">2.修习力养成组织五项关键</text>
<line x1="996.4" y1="774.0" x2="1076.2" y2="774.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="999.4" y="766.5" font-size="13" font-weight="400" fill="#2b2a27">(1)共同愿景</text>
<line x1="996.4" y1="809.6" x2="1089.2" y2="809.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="999.4" y="802.0" font-size="13" font-weight="400" fill="#2b2a27">(2)团队修习力</text>
<line x1="996.4" y1="845.1" x2="1076.2" y2="845.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="999.4" y="837.6" font-size="13" font-weight="400" fill="#2b2a27">(3)改变心智</text>
<line x1="996.4" y1="880.6" x2="1076.2" y2="880.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="999.4" y="873.1" font-size="13" font-weight="400" fill="#2b2a27">(4)自我超越</text>
<line x1="996.4" y1="916.2" x2="1076.2" y2="916.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="999.4" y="908.6" font-size="13" font-weight="400" fill="#2b2a27">(5)见树见林</text>
<rect x="337.7" y="1172.5" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="1202.5" font-size="19" font-weight="700" fill="#2b2a27">二、不相应缘</text>
<line x1="533.7" y1="1009.8" x2="619.7" y2="1009.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="1001.2" font-size="16" font-weight="500" fill="#2b2a27">（一）经文</text>
<line x1="665.7" y1="953.1" x2="729.4" y2="953.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="668.7" y="945.2" font-size="14" font-weight="400" fill="#2b2a27">1.缘广释</text>
<line x1="665.7" y1="990.0" x2="859.8" y2="990.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="668.7" y="982.1" font-size="14" font-weight="400" fill="#2b2a27">20.Vippayuttapaccayoti —</text>
<line x1="665.7" y1="1026.9" x2="715.4" y2="1026.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="668.7" y="1019.0" font-size="14" font-weight="400" fill="#2b2a27">2.譬喻</text>
<line x1="665.7" y1="1063.8" x2="785.4" y2="1063.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="668.7" y="1055.9" font-size="14" font-weight="400" fill="#2b2a27">3.不相应缘的特点</text>
<line x1="533.7" y1="1408.5" x2="651.7" y2="1408.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="1399.9" font-size="16" font-weight="500" fill="#2b2a27">（二）经文详释</text>
<line x1="697.7" y1="1117.8" x2="803.4" y2="1117.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="1109.9" font-size="14" font-weight="400" fill="#2b2a27">1.俱生不相应缘</text>
<line x1="849.4" y1="1099.3" x2="979.6" y2="1099.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.4" y="1091.8" font-size="13" font-weight="400" fill="#2b2a27">（1）入胎刹那的名色</text>
<line x1="849.4" y1="1134.9" x2="1031.6" y2="1134.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.4" y="1127.3" font-size="13" font-weight="400" fill="#2b2a27">（2）诸心、心所法对俱生诸色</text>
<line x1="697.7" y1="1171.8" x2="831.4" y2="1171.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="1163.9" font-size="14" font-weight="400" fill="#2b2a27">2.依处前生不相应缘</text>
<line x1="697.7" y1="1208.7" x2="803.4" y2="1208.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="1200.8" font-size="14" font-weight="400" fill="#2b2a27">3.后生不相应缘</text>
<line x1="697.7" y1="1280.3" x2="873.4" y2="1280.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="1272.4" font-size="14" font-weight="400" fill="#2b2a27">4.经文内容与三种缘的对应</text>
<line x1="919.4" y1="1261.8" x2="1169.8" y2="1261.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="922.4" y="1236.7" font-size="13" font-weight="400" fill="#2b2a27">(1)“诸色法对诸非色法以不相应缘为缘”有</text>
<text x="922.4" y="1254.2" font-size="13" font-weight="400" fill="#2b2a27">两类</text>
<line x1="919.4" y1="1314.9" x2="1169.8" y2="1314.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="922.4" y="1289.8" font-size="13" font-weight="400" fill="#2b2a27">(2)“诸非色法对诸色法以不相应缘为缘”也</text>
<text x="922.4" y="1307.3" font-size="13" font-weight="400" fill="#2b2a27">有两类</text>
<line x1="697.7" y1="1417.6" x2="747.4" y2="1417.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="1409.7" font-size="14" font-weight="400" fill="#2b2a27">5.小结</text>
<line x1="793.4" y1="1350.4" x2="1042.2" y2="1350.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="796.4" y="1342.9" font-size="13" font-weight="400" fill="#2b2a27">(1)物质：即色法，包括四大及四大所造色</text>
<line x1="793.4" y1="1403.5" x2="1042.2" y2="1403.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="796.4" y="1378.4" font-size="13" font-weight="400" fill="#2b2a27">(2)精神：即名法，包括八十九种心及五十</text>
<text x="796.4" y="1396.0" font-size="13" font-weight="400" fill="#2b2a27">二种心所</text>
<line x1="793.4" y1="1439.1" x2="1003.2" y2="1439.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="796.4" y="1431.5" font-size="13" font-weight="400" fill="#2b2a27">(3)业：由于造作而留下的业的潜力</text>
<line x1="793.4" y1="1492.2" x2="1042.2" y2="1492.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="796.4" y="1467.1" font-size="13" font-weight="400" fill="#2b2a27">(4)业因：即无明、爱、取，或者说贪、嗔</text>
<text x="796.4" y="1484.6" font-size="13" font-weight="400" fill="#2b2a27">、痴与无贪、无嗔、</text>
<line x1="697.7" y1="1548.0" x2="957.4" y2="1548.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="1521.2" font-size="14" font-weight="400" fill="#2b2a27">1.视僧团为自己的根本依处，尊敬僧团、</text>
<text x="700.7" y="1540.1" font-size="14" font-weight="400" fill="#2b2a27">融入僧团、爱护僧团</text>
<line x1="697.7" y1="1603.8" x2="957.4" y2="1603.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="1577.0" font-size="14" font-weight="400" fill="#2b2a27">2.尊重正法律（佛法如同我们的前生依止</text>
<text x="700.7" y="1595.9" font-size="14" font-weight="400" fill="#2b2a27">） ，尊重僧团伦理，培</text>
<line x1="697.7" y1="1659.6" x2="959.0" y2="1659.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="1632.8" font-size="14" font-weight="400" fill="#2b2a27">3.不傲慢、 不轻视任何人， 看到并学习</text>
<text x="700.7" y="1651.7" font-size="14" font-weight="400" fill="#2b2a27">每个成员与自己不相应的</text>
<line x1="697.7" y1="1696.5" x2="943.4" y2="1696.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="1688.6" font-size="14" font-weight="400" fill="#2b2a27">4.借用费孝通先生的一句名言改造一下</text>
</svg>