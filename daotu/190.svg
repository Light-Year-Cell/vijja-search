<rect x="30" y="252.3" width="267.9" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="289.3" font-size="26" font-weight="700" fill="#fff">190讲-摄集38-摄菩</text>
<text x="48.0" y="324.4" font-size="26" font-weight="700" fill="#fff">提分-法念处-五取</text>
<text x="48.0" y="359.5" font-size="26" font-weight="700" fill="#fff">蕴&amp;十二处1</text>
<rect x="343.9" y="144.3" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="174.3" font-size="19" font-weight="700" fill="#2b2a27">一、五取蕴</text>
<line x1="520.9" y1="57.6" x2="654.9" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）何谓五取蕴</text>
<line x1="520.9" y1="97.2" x2="784.8" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）第一个阶段——观名色法的特相</text>
<line x1="520.9" y1="200.7" x2="784.8" y2="200.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="192.1" font-size="16" font-weight="500" fill="#2b2a27">（三）第二个阶段——因缘生及刹那生</text>
<line x1="830.8" y1="153.0" x2="1090.5" y2="153.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="833.8" y="126.2" font-size="14" font-weight="400" fill="#2b2a27">1.有分意触是因，受蕴是果。有分意触是</text>
<text x="833.8" y="145.1" font-size="14" font-weight="400" fill="#2b2a27">什么？这条心路生起之</text>
<line x1="830.8" y1="208.8" x2="1090.5" y2="208.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="833.8" y="182.0" font-size="14" font-weight="400" fill="#2b2a27">2.第一速行的意触是因，受蕴是果。因为</text>
<text x="833.8" y="200.9" font-size="14" font-weight="400" fill="#2b2a27">前面一个速行的存在</text>
<line x1="830.8" y1="264.6" x2="1090.5" y2="264.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="833.8" y="237.8" font-size="14" font-weight="400" fill="#2b2a27">3.第二速行的意触是因，受蕴是果。即同</text>
<text x="833.8" y="256.7" font-size="14" font-weight="400" fill="#2b2a27">一速行心里的触是因</text>
<line x1="520.9" y1="304.2" x2="784.8" y2="304.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="295.6" font-size="16" font-weight="500" fill="#2b2a27">（四）第三个阶段——因缘灭及刹那灭</text>
<rect x="343.9" y="316.2" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="346.2" font-size="19" font-weight="700" fill="#2b2a27">三、四禅，有些人还修行十四御</text>
<text x="361.9" y="371.9" font-size="19" font-weight="700" fill="#2b2a27">心法，停在四禅，出来后修自己</text>
<text x="361.9" y="397.5" font-size="19" font-weight="700" fill="#2b2a27">心所</text>
<line x1="691.9" y1="343.8" x2="857.9" y2="343.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="335.2" font-size="16" font-weight="500" fill="#2b2a27">（五）更高阶段的观智</text>
<rect x="343.9" y="440.0" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="470.0" font-size="19" font-weight="700" fill="#2b2a27">二、十二处</text>
<line x1="520.9" y1="452.8" x2="686.9" y2="452.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="444.2" font-size="16" font-weight="500" fill="#2b2a27">（一）了知眼、了知色</text>
<line x1="520.9" y1="500.5" x2="766.9" y2="500.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="491.9" font-size="16" font-weight="500" fill="#2b2a27">（二）也了知缘此二者而生起之结</text>
<line x1="812.9" y1="508.6" x2="1071.5" y2="508.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="815.9" y="481.8" font-size="14" font-weight="400" fill="#2b2a27">6. 戒禁取结；7.有欲结；8.嫉结；9.悭</text>
<text x="815.9" y="500.7" font-size="14" font-weight="400" fill="#2b2a27">结；10.无明结</text>
</svg>