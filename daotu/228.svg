<rect x="30" y="279.2" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="316.2" font-size="26" font-weight="700" fill="#fff">第32讲-摄缘-十二</text>
<text x="48.0" y="351.3" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘32-</text>
<text x="48.0" y="386.4" font-size="26" font-weight="700" fill="#fff">释二十四缘-亲依止</text>
<text x="48.0" y="421.5" font-size="26" font-weight="700" fill="#fff">缘8</text>
<rect x="337.7" y="57.0" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="87.0" font-size="19" font-weight="700" fill="#2b2a27">一、无间亲依止缘</text>
<line x1="571.7" y1="79.2" x2="841.4" y2="79.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">(一) 《发趣论· 问分》 之 “不善法</text>
<text x="574.7" y="70.6" font-size="16" font-weight="500" fill="#2b2a27">对无记法的无间亲依止缘”</text>
<line x1="571.7" y1="118.8" x2="817.7" y2="118.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">（二）缘法、缘所生法及所摄诸缘</text>
<rect x="337.7" y="262.0" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="292.0" font-size="19" font-weight="700" fill="#2b2a27">二、自然亲依止缘</text>
<line x1="571.7" y1="158.4" x2="737.7" y2="158.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="149.8" font-size="16" font-weight="500" fill="#2b2a27">（一）缘法和缘所生法</text>
<line x1="571.7" y1="449.6" x2="841.4" y2="449.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="419.4" font-size="16" font-weight="500" fill="#2b2a27">(二) 《发趣论· 问分》 之 “不善法</text>
<text x="574.7" y="441.0" font-size="16" font-weight="500" fill="#2b2a27">对无记法的自然亲依止缘”</text>
<line x1="887.4" y1="283.5" x2="1035.0" y2="283.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="890.4" y="275.6" font-size="14" font-weight="400" fill="#2b2a27">1.因贪嗔痴等而承受苦</text>
<line x1="1081.0" y1="194.0" x2="1211.3" y2="194.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1084.0" y="186.4" font-size="13" font-weight="400" fill="#2b2a27">（1）因贪欲而承受苦</text>
<line x1="1081.0" y1="229.5" x2="1211.3" y2="229.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1084.0" y="221.9" font-size="13" font-weight="400" fill="#2b2a27">（2）因嗔恚而承受苦</text>
<line x1="1081.0" y1="265.1" x2="1211.3" y2="265.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1084.0" y="257.5" font-size="13" font-weight="400" fill="#2b2a27">（3）因愚痴而承受苦</text>
<line x1="1081.0" y1="300.6" x2="1198.3" y2="300.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1084.0" y="293.1" font-size="13" font-weight="400" fill="#2b2a27">（4）因慢而承受苦</text>
<line x1="1081.0" y1="336.2" x2="1211.3" y2="336.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1084.0" y="328.6" font-size="13" font-weight="400" fill="#2b2a27">（5）因邪见而承受苦</text>
<line x1="1081.0" y1="371.7" x2="1211.3" y2="371.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1084.0" y="364.2" font-size="13" font-weight="400" fill="#2b2a27">（6）因愿求而承受苦</text>
<line x1="887.4" y1="425.7" x2="1105.0" y2="425.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="890.4" y="417.8" font-size="14" font-weight="400" fill="#2b2a27">2.贪嗔痴等对身乐、身苦、果等至</text>
<line x1="1151.0" y1="407.3" x2="1269.9" y2="407.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1154.0" y="399.7" font-size="13" font-weight="400" fill="#2b2a27">(1)贪嗔痴等对身乐</text>
<line x1="1151.0" y1="442.8" x2="1269.9" y2="442.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1154.0" y="435.3" font-size="13" font-weight="400" fill="#2b2a27">(2)贪嗔痴等对身苦</text>
<line x1="887.4" y1="498.6" x2="1154.9" y2="498.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="890.4" y="471.8" font-size="14" font-weight="400" fill="#2b2a27">1.对于由于自我折磨而产生的身苦， 比如</text>
<text x="890.4" y="490.7" font-size="14" font-weight="400" fill="#2b2a27">说， 贪图美丽的女人割</text>
<line x1="887.4" y1="554.4" x2="1147.0" y2="554.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="890.4" y="527.6" font-size="14" font-weight="400" fill="#2b2a27">2.对于因为贪嗔痴等不善法而遭受刑罚和</text>
<text x="890.4" y="546.5" font-size="14" font-weight="400" fill="#2b2a27">监禁， 古今中外那些遭</text>
<line x1="1193.0" y1="534.2" x2="1324.9" y2="534.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1196.0" y="526.6" font-size="13" font-weight="400" fill="#2b2a27">(3)贪嗔痴等对果等至</text>
<line x1="887.4" y1="591.3" x2="993.0" y2="591.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="890.4" y="583.4" font-size="14" font-weight="400" fill="#2b2a27">3.不善业对果报</text>
<rect x="337.7" y="603.3" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="633.3" font-size="19" font-weight="700" fill="#2b2a27">三、接纳与承诺疗法对治错误愿</text>
<text x="355.7" y="659.0" font-size="19" font-weight="700" fill="#2b2a27">望综合症</text>
</svg>