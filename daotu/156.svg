<text x="347.4" y="119.4" font-size="19" font-weight="700" fill="#2b2a27">二、从想颠倒到趣颠倒</text>
<line x1="601.4" y1="136.9" x2="879.4" y2="136.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="604.4" y="106.7" font-size="16" font-weight="500" fill="#2b2a27">（一）三颠倒：想颠倒、心颠倒、见颠</text>
<text x="604.4" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">倒</text>
