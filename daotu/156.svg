<text x="347.4" y="256.2" font-size="19" font-weight="700" fill="#2b2a27">一、二、三、四……</text>
<line x1="565.6" y1="198.1" x2="843.6" y2="198.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="568.6" y="167.9" font-size="16" font-weight="500" fill="#2b2a27">（二）三虚妄思：渴爱虚妄思、骄慢虚</text>
<text x="568.6" y="189.5" font-size="16" font-weight="500" fill="#2b2a27">妄思、见虚妄思</text>
<line x1="565.6" y1="259.2" x2="843.6" y2="259.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="568.6" y="229.1" font-size="16" font-weight="500" fill="#2b2a27">（三）两种殊胜居：渴爱殊胜居、见殊</text>
<text x="568.6" y="250.7" font-size="16" font-weight="500" fill="#2b2a27">胜居</text>
<line x1="565.6" y1="298.9" x2="795.6" y2="298.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="568.6" y="290.2" font-size="16" font-weight="500" fill="#2b2a27">（四）两种趣：凡夫趣、圣者趣</text>
