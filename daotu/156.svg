<rect x="329.4" y="30.0" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="347.4" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、人是怎么来的？</text>
