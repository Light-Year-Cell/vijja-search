<rect x="30" y="550.5" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="587.5" font-size="26" font-weight="700" fill="#fff">第1讲-摄缘-十二缘</text>
<text x="48.0" y="622.6" font-size="26" font-weight="700" fill="#fff">起与二十四缘1-缘</text>
<text x="48.0" y="657.7" font-size="26" font-weight="700" fill="#fff">概说1</text>
<rect x="337.7" y="172.2" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="202.2" font-size="19" font-weight="700" fill="#2b2a27">一、缘分别</text>
<line x1="514.7" y1="57.6" x2="771.6" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">1. 了解缘有两种：缘起法和发趣法</text>
<line x1="514.7" y1="118.8" x2="787.6" y2="118.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">2. 初步了解《清静道论》中对十二缘</text>
<text x="517.7" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">和二十四缘的讲解方法</text>
<line x1="514.7" y1="180.0" x2="792.7" y2="180.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="149.8" font-size="16" font-weight="500" fill="#2b2a27">（一）缘的两种解释方法：缘起法和发</text>
<text x="517.7" y="171.4" font-size="16" font-weight="500" fill="#2b2a27">趣法</text>
<line x1="514.7" y1="241.2" x2="778.6" y2="241.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="211.0" font-size="16" font-weight="500" fill="#2b2a27">（二） 《清静道论》 中对十二缘和</text>
<text x="517.7" y="232.6" font-size="16" font-weight="500" fill="#2b2a27">二十四缘用混合讲解的方</text>
<line x1="514.7" y1="280.8" x2="627.6" y2="280.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="272.2" font-size="16" font-weight="500" fill="#2b2a27">（一） “福行”</text>
<line x1="514.7" y1="320.4" x2="634.6" y2="320.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="311.8" font-size="16" font-weight="500" fill="#2b2a27">（二）“非福行”</text>
<line x1="514.7" y1="360.0" x2="634.6" y2="360.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="351.4" font-size="16" font-weight="500" fill="#2b2a27">（三）“不动行”</text>
<rect x="337.7" y="526.8" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="556.8" font-size="19" font-weight="700" fill="#2b2a27">二、为什么缘起是很重要的课程</text>
<text x="355.7" y="582.4" font-size="19" font-weight="700" fill="#2b2a27">？</text>
<line x1="685.7" y1="421.2" x2="958.6" y2="421.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="391.0" font-size="16" font-weight="500" fill="#2b2a27">1. 了解如果不能够通达缘起就不能够</text>
<text x="688.7" y="412.6" font-size="16" font-weight="500" fill="#2b2a27">解脱</text>
<line x1="685.7" y1="482.4" x2="951.5" y2="482.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="452.2" font-size="16" font-weight="500" fill="#2b2a27">2. 通过学习经文和理解经文中“随觉</text>
<text x="688.7" y="473.8" font-size="16" font-weight="500" fill="#2b2a27">和通达”的含义，领会缘</text>
<line x1="685.7" y1="522.0" x2="771.7" y2="522.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="513.4" font-size="16" font-weight="500" fill="#2b2a27">（一）经文</text>
<line x1="685.7" y1="614.6" x2="819.7" y2="614.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="606.0" font-size="16" font-weight="500" fill="#2b2a27">（二）经文的解释</text>
<line x1="865.7" y1="558.9" x2="1041.4" y2="558.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="868.7" y="551.0" font-size="14" font-weight="400" fill="#2b2a27">1.清净道论大疏钞中的解释</text>
<line x1="865.7" y1="595.8" x2="1041.4" y2="595.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="868.7" y="587.9" font-size="14" font-weight="400" fill="#2b2a27">2.《长部义注》复注的解释</text>
<line x1="865.7" y1="667.6" x2="915.4" y2="667.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="868.7" y="659.7" font-size="14" font-weight="400" fill="#2b2a27">3.详解</text>
<line x1="961.4" y1="631.3" x2="1052.6" y2="631.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="964.4" y="623.8" font-size="13" font-weight="400" fill="#2b2a27">（1）所知遍知</text>
<line x1="961.4" y1="666.9" x2="1039.6" y2="666.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="964.4" y="659.3" font-size="13" font-weight="400" fill="#2b2a27">（2）度遍知</text>
<line x1="961.4" y1="702.4" x2="1039.6" y2="702.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="964.4" y="694.9" font-size="13" font-weight="400" fill="#2b2a27">（3）断遍知</text>
<line x1="685.7" y1="742.0" x2="867.7" y2="742.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="733.4" font-size="16" font-weight="500" fill="#2b2a27">（三）观照缘起是必要的</text>
<rect x="337.7" y="1008.4" width="302.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="1038.4" font-size="19" font-weight="700" fill="#2b2a27">三、从世间遍知的角度学习缘起</text>
<line x1="685.7" y1="803.2" x2="958.6" y2="803.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="773.0" font-size="16" font-weight="500" fill="#2b2a27">1. 初步了解十二缘起中二根本，三连</text>
<text x="688.7" y="794.6" font-size="16" font-weight="500" fill="#2b2a27">接，三轮转，四摄，二十</text>
<line x1="685.7" y1="842.8" x2="910.6" y2="842.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="834.2" font-size="16" font-weight="500" fill="#2b2a27">2. 初步了解十二缘起支的关系</text>
<line x1="685.7" y1="904.0" x2="958.6" y2="904.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="873.8" font-size="16" font-weight="500" fill="#2b2a27">3. 知道十二缘起支和二十四缘跟我们</text>
<text x="688.7" y="895.4" font-size="16" font-weight="500" fill="#2b2a27">生活中的每一个细节是息</text>
<line x1="685.7" y1="1063.8" x2="963.7" y2="1063.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="1033.6" font-size="16" font-weight="500" fill="#2b2a27">（一）用综合图示解释十二缘起之间的</text>
<text x="688.7" y="1055.2" font-size="16" font-weight="500" fill="#2b2a27">关系</text>
<line x1="1009.7" y1="940.9" x2="1081.2" y2="940.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="933.0" font-size="14" font-weight="400" fill="#2b2a27">1. 十二支</text>
<line x1="1009.7" y1="977.8" x2="1110.9" y2="977.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="969.9" font-size="14" font-weight="400" fill="#2b2a27">2. 三时(三世)</text>
<line x1="1009.7" y1="1014.7" x2="1095.2" y2="1014.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="1006.8" font-size="14" font-weight="400" fill="#2b2a27">3. 二十行相</text>
<line x1="1009.7" y1="1051.7" x2="1081.2" y2="1051.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="1043.8" font-size="14" font-weight="400" fill="#2b2a27">4. 四摄类</text>
<line x1="1009.7" y1="1088.6" x2="1193.2" y2="1088.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="1080.7" font-size="14" font-weight="400" fill="#2b2a27">5. 三连结（因与果的连结）</text>
<line x1="1009.7" y1="1125.5" x2="1244.7" y2="1125.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="1117.6" font-size="14" font-weight="400" fill="#2b2a27">6. 三轮转 (分析惑、业、苦的轮转)</text>
<line x1="1009.7" y1="1162.4" x2="1081.2" y2="1162.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="1154.5" font-size="14" font-weight="400" fill="#2b2a27">7. 二根本</text>
<line x1="685.7" y1="1308.4" x2="963.7" y2="1308.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="1278.2" font-size="16" font-weight="500" fill="#2b2a27">（二）用分解图示解释十二缘起之间的</text>
<text x="688.7" y="1299.8" font-size="16" font-weight="500" fill="#2b2a27">关系</text>
<line x1="1009.7" y1="1199.3" x2="1101.4" y2="1199.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="1191.4" font-size="14" font-weight="400" fill="#2b2a27">1.十二缘起支</text>
<line x1="1009.7" y1="1236.2" x2="1129.4" y2="1236.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="1228.3" font-size="14" font-weight="400" fill="#2b2a27">2.四摄二十种行相</text>
<line x1="1009.7" y1="1273.1" x2="1213.4" y2="1273.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="1265.2" font-size="14" font-weight="400" fill="#2b2a27">3.从名色相续流来看十二缘起支</text>
<line x1="1009.7" y1="1310.0" x2="1221.2" y2="1310.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="1302.1" font-size="14" font-weight="400" fill="#2b2a27">4. 在日常生活中观察十二缘起支</text>
<line x1="1009.7" y1="1346.9" x2="1193.2" y2="1346.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="1339.0" font-size="14" font-weight="400" fill="#2b2a27">5. 在缘起图中看十二缘起支</text>
<line x1="1009.7" y1="1402.7" x2="1277.2" y2="1402.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="1375.9" font-size="14" font-weight="400" fill="#2b2a27">6. 在名色相续流的两股力量中看十二缘起</text>
<text x="1012.7" y="1394.8" font-size="14" font-weight="400" fill="#2b2a27">支</text>
</svg>