<text x="48.0" y="912.9" font-size="26" font-weight="700" fill="#fff">第10讲-摄缘-十二</text>
<text x="48.0" y="948.0" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘10-</text>
<text x="48.0" y="983.1" font-size="26" font-weight="700" fill="#fff">释二十四缘-因缘1</text>
<rect x="337.7" y="355.8" width="239.7" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="385.8" font-size="19" font-weight="700" fill="#2b2a27">（一）paṭṭhāna 24 缘</text>
<line x1="623.4" y1="57.6" x2="788.1" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">(1)因缘； (2)所缘缘</text>
<line x1="623.4" y1="97.2" x2="804.1" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">(3)增上缘； (4)无间缘</text>
<line x1="623.4" y1="136.8" x2="820.1" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">(5)等无间缘； (6)俱生缘</text>
<line x1="623.4" y1="176.4" x2="804.1" y2="176.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">(7)相互缘； (8)依止缘</text>
<line x1="623.4" y1="216.0" x2="829.0" y2="216.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="207.4" font-size="16" font-weight="500" fill="#2b2a27">(9)亲依止缘； (10)前生缘</text>
<line x1="623.4" y1="255.6" x2="822.0" y2="255.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="247.0" font-size="16" font-weight="500" fill="#2b2a27">(11)后生缘； (12)重复缘</text>
<line x1="623.4" y1="295.2" x2="806.0" y2="295.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="286.6" font-size="16" font-weight="500" fill="#2b2a27">(13)业缘； (14)果报缘</text>
<line x1="623.4" y1="334.8" x2="790.0" y2="334.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="326.2" font-size="16" font-weight="500" fill="#2b2a27">(15)食缘； (16)根缘</text>
<line x1="623.4" y1="374.4" x2="806.0" y2="374.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="365.8" font-size="16" font-weight="500" fill="#2b2a27">(17)禅那缘； (18)道缘</text>
<line x1="623.4" y1="414.0" x2="838.0" y2="414.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="405.4" font-size="16" font-weight="500" fill="#2b2a27">(19)相应缘； (20)不相应缘</text>
<line x1="623.4" y1="453.6" x2="806.0" y2="453.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="445.0" font-size="16" font-weight="500" fill="#2b2a27">(21)有缘； (22)无有缘</text>
<line x1="623.4" y1="493.2" x2="838.0" y2="493.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="484.6" font-size="16" font-weight="500" fill="#2b2a27">(23)离去缘； (24)不离去缘</text>
<line x1="623.4" y1="554.4" x2="886.6" y2="554.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="524.2" font-size="16" font-weight="500" fill="#2b2a27">3.增上缘（adhipati-paccayo）：</text>
<text x="626.4" y="545.8" font-size="16" font-weight="500" fill="#2b2a27">支配果生起</text>
<line x1="623.4" y1="615.6" x2="886.6" y2="615.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="585.4" font-size="16" font-weight="500" fill="#2b2a27">6.俱生缘（sahajāta-paccayo）：</text>
<text x="626.4" y="607.0" font-size="16" font-weight="500" fill="#2b2a27">因法与果法同时生起</text>
<line x1="623.4" y1="676.8" x2="900.7" y2="676.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="646.6" font-size="16" font-weight="500" fill="#2b2a27">15.食缘（āhāra-paccayo）：维持、</text>
<text x="626.4" y="668.2" font-size="16" font-weight="500" fill="#2b2a27">滋养果法的存在</text>
<line x1="623.4" y1="738.0" x2="886.6" y2="738.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="626.4" y="707.8" font-size="16" font-weight="500" fill="#2b2a27">16.根缘（indriya-paccayo）：控</text>
<text x="626.4" y="729.4" font-size="16" font-weight="500" fill="#2b2a27">制果法的功用</text>
<rect x="337.7" y="981.5" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="1011.5" font-size="19" font-weight="700" fill="#2b2a27">（二）缘的结构</text>
<line x1="552.7" y1="813.2" x2="624.6" y2="813.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="804.6" font-size="16" font-weight="500" fill="#2b2a27">1.三要素</text>
<line x1="670.6" y1="774.9" x2="853.6" y2="774.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="673.6" y="767.0" font-size="14" font-weight="400" fill="#2b2a27">(1)缘法(paccaya-dhamma)</text>
<line x1="670.6" y1="811.8" x2="928.6" y2="811.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="673.6" y="803.9" font-size="14" font-weight="400" fill="#2b2a27">(2)缘所生法(paccayuppanna-dhamma)</text>
<line x1="670.6" y1="848.7" x2="845.7" y2="848.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="673.6" y="840.8" font-size="14" font-weight="400" fill="#2b2a27">(3)缘力(paccaya-satti)</text>
<line x1="552.7" y1="888.3" x2="656.6" y2="888.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="879.7" font-size="16" font-weight="500" fill="#2b2a27">2.定义与譬喻</text>
<line x1="552.7" y1="927.9" x2="736.6" y2="927.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="919.3" font-size="16" font-weight="500" fill="#2b2a27">3.缘法如何缘助缘所生法</text>
<line x1="552.7" y1="989.1" x2="816.6" y2="989.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="958.9" font-size="16" font-weight="500" fill="#2b2a27">1.无间缘，其定义为缘力能够缘助果</text>
<text x="555.7" y="980.5" font-size="16" font-weight="500" fill="#2b2a27">法在因法灭去后立即生起</text>
<line x1="552.7" y1="1050.3" x2="825.6" y2="1050.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="1020.1" font-size="16" font-weight="500" fill="#2b2a27">2.等无间缘， 其能够缘助遍作心在意</text>
<text x="555.7" y="1041.7" font-size="16" font-weight="500" fill="#2b2a27">门转向心灭去后， 立即依照</text>
<line x1="552.7" y1="1111.5" x2="825.6" y2="1111.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="1081.3" font-size="16" font-weight="500" fill="#2b2a27">3.无间亲依止缘， 因法强力支助果法</text>
<text x="555.7" y="1102.9" font-size="16" font-weight="500" fill="#2b2a27">生起， 即意门转向心在灭去</text>
<line x1="552.7" y1="1172.7" x2="825.6" y2="1172.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="1142.5" font-size="16" font-weight="500" fill="#2b2a27">4.无有缘， 因以不存在的力量支助果</text>
<text x="555.7" y="1164.1" font-size="16" font-weight="500" fill="#2b2a27">在因灭去后立即生起， 即意</text>
<line x1="552.7" y1="1233.9" x2="825.6" y2="1233.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="1203.7" font-size="16" font-weight="500" fill="#2b2a27">5.离去缘， 因以离去的力量支助果生</text>
<text x="555.7" y="1225.3" font-size="16" font-weight="500" fill="#2b2a27">起， 即意门转向心以其离去</text>
<rect x="337.7" y="1475.6" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="1505.6" font-size="19" font-weight="700" fill="#2b2a27">一、因缘</text>
<line x1="495.7" y1="1290.6" x2="629.7" y2="1290.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="1282.0" font-size="16" font-weight="500" fill="#2b2a27">（一）经文与释义</text>
<line x1="675.7" y1="1270.8" x2="753.4" y2="1270.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="678.7" y="1262.9" font-size="14" font-weight="400" fill="#2b2a27">1.因缘释义</text>
<line x1="675.7" y1="1307.7" x2="781.4" y2="1307.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="678.7" y="1299.8" font-size="14" font-weight="400" fill="#2b2a27">2.因缘涉有因心</text>
<line x1="495.7" y1="1381.8" x2="645.7" y2="1381.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="1373.2" font-size="16" font-weight="500" fill="#2b2a27">（二）缘广释及问分</text>
<line x1="691.7" y1="1344.6" x2="755.4" y2="1344.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.7" y="1336.7" font-size="14" font-weight="400" fill="#2b2a27">1.缘广释</text>
<line x1="691.7" y1="1416.4" x2="741.4" y2="1416.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.7" y="1408.5" font-size="14" font-weight="400" fill="#2b2a27">2.问分</text>
<line x1="787.4" y1="1380.2" x2="852.6" y2="1380.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="790.4" y="1372.6" font-size="13" font-weight="400" fill="#2b2a27">（1）善因</text>
<line x1="787.4" y1="1415.7" x2="865.6" y2="1415.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="790.4" y="1408.2" font-size="13" font-weight="400" fill="#2b2a27">（2）不善因</text>
<line x1="787.4" y1="1451.3" x2="865.6" y2="1451.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="790.4" y="1443.7" font-size="13" font-weight="400" fill="#2b2a27">（3）无记因</text>
<line x1="495.7" y1="1577.5" x2="645.7" y2="1577.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="1568.9" font-size="16" font-weight="500" fill="#2b2a27">（三）缘法与缘生法</text>
<line x1="691.7" y1="1507.1" x2="953.0" y2="1507.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.7" y="1480.3" font-size="14" font-weight="400" fill="#2b2a27">(1)无贪、无嗔、无痴三因； （三因结生</text>
