<rect x="30" y="312.6" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="349.6" font-size="26" font-weight="700" fill="#fff">第14讲-摄缘-十二</text>
<text x="48.0" y="384.7" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘14-</text>
<text x="48.0" y="419.8" font-size="26" font-weight="700" fill="#fff">释二十四缘-增上缘</text>
<text x="48.0" y="454.9" font-size="26" font-weight="700" fill="#fff">1</text>
<rect x="337.7" y="73.4" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="103.4" font-size="19" font-weight="700" fill="#2b2a27">一、增上缘经文解释</text>
<line x1="590.7" y1="57.6" x2="852.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）忆佛甚深功德，飘然飞抵金塔</text>
<line x1="590.7" y1="97.2" x2="748.4" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）adhipati释义</text>
<line x1="590.7" y1="162.4" x2="692.7" y2="162.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="153.8" font-size="16" font-weight="500" fill="#2b2a27">（三）缘广释</text>
<line x1="738.7" y1="134.1" x2="894.2" y2="134.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="741.7" y="126.2" font-size="14" font-weight="400" fill="#2b2a27">1. 俱生增上与所缘增上</text>
<line x1="738.7" y1="188.1" x2="866.2" y2="188.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="741.7" y="180.2" font-size="14" font-weight="400" fill="#2b2a27">1. 缘法和缘所生法</text>
<line x1="912.2" y1="169.7" x2="1005.0" y2="169.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="915.2" y="162.1" font-size="13" font-weight="400" fill="#2b2a27">(1)俱生增上缘</text>
<line x1="912.2" y1="205.2" x2="1005.0" y2="205.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="915.2" y="197.6" font-size="13" font-weight="400" fill="#2b2a27">(2)所缘增上缘</text>
<rect x="337.7" y="666.5" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="696.5" font-size="19" font-weight="700" fill="#2b2a27">二、所缘增上</text>
<line x1="533.7" y1="364.5" x2="683.7" y2="364.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="355.9" font-size="16" font-weight="500" fill="#2b2a27">（一）所缘增上释义</text>
<line x1="729.7" y1="261.0" x2="997.2" y2="261.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="234.2" font-size="14" font-weight="400" fill="#2b2a27">1. 涅槃作为所缘时，可以有所缘缘以及所</text>
<text x="732.7" y="253.1" font-size="14" font-weight="400" fill="#2b2a27">缘增上缘力和所缘亲</text>
<line x1="729.7" y1="316.8" x2="997.2" y2="316.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="290.0" font-size="14" font-weight="400" fill="#2b2a27">2. 三时八十四心、三时四十七心所为所缘</text>
<text x="732.7" y="308.9" font-size="14" font-weight="400" fill="#2b2a27">时，可以有所缘缘以</text>
<line x1="729.7" y1="372.6" x2="997.2" y2="372.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="345.8" font-size="14" font-weight="400" fill="#2b2a27">3. 可意的过去、未来十八种完成色为所缘</text>
<text x="732.7" y="364.7" font-size="14" font-weight="400" fill="#2b2a27">时，可以有所缘缘以</text>
<line x1="729.7" y1="428.4" x2="997.2" y2="428.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="401.6" font-size="14" font-weight="400" fill="#2b2a27">4. 可意的现在十八种完成色为所缘时，可</text>
<text x="732.7" y="420.5" font-size="14" font-weight="400" fill="#2b2a27">以有所缘缘、所缘前</text>
<line x1="729.7" y1="484.2" x2="997.2" y2="484.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="457.4" font-size="14" font-weight="400" fill="#2b2a27">5. 可意的现在依处所缘为所缘时，是指心</text>
<text x="732.7" y="476.3" font-size="14" font-weight="400" fill="#2b2a27">所依处同时作为依处</text>
<line x1="533.7" y1="703.4" x2="699.7" y2="703.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="694.8" font-size="16" font-weight="500" fill="#2b2a27">（二）缘法与缘所生法</text>
<line x1="745.7" y1="564.8" x2="803.2" y2="564.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="748.7" y="556.9" font-size="14" font-weight="400" fill="#2b2a27">1. 缘法</text>
<line x1="849.2" y1="519.8" x2="1047.6" y2="519.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.2" y="512.2" font-size="13" font-weight="400" fill="#2b2a27">(1)十八种可意的完成色(真实色)</text>
<line x1="849.2" y1="572.9" x2="1092.3" y2="572.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.2" y="547.8" font-size="13" font-weight="400" fill="#2b2a27">(2)八十四种心(八十九种心扣除了两种嗔</text>
<text x="852.2" y="565.3" font-size="13" font-weight="400" fill="#2b2a27">根心、 两种痴根心以及</text>
<line x1="849.2" y1="608.4" x2="903.0" y2="608.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.2" y="600.9" font-size="13" font-weight="400" fill="#2b2a27">(4)涅槃</text>
<line x1="745.7" y1="679.9" x2="831.2" y2="679.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="748.7" y="672.0" font-size="14" font-weight="400" fill="#2b2a27">2. 缘所生法</text>
<line x1="877.2" y1="661.5" x2="1126.0" y2="661.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="880.2" y="636.4" font-size="13" font-weight="400" fill="#2b2a27">(1)任何增上的八种贪根心、八种大善心、</text>
<text x="880.2" y="653.9" font-size="13" font-weight="400" fill="#2b2a27">四种智相应的大唯作</text>
<line x1="877.2" y1="714.6" x2="1120.3" y2="714.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="880.2" y="689.5" font-size="13" font-weight="400" fill="#2b2a27">(2)四十五种心所(五十二种心所扣除了嗔</text>
<text x="880.2" y="707.0" font-size="13" font-weight="400" fill="#2b2a27">、嫉妒、悭吝、追悔、</text>
<line x1="745.7" y1="839.2" x2="957.2" y2="839.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="748.7" y="831.4" font-size="14" font-weight="400" fill="#2b2a27">3. 不同情况下的缘法和缘所生法</text>
<line x1="1003.2" y1="767.7" x2="1252.0" y2="767.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1006.2" y="742.6" font-size="13" font-weight="400" fill="#2b2a27">(1)若生起的是不善心，缘所生法就是八种</text>
<text x="1006.2" y="760.1" font-size="13" font-weight="400" fill="#2b2a27">贪根心之一及其相应</text>
<line x1="1003.2" y1="820.8" x2="1252.0" y2="820.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1006.2" y="795.7" font-size="13" font-weight="400" fill="#2b2a27">(2)若生起的是欲界善心，缘所生法则是八</text>
<text x="1006.2" y="813.2" font-size="13" font-weight="400" fill="#2b2a27">大善心之一及其相应</text>
<line x1="1003.2" y1="873.9" x2="1253.6" y2="873.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1006.2" y="848.8" font-size="13" font-weight="400" fill="#2b2a27">(3)若是唯作的心(只有阿拉汉才能生起)，</text>
<text x="1006.2" y="866.4" font-size="13" font-weight="400" fill="#2b2a27">缘所生法则是四种智</text>
<line x1="1003.2" y1="927.0" x2="1252.0" y2="927.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1006.2" y="901.9" font-size="13" font-weight="400" fill="#2b2a27">(4)而当以涅槃为缘法时，其缘所生法包括</text>
<text x="1006.2" y="919.5" font-size="13" font-weight="400" fill="#2b2a27">生起为种姓、净化的</text>
<line x1="533.7" y1="966.6" x2="699.7" y2="966.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="958.0" font-size="16" font-weight="500" fill="#2b2a27">（三）所缘增上的实例</text>
<line x1="533.7" y1="1041.8" x2="699.7" y2="1041.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="1033.2" font-size="16" font-weight="500" fill="#2b2a27">（四）所缘增上的应用</text>
<line x1="745.7" y1="1003.5" x2="859.2" y2="1003.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="748.7" y="995.6" font-size="14" font-weight="400" fill="#2b2a27">1. 避免不善所缘</text>
<line x1="745.7" y1="1040.4" x2="873.2" y2="1040.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="748.7" y="1032.5" font-size="14" font-weight="400" fill="#2b2a27">2. 培养善的增上缘</text>
<line x1="745.7" y1="1077.3" x2="887.2" y2="1077.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="748.7" y="1069.4" font-size="14" font-weight="400" fill="#2b2a27">3. 以涅槃为所缘增上</text>
</svg>