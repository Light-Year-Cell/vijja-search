<text x="732.7" y="311.6" font-size="14" font-weight="400" fill="#2b2a27">4.无效业</text>
<line x1="839.4" y1="274.5" x2="1089.8" y2="274.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="249.4" font-size="13" font-weight="400" fill="#2b2a27">(1) 第一个速行心造下的业， 若当生没有</text>
<text x="842.4" y="267.0" font-size="13" font-weight="400" fill="#2b2a27">成熟， 在这一期生命结</text>
<line x1="839.4" y1="327.6" x2="1089.8" y2="327.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="302.5" font-size="13" font-weight="400" fill="#2b2a27">(2) 第七个速行心造下的业， 将在造业之</text>
<text x="842.4" y="320.1" font-size="13" font-weight="400" fill="#2b2a27">后的下一生成熟， 若下</text>
<line x1="839.4" y1="380.7" x2="1082.5" y2="380.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="355.6" font-size="13" font-weight="400" fill="#2b2a27">(3) 包括佛陀、独觉佛在内的阿拉汉圣者</text>
<text x="842.4" y="373.2" font-size="13" font-weight="400" fill="#2b2a27">，在无余涅槃的时候</text>
