<rect x="30" y="456.4" width="267.9" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="493.4" font-size="26" font-weight="700" fill="#fff">191讲-摄集39-摄菩</text>
<text x="48.0" y="528.5" font-size="26" font-weight="700" fill="#fff">提分-法念处-十二</text>
<text x="48.0" y="563.6" font-size="26" font-weight="700" fill="#fff">处2&amp;七觉支1</text>
<rect x="343.9" y="344.5" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="374.5" font-size="19" font-weight="700" fill="#2b2a27">一、十二处</text>
<line x1="520.9" y1="222.3" x2="766.9" y2="222.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="213.7" font-size="16" font-weight="500" fill="#2b2a27">（一）也了知缘此二者而生起之结</text>
<line x1="812.9" y1="54.9" x2="876.6" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.9" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1.欲欲结</text>
<line x1="812.9" y1="91.8" x2="876.6" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.9" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2.瞋恨结</text>
<line x1="812.9" y1="128.7" x2="876.6" y2="128.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.9" y="120.8" font-size="14" font-weight="400" fill="#2b2a27">3.我慢结</text>
<line x1="812.9" y1="165.6" x2="876.6" y2="165.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.9" y="157.7" font-size="14" font-weight="400" fill="#2b2a27">4.邪见结</text>
<line x1="812.9" y1="202.5" x2="862.6" y2="202.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.9" y="194.6" font-size="14" font-weight="400" fill="#2b2a27">5.疑结</text>
<line x1="812.9" y1="239.4" x2="904.6" y2="239.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.9" y="231.5" font-size="14" font-weight="400" fill="#2b2a27">6.戒禁取见结</text>
<line x1="812.9" y1="276.3" x2="876.6" y2="276.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.9" y="268.4" font-size="14" font-weight="400" fill="#2b2a27">7.有欲结</text>
<line x1="812.9" y1="313.2" x2="862.6" y2="313.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.9" y="305.3" font-size="14" font-weight="400" fill="#2b2a27">8.嫉结</text>
<line x1="812.9" y1="350.1" x2="862.6" y2="350.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.9" y="342.2" font-size="14" font-weight="400" fill="#2b2a27">9.悭结</text>
<line x1="812.9" y1="387.0" x2="884.4" y2="387.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="815.9" y="379.1" font-size="14" font-weight="400" fill="#2b2a27">10.无明结</text>
<line x1="520.9" y1="426.6" x2="750.9" y2="426.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="418.0" font-size="16" font-weight="500" fill="#2b2a27">（二）了知未生起之结如何生起</text>
<line x1="520.9" y1="483.3" x2="750.9" y2="483.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="474.7" font-size="16" font-weight="500" fill="#2b2a27">（三）了知已生起之结如何捨断</text>
<line x1="796.9" y1="463.5" x2="896.4" y2="463.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="799.9" y="455.6" font-size="14" font-weight="400" fill="#2b2a27">1. 寻找结之因</text>
<line x1="796.9" y1="500.4" x2="882.4" y2="500.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="799.9" y="492.5" font-size="14" font-weight="400" fill="#2b2a27">2. 三种捨断</text>
<line x1="520.9" y1="540.0" x2="686.9" y2="540.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="531.4" font-size="16" font-weight="500" fill="#2b2a27">（四）更高阶段的观智</text>
<rect x="343.9" y="647.8" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="677.8" font-size="19" font-weight="700" fill="#2b2a27">二、七觉支</text>
<line x1="520.9" y1="633.6" x2="608.8" y2="633.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="625.0" font-size="16" font-weight="500" fill="#2b2a27">(一)念觉支</text>
<line x1="654.8" y1="576.9" x2="732.5" y2="576.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="657.8" y="569.0" font-size="14" font-weight="400" fill="#2b2a27">1.正知正念</text>
<line x1="654.8" y1="613.8" x2="788.5" y2="613.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="657.8" y="605.9" font-size="14" font-weight="400" fill="#2b2a27">2.远离内心迷惑的人</text>
<line x1="654.8" y1="650.7" x2="802.5" y2="650.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="657.8" y="642.8" font-size="14" font-weight="400" fill="#2b2a27">3.与拥有正念的人相处</text>
<line x1="654.8" y1="687.6" x2="774.5" y2="687.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="657.8" y="679.7" font-size="14" font-weight="400" fill="#2b2a27">4.倾向于培育正念</text>
<line x1="520.9" y1="735.3" x2="624.8" y2="735.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="726.7" font-size="16" font-weight="500" fill="#2b2a27">(二)择法觉支</text>
<line x1="670.8" y1="743.4" x2="932.2" y2="743.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="673.8" y="716.6" font-size="14" font-weight="400" fill="#2b2a27">1.提出有关五蕴等的问题；2.清净依处，</text>
<text x="673.8" y="735.5" font-size="14" font-weight="400" fill="#2b2a27">即清洗身体、衣服</text>
