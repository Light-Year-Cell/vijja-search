<rect x="30" y="196.1" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="233.1" font-size="26" font-weight="700" fill="#fff">第68讲-摄缘-十二</text>
<text x="48.0" y="268.2" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘68-</text>
<text x="48.0" y="303.3" font-size="26" font-weight="700" fill="#fff">离路心的缘-行缘识</text>
<text x="48.0" y="338.4" font-size="26" font-weight="700" fill="#fff">3</text>
<rect x="337.7" y="98.1" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="128.1" font-size="19" font-weight="700" fill="#2b2a27">一、行如何作为识的缘</text>
<line x1="609.7" y1="57.6" x2="791.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）福行与结生及生起</text>
<line x1="609.7" y1="97.2" x2="807.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）非福行与结生及生起</text>
<line x1="609.7" y1="136.8" x2="807.7" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三）不动行与结生及生起</text>
<line x1="609.7" y1="211.9" x2="695.7" y2="211.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="203.3" font-size="16" font-weight="500" fill="#2b2a27">（四）小结</text>
<line x1="741.7" y1="173.7" x2="791.4" y2="173.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="744.7" y="165.8" font-size="14" font-weight="400" fill="#2b2a27">1.福行</text>
<line x1="741.7" y1="210.6" x2="805.4" y2="210.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="744.7" y="202.7" font-size="14" font-weight="400" fill="#2b2a27">2.非福行</text>
<line x1="741.7" y1="247.5" x2="805.4" y2="247.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="744.7" y="239.6" font-size="14" font-weight="400" fill="#2b2a27">3.不动行</text>
<rect x="337.7" y="408.9" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="438.9" font-size="19" font-weight="700" fill="#2b2a27">二、离路心的缘</text>
<line x1="552.7" y1="308.7" x2="827.5" y2="308.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="278.5" font-size="16" font-weight="500" fill="#2b2a27">1.所缘组 1 缘，任何心生起都必须有</text>
<text x="555.7" y="300.1" font-size="16" font-weight="500" fill="#2b2a27">所缘缘</text>
<line x1="552.7" y1="369.9" x2="829.4" y2="369.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="339.7" font-size="16" font-weight="500" fill="#2b2a27">2.异业组 2 缘， 由于行缘识， 所以</text>
<text x="555.7" y="361.3" font-size="16" font-weight="500" fill="#2b2a27">果报识必须有异刹那业缘及自</text>
<line x1="552.7" y1="431.1" x2="820.4" y2="431.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="400.9" font-size="16" font-weight="500" fill="#2b2a27">3.依处俱生组 6 缘， 对于五蕴界生</text>
<text x="555.7" y="422.5" font-size="16" font-weight="500" fill="#2b2a27">命而言， 心的生起必须有心所</text>
<line x1="552.7" y1="492.3" x2="820.4" y2="492.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="462.1" font-size="16" font-weight="500" fill="#2b2a27">4.无间组 5 缘， 前心与后心是无间</text>
<text x="555.7" y="483.7" font-size="16" font-weight="500" fill="#2b2a27">的、 相续的， 所以必定有无间</text>
<line x1="552.7" y1="553.5" x2="822.4" y2="553.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="523.3" font-size="16" font-weight="500" fill="#2b2a27">5.名俱生组，①有因结生 13 缘；②无</text>
<text x="555.7" y="544.9" font-size="16" font-weight="500" fill="#2b2a27">因结生 11 缘</text>
<line x1="552.7" y1="593.1" x2="782.7" y2="593.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="584.5" font-size="16" font-weight="500" fill="#2b2a27">（一）欲界结生名法对名法的缘</text>
</svg>