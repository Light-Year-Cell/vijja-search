<rect x="30" y="550.1" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="587.1" font-size="26" font-weight="700" fill="#fff">第6讲-摄缘-十二缘</text>
<text x="48.0" y="622.2" font-size="26" font-weight="700" fill="#fff">起与二十四缘6-缘</text>
<text x="48.0" y="657.3" font-size="26" font-weight="700" fill="#fff">起支1</text>
<rect x="337.7" y="345.8" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="375.8" font-size="19" font-weight="700" fill="#2b2a27">一、引言</text>
<line x1="495.7" y1="117.8" x2="709.7" y2="117.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="109.2" font-size="16" font-weight="500" fill="#2b2a27">（一）考虑缘起解说者的素质</text>
<line x1="755.7" y1="72.0" x2="841.2" y2="72.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="758.7" y="64.1" font-size="14" font-weight="400" fill="#2b2a27">1. 论文释义</text>
<line x1="887.2" y1="53.5" x2="1030.5" y2="53.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="890.2" y="46.0" font-size="13" font-weight="400" fill="#2b2a27">（1）什么是分别说者？</text>
<line x1="887.2" y1="89.1" x2="1019.0" y2="89.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="890.2" y="81.5" font-size="13" font-weight="400" fill="#2b2a27">（2）“分别说者”举例</text>
<line x1="755.7" y1="160.9" x2="841.2" y2="160.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="758.7" y="153.0" font-size="14" font-weight="400" fill="#2b2a27">2. 论文释义</text>
<line x1="887.2" y1="124.6" x2="1017.5" y2="124.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="890.2" y="117.1" font-size="13" font-weight="400" fill="#2b2a27">（1）经中的四大引据</text>
<line x1="887.2" y1="160.2" x2="1017.5" y2="160.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="890.2" y="152.6" font-size="13" font-weight="400" fill="#2b2a27">（2）律中的四大引据</text>
<line x1="887.2" y1="195.8" x2="1043.5" y2="195.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="890.2" y="188.2" font-size="13" font-weight="400" fill="#2b2a27">（3）注释书中的四大引据</text>
<line x1="495.7" y1="434.9" x2="677.7" y2="434.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="426.3" font-size="16" font-weight="500" fill="#2b2a27">（二）解释缘起之义困难</text>
<line x1="723.7" y1="307.2" x2="907.2" y2="307.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="726.7" y="299.3" font-size="14" font-weight="400" fill="#2b2a27">1. 四法极难理解也不易教授</text>
<line x1="953.2" y1="248.8" x2="1199.4" y2="248.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="956.2" y="223.8" font-size="13" font-weight="400" fill="#2b2a27">（1）第一个是“sacca”圣谛，什么是苦，</text>
<text x="956.2" y="241.3" font-size="13" font-weight="400" fill="#2b2a27">什么是苦的原因</text>
<line x1="953.2" y1="302.0" x2="1195.3" y2="302.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="956.2" y="276.9" font-size="13" font-weight="400" fill="#2b2a27">（2）第二个是“satta”有情众生。31 界</text>
<text x="956.2" y="294.4" font-size="13" font-weight="400" fill="#2b2a27">的生命非常复杂多</text>
<line x1="953.2" y1="337.5" x2="1157.8" y2="337.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="956.2" y="330.0" font-size="13" font-weight="400" fill="#2b2a27">（3）第三个是结生“paṭisandhi”</text>
<line x1="953.2" y1="373.1" x2="1139.1" y2="373.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="956.2" y="365.5" font-size="13" font-weight="400" fill="#2b2a27">（4）第四个是“paccayākāra”</text>
<line x1="723.7" y1="466.8" x2="879.2" y2="466.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="726.7" y="458.9" font-size="14" font-weight="400" fill="#2b2a27">1. 阿难尊者的四个素质</text>
<line x1="925.2" y1="426.2" x2="1174.0" y2="426.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="928.2" y="401.1" font-size="13" font-weight="400" fill="#2b2a27">（1） 首先是过去亲依止缘的成就。 在十</text>
<text x="928.2" y="418.6" font-size="13" font-weight="400" fill="#2b2a27">万劫前胜莲花佛时代</text>
<line x1="925.2" y1="479.3" x2="1166.8" y2="479.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="928.2" y="454.2" font-size="13" font-weight="400" fill="#2b2a27">（2） 第二个阿难尊者可以进入并住于教</text>
<text x="928.2" y="471.7" font-size="13" font-weight="400" fill="#2b2a27">法的港岸。 因为阿难</text>
<line x1="925.2" y1="514.8" x2="1029.5" y2="514.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="928.2" y="507.3" font-size="13" font-weight="400" fill="#2b2a27">（4）第四个素质</text>
<line x1="723.7" y1="559.8" x2="879.2" y2="559.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="726.7" y="551.9" font-size="14" font-weight="400" fill="#2b2a27">2. 缘起的四种深奥含义</text>
<line x1="925.2" y1="567.9" x2="1177.7" y2="567.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="928.2" y="542.8" font-size="13" font-weight="400" fill="#2b2a27">（1）一个是意义的深奥“atthagambhīrat</text>
<text x="928.2" y="560.4" font-size="13" font-weight="400" fill="#2b2a27">ā”</text>
<line x1="495.7" y1="607.5" x2="661.7" y2="607.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="598.9" font-size="16" font-weight="500" fill="#2b2a27">（三）依于二者说缘起</text>
<line x1="495.7" y1="647.1" x2="725.7" y2="647.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="638.5" font-size="16" font-weight="500" fill="#2b2a27">（四）听闻缘起能获得殊胜利益</text>
<rect x="337.7" y="834.1" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="864.1" font-size="19" font-weight="700" fill="#2b2a27">二、解释各缘起支</text>
<line x1="571.7" y1="731.7" x2="785.7" y2="731.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="723.1" font-size="16" font-weight="500" fill="#2b2a27">（一）解释缘起支的五种方式</text>
<line x1="831.7" y1="684.0" x2="1027.0" y2="684.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="834.7" y="676.1" font-size="14" font-weight="400" fill="#2b2a27">1.第一个是“desanābhedato”</text>
<line x1="831.7" y1="739.8" x2="1090.8" y2="739.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="834.7" y="713.0" font-size="14" font-weight="400" fill="#2b2a27">3.第三是“lakkhaṇādito”以“相”等，每</text>
<text x="834.7" y="731.9" font-size="14" font-weight="400" fill="#2b2a27">一个缘起支都有它</text>
<line x1="831.7" y1="776.7" x2="991.1" y2="776.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="834.7" y="768.8" font-size="14" font-weight="400" fill="#2b2a27">4.第四“ekavidhādito”</text>
<line x1="571.7" y1="1009.8" x2="673.7" y2="1009.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="1001.2" font-size="16" font-weight="500" fill="#2b2a27">（二）方式一</text>
<line x1="719.7" y1="848.5" x2="923.4" y2="848.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="840.6" font-size="14" font-weight="400" fill="#2b2a27">1.从最初至最后（顺说）说缘起</text>
<line x1="969.4" y1="812.2" x2="1086.6" y2="812.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="972.4" y="804.7" font-size="13" font-weight="400" fill="#2b2a27">（1）圣典中如此说</text>
<line x1="969.4" y1="847.8" x2="1112.6" y2="847.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="972.4" y="840.2" font-size="13" font-weight="400" fill="#2b2a27">（2）《清净之道》比喻</text>
<line x1="969.4" y1="883.3" x2="1034.6" y2="883.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="972.4" y="875.8" font-size="13" font-weight="400" fill="#2b2a27">（3）原因</text>
<line x1="719.7" y1="955.1" x2="867.4" y2="955.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="947.2" font-size="14" font-weight="400" fill="#2b2a27">2.从中间至最后说缘起</text>
<line x1="913.4" y1="918.9" x2="1017.6" y2="918.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="916.4" y="911.3" font-size="13" font-weight="400" fill="#2b2a27">（1）经典如此说</text>
<line x1="913.4" y1="954.4" x2="1056.6" y2="954.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="916.4" y="946.9" font-size="13" font-weight="400" fill="#2b2a27">（2）《清净之道》比喻</text>
<line x1="913.4" y1="990.0" x2="978.6" y2="990.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="916.4" y="982.4" font-size="13" font-weight="400" fill="#2b2a27">（3）原因</text>
<line x1="719.7" y1="1061.8" x2="909.4" y2="1061.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="1053.9" font-size="14" font-weight="400" fill="#2b2a27">3.从最后至最初（逆说）缘起</text>
<line x1="955.4" y1="1025.5" x2="1072.6" y2="1025.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="958.4" y="1018.0" font-size="13" font-weight="400" fill="#2b2a27">（1）圣典中如此说</text>
<line x1="955.4" y1="1061.1" x2="1098.6" y2="1061.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="958.4" y="1053.5" font-size="13" font-weight="400" fill="#2b2a27">（2）《清净之道》比喻</text>
<line x1="955.4" y1="1096.6" x2="1020.6" y2="1096.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="958.4" y="1089.1" font-size="13" font-weight="400" fill="#2b2a27">（3）原因</text>
<line x1="719.7" y1="1168.4" x2="867.4" y2="1168.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="722.7" y="1160.5" font-size="14" font-weight="400" fill="#2b2a27">4.从中间至最初说缘起</text>
<line x1="913.4" y1="1132.2" x2="1030.6" y2="1132.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="916.4" y="1124.6" font-size="13" font-weight="400" fill="#2b2a27">（1）圣典中如此说</text>
<line x1="913.4" y1="1167.7" x2="1056.6" y2="1167.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
