<rect x="30" y="436.3" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="473.3" font-size="26" font-weight="700" fill="#fff">第45讲-摄缘-十二</text>
<text x="48.0" y="508.4" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘45-</text>
<text x="48.0" y="543.5" font-size="26" font-weight="700" fill="#fff">释二十四缘-业缘7</text>
<rect x="337.7" y="476.2" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="506.2" font-size="19" font-weight="700" fill="#2b2a27">七、生活中的业缘</text>
<line x1="571.7" y1="512.8" x2="689.7" y2="512.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="504.2" font-size="16" font-weight="500" fill="#2b2a27">（二）止恶扬善</text>
<line x1="735.7" y1="54.9" x2="793.2" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1. 持戒</text>
<line x1="839.2" y1="53.5" x2="930.5" y2="53.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.2" y="46.0" font-size="13" font-weight="400" fill="#2b2a27">（3）持戒之业</text>
<line x1="735.7" y1="281.6" x2="785.4" y2="281.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="273.7" font-size="14" font-weight="400" fill="#2b2a27">2.布施</text>
<line x1="831.4" y1="90.5" x2="922.6" y2="90.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="82.9" font-size="13" font-weight="400" fill="#2b2a27">（1）布施之业</text>
<line x1="831.4" y1="143.6" x2="1080.2" y2="143.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="118.5" font-size="13" font-weight="400" fill="#2b2a27">(1)布施者以邪命获得布施物。（例如：以</text>
<text x="834.4" y="136.0" font-size="13" font-weight="400" fill="#2b2a27">杀生、偷盗、邪淫、</text>
<line x1="831.4" y1="196.7" x2="1080.2" y2="196.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="171.6" font-size="13" font-weight="400" fill="#2b2a27">(2)布施者的戒低劣或者无戒，即只是持某</text>
<text x="834.4" y="189.1" font-size="13" font-weight="400" fill="#2b2a27">一些戒或者完全不持</text>
<line x1="831.4" y1="249.8" x2="1080.2" y2="249.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="224.7" font-size="13" font-weight="400" fill="#2b2a27">(3)在布施当下生起的业识之前或之后，布</text>
<text x="834.4" y="242.2" font-size="13" font-weight="400" fill="#2b2a27">施者的心与不善法相</text>
<line x1="831.4" y1="302.9" x2="1080.2" y2="302.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="277.8" font-size="13" font-weight="400" fill="#2b2a27">(4)受施者的戒行低劣或者无戒，即只持某</text>
<text x="834.4" y="295.3" font-size="13" font-weight="400" fill="#2b2a27">一些戒或者完全不持</text>
<line x1="831.4" y1="338.4" x2="1002.2" y2="338.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="330.9" font-size="13" font-weight="400" fill="#2b2a27">(1)布施者以正命获得布施物</text>
<line x1="831.4" y1="374.0" x2="1041.2" y2="374.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="366.4" font-size="13" font-weight="400" fill="#2b2a27">(2)布施者有良好的戒德，持戒清净</text>
<line x1="831.4" y1="427.1" x2="1080.2" y2="427.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="402.0" font-size="13" font-weight="400" fill="#2b2a27">(3)在布施当下生起的业识之前与之后，布</text>
<text x="834.4" y="419.5" font-size="13" font-weight="400" fill="#2b2a27">施者的心都与善法相</text>
<line x1="831.4" y1="480.2" x2="1080.2" y2="480.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="455.1" font-size="13" font-weight="400" fill="#2b2a27">(4)受施者有良好的戒德，持戒清净。极殊</text>
<text x="834.4" y="472.6" font-size="13" font-weight="400" fill="#2b2a27">胜的受施者当然是佛</text>
<line x1="735.7" y1="534.2" x2="785.4" y2="534.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="526.2" font-size="14" font-weight="400" fill="#2b2a27">3.禅修</text>
<line x1="831.4" y1="515.7" x2="935.6" y2="515.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="508.2" font-size="13" font-weight="400" fill="#2b2a27">（1）止禅的运作</text>
<line x1="831.4" y1="551.2" x2="935.6" y2="551.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="834.4" y="543.7" font-size="13" font-weight="400" fill="#2b2a27">（2）观禅的运作</text>
<line x1="735.7" y1="649.3" x2="967.4" y2="649.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="641.4" font-size="14" font-weight="400" fill="#2b2a27">4.善用业的同一性理，造下殊胜善业</text>
<line x1="1013.4" y1="604.4" x2="1263.8" y2="604.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1016.4" y="579.2" font-size="13" font-weight="400" fill="#2b2a27">(1) 其中， 第一个速行心所造的善业在遇</text>
<text x="1016.4" y="596.8" font-size="13" font-weight="400" fill="#2b2a27">到合适的因缘时， 将能</text>
<line x1="1013.4" y1="657.5" x2="1256.5" y2="657.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1016.4" y="632.4" font-size="13" font-weight="400" fill="#2b2a27">(2) 如果其中一个第七速行心所造的善业</text>
<text x="1016.4" y="649.9" font-size="13" font-weight="400" fill="#2b2a27">能在我们今生临终时</text>
<line x1="1013.4" y1="710.6" x2="1256.5" y2="710.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1016.4" y="685.5" font-size="13" font-weight="400" fill="#2b2a27">(3) 第二到第六速行心所造的善业将能在</text>
<text x="1016.4" y="703.0" font-size="13" font-weight="400" fill="#2b2a27">我们下一生之后的未</text>
<line x1="735.7" y1="808.6" x2="869.4" y2="808.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="800.8" font-size="14" font-weight="400" fill="#2b2a27">5.善恶报交织的例子</text>
<line x1="915.4" y1="763.7" x2="1164.2" y2="763.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="918.4" y="738.6" font-size="13" font-weight="400" fill="#2b2a27">(1)当我们体内的业生色聚达到住时的时候</text>
<text x="918.4" y="756.1" font-size="13" font-weight="400" fill="#2b2a27">，其中的火界可以产</text>
<line x1="915.4" y1="816.8" x2="1164.2" y2="816.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="918.4" y="791.7" font-size="13" font-weight="400" fill="#2b2a27">(2)佛陀三种身光中的寻光和八十不动光，</text>
<text x="918.4" y="809.2" font-size="13" font-weight="400" fill="#2b2a27">称为业缘时节生色的</text>
<line x1="915.4" y1="869.9" x2="1164.2" y2="869.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="918.4" y="844.8" font-size="13" font-weight="400" fill="#2b2a27">(3)天界的某些宫殿、地狱的刑具以及转轮</text>
<text x="918.4" y="862.3" font-size="13" font-weight="400" fill="#2b2a27">王的轮宝</text>
<line x1="735.7" y1="968.0" x2="953.4" y2="968.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="738.7" y="960.1" font-size="14" font-weight="400" fill="#2b2a27">6.善用方式成就，规避不善促成善</text>
<line x1="999.4" y1="923.0" x2="1248.2" y2="923.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1002.4" y="897.9" font-size="13" font-weight="400" fill="#2b2a27">(1)对于我们今生中已造下的不善业，其中</text>
<text x="1002.4" y="915.4" font-size="13" font-weight="400" fill="#2b2a27">的第一速行心所造的</text>
<line x1="999.4" y1="976.1" x2="1242.5" y2="976.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1002.4" y="951.0" font-size="13" font-weight="400" fill="#2b2a27">(2)对于我们今生中已造下的善业， 其中</text>
<text x="1002.4" y="968.5" font-size="13" font-weight="400" fill="#2b2a27">的第一速行心所造的业</text>
<line x1="999.4" y1="1029.2" x2="1248.2" y2="1029.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1002.4" y="1004.1" font-size="13" font-weight="400" fill="#2b2a27">(3)虽然我们不知道自己过去生曾经做过什</text>
<text x="1002.4" y="1021.6" font-size="13" font-weight="400" fill="#2b2a27">么，但是上一生所造</text>
</svg>