<rect x="30" y="516.3" width="253.4" height="92.2" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="553.3" font-size="26" font-weight="700" fill="#fff">155讲-摄集3-四漏</text>
<text x="48.0" y="588.4" font-size="26" font-weight="700" fill="#fff">四暴流</text>
<rect x="329.4" y="40.8" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="347.4" y="70.8" font-size="19" font-weight="700" fill="#2b2a27">一、引言</text>
<line x1="487.4" y1="57.6" x2="669.4" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="490.4" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）回顾上堂课的内容</text>
<line x1="487.4" y1="97.2" x2="733.4" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="490.4" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）九根爱法（贪源法）的定义</text>
<rect x="329.4" y="203.9" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="347.4" y="233.9" font-size="19" font-weight="700" fill="#2b2a27">二、两种无明</text>
<line x1="525.4" y1="136.8" x2="771.4" y2="136.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="528.4" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（一）贪的根源是由于根本的无明</text>
<line x1="525.4" y1="176.4" x2="739.4" y2="176.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="528.4" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">（二）临死速行业的无明爱取</text>
<line x1="525.4" y1="355.1" x2="803.4" y2="355.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="528.4" y="324.9" font-size="16" font-weight="500" fill="#2b2a27">（三）生命的食粮短缺所形成的生存与</text>
<text x="528.4" y="346.5" font-size="16" font-weight="500" fill="#2b2a27">繁衍机制</text>
<line x1="849.4" y1="213.3" x2="955.0" y2="213.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.4" y="205.4" font-size="14" font-weight="400" fill="#2b2a27">1.生命食粮概念</text>
<line x1="849.4" y1="250.2" x2="1053.0" y2="250.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.4" y="242.3" font-size="14" font-weight="400" fill="#2b2a27">2.渴爱生命形成生存与繁衍机制</text>
<line x1="849.4" y1="287.1" x2="1025.0" y2="287.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.4" y="279.2" font-size="14" font-weight="400" fill="#2b2a27">3.禅修者过去世为鸡的启示</text>
<line x1="849.4" y1="342.9" x2="1118.6" y2="342.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.4" y="316.1" font-size="14" font-weight="400" fill="#2b2a27">4.(1)雷瓦达尊者举例投生为狗的生存繁衍</text>
<text x="852.4" y="335.0" font-size="14" font-weight="400" fill="#2b2a27">机制</text>
<line x1="849.4" y1="398.7" x2="1118.6" y2="398.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.4" y="371.9" font-size="14" font-weight="400" fill="#2b2a27">4.(2)人类祖先由于贪，成为现代人类的过</text>
<text x="852.4" y="390.8" font-size="14" font-weight="400" fill="#2b2a27">程</text>
<line x1="849.4" y1="435.6" x2="1118.6" y2="435.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.4" y="427.7" font-size="14" font-weight="400" fill="#2b2a27">4.(3)现在的人类生存环境带来食粮的变化</text>
<line x1="849.4" y1="472.5" x2="1090.6" y2="472.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="852.4" y="464.6" font-size="14" font-weight="400" fill="#2b2a27">4.(4)抑郁症的增多的根本原因是无明</text>
<rect x="329.4" y="484.5" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="347.4" y="514.5" font-size="19" font-weight="700" fill="#2b2a27">三、生命中的漏</text>
<rect x="329.4" y="552.9" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="347.4" y="582.9" font-size="19" font-weight="700" fill="#2b2a27">四、奖励机制与保护机制</text>
<line x1="620.4" y1="569.8" x2="738.4" y2="569.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="623.4" y="561.1" font-size="16" font-weight="500" fill="#2b2a27">（一）奖励机制</text>
<line x1="620.4" y1="609.4" x2="738.4" y2="609.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="623.4" y="600.8" font-size="16" font-weight="500" fill="#2b2a27">（二）保护机制</text>
<rect x="329.4" y="671.7" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="347.4" y="701.7" font-size="19" font-weight="700" fill="#2b2a27">五、关于想蕴梳理</text>
<line x1="563.4" y1="649.0" x2="729.4" y2="649.0" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="566.4" y="640.4" font-size="16" font-weight="500" fill="#2b2a27">（一）想蕴梳理的原理</text>
<line x1="563.4" y1="688.6" x2="761.4" y2="688.6" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="566.4" y="680.0" font-size="16" font-weight="500" fill="#2b2a27">（二）想蕴梳理的举例分析</text>
<line x1="563.4" y1="728.2" x2="825.4" y2="728.2" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="566.4" y="719.6" font-size="16" font-weight="500" fill="#2b2a27">（三）想蕴形成过程中出现的三颠倒</text>
<line x1="563.4" y1="767.8" x2="745.4" y2="767.8" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="566.4" y="759.2" font-size="16" font-weight="500" fill="#2b2a27">（四）瞋行、贪行的体现</text>
<rect x="329.4" y="779.8" width="293.6" height="73.3" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="347.4" y="809.8" font-size="19" font-weight="700" fill="#2b2a27">六、 《燃烧经》所描述的无常</text>
<text x="347.4" y="835.4" font-size="19" font-weight="700" fill="#2b2a27">、苦</text>
<rect x="329.4" y="863.1" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="347.4" y="893.1" font-size="19" font-weight="700" fill="#2b2a27">七、由于不同的贪著导致不同的</text>
<text x="347.4" y="918.7" font-size="19" font-weight="700" fill="#2b2a27">结生</text>
<rect x="329.4" y="1036.3" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#8a6d3b" stroke-width="2.2"/>
<text x="347.4" y="1066.3" font-size="19" font-weight="700" fill="#2b2a27">八、断除烦恼的方法与建议</text>
<line x1="639.4" y1="974.0" x2="757.4" y2="974.0" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="642.4" y="965.4" font-size="16" font-weight="500" fill="#2b2a27">（一）接受果报</text>
<line x1="639.4" y1="1013.6" x2="757.4" y2="1013.6" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="642.4" y="1005.0" font-size="16" font-weight="500" fill="#2b2a27">（二）分析原因</text>
<line x1="639.4" y1="1053.2" x2="773.4" y2="1053.2" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="642.4" y="1044.6" font-size="16" font-weight="500" fill="#2b2a27">（三）努力做福行</text>
<line x1="639.4" y1="1092.8" x2="885.4" y2="1092.8" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="642.4" y="1084.2" font-size="16" font-weight="500" fill="#2b2a27">（四）面对烦恼的态度与处理方式</text>
<line x1="639.4" y1="1132.3" x2="789.4" y2="1132.3" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="642.4" y="1123.8" font-size="16" font-weight="500" fill="#2b2a27">（五）稻草人的举例</text>
<line x1="639.4" y1="1171.9" x2="789.4" y2="1171.9" stroke="#8a6d3b" stroke-width="1.6" opacity=".8"/>
<text x="642.4" y="1163.3" font-size="16" font-weight="500" fill="#2b2a27">（六）如何渡过暴流</text>
</svg>