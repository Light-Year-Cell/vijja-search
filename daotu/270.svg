<rect x="30" y="499.2" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="536.2" font-size="26" font-weight="700" fill="#fff">第74讲-摄缘-十二</text>
<text x="48.0" y="571.3" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘74-</text>
<text x="48.0" y="606.4" font-size="26" font-weight="700" fill="#fff">离路心的缘-识缘名</text>
<text x="48.0" y="641.5" font-size="26" font-weight="700" fill="#fff">色</text>
<rect x="337.7" y="30.0" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、以名色的分别</text>
<rect x="337.7" y="449.0" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="479.0" font-size="19" font-weight="700" fill="#2b2a27">二、以于有等的转起</text>
<line x1="590.7" y1="115.2" x2="815.6" y2="115.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="106.7" font-size="16" font-weight="500" fill="#2b2a27">(7)无所有处：无所有处的天人</text>
<line x1="590.7" y1="154.8" x2="815.6" y2="154.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="146.2" font-size="16" font-weight="500" fill="#2b2a27">(6)识无边处：识无边处的天人</text>
<line x1="590.7" y1="194.4" x2="815.6" y2="194.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="185.8" font-size="16" font-weight="500" fill="#2b2a27">(5)空无边处：空无边处的天人</text>
<line x1="590.7" y1="255.6" x2="863.6" y2="255.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="225.4" font-size="16" font-weight="500" fill="#2b2a27">(4)一种身一种想：三禅、四禅天的天</text>
<text x="593.7" y="247.0" font-size="16" font-weight="500" fill="#2b2a27">人</text>
<line x1="590.7" y1="295.2" x2="783.6" y2="295.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="286.6" font-size="16" font-weight="500" fill="#2b2a27">(3)一种身种种想：二禅天</text>
<line x1="590.7" y1="356.4" x2="863.6" y2="356.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="326.2" font-size="16" font-weight="500" fill="#2b2a27">(2)种种身一种想：化生的初禅天的天</text>
<text x="593.7" y="347.9" font-size="16" font-weight="500" fill="#2b2a27">人</text>
<line x1="590.7" y1="417.6" x2="863.6" y2="417.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="387.4" font-size="16" font-weight="500" fill="#2b2a27">(1)种种身种种想：指人和欲界天的生</text>
<text x="593.7" y="409.1" font-size="16" font-weight="500" fill="#2b2a27">命</text>
<line x1="590.7" y1="604.9" x2="836.7" y2="604.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="596.2" font-size="16" font-weight="500" fill="#2b2a27">（一）以识为缘而生起的结生名色</text>
<line x1="882.7" y1="473.4" x2="1151.9" y2="473.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="885.7" y="446.6" font-size="14" font-weight="400" fill="#2b2a27">(1)无性(无男女性)的胎生者及卵生者在结</text>
<text x="885.7" y="465.5" font-size="14" font-weight="400" fill="#2b2a27">生的刹那， 而所依 【心</text>
<line x1="882.7" y1="529.2" x2="1144.0" y2="529.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="885.7" y="502.4" font-size="14" font-weight="400" fill="#2b2a27">(3)因为在化生的有情中， 于梵众天等的</text>
<text x="885.7" y="521.4" font-size="14" font-weight="400" fill="#2b2a27">结生的刹那， 而眼、 耳、</text>
<line x1="882.7" y1="585.0" x2="1150.2" y2="585.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="885.7" y="558.2" font-size="14" font-weight="400" fill="#2b2a27">(4)其次于欲有，因为其余的化生者、湿生</text>
<text x="885.7" y="577.1" font-size="14" font-weight="400" fill="#2b2a27">者或有性而具(内六)</text>
<line x1="882.7" y1="640.8" x2="1150.2" y2="640.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="885.7" y="614.0" font-size="14" font-weight="400" fill="#2b2a27">(5)但依劣者，减去其缺乏的色相续要目，</text>
<text x="885.7" y="632.9" font-size="14" font-weight="400" fill="#2b2a27">其简与详，当知予结</text>
<line x1="882.7" y1="696.6" x2="1145.7" y2="696.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="885.7" y="669.8" font-size="14" font-weight="400" fill="#2b2a27">(6)于无色(有的结生)者，只有三非色蕴(</text>
<text x="885.7" y="688.7" font-size="14" font-weight="400" fill="#2b2a27">现前)</text>
<line x1="882.7" y1="752.4" x2="1151.9" y2="752.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="885.7" y="725.6" font-size="14" font-weight="400" fill="#2b2a27">(7)于无想(有的结生)者，只有色的命根九</text>
<text x="885.7" y="744.5" font-size="14" font-weight="400" fill="#2b2a27">法(现前)</text>
<line x1="590.7" y1="866.7" x2="868.7" y2="866.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="836.5" font-size="16" font-weight="500" fill="#2b2a27">（二）以识为缘而生起的生命期间（除</text>
<text x="593.7" y="858.1" font-size="16" font-weight="500" fill="#2b2a27">结生）的名色</text>
<line x1="914.7" y1="808.2" x2="1176.0" y2="808.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="917.7" y="781.4" font-size="14" font-weight="400" fill="#2b2a27">(8) 在生命期间，于一切有色转起的地方</text>
<text x="917.7" y="800.3" font-size="14" font-weight="400" fill="#2b2a27">，于结生心的住刹那</text>
<line x1="914.7" y1="864.0" x2="1182.2" y2="864.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="917.7" y="837.2" font-size="14" font-weight="400" fill="#2b2a27">(9)于声现前之时，在结生之后由转起的时</text>
<text x="917.7" y="856.1" font-size="14" font-weight="400" fill="#2b2a27">节及心(转起)的声九</text>
<line x1="914.7" y1="919.8" x2="1176.0" y2="919.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="917.7" y="893.0" font-size="14" font-weight="400" fill="#2b2a27">(10)至于依段食而活命的那些胎生的有情</text>
<text x="917.7" y="911.9" font-size="14" font-weight="400" fill="#2b2a27">，由于此等之语</text>
<rect x="337.7" y="931.8" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="961.8" font-size="19" font-weight="700" fill="#2b2a27">三、以摄</text>
<rect x="337.7" y="1083.1" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="1113.1" font-size="19" font-weight="700" fill="#2b2a27">四、以缘的方法</text>
<line x1="552.7" y1="1038.7" x2="827.5" y2="1038.7" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="1008.5" font-size="16" font-weight="500" fill="#2b2a27">(2)于结生(的异熟识)对于所依色，由</text>
<text x="555.7" y="1030.1" font-size="16" font-weight="500" fill="#2b2a27">俱生、相互、依止、异熟、</text>
<line x1="552.7" y1="1099.9" x2="825.6" y2="1099.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="1069.7" font-size="16" font-weight="500" fill="#2b2a27">(3)除了所依色，对于其他的色，即于</text>
<text x="555.7" y="1091.3" font-size="16" font-weight="500" fill="#2b2a27">上面的九(缘)中除去一相</text>
<line x1="552.7" y1="1161.1" x2="825.6" y2="1161.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="1130.9" font-size="16" font-weight="500" fill="#2b2a27">(4)其次行作识对于无想有情的色，或</text>
<text x="555.7" y="1152.5" font-size="16" font-weight="500" fill="#2b2a27">对于五蕴有的业生色，依</text>
<line x1="552.7" y1="1222.3" x2="825.6" y2="1222.3" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="1192.1" font-size="16" font-weight="500" fill="#2b2a27">(5)其他的从最初有分开始的一切识，</text>
<text x="555.7" y="1213.7" font-size="16" font-weight="500" fill="#2b2a27">当知是它是那些名色的适</text>
</svg>