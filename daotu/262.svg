<rect x="30" y="661.2" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="698.2" font-size="26" font-weight="700" fill="#fff">第66讲-摄缘-十二</text>
<text x="48.0" y="733.3" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘66-</text>
<text x="48.0" y="768.4" font-size="26" font-weight="700" fill="#fff">离路心的缘-行缘识</text>
<text x="48.0" y="803.5" font-size="26" font-weight="700" fill="#fff">1</text>
<rect x="337.7" y="30.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">（一）以何种行为缘生起何种识</text>
<text x="355.7" y="85.7" font-size="19" font-weight="700" fill="#2b2a27">？</text>
<rect x="337.7" y="113.3" width="200.9" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="143.3" font-size="19" font-weight="700" fill="#2b2a27">（二） “识”的释义</text>
<rect x="337.7" y="171.0" width="285.3" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="201.0" font-size="19" font-weight="700" fill="#2b2a27">（三）如何得知“识”是以行为</text>
<text x="355.7" y="226.6" font-size="19" font-weight="700" fill="#2b2a27">缘而生起的？</text>
<rect x="337.7" y="401.8" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="431.8" font-size="19" font-weight="700" fill="#2b2a27">二、行与识的对应关系</text>
<line x1="609.7" y1="303.5" x2="873.6" y2="303.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="273.2" font-size="16" font-weight="500" fill="#2b2a27">（1） 「福行」有十三种思：依布施</text>
<text x="612.7" y="294.9" font-size="16" font-weight="500" fill="#2b2a27">、持戒等所生起的八种欲界善</text>
<line x1="609.7" y1="364.7" x2="873.6" y2="364.7" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="334.5" font-size="16" font-weight="500" fill="#2b2a27">（2） 「非福行」依杀生等而生起的</text>
<text x="612.7" y="356.1" font-size="16" font-weight="500" fill="#2b2a27">有十二种不善思</text>
<line x1="609.7" y1="425.9" x2="873.6" y2="425.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="395.7" font-size="16" font-weight="500" fill="#2b2a27">（3） 「不动行」依修习禅定所生起</text>
<text x="612.7" y="417.3" font-size="16" font-weight="500" fill="#2b2a27">的四种无色界善思</text>
<line x1="609.7" y1="465.5" x2="823.7" y2="465.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="456.9" font-size="16" font-weight="500" fill="#2b2a27">（一）以欲界福行为缘生起识</text>
<line x1="609.7" y1="505.1" x2="823.7" y2="505.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="496.5" font-size="16" font-weight="500" fill="#2b2a27">（二）以色界福行为缘生起识</text>
<line x1="609.7" y1="544.7" x2="807.7" y2="544.7" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="536.1" font-size="16" font-weight="500" fill="#2b2a27">（三）以非福行为缘生起识</text>
<line x1="609.7" y1="584.3" x2="807.7" y2="584.3" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="575.7" font-size="16" font-weight="500" fill="#2b2a27">（四）以不动行为缘生起识</text>
<rect x="337.7" y="740.2" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="770.2" font-size="19" font-weight="700" fill="#2b2a27">三、果报识如何生起</text>
<line x1="590.7" y1="645.5" x2="863.6" y2="645.5" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="615.3" font-size="16" font-weight="500" fill="#2b2a27">（1）在五门的善、不善果报意界【2 </text>
<text x="593.7" y="636.9" font-size="16" font-weight="500" fill="#2b2a27">领受】之后，行推度作用</text>
<line x1="590.7" y1="685.1" x2="813.6" y2="685.1" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="676.5" font-size="16" font-weight="500" fill="#2b2a27">（2）在六门行「彼所缘」作用</text>
<line x1="590.7" y1="746.3" x2="861.6" y2="746.3" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="716.1" font-size="16" font-weight="500" fill="#2b2a27">（3）由它们给予结生后，当没有断绝</text>
<text x="593.7" y="737.7" font-size="16" font-weight="500" fill="#2b2a27">，有分的心生起时，行有</text>
<line x1="590.7" y1="807.5" x2="861.6" y2="807.5" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="777.3" font-size="16" font-weight="500" fill="#2b2a27">（4）在生命的最后行死（死亡心）的</text>
<text x="593.7" y="798.9" font-size="16" font-weight="500" fill="#2b2a27">作用</text>
<line x1="590.7" y1="868.7" x2="861.6" y2="868.7" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="838.5" font-size="16" font-weight="500" fill="#2b2a27">（1）由它们给予结生后，当没有断绝</text>
<text x="593.7" y="860.1" font-size="16" font-weight="500" fill="#2b2a27">，有分的心生起时，行有</text>
<line x1="590.7" y1="929.9" x2="861.6" y2="929.9" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="899.7" font-size="16" font-weight="500" fill="#2b2a27">（2）在最后，行死的作用。其中，色</text>
<text x="593.7" y="921.3" font-size="16" font-weight="500" fill="#2b2a27">界心有固定的所依、门和</text>
<rect x="337.7" y="943.6" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="355.7" y="973.6" font-size="19" font-weight="700" fill="#2b2a27">四、界诸趣的业与结生</text>
<line x1="609.7" y1="991.1" x2="880.6" y2="991.1" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="960.9" font-size="16" font-weight="500" fill="#2b2a27">（4）略说结生心的所缘，结生心有过</text>
<text x="612.7" y="982.5" font-size="16" font-weight="500" fill="#2b2a27">去、现在、不可说三种所</text>
<rect x="337.7" y="1003.1" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="355.7" y="1033.1" font-size="19" font-weight="700" fill="#2b2a27">一、结生，生命期间的第一个心</text>
<text x="355.7" y="1058.7" font-size="19" font-weight="700" fill="#2b2a27">称为结生心；二、死亡，生命期</text>
<rect x="337.7" y="1086.4" width="293.6" height="99.0" rx="8" fill="#fff" stroke="#8a6d3b" stroke-width="2.2"/>
<text x="355.7" y="1116.4" font-size="19" font-weight="700" fill="#2b2a27">一、 五色所缘， 比如你过去</text>
<text x="355.7" y="1142.0" font-size="19" font-weight="700" fill="#2b2a27">曾经供花给佛陀， 临死时呈现</text>
<text x="355.7" y="1167.7" font-size="19" font-weight="700" fill="#2b2a27">出来的</text>
<rect x="337.7" y="1195.3" width="293.6" height="99.0" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="1225.3" font-size="19" font-weight="700" fill="#2b2a27">二、 广大心的概念所缘， 业</text>
<text x="355.7" y="1251.0" font-size="19" font-weight="700" fill="#2b2a27">相是能够维持禅那直至临终。 </text>
<text x="355.7" y="1276.6" font-size="19" font-weight="700" fill="#2b2a27">临终时</text>
<rect x="337.7" y="1394.2" width="274.6" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="1424.2" font-size="19" font-weight="700" fill="#2b2a27">一、 空无边处和无所有处的</text>
<line x1="658.3" y1="1331.9" x2="897.3" y2="1331.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="661.3" y="1323.3" font-size="16" font-weight="500" fill="#2b2a27">1、在欲界善趣造恶趣业者的结生</text>
<line x1="658.3" y1="1371.5" x2="833.3" y2="1371.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="661.3" y="1362.9" font-size="16" font-weight="500" fill="#2b2a27">2、从恶趣到善趣的结生</text>
<line x1="658.3" y1="1411.1" x2="833.3" y2="1411.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="661.3" y="1402.5" font-size="16" font-weight="500" fill="#2b2a27">3、从善趣到善趣的结生</text>
<line x1="658.3" y1="1450.7" x2="769.3" y2="1450.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="661.3" y="1442.1" font-size="16" font-weight="500" fill="#2b2a27">4、色界的结生</text>
<line x1="658.3" y1="1490.2" x2="785.3" y2="1490.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="661.3" y="1481.7" font-size="16" font-weight="500" fill="#2b2a27">5、无色界的结生</text>
<line x1="658.3" y1="1529.8" x2="833.3" y2="1529.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="661.3" y="1521.2" font-size="16" font-weight="500" fill="#2b2a27">6、从恶趣到恶趣的结生</text>
</svg>