<rect x="30" y="1221.2" width="267.9" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="1258.2" font-size="26" font-weight="700" fill="#fff">192讲-摄集40-摄菩</text>
<text x="48.0" y="1293.3" font-size="26" font-weight="700" fill="#fff">提分-法念处-七觉</text>
<text x="48.0" y="1328.4" font-size="26" font-weight="700" fill="#fff">支2</text>
<rect x="343.9" y="31.8" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="61.8" font-size="19" font-weight="700" fill="#2b2a27">一、择法觉支</text>
<line x1="539.9" y1="79.2" x2="807.7" y2="79.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">3.平衡五根；4.远离愚痴的人；5.思</text>
<text x="542.9" y="70.6" font-size="16" font-weight="500" fill="#2b2a27">惟难以知见的诸蕴、处、界等</text>
<rect x="343.9" y="599.7" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="629.7" font-size="19" font-weight="700" fill="#2b2a27">二、精进觉支</text>
<line x1="539.9" y1="118.8" x2="684.8" y2="118.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">1. 思惟恶道的危险</text>
<line x1="539.9" y1="158.4" x2="684.8" y2="158.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="149.8" font-size="16" font-weight="500" fill="#2b2a27">2. 明白精进的利益</text>
<line x1="539.9" y1="198.0" x2="668.8" y2="198.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="189.4" font-size="16" font-weight="500" fill="#2b2a27">3. 思惟所行的道</text>
<line x1="539.9" y1="237.6" x2="636.8" y2="237.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="229.0" font-size="16" font-weight="500" fill="#2b2a27">4. 恭敬钵食</text>
<line x1="539.9" y1="277.2" x2="684.8" y2="277.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="268.6" font-size="16" font-weight="500" fill="#2b2a27">5. 思惟遗产的殊胜</text>
<line x1="539.9" y1="316.8" x2="684.8" y2="316.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="308.2" font-size="16" font-weight="500" fill="#2b2a27">6. 思惟导师的伟大</text>
<line x1="539.9" y1="356.4" x2="684.8" y2="356.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="347.8" font-size="16" font-weight="500" fill="#2b2a27">7. 思惟传承的殊胜</text>
<line x1="539.9" y1="396.0" x2="716.8" y2="396.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="387.4" font-size="16" font-weight="500" fill="#2b2a27">8. 思惟梵行同修的伟大</text>
<line x1="539.9" y1="435.6" x2="668.8" y2="435.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="427.0" font-size="16" font-weight="500" fill="#2b2a27">9. 远离怠惰的人</text>
<line x1="539.9" y1="475.2" x2="677.8" y2="475.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="466.6" font-size="16" font-weight="500" fill="#2b2a27">10. 和精进者相处</text>
<line x1="539.9" y1="514.8" x2="725.8" y2="514.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="506.2" font-size="16" font-weight="500" fill="#2b2a27">11. 倾向于培育精进觉支</text>
<line x1="539.9" y1="554.4" x2="705.9" y2="554.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="545.8" font-size="16" font-weight="500" fill="#2b2a27">（一）思惟恶道的危险</text>
<line x1="539.9" y1="594.0" x2="705.9" y2="594.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="585.4" font-size="16" font-weight="500" fill="#2b2a27">（二）明白精进的利益</text>
<line x1="539.9" y1="633.6" x2="689.9" y2="633.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="625.0" font-size="16" font-weight="500" fill="#2b2a27">（三）思惟所行之道</text>
<line x1="539.9" y1="673.2" x2="657.9" y2="673.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="664.6" font-size="16" font-weight="500" fill="#2b2a27">（四）恭敬钵食</text>
<line x1="539.9" y1="712.8" x2="705.9" y2="712.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="704.2" font-size="16" font-weight="500" fill="#2b2a27">（五）思惟遗产的殊胜</text>
<line x1="539.9" y1="752.4" x2="705.9" y2="752.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="743.8" font-size="16" font-weight="500" fill="#2b2a27">（六）思惟导师的伟大</text>
<line x1="539.9" y1="792.0" x2="705.9" y2="792.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="783.4" font-size="16" font-weight="500" fill="#2b2a27">（七）思惟传承的殊胜</text>
<line x1="539.9" y1="831.6" x2="737.9" y2="831.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="823.0" font-size="16" font-weight="500" fill="#2b2a27">（八）思惟梵行同修的伟大</text>
<line x1="539.9" y1="871.2" x2="689.9" y2="871.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="862.6" font-size="16" font-weight="500" fill="#2b2a27">（九）远离怠惰之人</text>
<line x1="539.9" y1="910.8" x2="689.9" y2="910.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="902.2" font-size="16" font-weight="500" fill="#2b2a27">（十）与精进者相处</text>
<line x1="539.9" y1="1153.8" x2="753.9" y2="1153.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="1145.2" font-size="16" font-weight="500" fill="#2b2a27">（十一）倾向于培育精进觉支</text>
<line x1="799.9" y1="966.6" x2="1059.6" y2="966.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.9" y="939.8" font-size="14" font-weight="400" fill="#2b2a27">1.远行之前省思远行时没有时间修行，所</text>
<text x="802.9" y="958.7" font-size="14" font-weight="400" fill="#2b2a27">以在远行之前要加倍</text>
<line x1="799.9" y1="1022.4" x2="1059.6" y2="1022.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.9" y="995.6" font-size="14" font-weight="400" fill="#2b2a27">2.在远行之后省思远行时没能好好修行，</text>
<text x="802.9" y="1014.5" font-size="14" font-weight="400" fill="#2b2a27">所以在远行之后要加</text>
<line x1="799.9" y1="1078.2" x2="1059.6" y2="1078.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.9" y="1051.4" font-size="14" font-weight="400" fill="#2b2a27">3.工作之前省思工作时没有时间修行，所</text>
<text x="802.9" y="1070.3" font-size="14" font-weight="400" fill="#2b2a27">以在工作之前要加倍</text>
<line x1="799.9" y1="1134.0" x2="1059.6" y2="1134.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.9" y="1107.2" font-size="14" font-weight="400" fill="#2b2a27">4.工作之后省思工作时没能好好修行，所</text>
<text x="802.9" y="1126.1" font-size="14" font-weight="400" fill="#2b2a27">以在工作之后要加倍</text>
<line x1="799.9" y1="1189.8" x2="1059.6" y2="1189.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.9" y="1163.0" font-size="14" font-weight="400" fill="#2b2a27">5.生病时省思病情可能恶化，所以要赶紧</text>
<text x="802.9" y="1181.9" font-size="14" font-weight="400" fill="#2b2a27">修行</text>
<line x1="799.9" y1="1245.6" x2="1059.6" y2="1245.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.9" y="1218.8" font-size="14" font-weight="400" fill="#2b2a27">6.病愈后省思生病时没能好好修行，所以</text>
<text x="802.9" y="1237.7" font-size="14" font-weight="400" fill="#2b2a27">在病愈后要加倍精进</text>
<line x1="799.9" y1="1301.4" x2="1059.6" y2="1301.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.9" y="1274.6" font-size="14" font-weight="400" fill="#2b2a27">7.得不到足够的食物时，省思吃得少可以</text>
<text x="802.9" y="1293.5" font-size="14" font-weight="400" fill="#2b2a27">身轻好修行</text>
<line x1="799.9" y1="1357.2" x2="1059.6" y2="1357.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="802.9" y="1330.4" font-size="14" font-weight="400" fill="#2b2a27">8.得到很多食物时，省思吃得饱才有力气</text>
<text x="802.9" y="1349.3" font-size="14" font-weight="400" fill="#2b2a27">修行</text>
<rect x="343.9" y="1369.2" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="1399.2" font-size="19" font-weight="700" fill="#2b2a27">三、喜觉支</text>
<rect x="343.9" y="1426.9" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="1456.9" font-size="19" font-weight="700" fill="#2b2a27">一、佛随念</text>
<rect x="343.9" y="1484.5" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="1514.5" font-size="19" font-weight="700" fill="#2b2a27">二、法随念</text>
<rect x="343.9" y="1542.2" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="1572.2" font-size="19" font-weight="700" fill="#2b2a27">三、僧随念</text>
<rect x="343.9" y="1599.8" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="361.9" y="1629.8" font-size="19" font-weight="700" fill="#2b2a27">四、戒随念</text>
