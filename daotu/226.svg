<rect x="30" y="530.9" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="567.9" font-size="26" font-weight="700" fill="#fff">第30讲-摄缘-十二</text>
<text x="48.0" y="603.0" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘30-</text>
<text x="48.0" y="638.1" font-size="26" font-weight="700" fill="#fff">释二十四缘-亲依止</text>
<text x="48.0" y="673.2" font-size="26" font-weight="700" fill="#fff">缘6</text>
<rect x="337.7" y="164.3" width="295.9" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="194.3" font-size="19" font-weight="700" fill="#2b2a27">一、 《发趣论·问分》之“不善</text>
<text x="355.7" y="220.0" font-size="19" font-weight="700" fill="#2b2a27">法对不善法的自然亲依</text>
<line x1="679.6" y1="159.3" x2="957.6" y2="159.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="682.6" y="129.1" font-size="16" font-weight="500" fill="#2b2a27">（一）以贪嗔痴等为亲依止而造作十八</text>
<text x="682.6" y="150.7" font-size="16" font-weight="500" fill="#2b2a27">种不善行</text>
<line x1="1003.6" y1="54.9" x2="1165.3" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1006.6" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1.贪欲引生十八种不善法</text>
<line x1="1003.6" y1="91.8" x2="1165.3" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1006.6" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2.嗔恚引生十八种不善法</text>
<line x1="1003.6" y1="128.7" x2="1165.3" y2="128.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1006.6" y="120.8" font-size="14" font-weight="400" fill="#2b2a27">3.愚痴引生十八种不善法</text>
<line x1="1003.6" y1="165.6" x2="1151.3" y2="165.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1006.6" y="157.7" font-size="14" font-weight="400" fill="#2b2a27">4.慢引生十八种不善法</text>
<line x1="1003.6" y1="202.5" x2="1165.3" y2="202.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1006.6" y="194.6" font-size="14" font-weight="400" fill="#2b2a27">5.邪见引生十八种不善法</text>
<line x1="1003.6" y1="239.4" x2="1165.3" y2="239.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1006.6" y="231.5" font-size="14" font-weight="400" fill="#2b2a27">6.欲愿引生十八种不善法</text>
<line x1="679.6" y1="279.0" x2="893.6" y2="279.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="682.6" y="270.4" font-size="16" font-weight="500" fill="#2b2a27">（二）贪嗔痴等引生贪嗔痴等</text>
<rect x="337.7" y="291.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="321.0" font-size="19" font-weight="700" fill="#2b2a27">一、过去的贪欲、嗔恚、愚痴、</text>
<text x="355.7" y="346.7" font-size="19" font-weight="700" fill="#2b2a27">慢、邪见、欲愿这些心的素质、</text>
<rect x="337.7" y="706.4" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="736.4" font-size="19" font-weight="700" fill="#2b2a27">二、 缘法是六种不善法， 而</text>
<text x="355.7" y="762.0" font-size="19" font-weight="700" fill="#2b2a27">缘所生法同样是这六种不善法，</text>
<text x="355.7" y="787.7" font-size="19" font-weight="700" fill="#2b2a27"> 也就</text>
<line x1="685.7" y1="633.2" x2="899.7" y2="633.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="624.6" font-size="16" font-weight="500" fill="#2b2a27">（三）十不善行引生十不善行</text>
<line x1="945.7" y1="418.1" x2="1213.2" y2="418.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="948.7" y="391.3" font-size="14" font-weight="400" fill="#2b2a27">(1)杀生，例如连环杀手，这种人杀人成性</text>
<text x="948.7" y="410.2" font-size="14" font-weight="400" fill="#2b2a27">，难以罢手</text>
<line x1="945.7" y1="473.9" x2="1213.2" y2="473.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="948.7" y="447.1" font-size="14" font-weight="400" fill="#2b2a27">(2)不与取也是这样，偷惯了连到了亲戚家</text>
<text x="948.7" y="466.0" font-size="14" font-weight="400" fill="#2b2a27">都管不住自己</text>
<line x1="945.7" y1="529.7" x2="1214.9" y2="529.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="948.7" y="502.9" font-size="14" font-weight="400" fill="#2b2a27">(3)欲邪行更是如此。 佛陀曾说， 他不见</text>
<text x="948.7" y="521.8" font-size="14" font-weight="400" fill="#2b2a27">有任何其他一种色、 声、</text>
<line x1="945.7" y1="585.5" x2="1213.2" y2="585.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="948.7" y="558.7" font-size="14" font-weight="400" fill="#2b2a27">(4)虚妄语，人们总是要用另一个谎言去掩</text>
<text x="948.7" y="577.6" font-size="14" font-weight="400" fill="#2b2a27">盖前一个谎言，于是</text>
<line x1="945.7" y1="641.3" x2="1213.2" y2="641.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="948.7" y="614.5" font-size="14" font-weight="400" fill="#2b2a27">(5)离间语，总是喜欢搬弄是非、挑拨离间</text>
<text x="948.7" y="633.4" font-size="14" font-weight="400" fill="#2b2a27">。听说宫斗剧里充满</text>
<line x1="945.7" y1="697.1" x2="1207.0" y2="697.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="948.7" y="670.3" font-size="14" font-weight="400" fill="#2b2a27">(6)粗恶语在中国非常普遍， 很多人开口</text>
<text x="948.7" y="689.2" font-size="14" font-weight="400" fill="#2b2a27">就一定加上那一句国骂</text>
<line x1="945.7" y1="752.9" x2="1213.2" y2="752.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="948.7" y="726.1" font-size="14" font-weight="400" fill="#2b2a27">(7)杂秽语极为常见。大家观察一下就知道</text>
<text x="948.7" y="745.0" font-size="14" font-weight="400" fill="#2b2a27">，每天说的大多是杂</text>
<line x1="945.7" y1="808.7" x2="1213.2" y2="808.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="948.7" y="781.9" font-size="14" font-weight="400" fill="#2b2a27">(9)嗔怒是指心怀恼害之意，希望对方被杀</text>
<text x="948.7" y="800.8" font-size="14" font-weight="400" fill="#2b2a27">、毁灭。例如一个人</text>
<line x1="945.7" y1="864.5" x2="1207.0" y2="864.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="948.7" y="837.7" font-size="14" font-weight="400" fill="#2b2a27">(10)定邪见是指虚无见、无作见、无因见</text>
<text x="948.7" y="856.6" font-size="14" font-weight="400" fill="#2b2a27">，拔无因果（认为没有</text>
<line x1="685.7" y1="904.1" x2="899.7" y2="904.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="895.5" font-size="16" font-weight="500" fill="#2b2a27">（四）六无间业引生六无间业</text>
<rect x="337.7" y="916.1" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="946.1" font-size="19" font-weight="700" fill="#2b2a27">二、如何规避不善自然亲依止缘</text>
<text x="355.7" y="971.7" font-size="19" font-weight="700" fill="#2b2a27">的传递</text>
<rect x="337.7" y="999.4" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="1029.4" font-size="19" font-weight="700" fill="#2b2a27">三、结语</text>
</svg>