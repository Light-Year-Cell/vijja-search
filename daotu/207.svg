<rect x="30" y="540.7" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="577.7" font-size="26" font-weight="700" fill="#fff">第11讲-摄缘-十二</text>
<text x="48.0" y="612.8" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘11-</text>
<text x="48.0" y="647.9" font-size="26" font-weight="700" fill="#fff">释二十四缘-因缘2</text>
<rect x="337.7" y="580.5" width="112.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="610.5" font-size="19" font-weight="700" fill="#2b2a27">一、因缘</text>
<line x1="495.7" y1="191.5" x2="677.7" y2="191.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="182.9" font-size="16" font-weight="500" fill="#2b2a27">（二）六因的特点与表现</text>
<line x1="723.7" y1="54.9" x2="806.4" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="726.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1.贪 lobha</text>
<line x1="723.7" y1="91.8" x2="828.2" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="726.7" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2.无贪 alobha</text>
<line x1="723.7" y1="159.0" x2="798.6" y2="159.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="726.7" y="151.1" font-size="14" font-weight="400" fill="#2b2a27">3.嗔 dosa</text>
<line x1="844.6" y1="144.9" x2="1095.0" y2="144.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="847.6" y="119.8" font-size="13" font-weight="400" fill="#2b2a27">(2)使身心僵硬、 粗野， 如被击的毒蛇。</text>
<text x="847.6" y="137.4" font-size="13" font-weight="400" fill="#2b2a27"> (仰起头， 张开嘴</text>
<line x1="844.6" y1="180.5" x2="1080.4" y2="180.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="847.6" y="172.9" font-size="13" font-weight="400" fill="#2b2a27">(2)燃烧自己的依处或身心，如森林大火</text>
<line x1="723.7" y1="217.3" x2="820.4" y2="217.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="726.7" y="209.4" font-size="14" font-weight="400" fill="#2b2a27">4.无嗔 adosa</text>
<line x1="723.7" y1="271.3" x2="798.6" y2="271.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="726.7" y="263.4" font-size="14" font-weight="400" fill="#2b2a27">5.痴 moha</text>
<line x1="844.6" y1="252.9" x2="1015.4" y2="252.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="847.6" y="245.3" font-size="13" font-weight="400" fill="#2b2a27">(2)覆蔽究竟法或所缘的自性</text>
<line x1="844.6" y1="288.4" x2="937.4" y2="288.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="847.6" y="280.9" font-size="13" font-weight="400" fill="#2b2a27">(2)令慧眼盲目</text>
<line x1="723.7" y1="325.3" x2="820.4" y2="325.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="726.7" y="317.4" font-size="14" font-weight="400" fill="#2b2a27">6.无痴 amoha</text>
<line x1="495.7" y1="739.1" x2="629.7" y2="739.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="730.5" font-size="16" font-weight="500" fill="#2b2a27">（三）六因与造业</text>
<line x1="675.7" y1="578.6" x2="809.4" y2="578.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="678.7" y="570.7" font-size="14" font-weight="400" fill="#2b2a27">1.不善因与十不善业</text>
<line x1="855.4" y1="378.5" x2="1104.2" y2="378.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="858.4" y="353.4" font-size="13" font-weight="400" fill="#2b2a27">(1)杀生：杀生可能出于嗔，也可能出于贪</text>
<text x="858.4" y="370.9" font-size="13" font-weight="400" fill="#2b2a27">；而只要有贪或嗔</text>
<line x1="855.4" y1="414.0" x2="1091.2" y2="414.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="858.4" y="406.5" font-size="13" font-weight="400" fill="#2b2a27">(2)不与取：偷盗的因是贪与痴或嗔与痴</text>
<line x1="855.4" y1="467.1" x2="1104.2" y2="467.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="858.4" y="442.0" font-size="13" font-weight="400" fill="#2b2a27">(3)欲邪行：欲邪行的原因是贪与痴或嗔与</text>
<text x="858.4" y="459.6" font-size="13" font-weight="400" fill="#2b2a27">痴。邪淫的对象男女</text>
<line x1="855.4" y1="520.2" x2="1104.2" y2="520.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="858.4" y="495.1" font-size="13" font-weight="400" fill="#2b2a27">(4)虚妄语：虚妄语的因是贪与痴或嗔与痴</text>
<text x="858.4" y="512.7" font-size="13" font-weight="400" fill="#2b2a27">。有人可能由于贪图</text>
<line x1="855.4" y1="573.3" x2="1104.2" y2="573.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="858.4" y="548.2" font-size="13" font-weight="400" fill="#2b2a27">(5)离间语：离间语的因是贪与痴或嗔与痴</text>
<text x="858.4" y="565.8" font-size="13" font-weight="400" fill="#2b2a27">。有人可能由于贪图</text>
<line x1="855.4" y1="626.4" x2="1104.2" y2="626.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="858.4" y="601.3" font-size="13" font-weight="400" fill="#2b2a27">(6)粗恶语：说粗恶语是因为贪与痴或嗔与</text>
<text x="858.4" y="618.9" font-size="13" font-weight="400" fill="#2b2a27">痴。跟离间语的情形</text>
<line x1="855.4" y1="679.5" x2="1104.2" y2="679.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="858.4" y="654.4" font-size="13" font-weight="400" fill="#2b2a27">(7)杂秽语：杂秽语是指各种不适时、不具</text>
<text x="858.4" y="672.0" font-size="13" font-weight="400" fill="#2b2a27">利益、漫无目的、没</text>
<line x1="855.4" y1="715.1" x2="1008.0" y2="715.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="858.4" y="707.5" font-size="13" font-weight="400" fill="#2b2a27">(8)贪婪/觊觎 abhijjhā</text>
<line x1="855.4" y1="750.6" x2="967.4" y2="750.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="858.4" y="743.1" font-size="13" font-weight="400" fill="#2b2a27">(9)嗔怒 byāpāda</text>
<line x1="855.4" y1="786.1" x2="1024.1" y2="786.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="858.4" y="778.6" font-size="13" font-weight="400" fill="#2b2a27">(10)持邪见 micchādiṭṭhi</text>
<line x1="675.7" y1="823.0" x2="795.4" y2="823.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="678.7" y="815.1" font-size="14" font-weight="400" fill="#2b2a27">2.三善因与十善业</text>
<line x1="675.7" y1="859.9" x2="823.4" y2="859.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="678.7" y="852.0" font-size="14" font-weight="400" fill="#2b2a27">3.三善因与三种福行事</text>
<line x1="675.7" y1="896.8" x2="781.4" y2="896.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="678.7" y="888.9" font-size="14" font-weight="400" fill="#2b2a27">4.三善因与明行</text>
<line x1="495.7" y1="1042.8" x2="693.7" y2="1042.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="498.7" y="1034.2" font-size="16" font-weight="500" fill="#2b2a27">（四）因缘对生命的重要性</text>
<line x1="739.7" y1="968.6" x2="831.4" y2="968.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="960.7" font-size="14" font-weight="400" fill="#2b2a27">1.因缘与结生</text>
<line x1="877.4" y1="932.4" x2="983.2" y2="932.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="880.4" y="924.8" font-size="13" font-weight="400" fill="#2b2a27">(1)三美因与结生</text>
<line x1="877.4" y1="967.9" x2="1113.2" y2="967.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="880.4" y="960.4" font-size="13" font-weight="400" fill="#2b2a27">(2)如何造下能感得殊胜果报的三因善业</text>
<line x1="877.4" y1="1003.5" x2="1048.2" y2="1003.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="880.4" y="995.9" font-size="13" font-weight="400" fill="#2b2a27">(3)有因结生名色中的因缘力</text>
<line x1="739.7" y1="1040.4" x2="831.4" y2="1040.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="1032.5" font-size="14" font-weight="400" fill="#2b2a27">2.因缘与生命</text>
<line x1="739.7" y1="1077.3" x2="831.4" y2="1077.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="1069.4" font-size="14" font-weight="400" fill="#2b2a27">3.因缘与禅修</text>
<line x1="739.7" y1="1114.2" x2="817.4" y2="1114.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="742.7" y="1106.3" font-size="14" font-weight="400" fill="#2b2a27">4.善用因缘</text>
</svg>