<rect x="30" y="254.4" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="291.4" font-size="26" font-weight="700" fill="#fff">第5讲-摄缘-十二缘</text>
<text x="48.0" y="326.5" font-size="26" font-weight="700" fill="#fff">起与二十四缘5-缘</text>
<text x="48.0" y="361.6" font-size="26" font-weight="700" fill="#fff">概说5</text>
<rect x="337.7" y="77.3" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="107.3" font-size="19" font-weight="700" fill="#2b2a27">一、缘起的语义（一）</text>
<line x1="609.7" y1="57.6" x2="839.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）缘起和缘起法的简单解释</text>
<line x1="609.7" y1="97.2" x2="759.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）如何理解缘起</text>
<line x1="609.7" y1="170.3" x2="759.7" y2="170.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="161.7" font-size="16" font-weight="500" fill="#2b2a27">（三）不恰当的说法</text>
<line x1="805.7" y1="169.0" x2="1011.0" y2="169.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="808.7" y="161.1" font-size="14" font-weight="400" fill="#2b2a27">1.只以生起为缘起——错误的原因</text>
<line x1="1057.0" y1="132.8" x2="1214.9" y2="132.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1060.0" y="125.2" font-size="13" font-weight="400" fill="#2b2a27">（1）由于没有[相应]圣典</text>
<line x1="1057.0" y1="168.3" x2="1174.3" y2="168.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1060.0" y="160.8" font-size="13" font-weight="400" fill="#2b2a27">（2）由于违背圣典</text>
<line x1="1057.0" y1="203.9" x2="1253.9" y2="203.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1060.0" y="196.3" font-size="13" font-weight="400" fill="#2b2a27">（3）由于缺乏[四种]深奥的原理</text>
<rect x="337.7" y="215.9" width="286.0" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="245.9" font-size="19" font-weight="700" fill="#2b2a27">第二、异性理（nānattanaya</text>
<text x="355.7" y="271.5" font-size="19" font-weight="700" fill="#2b2a27">）</text>
<rect x="337.7" y="316.9" width="298.2" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="346.9" font-size="19" font-weight="700" fill="#2b2a27">第三、新译：无造作理（abyāp</text>
<text x="355.7" y="372.6" font-size="19" font-weight="700" fill="#2b2a27">āranaya）/旧译：不作为理</text>
<line x1="681.9" y1="326.8" x2="888.8" y2="326.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="684.9" y="318.2" font-size="16" font-weight="500" fill="#2b2a27">（4）由于破坏语法的完整性</text>
<line x1="681.9" y1="366.4" x2="819.7" y2="366.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="684.9" y="357.8" font-size="16" font-weight="500" fill="#2b2a27">2.缘起+成=缘起成</text>
<line x1="681.9" y1="406.0" x2="945.8" y2="406.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="684.9" y="397.4" font-size="16" font-weight="500" fill="#2b2a27">3.此缘状态在于行的变化中即名缘起</text>
<rect x="337.7" y="511.1" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="541.1" font-size="19" font-weight="700" fill="#2b2a27">二、缘起的语义（二）</text>
<line x1="609.7" y1="481.6" x2="791.7" y2="481.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="473.0" font-size="16" font-weight="500" fill="#2b2a27">（一）缘起另外的解释一</text>
<line x1="837.7" y1="461.8" x2="1100.7" y2="461.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="840.7" y="435.0" font-size="14" font-weight="400" fill="#2b2a27">1. 因为了解它能导致[出世间的]利益和[</text>
<text x="840.7" y="453.9" font-size="14" font-weight="400" fill="#2b2a27">出世间的]快乐， 所</text>
<line x1="837.7" y1="517.6" x2="1106.9" y2="517.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="840.7" y="490.8" font-size="14" font-weight="400" fill="#2b2a27">2. 此外， 由于这些因的组合是那些[果的</text>
<text x="840.7" y="509.7" font-size="14" font-weight="400" fill="#2b2a27">组合]之缘， 故为彼</text>
<line x1="609.7" y1="557.2" x2="791.7" y2="557.2" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="548.6" font-size="16" font-weight="500" fill="#2b2a27">（二）缘起另外的解释二</text>
<line x1="609.7" y1="613.9" x2="791.7" y2="613.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="605.3" font-size="16" font-weight="500" fill="#2b2a27">（三）缘起另外的解释三</text>
<line x1="837.7" y1="594.1" x2="887.4" y2="594.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="840.7" y="586.2" font-size="14" font-weight="400" fill="#2b2a27">1.偈颂</text>
<line x1="837.7" y1="631.0" x2="887.4" y2="631.0" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="840.7" y="623.1" font-size="14" font-weight="400" fill="#2b2a27">2.偈颂</text>
</svg>