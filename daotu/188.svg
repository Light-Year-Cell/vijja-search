<text x="48.0" y="384.9" font-size="26" font-weight="700" fill="#fff">提分-法念处-五盖2</text>
<rect x="343.9" y="100.2" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="130.2" font-size="19" font-weight="700" fill="#2b2a27">一、瞋恚盖的观照和成因</text>
<line x1="634.9" y1="57.6" x2="800.9" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）如何观照瞋恚盖</text>
<line x1="634.9" y1="97.2" x2="784.9" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）瞋恚盖的成因</text>
<line x1="634.9" y1="136.8" x2="816.9" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三）易生起瞋恚盖之事</text>
<line x1="634.9" y1="176.4" x2="848.9" y2="176.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">（四）引发瞋心之不如理作意</text>
<line x1="634.9" y1="216.0" x2="816.9" y2="216.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="207.4" font-size="16" font-weight="500" fill="#2b2a27">（五）瞋心的表现、过患</text>
<rect x="343.9" y="291.0" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="321.0" font-size="19" font-weight="700" fill="#2b2a27">二、灭除瞋恚的六种方法</text>
<line x1="634.9" y1="277.2" x2="912.9" y2="277.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="247.0" font-size="16" font-weight="500" fill="#2b2a27">（一）第一种、学习散播慈爱；第二种</text>
<text x="637.9" y="268.6" font-size="16" font-weight="500" fill="#2b2a27">、培育慈心禅</text>
<line x1="634.9" y1="338.4" x2="912.9" y2="338.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="308.2" font-size="16" font-weight="500" fill="#2b2a27">（二）第三种、思惟自己所造之业是自</text>
<text x="637.9" y="329.8" font-size="16" font-weight="500" fill="#2b2a27">己的财产；第四种、</text>
<line x1="634.9" y1="399.6" x2="912.9" y2="399.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="369.4" font-size="16" font-weight="500" fill="#2b2a27">（三）第五种亲近善知识；第六种与善</text>
<text x="637.9" y="391.0" font-size="16" font-weight="500" fill="#2b2a27">知识交流有助于培育</text>
<rect x="343.9" y="462.0" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="492.0" font-size="19" font-weight="700" fill="#2b2a27">三、慈心禅那的修习</text>
<line x1="596.9" y1="439.2" x2="730.9" y2="439.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="430.6" font-size="16" font-weight="500" fill="#2b2a27">（一）什么是慈心</text>
<line x1="596.9" y1="478.8" x2="794.9" y2="478.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="470.2" font-size="16" font-weight="500" fill="#2b2a27">（二）修习慈心的注意事项</text>
<line x1="596.9" y1="518.4" x2="762.9" y2="518.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="599.9" y="509.8" font-size="16" font-weight="500" fill="#2b2a27">（三）修习慈心的次第</text>
