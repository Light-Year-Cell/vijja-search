<rect x="30" y="432.0" width="267.9" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="469.0" font-size="26" font-weight="700" fill="#fff">174讲-摄集22-摄菩</text>
<text x="48.0" y="504.1" font-size="26" font-weight="700" fill="#fff">提分-身念处-入出</text>
<text x="48.0" y="539.2" font-size="26" font-weight="700" fill="#fff">息念3</text>
<rect x="343.9" y="40.8" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="70.8" font-size="19" font-weight="700" fill="#2b2a27">一、心的位置</text>
<line x1="539.9" y1="57.6" x2="673.9" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）置念于面前</text>
<line x1="539.9" y1="97.2" x2="714.9" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二） 用意门获取所缘</text>
<rect x="343.9" y="175.2" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="205.2" font-size="19" font-weight="700" fill="#2b2a27">二、确定所缘</text>
<line x1="539.9" y1="136.8" x2="673.9" y2="136.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（一）触木的锯齿</text>
<line x1="539.9" y1="176.4" x2="705.9" y2="176.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">（二）相、入息、出息</text>
<line x1="539.9" y1="216.0" x2="737.9" y2="216.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="207.4" font-size="16" font-weight="500" fill="#2b2a27">（三）成就入出息念的关键</text>
<line x1="539.9" y1="286.9" x2="721.9" y2="286.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="278.3" font-size="16" font-weight="500" fill="#2b2a27">（四）两种取所缘的方法</text>
<line x1="767.9" y1="271.8" x2="1033.8" y2="271.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.9" y="245.0" font-size="14" font-weight="400" fill="#2b2a27">1、大部分人可以用开始于触点上的气息，</text>
<text x="770.9" y="263.9" font-size="14" font-weight="400" fill="#2b2a27">有以下几个原则</text>
<line x1="767.9" y1="308.7" x2="949.8" y2="308.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.9" y="300.8" font-size="14" font-weight="400" fill="#2b2a27">2、开始于觉知静态的概念息</text>
<rect x="343.9" y="320.7" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="350.7" font-size="19" font-weight="700" fill="#2b2a27">三、获得入出息念殊胜功德的两</text>
<text x="361.9" y="376.3" font-size="19" font-weight="700" fill="#2b2a27">阶段标准</text>
<rect x="343.9" y="528.2" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="558.2" font-size="19" font-weight="700" fill="#2b2a27">四、练习入出息的五个阶段</text>
<line x1="653.9" y1="453.2" x2="924.9" y2="453.2" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="423.0" font-size="16" font-weight="500" fill="#2b2a27">1、入出息阶段：「只念于入息、只念</text>
<text x="656.9" y="444.6" font-size="16" font-weight="500" fill="#2b2a27">于出息」</text>
<line x1="653.9" y1="514.4" x2="917.8" y2="514.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="484.2" font-size="16" font-weight="500" fill="#2b2a27">2、长短息阶段：「入息长时，了知‘</text>
<text x="656.9" y="505.8" font-size="16" font-weight="500" fill="#2b2a27">我入息长’；出息长时</text>
<line x1="653.9" y1="575.6" x2="917.8" y2="575.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="545.4" font-size="16" font-weight="500" fill="#2b2a27">3、全息阶段：「他学‘我将觉知全身</text>
<text x="656.9" y="567.0" font-size="16" font-weight="500" fill="#2b2a27">而入息’；他学‘我将觉</text>
<line x1="653.9" y1="636.8" x2="917.8" y2="636.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="606.6" font-size="16" font-weight="500" fill="#2b2a27">4、微息的阶段：「他学‘我将平静身</text>
<text x="656.9" y="628.2" font-size="16" font-weight="500" fill="#2b2a27">行而入息’；他学‘我将</text>
<line x1="653.9" y1="698.0" x2="926.8" y2="698.0" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="667.8" font-size="16" font-weight="500" fill="#2b2a27">5、我再加一个阶段——似相阶段：当呼</text>
<text x="656.9" y="689.4" font-size="16" font-weight="500" fill="#2b2a27">吸与光融为一体时，应</text>
<rect x="343.9" y="902.8" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="932.8" font-size="19" font-weight="700" fill="#2b2a27">五、入出息念修习次第</text>
<line x1="615.9" y1="737.6" x2="749.9" y2="737.6" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="729.0" font-size="16" font-weight="500" fill="#2b2a27">（一）入出息阶段</text>
<line x1="615.9" y1="777.2" x2="717.9" y2="777.2" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="768.6" font-size="16" font-weight="500" fill="#2b2a27">（二）长短息</text>
<line x1="615.9" y1="816.8" x2="701.9" y2="816.8" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="808.2" font-size="16" font-weight="500" fill="#2b2a27">（三）全息</text>
<line x1="615.9" y1="856.4" x2="701.9" y2="856.4" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="847.8" font-size="16" font-weight="500" fill="#2b2a27">（四）微息</text>
<line x1="615.9" y1="896.0" x2="733.9" y2="896.0" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="887.4" font-size="16" font-weight="500" fill="#2b2a27">（五）专注要求</text>
<line x1="615.9" y1="935.6" x2="701.9" y2="935.6" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="927.0" font-size="16" font-weight="500" fill="#2b2a27">（六）禅相</text>
<line x1="615.9" y1="1141.3" x2="733.9" y2="1141.3" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="618.9" y="1132.7" font-size="16" font-weight="500" fill="#2b2a27">（七）七个诀窍</text>
<line x1="779.9" y1="991.4" x2="1045.8" y2="991.4" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="782.9" y="964.6" font-size="14" font-weight="400" fill="#2b2a27">1、入出息念（业处）的所缘始终都是息的</text>
<text x="782.9" y="983.5" font-size="14" font-weight="400" fill="#2b2a27">概念</text>
<line x1="779.9" y1="1047.2" x2="1045.8" y2="1047.2" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="782.9" y="1020.4" font-size="14" font-weight="400" fill="#2b2a27">2、一个心识刹那只有一个心生起。这是我</text>
<text x="782.9" y="1039.3" font-size="14" font-weight="400" fill="#2b2a27">克服自己非常痛苦的</text>
<line x1="779.9" y1="1103.0" x2="1045.8" y2="1103.0" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="782.9" y="1076.2" font-size="14" font-weight="400" fill="#2b2a27">3、心总是寻找快乐。如果你的业处不能给</text>
<text x="782.9" y="1095.1" font-size="14" font-weight="400" fill="#2b2a27">它带来快乐，它一定</text>
<line x1="779.9" y1="1158.8" x2="1045.8" y2="1158.8" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="782.9" y="1132.0" font-size="14" font-weight="400" fill="#2b2a27">4、了解自己的性行。尤其是瞋性行者一定</text>
<text x="782.9" y="1150.9" font-size="14" font-weight="400" fill="#2b2a27">要小心</text>
<line x1="779.9" y1="1214.6" x2="1045.8" y2="1214.6" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="782.9" y="1187.8" font-size="14" font-weight="400" fill="#2b2a27">5、通过梳理削弱五盖。入出息念是检验内</text>
<text x="782.9" y="1206.7" font-size="14" font-weight="400" fill="#2b2a27">心有没有粗重烦恼的</text>
<line x1="779.9" y1="1251.5" x2="863.8" y2="1251.5" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="782.9" y="1243.6" font-size="14" font-weight="400" fill="#2b2a27">6、与心沟通</text>
<line x1="779.9" y1="1307.3" x2="1045.8" y2="1307.3" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="782.9" y="1280.5" font-size="14" font-weight="400" fill="#2b2a27">7、五根与七觉支的平衡。很多老师已讲过</text>
<text x="782.9" y="1299.4" font-size="14" font-weight="400" fill="#2b2a27">，由于时间的关系</text>
</svg>