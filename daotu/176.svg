<rect x="30" y="589.6" width="267.9" height="92.2" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="626.6" font-size="26" font-weight="700" fill="#fff">176讲-摄集24-摄菩</text>
<text x="48.0" y="661.7" font-size="26" font-weight="700" fill="#fff">提分-安止善巧</text>
<rect x="343.9" y="96.6" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="126.6" font-size="19" font-weight="700" fill="#2b2a27">一、安止善巧</text>
<line x1="539.9" y1="57.6" x2="721.9" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）什么是安止善巧？</text>
<line x1="539.9" y1="97.2" x2="657.9" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）善巧于相</text>
<line x1="539.9" y1="158.4" x2="817.9" y2="158.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（二）善巧于培育已经生起的禅相。对</text>
<text x="542.9" y="149.8" font-size="16" font-weight="500" fill="#2b2a27">已经生起来的禅相刚开始还不稳</text>
<line x1="539.9" y1="219.6" x2="817.9" y2="219.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="189.4" font-size="16" font-weight="500" fill="#2b2a27">（三）善巧善巧于保护已经获得培育的</text>
<text x="542.9" y="211.0" font-size="16" font-weight="500" fill="#2b2a27">禅相。在此所指 的是后一项</text>
<rect x="343.9" y="231.6" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="261.6" font-size="19" font-weight="700" fill="#2b2a27">二、概述安止善巧守护</text>
<rect x="343.9" y="399.0" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="429.0" font-size="19" font-weight="700" fill="#2b2a27">三、安止善巧如何守护？</text>
<line x1="634.9" y1="316.9" x2="720.9" y2="316.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="308.2" font-size="16" font-weight="500" fill="#2b2a27">（一）住处</text>
<line x1="634.9" y1="356.5" x2="720.9" y2="356.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="347.9" font-size="16" font-weight="500" fill="#2b2a27">（二）去处</text>
<line x1="634.9" y1="396.1" x2="704.9" y2="396.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="387.5" font-size="16" font-weight="500" fill="#2b2a27">（三）人</text>
<line x1="634.9" y1="435.7" x2="720.9" y2="435.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="427.1" font-size="16" font-weight="500" fill="#2b2a27">（四）食物</text>
<line x1="634.9" y1="475.3" x2="720.9" y2="475.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="466.7" font-size="16" font-weight="500" fill="#2b2a27">（五）言论</text>
<line x1="634.9" y1="514.9" x2="720.9" y2="514.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="506.3" font-size="16" font-weight="500" fill="#2b2a27">（六）气候</text>
<line x1="634.9" y1="554.5" x2="720.9" y2="554.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="637.9" y="545.9" font-size="16" font-weight="500" fill="#2b2a27">（七）姿势</text>
<rect x="343.9" y="678.0" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="708.0" font-size="19" font-weight="700" fill="#2b2a27">三、十种安止善巧</text>
<line x1="577.9" y1="594.1" x2="727.9" y2="594.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="585.5" font-size="16" font-weight="500" fill="#2b2a27">（一）内、外处清净</text>
<line x1="577.9" y1="706.1" x2="727.9" y2="706.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="697.5" font-size="16" font-weight="500" fill="#2b2a27">（二）保持诸根平衡</text>
<line x1="773.9" y1="631.0" x2="829.8" y2="631.0" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="776.9" y="623.1" font-size="14" font-weight="400" fill="#2b2a27">1．信根</text>
<line x1="773.9" y1="667.9" x2="843.8" y2="667.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="776.9" y="660.0" font-size="14" font-weight="400" fill="#2b2a27">2．精进根</text>
<line x1="773.9" y1="704.8" x2="815.8" y2="704.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="776.9" y="696.9" font-size="14" font-weight="400" fill="#2b2a27">3．念</text>
<line x1="773.9" y1="741.7" x2="815.8" y2="741.7" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="776.9" y="733.8" font-size="14" font-weight="400" fill="#2b2a27">4．定</text>
<line x1="773.9" y1="778.6" x2="815.8" y2="778.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="776.9" y="770.7" font-size="14" font-weight="400" fill="#2b2a27">5．慧</text>
<line x1="577.9" y1="835.3" x2="791.9" y2="835.3" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="580.9" y="826.7" font-size="16" font-weight="500" fill="#2b2a27">（三）培育及平衡所有七觉支</text>
<line x1="837.9" y1="815.5" x2="1005.8" y2="815.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="840.9" y="807.6" font-size="14" font-weight="400" fill="#2b2a27">1．令择法觉支生起的方法</text>
<line x1="837.9" y1="852.4" x2="1005.8" y2="852.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="840.9" y="844.5" font-size="14" font-weight="400" fill="#2b2a27">2．令精进觉支生起的方法</text>
<rect x="343.9" y="864.4" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="894.4" font-size="19" font-weight="700" fill="#2b2a27">第一、思惟四恶道的苦有多么可</text>
<text x="361.9" y="920.0" font-size="19" font-weight="700" fill="#2b2a27">怕</text>
<rect x="343.9" y="947.7" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="977.7" font-size="19" font-weight="700" fill="#2b2a27">第二、明白修行是有利益的，要</text>
<text x="361.9" y="1003.3" font-size="19" font-weight="700" fill="#2b2a27">真正去思惟人活着总要获得点</text>
<rect x="343.9" y="1031.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="361.9" y="1061.0" font-size="19" font-weight="700" fill="#2b2a27">第三、思惟导师的伟大。佛陀确</text>
<text x="361.9" y="1086.6" font-size="19" font-weight="700" fill="#2b2a27">实非常地伟大，他从三十三天</text>
<rect x="343.9" y="1114.2" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#8a6d3b" stroke-width="2.2"/>
<text x="361.9" y="1144.2" font-size="19" font-weight="700" fill="#2b2a27">第四、思惟佛陀遗产的殊胜。如</text>
<text x="361.9" y="1169.9" font-size="19" font-weight="700" fill="#2b2a27">果思惟佛陀留下来的信、戒、</text>
</svg>