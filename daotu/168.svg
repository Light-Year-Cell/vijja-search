<text x="932.9" y="276.5" font-size="14" font-weight="400" fill="#2b2a27">4. 进食者在消耗食物，食物也吞噬了进食</text>
<text x="932.9" y="295.4" font-size="14" font-weight="400" fill="#2b2a27">者</text>
<line x1="653.9" y1="342.9" x2="835.9" y2="342.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="334.3" font-size="16" font-weight="500" fill="#2b2a27">（四）有智慧地面对四食</text>
