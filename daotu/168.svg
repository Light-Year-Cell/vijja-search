<text x="48.0" y="292.9" font-size="26" font-weight="700" fill="#fff">168讲-摄集16-生命</text>
<text x="48.0" y="328.0" font-size="26" font-weight="700" fill="#fff">的四食2</text>
<rect x="343.9" y="163.6" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="193.6" font-size="19" font-weight="700" fill="#2b2a27">一、关于四增上内容的补充</text>
