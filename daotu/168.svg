<text x="656.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">1、猝死念成翠死，喙念成吻</text>
<line x1="653.9" y1="97.2" x2="787.9" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="656.9" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（一）民以食为天</text>
