<text x="355.7" y="175.3" font-size="19" font-weight="700" fill="#2b2a27">3.【三个有分】</text>
<rect x="337.7" y="370.1" width="283.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="400.1" font-size="19" font-weight="700" fill="#2b2a27">一、五门心路过程的路心的缘</text>
<line x1="666.7" y1="252.2" x2="941.5" y2="252.2" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="222.0" font-size="16" font-weight="500" fill="#2b2a27">1.诸心生起皆须所缘，所缘组 4 缘（</text>
<text x="669.7" y="243.6" font-size="16" font-weight="500" fill="#2b2a27">所缘缘、所缘前生缘、所缘</text>
<line x1="666.7" y1="313.4" x2="939.6" y2="313.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="283.2" font-size="16" font-weight="500" fill="#2b2a27">2.诸心生起皆有自然亲依止缘， 自然</text>
<text x="669.7" y="304.8" font-size="16" font-weight="500" fill="#2b2a27">亲依止组 1 缘 （其他任何有</text>
<line x1="666.7" y1="374.6" x2="941.5" y2="374.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="344.4" font-size="16" font-weight="500" fill="#2b2a27">4.五识依处组 6 缘（眼识为例：眼净</text>
<text x="669.7" y="366.0" font-size="16" font-weight="500" fill="#2b2a27">色 6 缘，依处前生依止缘、</text>
<line x1="666.7" y1="435.8" x2="930.6" y2="435.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="405.6" font-size="16" font-weight="500" fill="#2b2a27">5.唯作心（五门转向、确定心）以及</text>
<text x="669.7" y="427.2" font-size="16" font-weight="500" fill="#2b2a27">五识，俱生组 10 缘。领受、</text>
<line x1="666.7" y1="496.9" x2="930.6" y2="496.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="466.8" font-size="16" font-weight="500" fill="#2b2a27">6.五门转向至速行以及速行至彼所缘</text>
<text x="669.7" y="488.4" font-size="16" font-weight="500" fill="#2b2a27">， 无间组 5 缘 （无间缘、 等</text>
