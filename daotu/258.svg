<text x="48.0" y="347.2" font-size="26" font-weight="700" fill="#fff">第62讲-摄缘-十二</text>
<text x="48.0" y="382.3" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘62-</text>
<text x="48.0" y="417.4" font-size="26" font-weight="700" fill="#fff">路心的缘-五门心路</text>
<text x="48.0" y="452.5" font-size="26" font-weight="700" fill="#fff">&amp;意门心路与无明缘</text>
<text x="48.0" y="487.6" font-size="26" font-weight="700" fill="#fff">行1</text>
<rect x="337.7" y="30.0" width="133.3" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">1.【所缘】</text>
