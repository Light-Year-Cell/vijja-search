<rect x="30" y="509.0" width="267.9" height="92.2" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="546.0" font-size="26" font-weight="700" fill="#fff">164讲-摄集12-二十</text>
<text x="48.0" y="581.1" font-size="26" font-weight="700" fill="#fff">二根2</text>
<rect x="343.9" y="227.5" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="257.5" font-size="19" font-weight="700" fill="#2b2a27">一、五受根</text>
<line x1="520.9" y1="57.6" x2="702.9" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）五受根易生起烦恼</text>
<line x1="520.9" y1="97.2" x2="686.9" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）无明的两种含义</text>
<line x1="520.9" y1="158.4" x2="786.8" y2="158.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三）生命的四食 —— 抟食、触食、</text>
<text x="523.9" y="149.8" font-size="16" font-weight="500" fill="#2b2a27">思食和识食</text>
<line x1="520.9" y1="219.6" x2="798.9" y2="219.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="189.4" font-size="16" font-weight="500" fill="#2b2a27">（四）两种机制影响下生命体验不同的</text>
<text x="523.9" y="211.0" font-size="16" font-weight="500" fill="#2b2a27">受</text>
<line x1="520.9" y1="280.8" x2="784.8" y2="280.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="250.6" font-size="16" font-weight="500" fill="#2b2a27">（五）因受而引生善或不善法——受缘</text>
<text x="523.9" y="272.2" font-size="16" font-weight="500" fill="#2b2a27">爱</text>
<line x1="520.9" y1="355.9" x2="798.9" y2="355.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="347.3" font-size="16" font-weight="500" fill="#2b2a27">（六）五欲之乐、善法之乐与涅槃之乐</text>
<line x1="844.9" y1="317.7" x2="972.4" y2="317.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="847.9" y="309.8" font-size="14" font-weight="400" fill="#2b2a27">1. 执取五欲的过患</text>
<line x1="844.9" y1="354.6" x2="930.4" y2="354.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="847.9" y="346.7" font-size="14" font-weight="400" fill="#2b2a27">2. 善法之乐</text>
<line x1="844.9" y1="391.5" x2="930.4" y2="391.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="847.9" y="383.6" font-size="14" font-weight="400" fill="#2b2a27">3. 涅槃之乐</text>
<line x1="520.9" y1="431.1" x2="718.9" y2="431.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="422.5" font-size="16" font-weight="500" fill="#2b2a27">（七）未经训练，心随受转</text>
<line x1="520.9" y1="470.7" x2="718.9" y2="470.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="462.1" font-size="16" font-weight="500" fill="#2b2a27">（八）训练自心，不随受转</text>
<rect x="343.9" y="482.7" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="512.7" font-size="19" font-weight="700" fill="#2b2a27">二、信等五根</text>
<rect x="343.9" y="540.3" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="570.3" font-size="19" font-weight="700" fill="#2b2a27">第六、后际，就是未来世。第七</text>
<text x="361.9" y="596.0" font-size="19" font-weight="700" fill="#2b2a27">、前后际，就是相信过去、未来</text>
<text x="361.9" y="621.6" font-size="19" font-weight="700" fill="#2b2a27">世</text>
<rect x="343.9" y="649.3" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="679.3" font-size="19" font-weight="700" fill="#2b2a27">第八、缘起，即因果法则</text>
<rect x="343.9" y="706.9" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="736.9" font-size="19" font-weight="700" fill="#2b2a27">三、三种出世间慧根</text>
<rect x="343.9" y="764.6" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="794.6" font-size="19" font-weight="700" fill="#2b2a27">四、诸根的次第</text>
<rect x="343.9" y="822.2" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="361.9" y="852.2" font-size="19" font-weight="700" fill="#2b2a27">五、依法抉择确定正道，平衡五</text>
<text x="361.9" y="877.9" font-size="19" font-weight="700" fill="#2b2a27">根趣向涅槃</text>
</svg>