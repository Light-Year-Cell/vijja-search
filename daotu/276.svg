<rect x="30" y="113.0" width="261.7" height="197.5" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="150.0" font-size="26" font-weight="700" fill="#fff">第80讲-摄缘-十二</text>
<text x="48.0" y="185.1" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘80-</text>
<text x="48.0" y="220.2" font-size="26" font-weight="700" fill="#fff">离路心的缘-有缘生</text>
<text x="48.0" y="255.3" font-size="26" font-weight="700" fill="#fff">&amp;生缘老死愁悲苦忧</text>
<text x="48.0" y="290.4" font-size="26" font-weight="700" fill="#fff">恼</text>
<rect x="337.7" y="30.0" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、辨识有缘生的缘</text>
<rect x="337.7" y="333.1" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="363.1" font-size="19" font-weight="700" fill="#2b2a27">二、辨识生缘老死愁悲苦忧恼的</text>
<text x="355.7" y="388.7" font-size="19" font-weight="700" fill="#2b2a27">缘</text>
<line x1="685.7" y1="136.9" x2="956.6" y2="136.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="106.7" font-size="16" font-weight="500" fill="#2b2a27">（1）生是苦，生为什么是苦？因为是</text>
<text x="688.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">许多苦的基础的缘故。苦</text>
<line x1="685.7" y1="198.1" x2="963.7" y2="198.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="167.9" font-size="16" font-weight="500" fill="#2b2a27">（二）当母亲突然颠踬、步行、坐下、</text>
<text x="688.7" y="189.5" font-size="16" font-weight="500" fill="#2b2a27">起立、旋转之时，则那胎</text>
<line x1="685.7" y1="259.2" x2="949.6" y2="259.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="229.1" font-size="16" font-weight="500" fill="#2b2a27">（三） 如果母亲妊娠不正常， 则胎</text>
<text x="688.7" y="250.7" font-size="16" font-weight="500" fill="#2b2a27">儿在母亲的亲朋密友亦不宜看</text>
<line x1="685.7" y1="320.4" x2="963.7" y2="320.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="290.2" font-size="16" font-weight="500" fill="#2b2a27">（四）在母亲生产之时，胎儿受苦，由</text>
<text x="688.7" y="311.9" font-size="16" font-weight="500" fill="#2b2a27">于业生之风倒转，如堕地</text>
<line x1="685.7" y1="381.6" x2="949.6" y2="381.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="351.4" font-size="16" font-weight="500" fill="#2b2a27">（五） 初生的如嫩芽的身体， 以手</text>
<text x="688.7" y="373.1" font-size="16" font-weight="500" fill="#2b2a27">取之而浴而洗及以布拭等的时</text>
<line x1="685.7" y1="442.8" x2="963.7" y2="442.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="412.6" font-size="16" font-weight="500" fill="#2b2a27">（六）从此以后，于维持生活中，有犯</text>
<text x="688.7" y="434.2" font-size="16" font-weight="500" fill="#2b2a27">自杀的，有誓行裸体及从</text>
<line x1="685.7" y1="649.8" x2="963.7" y2="649.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="619.6" font-size="16" font-weight="500" fill="#2b2a27">（七）其次受别人谋杀捆缚等的苦。这</text>
<text x="688.7" y="641.2" font-size="16" font-weight="500" fill="#2b2a27">是由于他人所起的苦</text>
<line x1="1009.7" y1="498.6" x2="1275.5" y2="498.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="471.8" font-size="14" font-weight="400" fill="#2b2a27">（2）老是苦，老有二种，即有为相，及包</text>
<text x="1012.7" y="490.7" font-size="14" font-weight="400" fill="#2b2a27">摄于一有的诸蕴在相</text>
<line x1="1009.7" y1="535.5" x2="1163.5" y2="535.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="527.6" font-size="14" font-weight="400" fill="#2b2a27">（3）死是苦，死有两种</text>
<line x1="1009.7" y1="572.4" x2="1193.2" y2="572.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="564.5" font-size="14" font-weight="400" fill="#2b2a27">（4）其次于愁等之中的“愁”</text>
<line x1="1009.7" y1="628.2" x2="1278.9" y2="628.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="601.4" font-size="14" font-weight="400" fill="#2b2a27">（5）悲 ── 是丧失亲戚等事的人的心的号</text>
<text x="1012.7" y="620.3" font-size="14" font-weight="400" fill="#2b2a27">泣。它有哀哭的特</text>
<line x1="1009.7" y1="684.0" x2="1278.9" y2="684.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="657.2" font-size="14" font-weight="400" fill="#2b2a27">（6）苦 ── 是身的苦。身的逼迫是它的特</text>
<text x="1012.7" y="676.1" font-size="14" font-weight="400" fill="#2b2a27">相，使无慧的人起</text>
<line x1="1009.7" y1="739.8" x2="1278.9" y2="739.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="713.0" font-size="14" font-weight="400" fill="#2b2a27">（7）忧 ── 是意的苦。心的逼恼是它的特</text>
<text x="1012.7" y="731.9" font-size="14" font-weight="400" fill="#2b2a27">相，烦扰于心是它</text>
<line x1="1009.7" y1="795.6" x2="1278.9" y2="795.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="1012.7" y="768.8" font-size="14" font-weight="400" fill="#2b2a27">（8）恼 ── 是丧失亲戚等事的人由于过度</text>
<text x="1012.7" y="787.7" font-size="14" font-weight="400" fill="#2b2a27">的心痛而产生的过</text>
</svg>