<rect x="30" y="408.7" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="445.7" font-size="26" font-weight="700" fill="#fff">第52讲-摄缘-十二</text>
<text x="48.0" y="480.8" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘52-</text>
<text x="48.0" y="515.9" font-size="26" font-weight="700" fill="#fff">释二十四缘-禅那缘</text>
<rect x="337.7" y="80.4" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="110.4" font-size="19" font-weight="700" fill="#2b2a27">一、经文与释义</text>
<line x1="552.7" y1="57.6" x2="647.6" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">(一）缘广释</text>
<line x1="693.6" y1="54.9" x2="882.8" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="696.6" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">17.禅那缘(jhāna-paccaya)</text>
<line x1="552.7" y1="97.2" x2="638.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）经文</text>
<line x1="552.7" y1="136.8" x2="638.7" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三）譬喻</text>
<line x1="552.7" y1="176.4" x2="638.7" y2="176.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">（四）释义</text>
<rect x="337.7" y="188.4" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="218.4" font-size="19" font-weight="700" fill="#2b2a27">二、经文详释</text>
<rect x="337.7" y="246.0" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="276.0" font-size="19" font-weight="700" fill="#2b2a27">三、证得禅那的修习过程</text>
<rect x="337.7" y="478.3" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="508.3" font-size="19" font-weight="700" fill="#2b2a27">四、禅那缘的五禅支</text>
<line x1="590.7" y1="352.9" x2="863.6" y2="352.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="322.7" font-size="16" font-weight="500" fill="#2b2a27">(1)寻禅支是把心不断地投向目标。寻</text>
<text x="593.7" y="344.3" font-size="16" font-weight="500" fill="#2b2a27">心所的相等四法：特相是</text>
<line x1="590.7" y1="414.1" x2="863.6" y2="414.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="383.9" font-size="16" font-weight="500" fill="#2b2a27">(2)伺禅支是一再把心安置在目标上。</text>
<text x="593.7" y="405.5" font-size="16" font-weight="500" fill="#2b2a27">伺心所的相等四法：特相</text>
<line x1="590.7" y1="475.3" x2="863.6" y2="475.3" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="445.1" font-size="16" font-weight="500" fill="#2b2a27">(3)喜禅支是喜欢目标。喜心所的相等</text>
<text x="593.7" y="466.7" font-size="16" font-weight="500" fill="#2b2a27">四法 ：特相是喜欢所缘</text>
<line x1="590.7" y1="536.5" x2="863.6" y2="536.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="506.3" font-size="16" font-weight="500" fill="#2b2a27">(4)悦禅支是对目标乐在其中，即体验</text>
<text x="593.7" y="527.9" font-size="16" font-weight="500" fill="#2b2a27">所缘而内心愉悦的状态</text>
<line x1="590.7" y1="576.1" x2="831.6" y2="576.1" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="567.5" font-size="16" font-weight="500" fill="#2b2a27">(5)一境性禅支是统一所有的名法</text>
<line x1="590.7" y1="637.3" x2="863.6" y2="637.3" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="607.1" font-size="16" font-weight="500" fill="#2b2a27">(6)忧受是内心的痛苦感受，只生起于</text>
<text x="593.7" y="628.7" font-size="16" font-weight="500" fill="#2b2a27">嗔恚相应的心。忧受的相</text>
<line x1="590.7" y1="698.5" x2="856.5" y2="698.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="668.3" font-size="16" font-weight="500" fill="#2b2a27">(7)舍禅支可以生起于善心、 不善心</text>
<text x="593.7" y="689.9" font-size="16" font-weight="500" fill="#2b2a27">或无记心。 舍受的相等四法</text>
<rect x="337.7" y="816.7" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="846.7" font-size="19" font-weight="700" fill="#2b2a27">五、善用禅那缘</text>
<line x1="552.7" y1="759.7" x2="830.7" y2="759.7" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="729.5" font-size="16" font-weight="500" fill="#2b2a27">（一）羸弱的心总是漂浮不定，禅支强</text>
<text x="555.7" y="751.1" font-size="16" font-weight="500" fill="#2b2a27">且与不善法结合时</text>
<line x1="552.7" y1="853.3" x2="830.7" y2="853.3" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="844.7" font-size="16" font-weight="500" fill="#2b2a27">（二）专注善法的五禅支才能导向解脱</text>
<line x1="876.7" y1="796.6" x2="1052.4" y2="796.6" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="879.7" y="788.7" font-size="14" font-weight="400" fill="#2b2a27">1.甚深佛功德，专念得解脱</text>
<line x1="876.7" y1="833.5" x2="1024.4" y2="833.5" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="879.7" y="825.6" font-size="14" font-weight="400" fill="#2b2a27">2.给孤独长者初见佛陀</text>
<line x1="876.7" y1="870.4" x2="968.4" y2="870.4" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="879.7" y="862.5" font-size="14" font-weight="400" fill="#2b2a27">3.慈心的力量</text>
<line x1="876.7" y1="907.3" x2="1038.4" y2="907.3" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="879.7" y="899.4" font-size="14" font-weight="400" fill="#2b2a27">4.修习不净观，证悟圣果</text>
<line x1="552.7" y1="968.5" x2="830.7" y2="968.5" stroke="#7a5cc4" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="938.3" font-size="16" font-weight="500" fill="#2b2a27">（三）心安住于善法，建立以解脱为目</text>
<text x="555.7" y="959.9" font-size="16" font-weight="500" fill="#2b2a27">标的强大的禅那缘</text>
</svg>