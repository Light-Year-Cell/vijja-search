<text x="48.0" y="570.8" font-size="26" font-weight="700" fill="#fff">支3&amp;四圣谛1</text>
<rect x="343.9" y="30.0" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="361.9" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、轻安觉支</text>
<line x1="539.9" y1="57.6" x2="707.8" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="542.9" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">7.倾向于培育轻安觉支</text>
<rect x="343.9" y="211.1" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="361.9" y="241.1" font-size="19" font-weight="700" fill="#2b2a27">二、定觉支</text>
<line x1="520.9" y1="115.2" x2="798.9" y2="115.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="106.7" font-size="16" font-weight="500" fill="#2b2a27">（一）定觉支是指有平静而不混乱的相</text>
<line x1="520.9" y1="154.8" x2="670.9" y2="154.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="146.2" font-size="16" font-weight="500" fill="#2b2a27">（二）心会混乱之因</text>
<line x1="520.9" y1="194.4" x2="782.9" y2="194.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="185.8" font-size="16" font-weight="500" fill="#2b2a27">（三）通过一境性解决心散乱的问题</text>
<line x1="520.9" y1="269.6" x2="798.9" y2="269.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="261.0" font-size="16" font-weight="500" fill="#2b2a27">（四）培养止禅和观禅中定觉支的方法</text>
<line x1="844.9" y1="231.3" x2="1000.4" y2="231.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="847.9" y="223.4" font-size="14" font-weight="400" fill="#2b2a27">1. 第一个阶段学习取相</text>
<line x1="844.9" y1="268.2" x2="972.4" y2="268.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="847.9" y="260.4" font-size="14" font-weight="400" fill="#2b2a27">2. 第二个阶段实修</text>
<line x1="844.9" y1="305.1" x2="972.4" y2="305.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="847.9" y="297.2" font-size="14" font-weight="400" fill="#2b2a27">3. 第三个阶段保持</text>
<line x1="520.9" y1="380.3" x2="718.9" y2="380.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="371.7" font-size="16" font-weight="500" fill="#2b2a27">（五）令定觉支生起的方法</text>
<line x1="764.9" y1="342.0" x2="850.4" y2="342.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="334.1" font-size="14" font-weight="400" fill="#2b2a27">1. 清净依处</text>
<line x1="764.9" y1="378.9" x2="850.4" y2="378.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="371.0" font-size="14" font-weight="400" fill="#2b2a27">2. 平衡五根</text>
<line x1="764.9" y1="415.8" x2="892.4" y2="415.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="407.9" font-size="14" font-weight="400" fill="#2b2a27">3. 善于取业处之相</text>
<rect x="343.9" y="512.0" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="361.9" y="542.0" font-size="19" font-weight="700" fill="#2b2a27">二、三、四禅的相有什么差别？</text>
<text x="361.9" y="567.6" font-size="19" font-weight="700" fill="#2b2a27">你可以请教老师。老师如果说：</text>
<text x="361.9" y="593.3" font-size="19" font-weight="700" fill="#2b2a27">“你</text>
<line x1="691.9" y1="455.4" x2="820.8" y2="455.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="446.8" font-size="16" font-weight="500" fill="#2b2a27">4. 必要时策励心</text>
<line x1="691.9" y1="495.0" x2="820.8" y2="495.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="486.4" font-size="16" font-weight="500" fill="#2b2a27">5. 必要时抑制心</text>
<line x1="691.9" y1="534.6" x2="836.8" y2="534.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="526.0" font-size="16" font-weight="500" fill="#2b2a27">6. 必要时令心喜悦</text>
<line x1="691.9" y1="574.2" x2="884.8" y2="574.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="565.6" font-size="16" font-weight="500" fill="#2b2a27">7. 必要时不干涉地旁观心</text>
<line x1="691.9" y1="613.9" x2="852.8" y2="613.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="605.2" font-size="16" font-weight="500" fill="#2b2a27">8. 远离心不专一的人</text>
<line x1="691.9" y1="653.5" x2="852.8" y2="653.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="644.9" font-size="16" font-weight="500" fill="#2b2a27">9. 与心专一的人相处</text>
<line x1="691.9" y1="693.1" x2="861.8" y2="693.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="694.9" y="684.5" font-size="16" font-weight="500" fill="#2b2a27">10. 倾向于培育定觉支</text>
<rect x="343.9" y="777.9" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="361.9" y="807.9" font-size="19" font-weight="700" fill="#2b2a27">三、捨觉支</text>
<line x1="520.9" y1="814.6" x2="718.9" y2="814.6" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="806.0" font-size="16" font-weight="500" fill="#2b2a27">（一）令捨觉支生起的方法</text>
<line x1="764.9" y1="730.0" x2="920.4" y2="730.0" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="722.1" font-size="14" font-weight="400" fill="#2b2a27">1. 对众生不执著的态度</text>
<line x1="764.9" y1="766.9" x2="920.4" y2="766.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="759.0" font-size="14" font-weight="400" fill="#2b2a27">2. 对物品不执著的态度</text>
<line x1="764.9" y1="803.8" x2="1004.4" y2="803.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="795.9" font-size="14" font-weight="400" fill="#2b2a27">3. 远离对众生和物品有自我感觉的人</text>
<line x1="764.9" y1="859.5" x2="1032.4" y2="859.5" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="832.8" font-size="14" font-weight="400" fill="#2b2a27">4. 跟平等对待而不执取众生和东西的人相</text>
<text x="767.9" y="851.6" font-size="14" font-weight="400" fill="#2b2a27">处</text>
<line x1="764.9" y1="896.4" x2="906.4" y2="896.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="767.9" y="888.5" font-size="14" font-weight="400" fill="#2b2a27">5. 倾向于培育捨觉支</text>
<rect x="343.9" y="908.4" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="361.9" y="938.4" font-size="19" font-weight="700" fill="#2b2a27">四、更高阶段的观智</text>
<rect x="343.9" y="976.9" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="361.9" y="1006.9" font-size="19" font-weight="700" fill="#2b2a27">五、四圣谛</text>
<line x1="520.9" y1="993.7" x2="606.9" y2="993.7" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="985.1" font-size="16" font-weight="500" fill="#2b2a27">（一）苦谛</text>
<line x1="520.9" y1="1033.3" x2="606.9" y2="1033.3" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="523.9" y="1024.7" font-size="16" font-weight="500" fill="#2b2a27">（二）集谛</text>
