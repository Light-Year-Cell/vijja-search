<rect x="30" y="288.7" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="325.7" font-size="26" font-weight="700" fill="#fff">第19讲-摄缘-十二</text>
<text x="48.0" y="360.8" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘19-</text>
<text x="48.0" y="395.9" font-size="26" font-weight="700" fill="#fff">释二十四缘-无间缘</text>
<text x="48.0" y="431.0" font-size="26" font-weight="700" fill="#fff">与等无间缘3</text>
<rect x="337.7" y="60.6" width="131.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="90.6" font-size="19" font-weight="700" fill="#2b2a27">一、有分心</text>
<line x1="514.7" y1="57.6" x2="664.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）有分心的作用</text>
<line x1="514.7" y1="97.2" x2="680.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）有分心是清净的</text>
<line x1="514.7" y1="136.8" x2="657.6" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="517.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三)有分并非主公</text>
<rect x="337.7" y="631.6" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="661.6" font-size="19" font-weight="700" fill="#2b2a27">二、六种心理余势</text>
<line x1="571.7" y1="176.4" x2="627.6" y2="176.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">(一)业</text>
<line x1="571.7" y1="216.0" x2="643.6" y2="216.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="207.4" font-size="16" font-weight="500" fill="#2b2a27">(二)随眠</text>
<line x1="571.7" y1="514.8" x2="659.6" y2="514.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="506.2" font-size="16" font-weight="500" fill="#2b2a27">(三)巴拉密</text>
<line x1="705.6" y1="271.8" x2="973.1" y2="271.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="708.6" y="245.0" font-size="14" font-weight="400" fill="#2b2a27">(1)布施巴拉密，是愿意舍弃自身和所拥有</text>
<text x="708.6" y="263.9" font-size="14" font-weight="400" fill="#2b2a27">的身外物给他人的舍</text>
<line x1="705.6" y1="327.6" x2="973.1" y2="327.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="708.6" y="300.8" font-size="14" font-weight="400" fill="#2b2a27">(2)持戒巴拉密，是善的身业与口业。根据</text>
<text x="708.6" y="319.7" font-size="14" font-weight="400" fill="#2b2a27">《论藏》 ，持戒是“离</text>
<line x1="705.6" y1="383.4" x2="973.1" y2="383.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="708.6" y="356.6" font-size="14" font-weight="400" fill="#2b2a27">(3)出离巴拉密，是在明了欲乐与生命的不</text>
<text x="708.6" y="375.5" font-size="14" font-weight="400" fill="#2b2a27">圆满之后所生起的舍</text>
<line x1="705.6" y1="439.2" x2="973.1" y2="439.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="708.6" y="412.4" font-size="14" font-weight="400" fill="#2b2a27">(4)智慧巴拉密，是透视诸法之共相与特相</text>
<text x="708.6" y="431.3" font-size="14" font-weight="400" fill="#2b2a27">的心所，也就是慧心</text>
<line x1="705.6" y1="495.0" x2="973.1" y2="495.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="708.6" y="468.2" font-size="14" font-weight="400" fill="#2b2a27">(5)精进巴拉密，是为众生福利或修行所付</text>
<text x="708.6" y="487.1" font-size="14" font-weight="400" fill="#2b2a27">出的身与心之努力</text>
<line x1="705.6" y1="550.8" x2="973.1" y2="550.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="708.6" y="524.0" font-size="14" font-weight="400" fill="#2b2a27">(6)忍辱巴拉密，是忍受他人对己所犯之错</text>
<text x="708.6" y="542.9" font-size="14" font-weight="400" fill="#2b2a27">的忍耐力。根据《论</text>
<line x1="705.6" y1="606.6" x2="973.1" y2="606.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="708.6" y="579.8" font-size="14" font-weight="400" fill="#2b2a27">(7)真实巴拉密，是只说实话且言而有信，</text>
<text x="708.6" y="598.7" font-size="14" font-weight="400" fill="#2b2a27">亦可分析为离心所、</text>
<line x1="705.6" y1="662.4" x2="973.1" y2="662.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="708.6" y="635.6" font-size="14" font-weight="400" fill="#2b2a27">(8)决意巴拉密，是对行善毫不动摇的决心</text>
<text x="708.6" y="654.5" font-size="14" font-weight="400" fill="#2b2a27">，或是如此下决心时</text>
<line x1="705.6" y1="718.2" x2="973.1" y2="718.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="708.6" y="691.4" font-size="14" font-weight="400" fill="#2b2a27">(9)慈巴拉密，是为众生福利所做的奉献或</text>
<text x="708.6" y="710.3" font-size="14" font-weight="400" fill="#2b2a27">愿众生快乐，或者是</text>
<line x1="705.6" y1="774.0" x2="968.6" y2="774.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="708.6" y="747.2" font-size="14" font-weight="400" fill="#2b2a27">(10)舍巴拉密， 是对所有喜与恶之法， </text>
<text x="708.6" y="766.1" font-size="14" font-weight="400" fill="#2b2a27">采取平衡与不分别的态度</text>
<line x1="571.7" y1="916.6" x2="643.6" y2="916.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="908.0" font-size="16" font-weight="500" fill="#2b2a27">(四)意乐</text>
<line x1="689.6" y1="810.9" x2="831.1" y2="810.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="692.6" y="803.0" font-size="14" font-weight="400" fill="#2b2a27">1. 与轮回相关的住处</text>
<line x1="689.6" y1="847.8" x2="831.1" y2="847.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="692.6" y="839.9" font-size="14" font-weight="400" fill="#2b2a27">2. 与解脱相关的住处</text>
<line x1="689.6" y1="884.7" x2="892.7" y2="884.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="692.6" y="876.8" font-size="14" font-weight="400" fill="#2b2a27">1.欲 kāma 与出离 nekkhamma</text>
<line x1="689.6" y1="921.6" x2="936.4" y2="921.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="692.6" y="913.7" font-size="14" font-weight="400" fill="#2b2a27">2.瞋害 byāpāda 与无瞋害 abyāpāda</text>
<line x1="689.6" y1="1019.7" x2="795.3" y2="1019.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="692.6" y="1011.8" font-size="14" font-weight="400" fill="#2b2a27">3.昏沉与光明想</text>
<line x1="841.3" y1="974.7" x2="1087.5" y2="974.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="844.3" y="949.6" font-size="13" font-weight="400" fill="#2b2a27">（1）garuka 重视，即过去曾经从事的力</text>
<text x="844.3" y="967.1" font-size="13" font-weight="400" fill="#2b2a27">量而有重视存在。有人</text>
<line x1="841.3" y1="1027.8" x2="1087.5" y2="1027.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="844.3" y="1002.7" font-size="13" font-weight="400" fill="#2b2a27">（2）āsaya 住下，以重视的方式驻扎/留</text>
<text x="844.3" y="1020.2" font-size="13" font-weight="400" fill="#2b2a27">存在心相续流中。总是</text>
<line x1="841.3" y1="1080.9" x2="1083.4" y2="1080.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="844.3" y="1055.8" font-size="13" font-weight="400" fill="#2b2a27">（3）adhimutta 决心，通过心相续而决</text>
<text x="844.3" y="1073.3" font-size="13" font-weight="400" fill="#2b2a27">定、坚持</text>
<line x1="571.7" y1="1120.5" x2="657.7" y2="1120.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="1111.9" font-size="16" font-weight="500" fill="#2b2a27">（五）习性</text>
<line x1="571.7" y1="1160.1" x2="643.6" y2="1160.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="1151.5" font-size="16" font-weight="500" fill="#2b2a27">(六)性行</text>
<line x1="689.6" y1="1157.4" x2="817.1" y2="1157.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="692.6" y="1149.5" font-size="14" font-weight="400" fill="#2b2a27">1. 过去宿世的行为</text>
</svg>