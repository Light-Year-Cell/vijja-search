<rect x="30" y="518.1" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="555.1" font-size="26" font-weight="700" fill="#fff">第25讲-摄缘-十二</text>
<text x="48.0" y="590.2" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘25-</text>
<text x="48.0" y="625.3" font-size="26" font-weight="700" fill="#fff">释二十四缘-亲依止</text>
<text x="48.0" y="660.4" font-size="26" font-weight="700" fill="#fff">缘1</text>
<rect x="337.7" y="30.0" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、亲依止缘经文</text>
<rect x="337.7" y="423.4" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="453.4" font-size="19" font-weight="700" fill="#2b2a27">二、亲依止缘简介</text>
<line x1="571.7" y1="266.7" x2="721.7" y2="266.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="258.1" font-size="16" font-weight="500" fill="#2b2a27">（一）亲依止缘浅释</text>
<line x1="767.7" y1="112.6" x2="845.4" y2="112.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="104.7" font-size="14" font-weight="400" fill="#2b2a27">1.巴利涵义</text>
<line x1="767.7" y1="149.5" x2="873.4" y2="149.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="141.6" font-size="14" font-weight="400" fill="#2b2a27">2.三种亲依止缘</text>
<line x1="767.7" y1="186.4" x2="887.4" y2="186.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="178.5" font-size="14" font-weight="400" fill="#2b2a27">3.亲依止缘的譬喻</text>
<line x1="767.7" y1="223.3" x2="943.4" y2="223.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="215.4" font-size="14" font-weight="400" fill="#2b2a27">4.亲依止缘和其他缘的关联</text>
<line x1="767.7" y1="260.2" x2="873.4" y2="260.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="252.3" font-size="14" font-weight="400" fill="#2b2a27">5.亲依止缘释义</text>
<line x1="767.7" y1="316.0" x2="1029.0" y2="316.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="289.2" font-size="14" font-weight="400" fill="#2b2a27">1. 所缘亲依止缘，强力的所缘以“所缘亲</text>
<text x="770.7" y="308.1" font-size="14" font-weight="400" fill="#2b2a27">依止的缘力”使得缘</text>
<line x1="767.7" y1="371.8" x2="1029.0" y2="371.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="345.0" font-size="14" font-weight="400" fill="#2b2a27">2. 无间亲依止缘，刚灭尽的名聚以“强力</text>
<text x="770.7" y="363.9" font-size="14" font-weight="400" fill="#2b2a27">的无间缘力”使得缘</text>
<line x1="767.7" y1="427.6" x2="1029.0" y2="427.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="400.8" font-size="14" font-weight="400" fill="#2b2a27">3. 自然亲依止缘，强而有效的任何法以“</text>
<text x="770.7" y="419.7" font-size="14" font-weight="400" fill="#2b2a27">自然亲依止的缘力”</text>
<line x1="571.7" y1="502.7" x2="721.7" y2="502.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="494.1" font-size="16" font-weight="500" fill="#2b2a27">（二）所缘亲依止缘</text>
<line x1="767.7" y1="464.5" x2="853.2" y2="464.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="456.6" font-size="14" font-weight="400" fill="#2b2a27">1. 释义差别</text>
<line x1="767.7" y1="501.4" x2="853.2" y2="501.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="493.5" font-size="14" font-weight="400" fill="#2b2a27">2. 缘法差别</text>
<line x1="767.7" y1="538.2" x2="881.2" y2="538.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="530.4" font-size="14" font-weight="400" fill="#2b2a27">3. 缘所生法差别</text>
<line x1="571.7" y1="577.9" x2="721.7" y2="577.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="569.2" font-size="16" font-weight="500" fill="#2b2a27">（三）无间亲依止缘</text>
<line x1="571.7" y1="653.5" x2="721.7" y2="653.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="644.9" font-size="16" font-weight="500" fill="#2b2a27">（四）自然亲依止缘</text>
<line x1="767.7" y1="633.6" x2="1035.2" y2="633.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="606.9" font-size="14" font-weight="400" fill="#2b2a27">1. 单纯从缘法和缘生法的角度上来说，重</text>
<text x="770.7" y="625.8" font-size="14" font-weight="400" fill="#2b2a27">叠部分比较少。只有</text>
<line x1="767.7" y1="689.4" x2="1035.2" y2="689.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="770.7" y="662.6" font-size="14" font-weight="400" fill="#2b2a27">2. 依止缘是依靠和生起之地，俱生依止是</text>
<text x="770.7" y="681.5" font-size="14" font-weight="400" fill="#2b2a27">相互依靠，依处前生</text>
<rect x="337.7" y="1120.9" width="283.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="1150.9" font-size="19" font-weight="700" fill="#2b2a27">三、前前诸善法对后后诸善法</text>
<line x1="666.7" y1="1006.5" x2="912.7" y2="1006.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="997.9" font-size="16" font-weight="500" fill="#2b2a27">（一）善法对善法的所缘亲依止缘</text>
<line x1="958.7" y1="787.5" x2="1148.4" y2="787.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="961.7" y="779.6" font-size="14" font-weight="400" fill="#2b2a27">1.缘法、缘所生法及所摄诸缘</text>
<line x1="1194.4" y1="742.5" x2="1444.8" y2="742.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1197.4" y="717.4" font-size="13" font-weight="400" fill="#2b2a27">(1)八大欲界善心(悦俱智相应有行/无行，</text>
<text x="1197.4" y="735.0" font-size="13" font-weight="400" fill="#2b2a27"> 舍俱智相应有行/无行</text>
<line x1="1194.4" y1="795.6" x2="1437.5" y2="795.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1197.4" y="770.5" font-size="13" font-weight="400" fill="#2b2a27">(2)按照论教法的五种色界禅那善心(初禅</text>
<text x="1197.4" y="788.1" font-size="13" font-weight="400" fill="#2b2a27">、 第二禅、 第三禅、 第</text>
<line x1="1194.4" y1="848.8" x2="1443.2" y2="848.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1197.4" y="823.6" font-size="13" font-weight="400" fill="#2b2a27">(3)三种出世间善心，即初果道智、二果道</text>
<text x="1197.4" y="841.2" font-size="13" font-weight="400" fill="#2b2a27">智和三果道智，但不</text>
<line x1="958.7" y1="1045.2" x2="1220.0" y2="1045.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="961.7" y="1018.4" font-size="14" font-weight="400" fill="#2b2a27">2.《发趣论·问分》之“善法对善法的所缘</text>
<text x="961.7" y="1037.3" font-size="14" font-weight="400" fill="#2b2a27">亲依止缘”</text>
<line x1="1266.0" y1="901.9" x2="1509.2" y2="901.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1269.0" y="876.8" font-size="13" font-weight="400" fill="#2b2a27">(1) 已净化的布施、已持戒的行为、已作</text>
<text x="1269.0" y="894.3" font-size="13" font-weight="400" fill="#2b2a27">斋戒业（伍波萨他业</text>
<line x1="1266.0" y1="937.4" x2="1444.2" y2="937.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1269.0" y="929.9" font-size="13" font-weight="400" fill="#2b2a27">(2) 曾善好地完成的任何善行</text>
<line x1="1266.0" y1="972.9" x2="1379.2" y2="972.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1269.0" y="965.4" font-size="13" font-weight="400" fill="#2b2a27">(3) 已体验的禅定</text>
<line x1="1266.0" y1="1026.0" x2="1509.2" y2="1026.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1269.0" y="1000.9" font-size="13" font-weight="400" fill="#2b2a27">(4) 有学圣者（初果、二果、三果圣者）</text>
<text x="1269.0" y="1018.5" font-size="13" font-weight="400" fill="#2b2a27">已生起的种姓、净化以</text>
<line x1="1266.0" y1="1061.6" x2="1422.3" y2="1061.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1269.0" y="1054.0" font-size="13" font-weight="400" fill="#2b2a27">（1）对布施等敬重、省察</text>
<line x1="1266.0" y1="1097.1" x2="1474.3" y2="1097.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1269.0" y="1089.6" font-size="13" font-weight="400" fill="#2b2a27">（2）对其他已做善行者敬重、省察</text>
<line x1="1266.0" y1="1132.7" x2="1500.3" y2="1132.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1269.0" y="1125.1" font-size="13" font-weight="400" fill="#2b2a27">（3）从禅那出来后，对禅那敬重、省察</text>
<line x1="1266.0" y1="1185.8" x2="1513.3" y2="1185.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="1269.0" y="1160.7" font-size="13" font-weight="400" fill="#2b2a27">（4）诸有学对种姓敬重、省察，对净化敬</text>
<text x="1269.0" y="1178.2" font-size="13" font-weight="400" fill="#2b2a27">重、省察；诸有学从</text>
<line x1="958.7" y1="1222.7" x2="1148.4" y2="1222.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="961.7" y="1214.8" font-size="14" font-weight="400" fill="#2b2a27">3.如何令善行成为所缘亲依止</text>
<line x1="666.7" y1="1308.6" x2="912.7" y2="1308.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="669.7" y="1300.0" font-size="16" font-weight="500" fill="#2b2a27">（二）善法对善法的无间亲依止缘</text>
<line x1="958.7" y1="1259.6" x2="1148.4" y2="1259.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="961.7" y="1251.7" font-size="14" font-weight="400" fill="#2b2a27">1.缘法、缘所生法及所摄诸缘</text>
<line x1="958.7" y1="1296.5" x2="1162.4" y2="1296.5" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="961.7" y="1288.6" font-size="14" font-weight="400" fill="#2b2a27">2.无间亲依止缘与无间缘的区别</text>
<line x1="958.7" y1="1364.3" x2="1220.0" y2="1364.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="961.7" y="1337.5" font-size="14" font-weight="400" fill="#2b2a27">3.《发趣论·问分》之“善法对善法的无间</text>
