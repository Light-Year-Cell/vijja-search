<rect x="30" y="220.3" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="257.3" font-size="26" font-weight="700" fill="#fff">第39讲-摄缘-十二</text>
<text x="48.0" y="292.4" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘39-</text>
<text x="48.0" y="327.5" font-size="26" font-weight="700" fill="#fff">释二十四缘-业缘1</text>
<rect x="337.7" y="60.6" width="226.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="90.6" font-size="19" font-weight="700" fill="#2b2a27">一、经文、释义与譬喻</text>
<line x1="609.7" y1="57.6" x2="695.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）经文</text>
<line x1="609.7" y1="97.2" x2="695.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）释义</text>
<line x1="609.7" y1="136.8" x2="695.7" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三）譬喻</text>
<rect x="337.7" y="459.7" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="489.7" font-size="19" font-weight="700" fill="#2b2a27">二、业缘经文详释</text>
<line x1="571.7" y1="198.0" x2="844.6" y2="198.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="167.8" font-size="16" font-weight="500" fill="#2b2a27">(1)如《小业分别经》所述，善有善报</text>
<text x="574.7" y="189.4" font-size="16" font-weight="500" fill="#2b2a27">，恶有恶报，造下怎样的</text>
<line x1="571.7" y1="259.2" x2="844.6" y2="259.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="229.0" font-size="16" font-weight="500" fill="#2b2a27">(2)业是自作自受的，不可能报在别人</text>
<text x="574.7" y="250.6" font-size="16" font-weight="500" fill="#2b2a27">身上。所以佛陀说</text>
<line x1="571.7" y1="320.4" x2="844.6" y2="320.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="290.2" font-size="16" font-weight="500" fill="#2b2a27">(3)业缘包含俱生业缘和异刹那业缘，</text>
<text x="574.7" y="311.8" font-size="16" font-weight="500" fill="#2b2a27">即：思心所生起的当下</text>
<line x1="571.7" y1="360.0" x2="787.6" y2="360.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="351.4" font-size="16" font-weight="500" fill="#2b2a27">1.缘法、缘所生法及所摄诸缘</text>
<line x1="571.7" y1="472.1" x2="787.6" y2="472.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="463.4" font-size="16" font-weight="500" fill="#2b2a27">2.按业与果报所隔时长的分类</text>
<line x1="833.6" y1="396.9" x2="1015.4" y2="396.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="836.6" y="389.0" font-size="14" font-weight="400" fill="#2b2a27">（1）前后无间的圣道和圣果</text>
<line x1="833.6" y1="433.8" x2="1015.4" y2="433.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="836.6" y="425.9" font-size="14" font-weight="400" fill="#2b2a27">（2）非前后无间的心识刹那</text>
<line x1="833.6" y1="470.7" x2="973.4" y2="470.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="836.6" y="462.8" font-size="14" font-weight="400" fill="#2b2a27">（3）前一世累积的业</text>
<line x1="833.6" y1="507.6" x2="1015.4" y2="507.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="836.6" y="499.7" font-size="14" font-weight="400" fill="#2b2a27">（4）较近的过去世累积的业</text>
<line x1="833.6" y1="544.5" x2="1001.4" y2="544.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="836.6" y="536.6" font-size="14" font-weight="400" fill="#2b2a27">（5）许多劫之前累积的业</text>
<line x1="571.7" y1="638.1" x2="771.6" y2="638.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="629.5" font-size="16" font-weight="500" fill="#2b2a27">3.按善、不善思的果报分类</text>
<line x1="817.6" y1="581.4" x2="931.1" y2="581.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="820.6" y="573.5" font-size="14" font-weight="400" fill="#2b2a27">(1)不善思的果报</text>
<line x1="817.6" y1="618.3" x2="945.1" y2="618.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="820.6" y="610.4" font-size="14" font-weight="400" fill="#2b2a27">(2)欲界善思的果报</text>
<line x1="817.6" y1="655.2" x2="1001.1" y2="655.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="820.6" y="647.3" font-size="14" font-weight="400" fill="#2b2a27">(3)色界、无色界善思的果报</text>
<line x1="817.6" y1="692.1" x2="959.1" y2="692.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="820.6" y="684.2" font-size="14" font-weight="400" fill="#2b2a27">(4)出世间善思的果报</text>
<line x1="571.7" y1="759.6" x2="849.0" y2="759.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="729.4" font-size="16" font-weight="500" fill="#2b2a27">（二）俱生业缘（sahajāta-kammapa</text>
<text x="574.7" y="751.0" font-size="16" font-weight="500" fill="#2b2a27">ccaya）</text>
<line x1="895.0" y1="729.0" x2="1084.7" y2="729.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="898.0" y="721.1" font-size="14" font-weight="400" fill="#2b2a27">1.缘法、缘所生法及所摄诸缘</text>
<line x1="895.0" y1="765.9" x2="1084.7" y2="765.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="898.0" y="758.0" font-size="14" font-weight="400" fill="#2b2a27">2.俱生业缘对当下身心的影响</text>
<line x1="571.7" y1="805.5" x2="737.7" y2="805.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="796.9" font-size="16" font-weight="500" fill="#2b2a27">（三）两种业缘的运作</text>
</svg>