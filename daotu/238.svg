<rect x="30" y="668.2" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="705.2" font-size="26" font-weight="700" fill="#fff">第42讲-摄缘-十二</text>
<text x="48.0" y="740.3" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘42-</text>
<text x="48.0" y="775.4" font-size="26" font-weight="700" fill="#fff">释二十四缘-业缘4</text>
<rect x="337.7" y="708.0" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="738.0" font-size="19" font-weight="700" fill="#2b2a27">五、业的分类</text>
<line x1="533.7" y1="341.4" x2="683.7" y2="341.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="332.8" font-size="16" font-weight="500" fill="#2b2a27">（一）依产生的作用</text>
<line x1="729.7" y1="196.0" x2="793.4" y2="196.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="188.1" font-size="14" font-weight="400" fill="#2b2a27">3.阻碍业</text>
<line x1="839.4" y1="53.5" x2="930.6" y2="53.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="46.0" font-size="13" font-weight="400" fill="#2b2a27">（1）未生怨王</text>
<line x1="839.4" y1="89.1" x2="943.6" y2="89.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="81.5" font-size="13" font-weight="400" fill="#2b2a27">（2）玛莉咖王后</text>
<line x1="839.4" y1="142.2" x2="1084.0" y2="142.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="117.1" font-size="13" font-weight="400" fill="#2b2a27">(1) 首先， 玛莉咖王后问， 为什么有些</text>
<text x="842.4" y="134.7" font-size="13" font-weight="400" fill="#2b2a27">女人丑陋、 贫穷且无威势</text>
<line x1="839.4" y1="195.3" x2="1084.0" y2="195.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="170.2" font-size="13" font-weight="400" fill="#2b2a27">(2) 其次， 玛莉咖王后问， 为什么有些</text>
<text x="842.4" y="187.8" font-size="13" font-weight="400" fill="#2b2a27">女人丑陋， 却富有且具大</text>
<line x1="839.4" y1="248.4" x2="1084.0" y2="248.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="223.3" font-size="13" font-weight="400" fill="#2b2a27">(3) 再者， 玛莉咖王后问， 为什么有些</text>
<text x="842.4" y="240.8" font-size="13" font-weight="400" fill="#2b2a27">女人美丽， 却贫穷且无威</text>
<line x1="839.4" y1="301.5" x2="1084.0" y2="301.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="276.4" font-size="13" font-weight="400" fill="#2b2a27">(4) 最后， 玛莉咖王后问， 为什么有些</text>
<text x="842.4" y="293.9" font-size="13" font-weight="400" fill="#2b2a27">女人美丽， 富有且具大威</text>
<line x1="839.4" y1="337.1" x2="1034.6" y2="337.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="329.5" font-size="13" font-weight="400" fill="#2b2a27">（3）生命期间的阻碍业和支持业</text>
<line x1="729.7" y1="484.1" x2="793.4" y2="484.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="476.2" font-size="14" font-weight="400" fill="#2b2a27">4.毁坏业</text>
<line x1="839.4" y1="390.2" x2="1089.8" y2="390.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="365.1" font-size="13" font-weight="400" fill="#2b2a27">(1) 它中止较弱的业， 且既不带来自己的</text>
<text x="842.4" y="382.6" font-size="13" font-weight="400" fill="#2b2a27">果报， 也阻止其他业带</text>
<line x1="839.4" y1="443.3" x2="1089.8" y2="443.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="418.2" font-size="13" font-weight="400" fill="#2b2a27">(2) 它中止较弱的业， 虽然不带来自己的</text>
<text x="842.4" y="435.7" font-size="13" font-weight="400" fill="#2b2a27">果报， 但却允许其他业</text>
<line x1="839.4" y1="478.8" x2="1082.5" y2="478.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="471.3" font-size="13" font-weight="400" fill="#2b2a27">(3) 它中止较弱的业，并引生自己的果报</text>
<line x1="839.4" y1="514.4" x2="984.2" y2="514.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="506.8" font-size="13" font-weight="400" fill="#2b2a27">(1)中止；无果报；阻止</text>
<line x1="839.4" y1="549.9" x2="995.6" y2="549.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="542.4" font-size="13" font-weight="400" fill="#2b2a27">（2）中止；无果报；允许</text>
<line x1="839.4" y1="585.4" x2="982.6" y2="585.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="842.4" y="577.9" font-size="13" font-weight="400" fill="#2b2a27">（3）中止；自己的果报</text>
<line x1="533.7" y1="776.9" x2="651.7" y2="776.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="768.3" font-size="16" font-weight="500" fill="#2b2a27">（二）同一性理</text>
<line x1="697.7" y1="641.2" x2="959.0" y2="641.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="614.4" font-size="14" font-weight="400" fill="#2b2a27">(1) 若一个业带来结生时与生命期间的果</text>
<text x="700.7" y="633.3" font-size="14" font-weight="400" fill="#2b2a27">报名色， 它作为令生业</text>
<line x1="697.7" y1="697.0" x2="959.0" y2="697.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="670.2" font-size="14" font-weight="400" fill="#2b2a27">(2) 若一个业支助不善或善的结生令生业</text>
<text x="700.7" y="689.1" font-size="14" font-weight="400" fill="#2b2a27">的果报成熟， 并使果报</text>
<line x1="697.7" y1="752.8" x2="959.0" y2="752.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="726.0" font-size="14" font-weight="400" fill="#2b2a27">(3) 若一个业障碍不善或善的结生令生业</text>
<text x="700.7" y="744.9" font-size="14" font-weight="400" fill="#2b2a27">的果报， 它作为阻碍业</text>
<line x1="697.7" y1="808.6" x2="959.0" y2="808.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="781.8" font-size="14" font-weight="400" fill="#2b2a27">(4) 若一个业得到控制权并中止不善或善</text>
<text x="700.7" y="800.7" font-size="14" font-weight="400" fill="#2b2a27">令生业的果报， 它作为</text>
<line x1="697.7" y1="845.5" x2="875.0" y2="845.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="837.6" font-size="14" font-weight="400" fill="#2b2a27">(1) 支助其他不善业的果报</text>
<line x1="697.7" y1="882.4" x2="833.0" y2="882.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="874.5" font-size="14" font-weight="400" fill="#2b2a27">(2) 阻碍善业的果报</text>
<line x1="697.7" y1="919.3" x2="791.0" y2="919.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="700.7" y="911.4" font-size="14" font-weight="400" fill="#2b2a27">(3) 中止善业</text>
<line x1="533.7" y1="1147.9" x2="683.7" y2="1147.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="1139.3" font-size="16" font-weight="500" fill="#2b2a27">（三）依成熟的顺序</text>
<line x1="729.7" y1="956.2" x2="904.8" y2="956.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="948.3" font-size="14" font-weight="400" fill="#2b2a27">(1) 重业(garuka-kamma)</text>
<line x1="729.7" y1="993.1" x2="918.8" y2="993.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="985.2" font-size="14" font-weight="400" fill="#2b2a27">(2) 惯行业(āciṇṇa-kamma)</text>
<line x1="729.7" y1="1030.0" x2="918.8" y2="1030.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="1022.1" font-size="14" font-weight="400" fill="#2b2a27">(3) 临死业(āsanna-kamma)</text>
<line x1="729.7" y1="1066.9" x2="926.6" y2="1066.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="1059.0" font-size="14" font-weight="400" fill="#2b2a27">(4) 已作业(katattā-kamma)</text>
<line x1="729.7" y1="1165.0" x2="779.4" y2="1165.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="1157.1" font-size="14" font-weight="400" fill="#2b2a27">1.重业</text>
<line x1="825.4" y1="1120.0" x2="1070.0" y2="1120.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="828.4" y="1094.9" font-size="13" font-weight="400" fill="#2b2a27">(1) 无作见： 否定善恶业的运作。 即否</text>
<text x="828.4" y="1112.5" font-size="13" font-weight="400" fill="#2b2a27">定有善恶业， 认为无论造</text>
<line x1="825.4" y1="1173.1" x2="1070.0" y2="1173.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="828.4" y="1148.0" font-size="13" font-weight="400" fill="#2b2a27">(2) 无因见： 否定果报有因有缘。 即认</text>
<text x="828.4" y="1165.6" font-size="13" font-weight="400" fill="#2b2a27">为所有事情的发生， 要么</text>
<line x1="825.4" y1="1226.2" x2="1075.8" y2="1226.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="828.4" y="1201.1" font-size="13" font-weight="400" fill="#2b2a27">(3) 虚无见： 认为任何因都不会有果报。</text>
<text x="828.4" y="1218.7" font-size="13" font-weight="400" fill="#2b2a27"> 即认为只有物质才是真</text>
<line x1="729.7" y1="1263.1" x2="793.4" y2="1263.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="1255.2" font-size="14" font-weight="400" fill="#2b2a27">2.惯行业</text>
<line x1="729.7" y1="1300.0" x2="793.4" y2="1300.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="1292.1" font-size="14" font-weight="400" fill="#2b2a27">3.临死业</text>
<line x1="729.7" y1="1336.9" x2="793.4" y2="1336.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="732.7" y="1329.0" font-size="14" font-weight="400" fill="#2b2a27">4.已作业</text>
</svg>