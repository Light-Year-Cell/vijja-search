<rect x="30" y="252.4" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="289.4" font-size="26" font-weight="700" fill="#fff">第24讲-摄缘-十二</text>
<text x="48.0" y="324.5" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘24-</text>
<text x="48.0" y="359.6" font-size="26" font-weight="700" fill="#fff">释二十四缘-依止缘</text>
<text x="48.0" y="394.7" font-size="26" font-weight="700" fill="#fff">2</text>
<rect x="337.7" y="60.6" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="90.6" font-size="19" font-weight="700" fill="#2b2a27">一、依处所缘前生依止缘</text>
<line x1="628.7" y1="57.6" x2="874.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）最后的心色与临死心路过程</text>
<line x1="628.7" y1="97.2" x2="858.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）观禅依处所缘前生依止缘</text>
<line x1="628.7" y1="136.8" x2="874.7" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三）缘法、缘所生法及所摄诸缘</text>
<rect x="337.7" y="558.9" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="588.9" font-size="19" font-weight="700" fill="#2b2a27">二、善用依止缘</text>
<line x1="552.7" y1="268.2" x2="766.7" y2="268.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="259.6" font-size="16" font-weight="500" fill="#2b2a27">（一）相互依止的生命四要素</text>
<line x1="812.7" y1="192.6" x2="1072.4" y2="192.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="165.8" font-size="14" font-weight="400" fill="#2b2a27">1.（色法）物质：包括四大及四大所造色</text>
<text x="815.7" y="184.7" font-size="14" font-weight="400" fill="#2b2a27">。这些（色法）物质的</text>
<line x1="812.7" y1="248.4" x2="1072.4" y2="248.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="221.6" font-size="14" font-weight="400" fill="#2b2a27">2.（名法）精神：包括八十九种心及五十</text>
<text x="815.7" y="240.5" font-size="14" font-weight="400" fill="#2b2a27">二种心所。依心的定律</text>
<line x1="812.7" y1="304.2" x2="1074.0" y2="304.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="277.4" font-size="14" font-weight="400" fill="#2b2a27">3. 业： 由于造作善和不善而留下的业的</text>
<text x="815.7" y="296.3" font-size="14" font-weight="400" fill="#2b2a27">潜力。 依业的定律运作</text>
<line x1="812.7" y1="360.0" x2="1080.2" y2="360.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="333.2" font-size="14" font-weight="400" fill="#2b2a27">4. 其余五种心理余势：包括随眠烦恼，贪</text>
<text x="815.7" y="352.1" font-size="14" font-weight="400" fill="#2b2a27">、嗔、痴与无贪、无</text>
<line x1="552.7" y1="399.6" x2="718.7" y2="399.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="391.0" font-size="16" font-weight="500" fill="#2b2a27">（二）心路依止于有分</text>
<line x1="552.7" y1="439.2" x2="750.7" y2="439.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="430.6" font-size="16" font-weight="500" fill="#2b2a27">（三）果报如此，速行可变</text>
<line x1="552.7" y1="625.1" x2="814.7" y2="625.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="616.5" font-size="16" font-weight="500" fill="#2b2a27">（四）强化具有突出缘力的俱生名法</text>
<line x1="860.7" y1="476.1" x2="960.2" y2="476.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="863.7" y="468.2" font-size="14" font-weight="400" fill="#2b2a27">1. 因缘的作用</text>
<line x1="860.7" y1="513.0" x2="1002.2" y2="513.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="863.7" y="505.1" font-size="14" font-weight="400" fill="#2b2a27">2. 四俱生主导的作用</text>
<line x1="860.7" y1="549.9" x2="960.2" y2="549.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="863.7" y="542.0" font-size="14" font-weight="400" fill="#2b2a27">3. 根缘的作用</text>
<line x1="860.7" y1="586.8" x2="974.2" y2="586.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="863.7" y="578.9" font-size="14" font-weight="400" fill="#2b2a27">4. 禅那缘的作用</text>
<line x1="860.7" y1="623.7" x2="960.2" y2="623.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="863.7" y="615.8" font-size="14" font-weight="400" fill="#2b2a27">5. 道缘的作用</text>
<line x1="860.7" y1="660.6" x2="974.2" y2="660.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="863.7" y="652.7" font-size="14" font-weight="400" fill="#2b2a27">6. 名食缘的作用</text>
<line x1="860.7" y1="697.5" x2="988.2" y2="697.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="863.7" y="689.6" font-size="14" font-weight="400" fill="#2b2a27">7. 俱生业缘的作用</text>
<line x1="860.7" y1="734.4" x2="988.2" y2="734.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="863.7" y="726.5" font-size="14" font-weight="400" fill="#2b2a27">8. 俱生有缘的作用</text>
<line x1="860.7" y1="771.3" x2="1016.2" y2="771.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="863.7" y="763.4" font-size="14" font-weight="400" fill="#2b2a27">9. 俱生不离去缘的作用</text>
<line x1="552.7" y1="810.9" x2="750.7" y2="810.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="802.3" font-size="16" font-weight="500" fill="#2b2a27">（五）诸缘合力，提升善业</text>
<line x1="552.7" y1="922.9" x2="766.7" y2="922.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="914.3" font-size="16" font-weight="500" fill="#2b2a27">（六）依处前生依止缘的善用</text>
<line x1="812.7" y1="847.8" x2="982.2" y2="847.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="839.9" font-size="14" font-weight="400" fill="#2b2a27">1. 善用眼依处前生依止缘</text>
<line x1="812.7" y1="884.7" x2="982.2" y2="884.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="876.8" font-size="14" font-weight="400" fill="#2b2a27">2. 善用耳依处前生依止缘</text>
<line x1="812.7" y1="921.6" x2="982.2" y2="921.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="913.7" font-size="14" font-weight="400" fill="#2b2a27">3. 善用鼻依处前生依止缘</text>
<line x1="812.7" y1="958.5" x2="982.2" y2="958.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="950.6" font-size="14" font-weight="400" fill="#2b2a27">4. 善用舌依处前生依止缘</text>
<line x1="812.7" y1="995.4" x2="982.2" y2="995.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="815.7" y="987.5" font-size="14" font-weight="400" fill="#2b2a27">5. 善用心依处前生依止缘</text>
</svg>