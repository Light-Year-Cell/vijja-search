<rect x="30" y="271.9" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="308.9" font-size="26" font-weight="700" fill="#fff">第3讲-摄缘-十二缘</text>
<text x="48.0" y="344.0" font-size="26" font-weight="700" fill="#fff">起与二十四缘3-缘</text>
<text x="48.0" y="379.1" font-size="26" font-weight="700" fill="#fff">概说3</text>
<rect x="337.7" y="30.0" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、我们有自由意志吗？</text>
<rect x="337.7" y="174.0" width="188.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="204.0" font-size="19" font-weight="700" fill="#2b2a27">二、被束缚的表现</text>
<line x1="571.7" y1="115.2" x2="753.7" y2="115.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="106.7" font-size="16" font-weight="500" fill="#2b2a27">（一）被恶愿束缚的表现</text>
<line x1="571.7" y1="154.8" x2="753.7" y2="154.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="146.2" font-size="16" font-weight="500" fill="#2b2a27">（二）被善缘牵引的表现</text>
<line x1="571.7" y1="194.4" x2="785.7" y2="194.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="185.8" font-size="16" font-weight="500" fill="#2b2a27">（三）被欲和物种束缚的表现</text>
<line x1="571.7" y1="255.6" x2="835.6" y2="255.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="225.4" font-size="16" font-weight="500" fill="#2b2a27">（四）被看似“自由”的意志束缚的表</text>
<text x="574.7" y="247.0" font-size="16" font-weight="500" fill="#2b2a27">现</text>
<line x1="571.7" y1="316.8" x2="849.7" y2="316.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="574.7" y="286.6" font-size="16" font-weight="500" fill="#2b2a27">（五）习气、环境、饮食、身体条件的</text>
<text x="574.7" y="308.2" font-size="16" font-weight="500" fill="#2b2a27">束缚</text>
<rect x="337.7" y="435.5" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="465.5" font-size="19" font-weight="700" fill="#2b2a27">三、哪些东西束缚着我们？</text>
<line x1="647.7" y1="420.3" x2="815.6" y2="420.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="650.7" y="411.7" font-size="16" font-weight="500" fill="#2b2a27">（一）无我——谁在轮回</text>
<line x1="861.6" y1="372.6" x2="1132.5" y2="372.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="864.6" y="345.8" font-size="14" font-weight="400" fill="#2b2a27">2. 轮回的主体是依 24 缘刹那生灭的五蕴</text>
<text x="864.6" y="364.7" font-size="14" font-weight="400" fill="#2b2a27">名色流， 各个轮回的有</text>
<line x1="861.6" y1="428.4" x2="1129.1" y2="428.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="864.6" y="401.6" font-size="14" font-weight="400" fill="#2b2a27">3. 有情居住的器世间的形成由时节定律规</text>
<text x="864.6" y="420.5" font-size="14" font-weight="400" fill="#2b2a27">范，有情与所居住的</text>
<line x1="861.6" y1="484.2" x2="1123.0" y2="484.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="864.6" y="457.4" font-size="14" font-weight="400" fill="#2b2a27">4. 五蕴有情的四生色法各有其缘， 与名</text>
<text x="864.6" y="476.3" font-size="14" font-weight="400" fill="#2b2a27">法的过去现在与未来有关</text>
<line x1="647.7" y1="523.9" x2="893.7" y2="523.9" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="650.7" y="515.2" font-size="16" font-weight="500" fill="#2b2a27">（二）洞悉缘起法给生命重新编程</text>
<rect x="337.7" y="535.9" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="565.9" font-size="19" font-weight="700" fill="#2b2a27">四、突破口在哪里？</text>
<rect x="337.7" y="593.5" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="623.5" font-size="19" font-weight="700" fill="#2b2a27">五、我们该如何做？</text>
</svg>