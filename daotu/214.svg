<rect x="30" y="387.3" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="424.3" font-size="26" font-weight="700" fill="#fff">第18讲-摄缘-十二</text>
<text x="48.0" y="459.4" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘18-</text>
<text x="48.0" y="494.5" font-size="26" font-weight="700" fill="#fff">释二十四缘-无间缘</text>
<text x="48.0" y="529.6" font-size="26" font-weight="700" fill="#fff">与等无间缘2</text>
<rect x="337.7" y="76.8" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="106.8" font-size="19" font-weight="700" fill="#2b2a27">一、从究竟法看死生无间</text>
<line x1="628.7" y1="57.6" x2="906.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）欲界死生之间名聚相续流的组成</text>
<line x1="628.7" y1="118.8" x2="906.7" y2="118.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）色界、无色界死生之间名聚相续</text>
<text x="631.7" y="110.2" font-size="16" font-weight="500" fill="#2b2a27">流的组成</text>
<line x1="628.7" y1="180.0" x2="906.7" y2="180.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="631.7" y="149.8" font-size="16" font-weight="500" fill="#2b2a27">（三）色界和无色界有情投生欲界为何</text>
<text x="631.7" y="171.4" font-size="16" font-weight="500" fill="#2b2a27">会有差别呢？</text>
<rect x="337.7" y="260.1" width="293.6" height="73.3" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="290.1" font-size="19" font-weight="700" fill="#2b2a27">二、无间生灭导致的片面认知—</text>
<text x="355.7" y="315.8" font-size="19" font-weight="700" fill="#2b2a27">—我在转世</text>
<line x1="677.3" y1="219.6" x2="955.3" y2="219.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="211.0" font-size="16" font-weight="500" fill="#2b2a27">（一）故事：吴宇衡前世借钱来生照还</text>
<line x1="677.3" y1="280.8" x2="955.3" y2="280.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="250.6" font-size="16" font-weight="500" fill="#2b2a27">（二）故事：吴民恩前世为人母转世男</text>
<text x="680.3" y="272.2" font-size="16" font-weight="500" fill="#2b2a27">儿身</text>
<line x1="677.3" y1="320.4" x2="941.2" y2="320.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="311.8" font-size="16" font-weight="500" fill="#2b2a27">(三)故事：前世是只猪，今生怕屠夫</text>
<line x1="677.3" y1="360.0" x2="859.3" y2="360.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="351.4" font-size="16" font-weight="500" fill="#2b2a27">（四）古今中外类似例子</text>
<line x1="677.3" y1="399.6" x2="907.3" y2="399.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="391.0" font-size="16" font-weight="500" fill="#2b2a27">（五）大纳拉德卡萨帕本生故事</text>
<rect x="337.7" y="575.8" width="293.6" height="73.3" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="605.8" font-size="19" font-weight="700" fill="#2b2a27">三、无间生灭导致的整体认知—</text>
<text x="355.7" y="631.5" font-size="19" font-weight="700" fill="#2b2a27">—密集</text>
<line x1="677.3" y1="460.8" x2="948.3" y2="460.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="430.6" font-size="16" font-weight="500" fill="#2b2a27">（一）名法的密集令我们误以为有“我</text>
<text x="680.3" y="452.2" font-size="16" font-weight="500" fill="#2b2a27">”</text>
<line x1="677.3" y1="580.3" x2="795.3" y2="580.3" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="571.7" font-size="16" font-weight="500" fill="#2b2a27">（二）四种密集</text>
<line x1="841.3" y1="497.7" x2="926.8" y2="497.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="844.3" y="489.8" font-size="14" font-weight="400" fill="#2b2a27">1. 相续密集</text>
<line x1="841.3" y1="534.6" x2="926.8" y2="534.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="844.3" y="526.7" font-size="14" font-weight="400" fill="#2b2a27">2. 组合密集</text>
<line x1="841.3" y1="601.8" x2="926.8" y2="601.8" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="844.3" y="593.9" font-size="14" font-weight="400" fill="#2b2a27">3. 作用密集</text>
<line x1="972.8" y1="587.7" x2="1221.7" y2="587.7" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="975.8" y="562.6" font-size="13" font-weight="400" fill="#2b2a27">（1）心有14种作用，分别于心路、离心路</text>
<text x="975.8" y="580.1" font-size="13" font-weight="400" fill="#2b2a27">中起作用。这是指心</text>
<line x1="972.8" y1="623.2" x2="1220.1" y2="623.2" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="975.8" y="615.7" font-size="13" font-weight="400" fill="#2b2a27">（2）一个名聚里不同的名法有不同的作用</text>
<line x1="841.3" y1="660.1" x2="919.0" y2="660.1" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="844.3" y="652.2" font-size="14" font-weight="400" fill="#2b2a27">4.所缘密集</text>
<line x1="677.3" y1="721.4" x2="955.3" y2="721.4" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="691.1" font-size="16" font-weight="500" fill="#2b2a27">（三）由于四种密集的遮蔽，无法见到</text>
<text x="680.3" y="712.8" font-size="16" font-weight="500" fill="#2b2a27">生命的真相</text>
<line x1="677.3" y1="761.0" x2="955.3" y2="761.0" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="752.4" font-size="16" font-weight="500" fill="#2b2a27">（四）破除密集后为何还要组合观察？</text>
<line x1="677.3" y1="800.6" x2="955.3" y2="800.6" stroke="#3f9b5b" stroke-width="1.6" opacity=".8"/>
<text x="680.3" y="792.0" font-size="16" font-weight="500" fill="#2b2a27">（五）生命相续流刹那生灭又无间相续</text>
<rect x="337.7" y="812.6" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="842.6" font-size="19" font-weight="700" fill="#2b2a27">四、洞察缘起，方知因果</text>
</svg>