<rect x="30" y="273.8" width="261.7" height="127.3" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="310.8" font-size="26" font-weight="700" fill="#fff">第47讲-摄缘-十二</text>
<text x="48.0" y="345.9" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘47-</text>
<text x="48.0" y="381.0" font-size="26" font-weight="700" fill="#fff">释二十四缘-食缘1</text>
<rect x="337.7" y="60.6" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="90.6" font-size="19" font-weight="700" fill="#2b2a27">一、经文与释义</text>
<line x1="552.7" y1="57.6" x2="654.7" y2="57.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="49.0" font-size="16" font-weight="500" fill="#2b2a27">（一）缘广释</text>
<line x1="700.7" y1="54.9" x2="875.8" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="703.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">15.食缘(āhāra-paccaya)</text>
<line x1="552.7" y1="97.2" x2="670.7" y2="97.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="88.6" font-size="16" font-weight="500" fill="#2b2a27">（二）经文释义</text>
<line x1="552.7" y1="136.8" x2="686.7" y2="136.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="128.2" font-size="16" font-weight="500" fill="#2b2a27">（三）食缘的譬喻</text>
<rect x="337.7" y="566.7" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="596.7" font-size="19" font-weight="700" fill="#2b2a27">二、经文详释</text>
<line x1="533.7" y1="202.0" x2="621.6" y2="202.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="193.4" font-size="16" font-weight="500" fill="#2b2a27">(一)色食缘</text>
<line x1="667.6" y1="173.7" x2="913.3" y2="173.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="670.6" y="165.8" font-size="14" font-weight="400" fill="#2b2a27">1.色食缘的缘法、缘所生法及所摄诸缘</text>
<line x1="667.6" y1="227.7" x2="843.3" y2="227.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="670.6" y="219.8" font-size="14" font-weight="400" fill="#2b2a27">2.外在的食素与内在的食素</text>
<line x1="889.3" y1="209.2" x2="1136.6" y2="209.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="892.3" y="201.7" font-size="13" font-weight="400" fill="#2b2a27">（1）外在食素转化为内在食素的两个阶段</text>
<line x1="889.3" y1="244.8" x2="1019.6" y2="244.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="892.3" y="237.2" font-size="13" font-weight="400" fill="#2b2a27">（2）四种内在的食素</text>
<line x1="533.7" y1="284.4" x2="685.6" y2="284.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="275.8" font-size="16" font-weight="500" fill="#2b2a27">(一)第一种内在食素</text>
<line x1="533.7" y1="324.0" x2="701.6" y2="324.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="315.4" font-size="16" font-weight="500" fill="#2b2a27">(二)第二种内在的食素</text>
<line x1="533.7" y1="363.6" x2="701.6" y2="363.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="355.0" font-size="16" font-weight="500" fill="#2b2a27">(三)第三种内在的食素</text>
<line x1="533.7" y1="583.0" x2="701.6" y2="583.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="574.4" font-size="16" font-weight="500" fill="#2b2a27">(四)第四种内在的食素</text>
<line x1="747.6" y1="419.4" x2="1015.1" y2="419.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="750.6" y="392.6" font-size="14" font-weight="400" fill="#2b2a27">(1)业生色可以产生四到五代的食生食素八</text>
<text x="750.6" y="411.5" font-size="14" font-weight="400" fill="#2b2a27">法聚</text>
<line x1="747.6" y1="456.3" x2="931.1" y2="456.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="750.6" y="448.4" font-size="14" font-weight="400" fill="#2b2a27">(2)心生色可以产生两到三代</text>
<line x1="747.6" y1="512.1" x2="1015.1" y2="512.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="750.6" y="485.3" font-size="14" font-weight="400" fill="#2b2a27">(3)食生色可以产生十到十二代，具体能产</text>
<text x="750.6" y="504.2" font-size="14" font-weight="400" fill="#2b2a27">生多少代跟食物的质</text>
<line x1="747.6" y1="567.9" x2="1015.1" y2="567.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="750.6" y="541.1" font-size="14" font-weight="400" fill="#2b2a27">(4)新一代的时节生色聚可以产生多少代，</text>
<text x="750.6" y="560.0" font-size="14" font-weight="400" fill="#2b2a27">视产生第一代时节生</text>
<line x1="747.6" y1="623.7" x2="1015.1" y2="623.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="750.6" y="596.9" font-size="14" font-weight="400" fill="#2b2a27">(1)第一细类和消化之火一起，可以有能力</text>
<text x="750.6" y="615.8" font-size="14" font-weight="400" fill="#2b2a27">支持业生、心生、时</text>
<line x1="747.6" y1="679.5" x2="1015.1" y2="679.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="750.6" y="652.7" font-size="14" font-weight="400" fill="#2b2a27">(2)第二细类没有去资助四因生色聚的食素</text>
<text x="750.6" y="671.6" font-size="14" font-weight="400" fill="#2b2a27">，在其他内在食生色</text>
<line x1="747.6" y1="716.4" x2="909.3" y2="716.4" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="750.6" y="708.5" font-size="14" font-weight="400" fill="#2b2a27">3.食物对身体以食缘为缘</text>
<line x1="747.6" y1="753.3" x2="923.3" y2="753.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="750.6" y="745.4" font-size="14" font-weight="400" fill="#2b2a27">4.药物对身体也以食缘为缘</text>
<line x1="533.7" y1="810.0" x2="621.6" y2="810.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="801.4" font-size="16" font-weight="500" fill="#2b2a27">(二)名食缘</text>
<line x1="667.6" y1="790.2" x2="913.3" y2="790.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="670.6" y="782.3" font-size="14" font-weight="400" fill="#2b2a27">1.名食缘的缘法、缘所生法及所摄诸缘</text>
<line x1="667.6" y1="827.1" x2="801.3" y2="827.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="670.6" y="819.2" font-size="14" font-weight="400" fill="#2b2a27">2.触食、思食与识食</text>
<line x1="533.7" y1="866.7" x2="667.7" y2="866.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="858.1" font-size="16" font-weight="500" fill="#2b2a27">（一）民以食为天</text>
<line x1="533.7" y1="906.3" x2="747.7" y2="906.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="897.7" font-size="16" font-weight="500" fill="#2b2a27">（二）渴爱是摄取四食的主因</text>
<line x1="533.7" y1="1004.6" x2="763.7" y2="1004.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="996.0" font-size="16" font-weight="500" fill="#2b2a27">（三）身心对四食的吸收与同化</text>
<line x1="809.7" y1="943.2" x2="915.4" y2="943.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="812.7" y="935.3" font-size="14" font-weight="400" fill="#2b2a27">1.中国人看团食</text>
<line x1="809.7" y1="980.1" x2="1029.0" y2="980.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="812.7" y="972.2" font-size="14" font-weight="400" fill="#2b2a27">2.中国的吃文化——色食背后的名食</text>
<line x1="809.7" y1="1017.0" x2="901.4" y2="1017.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="812.7" y="1009.1" font-size="14" font-weight="400" fill="#2b2a27">3.素食与荤食</text>
<line x1="809.7" y1="1072.8" x2="1069.4" y2="1072.8" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="812.7" y="1046.0" font-size="14" font-weight="400" fill="#2b2a27">4.进食者在消耗食物，食物也吞噬了进食</text>
<text x="812.7" y="1064.9" font-size="14" font-weight="400" fill="#2b2a27">者</text>
</svg>