<rect x="30" y="276.3" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="313.3" font-size="26" font-weight="700" fill="#fff">第17讲-摄缘-十二</text>
<text x="48.0" y="348.4" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘17-</text>
<text x="48.0" y="383.5" font-size="26" font-weight="700" fill="#fff">释二十四缘-无间缘</text>
<text x="48.0" y="418.6" font-size="26" font-weight="700" fill="#fff">与等无间缘1</text>
<rect x="337.7" y="30.0" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="60.0" font-size="19" font-weight="700" fill="#2b2a27">一、死亡和投生之间到底发生了</text>
<text x="355.7" y="85.7" font-size="19" font-weight="700" fill="#2b2a27">什么？</text>
<rect x="337.7" y="124.1" width="264.0" height="47.7" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="154.1" font-size="19" font-weight="700" fill="#2b2a27">二、无间缘与等无间缘释义</text>
<line x1="647.7" y1="140.9" x2="813.7" y2="140.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="650.7" y="132.3" font-size="16" font-weight="500" fill="#2b2a27">（一）巴利原文之解释</text>
<line x1="647.7" y1="180.5" x2="877.7" y2="180.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="650.7" y="171.9" font-size="16" font-weight="500" fill="#2b2a27">（二）无间缘与等无间缘之区别</text>
<rect x="337.7" y="192.5" width="245.0" height="47.7" rx="8" fill="#fff" stroke="#3f9b5b" stroke-width="2.2"/>
<text x="355.7" y="222.5" font-size="19" font-weight="700" fill="#2b2a27">三、缘法与缘所生法总说</text>
<rect x="337.7" y="309.1" width="169.0" height="47.7" rx="8" fill="#fff" stroke="#2f86c4" stroke-width="2.2"/>
<text x="355.7" y="339.1" font-size="19" font-weight="700" fill="#2b2a27">四、无间缘广释</text>
<line x1="552.7" y1="277.8" x2="814.7" y2="277.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="269.1" font-size="16" font-weight="500" fill="#2b2a27">（一）五门心路过程中的五识对意界</text>
<line x1="552.7" y1="317.4" x2="830.7" y2="317.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="308.8" font-size="16" font-weight="500" fill="#2b2a27">（二）五门心路过程中的意界对意识界</text>
<line x1="552.7" y1="357.0" x2="686.7" y2="357.0" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="348.4" font-size="16" font-weight="500" fill="#2b2a27">（三）七组无间缘</text>
<line x1="552.7" y1="424.4" x2="830.7" y2="424.4" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="555.7" y="394.2" font-size="16" font-weight="500" fill="#2b2a27">（四）从心流运作的角度分析七组无间</text>
<text x="555.7" y="415.9" font-size="16" font-weight="500" fill="#2b2a27">缘</text>
<line x1="876.7" y1="393.9" x2="990.2" y2="393.9" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="879.7" y="386.0" font-size="14" font-weight="400" fill="#2b2a27">1. 前善对后无记</text>
<line x1="876.7" y1="430.8" x2="1004.2" y2="430.8" stroke="#2f86c4" stroke-width="1.6" opacity=".8"/>
<text x="879.7" y="422.9" font-size="14" font-weight="400" fill="#2b2a27">2. 前不善对后无记</text>
<rect x="337.7" y="442.8" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#7a5cc4" stroke-width="2.2"/>
<text x="355.7" y="472.8" font-size="19" font-weight="700" fill="#2b2a27">五、所摄诸缘</text>
<rect x="337.7" y="519.9" width="302.0" height="73.3" rx="8" fill="#fff" stroke="#c2477e" stroke-width="2.2"/>
<text x="355.7" y="549.9" font-size="19" font-weight="700" fill="#2b2a27">六、灭尽定时与无想有情的无间</text>
<text x="355.7" y="575.6" font-size="19" font-weight="700" fill="#2b2a27">缘</text>
<line x1="685.7" y1="549.6" x2="958.6" y2="549.6" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="519.4" font-size="16" font-weight="500" fill="#2b2a27">1. 不来圣者、阿拉汉圣者入灭尽定，</text>
<text x="688.7" y="541.0" font-size="16" font-weight="500" fill="#2b2a27">心流会根据决意的时长而</text>
<line x1="685.7" y1="610.8" x2="958.6" y2="610.8" stroke="#c2477e" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="580.6" font-size="16" font-weight="500" fill="#2b2a27">2. 无想有情天的梵天人在整个生命期</text>
<text x="688.7" y="602.2" font-size="16" font-weight="500" fill="#2b2a27">间，心流中断 500 大劫</text>
<rect x="337.7" y="624.6" width="150.0" height="47.7" rx="8" fill="#fff" stroke="#2a9d9a" stroke-width="2.2"/>
<text x="355.7" y="654.6" font-size="19" font-weight="700" fill="#2b2a27">七、死生无间</text>
<line x1="533.7" y1="672.0" x2="806.6" y2="672.0" stroke="#2a9d9a" stroke-width="1.6" opacity=".8"/>
<text x="536.7" y="641.8" font-size="16" font-weight="500" fill="#2b2a27">(3)一个善业。当一个人已藉由观智亲</text>
<text x="536.7" y="663.4" font-size="16" font-weight="500" fill="#2b2a27">证缘起时，这种邪见将不攻自</text>
</svg>