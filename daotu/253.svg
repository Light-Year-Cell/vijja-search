<rect x="30" y="583.2" width="261.7" height="162.4" rx="14" fill="#3f8f5a"/>
<text x="48.0" y="620.2" font-size="26" font-weight="700" fill="#fff">第57讲-摄缘-十二</text>
<text x="48.0" y="655.3" font-size="26" font-weight="700" fill="#fff">缘起与二十四缘57-</text>
<text x="48.0" y="690.4" font-size="26" font-weight="700" fill="#fff">释二十四缘-有缘与</text>
<text x="48.0" y="725.5" font-size="26" font-weight="700" fill="#fff">不离去缘</text>
<rect x="337.7" y="359.7" width="207.0" height="47.7" rx="8" fill="#fff" stroke="#e05a47" stroke-width="2.2"/>
<text x="355.7" y="389.7" font-size="19" font-weight="700" fill="#2b2a27">一、有缘与不离去缘</text>
<line x1="590.7" y1="172.1" x2="724.7" y2="172.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="163.5" font-size="16" font-weight="500" fill="#2b2a27">（一）经文与释义</text>
<line x1="770.7" y1="54.9" x2="834.4" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1.缘广释</text>
<line x1="770.7" y1="91.8" x2="933.5" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">21. Atthipaccayoti —</text>
<line x1="770.7" y1="128.7" x2="918.4" y2="128.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="120.8" font-size="14" font-weight="400" fill="#2b2a27">2.五种有缘与不离去缘</text>
<line x1="770.7" y1="184.5" x2="1030.4" y2="184.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="157.7" font-size="14" font-weight="400" fill="#2b2a27">1.所缘前生，这是经文第三段的内容，与</text>
<text x="773.7" y="176.6" font-size="14" font-weight="400" fill="#2b2a27">所缘缘和前生缘有关</text>
<line x1="770.7" y1="240.3" x2="1032.0" y2="240.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="213.5" font-size="14" font-weight="400" fill="#2b2a27">2.依处前生， 这是经文第二、 四段的内</text>
<text x="773.7" y="232.4" font-size="14" font-weight="400" fill="#2b2a27">容， 与依止缘和前生缘有</text>
<line x1="770.7" y1="296.1" x2="1030.4" y2="296.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="773.7" y="269.3" font-size="14" font-weight="400" fill="#2b2a27">3.依处所缘前生，这也属于经文第四段的</text>
<text x="773.7" y="288.2" font-size="14" font-weight="400" fill="#2b2a27">内容</text>
<line x1="590.7" y1="335.7" x2="806.6" y2="335.7" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="327.1" font-size="16" font-weight="500" fill="#2b2a27">(一)俱生有缘与俱生不离去缘</text>
<line x1="590.7" y1="410.9" x2="806.6" y2="410.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="402.3" font-size="16" font-weight="500" fill="#2b2a27">(二)前生有缘与前生不离去缘</text>
<line x1="852.6" y1="372.6" x2="930.3" y2="372.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="855.6" y="364.7" font-size="14" font-weight="400" fill="#2b2a27">1.所缘前生</text>
<line x1="852.6" y1="409.5" x2="930.3" y2="409.5" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="855.6" y="401.6" font-size="14" font-weight="400" fill="#2b2a27">2.依处前生</text>
<line x1="852.6" y1="446.4" x2="958.3" y2="446.4" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="855.6" y="438.5" font-size="14" font-weight="400" fill="#2b2a27">3.依处所缘前生</text>
<line x1="590.7" y1="486.0" x2="806.6" y2="486.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="477.4" font-size="16" font-weight="500" fill="#2b2a27">(三)后生有缘与后生不离去缘</text>
<line x1="590.7" y1="525.6" x2="806.6" y2="525.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="517.0" font-size="16" font-weight="500" fill="#2b2a27">(四)色食有缘与色食不离去缘</text>
<line x1="590.7" y1="565.2" x2="838.6" y2="565.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="556.6" font-size="16" font-weight="500" fill="#2b2a27">(五)色命根有缘与色命根不离去缘</text>
<line x1="590.7" y1="620.6" x2="708.7" y2="620.6" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="593.7" y="612.0" font-size="16" font-weight="500" fill="#2b2a27">（二）经文详释</text>
<line x1="754.7" y1="619.2" x2="930.4" y2="619.2" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="757.7" y="611.3" font-size="14" font-weight="400" fill="#2b2a27">1.俱生有缘与俱生不离去缘</text>
<line x1="976.4" y1="600.8" x2="1080.6" y2="600.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="979.4" y="593.2" font-size="13" font-weight="400" fill="#2b2a27">（1）四种非色蕴</text>
<line x1="976.4" y1="636.3" x2="1054.6" y2="636.3" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="979.4" y="628.8" font-size="13" font-weight="400" fill="#2b2a27">（2）四大种</text>
<rect x="337.7" y="895.8" width="302.0" height="99.0" rx="8" fill="#fff" stroke="#e39a2d" stroke-width="2.2"/>
<text x="355.7" y="925.8" font-size="19" font-weight="700" fill="#2b2a27">一、二对二的方式，以有缘/不</text>
<text x="355.7" y="951.4" font-size="19" font-weight="700" fill="#2b2a27">离去缘的缘力缘助对方与自己同</text>
<text x="355.7" y="977.1" font-size="19" font-weight="700" fill="#2b2a27">时生</text>
<line x1="685.7" y1="675.9" x2="844.6" y2="675.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="667.3" font-size="16" font-weight="500" fill="#2b2a27">（3）入胎刹那的名色</text>
<line x1="685.7" y1="715.5" x2="908.6" y2="715.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="706.9" font-size="16" font-weight="500" fill="#2b2a27">（4）诸心、心所法对俱生诸色</text>
<line x1="685.7" y1="755.1" x2="844.6" y2="755.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="746.5" font-size="16" font-weight="500" fill="#2b2a27">（5）大种对诸所造色</text>
<line x1="685.7" y1="997.7" x2="885.6" y2="997.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="989.1" font-size="16" font-weight="500" fill="#2b2a27">2.前生有缘与前生不离去缘</text>
<line x1="931.6" y1="792.0" x2="1029.4" y2="792.0" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="934.6" y="784.1" font-size="14" font-weight="400" fill="#2b2a27">（1）所缘前生</text>
<line x1="931.6" y1="828.9" x2="1029.4" y2="828.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="934.6" y="821.0" font-size="14" font-weight="400" fill="#2b2a27">（2）依处前生</text>
<line x1="931.6" y1="884.7" x2="1199.1" y2="884.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="934.6" y="857.9" font-size="14" font-weight="400" fill="#2b2a27">(1)生命期间所有七十五种名聚生起的前一</text>
<text x="934.6" y="876.8" font-size="14" font-weight="400" fill="#2b2a27">个心识刹那(包括结</text>
<line x1="931.6" y1="940.5" x2="1199.1" y2="940.5" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="934.6" y="913.7" font-size="14" font-weight="400" fill="#2b2a27">(2)当一位三果圣者或包括佛陀、独觉佛在</text>
<text x="934.6" y="932.6" font-size="14" font-weight="400" fill="#2b2a27">内的阿拉汉圣者从灭</text>
<line x1="931.6" y1="996.3" x2="1199.1" y2="996.3" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="934.6" y="969.5" font-size="14" font-weight="400" fill="#2b2a27">(3)临死时，死心灭去之前第十七个心识刹</text>
<text x="934.6" y="988.4" font-size="14" font-weight="400" fill="#2b2a27">那的生时所生起的一</text>
<line x1="931.6" y1="1052.1" x2="1193.0" y2="1052.1" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="934.6" y="1025.3" font-size="14" font-weight="400" fill="#2b2a27">(1)在五蕴地，前一个心识刹那(包括结生</text>
<text x="934.6" y="1044.2" font-size="14" font-weight="400" fill="#2b2a27">刹那)生起的心处色</text>
<line x1="931.6" y1="1107.9" x2="1199.1" y2="1107.9" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="934.6" y="1081.1" font-size="14" font-weight="400" fill="#2b2a27">(2)三果圣者和阿拉汉圣者从灭尽定出定之</text>
<text x="934.6" y="1100.0" font-size="14" font-weight="400" fill="#2b2a27">后，在他灭尽定出定</text>
<line x1="931.6" y1="1163.7" x2="1199.1" y2="1163.7" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="934.6" y="1136.9" font-size="14" font-weight="400" fill="#2b2a27">(3)在五蕴地生命临死时，死心灭去之前第</text>
<text x="934.6" y="1155.8" font-size="14" font-weight="400" fill="#2b2a27">十七个心识刹那的生</text>
<line x1="931.6" y1="1200.6" x2="1057.4" y2="1200.6" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="934.6" y="1192.7" font-size="14" font-weight="400" fill="#2b2a27">（3）依处所缘前生</text>
<line x1="685.7" y1="1240.2" x2="885.6" y2="1240.2" stroke="#e39a2d" stroke-width="1.6" opacity=".8"/>
<text x="688.7" y="1231.6" font-size="16" font-weight="500" fill="#2b2a27">3.后生有缘与后生不离去缘</text>
