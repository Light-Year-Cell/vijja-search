<text x="355.7" y="200.6" font-size="19" font-weight="700" fill="#2b2a27">一、相互缘经文与释义</text>
<line x1="609.7" y1="123.8" x2="743.7" y2="123.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="612.7" y="115.2" font-size="16" font-weight="500" fill="#2b2a27">（一）经文与释义</text>
<line x1="789.7" y1="54.9" x2="965.4" y2="54.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="792.7" y="47.0" font-size="14" font-weight="400" fill="#2b2a27">1.四种非色蕴以相互缘为缘</text>
<line x1="789.7" y1="91.8" x2="937.4" y2="91.8" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="792.7" y="83.9" font-size="14" font-weight="400" fill="#2b2a27">2.四大种以相互缘为缘</text>
<line x1="789.7" y1="189.9" x2="993.4" y2="189.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="792.7" y="182.0" font-size="14" font-weight="400" fill="#2b2a27">3.入生刹那的名色以相互缘为缘</text>
<line x1="1039.4" y1="144.9" x2="1288.2" y2="144.9" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1042.4" y="119.8" font-size="13" font-weight="400" fill="#2b2a27">(1)同一名聚里的名法与其余名法彼此互以</text>
<text x="1042.4" y="137.4" font-size="13" font-weight="400" fill="#2b2a27">“相互的缘力”缘助</text>
<line x1="1039.4" y1="198.0" x2="1288.2" y2="198.0" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1042.4" y="172.9" font-size="13" font-weight="400" fill="#2b2a27">(2)同一色聚里的四大之任一二三大与其余</text>
<text x="1042.4" y="190.5" font-size="13" font-weight="400" fill="#2b2a27">四大彼此互以“相互</text>
<line x1="1039.4" y1="251.1" x2="1288.2" y2="251.1" stroke="#e05a47" stroke-width="1.6" opacity=".8"/>
<text x="1042.4" y="226.0" font-size="13" font-weight="400" fill="#2b2a27">(3)结生的生时小刹那，结生名聚与俱生心</text>
<text x="1042.4" y="243.6" font-size="13" font-weight="400" fill="#2b2a27">处色彼此互以“相互</text>
