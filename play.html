<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>播放录音</title>
<style>
:root{--bg:#f7f5f0;--card:#fffdf8;--ink:#2b2a27;--muted:#77736a;--line:#e4dfd4;--accent:#8a5a2b}
@media (prefers-color-scheme: dark){:root{--bg:#1b1a18;--card:#252320;--ink:#ebe7df;--muted:#a39d91;--line:#3a3732;--accent:#d9a46a}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,"PingFang SC","Noto Sans SC",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:40px 16px}
h1{font-size:19px;margin:0 0 6px}
.t{color:var(--muted);font-size:14px;margin-bottom:28px}
#go{display:block;width:100%;font-size:20px;padding:18px;border:0;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer}
audio{width:100%;margin-top:22px}
.note{font-size:12px;color:var(--muted);margin-top:24px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h"></h1>
  <div class="t" id="t"></div>
  <button id="go">▶ 从这里开始播放</button>
  <audio id="a" controls preload="none"></audio>
  <div class="note">录音来自快乐念住平台，在线播放需联网。<a href="./">← 网站首页</a></div>
</div>
<script>
const q = new URLSearchParams(location.search), u = q.get("u") || "", t = +q.get("t") || 0;
const fmt = t => { t = Math.round(t); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
document.getElementById("h").textContent = q.get("n") || "录音";
document.getElementById("t").textContent = `从 ${fmt(t)} 开始`;
document.title = (q.get("n") || "录音") + " · " + fmt(t);
const a = document.getElementById("a");
// 只放平台存储上的录音
const ok = /^https:\/\/elasticbeanstalk-ap-southeast-1-125221280074\.s3\.amazonaws\.com\//.test(u);
if (!ok) document.getElementById("go").disabled = true;
document.getElementById("go").onclick = () => {
  if (a.dataset.on) { a.currentTime = t; a.play(); return; }
  a.dataset.on = 1; a.src = u + "#t=" + t;
  a.addEventListener("loadedmetadata", () => { a.currentTime = t; a.play(); }, {once: true});
  a.load(); a.play().catch(() => {});
};
</script>
</body>
</html>
